name: Client tests

# Runs the client-side test harnesses (and a server-JS syntax check) on every
# push / PR. Two harnesses, see test/client/README.md:
#   • run.js     — dependency-free pure-helper + parse-guard net (vm sandbox).
#   • run-dom.js — DOM-lifecycle tests in a real jsdom window (needs `npm ci`).
#
# This is the only automated check for the project (the Apps Script suite in
# web-app/Tests.js runs only inside the editor). It guards the client helpers,
# the render/escape + lifecycle layer, and catches gross syntax errors in
# Code.js / Tests.js.

on:
  push:
  pull_request:

jobs:
  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check server JS (Code.js / Tests.js)
        run: |
          node --check web-app/Code.js
          node --check web-app/Tests.js

      # Zero-dependency pure harness runs first (the always-on floor — green even
      # if the jsdom install ever fails).
      - name: Run client unit tests (pure)
        run: node test/client/run.js

      # DOM-lifecycle harness needs the jsdom dev dependency.
      - name: Install dev dependencies
        run: npm ci

      - name: Run client DOM-lifecycle tests
        run: node test/client/run-dom.js
