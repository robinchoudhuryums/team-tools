name: Client tests

# Runs the client-side test harnesses (and a server-JS syntax check) on every
# push / PR. Two harnesses, both loading the web-app HtmlService <script>
# partials — see test/client/README.md:
#   • run.js        — pure-helper unit tests + parse-guard net (Node vm sandbox,
#                     no deps).
#   • dom/runDom.js — DOM-lifecycle tests in a real jsdom window (shell-boot +
#                     controllable google.script.run); needs `npm ci` for jsdom.
#
# This is the only automated check for the project (the Apps Script suite in
# web-app/Tests.js runs only inside the editor). It guards the client helpers,
# the render/escape + lifecycle layer, and catches gross syntax errors in every
# server .js file.

on:
  push:
  pull_request:

jobs:
  client-tests:
    runs-on: ubuntu-latest
    env:
      # H3 (from the dashboard repo's ci.yml): pin the process timezone to the
      # manifest's so harness Date construction (new Date(y, m, d)) renders the
      # same calendar labels CI-side as production. The runner's UTC default
      # happened to be green; pinning makes "green" mean the same thing on
      # every machine, and a future TZ-sensitive pin cannot pass by accident.
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # F10 (cycle 12): the zero-dependency steps run BEFORE `npm ci`. They used
      # to sit after it, which contradicted the "always-on floor" comment below
      # — a registry hiccup or a jsdom resolution failure failed the job without
      # ever running the only dependency-free checks, in a repo where this
      # workflow is the sole automated gate.
      # F1: a LOOP, not a list. The server is about to become many files
      # (Batch F2), and a hand-listed check would silently stop covering the
      # ones it does not name — on the very commit that creates them.
      - name: Syntax-check every server JS file
        run: |
          set -e
          shopt -s nullglob
          files=(web-app/*.js handbook-app/*.js)
          if [ ${#files[@]} -eq 0 ]; then echo "no web-app/*.js found"; exit 1; fi
          for f in "${files[@]}"; do echo "node --check $f"; node --check "$f"; done
        shell: bash

      # The always-on floor: no dependencies, so it is green even if the jsdom
      # install below ever fails.
      - name: Run pure-helper unit tests
        run: node test/client/run.js

      - name: Install dev dependencies (jsdom for the DOM harness)
        run: npm ci

      # g118: the undeclared-identifier net. `node --check` above parses each
      # server file; this RESOLVES every identifier against the one global
      # scope Apps Script actually loads them into, which is the only static
      # way to catch a name that reads fine and throws ReferenceError. It sits
      # after `npm ci` because it needs eslint. It is not part of the
      # dependency-free floor, so it must never be the only thing between a
      # broken server and prod — the floor above still runs first.
      - name: Resolve every server identifier (no-undef over the one global scope)
        run: node scripts/lint-server.mjs

      # HB1.2: handbook-app/ is a second Apps Script project whose server and
      # reader are COPIES of Team Tools' (scripts/handbook-sync.mjs). A change to
      # web-app/ that is not re-synced would ship the handbook app stale, so this
      # fails until `npm run handbook:sync` is run and committed. After `npm ci`:
      # the sync's dependency walk parses with acorn.
      # The floor above SKIPS (visibly) a pin that needs a package; here, with
      # the packages installed, REQUIRE_DEPS turns any such skip into a failure.
      - name: Re-run the pure tests with the dev dependencies (no skips allowed)
        run: REQUIRE_DEPS=1 node test/client/run.js

      - name: Check the handbook app's copies of Team Tools are current
        run: node scripts/handbook-sync.mjs --check

      - name: Run DOM-lifecycle tests
        run: node test/client/dom/runDom.js

      # Cycle 25 F29 + F65: the handbook's Python build. It never ran here, so a
      # broken [[§…]] cross-reference (build.py fails on it) reached a commit
      # green, and the M3-D1 pin hashes only the generated SVGs — an edited
      # diagram generator or export transform with stale output passed. This runs
      # the browser-free half of manual/make_all.sh (no Playwright, no
      # LibreOffice, no Word render) and then fails if regenerating changed a
      # committed diagram or the diagram partial the app ships.
      - name: Set up Python (handbook build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the handbook (no browser) and check its generated files are current
        run: |
          set -e
          python -m pip install "markdown==3.7" "beautifulsoup4==4.15.0"
          cd manual
          python roles.py && python footnotes.py
          python make_diagrams.py && python make_flow_diagrams.py
          rm -f out/*.md
          python build.py
          python make_html.py out/Policies-and-Procedures-Handbook-v3.0.md "$RUNNER_TEMP/handbook.html"
          python validate_html.py "$RUNNER_TEMP/handbook.html"
          python feedback_report.py --check   # cycle 25 E3: the feedback worklist's self-test
          python quizzes.py --check           # HB3.1: the question bank's check, self-tested
          MANUAL_OUT="$RUNNER_TEMP/manual-dist" python export_reference.py
          cd ..
          git diff --exit-code -- manual/diagrams web-app/kb/script_manual_diagrams.html
        shell: bash

      # Batch C: the generated counts block in CLAUDE.md must equal what the
      # tree derives. This runs LAST because it re-runs both harnesses to read
      # their own summary lines — a static count cannot equal either total
      # (tests registered in loops), and run.js's own pins cannot ask for them
      # without spawning the harness that is asking.
      - name: Check the generated counts block
        run: node scripts/counts.mjs --check

      # Cycle 25 E5 (ST5): PROJECT_HEALTH's standing and Score History are
      # DERIVED from .cycle/metrics.csv and STATE.md's Cycle line, and a
      # reflected cycle's STATE block must have moved to HISTORY.md once a later
      # cycle opens. The standing named cycle 21 for four cycles (F26) because
      # nothing compared it with anything. Zero dependencies.
      - name: Check the cycle close-out (standing, Score History, HISTORY)
        run: node scripts/cycle-closeout.mjs --check

  # Cycle 25 E5 (ST4): the visual matrix's measurements, in CI. shoot.mjs reports
  # sideways overflow, a page taller than its content, a text column narrower
  # than a word, RPCs with no fixture and uncaught page errors — but the matrix
  # was manual, so a measurement helped only when someone ran it. This shoots a
  # fast subset (test/visual/ci-gate.cjs) in headless Chromium and fails on any
  # of them. Its own job, so a browser-install hiccup never hides the harness
  # results above, and the shots ride an artifact when it fails.
  visual-layout:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and its Chromium
        working-directory: test/visual
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Shoot the CI subset and gate on the layout measurements
        working-directory: test/visual
        run: |
          node build.mjs
          node shoot.mjs --ci

      # HB2.4: axe-core (pinned in test/visual/package.json) over every handbook
      # scenario, WCAG 2.1 A + AA; any violation fails the job. `!cancelled()`
      # so a layout failure above never hides an accessibility one.
      - name: Check every handbook screen with axe (WCAG 2.1 A + AA)
        if: ${{ !cancelled() }}
        working-directory: test/visual
        run: node shoot.mjs --axe

      - name: Keep the shots and the report when the gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-layout
          path: |
            test/visual/report.json
            test/visual/axe-report.json
            test/visual/shots/
          retention-days: 7
