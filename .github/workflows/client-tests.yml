name: Client tests

# Runs the client-side test harnesses (and a server-JS syntax check) on every
# push / PR. Two harnesses, both loading the web-app HtmlService <script>
# partials — see test/client/README.md:
#   • run.js        — pure-helper unit tests + parse-guard net (Node vm sandbox,
#                     no deps).
#   • dom/runDom.js — DOM-lifecycle tests in a real jsdom window (shell-boot +
#                     controllable google.script.run); needs `npm ci` for jsdom.
#
# This is the only automated check for the project (the Apps Script suite in
# web-app/Tests.js runs only inside the editor). It guards the client helpers,
# the render/escape + lifecycle layer, and catches gross syntax errors in every
# server .js file.

on:
  push:
  pull_request:

jobs:
  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # F10 (cycle 12): the zero-dependency steps run BEFORE `npm ci`. They used
      # to sit after it, which contradicted the "always-on floor" comment below
      # — a registry hiccup or a jsdom resolution failure failed the job without
      # ever running the only dependency-free checks, in a repo where this
      # workflow is the sole automated gate.
      # F1: a LOOP, not a list. The server is about to become many files
      # (Batch F2), and a hand-listed check would silently stop covering the
      # ones it does not name — on the very commit that creates them.
      - name: Syntax-check every server JS file
        run: |
          set -e
          shopt -s nullglob
          files=(web-app/*.js)
          if [ ${#files[@]} -eq 0 ]; then echo "no web-app/*.js found"; exit 1; fi
          for f in "${files[@]}"; do echo "node --check $f"; node --check "$f"; done
        shell: bash

      # The always-on floor: no dependencies, so it is green even if the jsdom
      # install below ever fails.
      - name: Run pure-helper unit tests
        run: node test/client/run.js

      - name: Install dev dependencies (jsdom for the DOM harness)
        run: npm ci

      - name: Run DOM-lifecycle tests
        run: node test/client/dom/runDom.js

      # Batch C: the generated counts block in CLAUDE.md must equal what the
      # tree derives. This runs LAST because it re-runs both harnesses to read
      # their own summary lines — a static count cannot equal either total
      # (tests registered in loops), and run.js's own pins cannot ask for them
      # without spawning the harness that is asking.
      - name: Check the generated counts block
        run: node scripts/counts.mjs --check
