<svg viewBox="0 0 1160 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Patient death call"><defs><marker id="mkm8adea" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-so{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--bg);opacity:.88}
  .dg-seco{font:700 10px 'IBM Plex Sans',sans-serif;fill:var(--bg);text-decoration:underline}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkm8adea)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkm8adea)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">When a patient has died</text><rect x="400" y="38" width="360" height="38" rx="5" fill="var(--navy)" stroke="var(--navy)" stroke-width="1.4"/><text x="580.0" y="61.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)">A family member calls: the patient has died</text><path class="dg-arr" d="M580 76 L580 98"/><rect x="400" y="98" width="360" height="44" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="580.0" y="124.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Express condolences. Note the date of death</text><path class="dg-arr" d="M580 142 L580 166"/><rect x="400" y="166" width="360" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="192.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">For each item — is it patient-owned?</text><path class="dg-arr" d="M580 210 V230 H285 V250"/><text x="296" y="244" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><path class="dg-arr" d="M580 210 V230 H875 V250"/><text x="886" y="244" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="80" y="250" width="410" height="62" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="285.0" y="269.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">It belongs to the family now</text><text x="285.0" y="285.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Theirs to keep, donate or dispose of.</text><text x="285.0" y="301.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Nothing to collect</text><rect x="670" y="250" width="410" height="62" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="875.0" y="269.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Create a pick-up ticket</text><text x="875.0" y="285.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Confirm best contact and pick-up address. Field</text><text x="875.0" y="301.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Ops will verify and call back in 24–48 hours</text><rect x="80" y="330" width="410" height="44" rx="5" fill="var(--pol-bg)" stroke="var(--pol-ink)" stroke-width="1.4"/><text x="285.0" y="348.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--pol-ink)">Oxygen is never patient-owned — a</text><text x="285.0" y="364.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--pol-ink)">concentrator always comes back</text><rect x="670" y="330" width="410" height="44" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="875.0" y="348.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Would they rather pay the remaining cost</text><text x="875.0" y="364.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">and keep the items? Transfer to Billing</text></svg>