  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">Rental, ownership and the 5-year lifetime</text><line x1="190" y1="70" x2="1120" y2="70" stroke="var(--rule)" stroke-width="1.5"/><line x1="190.0" y1="62" x2="190.0" y2="390" stroke="var(--rule)" stroke-dasharray="0"/><text x="190.0" y="54" text-anchor="middle" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">Delivery</text><line x1="391.5" y1="62" x2="391.5" y2="390" stroke="var(--rule)" stroke-dasharray="3 4"/><text x="391.5" y="54" text-anchor="middle" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">Month 13</text><line x1="748.0" y1="62" x2="748.0" y2="390" stroke="var(--rule)" stroke-dasharray="3 4"/><text x="748.0" y="54" text-anchor="middle" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">Month 36</text><line x1="1120.0" y1="62" x2="1120.0" y2="390" stroke="var(--rule)" stroke-dasharray="0"/><text x="1120.0" y="54" text-anchor="middle" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">5 years</text><text x="20" y="116" style="font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Capped rental</text><text x="20" y="132" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--muted)">most DME</text><rect x="190.0" y="96" width="199.5" height="46" rx="4" fill="var(--tint)" stroke="var(--accent)" stroke-width="1.2"/><text x="290.75" y="116.0" text-anchor="middle" style="font:700 11.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">Rented — 13 months</text><text x="290.75" y="130.0" text-anchor="middle" style="font:500 11.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">UMS owns and repairs it</text><rect x="391.5" y="96" width="726.5" height="46" rx="4" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.2"/><text x="755.75" y="116.0" text-anchor="middle" style="font:700 11.5px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Patient owns it</text><text x="755.75" y="130.0" text-anchor="middle" style="font:500 11.5px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Medicare covers repairs, with cost-sharing</text><text x="20" y="216" style="font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Oxygen</text><text x="20" y="232" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--muted)">concentrators, cylinders</text><rect x="190.0" y="196" width="556.0" height="46" rx="4" fill="var(--tint)" stroke="var(--accent)" stroke-width="1.2"/><text x="469.0" y="216.0" text-anchor="middle" style="font:700 11.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">Rented — 36 months</text><text x="469.0" y="230.0" text-anchor="middle" style="font:500 11.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">UMS owns and services it</text><rect x="748.0" y="196" width="370.0" height="46" rx="4" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.2"/><text x="934.0" y="216.0" text-anchor="middle" style="font:700 11.5px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">No rental charge — UMS still owns it</text><text x="934.0" y="230.0" text-anchor="middle" style="font:500 11.5px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Servicing continues; fee every 6 months</text><text x="1116.0" y="260" text-anchor="end" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--muted)">After 5 years: a new 36-month rental may begin</text><text x="20" y="316" style="font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Continuous rental</text><text x="20" y="332" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--muted)">ventilators, E0471</text><rect x="190.0" y="296" width="928.0" height="46" rx="4" fill="var(--pol-bg)" stroke="var(--pol-ink)" stroke-width="1.2"/><text x="655.0" y="323.0" text-anchor="middle" style="font:700 11.5px 'IBM Plex Sans',sans-serif;fill:var(--pol-ink)">Rented monthly for as long as it's needed — never owned</text><rect x="20" y="400" width="1120" height="48" rx="5" fill="var(--pol-bg)" stroke="var(--pol-ink)" stroke-width="1.4"/><text x="580.0" y="420.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--pol-ink)">The patient never owns oxygen equipment</text><text x="580.0" y="436.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--pol-ink)">Say: "Medicare pays for the rental for 36 months. After that you keep using it at no rental charge and we keep servicing it, for up to 5 years total."</text></svg>