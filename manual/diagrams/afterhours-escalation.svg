<svg viewBox="0 0 1160 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="After-hours escalation chain"><defs><marker id="mkm2besc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-so{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--bg);opacity:.88}
  .dg-seco{font:700 10px 'IBM Plex Sans',sans-serif;fill:var(--bg);text-decoration:underline}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkm2besc)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkm2besc)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">After hours — when the on-call doesn't answer</text><rect x="60" y="62" width="220" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="170.0" y="85.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">1. Call the on-call</text><text x="170.0" y="101.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">technician or RT</text><path class="dg-arr" d="M170.0 116 L170.0 156"/><text x="178.0" y="140" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">immediately</text><rect x="80" y="156" width="180" height="36" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="170.0" y="178.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Responded?</text><path class="dg-arr" d="M170.0 192 L170.0 222"/><text x="176.0" y="203.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="80" y="222" width="180" height="32" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="170.0" y="242.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Dispatch</text><path class="dg-arr" d="M260 174 H312 V89 H330"/><text x="268" y="168" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="330" y="62" width="220" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="440.0" y="93.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">2. Send a text</text><path class="dg-arr" d="M440.0 116 L440.0 156"/><text x="448.0" y="140" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">wait 30 min</text><rect x="350" y="156" width="180" height="36" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="440.0" y="178.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Responded?</text><path class="dg-arr" d="M440.0 192 L440.0 222"/><text x="446.0" y="203.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="350" y="222" width="180" height="32" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="440.0" y="242.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Dispatch</text><path class="dg-arr" d="M530 174 H582 V89 H600"/><text x="538" y="168" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="600" y="62" width="220" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="710.0" y="77.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">3. Call and text</text><text x="710.0" y="93.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Level 1 backup</text><text x="710.0" y="109.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">(RT call: the other RT)</text><path class="dg-arr" d="M710.0 116 L710.0 156"/><text x="718.0" y="140" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">wait 30 min</text><rect x="620" y="156" width="180" height="36" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="710.0" y="178.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Responded?</text><path class="dg-arr" d="M710.0 192 L710.0 222"/><text x="716.0" y="203.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="620" y="222" width="180" height="32" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="710.0" y="242.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Dispatch</text><path class="dg-arr" d="M800 174 H852 V89 H870"/><text x="808" y="168" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="870" y="62" width="220" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="980.0" y="85.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">4. Call Level 2 backup,</text><text x="980.0" y="101.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">if one is listed</text><path class="dg-arr" d="M980.0 116 L980.0 156"/><text x="988.0" y="140" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">wait 30 min</text><rect x="890" y="156" width="180" height="36" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="980.0" y="178.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Responded?</text><path class="dg-arr" d="M980.0 192 L980.0 222"/><text x="986.0" y="203.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="890" y="222" width="180" height="32" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="980.0" y="242.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Dispatch</text><path class="dg-arr" d="M1070 174 H1130 V300 H30 V89 H60"/><text x="1078" y="168" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="410" y="284" width="340" height="32" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="580.0" y="304.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">No one responded — repeat from step 1</text><rect x="30" y="350" width="540" height="80" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="300.0" y="370.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Throughout the wait</text><text x="300.0" y="386.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Confirm the patient has a working backup.</text><text x="300.0" y="402.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Tell the caller you're reaching on-call staff; call back</text><text x="300.0" y="418.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">with updates even when there's no news</text><rect x="590" y="350" width="540" height="80" rx="5" fill="var(--crit-bg)" stroke="var(--crit-ink)" stroke-width="2"/><text x="860.0" y="378.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--crit-ink)">If distress develops at any point</text><text x="860.0" y="394.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--crit-ink)">Tell them to dial 9-1-1 first — the dispatch attempt continues</text><text x="860.0" y="410.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--crit-ink)">afterward. Never contact off-schedule staff to fill the gap — <a class="xr" href="#8-4">8.4</a></text></svg>