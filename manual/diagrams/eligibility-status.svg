</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">Power orders in Sales — the Eligibility status</text><polygon points="30,70 222,70 238,100 222,130 30,130 30,100" fill="var(--tint)" stroke="var(--navy)" stroke-width="1.4"/><text x="134.0" y="93" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Pending</text><text x="134.0" y="108" text-anchor="middle" style="font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">(Appoint. Req.)</text><rect x="34" y="148" width="196" height="70" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="132.0" y="171.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">An appointment is</text><text x="132.0" y="187.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">needed. Nothing</text><text x="132.0" y="203.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">arranged yet</text><polygon points="254,70 446,70 462,100 446,130 254,130 270,100" fill="var(--tint)" stroke="var(--navy)" stroke-width="1.4"/><text x="358.0" y="93" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Pending</text><text x="358.0" y="108" text-anchor="middle" style="font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">(Appt. Sched.)</text><rect x="258" y="148" width="196" height="70" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="356.0" y="171.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Being scheduled —</text><text x="356.0" y="187.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">by the patient or</text><text x="356.0" y="203.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">by Sales</text><polygon points="478,70 670,70 686,100 670,130 478,130 494,100" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="582.0" y="93" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Pending</text><text x="582.0" y="108" text-anchor="middle" style="font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">(Appoint. Verification)</text><rect x="482" y="148" width="196" height="70" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="580.0" y="171.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">A date exists but</text><text x="580.0" y="187.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">isn't confirmed by</text><text x="580.0" y="203.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">both sides yet</text><polygon points="702,70 894,70 910,100 894,130 702,130 718,100" fill="var(--tint)" stroke="var(--navy)" stroke-width="1.4"/><text x="806.0" y="93" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Pending</text><text x="806.0" y="108" text-anchor="middle" style="font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">(Payer Verification)</text><rect x="706" y="148" width="196" height="70" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="804.0" y="171.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Sales Eligibility is</text><text x="804.0" y="187.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">checking the</text><text x="804.0" y="203.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">insurance</text><polygon points="926,70 1118,70 1134,100 1118,130 926,130 942,100" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="1030.0" y="93" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Eligible</text><rect x="930" y="148" width="196" height="70" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="1028.0" y="171.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Sales is done — the</text><text x="1028.0" y="187.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">order is now with</text><text x="1028.0" y="203.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Power. See <a class="xr" href="#5-1">5.1</a></text><rect x="30" y="236" width="656" height="26" rx="3" fill="var(--panel)" stroke="var(--rule)"/><text x="358.0" y="253" text-anchor="middle" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">WITH SALES — route calls to Sales</text><rect x="702" y="236" width="208" height="26" rx="3" fill="var(--panel)" stroke="var(--rule)"/><text x="806.0" y="253" text-anchor="middle" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">SALES ELIGIBILITY</text><rect x="926" y="236" width="208" height="26" rx="3" fill="var(--scr-bg)" stroke="var(--scr-ink)"/><text x="1030.0" y="253" text-anchor="middle" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted);fill:var(--scr-ink)">WITH POWER</text><text x="580.0" y="300" text-anchor="middle" class="dg-s">Only Appoint. Verification has a date — and it isn't confirmed yet, so don't give it out as settled.  Eligibility can return here if insurance changes.</text></svg>