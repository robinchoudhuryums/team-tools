ty Eval</text><text class="dg-t" x="342" y="235">appointment</text><text class="dg-so" x="342" y="256">Verified both sides</text><text class="dg-seco" x="342" y="268"><a class="xr" href="#4-2">4.2</a></text><rect class="dg-box" x="332" y="292" width="148" height="72" fill="var(--p4)" stroke="var(--p4)"/><text class="dg-t" x="342" y="311">Eligibility</text><text class="dg-so" x="342" y="346">Payer verification</text><text class="dg-seco" x="342" y="358"><a class="xr" href="#4-4">4.4</a></text><path class="dg-arr" d="M406 274 V292"/><path class="dg-arr" d="M480 328 H484 V238 H494"/><rect class="dg-box" x="494" y="202" width="108" height="72" fill="var(--p5)" stroke="var(--p5)"/><text class="dg-t" x="504" y="221">PAK</text><text class="dg-so" x="504" y="256">Paperwork sent</text><text class="dg-seco" x="504" y="268"><a class="xr" href="#5-2">5.2</a></text><path class="dg-arr" d="M602 238 H612"/><rect class="dg-box" x="612" y="202" width="108" height="72" fill="var(--p5)" stroke="var(--p5)"/><text class="dg-t" x="622" y="221">Qualifications</text><text class="dg-so" x="622" y="256">Docs reviewed</text><text class="dg-seco" x="622" y="268"><a class="xr" href="#5-3">5.3</a></text><path class="dg-arr" d="M720 238 H730"/><rect class="dg-box" x="730" y="202" width="108" height="72" fill="var(--p5)" stroke="var(--p5)"/><text class="dg-t" x="740" y="221">PT / ATP</text><text class="dg-so" x="740" y="256">Where required</text><text class="dg-seco" x="740" y="268"><a class="xr" href="#5-4">5.4</a></text><path class="dg-arr" d="M838 238 H848"/><rect class="dg-box" x="848" y="202" width="108" height="72" fill="var(--p5)" stroke="var(--p5)"/><text class="dg-t" x="858" y="221">PAR</text><text class="dg-so" x="858" y="256">Sent to insurance</text><text class="dg-seco" x="858" y="268"><a class="xr" href="#5-6">5.6</a></text><rect class="dg-box" x="848" y="292" width="108" height="72" fill="var(--p5)" stroke="var(--p5)"/><text class="dg-t" x="858" y="311">Order</text><text class="dg-t"