<svg viewBox="0 0 1160 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status update decision tree"><defs><marker id="mkm1stat" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkm1stat)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkm1stat)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">Status update — where is the order?</text><rect x="410" y="38" width="340" height="38" rx="5" fill="var(--navy)" stroke="var(--navy)" stroke-width="1.4"/><text x="580.0" y="61.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)">Caller asks where their order is</text><path class="dg-arr" d="M580 76 L580 100"/><rect x="410" y="100" width="340" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="126.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Found the patient by name and DOB?</text><path class="dg-arr" d="M410 122 L330 122"/><text x="374" y="115" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="40" y="100" width="290" height="44" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="185.0" y="126.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Search the caller's phone number</text><path class="dg-arr" d="M185 144 L185 170"/><rect x="60" y="170" width="250" height="40" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="185.0" y="194.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Found a lead?</text><path class="dg-arr" d="M185 210 L185 238"/><text x="191.0" y="220.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="40" y="238" width="290" height="62" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="185.0" y="257.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Sales is working with them</text><text x="185.0" y="273.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Route to the Sales team member in the</text><text x="185.0" y="289.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">lead notes, or the Sales Q — <a class="xr" href="#9-4">9.4</a></text><path class="dg-arr" d="M310 190 V190 H350 V238"/><text x="316" y="184" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><path class="dg-arr" d="M350 238 L350 322"/><rect x="40" y="322" width="330" height="76" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="205.0" y="340.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">No patient in the system</text><text x="205.0" y="356.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Likely not received, or too recent. Say we'll</text><text x="205.0" y="372.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">update once it exists. Provider calling?</text><text x="205.0" y="388.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Ask them to resend the referral</text><path class="dg-arr" d="M580 144 L580 238"/><text x="586.0" y="187.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="430" y="238" width="300" height="40" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="262.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">What does the order show?</text><rect x="800" y="232" width="340" height="52" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="970.0" y="254.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Power mobility order?</text><text x="970.0" y="270.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Also see the Power status diagram — <a class="xr" href="#4-1">4.1</a></text><path d="M730 258 H800" stroke="var(--rule)" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/><path class="dg-arr" d="M580 278 V420 H152 V440"/><rect x="20" y="440" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="152.0" y="458.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Received recently,</text><text x="152.0" y="474.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">no updates</text><path class="dg-arr" d="M152 484 L152 506"/><rect x="20" y="506" width="264" height="112" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="152.0" y="542.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Still in early review</text><text x="152.0" y="558.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Say it's under review, and that</text><text x="152.0" y="574.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">any documents are requested</text><text x="152.0" y="590.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">once verification completes</text><path class="dg-arr" d="M580 278 V420 H437 V440"/><rect x="305" y="440" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="437.0" y="458.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Additional documentation</text><text x="437.0" y="474.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">requested</text><path class="dg-arr" d="M437 484 L437 506"/><rect x="305" y="506" width="264" height="112" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="437.0" y="526.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Waiting on the provider</text><text x="437.0" y="542.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Transaction tab → Fax History.</text><text x="437.0" y="558.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Compare the latest request with</text><text x="437.0" y="574.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">what's been received and the</text><text x="437.0" y="590.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">most recent notes. Say what's</text><text x="437.0" y="606.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">outstanding</text><path class="dg-arr" d="M580 278 V420 H722 V440"/><rect x="590" y="440" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="722.0" y="458.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Pending</text><text x="722.0" y="474.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">authorization</text><path class="dg-arr" d="M722 484 L722 506"/><rect x="590" y="506" width="264" height="112" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="722.0" y="534.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Awaiting the insurer's decision</text><text x="722.0" y="550.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Say we're waiting on approval</text><text x="722.0" y="566.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">before delivery. Questions go to</text><text x="722.0" y="582.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">the intake team's authorization</text><text x="722.0" y="598.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">members — <a class="xr" href="#0-12_2">0.12.2</a></text><path class="dg-arr" d="M580 278 V420 H1007 V440"/><rect x="875" y="440" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="1007.0" y="458.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Needs to be</text><text x="1007.0" y="474.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">re-opened</text><path class="dg-arr" d="M1007 484 L1007 506"/><rect x="875" y="506" width="264" height="112" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="1007.0" y="542.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Needs review first</text><text x="1007.0" y="558.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">No transfer necessary. Email</text><text x="1007.0" y="574.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">the department who last worked</text><text x="1007.0" y="590.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">on or closed the order</text><text x="580.0" y="650" text-anchor="middle" class="dg-s">Documents go out by fax or through email or Parachute/SutureSign — a provider who "never got it" may be looking in the wrong place.</text></svg>