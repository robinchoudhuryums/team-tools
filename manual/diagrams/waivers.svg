<svg viewBox="0 0 1160 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Upgrade fee waiver decision"><defs><marker id="mkm7waiv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-so{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--bg);opacity:.88}
  .dg-seco{font:700 10px 'IBM Plex Sans',sans-serif;fill:var(--bg);text-decoration:underline}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkm7waiv)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkm7waiv)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">Does an upgrade fee waiver apply?</text><rect x="410" y="38" width="340" height="38" rx="5" fill="var(--navy)" stroke="var(--navy)" stroke-width="1.4"/><text x="580.0" y="61.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)">Order has an upgrade fee</text><path class="dg-arr" d="M580 76 L580 100"/><rect x="430" y="100" width="300" height="40" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="124.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Which upgrade?</text><path class="dg-arr" d="M580 140 V158 H250.0 V176"/><rect x="20" y="176" width="460" height="36" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="250.0" y="198.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Rollator — standard or heavy-duty</text><path class="dg-arr" d="M580 140 V158 H730.0 V176"/><rect x="500" y="176" width="460" height="36" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="730.0" y="198.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Bed — fully-electric or Hi-Lo</text><path class="dg-arr" d="M580 140 V158 H1060.0 V176"/><rect x="980" y="176" width="160" height="36" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="1060.0" y="198.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Patient lift</text><path class="dg-arr" d="M1060 212 L1060 222"/><rect x="980" y="222" width="160" height="58" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="1060.0" y="247.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Always charged</text><text x="1060.0" y="263.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">No rule waives it</text><path class="dg-arr" d="M250 212 L250 222"/><rect x="20" y="222" width="460" height="36" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="250.0" y="244.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">What coverage does the patient have?</text><path class="dg-arr" d="M250 258 V270 H92 V282"/><rect x="20" y="282" width="144" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="92.0" y="305.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Any Medicaid plan,</text><text x="92.0" y="321.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">except QMB-only</text><path class="dg-arr" d="M92 336 L92 352"/><rect x="20" y="352" width="144" height="58" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="92.0" y="369.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Waived — Rule A</text><text x="92.0" y="385.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Standard and</text><text x="92.0" y="401.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">heavy-duty</text><path class="dg-arr" d="M250 258 V270 H250 V282"/><rect x="178" y="282" width="144" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="250.0" y="313.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">QMB only</text><path class="dg-arr" d="M250 336 L250 352"/><rect x="178" y="352" width="144" height="58" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="250.0" y="369.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Standard: waived</text><text x="250.0" y="385.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Heavy-duty:</text><text x="250.0" y="401.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">charged</text><path class="dg-arr" d="M250 258 V270 H408 V282"/><rect x="336" y="282" width="144" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="408.0" y="313.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Neither</text><path class="dg-arr" d="M408 336 L408 352"/><rect x="336" y="352" width="144" height="58" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="408.0" y="385.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Charged</text><path class="dg-arr" d="M730 212 L730 222"/><rect x="500" y="222" width="460" height="36" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="730.0" y="244.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">What coverage does the patient have?</text><path class="dg-arr" d="M730 258 V270 H572 V282"/><rect x="500" y="282" width="144" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="572.0" y="297.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Full Medicaid or an</text><text x="572.0" y="313.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">MCO, in a state UMS</text><text x="572.0" y="329.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">is enrolled in</text><path class="dg-arr" d="M572 336 L572 352"/><rect x="500" y="352" width="144" height="58" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="572.0" y="385.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Waived — Rule B</text><path class="dg-arr" d="M730 258 V270 H730 V282"/><rect x="658" y="282" width="144" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="730.0" y="305.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">BCBS commercial</text><text x="730.0" y="321.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">is the primary</text><path class="dg-arr" d="M730 336 L730 352"/><rect x="658" y="352" width="144" height="58" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="730.0" y="385.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Waived — Rule C</text><path class="dg-arr" d="M730 258 V270 H888 V282"/><rect x="816" y="282" width="144" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="888.0" y="313.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Neither</text><path class="dg-arr" d="M888 336 L888 352"/><rect x="816" y="352" width="144" height="58" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="888.0" y="385.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Charged</text><rect x="20" y="424" width="460" height="34" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="250.0" y="445.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">CSRs can't waive or reduce a fee outside these rules — <a class="xr" href="#10-16">10.16</a></text><rect x="500" y="424" width="460" height="34" rx="5" fill="var(--pol-bg)" stroke="var(--pol-ink)" stroke-width="1.4"/><text x="730.0" y="445.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--pol-ink)">If unsure whether UMS is enrolled, check with Eligibility</text><rect x="20" y="470" width="1120" height="34" rx="5" fill="var(--pol-bg)" stroke="var(--pol-ink)" stroke-width="1.4"/><text x="580.0" y="491.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--pol-ink)">Uncommon payers — Workers' Compensation or the VA, for example, may pay for the item in full, including the upgrade fee</text></svg>