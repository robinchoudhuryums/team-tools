<svg viewBox="0 0 1160 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PMD pick-up decision"><defs><marker id="mkm3pick" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-so{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--bg);opacity:.88}
  .dg-seco{font:700 10px 'IBM Plex Sans',sans-serif;fill:var(--bg);text-decoration:underline}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkm3pick)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkm3pick)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">Caller asks us to pick up a power chair</text><rect x="410" y="40" width="340" height="38" rx="5" fill="var(--navy)" stroke="var(--navy)" stroke-width="1.4"/><text x="580.0" y="63.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)">Caller asks for a PMD pick-up</text><path class="dg-arr" d="M580 78 L580 102"/><rect x="410" y="102" width="340" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="128.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Why do they want it collected?</text><path class="dg-arr" d="M580 146 V164 H152 V184"/><rect x="20" y="184" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="152.0" y="202.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Uncomfortable, or sounds</text><text x="152.0" y="218.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">adjustable</text><path class="dg-arr" d="M152 228 L152 252"/><rect x="20" y="252" width="264" height="72" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="152.0" y="268.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Transfer to Service</text><text x="152.0" y="284.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">No pick-up ticket.</text><text x="152.0" y="300.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Fit problems are often</text><text x="152.0" y="316.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">adjustable</text><path class="dg-arr" d="M580 146 V164 H437 V184"/><rect x="305" y="184" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="437.0" y="210.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Technical fault</text><path class="dg-arr" d="M437 228 L437 252"/><rect x="305" y="252" width="264" height="72" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="437.0" y="284.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Repair, not pick-up</text><text x="437.0" y="300.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">No pick-up ticket</text><path class="dg-arr" d="M580 146 V164 H722 V184"/><rect x="590" y="184" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="722.0" y="210.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Can't afford it</text><path class="dg-arr" d="M722 228 L722 252"/><rect x="590" y="252" width="264" height="72" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="722.0" y="276.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Offer the EAA or a payment</text><text x="722.0" y="292.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">plan first — <a class="xr" href="#10-19_6">10.19.6</a></text><text x="722.0" y="308.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">(n/a for OOP orders)</text><path class="dg-arr" d="M580 146 V164 H1007 V184"/><rect x="875" y="184" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="1007.0" y="210.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">None of these</text><path class="dg-arr" d="M1007 228 L1007 252"/><rect x="875" y="252" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="1007.0" y="278.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Is it patient-owned?</text><path class="dg-arr" d="M960 296 L960 340"/><text x="966" y="322" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="870" y="340" width="180" height="62" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="960.0" y="359.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Can't be picked up —</text><text x="960.0" y="375.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">theirs to keep, donate</text><text x="960.0" y="391.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">or dispose — <a class="xr" href="#5-8_1">5.8.1</a></text><path class="dg-arr" d="M1090 296 L1090 420"/><text x="1096" y="362" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="870" y="420" width="270" height="40" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="1005.0" y="444.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Create the pick-up ticket — <a class="xr" href="#6-9_3">6.9.3</a></text><rect x="20" y="420" width="830" height="56" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="435.0" y="444.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">A pick-up may be irreversible</text><text x="435.0" y="460.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">A patient who surrenders a PMD may have difficulty getting another for five years under Same or Similar — <a class="xr" href="#10-12_5">10.12.5</a></text></svg>