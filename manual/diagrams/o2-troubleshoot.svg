<svg viewBox="0 0 1160 790" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oxygen concentrator troubleshooting flowchart"><defs><marker id="mkO" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-so{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--bg);opacity:.88}
  .dg-seco{font:700 10px 'IBM Plex Sans',sans-serif;fill:var(--bg);text-decoration:underline}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkO)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkO)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">Concentrator troubleshooting</text><rect x="430" y="36" width="300" height="40" rx="5" fill="var(--navy)" stroke="var(--navy)" stroke-width="1.4"/><text x="580.0" y="60.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)">Patient reports an oxygen issue</text><path class="dg-arr" d="M580.0 76 L580.0 104"/><rect x="430" y="104" width="300" height="58" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="129.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Is the patient in distress right now?</text><text x="580.0" y="145.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Short of breath, can't breathe</text><path class="dg-arr" d="M730 133 L790 133"/><text x="742" y="126" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="790" y="104" width="330" height="58" rx="5" fill="var(--crit-bg)" stroke="var(--crit-ink)" stroke-width="2"/><text x="955.0" y="129.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--crit-ink)">Hang up and dial 9-1-1</text><text x="955.0" y="145.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--crit-ink)">Stop troubleshooting — <a class="xr" href="#1-4_1">1.4.1</a></text><path class="dg-arr" d="M580.0 162 L580.0 196"/><text x="586.0" y="175.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="430" y="196" width="300" height="52" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="218.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Did we provide it, and is it</text><text x="580.0" y="234.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">actively billing?</text><path class="dg-arr" d="M730 222 L790 222"/><text x="742" y="215" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="790" y="200" width="330" height="44" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="955.0" y="218.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Ask them to call their</text><text x="955.0" y="234.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">actual provider</text><path class="dg-arr" d="M580.0 248 L580.0 282"/><text x="586.0" y="261.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="430" y="282" width="300" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="308.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Does the machine power up?</text><path class="dg-arr" d="M730 304 L790 304"/><text x="742" y="297" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="790" y="280" width="330" height="48" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="955.0" y="300.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Plug directly into a wall outlet —</text><text x="955.0" y="316.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">no extension cord. Try another outlet</text><path class="dg-arr" d="M955.0 328 L955.0 350"/><rect x="830" y="350" width="250" height="34" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="955.0" y="371.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Powers up now?</text><path class="dg-arr" d="M880 384 L880 412"/><text x="886" y="402" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><path class="dg-arr" d="M1030 384 L1030 412"/><text x="1036" y="402" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="790" y="412" width="150" height="40" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="865.0" y="436.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Outlet issue — resolved</text><rect x="970" y="412" width="150" height="40" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="1045.0" y="436.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Schedule a tech visit</text><path class="dg-arr" d="M580.0 326 L580.0 372"/><text x="586.0" y="345.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="430" y="372" width="300" height="52" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="394.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Alarm or red light</text><text x="580.0" y="410.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">after powering up?</text><path class="dg-arr" d="M430 398 L380 398"/><text x="396" y="391" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="40" y="366" width="340" height="64" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="210.0" y="386.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">A yellow light at startup is normal</text><text x="210.0" y="402.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">for about 15 minutes. If it persists,</text><text x="210.0" y="418.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">schedule service on a regular weekday</text><path class="dg-arr" d="M580.0 424 L580.0 462"/><text x="586.0" y="439.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="430" y="462" width="300" height="40" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="580.0" y="486.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Ask them to remove ALL tubing</text><path class="dg-arr" d="M580.0 502 L580.0 536"/><rect x="430" y="536" width="300" height="52" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="558.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Oxygen flow back to normal?</text><text x="580.0" y="574.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">No overheating?</text><path class="dg-arr" d="M430 562 L380 562"/><text x="392" y="555" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="40" y="536" width="340" height="52" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="210.0" y="558.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">No machine issue.</text><text x="210.0" y="574.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Ask them to replace the tubing</text><path class="dg-arr" d="M730 562 L790 562"/><text x="742" y="555" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="790" y="536" width="330" height="52" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="955.0" y="558.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Schedule a tech visit</text><text x="955.0" y="574.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">and create a service ticket</text><rect x="40" y="630" width="520" height="92" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="300.0" y="656.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Water in the tubing?</text><text x="300.0" y="672.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Usually an overfilled humidifier bottle. Ask them</text><text x="300.0" y="688.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">to keep water below the max line, then remove</text><text x="300.0" y="704.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">the bottle and test without it</text><rect x="600" y="630" width="520" height="92" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="860.0" y="656.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Humidifier bottles</text><text x="860.0" y="672.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">When ordering one, add humidifier adapter tubing.</text><text x="860.0" y="688.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Patients should keep at least one E cylinder</text><text x="860.0" y="704.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">at home for a power outage</text><text x="580.0" y="760" text-anchor="middle" class="dg-s">Troubleshoot only a patient who is stable and on a backup supply.</text></svg>