xt-anchor="middle" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--ink)">patient must be home; tech will</text><text x="1011.0" y="577.0" text-anchor="middle" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--ink)">educate and adjust as needed</text><path class="dg-arr" d="M1011 368 L1011 380"/><path class="dg-arr" d="M1011 404 L1011 416"/><path class="dg-arr" d="M1011 466 L1011 478"/><path class="dg-arr" d="M1011 518 L1011 530"/><path class="dg-arr" d="M860 572 H874 V336 H898"/><path d="M852 354 H898" stroke="var(--pol-ink)" stroke-width="1.6" stroke-dasharray="4 3" fill="none"/><text x="20" y="702" text-anchor="start" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">TYPICAL TIME</text><line x1="20" y1="720" x2="566" y2="720" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/><text x="293" y="742" text-anchor="middle" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--muted)">Sales, PAK and Qualifications vary — mostly on how quickly the provider returns correct paperwork</text><rect x="590" y="713" width="262" height="14" rx="3" fill="var(--accent)"/><text x="721" y="744" text-anchor="middle" style="font:700 11.5px 'IBM Plex Sans',sans-serif;fill:var(--navy)">PAR: 14 days or less</text><rect x="898" y="713" width="150" height="14" rx="3" fill="var(--accent)"/><text x="973" y="744" text-anchor="middle" style="font:700 11.5px 'IBM Plex Sans',sans-serif;fill:var(--navy)">2–3 weeks to warehouse</text><line x1="1054" y1="720" x2="1140" y2="720" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/><text x="580.0" y="778" text-anchor="middle" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--muted)">Dashed boxes happen only when the order needs them. With no PT or ATP eval, Qualifications moves straight to order verification.</text></svg>