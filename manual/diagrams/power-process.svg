:var(--ink)">needed; collect F2F</text><text x="681.0" y="168.0" text-anchor="middle" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--ink)">and PAK after visit</text><path class="dg-arr" d="M378 146 L400 146"/><path class="dg-arr" d="M560 132 H616"/><path class="dg-arr" d="M616 162 H560"/><text x="588" y="124" text-anchor="middle" style="font:600 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)">new appt</text><text x="588" y="178" text-anchor="middle" style="font:600 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)">confirmed</text><path class="dg-arr" d="M480 196 V254 H372 V326 H300 V366"/><rect x="490" y="205" width="150" height="25" rx="9" fill="var(--tint)" stroke="var(--accent)" stroke-width="1.2"/><text x="565.0" y="222" text-anchor="middle" style="font:700 10.5px 'IBM Plex Sans',sans-serif;fill:var(--navy)">F2F and PAK received</text><polygon points="300,366.0 388.0,420 300,474.0 212.0,420" fill="var(--tint)" stroke="var(--accent)" stroke-width="1.8"/><text x="300" y="419" text-anchor="middle" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Qualifications</text><text x="300" y="435" text-anchor="middle" style="font:600 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)">always</text><text x="218" y="494" text-anchor="start" style="font:600 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)">Reviews & requests documents</text><text x="218" y="507" text-anchor="start" style="font:600 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)">including:</text><rect x="218" y="517" width="10" height="10" rx="1.5" fill="none" stroke-width="1.4" stroke="var(--accent)"/><text x="234" y="526" text-anchor="start" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--ink)">M.E. F2F</text><rect x="218" y="533" width="10" height="10" rx="1.5" fill="none" stroke-width="1.4" stroke="var(--accent)"/><text x="234" y="542" text-anchor="start" style="font:500 11px 'IBM Plex Sans',sans-serif;fill:var(--ink)">SWO</text><rect x="218" y="549"