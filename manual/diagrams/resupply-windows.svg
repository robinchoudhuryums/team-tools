<svg viewBox="0 0 1160 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Resupply contact and shipping windows"><defs><marker id="mkm11res" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-so{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--bg);opacity:.88}
  .dg-seco{font:700 10px 'IBM Plex Sans',sans-serif;fill:var(--bg);text-decoration:underline}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkm11res)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkm11res)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">Resupply — why we can't send it early</text><rect x="120.0" y="84" width="56.470588235294116" height="40" rx="4" fill="var(--panel)" stroke="var(--rule)"/><rect x="176.47058823529412" y="84" width="564.7058823529411" height="40" fill="var(--scr-bg)" stroke="var(--scr-ink)"/><text x="458.8235294117647" y="109" text-anchor="middle" style="font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Patient can confirm the refill</text><rect x="741.1764705882352" y="84" width="282.3529411764706" height="40" fill="var(--scr-ink)" opacity=".88"/><text x="882.3529411764705" y="109" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)">Confirm and ship</text><line x1="176.47058823529412" y1="70" x2="176.47058823529412" y2="150" stroke="var(--navy)" stroke-width="1.5"/><text x="176.47058823529412" y="166" text-anchor="middle" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted);fill:var(--navy)">30 days before</text><text x="176.47058823529412" y="182" text-anchor="middle" class="dg-s">contact window opens</text><line x1="741.1764705882352" y1="70" x2="741.1764705882352" y2="150" stroke="var(--navy)" stroke-width="1.5"/><text x="741.1764705882352" y="166" text-anchor="middle" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted);fill:var(--navy)">10 days before</text><text x="741.1764705882352" y="182" text-anchor="middle" class="dg-s">earliest ship date</text><line x1="1023.5294117647059" y1="70" x2="1023.5294117647059" y2="150" stroke="var(--navy)" stroke-width="1.5"/><text x="1023.5294117647059" y="166" text-anchor="middle" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted);fill:var(--navy)">Supply runs out</text><text x="1023.5294117647059" y="182" text-anchor="middle" class="dg-s">next supply due</text><text x="733.1764705882352" y="62" text-anchor="end" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">Shipping before this line makes the claim non-payable →</text><text x="882.3529411764706" y="62" text-anchor="middle" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted);fill:var(--scr-ink)">SHIP DATE = DATE OF SERVICE</text><rect x="40" y="206" width="350" height="66" rx="5" fill="var(--pol-bg)" stroke="var(--pol-ink)" stroke-width="1.4"/><text x="215.0" y="227.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--pol-ink)">PAP has a second gate</text><text x="215.0" y="243.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--pol-ink)">Documented use and a doctor visit —</text><text x="215.0" y="259.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--pol-ink)">out of compliance, no supplies — <a class="xr" href="#3-7_4">3.7.4</a></text><rect x="405" y="206" width="350" height="66" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="580.0" y="227.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Nebulizer supplies</text><text x="580.0" y="243.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">No more than a three-month quantity</text><text x="580.0" y="259.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">in one shipment — <a class="xr" href="#3-3_3">3.3.3</a></text><rect x="770" y="206" width="350" height="66" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="945.0" y="227.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Oxygen tanks are different</text><text x="945.0" y="243.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">A rental accessory — once a week, two</text><text x="945.0" y="259.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">business days' notice — <a class="xr" href="#7-2_1">7.2.1</a></text><rect x="40" y="290" width="1080" height="60" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="580.0" y="308.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Say:</text><text x="580.0" y="324.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">"Insurance sets the window for when we can send the next shipment — we're not able to ship earlier than the allowed</text><text x="580.0" y="340.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">timeframe before you run out, per insurance guidelines. I'll follow up with that team to make sure it goes out as soon as possible."</text><text x="580.0" y="386" text-anchor="middle" class="dg-s">Medicare's rules. Texas Medicaid bills one month's supply at a time, so eligibility is checked each month.</text></svg>