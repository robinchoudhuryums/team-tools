<svg viewBox="0 0 1160 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="After-hours dispatch decision"><defs><marker id="mkm2adis" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkm2adis)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkm2adis)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">After hours — who can be dispatched?</text><rect x="430" y="38" width="300" height="38" rx="5" fill="var(--navy)" stroke="var(--navy)" stroke-width="1.4"/><text x="580.0" y="61.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)">After-hours call</text><path class="dg-arr" d="M580 76 L580 100"/><rect x="430" y="100" width="300" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="126.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Is this a medical emergency?</text><path class="dg-arr" d="M730 122 L830 122"/><text x="742" y="115" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="830" y="100" width="300" height="44" rx="5" fill="var(--crit-bg)" stroke="var(--crit-ink)" stroke-width="2"/><text x="980.0" y="126.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--crit-ink)">Advise 9-1-1 now. Stop here</text><path class="dg-arr" d="M580 144 L580 170"/><text x="586.0" y="153.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="430" y="170" width="300" height="52" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="192.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Existing patient, and</text><text x="580.0" y="208.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">our equipment?</text><path class="dg-arr" d="M430 196 L330 196"/><text x="396" y="189" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="20" y="170" width="310" height="52" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="175.0" y="192.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">New patient → call in business hours.</text><text x="175.0" y="208.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Not our equipment → we can't assist</text><path class="dg-arr" d="M580 222 L580 248"/><text x="586.0" y="231.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="430" y="248" width="300" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="274.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Where is the patient?</text><path class="dg-arr" d="M580 292 V312 H175 V330"/><text x="40" y="326" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">HAWAII / ELSEWHERE</text><rect x="20" y="330" width="310" height="44" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="175.0" y="348.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">No after-hours dispatch.</text><text x="175.0" y="364.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Advise business hours</text><path class="dg-arr" d="M580 292 V312 H985 V330"/><text x="990" y="326" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">SAN ANTONIO</text><rect x="830" y="330" width="310" height="60" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="985.0" y="348.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Oxygen concentrator service only —</text><text x="985.0" y="364.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">dispatch the San Antonio technician.</text><text x="985.0" y="380.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Anything else: business hours</text><path class="dg-arr" d="M580 292 L580 330"/><text x="586" y="318" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">DFW</text><rect x="430" y="330" width="300" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="356.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">What equipment?</text><path class="dg-arr" d="M580 374 V392 H152 V410"/><rect x="20" y="410" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="152.0" y="428.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Oxygen concentrator</text><text x="152.0" y="444.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">or suction</text><path class="dg-arr" d="M152 454 L152 476"/><rect x="20" y="476" width="264" height="64" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="152.0" y="496.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Troubleshoot first — <a class="xr" href="#7-6">7.6</a>.</text><text x="152.0" y="512.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Unresolved → dispatch the</text><text x="152.0" y="528.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">on-call DME technician</text><path class="dg-arr" d="M580 374 V392 H437 V410"/><rect x="305" y="410" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="437.0" y="428.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Ventilator, cough assist,</text><text x="437.0" y="444.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">IPPB, BiPAP ST</text><path class="dg-arr" d="M437 454 L437 476"/><rect x="305" y="476" width="264" height="64" rx="5" fill="var(--crit-bg)" stroke="var(--crit-ink)" stroke-width="2"/><text x="437.0" y="496.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--crit-ink)">Dispatch the on-call RT</text><text x="437.0" y="512.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--crit-ink)">immediately. Don't</text><text x="437.0" y="528.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--crit-ink)">troubleshoot</text><path class="dg-arr" d="M580 374 V392 H722 V410"/><rect x="590" y="410" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="722.0" y="436.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Power wheelchair</text><path class="dg-arr" d="M722 454 L722 476"/><rect x="590" y="476" width="264" height="64" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="722.0" y="496.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Advise business hours.</text><text x="722.0" y="512.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Stuck and vulnerable →</text><text x="722.0" y="528.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">non-emergency services or 9-1-1</text><path class="dg-arr" d="M580 374 V392 H1007 V410"/><rect x="875" y="410" width="264" height="44" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="1007.0" y="436.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Anything else</text><path class="dg-arr" d="M1007 454 L1007 476"/><rect x="875" y="476" width="264" height="64" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="1007.0" y="496.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Order status, supplies,</text><text x="1007.0" y="512.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">product questions →</text><text x="1007.0" y="528.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">business hours. Log the call</text><rect x="20" y="568" width="1120" height="48" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="580.0" y="588.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">When dispatching, relay all seven details — <a class="xr" href="#8-3_1">8.3.1</a></text><text x="580.0" y="604.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Name · address · phone · caller and relationship · equipment · issue · troubleshooting already tried</text><text x="580.0" y="650" text-anchor="middle" class="dg-s">Oxygen combined with a PAP or ventilator may call for the RT instead of a DME technician — confirm before dispatching.</text></svg>