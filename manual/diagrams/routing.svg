<svg viewBox="0 0 1160 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Transfer, email or notate decision"><defs><marker id="mkm5rout" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-so{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--bg);opacity:.88}
  .dg-seco{font:700 10px 'IBM Plex Sans',sans-serif;fill:var(--bg);text-decoration:underline}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkm5rout)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkm5rout)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">Transfer, email, or notate?</text><rect x="410" y="38" width="340" height="38" rx="5" fill="var(--navy)" stroke="var(--navy)" stroke-width="1.4"/><text x="580.0" y="61.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)">You've heard what the caller needs</text><path class="dg-arr" d="M580 76 L580 100"/><rect x="390" y="100" width="380" height="52" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="122.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Did you answer it fully, with nothing</text><text x="580.0" y="138.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">left for anyone else to do?</text><path class="dg-arr" d="M580 152 V172 H185 V196"/><text x="196" y="190" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><path class="dg-arr" d="M580 152 L580 196"/><text x="586.0" y="170.0" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><rect x="390" y="196" width="380" height="52" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="218.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Does a specialist need it now, or would</text><text x="580.0" y="234.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">immediate action help?</text><path class="dg-arr" d="M580 248 V270 H580 V292"/><path class="dg-arr" d="M770 222 V222 H975 V292"/><text x="780" y="216" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><text x="588" y="280" text-anchor="start" class="dg-sec">YES</text><rect x="20" y="196" width="330" height="34" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="185.0" y="217.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">NOTATE ONLY</text><rect x="20" y="240" width="330" height="106" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="34" y="264" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="48" y="264" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Demographic and contact updates</text><text x="34" y="285" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="48" y="285" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Insurance details from the patient</text><text x="34" y="306" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="48" y="306" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">A caller confirming what we have</text><text x="34" y="327" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="48" y="327" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Any call you fully answered</text><rect x="415" y="292" width="330" height="34" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="580.0" y="313.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">TRANSFER — notate first</text><rect x="415" y="336" width="330" height="211" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="429" y="360" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="443" y="360" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Complex billing → Billing</text><text x="429" y="381" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="443" y="381" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Insurer requesting auth info →</text><text x="443" y="402" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">intake team's authorization members</text><text x="429" y="423" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="443" y="423" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Compliance you can't resolve →</text><text x="443" y="444" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">compliance specialists</text><text x="429" y="465" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="443" y="465" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Provider clinical questions you</text><text x="443" y="486" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">can't resolve → intake team</text><text x="429" y="507" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="443" y="507" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Scheduling → Field Ops Q, or</text><text x="443" y="528" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Field Ops-Power Q for PMDs</text><rect x="810" y="292" width="330" height="34" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="975.0" y="313.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">EMAIL</text><rect x="810" y="336" width="330" height="127" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="824" y="360" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="838" y="360" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Specialist or department unavailable</text><text x="824" y="381" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="838" y="381" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Needs action by another department,</text><text x="838" y="402" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">not urgent</text><text x="824" y="423" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="838" y="423" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Closed-order request</text><text x="824" y="444" style="font:700 12.5px 'IBM Plex Sans',sans-serif;fill:var(--accent)">•</text><text x="838" y="444" style="font:500 12.5px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Out-of-pocket purchase</text><rect x="20" y="362" width="330" height="104" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="185.0" y="378.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Never</text><text x="185.0" y="394.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Cold transfer — say what the caller</text><text x="185.0" y="410.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">needs first. Commit to a turnaround</text><text x="185.0" y="426.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">you can't see.</text><text x="185.0" y="442.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Generally avoid</text><text x="185.0" y="458.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Giving out a direct extension</text></svg>