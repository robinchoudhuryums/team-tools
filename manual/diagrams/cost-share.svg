<svg viewBox="0 0 1160 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deductible, then the 80/20 split"><defs><marker id="mkm10cos" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-so{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--bg);opacity:.88}
  .dg-seco{font:700 10px 'IBM Plex Sans',sans-serif;fill:var(--bg);text-decoration:underline}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkm10cos)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkm10cos)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">Traditional (Original) Medicare — who pays for approved charges through the year</text><text x="40" y="56" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">JANUARY 1</text><text x="1120" y="56" text-anchor="end" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">DECEMBER 31</text><rect x="40" y="70" width="336" height="150" rx="4" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.2"/><text x="208.0" y="133.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Patient pays 100%</text><text x="208.0" y="149.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">until the annual Part B</text><text x="208.0" y="165.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">deductible is met — <a class="xr" href="#10-1">10.1</a></text><rect x="384" y="70" width="736" height="117.0" rx="4" fill="var(--tint)" stroke="var(--accent)" stroke-width="1.2"/><text x="752.0" y="124.5" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--accent)">Medicare pays 80%</text><text x="752.0" y="140.5" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--accent)">of the approved amount</text><rect x="384" y="193.0" width="736" height="27.0" rx="4" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.2"/><text x="752.0" y="210.5" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Patient pays 20%</text><line x1="380" y1="60" x2="380" y2="234" stroke="var(--muted)" stroke-dasharray="4 3"/><text x="380" y="250" text-anchor="middle" style="font:600 11px 'IBM Plex Mono',monospace;fill:var(--muted)">DEDUCTIBLE MET</text><rect x="40" y="270" width="1080" height="44" rx="5" fill="var(--panel)" stroke="var(--rule)" stroke-width="1.4"/><text x="580.0" y="288.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">A secondary can take the patient's share</text><text x="580.0" y="304.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">Medigap (most plans) covers the 20%. Full Medicaid or QMB → $0, including the deductible. No secondary → no yearly cap — <a class="xr" href="#10-5">10.5</a></text></svg>