<svg viewBox="0 0 1160 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Equipment swap-out decision"><defs><marker id="mkm8bswa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs><style>
  .dg-lane{fill:var(--panel)}
  .dg-lane-b{fill:none;stroke:var(--rule);stroke-width:1}
  .dg-lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .dg-box{stroke-width:1.5;rx:4}
  .dg-t{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)}
  .dg-ti{font:600 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
  .dg-s{font:400 10.5px 'IBM Plex Sans',sans-serif;fill:var(--muted)}
  .dg-sec{font:600 10px 'IBM Plex Sans',sans-serif;fill:var(--accent)}
  .dg-arr{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#mkm8bswa)}
  .dg-arr-d{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;
    marker-end:url(#mkm8bswa)}
  .dg-h{font:700 13px 'IBM Plex Sans',sans-serif;fill:var(--navy)}
</style><text class="dg-h" x="580.0" y="22" text-anchor="middle">Patient wants a different version of an item</text><rect x="410" y="38" width="340" height="38" rx="5" fill="var(--navy)" stroke="var(--navy)" stroke-width="1.4"/><text x="580.0" y="61.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--bg)">Patient asks to swap an item</text><path class="dg-arr" d="M580 76 L580 100"/><rect x="350" y="100" width="460" height="52" rx="5" fill="var(--tint)" stroke="var(--accent)" stroke-width="2"/><text x="580.0" y="122.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Does the change need new documents from the MDO?</text><text x="580.0" y="138.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--navy)">Different or additional HCPCS code, or new MRx</text><path class="dg-arr" d="M580 152 V172 H235 V192"/><text x="246" y="186" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">NO</text><path class="dg-arr" d="M580 152 V172 H830 V192"/><text x="841" y="186" style="font:700 11px 'IBM Plex Mono',monospace;fill:var(--muted)">YES</text><rect x="60" y="192" width="350" height="62" rx="5" fill="var(--scr-bg)" stroke="var(--scr-ink)" stroke-width="1.4"/><text x="235.0" y="211.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Transfer to Service</text><text x="235.0" y="227.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">They create a swap-out service ticket.</text><text x="235.0" y="243.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--scr-ink)">Nothing else needed</text><rect x="610" y="192" width="440" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="830.0" y="215.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">1. Create a pick-up ticket</text><text x="830.0" y="231.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">for the item they already have</text><path class="dg-arr" d="M830 246 L830 258"/><rect x="610" y="258" width="440" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="830.0" y="281.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">2. Note on the ticket</text><text x="830.0" y="297.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">coordinate the pick-up with the new delivery</text><path class="dg-arr" d="M830 312 L830 324"/><rect x="610" y="324" width="440" height="54" rx="5" fill="var(--bg)" stroke="var(--rule)" stroke-width="1.4"/><text x="830.0" y="347.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">3. Email the intake department</text><text x="830.0" y="363.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--ink)">so they request documents and open the order</text><rect x="60" y="330" width="350" height="64" rx="5" fill="var(--watch-bg)" stroke="var(--watch-ink)" stroke-width="1.4"/><text x="235.0" y="350.0" text-anchor="middle" style="font:700 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">The email starts the new order</text><text x="235.0" y="366.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">Without it, the patient's equipment is</text><text x="235.0" y="382.0" text-anchor="middle" style="font:500 12px 'IBM Plex Sans',sans-serif;fill:var(--watch-ink)">collected and nothing replaces it</text></svg>