<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
    margin: 0; font-size: 14px; color: #333;
    background-image: url('<?= PPD_CONFIG.BACKGROUND_IMAGE_URL ?>');
    background-color: #e9ecef;
    background-size: cover;
  }
  
  #main-content {
    position: absolute; top: 0; bottom: 80px; left: 0; right: 0;
    padding: 15px 25px; overflow-y: auto;
    background-color: rgba(255, 255, 255, 0.7);
  }
  #footer {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 80px;
    background-color: #f8f9fa; border-top: 1px solid #dee2e6;
    box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  }
  .footer-controls { display: flex; align-items: center; gap: 15px; }
  select, button { padding: 8px 12px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; }
  button { cursor: pointer; transition: background-color 0.2s; }
  button#send-btn { background-color: #1a73e8; color: white; border-color: #1a73e8; font-weight: 500; display: flex; align-items: center; justify-content: center; min-width: 110px; height: 38px; }
  button#send-btn:hover { background-color: #185abc; }
  button#send-btn:disabled { background-color: #9E9E9E; border-color: #9E9E9E; cursor: not-allowed; }
  button#cancel-btn { background-color: #fff; }
  .loader { border: 2px solid rgba(255, 255, 255, 0.3); border-top: 2px solid #fff; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: none; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  /* --- FIXED STAR CSS --- */
  .star-container input { display: none; }
  .star-icon {
    font-size: 24px;
    line-height: 1;
    color: #ccc; 
    transition: color 0.2s;
    display: inline-block;
  }
  .star-container input:checked + .star-icon { color: #FFD700; }
  .star-container:hover .star-icon { color: #ffe066; }

  /* Dropdown Styles */
  .status-select { cursor: pointer; background-color: white; }
  .status-select.accepted { background-color: #e6fffa; border-color: #00875A; color: #00875A; }
  .status-select.rejected { background-color: #ffebe6; border-color: #DE350B; color: #DE350B; }
  
  /* UPDATED: Blue-Gray for Undecided */
  .status-select.undecided { background-color: #e2e8f0; border-color: #94a3b8; color: #334155; }

</style>
  </head>
  <body>
    <div id="main-content">
      <?!= ppdPreview; ?>
    </div>
    
    <div id="footer">
      <label for="agent-select"><strong>Send to:</strong></label>
      
      <div class="select-wrapper">
        <select id="agent-select" style="margin-left: 10px; margin-right: 15px;">
          <? for (let i = 0; i < agentOptions.length; i++) { ?>
            <option value="<?= agentOptions[i] ?>"><?= agentOptions[i] ?></option>
          <? } ?>
        </select>
      </div>
      
      <button id="send-btn" onclick="sendEmail()">Send Email</button>
      <button id="cancel-btn" onclick="google.script.host.close()" style="margin-left: 10px;">Cancel</button>
      <div id="loader" class="loader" style="margin-left: 10px;"></div>
    </div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const selects = document.querySelectorAll('.status-select');
    selects.forEach(sel => {
      sel.addEventListener('change', function() {
        this.classList.remove('accepted', 'rejected', 'undecided');
        if (this.value === 'accepted') this.classList.add('accepted');
        if (this.value === 'rejected') this.classList.add('rejected');
        if (this.value === 'undecided') this.classList.add('undecided');
      });
    });
  });

  function sendEmail() {
    const sendButton = document.getElementById('send-btn');
    const loader = document.getElementById('loader');
    
    sendButton.disabled = true;
    sendButton.textContent = 'Sending...';
    loader.style.display = 'inline-block';

    const selectedAgent = document.getElementById('agent-select').value;
    
    // --- GATHER SELECTIONS ---
    const userSelections = {};
    const recItems = document.querySelectorAll('.rec-item');
    
    recItems.forEach(item => {
       const id = item.getAttribute('data-id');
       const statusSelect = item.querySelector('.status-select');
       const statusVal = statusSelect ? statusSelect.value : 'none';
       const starInput = item.querySelector('input[name="preferred_product"]');
       const isPreferred = starInput ? starInput.checked : false;
       
       userSelections[id] = {
         status: statusVal,
         preferred: isPreferred
       };
    });

    google.script.run
      .withSuccessHandler(function() {
        google.script.host.close();
      })
      .withFailureHandler(function(error) {
        sendButton.disabled = false;
        sendButton.textContent = 'Send Email';
        loader.style.display = 'none';
        google.script.run.showFailureDialog_wrapper('Error: ' + error.message);
      })
      .processEmailToSend_wrapper(selectedAgent, userSelections); 
  }
</script>
  </body>
</html>
