<script>
// ════════════════════════════════════════════════════════════════════════════
//  SHARED CONSTANTS
// ════════════════════════════════════════════════════════════════════════════
const PUNCH_META = {
  ClockIn:  { label:'Clock In',     icon:'clockIn',  dir:'in',  cls:'btn-clockin'  },
  LunchOut: { label:'Lunch Out',    icon:'lunchOut', dir:'out', cls:'btn-lunchout' },
  LunchIn:  { label:'Lunch Return', icon:'lunchIn',  dir:'in',  cls:'btn-lunchin'  },
  ClockOut: { label:'Clock Out',    icon:'clockOut', dir:'out', cls:'btn-clockout' },
  Adjust:   { label:'Adjust / Fix Punch', icon:'adjust', dir:null, cls:'btn-adjust' },
};
const STATUS_PILL = {
  idle:   { label:'Not Clocked In', cls:'s-idle'   },
  active: { label:'Clocked In',     cls:'s-active' },
  lunch:  { label:'On Lunch',       cls:'s-lunch'  },
  done:   { label:'Shift Complete', cls:'s-done'   },
};
const MGR_STATUS = {
  clocked_in:  { label:'In',     pillCls:'ms-active', avCls:'av-active' },
  on_lunch:    { label:'Lunch',  pillCls:'ms-lunch',  avCls:'av-lunch'  },
  clocked_out: { label:'Done',   pillCls:'ms-done',   avCls:'av-done'   },
  not_in:      { label:'Not In', pillCls:'ms-idle',   avCls:'av-idle'   },
};
const MONTH_NAMES = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];
const DOW_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// ════════════════════════════════════════════════════════════════════════════
//  TOOL REGISTRY
//  ────────────────────────────────────────────────────────────────────────
//  Each top-level entry is a "tool" (Time Clock, Call Notes, …); each tool
//  declares its views (= sidebar/nav entries). To add a new tool: append a
//  new entry to TOOLS, implement the per-view enter handler in the
//  corresponding script_*.html partial, and include() the partial in
//  index.html. The shell auto-builds the sidebar / mobile nav from this
//  registry and the showView() dispatcher routes to the handler. The
//  sidebar `.sb-brand-sub` swaps to the active tool's label on each
//  navigation so the user always sees which tool they're in.
//
//  managerOnly: true hides the view from non-managers.
//  External: enter handlers are defined alongside their view code; the
//  registry just looks them up by name (window[...]).
// ════════════════════════════════════════════════════════════════════════════
const TOOLS = {
  timeClock: {
    label: 'Time Clock',
    views: {
      clock:     { label: 'Clock',     icon: 'clock',     enter: 'enterClockView' },
      timesheet: { label: 'Timesheet', icon: 'timesheet', enter: 'enterTimesheetView' },
      timeoff:   { label: 'Time Off',  icon: 'timeoff',   enter: 'enterTimeoffView' },
      manage:    { label: 'Manage',    icon: 'manage',    enter: 'enterManagerView', managerOnly: true },
    },
  },
};
const VIEW_TO_TOOL = {};
Object.keys(TOOLS).forEach(toolKey => {
  Object.keys(TOOLS[toolKey].views).forEach(viewKey => { VIEW_TO_TOOL[viewKey] = toolKey; });
});

// ════════════════════════════════════════════════════════════════════════════
//  SHARED STATE
// ════════════════════════════════════════════════════════════════════════════
let empState = null;
let currentView = 'clock';
let tsData = null, tsViewMode = 'month', tsStart = null, tsEnd = null;
let tsLayout = 'list'; // 'list' | 'calendar' — calendar grid only available in month range
let calData = null, calYear = null, calMonth = null;
let mgrData = null;
let dayModalDate = null;
let clockInterval = null;
let adjustWindowDays = 30;

// ════════════════════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════════════════════
window.addEventListener('load', () => {
  google.script.run
    .withSuccessHandler(state => {
      if (state.error) { renderError(state.error); return; }
      empState = state;
      adjustWindowDays = state.adjustWindowDays || 30;
      if (state.selfUndoWindowSeconds) SELF_UNDO_WINDOW_SECONDS = state.selfUndoWindowSeconds;
      document.getElementById('adj-days-disp').textContent = adjustWindowDays;
      tsViewMode = (empState.payCycle === 'Biweekly' && empState.payAnchor) ? 'period' : 'month';
      renderShell(state);
      showView('clock');
    })
    .withFailureHandler(err => renderError(err.message || 'Failed to connect. Please refresh.'))
    .getEmployeeState();
});

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="state-center">
      <div class="state-icon" style="color:var(--warn)">${icon('warning', 44)}</div>
      <div class="state-title">Couldn't Load</div>
      <div class="state-detail">${esc(msg)}</div></div>`;
}

function renderShell(state) {
  const sbIcon = (name) => `<span class="sb-icon">${icon(name, 18)}</span>`;
  const nvIcon = (name) => `<span class="nav-icon">${icon(name, 20)}</span>`;

  // Build sidebar links + mobile nav buttons from the TOOLS registry. Views
  // with managerOnly:true are filtered for non-managers. Order matches the
  // declaration order in TOOLS (ES2015+ guarantees insertion order for
  // string keys, which is what we rely on here).
  const visibleViews = [];
  Object.keys(TOOLS).forEach(toolKey => {
    Object.keys(TOOLS[toolKey].views).forEach(viewKey => {
      const v = TOOLS[toolKey].views[viewKey];
      if (v.managerOnly && !state.isManager) return;
      visibleViews.push({ viewKey, ...v });
    });
  });
  const sbLinks = visibleViews.map(v =>
    `<button class="sb-link" data-view="${v.viewKey}" onclick="showView('${v.viewKey}')">
       ${sbIcon(v.icon)}${esc(v.label)}</button>`
  ).join('');
  const navBtns = visibleViews.map(v =>
    `<button class="nav-btn" data-view="${v.viewKey}" onclick="showView('${v.viewKey}')">
       ${nvIcon(v.icon)}${esc(v.label)}</button>`
  ).join('');

  const tzTag = state.timezoneAbbr
    ? `<span class="sb-user-tz">${esc(state.timezoneAbbr)}</span>` : '';
  const tzTagMobile = state.timezoneAbbr
    ? `<span class="hdr-tz">${esc(state.timezoneAbbr)}</span>` : '';
  const initials = (state.name || '').split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();

  const themeToggle = `
    <div class="sb-theme-toggle" role="group" aria-label="Color theme">
      <button type="button" class="sb-theme-btn" data-theme-target="light"
              aria-label="Light theme" title="Light theme"
              onclick="setTimeClockMode('light')">${icon('sun', 14)}</button>
      <button type="button" class="sb-theme-btn" data-theme-target="dark"
              aria-label="Dark theme" title="Dark theme"
              onclick="setTimeClockMode('dark')">${icon('moon', 14)}</button>
    </div>`;

  document.getElementById('app').innerHTML = `
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sb-brand">
          <div class="sb-brand-title">
            <span class="sb-brand-mark" aria-hidden="true"></span>
            <span>UMS Team Tools</span>
          </div>
          <div class="sb-brand-sub" id="sb-tool-label">Time Clock</div>
        </div>
        <div class="sb-section-label">Navigate</div>
        ${sbLinks}
        <div class="sb-theme">
          <span class="sb-theme-label">Theme</span>
          ${themeToggle}
        </div>
        <div class="sb-user">
          <div class="sb-user-avatar">${esc(initials)}</div>
          <div class="sb-user-info">
            <div class="sb-user-name">${esc(state.name)}</div>
            <div class="sb-user-meta">${esc(state.id)} ${tzTag}</div>
          </div>
        </div>
      </aside>

      <div style="display:flex;flex-direction:column;min-height:100vh">
        <header class="mobile-header">
          <div class="hdr-brand">
            <span class="hdr-mark" aria-hidden="true"></span>
            <div class="hdr-text">
              <div class="hdr-title">UMS Team Tools</div>
              <div class="hdr-sub">${esc(state.name)} ${tzTagMobile}</div>
            </div>
          </div>
          <div class="hdr-right">
            ${themeToggle}
            <div class="hdr-id">${esc(state.id)}</div>
          </div>
        </header>

        <div class="view-area" id="view-area"></div>

        <nav class="mobile-nav">
          <div class="mobile-nav-inner">
            ${navBtns}
          </div>
        </nav>
      </div>
    </div>`;

  // Reflect current theme in both toggle pills
  syncThemeToggleState();
}

function showView(view) {
  const toolKey = VIEW_TO_TOOL[view];
  if (!toolKey) return;
  currentView = view;
  // Swap the sidebar tool label (e.g. "Time Clock" ↔ "Call Notes") so the
  // user always sees which tool they're in. Falls back silently if the
  // element isn't on the page yet (initial loading state).
  const lbl = document.getElementById('sb-tool-label');
  if (lbl) lbl.textContent = TOOLS[toolKey].label;
  document.querySelectorAll('.nav-btn, .sb-link').forEach(b =>
    b.classList.toggle('active', b.dataset.view === view));
  const area = document.getElementById('view-area');
  if (!area) return;
  const enterFn = window[TOOLS[toolKey].views[view].enter];
  if (typeof enterFn === 'function') enterFn(area);
}

// ── Time Clock view enter handlers ──────────────────────────────────────
//  Each handler receives the view-area element and does whatever setup
//  the view needs (data load, ticker start, etc.). They live here rather
//  than in their respective script_*.html partials because they wire the
//  router into the existing render* / load* functions that those
//  partials own — keeping the cross-cutting glue in one place.
function enterClockView(area)     { renderClockView(area); startClock(); }
function enterTimesheetView(area) {
  stopClock();
  if (!tsStart) {
    const range = computeRange(tsViewMode, isoDateTz(empTz()), 0);
    tsStart = range.start; tsEnd = range.end;
  }
  renderLoading(area, 'Loading timesheet…');
  loadTimesheet(tsStart, tsEnd);
}
function enterTimeoffView(area) {
  stopClock();
  if (!calYear) {
    const todayInTz = isoDateTz(empTz());
    const parts = todayInTz.split('-');
    calYear = parseInt(parts[0], 10);
    calMonth = parseInt(parts[1], 10);
  }
  renderLoading(area, 'Loading calendar…');
  loadCalendar(calYear, calMonth);
}
function enterManagerView(area) {
  stopClock();
  renderLoading(area, 'Loading dashboard…');
  loadManagerDashboard();
}

function renderLoading(area, label) {
  area.innerHTML = `<div class="state-center"><div class="spinner"></div>
    <div class="state-label">${esc(label)}</div></div>`;
}

// ════════════════════════════════════════════════════════════════════════════
//  SHARED UTILITIES
// ════════════════════════════════════════════════════════════════════════════

/** Employee's timezone (falls back to Asia/Kolkata pre-login or if missing). */
function empTz() { return (empState && empState.timezone) || 'Asia/Kolkata'; }

/** Current date as yyyy-MM-dd in the given timezone. */
function isoDateTz(tz) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());
}

/** Current time as HH:mm (24-hr) in the given timezone. */
function timeHmTz(tz) {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
  }).format(new Date());
}

/** Live clock display "h:mm:ss AM/PM" in the given timezone. */
function liveTimeTz(tz) {
  return new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: 'numeric', minute: '2-digit', second: '2-digit',
  }).format(new Date());
}

/** Today's date label "Saturday, May 17" in the given timezone. */
function dateLabelTz(tz) {
  return new Intl.DateTimeFormat('en-US', {
    timeZone: tz, weekday: 'long', month: 'short', day: 'numeric',
  }).format(new Date());
}

function deriveShiftStatus(nextActions, punches) {
  if (!punches || punches.length === 0) return 'idle';
  if (nextActions.length === 1 && nextActions[0] === 'Adjust') return 'done';
  return punches[punches.length-1].type === 'LunchOut' ? 'lunch' : 'active';
}

function dispTime(t) {
  if (!t) return '';
  const p = String(t).split(':');
  if (p.length < 2) return t;
  const h = parseInt(p[0],10);
  return `${h%12||12}:${p[1]} ${h>=12?'PM':'AM'}`;
}

function fmtHrs(h) {
  if (h === null || h === undefined) return '--';
  const hrs = Math.floor(h), mins = Math.round((h - hrs) * 60);
  return mins > 0 ? `${hrs}h ${mins}m` : `${hrs}h`;
}

/** Short hours format for badges/calendar cells: 8 → "8h", 8.5 → "8.5h". */
function formatHoursShort(h) {
  if (h === null || h === undefined || isNaN(Number(h))) return '';
  const n = Number(h);
  return n % 1 === 0 ? `${n}h` : `${n.toFixed(1)}h`;
}

function isoDate(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function pad(n) { return String(n).padStart(2,'0'); }

/** Calendar-day distance between two yyyy-MM-dd strings, positive if laterIso > earlierIso. */
function daysBetweenIso(earlierIso, laterIso) {
  return Math.round(
    (new Date(laterIso + 'T00:00:00Z') - new Date(earlierIso + 'T00:00:00Z')) / 86400000
  );
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Toast stack ────────────────────────────────────────────────────────
// Stackable, auto-dismissing toasts with semantic variants.
// API: showToast(message, 'toast-success' | 'toast-error' | 'toast-warn' | undefined)
function showToast(msg, cls) {
  const stack = document.getElementById('toast-stack');
  if (!stack) return;
  // Pick the SVG glyph that matches the variant — checkCircle / xCircle /
  // warning / info. The .toast-icon CSS tints each per variant.
  const iconName = cls === 'toast-success' ? 'checkCircle'
                 : cls === 'toast-error'   ? 'xCircle'
                 : cls === 'toast-warn'    ? 'warning'
                 : 'info';
  // Strip leading emoji/icon from msg if caller prepended (legacy callsites)
  const clean = String(msg).replace(/^[\u2705\u274C\u26A0\uFE0F\u2713\u2717\s]+/, '').trim() || String(msg);
  const t = document.createElement('div');
  t.className = `toast ${cls || ''}`.trim();
  t.innerHTML = `<span class="toast-icon">${icon(iconName, 16)}</span><span class="toast-msg"></span>`;
  t.querySelector('.toast-msg').textContent = clean;
  stack.appendChild(t);
  setTimeout(() => {
    t.classList.add('toast-leave');
    t.addEventListener('animationend', () => t.remove(), { once: true });
  }, 3500);
  // Cap the stack at 5
  while (stack.children.length > 5) stack.firstChild.remove();
}
</script>
