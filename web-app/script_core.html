//    entirely (toolVisibleForUser_).
//  Enter handlers live in the per-tool script_*.html partials; the registry
//  looks them up by name (window[...]).
// ════════════════════════════════════════════════════════════════════════════
const TOOLS = {
  timeClock: {

  callNotes: {

    sidebarIcon: 'adjust',
    defaultTab: 'callNotes',
    tabs: {
      callNotes:        { label: 'Log',         icon: 'adjust',  enter: 'enterCallNotesView' },
      callNotesHistory: { label: 'History',     icon: 'list',    enter: 'enterCallNotesHistoryView' },
      callNotesSearch:  { label: 'Search',      icon: 'search',  enter: 'enterCallNotesSearchView' },
      callNotesForms:   { label: 'Sent Forms',  icon: 'send',    enter: 'enterCallNotesFormsView' },

    tabs: {

      intakePmdAccount: { label: 'PMD Account',        icon: 'accessibility',  enter: 'enterIntakePmdView' },
      intakePapAccount: { label: 'PAP Account',        icon: 'airflow',        enter: 'enterIntakePapView' },
      intakeSent:       { label: 'Sent',               icon: 'outbox',         enter: 'enterIntakeSentView' },

  reference: {

  develop: {

    defaultTab: 'trainingHome',
    tabs: {
      trainingHome:   { label: 'My Training',   icon: 'check',  enter: 'enterTrainingHomeView' },
      trainingManage: { label: 'Team Training', icon: 'manage', enter: 'enterTrainingManageView', managerOnly: true },
      coaching:       { label: 'Coaching',      icon: 'thumbsUp', enter: 'enterCoachingView' },
      myDocs:         { label: 'My Docs',       icon: 'paperclip', enter: 'enterMyDocsView' },
      docsManage:     { label: 'Issue Docs',    icon: 'send',   enter: 'enterDocsManageView', managerOnly: true },
    },
  },
  // Manage — the consolidated manager/admin home. Tabs are MOVED here from their
  // original tools (keys unchanged, so ?tool=<key> deep-links + `currentView ===`
  // guards + the enter handlers in tc/cn partials all keep working). The whole

  manage: {
    label: 'Manage',
    sidebarIcon: 'manage',
    defaultTab: 'manage',
    tabs: {
      manage:         { label: 'Manage Time', icon: 'manage',   enter: 'enterManagerView',        managerOnly: true },
      coverage:       { label: 'Coverage',    icon: 'chart',    enter: 'enterCoverageView',       managerOnly: true },
      punctuality:    { label: 'Punctuality', icon: 'clock',    enter: 'enterPunctualityView',    managerOnly: true },
      callNotesAdmin: { label: 'Admin',       icon: 'settings', enter: 'enterCallNotesAdminView', adminOnly: true },
    },

// tabKey → toolKey lookup. Tab keys are globally unique by convention so
// existing call sites that compare `currentView === 'callNotes'` continue
// to work (currentView holds the active tab key).
const VIEW_TO_TOOL = {};
Object.keys(TOOLS).forEach(toolKey => {
  Object.keys(TOOLS[toolKey].tabs).forEach(tabKey => { VIEW_TO_TOOL[tabKey] = toolKey; });
});

/** Whether the current user may see a tab. adminOnly → isAdmin; managerOnly →
 *  isManager OR an `also` empState flag (e.g. metricsSpanish → canSeeSpanish);
 *  otherwise visible to all. Before empState loads, only ungated tabs show. */
function tabVisibleForUser_(t) {
  if (!t) return false;
  if (t.adminOnly) return !!(empState && empState.isAdmin);
  if (t.managerOnly) return !!(empState && (empState.isManager || (t.also && empState[t.also])));
  return true;
}
/** A tool is visible iff the user can see at least one of its tabs. Hides a
 *  fully-gated module (e.g. Manage) from the sidebar/nav for non-managers. */
function toolVisibleForUser_(toolKey) {
  const tool = TOOLS[toolKey];
  if (!tool) return false;
  return Object.keys(tool.tabs).some(k => tabVisibleForUser_(tool.tabs[k]));
}

// ════════════════════════════════════════════════════════════════════════════
//  SHARED STATE
// ════════════════════════════════════════════════════════════════════════════
let empState = null;
let currentView = 'clock';
let tsData = null, tsViewMode = 'month', tsStart = null, tsEnd = null;
let calData = null, calYear = null, calMonth = null;
let mgrData = null;
let dayModalDate = null;
let clockInterval = null;
let adjustWindowDays = 30;

// Compact mode: ?compact=1 collapses sidebar/header chrome to fit a small
// pop-out window. ?tool=<viewKey> deep-links straight into a specific tool.
// Round 2 · 8x — read query params via SERVER_QUERY_PARAMS (injected by
// doGet's template eval) since Apps Script's HtmlService iframe doesn't
// expose the deploy URL's search string through window.location. Fall back
// to window.location.search for any non-Apps-Script context (e.g. local
// dev / a future static-hosted variant). data-compact is also set in
// <head> by index.html for first-paint correctness; setting again here is
// idempotent.
const __URL_PARAMS = (function () {
  try {
    if (window.SERVER_QUERY_PARAMS && Object.keys(window.SERVER_QUERY_PARAMS).length > 0) {
      const usp = new URLSearchParams();
      Object.keys(window.SERVER_QUERY_PARAMS).forEach(function (k) {
        usp.set(k, String(window.SERVER_QUERY_PARAMS[k]));
      });
      return usp;
    }
    return new URLSearchParams(window.location.search);
  }
  catch (e) { return new URLSearchParams(''); }
})();
const COMPACT_MODE = __URL_PARAMS.get('compact') === '1';
const INITIAL_VIEW_FROM_URL = __URL_PARAMS.get('tool');
if (COMPACT_MODE) document.documentElement.setAttribute('data-compact', '1');

// ── Client error beacon (#1, INV-150) ───────────────────────────────────────
// A throwing render / rejected promise chain used to surface NOWHERE — the rep
// sees a dead button, the operator sees nothing (the M-1 class from the field).
// Post exception METADATA (message / stack / active view key — NEVER form-field
// values or DOM text; only the error event itself is read) to the server's
// ClientErrors tab, surfaced in Admin → Automation Health. Fire-and-forget,
// deduped, and hard-capped per session so an error loop can't flood the tab
// (the server rate-caps per rep too).
var ERR_BEACON_MAX_PER_SESSION = 5;
var _errBeaconSent = 0;
// D10 (cycle 10): a null-prototype map — a plain {} inherits Object.prototype,
// so an error message named "toString"/"constructor"/"valueOf" read truthy on
// FIRST sight and was never beaconed (and "__proto__" could never be marked).
var _errBeaconSeen = Object.create(null);

/** Pure — bound + shape a beacon payload. Null when there's nothing worth
 *  sending (empty message). Mirrors the server's recordClientError caps
 *  (CLIENT_ERR_MSG_MAX / CLIENT_ERR_STACK_MAX). Node-pinned. */
function errBeaconPayload_(message, stack, view, source) {
  var msg = String(message == null ? '' : message).trim().substring(0, 400);
  if (!msg) return null;
  return {
    message: msg,
    stack: String(stack == null ? '' : stack).substring(0, 1500),
    view: String(view == null ? '' : view).substring(0, 40),
    source: source === 'unhandledrejection' ? 'unhandledrejection' : 'onerror',
  };
}

function errBeaconSend_(message, stack, source) {
  try {   // the beacon itself must NEVER throw (it runs inside error handlers)
    if (_errBeaconSent >= ERR_BEACON_MAX_PER_SESSION) return;
    var payload = errBeaconPayload_(
      message, stack, typeof currentView !== 'undefined' ? currentView : '', source);
    if (!payload) return;
    if (_errBeaconSeen[payload.message]) return;   // dedupe identical repeats
    _errBeaconSeen[payload.message] = true;
    _errBeaconSent++;
    if (typeof google === 'undefined' || !google.script || !google.script.run) return;
    google.script.run.withFailureHandler(function () {}).recordClientError(payload);
  } catch (e) { /* swallow — see above */ }
}

window.addEventListener('error', function (e) {
  // Resource-load errors (img/script) fire here with no .message — skip them.
  if (!e || !e.message) return;
  var stack = (e.error && e.error.stack) || ((e.filename || '') + ':' + (e.lineno || ''));
  errBeaconSend_(e.message, stack, 'onerror');
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e && e.reason;
  errBeaconSend_((r && r.message) || String(r || ''), (r && r.stack) || '', 'unhandledrejection');
});

// ════════════════════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════════════════════
window.addEventListener('load', () => {
  google.script.run
    .withSuccessHandler(state => {
      if (state.error) { renderError(state.error); return; }
      empState = state;
      adjustWindowDays = state.adjustWindowDays || 30;
      if (state.selfUndoWindowSeconds) SELF_UNDO_WINDOW_SECONDS = state.selfUndoWindowSeconds;
      document.getElementById('adj-days-disp').textContent = adjustWindowDays;
      // L18 — the reason-threshold copy in both modals tracks the server
      // CONFIG (the hardcoded "7" lied whenever OLD_ADJUST_ALERT_DAYS changed).
      var reasonDays = state.adjustReasonThresholdDays || 7;
      ['adj-reason-days', 'de-reason-days'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.textContent = reasonDays;
      });
      tsViewMode = (empState.payCycle === 'Biweekly' && empState.payAnchor) ? 'period' : 'month';
      renderShell(state);
      // Deep-link via ?tool=<tabKey>, falling back to Time Clock + its default
      // tab. Honors managerOnly gating: a non-manager landing on a managerOnly
      // tab is bumped to the tool's default tab inside enterTool.
      let initialTool = 'timeClock';
      let initialTab = null;
      if (INITIAL_VIEW_FROM_URL && VIEW_TO_TOOL[INITIAL_VIEW_FROM_URL]) {
        initialTool = VIEW_TO_TOOL[INITIAL_VIEW_FROM_URL];
        initialTab = INITIAL_VIEW_FROM_URL;
      }
      // Refresh-restore: with no explicit deep-link, land on the tab the rep
      // was last on (persisted by showView) instead of bouncing to Time Clock
      // — an accidental refresh mid-note returns to the Log view, where the
      // sticky form draft restores the typed fields. enterTool still bumps
      // non-managers off managerOnly tabs, so a stale stored view is safe.
      if (!initialTab) {
        try {
          const lastView = localStorage.getItem('umsLastView');
          if (lastView && VIEW_TO_TOOL[lastView]) {
            initialTool = VIEW_TO_TOOL[lastView];
            initialTab = lastView;
          }
        } catch (e) {}
      }
      enterTool(initialTool, initialTab);
      // Start ambient pollers — badges update regardless of active tool
      if (typeof mStartAmbientPolling_ === 'function') mStartAmbientPolling_();
      // #4 — in the compact pop-out, persist the window's size/position so the
      // rep's manual resize/reposition sticks across launches.
      popoutPersistGeometryInit_();
      // First-load onboarding tour (auto-starts once per TOUR_VERSION; never
      // in the compact pop-out). Replayable from the Call Notes ? menu.
      if (typeof tourMaybeAutoStart_ === 'function') tourMaybeAutoStart_();
      // "What's new" (#4, INV-152) — best-effort fetch. F1 (cycle 10): the
      // panel does NOT auto-open (the 2026-07-09 operator decision — updates
      // surface as Dashboard greeting slides + the star buttons; this comment
      // previously claimed auto-open and could invite a regression).
      whatsNewInit_();
    })
    .withFailureHandler(err => renderError(err.message || 'Failed to connect. Please refresh.'))
    .getEmployeeState();
});

/** Opens the current view in a chromeless pop-out window in compact mode.
 *  ONE window PER TOOL (named target keyed by tool) so e.g. a Call Notes
 *  pop-out and a Time Clock pop-out can be open at the same time; a repeat
 *  click on the same tool's pop-out just focuses that tool's window. */
function popOutCurrentView() {
  try {
    // The iframe's own origin+pathname is the sandboxed googleusercontent
    // URL — session-bound, renders BLANK as a top-level window (the same
    // iframe-sandbox class as INV-78). Open the real deploy URL shipped by
    // doGet; the location fallback only matters for local dev.
    const base = window.SERVER_WEB_APP_URL ||
      (window.location.origin + window.location.pathname);
    const url = base + '?compact=1&tool=' + encodeURIComponent(currentView);
    const tool = popoutToolKey_(currentView);
    // #4 — default 480×800, overridden by this tool's last persisted size/pos
    // (umsPopoutGeom_<tool>). Features honored only on FIRST open of the named
    // window; later resizes persist via popoutPersistGeometryInit_. A legacy
    // single-window geom seeds the SIZE only (not position, so a new per-tool
    // window doesn't stack exactly on an existing one).
    let geom = null;
    try {
      geom = popoutParseGeom_(localStorage.getItem('umsPopoutGeom_' + tool));
      if (!geom) {
        const lg = popoutParseGeom_(localStorage.getItem('umsPopoutGeom'));
        if (lg) geom = { w: lg.w, h: lg.h };
      }
    } catch (e) {}
    const w = geom ? geom.w : 480;
    const h = geom ? geom.h : 800;
    let feat = 'width=' + w + ',height=' + h + ',menubar=no,toolbar=no,location=no,status=no,resizable=yes';
    if (geom && geom.x != null && geom.y != null) feat += ',left=' + geom.x + ',top=' + geom.y;
    window.open(url, 'umsTeamToolsCompact_' + tool, feat);
  } catch (e) { showToast('Pop-out blocked by browser', 'toast-warn'); }
}

/** Tool key a view belongs to (windows + geometry are keyed by tool, not tab),
 *  so all tabs of one tool share its single pop-out window. */
function popoutToolKey_(viewKey) {
  try { return (typeof VIEW_TO_TOOL !== 'undefined' && VIEW_TO_TOOL[viewKey]) || viewKey || 'default'; }
  catch (e) { return viewKey || 'default'; }
}

/** Pure — parse + range-guard the persisted pop-out geometry blob
 *  (localStorage.umsPopoutGeom). Returns {w,h[,x,y]} or null on missing /
 *  corrupt / out-of-range input (fail-safe: a bad value falls back to the
 *  default size). Position is optional and dropped unless both x,y are sane.
 *  Pinned by a Node test. */
function popoutParseGeom_(raw) {
  if (!raw) return null;
  let g;
  try { g = JSON.parse(raw); } catch (e) { return null; }
  if (!g || typeof g !== 'object') return null;
  const w = Math.round(Number(g.w));
  const h = Math.round(Number(g.h));
  if (!isFinite(w) || !isFinite(h) || w < 320 || h < 360 || w > 4000 || h > 4000) return null;
  const out = { w: w, h: h };
  const x = Math.round(Number(g.x));
  const y = Math.round(Number(g.y));
  if (isFinite(x) && isFinite(y) && x >= 0 && y >= 0 && x < 10000 && y < 10000) { out.x = x; out.y = y; }
  return out;
}

/** In the compact pop-out only: persist the window's size + position to
 *  localStorage.umsPopoutGeom (debounced on resize, flushed on unload) so the
 *  next pop-out launch restores it. No-op outside compact mode. localStorage is
 *  shared across the same-origin windows, so popOutCurrentView (in EITHER
 *  window) reads what the pop-out last wrote. */
function popoutPersistGeometryInit_() {
  if (!COMPACT_MODE) return;
  // Persist under THIS pop-out's tool key (captured at boot from the tool it
  // was opened for) so each tool's window remembers its own size/position,
  // even if the rep navigates to another tool inside it.
  const key = 'umsPopoutGeom_' + popoutToolKey_(currentView);
  const save = function () {
    try {
      localStorage.setItem(key, JSON.stringify({
        w: window.outerWidth, h: window.outerHeight,
        x: window.screenX, y: window.screenY,
      }));
    } catch (e) { /* private mode — geometry just won't persist */ }
  };
  let t;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(save, 400); });
  window.addEventListener('beforeunload', save);
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="state-center" role="alert">
      <div class="state-icon" style="color:var(--warn)">${icon('warning', 44)}</div>
      <div class="state-title">Couldn't Load</div>
      <div class="state-detail">${esc(msg)}</div></div>`;
}

// ── "What's new" panel (#4, INV-152) ────────────────────────────────────────
// A dismissible changelog overlay rendering the operator's designated KB
// article (Script Property WHATSNEW_KB_ID) via kbMd_ — same escape boundary
// as every Reference article. F1 (cycle 10): the panel does NOT auto-open —
// per the 2026-07-09 operator decision, updates surface as Dashboard greeting
// slides and the server stamp vs the umsWhatsNew seen-stamp only gates the
// NEW accent on them; opening is always user-initiated (slide click / star);
// dismissal by ANY path (Got it, X, Esc, backdrop) stamps seen. A star button
// joins the sidebar theme row to reopen it anytime. Never in the compact
// pop-out; defers to the onboarding tour on a first-ever load.
var WHATSNEW_LS_KEY = 'umsWhatsNew';
var WHATSNEW_STATE = null;   // last getWhatsNew payload (null until fetched)

/** Pure — is this content stamp UNSEEN for the stored blob? Corrupt/absent
 *  blob → true (never seen); empty stamp → false (nothing to compare).
 *  Operator feedback 2026-07-09: this no longer gates an auto-open panel — it
 *  gates the "NEW" accent on the Dashboard greeting-carousel update slides
 *  (the panel is now reached by clicking a slide / the sidebar star).
 *  Node-pinned. */
function whatsNewShouldShow_(storedRaw, stamp) {
  if (!stamp) return false;
  var p = {};
  try { p = JSON.parse(storedRaw) || {}; } catch (e) { p = {}; }
  return p.seenStamp !== stamp;
}

/** Pure — extract carousel-sized update lines from the What's-new article's
 *  markdown: top-level list items (`- ` / `* ` / `1. `), inline markdown
 *  stripped down to plain text (links keep their text), each clamped to
 *  `maxLen` chars, at most `maxItems` items. An article with NO list items
 *  falls back to its first non-heading paragraph line (one slide).
 *  Node-pinned. */
function whatsNewItems_(bodyMd, maxItems, maxLen) {
  maxItems = maxItems || 8;
  maxLen = maxLen || 140;
  var strip = function (s) {
    return String(s || '')
      .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')      // images → alt
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')       // links → text
      .replace(/[*_`~]/g, '')                         // emphasis/code marks
      .replace(/\s+/g, ' ').trim();
  };
  var out = [];
  var lines = String(bodyMd || '').split(/\r?\n/);
  for (var i = 0; i < lines.length && out.length < maxItems; i++) {
    var m = lines[i].match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)$/);
    if (!m) continue;
    var t = strip(m[1]);
    if (!t) continue;
    if (t.length > maxLen) t = t.substring(0, maxLen - 1) + '…';
    out.push(t);
  }
  if (!out.length) {
    for (var j = 0; j < lines.length; j++) {
      var raw = lines[j].trim();
      if (!raw || raw.charAt(0) === '#') continue;
      var p = strip(raw);
      if (!p) continue;
      if (p.length > maxLen) p = p.substring(0, maxLen - 1) + '…';
      out.push(p);
      break;
    }
  }
  return out;
}

function whatsNewInit_() {
  if (COMPACT_MODE) return;   // never in the pop-out (the tour rule)
  try {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.none || !res.bodyMd) return;
        WHATSNEW_STATE = res;
        whatsNewRenderSidebarBtn_();
        // Operator feedback 2026-07-09 — updates surface as rotating slides in
        // the Dashboard greeting bar (clkGreetRot*) instead of an auto-opened
        // panel; clicking a slide (or the sidebar star) opens the full panel,
        // whose dismissal stamps the seen-flag (clears the NEW accent).
        if (typeof clkGreetRotRefresh_ === 'function') clkGreetRotRefresh_();
      })
      .withFailureHandler(function () {})   // dormant on any failure
      .getWhatsNew();
  } catch (e) {}
}

/** Small star button in the sidebar theme row (next to the pop-out button) —
 *  renders only when a What's new article is configured; reopens the panel. */
function whatsNewRenderSidebarBtn_() {
  try {
    // D11 (cycle 10): render the star into BOTH the sidebar controls AND the
    // mobile header's .hdr-right — on mobile the sidebar node still EXISTS
    // (merely display:none), so a query-with-fallback always found the hidden
    // sidebar and the panel was unreachable there (only the Dashboard
    // greeting slides linked it). CSS hides whichever container the active
    // layout hides, so exactly one star is visible.
    [['sb-whatsnew-btn', '.sb-theme-controls'], ['hdr-whatsnew-btn', '.hdr-right']].forEach(function (pair) {
      if (document.getElementById(pair[0])) return;
      var host = document.querySelector(pair[1]);
      if (!host) return;
      var btn = document.createElement('button');
      btn.type = 'button';

      btn.className = 'sb-popout-btn';

      host.appendChild(btn);
    });
  } catch (e) {}
}

function whatsNewOpen_() {
  var res = WHATSNEW_STATE;
  if (!res) return;
  var ov = ensureOverlay('whatsnew-overlay', { onClose: whatsNewClose_ });
  var bodyHtml = (typeof kbMd_ === 'function')
    ? kbMd_(res.bodyMd)

  ov.innerHTML =
    '<div class="modal" style="max-width:560px" onclick="event.stopPropagation()">' +
      '<div class="modal-title">' + icon('star', 15) + ' ' + esc(res.title) + '</div>' +
      '<div class="kb-article" style="max-height:60vh;overflow-y:auto;margin-top:8px">' + bodyHtml + '</div>' +
      '<div class="modal-footer">' +

/** Idempotent (the ensureOverlay onClose contract) — stamps seen + hides. */
function whatsNewClose_() {
  try {
    if (WHATSNEW_STATE && WHATSNEW_STATE.stamp) {

function renderShell(state) {

  const popOutBtn = COMPACT_MODE ? '' : `

  const instanceBanner = state.instanceLabel

  document.getElementById('app').innerHTML = `

/** Round 2 · 8a — Restorable, drag-resizable sidebar. Snaps between
 *  icon-only (56px) and labeled (168px) widths; drag freely in between.
 *  Persisted to localStorage.umsSidebarW so the rep's chosen width
 *  survives reload. */
const SIDEBAR_MIN = 56, SIDEBAR_MAX = 280, SIDEBAR_SNAP_THRESHOLD = 100, SIDEBAR_DEFAULT = 168, SIDEBAR_ICON_ONLY = 56;
function initResizableSidebar_() {
  const sb = document.querySelector('.sidebar');
  const grip = document.getElementById('sidebar-grip');
  if (!sb || !grip) return;
  // Restore persisted width on boot
  try {
    const stored = parseInt(localStorage.getItem('umsSidebarW'), 10);
    if (stored && stored >= SIDEBAR_MIN && stored <= SIDEBAR_MAX) {
      applySidebarWidth_(sb, stored);
    }
  } catch (e) { /* localStorage unavailable — stay default */ }

  let dragging = false, startX = 0, startW = 0;
  grip.addEventListener('mousedown', (e) => {
    dragging = true;
    startX = e.clientX;
    startW = sb.getBoundingClientRect().width;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const w = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, startW + (e.clientX - startX)));
    applySidebarWidth_(sb, w);
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    try { localStorage.setItem('umsSidebarW', String(Math.round(sb.getBoundingClientRect().width))); }
    catch (e) {}
  });
  grip.addEventListener('dblclick', () => {
    const cur = sb.getBoundingClientRect().width;
    // Snap to the OTHER preset — below the threshold goes to labeled, at/above goes to icon-only
    const next = cur < SIDEBAR_SNAP_THRESHOLD ? SIDEBAR_DEFAULT : SIDEBAR_ICON_ONLY;
    applySidebarWidth_(sb, next);
    try { localStorage.setItem('umsSidebarW', String(next)); } catch (e) {}
  });
}

function applySidebarWidth_(sb, w) {
  sb.style.setProperty('--sidebar-w', w + 'px');
  // Also set on documentElement so the .app-shell grid (which reads --sidebar-w)
  // picks up the new column width — the sb element's --sidebar-w is for any
  // descendants that need it, but the grid container is a sibling.
  document.documentElement.style.setProperty('--sidebar-w', w + 'px');
  sb.classList.toggle('collapsed', w < SIDEBAR_SNAP_THRESHOLD);
}

/** Open a tool — top-level navigation from the sidebar. Renders the tab bar
 *  and dispatches to the chosen tab (or the tool's defaultTab if none given,
 *  or the URL ?tab=<k> on initial boot). Non-manager users skip managerOnly
 *  tabs and fall through to the default. */
function enterTool(toolKey, tabKey) {
  const tool = TOOLS[toolKey];
  if (!tool) return;
  // If every tab in this tool is gated away for the user (e.g. a non-manager
  // deep-linking ?tool=manage, or a stale umsLastView), redirect home rather
  // than render an empty tab bar.
  if (!toolVisibleForUser_(toolKey)) {
    if (toolKey !== 'timeClock') enterTool('timeClock', 'clock');
    return;
  }
  // Update sidebar/mobile-nav active state
  document.querySelectorAll('.sb-link[data-tool], .nav-btn[data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === toolKey);
  });
  // Swap the sidebar sub-label
  const lbl = document.getElementById('sb-tool-label');
  if (lbl) lbl.textContent = tool.label;
  // Render the tab bar for this tool
  renderToolTabBar(toolKey);
  // Resolve the desired tab — explicit > default. Skip managerOnly for non-managers.
  let chosen = tabKey && tool.tabs[tabKey] ? tabKey : tool.defaultTab;
  // A gated tab the user can't see (managerOnly/adminOnly, no `also`) bumps to
  // the tool's default — or, if the default is itself gated away, the first
  // tab the user CAN see in this tool (the tool is visible, so one exists).
  if (!tabVisibleForUser_(tool.tabs[chosen])) {
    chosen = tool.defaultTab;
    if (!tabVisibleForUser_(tool.tabs[chosen])) {
      chosen = Object.keys(tool.tabs).find(k => tabVisibleForUser_(tool.tabs[k])) || chosen;
    }
  }
  showView(chosen);
}

// ── Shared cross-tool nav hint ──────────────────────────────────────────────
// A generic one-shot hint set before enterTool(...) so a destination view can
// surface the source context (and optionally prefill). Distinct from the
// coverage-strip-specific CLK_NAV_HINT. Today's only producer is the Spanish
// Inbox tool-suggestion chips (source:'spanishInbox'); the destination consumers
// are the Call Notes Log + the three Intake views. One-shot: the consumer nulls
// it via appTakeNavHint_ so a later view enter can't re-fire a stale banner.
window.APP_NAV_HINT = null;

/** Take (read + null) the pending hint iff it targets `toolKey`; else null. */
function appTakeNavHint_(toolKey) {
  const h = window.APP_NAV_HINT;
  if (!h || h.source !== 'spanishInbox' || h.tool !== toolKey) return null;
  window.APP_NAV_HINT = null;
  return h;
}

/** Dismissible context banner HTML for a consumed nav hint. */
function appNavHintBannerHtml_(hint) {
  if (!hint) return '';
  const from = hint.requester ? '<span class="nav-hint-from">' + esc(hint.requester) + '</span>' : '';
  const subj = hint.subject ? '<div class="nav-hint-subj">' + esc(hint.subject) + '</div>' : '';
  const snip = hint.snippet ? '<div class="nav-hint-snip">' + esc(hint.snippet) + '</div>' : '';
  const gmail = hint.permalink
    ? '<a class="nav-hint-link" href="' + esc(hint.permalink) + '" target="_blank" rel="noopener">' + icon('mail', 12) + ' Open in Gmail</a>'
    : '';
  return '<div class="nav-hint-banner" id="app-nav-hint">' +
      '<div class="nav-hint-main">' +
        '<span class="nav-hint-kicker">' + icon('outbox', 12) + ' From Spanish Inbox' + (from ? ' · ' : '') + '</span>' + from +
        subj + snip +
      '</div>' +
      '<div class="nav-hint-actions">' + gmail +
        '<button class="nav-hint-x" title="Dismiss" onclick="appDismissNavHint_()" aria-label="Dismiss">' + icon('x', 14) + '</button>' +
      '</div>' +
    '</div>';
}

/** Prepend the context banner to `container` (idempotent — replaces any prior). */
function appShowNavHintBanner_(hint, container) {
  if (!hint || !container) return;
  appDismissNavHint_();
  const wrap = document.createElement('div');
  wrap.innerHTML = appNavHintBannerHtml_(hint);
  const banner = wrap.firstElementChild;
  if (banner) container.insertBefore(banner, container.firstChild);
}

function appDismissNavHint_() {
  const el = document.getElementById('app-nav-hint');
  if (el) el.remove();
}

/** Re-render the tab bar above the view area for the given tool.
 *  Hides managerOnly tabs from non-managers. */
function renderToolTabBar(toolKey) {
  const tool = TOOLS[toolKey];
  const bar = document.getElementById('tool-tab-bar');
  if (!bar || !tool) return;
  const tabs = Object.keys(tool.tabs).filter(k => tabVisibleForUser_(tool.tabs[k]));
  bar.innerHTML = tabs.map(k => {
    const t = tool.tabs[k];
    // Privileged (managerOnly/adminOnly) tabs get a subtle upward accent gradient
    // + a small marker glyph so managers/admins can tell at a glance which tabs
    // are the privileged surfaces. Suppress the marker for a non-manager who
    // reached a managerOnly tab via an `also` flag (e.g. a Spanish rep on
    // metricsSpanish) — for them it's just their tab, not a privileged surface.
    const showMgrMark = (t.managerOnly && empState && empState.isManager) ||
      (t.adminOnly && empState && empState.isAdmin);
    const mgrCls = showMgrMark ? ' tt-mgr' : '';
    const mgrMark = showMgrMark
      ? `<span class="tt-mgr-mark" title="${t.adminOnly ? 'Admin-only' : 'Manager-only'}">${icon('manage', 10)}</span>`
      : '';
    return `<button class="tt-btn${mgrCls}" data-tab="${k}" onclick="showView('${k}')">
      <span class="tt-icon">${icon(t.icon, 14)}</span>${esc(t.label)}${mgrMark}
    </button>`;
  }).join('');
}

/** Dispatch to a specific tab's enter handler. The active tab's button gets
 *  `.active`. Used by both enterTool (initial render) and tab-button clicks. */
function showView(view) {
  const toolKey = VIEW_TO_TOOL[view];
  if (!toolKey) return;
  // F8 (defense-in-depth): showView is the low-level dispatch reached by direct
  // callers (drill-throughs, ?tool deep-links, umsLastView restore, tab-bar
  // clicks) — not just via enterTool, which already resolves a VISIBLE tab. A
  // direct call for a tab the user can't see (managerOnly/adminOnly, no `also`)
  // would otherwise run its enter-handler. Route it back through enterTool, which
  // bumps to the tool's first visible tab (or home if the whole tool is gated).
  // No recursion loop: enterTool re-enters showView with a visible tab, which
  // passes this guard. (Server endpoints still re-gate — this is UI-only.)
  const _tab = TOOLS[toolKey] && TOOLS[toolKey].tabs[view];
  if (_tab && !tabVisibleForUser_(_tab)) { enterTool(toolKey); return; }
  if (toolKey !== 'callNotes' && typeof cnStopAmbientPolling_ === 'function') cnStopAmbientPolling_();
  // F(cycle-8): symmetric START on any CN tab — the poller used to start only
  // from the Log enter, so a deep-link/refresh-restore into another CN tab
  // left the stale-flag badge + feature-flag propagation off. Idempotent
  // (a live timer is untouched), so CN-internal hops cost nothing extra.
  if (toolKey === 'callNotes' && typeof cnStartAmbientPolling_ === 'function') cnStartAmbientPolling_();
  // KB drawer (shell capability): close on any navigation + toggle its
  // right-edge tab for the mid-task tools (Call Notes / Intake).
  if (typeof kbDrawerOnNavigate_ === 'function') kbDrawerOnNavigate_(view);
  // Intake draft flush (M-2): a pending debounced draft save is flushed NOW,
  // while the outgoing view's DOM still exists — otherwise the 400ms timer
  // fires against a torn-down form and the keystroke (or, pre-fix, the whole
  // draft) is lost. No-op when nothing is pending.
  if (typeof intakeFlushDraftNow_ === 'function') intakeFlushDraftNow_();
  currentView = view;
  // Refresh-restore: remember the active tab so a reload lands back here.
  // D8 (cycle 10): NOT in the compact pop-out — localStorage is shared
  // same-origin, so navigation inside a pinned pop-out (the operator's
  // documented primary workflow) overwrote the MAIN window's restore tab;
  // a later main-window refresh landed on the pop-out's last tab instead of
  // the mid-note Log view the feature exists to restore. Pop-out boots
  // always carry ?tool= and never read this key, so skipping the write
  // loses nothing.
  if (!COMPACT_MODE) { try { localStorage.setItem('umsLastView', view); } catch (e) {} }
  // Tab bar active state
  document.querySelectorAll('.tt-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === view);
  });
  const area = document.getElementById('view-area');
  if (!area) return;
  // 2nd-pass motion §1 — fade+rise the rendered CONTENT (not the loading
  // spinner). Hooked HERE at the single navigation entry point: a one-shot
  // observer waits past the full-view loader and reveals on the first real
  // content swap, then disconnects. Optimistic re-renders call their render fns
  // directly (never showView), so they can't re-trigger this mid-interaction.
  const fireReveal = function () {
    area.classList.remove('view-enter'); void area.offsetWidth; area.classList.add('view-enter');
  };
  // "Loading-only" = the full-view spinner (renderLoading sets a single
  // .state-center child). We wait past that and animate the content that lands.
  const isLoadingOnly = function () {
    return area.children.length === 1 && area.firstElementChild &&
      area.firstElementChild.classList && area.firstElementChild.classList.contains('state-center');
  };
  if (area._revealObs) { area._revealObs.disconnect(); area._revealObs = null; }
  if (typeof MutationObserver !== 'undefined') {
    const obs = new MutationObserver(function () {
      if (isLoadingOnly()) return;
      fireReveal();
      obs.disconnect(); area._revealObs = null;
    });
    area._revealObs = obs;
    obs.observe(area, { childList: true });
  }
  // D13 (cycle 10): release the SHARED reveal observer's references to the
  // outgoing view's [data-reveal] nodes before the enter handler rewrites
  // #view-area — MOTION_IO is page-lifetime and observeReveals() ran on every
  // render, so it accumulated strong refs to detached DOM for the whole
  // session (worst in long-lived pinned pop-outs). Memory-only; the sibling
  // per-nav _revealObs was already disconnected above.
  if (MOTION_IO) {
    try { area.querySelectorAll('[data-reveal]').forEach(function (el) { MOTION_IO.unobserve(el); }); } catch (e) {}
  }
  const enterFn = window[TOOLS[toolKey].tabs[view].enter];
  if (typeof enterFn === 'function') enterFn(area);
  // Synchronous renders set content before the observer's first async callback —
  // reveal now and cancel the observer to avoid a double-fire.
  if (area.children.length && !isLoadingOnly()) {
    fireReveal();
    if (area._revealObs) { area._revealObs.disconnect(); area._revealObs = null; }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// View instant-paint (stale-while-revalidate). The pain on tab-switching is the
// Apps Script RPC round-trip (~300–800ms) re-fired on every view enter even when
// the data was just fetched. Views that keep their last payload in module state
// can repaint instantly from it and refresh in the background, showing a subtle
// "Refreshing…" pill instead of a full spinner. `viewCacheFresh_` is the pure
// TTL decision (Node-pinned); each view owns its own keyed payload cache + the
// freshness stamp. Default window is short — instant on a quick back-and-forth,
// always-fresh after that (consistent with the app's ≤5-min staleness elsewhere).
// ─────────────────────────────────────────────────────────────────────────────
var VIEW_CACHE_TTL_MS = 45000;

/** Pure: is a {at:<ms>} cache entry still within `ttlMs` of `nowMs`? A future or
 *  malformed stamp is treated as not-fresh (fail-safe → normal fetch). */
function viewCacheFresh_(entry, ttlMs, nowMs) {
  if (!entry || typeof entry.at !== 'number') return false;
  if (typeof ttlMs !== 'number') ttlMs = VIEW_CACHE_TTL_MS;
  if (typeof nowMs !== 'number') nowMs = Date.now();
  var age = nowMs - entry.at;
  return age >= 0 && age <= ttlMs;
}

/** Toggle a subtle bottom-right "Refreshing…" pill while a stale-while-revalidate
 *  background fetch runs. Idempotent; the pill is appended to #view-area so a
 *  content re-render that replaces #view-area's innerHTML also clears it. */
function viewRefreshingPill_(on) {
  var area = document.getElementById('view-area');
  if (!area) return;
  var pill = document.getElementById('view-refreshing-pill');
  if (on) {
    if (pill) return;
    pill = document.createElement('div');
    pill.id = 'view-refreshing-pill';
    pill.className = 'view-refreshing';
    pill.setAttribute('aria-live', 'polite');
    pill.textContent = 'Refreshing…';
    area.appendChild(pill);
  } else if (pill) {
    pill.remove();
  }
}

/** 2nd-pass motion — one shared IntersectionObserver for scroll-into-view
 *  reveals. A tool calls observeReveals(container) after render; any
 *  descendant carrying `.js-anim` re-fires its CSS animation when the
 *  container scrolls ~35% into view (so below-the-fold content animates when
 *  seen, not before). No-ops where IntersectionObserver is unavailable or the
 *  user prefers reduced motion (the CSS block already neutralizes durations). */
var MOTION_IO = (typeof IntersectionObserver !== 'undefined')
  ? new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.querySelectorAll('.js-anim').forEach(function (el) {
          el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
        });
      });
    }, { threshold: 0.35 })
  : null;
function observeReveals(container) {
  if (!MOTION_IO || !container) return;
  if (container.matches && container.matches('[data-reveal]')) MOTION_IO.observe(container);
  if (container.querySelectorAll) {
    container.querySelectorAll('[data-reveal]').forEach(function (el) { MOTION_IO.observe(el); });
  }
}

/** 2nd-pass motion §6 — settle a row in place on a mutation (mark-complete /
 *  resolve / accept): dim + tint, strike the label, draw a check. Keeps the row
 *  (good for context / undo affordance). Options:
 *    labelSel  — optional selector for the text to strike through
 *    opts.dim       (default true)  — apply the .done dim + strike
 *    opts.check     (default true)  — inject + draw a check glyph
 *    opts.transient (default false) — auto-remove the classes/glyph after holdMs
 *    opts.holdMs    (default 1100)  — transient lifetime
 *  Idempotent — re-calling won't stack checks. */
function settleRow_(row, labelSel, opts) {
  opts = opts || {};
  if (!row || !row.classList) return;
  var dim = opts.dim !== false;
  var check = opts.check !== false;
  row.classList.add('mc');
  if (labelSel) {
    var label = row.querySelector(labelSel);
    if (label) label.classList.add('mc-label');
  }
  if (check && !row.querySelector('.ck-wrap')) {
    var span = document.createElement('span');
    span.className = 'ck-wrap';
    span.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="ck" d="M5 13l4 4L19 7"/></svg>';
    row.appendChild(span);
  }
  row.classList.add(dim ? 'done' : 'checked');   // .done dims+draws; .checked only draws
  if (opts.transient) {
    setTimeout(function () {
      row.classList.remove('mc', 'done', 'checked');
      if (labelSel) { var l = row.querySelector(labelSel); if (l) l.classList.remove('mc-label'); }
      var ck = row.querySelector('.ck-wrap'); if (ck && ck.parentNode) ck.parentNode.removeChild(ck);
    }, opts.holdMs || 1100);
  }
}

/** §6 — clear a settle applied by settleRow_ (e.g. an accept→reject change). */
function unsettleRow_(row, labelSel) {
  if (!row || !row.classList) return;
  row.classList.remove('mc', 'done', 'checked');
  if (labelSel) { var l = row.querySelector(labelSel); if (l) l.classList.remove('mc-label'); }
  var ck = row.querySelector('.ck-wrap'); if (ck && ck.parentNode) ck.parentNode.removeChild(ck);
}

/** 2nd-pass motion §4 — count-up tween a number element from 0 to target
 *  (ease-out cubic, ~700ms via rAF). Respects reduced motion (jumps straight).
 *  Recaptures start per run so a backgrounded tab doesn't make it snap. */
function countUp_(el, target, ms) {
  if (!el) return;
  target = Number(target) || 0;
  ms = ms || 700;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.textContent = String(target); return;
  }
  if (typeof requestAnimationFrame !== 'function') { el.textContent = String(target); return; }
  var start = null;
  function tick(t) {
    if (start === null) start = t;
    var p = Math.min(1, (t - start) / ms);
    var eased = 1 - Math.pow(1 - p, 3);
    el.textContent = String(Math.round(target * eased));
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = String(target);
  }
  requestAnimationFrame(tick);
}

/** 2nd-pass motion §7 — flash a copy button on success (also aids ⌘C
 *  discoverability). One-shot: re-arm the class, then clear it. */
function flashCopied(el) {
  if (!el || !el.classList) return;
  el.classList.remove('copied'); void el.offsetWidth; el.classList.add('copied');
  setTimeout(function () { el.classList.remove('copied'); }, 800);
}

/** 2nd-pass loader Role C — a thin indeterminate sweep bar for in-place
 *  refreshes (content stays visible / a panel is reloading). Returns markup. */
function loSweep() { return '<div class="lo-sweep" role="status" aria-label="Loading"></div>'; }
/** 2nd-pass loader Role B — skeleton rows shaped like a note/list row
 *  (avatar circle + two text bars). Cross-fades to real content on arrival. */
function loSkeleton(rows) {
  rows = rows || 3;
  var out = '<div class="skel-wrap" role="status" aria-label="Loading">';
  for (var i = 0; i < rows; i++) {
    out += '<div class="skel-row"><div class="skel skel-avatar"></div>' +
      '<div class="skel-lines"><div class="skel skel-bar" style="width:70%"></div>' +
      '<div class="skel skel-bar" style="width:45%"></div></div></div>';
  }
  return out + '</div>';
}

// ── Time Clock tab enter handlers ───────────────────────────────────────
//  Each tab's enter handler receives the view-area element and does whatever
//  setup the tab needs (data load, ticker start, etc.). The Clock tab's
//  combined Clock+Timesheet enter handler (enterClockCombinedView) lives in
//  tc/script_clock.html since it composes that partial's render functions.
function enterTimeoffView(area) {
  // F(cycle-8 H-1): the calLoadError_ Retry button calls this with NO args —
  // renderLoading(undefined) threw (into the error beacon) and the retry path
  // was dead. Re-resolve the view area, the enterCoverageView pattern.
  area = area || document.getElementById('view-area');
  if (!area) return;
  stopClock();
  if (!calYear) {
    const todayInTz = isoDateTz(empTz());
    const parts = todayInTz.split('-');
    calYear = parseInt(parts[0], 10);
    calMonth = parseInt(parts[1], 10);
  }
  renderLoading(area, 'Loading calendar…', 'clock');
  loadCalendar(calYear, calMonth);
}
function enterManagerView(area) {
  // F(cycle-8 H-1): same — mgrLoadError_'s Retry button calls this argless.
  area = area || document.getElementById('view-area');
  if (!area) return;
  stopClock();
  renderLoading(area, 'Loading dashboard…', 'clock');
  loadManagerDashboard();
}

function renderLoading(area, label, iconName) {
  // 2nd-pass loaders_and_motion.md Role A — full-view enter shows the module's
  // own glyph, pulsing, + a mono label. When no iconName is passed (legacy
  // 2-arg callers) keep the spinner so behavior is unchanged.
  const mark = iconName
    ? `<span class="lo-glyph">${icon(iconName, 30)}</span>`
    : `<div class="spinner"></div>`;
  area.innerHTML = `<div class="state-center" role="status">${mark}
    <div class="state-label">${esc(label)}</div></div>`;
}

/** Refresh helper for mutation success handlers: shows the view-area loading
 *  state + runs the reload ONLY if the user is still on the view the mutation
 *  belongs to. Without the guard, a nav-away during the RPC got its NEW view
 *  wiped to a spinner that nothing ever replaced (the follow-up data loader
 *  is currentView-guarded, so the spinner stuck until the next tab click).
 *  Skipping entirely is correct — every tab's enter handler reloads fresh. */
function refreshViewIfCurrent(viewKey, loadingMsg, reloadFn) {
  if (currentView !== viewKey) return;
  // Role-A parity (2nd-pass loaders spec): pass the owning tool's glyph so a
  // mutation-refresh shows the same loader as the tab's own enter handler
  // (previously icon-less → the legacy spinner leaked back in).
  var tool = (typeof VIEW_TO_TOOL === 'object' && VIEW_TO_TOOL[viewKey]) || null;
  var glyph = (tool && TOOLS[tool] && TOOLS[tool].sidebarIcon) || null;
  renderLoading(document.getElementById('view-area'), loadingMsg, glyph);
  reloadFn();
}

/** Employee's timezone (falls back to Asia/Kolkata pre-login or if missing). */
function empTz() { return (empState && empState.timezone) || 'Asia/Kolkata'; }

/** Current date as yyyy-MM-dd in the given timezone. */
function isoDateTz(tz) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());
}

/** Current time as HH:mm (24-hr) in the given timezone. */
function timeHmTz(tz) {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
  }).format(new Date());
}

/** Live clock display "h:mm:ss AM/PM" in the given timezone. */
function liveTimeTz(tz) {
  return new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: 'numeric', minute: '2-digit', second: '2-digit',
  }).format(new Date());
}

/** Today's date label "Saturday, May 17" in the given timezone. */
function dateLabelTz(tz) {
  return new Intl.DateTimeFormat('en-US', {
    timeZone: tz, weekday: 'long', month: 'short', day: 'numeric',
  }).format(new Date());
}

function deriveShiftStatus(nextActions, punches) {
  if (!punches || punches.length === 0) return 'idle';
  if (nextActions.length === 1 && nextActions[0] === 'Adjust') return 'done';
  return punches[punches.length-1].type === 'LunchOut' ? 'lunch' : 'active';
}

function dispTime(t) {
  if (!t) return '';
  const p = String(t).split(':');
  // F10 — the formatted branch returns digits/AM-PM (innerHTML-safe), but the
  // malformed fallback returned the raw value verbatim and several callers inject
  // dispTime() output via innerHTML. esc() the fallback so a garbage time cell
  // can't reflect unescaped (defense-in-depth — server times are shape-constrained).
  if (p.length < 2) return esc(String(t));
  const h = parseInt(p[0],10);
  // D9 (cycle 10): the F10 fix covered only the no-colon fallback — garbage
  // WITH a colon flowed p[1] (everything after the first colon, raw) into the
  // formatted branch unescaped. esc() the minutes segment too, completing
  // F10's own rationale ("a garbage time cell can't reflect unescaped").
  return `${h%12||12}:${esc(String(p[1]))} ${h>=12?'PM':'AM'}`;
}

function fmtHrs(h) {
  if (h === null || h === undefined) return '--';
  const hrs = Math.floor(h), mins = Math.round((h - hrs) * 60);
  return mins > 0 ? `${hrs}h ${mins}m` : `${hrs}h`;
}

/** Short hours format for badges/calendar cells: 8 → "8h", 8.5 → "8.5h". */
function formatHoursShort(h) {
  if (h === null || h === undefined || isNaN(Number(h))) return '';
  const n = Number(h);
  return n % 1 === 0 ? `${n}h` : `${n.toFixed(1)}h`;
}

function isoDate(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function pad(n) { return String(n).padStart(2,'0'); }

/** Calendar-day distance between two yyyy-MM-dd strings, positive if laterIso > earlierIso. */
function daysBetweenIso(earlierIso, laterIso) {
  return Math.round(
    (new Date(laterIso + 'T00:00:00Z') - new Date(earlierIso + 'T00:00:00Z')) / 86400000
  );
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Shared sortable data table (.m-table) ──────────────────────────────────
// One config-driven renderer for the Metrics team table AND the Call Notes
// manager Stats table (deferred #1 — they were two near-identical hand-rolled
// tables). Uses the .m-table vocabulary from the Metrics partial (loaded
// globally). opts:
//   columns: [{ key, label, numeric?, name?, sortable?, cell(row) }]
//            cell(row) returns the <td> INNER html and MUST esc() its own
//            dynamic content (escaping stays the caller's responsibility — the
//            component only esc()s the static header labels).
//   rows:    array (caller pre-sorts; the component does not sort)
//   sort:    { key, dir } current sort (for the active-column caret) — optional
//   onSort:  global fn name called as onSort('<colKey>') on a sortable header click
//   empty:   html shown when rows is empty
function mtRenderTable_(opts) {
  opts = opts || {};
  var cols = opts.columns || [];
  var rows = opts.rows || [];
  if (!rows.length) return opts.empty || '<div class="m-empty">No data.</div>';
  var sort = opts.sort || {};
  var thead = cols.map(function (c) {
    var caret = (sort.key === c.key) ? '<span class="m-caret">' + (sort.dir === 'asc' ? '▲' : '▼') + '</span>' : '';
    var clsList = [];
    if (c.numeric) clsList.push('m-num');
    if (c.sortable && opts.onSort) clsList.push('m-sortable');
    var clsAttr = clsList.length ? ' class="' + clsList.join(' ') + '"' : '';
    // A11y batch H: sortable headers are keyboard-activatable (tabindex +
    // Enter/Space) and announce sort state via aria-sort on the columnheader.
    var interactive = '';
    if (c.sortable && opts.onSort) {
      var call = opts.onSort + '(\'' + esc(c.key) + '\')';
      var ariaSort = (sort.key === c.key)
        ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
      interactive = ' tabindex="0" aria-sort="' + ariaSort + '"' +
        ' onclick="' + call + '"' +
        ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' + call + '}"';
    }
    return '<th scope="col"' + clsAttr + interactive + '>' + esc(c.label) + caret + '</th>';
  }).join('');
  var body = rows.map(function (r) {
    // Optional per-row class (e.g. tone tint) — additive; existing callers that
    // don't pass opts.rowClass render an unclassed <tr> exactly as before.
    var rc = opts.rowClass ? opts.rowClass(r) : '';
    return '<tr' + (rc ? ' class="' + esc(rc) + '"' : '') + '>' + cols.map(function (c) {
      var tdCls = c.numeric ? ' class="m-num"' : (c.name ? ' class="m-name"' : '');
      return '<td' + tdCls + '>' + (c.cell ? c.cell(r) : '') + '</td>';
    }).join('') + '</tr>';
  }).join('');
  return '<div class="m-table-wrap"><table class="m-table"><thead><tr>' + thead +
    '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

// ── Runtime feature toggles ────────────────────────────────────────────
// Reads a resolved feature-flag value delivered by the server on
// empState.flags (shell-wide, loaded first) or CN_STATE.deptConfig.flags
// (Call Notes). Fails OPEN (true) ONLY while no flag map has loaded yet (boot
// grace — server-scope kill-switches are enforced server-side regardless).
// Once any map has loaded, an UNKNOWN key fails CLOSED (false), matching the
// server's getFlag_ semantics — a typo'd client key should hide gated UI, not
// show it (L8: the old code fell through to `true` even after the maps
// loaded, contradicting this comment). A flag flipped in Admin reaches the
// client on its next config fetch (page load / view enter / ambient poll).
function flagOn_(key) {
  try {
    var maps = [
      (typeof empState !== 'undefined' && empState && empState.flags),
      (typeof CN_STATE !== 'undefined' && CN_STATE && CN_STATE.deptConfig && CN_STATE.deptConfig.flags),
    ];
    var anyLoaded = false;
    for (var i = 0; i < maps.length; i++) {
      if (!maps[i]) continue;
      anyLoaded = true;
      if (Object.prototype.hasOwnProperty.call(maps[i], key)) return maps[i][key] === true;
    }
    if (anyLoaded) return false;
  } catch (e) {}
  return true;
}

// ── Toast stack ────────────────────────────────────────────────────────
// Stackable, auto-dismissing toasts with semantic variants.
// API: showToast(message, 'toast-success' | 'toast-error' | 'toast-warn' | undefined)
function showToast(msg, cls) {
  const stack = document.getElementById('toast-stack');
  if (!stack) return;
  // Normalize the variant: most callers pass the full class
  // ('toast-success'/'toast-error'/'toast-warn'/'toast-info'), but Training /
  // EmpDocs pass bare names ('success'/'error'/'warn'/'info'). Without this,
  // bare names render with no colored rail and fall through to the info glyph.
  cls = /^toast-/.test(cls) ? cls : (cls ? 'toast-' + cls : '');
  // Pick the SVG glyph that matches the variant — checkCircle / xCircle /
  // warning / info. The .toast-icon CSS tints each per variant.
  const iconName = cls === 'toast-success' ? 'checkCircle'
                 : cls === 'toast-error'   ? 'xCircle'
                 : cls === 'toast-warn'    ? 'warning'
                 : 'info';
  // Strip leading emoji/icon from msg if caller prepended (legacy callsites)
  const clean = String(msg).replace(/^[\u2705\u274C\u26A0\uFE0F\u2713\u2717\s]+/, '').trim() || String(msg);
  const t = document.createElement('div');
  t.className = `toast ${cls || ''}`.trim();
  // Errors interrupt (role=alert); everything else rides the stack's
  // aria-live=polite region without double-announcing.
  if (cls === 'toast-error') t.setAttribute('role', 'alert');
  t.innerHTML = `<span class="toast-icon">${icon(iconName, 16)}</span><span class="toast-msg"></span>`;
  t.querySelector('.toast-msg').textContent = clean;
  stack.appendChild(t);
  setTimeout(() => {
    t.classList.add('toast-leave');
    t.addEventListener('animationend', () => t.remove(), { once: true });
  }, 3500);
  // Cap the stack at 5
  while (stack.children.length > 5) stack.firstChild.remove();
}

// ── Custom modal-styled confirm / prompt ──────────────────────────────────
// Unique aria-labelledby ids for stacked dialogs (each dialog names itself).
var _uiDialogSeq = 0;
// Round 2 follow-on — Promise-returning replacements for window.confirm()
// and window.prompt(). Use the app's existing .overlay / .modal vocabulary
// so dialogs match dark mode + the Console redesign aesthetic. Returns:
//   uiConfirm({ ...opts }) → Promise<boolean>
//   uiPrompt({ ...opts })  → Promise<string|null> (null on cancel)
//
// Callsite pattern — replace:
//   if (!confirm('msg')) return;
//   // continue
// with:
//   uiConfirm({ message: 'msg' }).then(function (ok) {
//     if (!ok) return;
//     // continue
//   });
//
// Esc cancels; Enter on a confirm fires OK; Enter inside a prompt input
// also fires OK (submit). Click-outside the modal cancels. The dialog
// auto-focuses (OK button for confirm; the text input for prompt).

function uiConfirm(opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    const overlay = document.createElement('div');
    overlay.className = 'overlay open ui-dialog';
    const dlgTitleId = 'ui-dialog-title-' + (++_uiDialogSeq);
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-labelledby', dlgTitleId);
    const isDanger = opts.tone === 'danger';
    const titleHtml = '<div class="modal-title" id="' + dlgTitleId + '">' + esc(opts.title || 'Confirm') + '</div>';
    const bodyHtml = opts.message
      ? '<div class="ui-dialog-body">' + esc(opts.message).replace(/\n/g, '<br>') + '</div>'
      : '';
    overlay.innerHTML =
      '<div class="modal ui-dialog-modal">'
        + titleHtml
        + bodyHtml
        + '<div class="modal-footer">'
          + '<button type="button" class="btn-modal-cancel ui-dialog-cancel">' + esc(opts.cancelLabel || 'Cancel') + '</button>'
          + '<button type="button" class="btn-modal-ok ui-dialog-ok' + (isDanger ? ' is-danger' : '') + '">' + esc(opts.confirmLabel || 'Confirm') + '</button>'
        + '</div>'
      + '</div>';
    document.body.appendChild(overlay);
    // A11y batch H — hand focus back to the trigger element on close.
    const restoreEl = document.activeElement;
    let resolved = false;
    const cleanup = function (result) {
      if (resolved) return;
      resolved = true;
      document.removeEventListener('keydown', onKey, true);
      overlay.remove();
      try { if (restoreEl && restoreEl.isConnected && restoreEl !== document.body) restoreEl.focus(); } catch (_) {}
      resolve(result);
    };
    const onKey = function (e) {
      // F(cycle-8): only the TOPMOST ui-dialog handles keys. Both dialogs
      // register document-level CAPTURE listeners and stopPropagation can't
      // stop same-node-same-phase siblings — one Escape used to resolve BOTH
      // stacked dialogs (the bottom one with false, cancelling its flow).
      const dlgs = document.querySelectorAll('.overlay.open.ui-dialog');
      if (!dlgs.length || dlgs[dlgs.length - 1] !== overlay) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); cleanup(false); }
      else if (e.key === 'Enter' && !e.shiftKey) {
        // Cycle-9 L-32: the KB drawer is EXEMPT from the dialog focus trap
        // (z-55, above the dialog) and Ctrl/⌘+K still opens it while a dialog
        // is up — an Enter aimed at the drawer's search box used to confirm a
        // danger dialog (delete punch / deny PTO) from a keystroke that never
        // targeted it. Let the drawer keep its Enter.
        if (e.target && e.target.closest && e.target.closest('#kb-drawer')) return;
        // Enter activates the FOCUSED button: a keyboard user who Tabs to
        // Cancel and presses Enter must get cancel — confirming from the
        // Cancel button fired destructive actions (delete punch, deny PTO)
        // before this check. Enter anywhere else = OK (the default action,
        // which also holds initial focus).
        e.preventDefault();
        e.stopImmediatePropagation();
        const onCancel = e.target && e.target.closest && e.target.closest('.ui-dialog-cancel');
        cleanup(!onCancel);
      }
    };
    overlay.querySelector('.ui-dialog-cancel').addEventListener('click', function () { cleanup(false); });
    overlay.querySelector('.ui-dialog-ok').addEventListener('click', function () { cleanup(true); });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) cleanup(false); });
    document.addEventListener('keydown', onKey, true);
    setTimeout(function () {
      const ok = overlay.querySelector('.ui-dialog-ok');
      if (ok) ok.focus();
    }, 30);
  });
}

function uiPrompt(opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    const overlay = document.createElement('div');
    overlay.className = 'overlay open ui-dialog';
    const dlgTitleId = 'ui-dialog-title-' + (++_uiDialogSeq);
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-labelledby', dlgTitleId);
    const titleHtml = '<div class="modal-title" id="' + dlgTitleId + '">' + esc(opts.title || 'Enter value') + '</div>';
    const messageHtml = opts.message
      ? '<div class="ui-dialog-body">' + esc(opts.message).replace(/\n/g, '<br>') + '</div>'
      : '';
    overlay.innerHTML =
      '<div class="modal ui-dialog-modal">'
        + titleHtml
        + messageHtml
        + '<div class="field" style="margin-top:8px">'
          + '<input type="text" class="ui-dialog-input" value="' + esc(opts.initialValue || '') + '" placeholder="' + esc(opts.placeholder || '') + '">'
        + '</div>'
        + '<div class="ui-dialog-err" style="display:none"></div>'
        + '<div class="modal-footer">'
          + '<button type="button" class="btn-modal-cancel ui-dialog-cancel">' + esc(opts.cancelLabel || 'Cancel') + '</button>'
          + '<button type="button" class="btn-modal-ok ui-dialog-ok">' + esc(opts.confirmLabel || 'OK') + '</button>'
        + '</div>'
      + '</div>';
    document.body.appendChild(overlay);
    const input = overlay.querySelector('.ui-dialog-input');
    const errEl = overlay.querySelector('.ui-dialog-err');
    // A11y batch H — hand focus back to the trigger element on close.
    const restoreEl = document.activeElement;
    let resolved = false;
    const cleanup = function (result) {
      if (resolved) return;
      resolved = true;
      document.removeEventListener('keydown', onKey, true);
      overlay.remove();
      try { if (restoreEl && restoreEl.isConnected && restoreEl !== document.body) restoreEl.focus(); } catch (_) {}
      resolve(result);
    };
    const submit = function () {
      const val = input.value;
      if (typeof opts.validator === 'function') {
        const err = opts.validator(val);
        if (err) {
          errEl.textContent = err;
          errEl.style.display = '';
          input.focus();
          return;
        }
      }
      cleanup(val);
    };
    const onKey = function (e) {
      // F(cycle-8): topmost-only, mirroring uiConfirm's stacked-dialog guard.
      const dlgs = document.querySelectorAll('.overlay.open.ui-dialog');
      if (!dlgs.length || dlgs[dlgs.length - 1] !== overlay) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); cleanup(null); }
      else if (e.key === 'Enter' && e.target === input) { e.preventDefault(); e.stopImmediatePropagation(); submit(); }
    };
    overlay.querySelector('.ui-dialog-cancel').addEventListener('click', function () { cleanup(null); });
    overlay.querySelector('.ui-dialog-ok').addEventListener('click', submit);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) cleanup(null); });
    document.addEventListener('keydown', onKey, true);
    setTimeout(function () { input.focus(); input.select(); }, 30);
  });
}

// ── Shared overlay lifecycle ───────────────────────────────────────────────
// Dynamically-created overlays own real state (composer slots, document-level
// listeners). Hiding one by stripping its `open` class — what the Escape
// handler used to do — left it hidden-but-stateful: the Call Notes composers
// re-rendered into the hidden node forever after one Esc, and the Intake
// modal's document-level paste listener leaked app-wide. Overlays with module
// cleanup register a close hook so EVERY close path (Escape, backdrop click,
// programmatic) runs the same teardown.
var OVERLAY_CLOSE_HOOKS = {};   // overlay element id → module close function

/** Create-or-reuse a full-screen overlay mounted on document.body.
 *  ALWAYS re-asserts `overlay open` (+ opts.extraClass) — the reuse path must
 *  bring a previously-closed instance back visible, never render into a
 *  hidden node. opts.onClose registers the module's close hook; backdrop
 *  click-to-close is wired through it in the creation branch only, so the
 *  listener never duplicates. New dynamic overlays should be created through
 *  this helper rather than hand-rolling createElement + className. */
function ensureOverlay(id, opts) {
  opts = opts || {};
  var overlay = document.getElementById(id);
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = id;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeOverlay(overlay);
    });
  }
  // A11y batch H — focus lifecycle. On a closed→open transition, stash the
  // trigger element so closeOverlay can hand focus back, and (deferred, so
  // the caller's innerHTML mount lands first) move focus INTO the dialog —
  // unless the module already placed it somewhere inside.
  var wasOpen = overlay.classList.contains('open');
  overlay.className = 'overlay open' + (opts.extraClass ? ' ' + opts.extraClass : '');
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  if (opts.onClose) OVERLAY_CLOSE_HOOKS[id] = opts.onClose;
  if (!wasOpen) {
    var ae = document.activeElement;
    overlay._restoreFocus = (ae && ae !== document.body) ? ae : null;
    setTimeout(function () {
      if (!overlay.classList.contains('open')) return;
      if (overlay.classList.contains('hover-mode')) return;   // non-modal popover
      if (overlay.contains(document.activeElement)) return;   // module chose its own
      var f = overlay.querySelector(
        'button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])');
      if (f) { try { f.focus(); } catch (_) {} }
    }, 0);
  }
  return overlay;
}

/** Close one overlay through its registered hook. Static modals with no hook
 *  just lose the `open` class (their long-standing behavior — they hold no
 *  module state). A throwing hook degrades to the plain hide so Escape can
 *  never get stuck. */
function closeOverlay(el) {
  if (!el) return;
  var hook = el.id && OVERLAY_CLOSE_HOOKS[el.id];
  if (hook) {
    try { hook(); } catch (err) { el.classList.remove('open'); /* degrade to plain hide */ }
  } else {
    el.classList.remove('open');
  }
  // A11y batch H — restore focus to the stashed trigger, but ONLY if the
  // overlay actually closed: a hook may legitimately refuse (the INV-145
  // mid-send guard keeps the composer open), and yanking focus then would
  // fight the module.
  var restore = el._restoreFocus;
  if (restore && (!el.isConnected || !el.classList.contains('open'))) {
    el._restoreFocus = null;
    try { if (restore.isConnected) restore.focus(); } catch (_) {}
  }
}

/** Topmost open overlay = LAST `.overlay.open` in DOM order. Dynamic overlays
 *  append to <body>, so DOM order is stacking order — the same rule the focus
 *  trap below uses (the two previously disagreed: Escape closed the FIRST
 *  match, i.e. a static base modal underneath a stacked dialog). */
function topOpenOverlay_() {
  var opens = document.querySelectorAll('.overlay.open');
  return opens.length ? opens[opens.length - 1] : null;
}

// ── Modal accessibility: Escape-to-close + focus trap ─────────────────────
document.addEventListener('keydown', function (e) {
  // Escape closes the TOPMOST open overlay (through its close hook, so module
  // cleanup runs); with no overlay open it closes the KB drawer instead
  // (overlays stack above the drawer, so they win).
  if (e.key === 'Escape') {
    var open = topOpenOverlay_();
    if (!open) {
      if (typeof kbDrawerCloseIfOpen_ === 'function' && kbDrawerCloseIfOpen_()) e.preventDefault();
      return;
    }
    e.preventDefault();
    closeOverlay(open);
    return;
  }
  // Ctrl/Cmd + K toggles the KB reference drawer — deliberately works even
  // when focus is in a form field (the point is mid-note lookup).
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K') && !e.shiftKey && !e.altKey) {
    if (typeof kbDrawerToggle_ === 'function') { e.preventDefault(); kbDrawerToggle_(); }
    return;
  }
  // Ctrl/Cmd + / opens the Call Notes shortcuts overlay (if present)
  if ((e.metaKey || e.ctrlKey) && e.key === '/' && !e.shiftKey && !e.altKey) {
    var so = document.getElementById('cn-shortcuts-overlay');
    if (so) { e.preventDefault(); so.classList.add('open'); }
    return;
  }
  // ? key (no modifier, no editable element focused) opens the shortcuts
  // overlay. Contenteditable counts as editable: the Call Notes form fields
  // are .ce divs (Round 2 · 8e), and gating on tagName alone swallowed a
  // literal "?" typed into Issue / Resolution.
  if (e.key === '?' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    var ae = document.activeElement || {};
    var tag = ae.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (ae.isContentEditable) return;
    var so2 = document.getElementById('cn-shortcuts-overlay');
    if (so2) { e.preventDefault(); so2.classList.add('open'); }
  }
});

document.addEventListener('focusin', function (e) {
  // Trap focus in the TOPMOST open overlay (last in DOM order) — ui-dialogs
  // are appended after base modals, so when one stacks over a still-open base
  // modal, focus must stay in the dialog, not the background modal.
  // The KB drawer is exempt: it sits ABOVE the overlay layer (z 55) so reps
  // can read reference material while composing — yanking focus out of its
  // search box would make it unusable mid-modal.
  if (e.target && e.target.closest && e.target.closest('#kb-drawer')) return;
  // F(cycle-8): hover-opened day popovers (.overlay.open.hover-mode — the
  // Time/PTO calendar) are NOT modal: the rep merely rested the pointer on a
  // cell, and trapping focus yanked Tab / month-nav clicks into the popover's
  // Close button while an invisible backdrop sat under them. Exempt them (the
  // KB-drawer pattern); a CLICK-pinned popover drops hover-mode and traps
  // normally.
  var opens = Array.prototype.filter.call(
    document.querySelectorAll('.overlay.open'),
    function (o) { return !o.classList.contains('hover-mode'); });
  if (!opens.length) return;
  var open = opens[opens.length - 1];
  var modal = open.querySelector('.modal') || open.querySelector('.cn-compose-modal');
  if (!modal) return;
  if (modal.contains(e.target)) return;
  var focusable = modal.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])');
  if (focusable.length > 0) focusable[0].focus();
});
</script>
