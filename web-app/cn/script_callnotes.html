// ── Server I/O helpers ─────────────────────────────────────────────────

function cnFetchDeptConfigIfNeeded_(then) {
  if (CN_STATE.deptConfig) { then(); return; }
  google.script.run
    .withSuccessHandler(function (cfg) { CN_STATE.deptConfig = cfg; then(); })
    .withFailureHandler(function (err) {
      showToast('Failed to load department config: ' + err.message, 'toast-error');
      CN_STATE.deptConfig = { departments: [], suggestionsByDept: {}, defaultSuggestions: [] };
      then();
    })
    .getCallNotesDepartments();
}

function cnLoadToday_(then) {
  // Capture currentView so the success/failure handlers can skip rendering
  // if the user navigated away during the round trip (otherwise a late
  // callback clobbers the new view's innerHTML — they share the view-area
  // node). State update still happens unconditionally so the cache is warm
  // for the next time the rep returns.
  const requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (res.error) {
        if (/not configured/i.test(res.error)) CN_STATE.enrolled = false;
        else if (currentView === requestedView) showToast(res.error, 'toast-error');
        CN_STATE.rollingNotes = [];
        CN_STATE.autoCopyFormat = '';
      } else {
        CN_STATE.enrolled = true;
        CN_STATE.rollingNotes = res.notes || [];
        CN_STATE.autoCopyFormat = res.autoCopyFormat || '';
        CN_STATE.empTz = res.timezone || '';
        // Stamp freshness for the Log view's instant-paint fast path (SWR).
        CN_STATE.rollingEntry = { at: Date.now() };
      }
      if (currentView !== requestedView) return;
      if (then) then();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      showToast('Load failed: ' + err.message, 'toast-error');
      if (then) then();
    })
    .getMyCallNotes({ filter: 'all' });
}

function cnLoadDate_(date, then) {
  cnLoadDateRange_(date, date, then);
}

function cnLoadDateRange_(startDate, endDate, then) {
  const requestedView = currentView;
  const isSingleDate = startDate === endDate;
  var rpc;
  if (isSingleDate) {
    rpc = function (ok, fail) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(fail)
        .getMyCallNotes({ filter: 'all', date: startDate });
    };
  } else {
    rpc = function (ok, fail) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(fail)
        .getMyCallNotesRange(startDate, endDate);
    };
  }
  rpc(
    function (res) {
      // F(cycle-8 M-8): drop a response whose RANGE the rep has since moved
      // off (the preset buttons make rapid changes realistic — a slow
      // "Last 30" response used to land after a fast "Yesterday" one and
      // overwrite the stack + SWR cache with 30 days of notes while the
      // inputs read Yesterday). historyDate/EndDate are set at click time,
      // BEFORE this load fires, so they are the current selection. Same
      // class as the Team Notes mgrSubSeq guard (INV-146).
      const curStart = CN_STATE.historyDate;
      const curEnd = CN_STATE.historyEndDate || CN_STATE.historyDate;
      if (curStart !== startDate || curEnd !== endDate) return;   // stale range — drop entirely
      if (res.error) {
        if (/not configured/i.test(res.error)) CN_STATE.enrolled = false;
        else if (currentView === requestedView) showToast(res.error, 'toast-error');
        CN_STATE.historyNotes = [];
      } else {
        CN_STATE.enrolled = true;
        CN_STATE.historyNotes = res.notes || [];
        // Stamp freshness + the exact range for History's instant-paint fast path.
        CN_STATE.historyEntry = { at: Date.now(), key: startDate + ':' + endDate };
      }
      if (currentView !== requestedView) return;
      if (then) then();
    },
    function (err) {
      if (currentView !== requestedView) return;
      showToast('Load failed: ' + err.message, 'toast-error');
      if (then) then();
    }
  );
}

// ── Notes view (the rolling-form primary surface) ──────────────────────

function cnRenderNotesView(area) {
  if (!CN_STATE.enrolled) {
    area.innerHTML = cnEnrollmentMissingHtml_();
    return;
  }
  const compactHeader = COMPACT_MODE ? cnCompactHeader_('Call Notes', 'phone') : '';
  const mod = cnIsMac_() ? '⌘' : 'Ctrl';
  // V4 Phase 4 — Log view restructure. cn-head replaces the prior
  // view-title-row + .cn-active-form-header chrome; carries the eyebrow,
  // big title, and a stats-mini row (today/week/unresolved). cn-actions
  // sits beneath the form with primary Save & Copy carrying the ⌘↵ chip.
  // cn-quick-chip-row at the bottom navigates to History filtered by tag.
  // Existing pinned tray, Q&A tray, filter bar, and rolling stack are
  // preserved beneath the new structure so reps still see their work.
  const eyebrow = `Log a call · all fields visible · ${mod}+⇧+C saves &amp; copies for CRM`;
  area.innerHTML = `
    ${compactHeader}
    ${COMPACT_MODE ? '' : `
      <div class="cn-head">
        <div>
          <div class="cn-head-eyebrow">${eyebrow}</div>
          <h2 class="cn-head-title">Call Notes</h2>
        </div>
        <div class="cn-stats-mini" id="cn-stats-mini">
          <div class="cn-stat-cell"><div class="cn-stat-num" id="cn-stat-today"><span class="lo-dots"><span></span><span></span><span></span></span></div><div class="cn-stat-lbl">Today</div></div>
          <div class="cn-stat-cell"><div class="cn-stat-num" id="cn-stat-week"><span class="lo-dots"><span></span><span></span><span></span></span></div><div class="cn-stat-lbl">Week</div></div>
          <div class="cn-stat-cell"><div class="cn-stat-num" id="cn-stat-flag"><span class="lo-dots"><span></span><span></span><span></span></span></div><div class="cn-stat-lbl">Unresolved</div></div>
        </div>
        <button type="button" class="cn-help-fab" id="cn-help-btn" title="Keyboard shortcuts (${esc(mod)}+/ or ?)">?</button>
      </div>
    `}
    <div class="cn-rolling">
      ${cnRenderActiveForm_()}
      <!-- Round 2 · 8e — action buttons moved INSIDE the form's right rail
           (rail-actions block). The old cn-actions row is no longer rendered;
           button IDs (cn-form-submit, cn-form-submit-compose, cn-form-clear,
           cn-help-btn, cn-ext-email-btn) preserved so existing handlers
           wire to the same elements without modification. -->
      <div id="cn-pinned-tray"></div>
      <div id="cn-training-qa-tray"></div>
      <div class="cn-filter-bar" id="cn-filter-bar"></div>
      <div id="cn-stack"></div>
      <div class="cn-quick-chip-row" id="cn-quick-chip-row"></div>
    </div>
    <div id="cn-shortcuts-overlay" class="overlay">
      <div class="cn-shortcuts-modal">
        <button class="cn-shortcuts-close" onclick="document.getElementById('cn-shortcuts-overlay').classList.remove('open')">${icon('x', 16)}</button>
        <div class="cn-shortcuts-title">Keyboard Shortcuts</div>
        <table class="cn-shortcuts-table">
          <tr><td>Save &amp; Copy</td><td><kbd>${esc(mod)}</kbd> + <kbd>Shift</kbd> + <kbd>C</kbd></td></tr>
          <tr><td>Save &amp; Compose</td><td><kbd>${esc(mod)}</kbd> + <kbd>Shift</kbd> + <kbd>Enter</kbd></td></tr>
          <tr><td>Reference Drawer</td><td><kbd>${esc(mod)}</kbd> + <kbd>K</kbd></td></tr>
          <tr><td>Flag: Action</td><td><kbd>${esc(mod)}</kbd> + <kbd>1</kbd></td></tr>
          <tr><td>Flag: Training</td><td><kbd>${esc(mod)}</kbd> + <kbd>2</kbd></td></tr>
          <tr><td>Flag: Review</td><td><kbd>${esc(mod)}</kbd> + <kbd>3</kbd></td></tr>
          <tr><td>Clear Note</td><td><kbd>${esc(mod)}</kbd> + <kbd>Backspace</kbd></td></tr>
          <tr><td>Undo Clear / Undo Save</td><td><kbd>${esc(mod)}</kbd> + <kbd>Z</kbd> <span style="color:var(--muted)">(30s, empty form)</span></td></tr>
          <tr><td>Next Field</td><td><kbd>Tab</kbd> or <kbd>Enter</kbd></td></tr>
          <tr><td>New Line (same field)</td><td><kbd>Shift</kbd> + <kbd>Enter</kbd></td></tr>
          <tr><td>Show Shortcuts</td><td><kbd>${esc(mod)}</kbd> + <kbd>/</kbd>&nbsp; or &nbsp;<kbd>?</kbd></td></tr>

                onclick="document.getElementById('cn-shortcuts-overlay').classList.remove('open'); if (typeof tourStart==='function') tourStart();">
          ${icon('info', 14)} Replay the app tour
        </button>
      </div>
    </div>
  `;
  cnWireActiveForm_();
  cnInstallCardDelegation_(area);
  // Render the cached pinned tray synchronously BEFORE the rolling stack so
  // the stack's pinned-note deduplication is consistent with what the tray
  // shows. Without this, on second+ visits the stack filters out pinned notes
  // (using CN_STATE.pinnedNotes populated by the prior visit's async reload)
  // but the tray is still empty — pinned notes vanish from both places until
  // the async reload completes.
  cnRenderPinnedTray_();
  cnRenderTrainingQATray_();
  cnRenderFilterBar_();
  cnRenderStack_();
  cnReloadPinnedTray_();
  cnLoadTrainingQA_();
  // V4 Phase 4 — populate stats-mini + quick-chip-row on first paint.
  // F(cycle-8): from the CACHED ambient result when one exists — the direct
  // cnPollAmbient_() here doubled the start-path poll (a Log enter cost two
  // getCallNotesAmbient RPCs); the showView-driven cnStartAmbientPolling_
  // fires the fresh poll when the cache is stale.
  if (CN_STATE.lastAmbientRes) {
    cnUpdateStatsMini_(CN_STATE.lastAmbientRes);
    cnUpdateQuickChipRow_(CN_STATE.lastAmbientRes);
  }
  // Ctrl/⌘+K is owned by the KB reference drawer (bound in script_core).
  // The prior V4 search-jump keybind was removed: both handlers fired, so
  // the drawer opened and was immediately closed by the Search-tab nav.
  // Round 2 · 8z — consume the in-memory nav hint from the Clock view's
  // coverage-strip CTA. Today: just a toast acknowledging the source.
  // When per-call CDR data lands: prefill the form from hint.calls[0]
  // or auto-filter the rolling stack to unmatched-only.
  cnConsumeNavHint_();
  // Restore any in-progress draft from a prior session (sticky form). If a
  // draft was restored, focus the resolution field (most likely where the
  // rep left off); otherwise focus the callback for a fresh note.
  const restored = cnRestoreActiveFormDraft_();
  // V4 Phase 4 — apply any ?prefill=... query params from the URL (deep-link
  // contract from the Clock view's coverage strip CTA, future-ready even
  // though the strip doesn't pass prefill today — no per-call CDR data).
  // F(cycle-8): runs AFTER the draft restore (the L-22 ordering) — it used to
  // run first, and the restore overwrote the just-prefilled fields with the
  // draft's values (including EMPTY strings) while the rows kept their
  // .prefilled accent — a visual lie. An explicit ?prefill deep-link is user
  // intent and wins for exactly the prefilled fields.
  cnApplyPrefillFromUrl_();
  // Cross-tool nav hint (e.g. a Spanish-inbox tool-suggestion chip): surface a
  // context banner + prefill the Issue field with the request subject.
  // F(L-22): runs AFTER the draft restore — the hint only writes into an EMPTY
  // Issue field, and the restore used to run last and clobber the prefill with
  // the draft's (often empty) issue value before the rep ever saw it. Restore-
  // first means a real draft's Issue wins; an empty one lets the hint land
  // (and the input event it dispatches persists it into the draft).
  cnConsumeAppNavHint_();
  setTimeout(function () {
    const el = document.getElementById(restored ? 'cn-fld-resolution' : 'cn-fld-callback');
    if (el) el.focus();
  }, 50);
  if (restored) showToast('Draft restored', 'toast-success');
}

function cnRenderActiveForm_() {
  // Round 2 · 8e — vertical 2/3 + 1/3 layout. Left panel = the call-note

  // primary actions (Save & Copy / Save & Compose / Open Email). Field
  // IDs preserved so cnReadActiveForm_, cnClearActiveForm_, sticky drafts,
  // phone formatter, completion timer all keep working untouched.
  const mod = cnIsMac_() ? '⌘' : 'Ctrl';
  return `
    <div class="cnv-layout" id="cn-active-form">
      <!-- LEFT 2/3 — note template as a contenteditable document.
           Round 2 deferred follow-on: the fields are <div contenteditable>
           spans instead of <input>/<textarea> so the whole frame becomes
           one selectable region. A 'copy' event listener on the frame
           intercepts ⌘C anywhere inside and writes the FULL formatted
           template via cnFormatNoteForCopy_ — same output the Save & Copy
           button produces. Paste is sanitized to plain text. -->
      <div class="cnv-doc">
        <div class="cnv-doc-frame" id="cn-frame">
          <div class="frame-stamp">
            <span>NOTE TEMPLATE</span>
            <span class="meta">· EDIT INLINE</span>

function cnWireActiveForm_() {
  const form = document.getElementById('cn-active-form');
  if (!form) return;
  // Round 2 · 8e — multi-select flag state via form.dataset.flags
  // (comma-separated). form.dataset.flag is also maintained as the
  // highest-priority flag for backward compat with legacy code paths
  // (sticky-draft restore, cnFormToggleFlag_ keybinds). Tags state lives
  // in form.dataset.tags (also comma-separated).
  form.dataset.flags = '';
  form.dataset.flag = '';
  form.dataset.tags = '';

  // Click on a multi-select flag button: toggle membership in the flags set.
  form.querySelectorAll('.flag-btn[data-flag]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const flag = btn.dataset.flag;
      const cur = cnGetFormFlags_(form);
      const idx = cur.indexOf(flag);
      if (idx >= 0) cur.splice(idx, 1);
      else cur.push(flag);
      cnSetFormFlags_(form, cur);
      // §7 pop — quick scale feedback when a flag is switched ON.
      if (cur.indexOf(flag) >= 0) { btn.classList.remove('popping'); void btn.offsetWidth; btn.classList.add('popping'); }
      // Persist immediately so a tab close right after a flag toggle doesn't
      // lose the categorization
      cnPersistActiveFormDraft_();
    });
  });

  // Tag input — ⏎ to add. Backspace on empty input removes the last tag chip.
  const tagInput = document.getElementById('cn-tag-input');
  if (tagInput) {
    tagInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const raw = tagInput.value.trim();
        const tag = cnNormalizeTag_(raw);
        if (!tag) return;
        const cur = cnGetFormTags_(form);
        if (cur.indexOf(tag) < 0 && cur.length < 8) {
          cur.push(tag);
          cnSetFormTags_(form, cur);
          cnPersistActiveFormDraft_();
        }
        tagInput.value = '';
      } else if (e.key === 'Backspace' && !tagInput.value) {
        const cur = cnGetFormTags_(form);
        if (cur.length > 0) {
          cur.pop();
          cnSetFormTags_(form, cur);
          cnPersistActiveFormDraft_();
        }
      }
    });
    cnLoadTagSuggestions_();   // populate the autocomplete datalist (B3)
  }
  // Suggested-tag clicks — adds the tag (same path as typing + Enter).
  const tagSuggest = document.getElementById('cn-tag-suggest');
  if (tagSuggest) {
    tagSuggest.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-sug-tag]');
      if (!btn) return;
      const tag = btn.getAttribute('data-sug-tag');
      const cur = cnGetFormTags_(form);
      if (cur.indexOf(tag) < 0 && cur.length < 8) {
        cur.push(tag);
        cnSetFormTags_(form, cur);
        cnPersistActiveFormDraft_();
      }
      cnRefreshTagSuggest_();
    });
  }
  // Tag chip clicks (× removal) — event delegation on the chip container.
  const tagChips = document.getElementById('cn-tag-chips');
  if (tagChips) {
    tagChips.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-remove-tag]');
      if (!btn) return;
      const t = btn.getAttribute('data-remove-tag');
      const cur = cnGetFormTags_(form).filter(function (x) { return x !== t; });
      cnSetFormTags_(form, cur);
      cnPersistActiveFormDraft_();
    });
  }
  // Ctrl/⌘+Enter from any input/textarea submits.
  // First input also starts the form-completion timer (used by the manager
  // Stats tab's median note-completion-time metric) and triggers the sticky-
  // form auto-save (debounced) so an accidental tab close doesn't lose work.
  const persistDebounced = (function () {
    let t = null;
    return function () {
      if (t) clearTimeout(t);
      t = setTimeout(cnPersistActiveFormDraft_, 400);
    };
  })();
  // Round 2 deferred 8e — bind input + keydown handlers on BOTH the
  // contenteditable .ce divs (post-deferred-8e form fields) AND the
  // legacy <input>/<textarea> for cn-fld-training-q. The handler logic
  // is the same; only the value-read shape differs (textContent vs value).
  const editables = Array.prototype.slice.call(form.querySelectorAll('.ce[contenteditable], input, textarea'));
  editables.forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      // Operator feedback (2026-06-12 r3): Save & Copy moved to ${mod}+Shift+C
      // (off plain ${mod}+Enter — too close to the Enter-nav muscle memory).
      // ${mod}+Shift+Enter keeps Save & Compose.
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
        e.preventDefault();
        if (e.repeat) return;   // F(cycle-8 M-3): a held chord auto-repeats keydown
        cnSubmitActiveForm_();
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'Enter') {
        e.preventDefault();
        // F(cycle-8 M-3): keydown AUTO-REPEATS while held. Save & Copy was
        // accidentally protected (the optimistic clear empties the form
        // synchronously) but Save & Compose keeps the form (keepForm), so a
        // held/repeated chord fired N identical submitCallNote RPCs → N
        // duplicate rows. The in-flight guard in cnSubmitActiveForm_ backstops
        // the discrete double-press.
        if (e.repeat) return;
        cnShowComposerLoading_();
        cnSubmitActiveForm_({
          keepForm: true,
          onConfirmed: function (note) { cnOpenEmailComposer_(note.noteId); },
        });
        return;
      }
      if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey) {
        if (e.key === '1') { e.preventDefault(); cnFormToggleFlag_('action'); return; }
        if (e.key === '2') { e.preventDefault(); cnFormToggleFlag_('training'); return; }
        if (e.key === '3') { e.preventDefault(); cnFormToggleFlag_('review'); return; }
        if (e.key === 'Backspace') { e.preventDefault(); cnClearActiveForm_(); return; }
        if (e.key === '/') { e.preventDefault(); cnOpenShortcutsOverlay_(); return; }
      }
      // Operator feedback (2026-06-12): Enter advances to the next field
      // (like Tab); Shift+Enter inserts a newline in the same field.
      // Ctrl/Cmd+Enter (save) was handled above.
      if (e.key === 'Enter' && !e.shiftKey && !e.altKey && el.isContentEditable) {
        e.preventDefault();
        cnFocusNextField_(el.id);
        return;
      }
      // Operator feedback (2026-06-12 r2): arrow keys hop fields when the
      // caret is at the field's boundary — Down at the very end goes to the
      // next field, Up at the very start goes back. Inside multi-line text
      // the arrows keep their normal line-by-line behavior.
      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && el.isContentEditable
          && !e.shiftKey && !e.altKey && !e.metaKey && !e.ctrlKey) {
        var fwd = e.key === 'ArrowDown';
        if (cnCaretAtEdge_(el, fwd ? 'end' : 'start')) {
          e.preventDefault();
          if (fwd) cnFocusNextField_(el.id); else cnFocusPrevField_(el.id);
          return;
        }
      }
      if (e.key === 'Escape' && !e.defaultPrevented) {
        if (document.querySelector('.overlay.open')) return;
        // Cycle-9 L-29: the KB drawer is NOT an .overlay (z-55, designed to
        // stay open while typing in the form). A rep pressing Esc to dismiss
        // the drawer — focus back in a field — used to ALSO clear their
        // in-progress note (the shell's document-level handler then closed
        // the drawer too: one keystroke, both actions). Let the drawer close
        // take the keystroke; a second Esc clears the form.
        const kbd = document.getElementById('kb-drawer');
        if (kbd && kbd.classList.contains('open')) return;
        e.preventDefault();
        cnClearActiveForm_();
      }
    });
    // Operator feedback (2026-06-12): Sheets-style overwrite — a FRESH focus
    // selects the field's content so typing replaces it. A drag-select on the
    // focusing click wins (we only select-all when the click left a collapsed
    // caret); a second click inside collapses to a caret as usual.
    if (el.isContentEditable) {
      el.addEventListener('mousedown', function () {
        el._cnMouseFocus = document.activeElement !== el;
      });
      el.addEventListener('focus', function () {
        if (!el.textContent.trim()) return;
        if (el._cnMouseFocus) {
          var once = function () {
            document.removeEventListener('mouseup', once);
            el._cnMouseFocus = false;
            setTimeout(function () {
              if (document.activeElement !== el) return;
              var sel = window.getSelection();
              if (sel && !sel.isCollapsed) return;   // drag-select wins
              cnSelectAllIn_(el);
            }, 0);
          };
          document.addEventListener('mouseup', once);
        } else {
          cnSelectAllIn_(el);   // keyboard focus (Tab / Enter-nav)
        }
      });
    }
    el.addEventListener('input', function () {
      cnFormTimerStartIfNeeded_();
      persistDebounced();
      if (el.id === 'cn-fld-issue' || el.id === 'cn-fld-resolution') {
        clearTimeout(_cnTagSuggestTimer);
        _cnTagSuggestTimer = setTimeout(cnRefreshTagSuggest_, 500);
      }
      // Sync .empty class on contenteditable so the data-placeholder pseudo
      // shows/hides correctly. No-op for input/textarea.
      if (el.isContentEditable) {
        el.classList.toggle('empty', !el.textContent.trim());
      }
    });
    // Paste sanitisation — strip HTML, insert plain text only. Stops formatted
    // pastes from leaking <span style="..."> nodes into the contenteditable.
    if (el.isContentEditable) {
      el.addEventListener('paste', function (e) {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
        document.execCommand('insertText', false, text);
      });
      // blur sync — handles cases where input event didn't fire (e.g., IME)
      el.addEventListener('blur', function () {
        el.classList.toggle('empty', !el.textContent.trim());
      });
    }
  });
  // Phone-number auto-format on the Callback field. Now reads textContent
  // and uses the Selection API to put the cursor at end (cnSetCursorToEnd_).
  const cb = document.getElementById('cn-fld-callback');
  if (cb) {
    cb.addEventListener('input', function () {
      const raw = cb.isContentEditable ? cb.textContent : cb.value;
      const formatted = cnFormatPhoneNumberInline_(raw);
      if (formatted !== raw) {
        if (cb.isContentEditable) {
          cb.textContent = formatted;
          cnSetCursorToEnd_(cb);
          cb.classList.toggle('empty', !cb.textContent.trim());
        } else {
          cb.value = formatted;
          cb.setSelectionRange(formatted.length, formatted.length);
        }
      }
    });
  }
  // Round 2 deferred 8e — Manual-copy failover. ⌘C anywhere inside the
  // frame intercepts the copy event, preventDefaults the browser's
  // default selection-text copy, and writes the FULL formatted note
  // template (cnFormatNoteForCopy_, same helper Save & Copy uses) to
  // the clipboard. So drag-highlighting any subset of the frame still
  // pastes a complete, CRM-ready note. */
  const frame = document.getElementById('cn-frame');
  if (frame) {
    frame.addEventListener('copy', function (e) {
      try {
        const payload = cnReadActiveForm_();
        const fmt = cnFormatNoteForCopy_(payload);
        if (e.clipboardData) {
          e.clipboardData.setData('text/plain', fmt);
          e.preventDefault();
          showToast('Copied (full note template)', 'toast-success');
        }
      } catch (err) { /* fall through to browser default copy */ }
    });
  }
  // Ctrl/⌘+Z restores a freshly-cleared form (within CN_CLEAR_UNDO_WINDOW_MS).
  // Bound at the form level so it doesn't fight with the native input undo
  // stack outside of the post-clear state.
  form.addEventListener('keydown', function (e) {
    if (!((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z') && !e.shiftKey)) return;
    // Only act when the form is empty (= a cleared/just-saved state); a
    // non-empty form keeps the browser's native text-undo. Round 2 deferred
    // 8e — read via cnGetFieldValue_ so the check works for both
    // contenteditable .ce divs and legacy input/textarea elements.
    const allEmpty = !cnGetFieldValue_('cn-fld-callback').trim()
      && !cnGetFieldValue_('cn-fld-caller').trim()
      && !cnGetFieldValue_('cn-fld-patient').trim()
      && !cnGetFieldValue_('cn-fld-issue').trim()
      && !cnGetFieldValue_('cn-fld-resolution').trim();
    if (!allEmpty) return;
    const snap = CN_STATE.lastClearedSnapshot;
    if (snap && Date.now() - snap.at <= CN_CLEAR_UNDO_WINDOW_MS) {
      e.preventDefault();
      cnRestoreFromSnapshot_(snap);
      CN_STATE.lastClearedSnapshot = null;
      return;
    }
    // Operator feedback (2026-06-12): Ctrl/Cmd+Z after Ctrl+Enter is a TRUE
    // undo of the save — deletes the just-saved note (the server's 5-min
    // delete window applies; audit row written) and restores the text.
    const su = CN_STATE.lastSaveUndo;
    if (su && Date.now() - su.at <= CN_CLEAR_UNDO_WINDOW_MS) {
      e.preventDefault();
      if (su.note && su.note._pending) {
        showToast('Still saving — try undo again in a second', 'toast-warn');
        return;
      }
      CN_STATE.lastSaveUndo = null;
      if (cnFindNoteAnywhere_(su.note.noteId)) cnDoDeleteNote_(su.note.noteId);
      cnRestoreFromSnapshot_(su.snap);
      showToast('Save undone — note deleted, text restored', 'toast-success');
    }
  });
  document.getElementById('cn-form-submit').addEventListener('click', function () { cnSubmitActiveForm_(); });
  document.getElementById('cn-form-clear').addEventListener('click', cnClearActiveForm_);
  // Save & Compose: optimistic submit + open the email composer once the
  // server has assigned a real noteId (preview/send require it). The rep
  // can paste the note into the CRM during the brief wait — clipboard is
  // already set by the optimistic submit path.
  const composeBtn = document.getElementById('cn-form-submit-compose');
  // (compose click handler below shows the loading envelope first)
  if (composeBtn) {
    composeBtn.addEventListener('click', function () {
      cnShowComposerLoading_();
      cnSubmitActiveForm_({
        keepForm: true,
        onConfirmed: function (note) { cnOpenEmailComposer_(note.noteId); },
      });
    });
  }
  var helpBtn = document.getElementById('cn-help-btn');
  if (helpBtn) helpBtn.addEventListener('click', cnOpenShortcutsOverlay_);
  var extBtn = document.getElementById('cn-ext-email-btn');
  if (extBtn) extBtn.addEventListener('click', function () { cnOpenExternalEmailModal_(); });
}

function cnRestoreFromSnapshot_(snap) {
  if (!snap) return;
  Object.keys(snap.values || {}).forEach(function (k) {
    cnSetFieldValue_('cn-fld-' + k, snap.values[k]);
  });
  const form = document.getElementById('cn-active-form');
  if (form) {
    if (Array.isArray(snap.flags)) {
      cnSetFormFlags_(form, snap.flags);
    } else if (snap.flag) {
      cnSetFormFlags_(form, [snap.flag]);
    } else {
      cnSetFormFlags_(form, []);
    }
    if (Array.isArray(snap.tags)) cnSetFormTags_(form, snap.tags);
  }
  cnSetFieldValue_('cn-fld-training-q', snap.trainingQ || '');
  showToast('Restored', 'toast-success');
}

function cnClearActiveForm_(opts) {
  const fields = ['callback','caller','relationship','patient','issue','transferred','resolution'];
  const skipSnap = opts && opts.skipSnapshot;
  const form0 = document.getElementById('cn-active-form');
  if (!skipSnap) {
    const values = {};
    fields.forEach(function (k) {
      values[k] = cnGetFieldValue_('cn-fld-' + k);
    });
    const tqVal = cnGetFieldValue_('cn-fld-training-q');
    const flags0 = cnGetFormFlags_(form0);
    const tags0 = cnGetFormTags_(form0);
    const anyContent = fields.some(function (k) { return (values[k] || '').trim().length > 0; })
                     || (tqVal && tqVal.trim())
                     || flags0.length > 0
                     || tags0.length > 0;
    if (anyContent) {
      CN_STATE.lastClearedSnapshot = {
        values: values,
        flags: flags0,
        tags: tags0,
        flag: form0 ? form0.dataset.flag : '',  // legacy field retained
        trainingQ: tqVal,
        at: Date.now(),
      };
      showToast('Cleared · ' + (cnIsMac_() ? '⌘' : 'Ctrl') + '+Z to undo', 'toast-warn');
    }
  }
  fields.forEach(function (k) {
    cnSetFieldValue_('cn-fld-' + k, '');
  });
  if (form0) {
    cnSetFormFlags_(form0, []);
    cnSetFormTags_(form0, []);
  }
  cnSetFieldValue_('cn-fld-training-q', '');
  const tagIn = document.getElementById('cn-tag-input');
  if (tagIn) tagIn.value = '';
  cnClearStickyFormDraft_();
  cnFormTimerReset_();
  const cb = document.getElementById('cn-fld-callback');
  if (cb) cb.focus();
}

/** Round 2 · 8e — form flags/tags state helpers. Flags + tags live on the
 *  form root as comma-separated dataset attributes so they survive
 *  sticky-draft persistence + restore. cnSetFormFlags_ also derives
 *  form.dataset.flag (the highest-priority single value) for any legacy
 *  consumer + updates button .on classes + training-q-row visibility. */
const CN_FORM_FLAGS = ['action', 'training', 'review', 'urgent'];
const CN_FLAG_PRIORITY_CLIENT = ['action', 'training', 'review', 'urgent'];

function cnGetFormFlags_(form) {
  if (!form) return [];
  const raw = form.dataset.flags || '';
  return raw ? raw.split(',').filter(Boolean) : [];
}
function cnSetFormFlags_(form, flagsArray) {
  if (!form) return;
  const filtered = (flagsArray || []).filter(function (f) {
    return CN_FORM_FLAGS.indexOf(f) >= 0;
  });
  form.dataset.flags = filtered.join(',');
  // Derive primary for backward compat
  let primary = '';
  for (let i = 0; i < CN_FLAG_PRIORITY_CLIENT.length; i++) {
    if (filtered.indexOf(CN_FLAG_PRIORITY_CLIENT[i]) >= 0) { primary = CN_FLAG_PRIORITY_CLIENT[i]; break; }
  }
  form.dataset.flag = primary;
  // Sync button .on classes
  form.querySelectorAll('.flag-btn[data-flag]').forEach(function (b) {
    b.classList.toggle('on', filtered.indexOf(b.dataset.flag) >= 0);
  });
  // Training-q row visibility — show when training is one of the selected flags
  const trainingRow = document.getElementById('cn-training-q-row');
  if (trainingRow) trainingRow.style.display = filtered.indexOf('training') >= 0 ? 'block' : 'none';
}
function cnGetFormTags_(form) {
  if (!form) return [];
  const raw = form.dataset.tags || '';
  return raw ? raw.split(',').filter(Boolean) : [];
}
function cnSetFormTags_(form, tagsArray) {
  if (!form) return;
  const filtered = (tagsArray || []).map(cnNormalizeTag_).filter(Boolean);
  // Dedupe + cap at 8
  const seen = {};
  const out = [];
  for (let i = 0; i < filtered.length && out.length < 8; i++) {
    if (!seen[filtered[i]]) { seen[filtered[i]] = true; out.push(filtered[i]); }
  }

/** Round 2 deferred 8e — Put the caret at end of a contenteditable

/** Round 2 deferred 8e — Field accessors that work transparently with
 *  contenteditable divs (the new form fields, post-deferred-8e) AND
 *  legacy input/textarea elements (cn-tag-input, cn-fld-training-q,

function cnReadActiveForm_() {
  const form = document.getElementById('cn-active-form');

  const tags = cnGetFormTags_(form);
  const flag = (form && form.dataset.flag) || '';
  // training-q input is still an <input> (lives below the doc frame, not
  // contenteditable) — cnGetFieldValue_ falls through to .value transparently.
  const trainingQ = (flags.indexOf('training') >= 0) ? cnGetFieldValue_('cn-fld-training-q').trim() : '';
  return {
    callback:      cnGetFieldValue_('cn-fld-callback'),
    caller:        cnGetFieldValue_('cn-fld-caller'),
    relationship:  cnGetFieldValue_('cn-fld-relationship'),
    patientAndTrx: cnGetFieldValue_('cn-fld-patient'),
    issue:         cnGetFieldValue_('cn-fld-issue'),
    transferredTo: cnGetFieldValue_('cn-fld-transferred'),
    resolution:    cnGetFieldValue_('cn-fld-resolution'),
    flagType:      flag,
    flags:         flags,
    tags:          tags,

/** Start the form-completion timer if not already started. Called on the
 *  first user interaction with the form (input or flag click). Persists to
 *  localStorage so a mid-form refresh doesn't reset the clock — the rep's
 *  effort is captured across reloads. */
function cnFormTimerStartIfNeeded_() {
  try {
    if (!localStorage.getItem(CN_FORM_STARTED_LS_KEY)) {
      localStorage.setItem(CN_FORM_STARTED_LS_KEY, String(Date.now()));
    }
  } catch (e) {}
}

/** Stop the timer and return elapsed seconds. Returns null if no timer was
 *  running (e.g., rep clicked Save & Copy on a form they didn't type into,
 *  which shouldn't happen but is defensively handled). */
function cnFormTimerEndAndGet_() {
  try {
    const raw = localStorage.getItem(CN_FORM_STARTED_LS_KEY);
    if (!raw) return null;
    const started = parseInt(raw, 10);
    localStorage.removeItem(CN_FORM_STARTED_LS_KEY);
    if (!isFinite(started) || started <= 0) return null;
    const elapsed = Math.max(0, Math.round((Date.now() - started) / 1000));
    // Cap obvious outliers (rep walked away) — a 12-hour stale timer
    // shouldn't poison the median. 1800s = 30 min mirrors the manager
    // stats threshold for "still actively writing".
    if (elapsed > 1800) return null;
    return elapsed;
  } catch (e) { return null; }
}

function cnFormTimerReset_() {
  try { localStorage.removeItem(CN_FORM_STARTED_LS_KEY); } catch (e) {}
}

/** Sticky form: persist the in-progress draft to localStorage on every
 *  input so a tab close / refresh / browser crash doesn't lose what the
 *  rep typed. Called debounced from the input handler. */
function cnPersistActiveFormDraft_() {
  try {
    // Turn-A audit (the intake M-2 class, worse here): the 400ms debounce can
    // fire AFTER a nav-away tore down the form — every field then reads ''
    // and the no-content branch REMOVES the sticky draft the rep meant to
    // come back to. No form root → skip; the last persisted draft stands.
    // (A rep manually clearing every field still clears the draft — the form
    // is present on that path.)
    if (!document.getElementById('cn-active-form')) return;
    const values = {};
    ['callback','caller','relationship','patient','issue','transferred','resolution'].forEach(function (k) {
      values[k] = cnGetFieldValue_('cn-fld-' + k);
    });
    const form = document.getElementById('cn-active-form');
    const tqVal = cnGetFieldValue_('cn-fld-training-q');
    const flags = cnGetFormFlags_(form);
    const tags = cnGetFormTags_(form);
    const data = {
      values: values,
      flags: flags,
      tags: tags,
      flag: form ? form.dataset.flag : '',
      trainingQ: tqVal,
      at: Date.now(),   // drafts expire after CN_FORM_STICKY_MAX_AGE_MS (PHI TTL)
    };
    const anyContent = Object.keys(values).some(function (k) { return (values[k] || '').trim(); })
                    || flags.length > 0 || tags.length > 0
                    || (data.trainingQ && data.trainingQ.trim());
    if (anyContent) {
      localStorage.setItem(CN_FORM_STICKY_LS_KEY, JSON.stringify(data));
    } else {
      localStorage.removeItem(CN_FORM_STICKY_LS_KEY);
    }
  } catch (e) { /* localStorage unavailable — accept the loss */ }
}

/** B3 — populate the tag-input autocomplete datalist from the rep's own
 *  non-archived tag history (best-effort; silent on failure). Every option
 *  value is esc()'d before innerHTML. */
// Operator feedback (2026-06-12) — Enter-nav order through the template,
// ending at the tag input. Focus triggers the select-all-on-fresh-focus
// behavior, so Enter-Enter-Enter walks the form overwriting as you go.
const CN_FIELD_NAV_ORDER = ['cn-fld-callback','cn-fld-caller','cn-fld-relationship',
  'cn-fld-patient','cn-fld-issue','cn-fld-resolution','cn-fld-transferred','cn-tag-input'];
function cnFocusNextField_(currentId) {
  const i = CN_FIELD_NAV_ORDER.indexOf(currentId);
  const nextId = CN_FIELD_NAV_ORDER[(i + 1) % CN_FIELD_NAV_ORDER.length] || CN_FIELD_NAV_ORDER[0];

function cnFocusPrevField_(currentId) {

  const prevId = CN_FIELD_NAV_ORDER[(i - 1 + CN_FIELD_NAV_ORDER.length) % CN_FIELD_NAV_ORDER.length];

 *  hops (arrowing out of a selection should behave natively). */

    const r = sel.getRangeAt(0);

    const pre = r.cloneRange();
    pre.selectNodeContents(el);
    pre.setEnd(r.startContainer, r.startOffset);

// Heuristic tag suggestions — the rep's OWN tag vocabulary matched against
// the Issue/Resolution text (every word of a kebab-tag must appear). Pure;
// Node-pinned. The AI version is deliberately NOT built: it would send
// free-typed note text (PHI) to a vendor — the exact boundary INV-119 draws.
function cnSuggestTagsFromText_(text, vocab, current) {
  const t = ' ' + String(text || '').toLowerCase() + ' ';
  const out = [];
  (vocab || []).forEach(function (tag) {
    if ((current || []).indexOf(tag) >= 0) return;
    const words = String(tag).split('-').filter(function (w) { return w.length >= 3; });
    if (!words.length) return;
    if (words.every(function (w) { return t.indexOf(w) >= 0; })) out.push(tag);

  const text = cnGetFieldValue_('cn-fld-issue') + ' ' + cnGetFieldValue_('cn-fld-resolution');
  const sugg = cnSuggestTagsFromText_(text, CN_STATE.tagVocab || [], cnGetFormTags_(form));
  host.innerHTML = sugg.length
    ? '<span class="sug-lbl">suggested</span>' + sugg.map(function (t) {
        return '<button type="button" class="sug-tag" data-sug-tag="' + esc(t) + '">+ ' + esc(t) + '</button>';

function cnLoadTagSuggestions_() {

  google.script.run
    .withSuccessHandler(function (res) {
      const d = document.getElementById('cn-tag-suggestions');
      if (!d || !res || res.error || !Array.isArray(res.tags)) return;

      d.innerHTML = res.tags.map(function (t) { return '<option value="' + esc(t) + '">'; }).join('');

    .withFailureHandler(function () { /* best-effort — no datalist on failure */ })
