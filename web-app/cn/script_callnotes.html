             value="${esc(CN_STATE.searchQuery || '')}" oninput="cnSearchQueryChanged_(this.value)">
      <div class="toolbar-tabs" role="group" aria-label="Search field">
        <button class="toolbar-tab" aria-pressed="${CN_STATE.searchField === 'all'}" onclick="cnSetSearchField_('all')">All</button>
        <button class="toolbar-tab" aria-pressed="${CN_STATE.searchField === 'caller'}" onclick="cnSetSearchField_('caller')">Caller</button>
        <button class="toolbar-tab" aria-pressed="${CN_STATE.searchField === 'phone'}" onclick="cnSetSearchField_('phone')">Phone</button>
        <button class="toolbar-tab" aria-pressed="${CN_STATE.searchField === 'trx'}" onclick="cnSetSearchField_('trx')">TRX</button>
        <button class="toolbar-tab" aria-pressed="${CN_STATE.searchField === 'issue'}" onclick="cnSetSearchField_('issue')">Issue</button>
      </div>
      ${cnSearchDatesHtml_('cn-search', CN_STATE.searchFrom, CN_STATE.searchTo)}
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap">
        <input type="checkbox" id="cn-search-archive" ${CN_STATE.searchIncludeArchive ? 'checked' : ''} onchange="cnToggleArchiveSearch_(this.checked)">
        Include archived
      </label>
    </div>
    ${exactBadge ? `<div style="margin-bottom:10px">${exactBadge}</div>` : ''}
    <div id="cn-search-results"></div>
  `;
  cnInstallCardDelegation_(area);
  cnRenderSearchResults_();
}

// Include-archive toggle (rep Search) — re-fires the search over live + the
// cold NotesArchive tab. Archived hits render with a read-only "archived" pill.
function cnToggleArchiveSearch_(on) {
  CN_STATE.searchIncludeArchive = !!on;
  cnFireSearch_();
}

function cnSearchQueryChanged_(q) {
  // Manual typing in the search box implies the rep is starting a new search
  // — drop exact-TRX mode (which was set by clicking "Find prior calls" on a
  // card) so the substring matcher takes over again.
  if (CN_STATE.searchExact) {
    CN_STATE.searchExact = false;
    CN_STATE.searchExactTrx = '';
    // F(L-23): hide the badge in place (a full bar re-render would steal the
    // input focus mid-typing) — it otherwise kept claiming exact mode while
    // the results below were substring matches.
    const badge = document.getElementById('cn-exact-badge');
    if (badge) badge.style.display = 'none';
  }
  CN_STATE.searchQuery = q;
  if (CN_STATE.searchTimer) clearTimeout(CN_STATE.searchTimer);
  CN_STATE.searchTimer = setTimeout(cnFireSearch_, 240);
}

/** Switches to the Search view in exact-TRX mode for the given patientAndTrx.
 *  Triggered by the search icon on each rolling-stack card. The Search view's
 *  exact-mode badge gives the rep a one-click "Clear" to fall back to
 *  substring search if they want a wider net. */
function cnFindPriorCallsForTrx_(trx) {
  const t = String(trx || '').trim();
  if (!t) return;
  CN_STATE.searchQuery = t;
  CN_STATE.searchField = 'all';
  CN_STATE.searchExact = true;
  CN_STATE.searchExactTrx = t;
  if (CN_STATE.searchTimer) { clearTimeout(CN_STATE.searchTimer); CN_STATE.searchTimer = null; }
  showView('callNotesSearch');
  // showView renders the search view; fire the search after the next tick so
  // the search-results host exists in the DOM.
  setTimeout(cnFireSearch_, 0);
}

/** "Clear exact mode" handler — drops back to substring matching but keeps
 *  the query so the rep sees a wider result set immediately. */
function cnClearExactMode_() {
  CN_STATE.searchExact = false;
  CN_STATE.searchExactTrx = '';
  cnFireSearch_();
  // Re-render the search bar so the badge disappears
  const area = document.getElementById('view-area');
  if (area && currentView === 'callNotesSearch') cnRenderSearchView(area);
}

function cnSetSearchField_(f) {
  CN_STATE.searchField = f;
  // Switching field tabs is a substring-search interaction; if we're in
  // exact-TRX mode the field tabs are meaningless — drop exact mode and
  // re-render the bar so the badge disappears.
  if (CN_STATE.searchExact) {
    CN_STATE.searchExact = false;
    CN_STATE.searchExactTrx = '';
    const area = document.getElementById('view-area');
    if (area && currentView === 'callNotesSearch') {
      cnRenderSearchView(area);
      // F(cycle-8): RE-FIRE as a substring search under the new field scope
      // (S28's contract). The early return used to repaint the CACHED exact
      // hits under the freshly highlighted tab — stale results silently
      // presented as the new field-scoped search. cnClearExactMode_ already
      // did this correctly; mirror it.
      cnFireSearch_();
      return;
    }
  }
  document.querySelectorAll('.cn-search-bar .toolbar-tab').forEach(function (b) {
    b.setAttribute('aria-pressed', b.textContent.trim().toLowerCase() === f ? 'true' : 'false');
  });
  cnFireSearch_();
}

function cnFireSearch_() {
  const q = String(CN_STATE.searchQuery || '').trim();
  if (q.length < 2) {
    CN_STATE.searchResults = [];
    cnRenderSearchResults_();
    return;
  }
  // Capture view + query so late results from a stale typing burst don't
  // clobber the active search (or worse, render to a different view that's
  // since reused the view-area).
  const requestedView = currentView;
  const requestedQuery = q;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView) return;
      // F(M-5): compare trimmed-to-trimmed — requestedQuery is the TRIMMED q
      // but the state holds the raw input, so a query with surrounding
      // whitespace (a pasted TRX/phone) fetched results and discarded them.
      if (String(CN_STATE.searchQuery || '').trim() !== requestedQuery) return;
      if (res.error) { showToast(res.error, 'toast-error'); CN_STATE.searchResults = []; }
      else CN_STATE.searchResults = res.results || [];
      cnRenderSearchResults_();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      showToast('Search failed: ' + err.message, 'toast-error');
    })
    .searchMyCallNotes(q, CN_STATE.searchField,
      (CN_STATE.searchFrom && CN_STATE.searchTo) ? { start: CN_STATE.searchFrom, end: CN_STATE.searchTo } : null,
      !!CN_STATE.searchExact, !!CN_STATE.searchIncludeArchive);
}

function cnRenderSearchResults_() {
  const host = document.getElementById('cn-search-results');
  if (!host) return;
  if (!CN_STATE.searchQuery || CN_STATE.searchQuery.length < 2) {
    host.innerHTML = `<div class="cn-stack-empty">Type at least 2 characters to search.</div>`;
    return;
  }
  const results = CN_STATE.searchResults || [];
  if (results.length === 0) {
    host.innerHTML = `<div class="cn-stack-empty">No matches.</div>`;
    return;
  }
  const count = `<div class="cn-result-count"><b>${results.length}</b> result${results.length === 1 ? '' : 's'} for &ldquo;${esc(CN_STATE.searchQuery)}&rdquo;</div>`;
  host.innerHTML = count + results.map(function (n) { return cnRenderResultCard_(n); }).join('');
  // Term highlight (reuses the KB DOM-walk highlighter — wraps matches in
  // <mark class="kb-hl">, never string-level HTML surgery). Skip in exact mode.
  if (!CN_STATE.searchExact && typeof kbHighlightTerms_ === 'function') kbHighlightTerms_(host, CN_STATE.searchQuery);
}

// ── Manage (manager-only) view ─────────────────────────────────────────

function cnRenderManageView(area) {
  const compactHeader = COMPACT_MODE ? cnCompactHeader_('Team Notes', 'manage') : '';
  // "Export Range" button bundles every enrolled rep's notes for a range into
  // a new Sheet — the only path to a wider-than-flagged aggregate (training /
  // review digests cover flagged subsets only).
  const exportBtnRow = COMPACT_MODE
    ? ''
    : `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
         <button class="refresh-btn" id="cn-mgr-export-btn">${icon('download', 14)}Export Range</button>
       </div>`;
  area.innerHTML = `
    ${compactHeader}
    ${COMPACT_MODE ? '' : cnViewTitleBar_('Team Notes', 'Manager view: per-rep notes, training queue, review candidates.')}
    <div id="cn-mgr-action-badge" style="margin-bottom:10px"></div>
    ${exportBtnRow}
    <div class="toolbar-tabs" role="group" aria-label="Manager queue" style="margin-bottom:14px">
      <button class="toolbar-tab active" data-mqueue="training" onclick="cnMgrLoadQueue_('training')">Training</button>
      <button class="toolbar-tab" data-mqueue="review" onclick="cnMgrLoadQueue_('review')">Review Candidates</button>
      <button class="toolbar-tab" data-mqueue="rep" onclick="cnMgrLoadRepView_()">Per-Rep View</button>
      <button class="toolbar-tab" data-mqueue="stats" onclick="cnMgrLoadStatsView_()">Stats</button>
      <button class="toolbar-tab" data-mqueue="search" onclick="cnMgrLoadSearchView_()">Search</button>
    </div>
    <div id="cn-mgr-results"></div>
  `;
  const exportBtn = document.getElementById('cn-mgr-export-btn');
  if (exportBtn) exportBtn.addEventListener('click', cnOpenExportModal_);
  google.script.run
    .withSuccessHandler(function (res) {
      var el = document.getElementById('cn-mgr-action-badge');
      if (!el || !res || res.error) return;
      if (res.count > 0) {
        el.innerHTML = '<div style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;' +
          'background:var(--warn-soft);color:var(--warning-deep);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase">' +
          icon('flag', 12) + ' ' + res.count + ' unresolved action flag' + (res.count === 1 ? '' : 's') + ' across all reps</div>';
      }
    })
    // Cycle-9 L-28: the badge is ambient — no toast on failure (a landing
    // nag would be worse than a missing badge), but attach a handler so the
    // failure is at least observable in the console instead of vanishing.
    .withFailureHandler(function (err) { console.warn('unresolved-badge fetch failed: ' + ((err && err.message) || err)); })
    .managerGetUnresolvedActionCount();
  // Compliance audit deep-link (#3): if the Admin audit panel set a pending
  // drill, open the Per-Rep view for that rep+date instead of the default
  // training queue. CN_STATE.mgrRepView was set by cnAuditDrillToNote_.
  if (CN_STATE.mgrPendingRepDrill) {
    CN_STATE.mgrPendingRepDrill = false;
    cnMgrLoadRepView_();
  } else {
    cnMgrLoadQueue_('training');
  }
}

/** Compliance audit deep-link (#3) — from a row in the Admin audit panel,
 *  jump to the Team Notes → Per-Rep View for the note's rep + date so the
 *  manager can read the actual note content (the AuditLog itself is PHI-free).
 *  Mirrors cnStatsDrillDown_ but crosses from the Admin tab into Team Notes. */
function cnAuditDrillToNote_(repId, dateLocal, noteId) {
  repId = String(repId || '').trim();
  if (!repId) { showToast('No rep on this audit row', 'toast-warn'); return; }
  CN_STATE.mgrRepView = {
    repId: repId,
    date: dateLocal || new Intl.DateTimeFormat('en-CA', { timeZone: empTz() }).format(new Date()),
  };
  CN_STATE.mgrPendingRepDrill = true;
  showView('callNotesManage');
}

/** Opens the call-notes bulk export modal. Defaults to "this week" (Mon→today
 *  in the manager's local tz). Re-runnable — manager dashboard wiring grabs
 *  the modal by id on every open so it's idempotent. */
function cnOpenExportModal_() {
  const tz = empTz();
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz });
  const todayIso = fmt.format(new Date());
  // Default range = last 7 days
  const parts = todayIso.split('-');
  const today = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  const start = new Date(today); start.setDate(today.getDate() - 6);
  document.getElementById('cn-exp-start').value = isoDate(start);
  document.getElementById('cn-exp-end').value = todayIso;
  document.getElementById('cn-export-overlay').classList.add('open');
}

function cnMgrLoadQueue_(kind) {
  document.querySelectorAll('.toolbar-tab[data-mqueue]').forEach(function (b) {
    b.classList.toggle('active', b.dataset.mqueue === kind);
  });
  const host = document.getElementById('cn-mgr-results');
  if (host) host.innerHTML = loSkeleton(4);
  // F(M-8): all five Team Notes sub-tabs share the view key + #cn-mgr-results,
  // so the requestedView guard alone can't stop a late queue response from
  // overwriting a sub-tab the manager just switched to (tab bar highlighted
  // Stats, body showed the training queue). Every sub-tab entry bumps
  // mgrSubSeq; a response landing after a switch is dropped.
  const requestedView = currentView;
  const requestedSub = CN_STATE.mgrSubSeq = (CN_STATE.mgrSubSeq || 0) + 1;
  const fn = kind === 'training' ? 'managerGetTrainingQueue' : 'managerGetReviewCandidates';
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView || CN_STATE.mgrSubSeq !== requestedSub) return;
      const liveHost = document.getElementById('cn-mgr-results');
      if (!liveHost) return;
      if (res.error) { liveHost.innerHTML = `<div class="cn-stack-empty">${esc(res.error)}</div>`; return; }
      cnMgrRenderQueue_(liveHost, res.results || []);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView || CN_STATE.mgrSubSeq !== requestedSub) return;
      const liveHost = document.getElementById('cn-mgr-results');
      if (liveHost) liveHost.innerHTML = `<div class="cn-stack-empty">Failed: ${esc(err.message)}</div>`;
    })[fn]();
}

// ── Per-Rep view (manager — single rep, single date) ──
// Surfaces the server-side managerGetCallNotes endpoint that previously had
// no UI. Read-only cards (no flag/email/edit/delete actions) — the manager is
// looking at someone else's sheet and those endpoints scope to caller's sheet.

function cnMgrLoadRepView_() {
  document.querySelectorAll('.toolbar-tab[data-mqueue]').forEach(function (b) {
    b.classList.toggle('active', b.dataset.mqueue === 'rep');
  });
  const host = document.getElementById('cn-mgr-results');
  if (!host) return;
  // Load enrolled rep list once per session
  if (!CN_STATE.mgrEnrolledReps) {
    host.innerHTML = loSkeleton(4);
    const requestedView = currentView;   // F1 — drop late callbacks after nav-away
    // F(M-8): + sub-tab seq — a late rep-list response must not clobber a
    // sub-tab the manager switched to while it was in flight.
    const requestedSub = CN_STATE.mgrSubSeq = (CN_STATE.mgrSubSeq || 0) + 1;
    google.script.run
      .withSuccessHandler(function (res) {
        if (currentView !== requestedView || CN_STATE.mgrSubSeq !== requestedSub) return;
        if (res.error) { host.innerHTML = `<div class="cn-stack-empty">${esc(res.error)}</div>`; return; }
        CN_STATE.mgrEnrolledReps = res.reps || [];
        cnMgrRenderRepViewControls_(host);
      })
      .withFailureHandler(function (err) {
        if (currentView !== requestedView || CN_STATE.mgrSubSeq !== requestedSub) return;
        host.innerHTML = `<div class="cn-stack-empty">Failed: ${esc(err.message)}</div>`;
      })
      .getEnrolledCallNotesReps();
  } else {
    CN_STATE.mgrSubSeq = (CN_STATE.mgrSubSeq || 0) + 1;   // F(M-8): invalidate in-flight fetches
    cnMgrRenderRepViewControls_(host);
  }
}

function cnMgrRenderRepViewControls_(host) {
  const reps = CN_STATE.mgrEnrolledReps || [];
  if (reps.length === 0) {
    host.innerHTML = `<div class="cn-stack-empty">No reps are enrolled in Call Notes yet (column L of Employees roster is empty for everyone).</div>`;
    return;
  }
  if (!CN_STATE.mgrRepView) {
    CN_STATE.mgrRepView = {
      repId: reps[0].id,
      date: new Intl.DateTimeFormat('en-CA', { timeZone: empTz() }).format(new Date()),
    };
  }
  const repOpts = reps.map(function (r) {
    const sel = r.id === CN_STATE.mgrRepView.repId ? ' selected' : '';
    return `<option value="${esc(r.id)}"${sel}>${esc(r.name)}</option>`;
  }).join('');
  host.innerHTML = `
    <div class="cn-history-picker" style="margin-bottom:14px">
      <label style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase">Rep</label>
      <select id="cn-mgr-rep-pick" onchange="cnMgrRepChanged_(this.value)"
              style="padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);font-family:var(--ui);font-size:13px;background:var(--paper-card);color:var(--ink);outline:none">
        ${repOpts}
      </select>
      <label style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase">Date</label>
      <input type="date" id="cn-mgr-rep-date" value="${esc(CN_STATE.mgrRepView.date)}" onchange="cnMgrRepDateChanged_(this.value)">
    </div>
    <div id="cn-mgr-rep-stack"></div>
  `;
  cnMgrLoadRepNotes_();
}

function cnMgrRepChanged_(repId) {
  if (!CN_STATE.mgrRepView) return;
  CN_STATE.mgrRepView.repId = repId;
  cnMgrLoadRepNotes_();
}

function cnMgrRepDateChanged_(d) {
  if (!CN_STATE.mgrRepView || !d) return;
  CN_STATE.mgrRepView.date = d;
  cnMgrLoadRepNotes_();
}

function cnMgrLoadRepNotes_() {
  const stack = document.getElementById('cn-mgr-rep-stack');
  if (!stack || !CN_STATE.mgrRepView) return;
  stack.innerHTML = loSkeleton(4);
  const requestedView = currentView;
  const requestedRepId = CN_STATE.mgrRepView.repId;
  const requestedDate = CN_STATE.mgrRepView.date;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView) return;
      // Selection may have changed during the round trip — drop stale results.
      if (!CN_STATE.mgrRepView
          || CN_STATE.mgrRepView.repId !== requestedRepId
          || CN_STATE.mgrRepView.date !== requestedDate) return;
      const liveStack = document.getElementById('cn-mgr-rep-stack');
      if (!liveStack) return;
      if (res.error) { liveStack.innerHTML = `<div class="cn-stack-empty">${esc(res.error)}</div>`; return; }
      if (!res.notes || res.notes.length === 0) {
        liveStack.innerHTML = `<div class="cn-stack-empty">No notes for ${esc(res.repName || '')} on ${esc(res.date || '')}.</div>`;
        return;
      }
      liveStack.innerHTML = res.notes.map(cnMgrRenderReadonlyCard_).join('');
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      const liveStack = document.getElementById('cn-mgr-rep-stack');
      if (liveStack) liveStack.innerHTML = `<div class="cn-stack-empty">Failed: ${esc(err.message)}</div>`;
    })
    .managerGetCallNotes(requestedRepId, requestedDate, 'all');
}

/** Read-only card for the manager per-rep view. Reuses the styled card chrome
 *  but omits flag/copy/email/edit/delete actions — those endpoints scope to
 *  the caller's own sheet and would fail silently if invoked here. */
function cnMgrRenderReadonlyCard_(note) {
  const time = cnFormatTimestampForCopy_(note.timestamp);
  const flagCls = note.flagType ? ' flag-' + note.flagType : '';
  const callerLine = cnCallerDisplay_(note);
  const trxBit = note.caller && note.patientAndTrx ? `<span class="cn-trx">${esc(note.patientAndTrx)}</span>` : '';
  const issue = note.issue ? esc(note.issue) : '<em>—</em>';
  // Render the multi-turn thread (read-only) for ANY note that has one — a
  // training Q&A or general manager comments (item 9). Returns '' when empty.
  const threadHtml = cnRenderQAThread_(note, { readonly: true });
  const repId = (CN_STATE.mgrRepView && CN_STATE.mgrRepView.repId) || '';
  let editor = '';
  if (note.flagType === 'training' && note.subformData && note.subformData.trainingQuestion) {
    // Training notes keep the specialized, clearable reply editor.
    const existingReply = cnLatestManagerReply_(note.subformData).message;
    editor = `
      <div class="cn-mgr-reply-row" data-note-id="${esc(note.noteId)}" data-rep-id="${esc(repId)}">
        <input type="text" class="cn-mgr-reply-input" placeholder="${existingReply ? 'Edit reply…' : 'Reply to this question…'}"
               value="${esc(existingReply)}">
        <button type="button" class="cn-mgr-reply-save" onclick="cnMgrSaveTrainingReply_(this)">
          ${icon('check', 12)}<span>${existingReply ? 'Update' : 'Send'}</span>
        </button>
        ${existingReply
          ? `<button type="button" class="cn-mgr-reply-clear" onclick="cnMgrClearTrainingReply_(this)" title="Clear reply">${icon('x', 12)}</button>`
          : ''}
      </div>
    `;
  } else {
    // Any other note gets a general manager-comment box (feedback / praise) —
    // appends to subformData.feedback[] via setCallNoteManagerComment (item 9).
    editor = `
      <div class="cn-mgr-reply-row" data-note-id="${esc(note.noteId)}" data-rep-id="${esc(repId)}">
        <input type="text" class="cn-mgr-reply-input" placeholder="Add a comment for this rep…">
        <button type="button" class="cn-mgr-reply-save" onclick="cnMgrSaveComment_(this)">
          ${icon('check', 12)}<span>Comment</span>
        </button>
      </div>
    `;
  }
  const resolution = note.resolution
    ? `<div class="cn-card-issue" style="color:var(--muted);font-style:italic;margin-top:2px">→ ${esc(note.resolution)}</div>`
    : '';
  const flagPill = note.flagType
    ? `<span class="adj-pill" style="text-transform:uppercase;font-size:10px;letter-spacing:.06em">${esc(note.flagType)}${note.flagType === 'action' && note.resolved ? ' · resolved' : ''}</span>`
    : '';
  const sentPill = cnDeptEmailPillHtml_(note);   // readable "emailed to <depts>" (no truncation)
  // Manager-side form-submission viewer: clickable pill when the rep's note
  // carries a submitted fillable form (parallels the rep's cn-form-pill).
  const mgrFormSub = (note.subformData && note.subformData.formSubmission) ? note.subformData.formSubmission : null;
  const mgrRepIdForForm = (CN_STATE.mgrRepView && CN_STATE.mgrRepView.repId) || '';
  const formPill = (mgrFormSub && mgrFormSub.token)
    ? `<button class="cn-form-pill" title="Form received — view submission" data-token="${esc(mgrFormSub.token)}" data-rep-id="${esc(mgrRepIdForForm)}" onclick="cnMgrViewFormSubmission_(this)">${icon('paperclip', 11)}<span>form</span></button>`
    : '';
  const urgentCls = cnIsUrgent_(note) ? ' is-urgent' : '';
  return `
    <div class="cn-card${flagCls}${urgentCls}" data-note-id="${esc(note.noteId)}">
      <div class="cn-card-row">
        <span class="cn-card-time tabular">${esc(time)}</span>
        <div class="cn-card-main">
          <div class="cn-card-caller">${callerLine}${trxBit}${cnUrgentPillHtml_(note)}${cnIntakePillHtml_(note)}</div>
          <div class="cn-card-issue">${issue}</div>
          ${threadHtml}
          ${resolution}
        </div>
        <div class="cn-card-actions">
          ${flagPill}
          ${sentPill}
          ${cnExtEmailPillHtml_(note)}
          ${formPill}
        </div>
      </div>
      ${editor}
      <div class="cn-mgr-card-actions">
        <button type="button" class="cn-mgr-coach-btn" data-rep-id="${esc(repId)}" data-note-id="${esc(note.noteId)}"
                data-patient-trx="${esc(note.patientAndTrx || '')}" onclick="cnMgrCoachOnNote_(this)"
                title="Log coaching for this rep about this call">${icon('bulb', 12)} Coach</button>
        <button type="button" class="cn-mgr-del-btn" data-note-id="${esc(note.noteId)}" data-rep-id="${esc(repId)}"
                onclick="cnMgrDeleteNote_(this)" title="Delete this note from the rep's history (manager — audited)">${icon('trash', 12)} Delete</button>
      </div>
    </div>
  `;
}

/** "Coach on this" — jumps to Training → Coaching with the rep + this call's
 *  patient/TRX + noteId pre-filled into the composer (the CLK_NAV_HINT pattern,
 *  via window.COACH_PREFILL which coachRenderMgr_ reads + clears). */
function cnMgrCoachOnNote_(btn) {
  window.COACH_PREFILL = {
    empId: btn.dataset.repId || '',
    patientTRX: btn.dataset.patientTrx || '',
    noteId: btn.dataset.noteId || '',
  };
  // The tool's TOOLS-registry key is 'develop' (label "Training & Employee
  // Docs") — enterTool returns SILENTLY on an unknown key, so the old

/** Operator feedback (2026-06-12) — manager delete from history. The rep
 *  self-delete window is 5 min (INV-60); this is the manager path its error
 *  message always pointed at ("ask your manager"). Audited with the manager
 *  as actor; uiConfirm danger gate. */
function cnMgrDeleteNote_(btn) {
  const noteId = btn.dataset.noteId;
  const repId = btn.dataset.repId;
  if (!noteId || !repId) return;
  uiConfirm({
    title: 'Delete this note?',
    message: 'Permanently removes it from the rep\'s history. This cannot be undone (an audit row records the deletion).',
    confirmLabel: 'Delete', tone: 'danger',
  }).then(function (ok) {
    if (!ok) return;
    btn.disabled = true;
    const card = btn.closest('.cn-card') || btn.closest('[data-note-id]');
    if (card) card.classList.add('is-deleting');
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        if (!res.success) {
          if (card) card.classList.remove('is-deleting');
          showToast(res.error || 'Delete failed', 'toast-error');
          return;
        }
        showToast('Note deleted', 'toast-success');
        cnMgrLoadRepNotes_();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        if (card) card.classList.remove('is-deleting');
        showToast('Delete failed: ' + err.message, 'toast-error');
      })
      .managerDeleteCallNote(repId, noteId);
  });
}

function cnStatsFmtDur_(sec) {
  if (sec == null) return '—';
  if (sec < 60) return sec + 's';
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + 'm ' + (s ? s + 's' : '00s');
}
// Sort accessors for the CN Stats table (parallels mSortReps_).
function cnStatsSortReps_(reps, sort) {
  var key = sort.key, dir = (sort.dir === 'asc') ? 1 : -1;
  var get = function (r) {
    var fc = r.flagCounts || {};
    switch (key) {
      case 'repName': return String(r.repName || '').toLowerCase();
      case 'totalNotes': return r.totalNotes || 0;
      case 'action': return fc.action || 0;
      case 'training': return fc.training || 0;
      case 'review': return fc.review || 0;
      case 'emails': return r.emailsSent || 0;
      case 'median': return (r.medianCompletionSeconds == null ? -1 : r.medianCompletionSeconds);
      case 'pct': return (r.cdr && r.cdr.pctAnswered != null) ? r.cdr.pctAnswered : -1;
      case 'coverage': return (r.noteCoverage == null ? -1 : r.noteCoverage);
      default: return 0;
    }
  };
  return reps.slice().sort(function (a, b) { var x = get(a), y = get(b); return x < y ? -1 * dir : x > y ? 1 * dir : 0; });
}
function cnStatsSort_(key) {
  var s = CN_STATE.statsSort || { key: 'totalNotes', dir: 'desc' };
  if (s.key === key) s.dir = (s.dir === 'asc') ? 'desc' : 'asc';
  else { s.key = key; s.dir = (key === 'repName') ? 'asc' : 'desc'; }
  CN_STATE.statsSort = s;
  var body = document.getElementById('cn-mgr-stats-body');
  if (body && CN_STATE.statsData) cnMgrRenderStats_(body, CN_STATE.statsData);
}

// §7b/#3 — scannable table via the SHARED mtRenderTable_ component (also drives
// the Metrics team table). Sortable headers + tri-tone % / coverage. Rep name
// stays a drill-link to the Per-Rep view (cnStatsDrillDown_).
function cnMgrRenderStats_(host, res) {
  const reps = res.reps || [];
  if (reps.length === 0) {
    host.innerHTML = `<div class="cn-stack-empty">No reps enrolled, or no activity on ${esc(res.date)}.</div>`;
    return;
  }
  CN_STATE.statsData = res;
  CN_STATE.statsSort = CN_STATE.statsSort || { key: 'totalNotes', dir: 'desc' };
  const pctCls = (typeof mPctClass_ === 'function') ? mPctClass_ : function () { return ''; };
  const covBadge = (typeof mCoverageBadge_ === 'function') ? mCoverageBadge_ : function (p) { return p + '%'; };
  const sorted = cnStatsSortReps_(reps, CN_STATE.statsSort);
  host.innerHTML =
    mtRenderTable_({
      rows: sorted,
      sort: CN_STATE.statsSort,
      onSort: 'cnStatsSort_',
      columns: [
        { key: 'repName', label: 'Rep', name: true, sortable: true, cell: function (r) { return '<a class="cn-stats-name-link" href="#" data-stats-rep-id="' + esc(r.repId) + '" onclick="event.preventDefault(); cnStatsDrillDown_(this.dataset.statsRepId)">' + esc(r.repName) + '</a>'; } },
        { key: 'totalNotes', label: 'Notes', numeric: true, sortable: true, cell: function (r) { return esc(r.totalNotes); } },
        { key: 'action', label: 'Action', numeric: true, sortable: true, cell: function (r) { var fc = r.flagCounts || {}; return esc(fc.action || 0) + ((r.resolvedCount && fc.action) ? ' <span style="color:var(--muted);font-size:.85em">(' + esc(r.resolvedCount) + ' res)</span>' : ''); } },
        { key: 'training', label: 'Training', numeric: true, sortable: true, cell: function (r) { return esc((r.flagCounts || {}).training || 0); } },
        { key: 'review', label: 'Review', numeric: true, sortable: true, cell: function (r) { return esc((r.flagCounts || {}).review || 0); } },
        { key: 'emails', label: 'Emails', numeric: true, sortable: true, cell: function (r) { return esc(r.emailsSent || 0); } },
        { key: 'median', label: 'Median', numeric: true, sortable: true, cell: function (r) { return esc(cnStatsFmtDur_(r.medianCompletionSeconds)); } },
        { key: 'pct', label: '% Ans', numeric: true, sortable: true, cell: function (r) { var p = r.cdr ? r.cdr.pctAnswered : null; return (p == null) ? '<span style="color:var(--muted)">—</span>' : '<span class="' + pctCls(p) + '">' + esc(p) + '%</span>'; } },
        { key: 'coverage', label: 'Coverage', numeric: true, sortable: true, cell: function (r) { return (r.noteCoverage != null) ? covBadge(r.noteCoverage) : '<span style="color:var(--muted)">—</span>'; } },
      ],
    }) +
    '<div class="cn-stats-foot-note">' +
      'Median note time = form-start → submit duration (skips outliers &gt; 30 min; covers only notes that captured one). ' +
      '% Answered / Coverage come from CDR — absent when there’s no CDR data for the rep/date.' +
    '</div>';
}

// ── Ambient (sidebar badge) polling ────────────────────────────────────

function cnStartAmbientPolling_() {
  // F(cycle-8): IDEMPOTENT — showView now (re)starts the poller on EVERY CN
  // tab entry (previously only the Log enter did, so a deep-link/refresh
  // landing on History/Search/Team Notes left the sidebar badge + the ≤60s
  // flagsVersion propagation dead until the rep visited Log once). A live
  // timer is left alone so CN-internal tab hops don't fire an extra RPC per
  // nav; the fresh-start path still polls immediately.
  cnEnsureLiveRefreshBound_();
  // F(cycle-8): staleness-gated immediate poll — a fresh entry (or a return
  // after >30s away) polls now so the stats-mini/badge populate; a rapid
  // CN-internal tab hop costs nothing. The 60s timer is created once.
  if (!CN_STATE.lastAmbientAt || (Date.now() - CN_STATE.lastAmbientAt) > 30000) cnPollAmbient_();
  if (!CN_STATE.ambientTimer) CN_STATE.ambientTimer = setInterval(cnPollAmbient_, 60000);
}

/** Stable signature of the rolling-note set for the live-refresh skip-render
 *  guard. Server-meaningful fields only — client-transient keys (anything
 *  prefixed `_`, e.g. `_pending` / `_flagInFlight`) are dropped so they don't
 *  spuriously force a re-render. Returns null on any failure (fail-open: a null
 *  signature never matches, so we render). */
function cnRollingStackSignature_(notes) {
  try {
    return JSON.stringify(notes || [], function (k, v) {
      return (k && k.charAt(0) === '_') ? undefined : v;
    });
  } catch (e) { return null; }
}

/** #3 live-sync: re-fetch today's notes and re-render the rolling stack so a
 *  note logged in ANOTHER context (the pop-out, or the rep's other window) —
 *  or any drift from the in-memory stack — surfaces without a manual nav.
 *  Log view only; skipped mid inline-edit so an open editor isn't wiped.
 *  Optimistic `_pending` notes not yet on the server are preserved on top.
 *  Re-render is signature-guarded (cnRollingStackSignature_) so an unchanged
 *  poll doesn't flash the stack. */
function cnRefreshRollingStack_(then) {
  // `then` (optional) fires on EVERY exit path, so a caller driving a UI
  // indicator (e.g. the instant-paint "Refreshing…" pill) can always clear it.
  const done = function () { if (typeof then === 'function') then(); };
  if (currentView !== 'callNotes' || !CN_STATE.enrolled) { done(); return; }
  if (CN_STATE.editingNoteId) { done(); return; }   // don't clobber an open inline edit
  const requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || res.error || res.enrolled === false) { done(); return; }
      if (currentView !== requestedView) { done(); return; }
      const server = res.notes || [];
      const serverIds = {};
      server.forEach(function (n) { serverIds[n.noteId] = true; });
      const local = CN_STATE.rollingNotes || [];
      const pending = local.filter(function (n) {
        return n._pending && !serverIds[n.noteId];
      });
      // F(cycle-8, INV-56): a confirmed note with a flag/resolve/pin RPC in
      // flight must keep its LOCAL object — replacing it with the server's
      // pre-write copy visibly reverted the optimistic toggle AND detached
      // the _flagInFlight guard (a second click could then fire a concurrent
      // clobbering RPC, the exact race the guard exists to prevent).
      const inFlightById = {};
      local.forEach(function (n) { if (n._flagInFlight && !n._pending) inFlightById[n.noteId] = n; });
      CN_STATE.rollingNotes = pending.concat(server.map(function (n) {
        return inFlightById[n.noteId] || n;
      }));
      CN_STATE.autoCopyFormat = res.autoCopyFormat || CN_STATE.autoCopyFormat || '';
      CN_STATE.rollingEntry = { at: Date.now() };   // keep the SWR instant-paint cache warm
      // Skip the re-render (and its visible flash) when the note set is byte-for-byte
      // unchanged — this poll/focus refresh fires every 60s + on every window wake,
      // and an unconditional re-render was flashing the stack "for no reason".
      const sig = cnRollingStackSignature_(CN_STATE.rollingNotes);
      if (sig === null || sig !== CN_STATE._rollingStackSig) {
        CN_STATE._rollingStackSig = sig;
        cnRenderStack_();
        cnRenderFilterBar_();
      }
      done();
    })
    .withFailureHandler(function () { done(); /* live-refresh is best-effort */ })
    .getMyCallNotes({ filter: 'all' });
}

/** Bind window focus + visibility refresh ONCE (idempotent). Both fire on a
 *  tab/window switch; a 2s throttle collapses the focus+visibilitychange
 *  double-fire. No-op off the Log view, so the listeners can stay bound for
 *  the page lifetime (matches the ambient-poll "no-op when not mounted"
 *  posture). */
function cnEnsureLiveRefreshBound_() {
  if (CN_STATE._liveRefreshBound) return;
  CN_STATE._liveRefreshBound = true;
  const onWake = function () {
    if (document.hidden || currentView !== 'callNotes') return;
    const now = Date.now();
    if (now - (CN_STATE._lastLiveRefresh || 0) < 2000) return;
    CN_STATE._lastLiveRefresh = now;
    cnRefreshRollingStack_();
  };
  window.addEventListener('focus', onWake);
  document.addEventListener('visibilitychange', onWake);
}

function cnStopAmbientPolling_() {
  if (CN_STATE.ambientTimer) { clearInterval(CN_STATE.ambientTimer); CN_STATE.ambientTimer = null; }
}

/** Refetch live-editable config after an ambient flagsVersion change, and
 *  reapply the resolved flags to both empState.flags and deptConfig.flags so
 *  flagOn_ reflects the new values on the next render. Silent + best-effort —
 *  no re-render is forced; the rep's next form/composer render picks it up,
 *  and any server-scope flag is enforced server-side regardless. */
function cnRefreshConfigForFlags_() {
  google.script.run
    .withSuccessHandler(function (cfg) {
      if (!cfg || cfg.error) return;
      CN_STATE.deptConfig = cfg;
      if (typeof empState !== 'undefined' && empState && cfg.flags) empState.flags = cfg.flags;
    })
    .withFailureHandler(function () { /* best-effort — keep the stale config */ })
    .getCallNotesDepartments();
}

function cnPollAmbient_() {
  CN_STATE.lastAmbientAt = Date.now();   // F(cycle-8): fire-time stamp for the staleness-gated start
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || res.error) return;
      if (res.enrolled === false) return;
      CN_STATE.lastAmbientRes = res;     // F(cycle-8): instant paint on the next Log enter
      CN_STATE.staleFlagHours = res.staleFlagHours || 1;
      // Runtime feature-flag propagation: if the manager flipped a toggle the
      // ambient flagsVersion changes → refetch deptConfig (flags + templates +
      // rates) so the UI honors it within ~60s without a manual reload. Skip
      // the first poll (no prior baseline — deptConfig is already fresh from
      // view enter).
      if (res.flagsVersion && res.flagsVersion !== CN_STATE.flagsVersion) {
        const hadBaseline = CN_STATE.flagsVersion !== undefined && CN_STATE.flagsVersion !== null;
        CN_STATE.flagsVersion = res.flagsVersion;
        if (hadBaseline) cnRefreshConfigForFlags_();
      }
      // V4 Phase 4 — update stats-mini and quick-chip-row if they're mounted
      // on the current Log view. Both are no-ops when the elements aren't in
      // the DOM (rep is on a different view).
      cnUpdateStatsMini_(res);
      cnUpdateQuickChipRow_(res);
      // #3 live-sync — re-fetch + re-render today's rolling stack on the Log
      // view so a note logged in another context (pop-out / second window)
      // appears within the 60s poll without a manual nav. Log only.
      // F(cycle-8): skip when the stack was fetched moments ago — the Log
      // enter's own cnLoadToday_/SWR fetch had just resolved when this poll's
      // success handler fired, doubling the getMyCallNotes per enter. Only
      // THIS (poll-driven) call site is staleness-gated; the focus/visibility
      // wake and nav paths refresh unconditionally (cross-window sync).
      const stackFresh = CN_STATE.rollingEntry && (Date.now() - (CN_STATE.rollingEntry.at || 0)) < 15000;
      if (currentView === 'callNotes' && !stackFresh) cnRefreshRollingStack_();
      // Update sidebar badge on the Call Notes nav link
      const link = document.querySelector('.sb-link[data-tool="callNotes"]')
                || document.querySelector('.nav-btn[data-tool="callNotes"]');
      if (!link) return;
      let badge = link.querySelector('.cn-stale-badge');
      const count = res.staleActionCount || 0;
      if (count <= 0) { if (badge) badge.remove(); return; }
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'cn-stale-badge';
        link.appendChild(badge);
      }
      badge.textContent = String(count);
    })
    .withFailureHandler(function (err) {
      // Benign: the next 60s tick retries. Log only (matches the
      // failure-handler discipline of every other RPC in this file) — the
      // badge/stats simply stay at their last value rather than failing silently.
      console.warn('cnPollAmbient_ failed: ' + ((err && err.message) || err));
    })
    .getCallNotesAmbient();
}

/** Round 2 · 8g — render multi-turn Q&A thread on training-flagged note
 *  cards. The thread is the union of the legacy (trainingQuestion,
 *  trainingReply) pair AND subformData.feedback[] (new shape). Each
 *  message shows the role badge + the message text + the timestamp.
 *  When the most recent message is from the manager and the rep hasn't
 *  responded yet, action buttons (👍 Got it / 💬 Clarify) render below
 *  the thread. The 💬 button expands an inline textarea + Submit. */
function cnRenderQAThread_(note, opts) {
  const readonly = !!(opts && opts.readonly);
  if (!note) return '';   // item 9: render for ANY note that has a thread (training Q&A or general manager comments), not just training
  const sub = note.subformData || {};
  // Build the thread: optional rep question seed + manager replies / agent
  // entries via feedback[], with the legacy single trainingReply folded in
  // if no feedback array exists yet.
  const thread = [];
  if (sub.trainingQuestion) {
    thread.push({ role: 'agent', kind: 'question', message: String(sub.trainingQuestion), at: '' });
  }
  if (Array.isArray(sub.feedback) && sub.feedback.length > 0) {
    sub.feedback.forEach(function (e) {
      if (!e) return;
      thread.push({
        role: e.role || 'manager',
        kind: e.kind || 'reply',
        message: String(e.message || ''),
        at: String(e.at || ''),
        by: String(e.by || ''),
      });
    });
  } else if (sub.trainingReply) {
    // Legacy path — synthesize one manager entry
    thread.push({
      role: 'manager',
      kind: 'reply',
      message: String(sub.trainingReply),
      at: String(sub.trainingReplyAt || ''),
      by: String(sub.trainingReplyBy || ''),
    });
  }
  if (thread.length === 0) return '';
  // Decide whether response buttons should show: only if the rep hasn't
  // already acked or sent a clarification, and there IS at least one
  // manager message to respond to.
  const lastMgrIdx = (function () {
    for (let i = thread.length - 1; i >= 0; i--) {
      if (thread[i].role === 'manager') return i;
    }
    return -1;
  })();
  let hasAgentResponse = false;
  if (lastMgrIdx >= 0) {
    for (let i = lastMgrIdx + 1; i < thread.length; i++) {
      if (thread[i].role === 'agent') { hasAgentResponse = true; break; }
    }
  }
  const canRespond = lastMgrIdx >= 0 && !hasAgentResponse;
  const entriesHtml = thread.map(function (e) {
    const roleCls = e.role === 'manager' ? 'qa-mgr' : 'qa-agent';
    const kindLabel = e.kind === 'ack' ? '· ack'
      : e.kind === 'question' ? '· question'
      : e.kind === 'clarification' ? '· clarification'
      : '';
    const body = e.kind === 'ack'
      ? '<em>Got it</em>'
      : esc(e.message || '');
    const ts = e.at ? '<span class="qa-ts">' + esc(String(e.at).slice(11, 16)) + '</span>' : '';
    return '<div class="qa-row ' + roleCls + '">'
      + '<span class="qa-role">' + (e.role === 'manager' ? 'Mgr' : 'You') + ' ' + kindLabel + '</span>'
      + '<span class="qa-msg">' + body + '</span>'
      + ts
      + '</div>';
  }).join('');
  const actionsHtml = (canRespond && !readonly)
    ? '<div class="qa-actions">'
        + '<button type="button" class="qa-ack-btn" data-qa-ack="' + esc(note.noteId) + '">👍 Got it</button>'
        + '<button type="button" class="qa-clarify-btn" data-qa-clarify="' + esc(note.noteId) + '">💬 Clarify</button>'
      + '</div>'
      + '<div class="qa-clarify-row" data-qa-clarify-row="' + esc(note.noteId) + '" hidden>'
        + '<textarea class="qa-clarify-input" placeholder="Your follow-up question…"></textarea>'
        + '<button type="button" class="qa-clarify-submit">Send</button>'
      + '</div>'
    : '';
  return '<div class="qa-thread">' + entriesHtml + actionsHtml + '</div>';
}

/** Round 2 · 8z — Consumes window.CLK_NAV_HINT (set by the Clock view's
 *  coverage-strip CTA, fileMissingCalls_). Today: surfaces a toast so the
 *  rep sees the source context. Future-ready for when per-call CDR data
 *  exists: extend hint.calls[] to carry call IDs, then prefill the form
 *  or auto-filter the rolling stack here. Always nulls the hint after
 *  read so subsequent CN view enters don't re-fire the same toast. */
function cnConsumeNavHint_() {
  const hint = window.CLK_NAV_HINT;
  if (!hint || hint.source !== 'coverageStrip') return;
  window.CLK_NAV_HINT = null;
  if (typeof showToast !== 'function') return;
  const n = hint.missingCount || 0;
  const dateLabel = hint.date ? ' for ' + hint.date : ' for today';
  const msg = n > 0
    ? `Filing ${n} missing note${n > 1 ? 's' : ''}${dateLabel}`
    : `Note coverage${dateLabel}`;
  showToast(msg, 'toast-success');
}

/** Consume a shared cross-tool nav hint targeting Call Notes (e.g. a Spanish
 *  Inbox tool-suggestion chip). Renders the request context banner at the top
 *  of the Log view and prefills the Issue field with the request subject (only
 *  if empty) so the logged note references the inbound email. One-shot —
 *  appTakeNavHint_ nulls the hint. */
function cnConsumeAppNavHint_() {
  if (typeof appTakeNavHint_ !== 'function') return;
  const hint = appTakeNavHint_('callNotes');
  // Plain Log enter (no hint): drop any stale carried template so it can't
  // preselect an unrelated note's composer on a later, unrelated compose.
  if (!hint) { CN_STATE.pendingComposeTemplate = null; return; }
  const area = document.getElementById('view-area');
  if (area && typeof appShowNavHintBanner_ === 'function') appShowNavHintBanner_(hint, area);
  try {
    const cur = (typeof cnGetFieldValue_ === 'function') ? cnGetFieldValue_('cn-fld-issue') : '';
    if (!cur && hint.subject && typeof cnSetFieldValue_ === 'function') {
      cnSetFieldValue_('cn-fld-issue', hint.subject);
    }
  } catch (_) {}
  // Carry the chip's suggested update-type into the NEXT composer open (one-shot,
  // applied by cnLoadComposerDefaults_) so "Log: Verified Shipping" lands the rep
  // directly in that email flow with the right subform.
  CN_STATE.pendingComposeTemplate = hint.template || '';
  if (typeof showToast === 'function') {
    showToast(hint.template ? ('Ready to log — ' + hint.template) : 'Ready to log this request', 'toast-success');
  }
}

/** V4 Phase 4 — parse ?prefill=key:value;key:value... query params and
 *  populate the matching cn-fld-* inputs. Pre-filled fields are tagged
 *  with .cn-field.prefilled so the rep can see what was auto-set.
 *  Currently dormant (the Clock coverage strip CTA doesn't pass prefill
 *  because there's no per-call CDR data) but future-ready: when per-call
 *  data lands, the CTA can construct a prefill string and this handler
 *  picks it up. */
function cnApplyPrefillFromUrl_() {
  try {
    // Read via __URL_PARAMS (SERVER_QUERY_PARAMS-backed) — the HtmlService
    // iframe sandboxes window.location.search, so the deploy URL's ?prefill=
    // is invisible through it (INV-78). Using __URL_PARAMS makes the deep-link
    // actually fire in production (F15).
    const raw = __URL_PARAMS.get('prefill');
    if (!raw) return;
    const pairs = raw.split(';').map(s => s.trim()).filter(Boolean);
    const supported = { callback: 'cn-fld-callback', caller: 'cn-fld-caller', patient: 'cn-fld-patient', date: null };
    pairs.forEach(pair => {
      const idx = pair.indexOf(':');
      if (idx < 0) return;
      const key = pair.substring(0, idx).trim();
      const value = pair.substring(idx + 1).trim();
      const targetId = supported[key];
      if (!targetId) return; // unknown key — ignore (date is informational only)
      // Round 2 deferred 8e — use cnSetFieldValue_ so contenteditable .ce
      // divs and legacy input/textarea both work transparently. Input event
      // is dispatched inside the setter for callback-formatter + persistence.
      cnSetFieldValue_(targetId, value);
      const el = document.getElementById(targetId);
      if (!el) return;
      // Tag prefilled row (covers both old .cn-field and new .cnv-row markup)
      const fieldCell = el.closest('.cn-field') || el.closest('.cnv-row');
      if (fieldCell) fieldCell.classList.add('prefilled');
    });
  } catch (e) { /* malformed prefill — ignore */ }
}

/** V4 Phase 4 — populate the Log view's stats-mini header from the
 *  getCallNotesAmbient response. Cells: Today / Week / Unresolved.
 *  Unresolved-cell tone goes warn-toned when >0, crit when >3.
 *  Silent no-op when the Log view isn't mounted. */
function cnUpdateStatsMini_(res) {
  const today = document.getElementById('cn-stat-today');
  const week  = document.getElementById('cn-stat-week');
  const flag  = document.getElementById('cn-stat-flag');
  if (!today || !week || !flag) return;
  // §4 count-up — animate from 0 to the value (replaces the loading dots).
  // F(cycle-8): only when the value CHANGED — the 60s poll used to re-run the
  // animation every minute, so Today/Week/Unresolved visibly re-counted from
  // 0 while the rep watched. An unchanged value just sets the text.
  const setOrCount = function (el, v) {
    if (String(el.textContent).trim() === String(v)) return;
    if (/^\d+$/.test(String(el.textContent).trim())) { el.textContent = String(v); return; }   // changed number → snap (no from-zero replay)
    countUp_(el, v);   // first paint (loading dots) → animate
  };
  setOrCount(today, res.todayTotal || 0);
  setOrCount(week,  res.weekTotal  || 0);
  const unresolved = res.unresolvedActionCount || 0;
  setOrCount(flag, unresolved);
  flag.classList.remove('warn', 'crit');
  if (unresolved >= 3)      flag.classList.add('crit');
  else if (unresolved >= 1) flag.classList.add('warn');
}

/** V4 Phase 4 — render the bottom quick-chip-row from getCallNotesAmbient's
 *  flagCounts. Each chip taps through to the History view filtered by tag
 *  (existing CN_STATE.filter mechanism + tab nav). Counts are read-only;
 *  the chips never mutate state. */
function cnUpdateQuickChipRow_(res) {
  const row = document.getElementById('cn-quick-chip-row');
  if (!row) return;
  const counts = res.flagCounts || {};
  const chips = [
    { flag: 'all',        label: 'All',         count: counts.all || 0 },
    { flag: 'action',     label: 'Action',      count: counts.action || 0 },
    { flag: 'training',   label: 'Training',    count: counts.training || 0 },
    { flag: 'review',     label: 'Review',      count: counts.review || 0 },
    { flag: 'unresolved', label: 'Unresolved',  count: counts.unresolved || 0 },
    { flag: 'qa',         label: 'Q&A',         count: counts.qa || 0 },
  ];
  row.innerHTML = '<span class="cn-quick-chip-row-label">Jump to history</span>'
    + chips.map(c => `<button type="button" class="cn-quick-chip" data-flag="${esc(c.flag)}">${esc(c.label)} <span class="count">${c.count}</span></button>`).join('');
  // Wire chip clicks: navigate to History view with the filter pre-selected.
  // Maps the chip's flag → CN_STATE.filter, then shows the history tab.
  row.querySelectorAll('.cn-quick-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const f = btn.dataset.flag || 'all';
      // Map "qa" → "answered" (existing CN filter name for training Q&A)
      const filterName = f === 'qa' ? 'answered' : f;
      CN_STATE.filter = filterName;
      if (typeof showView === 'function') showView('callNotesHistory');
    });
  });
}

// ── Bulk Export modal wiring ───────────────────────────────────────────
// Bound once at module load. The modal's DOM lives in modals.html and is
// reused across opens (cnOpenExportModal_ just toggles the .open class).
// Uses cn-exp-preset-btn instead of preset-btn to avoid the time-clock
// export modal's preset-btn listeners stomping on these clicks.

(function cnWireExportModal_() {
  const overlay = document.getElementById('cn-export-overlay');
  if (!overlay) return;

  const cancelBtn = document.getElementById('cn-exp-cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', function () {
    overlay.classList.remove('open');
  });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  // Preset buttons set the start/end date inputs based on the manager's tz
  document.querySelectorAll('.cn-exp-preset-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const tz = empTz();
      const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz });
      const todayIso = fmt.format(new Date());
      const parts = todayIso.split('-');
      const today = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
      let start, end;
      const preset = btn.dataset.cnPreset;
      if (preset === 'this-week') {
        // Monday of the current week
        const dow = today.getDay();  // 0=Sun, 1=Mon…
        const back = dow === 0 ? 6 : dow - 1;
        start = new Date(today); start.setDate(today.getDate() - back);
        end = today;
      } else if (preset === 'last-week') {
        const dow = today.getDay();
        const back = dow === 0 ? 6 : dow - 1;
        end = new Date(today); end.setDate(today.getDate() - back - 1);  // last Sunday
        start = new Date(end); start.setDate(end.getDate() - 6);          // Monday before
      } else if (preset === 'last-7') {
        start = new Date(today); start.setDate(today.getDate() - 6);
        end = today;
      } else if (preset === 'last-30') {
        start = new Date(today); start.setDate(today.getDate() - 29);
        end = today;
      }
      if (start && end) {
        document.getElementById('cn-exp-start').value = isoDate(start);
        document.getElementById('cn-exp-end').value = isoDate(end);
      }
    });
  });

  const submitBtn = document.getElementById('cn-exp-submit');
  if (submitBtn) submitBtn.addEventListener('click', function () {
    const start = document.getElementById('cn-exp-start').value;
    const end = document.getElementById('cn-exp-end').value;
    if (!start || !end) { showToast('Please pick both dates', 'toast-error'); return; }
    if (start > end) { showToast('Start date must be before end date', 'toast-error'); return; }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Generating…';
    google.script.run
      .withSuccessHandler(function (res) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Generate Export';
        if (!res || res.error || !res.success) {
          showToast((res && res.error) || 'Export failed', 'toast-error');
          return;
        }
        overlay.classList.remove('open');
        showToast(`Exported ${res.noteCount} notes — opening sheet`, 'toast-success');
        window.open(res.url, '_blank');
      })
      .withFailureHandler(function (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Generate Export';
        showToast((err.message || 'Server error'), 'toast-error');
      })
      .exportCallNotesRange(start, end);
  });
})();

function cnStartDragModal_(e) {
  var modal = document.getElementById('cnC-modal');
  if (!modal) return;
  var startX = e.clientX, startY = e.clientY;
  var rect = modal.getBoundingClientRect();
  var origLeft = rect.left, origTop = rect.top;
  modal.style.position = 'fixed';
  modal.style.left = origLeft + 'px';
  modal.style.top = origTop + 'px';
  modal.style.margin = '0';
  function onMove(ev) {
    modal.style.left = (origLeft + ev.clientX - startX) + 'px';
    modal.style.top = (origTop + ev.clientY - startY) + 'px';
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  e.preventDefault();
}

function cnRetentionRowHtml_(key, label, val, destructive) {
  var v = (val && val.value) || 0;
  var src = (val && val.source) || 'default';
  var tagText = v > 0 ? (v + ' days') : 'disabled';
  return '<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)">' +
    '<div style="flex:1;min-width:0">' +
      '<div style="font-size:13px;font-weight:600">' + esc(label) +
        (destructive ? ' <span style="font-size:11px;color:var(--danger)">· irreversible</span>' : ' <span style="font-size:11px;color:var(--muted)">· non-destructive</span>') +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted)">currently <strong>' + esc(tagText) + '</strong> · source: ' + esc(src) + '</div>' +
    '</div>' +
    '<input type="number" min="0" step="1" id="cn-ret-' + key + '" value="' + (v || '') + '" placeholder="0" ' +
      'style="width:90px;flex:0 0 auto" aria-label="' + esc(label) + ' days">' +
  '</div>';
}
function cnRenderRetentionHtml_(res) {
  var warnHtml = '';
  if (res.warnings && res.warnings.length) {
    warnHtml = '<div style="background:var(--warn-soft);border:1px solid var(--warning-deep);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:12px;color:var(--warning-deep)">' +
      res.warnings.map(function (w) { return '⚠ ' + esc(w); }).join('<br>') + '</div>';
  }
  return '<div style="background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px">' +
    '<div class="day-section-label" style="margin-bottom:6px">' + icon('clock', 14) + ' Call-note retention</div>' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:6px">Three independent windows (days; 0 = disabled). <strong>Recommended SAFE setup:</strong> set Archive only, leave both Purge windows at 0 — bounds the live Sheet while preserving every note in the <em>' + esc(res.archiveTab || 'NotesArchive') + '</em> tab. Purges are <strong>irreversible PHI deletes</strong>.</div>' +
    cnRetentionRowHtml_('archive', 'Archive after — move old notes to the cold tab', res.archiveDays, false) +
    cnRetentionRowHtml_('purge', 'Purge live after — delete from the live Notes tab', res.retentionDays, true) +
    cnRetentionRowHtml_('archpurge', 'Purge cold after — delete from the archive tab', res.archiveRetentionDays, true) +
    warnHtml +
    '<div style="display:flex;align-items:center;gap:12px;margin-top:12px">' +
      '<button class="btn-modal-ok" id="cn-ret-save" style="margin:0" onclick="cnSaveRetention_()">Save retention</button>' +
      '<span style="font-size:11px;color:var(--muted)">Takes effect on the next nightly run. Re-run <code>installAutomationTriggers()</code> once if you have not yet.</span>' +
    '</div>' +
  '</div>';
}
function cnSaveRetention_() {
  var rd = function (id) { var el = document.getElementById('cn-ret-' + id); return el ? el.value : ''; };
  var payload = { archiveDays: rd('archive'), retentionDays: rd('purge'), archiveRetentionDays: rd('archpurge') };
  var prev = CN_STATE.retentionCfg || {};
  var prevPurge = (prev.retentionDays && prev.retentionDays.value) || 0;
  var prevCold  = (prev.archiveRetentionDays && prev.archiveRetentionDays.value) || 0;
  var newPurge = parseInt(payload.retentionDays, 10) || 0;
  var newCold  = parseInt(payload.archiveRetentionDays, 10) || 0;
  // Danger-confirm only when ENABLING or RAISING an irreversible purge window.
  var raisingPurge = newPurge > 0 && newPurge !== prevPurge;
  var raisingCold  = newCold > 0 && newCold !== prevCold;
  var doSave = function () {
    var btn = document.getElementById('cn-ret-save');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) { showToast((res && res.error) || 'Save failed', 'toast-error'); if (btn) { btn.disabled = false; btn.textContent = 'Save retention'; } return; }
        showToast('Retention windows saved', 'toast-success');
        cnLoadRetentionPanel_();   // re-render with fresh values + warnings
      })
      .withFailureHandler(function (err) { showToast((err && err.message) || 'Save failed', 'toast-error'); if (btn) { btn.disabled = false; btn.textContent = 'Save retention'; } })
      .saveRetentionConfig(payload);
  };
  if (raisingPurge || raisingCold) {
    uiConfirm({
      title: 'Enable an irreversible purge?',
      message: 'You are turning on a retention window that PERMANENTLY DELETES call notes (PHI) — ' +
        (raisingPurge ? 'live notes older than ' + newPurge + ' days' : '') +
        (raisingPurge && raisingCold ? ' and ' : '') +
        (raisingCold ? 'archived notes older than ' + newCold + ' days' : '') +
        '. This cannot be undone. Confirm the canonical record lives elsewhere first.',
      confirmLabel: 'Enable purge', tone: 'danger',
    }).then(function (ok) { if (ok) doSave(); });
  } else {
    doSave();
  }
}

/** §7c — switch the Admin sub-tab (Overview / Tags / Compliance / Config).
 *  Pure show/hide over the already-loaded panes; the panels keep their data
 *  (no reload). Persists the active tab in CN_STATE so a re-enter restores it. */
function cnAdminTab_(key) {
  CN_STATE.adminTab = key;
  document.querySelectorAll('.cn-admin-tabs .toolbar-tab').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-admin-tab') === key);
  });
  document.querySelectorAll('.cn-admin-pane').forEach(function (p) {
    p.style.display = (p.getAttribute('data-pane') === key) ? '' : 'none';
  });
  // Tier 2 — lazy-load the Sheets viewer when its pane is EMPTY (avoids an
  // AuditLog scan on every Admin landing; re-clicks on a populated pane stay
  // free). F(M-7): the old session-scoped _sheetsLoaded flag outlived the
  // per-enter recreated DOM — re-entering Admin rebuilt an empty pane that
  // never reloaded (permanently blank until a page refresh), and the flag was
  // set before the RPC resolved so a failed first load was unrecoverable too.
  if (key === 'sheets') {
    var sheetsPane = document.getElementById('cn-admin-sheets');
    if (sheetsPane && !sheetsPane.firstElementChild) cnLoadSheetView_('auditLog');
  }
}

/** Round 2 · 8h — fetch + render the new Admin sections (KPI strip + tag
 *  taxonomy table). Drops into #cn-admin-augment which sits above the
 *  existing department mapping / state tax / suggestions blocks. */
function cnLoadAdminAugment_() {
  const slot = document.getElementById('cn-admin-augment');
  if (!slot) return;
  slot.innerHTML = loSweep();
  // Use the existing getCallNotesAmbient endpoint for KPIs (it returns
  // weekTotal + flagCounts from Phase 4) AND getCallNotesTagTaxonomy
  // (new in Round 2 · 8h) for the tag table. Fire in parallel.
  // 2nd-pass Admin consolidation: taxonomy + trends are ONE table now, so the
  // trends fetch joins this parallel load (was a separate panel). Trends failure
  // is non-fatal — the table renders without the sparkline/Δ columns' data.
  let kpi = null, tax = null, trends = null, done = 0;
  function maybeRender() {
    if (done < 3) return;
    if (currentView !== 'callNotesAdmin') return;
    // KPI strip → Overview (#cn-admin-kpis); merged tag table → Tags
    // (#cn-admin-augment). Falls back to a single slot if the KPI host is absent.
    const parts = cnRenderAdminAugmentHtml_(kpi, tax, trends);
    const kpiSlot = document.getElementById('cn-admin-kpis');
    if (kpiSlot) { kpiSlot.innerHTML = parts.kpiHtml; slot.innerHTML = parts.taxHtml; }
    else { slot.innerHTML = parts.kpiHtml + parts.taxHtml; }
    // Round 2 follow-on — wire the tag-row action buttons. Sentinel-guarded
    // so repeated renders don't stack handlers.
    cnWireAdminTagActions_();
  }
  google.script.run
    .withSuccessHandler(function (r) { kpi = r || null; done++; maybeRender(); })
    .withFailureHandler(function () { done++; maybeRender(); })
    .getCallNotesAmbient();
  google.script.run
    .withSuccessHandler(function (r) { tax = r || null; done++; maybeRender(); })
    .withFailureHandler(function () { done++; maybeRender(); })
    .getCallNotesTagTaxonomy();
  google.script.run
    .withSuccessHandler(function (r) { trends = r || null; done++; maybeRender(); })
    .withFailureHandler(function () { done++; maybeRender(); })
    .getCallNotesTagTrends();
}

/** Round 2 · 8h + 2nd-pass merge — render the KPI strip + the merged tag table
 *  (taxonomy taxonomy + inline trend sparkline + this-week Δ). */
function cnRenderAdminAugmentHtml_(kpi, tax, trends) {
  // KPI strip: Notes this week, Unresolved actions, Tags in use, Reps scanned
  const weekVal = kpi && typeof kpi.weekTotal === 'number' ? kpi.weekTotal : '—';
  const unresolvedVal = kpi && typeof kpi.unresolvedActionCount === 'number' ? kpi.unresolvedActionCount : '—';
  const tagsCount = tax && Array.isArray(tax.tags) ? tax.tags.length : '—';
  const repsCount = tax && typeof tax.repsScanned === 'number' ? tax.repsScanned : '—';
  const unresolvedClass = (typeof unresolvedVal === 'number' && unresolvedVal > 3) ? 'crit'
    : (typeof unresolvedVal === 'number' && unresolvedVal > 0 ? 'warn' : '');
  const kpiHtml = '<div class="telemetry" style="max-width:900px;margin-bottom:16px">'
    + '<div class="tel-cell"><div class="tel-label">Week notes</div><div class="tel-value">' + esc(String(weekVal)) + '</div><div class="tel-sub">across team</div></div>'
    + '<div class="tel-cell"><div class="tel-label">Unresolved</div><div class="tel-value ' + unresolvedClass + '">' + esc(String(unresolvedVal)) + '</div><div class="tel-sub">action flags open</div></div>'
    + '<div class="tel-cell"><div class="tel-label">Tags</div><div class="tel-value">' + esc(String(tagsCount)) + '</div><div class="tel-sub">unique in use</div></div>'
    + '<div class="tel-cell"><div class="tel-label">Reps</div><div class="tel-value">' + esc(String(repsCount)) + '</div><div class="tel-sub">enrolled scanned</div></div>'
    + '</div>';

  // Tag taxonomy table — Round 2 follow-on extends each row with
  // Rename / Merge / Archive action buttons. Archived tags render with
  // an "archived" pill + a Restore button instead.
  // Join the trend series (keyed by tag) into the taxonomy rows — one table.
  const trendSeries = (trends && Array.isArray(trends.series)) ? trends.series : [];
  const trendMap = {};
  let maxTrend = 0;
  trendSeries.forEach(function (s) {
    trendMap[s.tag] = s;
    (s.counts || []).forEach(function (c) { if (c > maxTrend) maxTrend = c; });
  });

  let taxHtml = '';
  const inUse = (tax && Array.isArray(tax.tags)) ? tax.tags : [];
  const archivedOnly = (tax && Array.isArray(tax.archivedOnlyTags)) ? tax.archivedOnlyTags : [];
  if (tax && (inUse.length > 0 || archivedOnly.length > 0)) {
    const max = inUse.length > 0 ? Math.max.apply(null, inUse.map(function (t) { return t.count || 0; })) : 0;
    const inUseRowsHtml = inUse.slice(0, 50).map(function (t) {
      return cnRenderTagRow_(t, max, trendMap, maxTrend);
    }).join('');
    let archivedSection = '';
    if (archivedOnly.length > 0) {
      const archRowsHtml = archivedOnly.slice(0, 50).map(function (t) {
        return cnRenderTagRow_(t, 0, trendMap, maxTrend);  // 0-bar; rows are archived-only
      }).join('');
      archivedSection =
        '<div style="font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin:14px 0 6px">Archived (not in any current note)</div>'
        + archRowsHtml;
    }
    const trendWeeks = trends && (trends.weeks || (trends.weekStarts ? trends.weekStarts.length : 0)) || 0;
    taxHtml =
      '<div style="background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px;max-width:900px">'
        + '<div class="day-section-label" style="margin-bottom:10px">' + icon('list', 14) + ' Tag Taxonomy &amp; Trends</div>'
        + '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Free-text tags reps applied across all enrolled per-rep Sheets. Trend + Δ cover the trailing ' + esc(String(trendWeeks)) + ' weeks (a rising tag flags an emerging issue). Rename to merge a typo; Merge to consolidate; Archive to deprecate (notes keep their tags).</div>'
        + (inUse.length > 0
            ? '<div class="cn-tax-head"><div class="cn-tax-tag">Tag</div><div class="cn-tax-bar">Usage</div><div class="cn-tax-count">Notes</div><div class="cn-tax-trend">Trend</div><div class="cn-tax-delta">Δ wk</div><div class="cn-tax-actions">Actions</div></div>' + inUseRowsHtml
            : '<div style="font-size:12px;color:var(--muted)">No tags in active use.</div>')
        + archivedSection
      + '</div>';
  } else if (tax) {
    taxHtml =
      '<div style="background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px;max-width:900px">'
        + '<div class="day-section-label" style="margin-bottom:10px">' + icon('list', 14) + ' Tag Taxonomy</div>'
        + '<div style="font-size:12px;color:var(--muted)">No tags in use yet. Tags are free-text categorisations reps add from the Log view (Round 2 · 8e).</div>'
      + '</div>';
  }

  // §7c — return the two pieces separately so the tabbed Admin can place the
  // KPI strip in Overview and the tag taxonomy in Tags.
  return { kpiHtml: kpiHtml, taxHtml: taxHtml };
}

/** Round 2 follow-on — one tag-table row with usage bar + Rename / Merge
 *  / Archive action buttons. Archived tags render with an archived pill
 *  in place of the rename/merge buttons and a Restore button instead of
 *  Archive. data-tag attributes drive the click delegation in
 *  cnWireAdminTagActions_. */
function cnRenderTagRow_(t, maxCount, trendMap, maxTrend) {
  const pct = (maxCount > 0 && t.count) ? Math.round((t.count / maxCount) * 100) : 0;
  const tagAttr = esc(t.tag);
  const archived = !!t.archived;
  // Merged trend cells (2nd-pass): inline sparkline + this-week Δ from the
  // joined trend series. Absent (no series for this tag, or archived) → blanks.
  const ser = (trendMap && trendMap[t.tag]) || null;
  const trendCell = (ser && !archived)
    ? cnTrendSparkSvg_(ser.counts || [], maxTrend || 0)
    : '<span style="color:var(--muted-3)">—</span>';
  let deltaCell = '<span style="color:var(--muted-3)">—</span>';
  if (ser && !archived) {
    const d = ser.delta || 0;
    deltaCell = d > 0 ? '<span class="cn-trend-delta up">▲ ' + d + '</span>'
      : (d < 0 ? '<span class="cn-trend-delta down">▼ ' + Math.abs(d) + '</span>'
               : '<span class="cn-trend-delta flat">±0</span>');
  }
  const archivedBadge = archived
    ? ' <span class="cn-tax-archived-pill">archived</span>'
    : '';
  let actionsHtml;
  if (archived) {
    actionsHtml =
      '<button class="cn-tax-act" data-tax-action="unarchive" data-tax-tag="' + tagAttr + '" title="Restore tag from archive">'
        + icon('undo', 12) + ' Restore</button>';
  } else {
    actionsHtml =
      '<button class="cn-tax-act" data-tax-action="rename" data-tax-tag="' + tagAttr + '" title="Rename across all notes">'
        + icon('adjust', 12) + ' Rename</button>'
      + '<button class="cn-tax-act" data-tax-action="merge" data-tax-tag="' + tagAttr + '" title="Merge into another tag">'
        + icon('plus', 12) + ' Merge</button>'
      + '<button class="cn-tax-act danger" data-tax-action="archive" data-tax-tag="' + tagAttr + '" title="Archive (hides from future suggestions; notes keep the tag)">'
        + icon('trash', 12) + ' Archive</button>';
  }
  return '<div class="cn-tax-row' + (archived ? ' is-archived' : '') + '">'
    + '<div class="cn-tax-tag">' + esc(t.tag) + archivedBadge + '</div>'
    + '<div class="cn-tax-bar"><i style="width:' + pct + '%"></i></div>'
    + '<div class="cn-tax-count">' + (t.count || 0) + '</div>'
    + '<div class="cn-tax-trend">' + trendCell + '</div>'
    + '<div class="cn-tax-delta">' + deltaCell + '</div>'
    + '<div class="cn-tax-actions">' + actionsHtml + '</div>'
  + '</div>';
}

/** #5 — inline sparkline (SVG polyline) of a tag's weekly counts, scaled to the
 *  panel-wide max so rows are comparable. Self-contained (doesn't couple to the
 *  Metrics partial's sparkline helper). */
function cnTrendSparkSvg_(counts, maxVal) {
  const W = 120, H = 22, n = counts.length;
  if (n < 2) return '';
  const max = maxVal > 0 ? maxVal : 1;
  const pts = counts.map(function (v, i) {
    const x = (i / (n - 1)) * (W - 2) + 1;
    const y = H - 1 - (Math.max(0, v) / max) * (H - 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  return '<svg class="cn-trend-spark" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '</svg>';
}

/** Round 2 follow-on — wires click delegation for the tag-table action
 *  buttons. Installed once per Admin view enter via a sentinel on the
 *  augment slot to avoid duplicate handlers across re-renders. Each
 *  action confirms with the manager before firing the server endpoint;
 *  on success, reloads the taxonomy via cnLoadAdminAugment_. */
function cnWireAdminTagActions_() {
  const slot = document.getElementById('cn-admin-augment');
  if (!slot || slot._taxActionsBound) return;
  slot._taxActionsBound = true;
  slot.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-tax-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-tax-action');
    const tag = btn.getAttribute('data-tax-tag');
    if (!tag) return;
    if (action === 'rename') cnPromptRenameTag_(tag);
    else if (action === 'merge') cnPromptMergeTag_(tag);
    else if (action === 'archive') cnDoArchiveTag_(tag, true);
    else if (action === 'unarchive') cnDoArchiveTag_(tag, false);
  });
}

function cnPromptRenameTag_(oldTag) {
  uiPrompt({
    title: 'Rename tag',
    message: 'Rename "' + oldTag + '" to (lowercase kebab-case, 2–24 chars):',
    initialValue: oldTag,
    placeholder: 'new-tag-name',
    validator: function (v) {
      const t = String(v || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      if (!t) return 'Tag is empty.';
      if (t.length < 2 || t.length > 24) return 'Tag must be 2–24 characters.';
      if (t === oldTag) return 'New name is the same as the current name.';
      return '';
    },
  }).then(function (newTag) {
    if (newTag == null) return;
    const trimmed = String(newTag).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if (!trimmed || trimmed === oldTag) return;
    uiConfirm({
      title: 'Confirm rename',
      message: 'Rename "' + oldTag + '" → "' + trimmed + '" across all enrolled reps\' notes? This batch-edits every note that carries the old tag.',
      confirmLabel: 'Rename',
    }).then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) {
            showToast((res && res.error) || 'Rename failed', 'toast-error');
            return;
          }
          showToast('Renamed: ' + res.notesUpdated + ' notes across ' + res.repsTouched + ' rep(s)', 'toast-success');
          cnLoadAdminAugment_();
        })
        .withFailureHandler(function (err) {
          showToast((err && err.message) || 'Server error', 'toast-error');
        })
        .renameCallNoteTag(oldTag, trimmed);
    });
  });
}

function cnPromptMergeTag_(sourceTag) {
  uiPrompt({
    title: 'Merge tag',
    message: 'Merge "' + sourceTag + '" INTO which existing tag? (lowercase kebab-case)',
    initialValue: '',
    placeholder: 'target-tag',
    validator: function (v) {
      const t = String(v || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      if (!t) return 'Tag is empty.';
      if (t.length < 2 || t.length > 24) return 'Tag must be 2–24 characters.';
      if (t === sourceTag) return 'Target is the same as the source.';
      return '';
    },
  }).then(function (targetTag) {
    if (targetTag == null) return;
    const trimmed = String(targetTag).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if (!trimmed || trimmed === sourceTag) return;
    uiConfirm({
      title: 'Confirm merge',
      message: 'Merge "' + sourceTag + '" → "' + trimmed + '" across all enrolled reps\' notes? Source tag is removed; target tag stays or is added; notes carrying both keep only the target.',
      confirmLabel: 'Merge',
    }).then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) {
            showToast((res && res.error) || 'Merge failed', 'toast-error');
            return;
          }
          showToast('Merged: ' + res.notesUpdated + ' notes across ' + res.repsTouched + ' rep(s)', 'toast-success');
          cnLoadAdminAugment_();
        })
        .withFailureHandler(function (err) {
          showToast((err && err.message) || 'Server error', 'toast-error');
        })
        .mergeCallNoteTags(sourceTag, trimmed);
    });
  });
}

function cnDoArchiveTag_(tag, archived) {
  const verb = archived ? 'Archive' : 'Restore';
  uiConfirm({
    title: verb + ' tag',
    message: verb + ' tag "' + tag + '"?' +
      (archived ? '\n\nNotes keep the tag; the Admin table will section it under Archived.' : ''),
    confirmLabel: verb,
    tone: archived ? 'danger' : undefined,
  }).then(function (ok) {
    if (!ok) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          showToast((res && res.error) || (verb + ' failed'), 'toast-error');
          return;
        }
        showToast(verb + 'd: ' + tag, 'toast-success');
        cnLoadAdminAugment_();
      })
      .withFailureHandler(function (err) {
        showToast((err && err.message) || 'Server error', 'toast-error');
      })
      .archiveCallNoteTag(tag, archived);
  });
}

function cnRunAuditSearch_() {

  var seq = (CN_STATE.auditSearchSeq = (CN_STATE.auditSearchSeq || 0) + 1);

    .withSuccessHandler(function (res) {
