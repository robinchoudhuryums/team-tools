function cnComposerSend_() {
  const c = CN_STATE.composer; if (!c) return;
  const btn = document.getElementById('cnC-send-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  // Pass the previewed bodyHash so the server can refuse to send if the note
  // body changed since Preview (rep edited the note in a different tab).
  // Without this, the email body could differ from what the rep just confirmed.
  const expectedHash = c.preview && c.preview.bodyHash;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        if (btn) { btn.disabled = false; btn.innerHTML = icon('mail', 14) + ' Send Email'; }
        showToast(res.error || 'Send failed', 'toast-error'); return;
      }
      // Stamp emailedAt on the cached note
      const idx = CN_STATE.rollingNotes.findIndex(function (n) { return n.noteId === c.noteId; });
      if (idx >= 0) {
        CN_STATE.rollingNotes[idx].emailedAt = res.emailedAt;
        CN_STATE.rollingNotes[idx].emailDepartments = c.selections.departments.join(', ');
        CN_STATE.rollingNotes[idx].subformData = c.selections;
      }
      cnCloseComposerModal_();
      cnReRenderActiveView_();
      cnRenderFilterBar_();
      showToast('Email sent', 'toast-success');
    })
    .withFailureHandler(function (err) {
      if (btn) { btn.disabled = false; btn.innerHTML = icon('mail', 14) + ' Send Email'; }
      showToast('Send failed: ' + err.message, 'toast-error');
    })
    .emailFromCallNote(c.noteId, c.selections, expectedHash);
}

function cnWireHistoryRange_() {
  var startInput = document.getElementById('cn-history-start');
  var endInput = document.getElementById('cn-history-end');
  if (startInput) startInput.addEventListener('change', function () {
    CN_STATE.historyDate = startInput.value;
    if (!CN_STATE.historyEndDate || CN_STATE.historyEndDate < startInput.value) {
      CN_STATE.historyEndDate = startInput.value;
      if (endInput) endInput.value = startInput.value;
    }
    cnHistoryRangeChanged_();
  });
  if (endInput) endInput.addEventListener('change', function () {
    CN_STATE.historyEndDate = endInput.value;
    if (!CN_STATE.historyDate || CN_STATE.historyDate > endInput.value) {
      CN_STATE.historyDate = endInput.value;
      if (startInput) startInput.value = endInput.value;
    }
    cnHistoryRangeChanged_();
  });
  document.querySelectorAll('.cn-history-preset-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var range = cnHistoryPresetRange_(btn.dataset.preset);
      if (!range) return;
      CN_STATE.historyDate = range.start;
      CN_STATE.historyEndDate = range.end;
      if (startInput) startInput.value = range.start;
      if (endInput) endInput.value = range.end;
      cnHistoryRangeChanged_();
    });
  });
}

function cnHistoryPresetRange_(preset) {
  var tz = (empState && empState.timezone) || 'UTC';
  var today = new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());
  var toDate = function (iso) { return new Date(iso + 'T12:00:00Z'); };
  var fmt = function (d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()); };
  var todayD = toDate(today);
  switch (preset) {
    case 'yesterday': {
      var y = toDate(today); y.setUTCDate(y.getUTCDate() - 1);
      return { start: fmt(y), end: fmt(y) };
    }
    case 'last7': {
      var d7 = toDate(today); d7.setUTCDate(d7.getUTCDate() - 6);
      return { start: fmt(d7), end: today };
    }
    case 'last30': {
      var d30 = toDate(today); d30.setUTCDate(d30.getUTCDate() - 29);
      return { start: fmt(d30), end: today };
    }
    case 'thisWeek': {
      var dow = todayD.getUTCDay();
      var mon = toDate(today); mon.setUTCDate(mon.getUTCDate() - ((dow + 6) % 7));
      return { start: fmt(mon), end: today };
    }
    case 'lastWeek': {
      var dow2 = todayD.getUTCDay();
      var thisMon = toDate(today); thisMon.setUTCDate(thisMon.getUTCDate() - ((dow2 + 6) % 7));
      var prevMon = new Date(thisMon); prevMon.setUTCDate(prevMon.getUTCDate() - 7);
      var prevSun = new Date(prevMon); prevSun.setUTCDate(prevSun.getUTCDate() + 6);
      return { start: fmt(prevMon), end: fmt(prevSun) };
    }
    default: return null;
  }
}

function cnHistoryRangeChanged_() {
  var s = CN_STATE.historyDate;
  var e = CN_STATE.historyEndDate || s;
  if (!s) return;
  var stack = document.getElementById('cn-history-stack');
  if (stack) stack.innerHTML = '<div class="cn-stack-empty">Loading…</div>';
  cnLoadDateRange_(s, e, cnRenderHistoryStack_);
}

function cnRenderHistoryStack_() {
  const stack = document.getElementById('cn-history-stack');
  if (!stack) return;
  const summary = document.getElementById('cn-history-summary');
  const notes = CN_STATE.historyNotes || [];
  const isRange = CN_STATE.historyEndDate && CN_STATE.historyEndDate !== CN_STATE.historyDate;

  if (notes.length === 0) {
    if (summary) summary.innerHTML = '';
    stack.innerHTML = '<div class="cn-stack-empty">No notes for ' + (isRange ? 'this range' : 'this date') + '.</div>';
    return;
  }

  if (isRange) {
    var startLabel = cnFormatDateLabel_(CN_STATE.historyDate);
    var endLabel = cnFormatDateLabel_(CN_STATE.historyEndDate);
    if (summary) summary.innerHTML = '<div class="cn-history-summary">' +
      esc(startLabel) + ' – ' + esc(endLabel) + ' · ' + notes.length + ' note' + (notes.length !== 1 ? 's' : '') + '</div>';

    // Group by dateLocal, newest dates first
    var groups = [];
    var groupMap = {};
    notes.forEach(function (n) {
      var d = n.dateLocal || 'Unknown';
      if (!groupMap[d]) { groupMap[d] = []; groups.push(d); }
      groupMap[d].push(n);
    });
    groups.sort(function (a, b) { return b.localeCompare(a); });
    var html = '';
    groups.forEach(function (d) {
      html += '<div class="cn-date-separator">' + esc(cnFormatDateLabel_(d)) + '</div>';
      html += groupMap[d].map(cnRenderCard_).join('');
    });
    stack.innerHTML = html;
  } else {
    if (summary) summary.innerHTML = '';
    stack.innerHTML = notes.map(cnRenderCard_).join('');
  }
}

function cnFormatDateLabel_(isoDate) {
  if (!isoDate) return '';
  try {
    var parts = isoDate.split('-');
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    return DOW_NAMES[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate();
  } catch (e) { return isoDate; }
}

         ${icon('search', 12)} Exact: ${esc(CN_STATE.searchExactTrx || '')}
         <button onclick="cnClearExactMode_()" style="appearance:none;border:none;background:transparent;color:inherit;cursor:pointer;padding:0;text-transform:uppercase;font-family:inherit;font-size:inherit;letter-spacing:.06em;text-decoration:underline">clear</button>
       </div>`

  area.innerHTML = `

    <div class="cn-search-bar">

             value="${esc(CN_STATE.searchQuery || '')}" oninput="cnSearchQueryChanged_(this.value)">
      <div class="toolbar-tabs" role="group" aria-label="Search field">
        <button class="toolbar-tab" aria-pressed="${CN_STATE.searchField === 'all'}" onclick="cnSetSearchField_('all')">All</button>
        <button class="toolbar-tab" aria-pressed="${CN_STATE.searchField === 'caller'}" onclick="cnSetSearchField_('caller')">Caller</button>
        <button class="toolbar-tab" aria-pressed="${CN_STATE.searchField === 'issue'}" onclick="cnSetSearchField_('issue')">Issue</button>

}

function cnSearchQueryChanged_(q) {
  // Manual typing in the search box implies the rep is starting a new search
  // — drop exact-TRX mode (which was set by clicking "Find prior calls" on a
  // card) so the substring matcher takes over again.
  if (CN_STATE.searchExact) {
    CN_STATE.searchExact = false;
    CN_STATE.searchExactTrx = '';
  }
  CN_STATE.searchQuery = q;
  if (CN_STATE.searchTimer) clearTimeout(CN_STATE.searchTimer);
  CN_STATE.searchTimer = setTimeout(cnFireSearch_, 240);
}

/** Switches to the Search view in exact-TRX mode for the given patientAndTrx.
 *  Triggered by the search icon on each rolling-stack card. The Search view's
 *  exact-mode badge gives the rep a one-click "Clear" to fall back to
 *  substring search if they want a wider net. */
function cnFindPriorCallsForTrx_(trx) {
  const t = String(trx || '').trim();
  if (!t) return;
  CN_STATE.searchQuery = t;
  CN_STATE.searchField = 'all';
  CN_STATE.searchExact = true;
  CN_STATE.searchExactTrx = t;
  if (CN_STATE.searchTimer) { clearTimeout(CN_STATE.searchTimer); CN_STATE.searchTimer = null; }
  showView('callNotesSearch');
  // showView renders the search view; fire the search after the next tick so
  // the search-results host exists in the DOM.
  setTimeout(cnFireSearch_, 0);
}

/** "Clear exact mode" handler — drops back to substring matching but keeps
 *  the query so the rep sees a wider result set immediately. */
function cnClearExactMode_() {
  CN_STATE.searchExact = false;
  CN_STATE.searchExactTrx = '';
  cnFireSearch_();
  // Re-render the search bar so the badge disappears
  const area = document.getElementById('view-area');
  if (area && currentView === 'callNotesSearch') cnRenderSearchView(area);
}

function cnSetSearchField_(f) {
  CN_STATE.searchField = f;
  // Switching field tabs is a substring-search interaction; if we're in
  // exact-TRX mode the field tabs are meaningless — drop exact mode and
  // re-render the bar so the badge disappears.
  if (CN_STATE.searchExact) {
    CN_STATE.searchExact = false;
    CN_STATE.searchExactTrx = '';
    const area = document.getElementById('view-area');
    if (area && currentView === 'callNotesSearch') {
      cnRenderSearchView(area);
      return;
    }
  }
  document.querySelectorAll('.cn-search-bar .toolbar-tab').forEach(function (b) {
    b.setAttribute('aria-pressed', b.textContent.trim().toLowerCase() === f ? 'true' : 'false');
  });
  cnFireSearch_();
}

function cnFireSearch_() {
  const q = String(CN_STATE.searchQuery || '').trim();
  if (q.length < 2) {
    CN_STATE.searchResults = [];
    cnRenderSearchResults_();
    return;
  }
  // Capture view + query so late results from a stale typing burst don't
  // clobber the active search (or worse, render to a different view that's
  // since reused the view-area).
  const requestedView = currentView;
  const requestedQuery = q;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView) return;
      if (CN_STATE.searchQuery !== requestedQuery) return;
      if (res.error) { showToast(res.error, 'toast-error'); CN_STATE.searchResults = []; }
      else CN_STATE.searchResults = res.results || [];
      cnRenderSearchResults_();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      showToast('Search failed: ' + err.message, 'toast-error');
    })
    .searchMyCallNotes(q, CN_STATE.searchField, null, !!CN_STATE.searchExact);
}

function cnRenderSearchResults_() {
  const host = document.getElementById('cn-search-results');
  if (!host) return;
  if (!CN_STATE.searchQuery || CN_STATE.searchQuery.length < 2) {
    host.innerHTML = `<div class="cn-stack-empty">Type at least 2 characters to search.</div>`;
    return;
  }
  if (CN_STATE.searchResults.length === 0) {
    host.innerHTML = `<div class="cn-stack-empty">No matches.</div>`;
    return;
  }
  host.innerHTML = CN_STATE.searchResults.map(function (n) {
    return `
      <div class="cn-search-result-card">
        <div class="cn-search-result-meta">
          ${esc(n.dateLocal)} · ${esc(cnFormatTimestampForCopy_(n.timestamp))}
          ${n.flagType ? ' · <span style="color:var(--ink)">' + esc(n.flagType.toUpperCase()) + '</span>' : ''}
          ${n.emailedAt ? ' · sent ' + esc(cnFormatTimestampForCopy_(n.emailedAt)) : ''}
        </div>
        <div class="cn-search-result-body">
          <strong>${esc(n.caller || n.patientAndTrx || '—')}</strong> · ${esc(n.patientAndTrx || '')}
          <br>${esc(n.issue || '')}
          ${n.resolution ? '<br><span style="color:var(--muted)">→ ' + esc(n.resolution) + '</span>' : ''}
        </div>
      </div>
    `;
  }).join('');
}

/** Opens the call-notes bulk export modal. Defaults to "this week" (Mon→today
 *  in the manager's local tz). Re-runnable — manager dashboard wiring grabs
 *  the modal by id on every open so it's idempotent. */
function cnOpenExportModal_() {
  const tz = empTz();
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz });
  const todayIso = fmt.format(new Date());
  // Default range = last 7 days
  const parts = todayIso.split('-');
  const today = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  const start = new Date(today); start.setDate(today.getDate() - 6);
  document.getElementById('cn-exp-start').value = isoDate(start);
  document.getElementById('cn-exp-end').value = todayIso;
  document.getElementById('cn-export-overlay').classList.add('open');
}

function cnMgrLoadQueue_(kind) {
  document.querySelectorAll('.toolbar-tab[data-mqueue]').forEach(function (b) {
    b.classList.toggle('active', b.dataset.mqueue === kind);
  });
  const host = document.getElementById('cn-mgr-results');
  if (host) host.innerHTML = `<div class="cn-stack-empty">Loading…</div>`;
  const requestedView = currentView;
  const fn = kind === 'training' ? 'managerGetTrainingQueue' : 'managerGetReviewCandidates';
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView) return;
      const liveHost = document.getElementById('cn-mgr-results');
      if (!liveHost) return;
      if (res.error) { liveHost.innerHTML = `<div class="cn-stack-empty">${esc(res.error)}</div>`; return; }
      cnMgrRenderQueue_(liveHost, res.results || []);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      const liveHost = document.getElementById('cn-mgr-results');
      if (liveHost) liveHost.innerHTML = `<div class="cn-stack-empty">Failed: ${esc(err.message)}</div>`;
    })[fn]();
}

// Surfaces the server-side managerGetCallNotes endpoint that previously had

function cnMgrRepDateChanged_(d) {

  cnMgrLoadRepNotes_();

function cnMgrLoadRepNotes_() {
  const stack = document.getElementById('cn-mgr-rep-stack');
  if (!stack || !CN_STATE.mgrRepView) return;
  stack.innerHTML = `<div class="cn-stack-empty">Loading…</div>`;
  const requestedView = currentView;
  const requestedRepId = CN_STATE.mgrRepView.repId;
  const requestedDate = CN_STATE.mgrRepView.date;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView) return;
      // Selection may have changed during the round trip — drop stale results.
      if (!CN_STATE.mgrRepView
          || CN_STATE.mgrRepView.repId !== requestedRepId
          || CN_STATE.mgrRepView.date !== requestedDate) return;
      const liveStack = document.getElementById('cn-mgr-rep-stack');
      if (!liveStack) return;
      if (res.error) { liveStack.innerHTML = `<div class="cn-stack-empty">${esc(res.error)}</div>`; return; }
      if (!res.notes || res.notes.length === 0) {
        liveStack.innerHTML = `<div class="cn-stack-empty">No notes for ${esc(res.repName || '')} on ${esc(res.date || '')}.</div>`;
        return;
      }
      liveStack.innerHTML = res.notes.map(cnMgrRenderReadonlyCard_).join('');
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      const liveStack = document.getElementById('cn-mgr-rep-stack');
      if (liveStack) liveStack.innerHTML = `<div class="cn-stack-empty">Failed: ${esc(err.message)}</div>`;
    })
    .managerGetCallNotes(requestedRepId, requestedDate, 'all');
}

/** Read-only card for the manager per-rep view. Reuses the styled card chrome
 *  but omits flag/copy/email/edit/delete actions — those endpoints scope to
 *  the caller's own sheet and would fail silently if invoked here. */
function cnMgrRenderReadonlyCard_(note) {
  const time = cnFormatTimestampForCopy_(note.timestamp);
  const flagCls = note.flagType ? ' flag-' + note.flagType : '';
  const callerLine = note.caller ? esc(note.caller) : (note.patientAndTrx ? esc(note.patientAndTrx) : '<em style="color:var(--muted)">unnamed</em>');
  const trxBit = note.caller && note.patientAndTrx ? `<span class="cn-trx">${esc(note.patientAndTrx)}</span>` : '';
  const issue = note.issue ? esc(note.issue) : '<em>—</em>';
  // Training notes get a question line + (if set) a manager-reply line.
  let trainingQ = '';
  let trainingReplyEditor = '';
  if (note.flagType === 'training' && note.subformData && note.subformData.trainingQuestion) {
    trainingQ = `<div class="cn-card-training-q">${icon('bulb', 11)}<span>${esc(String(note.subformData.trainingQuestion))}</span></div>`;
    const existingReply = (note.subformData && note.subformData.trainingReply) || '';
    if (existingReply) {
      trainingQ += `<div class="cn-card-training-a">${icon('checkCircle', 11)}<span>${esc(String(existingReply))}</span></div>`;
    }
    // Inline reply editor — manager can write/edit/clear the answer right
    // from the per-rep card. `data-rep="..."` lets the click handler find
    // the right rep without round-tripping the JS string boundary.
    const repId = (CN_STATE.mgrRepView && CN_STATE.mgrRepView.repId) || '';
    trainingReplyEditor = `
      <div class="cn-mgr-reply-row" data-note-id="${esc(note.noteId)}" data-rep-id="${esc(repId)}">
        <input type="text" class="cn-mgr-reply-input" placeholder="${existingReply ? 'Edit reply…' : 'Reply to this question…'}"
               value="${esc(existingReply)}">
        <button type="button" class="cn-mgr-reply-save" onclick="cnMgrSaveTrainingReply_(this)">
          ${icon('check', 12)}<span>${existingReply ? 'Update' : 'Send'}</span>
        </button>
        ${existingReply
          ? `<button type="button" class="cn-mgr-reply-clear" onclick="cnMgrClearTrainingReply_(this)" title="Clear reply">${icon('x', 12)}</button>`
          : ''}
      </div>
    `;
  }
  const resolution = note.resolution
    ? `<div class="cn-card-issue" style="color:var(--muted);font-style:italic;margin-top:2px">→ ${esc(note.resolution)}</div>`
    : '';
  const flagPill = note.flagType
    ? `<span class="adj-pill" style="text-transform:uppercase;font-size:10px;letter-spacing:.06em">${esc(note.flagType)}${note.flagType === 'action' && note.resolved ? ' · resolved' : ''}</span>`
    : '';
  const sentPill = note.emailedAt
    ? `<span class="adj-pill" title="${note.emailDepartments ? 'Sent to: ' + esc(note.emailDepartments) : 'Sent'}">sent${note.emailDepartments ? ' <span class="cn-email-depts">' + esc(note.emailDepartments) + '</span>' : ''}</span>`
    : '';
  return `
    <div class="cn-card${flagCls}" data-note-id="${esc(note.noteId)}">
      <div class="cn-card-row">
        <span class="cn-card-time tabular">${esc(time)}</span>
        <div class="cn-card-main">
          <div class="cn-card-caller">${callerLine}${trxBit}</div>
          <div class="cn-card-issue">${issue}</div>
          ${trainingQ}
          ${resolution}
        </div>
        <div class="cn-card-actions">
          ${flagPill}
          ${sentPill}
        </div>
      </div>
      ${trainingReplyEditor}
    </div>
  `;
}

/** Click handler for the manager's training-reply save button. Reads the
 *  text from the sibling input and fires setCallNoteTrainingReply. On
 *  success, refreshes the per-rep view so the saved reply renders. */
function cnMgrSaveTrainingReply_(btn) {
  const row = btn.closest('.cn-mgr-reply-row');
  if (!row) return;
  const noteId = row.dataset.noteId;
  const repId  = row.dataset.repId;
  const input  = row.querySelector('.cn-mgr-reply-input');
  if (!input) return;
  const reply = input.value.trim();
  if (!reply) { showToast('Reply is empty', 'toast-warn'); return; }
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      if (!res.success) { showToast(res.error || 'Reply failed', 'toast-error'); return; }
      showToast('Reply saved', 'toast-success');
      // Refresh the per-rep view so the reply line shows on the card
      cnMgrLoadRepNotes_();
    })
    .withFailureHandler(function (err) {
      btn.disabled = false;
      showToast('Reply failed: ' + err.message, 'toast-error');
    })
    .setCallNoteTrainingReply(repId, noteId, reply);
}

/** Clear an existing training reply (passes empty string to the server,
 *  which drops the reply keys from subformData). */
function cnMgrClearTrainingReply_(btn) {
  const row = btn.closest('.cn-mgr-reply-row');
  if (!row) return;
  const noteId = row.dataset.noteId;

  uiConfirm({
    title: 'Clear reply',
    message: 'Clear the reply on this note?',
    confirmLabel: 'Clear',

  }).then(function (ok) {

    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        if (!res.success) { showToast(res.error || 'Clear failed', 'toast-error'); return; }
        showToast('Reply cleared', 'toast-success');
        cnMgrLoadRepNotes_();
      })
      .withFailureHandler(function (err) {

        showToast('Clear failed: ' + err.message, 'toast-error');

function cnMgrRenderStats_(host, res) {
  const reps = res.reps || [];
  if (reps.length === 0) {
    host.innerHTML = `<div class="cn-stack-empty">No reps enrolled, or no activity on ${esc(res.date)}.</div>`;
    return;
  }
  const fmtDur = function (sec) {
    if (sec == null) return '—';
    if (sec < 60) return sec + 's';
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + 'm ' + (s ? s + 's' : '00s');
  };
  const cards = reps.map(function (r) {
    const fc = r.flagCounts || { action:0, training:0, review:0 };
    const span = r.shiftSpan
      ? `<span class="cn-stats-span">${esc(r.shiftSpan.first)} → ${esc(r.shiftSpan.last)}</span>`
      : '<span class="cn-stats-span" style="opacity:.5">no activity</span>';
    const medianRow = (r.medianCompletionSeconds != null)
      ? `<div class="cn-stats-row"><span class="cn-stats-k">Median note time</span><span class="cn-stats-v">${esc(fmtDur(r.medianCompletionSeconds))}</span></div>`
      : `<div class="cn-stats-row"><span class="cn-stats-k">Median note time</span><span class="cn-stats-v" style="opacity:.5">no data yet</span></div>`;
    return `
      <div class="cn-stats-card">
        <div class="cn-stats-head">
          <div class="cn-stats-name"><a class="cn-stats-name-link" href="#" data-stats-rep-id="${esc(r.repId)}" onclick="event.preventDefault(); cnStatsDrillDown_(this.dataset.statsRepId)">${esc(r.repName)}</a></div>
          ${span}
        </div>
        <div class="cn-stats-total">${r.totalNotes}<span class="cn-stats-total-lbl">notes</span></div>
        <div class="cn-stats-grid">
          <div class="cn-stats-row"><span class="cn-stats-k">Action flagged</span><span class="cn-stats-v">${fc.action || 0}${(r.resolvedCount && fc.action) ? ' <span style="opacity:.6">(' + r.resolvedCount + ' resolved)</span>' : ''}</span></div>
          <div class="cn-stats-row"><span class="cn-stats-k">Training flagged</span><span class="cn-stats-v">${fc.training || 0}</span></div>
          <div class="cn-stats-row"><span class="cn-stats-k">Review candidates</span><span class="cn-stats-v">${fc.review || 0}</span></div>
          <div class="cn-stats-row"><span class="cn-stats-k">Emails sent</span><span class="cn-stats-v">${r.emailsSent}</span></div>
          ${medianRow}
          ${r.cdr ? `
          <div class="cn-stats-row" style="border-top:1px solid var(--line);padding-top:6px;margin-top:4px"><span class="cn-stats-k" style="color:var(--accent)">Calls answered</span><span class="cn-stats-v">${r.cdr.totalAnswered}</span></div>
          <div class="cn-stats-row"><span class="cn-stats-k" style="color:var(--accent)">Calls missed</span><span class="cn-stats-v">${r.cdr.totalMissed > 0 ? '<span style="color:var(--warn)">' + r.cdr.totalMissed + '</span>' : '0'}</span></div>
          <div class="cn-stats-row"><span class="cn-stats-k" style="color:var(--accent)">% Answered</span><span class="cn-stats-v">${r.cdr.pctAnswered}%</span></div>
          <div class="cn-stats-row"><span class="cn-stats-k" style="color:var(--accent)">Avg Talk Time</span><span class="cn-stats-v">${esc(r.cdr.attFormatted)}</span></div>
          ` : ''}
          ${r.noteCoverage != null ? `
          <div class="cn-stats-row"><span class="cn-stats-k">Note coverage</span><span class="cn-stats-v">${r.noteCoverage}%</span></div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
  host.innerHTML = `
    <div class="cn-stats-foot-note">
      Median note time = form-start → submit duration. Skips outliers &gt; 30 min (rep walked away mid-note). Older notes don't have this data; the median is computed only over notes that captured one.
    </div>
    <div class="cn-stats-grid-outer">${cards}</div>
  `;
}

function cnPollAmbient_() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || res.error) return;
      if (res.enrolled === false) return;
      CN_STATE.staleFlagHours = res.staleFlagHours || 1;
      // V4 Phase 4 — update stats-mini and quick-chip-row if they're mounted
      // on the current Log view. Both are no-ops when the elements aren't in
      // the DOM (rep is on a different view).
      cnUpdateStatsMini_(res);
      cnUpdateQuickChipRow_(res);
      // Update sidebar badge on the Call Notes nav link
      const link = document.querySelector('.sb-link[data-tool="callNotes"]')
                || document.querySelector('.nav-btn[data-tool="callNotes"]');
      if (!link) return;
      let badge = link.querySelector('.cn-stale-badge');
      const count = res.staleActionCount || 0;
      if (count <= 0) { if (badge) badge.remove(); return; }
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'cn-stale-badge';
        link.appendChild(badge);
      }
      badge.textContent = String(count);
    })
    .getCallNotesAmbient();

/** Round 2 · 8g — render multi-turn Q&A thread on training-flagged note
 *  cards. The thread is the union of the legacy (trainingQuestion,
 *  trainingReply) pair AND subformData.feedback[] (new shape). Each
 *  message shows the role badge + the message text + the timestamp.
 *  When the most recent message is from the manager and the rep hasn't
 *  responded yet, action buttons (👍 Got it / 💬 Clarify) render below
 *  the thread. The 💬 button expands an inline textarea + Submit. */
function cnRenderQAThread_(note) {
  if (!note || note.flagType !== 'training') return '';
  const sub = note.subformData || {};
  // Build the thread: optional rep question seed + manager replies / agent
  // entries via feedback[], with the legacy single trainingReply folded in
  // if no feedback array exists yet.
  const thread = [];
  if (sub.trainingQuestion) {
    thread.push({ role: 'agent', kind: 'question', message: String(sub.trainingQuestion), at: '' });
  }
  if (Array.isArray(sub.feedback) && sub.feedback.length > 0) {
    sub.feedback.forEach(function (e) {
      if (!e) return;
      thread.push({
        role: e.role || 'manager',
        kind: e.kind || 'reply',
        message: String(e.message || ''),
        at: String(e.at || ''),
        by: String(e.by || ''),
      });
    });
  } else if (sub.trainingReply) {
    // Legacy path — synthesize one manager entry
    thread.push({
      role: 'manager',
      kind: 'reply',
      message: String(sub.trainingReply),
      at: String(sub.trainingReplyAt || ''),
      by: String(sub.trainingReplyBy || ''),
    });
  }
  if (thread.length === 0) return '';
  // Decide whether response buttons should show: only if the rep hasn't
  // already acked or sent a clarification, and there IS at least one
  // manager message to respond to.
  const lastMgrIdx = (function () {
    for (let i = thread.length - 1; i >= 0; i--) {
      if (thread[i].role === 'manager') return i;
    }
    return -1;
  })();
  let hasAgentResponse = false;
  if (lastMgrIdx >= 0) {
    for (let i = lastMgrIdx + 1; i < thread.length; i++) {
      if (thread[i].role === 'agent') { hasAgentResponse = true; break; }
    }
  }
  const canRespond = lastMgrIdx >= 0 && !hasAgentResponse;
  const entriesHtml = thread.map(function (e) {
    const roleCls = e.role === 'manager' ? 'qa-mgr' : 'qa-agent';
    const kindLabel = e.kind === 'ack' ? '· ack'
      : e.kind === 'question' ? '· question'
      : e.kind === 'clarification' ? '· clarification'
      : '';
    const body = e.kind === 'ack'
      ? '<em>Got it</em>'
      : esc(e.message || '');
    const ts = e.at ? '<span class="qa-ts">' + esc(String(e.at).slice(11, 16)) + '</span>' : '';
    return '<div class="qa-row ' + roleCls + '">'
      + '<span class="qa-role">' + (e.role === 'manager' ? 'Mgr' : 'You') + ' ' + kindLabel + '</span>'
      + '<span class="qa-msg">' + body + '</span>'
      + ts
      + '</div>';
  }).join('');
  const actionsHtml = canRespond
    ? '<div class="qa-actions">'
        + '<button type="button" class="qa-ack-btn" data-qa-ack="' + esc(note.noteId) + '">👍 Got it</button>'
        + '<button type="button" class="qa-clarify-btn" data-qa-clarify="' + esc(note.noteId) + '">💬 Clarify</button>'
      + '</div>'
      + '<div class="qa-clarify-row" data-qa-clarify-row="' + esc(note.noteId) + '" hidden>'
        + '<textarea class="qa-clarify-input" placeholder="Your follow-up question…"></textarea>'
        + '<button type="button" class="qa-clarify-submit">Send</button>'
      + '</div>'
    : '';
  return '<div class="qa-thread">' + entriesHtml + actionsHtml + '</div>';
}

/** Round 2 · 8z — Consumes window.CLK_NAV_HINT (set by the Clock view's
 *  coverage-strip CTA, fileMissingCalls_). Today: surfaces a toast so the
 *  rep sees the source context. Future-ready for when per-call CDR data
 *  exists: extend hint.calls[] to carry call IDs, then prefill the form
 *  or auto-filter the rolling stack here. Always nulls the hint after
 *  read so subsequent CN view enters don't re-fire the same toast. */
function cnConsumeNavHint_() {
  const hint = window.CLK_NAV_HINT;
  if (!hint || hint.source !== 'coverageStrip') return;
  window.CLK_NAV_HINT = null;
  if (typeof showToast !== 'function') return;
  const n = hint.missingCount || 0;
  const dateLabel = hint.date ? ' for ' + hint.date : ' for today';
  const msg = n > 0
    ? `Filing ${n} missing note${n > 1 ? 's' : ''}${dateLabel}`
    : `Note coverage${dateLabel}`;
  showToast(msg, 'toast-success');
}

/** V4 Phase 4 — document-level Ctrl/⌘+K handler that navigates to the
 *  Call Notes Search tab. Installed once (sentinel-guarded) and self-gates
 *  on currentView so other tools don't intercept the shortcut. */
function cnInstallSearchJumpKeybind_() {
  if (window._cnSearchJumpInstalled) return;
  window._cnSearchJumpInstalled = true;
  document.addEventListener('keydown', function (e) {
    if (!(e.metaKey || e.ctrlKey)) return;
    if (e.shiftKey || e.altKey) return;
    if (e.key !== 'k' && e.key !== 'K') return;
    // Only fire on Call Notes views; lets browsers handle ⌘K elsewhere
    if (typeof currentView !== 'string' || currentView.indexOf('callNotes') !== 0) return;
    e.preventDefault();
    if (typeof showView === 'function') showView('callNotesSearch');
  });
}

/** V4 Phase 4 — parse ?prefill=key:value;key:value... query params and
 *  populate the matching cn-fld-* inputs. Pre-filled fields are tagged
 *  with .cn-field.prefilled so the rep can see what was auto-set.
 *  Currently dormant (the Clock coverage strip CTA doesn't pass prefill
 *  because there's no per-call CDR data) but future-ready: when per-call
 *  data lands, the CTA can construct a prefill string and this handler
 *  picks it up. */
function cnApplyPrefillFromUrl_() {
  try {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('prefill');
    if (!raw) return;
    const pairs = raw.split(';').map(s => s.trim()).filter(Boolean);
    const supported = { callback: 'cn-fld-callback', caller: 'cn-fld-caller', patient: 'cn-fld-patient', date: null };
    pairs.forEach(pair => {
      const idx = pair.indexOf(':');
      if (idx < 0) return;
      const key = pair.substring(0, idx).trim();
      const value = pair.substring(idx + 1).trim();
      const targetId = supported[key];
      if (!targetId) return; // unknown key — ignore (date is informational only)
      // Round 2 deferred 8e — use cnSetFieldValue_ so contenteditable .ce
      // divs and legacy input/textarea both work transparently. Input event
      // is dispatched inside the setter for callback-formatter + persistence.
      cnSetFieldValue_(targetId, value);
      const el = document.getElementById(targetId);
      if (!el) return;
      // Tag prefilled row (covers both old .cn-field and new .cnv-row markup)
      const fieldCell = el.closest('.cn-field') || el.closest('.cnv-row');
      if (fieldCell) fieldCell.classList.add('prefilled');
    });
  } catch (e) { /* malformed prefill — ignore */ }
}

/** V4 Phase 4 — populate the Log view's stats-mini header from the
 *  getCallNotesAmbient response. Cells: Today / Week / Unresolved.
 *  Unresolved-cell tone goes warn-toned when >0, crit when >3.
 *  Silent no-op when the Log view isn't mounted. */
function cnUpdateStatsMini_(res) {
  const today = document.getElementById('cn-stat-today');
  const week  = document.getElementById('cn-stat-week');
  const flag  = document.getElementById('cn-stat-flag');
  if (!today || !week || !flag) return;
  today.textContent = String(res.todayTotal || 0);
  week.textContent  = String(res.weekTotal  || 0);
  const unresolved = res.unresolvedActionCount || 0;
  flag.textContent  = String(unresolved);
  flag.classList.remove('warn', 'crit');
  if (unresolved >= 3)      flag.classList.add('crit');
  else if (unresolved >= 1) flag.classList.add('warn');
}

/** V4 Phase 4 — render the bottom quick-chip-row from getCallNotesAmbient's
 *  flagCounts. Each chip taps through to the History view filtered by tag
 *  (existing CN_STATE.filter mechanism + tab nav). Counts are read-only;
 *  the chips never mutate state. */
function cnUpdateQuickChipRow_(res) {
  const row = document.getElementById('cn-quick-chip-row');
  if (!row) return;
  const counts = res.flagCounts || {};
  const chips = [
    { flag: 'all',        label: 'All',         count: counts.all || 0 },
    { flag: 'action',     label: 'Action',      count: counts.action || 0 },
    { flag: 'training',   label: 'Training',    count: counts.training || 0 },
    { flag: 'review',     label: 'Review',      count: counts.review || 0 },
    { flag: 'unresolved', label: 'Unresolved',  count: counts.unresolved || 0 },
    { flag: 'qa',         label: 'Q&A',         count: counts.qa || 0 },
  ];
  row.innerHTML = '<span class="cn-quick-chip-row-label">Jump to history</span>'
    + chips.map(c => `<button type="button" class="cn-quick-chip" data-flag="${esc(c.flag)}">${esc(c.label)} <span class="count">${c.count}</span></button>`).join('');
  // Wire chip clicks: navigate to History view with the filter pre-selected.
  // Maps the chip's flag → CN_STATE.filter, then shows the history tab.

// ── Bulk Export modal wiring ───────────────────────────────────────────
// Bound once at module load. The modal's DOM lives in modals.html and is
// reused across opens (cnOpenExportModal_ just toggles the .open class).
// Uses cn-exp-preset-btn instead of preset-btn to avoid the time-clock
// export modal's preset-btn listeners stomping on these clicks.

(function cnWireExportModal_() {
  const overlay = document.getElementById('cn-export-overlay');
  if (!overlay) return;

  const cancelBtn = document.getElementById('cn-exp-cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', function () {
    overlay.classList.remove('open');
  });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  // Preset buttons set the start/end date inputs based on the manager's tz
  document.querySelectorAll('.cn-exp-preset-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const tz = empTz();
      const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz });
      const todayIso = fmt.format(new Date());
      const parts = todayIso.split('-');
      const today = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
      let start, end;
      const preset = btn.dataset.cnPreset;
      if (preset === 'this-week') {
        // Monday of the current week
        const dow = today.getDay();  // 0=Sun, 1=Mon…
        const back = dow === 0 ? 6 : dow - 1;
        start = new Date(today); start.setDate(today.getDate() - back);
        end = today;
      } else if (preset === 'last-week') {
        const dow = today.getDay();
        const back = dow === 0 ? 6 : dow - 1;
        end = new Date(today); end.setDate(today.getDate() - back - 1);  // last Sunday
        start = new Date(end); start.setDate(end.getDate() - 6);          // Monday before
      } else if (preset === 'last-7') {
        start = new Date(today); start.setDate(today.getDate() - 6);
        end = today;
      } else if (preset === 'last-30') {
        start = new Date(today); start.setDate(today.getDate() - 29);
        end = today;
      }
      if (start && end) {
        document.getElementById('cn-exp-start').value = isoDate(start);
        document.getElementById('cn-exp-end').value = isoDate(end);
      }
    });
  });

  const submitBtn = document.getElementById('cn-exp-submit');
  if (submitBtn) submitBtn.addEventListener('click', function () {
    const start = document.getElementById('cn-exp-start').value;
    const end = document.getElementById('cn-exp-end').value;
    if (!start || !end) { showToast('Please pick both dates', 'toast-error'); return; }
    if (start > end) { showToast('Start date must be before end date', 'toast-error'); return; }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Generating…';
    google.script.run
      .withSuccessHandler(function (res) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Generate Export';
        if (!res || res.error || !res.success) {
          showToast((res && res.error) || 'Export failed', 'toast-error');
          return;
        }
        overlay.classList.remove('open');
        showToast(`Exported ${res.noteCount} notes — opening sheet`, 'toast-success');
        window.open(res.url, '_blank');
      })
      .withFailureHandler(function (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Generate Export';
        showToast((err.message || 'Server error'), 'toast-error');
      })
      .exportCallNotesRange(start, end);
  });
})();

function cnStartDragModal_(e) {
  var modal = document.getElementById('cnC-modal');
  if (!modal) return;
  var startX = e.clientX, startY = e.clientY;
  var rect = modal.getBoundingClientRect();
  var origLeft = rect.left, origTop = rect.top;
  modal.style.position = 'fixed';
  modal.style.left = origLeft + 'px';
  modal.style.top = origTop + 'px';
  modal.style.margin = '0';
  function onMove(ev) {
    modal.style.left = (origLeft + ev.clientX - startX) + 'px';
    modal.style.top = (origTop + ev.clientY - startY) + 'px';
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  e.preventDefault();
}

/** Round 2 · 8h — fetch + render the new Admin sections (KPI strip + tag
 *  taxonomy table). Drops into #cn-admin-augment which sits above the
 *  existing department mapping / state tax / suggestions blocks. */
function cnLoadAdminAugment_() {
  const slot = document.getElementById('cn-admin-augment');
  if (!slot) return;
  slot.innerHTML = '<div class="spinner" style="margin:18px auto"></div>';
  // Use the existing getCallNotesAmbient endpoint for KPIs (it returns
  // weekTotal + flagCounts from Phase 4) AND getCallNotesTagTaxonomy
  // (new in Round 2 · 8h) for the tag table. Fire in parallel.
  let kpi = null, tax = null, done = 0;
  function maybeRender() {
    if (done < 2) return;
    if (currentView !== 'callNotesAdmin') return;
    slot.innerHTML = cnRenderAdminAugmentHtml_(kpi, tax);
    // Round 2 follow-on — wire the tag-row action buttons. Sentinel-guarded
    // so repeated renders don't stack handlers.
    cnWireAdminTagActions_();
  }
  google.script.run
    .withSuccessHandler(function (r) { kpi = r || null; done++; maybeRender(); })
    .withFailureHandler(function () { done++; maybeRender(); })
    .getCallNotesAmbient();
  google.script.run
    .withSuccessHandler(function (r) { tax = r || null; done++; maybeRender(); })
    .withFailureHandler(function () { done++; maybeRender(); })
    .getCallNotesTagTaxonomy();
}

/** Round 2 · 8h — render the KPI strip + tag taxonomy table HTML. */
function cnRenderAdminAugmentHtml_(kpi, tax) {
  // KPI strip: Notes this week, Unresolved actions, Tags in use, Reps scanned
  const weekVal = kpi && typeof kpi.weekTotal === 'number' ? kpi.weekTotal : '—';
  const unresolvedVal = kpi && typeof kpi.unresolvedActionCount === 'number' ? kpi.unresolvedActionCount : '—';
  const tagsCount = tax && Array.isArray(tax.tags) ? tax.tags.length : '—';
  const repsCount = tax && typeof tax.repsScanned === 'number' ? tax.repsScanned : '—';
  const unresolvedClass = (typeof unresolvedVal === 'number' && unresolvedVal > 3) ? 'crit'
    : (typeof unresolvedVal === 'number' && unresolvedVal > 0 ? 'warn' : '');
  const kpiHtml = '<div class="telemetry" style="max-width:900px;margin-bottom:16px">'
    + '<div class="tel-cell"><div class="tel-label">Week notes</div><div class="tel-value">' + esc(String(weekVal)) + '</div><div class="tel-sub">across team</div></div>'
    + '<div class="tel-cell"><div class="tel-label">Unresolved</div><div class="tel-value ' + unresolvedClass + '">' + esc(String(unresolvedVal)) + '</div><div class="tel-sub">action flags open</div></div>'
    + '<div class="tel-cell"><div class="tel-label">Tags</div><div class="tel-value">' + esc(String(tagsCount)) + '</div><div class="tel-sub">unique in use</div></div>'
    + '<div class="tel-cell"><div class="tel-label">Reps</div><div class="tel-value">' + esc(String(repsCount)) + '</div><div class="tel-sub">enrolled scanned</div></div>'
    + '</div>';

  // Tag taxonomy table — Round 2 follow-on extends each row with
  // Rename / Merge / Archive action buttons. Archived tags render with
  // an "archived" pill + a Restore button instead.
  let taxHtml = '';
  const inUse = (tax && Array.isArray(tax.tags)) ? tax.tags : [];
  const archivedOnly = (tax && Array.isArray(tax.archivedOnlyTags)) ? tax.archivedOnlyTags : [];
  if (tax && (inUse.length > 0 || archivedOnly.length > 0)) {
    const max = inUse.length > 0 ? Math.max.apply(null, inUse.map(function (t) { return t.count || 0; })) : 0;
    const inUseRowsHtml = inUse.slice(0, 50).map(function (t) {
      return cnRenderTagRow_(t, max);
    }).join('');
    let archivedSection = '';
    if (archivedOnly.length > 0) {
      const archRowsHtml = archivedOnly.slice(0, 50).map(function (t) {
        return cnRenderTagRow_(t, 0);  // 0-bar; rows are archived-only
      }).join('');
      archivedSection =
        '<div style="font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin:14px 0 6px">Archived (not in any current note)</div>'
        + archRowsHtml;
    }
    taxHtml =
      '<div style="background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px;max-width:900px">'
        + '<div class="day-section-label" style="margin-bottom:10px">' + icon('list', 14) + ' Tag Taxonomy</div>'
        + '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Free-text tags reps applied across all enrolled per-rep Sheets. Rename to merge a typo; Merge to consolidate; Archive to deprecate (notes keep their tags; future-suggestion surfaces hide it).</div>'
        + (inUse.length > 0
            ? '<div class="cn-tax-head"><div class="cn-tax-tag">Tag</div><div class="cn-tax-bar">Usage</div><div class="cn-tax-count">Notes</div><div class="cn-tax-last">Last seen</div><div class="cn-tax-actions">Actions</div></div>' + inUseRowsHtml
            : '<div style="font-size:12px;color:var(--muted)">No tags in active use.</div>')
        + archivedSection
      + '</div>';
  } else if (tax) {
    taxHtml =
      '<div style="background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px;max-width:900px">'
        + '<div class="day-section-label" style="margin-bottom:10px">' + icon('list', 14) + ' Tag Taxonomy</div>'
        + '<div style="font-size:12px;color:var(--muted)">No tags in use yet. Tags are free-text categorisations reps add from the Log view (Round 2 · 8e).</div>'
      + '</div>';
  }

  return kpiHtml + taxHtml;
}

/** Round 2 follow-on — one tag-table row with usage bar + Rename / Merge
 *  / Archive action buttons. Archived tags render with an archived pill
 *  in place of the rename/merge buttons and a Restore button instead of
 *  Archive. data-tag attributes drive the click delegation in
 *  cnWireAdminTagActions_. */
function cnRenderTagRow_(t, maxCount) {
  const pct = (maxCount > 0 && t.count) ? Math.round((t.count / maxCount) * 100) : 0;
  const tagAttr = esc(t.tag);
  const archived = !!t.archived;
  const archivedBadge = archived
    ? ' <span class="cn-tax-archived-pill">archived</span>'
    : '';
  let actionsHtml;
  if (archived) {
    actionsHtml =
      '<button class="cn-tax-act" data-tax-action="unarchive" data-tax-tag="' + tagAttr + '" title="Restore tag from archive">'
        + icon('undo', 12) + ' Restore</button>';
  } else {
    actionsHtml =
      '<button class="cn-tax-act" data-tax-action="rename" data-tax-tag="' + tagAttr + '" title="Rename across all notes">'
        + icon('adjust', 12) + ' Rename</button>'
      + '<button class="cn-tax-act" data-tax-action="merge" data-tax-tag="' + tagAttr + '" title="Merge into another tag">'
        + icon('plus', 12) + ' Merge</button>'
      + '<button class="cn-tax-act danger" data-tax-action="archive" data-tax-tag="' + tagAttr + '" title="Archive (hides from future suggestions; notes keep the tag)">'
        + icon('trash', 12) + ' Archive</button>';
  }
  return '<div class="cn-tax-row' + (archived ? ' is-archived' : '') + '">'
    + '<div class="cn-tax-tag">' + esc(t.tag) + archivedBadge + '</div>'
    + '<div class="cn-tax-bar"><i style="width:' + pct + '%"></i></div>'
    + '<div class="cn-tax-count">' + (t.count || 0) + '</div>'
    + '<div class="cn-tax-last">' + esc(t.lastSeen || '—') + '</div>'
    + '<div class="cn-tax-actions">' + actionsHtml + '</div>'
  + '</div>';
}

/** Round 2 follow-on — wires click delegation for the tag-table action
 *  buttons. Installed once per Admin view enter via a sentinel on the
 *  augment slot to avoid duplicate handlers across re-renders. Each
 *  action confirms with the manager before firing the server endpoint;
 *  on success, reloads the taxonomy via cnLoadAdminAugment_. */
function cnWireAdminTagActions_() {
  const slot = document.getElementById('cn-admin-augment');
  if (!slot || slot._taxActionsBound) return;
  slot._taxActionsBound = true;
  slot.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-tax-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-tax-action');
    const tag = btn.getAttribute('data-tax-tag');
    if (!tag) return;
    if (action === 'rename') cnPromptRenameTag_(tag);
    else if (action === 'merge') cnPromptMergeTag_(tag);
    else if (action === 'archive') cnDoArchiveTag_(tag, true);
    else if (action === 'unarchive') cnDoArchiveTag_(tag, false);
  });
}

function cnPromptRenameTag_(oldTag) {
  uiPrompt({
    title: 'Rename tag',
    message: 'Rename "' + oldTag + '" to (lowercase kebab-case, 2–24 chars):',
    initialValue: oldTag,
    placeholder: 'new-tag-name',
    validator: function (v) {
      const t = String(v || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      if (!t) return 'Tag is empty.';
      if (t.length < 2 || t.length > 24) return 'Tag must be 2–24 characters.';
      if (t === oldTag) return 'New name is the same as the current name.';
      return '';
    },
  }).then(function (newTag) {
    if (newTag == null) return;
    const trimmed = String(newTag).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if (!trimmed || trimmed === oldTag) return;
    uiConfirm({
      title: 'Confirm rename',
      message: 'Rename "' + oldTag + '" → "' + trimmed + '" across all enrolled reps\' notes? This batch-edits every note that carries the old tag.',
      confirmLabel: 'Rename',
    }).then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) {
            showToast((res && res.error) || 'Rename failed', 'toast-error');
            return;
          }
          showToast('Renamed: ' + res.notesUpdated + ' notes across ' + res.repsTouched + ' rep(s)', 'toast-success');
          cnLoadAdminAugment_();
        })
        .withFailureHandler(function (err) {
          showToast((err && err.message) || 'Server error', 'toast-error');
        })
        .renameCallNoteTag(oldTag, trimmed);
    });
  });
}

function cnPromptMergeTag_(sourceTag) {
  uiPrompt({
    title: 'Merge tag',
    message: 'Merge "' + sourceTag + '" INTO which existing tag? (lowercase kebab-case)',
    initialValue: '',
    placeholder: 'target-tag',
    validator: function (v) {
      const t = String(v || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      if (!t) return 'Tag is empty.';
      if (t.length < 2 || t.length > 24) return 'Tag must be 2–24 characters.';
      if (t === sourceTag) return 'Target is the same as the source.';
      return '';
    },
  }).then(function (targetTag) {
    if (targetTag == null) return;
    const trimmed = String(targetTag).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if (!trimmed || trimmed === sourceTag) return;
    uiConfirm({
      title: 'Confirm merge',
      message: 'Merge "' + sourceTag + '" → "' + trimmed + '" across all enrolled reps\' notes? Source tag is removed; target tag stays or is added; notes carrying both keep only the target.',
      confirmLabel: 'Merge',
    }).then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) {
            showToast((res && res.error) || 'Merge failed', 'toast-error');
            return;
          }
          showToast('Merged: ' + res.notesUpdated + ' notes across ' + res.repsTouched + ' rep(s)', 'toast-success');
          cnLoadAdminAugment_();
        })
        .withFailureHandler(function (err) {
          showToast((err && err.message) || 'Server error', 'toast-error');
        })
        .mergeCallNoteTags(sourceTag, trimmed);
    });
  });
}

function cnDoArchiveTag_(tag, archived) {
  const verb = archived ? 'Archive' : 'Restore';
  uiConfirm({
    title: verb + ' tag',
    message: verb + ' tag "' + tag + '"?' +
      (archived ? '\n\nNotes keep the tag; the Admin table will section it under Archived.' : ''),
    confirmLabel: verb,
    tone: archived ? 'danger' : undefined,
  }).then(function (ok) {
    if (!ok) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          showToast((res && res.error) || (verb + ' failed'), 'toast-error');
          return;
        }
        showToast(verb + 'd: ' + tag, 'toast-success');
        cnLoadAdminAugment_();
      })
      .withFailureHandler(function (err) {
        showToast((err && err.message) || 'Server error', 'toast-error');
      })
      .archiveCallNoteTag(tag, archived);
  });
}

  document.getElementById('cn-admin-save-depts').addEventListener('click', function () {

      map[n] = e;
    }
    if (Object.keys(map).length === 0) { showToast('Add at least one department', 'toast-warn'); return; }
    btn.disabled = true; btn.textContent = 'Saving…';

      .withSuccessHandler(function (res) {

      })
      .withFailureHandler(function (err) {

  document.getElementById('cn-admin-save-rates').addEventListener('click', function () {

    var nameEls = document.querySelectorAll('.cn-admin-rate-state');
    var rateEls = document.querySelectorAll('.cn-admin-rate-value');
    var map = {};
    for (var i = 0; i < nameEls.length; i++) {
      var st = nameEls[i].textContent.trim();
      var rv = rateEls[i].value.trim();
      if (!st || rv === '') continue;
      map[st] = parseFloat(rv);
    }
    btn.disabled = true; btn.textContent = 'Saving…';
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false; btn.textContent = 'Save Tax Rates';
        if (!res.success) { showToast(res.error || 'Save failed', 'toast-error'); return; }
        showToast('Tax rates saved', 'toast-success');
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = 'Save Tax Rates';
        showToast(err.message || 'Save failed', 'toast-error');

function cnRenderRateRows_(rates) {

      '<span class="cn-admin-rate-state" style="flex:1;font-size:13px">' + esc(st) + '</span>' +

}

function cnFilterRateRows_(query) {
  var q = query.toLowerCase();
  var rows = document.querySelectorAll('#cn-admin-rate-list .field-row');
  rows.forEach(function (row) {
    var name = row.querySelector('.cn-admin-rate-state');

function cnRenderSuggestionRows_(suggestions) {

}

function cnOpenExternalEmailModal_(presetNoteId) {
  CN_STATE.extComposer = {
    recipientType: 'customer',
    recipientEmail: '',
    recipientName: '',
    subject: '',
    message: '',
    formIds: [],              // PDF attachment form IDs
    interactiveForms: [],     // fillable interactive form IDs
    prefillData: {},           // keyed by form ID: { formId: { field: value } }
    formModes: {},             // keyed by form ID: 'pdf' | 'fillable'
    noteId: presetNoteId || null,
    sending: false,
  };
  // Fetch catalog on first open, then render
  if (CN_STATE.formCatalog) {
    cnRenderExternalEmailModal_();
  } else {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res.error) {
          showToast(res.error, 'toast-error');
          CN_STATE.formCatalog = [];
        } else {
          CN_STATE.formCatalog = res.forms || [];
        }
        cnRenderExternalEmailModal_();
      })
      .withFailureHandler(function (err) {
        showToast('Failed to load form catalog: ' + err.message, 'toast-error');
        CN_STATE.formCatalog = [];
        cnRenderExternalEmailModal_();
      })
      .getFormCatalog();
  }
}

function cnCloseExternalEmailModal_() {
  CN_STATE.extComposer = null;
  var overlay = document.getElementById('cn-ext-overlay');
  if (overlay) overlay.remove();
}

function cnRenderExternalEmailModal_() {
  var overlay = document.getElementById('cn-ext-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'cn-ext-overlay';
    overlay.className = 'overlay open';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) cnCloseExternalEmailModal_();
    });
  }
  var c = CN_STATE.extComposer;
  if (!c) { overlay.remove(); return; }
  overlay.innerHTML = cnBuildExternalEmailHtml_();
  cnWireExternalEmailModal_();
}

/** IDs of forms that support interactive/fillable mode. Must match
 *  INTERACTIVE_FORM_TYPES on the server side. */
var CN_INTERACTIVE_FORM_IDS = ['eaa', 'pt-ot-rx', 'seating-eval'];

/** Returns the pre-fill fields HTML for a given form type. */
function cnPrefillFieldsForForm_(formId) {
  var c = CN_STATE.extComposer;
  var pf = (c.prefillData && c.prefillData[formId]) || {};
  switch (formId) {
    case 'eaa':
      return '<div class="cn-ext-prefill-title">Pre-fill fields (optional)</div>' +
        '<div class="field"><label>Patient First Name</label>' +
          '<input type="text" data-prefill-form="' + formId + '" data-prefill-key="firstName" value="' + esc(pf.firstName || '') + '"></div>' +
        '<div class="field"><label>Patient Last Name</label>' +
          '<input type="text" data-prefill-form="' + formId + '" data-prefill-key="lastName" value="' + esc(pf.lastName || '') + '"></div>';
    case 'pt-ot-rx':
      return '<div class="cn-ext-prefill-title">Pre-fill fields (optional)</div>' +
        '<div class="field"><label>Patient Name</label>' +
          '<input type="text" data-prefill-form="' + formId + '" data-prefill-key="patientName" value="' + esc(pf.patientName || '') + '"></div>' +
        '<div class="field"><label>Item for Order</label>' +
          '<input type="text" data-prefill-form="' + formId + '" data-prefill-key="itemForOrder" value="' + esc(pf.itemForOrder || '') + '"></div>' +
        '<div class="field"><label>Order Date</label>' +
          '<input type="date" data-prefill-form="' + formId + '" data-prefill-key="orderDate" value="' + esc(pf.orderDate || '') + '"></div>';
    case 'seating-eval':
      return '<div class="cn-ext-prefill-title">Pre-fill fields (optional)</div>' +
        '<div class="field"><label>Patient Name</label>' +
          '<input type="text" data-prefill-form="' + formId + '" data-prefill-key="patientName" value="' + esc(pf.patientName || '') + '"></div>' +
        '<div class="field"><label>Date</label>' +
          '<input type="date" data-prefill-form="' + formId + '" data-prefill-key="evalDate" value="' + esc(pf.evalDate || '') + '"></div>';
    default:
      return '';
  }
}

function cnBuildExternalEmailHtml_() {
  var c = CN_STATE.extComposer;
  var catalog = CN_STATE.formCatalog || [];

  // Recipient type radios
  var typeRadios =
    '<button type="button" class="cn-ext-type-radio" aria-pressed="' + (c.recipientType === 'customer' ? 'true' : 'false') + '" data-ext-type="customer">' +
      icon('user', 14) + ' Customer</button>' +
    '<button type="button" class="cn-ext-type-radio" aria-pressed="' + (c.recipientType === 'provider' ? 'true' : 'false') + '" data-ext-type="provider">' +
      icon('checkCircle', 14) + ' Provider</button>';

  // Form checkboxes with fillable toggle
  var formItems = catalog.map(function (f) {
    var isChecked = c.formIds.indexOf(f.id) >= 0 || c.interactiveForms.indexOf(f.id) >= 0;
    var checked = isChecked ? 'checked' : '';
    var catCls = f.category === 'customer' ? 'customer' : 'provider';
    var isInteractive = CN_INTERACTIVE_FORM_IDS.indexOf(f.id) >= 0;
    var mode = c.formModes[f.id] || 'pdf';
    var isFillable = mode === 'fillable';

    var modeToggle = '';
    if (isInteractive) {
      modeToggle =
        '<div class="cn-ext-form-mode-toggle" data-mode-form-id="' + esc(f.id) + '">' +
          '<span class="toggle-label ' + (!isFillable ? 'active' : '') + '" data-mode-val="pdf">PDF</span>' +
          '<div class="cn-ext-form-mode-switch' + (isFillable ? ' on' : '') + '" data-mode-switch="' + esc(f.id) + '"></div>' +
          '<span class="toggle-label ' + (isFillable ? 'active' : '') + '" data-mode-val="fillable">Fillable</span>' +
        '</div>';
    }

    var prefillSection = '';
    if (isInteractive && isFillable && isChecked) {
      prefillSection = '<div class="cn-ext-prefill-section" data-prefill-for="' + esc(f.id) + '">' +
        cnPrefillFieldsForForm_(f.id) + '</div>';
    }

    return '<div class="cn-ext-form-item-wrap" data-form-wrap="' + esc(f.id) + '">' +
      '<label class="cn-ext-form-item">' +
        '<input type="checkbox" data-form-id="' + esc(f.id) + '" ' + checked + '>' +
        '<span class="cn-ext-form-name">' + esc(f.name) + '</span>' +
        '<span class="cn-ext-form-cat ' + catCls + '">' + esc(f.category) + '</span>' +

      '</label>' +
      prefillSection +
    '</div>';
  }).join('');
  if (catalog.length === 0) {
    formItems = '<div style="font-size:12px;color:var(--muted);padding:8px 0">No forms configured.</div>';
  }

  // Note reference dropdown

  notes.forEach(function (n) {
    if (n._pending) return;
    var label = (n.caller || n.patientAndTrx || 'Note') + ' — ' + cnFormatTimestampForCopy_(n.timestamp);
    var sel = (c.noteId === n.noteId) ? ' selected' : '';
    noteOptions += '<option value="' + esc(n.noteId) + '"' + sel + '>' + esc(label) + '</option>';
  });

  // Auto-generate subject
  var autoSubject = c.subject;
  if (!autoSubject) {
    var nameForSubj = c.recipientName || 'Patient';
    autoSubject = c.recipientType === 'provider'
      ? 'UMS — Form Request for ' + nameForSubj
      : 'UMS — Documents for ' + nameForSubj;
  }

  return '<div class="modal" style="max-width:540px;resize:both;overflow:auto" id="cnX-modal">' +
    '<div class="modal-title" style="cursor:move" onmousedown="cnStartDragExtModal_(event)">' +
      icon('send', 18) + ' Send External Email</div>' +
    // Round 2 follow-on (modal-tab merge) — shared tab strip; clicking
    // Department switches to the dept composer (preserving noteId).
    cnRenderComposerTabStrip_('external', c.noteId) +
    '<div class="modal-sub">Send forms or messages directly to a customer or provider.</div>' +

    '<div class="cn-ext-section">' +
      '<div class="cn-ext-section-title">Recipient</div>' +
      '<div class="cn-ext-type-radios">' + typeRadios + '</div>' +
      '<div class="field-row" style="gap:10px">' +
        '<div class="field" style="flex:1.2">' +
          '<label>Email Address</label>' +
          '<input type="email" id="cnX-email" value="' + esc(c.recipientEmail) + '" placeholder="name@example.com">' +
        '</div>' +
        '<div class="field" style="flex:1">' +
          '<label>Name (optional)</label>' +
          '<input type="text" id="cnX-name" value="' + esc(c.recipientName) + '" placeholder="John Smith">' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="cn-ext-section">' +
      '<div class="cn-ext-section-title">' + icon('paperclip', 12) + ' Attach Forms</div>' +
      '<div class="cn-ext-form-list" id="cnX-form-list">' + formItems + '</div>' +
    '</div>' +

    '<div class="cn-ext-section">' +
      '<div class="cn-ext-section-title">Message</div>' +
      '<div class="field" style="margin-bottom:10px">' +
        '<label>Subject</label>' +
        '<input type="text" id="cnX-subject" value="' + esc(autoSubject) + '">' +
      '</div>' +
      '<div class="field" style="margin-bottom:0">' +
        '<label>Custom Message (optional)</label>' +

      '</div>' +
      '<div class="cn-ext-note-link">' +
        '<label style="margin:0;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap">Link to note</label>' +
        '<select id="cnX-note-ref">' + noteOptions + '</select>' +

    '<div class="modal-footer">' +
      '<button class="btn-modal-cancel" onclick="cnCloseExternalEmailModal_()">Cancel</button>' +
      '<button class="btn-modal-ok" id="cnX-send-btn">' + icon('send', 14) + ' Send</button>' +
    '</div>' +
  '</div>';
}

function cnWireExternalEmailModal_() {
  var c = CN_STATE.extComposer;
  if (!c) return;

  // Recipient type toggle
  document.querySelectorAll('.cn-ext-type-radio').forEach(function (btn) {
    btn.addEventListener('click', function () {
      c.recipientType = btn.dataset.extType;
      document.querySelectorAll('.cn-ext-type-radio').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.extType === c.recipientType ? 'true' : 'false');
      });
      // Update subject if it still has the auto-generated pattern
      cnExtAutoUpdateSubject_();
    });
  });

  // Form checkbox sync — updated for fillable mode awareness
  document.querySelectorAll('#cnX-form-list input[type="checkbox"]').forEach(function (cb) {
    cb.addEventListener('change', function () {
      var fid = cb.dataset.formId;
      cnExtSyncFormSelection_(fid, cb.checked);
    });
  });

  // Mode toggle switches (PDF <=> Fillable)
  document.querySelectorAll('.cn-ext-form-mode-switch').forEach(function (sw) {
    sw.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var fid = sw.dataset.modeSwitch;
      var currentMode = c.formModes[fid] || 'pdf';
      var newMode = currentMode === 'pdf' ? 'fillable' : 'pdf';
      c.formModes[fid] = newMode;
      // Snapshot prefill inputs before re-render
      cnExtSnapshotPrefill_();
      cnExtSyncFormSelection_(fid, true); // re-sync into correct list
      cnRenderExternalEmailModal_();
    });
  });
  // Also wire the toggle labels
  document.querySelectorAll('.cn-ext-form-mode-toggle .toggle-label').forEach(function (lbl) {
    lbl.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var wrap = lbl.closest('.cn-ext-form-mode-toggle');
      if (!wrap) return;
      var fid = wrap.dataset.modeFormId;
      var targetMode = lbl.dataset.modeVal;
      if (c.formModes[fid] === targetMode) return;
      c.formModes[fid] = targetMode;
      cnExtSnapshotPrefill_();
      cnExtSyncFormSelection_(fid, true);
      cnRenderExternalEmailModal_();
    });
  });

  // Prefill input sync — snapshot on any change
  document.querySelectorAll('[data-prefill-form]').forEach(function (inp) {
    inp.addEventListener('input', function () {
      var fid = inp.dataset.prefillForm;
      var key = inp.dataset.prefillKey;
      if (!c.prefillData[fid]) c.prefillData[fid] = {};
      c.prefillData[fid][key] = inp.value;
    });
  });

  // Name change => subject auto-update
  var nameInput = document.getElementById('cnX-name');
  if (nameInput) {
    nameInput.addEventListener('input', function () {
      c.recipientName = nameInput.value;
      cnExtAutoUpdateSubject_();
    });
  }

  // Send button
  var sendBtn = document.getElementById('cnX-send-btn');
  if (sendBtn) {
    sendBtn.addEventListener('click', cnSendExternalEmail_);
  }
}

/** Sync a form's checked state into the correct list (formIds or interactiveForms). */
function cnExtSyncFormSelection_(fid, checked) {
  var c = CN_STATE.extComposer;
  if (!c) return;
  var mode = c.formModes[fid] || 'pdf';
  // Remove from both lists first
  var pdfIdx = c.formIds.indexOf(fid);
  if (pdfIdx >= 0) c.formIds.splice(pdfIdx, 1);
  var intIdx = c.interactiveForms.indexOf(fid);
  if (intIdx >= 0) c.interactiveForms.splice(intIdx, 1);
  // Add to the right list if checked
  if (checked) {
    if (mode === 'fillable' && CN_INTERACTIVE_FORM_IDS.indexOf(fid) >= 0) {
      c.interactiveForms.push(fid);
    } else {
      c.formIds.push(fid);
    }
  }
}

/** Snapshot in-progress prefill input values before a re-render. */
function cnExtSnapshotPrefill_() {
  var c = CN_STATE.extComposer;
  if (!c) return;
  document.querySelectorAll('[data-prefill-form]').forEach(function (inp) {
    var fid = inp.dataset.prefillForm;
    var key = inp.dataset.prefillKey;
    if (!c.prefillData[fid]) c.prefillData[fid] = {};
    c.prefillData[fid][key] = inp.value;
  });
}

/** Auto-update the subject when the recipient type or name changes, but only
 *  if the subject still matches an auto-generated pattern. */
function cnExtAutoUpdateSubject_() {
  var c = CN_STATE.extComposer;
  if (!c) return;
  var subjectEl = document.getElementById('cnX-subject');
  if (!subjectEl) return;
  var current = subjectEl.value.trim();
  // Only overwrite if it matches a known auto-pattern
  if (/^UMS\s*—\s*(Documents for|Form Request for)\s/i.test(current) || !current) {
    var nameForSubj = (document.getElementById('cnX-name') || {}).value || 'Patient';
    subjectEl.value = c.recipientType === 'provider'
      ? 'UMS — Form Request for ' + nameForSubj
      : 'UMS — Documents for ' + nameForSubj;
  }
}

function cnSendExternalEmail_() {
  var c = CN_STATE.extComposer;
  if (!c || c.sending) return;

  // Snapshot prefill before reading
  cnExtSnapshotPrefill_();

  // Gather values from DOM
  var email = (document.getElementById('cnX-email') || {}).value || '';
  var name = (document.getElementById('cnX-name') || {}).value || '';
  var subject = (document.getElementById('cnX-subject') || {}).value || '';
  var message = (document.getElementById('cnX-message') || {}).value || '';
  var noteRef = (document.getElementById('cnX-note-ref') || {}).value || null;

  // Client-side validation
  email = email.trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showToast('Please enter a valid email address.', 'toast-error');
    var emailEl = document.getElementById('cnX-email');
    if (emailEl) emailEl.focus();
    return;
  }
  subject = subject.trim();
  if (!subject) {
    showToast('Subject line is required.', 'toast-error');
    var subjEl = document.getElementById('cnX-subject');
    if (subjEl) subjEl.focus();
    return;
  }

  c.sending = true;
  var sendBtn = document.getElementById('cnX-send-btn');
  if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = icon('send', 14) + ' Sending…'; }

  var payload = {
    recipientEmail: email,
    recipientName: name.trim(),
    recipientType: c.recipientType,
    subject: subject,
    message: message.trim(),
    formIds: c.formIds,
    interactiveForms: c.interactiveForms,
    prefillData: c.prefillData,
    noteId: noteRef || null,
  };

  var requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      c.sending = false;
      if (!res.success) {
        if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = icon('send', 14) + ' Send'; }
        showToast(res.error || 'Send failed', 'toast-error');
        return;
      }
      cnCloseExternalEmailModal_();
      var parts = [];
      if ((res.formsAttached || []).length > 0) {
        parts.push(res.formsAttached.length + ' PDF(s)');
      }
      if ((res.formLinks || []).length > 0) {
        parts.push(res.formLinks.length + ' fillable form(s)');
      }
      var suffix = parts.length > 0 ? ' with ' + parts.join(' + ') : '';
      showToast('Sent to ' + esc(res.recipientEmail) + suffix, 'toast-success');

      // If a note was linked, update the local state so the card pill appears
      if (noteRef) {
        var note = cnFindNoteAnywhere_(noteRef);
        if (note) {
          if (!note.subformData || typeof note.subformData !== 'object') note.subformData = {};
          if (!Array.isArray(note.subformData.externalEmails)) note.subformData.externalEmails = [];
          var stampEntry = {
            to: email,
            type: c.recipientType,
            forms: c.formIds,
            sentAt: res.sentAt,
          };
          if (c.interactiveForms.length > 0) {
            stampEntry.interactiveForms = c.interactiveForms.map(function (fid) { return { formType: fid }; });
          }
          note.subformData.externalEmails.push(stampEntry);
          if (currentView === requestedView) cnReRenderActiveView_();
        }
      }
    })
    .withFailureHandler(function (err) {
      c.sending = false;
      if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = icon('send', 14) + ' Send'; }
      showToast('Send failed: ' + (err.message || 'Server error'), 'toast-error');
    })
    .sendExternalEmail(payload);
}

function cnStartDragExtModal_(e) {
  var modal = document.getElementById('cnX-modal');
  if (!modal) return;
  var startX = e.clientX, startY = e.clientY;
  var rect = modal.getBoundingClientRect();
  var origLeft = rect.left, origTop = rect.top;
  modal.style.position = 'fixed';
  modal.style.left = origLeft + 'px';
  modal.style.top = origTop + 'px';
  modal.style.margin = '0';
  function onMove(ev) {
    modal.style.left = (origLeft + ev.clientX - startX) + 'px';
    modal.style.top = (origTop + ev.clientY - startY) + 'px';
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  e.preventDefault();
}

</script>
