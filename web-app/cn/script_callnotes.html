        return;
      }
      cnRenderFormSubOverlay_(cnBuildFormSubModalHtml_(res));
    })
    .withFailureHandler(function (err) {
      cnCloseFormSubOverlay_();
      if (typeof showToast === 'function') showToast('Could not load submission: ' + (err && err.message || err), 'toast-error');
    })
    .managerGetFormSubmission(repId, token);
}

function cnBuildFormSubModalHtml_(res) {
  var head = esc(res.formName || 'Form submission');
  if (!res.submitted) {
    return '<div class="modal cn-form-sub-modal" style="max-width:560px">' +
      '<div class="modal-title">' + head + '</div>' +
      '<div class="modal-sub">Not submitted yet' + (res.status ? ' (' + esc(res.status) + ')' : '') + '.</div>' +
      '<div class="modal-footer"><button class="btn-modal-ok" onclick="cnCloseFormSubOverlay_()">Close</button></div>' +
      '</div>';
  }
  var who = esc(res.recipientName || res.recipientEmail || '');
  var when = res.submittedAt ? esc(cnFormatTimestampForCopy_(res.submittedAt)) : '';
  var body;
  if (res.submissionHtml) {
    // Server-rendered branded card (matches the submission email). Safe to
    // inject — every field is esc_-escaped server-side (same INV-89 discipline
    // as the email-preview body).
    body = res.submissionHtml;
  } else {
    // Fallback: plain label/value list (e.g. a stale server without submissionHtml).
    var rows = (res.fields || []).map(function (f) {
      var v = f.value;
      var vStr = (v && typeof v === 'object') ? JSON.stringify(v) : String(v == null ? '' : v);
      return '<div class="cn-fs-row"><div class="cn-fs-label">' + esc(f.label) + '</div>' +
             '<div class="cn-fs-value">' + esc(vStr).replace(/\n/g, '<br>') + '</div></div>';
    }).join('');
    if (!rows) rows = '<div class="modal-sub" style="margin-top:6px">No field data captured.</div>';
    var sig = res.hasSignature
      ? '<div class="cn-fs-sig"><div class="cn-fs-label">Signature</div>' +
        '<img class="cn-fs-sig-img" src="' + esc(res.signature) + '" alt="signature"></div>'
      : '';
    body = rows + sig;
  }
  return '<div class="modal cn-form-sub-modal" style="max-width:600px;max-height:82vh;overflow:auto">' +
    '<div class="modal-title">' + head + '</div>' +
    '<div class="modal-sub">' + (who ? 'From ' + who : '') + (when ? ' · ' + when : '') + '</div>' +
    '<div class="cn-form-sub-fields">' + body + '</div>' +
    '<div class="modal-footer"><button class="btn-modal-ok" onclick="cnCloseFormSubOverlay_()">Close</button></div>' +
    '</div>';
}

function cnCopyNoteAgain_(noteId) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note) return;
  cnAutoCopyNote_(note);
  showToast('Copied to clipboard', 'toast-success');
}

function cnBeginEdit_(noteId) {
  CN_STATE.editingNoteId = noteId;
  cnReRenderActiveView_();
  // Just focus the field — Cmd/Ctrl+Enter is handled by the delegated keydown
  // listener in cnInstallCardDelegation_ (survives mid-edit re-renders; a
  // per-element listener here would be lost on re-render and could double-fire).
  setTimeout(function () {
    const el = document.getElementById('cnE-resolution-' + noteId);
    if (el) el.focus();
  }, 30);
}

function cnCancelEdit_(noteId) {
  CN_STATE.editingNoteId = null;
  cnReRenderActiveView_();
}

function cnSaveEdit_(noteId) {
  const payload = {
    callback:      document.getElementById('cnE-callback-' + noteId).value,
    caller:        document.getElementById('cnE-caller-' + noteId).value,
    relationship:  document.getElementById('cnE-relationship-' + noteId).value,
    patientAndTrx: document.getElementById('cnE-patient-' + noteId).value,
    issue:         document.getElementById('cnE-issue-' + noteId).value,
    transferredTo: document.getElementById('cnE-transferred-' + noteId).value,
    resolution:    document.getElementById('cnE-resolution-' + noteId).value,
  };
  var saveBtn = document.querySelector('[data-note-id="' + noteId + '"] [data-cn-action="save-edit"]');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
        showToast(res.error || 'Save failed', 'toast-error'); return;
      }
      cnReplaceNoteInState_(res.note);
      CN_STATE.editingNoteId = null;
      cnReRenderActiveView_();
      cnRenderFilterBar_();
      showToast('Saved', 'toast-success');
    })
    .withFailureHandler(function (err) {
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
      showToast('Save failed: ' + err.message, 'toast-error');
    })
    .updateCallNote(noteId, payload);
}

function cnDeleteNote_(noteId) {
  uiConfirm({
    title: 'Delete note',
    message: 'Delete this note? This cannot be undone.',
    confirmLabel: 'Delete',
    tone: 'danger',
  }).then(function (ok) {
    if (!ok) return;
    cnDoDeleteNote_(noteId);
  });
}
function cnDoDeleteNote_(noteId, opts) {
  // Mark every rendering of the note (stack / history / pinned tray) as
  // deleting — visible feedback for the ~1s RPC (r3).
  document.querySelectorAll('[data-note-id="' + noteId + '"]').forEach(function (c) {
    c.classList.add('is-deleting');
  });
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        document.querySelectorAll('[data-note-id="' + noteId + '"]').forEach(function (c) { c.classList.remove('is-deleting'); });
        showToast(res.error || 'Delete failed', 'toast-error');
        return;
      }
      CN_STATE.rollingNotes = CN_STATE.rollingNotes.filter(function (n) { return n.noteId !== noteId; });
      CN_STATE.historyNotes = CN_STATE.historyNotes.filter(function (n) { return n.noteId !== noteId; });
      CN_STATE.pinnedNotes = (CN_STATE.pinnedNotes || []).filter(function (n) { return n.noteId !== noteId; });
      CN_STATE.editingNoteId = null;
      cnReRenderActiveView_();
      cnRenderFilterBar_();
      cnRenderPinnedTray_();
      showToast((opts && opts.toast) || 'Deleted', 'toast-success');
    })
    .withFailureHandler(function (err) {
      document.querySelectorAll('[data-note-id="' + noteId + '"]').forEach(function (c) { c.classList.remove('is-deleting'); });
      showToast('Delete failed: ' + err.message, 'toast-error');
    })
    .deleteCallNote(noteId);
}

function cnToggleFlag_(noteId, kind) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note) return;
  if (note._pending) { showToast('Just a moment — still saving', 'toast-warn'); return; }
  if (note._flagInFlight) return;

  const prev = { flagType: note.flagType, resolved: note.resolved };
  const next = (note.flagType === kind) ? '' : kind;

  if (next === 'training') {
    // uiPrompt is async — set the in-flight guard BEFORE opening it so a
    // second click while the prompt is open is dropped (INV-56), then clear
    // it if the rep cancels. cnDoToggleFlag_ re-sets it for the RPC leg.
    note._flagInFlight = true;
    uiPrompt({
      title: 'Flag for training',
      message: 'What question or concern would you like to flag for training?\n(Leave blank to skip)',
      initialValue: '',
      placeholder: 'Optional training question',
      confirmLabel: 'Flag',
    }).then(function (raw) {
      // F8 — re-resolve the note from state: a 60s ambient refresh while the
      // prompt was open may have REPLACED the slot (cnReplaceNoteInState_),
      // leaving our captured `note` detached so the optimistic toggle/revert
      // would render against the wrong object. Clear the guard on whatever we
      // set it on, then operate on the CURRENT object with a fresh prev/next.
      note._flagInFlight = false;
      const cur = cnFindNoteAnywhere_(noteId);
      if (raw === null || !cur) return;
      if (cur._pending) { showToast('Just a moment — still saving', 'toast-warn'); return; }
      if (cur._flagInFlight) return;
      const curPrev = { flagType: cur.flagType, resolved: cur.resolved };
      const curNext = (cur.flagType === kind) ? '' : kind;
      const trimmed = String(raw).trim() || null;
      cnDoToggleFlag_(noteId, cur, curPrev, curNext, trimmed);
    });
    return;
  }
  cnDoToggleFlag_(noteId, note, prev, next, null);
}

function cnDoToggleFlag_(noteId, note, prev, next, trainingQ) {
  note._flagInFlight = true;
  note.flagType = next;
  if (prev.flagType !== next) note.resolved = false;
  cnReRenderActiveView_();
  cnRenderFilterBar_();
  google.script.run
    .withSuccessHandler(function (res) {
      note._flagInFlight = false;
      if (!res.success) {
        note.flagType = prev.flagType; note.resolved = prev.resolved;
        cnReRenderActiveView_(); cnRenderFilterBar_();
        showToast(res.error || 'Flag failed', 'toast-error');
        return;
      }
      cnReplaceNoteInState_(res.note);
      cnReRenderActiveView_();
    })
    .withFailureHandler(function (err) {
      note._flagInFlight = false;
      note.flagType = prev.flagType; note.resolved = prev.resolved;
      cnReRenderActiveView_(); cnRenderFilterBar_();
      showToast('Flag failed: ' + err.message, 'toast-error');
    })
    .setCallNoteFlag(noteId, next, trainingQ);
}

/** Card-level urgent toggle (Round 2 deferred 8e). Unlike action/training/
 *  review, urgent never touches the FlagType column — the server toggles
 *  membership in subformData.flags[] only (INV-77). So this optimistically
 *  mutates the flags array (not note.flagType), keeping the danger ring + pill
 *  in sync, and reverts on failure. Shares the _flagInFlight guard (INV-56) so
 *  a rapid double-click can't fire two clobbering RPCs. */
function cnToggleUrgent_(noteId) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note) return;
  if (note._pending) { showToast('Just a moment — still saving', 'toast-warn'); return; }
  if (note._flagInFlight) return;
  note._flagInFlight = true;
  note.subformData = note.subformData || {};
  const prevFlags = Array.isArray(note.subformData.flags) ? note.subformData.flags.slice() : [];
  const wasUrgent = prevFlags.indexOf('urgent') >= 0;
  const nextFlags = prevFlags.filter(function (f) { return f !== 'urgent'; });
  if (!wasUrgent) nextFlags.push('urgent');
  note.subformData.flags = nextFlags;
  cnReRenderActiveView_();
  if (typeof cnRenderPinnedTray_ === 'function') cnRenderPinnedTray_();
  google.script.run
    .withSuccessHandler(function (res) {
      note._flagInFlight = false;
      if (!res || !res.success) {
        note.subformData.flags = prevFlags;
        cnReRenderActiveView_();
        if (typeof cnRenderPinnedTray_ === 'function') cnRenderPinnedTray_();
        showToast((res && res.error) || 'Urgent toggle failed', 'toast-error');
        return;
      }
      cnReplaceNoteInState_(res.note);
      cnReRenderActiveView_();
      if (typeof cnRenderPinnedTray_ === 'function') cnRenderPinnedTray_();
    })
    .withFailureHandler(function (err) {
      note._flagInFlight = false;
      note.subformData.flags = prevFlags;
      cnReRenderActiveView_();
      if (typeof cnRenderPinnedTray_ === 'function') cnRenderPinnedTray_();
      showToast('Urgent toggle failed: ' + (err && err.message || err), 'toast-error');
    })
    .setCallNoteFlag(noteId, 'urgent', null);
}

/** Toggle the pinned state on a note — optimistic. The pinned tray
 *  re-renders immediately; on server failure we revert. Server enforces
 *  the 3-pin cap (the error surfaces as a toast). */
function cnTogglePinned_(noteId) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note) return;
  if (note._pending) { showToast('Just a moment — still saving', 'toast-warn'); return; }
  if (note._flagInFlight) return;
  note._flagInFlight = true;
  const wasPinned = !!(note.subformData && note.subformData.pinned);
  var prevPinnedAt = (note.subformData && note.subformData.pinnedAt) || null;
  note.subformData = note.subformData || {};
  note.subformData.pinned = !wasPinned;
  if (!wasPinned) note.subformData.pinnedAt = new Date().toISOString();
  else delete note.subformData.pinnedAt;
  // Mirror into the pinned-tray cache so the tray re-renders right away
  if (!wasPinned) {
    CN_STATE.pinnedNotes = (CN_STATE.pinnedNotes || []).filter(function (n) { return n.noteId !== noteId; });
    CN_STATE.pinnedNotes.unshift(note);
  } else {
    CN_STATE.pinnedNotes = (CN_STATE.pinnedNotes || []).filter(function (n) { return n.noteId !== noteId; });
  }
  cnRenderPinnedTray_();
  cnReRenderActiveView_();
  google.script.run
    .withSuccessHandler(function (res) {
      note._flagInFlight = false;
      if (!res.success) {
        note.subformData.pinned = wasPinned;
        if (prevPinnedAt) note.subformData.pinnedAt = prevPinnedAt;
        else delete note.subformData.pinnedAt;
        cnReloadPinnedTray_();
        cnReRenderActiveView_();
        showToast(res.error || 'Pin failed', 'toast-error');
        return;
      }
      cnReplaceNoteInState_(res.note);
      cnReloadPinnedTray_();
      cnReRenderActiveView_();
    })
    .withFailureHandler(function (err) {
      note._flagInFlight = false;
      note.subformData.pinned = wasPinned;
      if (prevPinnedAt) note.subformData.pinnedAt = prevPinnedAt;
      else delete note.subformData.pinnedAt;
      cnReloadPinnedTray_();
      cnReRenderActiveView_();
      showToast('Pin failed: ' + err.message, 'toast-error');
    })
    .setCallNotePinned(noteId, !wasPinned);
}

/** Re-fetch the pinned tray from the server. Called on view enter and
 *  after pin/unpin to keep the tray authoritative (pinned notes can come
 *  from any past date, so they're not in the today-only rolling stack). */
function cnReloadPinnedTray_() {
  var requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      // State update is unconditional (cache stays warm for next visit)
      if (res && !res.error) {
        CN_STATE.pinnedNotes = res.notes || [];
        if (res.limit != null) CN_STATE.pinLimit = res.limit;
      }
      // DOM updates only if still on the same view
      if (currentView !== requestedView) return;
      if (res && !res.error) {
        cnRenderPinnedTray_();
        // Re-render the rolling stack so pinned-note deduplication stays in
        // sync with the freshly loaded tray. Without this, a first-visit
        // stack shows pinned notes as duplicates (they were rendered before
        // pinnedNotes was populated), and a second-visit stack may filter
        // notes that the tray hasn't rendered yet.
        cnRenderStack_();
        cnRenderFilterBar_();
      }
    })
    .withFailureHandler(function () {
      // Cycle-9 L-28: this is the AUTHORITATIVE tray reload (also invoked
      // from the pin toggle's revert path) — a silent transport failure left
      // stale/optimistically-reverted tray state with no signal.
      if (currentView === requestedView) showToast('Could not refresh pinned notes', 'toast-error');
    })
    .getMyPinnedCallNotes();
}

/** Render the pinned-notes tray above the rolling stack. Only renders the
 *  host div's content; the host is created in cnRenderNotesView. */
function cnRenderPinnedTray_() {
  const host = document.getElementById('cn-pinned-tray');
  if (!host) return;
  const pinned = CN_STATE.pinnedNotes || [];
  if (pinned.length === 0) { host.innerHTML = ''; host.classList.remove('cn-pinned-full'); return; }
  const limit = CN_STATE.pinLimit || 3;
  const isFull = pinned.length >= limit;
  host.classList.toggle('cn-pinned-full', isFull);
  // M-3 (cycle 10): same typed-edit preservation as cnRenderStack_ — now that
  // a pinned card can host the open inline editor, a tray re-render (another
  // card's optimistic toggle, a pin reload) must not rebuild it from stored
  // values and discard typing (the cycle-8 stack fix, applied to the tray).
  const editSnap = cnEditSnapshot_();
  host.innerHTML =
    `<div class="cn-pinned-label">${icon('bookmark', 11)}<span>Pinned · ${pinned.length}/${limit}</span></div>` +
    pinned.map(cnRenderCard_).join('');
  cnEditRestore_(editSnap);
}

// ── Training Q&A tray (recent answered training questions) ────────────

/** Fetch the rep's most recent training Q&A pairs from the server and render
 *  a collapsible section in the Log view. Similar to the pinned tray but for
 *  training notes with manager replies. */
function cnLoadTrainingQA_() {
  var requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && !res.error) {
        CN_STATE.trainingQA = res.notes || [];
      }
      if (currentView !== requestedView) return;
      cnRenderTrainingQATray_();
    })
    .withFailureHandler(function () {
      // Silent failure — tray stays empty
    })
    .getMyTrainingQA();
}

/** Render the training Q&A tray above the filter bar. Only shows when the
 *  rep has at least one answered training note. Collapsible to save space. */
// Resolve the most recent manager reply for a note, preferring the
// multi-turn feedback[] thread (Round 2 · 8g) and falling back to the legacy
// trainingReply field. Without this, surfaces that read only the legacy
// field (the Training Answers tray, the manager read-only card) show an
// empty answer line for notes whose reply lives solely in feedback[] (L4/L5).
function cnLatestManagerReply_(sub) {
  sub = sub || {};
  if (Array.isArray(sub.feedback)) {
    for (let i = sub.feedback.length - 1; i >= 0; i--) {
      const e = sub.feedback[i];
      if (e && e.role === 'manager' && (e.kind === 'reply' || !e.kind) && e.message) {
        return { message: String(e.message), by: String(e.by || '') };
      }
    }
  }
  if (sub.trainingReply) {
    return { message: String(sub.trainingReply), by: String(sub.trainingReplyBy || '') };
  }
  return { message: '', by: '' };
}

function cnRenderTrainingQATray_() {
  const host = document.getElementById('cn-training-qa-tray');
  if (!host) return;
  const qa = CN_STATE.trainingQA || [];
  if (qa.length === 0) { host.innerHTML = ''; return; }
  const cards = qa.map(function (n) {
    const time = cnFormatTimestampForCopy_(n.timestamp);
    const question = (n.subformData && n.subformData.trainingQuestion) || '';
    const mgrReply = cnLatestManagerReply_(n.subformData);
    const reply = mgrReply.message;
    const replyBy = mgrReply.by;
    return `
      <div class="cn-qa-card">
        <div class="cn-qa-card-meta">${esc(n.dateLocal)} · ${esc(time)}${n.caller ? ' · ' + esc(n.caller) : ''}</div>
        <div class="cn-qa-card-q">${icon('bulb', 11)}<span>${esc(question)}</span></div>
        <div class="cn-qa-card-a">${icon('checkCircle', 11)}<span>${esc(reply)}${replyBy ? ' <span style="opacity:.6">— ' + esc(replyBy) + '</span>' : ''}</span></div>
      </div>
    `;
  }).join('');
  host.innerHTML =
    `<div class="cn-qa-label" onclick="this.parentElement.classList.toggle('collapsed')">${icon('bulb', 11)}<span>Training Answers · ${qa.length}</span> ${icon('chevronDown', 10)}</div>` +
    `<div class="cn-qa-cards">${cards}</div>`;
}

function cnToggleResolved_(noteId) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note || note.flagType !== 'action') return;
  if (note._pending) { showToast('Just a moment — still saving', 'toast-warn'); return; }
  if (note._flagInFlight) return;
  note._flagInFlight = true;
  const prevResolved = note.resolved;
  note.resolved = !prevResolved;
  cnReRenderActiveView_();
  cnRenderFilterBar_();
  google.script.run
    .withSuccessHandler(function (res) {
      note._flagInFlight = false;
      if (!res.success) {
        note.resolved = prevResolved;
        cnReRenderActiveView_(); cnRenderFilterBar_();
        showToast(res.error || 'Update failed', 'toast-error');
        return;
      }
      cnReplaceNoteInState_(res.note);
      cnReRenderActiveView_();
      // §6 settle — only when transitioning TO resolved, and applied AFTER this
      // confirming re-render (the optimistic one would be clobbered by it).
      // Transient + self-cleaning so a resolved card is never left stuck dimmed
      // and the optimistic-revert path (INV-48/56) is untouched.
      if (!prevResolved && res.note && res.note.resolved) {
        var card = document.querySelector('[data-note-id="' + noteId + '"]');
        if (card) settleRow_(card, null, { transient: true });
      }
    })
    .withFailureHandler(function (err) {
      note._flagInFlight = false;
      note.resolved = prevResolved;
      cnReRenderActiveView_(); cnRenderFilterBar_();
      showToast('Update failed: ' + err.message, 'toast-error');
    })
    .setCallNoteResolved(noteId, note.resolved);
}

// ── Filter bar ─────────────────────────────────────────────────────────

function cnRenderFilterBar_() {
  const bar = document.getElementById('cn-filter-bar');
  if (!bar) return;
  CN_STATE.filterCounts = cnComputeFilterCounts_(CN_STATE.rollingNotes);
  const labelFor = { all: 'All', action: 'Action', training: 'Training',
                     review: 'Review', unresolved: 'Unresolved', answered: 'Q&A' };
  bar.innerHTML = '<span class="cn-filter-label">Filter</span>' +
    CN_DEFAULT_FILTERS.map(function (f) {
      const count = CN_STATE.filterCounts[f] || 0;
      const pressed = CN_STATE.filter === f;
      // Color class per filter — chip picks up the right hue from styles.html
      const tone = (f === 'action' || f === 'unresolved') ? ' cn-fc-action'
                 : (f === 'training') ? ' cn-fc-training'
                 : (f === 'review') ? ' cn-fc-review'
                 : (f === 'answered') ? ' cn-fc-review'
                 : '';
      return `<button class="cn-filter-chip${tone}" aria-pressed="${pressed}" onclick="cnSetFilter_('${f}')">
                ${labelFor[f] || f} <span class="chip-count">${count}</span>
              </button>`;
    }).join('');
}

function cnSetFilter_(f) {
  CN_STATE.filter = f;
  cnRenderStack_();
  cnRenderFilterBar_();
}

function cnComputeFilterCounts_(notes) {
  const counts = { all: notes.length };
  CN_DEFAULT_FILTERS.forEach(function (f) {
    if (f === 'all') return;
    counts[f] = notes.filter(function (n) { return cnNoteMatchesFilter_(n, f); }).length;
  });
  return counts;
}

function cnNoteMatchesFilter_(note, filter) {
  switch (filter) {
    case 'action':     return note.flagType === 'action';
    case 'training':   return note.flagType === 'training';
    case 'review':     return note.flagType === 'review';
    case 'unresolved': return note.flagType === 'action' && !note.resolved;
    case 'unsent':     return !note.emailedAt;
    // N-2 — INTENTIONALLY keys off the legacy `trainingReply` (the clearable
    // "current answer" pointer), NOT feedback[]. cnLatestManagerReply_ prefers
    // feedback[] for RENDERING, so a feedback[]-only reply can render an answer
    // line yet not match this chip — that's by design per INV-49 (a *cleared*
    // reply must disappear from this filter / the QA count). Do not "fix" it to
    // read feedback[] without first redefining clear as a retraction marker.
    case 'answered':   return note.flagType === 'training' && note.subformData && !!note.subformData.trainingReply;
    case 'all':
    default:           return true;
  }
}

function cnNoteIsStale_(note) {
  if (!note.timestamp) return false;
  // Parse iso "yyyy-MM-dd'T'HH:mm:ss" — assume same tz as the rep, compare
  // naively to "now" (since both clocks are in the rep's tz, the offset
  // cancels for the elapsed-time delta).
  const t = note.timestamp.replace(' ', 'T');
  const parts = t.split('T');
  if (parts.length < 2) return false;
  const d = parts[0].split('-').map(function (x) { return parseInt(x,10); });
  const h = parts[1].split(':').map(function (x) { return parseInt(x,10); });
  if (d.length < 3 || h.length < 2) return false;
  const noteMs = new Date(d[0], d[1]-1, d[2], h[0], h[1], h[2] || 0).getTime();
  // Same calculation for "now" so the local-vs-tz mismatch cancels
  const nowLocal = new Date();
  const tz = CN_STATE.empTz || (empState && empState.timezone) || 'UTC';
  const fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  }).formatToParts(nowLocal);
  const get = function (k) { const p = fmt.find(function(x){return x.type===k;}); return p ? parseInt(p.value,10) : 0; };
  const nowMs = new Date(get('year'), get('month')-1, get('day'), get('hour'), get('minute'), get('second')).getTime();
  const staleMs = (CN_STATE.staleFlagHours || 1) * 3600 * 1000;
  return (nowMs - noteMs) >= staleMs;
}

// ── Email composer modal ───────────────────────────────────────────────

/** Round 2 follow-on (modal-tab merge) — shared tab strip prepended to BOTH
 *  the department composer (CN_STATE.composer) and the external composer
 *  (CN_STATE.extComposer). One button per tab; clicking the inactive tab
 *  switches between modals via cnSwitchComposerTab_, preserving noteId
 *  context. Department tab is disabled when no noteId is available — a
 *  dept email needs a saved note to attach EmailedAt + EmailDepartments to.
 *  CSS in styles.html: `.cn-composer-tabs` + `.cn-composer-tab(.on,.disabled)`. */
function cnRenderComposerTabStrip_(active, noteId) {
  const hasNote = !!noteId;
  const deptDisabled = !hasNote;
  const deptCls = 'cn-composer-tab' + (active === 'department' ? ' on' : '')
    + (deptDisabled ? ' disabled' : '');
  const extCls = 'cn-composer-tab' + (active === 'external' ? ' on' : '');
  const deptTitle = deptDisabled
    ? 'Save the note first to send a department email'
    : 'Send to internal department(s)';
  const deptOnclick = deptDisabled
    ? ''
    : ' onclick="cnSwitchComposerTab_(\'department\')"';
  return `<div class="cn-composer-tabs" role="tablist" aria-label="Email composer mode">
    <button type="button" role="tab" class="${deptCls}" aria-selected="${active === 'department'}"${deptOnclick} title="${esc(deptTitle)}">
      ${icon('mail', 13)} Department
    </button>
    <button type="button" role="tab" class="${extCls}" aria-selected="${active === 'external'}" onclick="cnSwitchComposerTab_('external')" title="Send to a customer or provider">
      ${icon('send', 13)} External
    </button>
  </div>`;
}

/** Round 2 follow-on (modal-tab merge) — Switch between the dept + external
 *  composer modals. Preserves the noteId across the transition so the rep
 *  doesn't lose context. Switching TO Department without a noteId is a
 *  no-op (the inactive tab is disabled in the strip; this guard is
 *  defensive in case the strip's disabled state was bypassed).
 *  Flicker-free: the TARGET modal is mounted before the SOURCE is torn down,
 *  so the browser never paints the empty-backdrop frame the prior
 *  close-then-open order exposed. For the synchronous direction (→ Department,
 *  and → External once the form catalog is cached) both happen in one tick, so
 *  no in-between paint occurs at all; for External's async first open the
 *  Department overlay stays mounted until the catalog fetch resolves. */
function cnSwitchComposerTab_(target) {
  // Capture noteId from whichever composer is currently active
  let noteId = '';
  if (CN_STATE.composer && CN_STATE.composer.noteId) noteId = CN_STATE.composer.noteId;
  else if (CN_STATE.extComposer && CN_STATE.extComposer.noteId) noteId = CN_STATE.extComposer.noteId;

  if (target === 'department') {
    if (!noteId) {
      showToast('Save the note first to send a department email', 'toast-warn');
      return;
    }
    // Mount dept first (synchronous), then remove ext in the same tick.
    cnOpenEmailComposer_(noteId);
    cnCloseExternalEmailModal_();
  } else if (target === 'external') {
    // Mount ext (may be async on first open), removing dept only once ext is
    // actually in the DOM — never an empty-backdrop frame.
    // Tab-switch is NOT a cancel: the rep is continuing the email in the
    // External composer. Detach the Save&Compose transaction first (note
    // stays saved, form keeps its text) so the dept-composer teardown
    // below doesn't roll the save back (r3).
    CN_STATE.composeFlow = null;
    cnOpenExternalEmailModal_(noteId || null, cnCloseComposerModal_);
  }
}

/* Operator feedback (2026-06-12 r2): Save & Compose previously gave no
   feedback while the server assigned a noteId — reps re-clicked. Mount the
   composer overlay IMMEDIATELY with an envelope animation; the real
   composer renders into the same overlay when the save confirms, and the
   submit failure funnel (cnRevertPendingSubmit_) tears it down. */
function cnShowComposerLoading_() {
  const overlay = ensureOverlay('cn-compose-overlay', { onClose: cnCloseComposerModal_ });
  overlay.innerHTML =
    '<div class="modal cn-compose-loading">' +
      '<div class="env">' + icon('mail', 34) + '</div>' +
      '<div class="msg">Saving the note&hellip; the composer opens automatically.</div>' +
    '</div>';
}
function cnCloseComposerLoadingIfPending_() {
  const o = document.getElementById('cn-compose-overlay');
  if (o && o.querySelector('.cn-compose-loading')) cnCloseComposerModal_();
}

function cnOpenEmailComposer_(noteId) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note) return;
  CN_STATE.composer = {
    noteId,
    note,
    step: 'form',  // 'form' | 'preview' | 'sending'
    selections: cnLoadComposerDefaults_(note),
    previewHtml: '',
  };
  cnRenderComposerModal_();
}

function cnLoadComposerDefaults_(note) {
  // One-shot update-type carried in from a cross-tool nav hint (e.g. a Spanish
  // Inbox "Log: Verified Shipping" chip). Applied only when nothing else has set
  // updateInfo, then cleared so it can't bleed into an unrelated note's compose.
  const navTpl = CN_STATE.pendingComposeTemplate || '';
  CN_STATE.pendingComposeTemplate = null;
  // Restore prior selections if the rep is re-sending; otherwise empty.
  if (note.subformData && typeof note.subformData === 'object') {
    const base = Object.assign({
      departments: [], individualEmail: '', updateInfo: '',
      callbackNeeded: false,
    }, note.subformData);
    if (!base.updateInfo && navTpl) base.updateInfo = navTpl;
    return base;
  }
  const lsKey = 'umsCallNotesLastDept';
  let lastDept = [];
  try { lastDept = JSON.parse(localStorage.getItem(lsKey) || '[]'); } catch (e) {}
  return {
    departments: Array.isArray(lastDept) ? lastDept : [],
    individualEmail: '',
    updateInfo: navTpl || '',
    callbackNeeded: false,
    overwriteResolution: false,
    shippingDetails: null,
    closeDetails: null,
    resupplyDetails: null,
    oopDetails: null,
  };
}

function cnCloseComposerModal_() {
  // F(M-9): refuse to close while the send RPC is in flight — closeOverlay
  // delegates entirely to this hook, so returning here keeps the overlay open.
  // Without this, Esc/backdrop-click mid-send ran the composeFlow rollback and
  // deleted the note the in-flight email references.
  if (CN_STATE.composer && CN_STATE.composer.sending) {
    showToast('Sending — one moment…', 'toast-info');
    return;
  }
  CN_STATE.composer = null;
  const overlay = document.getElementById('cn-compose-overlay');
  if (overlay) overlay.remove();
  // Operator feedback (2026-06-12 r3): closing a Save&Compose-opened
  // composer WITHOUT sending rolls the whole action back — the just-saved
  // note is deleted (server 5-min window covers it) and the text is still
  // sitting in the form. Send success clears composeFlow BEFORE closing,
  // so this only fires on a genuine cancel/Esc.
  const fl = CN_STATE.composeFlow;
  if (fl) {
    CN_STATE.composeFlow = null;
    if (fl.note._pending) {
      fl.note._deleteOnConfirm = true;   // finish the rollback when the save confirms
      showToast('Compose cancelled — undoing the save…', 'toast-warn');
    } else if (cnFindNoteAnywhere_(fl.note.noteId)) {
      cnDoDeleteNote_(fl.note.noteId, { toast: 'Compose cancelled — save undone, your text is still in the form' });
    }
  }
}

function cnRenderComposerModal_() {
  // ensureOverlay (script_core) re-asserts `overlay open` on reuse and
  // registers the close hook so the shell's Escape path runs OUR teardown —
  // the prior class-strip-only Esc left this overlay hidden-but-stateful,
  // permanently swallowing every later compose until a page reload.
  const overlay = ensureOverlay('cn-compose-overlay', { onClose: cnCloseComposerModal_ });
  const c = CN_STATE.composer;
  if (!c) { cnCloseComposerModal_(); return; }
  if (c.step === 'form')    overlay.innerHTML = cnRenderComposerFormStep_();
  if (c.step === 'preview') overlay.innerHTML = cnRenderComposerPreviewStep_();
  if (c.step === 'form')    cnWireComposerForm_();
}

function cnRenderComposerFormStep_() {
  const c = CN_STATE.composer;
  const cfg = CN_STATE.deptConfig || { departments: [], suggestionsByDept: {}, defaultSuggestions: [] };
  const depts = cfg.departments;
  const selected = c.selections.departments || [];

  const deptChips = depts.map(function (d) {
    const on = selected.indexOf(d) >= 0;
    // data-dept lets cnUpdateComposerDeptUI_ toggle aria-pressed in place
    // without a full modal re-render (which would cause the modal to flash).
    return `<button type="button" class="cn-dept-chip" aria-pressed="${on}" data-dept="${esc(d)}"
                    onclick="cnToggleComposerDept_(this.dataset.dept)">${esc(d)}</button>`;
  }).join('');

  const otherEmailRow = selected.indexOf('Other') >= 0 ? `
    <div class="field" id="cnC-other-row" style="margin-top:8px">
      <label>"Other" email addresses (comma-separated)</label>
      <input type="text" id="cnC-individual-email" value="${esc(c.selections.individualEmail || '')}"
             placeholder="name@example.com, other@example.com">
    </div>` : '';

  const updateOptions = (function () {
    const set = new Set();
    selected.forEach(function (d) { (cfg.suggestionsByDept[d] || []).forEach(function (s) { set.add(s); }); });
    (cfg.defaultSuggestions || []).forEach(function (s) { set.add(s); });
    return Array.from(set);
  })();
  const updateDatalist = updateOptions.map(function (o) { return `<option value="${esc(o)}">`; }).join('');

  return `
    <div class="modal" style="max-width:560px;resize:both;overflow:auto" id="cnC-modal">
      <div class="modal-title" style="cursor:move" onmousedown="cnStartDragModal_(event)">Compose email</div>
      ${cnRenderComposerTabStrip_('department', c.noteId)}
      <div class="modal-sub">
        For: <strong>${esc(c.note.caller || c.note.patientAndTrx || 'this call')}</strong> · ${esc(c.note.patientAndTrx || '')}
      </div>

      <div class="cn-compose-section">
        <div class="cn-compose-section-title">Recipients</div>
        <div class="cn-compose-dept-grid">${deptChips}</div>
        ${otherEmailRow}
      </div>

function cnToggleComposerDept_(dept) {
  const c = CN_STATE.composer; if (!c) return;
  // Snapshot any in-progress subform values into state BEFORE we touch the DOM
  // — even though we're updating in place, gathering ensures the
  // s.shippingDetails/etc. state stays current for the eventual Preview call.
  try { cnGatherComposerSelections_(); } catch (e) { /* subform not in DOM yet */ }
  const idx = c.selections.departments.indexOf(dept);
  if (idx >= 0) c.selections.departments.splice(idx, 1);
  else c.selections.departments.push(dept);
  // Persist a "last dept selection" for the next compose call
  try { localStorage.setItem('umsCallNotesLastDept', JSON.stringify(c.selections.departments)); } catch (e) {}
  // Update only the parts of the modal that depend on the dept selection:
  // chip aria-pressed states, the conditional "Other email" row, and the
  // update-type datalist's suggestion set. Full modal re-render caused a
  // visible flash on every toggle.
  cnUpdateComposerDeptUI_();
}

/** In-place update of the compose modal's department-dependent UI:
 *  chip aria-pressed states, the "Other" email row, and the update-type
 *  datalist's options. Called by cnToggleComposerDept_ so the modal doesn't
 *  flash on every chip click. */
function cnUpdateComposerDeptUI_() {
  const c = CN_STATE.composer; if (!c) return;
  const cfg = CN_STATE.deptConfig || { departments: [], suggestionsByDept: {}, defaultSuggestions: [] };
  const selected = c.selections.departments || [];

  // 1. Chip aria-pressed
  document.querySelectorAll('.cn-dept-chip[data-dept]').forEach(function (chip) {
    chip.setAttribute('aria-pressed', selected.indexOf(chip.dataset.dept) >= 0 ? 'true' : 'false');
  });

  // 2. "Other" email row: show when Other is selected, hide otherwise.
  // Preserves whatever the rep typed by reading the input before removing.
  const hasOther = selected.indexOf('Other') >= 0;
  let otherRow = document.getElementById('cnC-other-row');
  if (hasOther && !otherRow) {
    const grid = document.querySelector('.cn-compose-dept-grid');
    if (grid && grid.parentElement) {
      const wrapper = document.createElement('div');
      wrapper.className = 'field';
      wrapper.id = 'cnC-other-row';
      wrapper.style.marginTop = '8px';
      wrapper.innerHTML =
        '<label>"Other" email addresses (comma-separated)</label>' +
        '<input type="text" id="cnC-individual-email" value="' +
          esc(c.selections.individualEmail || '') +
        '" placeholder="name@example.com, other@example.com">';
      grid.parentElement.insertBefore(wrapper, grid.nextSibling);
    }
  } else if (!hasOther && otherRow) {
    const inp = document.getElementById('cnC-individual-email');
    if (inp) c.selections.individualEmail = inp.value;
    otherRow.remove();
  }

  // 3. Update-type datalist — rebuild options in-place
  const datalist = document.getElementById('cnC-update-options');
  if (datalist) {
    const set = new Set();
    selected.forEach(function (d) { (cfg.suggestionsByDept[d] || []).forEach(function (s) { set.add(s); }); });
    (cfg.defaultSuggestions || []).forEach(function (s) { set.add(s); });
    datalist.innerHTML = Array.from(set).map(function (o) { return '<option value="' + esc(o) + '">'; }).join('');
  }
}

function cnRenderSubforms_() {
  const c = CN_STATE.composer; if (!c) return;
  const host = document.getElementById('cnC-subforms');
  if (!host) return;
  const u = String(c.selections.updateInfo || '').toLowerCase().trim();
  // Compute the "shape" key — which subforms render for this update type.
  // If the shape hasn't changed since the last render, skip re-rendering to
  // preserve in-progress typing. cnComposerUpdateInfoChanged_ fires on every
  // keystroke into the Update Type field; without this guard, every partial
  // string would rebuild the subform host and wipe whatever the rep typed
  // into the existing subform fields.
  const key = cnSubformShapeKey_(u);
  if (host.dataset.shapeKey === key) return;
  // Shape is changing — snapshot whatever was in the DOM into state before
  // wiping. If the rep types "verified shipping", fills the shipping subform,
  // then backspaces to "verified shippin" and re-types, their shipping values
  // come back pre-populated from state.
  try { cnGatherComposerSelections_(); } catch (e) { /* prior subform not in DOM */ }
  let html = '';
  if (u === 'verified shipping' || u === 'oop order') html += cnRenderShippingSubform_();
  if (u === 'close order')                            html += cnRenderCloseSubform_();
  if (u === 'repeat resupply')                        html += cnRenderResupplySubform_();
  if (u === 'oop order')                              html += cnRenderOopSubform_();
  host.innerHTML = html;
  host.dataset.shapeKey = key;
}

function cnSubformShapeKey_(u) {
  const keys = [];
  if (u === 'verified shipping' || u === 'oop order') keys.push('shipping');
  if (u === 'close order')                            keys.push('close');
  if (u === 'repeat resupply')                        keys.push('resupply');
  if (u === 'oop order')                              keys.push('oop');
  return keys.join('+');
}

  return '<option value="">— —</option>' + values.map(function (v) {

function cnStateOptionsHtml_(selected) {
  const rates = (CN_STATE.deptConfig && CN_STATE.deptConfig.stateTaxRates) || {};
  return Object.keys(rates).sort().map(function (s) {
    return `<option value="${esc(s)}" ${s === selected ? 'selected' : ''}>${esc(s)}</option>`;
  }).join('');
}

function cnAutoDetectState_(addrText) {
  const cfg = CN_STATE.deptConfig || {};
  const abbrMap = cfg.stateAbbrToName || {};
  const rates = cfg.stateTaxRates || {};
  if (!addrText) return;
  const val = addrText.toUpperCase();
  const words = val.replace(/[^A-Z\s]/g, ' ').split(/\s+/);
  let detected = null;
  for (let i = words.length - 1; i >= 0; i--) {
    if (abbrMap[words[i]]) { detected = abbrMap[words[i]]; break; }
  }
  if (!detected) {
    for (const full of Object.keys(rates)) {
      if (val.indexOf(full.toUpperCase()) >= 0) { detected = full; break; }
    }
  }
  if (detected) {
    const sel = document.getElementById('cnS-state');
    if (sel) { sel.value = detected; cnRecalcOop_(); }
  }
}

function cnRecalcOop_() {
  const baseEl = document.getElementById('cnO-base');
  const shipEl = document.getElementById('cnO-shipping');
  const stateEl = document.getElementById('cnS-state');
  const rxEl = document.getElementById('cnO-rx');
  if (!baseEl) return;
  const base = parseFloat(baseEl.value) || 0;
  const shipStr = (shipEl && shipEl.value) || '';
  let shipping = 0;
  let shippingLabel = 'Custom';
  if (/\$14\.99/.test(shipStr))      { shipping = 14.99; shippingLabel = 'Category 1'; }
  else if (/\$19\.99/.test(shipStr)) { shipping = 19.99; shippingLabel = 'Category 2'; }
  else {
    const n = parseFloat(String(shipStr).replace(/[^0-9.]/g, ''));
    shipping = isNaN(n) ? 0 : n;
    shippingLabel = 'Custom Amount';
  }
  const state = (stateEl && stateEl.value) || '';
  const rxYes = rxEl && rxEl.value === 'Yes';
  const taxOn = flagOn_('oopSalesTax');
  const rates = (CN_STATE.deptConfig && CN_STATE.deptConfig.stateTaxRates) || {};
  const rate = (!taxOn || rxYes) ? 0 : (rates[state] || 0);
  const tax = base * rate;
  const total = base + shipping + tax;
  const taxDispEl = document.getElementById('cnO-tax-disp');
  if (taxDispEl) {
    if (rxYes) taxDispEl.textContent = '$0.00 (Rx exempt)';
    else if (!state) taxDispEl.textContent = 'Pick state in shipping';
    else taxDispEl.textContent = '$' + tax.toFixed(2) + ' (' + (rate * 100).toFixed(2) + '% ' + state + ')';
  }
  const totalEl = document.getElementById('cnO-total-disp');
  if (totalEl) totalEl.textContent = '$' + total.toFixed(2);
}

function cnGatherComposerSelections_() {
  const c = CN_STATE.composer;

  if (document.getElementById('cnC-individual-email')) {
    s.individualEmail = document.getElementById('cnC-individual-email').value;
  }
  const u = String(s.updateInfo || '').toLowerCase().trim();
  if (u === 'verified shipping' || u === 'oop order') {
    s.shippingDetails = {
      verifiedAddr:     document.getElementById('cnS-verified').checked,
      verifiedAddrText: document.getElementById('cnS-addr').value.trim(),
      state:            document.getElementById('cnS-state').value,
      patientLoc:       document.getElementById('cnS-patient-loc').value,
      docsTo:           document.getElementById('cnS-docs-to').value,
      deliveryEmail:    (document.getElementById('cnS-delivery-email') || {}).value || '',
      patResp:          document.getElementById('cnS-pat-resp').value,
      specialNote:      document.getElementById('cnS-note').value.trim(),
    };
  } else { s.shippingDetails = null; }
  if (u === 'close order') {
    s.closeDetails = { reason: document.getElementById('cnCD-reason').value.trim() };
  } else { s.closeDetails = null; }
  if (u === 'repeat resupply') {
    s.resupplyDetails = {
      itemCategory:  document.getElementById('cnRR-cat').value.trim(),
      dob:           document.getElementById('cnRR-dob').value.trim(),
      resupplyMonth: document.getElementById('cnRR-month').value,
      lastDate:      document.getElementById('cnRR-last-date').value,
      sameItems:     document.getElementById('cnRR-same-items').checked,
      addrStatus:    document.getElementById('cnRR-addr-status').value,
      newAddr:       (document.getElementById('cnRR-new-addr') || {}).value || '',
      insStatus:     document.getElementById('cnRR-ins-status').value,
      newIns:        (document.getElementById('cnRR-new-ins') || {}).value || '',
      newMemId:      (document.getElementById('cnRR-new-memid') || {}).value || '',
      provStatus:    document.getElementById('cnRR-prov-status').value,
      newProv:       (document.getElementById('cnRR-new-prov') || {}).value || '',
      newMdoPh:      (document.getElementById('cnRR-new-mdo-ph') || {}).value || '',
      specialNote:   document.getElementById('cnRR-note').value.trim(),
    };
  } else { s.resupplyDetails = null; }
  if (u === 'oop order') {
    cnRecalcOop_();
    const baseEl = document.getElementById('cnO-base');
    const shipEl = document.getElementById('cnO-shipping');
    const rxEl   = document.getElementById('cnO-rx');
    const stateEl = document.getElementById('cnS-state');
    const base = parseFloat(baseEl.value) || 0;
    const shipStr = (shipEl && shipEl.value) || '';
    let shipping = 0; let shippingLabel = 'Custom';
    if (/\$14\.99/.test(shipStr))      { shipping = 14.99; shippingLabel = 'Category 1'; }
    else if (/\$19\.99/.test(shipStr)) { shipping = 19.99; shippingLabel = 'Category 2'; }
    else {
      const n = parseFloat(String(shipStr).replace(/[^0-9.]/g, ''));
      shipping = isNaN(n) ? 0 : n; shippingLabel = 'Custom Amount';
    }
    const rxYes = rxEl && rxEl.value === 'Yes';
    const taxOn = flagOn_('oopSalesTax');
    const rates = (CN_STATE.deptConfig && CN_STATE.deptConfig.stateTaxRates) || {};
    const state = stateEl && stateEl.value;
    const rate = (!taxOn || rxYes) ? 0 : (rates[state] || 0);
    const tax = base * rate;
    s.oopDetails = {
      baseCost:     base.toFixed(2),
      shippingCost: shipping.toFixed(2),
      shippingLabel,
      taxAmt:       !taxOn ? '' : (rxYes ? '0.00 (Rx Exempt)' : tax.toFixed(2)),
      totalCost:    (base + shipping + tax).toFixed(2),
      rxPresent:    rxYes ? 'Yes' : 'No',
    };
  } else { s.oopDetails = null; }
}

function cnComposerGoToPreview_() {
  const c = CN_STATE.composer; if (!c) return;
  if (c.previewing) return;   // cycle 10 — drop a double-click while the RPC is in flight
  cnGatherComposerSelections_();
  if (c.selections.departments.length === 0) {
    showToast('Pick at least one recipient first', 'toast-warn'); return;
  }
  if (!c.selections.updateInfo) {
    showToast('Pick or type an Update type first', 'toast-warn'); return;
  }
  c.previewing = true;
  google.script.run
    .withSuccessHandler(function (res) {
      c.previewing = false;
      // Cycle 10 — instance guard (the M-4/M-9 discipline, applied to the one
      // composer RPC that lacked it): cnRenderComposerModal_ renders from
      // CN_STATE.composer, so a stale preview response arriving after this
      // composer was closed (Esc, Save&Compose rollback) and a NEW composer
      // opened would force-rerender the new composer's form step — wiping
      // typed-but-ungathered inputs (and re-creating the overlay if none).
      if (CN_STATE.composer !== c) return;
      if (res.error) { showToast(res.error, 'toast-error'); return; }
      c.preview = res;
      c.step = 'preview';
      cnRenderComposerModal_();
    })
    .withFailureHandler(function (err) {
      c.previewing = false;
      if (CN_STATE.composer !== c) return;
      showToast('Preview failed: ' + err.message, 'toast-error');
    })
    .previewCallNoteEmail(c.noteId, c.selections);
}

      <div class="cn-compose-preview">${p.htmlBody}</div>

function cnComposerBackToForm_() {
  const c = CN_STATE.composer; if (!c) return;
  c.step = 'form';

}

function cnComposerSend_() {
  const c = CN_STATE.composer; if (!c) return;
  if (c.sending) return;   // F(M-9): double-fire guard while the RPC is in flight
  // F(M-9): mark the composer in-flight — cnCloseComposerModal_ REFUSES to
  // close while sending. Previously only the button was disabled: an Esc /
  // backdrop-click during the ~1s send fired the composeFlow rollback, which
  // DELETED the just-saved note while the server was completing the send —
  // the email went out referencing a note that no longer existed, and the
  // EmailedAt stamp-back silently missed.
  c.sending = true;
  const btn = document.getElementById('cnC-send-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  // Pass the previewed bodyHash so the server can refuse to send if the note
  // body changed since Preview (rep edited the note in a different tab).
  // Without this, the email body could differ from what the rep just confirmed.
  const expectedHash = c.preview && c.preview.bodyHash;
  google.script.run
    .withSuccessHandler(function (res) {
      c.sending = false;   // F(M-9): settled — closing is allowed again
      if (!res.success) {
        if (btn) { btn.disabled = false; btn.innerHTML = icon('mail', 14) + ' Send Email'; }
        showToast(res.error || 'Send failed', 'toast-error'); return;
      }
      // Stamp emailedAt on the cached note — update across ALL state arrays
      // (rolling / history / pinned), since the composer is reachable from
      // History and pinned-tray cards too, not just today's stack. Mutating
      // only rollingNotes left the "sent" pill missing on history/pinned cards
      // until reload (INV-62).
      const sentNote = cnFindNoteAnywhere_(c.noteId);
      if (sentNote) {
        sentNote.emailedAt = res.emailedAt;
        sentNote.emailDepartments = c.selections.departments.join(', ');
        // Mirror the server's MERGE (not replace) so the cached note keeps its
        // tags / pin / feedback / etc. — overwriting subformData here would drop
        // them from the in-memory card until a reload.
        sentNote.subformData = Object.assign({}, sentNote.subformData || {}, c.selections);
        cnReplaceNoteInState_(sentNote);
      }
      // Save & Compose transaction completes on SEND: clear the form now
      // (it was kept populated while composing — r3), then close.
      if (CN_STATE.composeFlow && CN_STATE.composeFlow.note &&
          CN_STATE.composeFlow.note.noteId === c.noteId) {
        CN_STATE.composeFlow = null;
        if (document.getElementById('cn-active-form')) {
          cnClearActiveForm_({ skipSnapshot: true });
          cnFormTimerReset_();
          cnClearStickyFormDraft_();
        }
      }
      cnCloseComposerModal_();
      cnReRenderActiveView_();
      cnRenderFilterBar_();
      showToast('Email sent', 'toast-success');
      // Win-back nudge: a Close-Order email sent because the customer is
      // switching suppliers → offer to send a (PHI-free) win-back survey.
      // Self-gated inside cnMaybeWinbackNudge_ (no configured win-back template
      // → no nudge); guarded so it can never break the send result.
      try {
        var cd2 = c.selections && c.selections.closeDetails;
        if (cd2 && cnIsSwitchingSuppliersReason_(cd2.reason)) {
          cnMaybeWinbackNudge_(c.noteId, (sentNote && sentNote.caller) || '');
        }
      } catch (_) {}
    })
    .withFailureHandler(function (err) {
      c.sending = false;   // F(M-9): settled — closing is allowed again
      if (btn) { btn.disabled = false; btn.innerHTML = icon('mail', 14) + ' Send Email'; }
      showToast('Send failed: ' + err.message, 'toast-error');
    })
    .emailFromCallNote(c.noteId, c.selections, expectedHash);
}

// ── Win-back nudge (close reason = changing suppliers) ────────────────────
// The Close-Order "reason" is a free-text field, so the trigger is a loose
// substring match — a false positive is just a dismissible prompt. The whole
// feature self-gates on a manager-configured "win-back" email template existing,
// so it stays silent until set up. Keeps PHI out: it only opens the (non-PHI)
// external customer composer pre-filled with the win-back template body.
function cnIsSwitchingSuppliersReason_(reason) {
  var r = String(reason || '').toLowerCase();
  if (!r) return false;
  if (/chang(ing|ed)?\s+suppliers?/.test(r)) return true;
  if (/elsewhere|competitor/.test(r)) return true; // strong standalone signals
  var alt = /suppl|provider|compan/.test(r);
  var move = /switch|chang|moving|moved|going with|go with|leav|different|another/.test(r);
  return alt && move;
}

// The first email template whose NAME marks it as the win-back one (e.g.
// "Win-Back Survey"). Returns null when none is configured — the nudge's gate.
function cnFindWinbackTemplate_() {
  var all = (typeof cnExtTemplatesAll_ === 'function') ? cnExtTemplatesAll_() : [];
  for (var i = 0; i < all.length; i++) {
    if (/win[\s\-]?back/i.test(String((all[i] || {}).name || ''))) return all[i];
  }
  return null;
}

function cnMaybeWinbackNudge_(noteId, callerName) {
  var tmpl = cnFindWinbackTemplate_();
  if (!tmpl) return; // self-gated: no win-back template configured → no nudge
  uiConfirm({
    title: 'Send a win-back survey?',
    message: 'This order closed because the customer is switching suppliers. Open a quick win-back survey email to them? (Service feedback only — no medical details.)',
    confirmLabel: 'Open win-back email',
    cancelLabel: 'Not now',
  }).then(function (ok) {
    if (!ok) return;
    cnOpenExternalEmailModal_(noteId, function () {
      var c = CN_STATE.extComposer;
      if (!c) return;
      c.recipientType = 'customer';
      var body = String(tmpl.body || '').replace(/\{name\}/g, String(callerName || '').trim() || 'there');
      c.message = body;
      if (callerName) c.recipientName = String(callerName).trim();
      var msgEl = document.getElementById('cnX-message'); if (msgEl) msgEl.value = body;
      var nameEl = document.getElementById('cnX-name'); if (nameEl && callerName) nameEl.value = String(callerName).trim();
      var subjEl = document.getElementById('cnX-subject');
      // Cycle-9 L-27: the modal always renders a NON-empty auto-generated
      // subject ("UMS — Documents for …"), so the old empty-only check could
      // never fire and every win-back went out under the generic documents
      // subject. Replace when the current value is empty OR still the
      // auto-pattern (the cnExtAutoUpdateSubject_ rule) — a manager-typed
      // custom subject is left alone.
      if (subjEl && (!subjEl.value.trim() || /^UMS\s*—\s*(Documents for|Form Request for)\s/i.test(subjEl.value.trim()))) {
        subjEl.value = 'Before you go — we’d value your feedback';
        c.subject = subjEl.value;
      }
    });
  });
}

function cnWireHistoryRange_() {
  var startInput = document.getElementById('cn-history-start');
  var endInput = document.getElementById('cn-history-end');
  if (startInput) startInput.addEventListener('change', function () {
    CN_STATE.historyDate = startInput.value;

    }
    cnHistoryRangeChanged_();
  });
  if (endInput) endInput.addEventListener('change', function () {

      CN_STATE.historyDate = range.start;
      CN_STATE.historyEndDate = range.end;

    });

}

function cnHistoryPresetRange_(preset) {
  var tz = (empState && empState.timezone) || 'UTC';
  var today = new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());
  var toDate = function (iso) { return new Date(iso + 'T12:00:00Z'); };
  var fmt = function (d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()); };
  var todayD = toDate(today);
  switch (preset) {
    case 'yesterday': {
      var y = toDate(today); y.setUTCDate(y.getUTCDate() - 1);
      return { start: fmt(y), end: fmt(y) };
    }
    case 'last7': {
      var d7 = toDate(today); d7.setUTCDate(d7.getUTCDate() - 6);
      return { start: fmt(d7), end: today };
    }
    case 'last30': {
      var d30 = toDate(today); d30.setUTCDate(d30.getUTCDate() - 29);
      return { start: fmt(d30), end: today };
    }
    case 'thisWeek': {
      var dow = todayD.getUTCDay();
      var mon = toDate(today); mon.setUTCDate(mon.getUTCDate() - ((dow + 6) % 7));
      return { start: fmt(mon), end: today };
    }
    case 'lastWeek': {
      var dow2 = todayD.getUTCDay();
      var thisMon = toDate(today); thisMon.setUTCDate(thisMon.getUTCDate() - ((dow2 + 6) % 7));
      var prevMon = new Date(thisMon); prevMon.setUTCDate(prevMon.getUTCDate() - 7);
      var prevSun = new Date(prevMon); prevSun.setUTCDate(prevSun.getUTCDate() + 6);
      return { start: fmt(prevMon), end: fmt(prevSun) };
    }
    default: return null;
  }
}

function cnHistoryRangeChanged_() {
  var s = CN_STATE.historyDate;
  var e = CN_STATE.historyEndDate || s;
  if (!s) return;
  var stack = document.getElementById('cn-history-stack');
  if (stack) stack.innerHTML = loSkeleton(4);
  cnLoadDateRange_(s, e, cnRenderHistoryStack_);
}

function cnRenderHistoryStack_() {
  const stack = document.getElementById('cn-history-stack');
  if (!stack) return;
  const summary = document.getElementById('cn-history-summary');
  const allNotes = CN_STATE.historyNotes || [];
  // F(cycle-8 M-10): History now honors CN_STATE.filter — the Log quick-chips
  // ("Jump to history: Unresolved · 4") set it and navigated here, but nothing
  // consumed it (the chips were a silent no-op; the rep hunted manually). The
  // active filter renders as a clearable pill so it's never invisible state.
  const flt = CN_STATE.filter || 'all';
  const notes = (flt === 'all') ? allNotes
    : allNotes.filter(function (n) { return cnNoteMatchesFilter_(n, flt); });
  const fltPill = (flt === 'all') ? ''
    : '<span class="cn-hist-filterpill">Filtered: ' + esc(flt) +
      ' · <a href="#" onclick="CN_STATE.filter=\'all\';cnRenderHistoryStack_();return false;">clear</a></span>';
  const isRange = CN_STATE.historyEndDate && CN_STATE.historyEndDate !== CN_STATE.historyDate;

  // M-4 (cycle 10): same typed-edit preservation as cnRenderStack_ — History
  // is the "view & edit prior notes" surface, but an optimistic toggle / QA
  // ack / delete on ANOTHER card re-rendered this stack from stored values,
  // silently discarding everything typed in an open inline editor (the exact
  // cycle-8 stack fix, never applied here).
  const editSnap = cnEditSnapshot_();

  if (notes.length === 0) {
    if (summary) summary.innerHTML = fltPill;
    stack.innerHTML = '<div class="cn-stack-empty">No ' + (flt === 'all' ? '' : esc(flt) + '-filtered ') +
      'notes for ' + (isRange ? 'this range' : 'this date') + '.</div>';
    return;
  }

  if (isRange) {
    var startLabel = cnFormatDateLabel_(CN_STATE.historyDate);
    var endLabel = cnFormatDateLabel_(CN_STATE.historyEndDate);
    if (summary) summary.innerHTML = '<div class="cn-history-summary">' +
      esc(startLabel) + ' – ' + esc(endLabel) + ' · ' + notes.length + ' note' + (notes.length !== 1 ? 's' : '') +
      fltPill + '</div>';

    // Group by dateLocal, newest dates first — each group is collapsible with
    // a metadata header (note count + per-flag-type counts).
    var groups = [];
    var groupMap = {};
    notes.forEach(function (n) {
      var d = n.dateLocal || 'Unknown';
      if (!groupMap[d]) { groupMap[d] = []; groups.push(d); }
      groupMap[d].push(n);
    });
    groups.sort(function (a, b) { return b.localeCompare(a); });
    var html = '';
    groups.forEach(function (d) {
      var gnotes = groupMap[d];
      html += '<div class="cn-hist-group" data-hgdate="' + esc(d) + '">' +
        '<button class="cn-hist-grouphead" onclick="cnToggleHistGroup_(this)" aria-expanded="true">' +
          '<span class="cn-hg-caret">' + icon('chevronDown', 14) + '</span>' +
          '<span class="cn-hg-date">' + esc(cnFormatDateLabel_(d)) + '</span>' +
          '<span class="cn-hg-count">' + gnotes.length + ' note' + (gnotes.length !== 1 ? 's' : '') + '</span>' +
          cnHistGroupChips_(gnotes) +
        '</button>' +
        '<div class="cn-hist-groupbody">' + gnotes.map(cnRenderCard_).join('') + '</div>' +
      '</div>';
    });
    stack.innerHTML = html;
  } else {
    if (summary) summary.innerHTML = fltPill;
    stack.innerHTML = notes.map(cnRenderCard_).join('');
  }
  cnEditRestore_(editSnap);   // M-4 — typed edit values survive the re-render
}

/** Per-flag-type count chips for a History date group. action/training/review
 *  come from flagType; urgent from subformData.flags via cnIsUrgent_. */
function cnHistGroupChips_(notes) {
  var c = { action: 0, training: 0, review: 0, urgent: 0 };
  notes.forEach(function (n) {
    if (n.flagType && c[n.flagType] != null) c[n.flagType]++;
    if (cnIsUrgent_(n)) c.urgent++;
  });
  var defs = [
    ['urgent', 'urgent', icon('flag', 11)],
    ['action', 'action', icon('flag', 11)],
    ['training', 'training', icon('bulb', 11)],
    ['review', 'review', icon('thumbsUp', 11)],
  ];
  var out = '';
  defs.forEach(function (d) {
    if (!c[d[0]]) return;
    out += '<span class="cn-hg-flag cn-hg-' + d[0] + '" title="' + c[d[0]] + ' ' + d[1] + '">' + d[2] + c[d[0]] + '</span>';
  });
  return out ? '<span class="cn-hg-flags">' + out + '</span>' : '';
}

/** Toggle a History date group open/closed. */
function cnToggleHistGroup_(btn) {
  var group = btn.closest('.cn-hist-group');
  if (!group) return;
  var collapsed = group.classList.toggle('collapsed');
  btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
}

function cnFormatDateLabel_(isoDate) {
  if (!isoDate) return '';
  try {
    var parts = isoDate.split('-');
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    return DOW_NAMES[d.getDay()] + ', ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getDate();
  } catch (e) { return isoDate; }
}
