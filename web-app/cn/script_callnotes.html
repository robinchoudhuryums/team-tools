        live.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:20px">Storage health unavailable: ' + esc((res && res.error) || 'load failed') + '</div>';
        cnSetSysCard_('storage', 'Storage', 'warn', 'Unavailable', 'health check failed');
        return;
      }
      live.innerHTML = cnRenderStoragePanel_(res);
      var stores = res.stores || [];
      var unreachable = stores.filter(function (s) { return s.configured && s.reachable === false; }).length;
      var tzDrift = stores.filter(function (s) { return s.tzMatch === false; }).length;
      var brokenEmbeds = (res.kbEmbeds && res.kbEmbeds.broken && res.kbEmbeds.broken.length) || 0;  // #3
      var tone = unreachable > 0 ? 'crit' : (tzDrift > 0 || brokenEmbeds > 0 ? 'warn' : 'ok');
      var val = unreachable > 0 ? (unreachable + ' unreachable')
        : (tzDrift > 0 ? (tzDrift + ' tz mismatch')
          : (brokenEmbeds > 0 ? (brokenEmbeds + ' broken embed' + (brokenEmbeds === 1 ? '' : 's')) : 'All OK'));
      var sub = unreachable > 0 ? 'check sharing / access'
        : (tzDrift > 0 ? 'review config →'
          : (brokenEmbeds > 0 ? 'fix Drive links →' : 'reachable · tz matches'));
      cnSetSysCard_('storage', 'Storage', tone, val, sub);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      var live = document.getElementById('cn-admin-storage');
      if (live) live.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:20px">Storage health unavailable: ' + esc((err && err.message) || 'load failed') + '</div>';
      cnSetSysCard_('storage', 'Storage', 'warn', 'Unavailable', 'health check failed');
    })
    .getStorageHealth();
}

function cnRenderStoragePanel_(res) {
  var stores = (res && res.stores) || [];
  if (!stores.length) return '';
  var cfgTz = (res && res.configTimezone) || '';
  var pill = function (txt, tone) {
    var color = tone === 'ok' ? 'var(--success-deep)' : tone === 'warn' ? 'var(--warning-deep,var(--warn))' : tone === 'crit' ? 'var(--danger-deep)' : 'var(--muted)';
    var bg = tone === 'ok' ? 'var(--accent-soft)' : tone === 'warn' ? 'var(--warn-soft)' : tone === 'crit' ? 'var(--destructive-soft)' : 'var(--paper-2)';
    return '<span style="font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;color:' + color + ';background:' + bg + '">' + esc(txt) + '</span>';
  };
  var rows = stores.map(function (s) {
    // Status pill
    var statusPill;
    if (!s.configured) statusPill = pill('not set', s.cls === 'External' || /Employee Docs/.test(s.label) ? 'muted' : 'warn');
    else if (s.reachable === false) statusPill = pill('unreachable', 'crit');
    else statusPill = pill('ok', 'ok');
    // tz pill
    var tzPill;
    if (s.tzMatch === true) tzPill = pill(esc(s.tz || 'tz ✓'), 'ok');
    else if (s.tzMatch === false) tzPill = pill('tz ' + esc(s.tz || '?') + ' ≠ CONFIG', 'crit');
    else tzPill = pill('—', 'muted');
    // Cycle 7 (M-14 class) — locale drift pill: a locale that differs from the
    // ADP sheet's changes WHICH string shapes Sheets coerces to Dates on read
    // (the formTokenCellMs_ bug class). Warn-level.
    var localePill = (s.localeMatch === false)
      ? ' ' + pill('locale ' + esc(s.locale || '?') + ' ≠ ADP', 'warn') : '';
    var openLink = s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" style="font-size:11px">Open ↗</a>' : '';
    var perRep = '';
    if (s.perRep && s.perRep.problems && s.perRep.problems.length) {
      // Each drifted/unreachable rep Sheet links straight to its source (the
      // ones we could open carry a url; unreachable ones don't).
      perRep = '<div style="font-size:11px;color:var(--danger-deep);margin-top:3px">' +
        s.perRep.problems.map(function (p) {
          var t = esc(p.name) + ' (' + esc(p.issue) + ')';
          return p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">' + t + '</a>' : t;
        }).join(', ') + '</div>';
    }
    // tz drift is the most common, most actionable issue — and its fix is a
    // spreadsheet-level setting (not a cell), so surface the exact steps + link.
    var fixHtml = '';
    if (s.tzMatch === false && cfgTz) {
      fixHtml = '<div style="font-size:11px;color:var(--warning-deep);margin-top:3px">' +
        'Fix: set this sheet’s time zone to <strong>' + esc(cfgTz) + '</strong> (File → Settings → Time zone)' +
        (s.url ? ' · <a href="' + esc(s.url) + '" target="_blank" rel="noopener">open ↗</a>' : '') + '</div>';
    }
    var noteHtml = s.note ? '<div style="font-size:11px;color:var(--muted);margin-top:3px">' + esc(s.note) + '</div>' : '';
    return '<div class="cn-storage-row">' +
      '<div class="cn-storage-main">' +
        '<div class="cn-storage-label">' + esc(s.label) + ' ' + pill(esc(s.cls), 'muted') + '</div>' +
        '<div class="cn-storage-role">' + esc(s.role) + (s.name ? ' · ' + esc(s.name) : '') + '</div>' +
        noteHtml + perRep + fixHtml +
      '</div>' +
      '<div class="cn-storage-meta">' +
        '<div>' + statusPill + ' ' + tzPill + localePill + '</div>' +
        '<div style="font-family:var(--mono);font-size:10px;color:var(--muted-2);margin-top:3px">' + esc(s.prop) + ' · ' + esc(s.source) + ' · ' + esc(s.retention) + '</div>' +
        (openLink ? '<div style="margin-top:3px">' + openLink + '</div>' : '') +
      '</div>' +
    '</div>';
  }).join('');
  var anyTzDrift = stores.some(function (s) { return s.tzMatch === false; });
  var hdr = anyTzDrift
    ? '<div style="font-size:12px;color:var(--danger-deep);margin-bottom:10px">' + icon('warning', 12) + ' A store’s timezone differs from CONFIG.TIMEZONE (' + esc(res.configTimezone || '') + ') — coerced date/time reads will drift. Set the sheet’s File → Settings → Time zone to match.</div>'
    : '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">All reachable stores match CONFIG.TIMEZONE (' + esc(res.configTimezone || '') + ').</div>';
  return '<div style="background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px;max-width:900px">' +
    '<div class="day-section-label" style="margin-bottom:10px">' + icon('settings', 14) + ' Storage Health</div>' +
    hdr + rows + cnRenderKbEmbedsHealth_(res && res.kbEmbeds) +
  '</div>';
}

// #3 — broken-embed / lost-access section: KB embeds whose Drive file is
// deleted/moved or the deployer lost access (a dead /preview iframe that errors
// nowhere). Renders only when there ARE embeds; a danger list when any are
// broken, else a quiet all-clear line. PHI-free (KB is PHI-free by policy).
function cnRenderKbEmbedsHealth_(ke) {
  if (!ke || !ke.total) return '';
  var top = '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">';
  var checked = (ke.probed != null && ke.probed < ke.total)
    ? ('checked ' + ke.probed + ' of ' + ke.total)
    : (ke.total + ' embed' + (ke.total === 1 ? '' : 's'));
  if (ke.broken && ke.broken.length) {
    return top +
      '<div style="font-size:12px;color:var(--danger-deep);margin-bottom:8px">' + icon('warning', 12) + ' ' +
        ke.broken.length + ' Reference embed' + (ke.broken.length === 1 ? '' : 's') +
        ' point to a Drive file that’s deleted/moved or the deployer lost access — the preview silently fails. ' +
        'Re-share the file, fix the link, or convert to a native article.</div>' +
      ke.broken.map(function (b) {
        return '<div style="font-size:11px;margin-bottom:4px">' +
          '<strong>' + esc(b.title) + '</strong>' + (b.department ? ' · ' + esc(b.department) : '') +
          ' · ' + esc(b.driveKind) +
          (b.openUrl ? ' · <a href="' + esc(b.openUrl) + '" target="_blank" rel="noopener">open ↗</a>' : '') +
          '<span style="color:var(--muted)"> — ' + esc(b.reason) + '</span>' +
        '</div>';
      }).join('') +
      (ke.truncated ? '<div style="font-size:11px;color:var(--muted);margin-top:4px">Scan capped — some embeds were not checked.</div>' : '') +
    '</div>';
  }
  return top +
    '<div style="font-size:11px;color:var(--muted)">' + icon('check', 12) + ' Reference embeds · ' + esc(checked) + ' — all Drive files reachable' +
    (ke.truncated ? ' (scan capped)' : '') + '</div>' +
  '</div>';
}

function cnLoadHealthPanel_() {
  var slot = document.getElementById('cn-admin-health');
  if (!slot) return;
  slot.innerHTML = '<div style="padding:10px 0">' + loSweep() + '</div>';
  var requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView) return;
      var live = document.getElementById('cn-admin-health');
      if (!live) return;
      if (!res || res.error) {
        live.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:20px">Automation health unavailable: ' + esc((res && res.error) || 'load failed') + '</div>';
        cnSetSysCard_('automation', 'Automation', 'warn', 'Unavailable', 'health check failed');
        cnSetSysCard_('cdr', 'CDR', 'warn', 'Unavailable', 'health check failed');
        return;
      }
      live.innerHTML = cnRenderHealthPanel_(res);
      cnSetSysFromHealth_(res);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      var live = document.getElementById('cn-admin-health');
      if (live) live.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:20px">Automation health unavailable: ' + esc((err && err.message) || 'load failed') + '</div>';
      cnSetSysCard_('automation', 'Automation', 'warn', 'Unavailable', 'health check failed');
      cnSetSysCard_('cdr', 'CDR', 'warn', 'Unavailable', 'health check failed');
    })
    .getAutomationHealth();
}

/** Derive the Automation + CDR Overview status cards (#4) from a successful
 *  getAutomationHealth payload. */
function cnSetSysFromHealth_(res) {
  var sfCount = (res.syncFails && res.syncFails.count) || 0;
  var staleDigests = (res.digests || []).filter(function (d) { return d.stale; }).length;
  var autoTone = (sfCount > 0 || staleDigests > 0) ? 'warn' : 'ok';
  var autoVal = sfCount > 0 ? (sfCount + ' sync fail' + (sfCount === 1 ? '' : 's'))
    : (staleDigests > 0 ? (staleDigests + ' digest' + (staleDigests === 1 ? '' : 's') + ' stale') : 'OK');
  var autoSub = sfCount > 0 ? 'personal-sheet drift'
    : (staleDigests > 0 ? 'a trigger may be dead' : 'no failures · digests fresh');
  cnSetSysCard_('automation', 'Automation', autoTone, autoVal, autoSub);

  var cdr = res.cdr || { ok: false };
  var unmatched = (cdr.unmatchedAgents && cdr.unmatchedAgents.length) || 0;
  var cdrTone = !cdr.ok ? 'warn' : (cdr.columnWarning || unmatched > 0) ? 'warn' : 'ok';
  var cdrVal = !cdr.ok ? 'Unreachable'
    : (cdr.columnWarning ? 'Column drift' : (unmatched > 0 ? (unmatched + ' unmatched') : 'In sync'));
  var cdrSub = !cdr.ok ? 'check CDR_SS_ID / access'
    : (cdr.columnWarning ? 'DQE layout changed' : (unmatched > 0 ? 'agent name mismatch' : '0 unmatched agents'));
  cnSetSysCard_('cdr', 'CDR', cdrTone, cdrVal, cdrSub);
}

function cnRenderHealthPanel_(res) {
  var tz = res.managerTzAbbr || '';
  var okLine = function (txt) {
    return '<div style="font-size:12px;color:var(--success-deep);display:flex;align-items:center;gap:6px">' + icon('checkCircle', 12) + ' ' + txt + '</div>';
  };
  var warnBox = function (html) {
    return '<div style="font-size:12px;color:var(--warning-deep);background:var(--warn-soft);border-radius:6px;padding:6px 10px">' + html + '</div>';
  };
  var secLabel = function (txt) {
    return '<div style="font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin:14px 0 6px">' + txt + '</div>';
  };

  // (a) Personal-sheet sync failures
  var sf = res.syncFails || { count: 0, recent: [], windowDays: 30 };
  var sfHtml;
  if (sf.count > 0) {
    var sfRows = (sf.recent || []).map(function (r) {
      return '<div style="font-size:11px;padding:2px 0">' +
        '<span class="tabular" style="font-family:var(--mono);color:var(--warning-deep)">' + esc(r.timestampMgr) + (tz ? ' ' + esc(tz) : '') + '</span>' +
        ' · <strong>' + esc(r.empName) + '</strong> · ' + esc(r.notes) + '</div>';
    }).join('');
    sfHtml = warnBox(icon('warning', 11) + ' <strong>' + sf.count + '</strong> personal-sheet sync failure(s) in the last ' +
      sf.windowDays + ' days — those reps’ personal Sheets are drifting from the ADP source of truth.' + sfRows);
  } else {
    sfHtml = okLine('No personal-sheet sync failures in the last ' + (sf.windowDays || 30) + ' days.');
  }

  // (C4, cycle 10) Lost tamper-witness audit rows — writeWitnessAuditLog_
  // retried and still couldn't append a FormSubmissionReceived / EmpDocSigned /
  // EmpDocCompleted witness (INV-113/122): the attested record exists in its
  // own store but has no independent audit witness. A legacy payload without
  // the field renders the quiet all-clear.
  var wfr = res.witnessFails || { count: 0 };
  if (wfr.count > 0) {
    sfHtml += warnBox(icon('warning', 11) + ' <strong>' + wfr.count + '</strong> lost tamper-witness audit row(s)' +
      (wfr.lastAction ? ' (last: ' + esc(wfr.lastAction) + ')' : '') +
      ' — a signed/submitted record has no independent audit witness. See INV-113/122.');
  }

  // (#1, INV-150) Client error beacon — exception metadata posted by the
  // shell's window.onerror / unhandledrejection hook (PHI-safe: message /
  // stack / view only, never field values). Zero = quiet all-clear; a legacy
  // server payload without the field renders the same all-clear.
  var ce = res.clientErrors || { count: 0, recent: [], windowDays: 7 };
  var ceHtml;
  if (ce.count > 0) {
    var ceRows = (ce.recent || []).map(function (r) {
      return '<div style="font-size:11px;padding:2px 0">' +
        '<span class="tabular" style="font-family:var(--mono);color:var(--warning-deep)">' + esc(r.timestampMgr) + (tz ? ' ' + esc(tz) : '') + '</span>' +
        ' · <strong>' + esc(r.empId) + '</strong> · ' + esc(r.view || '?') + ' · ' + esc(r.message) + '</div>';
    }).join('');
    ceHtml = warnBox(icon('warning', 11) + ' <strong>' + ce.count + '</strong> client-side error(s) reported in the last ' +
      (ce.windowDays || 7) + ' days — reps are hitting JS failures the server never sees.' + ceRows +
      (ce.url ? '<div style="margin-top:4px"><a href="' + esc(ce.url) + '" target="_blank" rel="noopener" style="font-size:11px;color:inherit">Open ClientErrors ↗</a></div>' : ''));
  } else {
    ceHtml = okLine('No client-side errors reported in the last ' + (ce.windowDays || 7) + ' days.');
  }

  // (b) CDR data feed
  var cdr = res.cdr || { ok: false };
  var cdrParts = [];
  if (!cdr.ok) {
    cdrParts.push(warnBox(icon('warning', 11) + ' CDR data unreachable: ' + esc(cdr.error || 'unknown error') +
      ' — Metrics and the shift-stats overlay are degraded. Check the CDR_SS_ID Script Property and the deployer’s access.'));
  } else {
    cdrParts.push(cdr.columnWarning
      ? warnBox(icon('warning', 11) + ' Column drift in DQE Historical Data: ' + esc(cdr.columnWarning))
      : okLine('CDR reachable · column layout OK · ' + esc(cdr.rowsMatched || 0) + ' row(s) ' + esc(cdr.from || '') + ' → ' + esc(cdr.to || '') + '.'));
    if (cdr.unmatchedAgents && cdr.unmatchedAgents.length > 0) {
      cdrParts.push(warnBox(icon('warning', 11) + ' ' + cdr.unmatchedAgents.length +
        ' CDR agent(s) not matched to the roster (add an Agent Alias Override or fix the Employees name): ' +
        esc(cdr.unmatchedAgents.join(', '))));
    }
    if (cdr.rosterWithNoCdr && cdr.rosterWithNoCdr.length > 0) {
      cdrParts.push('<div style="font-size:12px;color:var(--muted)">' + icon('info', 11) + ' ' + cdr.rosterWithNoCdr.length +
        ' roster name(s) with no CDR rows this week: ' + esc(cdr.rosterWithNoCdr.join(', ')) + '</div>');
    }
  }
  var cdrHtml = cdrParts.join('<div style="height:6px"></div>');

  // (d) Digest heartbeats — Script-Property stamps (the digests write no
  // audit rows by design; the EOD digest runs hourly and would crowd the
  // bounded AuditLog tail scans). `stale` = the trigger hasn't run within its
  // expected cadence; `last: null` = no heartbeat recorded yet (pre-heartbeat
  // deploy, or the trigger isn't installed).
  var DIGEST_LABELS = {
    eod:    { label: 'EOD unresolved-flag digest', expect: 'hourly trigger — stale past 2h' },
    urgent: { label: 'Urgent-flag digest',         expect: 'daily 8am — stale past 26h' },
    weekly: { label: 'Weekly training/review digests', expect: 'Friday 8am — stale past 8d' },
    trainingOverdue: { label: 'Training-overdue digest', expect: 'daily 7am — stale past 26h' },
    deptReqReminder: { label: 'Dept-request SLA reminder', expect: 'daily 10am — stale past 26h' },
    managerBrief: { label: 'Manager daily brief', expect: 'daily 8am — heartbeats even while the managerDailyBrief toggle is off' },
  };
  var digestsHtml = (res.digests || []).map(function (d) {
    var meta = DIGEST_LABELS[d.key] || { label: d.key, expect: '' };
    var when;
    if (!d.last) {
      when = '<span style="color:var(--muted)">no heartbeat recorded yet — check the trigger is installed</span>';
    } else if (d.stale) {
      when = '<span style="color:var(--warning-deep);font-weight:600">' + icon('warning', 11) + ' last ran ' +
        esc(d.last) + (tz ? ' ' + esc(tz) : '') + ' — past its expected cadence; the trigger may be dead</span>';
    } else {
      when = '<span class="tabular" style="font-family:var(--mono)">' + esc(d.last) + (tz ? ' ' + esc(tz) : '') + '</span>';
    }
    return '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12px">' +
      '<span style="flex:0 0 200px;font-weight:600">' + esc(meta.label) + '</span>' +
      '<span style="flex:1;min-width:200px">' + when + '</span>' +
      '<span style="color:var(--muted);font-size:11px">' + esc(meta.expect) + '</span>' +
    '</div>';
  }).join('');

  // (e) Turn C — detector liveness ("can the detector detect?"). Each entry is
  // a writer↔parser round-trip (or diagnostic-channel presence) computed
  // server-side; a failure means a monitoring loop is silently dead even
  // though its trigger runs (the H-1/M-11 class).
  var detHtml = (res.detectors || []).map(function (c) {
    var state = c.ok
      ? '<span style="color:var(--success-deep);font-weight:600">' + icon('checkCircle', 11) + ' ok</span>'
      : '<span style="color:var(--danger-deep);font-weight:600">' + icon('warning', 11) + ' DEAD — ' + esc(c.detail || '') + '</span>';
    return '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12px">' +
      '<span style="flex:0 0 200px;font-weight:600">' + esc(c.label) + '</span>' +
      '<span style="flex:1;min-width:200px">' + state + '</span>' +
    '</div>';
  }).join('');

  // (c) Automation last-seen
  var runsHtml = (res.automationLastRuns || []).map(function (r) {
    var meta = CN_HEALTH_RUN_LABELS[r.action] || { label: r.action, expect: '' };
    var when = r.last
      ? '<span class="tabular" style="font-family:var(--mono)">' + esc(r.last.timestampMgr) + (tz ? ' ' + esc(tz) : '') + '</span>' +
        (r.last.notes ? ' <span style="color:var(--muted)">· ' + esc(r.last.notes) + '</span>' : '')
      : '<span style="color:var(--muted)">no audit row in the scan window</span>';
    return '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12px">' +
      '<span style="flex:0 0 200px;font-weight:600">' + esc(meta.label) + '</span>' +
      '<span style="flex:1;min-width:200px">' + when + '</span>' +
      '<span style="color:var(--muted);font-size:11px">' + esc(meta.expect) + '</span>' +
    '</div>';
  }).join('');

  return '<div style="background:var(--paper-card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px;max-width:900px">' +
    '<div class="day-section-label" style="margin-bottom:10px">' + icon('refresh', 14) + ' Automation Health' +
      (res.auditLogUrl ? '<a href="' + esc(res.auditLogUrl) + '" target="_blank" rel="noopener" style="float:right;font-size:11px;font-weight:400">Open AuditLog ↗</a>' : '') +
    '</div>' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Silent-failure signals in one place: personal-sheet sync, the CDR data feed, and when each automation job last left an audit trail. The source rows live in the AuditLog tab (link above).</div>' +
    secLabel('Personal-sheet sync') + sfHtml +
    secLabel('Client errors · last 7 days') + ceHtml +
    secLabel('CDR data feed · last 7 days') + cdrHtml +
    secLabel('Automation last seen') + runsHtml +
    secLabel('Digest heartbeats') + (digestsHtml || '<div style="font-size:12px;color:var(--muted)">No digest data (server pre-dates heartbeats).</div>') +
    (detHtml ? secLabel('Detector liveness') + detHtml : '') +
  '</div>';
}

/** One row per feature toggle: checkbox + label + scope chip + description +
 *  (optional) caution line. Every server string is esc()'d. */
function cnRenderFlagRows_(registry, values) {
  if (!Array.isArray(registry) || !registry.length) {
    return '<div style="color:var(--muted);font-size:12px">No toggles defined.</div>';
  }
  var vals = values || {};
  return registry.map(function (f) {
    var on = vals[f.key] === true;
    var danger = f.danger
      ? '<div style="color:var(--danger-deep);font-size:11px;margin-top:4px;line-height:1.4">Caution — ' + esc(f.danger) + '</div>'
      : '';
    return '<label style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer">' +
      '<input type="checkbox" class="cn-admin-flag" data-flag-key="' + esc(f.key) + '"' + (on ? ' checked' : '') + ' style="margin-top:3px">' +
      '<div style="flex:1">' +
        '<div style="font-weight:600;font-size:13px;color:var(--ink)">' + esc(f.label) +
          ' <span style="font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">' + esc(f.scope || '') + '</span></div>' +
        '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(f.description || '') + '</div>' +
        danger +
      '</div>' +
    '</label>';
  }).join('');
}

/** Loads the enrollment roster into the Admin tab's enrollment panel and binds
 *  a one-time delegated click handler for the per-rep Provision buttons. */
function cnAdminLoadEnrollment_() {
  var slot = document.getElementById('cn-admin-enroll-list');
  if (!slot) return;
  if (!slot._enrollDelegated) {
    slot.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.cn-admin-provision-btn') : null;
      if (!b) return;
      cnAdminProvision_(b.getAttribute('data-emp-id'), b.getAttribute('data-emp-name'), b);
    });
    slot._enrollDelegated = true;
  }
  var requestedView = currentView;   // F1 — drop late callbacks after nav-away
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView) return;
      if (!res || res.error) {
        slot.innerHTML = '<div style="font-size:12px;color:var(--danger)">' + esc((res && res.error) || 'Failed to load enrollment') + '</div>';
        return;
      }
      slot.innerHTML = cnRenderEnrollmentHtml_(res);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      slot.innerHTML = '<div style="font-size:12px;color:var(--danger)">' + esc((err && err.message) || 'Failed to load enrollment') + '</div>';
    })
    .getCallNotesEnrollment();
}

/** Builds the enrollment panel: a summary line + a Provision button per
 *  un-enrolled rep. Every server string routes through esc() before innerHTML. */
function cnRenderEnrollmentHtml_(res) {
  var enrolled = res.enrolled || [];
  var unenrolled = res.unenrolled || [];
  var html = '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">' +
    esc(String(enrolled.length)) + ' enrolled · ' + esc(String(unenrolled.length)) + ' not yet enrolled</div>';
  if (unenrolled.length === 0) {
    html += '<div style="font-size:13px;color:var(--muted)">Every rostered rep has a Call Notes Sheet.</div>';
    return html;
  }
  html += unenrolled.map(function (r) {
    return '<div class="field-row" style="gap:8px;align-items:center;margin-bottom:6px">' +
      '<span style="flex:1;font-size:13px">' + esc(r.name) + ' <span style="color:var(--muted)">(' + esc(r.id) + ')</span></span>' +
      '<button class="refresh-btn cn-admin-provision-btn" data-emp-id="' + esc(r.id) + '" data-emp-name="' + esc(r.name) + '">' +
        icon('plus', 12) + ' Provision Sheet</button>' +
    '</div>';
  }).join('');
  return html;
}

/** Confirms + fires provisionCallNotesSheet for one rep, then refreshes the
 *  panel (the rep drops off the un-enrolled list on success). */
function cnAdminProvision_(empId, empName, btn) {
  uiConfirm({
    title: 'Provision Call Notes Sheet',
    message: 'Create a new Call Notes Sheet for ' + empName + ' (' + empId + ')? ' +
             'It will be owned by the deploying account and the rep is enrolled immediately.',
    confirmLabel: 'Provision',
  }).then(function (ok) {
    if (!ok) return;
    if (btn) { btn.disabled = true; btn.textContent = 'Provisioning…'; }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.error) {
          if (btn) { btn.disabled = false; btn.innerHTML = icon('plus', 12) + ' Provision Sheet'; }
          showToast((res && res.error) || 'Provision failed', 'toast-error');
          return;
        }
        if (res.alreadyEnrolled) showToast((res.repName || empName) + ' was already enrolled', 'toast-warn');
        else showToast('Provisioned a Sheet for ' + (res.repName || empName), 'toast-success');
        cnAdminLoadEnrollment_();
      })
      .withFailureHandler(function (err) {
        if (btn) { btn.disabled = false; btn.innerHTML = icon('plus', 12) + ' Provision Sheet'; }
        showToast((err && err.message) || 'Provision failed', 'toast-error');
      })
      .provisionCallNotesSheet(empId);
  });
}

    list.appendChild(wrap.firstElementChild);
  });

  document.getElementById('cn-admin-save-links').addEventListener('click', function () {
    var btn = this;
    var rows = document.querySelectorAll('#cn-admin-link-list .cn-admin-link-row');
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var label = ((rows[i].querySelector('.cn-admin-link-label') || {}).value || '').trim();
      var url = ((rows[i].querySelector('.cn-admin-link-url') || {}).value || '').trim();
      var category = ((rows[i].querySelector('.cn-admin-link-cat') || {}).value || 'other').trim();
      if (!label && !url) continue;  // skip fully-empty rows
      out.push({ label: label, url: url, category: category });
    }
    btn.disabled = true; btn.textContent = 'Saving…';
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false; btn.textContent = 'Save Links';
        if (!res || !res.success) { showToast((res && res.error) || 'Save failed', 'toast-error'); return; }
        showToast('Quick links saved', 'toast-success');
        if (CN_STATE.deptConfig) CN_STATE.deptConfig.externalLinks = out;
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = 'Save Links';
        showToast((err && err.message) || 'Save failed', 'toast-error');
      })
      .saveExternalLinks(out);
  });

  var slaSaveBtn = document.getElementById('cn-admin-save-sla');
  if (slaSaveBtn) slaSaveBtn.addEventListener('click', function () {
    var btn = this;
    var rows = document.querySelectorAll('#cn-admin-sla-list .cn-admin-sla-hours');
    var map = {};
    for (var i = 0; i < rows.length; i++) {
      var dept = rows[i].getAttribute('data-dept');
      var v = (rows[i].value || '').trim();
      if (dept && v) map[dept] = parseInt(v, 10);   // blank → server falls back to the default
    }
    btn.disabled = true; btn.textContent = 'Saving…';
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false; btn.textContent = 'Save SLA targets';
        if (!res || !res.success) { showToast((res && res.error) || 'Save failed', 'toast-error'); return; }
        showToast('SLA targets saved', 'toast-success');
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = 'Save SLA targets';
        showToast((err && err.message) || 'Save failed', 'toast-error');
      })
      .saveDeptRequestSla(map);
  });
}

// ════════════════════════════════════════════════════════════════════════════
//  EXTERNAL EMAIL MODAL — customer / provider email with form attachments
//  ────────────────────────────────────────────────────────────────────────
//  Separate from the internal department email composer. Opens from the
//  "Send External" button in the form header. Single-page modal layout:
//  recipient info + form selection + message + send.
// ════════════════════════════════════════════════════════════════════════════

/** Opens the external-email composer. `onMounted` (optional) fires right after
 *  the modal is in the DOM — used by cnSwitchComposerTab_ to tear down the
 *  department composer only once this one has mounted, avoiding a flicker. */
function cnOpenExternalEmailModal_(presetNoteId, onMounted) {
  CN_STATE.extComposer = {
    recipientType: 'customer',
    recipientEmail: '',
    recipientName: '',
    subject: '',
    message: '',
    formIds: [],              // PDF attachment form IDs
    interactiveForms: [],     // fillable interactive form IDs
    prefillData: {},           // keyed by form ID: { formId: { field: value } }
    formModes: {},             // keyed by form ID: 'pdf' | 'fillable'
    noteId: presetNoteId || null,
    sending: false,
  };
  const done = function () { if (typeof onMounted === 'function') onMounted(); };
  // Fetch catalog on first open, then render
  if (CN_STATE.formCatalog) {
    cnRenderExternalEmailModal_();
    done();
  } else {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res.error) {
          showToast(res.error, 'toast-error');
          // F(L-26): leave formCatalog null on error — [] is truthy, so a
          // transient failure was cached as "no forms configured" for the
          // whole session. null → the next open refetches.
          CN_STATE.formCatalog = null;
        } else {
          CN_STATE.formCatalog = res.forms || [];
        }
        cnRenderExternalEmailModal_();
        done();
      })
      .withFailureHandler(function (err) {
        showToast('Failed to load form catalog: ' + err.message, 'toast-error');
        CN_STATE.formCatalog = null;   // F(L-26): don't cache the failure
        cnRenderExternalEmailModal_();
        done();
      })
      .getFormCatalog();
  }
}

function cnCloseExternalEmailModal_() {
  // F(cycle-8 M-4): mirror the department composer's INV-145 guard — refuse to
  // close while the send RPC is in flight. Without this, an Esc mid-send closed
  // silently; the rep reopened and started a new draft, and the FIRST send's
  // late success handler then tore down the reopened modal (destroying the new
  // typing) — or the rep re-sent, duplicating the customer email.
  if (CN_STATE.extComposer && CN_STATE.extComposer.sending) {
    showToast('Sending — one moment…', 'toast-info');
    return;
  }
  CN_STATE.extComposer = null;
  var overlay = document.getElementById('cn-ext-overlay');
  if (overlay) overlay.remove();
}

function cnRenderExternalEmailModal_() {
  // Same ensureOverlay rationale as cnRenderComposerModal_ — Esc must run
  // cnCloseExternalEmailModal_ (clearing CN_STATE.extComposer), and a reused
  // node must come back visible.
  var overlay = ensureOverlay('cn-ext-overlay', { onClose: cnCloseExternalEmailModal_ });
  var c = CN_STATE.extComposer;
  if (!c) { cnCloseExternalEmailModal_(); return; }
  overlay.innerHTML = cnBuildExternalEmailHtml_();
  cnWireExternalEmailModal_();
}

/** IDs of forms that support interactive/fillable mode. Must match

var CN_INTERACTIVE_FORM_IDS = ['eaa', 'pt-ot-rx', 'seating-eval'];

        '<div class="field"><label>Patient Last Name</label>' +
          '<input type="text" data-prefill-form="' + formId + '" data-prefill-key="lastName" value="' + esc(pf.lastName || '') + '"></div>';
    case 'pt-ot-rx':
      return '<div class="cn-ext-prefill-title">Pre-fill fields (optional)</div>' +
        '<div class="field"><label>Patient Name</label>' +
          '<input type="text" data-prefill-form="' + formId + '" data-prefill-key="patientName" value="' + esc(pf.patientName || '') + '"></div>' +
        '<div class="field"><label>Item for Order</label>' +
          '<input type="text" data-prefill-form="' + formId + '" data-prefill-key="itemForOrder" value="' + esc(pf.itemForOrder || '') + '"></div>' +
        '<div class="field"><label>Order Date</label>' +
          '<input type="date" data-prefill-form="' + formId + '" data-prefill-key="orderDate" value="' + esc(pf.orderDate || '') + '"></div>';
    case 'seating-eval':
      return '<div class="cn-ext-prefill-title">Pre-fill fields (optional)</div>' +
        '<div class="field"><label>Patient Name</label>' +

        '<div class="field"><label>Date</label>' +
          '<input type="date" data-prefill-form="' + formId + '" data-prefill-key="evalDate" value="' + esc(pf.evalDate || '') + '"></div>';

// ── #2 External-email message templates ─────────────────────────────────
// Manager-curated canned message bodies (CN_STATE.deptConfig.emailTemplates,
// from getCallNotesDepartments). The picker filters to templates matching the
// current recipient type (plus 'any'); selecting one inserts its body into the
// message textarea, substituting the {name} token with the recipient name.

/** All configured templates (any recipient type). */
function cnExtTemplatesAll_() {
  return (CN_STATE.deptConfig && Array.isArray(CN_STATE.deptConfig.emailTemplates))
    ? CN_STATE.deptConfig.emailTemplates : [];
}

/** Templates applicable to a recipient type ('customer' | 'provider'). */
function cnExtTemplatesFor_(recipientType) {
  return cnExtTemplatesAll_().filter(function (t) {
    return t.recipientType === 'any' || t.recipientType === recipientType;
  });
}

/** The <option> set for the template <select>, given a recipient type. */
function cnExtTemplateOptionsHtml_(recipientType) {
  var list = cnExtTemplatesFor_(recipientType);
  var opts = '<option value="">Insert a template…</option>';
  list.forEach(function (t, i) {
    opts += '<option value="' + i + '">' + esc(t.name) +
      (t.recipientType === 'any' ? '' : ' (' + esc(t.recipientType) + ')') + '</option>';
  });
  return opts;
}

/** The full template-picker field row. Renders nothing when NO templates are
 *  configured at all (keeps the composer clean by default). When templates
 *  exist, the row stays present across recipient-type switches; its options
 *  re-filter to the active type (cnWireExternalEmailModal_ repopulates them). */
function cnExtTemplateRowHtml_(recipientType) {
  if (cnExtTemplatesAll_().length === 0) return '';
  return '<div class="field" style="margin-bottom:10px">' +
    '<label>Template</label>' +
    '<select id="cnX-template">' + cnExtTemplateOptionsHtml_(recipientType) + '</select>' +
  '</div>';
}

// Manager-curated quick links (CN_STATE.deptConfig.externalLinks, from
// getCallNotesDepartments) — survey / feedback / Google-review URLs hosted
// outside this app. The picker appends "label: url" to the message textarea
// (the external fillable-form route is admin-blocked on this domain, so links
// to an external survey host are the workaround). Recipient-type-agnostic.
function cnExtLinksAll_() {
  return (CN_STATE.deptConfig && Array.isArray(CN_STATE.deptConfig.externalLinks))
    ? CN_STATE.deptConfig.externalLinks : [];
}
// Groups the picker by category (the official external-collection path — #2).
// Option values stay the ORIGINAL index into cnExtLinksAll_() so the existing
// insert handler is unchanged. Labels are inlined (no module-level dependency)
// so the function unit-tests in isolation.
function cnExtLinkOptionsHtml_() {
  var catLabels = [['survey', 'Surveys'], ['review', 'Reviews'], ['feedback', 'Feedback'], ['other', 'Other']];
  var all = cnExtLinksAll_();
  var opts = '<option value="">Insert a link…</option>';
  catLabels.forEach(function (pair) {
    var cat = pair[0];
    var inGroup = [];
    all.forEach(function (l, i) { if ((l.category || 'other') === cat) inGroup.push({ l: l, i: i }); });
    if (!inGroup.length) return;
    opts += '<optgroup label="' + esc(pair[1]) + '">';
    inGroup.forEach(function (x) { opts += '<option value="' + x.i + '">' + esc(x.l.label) + '</option>'; });
    opts += '</optgroup>';
  });
  return opts;
}
function cnExtLinkRowHtml_() {
  if (cnExtLinksAll_().length === 0) return '';
  return '<div class="field" style="margin-bottom:10px">' +
    '<label>Quick link (survey / review / feedback)</label>' +
    '<select id="cnX-link">' + cnExtLinkOptionsHtml_() + '</select>' +
  '</div>';
}

function cnBuildExternalEmailHtml_() {
  var c = CN_STATE.extComposer;
  var catalog = CN_STATE.formCatalog || [];

  // Recipient type radios
  var typeRadios =
    '<button type="button" class="cn-ext-type-radio" aria-pressed="' + (c.recipientType === 'customer' ? 'true' : 'false') + '" data-ext-type="customer">' +
      icon('user', 14) + ' Customer</button>' +
    '<button type="button" class="cn-ext-type-radio" aria-pressed="' + (c.recipientType === 'provider' ? 'true' : 'false') + '" data-ext-type="provider">' +
      icon('checkCircle', 14) + ' Provider</button>';

  // Form checkboxes with fillable toggle
  var formItems = catalog.map(function (f) {
    var isChecked = c.formIds.indexOf(f.id) >= 0 || c.interactiveForms.indexOf(f.id) >= 0;
    var checked = isChecked ? 'checked' : '';
    var catCls = f.category === 'customer' ? 'customer' : 'provider';
    var isInteractive = CN_INTERACTIVE_FORM_IDS.indexOf(f.id) >= 0;
    var mode = c.formModes[f.id] || 'pdf';
    var isFillable = mode === 'fillable';

    var modeToggle = '';
    if (isInteractive) {
      modeToggle =
        '<div class="cn-ext-form-mode-toggle" data-mode-form-id="' + esc(f.id) + '">' +
          '<span class="toggle-label ' + (!isFillable ? 'active' : '') + '" data-mode-val="pdf">PDF</span>' +
          '<div class="cn-ext-form-mode-switch' + (isFillable ? ' on' : '') + '" data-mode-switch="' + esc(f.id) + '"></div>' +
          '<span class="toggle-label ' + (isFillable ? 'active' : '') + '" data-mode-val="fillable">Fillable</span>' +
        '</div>';
    }

    var prefillSection = '';
    if (isInteractive && isFillable && isChecked) {
      prefillSection = '<div class="cn-ext-prefill-section" data-prefill-for="' + esc(f.id) + '">' +
        cnPrefillFieldsForForm_(f.id) + '</div>';
    }

    return '<div class="cn-ext-form-item-wrap" data-form-wrap="' + esc(f.id) + '">' +
      '<label class="cn-ext-form-item">' +
        '<input type="checkbox" data-form-id="' + esc(f.id) + '" ' + checked + '>' +
        '<span class="cn-ext-form-name">' + esc(f.name) + '</span>' +
        '<span class="cn-ext-form-cat ' + catCls + '">' + esc(f.category) + '</span>' +
        modeToggle +
      '</label>' +
      prefillSection +
    '</div>';
  }).join('');
  if (catalog.length === 0) {
    formItems = '<div style="font-size:12px;color:var(--muted);padding:8px 0">No forms configured.</div>';
  }

  // Note reference dropdown
  var noteOptions = '<option value="">None (standalone email)</option>';
  var notes = (CN_STATE.rollingNotes || []).slice();
  // Cycle-9 M-5: a composer opened FOR a History/pinned note (dept→External
  // tab switch, win-back nudge) had no matching <option> — the select
  // silently fell back to "None (standalone email)" and the send dropped the
  // note linkage (the externalEmails[] stamp / manager recipient lookup /
  // card pill never happened). Resolve the preset note from any cache
  // (rolling / history / pinned) and pin it to the top of the list.
  if (c.noteId && !notes.some(function (n) { return n.noteId === c.noteId; })) {
    var presetNote = (typeof cnFindNoteAnywhere_ === 'function') ? cnFindNoteAnywhere_(c.noteId) : null;
    if (presetNote) notes.unshift(presetNote);
  }
  notes.forEach(function (n) {
    if (n._pending) return;
    var label = (n.caller || n.patientAndTrx || 'Note') + ' — ' + cnFormatTimestampForCopy_(n.timestamp);
    var sel = (c.noteId === n.noteId) ? ' selected' : '';
    noteOptions += '<option value="' + esc(n.noteId) + '"' + sel + '>' + esc(label) + '</option>';
  });

  // Auto-generate subject
  var autoSubject = c.subject;
  if (!autoSubject) {
    var nameForSubj = c.recipientName || 'Patient';
    autoSubject = c.recipientType === 'provider'
      ? 'UMS — Form Request for ' + nameForSubj
      : 'UMS — Documents for ' + nameForSubj;
  }

  return '<div class="modal" style="max-width:540px;resize:both;overflow:auto" id="cnX-modal">' +
    '<div class="modal-title" style="cursor:move" onmousedown="cnStartDragExtModal_(event)">' +
      icon('send', 18) + ' Send External Email</div>' +
    // Round 2 follow-on (modal-tab merge) — shared tab strip; clicking
    // Department switches to the dept composer (preserving noteId).
    cnRenderComposerTabStrip_('external', c.noteId) +
    '<div class="modal-sub">Send forms or messages directly to a customer or provider.</div>' +

    '<div class="cn-ext-section">' +
      '<div class="cn-ext-section-title">Recipient</div>' +
      '<div class="cn-ext-type-radios">' + typeRadios + '</div>' +
      '<div class="field-row" style="gap:10px">' +
        '<div class="field" style="flex:1.2">' +
          '<label>Email Address</label>' +
          '<input type="email" id="cnX-email" value="' + esc(c.recipientEmail) + '" placeholder="name@example.com">' +
        '</div>' +
        '<div class="field" style="flex:1">' +
          '<label>Name (optional)</label>' +
          '<input type="text" id="cnX-name" value="' + esc(c.recipientName) + '" placeholder="John Smith">' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="cn-ext-section">' +
      '<div class="cn-ext-section-title">' + icon('paperclip', 12) + ' Attach Forms</div>' +
      '<div class="cn-ext-form-list" id="cnX-form-list">' + formItems + '</div>' +
    '</div>' +

    '<div class="cn-ext-section">' +
      '<div class="cn-ext-section-title">Message</div>' +
      '<div class="field" style="margin-bottom:10px">' +
        '<label>Subject</label>' +
        '<input type="text" id="cnX-subject" value="' + esc(autoSubject) + '">' +
      '</div>' +
      cnExtTemplateRowHtml_(c.recipientType) +
      cnExtLinkRowHtml_() +
      '<div class="field" style="margin-bottom:0">' +
        '<label>Custom Message (optional)</label>' +
        '<textarea id="cnX-message" rows="3" placeholder="Add a personal message…">' + esc(c.message) + '</textarea>' +
      '</div>' +
      '<div class="cn-ext-note-link">' +
        '<label style="margin:0;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap">Link to note</label>' +
        '<select id="cnX-note-ref">' + noteOptions + '</select>' +
      '</div>' +
    '</div>' +

    '<div class="modal-footer">' +
      '<button class="btn-modal-cancel" onclick="cnCloseExternalEmailModal_()">Cancel</button>' +
      '<button class="btn-modal-ok" id="cnX-send-btn">' + icon('send', 14) + ' Send</button>' +
    '</div>' +
  '</div>';
}

function cnWireExternalEmailModal_() {
  var c = CN_STATE.extComposer;
  if (!c) return;

  // Recipient type toggle
  document.querySelectorAll('.cn-ext-type-radio').forEach(function (btn) {
    btn.addEventListener('click', function () {
      c.recipientType = btn.dataset.extType;
      document.querySelectorAll('.cn-ext-type-radio').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.extType === c.recipientType ? 'true' : 'false');
      });
      // Update subject if it still has the auto-generated pattern
      cnExtAutoUpdateSubject_();
      // #2 — re-filter the template picker to the new recipient type.
      var tsel = document.getElementById('cnX-template');
      if (tsel) tsel.innerHTML = cnExtTemplateOptionsHtml_(c.recipientType);
    });
  });

  // #2 — template picker: insert the chosen template body into the message
  // textarea, substituting {name} with the recipient name, then reset the
  // picker to its placeholder.
  var tmplSel = document.getElementById('cnX-template');
  if (tmplSel) {
    tmplSel.addEventListener('change', function () {
      var idx = parseInt(tmplSel.value, 10);
      if (isNaN(idx)) return;
      var t = cnExtTemplatesFor_(c.recipientType)[idx];
      tmplSel.value = '';
      if (!t) return;
      var body = String(t.body || '').replace(/\{name\}/g, (c.recipientName || '').trim() || 'there');
      var ta = document.getElementById('cnX-message');
      if (ta) { ta.value = body; c.message = body; }
    });
  }

  // Quick-link picker: APPEND "label: url" to the message (don't clobber the
  // rep's text), then reset to the placeholder.
  var linkSel = document.getElementById('cnX-link');
  if (linkSel) {
    linkSel.addEventListener('change', function () {
      var idx = parseInt(linkSel.value, 10);
      linkSel.value = '';
      if (isNaN(idx)) return;
      var l = cnExtLinksAll_()[idx];
      if (!l) return;
      var ta = document.getElementById('cnX-message');
      if (!ta) return;
      var prefix = ta.value && ta.value.trim() ? ta.value.replace(/\s*$/, '') + '\n\n' : '';
      ta.value = prefix + l.label + ': ' + l.url;
      c.message = ta.value;
    });
  }

  // Form checkbox sync — updated for fillable mode awareness
  document.querySelectorAll('#cnX-form-list input[type="checkbox"]').forEach(function (cb) {
    cb.addEventListener('change', function () {
      var fid = cb.dataset.formId;
      cnExtSyncFormSelection_(fid, cb.checked);
    });
  });

  // Mode toggle switches (PDF <=> Fillable)
  document.querySelectorAll('.cn-ext-form-mode-switch').forEach(function (sw) {
    sw.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var fid = sw.dataset.modeSwitch;
      var currentMode = c.formModes[fid] || 'pdf';
      var newMode = currentMode === 'pdf' ? 'fillable' : 'pdf';
      c.formModes[fid] = newMode;
      // Snapshot prefill inputs before re-render
      cnExtSnapshotPrefill_();
      cnExtSyncFormSelection_(fid, true); // re-sync into correct list
      cnRenderExternalEmailModal_();
    });
  });
  // Also wire the toggle labels
  document.querySelectorAll('.cn-ext-form-mode-toggle .toggle-label').forEach(function (lbl) {
    lbl.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      var wrap = lbl.closest('.cn-ext-form-mode-toggle');
      if (!wrap) return;
      var fid = wrap.dataset.modeFormId;
      var targetMode = lbl.dataset.modeVal;
      if (c.formModes[fid] === targetMode) return;
      c.formModes[fid] = targetMode;
      cnExtSnapshotPrefill_();
      cnExtSyncFormSelection_(fid, true);
      cnRenderExternalEmailModal_();
    });
  });

  // Prefill input sync — snapshot on any change
  document.querySelectorAll('[data-prefill-form]').forEach(function (inp) {
    inp.addEventListener('input', function () {
      var fid = inp.dataset.prefillForm;
      var key = inp.dataset.prefillKey;
      if (!c.prefillData[fid]) c.prefillData[fid] = {};
      c.prefillData[fid][key] = inp.value;
    });
  });

  // Name change => subject auto-update
  var nameInput = document.getElementById('cnX-name');
  if (nameInput) {
    nameInput.addEventListener('input', function () {
      c.recipientName = nameInput.value;
      cnExtAutoUpdateSubject_();
    });
  }

  // M6 — sync the remaining typed fields into state on every keystroke. The
  // PDF↔Fillable mode toggle does a full modal re-render from CN_STATE, so
  // any field without a sync listener silently reverts to its last stored
  // value (typed email/subject/message were wiped until this).
  var emailInput = document.getElementById('cnX-email');
  if (emailInput) {
    emailInput.addEventListener('input', function () { c.recipientEmail = emailInput.value; });
  }
  var subjInput = document.getElementById('cnX-subject');
  if (subjInput) {
    subjInput.addEventListener('input', function () { c.subject = subjInput.value; });
  }
  var msgInput = document.getElementById('cnX-message');
  if (msgInput) {
    msgInput.addEventListener('input', function () { c.message = msgInput.value; });
  }
  // F(L-21): the "Link to note" select was the one field the M6 sync missed —
  // the mode-toggle re-render rebuilt its options from c.noteId (set at open),
  // silently reverting a changed linkage, and the send then stamped
  // externalEmails[] onto the WRONG note (or none).
  var noteRefSel = document.getElementById('cnX-note-ref');
  if (noteRefSel) {
    noteRefSel.addEventListener('change', function () { c.noteId = noteRefSel.value || null; });
  }

  // Send button
  var sendBtn = document.getElementById('cnX-send-btn');
  if (sendBtn) {
    sendBtn.addEventListener('click', cnSendExternalEmail_);
  }
}

/** Sync a form's checked state into the correct list (formIds or interactiveForms). */
function cnExtSyncFormSelection_(fid, checked) {
  var c = CN_STATE.extComposer;
  if (!c) return;
  var mode = c.formModes[fid] || 'pdf';
  // Remove from both lists first
  var pdfIdx = c.formIds.indexOf(fid);
  if (pdfIdx >= 0) c.formIds.splice(pdfIdx, 1);
  var intIdx = c.interactiveForms.indexOf(fid);
  if (intIdx >= 0) c.interactiveForms.splice(intIdx, 1);
  // Add to the right list if checked
  if (checked) {
    if (mode === 'fillable' && CN_INTERACTIVE_FORM_IDS.indexOf(fid) >= 0) {
      c.interactiveForms.push(fid);
    } else {
      c.formIds.push(fid);
    }
  }
}

/** Snapshot in-progress prefill input values before a re-render. */
function cnExtSnapshotPrefill_() {
  var c = CN_STATE.extComposer;
  if (!c) return;
  document.querySelectorAll('[data-prefill-form]').forEach(function (inp) {
    var fid = inp.dataset.prefillForm;
    var key = inp.dataset.prefillKey;
    if (!c.prefillData[fid]) c.prefillData[fid] = {};
    c.prefillData[fid][key] = inp.value;
  });
}

/** Auto-update the subject when the recipient type or name changes, but only
 *  if the subject still matches an auto-generated pattern. */
function cnExtAutoUpdateSubject_() {
  var c = CN_STATE.extComposer;
  if (!c) return;
  var subjectEl = document.getElementById('cnX-subject');
  if (!subjectEl) return;
  var current = subjectEl.value.trim();
  // Only overwrite if it matches a known auto-pattern
  if (/^UMS\s*—\s*(Documents for|Form Request for)\s/i.test(current) || !current) {
    var nameForSubj = (document.getElementById('cnX-name') || {}).value || 'Patient';
    subjectEl.value = c.recipientType === 'provider'
      ? 'UMS — Form Request for ' + nameForSubj
      : 'UMS — Documents for ' + nameForSubj;
    c.subject = subjectEl.value;   // M6 — keep state in step for re-renders
  }
}

function cnSendExternalEmail_() {
  var c = CN_STATE.extComposer;
  if (!c || c.sending) return;

  // Snapshot prefill before reading
  cnExtSnapshotPrefill_();

  // Gather values from DOM
  var email = (document.getElementById('cnX-email') || {}).value || '';
  var name = (document.getElementById('cnX-name') || {}).value || '';
  var subject = (document.getElementById('cnX-subject') || {}).value || '';
  var message = (document.getElementById('cnX-message') || {}).value || '';
  var noteRef = (document.getElementById('cnX-note-ref') || {}).value || null;

  // Client-side validation
  email = email.trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showToast('Please enter a valid email address.', 'toast-error');
    var emailEl = document.getElementById('cnX-email');
    if (emailEl) emailEl.focus();
    return;
  }
  subject = subject.trim();
  if (!subject) {
    showToast('Subject line is required.', 'toast-error');
    var subjEl = document.getElementById('cnX-subject');
    if (subjEl) subjEl.focus();
    return;
  }

  c.sending = true;
  var sendBtn = document.getElementById('cnX-send-btn');
  if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = icon('send', 14) + ' Sending…'; }

  var payload = {
    recipientEmail: email,
    recipientName: name.trim(),
    recipientType: c.recipientType,
    subject: subject,
    message: message.trim(),
    formIds: c.formIds,
    interactiveForms: c.interactiveForms,
    prefillData: c.prefillData,
    noteId: noteRef || null,
  };

  var requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      c.sending = false;
      if (!res.success) {
        if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = icon('send', 14) + ' Send'; }
        showToast(res.error || 'Send failed', 'toast-error');
        return;
      }
      // F(cycle-8 M-4) defense-in-depth: only close the composer THIS send
      // belongs to. With the close-guard above the mid-send-close/reopen race
      // shouldn't occur, but a late handler must never tear down a composer
      // instance it doesn't own.
      if (CN_STATE.extComposer === c) cnCloseExternalEmailModal_();
      var parts = [];
      if ((res.formsAttached || []).length > 0) {
        parts.push(res.formsAttached.length + ' PDF(s)');
      }
      if ((res.formLinks || []).length > 0) {
        parts.push(res.formLinks.length + ' fillable form(s)');
      }
      var suffix = parts.length > 0 ? ' with ' + parts.join(' + ') : '';
      // showToast assigns via textContent (XSS-safe), so do NOT esc() here —
      // esc() would render entities literally (e.g. a&amp;b@x.com) (F14).
      showToast('Sent to ' + res.recipientEmail + suffix, 'toast-success');

      // If a note was linked, update the local state so the card pill appears
      if (noteRef) {
        var note = cnFindNoteAnywhere_(noteRef);
        if (note) {
          if (!note.subformData || typeof note.subformData !== 'object') note.subformData = {};
          if (!Array.isArray(note.subformData.externalEmails)) note.subformData.externalEmails = [];
          var stampEntry = {
            to: email,
            type: c.recipientType,
            forms: c.formIds,
            sentAt: res.sentAt,
          };
          if (c.interactiveForms.length > 0) {
            stampEntry.interactiveForms = c.interactiveForms.map(function (fid) { return { formType: fid }; });
          }
          note.subformData.externalEmails.push(stampEntry);
          if (currentView === requestedView) cnReRenderActiveView_();
        }
      }
    })
    .withFailureHandler(function (err) {
      c.sending = false;
      if (sendBtn) { sendBtn.disabled = false; sendBtn.innerHTML = icon('send', 14) + ' Send'; }
      showToast('Send failed: ' + (err.message || 'Server error'), 'toast-error');
    })
    .sendExternalEmail(payload);
}

function cnStartDragExtModal_(e) {
  var modal = document.getElementById('cnX-modal');
  if (!modal) return;
  var startX = e.clientX, startY = e.clientY;
  var rect = modal.getBoundingClientRect();
  var origLeft = rect.left, origTop = rect.top;
  modal.style.position = 'fixed';
  modal.style.left = origLeft + 'px';
  modal.style.top = origTop + 'px';
  modal.style.margin = '0';
  function onMove(ev) {
    modal.style.left = (origLeft + ev.clientX - startX) + 'px';
    modal.style.top = (origTop + ev.clientY - startY) + 'px';
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  e.preventDefault();
}

</script>
