<style>
  /* ═══════════════════════════════════════════════════════════════════════
     CALL NOTES — view-scoped styles
     ───────────────────────────────────────────────────────────────────────
     Layered on top of styles.html + design tokens. Owns the rolling
     note stack, the email composer modal (cn-compose-*), the flag
     icon trio, and the filter chips. Sized to gracefully reflow into
     compact-mode (~360–440px) widths.
     ═══════════════════════════════════════════════════════════════════════ */

  /* ── Rolling note panel ─────────────────────────────────────────── */
  .cn-rolling {
    display: flex; flex-direction: column; gap: 14px;
  }

  /* ═══════════════════════════════════════════════════════════════════
     CALL NOTES — ROUND 2 · 8e VERTICAL LAYOUT
     ───────────────────────────────────────────────────────────────────
     2/3 left = note template (input/textarea fields, vertical stack with
     hairline rows). 1/3 right = controls rail (flag toolbar, tag chips,
     primary actions). Replaces the Phase 4 .cn-form-grid 4-column layout.
     Form root keeps id="cn-active-form" so cnReadActiveForm_, sticky
     drafts, optimistic UI etc. continue to work. Contenteditable +
     manual-copy failover deferred — see broad-implement Phase 8efgh
     summary for context.
     ═══════════════════════════════════════════════════════════════════ */
  .cnv-layout {
    display: grid; grid-template-columns: 2fr 1fr; gap: 14px;
    margin-bottom: 14px;
  }
  .cnv-doc { min-width: 0; }
  .cnv-doc-frame {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px 16px 8px;
    box-shadow: var(--shadow-sm);
  }
  .frame-stamp {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    color: var(--muted-2); letter-spacing: .14em; text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
    padding-bottom: 8px; margin-bottom: 6px;
    border-bottom: 1px dashed var(--line);
  }
  .frame-stamp .meta { color: var(--muted-3); }
  .frame-stamp .copyhint { margin-left: auto; color: var(--accent-2); }
  .cnv-row {
    display: grid; grid-template-columns: 130px 1fr; gap: 12px;
    align-items: start; padding: 8px 0;
    border-bottom: 1px solid color-mix(in oklch, var(--line), transparent 60%);
  }
  .cnv-row:last-child { border-bottom: none; }
  .cnv-row.full { grid-template-columns: 130px 1fr; }
  .cnv-row .lbl {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    padding-top: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .cnv-row input,
  .cnv-row textarea,
  .cnv-row .ce {
    appearance: none; border: 1px solid var(--line);
    background: var(--paper);
    font-family: var(--ui); font-size: 13px; color: var(--ink);
    padding: 5px 8px; margin: 0; width: 100%;
    border-radius: var(--radius-sm); outline: none; resize: none;
    transition: border-color var(--t) var(--ease), background var(--t) var(--ease);
    font-feature-settings: 'ss01', 'cv11', 'cv05';
    letter-spacing: -0.01em;
    min-height: 22px;
  }
  .cnv-row input:focus,
  .cnv-row textarea:focus,
  .cnv-row .ce:focus {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  /* Operator feedback (2026-06-12): tall fields default to ONE line and
     auto-grow with content — keeps the template short for small/pinned
     pop-out windows. */
  .cnv-row textarea,
  .cnv-row .ce.ce-tall { min-height: 22px; line-height: 1.4; }
  /* Round 2 deferred 8e — contenteditable empty-state placeholder. The
     `.empty` class is toggled by cnSetFieldValue_ / blur / input handlers
     based on whether textContent.trim() is empty. */
  .cnv-row .ce {
    cursor: text; white-space: pre-wrap; word-break: break-word;
  }
  .cnv-row .ce.empty::before {
    content: attr(data-placeholder);
    color: var(--muted-2);
    pointer-events: none;
  }
  /* Operator feedback (2026-06-12): Callback / Caller / Relationship share
     one horizontal row (labels above values) so the template fits a small
     always-on-top pop-out. Falls back to 2-up in compact mode. */
  .cnv-trio {
    display: grid; grid-template-columns: 1.1fr 1fr .9fr; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid color-mix(in oklch, var(--line), transparent 60%);
  }
  .cnv-trio .lbl {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    margin-bottom: 3px; display: flex; align-items: center; gap: 6px;
  }
  .cnv-trio .ce {
    appearance: none; border: 1px solid var(--line); background: var(--paper);
    font-family: var(--ui); font-size: 13px; color: var(--ink);
    padding: 5px 8px; width: 100%; box-sizing: border-box;
    border-radius: var(--radius-sm); outline: none;
    min-height: 22px; cursor: text; white-space: pre-wrap; word-break: break-word;
    transition: border-color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .cnv-trio .ce:focus {
    border-color: var(--accent); background: var(--accent-soft);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .cnv-trio .ce.empty::before {
    content: attr(data-placeholder); color: var(--muted-2); pointer-events: none;
  }
  :root[data-compact] .cnv-trio { grid-template-columns: 1fr 1fr; gap: 8px; }
  :root[data-compact] .cnv-doc-frame { padding: 10px 10px 6px; }
  :root[data-compact] .cnv-row { grid-template-columns: 84px 1fr; padding: 5px 0; }
  /* below-doc copy hint sits just under the frame */
  .below-doc {
    font-family: var(--mono); font-size: 9px; font-weight: 500;
    color: var(--muted-2); letter-spacing: .04em;
    padding: 8px 4px 0;
    line-height: 1.4;
  }
  .below-doc b { color: var(--ink); font-weight: 700; }
  /* Round 2 deferred 8e — prefill accent: highlight rows populated by
     cnApplyPrefillFromUrl_ (deep-link from the Clock coverage strip
     CTA / future caller). */
  .cnv-row.prefilled {
    background: color-mix(in oklch, var(--accent-soft), var(--paper-card) 50%);
    border-left: 3px solid var(--accent);
    padding-left: 8px;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }

  /* ─── RAIL (right 1/3) ──────────────────────────────────────────── */
  .cnv-rail {
    display: flex; flex-direction: column; gap: 10px;
    min-width: 0;
  }
  .rail-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .rail-card h4 {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    margin: 0 0 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .rail-card h4 .sub { color: var(--muted-3); font-weight: 500; }

  /* Flag toolbar — multi-select. .on means the flag is active. */
  .rail-flags {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
  }
  .flag-btn {
    appearance: none; cursor: pointer;
    font-family: var(--ui); font-size: 11px; font-weight: 500;
    padding: 6px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--paper-card);
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 5px;
    transition: background var(--t) var(--ease), border-color var(--t) var(--ease), color var(--t) var(--ease);
  }
  .flag-btn:hover { background: var(--paper-2); color: var(--ink); }
  /* Operator feedback (2026-06-12): color-code the flags even when OFF so
     the vocabulary reads at a glance (icon tint only; ON state unchanged). */
  .flag-btn.action svg   { color: var(--warn); }
  .flag-btn.training svg { color: var(--info); }
  .flag-btn.review svg   { color: var(--accent); }
  .flag-btn.urgent svg   { color: var(--destructive); }
  .flag-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
  .flag-btn.on { border-color: transparent; }
  .flag-btn.action.on   { background: var(--warn-soft);        color: var(--warning-deep); }
  .flag-btn.training.on { background: var(--info-soft);        color: var(--info-deep); }
  .flag-btn.review.on   { background: var(--accent-soft);      color: var(--success-deep); }
  .flag-btn.urgent.on   { background: var(--destructive-soft); color: var(--danger-deep); }

  /* Tags */
  .rail-tags {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-bottom: 6px; min-height: 4px;
  }
  .rail-tag-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    background: var(--paper-2); border: 1px solid var(--line);
    color: var(--ink); padding: 2px 6px 2px 8px; border-radius: 999px;
    letter-spacing: .02em;
  }
  .rail-tag-x {
    appearance: none; cursor: pointer; border: none; background: transparent;
    color: var(--muted-2); font-size: 13px; line-height: 1;
    padding: 0 2px; border-radius: 4px;
  }
  .rail-tag-x:hover { color: var(--destructive); }
  .rail-tag-input {
    appearance: none; width: 100%;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper-card);
    padding: 6px 8px; font-family: var(--ui); font-size: 12px;
    color: var(--ink); outline: none;
    transition: border-color var(--t) var(--ease);
  }
  .rail-tag-input:focus { border-color: var(--accent); }

  /* Action buttons in the rail */
  /* Operator feedback (2026-06-12 r2): quadrant layout — four compact
     buttons instead of five full-width rows, so the rail (and the whole
     form block) is shorter and the filter bar + notes move up. */
  .rail-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .rail-actions .cn-action-prime,
  .rail-actions .cn-action-sec,
  .rail-actions .cn-form-clear-btn {
    width: 100%; justify-content: center; padding: 9px 8px;
    font-size: 12px; display: inline-flex; align-items: center; gap: 5px;
  }
  .rail-actions .kbd-chip { display: none; }   /* chips crowd the quadrants — the card sub + tooltips carry the hints */
  /* circular shortcuts button in the page header (was the 5th rail button) */
  .cn-help-fab {
    appearance: none; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper-card);
    color: var(--muted); font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; align-self: center; margin-left: 10px;
    transition: color var(--t) var(--ease), border-color var(--t) var(--ease);
  }
  .cn-help-fab:hover { color: var(--ink); border-color: var(--border-strong); }
  /* Save & Compose loading state — envelope bobs while the save confirms */
  .cn-compose-loading {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 44px 36px; text-align: center;
  }
  .cn-compose-loading .env { color: var(--accent); animation: cnEnvFly 1.1s ease-in-out infinite; }
  .cn-compose-loading .msg { font-size: 13px; color: var(--muted); }
  @keyframes cnEnvFly {
    0%   { transform: translateY(0) rotate(0deg); opacity: .9; }
    50%  { transform: translateY(-9px) rotate(-6deg); opacity: 1; }
    100% { transform: translateY(0) rotate(0deg); opacity: .9; }
  }

  /* Compact reflow */
  @media (max-width: 880px) {
    .cnv-layout { grid-template-columns: 1fr; }
  }
  :root[data-compact] .cnv-layout { grid-template-columns: 1fr; gap: 10px; }

  /* #4 — compact pop-out optimization: icon-only flag rail + a sticky,
     collapsible save bar so the note template stays "anchored" and the tools
     are reachable without a manual resize. All gated to data-compact; normal
     (wide) mode is untouched. The collapse chevron only exists in compact. */
  .cn-save-collapse { display: none; }
  :root[data-compact] .rail-flags { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  :root[data-compact] .flag-btn { justify-content: center; padding: 8px 4px; }
  :root[data-compact] .flag-btn .flag-lbl { display: none; }   /* icon-only — title + aria-label carry the meaning */
  :root[data-compact] .flag-btn svg { width: 15px; height: 15px; }
  :root[data-compact] .cn-save-collapse {
    display: inline-flex; align-items: center; justify-content: center;
    appearance: none; cursor: pointer; border: none; background: transparent;
    color: var(--muted); padding: 0 2px; margin-left: 4px;
  }
  :root[data-compact] .cn-save-collapse:hover { color: var(--ink); }
  :root[data-compact] #cn-save-card {
    position: sticky; bottom: 8px; z-index: 5;
    box-shadow: var(--shadow-md);
  }
  :root[data-compact] #cn-save-card.collapsed .rail-actions { display: none; }
  :root[data-compact] #cn-save-card.collapsed .sub { display: none; }
  :root[data-compact] #cn-save-card.collapsed .cn-save-collapse svg { transform: rotate(180deg); }

  /* ─── EMAIL COMPOSER TAB STRIP (Round 2 modal-tab merge) ──────────
     Shared segmented control rendered at the top of BOTH the department
     composer (#cnC-modal) and the external composer (#cnX-modal). Click
     transitions the modal via cnSwitchComposerTab_, preserving the
     noteId context. Department tab is disabled when no noteId is in
     scope (the rep clicked "Open Email" from an unsaved form). */
  .cn-composer-tabs {
    display: inline-flex; align-items: center; gap: 0;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 3px; background: var(--paper-card);
    margin: 8px 0 4px;
  }
  .cn-composer-tab {
    appearance: none; cursor: pointer; border: none; background: transparent;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .cn-composer-tab:hover:not(.disabled) { color: var(--ink); }
  .cn-composer-tab.on { background: var(--ink); color: var(--paper); }
  .cn-composer-tab.disabled {
    cursor: not-allowed; opacity: 0.45;
  }
  .cn-composer-tab svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* ─── ADMIN TAG TAXONOMY TABLE (Round 2 · 8h + follow-on actions) ── */
  .cn-tax-head,
  .cn-tax-row {
    display: grid;
    /* 2nd-pass merge — taxonomy + trends in one table: Tag / Usage / Notes /
       Trend(sparkline) / Δ wk / Actions (replaced the old Last-seen column). */
    grid-template-columns: 150px 1fr 46px 86px 50px auto;
    gap: 12px; align-items: center;
    padding: 6px 0;
    font-family: var(--ui); font-size: 12px;
  }
  .cn-tax-head {
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
  }
  .cn-tax-row { border-bottom: 1px dashed var(--line); }
  .cn-tax-row:last-child { border-bottom: none; }
  .cn-tax-row.is-archived { opacity: 0.7; }
  .cn-tax-tag {
    font-family: var(--mono); font-weight: 600; color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .cn-tax-archived-pill {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 999px;
    background: var(--paper-2); border: 1px solid var(--line);
  }
  .cn-tax-bar {
    height: 6px; background: var(--paper-2); border-radius: 3px;
    overflow: hidden;
  }
  .cn-tax-bar i {
    display: block; height: 100%; background: var(--accent);
  }
  .cn-tax-count {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    text-align: right; color: var(--ink);
  }
  .cn-tax-trend { display: flex; justify-content: center; align-items: center; }
  .cn-tax-trend svg { display: block; }
  .cn-tax-delta {
    font-family: var(--mono); font-size: 11px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .cn-tax-actions {
    display: inline-flex; gap: 4px; flex-wrap: wrap;
    justify-content: flex-end;
  }
  .cn-tax-act {
    appearance: none; cursor: pointer;
    font-family: var(--ui); font-size: 11px; font-weight: 500;
    padding: 4px 8px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--paper-card); color: var(--ink);
    display: inline-flex; align-items: center; gap: 4px;
    transition: background var(--t) var(--ease), border-color var(--t) var(--ease), color var(--t) var(--ease);
  }
  .cn-tax-act:hover { background: var(--paper-2); border-color: var(--border-strong); }
  .cn-tax-act svg { width: 11px; height: 11px; }
  .cn-tax-act.danger { color: var(--danger-deep); }
  .cn-tax-act.danger:hover { background: var(--destructive-soft); border-color: var(--destructive); }
  @media (max-width: 720px) {
    .cn-tax-head,
    .cn-tax-row { grid-template-columns: 1fr; }
    .cn-tax-actions { justify-content: flex-start; }
  }

  /* ─── ADMIN STORAGE HEALTH PANEL (#1) ────────────────────────────── */
  .cn-storage-row {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding: 9px 0; border-bottom: 1px dashed var(--line);
  }
  .cn-storage-row:last-child { border-bottom: none; }
  .cn-storage-main { min-width: 0; flex: 1; }
  .cn-storage-label { font-weight: 600; color: var(--ink); font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cn-storage-role { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cn-storage-meta { text-align: right; flex-shrink: 0; white-space: nowrap; }
  @media (max-width: 720px) {
    .cn-storage-row { flex-direction: column; gap: 4px; }
    .cn-storage-meta { text-align: left; white-space: normal; }
  }

  /* ─── ADMIN TAG TRENDS PANEL (#5) ────────────────────────────────── */
  .cn-trend-head,
  .cn-trend-row {
    display: grid;
    grid-template-columns: 160px 1fr 50px 70px;
    gap: 12px; align-items: center;
    padding: 6px 0;
    font-family: var(--ui); font-size: 12px;
  }
  .cn-trend-head {
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
  }
  .cn-trend-row { border-bottom: 1px dashed var(--line); }
  .cn-trend-row:last-child { border-bottom: none; }
  .cn-trend-tag {
    font-family: var(--mono); font-weight: 600; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cn-trend-spark-cell { color: var(--muted); font-family: var(--mono); font-size: 10px; }
  .cn-trend-spark { display: block; width: 100%; height: 22px; }
  .cn-trend-total {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    text-align: right; color: var(--ink);
  }
  .cn-trend-deltacell { text-align: right; }
  .cn-trend-delta {
    font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
  }
  .cn-trend-delta.up   { color: var(--danger-deep); }   /* a rising issue-tag is a WARNING signal */
  .cn-trend-delta.down { color: var(--success-deep); }
  .cn-trend-delta.flat { color: var(--muted-2); }
  @media (max-width: 720px) {
    .cn-trend-head,
    .cn-trend-row { grid-template-columns: 1fr auto; }
    .cn-trend-spark-cell { display: none; }
  }

  /* ─── COMPLIANCE AUDIT PANEL (#3) ────────────────────────────────── */
  .cn-audit-list { display: flex; flex-direction: column; }
  .cn-audit-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 7px 2px;
    border-bottom: 1px dashed var(--line);
  }
  .cn-audit-row:last-child { border-bottom: none; }
  .cn-audit-main {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    min-width: 0;
  }
  .cn-audit-ts {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .cn-audit-action {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    letter-spacing: .04em; color: var(--info-deep);
    background: var(--accent-soft); border-radius: 999px; padding: 1px 7px;
    white-space: nowrap;
  }
  .cn-audit-rep { font-size: 12px; font-weight: 600; color: var(--ink); }
  .cn-audit-actor {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px;
  }
  .cn-audit-actions { display: inline-flex; gap: 2px; flex-shrink: 0; }
  .cn-audit-history {
    grid-column: 1 / -1;
    margin: 4px 0 6px; padding: 8px 10px;
    background: var(--paper-2); border-radius: var(--radius-sm);
    display: flex; flex-direction: column; gap: 4px;
  }
  .cn-audit-hist-row {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    font-size: 11px;
  }
  .cn-audit-hist-ts {
    font-family: var(--mono); color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .cn-audit-hist-action { font-weight: 600; color: var(--info-deep); }
  .cn-audit-hist-actor { color: var(--muted); }
  .cn-audit-hist-notes { color: var(--ink); flex-basis: 100%; word-break: break-word; }
  .cn-audit-hist-empty { font-size: 11px; color: var(--muted); }
  @media (max-width: 720px) {
    .cn-audit-actor { max-width: 140px; }
  }

  /* ─── Q&A THREAD (Round 2 · 8g) ──────────────────────────────────── */
  .qa-thread {
    margin-top: 8px; padding: 8px 10px;
    background: var(--info-soft);
    border-left: 2px solid var(--info);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    display: flex; flex-direction: column; gap: 6px;
  }
  .qa-row {
    display: grid; grid-template-columns: auto 1fr auto; gap: 8px;
    font-size: 12px; line-height: 1.4;
  }
  .qa-role {
    font-family: var(--mono); font-size: 9px; font-weight: 700;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    padding-top: 2px;
  }
  .qa-msg { color: var(--ink); }
  .qa-ts {
    font-family: var(--mono); font-size: 10px; color: var(--muted-2);
    font-variant-numeric: tabular-nums;
  }
  .qa-row.qa-mgr   .qa-role { color: var(--info-deep); }
  .qa-row.qa-agent .qa-role { color: var(--success-deep); }
  .qa-actions {
    display: flex; gap: 6px; margin-top: 4px;
  }
  .qa-ack-btn,
  .qa-clarify-btn,
  .qa-clarify-submit {
    appearance: none; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper-card); color: var(--ink);
    font-family: var(--ui); font-size: 11px; font-weight: 500;
    padding: 4px 10px; border-radius: var(--radius-sm);
  }
  .qa-ack-btn:hover { background: var(--good-soft); border-color: var(--good); }
  .qa-clarify-btn:hover { background: var(--info-soft); border-color: var(--info); }
  .qa-clarify-row {
    display: flex; gap: 6px; margin-top: 4px;
  }
  .qa-clarify-input {
    flex: 1; min-width: 0;
    appearance: none; resize: vertical; min-height: 36px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 6px 8px; background: var(--paper-card); color: var(--ink);
    font-family: var(--ui); font-size: 12px;
  }
  .qa-clarify-submit { background: var(--accent); color: var(--paper-card); border-color: var(--accent); }
  .qa-clarify-submit:hover { background: var(--accent-2); border-color: var(--accent-2); }

  /* ═══════════════════════════════════════════════════════════════════
     CALL NOTES — V4 LOG REDESIGN (Phase 4) [retained for fallback CSS]
     ───────────────────────────────────────────────────────────────────
     The 4-column grid is no longer emitted by cnRenderActiveForm_ but
     several supporting selectors (cn-head / cn-stats-mini / cn-actions /
     cn-quick-chip-row) below are still active.
     ═══════════════════════════════════════════════════════════════════ */

  /* cn-head — eyebrow + h2 + stats-mini header. Replaces .cn-active-form-header
     + the view-title-row when in the Log view. */
  .cn-head {
    display: grid; grid-template-columns: 1fr auto;
    gap: 16px; align-items: end;
    margin-bottom: 14px;
  }
  .cn-head-eyebrow {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .14em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .cn-head-title {
    font-family: var(--display); font-size: 28px; font-weight: 500;
    letter-spacing: -.02em; color: var(--ink); line-height: 1.1; margin: 0;
  }
  .cn-stats-mini {
    display: flex; gap: 0;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper-card); overflow: hidden;
  }
  .cn-stat-cell {
    padding: 8px 14px; border-right: 1px solid var(--line);
    text-align: center; min-width: 64px;
  }
  .cn-stat-cell:last-child { border-right: none; }
  .cn-stat-num {
    font-family: var(--mono); font-size: 18px; font-weight: 600;
    color: var(--ink); line-height: 1;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum', 'ss01';
  }
  .cn-stat-num.warn { color: var(--warning-deep); }
  .cn-stat-num.crit { color: var(--danger-deep); }
  .cn-stat-lbl {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    margin-top: 4px;
  }

  /* 4-column form canvas. Each .cn-field is a self-contained card with a
     hairline border and an in-card label; focus state expands the border
     to accent with a soft glow ring. Issue + Resolution span 2x2 cells
     to balance the row of narrow inputs above and below. */
  .cn-form-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 14px;
  }
  .cn-form-grid.cn-active-form {
    /* override the prior .cn-active-form card styling — the grid is the
       container; individual .cn-field cells carry the border + bg now. */
    background: transparent; border: none; padding: 0;
    box-shadow: none;
  }
  .cn-field {
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
    padding: 8px 10px 6px;
    transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease);
  }
  .cn-field.span-2 { grid-column: span 2; }
  .cn-field.span-4 { grid-column: span 4; }
  .cn-field.row-2  { grid-row: span 2; }
  .cn-field:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .cn-field.prefilled {
    border-left: 3px solid var(--accent);
    background: color-mix(in oklch, var(--accent-soft), var(--paper-card) 50%);
  }
  .cn-field label {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
    gap: 4px; margin-bottom: 4px;
  }
  .cn-field-num {
    color: var(--muted-3); font-weight: 500;
  }
  .cn-field input,
  .cn-field textarea {
    appearance: none; border: none; background: transparent;
    font-family: var(--ui); font-size: 13px; color: var(--ink);
    padding: 0; margin: 0; width: 100%;
    outline: none; resize: none;
    min-height: 0;
    font-feature-settings: 'ss01', 'cv11', 'cv05';
    letter-spacing: -0.01em;
  }
  .cn-field textarea {
    min-height: 80px; flex: 1; line-height: 1.4;
  }

  /* Tag picker — Field 08. 4 buttons (None/Action/Training/Review) inline.
     Selected button uses the tonal soft-bg matching its existing flag tone
     (warn/info/accent). data-flag attribute on each button is reused by
     cnWireActiveForm_'s setFlag()/cnRestoreFromSnapshot_ logic so all
     existing flag handling continues to work. */
  .cn-tag-picker {
    display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  }
  .cn-tag-btn {
    appearance: none; cursor: pointer;
    font-family: var(--ui); font-size: 11px; font-weight: 500;
    padding: 5px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--paper-card);
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 4px;
    transition: background var(--t) var(--ease), border-color var(--t) var(--ease), color var(--t) var(--ease);
  }
  .cn-tag-btn:hover { background: var(--paper-2); color: var(--ink); }
  /* Specificity bumped via .cn-tag-picker ancestor selector so these
     override the legacy .cn-flag-btn.active.action/.training/.review
     rules further down in the file (the new tag buttons retain the
     .cn-flag-btn class so cnWireActiveForm_'s setFlag() finds them). */
  .cn-tag-picker .cn-tag-btn.active[data-flag=""]         { background: var(--paper-3);          color: var(--ink);          border-color: transparent; }
  .cn-tag-picker .cn-tag-btn.active[data-flag="action"]   { background: var(--warn-soft);        color: var(--warning-deep); border-color: transparent; }
  .cn-tag-picker .cn-tag-btn.active[data-flag="training"] { background: var(--info-soft);        color: var(--info-deep);    border-color: transparent; }
  .cn-tag-picker .cn-tag-btn.active[data-flag="review"]   { background: var(--accent-soft);      color: var(--success-deep); border-color: transparent; }
  .cn-tag-btn svg { width: 12px; height: 12px; }

  /* Action row — Flag/Tip + Clear on the left, Save & Compose + Save & Copy
     (primary) on the right. Primary CTA carries the ⌘↵ kbd-chip inline. */
  .cn-actions {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .cn-actions-spacer { flex: 1; }
  .cn-action-sec,
  .cn-action-prime {
    appearance: none; cursor: pointer;
    font-family: var(--ui); font-size: 13px; font-weight: 500;
    padding: 9px 14px; border-radius: var(--radius);
    display: inline-flex; align-items: center; gap: 6px;
    transition: background var(--t) var(--ease), border-color var(--t) var(--ease), color var(--t) var(--ease);
  }
  .cn-action-sec {
    border: 1px solid var(--line); background: var(--paper-card); color: var(--ink);
  }
  .cn-action-sec:hover { background: var(--paper-2); border-color: var(--border-strong); }
  .cn-action-sec.danger { color: var(--danger-deep); }
  .cn-action-sec.danger:hover { background: var(--destructive-soft); border-color: var(--destructive); }
  .cn-action-prime {
    border: 1px solid var(--accent); background: var(--accent); color: var(--paper-card);
    font-weight: 600;
  }
  .cn-action-prime:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .cn-action-sec svg, .cn-action-prime svg { width: 14px; height: 14px; }
  .cn-action-prime .kbd-chip,
  .cn-action-sec  .kbd-chip {
    display: inline-flex; align-items: center;
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 3px;
    letter-spacing: 0; margin-left: 4px;
  }
  .cn-action-prime .kbd-chip { background: rgba(255,255,255,0.22); color: inherit; }
  .cn-action-sec  .kbd-chip {
    background: var(--paper-2); color: var(--muted);
    border: 1px solid var(--line);
  }

  /* Bottom-of-Log quick chip strip — taps a tag count to jump to History
     filtered by that tag. Counts come from getCallNotesAmbient's flagCounts. */
  .cn-quick-chip-row {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px;
    margin-top: 18px; padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .cn-quick-chip-row-label {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    margin-right: 6px;
  }
  .cn-quick-chip {
    appearance: none; cursor: pointer;
    font-family: var(--ui); font-size: 12px; font-weight: 500;
    padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper-card); color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
    transition: background var(--t) var(--ease), color var(--t) var(--ease);
  }
  .cn-quick-chip:hover { background: var(--paper-2); color: var(--ink); }
  .cn-quick-chip .count {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 11px; font-weight: 600;
    padding: 1px 5px; border-radius: 999px;
    background: var(--paper-2); color: var(--muted);
  }
  .cn-quick-chip[data-flag="action"]   .count { background: var(--warn-soft); color: var(--warning-deep); }
  .cn-quick-chip[data-flag="training"] .count { background: var(--info-soft); color: var(--info-deep); }
  .cn-quick-chip[data-flag="review"]   .count { background: var(--accent-soft); color: var(--success-deep); }
  .cn-quick-chip[data-flag="unresolved"] .count { background: var(--destructive-soft); color: var(--danger-deep); }

  /* Compact mode reflows */
  :root[data-compact] .cn-head { grid-template-columns: 1fr; gap: 10px; }
  :root[data-compact] .cn-head-title { font-size: 22px; }
  :root[data-compact] .cn-stats-mini { width: 100%; }
  :root[data-compact] .cn-form-grid { grid-template-columns: repeat(2, 1fr); }
  :root[data-compact] .cn-field.span-2 { grid-column: span 2; }
  :root[data-compact] .cn-field.span-4 { grid-column: span 2; }
  :root[data-compact] .cn-field.row-2 { grid-row: span 1; }
  :root[data-compact] .cn-field textarea { min-height: 60px; }
  :root[data-compact] .cn-actions { flex-wrap: wrap; }
  :root[data-compact] .cn-actions-spacer { display: none; }
  :root[data-compact] .cn-action-prime { flex: 1; justify-content: center; }
  :root[data-compact] .cn-action-prime .kbd-chip { display: none; }
  @media (max-width: 720px) {
    .cn-form-grid { grid-template-columns: repeat(2, 1fr); }
    .cn-field.span-4 { grid-column: span 2; }
    .cn-head { grid-template-columns: 1fr; }
  }

  .cn-active-form {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  .cn-active-form-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 14px;
  }
  .cn-active-form-title {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--muted); letter-spacing: .14em; text-transform: uppercase;
  }
  .cn-active-form-hint {
    font-family: var(--mono); font-size: 10px;
    color: var(--muted); letter-spacing: .04em;
  }
  .cn-active-form-hint kbd {
    background: var(--paper-2); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px;
    font-family: var(--mono); font-size: 9px;
    color: var(--ink);
  }
  /* Today's note counter — small pill on the form header */
  .cn-note-counter {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px;
    background: var(--accent-soft); color: var(--info-deep);
    border-radius: 999px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    letter-spacing: .06em;
  }
  .cn-note-counter .cn-note-counter-lbl {
    text-transform: uppercase; opacity: .7; letter-spacing: .12em;
  }

  /* Training-question row — shown only when the training flag is selected */
  .cn-training-q-row {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed color-mix(in srgb, var(--accent), transparent 70%);
  }
  .cn-training-q-row label {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--info-deep); letter-spacing: .12em; text-transform: uppercase;
    margin-bottom: 5px; display: block;
  }
  .cn-training-q-row input {
    width: 100%; padding: 8px 11px;
    border: 1px solid color-mix(in srgb, var(--accent), transparent 60%);
    border-radius: var(--radius);
    font-family: var(--ui); font-size: 13px;
    background: var(--paper-card); color: var(--ink);
    outline: none;
  }
  .cn-training-q-row input:focus {
    border-color: var(--accent); box-shadow: var(--ring-focus);
  }

  /* Flag overflow menu — kebab button + dropdown for less-common flags */
  .cn-flag-more-wrap { position: relative; display: inline-flex; }
  .cn-flag-btn.cn-flag-more-btn.active.review {
    color: var(--success-deep); background: var(--good-soft);
  }
  .cn-flag-more-menu {
    position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md, 0 4px 16px rgba(0,0,0,.12));
    padding: 4px;
    z-index: 50;
    min-width: 220px;
  }
  .cn-flag-more-item {
    appearance: none; border: none; background: transparent;
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 8px 10px;
    border-radius: 6px;
    font-family: var(--ui); font-size: 13px;
    color: var(--ink); cursor: pointer;
    text-align: left;
  }
  .cn-flag-more-item:hover { background: var(--paper-2); }

  /* Optimistic-pending card — note is in the stack but not yet server-confirmed.
     Action buttons are replaced with a "Saving" badge so the rep can't
     interact with a row that doesn't exist server-side yet. */
  .cn-card.is-pending { opacity: 0.72; }
  .cn-pending-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
  }
  .cn-pending-dot {
    width: 6px; height: 6px; border-radius: 999px;
    background: var(--accent);
    animation: cn-pending-pulse 1s var(--ease) infinite;
  }
  @keyframes cn-pending-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .35; }
  }

  /* Training-question line on a saved card */
  .cn-card-training-q {
    display: flex; align-items: flex-start; gap: 6px;
    margin-top: 4px;
    font-family: var(--ui); font-size: 12px;
    color: var(--info-deep);
    font-style: italic;
  }
  .cn-card-training-q svg { flex-shrink: 0; margin-top: 2px; }
  /* Manager's reply to a training question — renders directly below the
     question with a green check so the rep sees at a glance that they got
     an answer. Non-italic since it's intentional manager output, not the
     rep's own question. */
  .cn-card-training-a {
    display: flex; align-items: flex-start; gap: 6px;
    margin-top: 2px;
    padding-left: 18px;  /* hangs under the question's icon */
    font-family: var(--ui); font-size: 12px;
    color: var(--success-deep);
  }
  .cn-card-training-a svg { flex-shrink: 0; margin-top: 2px; }

  .cn-form-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
  }
  .cn-form-field { display: flex; flex-direction: column; }
  .cn-form-field.full { grid-column: span 2; }
  .cn-form-field label {
    font-family: var(--mono);
    font-size: 10px; font-weight: 600; color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase;
    margin-bottom: 5px;
  }
  .cn-form-field input,
  .cn-form-field textarea {
    width: 100%; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: var(--radius);
    font-family: var(--ui);
    font-size: 13px; color: var(--ink); background: var(--paper-card);
    appearance: auto; outline: none;
    transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
  }
  .cn-form-field textarea { resize: vertical; min-height: 56px; line-height: 1.4; }
  .cn-form-field input:focus,
  .cn-form-field textarea:focus {
    border-color: var(--accent); box-shadow: var(--ring-focus);
  }
  .cn-form-actions {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .cn-form-flag-trio {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .cn-flag-btn {
    appearance: none; border: none; background: transparent;
    width: 28px; height: 28px; border-radius: 999px;
    cursor: pointer; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    transition: color var(--t) var(--ease), background var(--t) var(--ease);
    padding: 0;
  }
  .cn-flag-btn:hover { color: var(--ink); }
  .cn-flag-btn.active.action   { color: var(--warn);        background: var(--warn-soft); }
  .cn-flag-btn.active.training { color: var(--accent);      background: var(--accent-soft); }
  .cn-flag-btn.active.review   { color: var(--success-deep); background: var(--good-soft); }
  .cn-form-submit {
    flex: 1; min-width: 0;
    padding: 10px 14px;
    background: var(--ink); color: var(--paper-card);
    border: none; border-radius: var(--radius);
    font-family: var(--ui);
    font-size: 13px; font-weight: 500; letter-spacing: .02em;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background var(--t) var(--ease), box-shadow var(--t) var(--ease);
  }
  .cn-form-submit:hover:not(:disabled) {
    background: color-mix(in oklch, var(--ink), var(--accent) 18%);
    box-shadow: var(--shadow-sm);
  }
  .cn-form-submit:disabled { opacity: .5; cursor: not-allowed; }
  .cn-form-submit svg { width: 14px; height: 14px; }
  /* Secondary submit (Save & Compose) — outlined accent style so it reads
     as a distinct choice from the primary "Save & Copy" but still part of
     the same action group. */
  .cn-form-submit-secondary {
    flex: 0 1 auto;
    background: var(--paper-card);
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .cn-form-submit-secondary:hover:not(:disabled) {
    background: var(--accent-soft);
    color: var(--info-deep);
    box-shadow: var(--shadow-sm);
  }
  .cn-form-clear-btn {
    appearance: none; border: 1px solid var(--danger-deep);
    background: var(--danger-soft);
    padding: 9px 12px; border-radius: var(--radius);
    font-family: var(--ui);
    font-size: 12px; font-weight: 500;
    color: var(--danger-deep); cursor: pointer;
    transition: border-color var(--t) var(--ease), color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .cn-form-clear-btn:hover {
    background: var(--danger-deep); border-color: var(--danger-deep); color: white;
  }

  /* Operator feedback (2026-06-12 r3): delete-in-flight state — the card
     dims, desaturates, and "breathes" until the server confirms; clicks
     are blocked so the RPC can't be double-fired. */
  .cn-card.is-deleting, .tr-row.is-deleting {
    pointer-events: none;
    animation: cnCardDeleting 1s ease-in-out infinite;
    filter: grayscale(.7);
  }
  @keyframes cnCardDeleting {
    0%   { opacity: .55; transform: scale(1); }
    50%  { opacity: .3;  transform: scale(.985); }
    100% { opacity: .55; transform: scale(1); }
  }

  /* Suggested tags (heuristic — rep's own vocabulary matched against the
     Issue/Resolution text; the AI version is deliberately NOT built, it
     would send note text to a vendor — INV-119 posture). */
  .rail-tag-suggest { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 6px; }
  .rail-tag-suggest .sug-lbl { font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-2); }
  .rail-tag-suggest .sug-tag { font: inherit; font-size: 11px; border: 1px dashed var(--line); border-radius: 999px; background: var(--paper); color: var(--muted); padding: 2px 9px; cursor: pointer; }
  .rail-tag-suggest .sug-tag:hover { color: var(--accent-2); border-color: var(--accent); background: var(--accent-soft); }

  /* Manager per-rep card actions (item: manager delete from history) */
  .cn-mgr-card-actions { display: flex; justify-content: flex-end; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .cn-mgr-del-btn { font: inherit; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper-2); color: var(--danger-deep); cursor: pointer; padding: 4px 10px; }
  .cn-mgr-del-btn:hover { background: var(--danger-soft); border-color: var(--danger-deep); }

  /* ── Filter chips bar ───────────────────────────────────────────── */
  .cn-filter-bar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding-bottom: 4px;
  }
  .cn-filter-label {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .14em; text-transform: uppercase;
    margin-right: 4px;
  }
  .cn-filter-chip {
    appearance: none; border: 1px solid var(--line);
    background: var(--paper-card);
    padding: 4px 10px; border-radius: 999px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: color var(--t) var(--ease), border-color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .cn-filter-chip:hover { color: var(--ink); border-color: var(--border-strong); }
  .cn-filter-chip[aria-pressed="true"] {
    background: var(--ink); color: var(--paper-card);
    border-color: var(--ink);
  }
  .cn-filter-chip .chip-count {
    background: rgba(255,255,255,.18);
    padding: 1px 5px; border-radius: 999px;
    font-size: 9px;
  }
  .cn-filter-chip:not([aria-pressed="true"]) .chip-count {
    background: var(--paper-2); color: var(--muted);
  }
  /* Color-coded chip variants — picked up by cnRenderFilterBar_ */
  .cn-filter-chip.cn-fc-action:not([aria-pressed="true"])    { color: var(--warning-deep); border-color: color-mix(in srgb, var(--warn), transparent 70%); }
  .cn-filter-chip.cn-fc-action[aria-pressed="true"]          { background: var(--warn); border-color: var(--warn); color: white; }
  .cn-filter-chip.cn-fc-training:not([aria-pressed="true"])  { color: var(--info-deep); border-color: color-mix(in srgb, var(--accent), transparent 70%); }
  .cn-filter-chip.cn-fc-training[aria-pressed="true"]        { background: var(--accent); border-color: var(--accent); color: white; }
  .cn-filter-chip.cn-fc-review:not([aria-pressed="true"])    { color: var(--success-deep); border-color: color-mix(in srgb, var(--good), transparent 70%); }
  .cn-filter-chip.cn-fc-review[aria-pressed="true"]          { background: var(--good); border-color: var(--good); color: white; }

  /* ── Rolling stack — saved note cards ───────────────────────────── */
  .cn-stack-empty {
    text-align: center; color: var(--muted);
    font-size: 12px; padding: 18px 8px;
    font-family: var(--ui);
  }
  .cn-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    transition: box-shadow var(--t) var(--ease), border-color var(--t) var(--ease);
    animation: cn-card-in .25s var(--ease);
  }
  @keyframes cn-card-in {
    from { transform: translateY(-6px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .cn-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .cn-card.flag-action   { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--warn); }
  .cn-card.flag-training { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--accent); }
  .cn-card.flag-review   { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--good); }
  .cn-card.stale-action {
    animation: cn-card-in .25s var(--ease), cn-stale-pulse 2.4s var(--ease) infinite 1s;
  }
  @keyframes cn-stale-pulse {
    0%,100% { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--warn); }
    50%     { box-shadow: 0 0 0 3px var(--warn-soft), inset 3px 0 0 var(--warn); }
  }
  /* Urgent (Round 2 deferred 8e card-level) — danger-toned inset ring,
     declared AFTER flag-* + stale-action so its source-order specificity wins
     the ring color for a note that's also action/training/review flagged.
     'urgent' lives in subformData.flags only (never the FlagType column), so
     this keys off the is-urgent class set by cnIsUrgent_, not flag-*. */
  .cn-card.is-urgent { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--destructive); }
  .cn-urgent-pill {
    display: inline-flex; align-items: center; gap: 3px;
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 999px;
    background: var(--destructive-soft); color: var(--danger-deep);
    margin-left: 6px; vertical-align: middle;
  }
  .cn-card-row {
    display: flex; align-items: center; gap: 10px;
  }
  .cn-card-time {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    min-width: 50px;
  }
  .cn-card-main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .cn-card-caller {
    font-family: var(--ui); font-size: 13px; font-weight: 600;
    color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cn-card-caller .cn-trx {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--muted);
    margin-left: 6px;
  }
  .cn-card-issue {
    font-family: var(--ui); font-size: 12px;
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cn-card-actions {
    display: inline-flex; align-items: center; gap: 2px;
    flex-shrink: 0;
  }
  .cn-card-actions .cn-act-btn {
    appearance: none; border: none; background: transparent;
    width: 28px; height: 28px;
    border-radius: 999px;
    cursor: pointer; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    transition: color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .cn-card-actions .cn-act-btn:hover {
    background: var(--paper-2); color: var(--ink);
  }
  .cn-card-actions .cn-act-btn.is-on {
    background: #fef3cd; color: #856404;
  }
  .cn-card-actions .cn-act-btn.is-sent {
    background: var(--accent-soft); color: var(--info-deep);
  }
  /* Operator feedback (2026-06-12 r2): same per-type icon tint as the
     form's flag toolbar, applied to saved-note card actions even when OFF. */
  .cn-card-actions .cn-act-btn.action svg   { color: var(--warn); }
  .cn-card-actions .cn-act-btn.training svg { color: var(--info); }
  .cn-card-actions .cn-act-btn.review svg   { color: var(--accent); }
  .cn-card-actions .cn-act-btn.action.is-on   { background: var(--warn-soft);   color: var(--warning-deep); }
  .cn-card-actions .cn-act-btn.training.is-on { background: var(--accent-soft); color: var(--info-deep);    }
  .cn-card-actions .cn-act-btn.review.is-on   { background: var(--good-soft);   color: var(--success-deep); }
  .cn-card-actions .cn-act-btn.cn-urgent-toggle.is-on { background: var(--destructive-soft); color: var(--danger-deep); }
  .cn-more-menu {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 6px;
    padding: 2px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }

  /* Expanded edit-in-place inside a card */
  .cn-card.editing { padding: 14px; }
  .cn-card .cn-edit-fields {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
    margin-top: 10px;
  }
  .cn-card .cn-edit-fields .full { grid-column: span 2; }
  .cn-card .cn-edit-fields input,
  .cn-card .cn-edit-fields textarea {
    width: 100%; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: var(--radius);
    font-family: var(--ui); font-size: 12px;
    background: var(--paper-card); color: var(--ink); outline: none;
  }
  .cn-card .cn-edit-fields textarea { min-height: 44px; resize: vertical; line-height: 1.35; }
  .cn-card .cn-edit-footer {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px;
  }
  .cn-card .cn-edit-footer button {
    appearance: none; border: 1px solid var(--line);
    background: transparent; padding: 7px 12px;
    border-radius: var(--radius);
    font-family: var(--ui); font-size: 12px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    transition: border-color var(--t) var(--ease), color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .cn-card .cn-edit-footer button:hover { border-color: var(--border-strong); color: var(--ink); }
  .cn-card .cn-edit-footer .cn-save-btn {
    background: var(--ink); color: var(--paper-card); border-color: var(--ink);
  }
  .cn-card .cn-edit-footer .cn-save-btn:hover {
    background: color-mix(in oklch, var(--ink), var(--accent) 18%);
    border-color: color-mix(in oklch, var(--ink), var(--accent) 18%);
    color: var(--paper-card);
  }
  .cn-card .cn-edit-footer .cn-del-btn {
    margin-left: auto;
    color: var(--danger-deep); border-color: var(--line);
  }
  .cn-card .cn-edit-footer .cn-del-btn:hover {
    background: var(--destructive-soft);
    border-color: color-mix(in oklch, var(--destructive), transparent 50%);
  }

  /* Voice-to-text mic button — small inline glyph in the field's label.
     Hidden entirely when CONFIG.CALL_NOTES.VOICE_INPUT_ENABLED is false
     (cnVoiceMicMarkup_ returns empty string). */
  .cn-voice-mic {
    appearance: none; border: none; background: transparent;
    color: var(--muted); cursor: pointer;
    padding: 0; margin-left: 4px;
    vertical-align: middle;
    transition: color var(--t) var(--ease);
  }
  .cn-voice-mic:hover { color: var(--accent); }
  .cn-voice-mic.listening {
    color: var(--danger);
    animation: cn-mic-pulse 0.9s var(--ease) infinite;
  }
  @keyframes cn-mic-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .4; }
  }

  /* Pinned-notes tray — renders above the filter bar in the Log view.
     Visually distinguished from the rolling stack by a subtle background
     and a "Pinned" label. Empty state collapses to zero height. */
  #cn-pinned-tray:empty { display: none; }
  #cn-pinned-tray {
    background: color-mix(in srgb, var(--accent-soft), transparent 50%);
    border: 1px dashed color-mix(in srgb, var(--accent), transparent 60%);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .cn-pinned-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--info-deep); letter-spacing: .14em; text-transform: uppercase;
  }

  /* Manager training-reply editor — inline below training-flagged cards
     in the Per-Rep view. Lets the manager answer the rep's question in
     place without opening a separate modal. */
  .cn-mgr-reply-row {
    display: flex; align-items: center; gap: 6px;
    margin: 10px 0 0 28px;
    padding-top: 8px;
    border-top: 1px dashed color-mix(in srgb, var(--accent), transparent 75%);
  }
  .cn-mgr-reply-input {
    flex: 1; min-width: 0;
    padding: 7px 10px;
    border: 1px solid color-mix(in srgb, var(--accent), transparent 60%);
    border-radius: var(--radius);
    font-family: var(--ui); font-size: 12px;
    color: var(--ink); background: var(--paper-card);
    outline: none;
  }
  .cn-mgr-reply-input:focus { border-color: var(--accent); box-shadow: var(--ring-focus); }
  .cn-mgr-reply-save, .cn-mgr-reply-clear {
    appearance: none; border: 1px solid var(--line);
    background: transparent;
    padding: 6px 9px; border-radius: var(--radius);
    font-family: var(--ui); font-size: 11px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
    transition: border-color var(--t) var(--ease), color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .cn-mgr-reply-save:hover { background: var(--accent); color: white; border-color: var(--accent); }
  .cn-mgr-reply-clear:hover { color: var(--danger-deep); border-color: var(--danger); }

  /* ── Stale-flag badge in sidebar nav (count pill) ───────────────── */
  .cn-stale-badge {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--warn); color: white;
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px;
    margin-left: 6px;
  }

  /* ── Email composer modal ───────────────────────────────────────── */
  .cn-compose-section {
    border-top: 1px solid var(--line);
    padding-top: 14px; margin-top: 14px;
  }
  .cn-compose-section:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .cn-compose-section-title {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .cn-compose-section.sf-shipping { border-left: 3px solid var(--success-deep); padding-left: 14px; }
  .cn-compose-section.sf-close    { border-left: 3px solid var(--danger-deep);  padding-left: 14px; }
  .cn-compose-section.sf-resupply { border-left: 3px solid var(--success-deep); padding-left: 14px; }
  .cn-compose-section.sf-oop      { border-left: 3px solid #e67e22;             padding-left: 14px; }
  .cn-compose-note-ref {
    font-size: 12px; color: var(--muted); line-height: 1.5;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper-2); padding: 12px 14px; margin-top: 14px;
  }
  .cn-compose-note-ref dt { font-weight: 600; color: var(--ink); display: inline; }
  .cn-compose-note-ref dt::after { content: ': '; }
  .cn-compose-note-ref dd { display: inline; margin: 0; }
  .cn-compose-note-ref dd::after { content: '\A'; white-space: pre; }
  .cn-compose-dept-grid {
    display: grid;
    /* Operator feedback (2026-06-12 r2): adaptive columns — 3-up at the
       default modal width, gracefully fewer as the (resizable) modal
       narrows. The chips were two wide columns of mostly whitespace. */
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 6px;
  }
  .cn-dept-chip {
    appearance: none; border: 1px solid var(--line);
    background: var(--paper-card);
    padding: 6px 10px; border-radius: var(--radius);
    font-family: var(--ui); font-size: 12px;
    color: var(--ink); cursor: pointer;
    text-align: left;
    transition: border-color var(--t) var(--ease), background var(--t) var(--ease), color var(--t) var(--ease);
  }
  .cn-dept-chip:hover { border-color: var(--border-strong); }
  .cn-dept-chip[aria-pressed="true"] {
    background: var(--accent-soft); color: var(--info-deep);
    border-color: transparent;
    font-weight: 600;
  }
  .cn-compose-preview {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px;
    max-height: 50vh; overflow-y: auto;
    margin-top: 8px;
  }
  .cn-compose-preview-meta {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .cn-compose-preview-meta strong { color: var(--ink); }

  /* ── History date picker + section ──────────────────────────────── */
  .cn-history-picker {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .cn-history-picker input[type="date"] {
    padding: 7px 10px; border: 1px solid var(--line);
    border-radius: var(--radius); font-family: var(--ui);
    font-size: 13px; background: var(--paper-card); color: var(--ink);
    outline: none;
  }

  /* Manager Stats tab — per-rep daily summary now renders via mtRenderTable_;
     the legacy per-rep card CSS (.cn-stats-grid-outer/-card/-head/-name/-span/
     -total/-total-lbl/-grid/-row/-k/-v) was removed as dead (design rev E.4).
     Kept: .cn-stats-name-link (table cell) + .cn-stats-foot-note (below). */
  .cn-stats-foot-note {
    font-family: var(--ui); font-size: 11px; font-style: italic;
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  /* ── Search results ─────────────────────────────────────────────── */
  .cn-search-bar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .cn-search-bar input {
    flex: 1; min-width: 200px;
    padding: 9px 12px; border: 1px solid var(--line);
    border-radius: var(--radius); font-family: var(--ui);
    font-size: 13px; background: var(--paper-card); color: var(--ink);
    outline: none;
  }
  .cn-search-bar input:focus { border-color: var(--accent); box-shadow: var(--ring-focus); }
  .cn-search-result-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 11px 13px;
    margin-bottom: 8px;
  }
  .cn-search-result-meta {
    font-family: var(--mono); font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
    letter-spacing: .04em;
  }
  .cn-search-result-body {
    font-family: var(--ui); font-size: 12px;
    color: var(--ink); line-height: 1.5;
  }
  /* §7c/#4 — Admin Overview "System status" cards */
  .cn-sys-status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 900px; margin-bottom: 18px; }
  .cn-sys-card { padding: 12px 14px; }
  .cn-sys-card .cn-sys-h { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  .cn-sys-card .cn-sys-v { font-size: 1.05rem; font-weight: 700; color: var(--ink); }
  .cn-sys-card .cn-sys-s { font-size: 11px; color: var(--muted); margin-top: 2px; }
  @media (max-width: 640px) { .cn-sys-status { grid-template-columns: 1fr; } }
  /* 2nd-pass — System-details disclosure toggle (folds the full health panels) */
  .cn-sys-details-btn {
    appearance: none; cursor: pointer; margin: 4px 0 16px;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    background: none; border: none; padding: 4px 0;
    transition: color var(--t) var(--ease);
  }
  .cn-sys-details-btn:hover { color: var(--ink); }
  .cn-sys-details-btn .acc-chev { display: inline-flex; }
  .cn-sys-details-btn.open .acc-chev { transform: rotate(90deg); }

  /* §7a — search results in the real note-card vocabulary (read-only) */
  .cn-result-count { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; margin: 2px 0 10px; }
  .cn-result-count b { color: var(--ink); }
  .cn-card.cn-card-readonly .cn-card-actions { gap: 5px; align-items: flex-start; }
  .cn-result-rep { display: inline-block; margin-left: 6px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .cn-search-dates { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cn-search-dates input[type=date] { font: inherit; font-size: 12px; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-card); color: var(--ink); }
  .cn-search-dates label { font-size: 11px; color: var(--muted); }

  /* ── Training Q&A tray — recent answered training questions ──── */
  #cn-training-qa-tray:empty { display: none; }
  #cn-training-qa-tray {
    background: color-mix(in srgb, var(--good-soft), transparent 50%);
    border: 1px dashed color-mix(in srgb, var(--good), transparent 60%);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .cn-qa-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--success-deep); letter-spacing: .14em; text-transform: uppercase;
    cursor: pointer;
  }

// ════════════════════════════════════════════════════════════════════════════
//  CALL NOTES — view module

// Module state — separate from the time-clock locals to avoid collision.
const CN_STATE = {
  rollingNotes: [],          // last N saved notes for the rolling stack (newest first)

const CN_DEFAULT_FILTERS = ['all','action','training','review','unresolved','answered'];
const CN_CLEAR_UNDO_WINDOW_MS = 30000;  // window during which Ctrl/⌘+Z restores a just-cleared form
const CN_FORM_STARTED_LS_KEY = 'umsCallNotesFormStartedAt';  // persists across refresh so completion-time stays accurate
const CN_FORM_STICKY_LS_KEY  = 'umsCallNotesActiveFormDraft'; // sticky-form: in-progress draft restored on next load
// Draft TTL — the sticky draft carries PHI (patient name/TRX, issue text) in
// the browser's localStorage, so it must not linger indefinitely on a shared

const CN_FORM_STICKY_MAX_AGE_MS = 24 * 3600 * 1000;

// ── View enter handlers (called by the shell router) ────────────────────

function enterCallNotesView(area) {
  stopClock();
  CN_STATE.composer = null;
  CN_STATE.editingNoteId = null;
  CN_STATE.filter = 'all';
  cnPrewarmScript_();
  // Stale-while-revalidate: on a quick return, if the dept config is cached and
  // today's notes are warm + fresh, paint instantly (no spinner) and refresh in
  // the background with a subtle pill — the Apps Script RPC no longer gates the
  // repaint. The optimistic-UI mutations already keep CN_STATE.rollingNotes
  // current, so a cached repaint shows correct data. Falls through to the normal
  // spinner+fetch path on the first visit or once the freshness window lapses.
  if (CN_STATE.enrolled !== false && CN_STATE.deptConfig &&
      Array.isArray(CN_STATE.rollingNotes) &&
      typeof viewCacheFresh_ === 'function' && viewCacheFresh_(CN_STATE.rollingEntry)) {
    cnRenderNotesView(area);          // instant full paint (form + draft + stack)
    cnStartAmbientPolling_();
    if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(true);
    // Background refresh updates ONLY the stack (cnRefreshRollingStack_), never a
    // second full re-render — so the just-restored draft/nav-hint aren't re-run
    // and mid-typing isn't clobbered. It also preserves optimistic _pending notes.
    cnRefreshRollingStack_(function () {
      if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(false);
    });
    return;
  }
  renderLoading(area, 'Loading call notes…', 'adjust');
  // Guard the config-fetch continuation too: cnLoadToday_'s own guard
  // captures currentView only when THIS callback runs, so a nav-away during
  // a slow first config fetch would otherwise pass the inner guard, clobber
  // the new view's #view-area, and restart ambient polling on a non-CN tool
  // (M5 — the late-callback class the loaders already guard one layer down).
  const requestedView = currentView;
  cnFetchDeptConfigIfNeeded_(function () {
    if (currentView !== requestedView) return;
    cnLoadToday_(function () {
      cnRenderNotesView(area);
      cnStartAmbientPolling_();
    });
  });
}

/** Fire a no-op RPC on view enter to warm the Apps Script context. The cold
 *  start adds ~500ms to the first real RPC; with the iframe already warm,
 *  the rep's first submit/flag/email feels snappier. Fires at most once per
 *  page load. */
function cnPrewarmScript_() {
  if (CN_STATE.prewarmed) return;
  CN_STATE.prewarmed = true;
  google.script.run
    .withSuccessHandler(function () { /* noop */ })
    .withFailureHandler(function () { CN_STATE.prewarmed = false; })
    .cnPing();
}

function enterCallNotesHistoryView(area) {
  stopClock();
  if (!CN_STATE.historyDate) {
    // Default to "last 7 days" so a freshly-opened History view shows a
    // useful range rather than a single yesterday.
    const tz = (empState && empState.timezone) || 'UTC';
    const today = new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());
    const d7 = new Date(today + 'T12:00:00Z'); d7.setUTCDate(d7.getUTCDate() - 6);
    CN_STATE.historyDate = `${d7.getUTCFullYear()}-${pad(d7.getUTCMonth()+1)}-${pad(d7.getUTCDate())}`;
    CN_STATE.historyEndDate = today;
  }
  const start = CN_STATE.historyDate;
  const end = CN_STATE.historyEndDate || CN_STATE.historyDate;
  // Stale-while-revalidate: instant repaint when returning to the SAME range
  // within the freshness window (key carries the range so a different span never
  // paints from cache), then refresh the stack only behind the pill.
  if (CN_STATE.enrolled !== false && Array.isArray(CN_STATE.historyNotes) &&
      CN_STATE.historyEntry && CN_STATE.historyEntry.key === (start + ':' + end) &&
      typeof viewCacheFresh_ === 'function' && viewCacheFresh_(CN_STATE.historyEntry)) {
    cnRenderHistoryView(area);
    if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(true);
    const reqV = currentView;
    cnLoadDateRange_(start, end, function () {
      if (currentView !== reqV) return;
      cnRenderHistoryStack_();   // stack + summary only — never re-wires the date inputs
      if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(false);
    });
    return;
  }
  renderLoading(area, 'Loading history…', 'list');
  cnLoadDateRange_(start, end, function () {
    cnRenderHistoryView(area);
  });
}

function enterCallNotesSearchView(area) {
  stopClock();
  const requestedView = currentView;   // M5 — same guard as enterCallNotesView
  cnFetchDeptConfigIfNeeded_(function () {
    if (currentView !== requestedView) return;
    cnRenderSearchView(area);
  });
}

// ── Sent Forms view (read-only) ─────────────────────────────────────────────
// Lists every fillable form the rep has sent (getMySentForms is caller-scoped
// to FormTokens.CreatedBy). Closes the standalone-form gap: a form sent without
// a linked note has no card pill, so this is the only in-app way to find it.
// Strictly read-only — "View submission" reuses the caller-scoped read-only
// getFormSubmission viewer; submitted form responses are never editable.
function enterCallNotesFormsView(area) {
  stopClock();
  const requestedView = currentView;
  renderLoading(area, 'Loading sent forms…', 'outbox');
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView) return;
      if (res && res.error) { cnRenderSentFormsView_(area, null, res.error); return; }
      cnRenderSentFormsView_(area, (res && res.forms) || [], null);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      cnRenderSentFormsView_(area, null, (err && err.message) || 'Failed to load sent forms.');
    })
    .getMySentForms();
}

function cnRenderSentFormsView_(area, forms, errorMsg) {
  const compact = (typeof COMPACT_MODE !== 'undefined' && COMPACT_MODE);
  const head = compact
    ? cnCompactHeader_('Sent Forms', 'send')
    : '<div class="cn-head"><div>' +
        '<div class="cn-head-eyebrow">Fillable forms you’ve sent · read-only</div>' +
        '<h2 class="cn-head-title">Sent Forms</h2>' +
      '</div></div>';
  if (errorMsg) {
    area.innerHTML = head + '<div class="cn-sf-empty">' + esc(errorMsg) + '</div>';
    return;
  }
  if (!forms || forms.length === 0) {
    area.innerHTML = head + '<div class="cn-sf-empty">No fillable forms sent yet. ' +
      'Send one from the “Open Email” composer on the Log view.</div>';
    return;
  }
  const cards = forms.map(function (f) { return cnSentFormCardHtml_(f); }).join('');
  area.innerHTML = head + '<div class="cn-sf-list">' + cards + '</div>';
}

function cnSentFormCardHtml_(f) {
  const statusMap = {
    submitted: { label: 'Submitted', cls: 'sf-st-submitted' },
    pending:   { label: 'Awaiting',  cls: 'sf-st-pending' },
    expired:   { label: 'Expired',   cls: 'sf-st-expired' },
  };
  const st = statusMap[f.status] || { label: f.status || 'Unknown', cls: 'sf-st-pending' };
  const who = f.recipientName
    ? esc(f.recipientName) + ' · ' + esc(f.recipientEmail)
    : esc(f.recipientEmail);
  const created = f.createdAt ? esc(cnFormatTimestampForCopy_(f.createdAt)) : '';
  const standalone = f.noteId ? '' :
    '<span class="cn-sf-standalone" title="Not linked to a call note">standalone</span>';
  let action;
  if (f.submitted) {
    // Token is a UUID (no quotes/special chars) — safe to inline in onclick.
    action = '<button type="button" class="cn-sf-viewbtn" onclick="cnViewFormSubmission_(\'' +
      esc(f.token) + '\')">' + icon('list', 13) + ' View submission</button>';
  } else if (f.status === 'expired') {
    action = '<span class="cn-sf-hint">Link expired — re-send to collect this form.</span>';
  } else {
    action = '<span class="cn-sf-hint">Awaiting the recipient’s response.</span>';
  }
  return '<div class="cn-sf-card">' +
    '<div class="cn-sf-top">' +
      '<div class="cn-sf-name">' + esc(f.formName) + standalone + '</div>' +
      '<span class="cn-sf-status ' + st.cls + '">' + esc(st.label) + '</span>' +
    '</div>' +
    '<div class="cn-sf-meta">To ' + who + (created ? ' · ' + created : '') + '</div>' +
    '<div class="cn-sf-actions">' + action + '</div>' +
  '</div>';
}

function enterCallNotesManageView(area) {
