/** Sticky form: on view enter (after the form is rendered) restore the
 *  draft from localStorage. No-op if no draft exists. */
function cnRestoreActiveFormDraft_() {
  try {
    const raw = localStorage.getItem(CN_FORM_STICKY_LS_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    // PHI TTL: a draft older than CN_FORM_STICKY_MAX_AGE_MS is wiped, not
    // restored (shared-computer hygiene). Legacy drafts without `at` (saved
    // pre-TTL) restore this once and pick up a timestamp on the next persist.
    if (data && data.at && (Date.now() - data.at) > CN_FORM_STICKY_MAX_AGE_MS) {
      localStorage.removeItem(CN_FORM_STICKY_LS_KEY);
      cnFormTimerReset_();
      return false;
    }
    Object.keys(data.values || {}).forEach(function (k) {
      cnSetFieldValue_('cn-fld-' + k, data.values[k] || '');
    });
    const form = document.getElementById('cn-active-form');
    if (form) {
      if (Array.isArray(data.flags) && data.flags.length > 0) {
        cnSetFormFlags_(form, data.flags);
      } else if (data.flag) {
        cnSetFormFlags_(form, [data.flag]);
      }
      if (Array.isArray(data.tags) && data.tags.length > 0) {
        cnSetFormTags_(form, data.tags);
      }
    }
    if (data.trainingQ) cnSetFieldValue_('cn-fld-training-q', data.trainingQ);
    return true;
  } catch (e) { return false; }
}

function cnClearStickyFormDraft_() {
  try { localStorage.removeItem(CN_FORM_STICKY_LS_KEY); } catch (e) {}
}

/** Voice-to-text mic markup, gated on (a) CONFIG.CALL_NOTES.VOICE_INPUT_ENABLED
 *  and (b) the browser supporting webkitSpeechRecognition. Hidden entirely
 *  when off — no DOM element rendered, no surface area for accidents. */
function cnVoiceMicMarkup_(targetFieldId) {
  const cfg = CN_STATE.deptConfig || {};
  if (!cfg.voiceInputEnabled) return '';
  if (typeof window === 'undefined' || !('webkitSpeechRecognition' in window)) return '';
  return ` <button type="button" class="cn-voice-mic" data-target="${esc(targetFieldId)}"
                   onclick="cnVoiceStart_(this)" title="Dictate (beta — audio routed to your browser's speech service)">${icon('mic', 12)}</button>`;
}

/** Start (or stop, if already listening) voice recognition for the field
 *  identified by data-target. Click while listening to stop early. Browser
 *  prompts for mic permission on first use per origin. */
function cnVoiceStart_(btn) {
  if (!('webkitSpeechRecognition' in window)) return;
  const targetId = btn.dataset.target;
  const target = document.getElementById(targetId);
  if (!target) return;

  // Stop in-flight recognition if button is clicked again
  if (btn._recog) {
    try { btn._recog.stop(); } catch (e) {}
    return;
  }

  const recog = new window.webkitSpeechRecognition();
  recog.continuous = false;
  recog.interimResults = true;
  recog.lang = 'en-US';
  btn._recog = recog;
  btn.classList.add('listening');
  // Round 2 deferred 8e — handle both input/textarea (selectionStart-based
  // cursor) AND contenteditable .ce divs (textContent-append fallback —
  // simpler than full Selection API range handling for this off-by-default
  // feature, INV-53).
  const isCE = target.isContentEditable;
  const baseText = isCE ? (target.textContent || '') : (target.value || '');
  const startPos = isCE ? baseText.length : (target.selectionStart || 0);
  const before = isCE ? baseText : baseText.slice(0, startPos);
  const after = isCE ? '' : baseText.slice(target.selectionEnd);
  let finalText = '';
  recog.onresult = function (event) {
    let interim = '';
    finalText = '';
    for (let i = 0; i < event.results.length; i++) {
      if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      else interim += event.results[i][0].transcript;
    }
    const insertion = (before && !before.endsWith(' ') && !before.endsWith('\n')) ? ' ' : '';
    const next = before + insertion + finalText + interim + after;
    if (isCE) {
      target.textContent = next;
      target.classList.toggle('empty', !target.textContent.trim());
    } else {
      target.value = next;
    }
    target.dispatchEvent(new Event('input', { bubbles: true }));
  };
  recog.onend = function () {
    btn.classList.remove('listening');
    btn._recog = null;
    const insertion = (before && !before.endsWith(' ') && !before.endsWith('\n')) ? ' ' : '';
    if (isCE) {
      try { cnSetCursorToEnd_(target); target.focus(); } catch (e) {}
    } else {
      const newPos = before.length + insertion.length + finalText.length;
      try { target.setSelectionRange(newPos, newPos); target.focus(); } catch (e) {}
    }
  };
  recog.onerror = function (e) {
    btn.classList.remove('listening');
    btn._recog = null;
    showToast('Voice input error: ' + (e.error || 'unknown'), 'toast-error');
  };
  try { recog.start(); }
  catch (e) {
    btn.classList.remove('listening');
    btn._recog = null;
    showToast('Could not start mic: ' + e.message, 'toast-error');
  }
}

/** Format a phone number as the rep types — instant visual feedback instead
 *  of the prior format-on-read-only behavior. Mirrors the server's
 *  formatPhoneNumber_ output: "(555) 123-4567" for 10 digits,
 *  "+1 (555) 123-4567" for 11 starting with 1, "(555) 123-4567 x123" for
 *  extensions. Sub-10-digit inputs are formatted progressively as the rep
 *  fills in more digits. Cursor jumps to the end after format; for a number
 *  field this is the natural typing position. */
function cnFormatPhoneNumberInline_(input) {
  const raw = String(input == null ? '' : input);
  const digits = raw.replace(/\D/g, '');
  if (digits.length === 0) return '';
  if (digits.length <= 3) return '(' + digits;
  if (digits.length <= 6) return '(' + digits.slice(0,3) + ') ' + digits.slice(3);
  if (digits.length === 11 && digits.charAt(0) === '1') {
    return '+1 (' + digits.slice(1,4) + ') ' + digits.slice(4,7) + '-' + digits.slice(7);
  }
  if (digits.length <= 10) return '(' + digits.slice(0,3) + ') ' + digits.slice(3,6) + '-' + digits.slice(6);
  // 11+ digits not starting with 1 → treat the tail as an extension
  return '(' + digits.slice(0,3) + ') ' + digits.slice(3,6) + '-' + digits.slice(6,10) + ' x' + digits.slice(10);
}

/** Format `now` as the server's CN canonical timestamp ("yyyy-MM-dd'T'HH:mm:ss")
 *  in the given timezone. Used to build the pending-note timestamp client-side
 *  so the optimistic card renders with the right time. Server returns its own
 *  canonical timestamp; we replace the pending note when the RPC confirms. */
function cnNowInTz_(tz) {
  const fmt = new Intl.DateTimeFormat('sv-SE', {
    timeZone: tz || 'UTC',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false,
  });
  const parts = fmt.formatToParts(new Date());
  const get = function (k) {
    const p = parts.find(function (x) { return x.type === k; });
    return p ? p.value : '';
  };
  const date = get('year') + '-' + get('month') + '-' + get('day');
  const time = get('hour') + ':' + get('minute') + ':' + get('second');
  return { date: date, timestamp: date + 'T' + time };
}

/** Optimistic submit: build a "pending" note client-side, unshift to the
 *  rolling stack, auto-copy, clear the form, THEN fire the server RPC. On
 *  success the pending note is swapped for the server-confirmed one; on
 *  failure it's removed and the form values are restored to a snapshot so
 *  the rep doesn't lose what they typed.
 *
 *  Why: Apps Script RPC adds ~300–800ms; with optimistic UI the rep sees
 *  the same speed as pasting into a Sheet. The form is ready for the next
 *  call before the server has even acknowledged the previous one.
 *
 *  opts.onConfirmed(note): called with the server's confirmed note after
 *  it successfully lands. Used by the Save-Copy-Compose button to open
 *  the composer with the real noteId once the server has assigned one. */
function cnSubmitActiveForm_(opts) {
  // F(cycle-8 M-3): while a Save & Compose flow is active the form KEEPS its
  // content (transactional compose, r3) — so any further submit before the
  // flow settles (send / cancel / failure) would write a DUPLICATE row from
  // the same text. Refuse re-entry; the flow's own teardown paths all clear
  // CN_STATE.composeFlow, so this can never wedge.
  if (CN_STATE.composeFlow) {
    showToast('Still saving this note — one moment…', 'toast-info');
    return;
  }
  const requestedView = currentView;
  const payload = cnReadActiveForm_();
  if (!payload.callback && !payload.caller && !payload.patientAndTrx && !payload.issue && !payload.resolution) {
    showToast('Note is empty — fill at least one field', 'toast-warn');
    // F(L-20): Save & Compose mounts its "Saving the note…" envelope BEFORE
    // this validation — tear it down or it sits on screen forever.
    cnCloseComposerLoadingIfPending_();
    return;
  }

  // Capture completion-time and fold into subformData for the server. Not
  // visible to the rep here; the manager Stats tab surfaces the median.
  const completionSeconds = cnFormTimerEndAndGet_();
  if (completionSeconds != null) {
    payload.subformData = payload.subformData || {};
    payload.subformData.completionSeconds = completionSeconds;
  }

  // Build the pending note. Uses the rep's tz so the time renders correctly
  // even before the server responds.
  const empTz = CN_STATE.empTz || (empState && empState.timezone) || 'UTC';
  const nowTs = cnNowInTz_(empTz);
  const pendingId = 'pending_' + Math.random().toString(36).slice(2, 12);
  const pendingNote = {
    noteId: pendingId,
    timestamp: nowTs.timestamp,
    dateLocal: nowTs.date,
    callback: payload.callback,
    caller: payload.caller,
    relationship: payload.relationship,
    patientAndTrx: payload.patientAndTrx,
    issue: payload.issue,
    transferredTo: payload.transferredTo,
    resolution: payload.resolution,
    flagType: payload.flagType || '',
    resolved: false,
    emailedAt: '',
    emailDepartments: '',
    subform: '',
    subformData: payload.subformData || null,
    _pending: true,
  };

  // Snapshot the form values so we can restore them on server failure
  // (otherwise the rep loses what they typed when the optimistic clear fires).
  const restoreSnapshot = {
    values: {
      callback: payload.callback, caller: payload.caller, relationship: payload.relationship,
      patient: payload.patientAndTrx, issue: payload.issue,
      transferred: payload.transferredTo, resolution: payload.resolution,
    },
    flag: payload.flagType || '',
    // Capture the full multi-select flag array (incl. 'urgent') + tags so a
    // failed-submit revert restores them too — cnRestoreFromSnapshot_ prefers
    // snap.flags / snap.tags over the single snap.flag (INV-48 / Round 2·8e).
    flags: Array.isArray(payload.flags) ? payload.flags.slice() : null,
    tags: Array.isArray(payload.tags) ? payload.tags.slice() : null,
    trainingQ: (payload.subformData && payload.subformData.trainingQuestion) || '',
  };

  // Optimistic path — runs synchronously, well under one frame:
  // 1. Put the note in the stack so it renders immediately
  CN_STATE.rollingNotes.unshift(pendingNote);
  // 2. Copy to clipboard NOW so the rep can paste into the CRM without waiting
  cnAutoCopyNote_(pendingNote);
  if (opts && opts.keepForm) {
    // Operator feedback (2026-06-12 r3): Save & Compose is TRANSACTIONAL —
    // the form keeps its text while the composer is open. Send success
    // completes the action (form clears then); cancelling the composer
    // rolls the save back (the saved note is deleted, text stays put).
    CN_STATE.composeFlow = { note: pendingNote, snap: restoreSnapshot };
  } else {
    // 3. Clear the form so the rep can start the next call
    cnClearActiveForm_({ skipSnapshot: true });
    // Arm Ctrl/Cmd+Z undo-of-save: holds the live note reference + the
    // restore snapshot. (The reference is re-pointed at the server's
    // confirmed note object in the success handler below — the array slot
    // is REPLACED, not mutated, so holding pendingNote alone goes stale.)
    CN_STATE.lastSaveUndo = { note: pendingNote, snap: restoreSnapshot, at: Date.now() };
    cnFormTimerReset_();
    cnClearStickyFormDraft_();
  }
  // 4. Re-render
  cnRenderStack_();
  cnRenderFilterBar_();
  showToast('Saved · copied to clipboard', 'toast-success');

  // Server sync in background
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        // Cycle-9 M-4: a STRUCTURED failure ({success:false} — enrollment /
        // validation errors) must run the same teardown as the throw path
        // below, or a Save & Compose flow wedges: composeFlow blocks every
        // further submit ("Still saving…") and the envelope overlay sits on
        // screen until an Esc runs a misleading rollback.
        CN_STATE.composeFlow = null;
        cnCloseComposerLoadingIfPending_();
        cnRevertPendingSubmit_(pendingId, restoreSnapshot, res.error || 'Save failed');
        return;
      }
      const idx = CN_STATE.rollingNotes.findIndex(function (n) { return n.noteId === pendingId; });
      if (idx >= 0) {
        CN_STATE.rollingNotes[idx] = res.note;
        if (currentView === requestedView) {
          cnRenderStack_();
          cnRenderFilterBar_();
        }
      }
      // The array slot was REPLACED — re-point any held references at the
      // confirmed note so undo-save / the compose flow see the real noteId
      // (holding the stale pending object reported "_pending" forever).
      if (CN_STATE.lastSaveUndo && CN_STATE.lastSaveUndo.note === pendingNote) {
        CN_STATE.lastSaveUndo.note = res.note;
      }
      if (CN_STATE.composeFlow && CN_STATE.composeFlow.note === pendingNote) {
        CN_STATE.composeFlow.note = res.note;
      }
      // Composer was cancelled while the save was still in flight → finish
      // the rollback now that the server row exists, and skip the composer.
      if (pendingNote._deleteOnConfirm) {
        cnDoDeleteNote_(res.note.noteId, { toast: 'Compose cancelled — save undone, your text is still in the form' });
        return;
      }
      if (opts && typeof opts.onConfirmed === 'function' && currentView === requestedView) {
        try { opts.onConfirmed(res.note); } catch (e) {}
      }
    })
    .withFailureHandler(function (err) {
      CN_STATE.composeFlow = null;          // save failed — nothing to roll back
      cnCloseComposerLoadingIfPending_();   // tear down a waiting Save & Compose envelope
      cnRevertPendingSubmit_(pendingId, restoreSnapshot, 'Save failed: ' + (err.message || 'unknown'));
    })
    .submitCallNote(payload);
}

/** Roll back an optimistic submit: drop the pending card from the stack and
 *  show an error toast. The typed content is recovered WITHOUT ever clobbering
 *  newer work (the rep may have started the next note during the in-flight
 *  save, or navigated away):
 *    - form present and still empty → restore the snapshot in place;
 *    - form has new typing → leave it alone; the failed note stays on the
 *      clipboard (set by the optimistic copy);
 *    - form gone (navigated away) → park the snapshot in the sticky-draft
 *      slot so the next Log view restores it ("Draft restored"). */
function cnRevertPendingSubmit_(pendingId, snapshot, message) {
  CN_STATE.rollingNotes = CN_STATE.rollingNotes.filter(function (n) { return n.noteId !== pendingId; });
  cnRenderStack_();
  cnRenderFilterBar_();
  let outcome = '';
  if (snapshot) {
    const form = document.getElementById('cn-active-form');
    // Same 5-field emptiness check as the Ctrl/⌘+Z restore path.
    const formEmpty = !cnGetFieldValue_('cn-fld-callback').trim()
      && !cnGetFieldValue_('cn-fld-caller').trim()
      && !cnGetFieldValue_('cn-fld-patient').trim()
      && !cnGetFieldValue_('cn-fld-issue').trim()
      && !cnGetFieldValue_('cn-fld-resolution').trim();
    if (form && formEmpty) {
      cnRestoreFromSnapshot_(snapshot);
      outcome = ' — note restored to the form';
    } else if (form) {
      outcome = ' — the unsaved note is on your clipboard (your current typing was left untouched)';
    } else {
      cnSaveSnapshotAsStickyDraft_(snapshot);
      outcome = ' — the unsaved note was kept as a draft (restores on the Log view) and is on your clipboard';
    }
  }
  showToast(message + outcome, 'toast-error');
}

/** Park a failed-submit snapshot in the sticky-draft slot (same shape
 *  cnPersistActiveFormDraft_ writes / cnRestoreActiveFormDraft_ reads) so a
 *  rep who navigated away mid-save gets the note back on their next Log view
 *  enter instead of losing it. Carries an `at` stamp for the PHI TTL. */
function cnSaveSnapshotAsStickyDraft_(snap) {
  try {
    localStorage.setItem(CN_FORM_STICKY_LS_KEY, JSON.stringify({
      values: snap.values || {},
      flags: Array.isArray(snap.flags) ? snap.flags : (snap.flag ? [snap.flag] : []),
      tags: Array.isArray(snap.tags) ? snap.tags : [],
      flag: snap.flag || '',
      trainingQ: snap.trainingQ || '',
      at: Date.now(),
    }));
  } catch (e) { /* localStorage unavailable — the clipboard copy is the fallback */ }
}

function cnAutoCopyNote_(note) {
  const text = cnFormatNoteForCopy_(note);
  // Try the modern clipboard API first; fall back to textarea+execCommand
  // since HtmlService iframes sometimes deny clipboard permissions.
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { cnFallbackCopy_(text); });
  } else {
    cnFallbackCopy_(text);
  }
}

function cnFallbackCopy_(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  } catch (e) { /* clipboard truly unavailable; toast is the only signal */ }
}

function cnFormatNoteForCopy_(note) {
  // Default mirrors the server's CONFIG.CALL_NOTES.AUTO_COPY_FORMAT so first
  // copies (before cnLoadToday_ populates autoCopyFormat) use the same shape.
  const fmt = CN_STATE.autoCopyFormat
    || ('Callback Number: {callback}\n' +
        'Caller Name: {caller}\n' +
        'Relationship: {relationship}\n' +
        'Patient & TRX: {patientAndTrx}\n' +
        'Issue: {issue}\n' +
        'Transferred To: {transferredTo}\n' +
        'Resolution: {resolution}');
  // Transferred-to defaults to "N/A" when blank so the pasted note has a clear
  // "no transfer" signal (most calls aren't escalated) — matches the email body
  // default in callDataFromNote_ server-side.
  const transferred = (note.transferredTo && note.transferredTo.trim()) || 'N/A';
  // Single-pass substitution with a FUNCTION replacement (L12): user text fed
  // to String.replace as a string replacement gets $-pattern expansion (`$$`
  // collapsed to `$`, `$&` echoed the token), and the old chained replaces
  // token-expanded a literal "{resolution}" typed into an earlier field.
  // Unknown tokens pass through unchanged (operator template safety).
  const map = {
    timestamp:     cnFormatTimestampForCopy_(note.timestamp),
    callback:      note.callback || '',
    caller:        note.caller || '',
    relationship:  note.relationship || '',
    patientAndTrx: note.patientAndTrx || '',
    issue:         note.issue || '',
    transferredTo: transferred,
    resolution:    note.resolution || '',
  };
  return fmt.replace(/\{(\w+)\}/g, function (m, key) {
    return Object.prototype.hasOwnProperty.call(map, key) ? map[key] : m;
  });
}


function cnFormatTimestampForCopy_(iso) {
  if (!iso) return '';
  // iso is "yyyy-MM-dd'T'HH:mm:ss" in the rep's tz; show "h:mm AM/PM"
  const m = iso.match(/T(\d{2}):(\d{2})/);
  if (!m) return iso;
  let h = parseInt(m[1], 10);
  const min = m[2];
  const ampm = h >= 12 ? 'PM' : 'AM';
  if (h === 0) h = 12; else if (h > 12) h -= 12;
  return `${h}:${min} ${ampm}`;
}

// ── Rolling stack render ───────────────────────────────────────────────

/** F(cycle-8): snapshot the OPEN inline editor's typed values before a stack
 *  re-render and restore them after. cnRefreshRollingStack_ already skips
 *  while an edit is open, but OTHER cnRenderStack_ callers (a slow optimistic
 *  submit confirming, a pin toggle's tray reload) rebuild the editing card
 *  from the note's STORED values — silently discarding everything typed since
 *  the editor opened. */
function cnEditSnapshot_() {
  if (!CN_STATE.editingNoteId) return null;
  const fields = document.querySelectorAll('[id^="cnE-"]');
  if (!fields.length) return null;
  const vals = {};
  fields.forEach(function (el) {
    vals[el.id] = el.isContentEditable ? el.textContent : el.value;
  });
  return { active: document.activeElement && document.activeElement.id, vals: vals };
}
function cnEditRestore_(snap) {
  if (!snap || !CN_STATE.editingNoteId) return;
  Object.keys(snap.vals).forEach(function (id) {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.isContentEditable) el.textContent = snap.vals[id];
    else el.value = snap.vals[id];
  });
  if (snap.active && /^cnE-/.test(snap.active)) {
    const el = document.getElementById(snap.active);
    if (el) try { el.focus(); } catch (e) {}
  }
}

function cnRenderStack_() {
  const stack = document.getElementById('cn-stack');
  if (!stack) return;
  const editSnap = cnEditSnapshot_();
  // Pinned notes render in the dedicated tray above; exclude them from the
  // rolling stack so they don't appear twice on the page.
  const pinnedIds = {};
  (CN_STATE.pinnedNotes || []).forEach(function (n) { pinnedIds[n.noteId] = true; });
  const filtered = CN_STATE.rollingNotes.filter(function (n) {
    if (pinnedIds[n.noteId]) return false;
    return cnNoteMatchesFilter_(n, CN_STATE.filter);
  });
  if (filtered.length === 0) {
    stack.innerHTML = `<div class="cn-stack-empty">No notes match this filter for today.</div>`;
    return;
  }
  const head = filtered.slice(0, CN_ROLLING_STACK_MAX);
  let html = head.map(cnRenderCard_).join('');
  if (filtered.length > CN_ROLLING_STACK_MAX) {
    html += `<div class="cn-stack-empty">
      ${filtered.length - CN_ROLLING_STACK_MAX} more from earlier today —
      <a href="#" onclick="event.preventDefault(); showView('callNotesHistory');" style="color:var(--accent);text-decoration:none;font-weight:500;">view in History</a>
    </div>`;
  }
  stack.innerHTML = html;
  cnWireCards_(stack);
  cnEditRestore_(editSnap);   // F(cycle-8): typed edit values survive the re-render
}

function cnInstallCardDelegation_(area) {
  if (area._cnDelegationInstalled) return;
  area._cnDelegationInstalled = true;
  area.addEventListener('click', function (e) {
    // Round 2 · 8g — Q&A thread action buttons (👍 ack, 💬 clarify, send)
    var qaAck = e.target.closest('[data-qa-ack]');
    if (qaAck) { cnAckTrainingFlag_(qaAck.getAttribute('data-qa-ack')); return; }
    var qaClar = e.target.closest('[data-qa-clarify]');
    if (qaClar) {
      var nid = qaClar.getAttribute('data-qa-clarify');
      var row = area.querySelector('[data-qa-clarify-row="' + nid + '"]');
      if (row) { row.hidden = !row.hidden; if (!row.hidden) { var ta = row.querySelector('textarea'); if (ta) ta.focus(); } }
      return;
    }
    if (e.target.classList && e.target.classList.contains('qa-clarify-submit')) {
      var row2 = e.target.closest('[data-qa-clarify-row]');
      var ta2 = row2 && row2.querySelector('textarea');
      var nid2 = row2 && row2.getAttribute('data-qa-clarify-row');
      if (nid2 && ta2) cnSubmitClarification_(nid2, ta2.value);
      return;
    }
    var btn = e.target.closest('[data-cn-action]');
    if (!btn) return;
    var card = btn.closest('[data-note-id]');
    if (!card) return;
    var noteId = card.dataset.noteId;
    switch (btn.dataset.cnAction) {
      case 'flag':        cnToggleFlag_(noteId, btn.dataset.flagKind); break;
      case 'flag-urgent': cnToggleUrgent_(noteId); break;
      case 'resolve':     cnToggleResolved_(noteId); break;
      case 'pin':         cnTogglePinned_(noteId); break;
      case 'copy':        cnCopyNoteAgain_(noteId); break;
      case 'email':       cnOpenEmailComposer_(noteId); break;
      case 'edit':        cnBeginEdit_(noteId); break;
      case 'save-edit':   cnSaveEdit_(noteId); break;
      case 'cancel-edit': cnCancelEdit_(noteId); break;
      case 'delete':      cnDeleteNote_(noteId); break;
      case 'find-trx':    cnFindPriorCallsForTrx_(btn.dataset.trx); break;
      case 'timeline':    cnOpenPatientTimeline_(btn.dataset.trx); break;
      case 'view-form':   cnViewFormSubmission_(btn.dataset.token); break;
      case 'more':        cnToggleMoreMenu_(btn); break;
    }
  });

  // Cmd/Ctrl+Enter saves an in-progress inline edit. Delegated on the
  // persistent view container (not the edit field itself) so it survives a
  // re-render mid-edit — an optimistic flag toggle or ambient refresh
  // recreates the edit field, which would otherwise lose a per-element
  // listener and drop the shortcut.
  area.addEventListener('keydown', function (e) {
    if (!((e.metaKey || e.ctrlKey) && e.key === 'Enter')) return;
    if (!e.target.closest) return;
    if (!e.target.closest('[id^="cnE-"]')) return;
    var card = e.target.closest('[data-note-id]');
    if (!card) return;
    e.preventDefault();
    cnSaveEdit_(card.dataset.noteId);
  });
}

/** Round 2 · 8g — agent posts a 👍 acknowledgment to a manager's training
 *  feedback. Fires appendCallNoteFeedback(noteId, '', 'ack'). On success,
 *  replaces the note in CN_STATE and re-renders the active view. */
// F(L-25): per-note in-flight guard for the Q&A ack/clarify buttons — the
// INV-56 discipline the other card toggles already have. feedback[] is
// append-only server-side, so a double-click permanently wrote duplicate
// "Got it"/clarification entries into the thread the manager reads.
var CN_QA_INFLIGHT = {};

function cnAckTrainingFlag_(noteId) {
  if (CN_QA_INFLIGHT[noteId]) return;
  CN_QA_INFLIGHT[noteId] = true;
  google.script.run
    .withSuccessHandler(function (res) {
      delete CN_QA_INFLIGHT[noteId];
      if (!res || !res.success) {
        if (typeof showToast === 'function') showToast((res && res.error) || 'Could not save acknowledgment', 'toast-error');
        return;
      }
      if (typeof cnReplaceNoteInState_ === 'function') cnReplaceNoteInState_(res.note);
      if (typeof cnReRenderActiveView_ === 'function') cnReRenderActiveView_();
      if (typeof showToast === 'function') showToast('Acknowledged', 'toast-success');
    })
    .withFailureHandler(function (err) {
      delete CN_QA_INFLIGHT[noteId];
      if (typeof showToast === 'function') showToast((err && err.message) || 'Server error', 'toast-error');
    })
    .appendCallNoteFeedback(noteId, '', 'ack');
}

/** Round 2 · 8g — agent submits a 💬 clarification (free-text follow-up).
 *  Fires appendCallNoteFeedback(noteId, message, 'clarification'). */
function cnSubmitClarification_(noteId, message) {
  const trimmed = String(message || '').trim();
  if (!trimmed) {
    if (typeof showToast === 'function') showToast('Type a question first', 'toast-warn');
    return;
  }
  if (CN_QA_INFLIGHT[noteId]) return;   // F(L-25)
  CN_QA_INFLIGHT[noteId] = true;
  google.script.run
    .withSuccessHandler(function (res) {
      delete CN_QA_INFLIGHT[noteId];
      if (!res || !res.success) {
        if (typeof showToast === 'function') showToast((res && res.error) || 'Could not send', 'toast-error');
        return;
      }
      if (typeof cnReplaceNoteInState_ === 'function') cnReplaceNoteInState_(res.note);
      if (typeof cnReRenderActiveView_ === 'function') cnReRenderActiveView_();
      if (typeof showToast === 'function') showToast('Sent', 'toast-success');
    })
    .withFailureHandler(function (err) {
      delete CN_QA_INFLIGHT[noteId];
      if (typeof showToast === 'function') showToast((err && err.message) || 'Server error', 'toast-error');
    })
    .appendCallNoteFeedback(noteId, trimmed, 'clarification');
}

function cnReRenderActiveView_() {
  if (currentView === 'callNotes') {
    cnRenderStack_();
    // M-3 (cycle 10): the pinned tray renders full-action cards via
    // cnRenderCard_ but was never re-rendered by action handlers — a flag /
    // resolve / QA change on a pinned card left the tray visuals stale, and
    // Edit on a pinned note (deduped OUT of the stack) rendered its editor
    // NOWHERE while `editingNoteId` stayed set, freezing the 60s live
    // refresh (its open-edit skip) until the rep re-entered the view.
    // Re-rendering the tray here makes the inline editor appear in the tray
    // card and keeps ring/pill/button state live.
    cnRenderPinnedTray_();
  } else if (currentView === 'callNotesHistory') {
    cnRenderHistoryStack_();
  }
}

// F9 — outside-click / Escape dismissal for the card "More" popover. The closer
// is a SINGLE self-removing document listener (capture phase), so there's no
// accumulating-listener leak: it's detached the moment the menu closes, and a
// stale closer (after a re-render recreates the card) self-heals on the next
// document mousedown (closes whatever .cn-more-menu is currently open + detaches).
var _cnMoreMenuCloser = null;
function cnCloseMoreMenus_() {
  document.querySelectorAll('.cn-more-menu').forEach(function (m) { m.style.display = 'none'; });
  if (_cnMoreMenuCloser) {
    document.removeEventListener('mousedown', _cnMoreMenuCloser, true);
    document.removeEventListener('keydown', _cnMoreMenuCloser, true);
    _cnMoreMenuCloser = null;
  }
}
function cnToggleMoreMenu_(btn) {
  var card = btn.closest('[data-note-id]');
  if (!card) return;
  var menu = card.querySelector('.cn-more-menu');
  if (!menu) return;
  var willOpen = !menu.style.display || menu.style.display === 'none';
  cnCloseMoreMenus_();          // close any other open menu + detach its closer
  if (!willOpen) return;        // it was open → this click toggles it closed
  menu.style.display = 'inline-flex';
  _cnMoreMenuCloser = function (e) {
    if (e.type === 'keydown') { if (e.key === 'Escape' || e.key === 'Esc') cnCloseMoreMenus_(); return; }
    if (menu.contains(e.target) || btn.contains(e.target)) return;   // click inside the menu / on the toggle
    cnCloseMoreMenus_();
  };
  // Bound from the opening CLICK handler, so this interaction's mousedown has
  // already passed — the next mousedown is a fresh interaction.
  document.addEventListener('mousedown', _cnMoreMenuCloser, true);
  document.addEventListener('keydown', _cnMoreMenuCloser, true);
}

/** Caller display for note cards (view-only — the CRM paste/email keep
 *  Relationship as its own structured line). Bold caller name, then the
 *  relationship in parentheses (muted, non-bold), suppressed when blank or
 *  "self" (case-insensitive). Falls back to patient/TRX, then "unnamed".
 *  Shared by the rep card + the manager read-only card. */
function cnCallerDisplay_(note) {
  if (!note.caller) {
    return note.patientAndTrx ? esc(note.patientAndTrx) : '<em style="color:var(--muted)">unnamed</em>';
  }
  const rel = (note.relationship || '').trim();
  const relBit = (rel && rel.toLowerCase() !== 'self')
    ? ` <span class="cn-card-rel" style="color:var(--muted);font-weight:400;">(${esc(rel)})</span>` : '';
  return esc(note.caller) + relBit;
}

function cnRenderCard_(note) {
  return cnRenderCardCore_(note, /*expandable*/ true);
}

function cnRenderCardCore_(note, expandable) {
  const isEditing = expandable && CN_STATE.editingNoteId === note.noteId;
  const time = cnFormatTimestampForCopy_(note.timestamp);
  const flagCls = note.flagType ? ' flag-' + note.flagType : '';
  const isStale = note.flagType === 'action' && !note.resolved && cnNoteIsStale_(note);
  const staleCls = isStale ? ' stale-action' : '';
  const isUrgent = cnIsUrgent_(note);
  const urgentCls = isUrgent ? ' is-urgent' : '';
  const pendingCls = note._pending ? ' is-pending' : '';

  if (isEditing) {
    return `
      <div class="cn-card editing${flagCls}" data-note-id="${esc(note.noteId)}">
        <div class="cn-card-row" style="margin-bottom:6px">
          <span class="cn-card-time tabular">${esc(time)}</span>
          <div class="cn-card-main">
            <span class="cn-card-caller" style="opacity:.65">Editing — Ctrl/⌘+Enter saves</span>
          </div>
          <div class="cn-card-actions">
            <button class="cn-act-btn" title="Discard edits" data-cn-action="cancel-edit">${icon('x', 14)}</button>
          </div>
        </div>
        <div class="cn-edit-fields">
          <div><input type="text" placeholder="Callback" id="cnE-callback-${esc(note.noteId)}" value="${esc(note.callback || '')}"></div>
          <div><input type="text" placeholder="Caller" id="cnE-caller-${esc(note.noteId)}" value="${esc(note.caller || '')}"></div>
          <div><input type="text" placeholder="Relationship" id="cnE-relationship-${esc(note.noteId)}" value="${esc(note.relationship || '')}"></div>
          <div><input type="text" placeholder="Patient & TRX" id="cnE-patient-${esc(note.noteId)}" value="${esc(note.patientAndTrx || '')}"></div>
          <div class="full"><textarea placeholder="Issue" id="cnE-issue-${esc(note.noteId)}" rows="2">${esc(note.issue || '')}</textarea></div>
          <div><input type="text" placeholder="Transferred To" id="cnE-transferred-${esc(note.noteId)}" value="${esc(note.transferredTo || '')}"></div>
          <div><textarea placeholder="Resolution" id="cnE-resolution-${esc(note.noteId)}" rows="1">${esc(note.resolution || '')}</textarea></div>
        </div>
        <div class="cn-edit-footer">
          <button class="cn-save-btn" data-cn-action="save-edit">${icon('check', 12)} Save</button>
          <button data-cn-action="cancel-edit">Cancel</button>
          <button class="cn-del-btn" data-cn-action="delete">${icon('trash', 12)} Delete</button>
        </div>
      </div>
    `;
  }

  const callerLine = cnCallerDisplay_(note);
  const trxBit = note.caller && note.patientAndTrx ? `<span class="cn-trx">${esc(note.patientAndTrx)}</span>` : '';
  const issue = note.issue ? esc(note.issue) : '<em>—</em>';
  // Training notes carry a free-text question in subformData; surface it as a
  // distinct sub-line under the issue so the rep (and a manager peeking) can
  // see what's being asked at a glance. If the manager has written a reply,
  // it renders directly below the question as an answer line.
  const detailParts = [];
  if (note.callback) detailParts.push(esc(note.callback));
  if (note.relationship) detailParts.push(esc(note.relationship));
  if (note.transferredTo) detailParts.push('→ ' + esc(note.transferredTo));
  const detailLine = detailParts.length > 0
    ? `<div style="font-size:11px;color:var(--muted);margin-top:1px">${detailParts.join(' · ')}</div>` : '';
  const resolutionLine = note.resolution
    ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">↳ ${esc(note.resolution)}</div>` : '';
  // Round 2 · 8g — render multi-turn Q&A thread for training-flagged notes.
  // Reads subformData.feedback[] (new shape) and falls back to the legacy
  // trainingQuestion + trainingReply pair for older notes.
  const trainingQ = cnRenderQAThread_(note);

  // Round 2 deferred 8e — card-level flag buttons recognise 'urgent' too.
  // FlagType column still holds only action/training/review (server-side
  // sanitizeFlagType_ unchanged); 'urgent' lives in subformData.flags so
  // toggling it via the card still goes through cnToggleFlag_ → server.
  const flagBtn = function (kind, name, on) {
    const cls = 'cn-act-btn ' + kind + (on ? ' is-on' : '');
    const lbl = kind === 'action' ? 'Flag for action'
              : kind === 'training' ? 'Flag for training'
              : kind === 'review' ? 'Flag as review candidate'
              : kind === 'urgent' ? 'Mark urgent'
              : 'Flag';
    return `<button class="${cls}" title="${lbl}" data-cn-action="flag" data-flag-kind="${kind}">${icon(name, 14)}</button>`;
  };

  // When sent, the button is just the mail icon in its "sent" state (click =
  // send again); WHERE it went is shown by the readable cnDeptEmailPillHtml_
  // pill in the caller line (no more truncated inline text on the button).
  const emailBtn = note.emailedAt
    ? `<button class="cn-act-btn is-sent" title="Email sent at ${esc(cnFormatTimestampForCopy_(note.emailedAt))}${note.emailDepartments ? ' to ' + esc(note.emailDepartments) : ''} — click to send again"
               data-cn-action="email">${icon('mail', 14)}</button>`
    : `<button class="cn-act-btn" title="Compose email from this note"
               data-cn-action="email">${icon('mail', 14)}</button>`;

  const copyBtn = `<button class="cn-act-btn" title="Copy formatted note to clipboard" data-cn-action="copy">${icon('copy', 14)}</button>`;

  const resolveBtn = (note.flagType === 'action')
    ? `<button class="cn-act-btn ${note.resolved ? 'is-on' : ''}" title="${note.resolved ? 'Unresolve' : 'Mark resolved'}"
               data-cn-action="resolve">${icon('check', 14)}</button>`
    : '';

  const editBtn = expandable
    ? `<button class="cn-act-btn" title="Edit note" data-cn-action="edit">${icon('adjust', 14)}</button>`
    : '';

  const priorBtn = (note.patientAndTrx && note.patientAndTrx.trim())
    ? `<button class="cn-act-btn" title="Find prior calls for this TRX" data-cn-action="find-trx" data-trx="${esc(note.patientAndTrx)}">${icon('search', 14)}</button>`
    : '';

  const timelineBtn = (note.patientAndTrx && note.patientAndTrx.trim())
    ? `<button class="cn-act-btn" title="Patient timeline (notes · intake · forms)" data-cn-action="timeline" data-trx="${esc(note.patientAndTrx)}">${icon('list', 14)}</button>`
    : '';

  const isPinned = !!(note.subformData && note.subformData.pinned);
  const pinAtCapacity = !isPinned && (CN_STATE.pinnedNotes || []).length >= (CN_STATE.pinLimit || 3);
  const pinCls = isPinned ? 'is-on' : (pinAtCapacity ? 'pin-full' : '');
  const pinTitle = isPinned ? 'Unpin note'
                 : pinAtCapacity ? 'Unpin a note first (' + (CN_STATE.pinnedNotes || []).length + '/' + (CN_STATE.pinLimit || 3) + ')'
                 : 'Pin note (keeps it visible above the stack)';
  const pinBtn = `<button class="cn-act-btn ${pinCls}" title="${esc(pinTitle)}"
                          data-cn-action="pin">${icon('bookmark', 14)}</button>`;

  // External email indicator — shows when the note has external emails sent.
  // Shared with the manager per-rep card (cnExtEmailPillHtml_) so a manager can
  // see WHO their rep emailed: the shared AuditLog records only the recipient
  // domain, so the per-rep card tooltip is the manager-only recipient lookup
  // (F20). Same output the rep sees on their own card.
  const extIndicator = cnExtEmailPillHtml_(note);

  // G3 — when a fillable form linked to this note has been submitted, show a
  // clickable pill that opens the submitted form data in a read-only modal
  // (so the rep doesn't have to open the FormSubmissions sheet).
  const formSub = (note.subformData && note.subformData.formSubmission) ? note.subformData.formSubmission : null;
  const formIndicator = (formSub && formSub.token)
    ? '<button class="cn-form-pill" title="Form received — click to view submission" ' +
      'data-cn-action="view-form" data-token="' + esc(formSub.token) + '">' +
      icon('paperclip', 11) + '<span>form</span></button>'
    : '';

  return `
    <div class="cn-card${flagCls}${staleCls}${urgentCls}${pendingCls}" data-note-id="${esc(note.noteId)}">
      <div class="cn-card-row">
        <span class="cn-card-time tabular">${esc(time)}</span>
        <div class="cn-card-main">
          <div class="cn-card-caller">${callerLine}${trxBit}${cnUrgentPillHtml_(note)}${cnIntakePillHtml_(note)}${cnDeptEmailPillHtml_(note)}</div>
          ${detailLine}
          <div class="cn-card-issue">${issue}</div>
          ${resolutionLine}
          ${trainingQ}
        </div>
        <div class="cn-card-actions">
          ${note._pending
            ? '<span class="cn-pending-badge" title="Saving to server"><span class="cn-pending-dot"></span>Saving</span>'
            : flagBtn('action', 'flag', note.flagType === 'action') +
              flagBtn('training', 'bulb', note.flagType === 'training') +
              pinBtn + copyBtn + emailBtn + extIndicator + formIndicator +
              (function () {
                var urgentBtn = '<button class="cn-act-btn cn-urgent-toggle' + (isUrgent ? ' is-on' : '') +
                  '" title="' + (isUrgent ? 'Remove urgent flag' : 'Mark urgent') +
                  '" data-cn-action="flag-urgent">' + icon('warning', 14) + '</button>';
                var sec = urgentBtn + flagBtn('review', 'thumbsUp', note.flagType === 'review') + resolveBtn + editBtn + priorBtn + timelineBtn;
                if (!sec) return '';
                return '<button class="cn-act-btn" title="More actions" data-cn-action="more">' + icon('chevronDown', 14) + '</button>' +
                  '<span class="cn-more-menu" style="display:none">' + sec + '</span>';
              })()
          }
        </div>
      </div>
    </div>
  `;
}

function cnWireCards_(_root) { /* no-op — using onclick attrs */ }

// Shared external-email recipient pill, used by BOTH the rep's own card and the
// manager per-rep read-only card. The pill's tooltip lists each recipient
// (type: address) — the manager-only recipient lookup (F20): the shared
// AuditLog deliberately records only the recipient domain (PII/PHI), so this
// per-rep-view surface is how a manager sees who their rep emailed externally.
// Recipients come from the note's subformData.externalEmails[] stamp.
// Whether a note carries the 'urgent' flag. Urgent lives only in
// subformData.flags[] (never the FlagType column — INV-37/INV-77), so this is
// the single source of truth for the danger ring + pill across the rep card,
// the manager read-only card, and the optimistic toggle.
function cnIsUrgent_(note) {
  return !!(note && note.subformData && Array.isArray(note.subformData.flags) &&
            note.subformData.flags.indexOf('urgent') >= 0);
}

// Danger-toned "urgent" pill, shared by the rep card and the manager read-only
// card so both stay visually consistent.
function cnUrgentPillHtml_(note) {
  if (!cnIsUrgent_(note)) return '';
  return '<span class="cn-urgent-pill" title="Flagged urgent">' + icon('warning', 10) + 'urgent</span>';
}

// Intake-sourced note chip: a note auto-logged after an Intake form was sent
// (subformData.intakeType ∈ ppd|pmd|pap). Colored by category to match the
// Intake tab. Single source of truth for the rep + manager read-only cards.
function cnIntakePillHtml_(note) {
  const t = note && note.subformData && note.subformData.intakeType;
  const ft = String(t || '').toLowerCase();
  if (ft !== 'ppd' && ft !== 'pmd' && ft !== 'pap') return '';
  const label = ft === 'ppd' ? 'PPD' : ft === 'pmd' ? 'PMD' : 'PAP';
  return '<span class="cn-intake-pill ' + ft + '" title="Logged from an Intake ' + label + ' submission">' +
    icon('clipboardList', 10) + label + '</span>';
}

// Readable "emailed to <depts>" pill for a sent note — replaces the truncated
// inline text that used to ride on the action button. Shows the department
// label clearly (wraps instead of ellipsis-truncating); the send timestamp is
// in the tooltip. Empty depts → a plain "Emailed" pill. Same placement family
// as cnUrgentPillHtml_ / cnExtEmailPillHtml_.
function cnDeptEmailPillHtml_(note) {
  if (!note || !note.emailedAt) return '';
  const depts = String(note.emailDepartments || '').trim();
  const when = (typeof cnFormatTimestampForCopy_ === 'function') ? cnFormatTimestampForCopy_(note.emailedAt) : '';
  const tip = 'Email sent' + (when ? ' ' + when : '') + (depts ? ' to ' + depts : '');
  return '<span class="cn-sent-pill" title="' + esc(tip) + '">' +
    icon('mail', 11) + '<span>' + (depts ? esc(depts) : 'Emailed') + '</span></span>';
}

function cnExtEmailPillHtml_(note) {
  const extEmails = (note && note.subformData && Array.isArray(note.subformData.externalEmails))
    ? note.subformData.externalEmails : [];
  if (extEmails.length === 0) return '';
  const labels = extEmails.map(function (e) { return e.type + ': ' + e.to; }).join(', ');
  return '<span class="cn-ext-email-pill" title="External: ' + esc(labels) + '">' +
    icon('send', 11) + '<span>' + extEmails.length + '</span></span>';
}

// ── G3: read-only viewer for a submitted fillable form ──────────────────────
// Fetches the submission (caller-scoped: server verifies the calling rep
// created the token) and shows the entered fields + signature in a modal, so
// the rep doesn't have to open the FormSubmissions sheet.
function cnViewFormSubmission_(token) {

  if (!token) return;
  cnRenderFormSubOverlay_(
    '<div class="modal cn-form-sub-modal" style="max-width:560px">' +

    .withSuccessHandler(function (res) {

        return;
      }
      cnRenderFormSubOverlay_(cnBuildFormSubModalHtml_(res));
    })

      cnCloseFormSubOverlay_();
      if (typeof showToast === 'function') showToast('Could not load submission: ' + (err && err.message || err), 'toast-error');
    })
    .getFormSubmission(token);
}

function cnRenderFormSubOverlay_(html) {

function cnCloseFormSubOverlay_() {

// ── #3: patient/TRX timeline ────────────────────────────────────────────────
// Stitches the rep's OWN call notes + intake submissions + sent fillable forms
// for one patient/order into a single newest-first timeline (server endpoint
// getPatientTimeline is caller-scoped + read-only). Every server string is

function cnOpenPatientTimeline_(trx) {

    })

    })

}
function cnRenderTimelineOverlay_(html) {
  var overlay = ensureOverlay('cn-timeline-overlay', { onClose: cnCloseTimelineOverlay_ });
  overlay.innerHTML = html;
}
function cnCloseTimelineOverlay_() {
  var overlay = document.getElementById('cn-timeline-overlay');
  if (overlay) overlay.remove();
}
function cnTimelineRowHtml_(ev) {
  var glyph, head, detail = '';
  if (ev.kind === 'intake') {
    glyph = icon('clipboardList', 15);
    head = 'Intake · ' + esc(ev.formType || '');
    if (ev.recipient) detail = 'Sent to ' + esc(ev.recipient);
    if (ev.patientInfo) detail += (detail ? ' · ' : '') + esc(ev.patientInfo);
  } else if (ev.kind === 'form') {
    glyph = icon('outbox', 15);
    head = 'Form · ' + esc(ev.formName || '');
    detail = 'Status: ' + esc(ev.status || '') + (ev.recipientName ? ' · ' + esc(ev.recipientName) : '');
  } else {
    glyph = icon('adjust', 15);
    head = 'Call note' + (ev.caller ? ' · ' + esc(ev.caller) : '');
    var bits = [];
    if (ev.issue) bits.push(esc(ev.issue));
    if (ev.flagType) bits.push('[' + esc(ev.flagType) + ']');
    if (ev.emailedAt) bits.push('emailed');
    detail = bits.join(' · ');
  }
  return '<div style="display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)">' +
    '<div style="flex:0 0 auto;color:var(--muted);margin-top:1px">' + glyph + '</div>' +
    '<div style="flex:1;min-width:0">' +
      '<div style="display:flex;justify-content:space-between;gap:10px">' +
        '<strong style="font-size:13px">' + head + '</strong>' +
        '<span class="tabular" style="font-size:11px;color:var(--muted);white-space:nowrap">' + esc(ev.ts || '') + '</span>' +
      '</div>' +
      (detail ? '<div style="font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis">' + detail + '</div>' : '') +
    '</div>' +
  '</div>';
}
function cnBuildTimelineHtml_(res) {
  var events = (res && res.events) || [];
  var head = '<div class="head"><h3>Patient timeline · ' + esc(res.trx || '') + '</h3>' +
    '<button class="xclose" onclick="cnCloseTimelineOverlay_()" aria-label="Close">' + icon('x', 16) + '</button></div>';
  // Cycle-9 L-8: a failed source stream is meaningfully different from "no
  // data" on a patient-context surface — surface which streams are missing
  // instead of rendering an authoritative-looking partial timeline.
  var partialBanner = (res && res.partial && res.failedSources && res.failedSources.length)
    ? '<div style="font-size:12px;color:var(--warning-deep);background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin-bottom:8px">' +
      icon('warning', 12) + ' Incomplete — could not load: ' + esc(res.failedSources.join(', ')) + '. Retry for the full picture.</div>'
    : '';
  if (!events.length) {
    return '<div class="modal cn-timeline-modal" style="max-width:600px">' + head +
      '<div class="body">' + partialBanner + '<div class="no-data">No call notes, intake submissions, or sent forms found for this patient / TRX in your own records.</div></div></div>';
  }
  var counts = { note: 0, intake: 0, form: 0 };
  events.forEach(function (ev) { counts[ev.kind] = (counts[ev.kind] || 0) + 1; });
  var summary = partialBanner + '<div style="font-size:12px;color:var(--muted);margin-bottom:6px">' +
    counts.note + ' note(s) · ' + counts.intake + ' intake · ' + counts.form + ' form(s)</div>';
  var rows = events.map(cnTimelineRowHtml_).join('');
  return '<div class="modal cn-timeline-modal" style="max-width:600px">' + head +
    '<div class="body" style="max-height:62vh;overflow:auto">' + summary + rows + '</div></div>';
}

// Manager-side form-submission viewer (Team Notes Per-Rep view). Reuses the
// same read-only modal as the rep viewer; the server endpoint is manager-gated

function cnMgrViewFormSubmission_(btn) {

  if (!token || !repId) return;

  google.script.run
    .withSuccessHandler(function (res) {
