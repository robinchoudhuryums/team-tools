  /* ── Responsive sweep — compact / narrow widths ─────────────────── */
  @media (max-width: 640px) {
    .cn-form-fields { grid-template-columns: 1fr; }
    .cn-form-field.full { grid-column: span 1; }
    .cn-compose-dept-grid { grid-template-columns: 1fr; }
    .cn-card .cn-edit-fields { grid-template-columns: 1fr; }
    .cn-card .cn-edit-fields .full { grid-column: span 1; }
  }
  :root[data-compact="1"] .cn-form-fields { grid-template-columns: 1fr; }
  :root[data-compact="1"] .cn-form-field.full { grid-column: span 1; }
  :root[data-compact="1"] .cn-compose-dept-grid { grid-template-columns: 1fr; }
  :root[data-compact="1"] .cn-card .cn-edit-fields { grid-template-columns: 1fr; }
  :root[data-compact="1"] .cn-card .cn-edit-fields .full { grid-column: span 1; }
  :root[data-compact="1"] .cn-card-time { min-width: 44px; }
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  CALL NOTES — view module
//  ────────────────────────────────────────────────────────────────────────
//  Surface for the CSR rolling-note workflow. Submit logs only (no email
//  by default); the email composer is a separate two-stage action with
//  preview gate. Ctrl/Cmd+Enter from any field submits the active form
//  and auto-copies a CRM-friendly serialization to the clipboard.
// ════════════════════════════════════════════════════════════════════════════

// Module state — separate from the time-clock locals to avoid collision.
const CN_STATE = {
  rollingNotes: [],          // last N saved notes for the rolling stack (newest first)
  filter: 'all',
  filterCounts: {},          // updated on every render
  staleFlagHours: 1,
  enrolled: true,            // false when emp has no callNotesSheetId
  autoCopyFormat: '',
  empTz: '',
  composer: null,            // open email composer state, or null
  editingNoteId: null,       // noteId of card currently in inline-edit mode
  historyDate: null,         // selected date in History view (yyyy-MM-dd)
  historyNotes: [],
  searchQuery: '',
  searchField: 'all',
  searchResults: [],
  searchTimer: null,
  searchExact: false,        // true when search was launched by "find prior calls for this TRX" — matches patientAndTrx exactly
  searchExactTrx: '',        // the TRX being matched, for the "Exact match · X · clear" badge
  deptConfig: null,          // cached departments / suggestions / state tax rates
  ambientTimer: null,
  mgrEnrolledReps: null,     // [{id,name}] of reps with a CallNotesSheetId; loaded once for manager Per-Rep view
  mgrRepView: null,          // { repId, date } — current selection in manager Per-Rep view
  lastClearedSnapshot: null, // { values: {...}, flag, trainingQ, at: <ms> } — restored on Ctrl/⌘+Z within the undo window
  prewarmed: false,          // set true after the first cnPing() so we don't pre-warm twice per page load
  pinnedNotes: [],           // pinned-tray cache; loaded by cnReloadPinnedTray_() on Log view enter
  mgrStatsDate: null,        // selected date in manager Stats tab (defaults to today in mgr tz)
};

const CN_ROLLING_STACK_MAX = 12;  // how many recent cards stay rendered before "see all" kicks in
const CN_DEFAULT_FILTERS = ['all','action','training','review','unresolved'];
const CN_CLEAR_UNDO_WINDOW_MS = 30000;  // window during which Ctrl/⌘+Z restores a just-cleared form
const CN_FORM_STARTED_LS_KEY = 'umsCallNotesFormStartedAt';  // persists across refresh so completion-time stays accurate
const CN_FORM_STICKY_LS_KEY  = 'umsCallNotesActiveFormDraft'; // sticky-form: in-progress draft restored on next load

// ── View enter handlers (called by the shell router) ────────────────────

function enterCallNotesView(area) {
  stopClock();
  CN_STATE.composer = null;
  CN_STATE.editingNoteId = null;
  cnPrewarmScript_();
  renderLoading(area, 'Loading call notes…');
  cnFetchDeptConfigIfNeeded_(function () {
    cnLoadToday_(function () {
      cnRenderNotesView(area);
      cnStartAmbientPolling_();
    });
  });
}

/** Fire a no-op RPC on view enter to warm the Apps Script context. The cold
 *  start adds ~500ms to the first real RPC; with the iframe already warm,
 *  the rep's first submit/flag/email feels snappier. Fires at most once per
 *  page load. */
function cnPrewarmScript_() {
  if (CN_STATE.prewarmed) return;
  CN_STATE.prewarmed = true;
  google.script.run
    .withSuccessHandler(function () { /* noop */ })
    .withFailureHandler(function () { CN_STATE.prewarmed = false; })
    .cnPing();
}

function enterCallNotesHistoryView(area) {
  stopClock();
  if (!CN_STATE.historyDate) {
    // Default to "today minus 1" so a freshly-opened History view shows
    // yesterday rather than re-rendering today's rolling stack.
    const tz = (empState && empState.timezone) || 'UTC';
    const today = new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());
    const d = new Date(today + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - 1);
    CN_STATE.historyDate = `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
  }
  renderLoading(area, 'Loading history…');
  cnLoadDate_(CN_STATE.historyDate, function () {
    cnRenderHistoryView(area);
  });
}

function enterCallNotesSearchView(area) {
  stopClock();
  cnFetchDeptConfigIfNeeded_(function () {
    cnRenderSearchView(area);
  });
}

function enterCallNotesManageView(area) {
  stopClock();
  renderLoading(area, 'Loading team queues…');
  cnRenderManageView(area);
}

// ── Server I/O helpers ─────────────────────────────────────────────────

function cnFetchDeptConfigIfNeeded_(then) {
  if (CN_STATE.deptConfig) { then(); return; }
  google.script.run
    .withSuccessHandler(function (cfg) { CN_STATE.deptConfig = cfg; then(); })
    .withFailureHandler(function (err) {
      showToast('Failed to load department config: ' + err.message, 'toast-error');
      CN_STATE.deptConfig = { departments: [], suggestionsByDept: {}, defaultSuggestions: [] };
      then();
    })
    .getCallNotesDepartments();
}

function cnLoadToday_(then) {
  // Capture currentView so the success/failure handlers can skip rendering
  // if the user navigated away during the round trip (otherwise a late
  // callback clobbers the new view's innerHTML — they share the view-area
  // node). State update still happens unconditionally so the cache is warm
  // for the next time the rep returns.
  const requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (res.error) {
        if (/not configured/i.test(res.error)) CN_STATE.enrolled = false;
        else if (currentView === requestedView) showToast(res.error, 'toast-error');
        CN_STATE.rollingNotes = [];
        CN_STATE.autoCopyFormat = '';
      } else {
        CN_STATE.enrolled = true;
        CN_STATE.rollingNotes = res.notes || [];
        CN_STATE.autoCopyFormat = res.autoCopyFormat || '';
        CN_STATE.empTz = res.timezone || '';
      }
      if (currentView !== requestedView) return;
      if (then) then();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      showToast('Load failed: ' + err.message, 'toast-error');
      if (then) then();
    })
    .getMyCallNotes({ filter: 'all' });
}

function cnLoadDate_(date, then) {
  const requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (res.error) {
        if (/not configured/i.test(res.error)) CN_STATE.enrolled = false;
        else if (currentView === requestedView) showToast(res.error, 'toast-error');
        CN_STATE.historyNotes = [];
      } else {
        CN_STATE.enrolled = true;
        CN_STATE.historyNotes = res.notes || [];
      }
      if (currentView !== requestedView) return;
      if (then) then();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      showToast('Load failed: ' + err.message, 'toast-error');
      if (then) then();
    })
    .getMyCallNotes({ filter: 'all', date });
}

// ── Notes view (the rolling-form primary surface) ──────────────────────

function cnRenderNotesView(area) {
  if (!CN_STATE.enrolled) {
    area.innerHTML = cnEnrollmentMissingHtml_();
    return;
  }
  const compactHeader = COMPACT_MODE ? cnCompactHeader_('Call Notes', 'phone') : '';
  area.innerHTML = `
    ${compactHeader}
    ${COMPACT_MODE ? '' : cnViewTitleBar_('Call Notes', 'Log calls fast — Ctrl/⌘+Enter saves & copies to clipboard for the CRM. Send department emails separately.')}
    <div class="cn-rolling">
      ${cnRenderActiveForm_()}
      <div id="cn-pinned-tray"></div>
      <div class="cn-filter-bar" id="cn-filter-bar"></div>
      <div id="cn-stack"></div>
    </div>
  `;
  cnWireActiveForm_();
  cnInstallCardDelegation_(area);
  cnRenderFilterBar_();
  cnRenderStack_();
  cnReloadPinnedTray_();
  // Restore any in-progress draft from a prior session (sticky form). If a
  // draft was restored, focus the resolution field (most likely where the
  // rep left off); otherwise focus the callback for a fresh note.
  const restored = cnRestoreActiveFormDraft_();
  setTimeout(function () {
    const el = document.getElementById(restored ? 'cn-fld-resolution' : 'cn-fld-callback');
    if (el) el.focus();
  }, 50);
  if (restored) showToast('Draft restored', 'toast-success');
}

function cnRenderActiveForm_() {
  const todayCount = (CN_STATE.rollingNotes || []).length;
  return `
    <div class="cn-active-form" id="cn-active-form">
      <div class="cn-active-form-header">
        <span class="cn-active-form-title">New Note</span>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="cn-note-counter" id="cn-note-counter" title="Calls logged today">
            <span id="cn-note-counter-num">${todayCount}</span>
            <span class="cn-note-counter-lbl">today</span>
          </span>
          <span class="cn-active-form-hint">
            <kbd>${cnIsMac_() ? '⌘' : 'Ctrl'}+Enter</kbd> save &amp; copy
          </span>
        </div>
      </div>
      <div class="cn-form-fields">
        <div class="cn-form-field">
          <label>Callback</label>
          <input type="text" id="cn-fld-callback" autocomplete="off" placeholder="(555) 123-4567">
        </div>
        <div class="cn-form-field">
          <label>Caller</label>
          <input type="text" id="cn-fld-caller" autocomplete="off" placeholder="Caller name">
        </div>
        <div class="cn-form-field">
          <label>Relationship</label>
          <input type="text" id="cn-fld-relationship" autocomplete="off" placeholder="self / spouse / parent / …">
        </div>
        <div class="cn-form-field">
          <label>Patient &amp; TRX</label>
          <input type="text" id="cn-fld-patient" autocomplete="off" placeholder="Patient name TRX# or just TRX#">
        </div>
        <div class="cn-form-field full">
          <label>Issue${cnVoiceMicMarkup_('cn-fld-issue')}</label>
          <textarea id="cn-fld-issue" rows="2" placeholder="Why did they call?"></textarea>
        </div>
        <div class="cn-form-field">
          <label>Transferred To</label>
          <input type="text" id="cn-fld-transferred" autocomplete="off" placeholder="Agent name, or leave blank / N/A">
        </div>
        <div class="cn-form-field">
          <label>Resolution${cnVoiceMicMarkup_('cn-fld-resolution')}</label>
          <textarea id="cn-fld-resolution" rows="1" placeholder="What did you do?"></textarea>
        </div>
      </div>
      <div class="cn-form-actions">
        <div class="cn-form-flag-trio" role="group" aria-label="Flag this note">
          <button type="button" class="cn-flag-btn action" data-flag="action"
                  title="Flag for action (follow-up)" aria-label="Flag for action">
            ${icon('flag', 14)}
          </button>
          <button type="button" class="cn-flag-btn training" data-flag="training"
                  title="Flag for training (need clarification)" aria-label="Flag for training">
            ${icon('bulb', 14)}
          </button>
          <div class="cn-flag-more-wrap">
            <button type="button" class="cn-flag-btn cn-flag-more-btn" id="cn-flag-more-btn"
                    title="More flag options" aria-label="More flag options" aria-haspopup="true" aria-expanded="false">
              ${icon('kebab', 14)}
            </button>
            <div class="cn-flag-more-menu" id="cn-flag-more-menu" role="menu" hidden>
              <button type="button" class="cn-flag-more-item" data-flag="review" role="menuitem">
                ${icon('star', 14)}<span>Review candidate (5-star)</span>
              </button>
            </div>
          </div>
        </div>
        <button type="button" class="cn-form-clear-btn" id="cn-form-clear" title="Clear note (⌘/Ctrl+Z to undo)">Clear Note</button>
        <button type="button" class="cn-form-submit cn-form-submit-secondary" id="cn-form-submit-compose"
                title="Save the note, copy to clipboard, and open the email composer">
          ${icon('mail', 14)} Save &amp; Compose
        </button>
        <button type="button" class="cn-form-submit" id="cn-form-submit">
          ${icon('check', 14)} Save &amp; Copy
        </button>
      </div>
      <div class="cn-training-q-row" id="cn-training-q-row" style="display:none">
        <label>Training Question</label>
        <input type="text" id="cn-fld-training-q" placeholder="What's the question? (short — manager sees this in the weekly digest)">
      </div>
    </div>
  `;
}

function cnWireActiveForm_() {
  const form = document.getElementById('cn-active-form');
  if (!form) return;
  // Track flag-type selection via dataset on the form root. The primary flags
  // (action, training) are visible chips; less-common flags (review, future)
  // live behind the kebab overflow menu so the chip strip stays uncluttered.
  form.dataset.flag = '';
  const setFlag = function (next) {
    form.dataset.flag = next;
    // Primary chips reflect their own active state
    form.querySelectorAll('.cn-flag-btn[data-flag]').forEach(function (b) {
      const isOn = b.dataset.flag === next;
      b.classList.toggle('active', isOn);
      // Apply the kind class only when on, so dropping the flag removes the tint.
      b.classList.toggle('action',   b.dataset.flag === 'action' && isOn);
      b.classList.toggle('training', b.dataset.flag === 'training' && isOn);
      b.classList.toggle('review',   b.dataset.flag === 'review' && isOn);
    });
    // Kebab button lights up when an overflow-only flag (currently: review) is active
    const moreBtn = document.getElementById('cn-flag-more-btn');
    if (moreBtn) {
      const isOverflowActive = (next === 'review');
      moreBtn.classList.toggle('active', isOverflowActive);
      moreBtn.classList.toggle('review', isOverflowActive);
    }
    // Training-question row visibility — only shown when training is selected
    const trainingRow = document.getElementById('cn-training-q-row');
    if (trainingRow) trainingRow.style.display = next === 'training' ? 'block' : 'none';
  };
  form.querySelectorAll('.cn-flag-btn[data-flag]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const target = btn.dataset.flag;
      setFlag(form.dataset.flag === target ? '' : target);
    });
  });
  // Kebab overflow menu — open/close + item handlers
  const moreBtn = document.getElementById('cn-flag-more-btn');
  const moreMenu = document.getElementById('cn-flag-more-menu');
  if (moreBtn && moreMenu) {
    moreBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      const willOpen = moreMenu.hidden;
      moreMenu.hidden = !willOpen;
      moreBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
    moreMenu.querySelectorAll('.cn-flag-more-item').forEach(function (item) {
      item.addEventListener('click', function () {
        const target = item.dataset.flag;
        setFlag(form.dataset.flag === target ? '' : target);
        moreMenu.hidden = true;
        moreBtn.setAttribute('aria-expanded', 'false');
      });
    });
    // Click outside closes the menu
    document.addEventListener('click', function (e) {
      if (!moreMenu.hidden && !moreMenu.contains(e.target) && e.target !== moreBtn) {
        moreMenu.hidden = true;
        moreBtn.setAttribute('aria-expanded', 'false');
      }
    });
  }
  // Ctrl/⌘+Enter from any input/textarea submits.
  // First input also starts the form-completion timer (used by the manager
  // Stats tab's median note-completion-time metric) and triggers the sticky-
  // form auto-save (debounced) so an accidental tab close doesn't lose work.
  const persistDebounced = (function () {
    let t = null;
    return function () {
      if (t) clearTimeout(t);
      t = setTimeout(cnPersistActiveFormDraft_, 400);
    };
  })();
  form.querySelectorAll('input, textarea').forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        cnSubmitActiveForm_();
      }
    });
    el.addEventListener('input', function () {
      cnFormTimerStartIfNeeded_();
      persistDebounced();
    });
  });
  // Phone-number auto-format on the Callback field. Runs after the generic
  // input listener so persistence sees the formatted value.
  const cb = document.getElementById('cn-fld-callback');
  if (cb) {
    cb.addEventListener('input', function () {
      const formatted = cnFormatPhoneNumberInline_(cb.value);
      if (formatted !== cb.value) {
        cb.value = formatted;
        // Cursor lands at end — natural for forward-typing. (Editing in the
        // middle of a phone is rare and the formatter would fight any
        // attempt to preserve mid-string position when adding parens.)
        cb.setSelectionRange(formatted.length, formatted.length);
      }
    });
  }
  // Ctrl/⌘+Z restores a freshly-cleared form (within CN_CLEAR_UNDO_WINDOW_MS).
  // Bound at the form level so it doesn't fight with the native input undo
  // stack outside of the post-clear state.
  form.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) {
      const snap = CN_STATE.lastClearedSnapshot;
      if (!snap) return;
      if (Date.now() - snap.at > CN_CLEAR_UNDO_WINDOW_MS) return;
      // Only restore if the form is currently empty (= still in cleared state).
      // Once the rep starts typing, native input-level undo takes over.
      const allEmpty = !document.getElementById('cn-fld-callback').value
        && !document.getElementById('cn-fld-caller').value
        && !document.getElementById('cn-fld-patient').value
        && !document.getElementById('cn-fld-issue').value
        && !document.getElementById('cn-fld-resolution').value;
      if (!allEmpty) return;
      e.preventDefault();
      cnRestoreFromSnapshot_(snap);
      CN_STATE.lastClearedSnapshot = null;
    }
  });
  document.getElementById('cn-form-submit').addEventListener('click', function () { cnSubmitActiveForm_(); });
  document.getElementById('cn-form-clear').addEventListener('click', cnClearActiveForm_);
  // Save & Compose: optimistic submit + open the email composer once the
  // server has assigned a real noteId (preview/send require it). The rep
  // can paste the note into the CRM during the brief wait — clipboard is
  // already set by the optimistic submit path.
  const composeBtn = document.getElementById('cn-form-submit-compose');
  if (composeBtn) {
    composeBtn.addEventListener('click', function () {
      cnSubmitActiveForm_({
        onConfirmed: function (note) { cnOpenEmailComposer_(note.noteId); },
      });
    });
  }
}

function cnRestoreFromSnapshot_(snap) {
  if (!snap) return;
  Object.keys(snap.values || {}).forEach(function (k) {
    const el = document.getElementById('cn-fld-' + k);
    if (el) el.value = snap.values[k];
  });
  const form = document.getElementById('cn-active-form');
  if (form && snap.flag !== undefined) {
    // Re-apply flag state by simulating the click semantics
    form.dataset.flag = snap.flag;
    form.querySelectorAll('.cn-flag-btn[data-flag]').forEach(function (b) {
      const isOn = b.dataset.flag === snap.flag;
      b.classList.toggle('active', isOn);
      b.classList.toggle('action',   b.dataset.flag === 'action' && isOn);
      b.classList.toggle('training', b.dataset.flag === 'training' && isOn);
      b.classList.toggle('review',   b.dataset.flag === 'review' && isOn);
    });
    const moreBtn = document.getElementById('cn-flag-more-btn');
    if (moreBtn) {
      const isOverflowActive = (snap.flag === 'review');
      moreBtn.classList.toggle('active', isOverflowActive);
      moreBtn.classList.toggle('review', isOverflowActive);
    }
    const trainingRow = document.getElementById('cn-training-q-row');
    if (trainingRow) trainingRow.style.display = snap.flag === 'training' ? 'block' : 'none';
  }
  const tq = document.getElementById('cn-fld-training-q');
  if (tq) tq.value = snap.trainingQ || '';
  showToast('Restored', 'toast-success');
}

function cnClearActiveForm_(opts) {
  const fields = ['callback','caller','relationship','patient','issue','transferred','resolution'];
  // Snapshot first so Ctrl/⌘+Z can restore. Skip snapshotting when the clear
  // is itself part of a successful submit (opts.skipSnapshot=true) — the rep
  // intended to start fresh; restoring a saved note's fields would be confusing.
  const skipSnap = opts && opts.skipSnapshot;
  if (!skipSnap) {
    const values = {};
    fields.forEach(function (k) {
      const el = document.getElementById('cn-fld-' + k);
      if (el) values[k] = el.value;
    });
    const form0 = document.getElementById('cn-active-form');
    const tq0 = document.getElementById('cn-fld-training-q');
    const anyContent = fields.some(function (k) { return (values[k] || '').trim().length > 0; })
                     || (tq0 && tq0.value.trim())
                     || (form0 && form0.dataset.flag);
    if (anyContent) {
      CN_STATE.lastClearedSnapshot = {
        values: values,
        flag: form0 ? form0.dataset.flag : '',
        trainingQ: tq0 ? tq0.value : '',
        at: Date.now(),
      };
      showToast('Cleared · ' + (cnIsMac_() ? '⌘' : 'Ctrl') + '+Z to undo', 'toast-warn');
    }
  }
  fields.forEach(function (k) {
    const el = document.getElementById('cn-fld-' + k);
    if (el) el.value = '';
  });
  const form = document.getElementById('cn-active-form');
  if (form) {
    form.dataset.flag = '';
    form.querySelectorAll('.cn-flag-btn').forEach(function (b) {
      b.classList.remove('active', 'action', 'training', 'review');
    });
  }
  const trainingRow = document.getElementById('cn-training-q-row');
  if (trainingRow) trainingRow.style.display = 'none';
  const tq = document.getElementById('cn-fld-training-q');
  if (tq) tq.value = '';
  // Sticky-form: an explicit Clear Note (or a submit-driven clear) means the
  // rep is done with this draft. Drop the persisted copy so it doesn't get
  // restored on next load.
  cnClearStickyFormDraft_();
  // Reset completion timer too — Clear is a fresh start.
  cnFormTimerReset_();
  const cb = document.getElementById('cn-fld-callback');
  if (cb) cb.focus();
}

function cnReadActiveForm_() {
  const form = document.getElementById('cn-active-form');
  const flag = (form && form.dataset.flag) || '';
  const trainingEl = document.getElementById('cn-fld-training-q');
  // When training is selected, capture the rep's question into subformData
  // (re-using the existing SUBFORM_DATA JSON column — no schema migration).
  // Other flag types don't write subformData on submit.
  const trainingQ = (flag === 'training' && trainingEl) ? trainingEl.value.trim() : '';
  return {
    callback:      document.getElementById('cn-fld-callback').value,
    caller:        document.getElementById('cn-fld-caller').value,
    relationship:  document.getElementById('cn-fld-relationship').value,
    patientAndTrx: document.getElementById('cn-fld-patient').value,
    issue:         document.getElementById('cn-fld-issue').value,
    transferredTo: document.getElementById('cn-fld-transferred').value,
    resolution:    document.getElementById('cn-fld-resolution').value,
    flagType:      flag,
    subformData:   trainingQ ? { trainingQuestion: trainingQ } : null,
  };
}

/** Start the form-completion timer if not already started. Called on the
 *  first user interaction with the form (input or flag click). Persists to
 *  localStorage so a mid-form refresh doesn't reset the clock — the rep's
 *  effort is captured across reloads. */
function cnFormTimerStartIfNeeded_() {
  try {
    if (!localStorage.getItem(CN_FORM_STARTED_LS_KEY)) {
      localStorage.setItem(CN_FORM_STARTED_LS_KEY, String(Date.now()));
    }
  } catch (e) {}
}

/** Stop the timer and return elapsed seconds. Returns null if no timer was
 *  running (e.g., rep clicked Save & Copy on a form they didn't type into,
 *  which shouldn't happen but is defensively handled). */
function cnFormTimerEndAndGet_() {
  try {
    const raw = localStorage.getItem(CN_FORM_STARTED_LS_KEY);
    if (!raw) return null;
    const started = parseInt(raw, 10);
    localStorage.removeItem(CN_FORM_STARTED_LS_KEY);
    if (!isFinite(started) || started <= 0) return null;
    const elapsed = Math.max(0, Math.round((Date.now() - started) / 1000));
    // Cap obvious outliers (rep walked away) — a 12-hour stale timer
    // shouldn't poison the median. 1800s = 30 min mirrors the manager
    // stats threshold for "still actively writing".
    if (elapsed > 1800) return null;
    return elapsed;
  } catch (e) { return null; }
}

function cnFormTimerReset_() {
  try { localStorage.removeItem(CN_FORM_STARTED_LS_KEY); } catch (e) {}
}

/** Sticky form: persist the in-progress draft to localStorage on every
 *  input so a tab close / refresh / browser crash doesn't lose what the
 *  rep typed. Called debounced from the input handler. */
function cnPersistActiveFormDraft_() {
  try {
    const values = {};
    ['callback','caller','relationship','patient','issue','transferred','resolution'].forEach(function (k) {
      const el = document.getElementById('cn-fld-' + k);
      if (el) values[k] = el.value;
    });
    const form = document.getElementById('cn-active-form');
    const tq = document.getElementById('cn-fld-training-q');
    const data = {
      values: values,
      flag: form ? form.dataset.flag : '',
      trainingQ: tq ? tq.value : '',
    };
    const anyContent = Object.keys(values).some(function (k) { return (values[k] || '').trim(); })
                    || (data.flag) || (data.trainingQ && data.trainingQ.trim());
    if (anyContent) {
      localStorage.setItem(CN_FORM_STICKY_LS_KEY, JSON.stringify(data));
    } else {
      localStorage.removeItem(CN_FORM_STICKY_LS_KEY);
    }
  } catch (e) { /* localStorage unavailable — accept the loss */ }
}

/** Sticky form: on view enter (after the form is rendered) restore the
 *  draft from localStorage. No-op if no draft exists. */
function cnRestoreActiveFormDraft_() {
  try {
    const raw = localStorage.getItem(CN_FORM_STICKY_LS_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    Object.keys(data.values || {}).forEach(function (k) {
      const el = document.getElementById('cn-fld-' + k);
      if (el) el.value = data.values[k] || '';
    });
    // Re-apply flag state if any (matches cnRestoreFromSnapshot_'s shape)
    if (data.flag) {
      const form = document.getElementById('cn-active-form');
      if (form) {
        form.dataset.flag = data.flag;
        form.querySelectorAll('.cn-flag-btn[data-flag]').forEach(function (b) {
          const isOn = b.dataset.flag === data.flag;
          b.classList.toggle('active', isOn);
          b.classList.toggle('action',   b.dataset.flag === 'action' && isOn);
          b.classList.toggle('training', b.dataset.flag === 'training' && isOn);
          b.classList.toggle('review',   b.dataset.flag === 'review' && isOn);
        });
        const moreBtn = document.getElementById('cn-flag-more-btn');
        if (moreBtn) {
          const isOverflow = (data.flag === 'review');
          moreBtn.classList.toggle('active', isOverflow);
          moreBtn.classList.toggle('review', isOverflow);
        }
        const trainingRow = document.getElementById('cn-training-q-row');
        if (trainingRow) trainingRow.style.display = data.flag === 'training' ? 'block' : 'none';
      }
    }
    const tq = document.getElementById('cn-fld-training-q');
    if (tq && data.trainingQ) tq.value = data.trainingQ;
    return true;
  } catch (e) { return false; }
}

function cnClearStickyFormDraft_() {
  try { localStorage.removeItem(CN_FORM_STICKY_LS_KEY); } catch (e) {}
}

/** Voice-to-text mic markup, gated on (a) CONFIG.CALL_NOTES.VOICE_INPUT_ENABLED
 *  and (b) the browser supporting webkitSpeechRecognition. Hidden entirely
 *  when off — no DOM element rendered, no surface area for accidents. */
function cnVoiceMicMarkup_(targetFieldId) {
  const cfg = CN_STATE.deptConfig || {};
  if (!cfg.voiceInputEnabled) return '';
  if (typeof window === 'undefined' || !('webkitSpeechRecognition' in window)) return '';
  return ` <button type="button" class="cn-voice-mic" data-target="${esc(targetFieldId)}"
                   onclick="cnVoiceStart_(this)" title="Dictate (beta — audio routed to your browser's speech service)">${icon('mic', 12)}</button>`;
}

/** Start (or stop, if already listening) voice recognition for the field
 *  identified by data-target. Click while listening to stop early. Browser
 *  prompts for mic permission on first use per origin. */
function cnVoiceStart_(btn) {
  if (!('webkitSpeechRecognition' in window)) return;
  const targetId = btn.dataset.target;
  const target = document.getElementById(targetId);
  if (!target) return;

  // Stop in-flight recognition if button is clicked again
  if (btn._recog) {
    try { btn._recog.stop(); } catch (e) {}
    return;
  }

  const recog = new window.webkitSpeechRecognition();
  recog.continuous = false;
  recog.interimResults = true;
  recog.lang = 'en-US';
  btn._recog = recog;
  btn.classList.add('listening');
  // Insert transcription at the cursor; if the field is empty append a
  // leading space when appropriate so concatenated speech doesn't smush
  // into existing text.
  const startPos = target.selectionStart;
  const before = target.value.slice(0, startPos);
  const after = target.value.slice(target.selectionEnd);
  let finalText = '';
  recog.onresult = function (event) {
    let interim = '';
    finalText = '';
    for (let i = 0; i < event.results.length; i++) {
      if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      else interim += event.results[i][0].transcript;
    }
    const insertion = (before && !before.endsWith(' ') && !before.endsWith('\n')) ? ' ' : '';
    target.value = before + insertion + finalText + interim + after;
    // Trigger the form's input listeners so sticky-save + timer fire
    target.dispatchEvent(new Event('input', { bubbles: true }));
  };
  recog.onend = function () {
    btn.classList.remove('listening');
    btn._recog = null;
    // Position the cursor after the inserted text so the rep can keep typing
    const insertion = (before && !before.endsWith(' ') && !before.endsWith('\n')) ? ' ' : '';
    const newPos = before.length + insertion.length + finalText.length;
    try { target.setSelectionRange(newPos, newPos); target.focus(); } catch (e) {}
  };
  recog.onerror = function (e) {
    btn.classList.remove('listening');
    btn._recog = null;
    showToast('Voice input error: ' + (e.error || 'unknown'), 'toast-error');
  };
  try { recog.start(); }
  catch (e) {
    btn.classList.remove('listening');
    btn._recog = null;
    showToast('Could not start mic: ' + e.message, 'toast-error');
  }
}

/** Format a phone number as the rep types — instant visual feedback instead
 *  of the prior format-on-read-only behavior. Mirrors the server's
 *  formatPhoneNumber_ output: "(555) 123-4567" for 10 digits,
 *  "+1 (555) 123-4567" for 11 starting with 1, "(555) 123-4567 x123" for
 *  extensions. Sub-10-digit inputs are formatted progressively as the rep
 *  fills in more digits. Cursor jumps to the end after format; for a number
 *  field this is the natural typing position. */
function cnFormatPhoneNumberInline_(input) {
  const raw = String(input == null ? '' : input);
  const digits = raw.replace(/\D/g, '');
  if (digits.length === 0) return '';
  if (digits.length <= 3) return '(' + digits;
  if (digits.length <= 6) return '(' + digits.slice(0,3) + ') ' + digits.slice(3);
  if (digits.length === 11 && digits.charAt(0) === '1') {
    return '+1 (' + digits.slice(1,4) + ') ' + digits.slice(4,7) + '-' + digits.slice(7);
  }
  if (digits.length <= 10) return '(' + digits.slice(0,3) + ') ' + digits.slice(3,6) + '-' + digits.slice(6);
  // 11+ digits not starting with 1 → treat the tail as an extension
  return '(' + digits.slice(0,3) + ') ' + digits.slice(3,6) + '-' + digits.slice(6,10) + ' x' + digits.slice(10);
}

/** Format `now` as the server's CN canonical timestamp ("yyyy-MM-dd'T'HH:mm:ss")
 *  in the given timezone. Used to build the pending-note timestamp client-side
 *  so the optimistic card renders with the right time. Server returns its own
 *  canonical timestamp; we replace the pending note when the RPC confirms. */
function cnNowInTz_(tz) {
  const fmt = new Intl.DateTimeFormat('sv-SE', {
    timeZone: tz || 'UTC',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false,
  });
  const parts = fmt.formatToParts(new Date());
  const get = function (k) {
    const p = parts.find(function (x) { return x.type === k; });
    return p ? p.value : '';
  };
  const date = get('year') + '-' + get('month') + '-' + get('day');
  const time = get('hour') + ':' + get('minute') + ':' + get('second');
  return { date: date, timestamp: date + 'T' + time };
}

/** Optimistic submit: build a "pending" note client-side, unshift to the
 *  rolling stack, auto-copy, clear the form, THEN fire the server RPC. On
 *  success the pending note is swapped for the server-confirmed one; on
 *  failure it's removed and the form values are restored to a snapshot so
 *  the rep doesn't lose what they typed.
 *
 *  Why: Apps Script RPC adds ~300–800ms; with optimistic UI the rep sees
 *  the same speed as pasting into a Sheet. The form is ready for the next
 *  call before the server has even acknowledged the previous one.
 *
 *  opts.onConfirmed(note): called with the server's confirmed note after
 *  it successfully lands. Used by the Save-Copy-Compose button to open
 *  the composer with the real noteId once the server has assigned one. */
function cnSubmitActiveForm_(opts) {
  const requestedView = currentView;
  const payload = cnReadActiveForm_();
  if (!payload.callback && !payload.caller && !payload.patientAndTrx && !payload.issue && !payload.resolution) {
    showToast('Note is empty — fill at least one field', 'toast-warn');
    return;
  }

  // Capture completion-time and fold into subformData for the server. Not
  // visible to the rep here; the manager Stats tab surfaces the median.
  const completionSeconds = cnFormTimerEndAndGet_();
  if (completionSeconds != null) {
    payload.subformData = payload.subformData || {};
    payload.subformData.completionSeconds = completionSeconds;
  }

  // Build the pending note. Uses the rep's tz so the time renders correctly
  // even before the server responds.
  const empTz = CN_STATE.empTz || (empState && empState.timezone) || 'UTC';
  const nowTs = cnNowInTz_(empTz);
  const pendingId = 'pending_' + Math.random().toString(36).slice(2, 12);
  const pendingNote = {
    noteId: pendingId,
    timestamp: nowTs.timestamp,
    dateLocal: nowTs.date,
    callback: payload.callback,
    caller: payload.caller,
    relationship: payload.relationship,
    patientAndTrx: payload.patientAndTrx,
    issue: payload.issue,
    transferredTo: payload.transferredTo,
    resolution: payload.resolution,
    flagType: payload.flagType || '',
    resolved: false,
    emailedAt: '',
    emailDepartments: '',
    subform: '',
    subformData: payload.subformData || null,
    _pending: true,
  };

  // Snapshot the form values so we can restore them on server failure
  // (otherwise the rep loses what they typed when the optimistic clear fires).
  const restoreSnapshot = {
    values: {
      callback: payload.callback, caller: payload.caller, relationship: payload.relationship,
      patient: payload.patientAndTrx, issue: payload.issue,
      transferred: payload.transferredTo, resolution: payload.resolution,
    },
    flag: payload.flagType || '',
    trainingQ: (payload.subformData && payload.subformData.trainingQuestion) || '',
  };

  // Optimistic path — runs synchronously, well under one frame:
  // 1. Put the note in the stack so it renders immediately
  CN_STATE.rollingNotes.unshift(pendingNote);
  // 2. Copy to clipboard NOW so the rep can paste into the CRM without waiting
  cnAutoCopyNote_(pendingNote);
  // 3. Clear the form so the rep can start the next call
  cnClearActiveForm_({ skipSnapshot: true });
  cnFormTimerReset_();
  cnClearStickyFormDraft_();
  // 4. Re-render and bump the counter
  cnRenderStack_();
  cnRenderFilterBar_();
  cnUpdateNoteCounter_();
  showToast('Saved · copied to clipboard', 'toast-success');

  // Server sync in background
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        cnRevertPendingSubmit_(pendingId, restoreSnapshot, res.error || 'Save failed — note restored');
        return;
      }
      const idx = CN_STATE.rollingNotes.findIndex(function (n) { return n.noteId === pendingId; });
      if (idx >= 0) {
        CN_STATE.rollingNotes[idx] = res.note;
        if (currentView === requestedView) {
          cnRenderStack_();
          cnRenderFilterBar_();
        }
      }
      if (opts && typeof opts.onConfirmed === 'function' && currentView === requestedView) {
        try { opts.onConfirmed(res.note); } catch (e) {}
      }
    })
    .withFailureHandler(function (err) {
      cnRevertPendingSubmit_(pendingId, restoreSnapshot, 'Save failed: ' + (err.message || 'unknown') + ' — note restored');
    })
    .submitCallNote(payload);
}

/** Roll back an optimistic submit: drop the pending card from the stack,
 *  restore the form to what the rep had typed, and show an error toast. */
function cnRevertPendingSubmit_(pendingId, snapshot, message) {
  CN_STATE.rollingNotes = CN_STATE.rollingNotes.filter(function (n) { return n.noteId !== pendingId; });
  cnRenderStack_();
  cnRenderFilterBar_();
  cnUpdateNoteCounter_();
  if (snapshot) cnRestoreFromSnapshot_(snapshot);
  showToast(message, 'toast-error');
}

function cnAutoCopyNote_(note) {
  const text = cnFormatNoteForCopy_(note);
  // Try the modern clipboard API first; fall back to textarea+execCommand
  // since HtmlService iframes sometimes deny clipboard permissions.
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { cnFallbackCopy_(text); });
  } else {
    cnFallbackCopy_(text);
  }
}

function cnFallbackCopy_(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  } catch (e) { /* clipboard truly unavailable; toast is the only signal */ }
}

function cnFormatNoteForCopy_(note) {
  // Default mirrors the server's CONFIG.CALL_NOTES.AUTO_COPY_FORMAT so first
  // copies (before cnLoadToday_ populates autoCopyFormat) use the same shape.
  const fmt = CN_STATE.autoCopyFormat
    || ('Callback Number: {callback}\n' +
        'Caller Name: {caller}\n' +
        'Relationship: {relationship}\n' +
        'Issue: {issue}\n' +
        'Transferred To: {transferredTo}\n' +
        'Resolution: {resolution}');
  // Transferred-to defaults to "N/A" when blank so the pasted note has a clear
  // "no transfer" signal (most calls aren't escalated) — matches the email body
  // default in callDataFromNote_ server-side.
  const transferred = (note.transferredTo && note.transferredTo.trim()) || 'N/A';
  return fmt
    .replace(/\{timestamp\}/g,     cnFormatTimestampForCopy_(note.timestamp))
    .replace(/\{callback\}/g,      note.callback || '')
    .replace(/\{caller\}/g,        note.caller || '')
    .replace(/\{relationship\}/g,  note.relationship || '')
    .replace(/\{patientAndTrx\}/g, note.patientAndTrx || '')
    .replace(/\{issue\}/g,         note.issue || '')
    .replace(/\{transferredTo\}/g, transferred)
    .replace(/\{resolution\}/g,    note.resolution || '');
}

/** Update the "X today" counter pill in the form header. Called after every
 *  rollingNotes mutation (submit / delete) and on rolling stack re-render. */
function cnUpdateNoteCounter_() {
  const num = document.getElementById('cn-note-counter-num');
  if (num) num.textContent = String((CN_STATE.rollingNotes || []).length);
}

function cnFormatTimestampForCopy_(iso) {
  if (!iso) return '';
  // iso is "yyyy-MM-dd'T'HH:mm:ss" in the rep's tz; show "h:mm AM/PM"
  const m = iso.match(/T(\d{2}):(\d{2})/);
  if (!m) return iso;
  let h = parseInt(m[1], 10);
  const min = m[2];
  const ampm = h >= 12 ? 'PM' : 'AM';
  if (h === 0) h = 12; else if (h > 12) h -= 12;
  return `${h}:${min} ${ampm}`;
}

// ── Rolling stack render ───────────────────────────────────────────────

function cnRenderStack_() {
  const stack = document.getElementById('cn-stack');
  if (!stack) return;
  // Pinned notes render in the dedicated tray above; exclude them from the
  // rolling stack so they don't appear twice on the page.
  const pinnedIds = {};
  (CN_STATE.pinnedNotes || []).forEach(function (n) { pinnedIds[n.noteId] = true; });
  const filtered = CN_STATE.rollingNotes.filter(function (n) {
    if (pinnedIds[n.noteId]) return false;
    return cnNoteMatchesFilter_(n, CN_STATE.filter);
  });
  if (filtered.length === 0) {
    stack.innerHTML = `<div class="cn-stack-empty">No notes match this filter for today.</div>`;
    return;
  }
  const head = filtered.slice(0, CN_ROLLING_STACK_MAX);
  let html = head.map(cnRenderCard_).join('');
  if (filtered.length > CN_ROLLING_STACK_MAX) {
    html += `<div class="cn-stack-empty">
      ${filtered.length - CN_ROLLING_STACK_MAX} more from earlier today —
      <a href="#" onclick="event.preventDefault(); showView('callNotesHistory');" style="color:var(--accent);text-decoration:none;font-weight:500;">view in History</a>
    </div>`;
  }
  stack.innerHTML = html;
  cnWireCards_(stack);
  cnUpdateNoteCounter_();
}

function cnInstallCardDelegation_(area) {
  if (area._cnDelegationInstalled) return;
  area._cnDelegationInstalled = true;
  area.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-cn-action]');
    if (!btn) return;
    var card = btn.closest('[data-note-id]');
    if (!card) return;
    var noteId = card.dataset.noteId;
    switch (btn.dataset.cnAction) {
      case 'flag':        cnToggleFlag_(noteId, btn.dataset.flagKind); break;
      case 'resolve':     cnToggleResolved_(noteId); break;
      case 'pin':         cnTogglePinned_(noteId); break;
      case 'copy':        cnCopyNoteAgain_(noteId); break;
      case 'email':       cnOpenEmailComposer_(noteId); break;
      case 'edit':        cnBeginEdit_(noteId); break;
      case 'save-edit':   cnSaveEdit_(noteId); break;
      case 'cancel-edit': cnCancelEdit_(noteId); break;
      case 'delete':      cnDeleteNote_(noteId); break;
      case 'find-trx':    cnFindPriorCallsForTrx_(btn.dataset.trx); break;
      case 'more':        cnToggleMoreMenu_(btn); break;
    }
  });
}

function cnReRenderActiveView_() {
  if (currentView === 'callNotes') {
    cnRenderStack_();
  } else if (currentView === 'callNotesHistory') {
    cnRenderHistoryStack_();
  }
}

function cnToggleMoreMenu_(btn) {
  var card = btn.closest('[data-note-id]');
  if (!card) return;
  var menu = card.querySelector('.cn-more-menu');
  if (!menu) return;
  var open = menu.style.display !== 'none';
  menu.style.display = open ? 'none' : 'inline-flex';
}

function cnRenderCard_(note) {
  return cnRenderCardCore_(note, /*expandable*/ true);
}

function cnRenderCardCore_(note, expandable) {
  const isEditing = expandable && CN_STATE.editingNoteId === note.noteId;
  const time = cnFormatTimestampForCopy_(note.timestamp);
  const flagCls = note.flagType ? ' flag-' + note.flagType : '';
  const isStale = note.flagType === 'action' && !note.resolved && cnNoteIsStale_(note);
  const staleCls = isStale ? ' stale-action' : '';
  const pendingCls = note._pending ? ' is-pending' : '';

  if (isEditing) {
    return `
      <div class="cn-card editing${flagCls}" data-note-id="${esc(note.noteId)}">
        <div class="cn-card-row" style="margin-bottom:6px">
          <span class="cn-card-time tabular">${esc(time)}</span>
          <div class="cn-card-main">
            <span class="cn-card-caller" style="opacity:.65">Editing — Ctrl/⌘+Enter saves</span>
          </div>
          <div class="cn-card-actions">
            <button class="cn-act-btn" title="Discard edits" data-cn-action="cancel-edit">${icon('x', 14)}</button>
          </div>
        </div>
        <div class="cn-edit-fields">
          <div><input type="text" placeholder="Callback" id="cnE-callback-${esc(note.noteId)}" value="${esc(note.callback || '')}"></div>
          <div><input type="text" placeholder="Caller" id="cnE-caller-${esc(note.noteId)}" value="${esc(note.caller || '')}"></div>
          <div><input type="text" placeholder="Relationship" id="cnE-relationship-${esc(note.noteId)}" value="${esc(note.relationship || '')}"></div>
          <div><input type="text" placeholder="Patient & TRX" id="cnE-patient-${esc(note.noteId)}" value="${esc(note.patientAndTrx || '')}"></div>
          <div class="full"><textarea placeholder="Issue" id="cnE-issue-${esc(note.noteId)}" rows="2">${esc(note.issue || '')}</textarea></div>
          <div><input type="text" placeholder="Transferred To" id="cnE-transferred-${esc(note.noteId)}" value="${esc(note.transferredTo || '')}"></div>
          <div><textarea placeholder="Resolution" id="cnE-resolution-${esc(note.noteId)}" rows="1">${esc(note.resolution || '')}</textarea></div>
        </div>
        <div class="cn-edit-footer">
          <button class="cn-save-btn" data-cn-action="save-edit">${icon('check', 12)} Save</button>
          <button data-cn-action="cancel-edit">Cancel</button>
          <button class="cn-del-btn" data-cn-action="delete">${icon('trash', 12)} Delete</button>
        </div>
      </div>
    `;
  }

  const callerLine = note.caller || note.patientAndTrx || '<em style="color:var(--muted)">unnamed</em>';
  const trxBit = note.caller && note.patientAndTrx ? `<span class="cn-trx">${esc(note.patientAndTrx)}</span>` : '';
  const issue = note.issue || '<em>—</em>';
  // Training notes carry a free-text question in subformData; surface it as a
  // distinct sub-line under the issue so the rep (and a manager peeking) can
  // see what's being asked at a glance. If the manager has written a reply,
  // it renders directly below the question as an answer line.
  const detailParts = [];
  if (note.callback) detailParts.push(esc(note.callback));
  if (note.relationship) detailParts.push(esc(note.relationship));
  if (note.transferredTo) detailParts.push('→ ' + esc(note.transferredTo));
  const detailLine = detailParts.length > 0
    ? `<div style="font-size:11px;color:var(--muted);margin-top:1px">${detailParts.join(' · ')}</div>` : '';
  const resolutionLine = note.resolution
    ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">↳ ${esc(note.resolution)}</div>` : '';
  let trainingQ = '';
  if (note.flagType === 'training' && note.subformData && note.subformData.trainingQuestion) {
    trainingQ = `<div class="cn-card-training-q">${icon('bulb', 11)}<span>${esc(String(note.subformData.trainingQuestion))}</span></div>`;
    if (note.subformData.trainingReply) {
      trainingQ += `<div class="cn-card-training-a">${icon('checkCircle', 11)}<span>${esc(String(note.subformData.trainingReply))}</span></div>`;
    }
  }

  const flagBtn = function (kind, name, on) {
    const cls = 'cn-act-btn ' + kind + (on ? ' is-on' : '');
    const lbl = kind === 'action' ? 'Flag for action'
              : kind === 'training' ? 'Flag for training'
              : 'Flag as review candidate';
    return `<button class="${cls}" title="${lbl}" data-cn-action="flag" data-flag-kind="${kind}">${icon(name, 14)}</button>`;
  };

  const emailBtn = note.emailedAt
    ? `<button class="cn-act-btn is-sent" title="Email sent at ${esc(cnFormatTimestampForCopy_(note.emailedAt))} — click to send again"
               data-cn-action="email">${icon('mail', 14)}</button>`
    : `<button class="cn-act-btn" title="Compose email from this note"
               data-cn-action="email">${icon('mail', 14)}</button>`;

  const copyBtn = `<button class="cn-act-btn" title="Copy formatted note to clipboard" data-cn-action="copy">${icon('copy', 14)}</button>`;

  const resolveBtn = (note.flagType === 'action')
    ? `<button class="cn-act-btn ${note.resolved ? 'is-on' : ''}" title="${note.resolved ? 'Unresolve' : 'Mark resolved'}"
               data-cn-action="resolve">${icon('check', 14)}</button>`
    : '';

  const editBtn = expandable
    ? `<button class="cn-act-btn" title="Edit note" data-cn-action="edit">${icon('adjust', 14)}</button>`
    : '';

  const priorBtn = (note.patientAndTrx && note.patientAndTrx.trim())
    ? `<button class="cn-act-btn" title="Find prior calls for this TRX" data-cn-action="find-trx" data-trx="${esc(note.patientAndTrx)}">${icon('search', 14)}</button>`
    : '';

  const isPinned = !!(note.subformData && note.subformData.pinned);
  const pinBtn = `<button class="cn-act-btn ${isPinned ? 'is-on' : ''}" title="${isPinned ? 'Unpin note' : 'Pin note (keeps it visible above the stack)'}"
                          data-cn-action="pin">${icon('bookmark', 14)}</button>`;

  return `
    <div class="cn-card${flagCls}${staleCls}${pendingCls}" data-note-id="${esc(note.noteId)}">
      <div class="cn-card-row">
        <span class="cn-card-time tabular">${esc(time)}</span>
        <div class="cn-card-main">
          <div class="cn-card-caller">${callerLine}${trxBit}</div>
          ${detailLine}
          <div class="cn-card-issue">${esc(issue)}</div>
          ${resolutionLine}
          ${trainingQ}
        </div>
        <div class="cn-card-actions">
          ${note._pending
            ? '<span class="cn-pending-badge" title="Saving to server"><span class="cn-pending-dot"></span>Saving</span>'
            : flagBtn('action', 'flag', note.flagType === 'action') +
              flagBtn('training', 'bulb', note.flagType === 'training') +
              pinBtn + copyBtn + emailBtn +
              (function () {
                var sec = flagBtn('review', 'star', note.flagType === 'review') + resolveBtn + editBtn + priorBtn;
                if (!sec) return '';
                return '<button class="cn-act-btn" title="More actions" data-cn-action="more">' + icon('chevronDown', 14) + '</button>' +
                  '<span class="cn-more-menu" style="display:none">' + sec + '</span>';
              })()
          }
        </div>
      </div>
    </div>
  `;
}

function cnWireCards_(_root) { /* no-op — using onclick attrs */ }

function cnCopyNoteAgain_(noteId) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note) return;
  cnAutoCopyNote_(note);
  showToast('Copied to clipboard', 'toast-success');
}

function cnBeginEdit_(noteId) {
  CN_STATE.editingNoteId = noteId;
  cnReRenderActiveView_();
  setTimeout(function () {
    const el = document.getElementById('cnE-resolution-' + noteId);
    if (el) {
      el.focus();
      el.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          cnSaveEdit_(noteId);
        }
      });
    }
  }, 30);
}

function cnCancelEdit_(noteId) {
  CN_STATE.editingNoteId = null;
  cnReRenderActiveView_();
}

function cnSaveEdit_(noteId) {
  const payload = {
    callback:      document.getElementById('cnE-callback-' + noteId).value,
    caller:        document.getElementById('cnE-caller-' + noteId).value,
    relationship:  document.getElementById('cnE-relationship-' + noteId).value,
    patientAndTrx: document.getElementById('cnE-patient-' + noteId).value,
    issue:         document.getElementById('cnE-issue-' + noteId).value,
    transferredTo: document.getElementById('cnE-transferred-' + noteId).value,
    resolution:    document.getElementById('cnE-resolution-' + noteId).value,
  };
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { showToast(res.error || 'Save failed', 'toast-error'); return; }
      cnReplaceNoteInState_(res.note);
      CN_STATE.editingNoteId = null;
      cnReRenderActiveView_();
      cnRenderFilterBar_();
      showToast('Saved', 'toast-success');
    })
    .withFailureHandler(function (err) {
      showToast('Save failed: ' + err.message, 'toast-error');
    })
    .updateCallNote(noteId, payload);
}

function cnDeleteNote_(noteId) {
  if (!confirm('Delete this note? This cannot be undone.')) return;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) { showToast(res.error || 'Delete failed', 'toast-error'); return; }
      CN_STATE.rollingNotes = CN_STATE.rollingNotes.filter(function (n) { return n.noteId !== noteId; });
      CN_STATE.historyNotes = CN_STATE.historyNotes.filter(function (n) { return n.noteId !== noteId; });
      CN_STATE.pinnedNotes = (CN_STATE.pinnedNotes || []).filter(function (n) { return n.noteId !== noteId; });
      CN_STATE.editingNoteId = null;
      cnReRenderActiveView_();
      cnRenderFilterBar_();
      cnRenderPinnedTray_();
      cnUpdateNoteCounter_();
      showToast('Deleted', 'toast-success');
    })
    .withFailureHandler(function (err) {
      showToast('Delete failed: ' + err.message, 'toast-error');
    })
    .deleteCallNote(noteId);
}

function cnToggleFlag_(noteId, kind) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note) return;
  if (note._pending) { showToast('Just a moment — still saving', 'toast-warn'); return; }
  if (note._flagInFlight) return;
  note._flagInFlight = true;
  const prev = { flagType: note.flagType, resolved: note.resolved };
  const next = (note.flagType === kind) ? '' : kind;
  note.flagType = next;
  if (prev.flagType !== next) note.resolved = false;
  cnReRenderActiveView_();
  cnRenderFilterBar_();
  google.script.run
    .withSuccessHandler(function (res) {
      note._flagInFlight = false;
      if (!res.success) {
        note.flagType = prev.flagType; note.resolved = prev.resolved;
        cnReRenderActiveView_(); cnRenderFilterBar_();
        showToast(res.error || 'Flag failed', 'toast-error');
        return;
      }
      cnReplaceNoteInState_(res.note);
      cnReRenderActiveView_();
    })
    .withFailureHandler(function (err) {
      note._flagInFlight = false;
      note.flagType = prev.flagType; note.resolved = prev.resolved;
      cnReRenderActiveView_(); cnRenderFilterBar_();
      showToast('Flag failed: ' + err.message, 'toast-error');
    })
    .setCallNoteFlag(noteId, next);
}

/** Toggle the pinned state on a note — optimistic. The pinned tray
 *  re-renders immediately; on server failure we revert. Server enforces
 *  the 3-pin cap (the error surfaces as a toast). */
function cnTogglePinned_(noteId) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note) return;
  if (note._pending) { showToast('Just a moment — still saving', 'toast-warn'); return; }
  if (note._flagInFlight) return;
  note._flagInFlight = true;
  const wasPinned = !!(note.subformData && note.subformData.pinned);
  var prevPinnedAt = (note.subformData && note.subformData.pinnedAt) || null;
  note.subformData = note.subformData || {};
  note.subformData.pinned = !wasPinned;
  if (!wasPinned) note.subformData.pinnedAt = new Date().toISOString();
  else delete note.subformData.pinnedAt;
  // Mirror into the pinned-tray cache so the tray re-renders right away
  if (!wasPinned) {
    CN_STATE.pinnedNotes = (CN_STATE.pinnedNotes || []).filter(function (n) { return n.noteId !== noteId; });
    CN_STATE.pinnedNotes.unshift(note);
  } else {
    CN_STATE.pinnedNotes = (CN_STATE.pinnedNotes || []).filter(function (n) { return n.noteId !== noteId; });
  }
  cnRenderPinnedTray_();
  cnReRenderActiveView_();
  google.script.run
    .withSuccessHandler(function (res) {
      note._flagInFlight = false;
      if (!res.success) {
        note.subformData.pinned = wasPinned;
        if (prevPinnedAt) note.subformData.pinnedAt = prevPinnedAt;
        else delete note.subformData.pinnedAt;
        cnReloadPinnedTray_();
        cnReRenderActiveView_();
        showToast(res.error || 'Pin failed', 'toast-error');
        return;
      }
      cnReplaceNoteInState_(res.note);
      cnReloadPinnedTray_();
      cnReRenderActiveView_();
    })
    .withFailureHandler(function (err) {
      note._flagInFlight = false;
      note.subformData.pinned = wasPinned;
      if (prevPinnedAt) note.subformData.pinnedAt = prevPinnedAt;
      else delete note.subformData.pinnedAt;
      cnReloadPinnedTray_();
      cnReRenderActiveView_();
      showToast('Pin failed: ' + err.message, 'toast-error');
    })
    .setCallNotePinned(noteId, !wasPinned);
}

/** Re-fetch the pinned tray from the server. Called on view enter and
 *  after pin/unpin to keep the tray authoritative (pinned notes can come
 *  from any past date, so they're not in the today-only rolling stack). */
function cnReloadPinnedTray_() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && !res.error) {
        CN_STATE.pinnedNotes = res.notes || [];
        cnRenderPinnedTray_();
      }
    })
    .getMyPinnedCallNotes();
}

/** Render the pinned-notes tray above the rolling stack. Only renders the
 *  host div's content; the host is created in cnRenderNotesView. */
function cnRenderPinnedTray_() {
  const host = document.getElementById('cn-pinned-tray');
  if (!host) return;
  const pinned = CN_STATE.pinnedNotes || [];
  if (pinned.length === 0) { host.innerHTML = ''; return; }
  host.innerHTML =
    `<div class="cn-pinned-label">${icon('bookmark', 11)}<span>Pinned · ${pinned.length}</span></div>` +
    pinned.map(cnRenderCard_).join('');
}

function cnToggleResolved_(noteId) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note || note.flagType !== 'action') return;
  if (note._pending) { showToast('Just a moment — still saving', 'toast-warn'); return; }
  if (note._flagInFlight) return;
  note._flagInFlight = true;
  const prevResolved = note.resolved;
  note.resolved = !prevResolved;
  cnReRenderActiveView_();
  cnRenderFilterBar_();
  google.script.run
    .withSuccessHandler(function (res) {
      note._flagInFlight = false;
      if (!res.success) {
        note.resolved = prevResolved;
        cnReRenderActiveView_(); cnRenderFilterBar_();
        showToast(res.error || 'Update failed', 'toast-error');
        return;
      }
      cnReplaceNoteInState_(res.note);
      cnReRenderActiveView_();
    })
    .withFailureHandler(function (err) {
      note._flagInFlight = false;
      note.resolved = prevResolved;
      cnReRenderActiveView_(); cnRenderFilterBar_();
      showToast('Update failed: ' + err.message, 'toast-error');
    })
    .setCallNoteResolved(noteId, note.resolved);
}

// ── Filter bar ─────────────────────────────────────────────────────────

function cnRenderFilterBar_() {
  const bar = document.getElementById('cn-filter-bar');
  if (!bar) return;
  CN_STATE.filterCounts = cnComputeFilterCounts_(CN_STATE.rollingNotes);
  const labelFor = { all: 'All', action: 'Action', training: 'Training',
                     review: 'Review', unresolved: 'Unresolved' };
  bar.innerHTML = '<span class="cn-filter-label">Filter</span>' +
    CN_DEFAULT_FILTERS.map(function (f) {
      const count = CN_STATE.filterCounts[f] || 0;
      const pressed = CN_STATE.filter === f;
      // Color class per filter — chip picks up the right hue from styles.html
      const tone = (f === 'action' || f === 'unresolved') ? ' cn-fc-action'
                 : (f === 'training') ? ' cn-fc-training'
                 : (f === 'review') ? ' cn-fc-review'
                 : '';
      return `<button class="cn-filter-chip${tone}" aria-pressed="${pressed}" onclick="cnSetFilter_('${f}')">
                ${labelFor[f] || f} <span class="chip-count">${count}</span>
              </button>`;
    }).join('');
}

function cnSetFilter_(f) {
  CN_STATE.filter = f;
  cnRenderStack_();
  cnRenderFilterBar_();
}

function cnComputeFilterCounts_(notes) {
  const counts = { all: notes.length };
  CN_DEFAULT_FILTERS.forEach(function (f) {
    if (f === 'all') return;
    counts[f] = notes.filter(function (n) { return cnNoteMatchesFilter_(n, f); }).length;
  });
  return counts;
}

function cnNoteMatchesFilter_(note, filter) {
  switch (filter) {
    case 'action':     return note.flagType === 'action';
    case 'training':   return note.flagType === 'training';
    case 'review':     return note.flagType === 'review';
    case 'unresolved': return note.flagType === 'action' && !note.resolved;
    case 'unsent':     return !note.emailedAt;
    case 'all':
    default:           return true;
  }
}

function cnNoteIsStale_(note) {
  if (!note.timestamp) return false;
  // Parse iso "yyyy-MM-dd'T'HH:mm:ss" — assume same tz as the rep, compare
  // naively to "now" (since both clocks are in the rep's tz, the offset
  // cancels for the elapsed-time delta).
  const t = note.timestamp.replace(' ', 'T');
  const parts = t.split('T');
  if (parts.length < 2) return false;
  const d = parts[0].split('-').map(function (x) { return parseInt(x,10); });
  const h = parts[1].split(':').map(function (x) { return parseInt(x,10); });
  if (d.length < 3 || h.length < 2) return false;
  const noteMs = new Date(d[0], d[1]-1, d[2], h[0], h[1], h[2] || 0).getTime();
  // Same calculation for "now" so the local-vs-tz mismatch cancels
  const nowLocal = new Date();
  const tz = CN_STATE.empTz || empState.timezone || 'UTC';
  const fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  }).formatToParts(nowLocal);
  const get = function (k) { const p = fmt.find(function(x){return x.type===k;}); return p ? parseInt(p.value,10) : 0; };
  const nowMs = new Date(get('year'), get('month')-1, get('day'), get('hour'), get('minute'), get('second')).getTime();
  const staleMs = (CN_STATE.staleFlagHours || 1) * 3600 * 1000;
  return (nowMs - noteMs) >= staleMs;
}

// ── Email composer modal ───────────────────────────────────────────────

function cnOpenEmailComposer_(noteId) {
  const note = cnFindNoteAnywhere_(noteId);
  if (!note) return;
  CN_STATE.composer = {
    noteId,
    note,
    step: 'form',  // 'form' | 'preview' | 'sending'
    selections: cnLoadComposerDefaults_(note),
    previewHtml: '',
  };
  cnRenderComposerModal_();
}

function cnLoadComposerDefaults_(note) {
  // Restore prior selections if the rep is re-sending; otherwise empty.
  if (note.subformData && typeof note.subformData === 'object') {
    return Object.assign({
      departments: [], individualEmail: '', updateInfo: '',
      callbackNeeded: false,
    }, note.subformData);
  }
  const lsKey = 'umsCallNotesLastDept';
  let lastDept = [];
  try { lastDept = JSON.parse(localStorage.getItem(lsKey) || '[]'); } catch (e) {}
  return {
    departments: Array.isArray(lastDept) ? lastDept : [],
    individualEmail: '',
    updateInfo: '',
    callbackNeeded: false,
    overwriteResolution: false,
    shippingDetails: null,
    closeDetails: null,
    resupplyDetails: null,
    oopDetails: null,
  };
}

function cnCloseComposerModal_() {
  CN_STATE.composer = null;
  const overlay = document.getElementById('cn-compose-overlay');
  if (overlay) overlay.remove();
}

function cnRenderComposerModal_() {
  let overlay = document.getElementById('cn-compose-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'cn-compose-overlay';
    overlay.className = 'overlay open';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) cnCloseComposerModal_();
    });
  }
  const c = CN_STATE.composer;
  if (!c) { overlay.remove(); return; }
  if (c.step === 'form')    overlay.innerHTML = cnRenderComposerFormStep_();
  if (c.step === 'preview') overlay.innerHTML = cnRenderComposerPreviewStep_();
  if (c.step === 'form')    cnWireComposerForm_();
}

function cnRenderComposerFormStep_() {
  const c = CN_STATE.composer;
  const cfg = CN_STATE.deptConfig || { departments: [], suggestionsByDept: {}, defaultSuggestions: [] };
  const depts = cfg.departments;
  const selected = c.selections.departments || [];

  const deptChips = depts.map(function (d) {
    const on = selected.indexOf(d) >= 0;
    // data-dept lets cnUpdateComposerDeptUI_ toggle aria-pressed in place
    // without a full modal re-render (which would cause the modal to flash).
    return `<button type="button" class="cn-dept-chip" aria-pressed="${on}" data-dept="${esc(d)}"
                    onclick="cnToggleComposerDept_(this.dataset.dept)">${esc(d)}</button>`;
  }).join('');

  const otherEmailRow = selected.indexOf('Other') >= 0 ? `
    <div class="field" id="cnC-other-row" style="margin-top:8px">
      <label>"Other" email addresses (comma-separated)</label>
      <input type="text" id="cnC-individual-email" value="${esc(c.selections.individualEmail || '')}"
             placeholder="name@example.com, other@example.com">
    </div>` : '';

  const updateOptions = (function () {
    const set = new Set();
    selected.forEach(function (d) { (cfg.suggestionsByDept[d] || []).forEach(function (s) { set.add(s); }); });
    (cfg.defaultSuggestions || []).forEach(function (s) { set.add(s); });
    return Array.from(set);
  })();
  const updateDatalist = updateOptions.map(function (o) { return `<option value="${esc(o)}">`; }).join('');

  return `
    <div class="modal" style="max-width:560px;resize:both;overflow:auto" id="cnC-modal">
      <div class="modal-title" style="cursor:move" onmousedown="cnStartDragModal_(event)">Compose email</div>
      <div class="modal-sub">
        For: <strong>${esc(c.note.caller || c.note.patientAndTrx || 'this call')}</strong> · ${esc(c.note.patientAndTrx || '')}
      </div>

      <div class="cn-compose-section">
        <div class="cn-compose-section-title">Recipients</div>
        <div class="cn-compose-dept-grid">${deptChips}</div>
        ${otherEmailRow}
      </div>

      <div class="cn-compose-section">
        <div class="cn-compose-section-title">Update Type</div>
        <div class="field" style="margin:0">
          <input type="text" id="cnC-update-info" list="cnC-update-options"
                 placeholder="Type or pick…" value="${esc(c.selections.updateInfo || '')}"
                 oninput="cnComposerUpdateInfoChanged_()" onchange="cnComposerUpdateInfoChanged_()">
          <datalist id="cnC-update-options">${updateDatalist}</datalist>
        </div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)">

function cnToggleComposerDept_(dept) {
  const c = CN_STATE.composer; if (!c) return;
  // Snapshot any in-progress subform values into state BEFORE we touch the DOM
  // — even though we're updating in place, gathering ensures the
  // s.shippingDetails/etc. state stays current for the eventual Preview call.
  try { cnGatherComposerSelections_(); } catch (e) { /* subform not in DOM yet */ }
  const idx = c.selections.departments.indexOf(dept);
  if (idx >= 0) c.selections.departments.splice(idx, 1);
  else c.selections.departments.push(dept);
  // Persist a "last dept selection" for the next compose call
  try { localStorage.setItem('umsCallNotesLastDept', JSON.stringify(c.selections.departments)); } catch (e) {}
  // Update only the parts of the modal that depend on the dept selection:
  // chip aria-pressed states, the conditional "Other email" row, and the
  // update-type datalist's suggestion set. Full modal re-render caused a
  // visible flash on every toggle.
  cnUpdateComposerDeptUI_();
}

/** In-place update of the compose modal's department-dependent UI:
 *  chip aria-pressed states, the "Other" email row, and the update-type
 *  datalist's options. Called by cnToggleComposerDept_ so the modal doesn't
 *  flash on every chip click. */
function cnUpdateComposerDeptUI_() {
  const c = CN_STATE.composer; if (!c) return;
  const cfg = CN_STATE.deptConfig || { departments: [], suggestionsByDept: {}, defaultSuggestions: [] };
  const selected = c.selections.departments || [];

  // 1. Chip aria-pressed
  document.querySelectorAll('.cn-dept-chip[data-dept]').forEach(function (chip) {
    chip.setAttribute('aria-pressed', selected.indexOf(chip.dataset.dept) >= 0 ? 'true' : 'false');
  });

  // 2. "Other" email row: show when Other is selected, hide otherwise.
  // Preserves whatever the rep typed by reading the input before removing.
  const hasOther = selected.indexOf('Other') >= 0;
  let otherRow = document.getElementById('cnC-other-row');
  if (hasOther && !otherRow) {
    const grid = document.querySelector('.cn-compose-dept-grid');
    if (grid && grid.parentElement) {
      const wrapper = document.createElement('div');
      wrapper.className = 'field';
      wrapper.id = 'cnC-other-row';
      wrapper.style.marginTop = '8px';
      wrapper.innerHTML =
        '<label>"Other" email addresses (comma-separated)</label>' +
        '<input type="text" id="cnC-individual-email" value="' +
          esc(c.selections.individualEmail || '') +
        '" placeholder="name@example.com, other@example.com">';
      grid.parentElement.insertBefore(wrapper, grid.nextSibling);
    }
  } else if (!hasOther && otherRow) {
    const inp = document.getElementById('cnC-individual-email');
    if (inp) c.selections.individualEmail = inp.value;
    otherRow.remove();
  }

  // 3. Update-type datalist — rebuild options in-place
  const datalist = document.getElementById('cnC-update-options');
  if (datalist) {
    const set = new Set();
    selected.forEach(function (d) { (cfg.suggestionsByDept[d] || []).forEach(function (s) { set.add(s); }); });
    (cfg.defaultSuggestions || []).forEach(function (s) { set.add(s); });
    datalist.innerHTML = Array.from(set).map(function (o) { return '<option value="' + esc(o) + '">'; }).join('');
  }
}

function cnRenderSubforms_() {
  const c = CN_STATE.composer; if (!c) return;
  const host = document.getElementById('cnC-subforms');
  if (!host) return;
  const u = String(c.selections.updateInfo || '').toLowerCase().trim();
  // Compute the "shape" key — which subforms render for this update type.
  // If the shape hasn't changed since the last render, skip re-rendering to
  // preserve in-progress typing. cnComposerUpdateInfoChanged_ fires on every
  // keystroke into the Update Type field; without this guard, every partial
  // string would rebuild the subform host and wipe whatever the rep typed
  // into the existing subform fields.
  const key = cnSubformShapeKey_(u);
  if (host.dataset.shapeKey === key) return;
  // Shape is changing — snapshot whatever was in the DOM into state before
  // wiping. If the rep types "verified shipping", fills the shipping subform,
  // then backspaces to "verified shippin" and re-types, their shipping values
  // come back pre-populated from state.
  try { cnGatherComposerSelections_(); } catch (e) { /* prior subform not in DOM */ }
  let html = '';
  if (u === 'verified shipping' || u === 'oop order') html += cnRenderShippingSubform_();
  if (u === 'close order')                            html += cnRenderCloseSubform_();
  if (u === 'repeat resupply')                        html += cnRenderResupplySubform_();
  if (u === 'oop order')                              html += cnRenderOopSubform_();
  host.innerHTML = html;
  host.dataset.shapeKey = key;
}

function cnSubformShapeKey_(u) {
  const keys = [];
  if (u === 'verified shipping' || u === 'oop order') keys.push('shipping');
  if (u === 'close order')                            keys.push('close');
  if (u === 'repeat resupply')                        keys.push('resupply');
  if (u === 'oop order')                              keys.push('oop');
  return keys.join('+');
}

function cnStateOptionsHtml_(selected) {
  const rates = (CN_STATE.deptConfig && CN_STATE.deptConfig.stateTaxRates) || {};

  }).join('');

function cnAutoDetectState_(addrText) {
  const cfg = CN_STATE.deptConfig || {};
  const abbrMap = cfg.stateAbbrToName || {};
  const rates = cfg.stateTaxRates || {};
  if (!addrText) return;
  const val = addrText.toUpperCase();
  const words = val.replace(/[^A-Z\s]/g, ' ').split(/\s+/);
  let detected = null;
  for (let i = words.length - 1; i >= 0; i--) {
    if (abbrMap[words[i]]) { detected = abbrMap[words[i]]; break; }
  }
  if (!detected) {
    for (const full of Object.keys(rates)) {
      if (val.indexOf(full.toUpperCase()) >= 0) { detected = full; break; }
    }
  }
  if (detected) {
    const sel = document.getElementById('cnS-state');
    if (sel) { sel.value = detected; cnRecalcOop_(); }
  }
}

function cnRecalcOop_() {
  const baseEl = document.getElementById('cnO-base');
  const shipEl = document.getElementById('cnO-shipping');
  const stateEl = document.getElementById('cnS-state');
  const rxEl = document.getElementById('cnO-rx');
  if (!baseEl) return;
  const base = parseFloat(baseEl.value) || 0;
  const shipStr = (shipEl && shipEl.value) || '';
  let shipping = 0;
  let shippingLabel = 'Custom';
  if (/\$14\.99/.test(shipStr))      { shipping = 14.99; shippingLabel = 'Category 1'; }
  else if (/\$19\.99/.test(shipStr)) { shipping = 19.99; shippingLabel = 'Category 2'; }
  else {
    const n = parseFloat(String(shipStr).replace(/[^0-9.]/g, ''));
    shipping = isNaN(n) ? 0 : n;
    shippingLabel = 'Custom Amount';
  }
  const state = (stateEl && stateEl.value) || '';
  const rxYes = rxEl && rxEl.value === 'Yes';
  const rates = (CN_STATE.deptConfig && CN_STATE.deptConfig.stateTaxRates) || {};
  const rate = rxYes ? 0 : (rates[state] || 0);
  const tax = base * rate;
  const total = base + shipping + tax;
  const taxDispEl = document.getElementById('cnO-tax-disp');
  if (taxDispEl) {
    if (rxYes) taxDispEl.textContent = '$0.00 (Rx exempt)';
    else if (!state) taxDispEl.textContent = 'Pick state in shipping';
    else taxDispEl.textContent = '$' + tax.toFixed(2) + ' (' + (rate * 100).toFixed(2) + '% ' + state + ')';
  }
  const totalEl = document.getElementById('cnO-total-disp');
  if (totalEl) totalEl.textContent = '$' + total.toFixed(2);
}

  if (u === 'oop order') {
    cnRecalcOop_();
    const baseEl = document.getElementById('cnO-base');
    const shipEl = document.getElementById('cnO-shipping');
    const rxEl   = document.getElementById('cnO-rx');
    const stateEl = document.getElementById('cnS-state');
    const base = parseFloat(baseEl.value) || 0;
    const shipStr = (shipEl && shipEl.value) || '';
    let shipping = 0; let shippingLabel = 'Custom';
    if (/\$14\.99/.test(shipStr))      { shipping = 14.99; shippingLabel = 'Category 1'; }
    else if (/\$19\.99/.test(shipStr)) { shipping = 19.99; shippingLabel = 'Category 2'; }
    else {
      const n = parseFloat(String(shipStr).replace(/[^0-9.]/g, ''));
      shipping = isNaN(n) ? 0 : n; shippingLabel = 'Custom Amount';
    }
    const rxYes = rxEl && rxEl.value === 'Yes';
    const rates = (CN_STATE.deptConfig && CN_STATE.deptConfig.stateTaxRates) || {};
    const state = stateEl && stateEl.value;
    const rate = rxYes ? 0 : (rates[state] || 0);
    const tax = base * rate;
    s.oopDetails = {
      baseCost:     base.toFixed(2),
      shippingCost: shipping.toFixed(2),

  }
  if (!c.selections.updateInfo) {
    showToast('Pick or type an Update type first', 'toast-warn'); return;

  google.script.run
    .withSuccessHandler(function (res) {
      if (res.error) { showToast(res.error, 'toast-error'); return; }
      c.preview = res;
      c.step = 'preview';
      cnRenderComposerModal_();
    })
    .withFailureHandler(function (err) {
      showToast('Preview failed: ' + err.message, 'toast-error');
    })
    .previewCallNoteEmail(c.noteId, c.selections);
}

      <div class="cn-compose-preview">${p.htmlBody}</div>
      <div class="modal-footer">
        <button class="btn-modal-cancel" onclick="cnComposerBackToForm_()">← Back to edit</button>
        <button class="btn-modal-ok" id="cnC-send-btn" onclick="cnComposerSend_()">${icon('mail', 14)} Send Email</button>
      </div>
    </div>
  `;
}

function cnComposerBackToForm_() {
  const c = CN_STATE.composer; if (!c) return;
  c.step = 'form';
  cnRenderComposerModal_();
}

function cnComposerSend_() {
  const c = CN_STATE.composer; if (!c) return;
  const btn = document.getElementById('cnC-send-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  // Pass the previewed bodyHash so the server can refuse to send if the note
  // body changed since Preview (rep edited the note in a different tab).
  // Without this, the email body could differ from what the rep just confirmed.
  const expectedHash = c.preview && c.preview.bodyHash;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res.success) {
        if (btn) { btn.disabled = false; btn.innerHTML = icon('mail', 14) + ' Send Email'; }
        showToast(res.error || 'Send failed', 'toast-error'); return;
      }
      // Stamp emailedAt on the cached note
      const idx = CN_STATE.rollingNotes.findIndex(function (n) { return n.noteId === c.noteId; });
      if (idx >= 0) {
        CN_STATE.rollingNotes[idx].emailedAt = res.emailedAt;
        CN_STATE.rollingNotes[idx].emailDepartments = c.selections.departments.join(', ');
        CN_STATE.rollingNotes[idx].subformData = c.selections;
      }
      cnCloseComposerModal_();
      cnReRenderActiveView_();
      cnRenderFilterBar_();
      showToast('Email sent', 'toast-success');
    })
    .withFailureHandler(function (err) {
      if (btn) { btn.disabled = false; btn.innerHTML = icon('mail', 14) + ' Send Email'; }
      showToast('Send failed: ' + err.message, 'toast-error');
    })
    .emailFromCallNote(c.noteId, c.selections, expectedHash);
}
