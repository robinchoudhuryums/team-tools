<style>
/* The .sp-tasks/.sp-task status-card vocabulary MOVED to styles.html — it is
   now SHARED by the Spanish Inbox and Dept Requests views (operator feedback
   2026-08-06: the two pages use one card language). Spanish-only styles
   (.sp-suggest*, .sp-resolved-when, sp-body expand) stay below. */
/* Content-aware tool suggestions on a Spanish-inbox task (heuristic; deep-links
   to the relevant Intake form / Call Notes log). */
.sp-suggest-wrap:empty { display: none; }
.sp-suggests { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.sp-suggest-lbl { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sp-suggest { appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-2);
  color: var(--ink); font: inherit; font-size: 12px; font-weight: 600; }
.sp-suggest:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--success-deep); }
.sp-suggest svg { flex-shrink: 0; }

/* ═══════════════════════════════════════════════════════════════════════
   METRICS — view-scoped styles
   ───────────────────────────────────────────────────────────────────────
   Layered on top of styles.html + design tokens. Owns the KPI tiles,
   per-rep metrics table, and note-coverage badges. Reflows gracefully
   into compact-mode (~360–440px) widths.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── KPI tiles ──────────────────────────────────────────────────── */
.m-kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
}
.m-kpi {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-sm) var(--space-md);
  text-align: center;
}
.m-kpi-value {
  font-size: 1.6rem;
  font-weight: 700;
  font-family: var(--font-tight);
  color: var(--ink);
  line-height: 1.2;
}
.m-kpi-label {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-top: 2px;
}
.m-kpi--accent .m-kpi-value { color: var(--accent); }
.m-kpi--warn .m-kpi-value   { color: var(--warn); }
.m-kpi--good .m-kpi-value   { color: var(--good); }

/* ── Coverage badge ─────────────────────────────────────────────── */
.m-coverage {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.8rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
}
.m-coverage--high { background: var(--accent-soft); color: var(--success-deep); }
.m-coverage--mid  { background: var(--warn-soft); color: var(--warning-deep); }
.m-coverage--low  { background: var(--destructive-soft); color: var(--danger-deep); }

/* ── Sidebar alert badge ────────────────────────────────────────── */
.m-alert-badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--danger); color: white;
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  min-width: 28px; height: 16px; padding: 0 4px;
  border-radius: 999px;
  margin-left: 6px;
}

/* ── Date picker row ────────────────────────────────────────────── */
.m-controls {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
  flex-wrap: wrap;
}
.m-controls input[type="date"] {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper-card);
  color: var(--ink);
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.m-controls input[type="date"]:focus {
  border-color: var(--accent); box-shadow: var(--ring-focus); outline: none;
}

/* ── Team table ─────────────────────────────────────────────────── */
.m-table-wrap {
  overflow-x: auto;
  margin-top: var(--space-sm);
}
.m-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
.m-table th {
  text-align: left;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  padding: 6px 10px;
  border-bottom: 2px solid var(--line);
  white-space: nowrap;
  cursor: default;
}
.m-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.m-table tr:hover td { background: var(--paper-2); }
.m-table .m-num { text-align: right; font-family: var(--font-mono); }
.m-table .m-name { font-weight: 500; }

/* ── Empty / loading states ─────────────────────────────────────── */
.m-empty {
  text-align: center;
  color: var(--muted);
  padding: var(--space-lg) var(--space-md);
  border: 1.5px dashed var(--line-2); border-radius: var(--radius-md);
  font-size: 0.9rem;
}
.m-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  padding: var(--space-lg);
  color: var(--muted);
}
.m-section-title {
  font-family: var(--font-tight);
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--ink);
  margin: var(--space-md) 0 var(--space-sm) 0;
}
.m-hint {
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: var(--space-sm);
}

/* ── Sparkline ──────────────────────────────────────────────────── */
.m-sparkline-wrap {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-sm) var(--space-md);
  margin-bottom: var(--space-md);
}
.m-sparkline-wrap h3 {
  font-family: var(--font-tight);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 0 0 var(--space-xs) 0;
}
.m-sparkline-svg { display: block; width: 100%; height: 60px; }
.m-sparkline-svg line { stroke: var(--line); stroke-width: 0.5; }
.m-sparkline-svg polyline {
  fill: none; stroke: var(--accent); stroke-width: 1.5;
  stroke-linejoin: round; stroke-linecap: round;
}
.m-sparkline-svg circle { fill: var(--accent); }
.m-sparkline-labels {
  display: flex; justify-content: space-between;
  font-size: 0.65rem; color: var(--muted); margin-top: 2px;
}

/* ── Preset chips ──────────────────────────────────────────────── */
/* ── Phase 2 — sub-queue views on the Transfer KPI ── */
.m-scope { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.m-scope-btn {
  appearance: none; -webkit-appearance: none; font: inherit; font-size: var(--text-xs);
  background: var(--paper-2); color: var(--muted); border: 1px solid var(--line);
  border-radius: var(--radius-pill); padding: 3px 12px; cursor: pointer;
}
.m-scope-btn:hover { background: var(--accent-soft); color: var(--accent); }
.m-scope-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.m-scope-hint { font-family: var(--mono); font-size: 11px; color: var(--muted-2); margin-left: 4px; }
/* The disclosure lives inside a numeric cell, so it must not look like a pill
   competing with the value — it IS the value, plus a chevron. */
.m-qtoggle {
  appearance: none; -webkit-appearance: none; font: inherit; font-variant-numeric: tabular-nums;
  background: none; border: 0; padding: 0; color: inherit; cursor: pointer;
  display: inline-flex; align-items: center; gap: 3px;
}
.m-qtoggle:hover { color: var(--accent); }
.m-qtoggle svg { transition: transform .18s ease; }
.m-qtoggle.open svg { transform: rotate(180deg); }
.m-qbar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 3px; min-width: 60px; }
.m-qseg { display: block; height: 100%; }
.m-qseg-rest { background: var(--muted-3); }
.m-qdetail { padding: 8px 4px 4px; }
.m-qrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: var(--text-xs); }
.m-qdot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; display: inline-block; }
.m-qdot-rest { background: var(--muted-3); }
.m-qname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.m-qval { font-family: var(--mono); color: var(--muted); }
.m-qnone { color: var(--muted); font-style: italic; }
.m-qfoot { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line);
  font-size: 11px; color: var(--muted-2); }
/* A2/INV: a real VIEWPORT breakpoint, not a data-compact override — the two
   triggers are independent, and this table is manager-facing on tablets. */
@media (max-width: 720px) {
  .m-qbar { min-width: 40px; }
  .m-scope-hint { width: 100%; margin-left: 0; }
}
/* (.m-preset-chip retired with operator #2 — the Team presets now use the
   shared .toolbar-tab pressed-state chips; INV-184: no dead selectors.) */

/* ── #2/#3 — Custom… + Match-diagnostics disclosures ─────────────── */
.m-custom-row { margin-top: calc(-1 * var(--space-xs)); }
/* The class rule `.m-controls { display:flex }` out-specifies the UA's
   `[hidden] { display:none }`, so the attribute alone never hides the row —
   the classic hidden-vs-display override. MEASURED (the first shoot rendered
   both custom rows visible with a preset active); this rule restores the
   attribute's meaning at higher specificity. */
.m-custom-row[hidden] { display: none; }
.m-diag { margin-top: var(--space-md); }
.m-diag-toggle {
  appearance: none; -webkit-appearance: none; font: inherit; font-size: 0.78rem;
  background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
}
.m-diag-toggle:hover { color: var(--ink); }
.m-diag-toggle svg:last-child { transition: transform .18s ease; }
.m-diag-toggle.open svg:last-child { transform: rotate(180deg); }
#m-diag-body { margin-top: var(--space-xs); }

/* ── #4 — answer-rate target line + label ────────────────────────── */
.m-hero-spark svg .m-spark-target {
  stroke: var(--warn); stroke-dasharray: 2 3; stroke-width: 1; fill: none; opacity: .75;
}
.m-hero-target { color: var(--muted); }

/* ── #6 — inline nav CTA (link treatment per V-12: navigation, not a pill) */
.m-cta-link {
  appearance: none; -webkit-appearance: none; background: none; border: 0; padding: 0;
  font: inherit; font-size: inherit; color: var(--info-deep);
  text-decoration: underline; cursor: pointer;
}

/* ── #7 — best/worst day line (range mode hero) ──────────────────── */
.m-hero-bw { font-size: 0.78rem; margin-top: 2px; color: var(--muted); }
.m-hero-bw .pos { color: var(--success-deep); font-weight: 600; }
.m-hero-bw .neg { color: var(--warning-deep); font-weight: 600; }

/* ── #9 — rep drill-through (link treatment, V-12) ───────────────── */
.m-rep-link {
  appearance: none; -webkit-appearance: none; background: none; border: 0; padding: 0;
  font: inherit; color: inherit; cursor: pointer;
}
.m-rep-link:hover { color: var(--info-deep); text-decoration: underline; }

/* ── #10 — copy-table button ─────────────────────────────────────── */
.m-section-row { display: flex; align-items: center; gap: var(--space-sm); }
.m-copy-btn {
  appearance: none; -webkit-appearance: none; font: inherit; font-size: var(--text-xs);
  background: var(--paper-2); color: var(--muted); border: 1px solid var(--line);
  border-radius: var(--radius-pill); padding: 2px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
}
.m-copy-btn:hover { background: var(--accent-soft); color: var(--accent); }

/* ── Hero + Rail layout (V4·E4) ────────────────────────────────────
   Replaces the prior 6-tile KPI grid with a hero answer-rate +
   side rail of supporting metrics. Hero carries the big tabular
   number + "vs avg" delta + 30-day sparkline; the rail stacks
   .m-row cards each with their own value + comparison. */
.m-layout {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
  /* Natural heights (the .dash-trk precedent): without this the hero card
     stretches to the 5-row rail's height and the bottom-anchored sparkline
     leaves a dead blank band through the card's middle. */
  align-items: start;
}
.m-hero {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  display: flex; flex-direction: column;
  min-width: 0;
}
.m-hero-label {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
  margin-bottom: 6px;
}
.m-hero-value {
  font-family: var(--mono); font-size: 56px; font-weight: 500;
  line-height: 1; letter-spacing: -.02em; color: var(--ink);
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum', 'ss01';
  display: flex; align-items: baseline; gap: 6px;
}
.m-hero-value .unit {
  font-size: 24px; font-weight: 400; color: var(--muted);
  letter-spacing: 0;
}
.m-hero-delta {
  font-family: var(--ui); font-size: 13px;
  color: var(--muted); margin-top: 8px;
}
.m-hero-delta .pos { color: var(--success-deep); font-weight: 600; }
.m-hero-delta .neg { color: var(--danger-deep); font-weight: 600; }
.m-hero-delta .neu { color: var(--muted); font-weight: 600; }
.m-hero-spark {
  margin-top: auto; padding-top: var(--space-sm);
}
.m-hero-spark svg { display: block; width: 100%; height: 84px; }   /* viewBox is 60 high — the 1.4x preserveAspectRatio:none stretch is imperceptible; do NOT add vector-effect:non-scaling-stroke (it moves the §4 draw-in dasharray to screen space, where --len:600 under-runs the stretched path) */
.m-hero-spark line { stroke: var(--line); stroke-width: 0.5; }
.m-hero-spark polyline {
  fill: none; stroke: var(--accent); stroke-width: 1.5;
  stroke-linejoin: round; stroke-linecap: round;
}
.m-hero-spark circle { fill: var(--accent); }
.m-hero-spark .baseline {
  stroke: var(--muted-3); stroke-width: 0.5; stroke-dasharray: 2 3;
}
.m-hero-spark-labels {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--muted); margin-top: 2px;
  font-family: var(--mono); letter-spacing: .04em;
}

/* T4 #5/#6 — own-vs-team-avg KPI trend cards. Team line is muted + dashed,
   own line is the accent (matching the hero sparkline vocabulary). The team
   value reads "—" on cohort-suppressed days (privacy guard, N=3). */
.m-trends { margin-top: var(--space-md); }
.m-trends-head {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 6px;
}
.m-trends-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 8px;
}
.m-kpi-card {
  background: var(--paper-card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 8px 10px;
}
.m-kpi-top {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  margin-bottom: 2px;
}
.m-kpi-label { font-size: 12px; font-weight: 600; color: var(--ink); }
.m-kpi-vals { font-family: var(--mono); font-size: 11px; }
.m-kpi-vals .own  { color: var(--accent); font-weight: 700; }
.m-kpi-vals .team { color: var(--muted); margin-left: 6px; }
.m-dual-spark { display: block; width: 100%; height: 46px; }
.m-dual-spark .own-line {
  fill: none; stroke: var(--accent); stroke-width: 1.5;
  stroke-linejoin: round; stroke-linecap: round;
}
.m-dual-spark .team-line {
  fill: none; stroke: var(--muted-3); stroke-width: 1; stroke-dasharray: 3 3;
  stroke-linejoin: round; stroke-linecap: round;
}
.m-dual-spark .own-dot { fill: var(--accent); }
.m-trends-note { font-size: 10px; color: var(--muted); margin-top: 6px; }

.m-rail {
  display: flex; flex-direction: column; gap: 6px;
}
.m-row {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 14px;
  display: grid; grid-template-columns: 1fr auto;
  gap: 6px; align-items: center;
}
.m-row-label {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
}
.m-row-value {
  font-family: var(--mono); font-size: 18px; font-weight: 500;
  color: var(--ink); line-height: 1;
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum', 'ss01';
  text-align: right;
}
.m-row-value.warn  { color: var(--warning-deep); }
.m-row-value.good  { color: var(--success-deep); }
.m-row-value.crit  { color: var(--danger-deep); }
.m-row-sub {
  grid-column: 1 / -1;
  font-family: var(--ui); font-size: 11px; color: var(--muted);
  margin-top: 2px;
}

/* ── Compact mode ───────────────────────────────────────────────── */
:root[data-compact] .m-kpi-grid { grid-template-columns: repeat(3, 1fr); }
:root[data-compact] .m-kpi-value { font-size: 1.2rem; }
:root[data-compact] .m-sparkline-svg { height: 40px; }
:root[data-compact] .m-layout { grid-template-columns: 1fr; gap: var(--space-sm); }
:root[data-compact] .m-hero-value { font-size: 42px; }
:root[data-compact] .m-hero-value .unit { font-size: 18px; }
:root[data-compact] .m-hero-spark svg { height: 40px; }

/* ── Narrow viewports (A2, cycle 13) ─────────────────────────────────
   `:root[data-compact]` above is the POP-OUT (?compact=1), NOT a viewport
   breakpoint — the two are different triggers, and Metrics carried no media
   query at all, so a 1.4fr/1fr grid with a 42px hero numeral never stacked on
   a phone. My Stats is rep-facing, so this is a rep-visible surface. The
   shell's own breakpoints are 1023px (mobile chrome) / 540px; stack at 720px
   so the split collapses before the columns get narrower than the hero
   numeral, matching .timeoff-layout's 900px precedent in styles.html. */
@media (max-width: 720px) {
  .m-layout { grid-template-columns: 1fr; gap: var(--space-sm); }
  .m-hero-value { font-size: 42px; }
  .m-hero-value .unit { font-size: 18px; }
}

/* §6 — My Stats trend-window presets (shared .toolbar-tabs) */
.m-preset-tabs { margin-left: auto; }

/* §6 — rail-row inline sparkline (where per-day data exists, C4) */
.m-row-spark { grid-column: 1 / -1; margin-top: 4px; }
.m-row-spark svg { display: block; width: 100%; height: 20px; }
.m-row-spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.m-row-spark.warn polyline { stroke: var(--warn); }

/* §6 — tri-tone % Answered cells (same thresholds as mCoverageBadge_) */
.m-pct-high { color: var(--success-deep); font-weight: 700; }
.m-pct-mid  { color: var(--warning-deep); font-weight: 700; }
.m-pct-low  { color: var(--danger-deep); font-weight: 700; }

/* §6 — sortable + sticky team table */
.m-table-wrap { max-height: 62vh; overflow: auto; }
.m-table thead th { position: sticky; top: 0; background: var(--paper-card); z-index: 1; }
.m-table th.m-sortable { cursor: pointer; user-select: none; }
.m-table th.m-sortable:hover { color: var(--ink); }
.m-table th .m-caret { display: inline-block; width: 9px; margin-left: 3px; color: var(--accent); }
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  METRICS — My Stats + Team Metrics views
// ════════════════════════════════════════════════════════════════════════════

var M_STATE = { myDate: null, teamFrom: null, teamTo: null,
  myMode: 'single', myFrom: '', myTo: '', myData: null,            // §6/#1 My Stats single date | aggregated range + cache
  teamSort: { key: 'pctAnswered', dir: 'desc' }, teamData: null,   // §6 sortable team table + cache
  customOpen: {},      // #2 — per-tab ('my'/'team') Custom… row visibility (survives sort/SWR re-renders)
  diagOpen: false };   // #3 — Match-diagnostics disclosure state (survives sort re-renders)

// F7 (cycle 16) — MIRRORS the server's `CDR_QUEUE_UNGROUPED` (Code.js). The
// "N queue(s) are not mapped to a department yet" hint is found by comparing a
// group name against this sentinel, so a server-side rename silently stops the
// hint rendering — and that hint is the ONLY thing telling an operator an
// unmapped queue exists, which is the whole reason groupQueueRows_ emits the
// bucket instead of dropping it (INV-181). Cycle-15 F4 pinned this same
// constant in test/visual/mock.js while the SHIPPING client kept a bare
// literal; named + pinned + in MIRROR_INDEX now.
var M_QUEUE_UNGROUPED = 'Ungrouped';

function mTodayIso_() {
  // Derive "today" in the employee's roster timezone (empTz/isoDateTz from
  // script_core.html) — NOT the browser's local time — so offshore reps
  // (IST/PHT) and anyone near midnight see the correct day's CDR data, matching
  // how Clock / Time Off / Manager / Export derive the date everywhere else.
  try { return isoDateTz(empTz()); } catch (_) { return ''; }
}

function mDaysAgo_(n) {
  // n calendar days before the employee-tz "today" (UTC-noon anchor keeps it
  // DST-safe), consistent with the History view's range math.
  try {
    var d = new Date(isoDateTz(empTz()) + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() - n);
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  } catch (_) { return ''; }
}


function mCoverageBadge_(pct) {
  if (pct == null) return '';
  var cls = pct >= 80 ? 'm-coverage--high' : pct >= 50 ? 'm-coverage--mid' : 'm-coverage--low';
  return '<span class="m-coverage ' + cls + '">' + pct + '% coverage</span>';
}

// ── My Stats view ─────────────────────────────────────────────────────

function enterMetricsMyStatsView() {
  // Stop the Clock view's 1Hz live-time + 60s ribbon-now-cursor intervals so
  // they don't keep firing in the background after navigating here (INV-73 —
  // matches the Time Off / Manager / Call Notes enters).
  if (typeof stopClock === 'function') stopClock();
  var area = document.getElementById('view-area');
  if (!area) return;
  M_STATE.myDate = M_STATE.myDate || mTodayIso_();

  area.innerHTML =
    (COMPACT_MODE ? '<div class="compact-header">' + icon('chart', 16) + ' My Stats</div>' : '') +
    '<div class="view-title-row" style="' + (COMPACT_MODE ? 'display:none' : '') + '">' +
      '<h1 class="view-title">My Call Metrics</h1>' +
    '</div>' +
    '<div class="m-controls">' +
      // Today/7D/30D presets — Today = single-day rich view (own-vs-team series);
      // 7D/30D = server-AGGREGATED ranges (#1). A specific past day / custom
      // span lives behind the shared Custom… disclosure (operator #2 — the
      // three overlapping pickers were clutter, worst on mobile).
      '<div class="toolbar-tabs m-preset-tabs" role="group" aria-label="Range preset">' +
        mMyPresetBtn_('Today', 'today') + mMyPresetBtn_('7D', '7d') + mMyPresetBtn_('30D', '30d') +
        mCustomChip_('my', 'm-my-custom') +
      '</div>' +
      '<button class="refresh-btn" onclick="mLoadMyStats_({force:true})" title="Refresh">' + icon('refresh', 14) + '</button>' +
    '</div>' +
    '<div class="m-controls m-custom-row" id="m-my-custom"' +
      (mCustomRowOpen_('my', mMyActivePreset_()) ? '' : ' hidden') + '>' +
      '<label style="font-size:0.85rem;color:var(--muted)">Day</label>' +
      '<input type="date" id="m-my-date" value="' + esc(M_STATE.myDate) + '">' +
      '<label style="font-size:0.85rem;color:var(--muted);margin-left:6px">Range</label>' +
      '<input type="date" id="m-my-from" value="' + esc(M_STATE.myFrom) + '" title="Range start">' +
      '<input type="date" id="m-my-to" value="' + esc(M_STATE.myTo) + '" title="Range end">' +
    '</div>' +
    '<div id="m-my-content"><div class="m-loading"><span class="lo-glyph">' + icon('chart', 26) + '</span> Loading metrics&hellip;</div></div>';

  document.getElementById('m-my-date').addEventListener('change', function () {
    M_STATE.myMode = 'single'; M_STATE.myDate = this.value;
    mMyStatsSyncPresets_(); mLoadMyStats_();
  });
  var onRange = function () {
    var f = document.getElementById('m-my-from'), t = document.getElementById('m-my-to');
    if (!f.value || !t.value) return;
    M_STATE.myMode = 'range'; M_STATE.myFrom = f.value; M_STATE.myTo = t.value;
    mMyStatsSyncPresets_(); mLoadMyStats_();
  };
  document.getElementById('m-my-from').addEventListener('change', onRange);
  document.getElementById('m-my-to').addEventListener('change', onRange);

  mLoadMyStats_();
}

function mMyPresetBtn_(label, key) {
  return '<button class="toolbar-tab" data-my-preset="' + key + '" aria-pressed="' + (mMyActivePreset_() === key) + '" onclick="mMyPreset_(\'' + key + '\')">' + label + '</button>';
}
/** Which preset (if any) the current selection matches — for the pressed state. */
function mMyActivePreset_() {
  var today = mTodayIso_();
  if (M_STATE.myMode === 'single' && M_STATE.myDate === today) return 'today';
  if (M_STATE.myMode === 'range' && M_STATE.myTo === today) {
    if (M_STATE.myFrom === mDaysAgo_(6)) return '7d';
    if (M_STATE.myFrom === mDaysAgo_(29)) return '30d';
  }
  return '';
}
function mMyStatsSyncPresets_() {
  var active = mMyActivePreset_();
  document.querySelectorAll('.m-preset-tabs .toolbar-tab[data-my-preset]').forEach(function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-my-preset') === active ? 'true' : 'false');
  });
  // #2 — the Custom chip is "pressed" when the selection matches no preset.
  var cEl = document.querySelector('.m-custom-chip[data-custom="my"]');
  if (cEl) cEl.setAttribute('aria-pressed', active === '' ? 'true' : 'false');
  var dEl = document.getElementById('m-my-date'); if (dEl && M_STATE.myMode === 'single') dEl.value = M_STATE.myDate;
  var fEl = document.getElementById('m-my-from'); if (fEl) fEl.value = M_STATE.myFrom || '';
  var tEl = document.getElementById('m-my-to'); if (tEl) tEl.value = M_STATE.myTo || '';
}

// ── #2 — shared "Custom…" disclosure chip (both Metrics tabs) ─────────
/** Pressed = the current selection matches no preset; expanded mirrors the
 *  input row's visibility (aria-expanded + aria-controls — INV-174). */
function mCustomChip_(which, rowId) {
  var active = (which === 'my') ? mMyActivePreset_() : mTeamActivePreset_();
  var open = mCustomRowOpen_(which, active);
  return '<button type="button" class="toolbar-tab m-custom-chip" data-custom="' + which + '"' +
    ' aria-pressed="' + (active === '' ? 'true' : 'false') + '"' +
    ' aria-expanded="' + (open ? 'true' : 'false') + '" aria-controls="' + rowId + '"' +
    ' onclick="mToggleCustom_(\'' + which + '\', \'' + rowId + '\')">Custom&hellip;</button>';
}
/** Render-time visibility: a remembered open state OR a selection no preset
 *  describes (the inputs ARE the description of the current view then). */
function mCustomRowOpen_(which, activePreset) {
  return !!(M_STATE.customOpen && M_STATE.customOpen[which]) || activePreset === '';
}
function mToggleCustom_(which, rowId) {
  var row = document.getElementById(rowId);
  if (!row) return;
  var next = row.hidden;   // hidden → open it
  row.hidden = !next;
  M_STATE.customOpen = M_STATE.customOpen || {};
  M_STATE.customOpen[which] = next;
  var chip = document.querySelector('.m-custom-chip[data-custom="' + which + '"]');
  if (chip) chip.setAttribute('aria-expanded', String(next));
}
/** Today = single (rich); 7D/30D = aggregated ranges ending today (#1). */
function mMyPreset_(key) {
  var today = mTodayIso_();
  if (key === 'today') { M_STATE.myMode = 'single'; M_STATE.myDate = today; }
  else { M_STATE.myMode = 'range'; M_STATE.myTo = today; M_STATE.myFrom = mDaysAgo_(key === '7d' ? 6 : 29); }
  mMyStatsSyncPresets_();
  mLoadMyStats_();
}

function mLoadMyStats_(opts) {
  opts = opts || {};
  var requestedView = currentView;
  // M-6 (cycle 10): seq token — the view-key guard alone can't stop a
  // SAME-VIEW race (a slow 30D response landing after a fast Today response
  // would render 30-day aggregates under Today-labeled chips). The newest
  // load invalidates every in-flight one — the _covSeq/_punctSeq pattern.
  M_STATE.mySeq = (M_STATE.mySeq || 0) + 1;
  var seq = M_STATE.mySeq;
  // Cache key = the exact query (a date toggle is a different key, so we never
  // paint the wrong day from cache).
  var isRange = (M_STATE.myMode === 'range' && M_STATE.myFrom && M_STATE.myTo);
  var key = isRange ? ('range:' + M_STATE.myFrom + ':' + M_STATE.myTo) : ('day:' + M_STATE.myDate);
  // Stale-while-revalidate: instant repaint from a fresh cached payload (unless
  // the caller forced a fetch, e.g. the Refresh button), then refresh quietly.
  M_STATE.myCache = M_STATE.myCache || {};
  var cached = M_STATE.myCache[key];
  var painted = false;
  if (!opts.force && cached && typeof viewCacheFresh_ === 'function' && viewCacheFresh_(cached.entry)) {
    mRenderMyStats_(cached.data);
    if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(true);
    painted = true;
  } else {
    document.getElementById('m-my-content').innerHTML = loSweep();
  }

  var done = function () { if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(false); };
  var ok = function (data) {
    // Cache first (key-exact, so a stale response still warms its own key),
    // then drop the RENDER if a newer load superseded this one (M-6).
    if (data && !data.error) M_STATE.myCache[key] = { data: data, entry: { at: Date.now() } };
    if (currentView !== requestedView || seq !== M_STATE.mySeq) { done(); return; }
    mRenderMyStats_(data);
    done();
  };
  var fail = function (err) {
    if (currentView !== requestedView || seq !== M_STATE.mySeq) { done(); return; }
    done();
    // If a stale view is already on screen, keep it rather than blanking it.
    if (painted) { showToast('Couldn’t refresh metrics — showing last loaded', 'toast-warn'); return; }
    // A12 (cycle 13): a LOAD FAILURE renders errorStateHtml_ (warn-toned card +
    // glyph + role=alert), never .m-empty — the designed empty-state card. The
    // batch-J decision is that "the fetch failed" must never read as "there's
    // nothing here"; .m-empty is a quiet dashed card visually indistinguishable
    // from a genuinely empty day, which is the likeliest CDR failure mode.
    document.getElementById('m-my-content').innerHTML =
      errorStateHtml_('Failed to load metrics: ' + (err.message || err));
  };
  if (isRange) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getMyMetricsRange(M_STATE.myFrom, M_STATE.myTo);
  } else {
    var date = M_STATE.myDate; if (!date) { done(); return; }
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getMyMetrics(date);
  }
}

function mRenderMyStats_(data) {
  var el = document.getElementById('m-my-content');
  if (!el) return;

  // Cycle-9 L-26: null-guard BEFORE .error — a null/undefined payload threw
  // here, stranding the loSweep loader (the throw landed only in the error
  // beacon, invisible to the rep). Same guard shape as spanishRender_.
  if (!data || data.error) {
    el.innerHTML = errorStateHtml_((data && data.error) || 'No data returned — try again.');   // A12
    return;
  }
  M_STATE.myData = data;

  var c = data.cdr;
  var html = '';
  // #1 — range mode (getMyMetricsRange returns from/to) vs single-day. Both carry
  // a per-day `trend`; range has no own-vs-team `series` (a single-day concept).
  var isRange = !!(data.from && data.to);
  var trend = data.trend || [];
  var series = data.series || {};
  var seriesOwn = function (k) {
    var arr = series[k]; if (!Array.isArray(arr)) return null;
    return arr.map(function (p) { return p ? p.own : null; });
  };
  var periodLabel = isRange ? (esc(data.from) + ' → ' + esc(data.to)) : 'Today';

  // No CDR data → minimal fallback (per S43)
  if (!c) {
    html += '<div class="m-empty">No call data found for ' + (isRange ? esc(data.from) + ' → ' + esc(data.to) : esc(data.date)) +
      '. This may be a non-working day/range, or the CDR spreadsheet is not yet configured.</div>';
    // C17-14 (cycle 17) — the cycle-16 F5 sweep fixed the CDR branch below
    // but missed this sibling: a failed note read rendered a confident
    // "Notes Filed: 0" here (the server passes count 0 + unavailable:true).
    html += '<div class="m-row" style="margin-top:var(--space-sm)">' +
      '<span class="m-row-label">Notes Filed</span>' +
      (data.noteCountUnavailable
        ? '<span class="m-row-value" style="color:var(--warn)" title="notes Sheet unreadable — count unavailable">—</span>'
        : '<span class="m-row-value">' + esc(data.noteCount) + '</span>') + '</div>';
    el.innerHTML = html;
    return;
  }

  // Hero + Rail. Hero = % answered (range = aggregate over from→to) + vs-avg +
  // period sparkline. Rail = notes filed, answered, missed, avg/total talk.
  var avg = mTrendAvg_(trend, 'pctAnswered');
  // #4 — the server-shipped alert threshold. Guarded everywhere: a ≤5-min
  // stale cached payload from before the deploy lacks the field, and the
  // client then simply renders no target line (no client-side mirror of 85).
  var thr = data.alertThreshold;
  var deltaCore = '';
  if (trend.length > 1 && avg != null && c.pctAnswered != null) {
    var d = c.pctAnswered - avg;
    var sign = d > 0.05 ? 'pos' : (d < -0.05 ? 'neg' : 'neu');
    var label = d > 0.05 ? '+' + Math.abs(d).toFixed(1)
              : d < -0.05 ? '−' + Math.abs(d).toFixed(1)
              : '±0';
    deltaCore = '<span class="' + sign + '">' + label + ' pts</span> vs period daily average (' + avg.toFixed(1) + '%)';
  }
  var targetBit = (thr != null)
    ? '<span class="m-hero-target" title="The sidebar alert fires below this">target ' + esc(thr) + '%</span>' : '';
  var deltaHtml = (deltaCore || targetBit)
    ? '<div class="m-hero-delta">' + deltaCore + (deltaCore && targetBit ? ' · ' : '') + targetBit + '</div>' : '';

  html += '<div class="m-layout">';
  html += '<div class="m-hero">';
  html += '<div class="m-hero-label">' + periodLabel + ' · % Answered</div>';
  html += '<div class="m-hero-value">' + esc(c.pctAnswered) + '<span class="unit">%</span></div>';
  html += deltaHtml;
  // #7 — range mode names the outliers an average hides. Pure helper,
  // Node-pinned; needs ≥2 days with data or renders nothing.
  if (isRange) {
    var bw = mBestWorstDays_(trend);
    if (bw) {
      html += '<div class="m-hero-bw">' +
        '<span class="pos">Best ' + esc(mDowShort_(bw.best.date)) + ' ' + esc(String(bw.best.date).substring(5)) + ' · ' + esc(bw.best.v) + '%</span>' +
        ' · ' +
        '<span class="neg">Worst ' + esc(mDowShort_(bw.worst.date)) + ' ' + esc(String(bw.worst.date).substring(5)) + ' · ' + esc(bw.worst.v) + '%</span>' +
        '</div>';
    }
  }
  if (trend.length > 1) {
    html += '<div class="m-hero-spark">' + mBuildHeroSparkSvg_(trend, 'pctAnswered', avg, thr) + '</div>';
    var firstLabel = trend[0].date ? trend[0].date.substring(5) : '';
    var lastLabel = trend[trend.length - 1].date ? trend[trend.length - 1].date.substring(5) : '';
    html += '<div class="m-hero-spark-labels"><span>' + esc(firstLabel) + '</span><span>' + esc(lastLabel) + '</span></div>';   // D7 (cycle 10) — the documented Metrics esc() rule
  }
  html += '</div>';

  // Side rail — sparklines where per-day data exists (C4): Answered/Missed from
  // the trend; Avg talk from the own attSeconds series (single mode only — range
  // returns no per-day series). Notes filed + Total talk stay plain.
  html += '<div class="m-rail">';
  // F5 (cycle 12): an unreadable notes Sheet is not "0 notes filed" — show a
  // dash + the reason rather than a confident zero (the server sends
  // noteCountUnavailable and nulls noteCoverage in that case).
  html += data.noteCountUnavailable
    ? mRailRow_('Notes filed', '—', 'warn', 'notes Sheet unreadable — count unavailable')
    : mRailRow_('Notes filed', data.noteCount,
        data.noteCoverage != null ? data.noteCoverage + '% coverage' : null);
  html += mRailRow_('Calls answered', c.totalAnswered, 'good', null,
    { values: trend.map(function (t) { return t.answered; }) });
  html += mRailRow_('Missed', c.totalMissed, c.totalMissed > 0 ? 'warn' : 'good',
    c.totalMissed > 0 ? c.totalMissed + ' calls unanswered' : 'no missed calls',
    { values: trend.map(function (t) { return t.missed; }), tone: 'warn' });
  html += mRailRow_('Avg talk', c.attFormatted, null, null,
    { values: seriesOwn('attSeconds') });
  // #5 — transfer volume. Null = no Transfer row/tab for this rep+period
  // (absence, not zero — INV-180), so the row simply doesn't render; also
  // absent on a pre-deploy cached payload (field missing → same branch).
  if (data.transfer != null) {
    html += mRailRow_('Transfers', data.transfer.transferred,
      data.transfer.transferPct != null ? data.transfer.transferPct + '% of calls' : null,
      null,
      isRange ? null : { values: seriesOwn('transferPct') });
  }
  html += mRailRow_('Total talk', c.tttFormatted);
  html += '</div>';
  html += '</div>';

  if (data.noteCoverage != null && data.noteCoverage < 80) {
    // #6 — the hint was a dead end; the Clock strip's "File N missing" CTA
    // already solves this via the CLK_NAV_HINT pattern. Only offered for
    // TODAY in single-day mode — the CN Log view is today-only, so a link
    // from a past day / a range would land somewhere that can't show them.
    var missing = (c && c.totalAnswered != null)
      ? Math.max(0, c.totalAnswered - (data.noteCount || 0)) : 0;
    var showCta = !isRange && data.date === mTodayIso_() && missing > 0;
    html += '<div class="m-hint">' + mCoverageBadge_(data.noteCoverage) +
      ' &nbsp; Coverage below 80% — some answered calls may not have a corresponding note.' +
      (showCta ? ' <button type="button" class="m-cta-link" onclick="mCoverageCta_()">File them in Call Notes &rarr;</button>' : '') +
      '</div>';
  }

  // T4 #5/#6 — own-vs-team trend charts. data.series is present from the
  // extended getMyMetrics; absent on an older server (degrade silently).
  // Operator #1: in RANGE mode the section used to silently vanish (the
  // series is a single-day-anchored concept, INV-124) — render a placeholder
  // and fill it from the Today payload instead.
  if (isRange) {
    html += '<div id="m-my-trends"></div>';
  } else {
    html += mRenderTrendSection_(data);
  }

  el.innerHTML = html;
  if (isRange) mFillRangeTrends_();
}

/** #6 — coverage-hint CTA: jump to Call Notes with the CLK_NAV_HINT set (the
 *  Clock coverage strip's own mechanism — reuses fileMissingCalls_ when the
 *  Clock partial is loaded, which in this app it always is). */
function mCoverageCta_() {
  var d = M_STATE.myData || {};
  var c = d.cdr || {};
  var missing = Math.max(0, (c.totalAnswered || 0) - (d.noteCount || 0));
  if (typeof fileMissingCalls_ === 'function') { fileMissingCalls_(d.date, missing); return; }
  if (typeof enterTool === 'function') enterTool('callNotes');
}

/** #1 — fill the range-mode trend placeholder from the single-day Today
 *  payload: cache-first (the SWR cache the Today preset already warms), else
 *  one background getMyMetrics(today) guarded by the SAME seq/view tokens as
 *  the primary load (INV-156 — a stale response must not write into a newer
 *  render). Best-effort: on failure the section is simply absent, which is
 *  the pre-#1 shape — an ancillary enrichment, never an error state. */
function mFillRangeTrends_() {
  if (!document.getElementById('m-my-trends')) return;
  var today = mTodayIso_();
  var key = 'day:' + today;
  var inject = function (data) {
    var slot = document.getElementById('m-my-trends');
    if (!slot || !data || data.error) return;
    slot.innerHTML = mRenderTrendSection_(data, { rangeMode: true });
  };
  M_STATE.myCache = M_STATE.myCache || {};
  var cached = M_STATE.myCache[key];
  if (cached && typeof viewCacheFresh_ === 'function' && viewCacheFresh_(cached.entry)) {
    inject(cached.data);
    return;
  }
  var requestedView = currentView;
  var seq = M_STATE.mySeq;
  google.script.run
    .withSuccessHandler(function (data) {
      if (data && !data.error) M_STATE.myCache[key] = { data: data, entry: { at: Date.now() } };
      if (currentView !== requestedView || seq !== M_STATE.mySeq) return;
      inject(data);
    })
    .withFailureHandler(function () { /* section absent — ancillary (see docstring) */ })
    .getMyMetrics(today);
}

/** #7 — best/worst day by pctAnswered over a range trend. Pure (Node-pinned):
 *  null/absent days are skipped; needs ≥2 days WITH data; ties keep the FIRST
 *  occurrence (stable). Returns {best:{date,v}, worst:{date,v}} or null. */
function mBestWorstDays_(trend) {
  var best = null, worst = null, n = 0;
  for (var i = 0; i < (trend || []).length; i++) {
    var v = trend[i] && trend[i].pctAnswered;
    if (v == null || isNaN(v)) continue;
    n++;
    if (!best || v > best.v) best = { date: trend[i].date, v: v };
    if (!worst || v < worst.v) worst = { date: trend[i].date, v: v };
  }
  return n >= 2 ? { best: best, worst: worst } : null;
}
/** Short weekday for a yyyy-MM-dd (UTC-noon anchor — DST-safe, like mDaysAgo_). */
function mDowShort_(iso) {
  try {
    return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(iso + 'T12:00:00Z').getUTCDay()] || '';
  } catch (_) { return ''; }
}

// 5-KPI own-vs-team trend section. Team values are the anonymized,
// cohort-guarded averages (#5); each chart overlays own (accent) + team
// (muted dashed). transferPct comes from the separate CSR Transfer sheet.
var MY_KPI_DEFS = [
  { key: 'pctAnswered', label: '% Answered', fmt: 'pct' },
  { key: 'answered',    label: 'Answered',   fmt: 'int' },
  { key: 'missed',      label: 'Missed',     fmt: 'int' },
  { key: 'attSeconds',  label: 'Avg Talk',   fmt: 'secs' },
  { key: 'transferPct', label: 'Transfer %', fmt: 'pct' },
];
function mRenderTrendSection_(data, opts) {
  var series = data.series;
  if (!series) return '';
  var cards = '';
  for (var i = 0; i < MY_KPI_DEFS.length; i++) {
    var def = MY_KPI_DEFS[i];
    var s = series[def.key];
    if (s && s.length > 1) cards += mKpiTrendCard_(def, s);
  }
  if (!cards) return '';
  var minN = data.kpiMinCohort || 3;
  // #1 — in range mode the section is filled from the TODAY payload, so the
  // heading says exactly what window it shows (independent of the range).
  var head = (opts && opts.rangeMode)
    ? 'Trends · you vs team avg (trailing 30 days ending today)'
    : 'Trends · you vs team avg (30 days)';
  return '<div class="m-trends">' +
    '<div class="m-trends-head">' + head + '</div>' +
    '<div class="m-trends-grid">' + cards + '</div>' +
    '<div class="m-trends-note">Team avg is anonymized — hidden on any day with fewer than ' + minN + ' reporting reps.</div>' +
  '</div>';
}
function mFmtSecs_(s) {
  if (s == null || isNaN(s)) return '—';
  s = Math.round(s);
  var m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}
function mKpiFmt_(def, v) {
  if (v == null || isNaN(v)) return '—';
  if (def.fmt === 'pct') return (Math.round(v * 10) / 10) + '%';
  if (def.fmt === 'secs') return mFmtSecs_(v);
  return String(Math.round(v));
}
function mLastNonNull_(series, key) {
  for (var i = series.length - 1; i >= 0; i--) {
    if (series[i][key] != null && !isNaN(series[i][key])) return series[i][key];
  }
  return null;
}
function mKpiTrendCard_(def, series) {
  var ownLatest = mLastNonNull_(series, 'own');
  var teamLatest = mLastNonNull_(series, 'team');
  return '<div class="m-kpi-card">' +
    '<div class="m-kpi-top">' +
      '<span class="m-kpi-label">' + esc(def.label) + '</span>' +
      '<span class="m-kpi-vals"><b class="own">' + esc(mKpiFmt_(def, ownLatest)) + '</b>' +
        '<span class="team">team ' + esc(mKpiFmt_(def, teamLatest)) + '</span></span>' +
    '</div>' +
    mBuildDualSparkSvg_(series) +
  '</div>';
}
/** Own (accent) + team-avg (muted dashed) over one shared scale. Both lines
 *  skip null points; the own series gets an end dot. */
function mBuildDualSparkSvg_(series) {
  var n = series.length;
  if (n < 2) return '';
  var maxV = 0;
  for (var i = 0; i < n; i++) {
    if (series[i].own != null && series[i].own > maxV) maxV = series[i].own;
    if (series[i].team != null && series[i].team > maxV) maxV = series[i].team;
  }
  if (maxV <= 0) maxV = 1;
  var w = 300, h = 46, pad = 4;
  var xs = (w - pad * 2) / (n - 1), ys = (h - pad * 2) / maxV;
  function lineFor(key, cls) {
    var pts = [];
    for (var i = 0; i < n; i++) {
      var v = series[i][key];
      if (v != null && !isNaN(v)) pts.push((pad + i * xs).toFixed(1) + ',' + (h - pad - v * ys).toFixed(1));
    }
    return pts.length > 1 ? '<polyline class="' + cls + '" points="' + pts.join(' ') + '"/>' : '';
  }
  var lastOwn = null;
  for (var k = n - 1; k >= 0; k--) { if (series[k].own != null && !isNaN(series[k].own)) { lastOwn = { i: k, v: series[k].own }; break; } }
  var dot = lastOwn ? '<circle class="own-dot" cx="' + (pad + lastOwn.i * xs).toFixed(1) + '" cy="' + (h - pad - lastOwn.v * ys).toFixed(1) + '" r="2.5"/>' : '';
  return '<svg class="m-dual-spark" aria-hidden="true" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    lineFor('team', 'team-line') + lineFor('own', 'own-line') + dot +
  '</svg>';
}

/** Average a metric across the trend array, skipping null/missing values. */
function mTrendAvg_(trend, metric) {
  if (!trend || !trend.length) return null;
  var sum = 0, n = 0;
  for (var i = 0; i < trend.length; i++) {
    var v = trend[i][metric];
    if (v != null && !isNaN(v)) { sum += v; n++; }
  }
  return n > 0 ? sum / n : null;
}

/** Hero sparkline with a dashed baseline at the trend average (visual
 *  anchor for the "vs avg" comparison in the hero delta line). #4: optional
 *  4th arg draws a second dashed line at the alert TARGET — the y-domain is
 *  extended to include it, so a target above every data point still renders
 *  inside the box instead of clamping to (or vanishing off) the top edge. */
function mBuildHeroSparkSvg_(trend, metric, avg, target) {
  metric = metric || 'pctAnswered';
  var pts = [];
  for (var i = 0; i < trend.length; i++) {
    var v = trend[i][metric];
    if (v != null) pts.push({ i: i, v: v });
  }
  if (pts.length < 2) return '';
  var maxV = 0;
  for (var j = 0; j < pts.length; j++) { if (pts[j].v > maxV) maxV = pts[j].v; }
  if (target != null && target > maxV) maxV = target;   // #4 — domain includes the target
  if (maxV === 0) maxV = 1;
  var w = 300, h = 60, pad = 4;
  var xScale = (w - pad * 2) / (trend.length - 1);
  var yScale = (h - pad * 2) / maxV;
  var coords = pts.map(function (p) {
    return (pad + p.i * xScale).toFixed(1) + ',' + (h - pad - p.v * yScale).toFixed(1);
  });
  var last = pts[pts.length - 1];
  var lx = (pad + last.i * xScale).toFixed(1);
  var ly = (h - pad - last.v * yScale).toFixed(1);
  var baselineHtml = '';
  if (avg != null) {
    var by = (h - pad - avg * yScale).toFixed(1);
    baselineHtml = '<line class="baseline" x1="' + pad + '" y1="' + by + '" x2="' + (w - pad) + '" y2="' + by + '"/>';
  }
  if (target != null) {
    var ty = (h - pad - target * yScale).toFixed(1);
    baselineHtml += '<line class="m-spark-target" x1="' + pad + '" y1="' + ty + '" x2="' + (w - pad) + '" y2="' + ty + '"/>';
  }
  // §4 sparkline draw — the polyline draws itself in on render. --len is a safe
  // over-estimate of the path length (viewBox width 300); over-estimating just
  // means it starts fully hidden and animates to fully drawn (end state 0).
  return '<svg aria-hidden="true" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    baselineHtml +
    '<polyline class="spark" style="--len:600" points="' + coords.join(' ') + '"/>' +
    '<circle cx="' + lx + '" cy="' + ly + '" r="2.5"/>' +
    '</svg>';
}

/** Tiny inline trend sparkline for a rail row (§6 / C4). `values` is a numeric
 *  array (nulls skipped); auto-scaled min→max. Empty when < 2 points. */
function mMiniSparkSvg_(values) {
  var nums = (values || []).filter(function (v) { return v != null && !isNaN(v); });
  if (nums.length < 2) return '';
  var max = Math.max.apply(null, nums), min = Math.min.apply(null, nums);
  var range = (max - min) || 1;
  var w = 90, h = 20, pad = 2, xs = (w - pad * 2) / (values.length - 1);
  var coords = [];
  values.forEach(function (v, i) {
    if (v == null || isNaN(v)) return;
    var y = h - pad - ((v - min) / range) * (h - pad * 2);
    coords.push((pad + i * xs).toFixed(1) + ',' + y.toFixed(1));
  });
  return '<svg aria-hidden="true" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><polyline points="' + coords.join(' ') + '"/></svg>';
}

/** Single rail row. Value is rendered with the optional tone class
 *  (warn/good/crit); a sub-line below is optional. `spark` (§6) is an optional
 *  { values:[…], tone:'warn'? } trend sparkline rendered full-width below. */
function mRailRow_(label, value, toneOrSub, sub, spark) {
  var tone = '';
  var subLine = '';
  // Polymorphic 3rd arg: 'good'/'warn'/'crit' → tone class; anything else → sub line.
  if (toneOrSub === 'good' || toneOrSub === 'warn' || toneOrSub === 'crit') {
    tone = toneOrSub;
    if (sub) subLine = '<div class="m-row-sub">' + esc(sub) + '</div>';
  } else if (toneOrSub) {
    subLine = '<div class="m-row-sub">' + esc(toneOrSub) + '</div>';
  }
  var sparkHtml = '';
  if (spark && spark.values) {
    var svg = mMiniSparkSvg_(spark.values);
    if (svg) sparkHtml = '<div class="m-row-spark' + (spark.tone === 'warn' ? ' warn' : '') + '">' + svg + '</div>';
  }
  // esc() every interpolated slot — value/sub can carry CDR-derived strings;
  // matches the "Metrics client must esc() every server string" invariant.
  return '<div class="m-row">' +
    '<span class="m-row-label">' + esc(label) + '</span>' +
    '<span class="m-row-value' + (tone ? ' ' + tone : '') + '">' + esc(value) + '</span>' +
    subLine +
    sparkHtml +
    '</div>';
}

/** Tri-tone class for a % Answered value. #4: the GREEN band starts at the
 *  server-shipped alert threshold when provided (so the table can never paint
 *  a rep green while they sit below the line the sidebar alert fires on);
 *  absent (older cached payload) → the legacy 80 band. Mid stays ≥50. */
function mPctClass_(p, thr) {
  var hi = (thr != null) ? thr : 80;
  return (p == null) ? '' : (p >= hi ? 'm-pct-high' : p >= 50 ? 'm-pct-mid' : 'm-pct-low');
}

// §6 — sortable team table. Sort keys map to rep fields; ATT sorts by the
// numeric attSeconds (not the formatted string), coverage treats null as lowest.
function mSortReps_(reps, sort) {
  var key = sort.key, dir = (sort.dir === 'asc') ? 1 : -1;
  var get = function (r) {
    switch (key) {
      case 'repName': return String(r.repName || '').toLowerCase();
      case 'totalRung': return r.totalRung || 0;
      case 'totalAnswered': return r.totalAnswered || 0;
      case 'totalMissed': return r.totalMissed || 0;
      case 'pctAnswered': return r.pctAnswered || 0;
      case 'attSeconds': return r.attSeconds || 0;
      case 'noteCount': return r.noteCount || 0;
      case 'noteCoverage': return (r.noteCoverage == null ? -1 : r.noteCoverage);
      case 'transferred': return r.transferred || 0;   // Phase 2
      default: return 0;
    }
  };
  return reps.slice().sort(function (a, b) {
    var va = get(a), vb = get(b);
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  });
}
function mTeamSort_(key) {
  var s = M_STATE.teamSort || { key: 'pctAnswered', dir: 'desc' };
  if (s.key === key) s.dir = (s.dir === 'asc') ? 'desc' : 'asc';
  else { s.key = key; s.dir = (key === 'repName') ? 'asc' : 'desc'; }
  M_STATE.teamSort = s;
  if (M_STATE.teamData) mRenderTeamMetrics_(M_STATE.teamData);
}
// (mTh_ removed — header rendering now lives in the shared mtRenderTable_, #3.)

// ── Phase 2 — sub-queue views on the TRANSFER KPI ─────────────────────
// Phase 0 established that only transfers can be split per rep per queue, so
// this is deliberately scoped to that one column. Two modes: COMBINED (rep
// rows, each showing its total with a segmented contribution bar and an
// expandable per-queue breakdown) and BY QUEUE (queue rows). The operator
// asked for both "separately" and "together with transparency" — the segmented
// bar plus the disclosure is what makes the combined view transparent rather
// than a single opaque number.

/** Deterministic palette index for a queue name, so a queue keeps its colour
 *  across renders and across the two modes. Pure — Node-pinned. */
function mQueueHue_(name) {
  var h = 0, s = String(name || '');
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

/** Segmented contribution bar. INV-180: the queue segments are a COMPONENT of
 *  `transferred`, so any unattributed remainder is drawn as its own muted
 *  segment — a bar that rendered only the queues would silently imply the
 *  breakdown was complete. Returns '' when there is nothing to show. */
function mQueueBarHtml_(rep) {
  var total = rep.transferred || 0;
  if (!total) return '';
  var names = Object.keys(rep.queues || {}).sort(function (a, b) {
    return (rep.queues[b] - rep.queues[a]) || a.localeCompare(b);
  });
  var segs = names.map(function (q) {
    var pct = (rep.queues[q] / total) * 100;
    return '<span class="m-qseg" style="width:' + pct.toFixed(2) + '%;background:hsl(' +
      mQueueHue_(q) + ' 55% 45%)" title="' + esc(q) + ': ' + esc(rep.queues[q]) + '"></span>';
  }).join('');
  var rest = rep.queueUnattributed || 0;
  if (rest > 0) {
    segs += '<span class="m-qseg m-qseg-rest" style="width:' + ((rest / total) * 100).toFixed(2) +
      '%" title="' + esc(rest) + ' not attributed to a queue"></span>';
  }
  return '<span class="m-qbar" aria-hidden="true">' + segs + '</span>';
}

/** The expandable per-queue detail for one rep. Always states the attributed
 *  fraction in words, so the number is honest even with the bar hidden. */
function mQueueDetailHtml_(rep) {
  var total = rep.transferred || 0;
  if (!total) return '';
  var names = Object.keys(rep.queues || {}).sort(function (a, b) {
    return (rep.queues[b] - rep.queues[a]) || a.localeCompare(b);
  });
  var rows = names.map(function (q) {
    return '<div class="m-qrow"><span class="m-qdot" style="background:hsl(' + mQueueHue_(q) +
      ' 55% 45%)"></span><span class="m-qname">' + esc(q) + '</span>' +
      '<span class="m-qval">' + esc(rep.queues[q]) + '</span></div>';
  }).join('');
  if (!names.length) {
    rows = '<div class="m-qrow m-qnone">No transfer landed in a named queue.</div>';
  }
  var rest = rep.queueUnattributed || 0;
  if (rest > 0) {
    rows += '<div class="m-qrow"><span class="m-qdot m-qdot-rest"></span>' +
      '<span class="m-qname">Not attributed to a queue</span>' +
      '<span class="m-qval">' + esc(rest) + '</span></div>';
  }
  return '<div class="m-qdetail">' + rows +
    '<div class="m-qfoot">' + esc(rep.queueTotal || 0) + ' of ' + esc(total) +
    ' transfers attributed to a queue.</div></div>';
}

/** Toggles a detail row. A13/INV-174: the disclosure is a real <button> and its
 *  aria-expanded is kept in step here, not left to a CSS class. */
function mToggleQueueRow_(btn) {
  var id = btn.getAttribute('aria-controls');
  var row = document.getElementById(id);
  if (!row) return;
  var open = row.hasAttribute('hidden');
  if (open) row.removeAttribute('hidden'); else row.setAttribute('hidden', '');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.classList.toggle('open', open);
}

function mQueueScope_(scope) {
  M_STATE.teamScope = (scope === 'queue' || scope === 'dept') ? scope : 'combined';
  if (M_STATE.teamData) mRenderTeamMetrics_(M_STATE.teamData);
}

/** Phase 4 — the per-department detail: the member queues that make up the
 *  group total, largest first. Same disclosure machinery as the per-rep split. */
function mGroupDetailHtml_(g) {
  var rows = (g.queues || []).map(function (q) {
    return '<div class="m-qrow"><span class="m-qdot" style="background:hsl(' + mQueueHue_(q.queue) +
      ' 55% 45%)"></span><span class="m-qname">' + esc(q.queue) + '</span>' +
      '<span class="m-qval">' + esc(q.transferred) + '</span></div>';
  }).join('');
  return '<div class="m-qdetail">' + rows +
    '<div class="m-qfoot">' + esc((g.queues || []).length) + ' queue(s) in this group.</div></div>';
}

// ── Team Metrics view (manager-only) ──────────────────────────────────

function enterMetricsTeamView() {
  // Stop the Clock view's intervals (INV-73 — see enterMetricsMyStatsView).
  if (typeof stopClock === 'function') stopClock();
  var area = document.getElementById('view-area');
  if (!area) return;
  var today = mTodayIso_();
  M_STATE.teamFrom = M_STATE.teamFrom || today;
  M_STATE.teamTo = M_STATE.teamTo || today;

  area.innerHTML =
    (COMPACT_MODE ? '<div class="compact-header">' + icon('chart', 16) + ' Team Metrics</div>' : '') +
    '<div class="view-title-row" style="' + (COMPACT_MODE ? 'display:none' : '') + '">' +
      '<h1 class="view-title">Team Call Metrics</h1>' +
    '</div>' +
    // #2 — same control vocabulary as My Stats: pressed-state preset chips +
    // the Custom… disclosure hiding the raw date inputs until wanted.
    // (A1 still holds: every chip is a <button>, keyboard-reachable.)
    '<div class="m-controls">' +
      '<div class="toolbar-tabs m-preset-tabs" role="group" aria-label="Range preset">' +
        mTeamPresetBtn_('Today', 'today') + mTeamPresetBtn_('Yesterday', 'yesterday') +
        mTeamPresetBtn_('7D', 'week') + mTeamPresetBtn_('30D', 'month') +
        mCustomChip_('team', 'm-team-custom') +
      '</div>' +
      '<button class="refresh-btn" onclick="mLoadTeamMetrics_({force:true})" title="Refresh">' + icon('refresh', 14) + '</button>' +
    '</div>' +
    '<div class="m-controls m-custom-row" id="m-team-custom"' +
      (mCustomRowOpen_('team', mTeamActivePreset_()) ? '' : ' hidden') + '>' +
      '<label style="font-size:0.85rem;color:var(--muted)">From</label>' +
      '<input type="date" id="m-team-from" value="' + M_STATE.teamFrom + '">' +
      '<label style="font-size:0.85rem;color:var(--muted)">To</label>' +
      '<input type="date" id="m-team-to" value="' + M_STATE.teamTo + '">' +
    '</div>' +
    '<div id="m-team-content"><div class="m-loading"><span class="lo-glyph">' + icon('chart', 26) + '</span> Loading metrics&hellip;</div></div>';

  document.getElementById('m-team-from').addEventListener('change', function () {
    M_STATE.teamFrom = this.value;
    if (M_STATE.teamFrom > M_STATE.teamTo) {
      M_STATE.teamTo = M_STATE.teamFrom;
      document.getElementById('m-team-to').value = M_STATE.teamTo;
    }
    mTeamSyncPresets_();   // #2 — a manual range un-presses the preset chips
    mLoadTeamMetrics_();
  });
  document.getElementById('m-team-to').addEventListener('change', function () {
    M_STATE.teamTo = this.value;
    if (M_STATE.teamTo < M_STATE.teamFrom) {
      M_STATE.teamFrom = M_STATE.teamTo;
      document.getElementById('m-team-from').value = M_STATE.teamFrom;
    }
    mTeamSyncPresets_();   // #2
    mLoadTeamMetrics_();
  });

  mLoadTeamMetrics_();
}

// #2 — pressed-state preset chips (the My Stats pattern; Team never had an
// active state at all — the chips were fire-and-forget buttons).
function mTeamPresetBtn_(label, key) {
  return '<button class="toolbar-tab" data-team-preset="' + key + '"' +
    ' aria-pressed="' + (mTeamActivePreset_() === key ? 'true' : 'false') + '"' +
    ' onclick="mTeamPreset_(\'' + key + '\')">' + label + '</button>';
}
/** Which preset (if any) the current from/to matches — for the pressed state. */
function mTeamActivePreset_() {
  var today = mTodayIso_();
  var f = M_STATE.teamFrom, t = M_STATE.teamTo;
  if (f === today && t === today) return 'today';
  if (f === mDaysAgo_(1) && t === mDaysAgo_(1)) return 'yesterday';
  if (f === mDaysAgo_(6) && t === today) return 'week';
  if (f === mDaysAgo_(29) && t === today) return 'month';
  return '';
}
function mTeamSyncPresets_() {
  var active = mTeamActivePreset_();
  document.querySelectorAll('.m-preset-tabs .toolbar-tab[data-team-preset]').forEach(function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-team-preset') === active ? 'true' : 'false');
  });
  var cEl = document.querySelector('.m-custom-chip[data-custom="team"]');
  if (cEl) cEl.setAttribute('aria-pressed', active === '' ? 'true' : 'false');
}

function mTeamPreset_(key) {
  var today = mTodayIso_();
  if (key === 'today')     { M_STATE.teamFrom = today; M_STATE.teamTo = today; }
  if (key === 'yesterday') { M_STATE.teamFrom = mDaysAgo_(1); M_STATE.teamTo = mDaysAgo_(1); }
  if (key === 'week')      { M_STATE.teamFrom = mDaysAgo_(6); M_STATE.teamTo = today; }
  if (key === 'month')     { M_STATE.teamFrom = mDaysAgo_(29); M_STATE.teamTo = today; }
  var fromEl = document.getElementById('m-team-from');
  var toEl = document.getElementById('m-team-to');
  if (fromEl) fromEl.value = M_STATE.teamFrom;
  if (toEl)   toEl.value = M_STATE.teamTo;
  mTeamSyncPresets_();   // #2
  mLoadTeamMetrics_();
}

function mLoadTeamMetrics_(opts) {
  opts = opts || {};
  var from = M_STATE.teamFrom;
  var to = M_STATE.teamTo;
  if (!from) return;
  var requestedView = currentView;
  var key = from + ':' + to;   // a range change is a different key — never paints the wrong range
  // M-6 (cycle 10): same-view stale-range seq token (see mLoadMyStats_).
  M_STATE.teamSeq = (M_STATE.teamSeq || 0) + 1;
  var seq = M_STATE.teamSeq;

  // Stale-while-revalidate: instant repaint from a fresh cached payload (unless
  // forced via the Refresh button), then refresh quietly behind the pill.
  M_STATE.teamCache = M_STATE.teamCache || {};
  var cached = M_STATE.teamCache[key];
  var painted = false;
  if (!opts.force && cached && typeof viewCacheFresh_ === 'function' && viewCacheFresh_(cached.entry)) {
    mRenderTeamMetrics_(cached.data);
    if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(true);
    painted = true;
  } else {
    document.getElementById('m-team-content').innerHTML = loSweep();
  }

  var done = function () { if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(false); };
  google.script.run
    .withSuccessHandler(function (data) {
      if (data && !data.error) M_STATE.teamCache[key] = { data: data, entry: { at: Date.now() } };
      if (currentView !== requestedView || seq !== M_STATE.teamSeq) { done(); return; }
      mRenderTeamMetrics_(data);
      done();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView || seq !== M_STATE.teamSeq) { done(); return; }
      done();
      if (painted) { showToast('Couldn’t refresh metrics — showing last loaded', 'toast-warn'); return; }
      document.getElementById('m-team-content').innerHTML =   // A12
        errorStateHtml_('Failed to load metrics: ' + (err.message || err));
    })
    .getTeamMetrics(from, to);
}

function mRenderTeamMetrics_(data) {
  var el = document.getElementById('m-team-content');
  if (!el) return;

  // Cycle-9 L-26: null-guard BEFORE .error (see mRenderMyStats_).
  if (!data || data.error) {
    el.innerHTML = errorStateHtml_((data && data.error) || 'No data returned — try again.');   // A12
    return;
  }

  // Defensive: a degraded-but-non-{error} response (e.g. a partial CDR read
  // that didn't populate teamTotals/reps) would otherwise throw on the
  // t.pctAnswered / data.reps.length dereferences below and leave the view
  // stuck on its spinner with no surfaced error. Treat a missing shape as
  // "no data" rather than a thrown success handler.
  var t = data.teamTotals;
  if (!t || !data.reps) {
    el.innerHTML = '<div class="m-empty">No metrics available for this range.</div>';
    return;
  }
  M_STATE.teamData = data;   // §6 — cache so column-sort toggles re-render without a reload

  var html = '';

  // V4·E4 — Hero + Rail. Hero = team % Answered + trend sparkline. #8: a
  // multi-day range now carries a per-day trend over the SELECTED range
  // (previously single-day only, so ranges showed a bare number) — the delta
  // label names which comparison it is.
  var multiDay = !!(data.from && data.to && data.from !== data.to);
  var avg = data.trend ? mTrendAvg_(data.trend, 'pctAnswered') : null;
  var thr = data.alertThreshold;   // #4 — guarded like My Stats (absent → no line)
  var deltaCore = '';
  if (avg != null && t.pctAnswered != null) {
    var d = t.pctAnswered - avg;
    var sign = d > 0.05 ? 'pos' : (d < -0.05 ? 'neg' : 'neu');
    var label = d > 0.05 ? '+' + Math.abs(d).toFixed(1)
              : d < -0.05 ? '−' + Math.abs(d).toFixed(1)
              : '±0';
    deltaCore = '<span class="' + sign + '">' + label + ' pts</span> vs ' +
      (multiDay ? 'period daily average' : '30-day team average') + ' (' + avg.toFixed(1) + '%)';
  }
  var targetBit = (thr != null)
    ? '<span class="m-hero-target" title="The sidebar alert fires below this">target ' + esc(thr) + '%</span>' : '';
  var deltaHtml = (deltaCore || targetBit)
    ? '<div class="m-hero-delta">' + deltaCore + (deltaCore && targetBit ? ' · ' : '') + targetBit + '</div>' : '';
  // F(cycle-8): esc() the echoed dates — server-validated shapes today, but
  // the Metrics-esc() gotcha (the F5 XSS class) says every server string
  // routes through esc() before innerHTML; My Stats escapes the same fields.
  var heroLabel = multiDay
    ? esc(data.from) + ' → ' + esc(data.to) + ' · Team % Answered'
    : 'Team · % Answered';

  html += '<div class="m-layout">';
  html += '<div class="m-hero">';
  html += '<div class="m-hero-label">' + heroLabel + '</div>';
  html += '<div class="m-hero-value">' + esc(t.pctAnswered) + '<span class="unit">%</span></div>';
  html += deltaHtml;
  if (data.trend && data.trend.length > 1) {
    html += '<div class="m-hero-spark">' + mBuildHeroSparkSvg_(data.trend, 'pctAnswered', avg, thr) + '</div>';
    var firstLabel = data.trend[0].date ? data.trend[0].date.substring(5) : '';
    var lastLabel = data.trend[data.trend.length - 1].date ? data.trend[data.trend.length - 1].date.substring(5) : '';
    html += '<div class="m-hero-spark-labels"><span>' + esc(firstLabel) + '</span><span>' + esc(lastLabel) + '</span></div>';   // D7 (cycle 10) — the documented Metrics esc() rule
  }
  html += '</div>';

  // Side rail
  html += '<div class="m-rail">';
  html += mRailRow_('Rung', t.rung);
  html += mRailRow_('Answered', t.answered, 'good');
  html += mRailRow_('Missed', t.missed, t.missed > 0 ? 'warn' : 'good');
  html += mRailRow_('Total talk', t.tttFormatted);
  // F5: flag a team total assembled from at least one unreadable rep Sheet.
  // NOTE mRailRow_'s 3rd arg is polymorphic (tone OR sub-line) and `sub` is
  // only rendered on the TONE branch — so the two cases need distinct calls.
  html += t.noteCountPartial
    ? mRailRow_('Notes filed', t.noteCount, 'warn', 'partial — at least one rep Sheet was unreadable')
    : mRailRow_('Notes filed', t.noteCount,
        t.noteCoverage != null ? t.noteCoverage + '% coverage' : null);
  // #5 — team transfer volume. Only when the Transfer read succeeded
  // (INV-175: a failed auxiliary read must not render as "0 transfers");
  // transferPct is null without its own-sheet denominator (INV-129).
  if (data.transferMeta && data.transferMeta.available && t.transferred != null) {
    html += mRailRow_('Transfers', t.transferred,
      t.transferPct != null ? t.transferPct + '% of calls' : null);
  }
  html += '</div>';
  html += '</div>';

  if (t.noteCoverage != null && t.noteCoverage < 80) {
    html += '<div class="m-hint">' + mCoverageBadge_(t.noteCoverage) +
      ' &nbsp; Team-wide coverage below 80%.</div>';
  }

  // Per-rep table
  if (data.reps.length === 0) {
    html += '<div class="m-empty">No activity data for ' + esc(data.date) + '.</div>';
  } else {
    // #10 — Copy table: TSV of whatever table the current scope displays.
    html += '<div class="m-section-title m-section-row">Per-Rep Breakdown' +
      '<button type="button" class="m-copy-btn" onclick="mCopyTeamTable_(this)"' +
      ' title="Copy the displayed table as tab-separated values (pastes into a spreadsheet)">' +
      icon('copy', 12) + ' Copy table</button></div>';
    // Phase 2 — the sub-queue scope switcher. Only rendered when the Transfer
    // read actually produced queues; with none there is nothing to switch
    // between, and an inert control would be worse than no control.
    var tmeta = data.transferMeta || {};
    var hasQueues = !!(data.queueRows && data.queueRows.length);
    // A mode is only reachable when its data exists — a switcher offering an
    // empty view is worse than not offering it.
    var want = M_STATE.teamScope;
    var scope = 'combined';
    if (hasQueues && want === 'queue') scope = 'queue';
    if (hasQueues && want === 'dept' && data.groupRows && data.groupRows.length) scope = 'dept';
    M_STATE.teamScopeActive = scope;   // #10 — the copy handler reads the RESOLVED scope
    if (tmeta.error) {
      // INV-175: a failed auxiliary read says so; it must not read as "this
      // team made no transfers".
      html += errorStateHtml_('Transfer data unavailable: ' + tmeta.error +
        ' — the rest of the table is unaffected.');
    } else if (hasQueues) {
      var segBtn = function (key, label) {
        var on = (scope === key);
        return '<button type="button" role="tab" aria-selected="' + (on ? 'true' : 'false') + '"' +
          ' class="m-scope-btn' + (on ? ' on' : '') + '" onclick="mQueueScope_(\'' + key + '\')">' +
          esc(label) + '</button>';
      };
      var hasGroups = !!(data.groupRows && data.groupRows.length);
      html += '<div class="m-scope" role="tablist" aria-label="Transfer breakdown">' +
        segBtn('combined', 'Combined') +
        (hasGroups ? segBtn('dept', 'By department') : '') +
        segBtn('queue', 'By queue') +
        '<span class="m-scope-hint">' + esc(data.queueRows.length) + ' queue(s) · transfers only</span></div>';
      if (tmeta.queueWarning) {
        html += '<div class="m-hint">' + icon('warning', 14) + ' ' + esc(tmeta.queueWarning) + '</div>';
      }
    }

    if (scope === 'dept') {
      // BY DEPARTMENT — group rows, each expanding to the member queues that
      // produced the total. Sub-queues are DISJOINT from parents (operator
      // confirmed), so the group figure is a plain sum of its members.
      html += mtRenderTable_({
        rows: data.groupRows,
        columns: [
          { key: 'group', label: 'Department', name: true, cell: function (g) {
              var gid = 'm-g-' + String(g.group).replace(/[^\w.$-]/g, '');
              return '<button type="button" class="m-qtoggle" aria-expanded="false" aria-controls="' + gid + '"' +
                ' onclick="mToggleQueueRow_(this)" title="Show the member queues">' +
                esc(g.group) + ' ' + icon('chevronDown', 10) + '</button>'; } },
          { key: 'transferred', label: 'Transferred', numeric: true, cell: function (g) { return esc(g.transferred); } },
          { key: 'queues', label: 'Queues', numeric: true, cell: function (g) { return esc((g.queues || []).length); } },
          // `reps` is a lower bound, not a total — one rep can work several
          // queues in a group and the per-queue figure is a count, not a
          // roster, so a union is not recoverable. Labelled so it is never
          // read as a headcount.
          { key: 'reps', label: 'Reps (min)', numeric: true, cell: function (g) { return esc(g.reps); } },
        ],
        rowId: function (g) { return 'm-g-' + String(g.group); },
        detailRow: function (g) { return mGroupDetailHtml_(g); },
      });
      var ung = null;
      for (var gi = 0; gi < data.groupRows.length; gi++) {
        if (data.groupRows[gi].group === M_QUEUE_UNGROUPED) ung = data.groupRows[gi];
      }
      if (ung) {
        html += '<div class="m-hint">' + icon('warning', 14) + ' ' + esc((ung.queues || []).length) +
          ' queue(s) are not mapped to a department yet and are grouped as "' +
          esc(M_QUEUE_UNGROUPED) + '".</div>';
      }
    } else if (scope === 'queue') {
      // BY QUEUE — the "separately" half of the ask. Rows are queues, so this
      // answers "which queue is taking the volume" without a rep dimension.
      html += mtRenderTable_({
        rows: data.queueRows,
        columns: [
          { key: 'queue', label: 'Queue', name: true, cell: function (q) {
              return '<span class="m-qdot" style="background:hsl(' + mQueueHue_(q.queue) +
                ' 55% 45%)"></span>' + esc(q.queue); } },
          { key: 'transferred', label: 'Transferred', numeric: true, cell: function (q) { return esc(q.transferred); } },
          { key: 'reps', label: 'Reps', numeric: true, cell: function (q) { return esc(q.reps); } },
        ],
      });
      var attributed = (data.teamTotals && data.teamTotals.queueTotal) || 0;
      var totalTr = (data.teamTotals && data.teamTotals.transferred) || 0;
      html += '<div class="m-hint">' + icon('info', 14) + ' ' + esc(attributed) + ' of ' +
        esc(totalTr) + ' team transfers are attributed to a queue' +
        (totalTr > attributed ? '; the remainder went to destinations with no queue column.' : '.') +
        '</div>';
    } else {
    // #3 — render via the shared mtRenderTable_ component (also used by the CN
    // manager Stats table). Rows pre-sorted here; mTeamSort_ re-renders.
    var reps = mSortReps_(data.reps, M_STATE.teamSort || { key: 'pctAnswered', dir: 'desc' });
    // #9 — drill target date: the range END (single day = the day itself); the
    // Per-Rep view is single-date, so a range drills to its most recent day.
    var drillDate = data.to || data.date || '';
    html += mtRenderTable_({
      rows: reps,
      sort: M_STATE.teamSort,
      onSort: 'mTeamSort_',
      columns: [
        // #9 — a real <button> (INV-173), link treatment (V-12: navigation,
        // not a pill); ids/dates ride data-* attributes read from the handler
        // (the cnStatsDrillDown_/audit-panel discipline — never inline JS).
        { key: 'repName', label: 'Rep', name: true, sortable: true, cell: function (r) {
            return '<button type="button" class="m-rep-link" data-rep="' + esc(r.repId) + '"' +
              ' data-date="' + esc(drillDate) + '" onclick="mRepDrill_(this)"' +
              ' title="Open this rep in Team Notes (Per-Rep View)">' + esc(r.repName) + '</button>'; } },
        { key: 'totalRung', label: 'Rung', numeric: true, sortable: true, cell: function (r) { return esc(r.totalRung); } },
        { key: 'totalAnswered', label: 'Answered', numeric: true, sortable: true, cell: function (r) { return esc(r.totalAnswered); } },
        { key: 'totalMissed', label: 'Missed', numeric: true, sortable: true, cell: function (r) { return r.totalMissed > 0 ? '<span style="color:var(--warn)">' + esc(r.totalMissed) + '</span>' : '0'; } },
        { key: 'pctAnswered', label: '% Ans', numeric: true, sortable: true, cell: function (r) { return '<span class="' + mPctClass_(r.pctAnswered, thr) + '">' + esc(r.pctAnswered) + '%</span>'; } },
        { key: 'attSeconds', label: 'ATT', numeric: true, sortable: true, cell: function (r) { return esc(r.attFormatted); } },
        // F5 (cycle 12): a rep whose notes Sheet could not be read shows "—",
        // not "0" — a zero here reads as a rep who logged nothing.
        { key: 'noteCount', label: 'Notes', numeric: true, sortable: true, cell: function (r) { return r.noteCountUnavailable ? '<span style="color:var(--warn)" title="notes Sheet unreadable — count unavailable">—</span>' : esc(r.noteCount); } },
        { key: 'noteCoverage', label: 'Coverage', numeric: true, sortable: true, cell: function (r) { return r.noteCoverage != null ? mCoverageBadge_(r.noteCoverage) : '<span style="color:var(--muted)">—</span>'; } },
      ].concat(hasQueues ? [
        // Phase 2 — the TRANSFERS column is the only one that can carry a
        // per-queue split (Phase 0). Total + segmented bar + a real disclosure
        // button (INV-173/174) whose aria-controls points at the detail row
        // mtRenderTable_ emits.
        { key: 'transferred', label: 'Transfers', numeric: true, sortable: true, cell: function (r) {
            if (!r.transferred) return '<span style="color:var(--muted)">0</span>';
            var rid = 'm-q-' + String(r.repId).replace(/[^\w.$-]/g, '');
            return '<button type="button" class="m-qtoggle" aria-expanded="false" aria-controls="' + rid + '"' +
              ' onclick="mToggleQueueRow_(this)" title="Show the per-queue split">' +
              esc(r.transferred) + ' ' + icon('chevronDown', 10) + '</button>' + mQueueBarHtml_(r); } },
      ] : []),
      rowId: hasQueues ? function (r) { return 'm-q-' + String(r.repId); } : null,
      detailRow: hasQueues ? function (r) { return mQueueDetailHtml_(r); } : null,
    });
    }
  }

  // Name-match diagnostics. Only the PAIRED set warns: on a shared CDR feed
  // (the Report covers the whole phone system) `unmatchedAgents` is
  // permanently non-zero, and `rosterWithNoCdr` likewise catches every
  // non-phone employee and full-week PTO. Neither is a defect on its own —
  // their intersection is. See cdrLikelyNameMismatches_ in Code.js.
  var M_NAME_CAP = 12;
  var mNameList_ = function (arr) {
    var a = arr || [];
    // Names can CONTAIN commas ("Smith, Bob") — a comma-join would read as
    // more entries than there are.
    return esc(a.slice(0, M_NAME_CAP).join(' \u00b7 ')) +
      (a.length > M_NAME_CAP ? ' <em>+' + (a.length - M_NAME_CAP) + ' more</em>' : '');
  };

  if (data.likelyMismatches && data.likelyMismatches.length > 0) {
    html += '<div class="m-hint" style="margin-top:var(--space-md);color:var(--warning-deep)">' +
      icon('warning', 14) + ' ' + data.likelyMismatches.length + ' likely name mismatch' +
      (data.likelyMismatches.length === 1 ? '' : 'es') +
      ' — these reps’ calls are probably missing from this table: ' +
      esc(data.likelyMismatches.slice(0, M_NAME_CAP).map(function (m) {
        return m.cdr + ' → ' + m.roster;
      }).join('; ')) +
      (data.likelyMismatches.length > M_NAME_CAP
        ? ' <em>+' + (data.likelyMismatches.length - M_NAME_CAP) + ' more</em>' : '') +
      '. Fix with an Agent Alias Overrides row in the CDR Report.</div>';
  }

  // #3 — the two "expected" reference lists fold behind a disclosure: both are
  // permanently non-empty on this deployment BY DESIGN (the cycle-15 rule —
  // the CDR Report covers the whole phone system; the roster holds non-phone
  // staff), so they are reference detail, not a signal, and were eating the
  // bottom of the page. The actionable likelyMismatches warning above stays
  // always-visible. State survives sort re-renders via M_STATE.diagOpen.
  var diagBits = '';
  if (data.unmatchedAgents && data.unmatchedAgents.length > 0) {
    diagBits += '<div class="m-hint" style="margin-top:var(--space-xs)">' +
      icon('info', 14) + ' ' + data.unmatchedAgents.length +
      ' CDR agent(s) not on this roster — expected when the CDR Report covers other departments: ' +
      mNameList_(data.unmatchedAgents) + '</div>';
  }
  if (data.rosterWithNoCdr && data.rosterWithNoCdr.length > 0) {
    diagBits += '<div class="m-hint" style="margin-top:var(--space-xs)">' +
      icon('info', 14) + ' ' + data.rosterWithNoCdr.length +
      ' roster rep(s) with no CDR rows — expected for non-phone staff and full-range PTO: ' +
      mNameList_(data.rosterWithNoCdr) + '</div>';
  }
  if (diagBits) {
    var diagN = ((data.unmatchedAgents && data.unmatchedAgents.length) || 0) +
                ((data.rosterWithNoCdr && data.rosterWithNoCdr.length) || 0);
    var diagOpen = !!M_STATE.diagOpen;
    html += '<div class="m-diag">' +
      '<button type="button" class="m-diag-toggle' + (diagOpen ? ' open' : '') + '"' +
        ' aria-expanded="' + (diagOpen ? 'true' : 'false') + '" aria-controls="m-diag-body"' +
        ' onclick="mToggleDiag_(this)">' +
