<style>
/* ═══════════════════════════════════════════════════════════════════════
   METRICS — view-scoped styles
   ───────────────────────────────────────────────────────────────────────
   Layered on top of styles.html + design tokens. Owns the KPI tiles,
   per-rep metrics table, and note-coverage badges. Reflows gracefully
   into compact-mode (~360–440px) widths.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── KPI tiles ──────────────────────────────────────────────────── */
.m-kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
}
.m-kpi {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-sm) var(--space-md);
  text-align: center;
}
.m-kpi-value {
  font-size: 1.6rem;
  font-weight: 700;
  font-family: var(--font-tight);
  color: var(--ink);
  line-height: 1.2;
}
.m-kpi-label {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-top: 2px;
}
.m-kpi--accent .m-kpi-value { color: var(--accent); }
.m-kpi--warn .m-kpi-value   { color: var(--warn); }
.m-kpi--good .m-kpi-value   { color: var(--good); }

/* ── Coverage badge ─────────────────────────────────────────────── */
.m-coverage {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.8rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
}
.m-coverage--high { background: var(--good-soft); color: var(--good); }
.m-coverage--mid  { background: var(--warn-soft); color: var(--warn); }
.m-coverage--low  { background: var(--danger-soft); color: var(--danger); }

/* ── Sidebar alert badge ────────────────────────────────────────── */
.m-alert-badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--danger); color: white;
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  min-width: 28px; height: 16px; padding: 0 4px;
  border-radius: 999px;
  margin-left: 6px;
}

/* ── Date picker row ────────────────────────────────────────────── */
.m-controls {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
  flex-wrap: wrap;
}
.m-controls input[type="date"] {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper-card);
  color: var(--ink);
}

/* ── Team table ─────────────────────────────────────────────────── */
.m-table-wrap {
  overflow-x: auto;
  margin-top: var(--space-sm);
}
.m-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
.m-table th {
  text-align: left;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  padding: 6px 10px;
  border-bottom: 2px solid var(--line);
  white-space: nowrap;
  cursor: default;
}
.m-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.m-table tr:hover td { background: var(--paper-2); }
.m-table .m-num { text-align: right; font-family: var(--font-mono); }
.m-table .m-name { font-weight: 500; }

/* ── Empty / loading states ─────────────────────────────────────── */
.m-empty {
  text-align: center;
  color: var(--muted);
  padding: var(--space-lg) var(--space-md);
  font-size: 0.9rem;
}
.m-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  padding: var(--space-lg);
  color: var(--muted);
}
.m-section-title {
  font-family: var(--font-tight);
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--ink);
  margin: var(--space-md) 0 var(--space-sm) 0;
}
.m-hint {
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: var(--space-sm);
}

/* ── Sparkline ──────────────────────────────────────────────────── */
.m-sparkline-wrap {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-sm) var(--space-md);
  margin-bottom: var(--space-md);
}
.m-sparkline-wrap h3 {
  font-family: var(--font-tight);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 0 0 var(--space-xs) 0;
}
.m-sparkline-svg { display: block; width: 100%; height: 60px; }
.m-sparkline-svg line { stroke: var(--line); stroke-width: 0.5; }
.m-sparkline-svg polyline {
  fill: none; stroke: var(--accent); stroke-width: 1.5;
  stroke-linejoin: round; stroke-linecap: round;
}
.m-sparkline-svg circle { fill: var(--accent); }
.m-sparkline-labels {
  display: flex; justify-content: space-between;
  font-size: 0.65rem; color: var(--muted); margin-top: 2px;
}

/* ── Preset chips ──────────────────────────────────────────────── */
.m-preset-chip {
  display: inline-block;
  font-size: 0.75rem;
  padding: 2px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper-card);
  color: var(--muted);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.m-preset-chip:hover { background: var(--accent-soft); color: var(--accent); }

/* ── Hero + Rail layout (V4·E4) ────────────────────────────────────
   Replaces the prior 6-tile KPI grid with a hero answer-rate +
   side rail of supporting metrics. Hero carries the big tabular
   number + "vs avg" delta + 30-day sparkline; the rail stacks
   .m-row cards each with their own value + comparison. */
.m-layout {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
}
.m-hero {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  display: flex; flex-direction: column;
  min-width: 0;
}
.m-hero-label {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
  margin-bottom: 6px;
}
.m-hero-value {
  font-family: var(--mono); font-size: 56px; font-weight: 500;
  line-height: 1; letter-spacing: -.02em; color: var(--ink);
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum', 'ss01';
  display: flex; align-items: baseline; gap: 6px;
}
.m-hero-value .unit {
  font-size: 24px; font-weight: 400; color: var(--muted);
  letter-spacing: 0;
}
.m-hero-delta {
  font-family: var(--ui); font-size: 13px;
  color: var(--muted); margin-top: 8px;
}
.m-hero-delta .pos { color: var(--success-deep); font-weight: 600; }
.m-hero-delta .neg { color: var(--danger-deep); font-weight: 600; }
.m-hero-delta .neu { color: var(--muted); font-weight: 600; }
.m-hero-spark {
  margin-top: auto; padding-top: var(--space-sm);
}
.m-hero-spark svg { display: block; width: 100%; height: 60px; }
.m-hero-spark line { stroke: var(--line); stroke-width: 0.5; }
.m-hero-spark polyline {
  fill: none; stroke: var(--accent); stroke-width: 1.5;
  stroke-linejoin: round; stroke-linecap: round;
}
.m-hero-spark circle { fill: var(--accent); }
.m-hero-spark .baseline {
  stroke: var(--muted-3); stroke-width: 0.5; stroke-dasharray: 2 3;
}
.m-hero-spark-labels {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--muted); margin-top: 2px;
  font-family: var(--mono); letter-spacing: .04em;
}

.m-rail {
  display: flex; flex-direction: column; gap: 6px;
}
.m-row {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 14px;
  display: grid; grid-template-columns: 1fr auto;
  gap: 6px; align-items: center;
}
.m-row-label {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
}
.m-row-value {
  font-family: var(--mono); font-size: 18px; font-weight: 500;
  color: var(--ink); line-height: 1;
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum', 'ss01';
  text-align: right;
}
.m-row-value.warn  { color: var(--warning-deep); }
.m-row-value.good  { color: var(--success-deep); }
.m-row-value.crit  { color: var(--danger-deep); }
.m-row-sub {
  grid-column: 1 / -1;
  font-family: var(--ui); font-size: 11px; color: var(--muted);
  margin-top: 2px;
}

/* ── Compact mode ───────────────────────────────────────────────── */
:root[data-compact] .m-kpi-grid { grid-template-columns: repeat(3, 1fr); }
:root[data-compact] .m-kpi-value { font-size: 1.2rem; }
:root[data-compact] .m-sparkline-svg { height: 40px; }
:root[data-compact] .m-layout { grid-template-columns: 1fr; gap: var(--space-sm); }
:root[data-compact] .m-hero-value { font-size: 42px; }
:root[data-compact] .m-hero-value .unit { font-size: 18px; }
:root[data-compact] .m-hero-spark svg { height: 40px; }
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  METRICS — My Stats + Team Metrics views
// ════════════════════════════════════════════════════════════════════════════

var M_STATE = { myDate: null, teamFrom: null, teamTo: null };

function mTodayIso_() {
  try {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  } catch (_) { return ''; }
}

function mDaysAgo_(n) {
  var d = new Date();
  d.setDate(d.getDate() - n);
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function mBuildSparkline_(trend, metric) {
  if (!trend || trend.length === 0) return '';
  metric = metric || 'pctAnswered';
  var pts = [];
  for (var i = 0; i < trend.length; i++) {
    var v = trend[i][metric];
    if (v != null) pts.push({ i: i, v: v });
  }
  if (pts.length < 2) return '';
  var maxV = 0;
  for (var j = 0; j < pts.length; j++) { if (pts[j].v > maxV) maxV = pts[j].v; }
  if (maxV === 0) maxV = 1;
  var w = 300, h = 50, pad = 4;
  var xScale = (w - pad * 2) / (trend.length - 1);
  var yScale = (h - pad * 2) / maxV;
  var coords = pts.map(function (p) {
    return (pad + p.i * xScale).toFixed(1) + ',' + (h - pad - p.v * yScale).toFixed(1);
  });
  var last = pts[pts.length - 1];
  var lx = (pad + last.i * xScale).toFixed(1);
  var ly = (h - pad - last.v * yScale).toFixed(1);
  var firstLabel = trend[0].date ? trend[0].date.substring(5) : '';
  var lastLabel = trend[trend.length - 1].date ? trend[trend.length - 1].date.substring(5) : '';
  return '<div class="m-sparkline-wrap">' +
    '<h3>30-Day % Answered Trend</h3>' +
    '<svg class="m-sparkline-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<polyline points="' + coords.join(' ') + '"/>' +
    '<circle cx="' + lx + '" cy="' + ly + '" r="2.5"/>' +
    '</svg>' +
    '<div class="m-sparkline-labels"><span>' + firstLabel + '</span><span>' + lastLabel + '</span></div>' +
    '</div>';
}

function mCoverageBadge_(pct) {
  if (pct == null) return '';
  var cls = pct >= 80 ? 'm-coverage--high' : pct >= 50 ? 'm-coverage--mid' : 'm-coverage--low';
  return '<span class="m-coverage ' + cls + '">' + pct + '% coverage</span>';
}

// ── My Stats view ─────────────────────────────────────────────────────

function enterMetricsMyStatsView() {
  // Stop the Clock view's 1Hz live-time + 60s ribbon-now-cursor intervals so
  // they don't keep firing in the background after navigating here (INV-73 —
  // matches the Time Off / Manager / Call Notes enters).
  if (typeof stopClock === 'function') stopClock();
  var area = document.getElementById('view-area');
  if (!area) return;
  M_STATE.myDate = M_STATE.myDate || mTodayIso_();

  area.innerHTML =
    (COMPACT_MODE ? '<div class="compact-header">' + icon('chart', 16) + ' My Stats</div>' : '') +
    '<div class="view-title-row" style="' + (COMPACT_MODE ? 'display:none' : '') + '">' +
      '<h2>My Call Metrics</h2>' +
    '</div>' +
    '<div class="m-controls">' +
      '<label style="font-size:0.85rem;color:var(--muted)">Date</label>' +
      '<input type="date" id="m-my-date" value="' + M_STATE.myDate + '">' +
      '<button class="btn btn-sm" onclick="mLoadMyStats_()" title="Refresh">' + icon('refresh', 14) + '</button>' +
    '</div>' +
    '<div id="m-my-content"><div class="m-loading"><div class="spinner"></div> Loading metrics&hellip;</div></div>';

  document.getElementById('m-my-date').addEventListener('change', function () {
    M_STATE.myDate = this.value;
    mLoadMyStats_();
  });

  mLoadMyStats_();
}

function mLoadMyStats_() {
  var date = M_STATE.myDate;
  if (!date) return;
  var requestedView = currentView;

  document.getElementById('m-my-content').innerHTML =
    '<div class="m-loading"><div class="spinner"></div> Loading metrics&hellip;</div>';

  google.script.run
    .withSuccessHandler(function (data) {
      if (currentView !== requestedView) return;
      mRenderMyStats_(data);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      document.getElementById('m-my-content').innerHTML =
        '<div class="m-empty">Failed to load metrics: ' + (err.message || err) + '</div>';
    })
    .getMyMetrics(date);
}

function mRenderMyStats_(data) {
  var el = document.getElementById('m-my-content');
  if (!el) return;

  if (data.error) {
    el.innerHTML = '<div class="m-empty">' + data.error + '</div>';
    return;
  }

  var c = data.cdr;
  var html = '';

  // No CDR data → minimal fallback (per S43)
  if (!c) {
    html += '<div class="m-empty">No call data found for ' + data.date +
      '. This may be a non-working day, or the CDR spreadsheet is not yet configured.</div>';
    html += '<div class="m-row" style="margin-top:var(--space-sm)">' +
      '<span class="m-row-label">Notes Filed</span>' +
      '<span class="m-row-value">' + data.noteCount + '</span></div>';
    el.innerHTML = html;
    return;
  }

  // V4·E4 — Hero + Rail layout. Hero = % answered + vs-avg + 30-day
  // sparkline. Rail = notes filed, coverage, missed, avg/total talk.
  var avg = mTrendAvg_(data.trend, 'pctAnswered');
  var deltaHtml = '';
  if (avg != null && c.pctAnswered != null) {
    var d = c.pctAnswered - avg;
    var sign = d > 0.05 ? 'pos' : (d < -0.05 ? 'neg' : 'neu');
    var label = d > 0.05 ? '+' + Math.abs(d).toFixed(1)
              : d < -0.05 ? '−' + Math.abs(d).toFixed(1)
              : '±0';
    deltaHtml = '<div class="m-hero-delta">' +
      '<span class="' + sign + '">' + label + ' pts</span> vs 30-day average (' + avg.toFixed(1) + '%)</div>';
  }

  html += '<div class="m-layout">';
  html += '<div class="m-hero">';
  html += '<div class="m-hero-label">Today · % Answered</div>';
  html += '<div class="m-hero-value">' + c.pctAnswered + '<span class="unit">%</span></div>';
  html += deltaHtml;
  if (data.trend && data.trend.length > 1) {
    html += '<div class="m-hero-spark">' + mBuildHeroSparkSvg_(data.trend, 'pctAnswered', avg) + '</div>';
    var firstLabel = data.trend[0].date ? data.trend[0].date.substring(5) : '';
    var lastLabel = data.trend[data.trend.length - 1].date ? data.trend[data.trend.length - 1].date.substring(5) : '';
    html += '<div class="m-hero-spark-labels"><span>' + firstLabel + '</span><span>' + lastLabel + '</span></div>';
  }
  html += '</div>';

  // Side rail
  html += '<div class="m-rail">';
  html += mRailRow_('Notes filed', data.noteCount,
    data.noteCoverage != null ? data.noteCoverage + '% coverage' : null);
  html += mRailRow_('Calls answered', c.totalAnswered, 'good');
  html += mRailRow_('Missed', c.totalMissed, c.totalMissed > 0 ? 'warn' : 'good',
    c.totalMissed > 0 ? c.totalMissed + ' calls unanswered' : 'no missed calls');
  html += mRailRow_('Avg talk', c.attFormatted);
  html += mRailRow_('Total talk', c.tttFormatted);
  html += '</div>';
  html += '</div>';

  if (data.noteCoverage != null && data.noteCoverage < 80) {
    html += '<div class="m-hint">' + mCoverageBadge_(data.noteCoverage) +
      ' &nbsp; Coverage below 80% — some answered calls may not have a corresponding note.</div>';
  }

  el.innerHTML = html;
}

/** Average a metric across the trend array, skipping null/missing values. */
function mTrendAvg_(trend, metric) {
  if (!trend || !trend.length) return null;
  var sum = 0, n = 0;
  for (var i = 0; i < trend.length; i++) {
    var v = trend[i][metric];
    if (v != null && !isNaN(v)) { sum += v; n++; }
  }
  return n > 0 ? sum / n : null;
}

/** Hero sparkline — same data shape as mBuildSparkline_ but inlined with
 *  a dashed baseline at the trend average (visual anchor for the
 *  "vs avg" comparison in the hero delta line). */
function mBuildHeroSparkSvg_(trend, metric, avg) {
  metric = metric || 'pctAnswered';
  var pts = [];
  for (var i = 0; i < trend.length; i++) {
    var v = trend[i][metric];
    if (v != null) pts.push({ i: i, v: v });
  }
  if (pts.length < 2) return '';
  var maxV = 0;
  for (var j = 0; j < pts.length; j++) { if (pts[j].v > maxV) maxV = pts[j].v; }
  if (maxV === 0) maxV = 1;
  var w = 300, h = 60, pad = 4;
  var xScale = (w - pad * 2) / (trend.length - 1);
  var yScale = (h - pad * 2) / maxV;
  var coords = pts.map(function (p) {
    return (pad + p.i * xScale).toFixed(1) + ',' + (h - pad - p.v * yScale).toFixed(1);
  });
  var last = pts[pts.length - 1];
  var lx = (pad + last.i * xScale).toFixed(1);
  var ly = (h - pad - last.v * yScale).toFixed(1);
  var baselineHtml = '';
  if (avg != null) {
    var by = (h - pad - avg * yScale).toFixed(1);
    baselineHtml = '<line class="baseline" x1="' + pad + '" y1="' + by + '" x2="' + (w - pad) + '" y2="' + by + '"/>';
  }
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    baselineHtml +
    '<polyline points="' + coords.join(' ') + '"/>' +
    '<circle cx="' + lx + '" cy="' + ly + '" r="2.5"/>' +
    '</svg>';
}

/** Single rail row. Value is rendered with the optional tone class
 *  (warn/good/crit); a sub-line below is optional. */
function mRailRow_(label, value, toneOrSub, sub) {
  var tone = '';
  var subLine = '';
  // Polymorphic 3rd arg: 'good'/'warn'/'crit' → tone class; anything else → sub line.
  if (toneOrSub === 'good' || toneOrSub === 'warn' || toneOrSub === 'crit') {
    tone = toneOrSub;
    if (sub) subLine = '<div class="m-row-sub">' + sub + '</div>';
  } else if (toneOrSub) {
    subLine = '<div class="m-row-sub">' + toneOrSub + '</div>';
  }
  return '<div class="m-row">' +
    '<span class="m-row-label">' + label + '</span>' +
    '<span class="m-row-value' + (tone ? ' ' + tone : '') + '">' + value + '</span>' +
    subLine +
    '</div>';
}

// ── Team Metrics view (manager-only) ──────────────────────────────────

function enterMetricsTeamView() {
  // Stop the Clock view's intervals (INV-73 — see enterMetricsMyStatsView).
  if (typeof stopClock === 'function') stopClock();
  var area = document.getElementById('view-area');
  if (!area) return;
  var today = mTodayIso_();
  M_STATE.teamFrom = M_STATE.teamFrom || today;
  M_STATE.teamTo = M_STATE.teamTo || today;

  area.innerHTML =
    (COMPACT_MODE ? '<div class="compact-header">' + icon('chart', 16) + ' Team Metrics</div>' : '') +
    '<div class="view-title-row" style="' + (COMPACT_MODE ? 'display:none' : '') + '">' +
      '<h2>Team Call Metrics</h2>' +
    '</div>' +
    '<div class="m-controls">' +
      '<label style="font-size:0.85rem;color:var(--muted)">From</label>' +
      '<input type="date" id="m-team-from" value="' + M_STATE.teamFrom + '">' +
      '<label style="font-size:0.85rem;color:var(--muted)">To</label>' +
      '<input type="date" id="m-team-to" value="' + M_STATE.teamTo + '">' +
      '<button class="btn btn-sm" onclick="mLoadTeamMetrics_()" title="Refresh">' + icon('refresh', 14) + '</button>' +
    '</div>' +
    '<div class="m-controls" style="margin-top:calc(-1 * var(--space-xs))">' +
      '<span class="m-preset-chip" onclick="mTeamPreset_(\'today\')">Today</span>' +
      '<span class="m-preset-chip" onclick="mTeamPreset_(\'yesterday\')">Yesterday</span>' +
      '<span class="m-preset-chip" onclick="mTeamPreset_(\'week\')">Last 7 Days</span>' +
      '<span class="m-preset-chip" onclick="mTeamPreset_(\'month\')">Last 30 Days</span>' +
    '</div>' +
    '<div id="m-team-content"><div class="m-loading"><div class="spinner"></div> Loading metrics&hellip;</div></div>';

  document.getElementById('m-team-from').addEventListener('change', function () {
    M_STATE.teamFrom = this.value;
    if (M_STATE.teamFrom > M_STATE.teamTo) {
      M_STATE.teamTo = M_STATE.teamFrom;
      document.getElementById('m-team-to').value = M_STATE.teamTo;
    }
    mLoadTeamMetrics_();
  });
  document.getElementById('m-team-to').addEventListener('change', function () {
    M_STATE.teamTo = this.value;
    if (M_STATE.teamTo < M_STATE.teamFrom) {
      M_STATE.teamFrom = M_STATE.teamTo;
      document.getElementById('m-team-from').value = M_STATE.teamFrom;
    }
    mLoadTeamMetrics_();
  });

  mLoadTeamMetrics_();
}

function mTeamPreset_(key) {
  var today = mTodayIso_();
  if (key === 'today')     { M_STATE.teamFrom = today; M_STATE.teamTo = today; }
  if (key === 'yesterday') { M_STATE.teamFrom = mDaysAgo_(1); M_STATE.teamTo = mDaysAgo_(1); }
  if (key === 'week')      { M_STATE.teamFrom = mDaysAgo_(6); M_STATE.teamTo = today; }
  if (key === 'month')     { M_STATE.teamFrom = mDaysAgo_(29); M_STATE.teamTo = today; }
  var fromEl = document.getElementById('m-team-from');
  var toEl = document.getElementById('m-team-to');
  if (fromEl) fromEl.value = M_STATE.teamFrom;
  if (toEl)   toEl.value = M_STATE.teamTo;
  mLoadTeamMetrics_();
}

function mLoadTeamMetrics_() {
  var from = M_STATE.teamFrom;
  var to = M_STATE.teamTo;
  if (!from) return;
  var requestedView = currentView;

  document.getElementById('m-team-content').innerHTML =
    '<div class="m-loading"><div class="spinner"></div> Loading metrics&hellip;</div>';

  google.script.run
    .withSuccessHandler(function (data) {
      if (currentView !== requestedView) return;
      mRenderTeamMetrics_(data);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      document.getElementById('m-team-content').innerHTML =
        '<div class="m-empty">Failed to load metrics: ' + (err.message || err) + '</div>';
    })
    .getTeamMetrics(from, to);
}

function mRenderTeamMetrics_(data) {
  var el = document.getElementById('m-team-content');
  if (!el) return;

  if (data.error) {
    el.innerHTML = '<div class="m-empty">' + data.error + '</div>';
    return;
  }

  var t = data.teamTotals;
  var html = '';

  // V4·E4 — Hero + Rail. Hero = team % Answered + 30-day trend (single-day
  // only — multi-day ranges hide the sparkline since trend isn't meaningful).
  var avg = data.trend ? mTrendAvg_(data.trend, 'pctAnswered') : null;
  var deltaHtml = '';
  if (avg != null && t.pctAnswered != null) {
    var d = t.pctAnswered - avg;
    var sign = d > 0.05 ? 'pos' : (d < -0.05 ? 'neg' : 'neu');
    var label = d > 0.05 ? '+' + Math.abs(d).toFixed(1)
              : d < -0.05 ? '−' + Math.abs(d).toFixed(1)
              : '±0';
    deltaHtml = '<div class="m-hero-delta">' +
      '<span class="' + sign + '">' + label + ' pts</span> vs 30-day team average (' + avg.toFixed(1) + '%)</div>';
  }
  var heroLabel = (data.from && data.to && data.from !== data.to)
    ? data.from + ' → ' + data.to + ' · Team % Answered'
    : 'Team · % Answered';

  html += '<div class="m-layout">';
  html += '<div class="m-hero">';
  html += '<div class="m-hero-label">' + heroLabel + '</div>';
  html += '<div class="m-hero-value">' + t.pctAnswered + '<span class="unit">%</span></div>';
  html += deltaHtml;
  if (data.trend && data.trend.length > 1) {
    html += '<div class="m-hero-spark">' + mBuildHeroSparkSvg_(data.trend, 'pctAnswered', avg) + '</div>';
    var firstLabel = data.trend[0].date ? data.trend[0].date.substring(5) : '';
    var lastLabel = data.trend[data.trend.length - 1].date ? data.trend[data.trend.length - 1].date.substring(5) : '';
    html += '<div class="m-hero-spark-labels"><span>' + firstLabel + '</span><span>' + lastLabel + '</span></div>';
  }
  html += '</div>';

  // Side rail
  html += '<div class="m-rail">';
  html += mRailRow_('Rung', t.rung);
  html += mRailRow_('Answered', t.answered, 'good');
  html += mRailRow_('Missed', t.missed, t.missed > 0 ? 'warn' : 'good');
  html += mRailRow_('Total talk', t.tttFormatted);
  html += mRailRow_('Notes filed', t.noteCount,
    t.noteCoverage != null ? t.noteCoverage + '% coverage' : null);
  html += '</div>';
  html += '</div>';

  if (t.noteCoverage != null && t.noteCoverage < 80) {
    html += '<div class="m-hint">' + mCoverageBadge_(t.noteCoverage) +
      ' &nbsp; Team-wide coverage below 80%.</div>';
  }

  // Per-rep table
  if (data.reps.length === 0) {
    html += '<div class="m-empty">No activity data for ' + data.date + '.</div>';
  } else {
    html += '<div class="m-section-title">Per-Rep Breakdown</div>';
    html += '<div class="m-table-wrap"><table class="m-table">';
    html += '<thead><tr>' +
      '<th>Rep</th>' +
      '<th class="m-num">Rung</th>' +
      '<th class="m-num">Answered</th>' +
      '<th class="m-num">Missed</th>' +
      '<th class="m-num">% Ans</th>' +
      '<th class="m-num">ATT</th>' +
      '<th class="m-num">Notes</th>' +
      '<th class="m-num">Coverage</th>' +
      '</tr></thead><tbody>';

    for (var i = 0; i < data.reps.length; i++) {
      var r = data.reps[i];
      html += '<tr>';
      html += '<td class="m-name">' + r.repName + '</td>';
      html += '<td class="m-num">' + r.totalRung + '</td>';
      html += '<td class="m-num">' + r.totalAnswered + '</td>';
      html += '<td class="m-num">' + (r.totalMissed > 0 ? '<span style="color:var(--warn)">' + r.totalMissed + '</span>' : '0') + '</td>';
      html += '<td class="m-num">' + r.pctAnswered + '%</td>';
      html += '<td class="m-num">' + r.attFormatted + '</td>';
      html += '<td class="m-num">' + r.noteCount + '</td>';
      html += '<td class="m-num">' + (r.noteCoverage != null ? mCoverageBadge_(r.noteCoverage) : '<span style="color:var(--muted)">—</span>') + '</td>';
      html += '</tr>';
    }

    html += '</tbody></table></div>';
  }

  // Unmatched agents warning
  if (data.unmatchedAgents && data.unmatchedAgents.length > 0) {
    html += '<div class="m-hint" style="margin-top:var(--space-md)">' +
      icon('warning', 14) + ' ' + data.unmatchedAgents.length +
      ' CDR agent(s) not matched to roster: ' +
      data.unmatchedAgents.join(', ') + '</div>';
  }

  // Reverse-mismatch: roster reps with no CDR data
  if (data.rosterWithNoCdr && data.rosterWithNoCdr.length > 0) {
    html += '<div class="m-hint" style="margin-top:var(--space-xs)">' +
      icon('info', 14) + ' ' + data.rosterWithNoCdr.length +
      ' roster rep(s) with no CDR match: ' +
      data.rosterWithNoCdr.join(', ') +
      '. Check name spelling in Employees sheet vs CDR roster.</div>';
  }

  el.innerHTML = html;
}

// ── Ambient polling: answer-rate alert badge on Metrics sidebar icon ──

var M_AMBIENT_TIMER = null;

function mStartAmbientPolling_() {
  if (M_AMBIENT_TIMER) clearInterval(M_AMBIENT_TIMER);
  mPollAmbient_();
  M_AMBIENT_TIMER = setInterval(mPollAmbient_, 300000);
}

function mPollAmbient_() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res) { mClearBadge_(); return; }
      if (!res.badge) { mClearBadge_(); return; }
      var link = document.querySelector('.sb-link[data-tool="metrics"]')
              || document.querySelector('.nav-btn[data-tool="metrics"]');
      if (!link) return;
      var badge = link.querySelector('.m-alert-badge');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'm-alert-badge';
        link.appendChild(badge);
      }
      badge.textContent = res.badge.label;
      badge.title = 'Yesterday (' + res.badge.date + '): ' + res.badge.label + ' answered — below ' + (typeof CONFIG !== 'undefined' ? CONFIG.CDR_ALERT_THRESHOLD : 85) + '% threshold';
    })
    .withFailureHandler(function () { mClearBadge_(); })
    .getMetricsAmbient();
}

function mClearBadge_() {
  var links = document.querySelectorAll('.sb-link[data-tool="metrics"], .nav-btn[data-tool="metrics"]');
  for (var i = 0; i < links.length; i++) {
    var badge = links[i].querySelector('.m-alert-badge');
    if (badge) badge.remove();
  }
}
</script>
