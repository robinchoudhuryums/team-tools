        icon('info', 14) + ' Match diagnostics (' + diagN + ') ' + icon('chevronDown', 10) +
      '</button>' +
      '<div id="m-diag-body"' + (diagOpen ? '' : ' hidden') + '>' + diagBits + '</div>' +
    '</div>';
  }

  el.innerHTML = html;
}

/** #3 — Match-diagnostics disclosure (aria-expanded kept in step, INV-174). */
function mToggleDiag_(btn) {
  var body = document.getElementById('m-diag-body');
  if (!body) return;
  var next = body.hidden;   // hidden → open it
  body.hidden = !next;
  M_STATE.diagOpen = next;
  btn.setAttribute('aria-expanded', String(next));
  btn.classList.toggle('open', next);
}

/** #9 — drill from a Team Metrics rep row to Team Notes → Per-Rep View.
 *  Reuses cnAuditDrillToNote_ (sets CN_STATE.mgrRepView + the pending-drill
 *  flag, then showView('callNotesManage') — which re-gates visibility, F8). */
function mRepDrill_(btn) {
  var repId = btn.getAttribute('data-rep') || '';
  var date = btn.getAttribute('data-date') || '';
  if (typeof cnAuditDrillToNote_ === 'function') { cnAuditDrillToNote_(repId, date, ''); return; }
  if (typeof showToast === 'function') showToast('Team Notes unavailable', 'toast-warn');
}

/** #10 — TSV of the currently displayed team table, scope-aware. Pure
 *  (Node-pinned): plain values only, never HTML; an unavailable note read
 *  exports as '' — unknown is not 0 (INV-187). */
function mTeamTableTsv_(data, scope, sort) {
  var out = [];
  if (scope === 'queue') {
    out.push(['Queue', 'Transferred', 'Reps'].join('\t'));
    (data.queueRows || []).forEach(function (q) {
      out.push([q.queue, q.transferred, q.reps].join('\t'));
    });
  } else if (scope === 'dept') {
    out.push(['Department', 'Transferred', 'Queues', 'Reps (min)'].join('\t'));
    (data.groupRows || []).forEach(function (g) {
      out.push([g.group, g.transferred, (g.queues || []).length, g.reps].join('\t'));
    });
  } else {
    var hasTr = !!(data.queueRows && data.queueRows.length);
    var head = ['Rep', 'Rung', 'Answered', 'Missed', '% Ans', 'ATT', 'Notes', 'Coverage'];
    if (hasTr) head.push('Transfers');
    out.push(head.join('\t'));
    var reps = mSortReps_(data.reps || [], sort || { key: 'pctAnswered', dir: 'desc' });
    reps.forEach(function (r) {
      var row = [r.repName, r.totalRung, r.totalAnswered, r.totalMissed,
        (r.pctAnswered != null ? r.pctAnswered + '%' : ''),
        r.attFormatted,
        (r.noteCountUnavailable ? '' : r.noteCount),
        (r.noteCoverage != null ? r.noteCoverage + '%' : '')];
      if (hasTr) row.push(r.transferred);
      out.push(row.join('\t'));
    });
  }
  return out.join('\n');
}
function mCopyTeamTable_(btn) {
  var data = M_STATE.teamData;
  if (!data || !data.reps) { showToast('Nothing to copy yet', 'toast-warn'); return; }
  var tsv = mTeamTableTsv_(data, M_STATE.teamScopeActive || 'combined', M_STATE.teamSort);
  var doneOk = function () {
    if (btn && typeof flashCopied === 'function') flashCopied(btn);
    showToast('Table copied — paste into a spreadsheet', 'toast-success');
  };
  // Clipboard API first, textarea shim as fallback — both from the click
  // gesture (the documented HtmlService-iframe clipboard gotcha).
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tsv).then(doneOk, function () { mCopyFallback_(tsv, doneOk); });
      return;
    }
  } catch (_) { /* fall through to the shim */ }
  mCopyFallback_(tsv, doneOk);
}
function mCopyFallback_(text, onOk) {
  try {
    if (typeof cnFallbackCopy_ === 'function') { cnFallbackCopy_(text); onOk(); return; }
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    onOk();
  } catch (e) { showToast('Copy failed — select the table and copy manually', 'toast-error'); }
}

// ── Ambient polling: answer-rate alert badge on Metrics sidebar icon ──

var M_AMBIENT_TIMER = null;

function mStartAmbientPolling_() {
  // getMetricsAmbient is manager-gated (returns no badge to non-managers), so
  // polling it as a non-manager is a wasted RPC every 5 min for the whole
  // session. Only managers get a badge — skip entirely otherwise (F13).
  if (!(typeof empState !== 'undefined' && empState && empState.isManager)) return;
  if (M_AMBIENT_TIMER) clearInterval(M_AMBIENT_TIMER);
  mPollAmbient_();
  M_AMBIENT_TIMER = setInterval(mPollAmbient_, 300000);
}

function mPollAmbient_() {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res) { mClearBadge_(); return; }
      if (!res.badge) { mClearBadge_(); return; }
      var link = document.querySelector('.sb-link[data-tool="metrics"]')
              || document.querySelector('.nav-btn[data-tool="metrics"]');
      if (!link) return;
      var badge = link.querySelector('.m-alert-badge');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'm-alert-badge';
        link.appendChild(badge);
      }
      badge.textContent = res.badge.label;
      // L14 — the threshold rides the server response (CONFIG is server-only;
      // the old `typeof CONFIG` guard was dead and the tooltip always said 85).
      badge.title = 'Yesterday (' + res.badge.date + '): ' + res.badge.label + ' answered — below ' + (res.threshold || 85) + '% threshold';
    })
    .withFailureHandler(function () { mClearBadge_(); })
    .getMetricsAmbient();
}

function mClearBadge_() {
  var links = document.querySelectorAll('.sb-link[data-tool="metrics"], .nav-btn[data-tool="metrics"]');
  for (var i = 0; i < links.length; i++) {
    var badge = links[i].querySelector('.m-alert-badge');
    if (badge) badge.remove();
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  SPANISH INBOX — bilingual-assistance resolution time (managerOnly tab)
// ════════════════════════════════════════════════════════════════════════════
var SPANISH_STATE = { days: 30, tab: 'all' };
// Operator feedback 2026-08-06 — the combined Pending+Resolved list's RED
// band: a pending request older than this many hours renders destructive-toned
// ("overdue"), vs warn-toned pending and good-toned resolved. Client-side
// display threshold only (the server ships ageHours); tune here + redeploy.
// 24h chosen against the observed ~45m median — a same-day inbox where a
// day-old request is unambiguously stuck. (DR requests use the per-dept SLA
// machinery instead — see drRowToneCls_.)
var SPANISH_OVERDUE_HOURS = 24;

function enterSpanishInboxView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  area.innerHTML =
    (COMPACT_MODE
      ? '<div class="compact-header"><div class="ch-title">' + icon('mail', 16) + ' Spanish Inbox</div></div>'
      : '<div class="view-title-row"><div><h1 class="view-title">Spanish Inbox</h1><p>Bilingual-assistance request resolution time — first reply from a group member. Read-only.</p></div></div>') +
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px">' +
      '<label style="font-size:12px;color:var(--muted)">Window</label>' +
      '<select id="spanish-days">' + [7, 30, 60, 90].map(function (n) {
        return '<option value="' + n + '"' + (n === SPANISH_STATE.days ? ' selected' : '') + '>Last ' + n + ' days</option>';
      }).join('') + '</select>' +
    '</div>' +
    '<div id="spanish-body">' + loSweep() + '</div>';
  var sel = document.getElementById('spanish-days');
  if (sel) sel.onchange = function () { SPANISH_STATE.days = parseInt(this.value, 10) || 30; spanishLoad_(); };
  spanishLoad_();
}

function spanishLoad_() {
  var body = document.getElementById('spanish-body'); if (!body) return;
  body.innerHTML = loSweep();
  // M-6 (cycle 10): seq token so a slow 30-day response can't overwrite a
  // just-loaded 7-day view after a quick window-select double-change.
  SPANISH_STATE.seq = (SPANISH_STATE.seq || 0) + 1;
  var seq = SPANISH_STATE.seq;
  google.script.run
    .withSuccessHandler(function (d) {
      if (currentView !== 'metricsSpanish' || seq !== SPANISH_STATE.seq) return;
      spanishRender_(d);
    })
    .withFailureHandler(function (e) {
      if (currentView !== 'metricsSpanish' || seq !== SPANISH_STATE.seq) return;
      body.innerHTML = errorStateHtml_((e && e.message) || 'Failed to load');   // A12
    })
    .getSpanishInboxStats(SPANISH_STATE.days);
}

function spanishFmtDur_(mins) {
  if (mins == null) return '—';
  if (mins < 60) return mins + 'm';
  var h = Math.floor(mins / 60), m = mins % 60;
  if (h < 24) return h + 'h' + (m ? (' ' + m + 'm') : '');
  var dys = Math.floor(h / 24), hr = h % 24;
  return dys + 'd' + (hr ? (' ' + hr + 'h') : '');
}

/** Batch-6 (cycle 17): the server scan is capped at 200 threads (silent
 *  Gmail-search bound); a busier window under-reported with no signal. Each
 *  reader now ships `truncated` — render it as an explicit warning so a
 *  capped figure never reads as complete (INV-169/187). */
function spanishTruncNote_(d) {
  if (!d || !d.truncated) return '';
  return ' · <span style="color:var(--warning-deep)">scan capped at 200 threads — figures may be incomplete; narrow the window</span>';
}

function spanishRender_(d) {
  var body = document.getElementById('spanish-body'); if (!body) return;
  if (!d || d.error) { body.innerHTML = errorStateHtml_((d && d.error) || 'No data'); return; }   // A12
  var total = d.resolved + d.pending;
  var note = '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Inbox <b>' + esc(d.address) + '</b> · ' +
    esc(String(d.threadsScanned || 0)) + ' threads scanned' +
    (d.membersConfigured ? '' : ' · <span style="color:var(--warning-deep)">no member list set — counting any reply as resolved</span>') +
    spanishTruncNote_(d) + '</div>';
  var strip = '<div class="telemetry" style="max-width:660px;margin-bottom:16px">' +
    '<div class="tel-cell"><div class="tel-label">Resolved</div><div class="tel-value success">' + esc(String(d.resolved)) + '</div><div class="tel-sub">of ' + esc(String(total)) + '</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Pending</div><div class="tel-value ' + (d.pending > 0 ? 'warn' : '') + '">' + esc(String(d.pending)) + '</div><div class="tel-sub">awaiting reply</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Avg time</div><div class="tel-value">' + esc(spanishFmtDur_(d.avgMinutes)) + '</div><div class="tel-sub">to resolve</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Median</div><div class="tel-value">' + esc(spanishFmtDur_(d.medianMinutes)) + '</div><div class="tel-sub">to resolve</div></div>' +
    '</div>';
  // Operator feedback 2026-08-06 — ONE combined list, color-coded by status,
  // with filter chips instead of separate Pending/Resolved sub-tabs. The chips
  // FILTER the already-fetched lists client-side (no refetch).
  var mkTab = function (key, label) {
    return '<button class="toolbar-tab" data-sp-tab="' + key + '" aria-pressed="' + (SPANISH_STATE.tab === key) +
      '" onclick="spanishSetTab_(\'' + key + '\')">' + label + '</button>';
  };
  var toggle =
    '<div class="toolbar-tabs" role="group" aria-label="Filter by status" style="margin:2px 0 10px">' +
      mkTab('all', 'All') + mkTab('pending', 'Pending') + mkTab('resolved', 'Resolved') +
    '</div>';
  var list = '<div id="spanish-list" style="margin-top:2px">' + loSweep() + '</div>';
  body.innerHTML = note + strip + toggle + list;
  spanishLoadList_();
}

/** Filter the combined list in place (both lists are already fetched — a chip
 *  click never refetches; the stats strip + days select stay put). */
function spanishSetTab_(tab) {
  SPANISH_STATE.tab = (tab === 'pending' || tab === 'resolved') ? tab : 'all';
  document.querySelectorAll('.toolbar-tab[data-sp-tab]').forEach(function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-sp-tab') === SPANISH_STATE.tab);
  });
  spanishRenderList_();
}

/** Fetch BOTH lists for the combined view. An INV-156 FAN-IN (the batch-6
 *  trainLoadMgr_ shape): two RPCs write into shared SPANISH_STATE fields, so
 *  the seq token guards every STATE WRITE, not just the render — a stale
 *  round-1 response landing after round 2 rendered must not overwrite one
 *  list. Each half degrades independently: a failed half renders its own
 *  error card inside the combined view while the other half still shows. */
function spanishLoadList_() {
  var slot = document.getElementById('spanish-list'); if (!slot) return;
  slot.innerHTML = loSweep();
  SPANISH_STATE.listSeq = (SPANISH_STATE.listSeq || 0) + 1;
  var seq = SPANISH_STATE.listSeq;
  SPANISH_STATE.pendingRes = null; SPANISH_STATE.resolvedRes = null;
  SPANISH_STATE.pendingErr = null; SPANISH_STATE.resolvedErr = null;
  var got = 0;
  var done = function () {
    got++;
    if (got < 2 || currentView !== 'metricsSpanish' || seq !== SPANISH_STATE.listSeq) return;
    spanishRenderList_();
  };
  google.script.run
    .withSuccessHandler(function (d) {
      if (seq !== SPANISH_STATE.listSeq) return;
      if (!d || d.error) SPANISH_STATE.pendingErr = (d && d.error) || 'Could not load pending';
      else SPANISH_STATE.pendingRes = d;
      done();
    })
    .withFailureHandler(function (e) {
      if (seq !== SPANISH_STATE.listSeq) return;
      SPANISH_STATE.pendingErr = (e && e.message) || 'Could not load pending';
      done();
    })
    .getSpanishInboxPending(SPANISH_STATE.days);
  google.script.run
    .withSuccessHandler(function (d) {
      if (seq !== SPANISH_STATE.listSeq) return;
      if (!d || d.error) SPANISH_STATE.resolvedErr = (d && d.error) || 'Could not load resolved';
      else SPANISH_STATE.resolvedRes = d;
      done();
    })
    .withFailureHandler(function (e) {
      if (seq !== SPANISH_STATE.listSeq) return;
      SPANISH_STATE.resolvedErr = (e && e.message) || 'Could not load resolved';
      done();
    })
    .getSpanishInboxResolved(SPANISH_STATE.days);
}

/** The combined, color-coded list: pending first (oldest at the top — the most
 *  overdue is the most actionable), then resolved (newest first, the server
 *  order). Row tones: st-overdue (pending >= SPANISH_OVERDUE_HOURS) /
 *  st-pending / st-resolved. A failed HALF renders as an error card in place
 *  of its section — never as "nothing pending" (A12/INV-175/187). */
function spanishRenderList_() {
  var s = document.getElementById('spanish-list'); if (!s) return;
  var tab = SPANISH_STATE.tab;
  var html = '';
  if (tab !== 'resolved') {
    if (SPANISH_STATE.pendingErr) {
      html += errorStateHtml_(SPANISH_STATE.pendingErr);
    } else {
      var pd = SPANISH_STATE.pendingRes || {};
      var pending = (pd.pending || []).slice().sort(function (a, b) { return b.ageHours - a.ageHours; });
      if (!pending.length) {
        html += '<div class="day-section-label" style="margin:6px 0 8px">Pending</div>' +
          '<div style="font-size:13px;color:var(--muted);margin-bottom:14px">' + icon('checkCircle', 14) +
          ' Nothing pending — all caught up.' + spanishTruncNote_(pd) + '</div>';
      } else {
        html += '<div class="day-section-label" style="margin:6px 0 10px">Pending · ' + pending.length +
          spanishTruncNote_(pd) + '</div>' +
          '<div class="sp-tasks" style="margin-bottom:16px">' + pending.map(spanishTaskCard_).join('') + '</div>';
      }
    }
  }
  if (tab !== 'pending') {
    if (SPANISH_STATE.resolvedErr) {
      html += errorStateHtml_(SPANISH_STATE.resolvedErr);
    } else {
      var rd = SPANISH_STATE.resolvedRes || {};
      var resolved = rd.resolved || [];
      if (!resolved.length) {
        html += '<div class="day-section-label" style="margin:6px 0 8px">Resolved</div>' +
          '<div style="font-size:13px;color:var(--muted)">No resolved requests in this period.' + spanishTruncNote_(rd) + '</div>';
      } else {
        html += '<div class="day-section-label" style="margin:6px 0 10px">Resolved · ' + resolved.length +
          spanishTruncNote_(rd) + '</div>' +
          '<div class="sp-tasks">' + resolved.map(spanishResolvedCard_).join('') + '</div>';
      }
    }
  }
  s.innerHTML = html;
}

/** Row tone for a PENDING card — warn until SPANISH_OVERDUE_HOURS, then
 *  destructive. (Resolved cards are always st-resolved.) */
function spanishPendingToneCls_(ageHours) {
  return (Number(ageHours) >= SPANISH_OVERDUE_HOURS) ? 'st-overdue' : 'st-pending';
}

function spanishResolvedCard_(t) {
  var open = t.permalink ? '<a class="sp-open" href="' + esc(t.permalink) + '" target="_blank" rel="noopener">' + icon('mail', 12) + ' Open in Gmail</a>' : '';
  var took = spanishFmtDur_(t.resolveMinutes);
  var when = spanishFmtDateTime_(t.resolvedAtMs);
  return '<div class="sp-task st-resolved">' +
    '<div class="sp-task-head"><span class="sp-task-from">' + esc(t.requester) + '</span>' +
      '<span class="sp-task-age" style="color:var(--success-deep)">' + icon('check', 12) + ' ' + esc(took) + '</span></div>' +
    '<div class="sp-task-subj">' + esc(t.subject) + '</div>' +
    '<div class="sp-task-body" style="color:var(--muted)">' +
      (when ? '<span class="sp-resolved-when">' + icon('clock', 11) + ' Resolved ' + esc(when) + '</span> · ' : '') +
      'by ' + esc(t.resolver || 'a team member') + (t.manual ? ' · marked manually' : '') + '</div>' +
    '<div class="sp-task-actions">' + open + '</div>' +
  '</div>';
}

/** Resolved timestamp for the card (e.g. "Jun 21, 3:40 PM"). Display-only,
 *  manager-facing — browser-local is fine here (not a "today" derivation). The
 *  list is server-sorted newest-resolved-first; showing the stamp makes that
 *  ordering legible (the #6 fix). */
function spanishFmtDateTime_(ms) {
  if (!ms) return '';
  try {
    var d = new Date(ms);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' +
      d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  } catch (e) { return ''; }
}

// Content-aware tool suggestions: Spanish-inbox requests are usually to complete
// an intake form or log a specific note template (e.g. "Verified Shipping").
// Match keywords (EN + ES) in the subject/snippet (and the body once expanded)
// and surface deep-link chips. Heuristic + dismissible — a false positive is
// just an extra chip. Intake matches are distinct destinations; Call Notes
// matches collapse to a single chip (same Log destination, contextual label).
var SPANISH_TOOL_SUGGESTIONS = [
  { test: /wheelchair|mobility|scooter|power\s*chair|walker|rollator|silla de ruedas|movilidad|andad|scooter/i,
    label: 'PPD intake', tool: 'intake', tab: 'intakePpd', icon: 'clipboardList' },
  { test: /cpap|bipap|apnea|sleep|su[eé]ñ|m[aá]scar|mascarilla|resmed|airsense/i,
    label: 'PAP intake', tool: 'intake', tab: 'intakePapAccount', icon: 'airflow' },
  { test: /\bpmd\b|power mobility/i,
    label: 'PMD account', tool: 'intake', tab: 'intakePmdAccount', icon: 'accessibility' },
  { test: /shipping|tracking|delivery|shipment|env[ií]o|rastreo|entrega|paquete|seguimiento/i,
    label: 'Log: Verified Shipping', tool: 'callNotes', tab: 'callNotes', icon: 'mail', template: 'Verified Shipping' },
  { test: /resupply|resurtido|reorder|refill|supplies|resurt/i,
    label: 'Log: Repeat Resupply', tool: 'callNotes', tab: 'callNotes', icon: 'mail', template: 'Repeat Resupply' },
  { test: /\border\b|pedido|\borden\b|cancel|cancelar|\bstatus\b|estado/i,
    label: 'Log: Order update', tool: 'callNotes', tab: 'callNotes', icon: 'mail', template: 'Close Order' },
];
function spanishSuggestHtml_(text) {
  var t = String(text || '').toLowerCase();
  if (!t.trim()) return '';
  var seen = {}, chips = [];
  for (var i = 0; i < SPANISH_TOOL_SUGGESTIONS.length && chips.length < 3; i++) {
    var s = SPANISH_TOOL_SUGGESTIONS[i];
    if (!s.test.test(t)) continue;
    var key = s.tool === 'callNotes' ? 'callNotes' : (s.tool + ':' + s.tab);  // one CN chip max
    if (seen[key]) continue;
    seen[key] = 1;
    // Carry tool/tab/label/template on data-* (the request context — requester /
    // subject / snippet / permalink — is read from the .sp-task card DOM by
    // spanishNavTo_, so no quote-escaping of email text into an inline onclick).
    chips.push('<button class="sp-suggest" data-tool="' + esc(s.tool) + '" data-tab="' + esc(s.tab) +
      '" data-label="' + esc(s.label) + '" data-template="' + esc(s.template || '') +
      '" onclick="spanishNavTo_(this)" title="Open ' + esc(s.label) + '">' +
      icon(s.icon, 12) + esc(s.label) + '</button>');
  }
  if (!chips.length) return '';
  return '<div class="sp-suggests"><span class="sp-suggest-lbl">Suggested</span>' + chips.join('') + '</div>';
}

// Chip click → carry the email's request context into the destination tool via
// the shared APP_NAV_HINT (consumed by the Call Notes Log / Intake views, which
// render a context banner so the rep keeps the request in view, and — for Call
// Notes — prefill the Issue field + suggested update type). Context is read from
// the card DOM (no quote-escaping of email text into the chip's onclick).
function spanishNavTo_(btn) {
  var card = btn.closest('.sp-task');
  var read = function (sel, attr) {
    var e = card && card.querySelector(sel);
    return e ? (attr ? (e.getAttribute(attr) || '') : (e.textContent || '')).trim() : '';
  };
  window.APP_NAV_HINT = {
    source: 'spanishInbox',
    tool: btn.dataset.tool,
    tab: btn.dataset.tab,
    template: btn.dataset.template || '',
    requester: read('.sp-task-from'),
    subject: read('.sp-task-subj'),
    snippet: read('.sp-task-body'),
    permalink: read('.sp-open', 'href'),
  };
  enterTool(btn.dataset.tool, btn.dataset.tab);
}

function spanishTaskCard_(t) {
  var aged = t.ageHours >= 24 ? (Math.floor(t.ageHours / 24) + 'd ' + (t.ageHours % 24) + 'h') : (t.ageHours + 'h');
  var tone = t.ageHours >= 24 ? 'var(--danger-deep)' : (t.ageHours >= 4 ? 'var(--warning-deep)' : 'var(--muted)');
  var more = t.hasMore ? '<button class="sp-more" data-thread="' + esc(t.threadId) + '" onclick="spanishExpand_(this)">Show full request</button>' : '';
  var open = t.permalink ? '<a class="sp-open" href="' + esc(t.permalink) + '" target="_blank" rel="noopener">' + icon('mail', 12) + ' Open in Gmail</a>' : '';
  // Operator feedback 2026-07-09 — manual mark-resolved for requests handled
  // OUTSIDE the thread (phone call, done in the CRM) that would otherwise sit
  // pending forever. uiConfirm-guarded: there is no un-resolve.
  var resolve = '<button class="sp-more sp-resolve" data-thread="' + esc(t.threadId) + '" onclick="spanishResolve_(this)">' + icon('check', 12) + ' Mark resolved</button>';
  return '<div class="sp-task ' + spanishPendingToneCls_(t.ageHours) + '">' +
    '<div class="sp-task-head"><span class="sp-task-from">' + esc(t.requester) + '</span>' +
      '<span class="sp-task-age" style="color:' + tone + '">' + esc(aged) + '</span></div>' +
    '<div class="sp-task-subj">' + esc(t.subject) + '</div>' +
    '<div class="sp-task-body">' + esc(t.snippet) + (t.hasMore ? '…' : '') + '</div>' +
    '<div class="sp-suggest-wrap">' + spanishSuggestHtml_((t.subject || '') + ' ' + (t.snippet || '')) + '</div>' +
    '<div class="sp-task-actions">' + open + ' ' + more + ' ' + resolve + '</div>' +
  '</div>';
}

/** Manual mark-resolved (member/manager). Confirm first — a mis-click would
 *  permanently hide a pending request (there is no un-resolve; the thread
 *  itself stays in Gmail). Success removes the card in place. */
function spanishResolve_(btn) {
  var tid = btn.getAttribute('data-thread');
  var card = btn.closest('.sp-task');
  if (!tid || !card) return;
  uiConfirm({
    title: 'Mark this request resolved?',
    message: 'Use this when the request was handled outside the email thread (phone call, CRM, in person). It moves to the Resolved list — this can’t be undone in-app.',
    confirmLabel: 'Mark resolved',
  }).then(function (ok) {
    if (!ok) return;
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        if (!r || r.error) { showToast((r && r.error) || 'Could not mark resolved', 'error'); return; }
        card.remove();
        showToast(r.already ? 'Already marked resolved' : 'Marked resolved', 'success');
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        showToast((e && e.message) || 'Could not mark resolved', 'error');
      })
      .resolveSpanishThread(tid);
  });
}

function spanishExpand_(btn) {
  var tid = btn.getAttribute('data-thread');
  var card = btn.closest('.sp-task');
  if (!card) return;
  btn.disabled = true; btn.textContent = 'Loading…';
  google.script.run
    .withSuccessHandler(function (r) {
      btn.disabled = false; btn.textContent = 'Show full request';
      if (!r || r.error) { showToast((r && r.error) || 'Could not load', 'error'); return; }
      var bodyEl = card.querySelector('.sp-task-body');
      if (bodyEl) bodyEl.textContent = r.body || '(empty)';
      // Re-run tool suggestions now that the fuller body text is available.
      var subjEl = card.querySelector('.sp-task-subj');
      var wrap = card.querySelector('.sp-suggest-wrap');
      if (wrap) wrap.innerHTML = spanishSuggestHtml_((subjEl ? subjEl.textContent : '') + ' ' + (r.body || ''));
      btn.remove();
    })
    .withFailureHandler(function (e) { btn.disabled = false; btn.textContent = 'Show full request'; showToast((e && e.message) || 'Error', 'error'); })
    .getSpanishInboxThreadBody(tid);
}
</script>
