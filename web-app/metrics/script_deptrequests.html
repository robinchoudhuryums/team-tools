<script>
// ════════════════════════════════════════════════════════════════════════════
//  DEPT REQUESTS — inter-department request tracking (Metrics tab)
//  Tracking is AUTOMATIC: every department email an agent sends from Call Notes
//  (emailFromCallNote) logs a PHI-free DeptRequests row + embeds a "Mark
//  resolved" link in the email. This read-only tab shows the rep's own tracked
//  requests (open/resolved + elapsed) and, for managers, a per-department
//  resolution-time aggregate + oldest-open list. A request resolves either via
//  the email link (receiver clicks) OR the in-app button here (sender/manager).
//  Server: getDeptRequests / resolveDeptRequest / serveResolvePage_ (Code.js).
// ════════════════════════════════════════════════════════════════════════════

// bodies / expanded (operator testing note 6, 2026-09-10): the per-request
// EXPAND cache + open state — the A5 spanishExpand_ shape. State, not the
// DOM, is the source of truth, so a card repaint keeps an open card open and
// a second Expand costs no RPC.
const DR_STATE = { data: null, bodies: {}, expanded: {} };

function enterDeptRequestsView(area) {
  stopClock();
  DR_SHOWN = {};   // display cap resets on view enter
  const requestedView = currentView;
  // Operator 2026-08-18 (load-time sweep): SWR — the payload was already kept
  // (DR_LAST_DATA drives every filter re-render) but never consulted on enter,
  // so each visit re-paid the loader + RPC. Paint last-good instantly; skip
  // the refetch entirely while fresh (viewCacheFresh_, 45s); otherwise refresh
  // quietly behind the pill. A failed/errored refresh keeps last-good but
  // NULLS the stamp so the next enter retries (C17-5 / INV-129: a failed
  // round is never served as fresh).
  const seeded = !!(DR_LAST_DATA && DR_STATE.entry);
  if (seeded) {
    drRender_(area, DR_LAST_DATA, null);
    if (typeof viewCacheFresh_ === 'function' && viewCacheFresh_(DR_STATE.entry)) return;
    if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(true);
  } else {
    renderLoading(area, 'Loading requests…', 'outbox');
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView) return;
      if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(false);
      if (res && res.error) {
        DR_STATE.entry = null;
        if (!seeded) drRender_(area, null, res.error);   // seeded: keep last-good
        return;
      }
      DR_STATE.data = res || {};
      DR_STATE.entry = { at: Date.now() };
      drRender_(area, DR_STATE.data, null);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(false);
      DR_STATE.entry = null;
      if (!seeded) drRender_(area, null, (err && err.message) || 'Failed to load requests.');
    })
    .getDeptRequests();
}

// Operator feedback 2026-08-06 — "My requests" status filter (All default;
// chips filter the already-fetched combined list client-side, no refetch).
var DR_FILTER = 'all';
var DR_LAST_DATA = null;

// Operator feedback round 3 — a DEPARTMENT filter over every list on the
// page (My requests, Incoming, the manager team-wide list, and the stats
// table). MULTI-SELECT: empty = all departments (the default view); each
// chip toggles its department in/out; the "All departments" chip clears.
// Client-side over the cached payload, like the status chips — no refetch.
var DR_DEPT_FILTER = [];

// 22post A-6 (operator 2026-09-27): a visible SORT and a DATE filter over every
// list on the page. Default Newest, open first (the server ships that order;
// the client re-sorts on request). Client-side over the cached payload, like
// the chips. The range reads each item's createdMs; an undated legacy row is
// kept (a filter that cannot place a row does not drop it).
var DR_SORT = 'newest';
var DR_RANGE = { preset: 'all', from: '', to: '', customOpen: false };
var DR_SORTS = [
  { key: 'newest',  label: 'Newest first' },
  { key: 'oldest',  label: 'Oldest first' },
  { key: 'longest', label: 'Longest open' },
];
var DR_RANGE_PRESETS = [
  { key: 'all', label: 'All loaded' }, { key: '7', label: '7 days' },
  { key: '30', label: '30 days' }, { key: '90', label: '90 days' },
];
/** PURE — the comparator for a sort key. Every sort keeps open before
 *  resolved; within a group: newest / oldest by createdMs, or the longest
 *  business age first (a resolved row falls back to newest). */
function drSortCmp_(sort) {
  return function (a, b) {
    if (a.status !== b.status) return a.status === 'resolved' ? 1 : -1;
    const am = a.createdMs || 0, bm = b.createdMs || 0;
    if (sort === 'oldest') return (am || Infinity) - (bm || Infinity);
    if (sort === 'longest' && a.status !== 'resolved') return (b.elapsedMin || 0) - (a.elapsedMin || 0);
    return bm - am;
  };
}
/** PURE — is a created time inside the range? Presets are "the last N days";
 *  a custom range is local calendar days, both ends inclusive. An unknown
 *  time (null) is kept. */
function drInRange_(ms, range, nowMs) {
  if (ms == null || !range) return true;
  if (range.preset && range.preset !== 'all' && range.preset !== 'custom') {
    const days = Number(range.preset);
    return !(days > 0) || ms >= nowMs - days * 86400000;
  }
  if (range.preset === 'custom') {
    const from = range.from ? new Date(range.from + 'T00:00:00').getTime() : null;
    const to = range.to ? new Date(range.to + 'T23:59:59.999').getTime() : null;
    if (from != null && isFinite(from) && ms < from) return false;
    if (to != null && isFinite(to) && ms > to) return false;
  }
  return true;
}
/** One pipeline for every list: department chips, the date range, the sort. */
function drListView_(list) {
  const now = Date.now();
  return (list || []).filter(drDeptMatch_)
    .filter(function (r) { return drInRange_(r.createdMs, DR_RANGE, now); })
    .slice().sort(drSortCmp_(DR_SORT));
}
function drRangeActive_() { return DR_RANGE.preset !== 'all'; }
function drRerender_() {
  var area = getDeptRequestsArea_();
  if (area && DR_LAST_DATA) {
    drRender_(area, DR_LAST_DATA, null);
    if (typeof animateListSwap_ === 'function') animateListSwap_(area);
  }
}
function drSetSort_(key) {
  DR_SORT = DR_SORTS.some(function (x) { return x.key === key; }) ? key : 'newest';
  drRerender_();
}
function drSetRange_(key) {
  DR_RANGE.preset = DR_RANGE_PRESETS.some(function (x) { return x.key === key; }) ? key : 'all';
  DR_RANGE.customOpen = false;
  drRerender_();
}
function drToggleRangeCustom_(scope, rowId) {
  var open = (typeof mtDateRangeToggle_ === 'function') ? mtDateRangeToggle_(scope, rowId) : null;
  if (open != null) DR_RANGE.customOpen = open;
}
function drApplyRangeCustom_() {
  var f = document.getElementById('dr-range-from'), t = document.getElementById('dr-range-to');
  var from = f ? f.value : '', to = t ? t.value : '';
  if (from && to && from > to) { showToast('The start date is after the end date', 'toast-warn'); return; }
  DR_RANGE.preset = (from || to) ? 'custom' : 'all';
  DR_RANGE.from = from; DR_RANGE.to = to; DR_RANGE.customOpen = true;
  drRerender_();
}
/** The sort + range controls. The custom row is the shared mtDateRange_ one. */
function drControlsHtml_() {
  var active = DR_RANGE.preset === 'custom' ? '' : DR_RANGE.preset;
  var open = DR_RANGE.customOpen || DR_RANGE.preset === 'custom';
  var sortSel = '<label class="dr-sort">Sort <select aria-label="Sort requests" onchange="drSetSort_(this.value)">' +
    DR_SORTS.map(function (o) {
      return '<option value="' + o.key + '"' + (DR_SORT === o.key ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    }).join('') + '</select></label>';
  var range = (typeof mtDateRange_ === 'function')
    ? mtDateRange_({ scope: 'dr', ariaLabel: 'Date sent', presets: DR_RANGE_PRESETS, active: active,
        onPreset: 'drSetRange_', rowId: 'dr-range-custom', customOpen: open, onToggle: 'drToggleRangeCustom_' })
    : '';
  var row = (typeof mtDateRangeRow_ === 'function')
    ? mtDateRangeRow_('dr-range-custom', open,
        '<div class="field"><label for="dr-range-from">From</label><input type="date" id="dr-range-from" value="' + esc(DR_RANGE.from) + '"></div>' +
        '<div class="field"><label for="dr-range-to">To</label><input type="date" id="dr-range-to" value="' + esc(DR_RANGE.to) + '"></div>' +
        '<button type="button" class="refresh-btn" onclick="drApplyRangeCustom_()">Apply</button>')
    : '';
  return '<div class="dr-controls">' + sortSel + '<span class="dr-controls-label">Sent</span>' + range + '</div>' + row;
}
/** PURE — the oldest created time among the loaded rows (null if none dated):
 *  how far back a truncated window reaches. */
function drOldestLoadedMs_(data) {
  var ms = null;
  ['mine', 'incoming', 'allOpen'].forEach(function (k) {
    ((data && data[k]) || []).forEach(function (r) {
      if (r.createdMs && (ms == null || r.createdMs < ms)) ms = r.createdMs;
    });
  });
  return ms;
}

// Operator 2026-08-17 — display cap: per-section shown counts (mine /
// incoming / team). Reset on view enter; "Show more" bumps by SP_TASKS_PAGE.
var DR_SHOWN = {};

function drShowMore_(key) {
  DR_SHOWN[key] = (DR_SHOWN[key] || SP_TASKS_CAP) + SP_TASKS_PAGE;
  var area = getDeptRequestsArea_();
  if (area && DR_LAST_DATA) drRender_(area, DR_LAST_DATA, null);
}

function drSetFilter_(f) {
  DR_FILTER = (f === 'open' || f === 'resolved') ? f : 'all';
  var area = getDeptRequestsArea_();
  if (area && DR_LAST_DATA) {
    drRender_(area, DR_LAST_DATA, null);
    // Operator 2026-08-06 — staggered fade+rise on the re-rendered cards so
    // the filter swap is legible (decoration; reduced-motion-safe).
    if (typeof animateListSwap_ === 'function') animateListSwap_(area);
  }
}

function drToggleDeptFilter_(dept) {
  if (dept === '*') DR_DEPT_FILTER = [];
  else {
    var i = DR_DEPT_FILTER.indexOf(dept);
    if (i >= 0) DR_DEPT_FILTER.splice(i, 1); else DR_DEPT_FILTER.push(dept);
  }
  var area = getDeptRequestsArea_();
  if (area && DR_LAST_DATA) {
    drRender_(area, DR_LAST_DATA, null);
    if (typeof animateListSwap_ === 'function') animateListSwap_(area);   // see drSetFilter_
  }
}

/** A request's department COMPONENTS. A multi-dept send stores the JOINED
 *  label ("Billing, Shipping" — the INV-138 drSplitDepts_ shape), so the
 *  filter must match ANY component, never the raw joined string. */
function drDeptsOf_(item) {
  return String(item.toDept || '').split(/[,;]/)
    .map(function (x) { return x.trim(); })
    .filter(function (x) { return x; });
}

function drDeptMatch_(item) {
  if (!DR_DEPT_FILTER.length) return true;

  return drDeptsOf_(item).some(function (d) { return DR_DEPT_FILTER.indexOf(d) >= 0; });
}

/** Row tone from status + the existing per-dept SLA machinery (operator
 *  feedback 2026-08-06): green resolved; amber open on-time; deeper amber
 *  at-risk (>=75% of SLA); destructive overdue (past SLA — the per-dept
 *  DR_SLA_TARGETS / 2-working-day default the Admin editor already tunes, so "red after
 *  X days" is per-department config, not a new constant). */
/** PURE (M6, cycle 22) — the client twin of drSlaDaysLabel_: SLA targets are
 *  working days ("2 working days"), measured in business time. */
function drSlaDaysLabelClient_(days) {
  var d = Number(days);
  if (!(d > 0)) return '';
  return d + (d === 1 ? ' working day' : ' working days');
}
function drRowToneCls_(item) {
  if (item.status === 'resolved') return 'st-resolved';
  if (item.slaStatus === 'overdue') return 'st-overdue';
  if (item.slaStatus === 'atrisk') return 'st-atrisk';
  return 'st-pending';
}

/** The 4-cell KPI strip. Extracted (operator 2026-08-24) so the full render
 *  and the in-place resolve patch share ONE renderer. Every value here is
 *  derived CLIENT-side from data.mine, which is why the optimistic patch keeps
 *  the strip exactly correct with no server round-trip. */
function drKpiStripHtml_(data) {
  // 22post A-7 (operator 2026-09-27): a manager's cards are TEAM-WIDE, from the
  // server's drTeamKpis_ over the loaded window, labelled so.
  const team = data && data.isManager && data.teamKpis;
  if (team) return drTeamKpiStripHtml_(data, team);
  const mineAll = (data && data.mine) || [];
  const openAll = mineAll.filter(function (r) { return r.status !== 'resolved'; });
  const resolvedAll = mineAll.filter(function (r) { return r.status === 'resolved'; });
  const overdueCount = openAll.filter(function (r) { return r.slaStatus === 'overdue'; }).length;
  // Operator 2026-09-10 (note #3): a request resolved with the in-app "Mark
  // resolved" button is NOT a timed reply — the server nulls its elapsedMin,
  // and the optimistic patch below leaves the OPEN figure on the row, so the
  // median must skip `resolvedVia === 'app'` explicitly. Only email-link
  // resolves (the receiver's own click) carry a resolution time.
  const resolvedMins = resolvedAll
    .filter(function (r) { return r.resolvedVia !== 'app'; })
    .map(function (r) { return r.elapsedMin; })
    .filter(function (x) { return x != null; }).sort(function (a, b) { return a - b; });
  const manualCount = resolvedAll.filter(function (r) { return r.resolvedVia === 'app'; }).length;
  const medianResolve = resolvedMins.length ? resolvedMins[Math.floor(resolvedMins.length / 2)] : null;
  // The id sits on the WRAPPER, not the telemetry grid: drRepaintKpi_ replaces
  // this element's outerHTML on an in-place resolve, and a note rendered as a
  // SIBLING would accumulate one copy per patch.
  return '<div id="dr-kpi"><div class="telemetry" style="margin-bottom:16px">' +
    '<div class="tel-cell"><div class="tel-label">Open</div><div class="tel-value ' + (openAll.length ? 'warn' : '') + '">' + openAll.length + '</div><div class="tel-sub">awaiting resolution</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Overdue</div><div class="tel-value ' + (overdueCount ? 'crit' : '') + '">' + overdueCount + '</div><div class="tel-sub">past their SLA</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Resolved</div><div class="tel-value success">' + resolvedAll.length + '</div><div class="tel-sub">of ' + mineAll.length + '</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Median</div><div class="tel-value">' + esc(medianResolve != null ? drFmtMin_(medianResolve) : '—') + '</div><div class="tel-sub">' +
      esc(manualCount ? ('to resolve · ' + manualCount + ' marked in app, not timed') : 'to resolve') + '</div></div>' +
    '</div>' + drBusinessNoteHtml_(data) + '</div>';
}

/** 22post A-7 — the manager's team-wide strip: the same four cells and the
 *  same wrapper (#dr-kpi — drRepaintKpi_ swaps it), over the server's counts. */
function drTeamKpiStripHtml_(data, t) {
  const median = t.medianMin != null ? drFmtMin_(t.medianMin) : '—';
  return '<div id="dr-kpi"><div class="telemetry" style="margin-bottom:10px">' +
    '<div class="tel-cell"><div class="tel-label">Open · team</div><div class="tel-value ' + (t.open ? 'warn' : '') + '">' + t.open + '</div><div class="tel-sub">awaiting resolution</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Overdue · team</div><div class="tel-value ' + (t.overdue ? 'crit' : '') + '">' + t.overdue + '</div><div class="tel-sub">past their SLA</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Resolved · team</div><div class="tel-value success">' + t.resolved + '</div><div class="tel-sub">of ' + t.total + '</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Median · team</div><div class="tel-value">' + esc(median) + '</div><div class="tel-sub">' +
      esc(t.manualCount ? ('to resolve · ' + t.manualCount + ' marked in app, not timed') : 'to resolve') + '</div></div>' +
    '</div><div class="dr-kpi-scope">Team-wide — every tracked request in the loaded window, whoever sent it.</div>' +
    drBusinessNoteHtml_(data) + '</div>';
}

/** Operator 2026-08-31 — elapsed time and the SLA bands count BUSINESS hours
 *  (weekends, company holidays and after-hours excluded), so a Friday-afternoon
 *  request answered Monday morning is no longer "3 days old". Rendered only
 *  when the server says so (`slaBusiness` on any item), so an older server
 *  keeps its wall-clock figures with no note claiming otherwise. */
function drBusinessNoteHtml_(data) {
  const rows = [].concat((data && data.mine) || [], (data && data.incoming) || [], (data && data.allOpen) || []);
  const on = rows.some(function (r) { return r && r.slaBusiness; });
  if (!on) return '';
  return '<div style="font-size:11px;color:var(--muted-2);margin:-8px 0 14px">' +
    'Elapsed time and SLA bands count business hours only — weekends and company holidays excluded' +   // M11: the one calendar (g123), not a federal list
    '</div>';
}

function drRender_(area, data, errorMsg) {
  if (data) DR_LAST_DATA = data;
  const compact = (typeof COMPACT_MODE !== 'undefined' && COMPACT_MODE);
  // Operator feedback 2026-08-06 — this view now mirrors the Spanish Inbox
  // layout: title + subtitle, a 4-cell telemetry strip, filter chips, and
  // combined color-coded status CARDS (the shared .sp-task vocabulary in
  // styles.html) under day-section-label headers.
  const head = compact
    ? ''   // pop-out: the tool tab bar already names the active tab (operator 2026-08-11)
    : '<div class="view-title-row"><div><h1 class="view-title">Dept Requests</h1>' +
      '<p>Tracked automatically from the department emails you send. Read-only + resolve.</p></div></div>';
  // A12/INV-175: a LOAD FAILURE renders errorStateHtml_ (warn card + glyph +
  // role="alert"), never .dr-empty — that is the same quiet muted card used
  // below for "No tracked requests yet", so a failed RPC read as "you have no
  // requests". errorStateHtml_ escapes internally, so NO outer esc() here.
  // #dr-body is the widen anchor (.view-area:has(#dr-body) in the style block
  // below — the Dashboard #dash-grid precedent) so BOTH branches wrap in it;
  // the error render must not snap the view back to the narrow width.
  if (errorMsg) { area.innerHTML = '<div id="dr-body">' + head + errorStateHtml_(errorMsg) + '</div>'; return; }

  const intro = '<div class="dr-note">' + icon('outbox', 13) +
    ' Every department email you send from Call Notes is logged here. Resolve a request with the button below, ' +
    'or the receiver can click the “Mark resolved” link in the email.</div>';

  // The server reads only the most-recent rows (bounded tail) — be transparent
  // when older entries fall outside that window (F1/A4).
  // 22post A-6: name HOW FAR BACK the window reaches, so a date range that
  // starts earlier is visibly limited by the load, not by the data.
  const oldestMs = (data && data.truncated) ? drOldestLoadedMs_(data) : null;
  const trunc = (data && data.truncated)
    ? '<div class="dr-note" style="color:var(--warning-deep)">' + icon('outbox', 13) +
      ' Showing the most recent requests only — ' +
      (oldestMs ? 'nothing sent before ' + esc(new Date(oldestMs).toLocaleDateString()) + ' is loaded, whatever the date range.' : 'older entries aren’t listed.') + '</div>'
    : '';

  const mineAll = (data && data.mine) || [];
  const strip = drKpiStripHtml_(data);
  // Round 3 — the department chip bar. Universe + counts from EVERY list in
  // the payload (a chip renders even for a dept only present in the manager
  // team-wide list). Prune selections for departments that left the payload
  // so a stale selection can't silently filter everything out.
  const allItems = mineAll.concat((data && data.incoming) || [], (data && data.allOpen) || []);
  const deptCounts = {};
  allItems.forEach(function (r) {
    drDeptsOf_(r).forEach(function (dn) { deptCounts[dn] = (deptCounts[dn] || 0) + 1; });
  });
  const deptNames = Object.keys(deptCounts).sort();
  DR_DEPT_FILTER = DR_DEPT_FILTER.filter(function (dn) { return deptNames.indexOf(dn) >= 0; });
  const mkDeptChip = function (key, label) {
    const on = (key === '*') ? !DR_DEPT_FILTER.length : DR_DEPT_FILTER.indexOf(key) >= 0;
    return '<button type="button" class="toolbar-tab" data-dr-dept="' + esc(key) + '" aria-pressed="' + on +
      '" onclick="drToggleDeptFilter_(this.getAttribute(\'data-dr-dept\'))">' + label + '</button>';
  };
  const deptBar = deptNames.length > 1
    ? '<div class="toolbar-tabs" role="group" aria-label="Filter by department" style="margin:0 0 14px">' +
        mkDeptChip('*', 'All departments') +
        deptNames.map(function (dn) { return mkDeptChip(dn, esc(dn) + ' · ' + deptCounts[dn]); }).join('') +
      '</div>'
    : '';
  const mine = drListView_(mineAll).filter(function (r) {
    if (DR_FILTER === 'open') return r.status !== 'resolved';
    if (DR_FILTER === 'resolved') return r.status === 'resolved';
    return true;
  });
  const mkChip = function (key, label) {
    return '<button type="button" class="toolbar-tab" data-dr-filter="' + key + '" aria-pressed="' + (DR_FILTER === key) +
      '" onclick="drSetFilter_(\'' + key + '\')">' + label + '</button>';
  };
  const filterBar = mineAll.length
    ? '<div class="toolbar-tabs" role="group" aria-label="Filter by status" style="margin:0 0 10px">' +
        mkChip('all', 'All') + mkChip('open', 'Open') + mkChip('resolved', 'Resolved') +
      '</div>'
    : '';
  const mineHtml = mine.length
    ? spCappedTasksHtml_(mine.map(drRequestCardHtml_), DR_SHOWN.mine, "drShowMore_('mine')")
    : (mineAll.length
        ? '<div class="dr-empty">No matching requests' + (DR_DEPT_FILTER.length ? ' for the selected department(s)' : '') + (drRangeActive_() ? ' in this date range' : '') + ' in this list.</div>'
        : '<div class="dr-empty">No tracked requests yet. Send a department email from Call Notes to start one.</div>');
  const mineFiltered = drListView_(mineAll);
  const mineCount = (DR_DEPT_FILTER.length || drRangeActive_()) ? (mineFiltered.length + ' of ' + mineAll.length) : String(mineAll.length);
  const mineSection =
    '<div class="day-section-label" style="margin:14px 0 8px">My requests · ' + mineCount +
    drCapNoteHtml_(mineAll.length, data && data.mineTotal) + '</div>' + filterBar + mineHtml;

  // v2 Incoming inbox — open requests addressed to a department the rep staffs
  // (roster column N → data.myDepts). Members can resolve in-app here.
  let incomingSection = '';
  if (data && data.myDepts && data.myDepts.length) {
    const inc = drListView_(data.incoming || []);
    const incHtml = inc.length
      ? spCappedTasksHtml_(inc.map(drRequestCardHtml_), DR_SHOWN.incoming, "drShowMore_('incoming')")
      : '<div class="dr-empty">No open requests to your department right now.</div>';
    incomingSection =
      '<div class="day-section-label" style="margin:14px 0 8px">Incoming · ' + esc(data.myDepts.join(', ')) + ' · ' + inc.length +
      drCapNoteHtml_(inc.length, data.incomingTotal) + '</div>' + incHtml;
  }

  // 22post A-7 (operator 2026-09-27): for a manager or admin the page leads
  // with the summary cards BESIDE "Resolution time by department", then the
  // team-wide list, then Incoming, then My requests. A rep's order is unchanged.
  const controls = drControlsHtml_();
  let body;
  if (data && data.isManager) {
    body = deptBar + controls +
      '<div class="dr-top-row"><div class="dr-top-kpi">' + strip + '</div>' +
        '<div class="dr-top-stats">' + drMgrStatsHtml_(data) + '</div></div>' +
      drMgrTeamHtml_(data) + incomingSection + mineSection;
  } else {
    body = strip + deptBar + controls + incomingSection + mineSection;
  }
  area.innerHTML = '<div id="dr-body">' + head + intro + trunc + body + '</div>';
  if (typeof observeReveals === 'function') observeReveals(area);
}

// F18 (cycle 12): a "showing N of M" suffix for a payload-capped list. Renders
// NOTHING when the list is complete (or when an older server omits the total),
// so the common case is unchanged and a client on a not-yet-redeployed server
// degrades to today's behaviour instead of showing "showing 12 of undefined".
function drCapNoteHtml_(shown, total) {
  const t = Number(total);
  if (!isFinite(t) || t <= shown) return '';
  return ' <span class="dr-cap-note">showing ' + shown + ' of ' + t + '</span>';
}

/** The head-age slot: tone-colored status text (the Spanish card's colored
 *  age). Resolved → green "resolved in Xh"; open → Open · elapsed, prefixed
 *  At risk / Overdue (+ the SLA hours) when the SLA machinery says so. */
function drCardStatusHtml_(item) {
  // The wall-clock figure rides in the title so a reader can still see the
  // calendar gap behind the business-hours headline (operator 2026-08-31).
  const ttl = (item.slaBusiness && item.elapsedWallMin != null)
    ? ' title="' + esc('Wall clock: ' + drFmtMin_(item.elapsedWallMin)) + '"' : '';
  if (item.status === 'resolved') {
    // Note #3 — the label says HOW it was resolved, because only an email-link
    // resolve is a timed reply: an in-app "Mark resolved" reads "marked in app",
    // a legacy row with no ResolvedVia reads plain "resolved", and neither
    // shows a duration (the server ships elapsedMin null for both).
    const via = item.resolvedVia === 'app' ? 'marked in app'
      : (item.resolvedVia === 'email' && item.elapsedMin != null) ? drFmtMin_(item.elapsedMin)
      : 'resolved';
    const viaTtl = item.resolvedVia === 'app' ? ' title="Marked resolved in the app — not counted as a timed reply"' : ttl;
    return '<span class="sp-task-age" style="color:var(--success-deep)"' + viaTtl + '>' + icon('check', 12) + ' ' +
      esc(via) + '</span>';
  }
  const elapsed = item.elapsedMin != null ? drFmtMin_(item.elapsedMin) + ' ago' : '';
  const sla = item.slaDays ? ' · ' + drSlaDaysLabelClient_(item.slaDays) + ' SLA' : '';   // M6: working days
  if (item.slaStatus === 'overdue') {
    return '<span class="sp-task-age" style="color:var(--danger-deep)"' + ttl + '>' + esc('Overdue' + sla) + '</span>';
  }
  if (item.slaStatus === 'atrisk') {
    return '<span class="sp-task-age" style="color:var(--warning-deep)"' + ttl + '>' + esc('At risk · ' + elapsed) + '</span>';
  }
  return '<span class="sp-task-age" style="color:var(--warning-deep)"' + ttl + '>' + esc('Open · ' + elapsed) + '</span>';
}

function drRequestCardHtml_(item) {
  const resolved = item.status === 'resolved';
  const resolveBtn = !resolved
    ? '<button type="button" class="sp-more sp-resolve" data-req="' + esc(item.requestId) +
        '" onclick="drResolveClick_(this)">' + icon('check', 12) + ' Mark resolved</button>'
    : '';
  const body = esc(item.createdAt || '') + (item.byName ? ' · ' + esc(item.byName) : '') +
    (resolved && item.resolvedBy ? '\nResolved by ' + esc(item.resolvedBy) : '');
  // Note #6 (operator 2026-09-10): the collapsed card reads like the email's
  // subject — "<update type> · <patient name & TRX>" — so the desk can tell
  // which patient a request is about without opening it. A legacy row ships
  // no patientTrx and renders the label alone.
  const subj = esc(item.label || 'Department request') +
    (item.patientTrx ? ' <span class="dr-subj-trx">· ' + esc(item.patientTrx) + '</span>' : '');
  // Expand ⇄ Collapse (the A5 Spanish shape): a real button with aria-expanded
  // kept in step (INV-174) and aria-controls naming the detail panel. The
  // panel renders from STATE — open only when this id is expanded AND cached.
  const detailId = drDetailId_(item.requestId);
  const isOpen = drIsExpanded_(item.requestId);
  const expandBtn = '<button type="button" class="sp-more dr-expand" data-req="' + esc(item.requestId) +
    '" aria-expanded="' + (isOpen ? 'true' : 'false') + '" aria-controls="' + detailId +
    '" onclick="drExpand_(this)">' + (isOpen ? 'Collapse' : 'Expand') + '</button>';
  const detail = '<div class="dr-detail" id="' + detailId + '"' + (isOpen ? '' : ' hidden') + '>' +
    (isOpen ? drDetailHtml_(DR_STATE.bodies[item.requestId]) : '') + '</div>';
  return '<div class="sp-task js-anim ' + drRowToneCls_(item) + '" data-req="' + esc(item.requestId) + '">' +
    '<div class="sp-task-head"><span class="sp-task-from">' + esc(item.toDept || '—') + '</span>' +
      drCardStatusHtml_(item) + '</div>' +
    '<div class="sp-task-subj">' + subj + '</div>' +
    '<div class="sp-task-body">' + body + '</div>' +
    detail +
    '<div class="sp-task-actions">' + expandBtn + resolveBtn + '</div>' +
  '</div>';
}

// ── Expand / Collapse (operator testing note 6, 2026-09-10) ────────────────
// The card shows the subject; Expand fetches the SOURCE NOTE's fields through
// getDeptRequestDetail — scoped server-side to the sender, a manager, or a
// member of the receiving department (the SAME rule as resolve, so whoever
// may close a request may read what it was about) — and caches them per
// request in DR_STATE.bodies. Collapse hides the panel with no RPC; a later
// Expand reuses the cache.

/** The detail panel's id — a request id is a UUID, built defensively so
 *  aria-controls always names a valid id. */
function drDetailId_(id) { return 'dr-detail-' + String(id || '').replace(/[^A-Za-z0-9_-]/g, '_'); }
function drIsExpanded_(id) {
  return !!(DR_STATE.expanded && DR_STATE.expanded[id] && DR_STATE.bodies && DR_STATE.bodies[id] != null);
}

/** The panel's inner markup from a getDeptRequestDetail payload. Every field
 *  is escaped (they are free-typed note text). A `note: null` payload states
 *  the server's REASON (INV-187 — "nothing to show" is said, never an empty
 *  panel that reads as an empty note). */
function drDetailHtml_(d) {
  if (!d) return '';
  if (!d.note) {
    return '<div class="dr-detail-none">' + icon('info', 12) + ' ' + esc(d.reason || 'No linked note.') + '</div>';
  }
  const n = d.note;
  const row = function (label, val) {
    return '<div class="dr-detail-row"><div class="dr-detail-k">' + esc(label) + '</div>' +
      '<div class="dr-detail-v">' + (val ? esc(val) : '<span class="dr-detail-blank">—</span>') + '</div></div>';
  };
  return row('Note date', n.dateLocal) +
    row('Callback', n.callback) +
    row('Caller', n.caller + (n.relationship ? ' (' + n.relationship + ')' : '')) +
    row('Patient & TRX', n.patientAndTrx) +
    row('Issue', n.issue) +
    row('Transferred to', n.transferredTo) +
    row('Resolution', n.resolution);
}

/** Expand ⇄ Collapse a request card's detail panel. Nav-guarded on
 *  currentView; a button that was repainted away mid-fetch (an in-place
 *  resolve replaces the card node) falls back to drRepaintRequest_, which
 *  renders the open panel from state. */
function drExpand_(btn) {
  const id = btn.getAttribute('data-req');
  const card = btn.closest('.sp-task');
  if (!card || !id) return;
  const st = DR_STATE;
  st.bodies = st.bodies || {}; st.expanded = st.expanded || {};
  const panel = card.querySelector('.dr-detail');
  if (st.expanded[id]) {
    st.expanded[id] = false;
    if (panel) { panel.hidden = true; panel.innerHTML = ''; }
    btn.textContent = 'Expand'; btn.setAttribute('aria-expanded', 'false');
    return;
  }
  const open = function () {
    st.expanded[id] = true;
    if (panel) { panel.innerHTML = drDetailHtml_(st.bodies[id]); panel.hidden = false; }
    btn.textContent = 'Collapse'; btn.setAttribute('aria-expanded', 'true');
  };
  if (st.bodies[id] != null) { open(); return; }   // cached — a second Expand costs no RPC
  const requestedView = currentView;
  btn.disabled = true; btn.textContent = 'Loading…';
  google.script.run
    .withSuccessHandler(function (r) {
      if (currentView !== requestedView) return;
      btn.disabled = false;
      if (!r || r.error) { btn.textContent = 'Expand'; showToast((r && r.error) || 'Could not load', 'toast-error'); return; }
      st.bodies[id] = r;
      if (document.body.contains(btn)) open();
      else { st.expanded[id] = true; drRepaintRequest_(id); }
    })
    .withFailureHandler(function (e) {
      if (currentView !== requestedView) return;
      btn.disabled = false; btn.textContent = 'Expand';
      showToast((e && e.message) || 'Could not load', 'toast-error');
    })
    .getDeptRequestDetail(id);
}

/** The manager table's "Not timed" cell — the resolved rows that contribute
 *  no duration (note #3). `manualResolved` = marked in the app; `untrackedResolved`
 *  = legacy rows resolved before ResolvedVia existed. Both are REPORTED rather
 *  than silently absorbed into an average that would misdescribe them (INV-187);
 *  an older server ships neither field and the cell renders an em dash. */
function drStatsNotTimedCell_(s) {
  const m = (s && s.manualResolved) || 0;
  const u = (s && s.untrackedResolved) || 0;
  if (s == null || (s.manualResolved == null && s.untrackedResolved == null)) return '—';
  if (!m && !u) return '0';
  const parts = [];
  if (m) parts.push(m + ' in app');
  if (u) parts.push(u + ' legacy');
  return esc(String(m + u)) + ' <span class="dr-tag">' + esc(parts.join(' · ')) + '</span>';
}

/** 22post A-7 — the per-department resolution table (server-derived; swapped
 *  whole by drRepaintMgr_ on reconcile). */
function drMgrStatsHtml_(data) {
  const stats = (data.deptStats || []).filter(function (sRow) {
    return !DR_DEPT_FILTER.length || DR_DEPT_FILTER.indexOf(sRow.dept) >= 0;
  });
  const statRows = stats.map(function (s) {
    const overdueCell = s.overdueOpen
      ? '<td class="dr-num" style="color:var(--danger-deep);font-weight:700">' + s.overdueOpen + '</td>'
      : '<td class="dr-num">0</td>';
    return '<tr>' +
      '<td>' + esc(s.dept) + (s.slaDays ? ' <span class="dr-tag">' + esc(drSlaDaysLabelClient_(s.slaDays) + ' SLA') + '</span>' : '') + '</td>' +
      '<td class="dr-num">' + s.open + '</td>' +
      overdueCell +
      '<td class="dr-num">' + s.resolved + '</td>' +
      '<td class="dr-num">' + (s.avgMinutes != null ? drFmtMin_(s.avgMinutes) : '—') + '</td>' +
      '<td class="dr-num">' + (s.medianMinutes != null ? drFmtMin_(s.medianMinutes) : '—') + '</td>' +
      '<td class="dr-num">' + drStatsNotTimedCell_(s) + '</td>' +
    '</tr>';
  }).join('');
  const statTable = stats.length
    ? '<table class="dr-table"><thead><tr>' +
        '<th>Department</th><th class="dr-num">Open</th><th class="dr-num">Overdue</th><th class="dr-num">Resolved</th>' +
        '<th class="dr-num">Avg</th><th class="dr-num">Median</th>' +
        '<th class="dr-num" title="Resolved rows that carry no reply time: marked in the app, or logged before resolution tracking recorded how">Not timed</th></tr></thead>' +
        '<tbody>' + statRows + '</tbody></table>' +
        '<div style="font-size:11px;color:var(--muted-2);margin:6px 0 0">Avg and Median count email-link resolves only — a request marked resolved in the app is not a timed reply.</div>'
    : '<div class="dr-empty">No requests recorded yet.</div>';

  return '<div id="dr-mgr-stats">' +
    '<div class="day-section-label" style="margin:0 0 8px">Resolution time by department</div>' +
    '<div class="dr-section dr-mgr">' + statTable + '</div></div>';
}

/** 22post A-7 — the team-wide oldest-open list, above Incoming and My requests. */
function drMgrTeamHtml_(data) {
  const openAllTeam = data.allOpen || [];
  const open = drListView_(openAllTeam);
  const openCount = (DR_DEPT_FILTER.length || drRangeActive_()) ? (open.length + ' of ' + openAllTeam.length) : String(openAllTeam.length);
  const openHtml = open.length
    ? spCappedTasksHtml_(open.map(drRequestCardHtml_), DR_SHOWN.team, "drShowMore_('team')")
    : '<div class="dr-empty">No ' + (DR_DEPT_FILTER.length ? 'matching ' : '') + 'open requests across the team.</div>';

  return '<div id="dr-mgr-team">' +
    '<div class="day-section-label" style="margin:18px 0 8px">Oldest open (team-wide) · ' + openCount +
      drCapNoteHtml_(openAllTeam.length, data.allOpenTotal) + '</div>' + openHtml +
  '</div>';
}

// ── In-place resolve (operator 2026-08-24) ─────────────────────────────────
// Resolving used to re-enter the whole view: full loader, scroll jump, every
// card re-animating — for a ONE-CARD change. The card now carries its own
// in-flight state and flips to resolved in place. Nothing else on the page
// moves.

/** Every rendered card for a request. One request can appear in Mine,
 *  Incoming AND the manager team list, so all instances must flip together.
 *  Compares the decoded attribute in JS rather than building a selector from
 *  the id — no value from the payload ever enters a selector string. */
function drCardNodes_(id) {
  const out = [];
  const all = document.querySelectorAll('.sp-task[data-req]');
  for (let i = 0; i < all.length; i++) {
    if (String(all[i].getAttribute('data-req')) === String(id)) out.push(all[i]);
  }
  return out;
}

function drFindItem_(id) {
  const lists = ['mine', 'incoming', 'allOpen'];
  for (let i = 0; i < lists.length; i++) {
    const arr = (DR_LAST_DATA && DR_LAST_DATA[lists[i]]) || [];
    for (let j = 0; j < arr.length; j++) {
      if (String(arr[j].requestId) === String(id)) return arr[j];
    }
  }
  return null;
}

/** Mark the request resolved in the CACHED payload — in every list it appears
 *  in. This is the load-bearing half: DR_LAST_DATA drives every filter
 *  re-render (drSetFilter_ / drToggleDeptFilter_ / drShowMore_ all repaint
 *  from it), so a DOM-only patch would resurrect the card as OPEN on the next
 *  chip click. `elapsedMin` is deliberately left alone: while open it means
 *  "minutes since created", and at the instant of resolution that is exactly
 *  the resolution time the server will compute (resolvedAt − createdAt), so
 *  the card reads "✓ 2h" with no invented arithmetic. `resolvedBy` is NOT
 *  set — it is the resolver's EMAIL and the client only holds name/id, so
 *  the "Resolved by" line waits for the authoritative payload rather than
 *  showing a guess. `resolvedVia = 'app'` IS set (note #3): this button is the
 *  in-app path, so the card reads "marked in app" and the KPI median skips
 *  it — exactly what the server's next payload will say. */
function drApplyResolved_(id) {
  const lists = ['mine', 'incoming', 'allOpen'];
  let was = null;
  lists.forEach(function (k) {
    ((DR_LAST_DATA && DR_LAST_DATA[k]) || []).forEach(function (r) {
      if (String(r.requestId) === String(id)) {
        if (!was && r.status !== 'resolved') was = { overdue: r.slaStatus === 'overdue' };
        r.status = 'resolved'; r.resolvedVia = 'app';
      }
    });
  });
  // 22post A-7: keep a manager's team-wide strip right until the reconcile lands.
  const t = DR_LAST_DATA && DR_LAST_DATA.teamKpis;
  if (t && was) {
    t.open = Math.max(0, t.open - 1); t.resolved++; t.manualCount++;
    if (was.overdue) t.overdue = Math.max(0, t.overdue - 1);
  }
}

function drRepaintKpi_() {
  const host = document.getElementById('dr-kpi');
  if (host && DR_LAST_DATA) host.outerHTML = drKpiStripHtml_(DR_LAST_DATA);
}

function drRepaintMgr_() {
  if (!DR_LAST_DATA || !DR_LAST_DATA.isManager) return;
  const stats = document.getElementById('dr-mgr-stats');
  if (stats) stats.outerHTML = drMgrStatsHtml_(DR_LAST_DATA);
  const team = document.getElementById('dr-mgr-team');
  if (team) team.outerHTML = drMgrTeamHtml_(DR_LAST_DATA);
}

/** Re-render ONLY this request's card(s) + the KPI strip, from the cached
 *  payload. The card lists are never rebuilt — that repaint is the jump this
 *  whole change exists to remove. */
function drRepaintRequest_(id) {
  const item = drFindItem_(id);
  drCardNodes_(id).forEach(function (node) {
    // No item = the reconcile dropped it from every list (the server keeps
    // resolved requests out of incoming/allOpen). The optimistic card already
    // reads resolved, so leave it standing and just clear the busy state.
    if (!item) { node.classList.remove('is-busy'); return; }
    const tmp = document.createElement('div');
    tmp.innerHTML = drRequestCardHtml_(item);
    const fresh = tmp.firstElementChild;
    if (!fresh) { node.classList.remove('is-busy'); return; }
    fresh.classList.add('swap-in');   // the shared list-swap motion; reduced-motion-safe
    node.parentNode.replaceChild(fresh, node);
  });
  drRepaintKpi_();
}

/** MANAGERS ONLY: deptStats (per-department open / resolved / avg / median)
 *  is SERVER-derived, so the optimistic patch cannot keep it honest — refetch
 *  quietly and swap the manager block + this request's card(s), which also
 *  brings the authoritative "Resolved by". A rep needs no reconcile: every
 *  number they can see (the KPI strip) is derived client-side from data.mine,
 *  and the patch above keeps it exact. */
function drReconcile_(requestedView, id) {
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requestedView) return;
      if (!res || res.error) { DR_STATE.entry = null; return; }   // INV-129: a failed round is never stamped fresh
      DR_LAST_DATA = res; DR_STATE.data = res; DR_STATE.entry = { at: Date.now() };
      drRepaintMgr_();
      drRepaintKpi_();   // 22post A-7: a manager's strip is server-derived too
      drRepaintRequest_(id);
    })
    .withFailureHandler(function () { DR_STATE.entry = null; })
    .getDeptRequests();
}

/** In-app resolve (the manual path): the sender or a manager marks an open
 *  request resolved (server enforces owner-or-manager). */
function drResolveClick_(btn) {
  const id = btn.getAttribute('data-req');
  if (!id || btn.disabled) return;
  const card = btn.closest('.sp-task');
  btn.disabled = true; btn.classList.add('is-busy');
  const orig = btn.innerHTML;
  btn.innerHTML = icon('check', 12) + ' Resolving…';
  if (card) card.classList.add('is-busy');   // the card is the loader now, not the page
  // F(cycle-8 M-9): capture the view at CLICK time — a rep who navigates away
  // during the 300–800ms RPC must not have this view painted over the new one.
  const requestedView = currentView;
  const restore = function () {
    if (card) card.classList.remove('is-busy');
    btn.disabled = false; btn.classList.remove('is-busy'); btn.innerHTML = orig;
  };
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) {
        showToast(res.already ? 'Already resolved.' : 'Marked resolved.', 'toast-success');
        if (typeof clkNeedsYouInvalidate_ === 'function') clkNeedsYouInvalidate_();   // T9: the Dashboard's Needs-you list refetches
        drApplyResolved_(id);          // cache first — the DOM is rendered FROM it
        // The stamp is busted even on success: the patch is an approximation
        // (resolvedBy, deptStats, the server's own list membership), so the
        // next ENTER refetches rather than serving it as fresh.
        DR_STATE.entry = null;
        if (currentView !== requestedView) return;
        drRepaintRequest_(id);
        if (DR_LAST_DATA && DR_LAST_DATA.isManager) drReconcile_(requestedView, id);
      } else {
        showToast((res && res.error) || 'Could not resolve.', 'toast-error');
        restore();
      }
    })
    .withFailureHandler(function (err) {
      showToast((err && err.message) || 'Could not resolve.', 'toast-error');
      restore();
    })
    .resolveDeptRequest(id);
}

function getDeptRequestsArea_() {
  return document.getElementById('view-area') || document.querySelector('.view-area');
}

function drFmtMin_(min) {
  if (min == null) return '—';
  if (min < 1) return '<1m';
  if (min < 60) return min + 'm';
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return m ? (h + 'h ' + m + 'm') : (h + 'h');
  const d = Math.floor(h / 24), rh = h % 24;
  return rh ? (d + 'd ' + rh + 'h') : (d + 'd');
}
</script>

<style>
  /* The list rows moved to the SHARED .sp-task status-card vocabulary in
     styles.html (operator feedback 2026-08-06 — this view mirrors the Spanish
     Inbox). Only the DR-specific pieces remain below: the stats-table card,
     the SLA tag, notes/empties, and the table itself. */
  /* Operator 2026-08-17 — full-width: widen the view past --content-max so the
     card grid + telemetry strip use the monitor (the Dashboard precedent). */
  .view-area:has(#dr-body) { max-width: 1480px; }
  .dr-section { background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; }
  /* F18 — the "showing N of M" suffix on a payload-capped list. */
  .dr-cap-note { font-weight: 400; font-size: 11px; color: var(--muted-2); text-transform: none; letter-spacing: 0; }
  .dr-note { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--muted);
    background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 10px 12px; margin-bottom: 14px; }
  .dr-tag { display: inline-block; margin-left: 8px; padding: 1px 7px; font-size: 10px;
    font-weight: 600; color: var(--muted); background: var(--paper-2); border-radius: 999px; }
  .dr-empty { padding: 18px; text-align: center; font-size: 13px; color: var(--muted);
    background: var(--paper-card); border: 1px dashed var(--line); border-radius: var(--radius-md); }
  /* 22post A-6/A-7 — the sort + date controls, and the manager top row: the
     summary cards beside the resolution table, stacking narrow and in the
     pop-out (data-compact is the POP-OUT, not a breakpoint — g50). */
  .dr-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; }
  .dr-controls .mt-range { margin: 0; }
  .dr-controls-label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .dr-sort { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .dr-sort select { font: inherit; font-family: var(--ui); font-size: 12px; letter-spacing: 0; text-transform: none;
    padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-card); color: var(--ink); }
  .dr-top-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: start; margin: 0 0 6px; }
  .dr-top-row .telemetry { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dr-top-kpi, .dr-top-stats { min-width: 0; }   /* grid children: let the table scroll, never widen the row */
  .dr-top-stats { overflow-x: auto; }
  .dr-kpi-scope { font-size: 11px; color: var(--muted-2); margin: 0 0 8px; }
  @media (max-width: 900px) { .dr-top-row { grid-template-columns: minmax(0, 1fr); } }
  :root[data-compact] .dr-top-row { grid-template-columns: minmax(0, 1fr); }
  .dr-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .dr-table th { text-align: left; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--muted); font-weight: 600;
    padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .dr-table td { padding: 7px 8px; border-bottom: 1px solid var(--line); color: var(--ink); }
  .dr-table .dr-num { text-align: right; font-family: var(--mono); }
  /* Note #6 (operator 2026-09-10) — the subject's patient & TRX half, and the
     Expand detail panel (label column + value; stacks on a phone — A2). */
  .dr-subj-trx { font-weight: 500; color: var(--muted); }
  .dr-detail { margin-top: 8px; padding: 8px 10px; background: var(--paper-2);
