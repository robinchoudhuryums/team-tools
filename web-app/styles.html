    font-size: 13px; font-weight: 500; color: var(--paper-card);
    cursor: pointer; letter-spacing: .02em;
    transition: background var(--t) var(--ease), border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
  }
  .btn-modal-ok:hover:not(:disabled) {
    background: color-mix(in oklch, var(--ink), var(--accent) 18%);
    border-color: color-mix(in oklch, var(--ink), var(--accent) 18%);
    box-shadow: var(--shadow-sm);
  }
  .btn-modal-ok:disabled { opacity: .5; cursor: not-allowed; }

  /* ─── UI CONFIRM / PROMPT DIALOGS (Round 2 follow-on) ─────────────
     Custom replacements for window.confirm()/prompt() that match the
     app's modal vocabulary. Used via uiConfirm(opts) / uiPrompt(opts)
     in script_core.html. The .ui-dialog-modal stays narrow + auto-
     height; the body wraps long lines via <br> insertion by the
     helpers. */
  .ui-dialog .ui-dialog-modal { max-width: 440px; }
  .ui-dialog-body {
    font-family: var(--ui); font-size: 13px; color: var(--ink);
    line-height: 1.5;
    margin-top: 6px; margin-bottom: 4px;
    white-space: pre-wrap;
  }
  .ui-dialog-input {
    width: 100%;
    appearance: none;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper-card); color: var(--ink);
    font-family: var(--ui); font-size: 13px;
    padding: 8px 10px; outline: none;
    transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
  }
  .ui-dialog-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .ui-dialog-err {
    font-family: var(--ui); font-size: 12px;
    color: var(--danger-deep);
    background: var(--destructive-soft);
    border: 1px solid var(--destructive);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    margin-top: 8px;
  }
  /* Danger-tone OK button — for destructive confirms (Delete / Archive /
     Cancel-with-data-loss). */
  .ui-dialog-ok.is-danger {
    border-color: var(--destructive);
    background: var(--destructive);
  }
  .ui-dialog-ok.is-danger:hover:not(:disabled) {
    background: var(--danger-deep);
    border-color: var(--danger-deep);
  }

  /* Day modal */
  .day-section { margin-bottom: 18px; }
  .day-section:last-child { margin-bottom: 0; }
  .day-section-label {
    font-family: var(--mono);
    font-size: 10px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .day-info-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--paper-2);
    border-radius: var(--radius);
    font-family: var(--ui); font-size: 13px; color: var(--ink);
    margin-bottom: 6px;
  }
  .day-info-row:last-child { margin-bottom: 0; }
  /* Token-family consistency (2nd-pass popups addendum #3): holiday is an
     info row (blue bg + blue text); own-approved is a positive/leave row
     (green bg + green text). Previously both paired green bg with blue text. */
  .day-info-row.holiday      { background: var(--info-soft);        color: var(--info-deep);    font-weight: 500; }
  .day-info-row.worked       { background: var(--good-soft);        color: var(--success-deep); }
  .day-info-row.own-pending  { background: var(--warn-soft);        color: var(--warning-deep); font-weight: 500; }
  .day-info-row.own-approved { background: var(--accent-soft);      color: var(--success-deep); font-weight: 500; }
  .day-info-row.own-denied   { background: var(--destructive-soft); color: var(--danger-deep);  font-weight: 500; }

  /* ─── PTO DAY MODAL — HEADS-UP CONFLICT BANNERS (V1·E2) ──────────
     Stacked banners above the request form: holiday (info), teammates
     already off (warn), all-clear (ok). Tonal soft-bg matches the
     pattern in .day-info-row but with slightly tighter padding and an
     emphasized leading glyph so the banners scan as a unit. */
  .conflict {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; border-radius: var(--radius);
    font-family: var(--ui); font-size: 13px; font-weight: 500;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .conflict:last-child { margin-bottom: 0; }
  .conflict svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
  .conflict.info { background: var(--info-soft); color: var(--info-deep); }
  .conflict.warn { background: var(--warn-soft); color: var(--warning-deep); }
  .conflict.ok   { background: var(--good-soft); color: var(--success-deep); }
  .conflict.crit { background: var(--destructive-soft); color: var(--danger-deep); }
  .conflict .conflict-sub {
    display: block; font-weight: 400; font-size: 12px;
    opacity: 0.85; margin-top: 2px;
  }

  /* Balance-after preview row inside the request form. Updates live
     when the rep changes Type — leave-deduction map mirrors the
     server's getLeaveDeduction_ (sick vs annual, 1.0 vs 0.5 days). */
  .balance-after {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: var(--radius);
    background: var(--paper-2);
    border: 1px solid var(--line);
    margin: 12px 0 6px;
    font-family: var(--ui); font-size: 13px;
    gap: 10px; flex-wrap: wrap;
  }
  .balance-after .ba-label {
    color: var(--muted); font-family: var(--mono);
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  }
  .balance-after .ba-val {
    color: var(--ink);
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum', 'ss01';
  }
  .balance-after .ba-val strong { font-weight: 600; }
  .balance-after .ba-val strong.neg { color: var(--destructive); }

  .day-info-row .di-icon {
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: inherit;
  }
  .day-info-row .di-icon svg { width: 16px; height: 16px; }
  .day-info-row .di-text { flex: 1; }
  .day-info-row .di-tag {
    font-family: var(--mono);
    font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .12em;
    padding: 2px 7px; border-radius: 4px;
    background: rgba(0,0,0,.06);
  }
  .tm-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--line);
    font-family: var(--ui); font-size: 13px;
  }
  .tm-row:last-child { border-bottom: none; }

  /* ─── TOAST STACK ────────────────────────────────────────────── */
  .toast-stack {
    position: fixed; top: 20px; right: 20px;
    z-index: 999;
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none; max-width: 360px;
  }
  .toast {
    display: flex; align-items: center; gap: 10px;

    border: 1px solid var(--line);
    box-shadow: inset 3px 0 0 var(--accent), var(--shadow-sm);
    border-radius: var(--radius);
    padding: 11px 14px 11px 16px;
    font-family: var(--ui);
    font-size: 13px; font-weight: 500;
    color: var(--ink);
    pointer-events: auto;
    min-width: 240px; max-width: 360px;
    transform: translateX(20px); opacity: 0;
    animation: toast-in .25s var(--ease) forwards;
  }
  .toast.toast-leave { animation: toast-out .2s var(--ease) forwards; }
  @keyframes toast-in  { to { transform: translateX(0); opacity: 1; } }
  @keyframes toast-out { to { transform: translateX(20px); opacity: 0; } }
  .toast-success { box-shadow: inset 3px 0 0 var(--good),        var(--shadow-sm); }
  .toast-error   { box-shadow: inset 3px 0 0 var(--destructive), var(--shadow-sm); }
  .toast-warn    { box-shadow: inset 3px 0 0 var(--warn),        var(--shadow-sm); }
  .toast-info    { box-shadow: inset 3px 0 0 var(--info),        var(--shadow-sm); }
  .toast-icon {
    flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .toast-icon svg { width: 16px; height: 16px; }
  .toast-success .toast-icon { color: var(--good); }
  .toast-error   .toast-icon { color: var(--destructive); }
  .toast-warn    .toast-icon { color: var(--warn); }
  .toast-info    .toast-icon { color: var(--info); }
  .toast-msg { flex: 1; line-height: 1.4; }

  /* ─── LOADING / EMPTY STATES ─────────────────────────────────── */
  .state-center {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 50vh; gap: 14px; padding: 24px;
    text-align: center;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2.5px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Unified loader system (2nd-pass loaders_and_motion.md, Part 1) ──
     Four roles, one shared set. The --lo-* aliases map to app tokens so all
     loaders theme in dark mode automatically. GPU-cheap (transform/opacity/
     background-position only); the global prefers-reduced-motion block in
     styles_design_tokens.html neutralizes every animation below. */
  :root { --lo-accent: var(--accent); --lo-track: var(--line); }
  @keyframes lo-spin    { to { transform: rotate(360deg); } }
  @keyframes lo-dot     { 0%,80%,100% { transform: scale(.5); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
  @keyframes lo-bar     { 0% { left: -40%; } 100% { left: 100%; } }
  @keyframes lo-shimmer { 100% { background-position: 200% 0; } }
  @keyframes lo-pulse   { 0%,100% { transform: scale(.82); opacity: .45; } 50% { transform: scale(1); opacity: 1; } }
  /* Role A — full-view enter: the module glyph, pulsing (renderLoading). */
  .lo-glyph { color: var(--lo-accent); animation: lo-pulse 1.25s var(--ease) infinite; display: inline-flex; }
  /* Role B — lists / tables / cards: skeleton shimmer. */
  .skel {
    border-radius: 6px;
    background: linear-gradient(90deg, var(--paper-3) 25%, var(--paper-2) 37%, var(--paper-3) 63%);
    background-size: 200% 100%;
    animation: lo-shimmer 1.3s linear infinite;
  }
  .skel-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .skel-avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; }
  .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .skel-bar { height: 10px; }
  /* Role C — in-place refresh: a thin indeterminate sweep bar at panel top. */
  .lo-sweep { position: relative; height: 3px; border-radius: 999px; background: var(--lo-track); overflow: hidden; }
  .lo-sweep::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 40%;
    border-radius: 999px; background: var(--lo-accent);
    animation: lo-bar 1.15s var(--ease) infinite;
  }
  /* Role D — buttons / tiny slots: inline dot pulse (keep the word too). */
  .lo-dots { display: inline-flex; gap: 5px; vertical-align: middle; }
  .lo-dots span { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: lo-dot 1.4s var(--ease) infinite; }
  .lo-dots span:nth-child(2) { animation-delay: .18s; }
  .lo-dots span:nth-child(3) { animation-delay: .36s; }

  /* ─── Motion system (2nd-pass loaders_and_motion.md, Part 2) ──────────
     All reveals are one-shot (animation-fill-mode: both bakes the end state);
     the global prefers-reduced-motion block neutralizes every rule below.
     Overlay/modal entrance (§9) is ALREADY handled by .overlay.open (fadein)
     + .modal (modalin) + the #kb-drawer slide — not re-declared here. */
  /* §1 view transition — fade + rise on each view-area swap (router-hooked) */
  @keyframes revFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .view-enter { animation: revFade .18s var(--ease) both; }
  /* §6 mutation feedback — settle (dim + tint + draw check + strike) */
  .mc { transition: opacity .3s var(--ease), background .3s var(--ease); }
  .mc.done { opacity: .72; background: var(--paper-card); }
  .mc.done .mc-label { text-decoration: line-through; color: var(--muted-3); transition: color .3s var(--ease); }
  @keyframes drawCheck { to { stroke-dashoffset: 0; } }
  .ck { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .mc.done .ck, .mc.checked .ck { animation: drawCheck .35s var(--ease) forwards; }
  .ck-wrap { display: inline-flex; align-items: center; }
  /* §7 selection & copy. .popping / .copied are general one-shot helpers
     (toggle on, the keyframe runs once); .star.on pops when preferred. */
  @keyframes pop { 0% { transform: scale(1); } 42% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .popping, .chip.popping { animation: pop .28s var(--ease); }
  .star.on { animation: pop .28s var(--ease); }
  @keyframes flashBg { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
  .copied, .copybtn.copied { animation: flashBg .7s var(--ease); }
  /* §3 ring fill — training completion + clock PTO. --circ (=2πr) and --target
     (=circ·(1−pct)) are set inline per ring; defaults here keep them defined
     (token-hygiene) + render sanely before the inline override lands. */
  @keyframes ringFill { from { stroke-dashoffset: var(--circ); } to { stroke-dashoffset: var(--target); } }
  .ring-arc { --circ: 0; --target: 0; stroke-dashoffset: var(--target); animation: ringFill .9s var(--ease) both; }
  /* §4 sparkline draw — --len (≥ polyline length) set inline per spark. */
  @keyframes sparkDraw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  .spark { --len: 0; stroke-dasharray: var(--len); stroke-dashoffset: 0; animation: sparkDraw 1s var(--ease) both; }
  /* §5 grid stagger-in — coverage heatmap + training matrix. --d set inline. */
  @keyframes hmIn { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
  .hm { --d: 0ms; animation: hmIn .25s var(--ease) both; animation-delay: var(--d, 0ms); }
  /* §8 collapse — KB department / CN trays */
  .acc-body { max-height: 0; opacity: 0; overflow: hidden; transition: max-height .26s var(--ease), opacity .26s var(--ease); }
  .acc.open .acc-body { max-height: 240px; opacity: 1; }
  .acc-chev { transition: transform .2s var(--ease); }
  .acc.open .acc-chev { transform: rotate(90deg); }
  /* §10 timezone sky cross-fade — clock big-clock card */
  .sky-layer { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; }
  .sky-layer.on { opacity: 1; }
