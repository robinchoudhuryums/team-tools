<style>
  /* ═══════════════════════════════════════════════════════════════════════
     UMS TIME CLOCK — view-scoped styles
     ─────────────────────────────────────────────────────────────────────────
     Design tokens (palette, typography, radii, shadows, motion, layout vars,
     and shared utility classes like .app-bar / .panel / .doc-row) are
     defined in styles_design_tokens.html. This file holds only tool-specific
     view styles that consume those tokens.
     ═══════════════════════════════════════════════════════════════════════ */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* BASE */
  html, body {
    height: 100%; background: var(--paper); color: var(--ink);
    font-family: var(--ui);
    font-feature-settings: 'ss01', 'cv11', 'cv05';
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  /* Selection must be clearly visible — --selection-bg is a mid-strength
     accent tint (the old --accent-soft was invisible against field
     backgrounds). No color override: the translucent tint keeps each
     surface's own text color readable in both modes. */
  ::selection { background: var(--selection-bg); }

  /* ─── FOCUS VISIBILITY (a11y batch G) ────────────────────────────
     One global keyboard-focus ring. :focus-visible only — mouse clicks
     don't paint it. Inputs keep their own border+ring treatment. */
  :focus-visible {
    outline: none;
    box-shadow: var(--ring-focus);
    border-radius: 4px;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible, .ce:focus-visible {
    border-radius: inherit;
  }
  /* The skip-link's target is the whole content region — no ring there. */
  #view-area:focus-visible { box-shadow: none; }

  /* Skip-link: visually hidden until keyboard-focused. */
  .skip-link {
    position: absolute; left: 8px; top: -48px; z-index: 200;
    background: var(--paper-card); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: var(--radius-sm);
    padding: 8px 14px; font-size: .82rem; text-decoration: none;
    box-shadow: var(--shadow-sm); transition: top .15s var(--ease);
  }
  .skip-link:focus { top: 8px; }

  /* ─── APP SHELL ──────────────────────────────────────────────── */
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .app-shell { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
  /* V-1 (cycle-11 visual audit) — LOAD-BEARING, the shell-level twin of the
     Dashboard's minmax(0,1fr) decision: grid/flex items default to
     min-width:auto, so the main column's MIN-CONTENT (e.g. a note card's
     nowrap issue line) propagated up and forced the compact 480px pop-out /
     mobile to ~822px of horizontal scroll — the card ellipsis rules
     (.cn-card-main etc. already carry min-width:0) could never engage
     because this top-level item refused to shrink. min-width:0 here lets
     every view shrink to the viewport; wide mode is unaffected (space
     suffices) and wide tables keep their own overflow-x wrappers. */
  .app-shell > * { min-width: 0; }

  /* Blue-green DEV banner — rendered only when INSTANCE_LABEL is set on the
     project's Script Properties (prod leaves it unset → no banner). A strong,
     unmistakable top strip so an isolated dev instance is never confused with
     the team's live one. */
  .instance-banner {
    position: sticky; top: 0; z-index: 70;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 5px 14px;
    /* C17 batch-4: was `var(--warning-deep); color:#fff` — the deep token
       flips LIGHT in dark mode (~1.5–2.6:1 under white text) on the one
       banner whose whole job is being unmistakable. A fixed-palette surface
       takes fixed colors (INV-166): amber that reads in BOTH themes. */
    background: #8a4500; color: #fff;
    border-bottom: 1px solid rgba(0,0,0,.28);
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; line-height: 1.3;
  }
  .instance-banner svg { flex: 0 0 auto; }

  /* SIDEBAR — light, warm-paper. Hairline right border separates it from
     the canvas; active items use accent-soft bg + inset accent left-rail
     instead of a solid fill, matching the CA installment-16 convention. */
  .sidebar {
    background: var(--paper-card); color: var(--ink);
    padding: 22px 14px 18px;
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    border-right: 1px solid var(--line);
  }
  /* Round 2 · 8a — drag handle anchored to the sidebar's right edge.
     6px wide; becomes accent-toned on hover/drag. Stays inside the
     sidebar bounds so the existing overflow-y: auto doesn't clip it.
     The accent stripe inside is 2px wide and inset for a refined feel. */
  .sidebar-grip {
    position: absolute; top: 0; right: 0;
    width: 6px; height: 100%; cursor: col-resize;
    z-index: 10;
  }
  .sidebar-grip::after {
    content: ''; position: absolute; top: 0; bottom: 0; right: 1px; width: 2px;
    background: transparent;
    transition: background var(--t) var(--ease);
  }
  .sidebar-grip:hover::after,
  .sidebar-grip:active::after { background: var(--accent); }
  /* Round 2 · 8a — collapsed (icon-only) state. Hides labels, brand sub-name,
     user info text, theme label, and the section "Navigate" label so the
     56px-ish rail shows only icons. Brand mark dot + sb-icons + user avatar
     stay visible. */
  .sidebar.collapsed { padding: 22px 6px 18px; }
  .sidebar.collapsed .sb-lbl,
  .sidebar.collapsed .sb-brand-title > span:not(.sb-brand-mark),
  .sidebar.collapsed .sb-brand-sub,
  .sidebar.collapsed .sb-section-label,
  .sidebar.collapsed .sb-user-info,
  .sidebar.collapsed .sb-user-tz { display: none; }
  .sidebar.collapsed .sb-link {
    justify-content: center; padding: 9px 4px; gap: 0;
  }
  .sidebar.collapsed .sb-brand { padding: 4px 4px 14px; }
  .sidebar.collapsed .sb-brand-title { justify-content: center; }
  .sidebar.collapsed .sb-theme { padding: 14px 4px 0; }
  .sidebar.collapsed .sb-theme-controls { justify-content: center; flex-wrap: wrap; gap: 4px; }
  .sidebar.collapsed .sb-user { justify-content: center; padding: 14px 4px; }
  /* Make sure the sb-link label transition is smooth — labels do an instant
     show/hide but the link layout itself shouldn't jerk. */
  .sb-lbl {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .sb-brand {
    padding: 4px 10px 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .sb-brand-title {
    font-family: var(--display); font-weight: 600; font-size: 16px;
    letter-spacing: -.01em; color: var(--ink);
    display: flex; align-items: center; gap: 10px;
  }
  /* Slate-blue dot in place of the old gradient square — calmer mark
     that lets the title carry the brand weight. */
  .sb-brand-mark {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .sb-brand-sub {
    font-family: var(--mono); font-size: 10px;
    color: var(--muted);
    margin-top: 6px; padding-left: 20px;
    letter-spacing: .12em; text-transform: uppercase;
  }
  .sb-section-label {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase;
    padding: 14px 12px 6px;
  }
  .sb-link {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: var(--radius);
    background: none; border: none; color: var(--muted);
    font-family: var(--ui); font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background var(--t) var(--ease), color var(--t) var(--ease);
    text-align: left; width: 100%;
  }
  .sb-link:hover { background: var(--paper-2); color: var(--ink); }
  .sb-link.active {
    background: var(--accent-soft); color: var(--ink); font-weight: 500;
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .sb-link .sb-icon {
    width: 18px; height: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: currentColor;
  }
  .sb-link .sb-icon svg { width: 100%; height: 100%; }

  /* Settings row — ONE row since the gear consolidation (operator 2026-08-13):
     the gear button + the pop-out button. The Theme/Palette/Alerts controls
     moved into the .settings-panel flyout below, which is why the old
     multi-row adjacency rules (.sb-theme + .sb-theme etc.) are gone — with a
     single row, `margin-top: auto` is exactly what pins it to the bottom. */
  .sb-theme {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 14px 6px 12px;
    margin-top: auto;
    border-top: 1px solid var(--line);
  }
  .sb-theme-label {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    padding-left: 6px;
  }
  .sb-theme-toggle {
    display: inline-flex; gap: 0;
    background: var(--paper-2);
    border: 1px solid var(--line); border-radius: var(--radius-pill);
    padding: 2px;
  }
  .sb-theme-btn {
    appearance: none; border: none; background: transparent;
    width: 26px; height: 24px; border-radius: var(--radius-pill); cursor: pointer;
    color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background var(--t) var(--ease), color var(--t) var(--ease);
    padding: 0;
  }
  .sb-theme-btn:hover { color: var(--ink); }
  .sb-theme-btn[aria-pressed="true"] {
    background: var(--paper-card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  :root[data-mode="dark"] .sb-theme-btn[aria-pressed="true"],
  body[data-mode="dark"] .sb-theme-btn[aria-pressed="true"] {
    box-shadow: 0 1px 2px rgba(0,0,0,.4);
  }

  /* Palette picker (operator 2026-08-12) — each swatch previews the palette's
     PAPER (the disc) and its ACCENT (the inset ring), because two of the four
     differ from each other only in the paper. Colours come from the
     --pal-*-paper/--pal-*-accent tokens, which the token partial declares
     beside the palette blocks and a tripwire pins equal to them. */
  .sb-pal-toggle { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .sb-pal-btn {
    appearance: none; border: none; background: transparent; padding: 3px;
    border-radius: var(--radius-pill); cursor: pointer; line-height: 0;
    transition: background var(--t) var(--ease), box-shadow var(--t) var(--ease);
  }
  .sb-pal-btn:hover { background: var(--paper-card); }
  .sb-pal-btn[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); background: var(--paper-card); }
  /* Split disc — paper on one half, accent on the other. MEASURED: an accent
     RING over a paper disc made Console and Sand (which share the green
     accent and differ only in the paper) indistinguishable at 14px. */
  .sb-pal-dot {
    display: block; width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid var(--line-2);
  }
  /* Settings flyout (operator 2026-08-13) — one gear (sidebar + mobile
     header), one fixed-position panel holding the Theme/Palette/Alerts
     controls + the admin View-as row. z-45: above content, under the
     .overlay layer (50) and the KB drawer (55). */
  .sb-settings-btn {
    appearance: none; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--paper-2); color: var(--muted);
    /* MEASURED: at the 168px default sidebar the row nets 127px (gear + pop-out
       + gap); 10px side padding left the label 3px short and it ellipsised to
       "Setti…" — the exact INV-170 class. 8px fits it with room. */
    border-radius: var(--radius-pill); padding: 4px 8px; cursor: pointer;
    font: inherit; font-size: 12px; min-width: 0;
    transition: color var(--t) var(--ease), border-color var(--t) var(--ease);
  }
  .sb-settings-btn:hover { color: var(--ink); border-color: var(--border-strong); }
  .sb-settings-btn[aria-expanded="true"] { background: var(--paper-card); color: var(--ink); box-shadow: var(--shadow-sm); }
  .settings-panel {
    position: fixed; z-index: 45; width: 236px;
    display: flex; flex-direction: column; gap: 14px;
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow-lg); padding: 14px;
  }
  /* The [hidden] gotcha: the class above sets display, so the attribute needs
     its own companion rule or the panel ships permanently visible. */
  .settings-panel[hidden] { display: none; }
  .stg-row { display: flex; flex-direction: column; gap: 7px; }
  .stg-note { font-size: 11px; color: var(--muted-3); line-height: 1.4; }
  .stg-viewas-btns { display: flex; flex-wrap: wrap; gap: 4px; }
  .stg-va-btn {
    appearance: none; font: inherit; font-size: 11px; padding: 3px 10px;
    border: 1px solid var(--line); border-radius: var(--radius-pill);
    background: var(--paper-2); color: var(--muted); cursor: pointer;
  }
  .stg-va-btn:hover { color: var(--ink); border-color: var(--border-strong); }
  .stg-va-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--border-strong); font-weight: 600; }
  /* View-as banner — the instance-banner shape in a distinct fixed blue
     (INV-166: a banner that must be unmistakable takes fixed colors), so an
     admin can never forget they are looking at a preview. */
  .viewas-banner {
    position: sticky; top: 0; z-index: 69;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 5px 14px;
    background: #1c4d8f; color: #fff;
    border-bottom: 1px solid rgba(0,0,0,.28);
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; line-height: 1.3;
  }
  .viewas-banner svg { flex: 0 0 auto; }
  .viewas-exit {
    appearance: none; font: inherit; font-size: 10px; padding: 2px 10px; margin-left: 6px;
    border: 1px solid rgba(255,255,255,.55); border-radius: var(--radius-pill);
    background: transparent; color: #fff; cursor: pointer;
  }
  .viewas-exit:hover { background: rgba(255,255,255,.16); }

  .sb-pal-btn[data-palette-target="console"] .sb-pal-dot { background: linear-gradient(135deg, var(--pal-console-paper) 0 50%, var(--pal-console-accent) 50% 100%); }
  .sb-pal-btn[data-palette-target="sand"]    .sb-pal-dot { background: linear-gradient(135deg, var(--pal-sand-paper)    0 50%, var(--pal-sand-accent)    50% 100%); }
  .sb-pal-btn[data-palette-target="sage"]    .sb-pal-dot { background: linear-gradient(135deg, var(--pal-sage-paper)    0 50%, var(--pal-sage-accent)    50% 100%); }
  .sb-pal-btn[data-palette-target="plum"]    .sb-pal-dot { background: linear-gradient(135deg, var(--pal-plum-paper)    0 50%, var(--pal-plum-accent)    50% 100%); }
  .sb-pal-btn[data-palette-target="teal"]    .sb-pal-dot { background: linear-gradient(135deg, var(--pal-teal-paper)    0 50%, var(--pal-teal-accent)    50% 100%); }

  /* User card — paper-2 panel with accent-soft initials disc */
  .sb-user {
    padding: 12px;
    border: 1px solid var(--line); border-radius: var(--radius-md);
    background: var(--paper-2);
    display: flex; align-items: center; gap: 10px;
  }
  .sb-user-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent-soft);
    color: var(--info-deep);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 600; font-size: 12px;
    flex-shrink: 0;
  }
  .sb-user-info { flex: 1; min-width: 0; }
  .sb-user-name {
    font-family: var(--ui); font-size: 12px; font-weight: 600; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sb-user-meta {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    margin-top: 3px;
    display: flex; align-items: center; gap: 6px;
    letter-spacing: .04em;
  }
  /* V-7 (cycle-11 visual audit) — the employee id wrapped mid-token at its
     hyphen ("E-" / "1042") at the default 168px sidebar; ellipsize instead. */
  .sb-user-id {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .sb-user-tz {
    font-family: var(--mono);
    background: var(--paper-card); padding: 1px 5px;
    border: 1px solid var(--line);
    border-radius: 3px; font-size: 9px; font-weight: 600; letter-spacing: .08em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* MOBILE HEADER & NAV — both warm-paper, hairline edges */
  .mobile-header {
    display: none; background: var(--paper-card); color: var(--ink);
    padding: 12px 16px; align-items: center; justify-content: space-between; gap: 12px;
    border-bottom: 1px solid var(--line);
  }
  .mobile-header .hdr-brand {
    display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .mobile-header .hdr-mark {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }
  .mobile-header .hdr-text { min-width: 0; }
  .mobile-header .hdr-title {
    font-family: var(--display); font-weight: 600; font-size: 15px;
    color: var(--ink); letter-spacing: -.01em; line-height: 1.15;
  }
  .mobile-header .hdr-sub {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    margin-top: 3px;
    display: flex; align-items: center; gap: 6px;
    letter-spacing: .04em;
  }
  .mobile-header .hdr-tz {
    font-family: var(--mono);
    font-size: 9px; font-weight: 600; letter-spacing: .08em;
    background: var(--paper-2); padding: 1px 5px; border-radius: 3px;
    border: 1px solid var(--line);
    color: var(--muted); text-transform: uppercase;
  }
  .mobile-header .hdr-right {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .mobile-header .hdr-id {
    font-family: var(--mono); font-size: 10px;
    background: var(--paper-2); padding: 4px 8px; border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    color: var(--muted); letter-spacing: .04em;
  }
  /* Mobile sun/moon control — same pill as the sidebar's */
  .mobile-header .sb-theme-toggle { padding: 2px; }
  .mobile-header .sb-theme-btn { width: 24px; height: 22px; }

  /* Tool tab bar — sub-navigation within a tool, rendered above the view area.
     Replaces the per-view sidebar entries from the prior shell layout.
     On mobile the tabs scroll horizontally if they overflow. */
  .tool-tab-bar {
    display: flex; flex-wrap: nowrap;
    overflow-x: auto; overflow-y: hidden;  /* horizontal scroll on overflow only; never a vertical bar */
    gap: 4px;
    padding: 12px 40px 0;  /* aligns with .view-area's 40px horizontal padding */
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 30;  /* stays pinned while the view scrolls */
  }
  .tool-tab-bar:empty { display: none; }
  .tt-btn {
    appearance: none; border: none; background: transparent;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 14px;
    margin-bottom: -1px;  /* overlap the bar's bottom border */
    border-bottom: 2px solid transparent;
    font-family: var(--ui); font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer; white-space: nowrap;
    transition: color var(--t) var(--ease), border-color var(--t) var(--ease);
  }
  .tt-btn:hover { color: var(--ink); }
  .tt-btn.active {
    color: var(--ink); border-bottom-color: var(--accent);
  }
  .tt-btn .tt-icon { display: inline-flex; align-items: center; color: inherit; }
  /* Manager-only tabs: an upward accent-soft wash + a small marker glyph so the
     privileged team-facing tabs read distinctly from the rep tabs. */
  .tt-btn.tt-mgr { background: linear-gradient(to top, var(--accent-soft), transparent 68%); border-top-left-radius: 7px; border-top-right-radius: 7px; }
  .tt-btn.tt-mgr.active { background: linear-gradient(to top, var(--accent-soft), transparent 52%); }
  .tt-mgr-mark { display: inline-flex; align-items: center; color: var(--accent); opacity: .6; margin-left: -1px; }
  /* Dark mode: native date/time pickers (incl. the calendar-picker indicator)
     render black-on-dark and become invisible. color-scheme:dark tells the
     browser to draw the control + its icon for a dark surface. App-wide. */
  :root[data-mode="dark"] input[type="date"],
  :root[data-mode="dark"] input[type="time"],
  :root[data-mode="dark"] input[type="datetime-local"],
  :root[data-mode="dark"] input[type="month"] { color-scheme: dark; }
  /* Native checkboxes/radios rendered system-blue, clashing with the green
     theme — tint them with the app accent everywhere for consistency. */
  input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }

  /* .clk-ts-divider rules removed in Round 2 · 8b — the Clock view's
     timesheet section was moved to the Time / PTO tab, so the divider
     between punches and timesheet is no longer rendered. */

  .mobile-nav {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--mobile-nav-h); background: var(--paper-card);
    border-top: 1px solid var(--line);
    box-shadow: 0 -2px 6px rgba(15,23,42,.04); z-index: 40;
  }
  .mobile-nav-inner { display: flex; align-items: stretch; height: 100%; }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-family: var(--ui);
    font-size: 11px; font-weight: 500;
    transition: color var(--t) var(--ease);
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .nav-btn .nav-icon {
    width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    color: currentColor;
  }
  .nav-btn .nav-icon svg { width: 100%; height: 100%; }
  .nav-btn.active { color: var(--accent); font-weight: 600; }
  .nav-btn.active::before {
    content: ''; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 32px; height: 2px;
    background: var(--accent); border-radius: 0 0 2px 2px;
  }

  /* CONTENT */
  .view-area {
    flex: 1; padding: 32px 40px;
    max-width: var(--content-max); width: 100%; margin: 0 auto;
  }

  /* ─── CARDS ──────────────────────────────────────────────────── */
  .card {
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: 20px 22px;
    margin-bottom: 16px; box-shadow: var(--shadow-sm);
    transition: box-shadow var(--t) var(--ease);
  }
  /* Batch J — secondary labels are sentence-case Inter Tight; the
     mono-uppercase micro-label register is reserved for kickers, chips,
     and table headers. */
  /* A13 (cycle 13): rendered as <h2> so each card contributes a heading to the
     document outline. margin-top zeroes the UA h2 default; every other h2 UA
     style (font-size/weight) is already overridden by this rule. */
  .card-label {
    font-family: var(--ui);
    font-size: var(--text-sm); font-weight: 600;
    color: var(--muted);
    letter-spacing: -.01em;
    margin-top: 0; margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .card-label.with-count { justify-content: space-between; }
  .card-label > span:first-child { flex: 1; min-width: 0; }
  .count-pill {
    font-family: var(--mono);
    background: var(--accent-soft); color: var(--info-deep);
    font-size: 10px; font-weight: 600; padding: 2px 8px;
    border-radius: var(--radius-pill); letter-spacing: .08em;
    font-variant-numeric: tabular-nums;
  }
  .count-pill.warn   { background: var(--warn-soft);        color: var(--warning-deep); }
  .count-pill.danger { background: var(--destructive-soft); color: var(--danger-deep);  }

  /* HEADINGS */
  .view-title {
    font-family: var(--display);
    font-size: 26px; font-weight: 700;
    letter-spacing: -.02em; line-height: 1.15; margin: 0 0 4px;
  }
  .view-subtitle { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
  .view-title-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 24px;
  }
  .view-title-row .view-title { margin: 0; }
  .refresh-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 7px 12px;
    font-family: var(--ui);
    font-size: 12px; font-weight: 500; color: var(--muted);
    cursor: pointer;
    transition: border-color var(--t) var(--ease), color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .refresh-btn:hover { border-color: var(--border-strong); color: var(--ink); background: var(--paper-2); }
  .refresh-btn svg { width: 14px; height: 14px; }

  /* Batch-6 (cycle 17): the .hero-clock* cluster (the pre-Dashboard hero),
     .actions-grid/.action-btn (+ .btn-* tones), the .ledger strip, the
     .leave-balance-row/.lb-* cards, and the .ts-summary/.ts-stat/.day-card
     timesheet-render cluster were REMOVED — no markup has emitted any of
     them since the Round 2 · 8b Time/PTO merge + the Dashboard redesign
     (INV-184: their compact halves went in C17-1; these were the bases).
     @keyframes pulse stays — four live rules animate with it. */
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.85); } }

  /* ─── TZ TAGS / STATUS PILLS ─────────────────────────────────── */
  .tz-tag {
    display: inline-block; font-family: var(--mono);
    font-size: 9px; font-weight: 600; letter-spacing: .08em;
    color: var(--muted); background: var(--paper-2);
    padding: 2px 6px; border-radius: 3px;
    border: 1px solid var(--line);
    text-transform: uppercase; vertical-align: 1px;
  }
  .tz-tag.mgr-tz { color: var(--info-deep); background: var(--accent-soft); border-color: transparent; }

  /* ─── PAIRED-TIMEZONE CHIP (V4·E5) ───────────────────────────────
     Two-segment chip pairing the rep's local time + manager-tz time.
     First .seg.local is the emphasized segment (paper-2 fill); the
     second .seg is secondary text-only. Callers render the second
     segment only when local tz != manager tz, so same-tz reps see a
     single-segment chip and no redundant tz comparison.
     Structure:
       <span class="tz-chip">
         <span class="seg local"><span class="t">5:30 PM</span><span class="z">IST</span></span>
         <span class="seg"><span class="t">7:00 AM</span><span class="z">CST</span></span>
       </span>                                                                    */
  .tz-chip {
    display: inline-flex; align-items: stretch;
    flex-wrap: wrap;   /* V-10: on a narrow card the segments stack (local over manager) instead of clipping */
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    overflow: hidden; vertical-align: -1px;
    background: var(--paper-card);
  }
  .tz-chip .seg {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 2px 7px;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    white-space: nowrap;   /* V-10: "8:05 AM" must never break internally — wrap happens between segments only */
  }
  .tz-chip .seg + .seg { border-left: 1px solid var(--line); }
  .tz-chip .seg.local { background: var(--paper-2); }
  .tz-chip .seg .t {
    font-size: 11px; font-weight: 600; color: var(--ink);
    letter-spacing: 0;
  }
  .tz-chip .seg:not(.local) .t { color: var(--muted); font-weight: 500; }
  .tz-chip .seg .z {
    font-size: 9px; font-weight: 600;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 600;
    transition: background var(--t) var(--ease), color var(--t) var(--ease);
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .s-idle   { background: var(--paper-2);        color: var(--muted); }
  .s-active { background: var(--good-soft);      color: var(--success-deep); }
  .s-lunch  { background: var(--warn-soft);      color: var(--warning-deep); }
  .s-done   { background: var(--accent-soft);    color: var(--info-deep); }
  .s-idle   .dot { background: var(--muted); }
  .s-active .dot { background: var(--good); animation: pulse 2s infinite; }
  .s-lunch  .dot { background: var(--warn); }
  .s-done   .dot { background: var(--accent); }

  /* ─── PUNCH LIST + ACTIONS ────────────────────────────────── */
  .punch-list { display: flex; flex-direction: column; }
  .punch-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .punch-row:last-child { border-bottom: none; }
  .punch-row:first-child { padding-top: 4px; }
  .punch-icon {
    width: 34px; height: 34px; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .punch-icon svg { width: 18px; height: 18px; }
  .punch-icon.in  { background: var(--good-soft); color: var(--success-deep); }
  .punch-icon.out { background: var(--warn-soft); color: var(--warning-deep); }
  .punch-name {
    flex: 1; font-family: var(--ui); font-size: 14px; font-weight: 500;
    color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .adj-pill {
    font-family: var(--mono);
    font-size: 10px; font-weight: 600;
    color: var(--warning-deep); background: var(--warn-soft);
    padding: 2px 6px; border-radius: 4px;
    letter-spacing: .08em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .punch-tag {
    font-family: var(--mono);
    font-size: 10px; font-weight: 600; letter-spacing: .08em;
  }
  .punch-tag.in  { color: var(--good); }
  .punch-tag.out { color: var(--warn); }
  .punch-tv {
    font-family: var(--mono);
    font-size: 13px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .no-data {
    text-align: center; color: var(--muted);
    font-size: 13px; padding: 14px 0 4px;
  }

  .shift-done-msg {
    text-align: center; color: var(--info-deep);
    font-family: var(--ui); font-weight: 500; font-size: 13px;
    padding: 10px 12px; margin-bottom: 12px;
    background: var(--accent-soft); border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .shift-done-msg svg { width: 16px; height: 16px; }

  /* ─── CLOCK HERO (V1·E1) ─────────────────────────────────────────
     Above-the-fold masthead replacing the centered .hero-clock block.
     Two-column grid: greeting + status sentence on the left, the live
     clock on the right. Collapses to stacked in compact-mode (see the
     :root[data-compact] block far below). The status sentence is built
     client-side from empState.punches + empState.timezoneAbbr; <strong>
     wrappers tabularise the worked-hours / time-until-shift-end values
     against the surrounding prose. */
  .hero {
    display: grid; grid-template-columns: 1.5fr 1fr;
    gap: 28px; align-items: center;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 28px 32px; margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .hero .greet { min-width: 0; }
  .hero .greet-kicker {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--muted); letter-spacing: .16em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .hero .greet-name {
    font-family: var(--display); font-size: 24px; font-weight: 500;
    color: var(--ink); letter-spacing: -.01em; line-height: 1.2;
    margin-bottom: 10px;
  }
  .hero .status-sentence {
    font-family: var(--ui); font-size: 13px; line-height: 1.5;
    color: var(--muted);
  }
  .hero .status-sentence strong {
    font-family: var(--mono); color: var(--ink); font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum', 'ss01';
    letter-spacing: 0;
  }
  .hero .clk { text-align: right; min-width: 0; }
  .hero .clk-time {
    font-family: var(--mono); font-size: 56px; font-weight: 500;
    line-height: 1; letter-spacing: -.02em; color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum', 'ss01';
  }
  .hero .clk-time .ampm {
    font-size: 20px; font-weight: 400; color: var(--muted);
    margin-left: 6px; letter-spacing: 0;
  }
  .hero .clk-meta {
    display: flex; justify-content: flex-end; align-items: center; gap: 8px;
    margin-top: 8px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    letter-spacing: .08em; text-transform: uppercase;
  }
  .hero .clk-meta .sep { opacity: .5; }

  /* ─── PRIMARY/SECONDARY ACTION ROW (V1·E1) ────────────────────────
     Replaces the prior .actions-grid + .action-btn 2x2 tile grid. One
     primary button (Clock In if not in / Clock Out if in / Lunch Return
     if on lunch) takes the wide slot; remaining valid actions fill
     secondary slots; Adjust always appears at the end as a secondary. */
  .actions {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr;
    gap: 10px; margin-bottom: 14px;
  }
  .actions .prime,
  .actions .sec {
    appearance: none; border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer;
    font-family: var(--ui); font-size: 13px; font-weight: 500;
    color: var(--ink); background: var(--paper-card);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background var(--t) var(--ease), border-color var(--t) var(--ease),
      color var(--t) var(--ease), transform .12s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  /* Tactile press/hover on the punch + adjust buttons. Transform-only (composited,
     no layout/paint) so it's free; the global reduced-motion block snaps it. */
  .actions .prime:hover:not(:disabled),
  .actions .sec:hover:not(:disabled) { transform: translateY(-1px); }
  .actions .prime:active:not(:disabled),
  .actions .sec:active:not(:disabled) { transform: translateY(0) scale(.96); }
  .actions .prime svg, .actions .sec svg { width: 18px; height: 18px; }
  .actions .prime {
    background: var(--accent); color: var(--paper-card);
    border-color: var(--accent); font-weight: 600;
  }
  .actions .prime:hover:not(:disabled) {
    background: var(--accent-2); border-color: var(--accent-2);
  }
  .actions .prime.clockout {
    background: var(--destructive); border-color: var(--destructive);
  }
  .actions .prime.clockout:hover:not(:disabled) {
    background: var(--danger-deep); border-color: var(--danger-deep);
  }
  .actions .sec:hover:not(:disabled) {
    background: var(--paper-2); border-color: var(--border-strong);
  }
  .actions .prime:disabled,
  .actions .sec:disabled { opacity: .4; cursor: not-allowed; }


  /* ─── DAY RIBBON (V4·E1) ──────────────────────────────────────────
     Horizontal time ribbon spanning 06:00–22:00. Renders the rep's
     scheduled shift as a dashed band (default 8a–5p CST per C3, or
     anchored to first ClockIn + 9h when the rep has actually clocked
     in), and their actual work + lunch intervals as filled segments.
     Punch markers are vertical bars with a small mono-uppercase label
     above. A pulsing 2px now-cursor renders only while the rep is
     mid-shift; .r-now's left position is refreshed by a 60s interval
     in script_clock.html. Compact-mode reduces to a 24px-tall strip
     (segments + now-cursor only, no labels/axis/legend). */
  .ribbon-wrap {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 18px 12px; margin-bottom: 14px;
  }
  .ribbon-axis-row {
    position: relative; height: 14px;
    margin-bottom: 6px;
  }
  .ribbon-axis-row span {
    position: absolute; transform: translateX(-50%);
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    color: var(--muted-2); letter-spacing: .08em;
  }
  .ribbon {
    position: relative; height: 74px;   /* V-2: two label rows above the track (was 60px / one row) */
  }
  .ribbon-track {
    position: absolute; left: 0; right: 0; top: 32px;
    height: 28px; background: var(--paper-2);
    border-radius: var(--radius-sm);
  }
  .r-sched {
    position: absolute; top: -3px; bottom: -3px;
    background: transparent;
    border: 1.5px dashed var(--muted-3);
    border-radius: var(--radius-sm);
    pointer-events: none;
  }
  .r-seg {
    position: absolute; top: 0; bottom: 0;
    border-radius: var(--radius-sm);
    transition: width 200ms var(--ease);
  }
  .r-seg.work {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
  }
  .r-seg.lunch {
    background: var(--warn-soft);
    border: 1px dashed var(--warn);
  }
  .r-punch {
    position: absolute; top: -32px; height: 64px;
    pointer-events: none;
  }
  .r-punch .bar {
    position: absolute; top: 32px; bottom: 0; left: -1px;
    width: 2px; background: var(--ink); opacity: 0.45;
  }
  .r-punch .lbl {
    position: absolute; top: 16px; left: 0; transform: translateX(-50%);
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    color: var(--ink); letter-spacing: .04em;
    background: var(--paper-card); padding: 1px 4px;
    border: 1px solid var(--line); border-radius: 3px;
    white-space: nowrap;
  }
  /* V-2 stagger: .r2 is the upper label row; .collided renders bar-only
     (a 3+ cluster — the times live in Today's Punches). */
  .r-punch .lbl.r2 { top: 0; }
  .r-punch .lbl.collided { display: none; }
  .r-now {
    position: absolute; top: 12px; bottom: -6px;
    width: 2px; background: var(--accent);
    pointer-events: none; z-index: 2;
    transition: left 600ms var(--ease);
  }
  .r-now::before {
    content: ''; position: absolute; top: -5px; left: -3px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
    animation: pulse 2s infinite;
  }
  .ribbon-legend {
    display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
  }
  .r-leg-item { display: inline-flex; align-items: center; gap: 6px; }
  .r-leg-item .swatch {
    display: inline-block; width: 14px; height: 4px;
    border-radius: 1px; background: var(--accent);
  }
  .r-leg-item .swatch.lunch { background: var(--warn); }
  .r-leg-item .swatch.sched { background: transparent; border: 1px dashed var(--muted-3); height: 8px; }
  .r-leg-item .swatch.now {
    width: 2px; height: 10px; background: var(--accent);
  }

  /* ─── TIME / PTO CONSOLIDATION (operator 2026-08-18) ───────────
     The Round 2 · 8b Time Off ⇄ Timesheet mode toggle (.mp-modes /
     .mp-mode) is RETIRED — one page now (INV-184: dead selectors
     deleted with their markup). The rail gains a quick-actions card:
     request time off (date → the pinned day modal) and request a
     punch edit (the #4a adjust modal). Fits the 240px rail; the
     input+button row wraps rather than overflowing. */
  .to-actions { margin-bottom: 14px; }
  .to-act-lbl { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 4px; }
  .to-act-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .to-act-row input[type="date"] {
    flex: 1 1 110px; min-width: 0; font: inherit; font-size: 12px;
    padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper-card); color: var(--ink);
  }
  .to-act-go {
    flex: 0 0 auto; appearance: none; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 12px; border: 1px solid var(--accent); border-radius: var(--radius-sm);
    /* The canonical primary recipe (.actions .prime — V-8): ink comes from
       --paper-card so dark mode gets dark-on-light-green, never #fff on a
       light accent (measured illegible in the first dark shot). */
    background: var(--accent); color: var(--paper-card);
  }
  .to-act-go:hover { background: var(--accent-2); border-color: var(--accent-2); }
  .to-act-hint { font-size: 10px; color: var(--muted-2); margin-top: 4px; }
  .to-act-div { border-top: 1px dashed var(--line); margin: 12px 0 2px; }
  .to-act-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; appearance: none; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--paper-card); color: var(--ink);
  }
  .to-act-btn:hover { border-color: var(--border-strong); }

  /* Recent-activity list in the pay-period side-rail block. */
  .ts-recent-list {
    display: flex; flex-direction: column; gap: 6px;
    margin-top: 4px;
  }
  .ts-recent-row {
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px;
    align-items: center;
    padding: 8px 10px;
    background: var(--paper-2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .ts-recent-d {
    font-weight: 600; color: var(--ink);
    letter-spacing: .04em;
  }
  .ts-recent-mid {
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ts-recent-h {
    font-weight: 600; color: var(--ink);
  }
  .ts-recent-warn {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    color: var(--warning-deep); margin-left: 6px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  :root[data-compact="1"] .ts-recent-row { grid-template-columns: 1fr auto; }
  :root[data-compact="1"] .ts-recent-mid { grid-column: 1 / -1; }

  /* ─── PTO TILE (Round 2 · 8d) ───────────────────────────────────
     Rectangular leave-balance tile in the Time Off side rail. Replaces
     the prior PTO donut. Big tabular value with progress bar; footer
     shows planned upcoming PTO + projected balance after those plans. */
  .pto-tile {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
  }
  .pto-tile .head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin-bottom: 10px;
  }
  .pto-tile .head .lbl {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
  }
  .pto-tile .head .meta {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    color: var(--muted-2); letter-spacing: .08em;
  }
  .pto-tile .v-row {
    display: flex; align-items: baseline; gap: 6px;
    margin-bottom: 8px;
  }
  .pto-tile .v {
    font-family: var(--display); font-size: 34px; font-weight: 600;
    color: var(--ink); line-height: 1; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum', 'ss01';
  }
  .pto-tile .denom {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .pto-tile .bar {
    width: 100%; height: 6px; background: var(--paper-2);
    border-radius: 3px; overflow: hidden; margin-bottom: 10px;
  }
  .pto-tile .bar i {
    display: block; height: 100%; background: var(--accent);
    border-radius: 3px;
    transition: width 400ms var(--ease);
  }
  .pto-tile .ftr {
    display: flex; justify-content: space-between; gap: 8px;
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }

  /* ─── MANAGER HERO METRICS ───────────────────────────────────── */
  .metric-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; margin-bottom: 20px;
  }
  /* Hairline-bordered tile with a tone-coded 3px inset left rail. The
     legacy `::before` is preserved (calls render before its content
     anyway); we just retone it. */
  .metric-card {
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px 18px 14px;
    position: relative; overflow: hidden;
    transition: border-color var(--t) var(--ease);
  }
  .metric-card:hover { border-color: var(--border-strong); }
  .metric-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 3px; height: 100%; background: var(--muted);
  }
  .metric-card.success::before { background: var(--good); }
  .metric-card.warning::before { background: var(--warn); }
  .metric-card.danger::before  { background: var(--destructive); }
  .metric-card.info::before,
  .metric-card.accent::before  { background: var(--accent); }
  .metric-label {
    font-family: var(--mono);
    font-size: 10px; font-weight: 600; color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  /* .metric-icon left in the markup is harmless — no visual weight */
  .metric-icon { display: none; }
  .metric-value {
    font-family: var(--display);
    font-size: 32px; font-weight: 500; line-height: 1;
    letter-spacing: -.02em; color: var(--ink);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .metric-value.success { color: var(--good); }
  .metric-value.warning { color: var(--warn); }
  .metric-value.danger  { color: var(--destructive); }
  .metric-value.info    { color: var(--accent); }
  .metric-sub {
    font-family: var(--ui);
    font-size: 12px; color: var(--muted); font-weight: 500;
  }

  /* ─── MANAGER TELEMETRY STRIP (V4·E2) ─────────────────────────────
     4-cell horizontal strip replacing the prior .metric-grid hero.
     Single bordered container with cell separators rather than gutters,
     mono numerals. Two cells (Missed / Pending) carry a 14-day
     sparkline beneath the value; Active + On Lunch are static counts
     (per C6 — no trend data for those). The sub-line carries the most
     actionable specific (which rep, which day). */
  .telemetry {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .telemetry .tel-cell {
    padding: 14px 18px;
    border-right: 1px solid var(--line);
    min-width: 0;
  }
  .telemetry .tel-cell:last-child { border-right: none; }
  .tel-label {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .12em; text-transform: uppercase;
    margin-bottom: 6px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .tel-value {
    font-family: var(--mono); font-size: 28px; font-weight: 500;
    color: var(--ink); line-height: 1;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum', 'ss01';
    letter-spacing: -.01em;
  }
  .tel-value.success { color: var(--good); }
  .tel-value.warn    { color: var(--warning-deep); }
  .tel-value.crit    { color: var(--danger-deep); }
  .tel-spark {
    display: flex; align-items: flex-end; gap: 2px;
    height: 20px; margin-top: 8px;
  }
  .tel-spark .bar {
    flex: 1; background: var(--accent-soft); border-radius: 1px;
    min-height: 2px;
  }
  .tel-spark .bar.zero { background: var(--paper-2); min-height: 1px; }
  .tel-spark .bar.warn { background: var(--warn); }
  .tel-spark .bar.crit { background: var(--destructive); }
  .tel-sub {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    margin-top: 6px; letter-spacing: .04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ─── EMPLOYEE GRID ──────────────────────────────────────────── */
  .emp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .emp-card {
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px;
    transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
    position: relative;
  }
  .emp-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-sm);
  }
  .emp-card-top {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  /* Uniform accent-soft initials disc — status is communicated by the
     bottom-right dot only. Calmer than the prior rainbow of gradient
     fills and consistent across teammate + manager views. */
  .emp-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 600; font-size: 13px;
    color: var(--info-deep);
    background: var(--accent-soft);
    flex-shrink: 0; position: relative;
  }
  .emp-avatar::after {
    content: ''; position: absolute;
    bottom: -1px; right: -1px;
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--paper-card);
  }
  /* The .av-* classes now only color the status dot (the avatar disc
     itself stays uniform). Keep the class names so callsites don't
     have to change in this stage. */
  .av-active::after { background: var(--good); animation: pulse 2s infinite; }
  .av-lunch::after  { background: var(--warn); }
  .av-done::after   { background: var(--accent); }
  .av-idle::after   { background: var(--muted); }
  .emp-name {
    flex: 1; min-width: 0;
    font-family: var(--ui); font-size: 13px; font-weight: 500;
    color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.3;
  }
  .emp-status-line { font-size: 11px; color: var(--muted); font-weight: 500; }
  .emp-time {
    font-family: var(--mono);
    color: var(--muted); font-variant-numeric: tabular-nums;
  }

  /* ─── EMPLOYEE 7-DAY SPARKLINE (V4·E3) ────────────────────────────
     7-bar daily-hours sparkline inside each live-status card. Driven
     by getManagerDashboard's recentHours[] array (server-computed
     in-memory, no extra Sheet reads — INV-13 honored). Bars are
     color-coded by hours: short (<6h) warn-toned, normal (≥6h) accent,
     zero days dimmed. Total/days-worked label below. */
  .emp-spark-wrap {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px;
  }
  .emp-spark {
    flex: 1; display: flex; align-items: flex-end; gap: 2px;
    height: 18px;
  }
  .emp-spark .bar {
    flex: 1; background: var(--accent-soft); border-radius: 1px;
    min-height: 2px;
  }
  /* V-10 (cycle-12 visual audit): a zero-hour day was `--paper-2` at 1px —
     ≈ the card background in BOTH themes, so a rep with 3 days off rendered as
     a 4-bar sparkline instead of 7 bars with 3 empty, making "didn't work"
     indistinguishable from "no data for that day". `--muted-3` is the
     decoration-only tone (per the token contract — never body text), which is
     exactly what a visible-but-quiet baseline is. 3px so it reads as a
     deliberate floor rather than a rendering artifact. */
  .emp-spark .bar.zero  { background: var(--muted-3); min-height: 3px; }
  .emp-spark .bar.short { background: var(--warn-soft); }
  .emp-spark-total {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted); letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  /* Manager doc-row variant — same disc treatment as above */
  .mgr-emp-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .mgr-emp-row:last-child { border-bottom: none; }
  .mgr-emp-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 600; font-size: 12px;
    color: var(--info-deep);
    background: var(--accent-soft);
    flex-shrink: 0; position: relative;
  }
  .av-active.mgr-emp-avatar,
  .av-lunch.mgr-emp-avatar,
  .av-done.mgr-emp-avatar { background: var(--accent-soft); }
  .av-idle.mgr-emp-avatar  { background: var(--paper-2); color: var(--muted); }
  /* No status dot on .mgr-emp-avatar — the adjacent .mgr-emp-stat pill
     carries the in / lunch / done / idle indicator on each row. */
  .mgr-emp-info { flex: 1; min-width: 0; }
  .mgr-emp-name { font-family: var(--ui); font-size: 13px; font-weight: 500; color: var(--ink); }
  .mgr-emp-sub  { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
  .mgr-emp-stat {
    font-family: var(--mono);
    font-size: 10px; font-weight: 600;
    padding: 3px 8px; border-radius: var(--radius-pill);
    letter-spacing: .12em; text-transform: uppercase;
    white-space: nowrap;
  }
  .ms-active { background: var(--good-soft);   color: var(--success-deep); }
  .ms-lunch  { background: var(--warn-soft);   color: var(--warning-deep); }
  .ms-done   { background: var(--accent-soft); color: var(--info-deep);    }
  .ms-idle   { background: var(--paper-2);     color: var(--muted);        }

  /* ─── PENDING TIME-OFF CARDS ─────────────────────────────────── */
  .pending-card {
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
    box-shadow: inset 3px 0 0 var(--warn);
    transition: border-color var(--t) var(--ease);
  }
  .pending-card:hover { border-color: var(--border-strong); }
  .pending-card:last-child { margin-bottom: 0; }
  .pending-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 14px; margin-bottom: 10px;
  }
  .pending-date-block {
    text-align: center; min-width: 44px; flex-shrink: 0;
    background: var(--paper-2); border-radius: var(--radius-sm); padding: 6px 4px;
    border: 1px solid var(--line);
  }
  .pending-date-d {
    font-family: var(--display);
    font-size: 20px; font-weight: 500; line-height: 1;
    color: var(--ink); letter-spacing: -.01em;
  }
  .pending-date-m {
    font-family: var(--mono);
    font-size: 9px; font-weight: 600; color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase; margin-top: 3px;
  }
  .pending-emp { font-family: var(--ui); font-size: 14px; font-weight: 500; color: var(--ink); }
  .pending-meta { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 3px; letter-spacing: .04em; }
  .pending-notes {
    font-family: var(--ui); font-size: 12px; color: var(--muted);
    margin-top: 6px; font-style: italic;
    padding-left: 8px; border-left: 2px solid var(--line);
  }
  .pending-balance {
    font-size: 11px; font-weight: 500; color: var(--muted);
    margin-top: 6px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
  }
  .pending-balance .neg { color: var(--destructive); font-weight: 600; }
  .pending-balance-unit { color: var(--muted); font-size: 10px; margin-left: 2px; }

  /* ─── APPROVAL-QUEUE SIGNAL CHIPS (V1·E5) ────────────────────────
     Row of small chips that surface the three actionable signals a
     manager needs before approving a PTO request: holiday (.sig.hol),
     teammates already off the same day (.sig.team), and projected
     balance after the deduction (.sig.bal, with .neg modifier when
     the projection goes negative). Replaces the prior balLine +
     conflictLine inline-text rows. Chips wrap if the card is narrow. */
  .signals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sig {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 4px;
    border: 1px solid transparent;
    font-variant-numeric: tabular-nums;
  }
  .sig svg { width: 11px; height: 11px; }
  .sig.hol  { background: var(--info-soft); color: var(--info-deep); }
  .sig.team { background: var(--warn-soft); color: var(--warning-deep); }
  .sig.bal  { background: var(--paper-2);   color: var(--muted); border-color: var(--line); }
  .sig.bal.neg {
    background: var(--destructive-soft); color: var(--danger-deep);
    border-color: transparent;
  }

  .pending-actions { display: flex; gap: 8px; margin-top: 8px; }
  .pending-btn {
    flex: 1; border-radius: var(--radius);
    padding: 9px; font-family: var(--ui);
    font-size: 12px; font-weight: 500;
    cursor: pointer; letter-spacing: .02em;
    transition: background var(--t) var(--ease), border-color var(--t) var(--ease);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .pending-btn svg { width: 14px; height: 14px; }
  .pending-btn:disabled { opacity: .4; cursor: not-allowed; }
  .pb-approve {
    background: var(--good); color: var(--paper-card);
    border: 1px solid var(--good);
  }
  .pb-approve:hover:not(:disabled) { background: var(--success-deep); border-color: var(--success-deep); }
  .pb-deny {
    background: var(--paper-card); color: var(--destructive);
    border: 1px solid var(--destructive);
  }
  .pb-deny:hover:not(:disabled) { background: var(--destructive-soft); }

  /* ─── STATUS-CARD VOCABULARY (shared: Spanish Inbox + Dept Requests) ──
     Operator feedback 2026-08-06 — the two request-tracking views render ONE
     combined pending+resolved list of these cards, color-coded by status
     (left stripe + soft tint, the .day-card vocabulary): green resolved /
     amber pending / deeper amber at-risk (DR only) / destructive overdue.
     Spanish tones ride SPANISH_OVERDUE_HOURS; DR tones ride the per-dept SLA
     machinery (drRowToneCls_). Moved here from the metrics partial when Dept
     Requests adopted the vocabulary. */
  /* Operator 2026-08-17 — full-width: the grid flows to the view's width (the
     auto-fill minmax reflows 1..4-up on its own; the old 920px cap left the
     right half of a wide monitor empty on both request-tracking pages). */
  .sp-tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  /* The wide top row (Spanish): summary strip + note on the left, the
     resolution-share chart on the right. Stacks below 1024px — the same
     viewport also covers the 480px compact pop-out, so no data-compact
     override is needed (A2: the media query IS the reflow). */
  .sp-top { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0 22px; align-items: start; }
  /* No chart yet (share slot empty — resolved list still loading, or nothing
     resolved): collapse to one column so the head doesn't sit beside a dead
     half-width gap. */
  .sp-top:has(#spanish-share:empty) { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 1023px) { .sp-top { grid-template-columns: minmax(0, 1fr); } }
  /* Show-more row under a display-capped card list (operator 2026-08-17). */
  .sp-more-row { margin: 10px 0 16px; }
  /* List-swap motion (operator 2026-08-06) — see animateListSwap_ in
     script_core.html. Transform/opacity only; one-shot via `both`; per-item
     stagger rides the inline --d; the global prefers-reduced-motion block
     (styles_design_tokens.html) neutralizes it wholesale. Generic — any
     re-rendered list item (status cards, table rows) can carry it. */
  @keyframes listSwapIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .swap-in { animation: listSwapIn .26s var(--ease) both; animation-delay: var(--d, 0s); }
  .sp-task { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper-card); box-shadow: var(--shadow-sm); padding: 12px 14px; }
  .sp-task.st-resolved { box-shadow: inset 3px 0 0 var(--good), var(--shadow-sm); background: var(--good-soft); }
  .sp-task.st-pending  { box-shadow: inset 3px 0 0 var(--warn), var(--shadow-sm); background: var(--warn-soft); }
  .sp-task.st-atrisk   { box-shadow: inset 3px 0 0 var(--warning-deep), var(--shadow-sm); background: var(--warn-soft); }
  .sp-task.st-overdue  { box-shadow: inset 3px 0 0 var(--destructive), var(--shadow-sm); background: var(--destructive-soft); }
  .sp-task-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .sp-task-from { font-size: 12px; color: var(--muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-task-age { font-family: var(--mono); font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .sp-task-subj { font-weight: 600; font-size: 14px; color: var(--ink); margin-bottom: 4px; }
  .sp-task-body { font-size: 13px; color: var(--muted); line-height: 1.45; white-space: pre-wrap; }
  /* flex-wrap (round 2): the claim/assign controls joined this row, and five
     controls at 390px overflow a no-wrap flex — wrapping is intrinsic reflow,
     so no A2 breakpoint is owed. */
  .sp-task-actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 8px; }
  .sp-open { font-size: 12px; color: var(--info); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .sp-open:hover { text-decoration: underline; }
  .sp-more { appearance: none; border: none; background: none; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
  .sp-more:hover { text-decoration: underline; }
  .sp-more.is-busy { opacity: .6; cursor: default; }
  /* Operator 2026-08-24 — per-CARD in-flight state. Resolving a request used
     to re-enter the whole view (loader + scroll jump + every card
     re-animating) for a one-row change; the card now carries its own busy
     treatment and flips to resolved in place. Same idiom as the CN card
     .is-deleting: dimmed, desaturated, inert while the RPC is in flight. The
     global prefers-reduced-motion block neutralizes the pulse wholesale. */
  .sp-task.is-busy { pointer-events: none; filter: grayscale(.6); animation: spTaskBusy 1.1s ease-in-out infinite; }
  @keyframes spTaskBusy { 0%, 100% { opacity: .62; } 50% { opacity: .88; } }
  /* Pilot round 2 — advisory claim pill ("who is on this request") + the
     manager assign select. The pill sits in the flexed card head between the
     requester and the age; `.mine` tints the caller's own claim accent. */
  .sp-claim-pill {
    display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 999px;
    background: var(--info-soft); color: var(--info-deep);
  }
  .sp-claim-pill.mine { background: var(--accent-soft); color: var(--success-deep); }
  .sp-assign {
    font: inherit; font-size: 12px; color: var(--muted);
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 2px 6px; max-width: 140px;
  }
  .sp-claim-release { color: var(--warning-deep); }

  /* ─── ADMIN · TEAM MEMBERS (onboarding readiness) ─────────────
     A COLUMN grid, not a wrapping chip row: each readiness dimension owns a
     cell so a gap on one rep sits directly under a pass on another (operator
     2026-08-11 — the prior flex row put every rep's chips at a different x).
     Stacks to a label-per-line card below 900px, where six columns cannot
     hold their content. */
  .cn-ob-grid { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; background: var(--paper-card); }
  .cn-ob-row {
    display: grid;
    /* The action column is minmax'd, not bare `auto`: the caller's own row
       renders a "you" chip instead of an Offboard button, and a bare auto
       track sized to it shifted that row's other five columns out of line. */
    /* The phone-system column carries the actionable alias suggestion
       ('cdr: add alias "Kim, Leo"'), so it gets the wider track — every other
       readiness cell is a short verdict. */
    grid-template-columns: minmax(150px, 1.3fr) repeat(3, minmax(88px, .9fr)) minmax(150px, 1.5fr) minmax(78px, auto);
    gap: 8px; align-items: center;
    padding: 8px 12px; border-top: 1px solid var(--line);
  }
  .cn-ob-row:first-child { border-top: none; }
  .cn-ob-head {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted-2); background: var(--paper-2);
  }
  .cn-ob-who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .cn-ob-name { font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cn-ob-id { font-family: var(--mono); font-size: 10px; color: var(--muted-2); }
  .cn-ob-mgr { font-family: var(--mono); font-size: 9px; color: var(--muted-2); letter-spacing: .08em; }
  .cn-ob-cell { min-width: 0; }
  .cn-ob-act { display: flex; justify-content: flex-end; }
  .cn-ob-chip {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    display: inline-block; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .cn-ob-chip.is-ok { color: var(--success-deep); }
  .cn-ob-chip.is-warn { color: var(--warning-deep); }
  @media (max-width: 900px) {
    .cn-ob-row { grid-template-columns: 1fr; gap: 4px; padding: 10px 12px; }
    .cn-ob-head { display: none; }
    .cn-ob-act { justify-content: flex-start; margin-top: 4px; }
  }

  /* ─── EMPLOYEE TIME-OFF ──────────────────────────────────────── */
  .req-list { display: flex; flex-direction: column; gap: 8px; }
  .req-card {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px;
    transition: border-color var(--t) var(--ease);
  }
  .req-card:hover { border-color: var(--border-strong); }
  .req-date-block {
    text-align: center; min-width: 44px;
    background: var(--paper-2); border-radius: var(--radius-sm); padding: 6px 4px;
    border: 1px solid var(--line);
  }
  .req-date-d {
    font-family: var(--display);
    font-size: 18px; font-weight: 500; line-height: 1;
    color: var(--ink); letter-spacing: -.01em;
  }
  .req-date-m {
    font-family: var(--mono);
    font-size: 9px; font-weight: 600; color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase; margin-top: 3px;
  }
  .req-info { flex: 1; min-width: 0; }
  .req-type { font-family: var(--ui); font-size: 14px; font-weight: 500; color: var(--ink); }
  .req-notes { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .req-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .req-badge {
    font-family: var(--mono);
    font-size: 10px; font-weight: 600;
    padding: 3px 8px; border-radius: var(--radius-pill);
    letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
  }
  .rb-pending  { background: var(--warn-soft);        color: var(--warning-deep); }
  .rb-approved { background: var(--good-soft);        color: var(--success-deep); }
  .rb-denied   { background: var(--destructive-soft); color: var(--danger-deep);  }
  .req-cancel-btn {
    font-family: var(--ui);
    font-size: 11px; font-weight: 500; color: var(--destructive);
    background: transparent; border: 1px solid var(--destructive);
    border-radius: var(--radius-sm); padding: 4px 9px; cursor: pointer;
    transition: background var(--t) var(--ease);
  }
  .req-cancel-btn:hover { background: var(--destructive-soft); }
  .req-cancel-btn:disabled { opacity: .4; cursor: not-allowed; }

  .opt-marker {
    color: var(--muted);
    font-family: var(--ui);
    font-weight: 400; font-size: 11px;
    text-transform: none; letter-spacing: 0;
  }
  .req-marker {
    color: var(--destructive);
    font-family: var(--ui);
    font-weight: 600; font-size: 11px;
    text-transform: none; letter-spacing: 0;
  }

  /* ─── TIMESHEET ──────────────────────────────────────────────── */
  /* View-mode toggle (Pay Period / Calendar Month) — pill row matching
     the new .toolbar-tabs vocabulary from the design-tokens partial. */
  .view-mode-toggle {
    display: inline-flex; gap: 0;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 3px;
    margin-bottom: 16px;
  }
  .vmt-btn {
    appearance: none; border: none; background: transparent;
    padding: 6px 14px; border-radius: var(--radius-pill); cursor: pointer;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    transition: color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .vmt-btn:hover { color: var(--ink); }
  .vmt-btn.active { background: var(--ink); color: var(--paper); }

  .month-nav {
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px; gap: 8px;
  }
  .month-nav-btn {
    width: 36px; height: 36px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--paper-card);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); flex-shrink: 0;
    transition: border-color var(--t) var(--ease), color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .month-nav-btn:hover:not(:disabled) {
    border-color: var(--border-strong); color: var(--ink); background: var(--paper-2);
  }
  .month-nav-btn:disabled { opacity: .3; cursor: not-allowed; }
  .month-nav-btn svg { width: 16px; height: 16px; }
  .month-label {
    font-family: var(--display);
    font-size: 17px; font-weight: 500;
    /* Fixed min-width keeps the chevrons hugging the label (not flung to the
       card edges) and stops them shifting as the month name length changes. */
    text-align: center; min-width: 168px; line-height: 1.25;
    letter-spacing: -.01em; color: var(--ink);
  }
  .month-label .ml-sub {
    display: block;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase; margin-top: 4px;
  }

  /* ─── CALENDAR ───────────────────────────────────────────────── */
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .cal-dow {
    text-align: center;
    font-family: var(--mono);
    font-size: 10px; font-weight: 600;
    color: var(--muted); padding: 4px 0 8px;
    text-transform: uppercase; letter-spacing: .12em;
  }
  .cal-cell {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: var(--radius); position: relative; gap: 3px;
    transition: background var(--t) var(--ease), box-shadow var(--t) var(--ease);
  }
  .cal-cell.clickable { cursor: pointer; }
  .cal-cell.clickable:hover { background: var(--paper-2); }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-cell.weekend .cal-dn { color: var(--muted); opacity: .7; }
  .cal-cell.has-worked  { background: var(--good-soft); }
  .cal-cell.has-pending { background: var(--warn-soft); }
  .cal-cell.has-approved{ background: var(--accent-soft); }
  .cal-cell.has-denied  { background: var(--destructive-soft); }
  .cal-dn {
    font-family: var(--mono);
    font-size: 13px; font-weight: 500; line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  /* A11y batch H — shape cues so dot meaning isn't color-only:
     worked = SQUARE, PTO = circle; pending = HOLLOW ring; a denied day's
     number is struck through. (Color-blind-safe without redesigning.) */
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .cal-dot.worked   { background: var(--good); border-radius: 1px; }
  .cal-dot.pending  { background: transparent; border: 1.5px solid var(--warn); box-sizing: border-box; width: 6px; height: 6px; }
  .cal-dot.approved { background: var(--accent); }
  .cal-dot.denied   { background: var(--destructive); }
  .cal-cell.has-denied .cal-dn { text-decoration: line-through; }
  /* Holiday glyph — slate-blue star marker, no glowy text-shadow */
  .cal-holiday {
    position: absolute; top: 4px; left: 5px;
    line-height: 1;
    color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cal-holiday svg { width: 12px; height: 12px; }
  .cal-tm {
    position: absolute; bottom: 3px; right: 3px;
    font-family: var(--mono);
    font-size: 9px; font-weight: 600; line-height: 1;
    background: var(--paper-card); color: var(--muted);
    border: 1px solid var(--line);
    padding: 1px 5px; border-radius: 4px;
    letter-spacing: .04em;
  }

  /* Cap calendar size so it doesn't sprawl at fullscreen */
  .cal-card { max-width: 720px; margin: 0 auto; }

  /* ─── TIME OFF: 2-col layout (calendar left, PTO ring right) ───────────── */
  .timeoff-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 240px;
    gap: 18px;
    align-items: start;
    margin-bottom: 16px;
  }
  .timeoff-main { min-width: 0; }
  .timeoff-side { min-width: 0; }
  /* .pto-card-side ring rules removed in Round 2 · 8d — the rectangular
     .pto-tile replaces it. See the PTO TILE block earlier in this file. */
  @media (max-width: 900px) {
    .timeoff-layout { grid-template-columns: 1fr; }
  }

  /* ─── PUNCH UNDO BUTTON (×) on Today's Punches ───────────────────────── */
  .punch-undo {
    width: 22px; height: 22px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-size: 14px; font-weight: 500; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; padding: 0;
    transition: all var(--t) var(--ease);
    margin-left: 4px;
  }
  .punch-undo:hover {
    border-color: var(--destructive);
    color: var(--destructive);
    background: var(--destructive-soft);
  }
  .punch-undo:disabled { opacity: .4; cursor: not-allowed; }

  /* ─── TEAMMATE CARD on Clock page (compact employee grid) ────────────── */
  .emp-card-compact {
    padding: 10px 12px;
  }
  .emp-card-compact .emp-avatar { width: 30px; height: 30px; font-size: 11px; }
  .emp-card-compact .emp-avatar::after { width: 9px; height: 9px; bottom: -1px; right: -1px; }
  .emp-card-compact .emp-name { font-size: 12px; }
  .emp-card-compact .emp-status-line { font-size: 11px; color: var(--muted); }
  .emp-card-compact.is-self {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .emp-self-tag {
    font-family: var(--mono);
    font-size: 9px; font-weight: 600;
    color: var(--info-deep);
    background: color-mix(in oklch, var(--accent), transparent 80%);
    padding: 1px 5px; border-radius: 3px;
    margin-left: 6px; letter-spacing: .08em;
    text-transform: uppercase;
    vertical-align: 1px;
  }

  /* ─── CALENDAR HOURS BADGE (Time Off page worked-day overlay) ────────── */
  .cal-hrs {
    position: absolute; bottom: 3px; right: 3px;
    font-family: var(--mono);
    font-size: 9px; font-weight: 600; line-height: 1;
    background: var(--good);
    color: var(--paper-card);
    padding: 2px 5px; border-radius: 4px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .04em;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .cal-hrs svg { width: 9px; height: 9px; }
  .cal-hrs.in-progress { background: var(--accent); animation: pulse 2s infinite; }
  .cal-hrs.warn        { background: var(--warn); }

  /* ─── TIMESHEET CALENDAR GRID ────────────────────────────────────────── */
  .ts-cal-cell {
    /* Inherits .cal-cell base styles; adjustments only */
    cursor: default;
  }
  .ts-cal-cell.future .cal-dn { color: var(--muted); opacity: .5; }
  .ts-cal-cell.future { background: transparent !important; }

  /* ─── LAYOUT TOGGLE (Timesheet List vs Calendar) — matches the
     view-mode-toggle pill style above so the two toolbars read as
     siblings. */
  .layout-toggle {
    display: inline-flex; gap: 0;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 3px;
  }
  .layout-btn {
    display: inline-flex; align-items: center; gap: 6px;
    appearance: none; border: none; background: transparent;
    padding: 6px 12px; border-radius: var(--radius-pill); cursor: pointer;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    transition: color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .layout-btn:hover { color: var(--ink); }
  .layout-btn.active { background: var(--ink); color: var(--paper); }
  .layout-btn .lo-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px;
  }
  .layout-btn .lo-icon svg { width: 100%; height: 100%; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
  .leg-item {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--ui); font-size: 12px;
    color: var(--muted); font-weight: 500;
  }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; }
  .leg-star { color: var(--accent); display: inline-flex; align-items: center; }
  .leg-star svg { width: 12px; height: 12px; }

  /* ─── MISSED / RECENT / AUDIT ────────────────────────────────── */
  .missed-row, .rp-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .missed-row:last-child, .rp-row:last-child { border-bottom: none; }
  .missed-icon {
    color: var(--warning-deep); background: var(--warn-soft);
    width: 32px; height: 32px; border-radius: var(--radius);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .missed-icon svg { width: 16px; height: 16px; }
  .missed-info { flex: 1; font-family: var(--ui); font-size: 13px; }
  .missed-emp { font-weight: 500; color: var(--ink); }
  .missed-date { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: .04em; }
  .rp-info { flex: 1; min-width: 0; }
  .rp-top { display: flex; align-items: center; gap: 7px; }
  .rp-emp { font-family: var(--ui); font-size: 13px; font-weight: 500; color: var(--ink); }
  .rp-detail {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    margin-top: 2px; letter-spacing: .04em;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .rp-del {
    width: 30px; height: 30px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: transparent;
    color: var(--muted);
    cursor: pointer; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
    transition: border-color var(--t) var(--ease), color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .rp-del:hover {
    border-color: var(--destructive); color: var(--destructive); background: var(--destructive-soft);
  }
  .rp-del:disabled { opacity: .4; cursor: not-allowed; }
  .rp-del svg { width: 14px; height: 14px; }
  .rp-del-spacer { width: 30px; flex-shrink: 0; }
  .de-open-btn {
    width: 26px; height: 26px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); cursor: pointer; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; margin-left: auto;
