<script>
// ════════════════════════════════════════════════════════════════════════════
//  UMS TEAM TOOLS — INLINE SVG ICON LIBRARY

//  Monochrome stroke-based icons. Every icon uses `stroke="currentColor"` so
//  it inherits the surrounding text color — dark mode, status tones, and
//  legacy `color:` overrides all "just work" with no per-icon tweaks.
//
//  Usage:
//    icon('clockIn')           → 18px
//    icon('clockOut', 22)      → custom size
//    iconHtml('clock', 16, 'sb-icon')  → wraps in <span class="icon sb-icon">
//
//  Stage 0 ships the library only. Stage 2+ swaps PUNCH_META.emoji /
//  sidebar emoji / etc. over to these via the rendering code.
// ════════════════════════════════════════════════════════════════════════════
(function (global) {
  var SW = 1.75; // default stroke width
  var ICONS = {
    // ── Punch types ──────────────────────────────────────────────────────
    // ClockIn — play-circle (start the shift)
    clockIn: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5L10 15.5z" fill="currentColor"/>',
    // LunchOut — utensils
    lunchOut: '<path d="M7 3v8M5 3v5a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M7 11v10"/><path d="M17 3c-1.5 0-3 2-3 5s1.5 5 3 5v8"/>',
    // LunchIn — arrow-return (back from lunch)

    // ClockOut — stop-circle (end the shift)
    clockOut: '<circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" stroke="none"/>',
    // Adjust — pencil
    adjust: '<path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',

    // ── Sidebar / nav ────────────────────────────────────────────────────

    // ── Theme toggle ─────────────────────────────────────────────────────
    sun:  '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',

    // ── Status / state ───────────────────────────────────────────────────
    warning:    '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',

    chevronRight: '<path d="m9 18 6-6-6-6"/>',
    chevronDown:  '<path d="m6 9 6 6 6-6"/>',
    chevronUp:    '<path d="m18 15-6-6-6 6"/>',
    search:     '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    settings:   '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0A1.65 1.65 0 0 0 9 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9h0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    user:       '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    star:       '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',
    list:       '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

    // ── Slash / no — used by missed-punch / not-clocked-in indicators ────
    circleSlash:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',

    // ── Call Notes ───────────────────────────────────────────────────────
    // Phone — sidebar / nav icon for the Call Notes tool
    phone:      '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.33 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
    // Mail — email composer trigger on each note card
    mail:       '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/>',

    flag:       '<path d="M4 22V4"/><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1"/>',
    // Lightbulb — training-flag toggle (rep wants clarification)
    bulb:       '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.7.5 1.2 1.5 1.2 2.3v0h5.6v0c0-.8.5-1.8 1.2-2.3A7 7 0 0 0 12 2z"/>',
    // External-link arrow — pop-out window button
    popOut:     '<path d="M14 3h7v7"/><path d="m10 14 11-11"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>',
    // Copy — auto-copy confirmation, manual copy button on note cards
    copy:       '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    // Filter — for the filter chips on the rolling note view
    filter:     '<path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>',
    // Kebab (three vertical dots) — overflow menu for less-common flag options
    kebab:      '<circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/>',
    // Bookmark — used by the personal pin feature on Call Notes cards.
    // Distinct from the `star` icon (which means Review flag) to avoid
    // overloading the same glyph with two different meanings on one card.
    bookmark:   '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
    // Microphone — voice-to-text dictation button on Issue / Resolution
    mic:        '<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
    // Send — paper-plane glyph for the external email feature
    send:       '<path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/>',
    // Paperclip — form attachment indicator on note cards
    paperclip:  '<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
    chart:      '<path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>',
  };

  /**
   * Return an inline SVG string for the named icon.
   * @param {string} name   Key from ICONS above
   * @param {number} [size] Pixel size for both width + height (default 18)
   * @param {string} [stroke] Stroke width override (default "1.75")
   * @returns {string} SVG markup, or '' if name is unknown
   */
  function icon(name, size, stroke) {
    var body = ICONS[name];
    if (!body) return '';
    var sz = size || 18;
    var sw = stroke || SW;
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + sz + '" height="' + sz +
      '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + sw +
      '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }

  /**
   * Wrap icon() in a `.icon` span — convenience for cases where the
   * surrounding code expects a single HTML element rather than a raw <svg>.
   */
  function iconHtml(name, size, extraClass) {
    var svg = icon(name, size);
    if (!svg) return '';
    var cls = 'icon' + (extraClass ? ' ' + extraClass : '');
    return '<span class="' + cls + '">' + svg + '</span>';
  }

  /** Best-effort list for tests / debug — exported on the namespace. */
  function iconNames() { return Object.keys(ICONS); }

  global.icon = icon;
  global.iconHtml = iconHtml;
  global.iconNames = iconNames;
})(window);
</script>
