<style>
  /* ═══════════════════════════════════════════════════════════════════════
     UMS TEAM TOOLS — SHARED DESIGN TOKENS
     ───────────────────────────────────────────────────────────────────────
     Console-redesign palette. Editorial green-as-primary (`--accent` is
     green; `--info` is a separate blue token for info-only surfaces).
     Dark mode is applied via [data-mode="dark"] from the bootstrap script
     in index.html. New tools should `include` this partial FIRST in their
     `<head>`, then layer their tool-specific view styles on top — the
     partial declares the canonical tokens (colors, type families, radii,
     shadows, motion, layout vars) plus the additive utility classes
     (`.app-bar`, `.panel`, `.doc-row`, `.kicker-pill`, `.toolbar-tabs`,
     etc.) every tool can consume.
     ═══════════════════════════════════════════════════════════════════════ */

  :root {
    /* ── Type families ─────────────────────────────────────────────── */
    /* Inter Tight is the single sans family — used for both UI and
       display sites. Stylistic sets ss01/cv11/cv05 + a small negative
       letter-spacing tighten the editorial feel; applied on html/body
       in styles.html so every text node inherits. */
    --display: 'Inter Tight', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --ui:      'Inter Tight', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;

    /* ── Console palette (light, default) ──────────────────────────── */
    --paper:        #f6f7f9;
    --paper-2:      #f0f2f6;
    --paper-3:      #e5e8ee;
    --paper-card:   #ffffff;
    --ink:          #0f1623;
    --muted:        #3e4756;
    --muted-2:      #737c8c;
    --muted-3:      #a5acb8;
    --line:         #dce0e7;
    --line-2:       #c3c9d3;

    /* Primary accent is green (the redesign's editorial signature). */
    --accent:       #0f8a52;
    --accent-2:     #0b6e40;
    --accent-soft:  #e4f5ec;
    --accent-glow:  rgba(15, 138, 82, 0.16);

    /* `--good` is intentionally aliased to `--accent` — the redesign
       collapses primary and success into one green. Future code that
       needs to distinguish them can layer on top. */
    --good:         #0f8a52;
    --good-soft:    #e4f5ec;

    --warn:         #b7791f;
    --warn-soft:    #fbf1d9;
    --destructive:      #c13030;
    --destructive-soft: #fce5e5;

    /* Info = blue. Separate from the primary green so info-only surfaces
       (US-holiday signal chip, manager-tz tag, "heads up" banners) read
       distinct from the primary accent. */
    --info:         #1e63b8;
    --info-soft:    #e1ecfa;

    /* ── Depth (warm-paper aesthetic uses minimal shadow) ──────────── */
    --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
    --shadow:    0 1px 3px rgba(15,23,42,.04);
    --shadow-md: 0 2px 6px rgba(15,23,42,.06);
    --shadow-lg: 0 8px 24px rgba(15,23,42,.10);
    --ring-focus: 0 0 0 3px color-mix(in oklch, var(--accent), transparent 80%);

    /* ── Geometry / motion ─────────────────────────────────────────── */
    --radius-sm: 6px;
    --radius:    8px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --ease: cubic-bezier(.4, 0, .2, 1);
    --t: 180ms;

    /* ── Layout ────────────────────────────────────────────────────── */
    --sidebar-w:     240px;
    --content-max:   1280px;
    --mobile-nav-h:  60px;

    /* ── Derived tokens still in active use ─────────────────────────
       The four `*-deep` variants and `--border-strong` are derived
       darker shades that appear often enough across the views that
       it's worth giving them a name. The dark-mode block below
       inverts them so they read as lighter shades against the dark
       canvas. Fallbacks for browsers without color-mix support. */
    --border-strong: #b8bcc4;
    --success-deep:  #0b6e40;
    --warning-deep:  #8a4500;
    --danger-deep:   #8a1f1f;
    --info-deep:     #154980;

    /* ── Metrics-module aliases ─────────────────────────────────────
       metrics/script_metrics.html (and possibly future tools) reference
       these names. Mapping them to the canonical tokens here keeps the
       Metrics view consistent with the rest of the design system without
       a per-file rewrite. */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --font-mono:  var(--mono);
    --font-tight: var(--display);
    --danger:      var(--destructive);
    --danger-soft: var(--destructive-soft);
  }
  @supports (color: color-mix(in oklch, red, blue)) {
    :root {
      --border-strong: color-mix(in oklch, var(--line), var(--ink) 25%);
      --success-deep: color-mix(in oklch, var(--good),        var(--ink) 45%);
      --warning-deep: color-mix(in oklch, var(--warn),        var(--ink) 45%);
      --danger-deep:  color-mix(in oklch, var(--destructive), var(--ink) 45%);
      --info-deep:    color-mix(in oklch, var(--info),        var(--ink) 45%);
    }
  }

  /* ── Dark mode overlay ───────────────────────────────────────────
     Applied via the bootstrap script in index.html. Toggling lives at
     :root level (set on <html>) so the very first paint already
     reflects the persisted mode — no light-mode flash on load. */
  :root[data-mode="dark"],
  body[data-mode="dark"] {
    --paper:        #0a0d14;
    --paper-2:      #161b26;
    --paper-3:      #1e2532;
    --paper-card:   #10141d;
    --ink:          #e8e6e0;
    --muted:        #a6adbc;
    --muted-2:      #6c7587;
    --muted-3:      #454e60;
    --line:         #262d3b;
    --line-2:       #3f4a60;

    --accent:       #7af2a1;
    --accent-2:     #4fd683;
    --accent-soft:  rgba(122, 242, 161, 0.12);
    --accent-glow:  rgba(122, 242, 161, 0.22);

    --good:         #7af2a1;
    --good-soft:    rgba(122, 242, 161, 0.12);

    --warn:         #ffb547;
    --warn-soft:    rgba(255, 181, 71, 0.14);
    --destructive:  #ff6679;
    --destructive-soft: rgba(255, 102, 121, 0.14);

    --info:         #74c7ff;
    --info-soft:    rgba(116, 199, 255, 0.14);

    --shadow-sm: 0 1px 2px rgba(0,0,0,.25);
    --shadow:    0 1px 3px rgba(0,0,0,.30);
    --shadow-md: 0 2px 8px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 28px rgba(0,0,0,.45);
    --ring-focus: 0 0 0 3px rgba(122,242,161,.3);

    --success-deep:  #b8fbc8;
    --warning-deep:  #ffcb80;
    --danger-deep:   #ffa0a8;
    --info-deep:     #b0ddff;
    --border-strong: #4a5260;
  }
  @supports (color: color-mix(in oklch, red, blue)) {
    :root[data-mode="dark"],
    body[data-mode="dark"] {
      --ring-focus: 0 0 0 3px color-mix(in oklch, var(--accent), transparent 70%);
      --success-deep: color-mix(in oklch, var(--good),        var(--paper-card) 25%);
      --warning-deep: color-mix(in oklch, var(--warn),        var(--paper-card) 25%);
      --danger-deep:  color-mix(in oklch, var(--destructive), var(--paper-card) 25%);
      --info-deep:    color-mix(in oklch, var(--info),        var(--paper-card) 25%);
      --border-strong: color-mix(in oklch, var(--line), var(--ink) 25%);
    }
  }

  /* ═══════════════════════════════════════════════════════════════════
     WARM-PAPER UTILITY CLASSES
     ───────────────────────────────────────────────────────────────────
     Shared layout + chrome primitives consumed by every tool. Time
     clock uses these alongside its view-specific `.card` / `.metric-
     card` / `.day-card` / etc. classes; future tools should reach for
     these first before adding tool-local variants.
     ═══════════════════════════════════════════════════════════════════ */

  /* App bar — top edge of a view; carries breadcrumb + kicker + actions */
  .app-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 18px 0 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .app-bar-left  { min-width: 0; }
  .app-bar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .breadcrumb {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .breadcrumb .crumb-sep { opacity: .5; }
  .breadcrumb .crumb-current { color: var(--ink); }

  /* Section kicker — small mono-uppercase label that sits above a title */
  .section-kicker {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); letter-spacing: .14em; text-transform: uppercase;
    margin-bottom: 6px;
    display: inline-flex; align-items: center; gap: 8px;
  }

  /* Display title — Inter Tight, lighter weight than legacy view-title */
  .display-title {
    font-family: var(--display);
    font-size: 28px; font-weight: 500;
    letter-spacing: -.02em; line-height: 1.15;
    color: var(--ink); margin: 0;
  }
  .display-title.lg { font-size: 36px; }
  .display-title.xl { font-size: 44px; }

  /* Panel — hairline-bordered container; the warm-paper successor to .card */
  .panel {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  .panel.dense  { padding: 14px 16px; }
  .panel.flush  { padding: 0; }
  .panel.tinted { background: var(--paper-2); }
  .panel[data-tone="accent"]      { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--accent); }
  .panel[data-tone="sage"]        { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--good); }
  .panel[data-tone="warn"]        { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--warn); }
  .panel[data-tone="destructive"] { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--destructive); }

  /* Doc row — hairline-separated row inside a panel or list */
  .doc-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .doc-row:last-child  { border-bottom: none; }
  .doc-row:first-child { padding-top: 4px; }

  /* Kicker pill — tiny mono-uppercase status chip */
  .kicker-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 4px;
    background: var(--paper-2); color: var(--muted);
    border: 1px solid var(--line);
  }
  .kicker-pill[data-tone="accent"]      { background: var(--accent-soft);      color: var(--success-deep); border-color: transparent; }
  .kicker-pill[data-tone="sage"]        { background: var(--good-soft);        color: var(--success-deep); border-color: transparent; }
  .kicker-pill[data-tone="warn"]        { background: var(--warn-soft);        color: var(--warning-deep); border-color: transparent; }
  .kicker-pill[data-tone="destructive"] { background: var(--destructive-soft); color: var(--danger-deep);  border-color: transparent; }
  .kicker-pill[data-tone="info"]        { background: var(--info-soft);        color: var(--info-deep);    border-color: transparent; }

  /* Tabular numerics — applied to anything that stacks numbers */
  .tabular {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum', 'ss01';
  }

  /* Toolbar tab — mono-uppercase button row (used in place of segmented controls) */
  .toolbar-tabs {
    display: inline-flex; gap: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    background: var(--paper-card);
  }
  .toolbar-tab {
    appearance: none; border: none; background: transparent;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    transition: color var(--t) var(--ease), background var(--t) var(--ease);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .toolbar-tab:hover      { color: var(--ink); }
  .toolbar-tab[aria-pressed="true"],
  .toolbar-tab.active     { background: var(--ink); color: var(--paper); }

  /* Inline icon sizing helper — paired with the icon() function in script_icons.html */
  .icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon svg { display: block; }

  /* Reduced-motion safety */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
