<style>
  /* ═══════════════════════════════════════════════════════════════════════
     UMS TEAM TOOLS — SHARED DESIGN TOKENS
     ───────────────────────────────────────────────────────────────────────
     Console-redesign palette. Editorial green-as-primary (`--accent` is
     green; `--info` is a separate blue token for info-only surfaces).
     Dark mode is applied via [data-mode="dark"] from the bootstrap script
     in index.html. New tools should `include` this partial FIRST in their
     `<head>`, then layer their tool-specific view styles on top — the
     partial declares the canonical tokens (colors, type families, radii,
     shadows, motion, layout vars) plus the additive utility classes
     (`.app-bar`, `.panel`, `.doc-row`, `.kicker-pill`, `.toolbar-tabs`,
     etc.) every tool can consume.
     ═══════════════════════════════════════════════════════════════════════ */

  :root {
    /* ── Type families ─────────────────────────────────────────────── */
    /* Inter Tight is the single sans family — used for both UI and
       display sites. Stylistic sets ss01/cv11/cv05 + a small negative
       letter-spacing tighten the editorial feel; applied on html/body
       in styles.html so every text node inherits. */
    --display: 'Inter Tight', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --ui:      'Inter Tight', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;

    /* ── Console palette (light, default) ──────────────────────────── */
    --paper:        #f6f7f9;
    --paper-2:      #f0f2f6;
    --paper-3:      #e5e8ee;
    --paper-card:   #ffffff;
    --ink:          #0f1623;
    --muted:        #3e4756;
    --muted-2:      #5f6878;   /* AA text on every light surface (≥5.0:1) */
    --muted-3:      #a5acb8;   /* decoration only — below AA; never body text */
    --line:         #dce0e7;
    --line-2:       #c3c9d3;

    /* Primary accent is green (the redesign's editorial signature). */
    --accent:       #0f8a52;
    --accent-2:     #0b6e40;
    --accent-soft:  #e4f5ec;
    --accent-glow:  rgba(15, 138, 82, 0.16);
    /* Text-selection highlight. --accent-soft was used here originally but
       is nearly indistinguishable from the field background in both modes
       (operator-reported: selecting text in the note template showed no
       visible highlight). Mid-strength tint, distinct from --accent-soft. */
    --selection-bg: #abdfc4;

    /* `--good` is intentionally aliased to `--accent` — the redesign
       collapses primary and success into one green. Future code that
       needs to distinguish them can layer on top. */
    --good:         #0f8a52;
    --good-soft:    #e4f5ec;

    --warn:         #b7791f;
    --warn-soft:    #fbf1d9;
    --destructive:      #c13030;
    --destructive-soft: #fce5e5;

    /* Info = blue. Separate from the primary green so info-only surfaces
       (US-holiday signal chip, manager-tz tag, "heads up" banners) read
       distinct from the primary accent. */
    --info:         #1e63b8;
    --info-soft:    #e1ecfa;

    /* ── Intake form-type accents (progress rings) — one per form so PPD /
       PMD Account / PAP Account are distinguishable at a glance. */
    --intake-ppd:   #1e63b8;   /* blue   */
    --intake-pmd:   #d9730d;   /* orange */
    --intake-pap:   #7c3aed;   /* purple */

    /* ── Depth (warm-paper aesthetic uses minimal shadow) ──────────── */
    --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
    --shadow:    0 1px 3px rgba(15,23,42,.04);
    --shadow-md: 0 2px 6px rgba(15,23,42,.06);
    --shadow-lg: 0 8px 24px rgba(15,23,42,.10);
    --ring-focus: 0 0 0 3px color-mix(in oklch, var(--accent), transparent 80%);

    /* ── Geometry / motion ─────────────────────────────────────────── */
    --radius-sm: 6px;
    --radius:    8px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
    --ease: cubic-bezier(.4, 0, .2, 1);
    --t: 180ms;

    /* ── Type scale (batch J) — adopt for NEW rules; existing sizes
       migrate opportunistically as rules are touched. ─────────────── */
    --text-xs:   11px;
    --text-sm:   12px;
    --text-base: 14px;
    --text-lg:   17px;
    --text-xl:   22px;

    /* ── Layout ────────────────────────────────────────────────────── */
    --sidebar-w:     168px;
    --content-max:   1280px;
    --mobile-nav-h:  60px;

    /* ── Derived tokens still in active use ─────────────────────────
       The four `*-deep` variants and `--border-strong` are derived
       darker shades that appear often enough across the views that
       it's worth giving them a name. The dark-mode block below
       inverts them so they read as lighter shades against the dark
       canvas. Fallbacks for browsers without color-mix support. */
    --border-strong: #b8bcc4;
    --success-deep:  #0b6e40;
    --warning-deep:  #8a4500;
    --danger-deep:   #8a1f1f;
    --info-deep:     #154980;

    /* ── Metrics-module aliases ─────────────────────────────────────
       metrics/script_metrics.html (and possibly future tools) reference
       these names. Mapping them to the canonical tokens here keeps the
       Metrics view consistent with the rest of the design system without
       a per-file rewrite. */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 24px;
    --font-mono:  var(--mono);
    --font-tight: var(--display);
    --danger:      var(--destructive);
    --danger-soft: var(--destructive-soft);
  }
  @supports (color: color-mix(in oklch, red, blue)) {
    :root {
      --selection-bg: color-mix(in oklch, var(--accent) 30%, transparent);
      --border-strong: color-mix(in oklch, var(--line), var(--ink) 25%);
      /* ── V-1 (cycle 12): these four MUST mix `in oklab`, not `in oklch` ──
         oklch interpolates HUE on the polar arc. --ink (#0f1623) sits at hue
         ~264, so mixing amber (hue 70) toward it takes the short way round —
         70 -> 0 -> 264, i.e. THROUGH RED. Measured with `in oklch`:
         --warning-deep resolved to hue 355 (RED, vs the #8a4500 amber
         fallback right above), --danger-deep to 330 (magenta),
         --success-deep to 204 (cyan). Only --info-deep looked right, because
         blue already matches --ink's hue — which is exactly why this went
         unnoticed for so long. Consequence: `.actions .sec.act-lunchout`
         (var(--warning-deep)) painted Lunch Out in a destructive red, and
         warn/danger read as swapped, across ~254 consumers.
         oklab is RECTANGULAR (a/b axes, no hue arc), so mixing a chromatic
         colour toward a near-neutral dark just darkens it and PRESERVES the
         hue: amber -> h68, red -> h19, green -> h166 (verified in Chromium).
         The dark block below has the same requirement.
         NOTE the @supports test above still probes `in oklch` deliberately —
         it is a proxy for "supports color-mix at all" (both spaces shipped
         together) and it also guards the two oklch mixes above, which are
         hue-safe: one mixes with `transparent`, the other is a low-chroma
         neutral pair. A hue-drift tripwire in test/client/run.js fails CI if
         any of these four regresses to oklch. */
      --success-deep: color-mix(in oklab, var(--good),        var(--ink) 45%);
      --warning-deep: color-mix(in oklab, var(--warn),        var(--ink) 45%);
      --danger-deep:  color-mix(in oklab, var(--destructive), var(--ink) 45%);
      --info-deep:    color-mix(in oklab, var(--info),        var(--ink) 45%);
    }
  }

  /* ── Dark mode overlay ───────────────────────────────────────────
     Applied via the bootstrap script in index.html. Toggling lives at
     :root level (set on <html>) so the very first paint already
     reflects the persisted mode — no light-mode flash on load. */
  :root[data-mode="dark"],
  body[data-mode="dark"] {
    --paper:        #0a0d14;
    --paper-2:      #161b26;
    --paper-3:      #1e2532;
    --paper-card:   #10141d;
    --ink:          #e8e6e0;
    --muted:        #a6adbc;
    --muted-2:      #7b8496;   /* AA text on every dark surface (≥4.5:1) */
    --muted-3:      #454e60;   /* decoration only — below AA; never body text */
    --line:         #262d3b;
    --line-2:       #3f4a60;

    --accent:       #7af2a1;
    --accent-2:     #4fd683;
    --accent-soft:  rgba(122, 242, 161, 0.12);
    --accent-glow:  rgba(122, 242, 161, 0.22);
    --selection-bg: rgba(122, 242, 161, 0.32);

    --good:         #7af2a1;
    --good-soft:    rgba(122, 242, 161, 0.12);

    --warn:         #ffb547;
    --warn-soft:    rgba(255, 181, 71, 0.14);
    --destructive:  #ff6679;
    --destructive-soft: rgba(255, 102, 121, 0.14);

    --info:         #74c7ff;
    --info-soft:    rgba(116, 199, 255, 0.14);

    /* Intake form-type accents — lightened for dark mode (parity with --info). */
    --intake-ppd:   #74c7ff;   /* blue   */
    --intake-pmd:   #ffa657;   /* orange */
    --intake-pap:   #c4a5ff;   /* purple */

    --shadow-sm: 0 1px 2px rgba(0,0,0,.25);
    --shadow:    0 1px 3px rgba(0,0,0,.30);
    --shadow-md: 0 2px 8px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 28px rgba(0,0,0,.45);
    --ring-focus: 0 0 0 3px rgba(122,242,161,.3);

    --success-deep:  #b8fbc8;
    --warning-deep:  #ffcb80;
    --danger-deep:   #ffa0a8;
    --info-deep:     #b0ddff;
    --border-strong: #4a5260;
  }
  @supports (color: color-mix(in oklch, red, blue)) {
    :root[data-mode="dark"],
    body[data-mode="dark"] {
      --ring-focus: 0 0 0 3px color-mix(in oklch, var(--accent), transparent 70%);
      --selection-bg: color-mix(in oklch, var(--accent) 32%, transparent);
      /* V-1: oklab here too. Dark mode was ALREADY close to correct (a 25%
         mix toward a near-neutral dark barely moves the hue arc), but the
         light block was catastrophically wrong — so the same token rendered a
         DIFFERENT hue family per theme. Using oklab in both makes the pair
         consistent and removes the trap for the next alias added here. */
      --success-deep: color-mix(in oklab, var(--good),        var(--paper-card) 25%);
      --warning-deep: color-mix(in oklab, var(--warn),        var(--paper-card) 25%);
      --danger-deep:  color-mix(in oklab, var(--destructive), var(--paper-card) 25%);
      --info-deep:    color-mix(in oklab, var(--info),        var(--paper-card) 25%);
      --border-strong: color-mix(in oklch, var(--line), var(--ink) 25%);
    }
  }


  /* ═══════════════════════════════════════════════════════════════════
     PALETTE OVERLAYS (operator 2026-08-12)
     ───────────────────────────────────────────────────────────────────
     A second, ORTHOGONAL axis to light/dark: `data-palette` on <html>,
     set synchronously by the bootstrap in index.html from
     localStorage['umsTheme'] (same no-flash discipline as data-mode).
     Console is the default and declares NO block — an absent/unknown
     value is Console, so a corrupt preference degrades to the shipped
     look rather than to an undefined one.

     TWO RULES, both load-bearing:

     (1) A PALETTE MAY REDEFINE ONLY THE NEUTRALS AND THE ACCENT FAMILY.
         It must NEVER redefine --good / --warn / --destructive / --info
         or anything derived from them. Those carry MEANING — green is
         "resolved", amber is "at risk", red is "overdue" — and a theme
         that restates a verdict in a different hue makes every status
         chip in the app mean something else per user. (In Console the
         accent happens to equal --good; in the other palettes they
         differ, which is fine: the codebase already treats them as
         distinct tokens — see the CN flag-stripe pin.)

     (2) EVERY NEUTRAL AND ACCENT IS A HUE ROTATION AT CONSTANT WCAG
         RELATIVE LUMINANCE. The hexes below were GENERATED by binary-
         searching OKLab L until each colour's relative luminance matched
         its Console counterpart EXACTLY, so every contrast ratio the app
         was measured at is preserved BY CONSTRUCTION — --muted-2 stays
         AA on every surface, --ink keeps its 18.1:1, and a palette can
         never quietly become the accessibility regression. --paper-card
         stays #ffffff in light mode because white is the only colour at
         luminance 1.0; a tinted card would have to change luminance.
         The AA tripwire in test/client/run.js measures every block
         anyway — the construction is the reason it passes, not a
         substitute for measuring.

     Adding a palette = one light block + one dark block here, one entry
     in PALETTES in script_core.html, and nothing else; the tripwires
     derive their block list from this file. */

  :root[data-palette="sand"]:not([data-mode="dark"]),
  body[data-palette="sand"]:not([data-mode="dark"]) {
    --paper: #faf7f2;
    --paper-2: #f8f1e7;
    --paper-3: #f0e7d8;
    --paper-card: #ffffff;
    --ink: #1e1406;
    --muted: #504535;
    --muted-2: #716655;
    --muted-3: #b4aa9d;
    --line: #e8dfd0;
    --line-2: #d1c7b9;
    --accent: #0d8a52;
    --accent-2: #086e40;
    --accent-soft: #dbf8e4;
    --accent-glow: rgba(13, 138, 82, 0.16);
    --selection-bg: #9fe2b8;
  }
  :root[data-palette="sand"][data-mode="dark"],
  body[data-palette="sand"][data-mode="dark"] {
    --paper: #120c04;
    --paper-2: #211a0f;
    --paper-3: #2b2419;
    --paper-card: #1a1309;
    --ink: #eee5d7;
    --muted: #b8ab98;
    --muted-2: #8e8270;
    --muted-3: #554d41;
    --line: #332c21;
    --line-2: #51493d;
    --accent: #87efb1;
    --accent-2: #7acf9c;
    --accent-soft: rgba(135, 239, 177, 0.12);
    --accent-glow: rgba(135, 239, 177, 0.22);
    --selection-bg: rgba(135, 239, 177, 0.32);
    --ring-focus: 0 0 0 3px rgba(135, 239, 177, .3);
  }
  :root[data-palette="plum"]:not([data-mode="dark"]),
  body[data-palette="plum"]:not([data-mode="dark"]) {
    --paper: #faf6fa;
    --paper-2: #f9eff7;
    --paper-3: #f2e4f0;
    --paper-card: #ffffff;
    --ink: #1f121d;
    --muted: #51424f;
    --muted-2: #736371;
    --muted-3: #b5a8b3;
    --line: #eadce8;
    --line-2: #d2c5d0;
    --accent: #9262c4;
    --accent-2: #754e9d;
    --accent-soft: #f5eeff;
    --accent-glow: rgba(146, 98, 196, 0.16);
    --selection-bg: #e1cafe;
  }
  :root[data-palette="plum"][data-mode="dark"],
  body[data-palette="plum"][data-mode="dark"] {
    --paper: #130a12;
    --paper-2: #221821;
    --paper-3: #2c222b;
    --paper-card: #1a1119;
    --ink: #f0e2ee;
    --muted: #b9a8b7;
    --muted-2: #907f8e;
    --muted-3: #564a54;
    --line: #342a33;
    --line-2: #524650;
    --accent: #e5d2fe;
    --accent-2: #d3aefe;
    --accent-soft: rgba(229, 210, 254, 0.12);
    --accent-glow: rgba(229, 210, 254, 0.22);
    --selection-bg: rgba(229, 210, 254, 0.32);
    --ring-focus: 0 0 0 3px rgba(229, 210, 254, .3);
  }
  :root[data-palette="teal"]:not([data-mode="dark"]),
  body[data-palette="teal"]:not([data-mode="dark"]) {
    --paper: #f2f8fa;
    --paper-2: #e7f4f8;
    --paper-3: #d8ebf1;
    --paper-card: #ffffff;
    --ink: #03191e;
    --muted: #334a50;
    --muted-2: #536c72;
    --muted-3: #9cafb4;
    --line: #d0e3e8;
    --line-2: #b9ccd1;
    --accent: #098683;
    --accent-2: #016b69;
    --accent-soft: #d2f9f6;
    --accent-glow: rgba(9, 134, 131, 0.16);
    --selection-bg: #85e3df;
  }
  :root[data-palette="teal"][data-mode="dark"],
  body[data-palette="teal"][data-mode="dark"] {
    --paper: #020f12;
    --paper-2: #0e1d21;
    --paper-3: #18272b;
    --paper-card: #07161a;
    --ink: #d6eaef;
    --muted: #97b1b8;
    --muted-2: #6f888e;
    --muted-3: #405155;
    --line: #202f33;
    --line-2: #3c4d51;
    --accent: #6ceee9;
    --accent-2: #65ceca;
    --accent-soft: rgba(108, 238, 233, 0.12);
    --accent-glow: rgba(108, 238, 233, 0.22);
    --selection-bg: rgba(108, 238, 233, 0.32);
    --ring-focus: 0 0 0 3px rgba(108, 238, 233, .3);
  }

  :root[data-palette="sage"]:not([data-mode="dark"]),
  body[data-palette="sage"]:not([data-mode="dark"]) {
    --paper: #f2f9f3;
    --paper-2: #e9f5ea;
    --paper-3: #ddece0;
    --paper-card: #ffffff;
    --ink: #0b190e;
    --muted: #3a4a3d;
    --muted-2: #5b6c5e;
    --muted-3: #a2afa4;
    --line: #d5e3d7;
    --line-2: #beccc0;
    --accent: #568262;
    --accent-2: #44684d;
    --accent-soft: #ddf8e3;
    --accent-glow: rgba(86, 130, 98, 0.16);
    --selection-bg: #a4e2b3;
  }
  :root[data-palette="sage"][data-mode="dark"],
  body[data-palette="sage"][data-mode="dark"] {
    --paper: #060f08;
    --paper-2: #131d15;
    --paper-3: #1d271f;
    --paper-card: #0c160e;
    --ink: #d9ebdb;
    --muted: #9fb1a2;
    --muted-2: #778879;
    --muted-3: #455147;
    --line: #253027;
    --line-2: #414d43;
    --accent: #b6e6c1;
    --accent-2: #a0c7a9;
    --accent-soft: rgba(182, 230, 193, 0.12);
    --accent-glow: rgba(182, 230, 193, 0.22);
    --selection-bg: rgba(182, 230, 193, 0.32);
    --ring-focus: 0 0 0 3px rgba(182, 230, 193, .3);
  }

  /* Palette SWATCH tokens — the picker previews both dimensions a palette
     changes (paper AND accent), because Sand differs from Console only in the
     paper: two accent-only swatches would look identical. Declared here, next
     to the blocks they describe, and PINNED equal to them by a tripwire — the
     first hand-typed version of this block had already drifted from the
     generated hexes when it was written. Redefined in dark so a swatch shows
     what the rep will actually get. */
  :root {
    --pal-console-paper: #f6f7f9;  --pal-console-accent: #0f8a52;
    --pal-sand-paper: #faf7f2;  --pal-sand-accent: #0d8a52;
    --pal-sage-paper: #f2f9f3;  --pal-sage-accent: #568262;
    --pal-plum-paper: #faf6fa;  --pal-plum-accent: #9262c4;
    --pal-teal-paper: #f2f8fa;  --pal-teal-accent: #098683;
  }
  :root[data-mode="dark"], body[data-mode="dark"] {
    --pal-console-paper: #0a0d14;  --pal-console-accent: #7af2a1;
    --pal-sand-paper: #120c04;  --pal-sand-accent: #87efb1;
    --pal-sage-paper: #060f08;  --pal-sage-accent: #b6e6c1;
    --pal-plum-paper: #130a12;  --pal-plum-accent: #e5d2fe;
    --pal-teal-paper: #020f12;  --pal-teal-accent: #6ceee9;
  }

  /* ═══════════════════════════════════════════════════════════════════
     WARM-PAPER UTILITY CLASSES
     ───────────────────────────────────────────────────────────────────
     Shared layout + chrome primitives consumed by every tool. Time
     clock uses these alongside its view-specific `.card` / `.metric-
     card` / `.day-card` / etc. classes; future tools should reach for
     these first before adding tool-local variants.
     ═══════════════════════════════════════════════════════════════════ */

  /* App bar — top edge of a view; carries breadcrumb + kicker + actions */
  .app-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 18px 0 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .app-bar-left  { min-width: 0; }
  .app-bar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  /* ≤540px (the shell breakpoint): the right-hand control drops UNDER the
     title instead of squeezing the subtitle into a ~150px column beside a
     flex-shrink:0 preset strip — MEASURED on the first Punctuality mobile
     shoot (design handoff PR 3, 2026-09-02). The A2 rule: a row that must
     stack needs a real viewport breakpoint. */
  @media (max-width: 540px) {
    .app-bar { flex-wrap: wrap; }
    .app-bar-right { flex-basis: 100%; }
  }
  .breadcrumb {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .breadcrumb .crumb-sep { opacity: .5; }
  .breadcrumb .crumb-current { color: var(--ink); }

  /* Section kicker — small mono-uppercase label that sits above a title */
  .section-kicker {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); letter-spacing: .14em; text-transform: uppercase;
    margin-bottom: 6px;
    display: inline-flex; align-items: center; gap: 8px;
  }

  /* Display title — Inter Tight semibold (600). Bumped from 500 in
     Round 2 to match the mockup density across Clock/Time/Manage/Metrics. */
  .display-title {
    font-family: var(--display);
    font-size: 28px; font-weight: 600;
    letter-spacing: -.02em; line-height: 1.15;
    color: var(--ink); margin: 0;
  }
  .display-title.lg { font-size: 36px; }
  .display-title.xl { font-size: 44px; }

  /* Panel — hairline-bordered container; the warm-paper successor to .card */
  .panel {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  .panel.dense  { padding: 14px 16px; }
  .panel.flush  { padding: 0; }
  .panel.tinted { background: var(--paper-2); }
  .panel[data-tone="accent"]      { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--accent); }
  .panel[data-tone="sage"]        { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--good); }
  .panel[data-tone="warn"]        { box-shadow: var(--shadow-sm), inset 3px 0 0 var(--warn); }
