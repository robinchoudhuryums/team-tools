<style>
  /* ── Intake tool (PPD + PMD/PAP account creation) ────────────────────── */
  .intk-wrap { max-width: 920px; margin: 0 auto; }
  .intk-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .intk-bar .grow { flex: 1; }
  .intk-lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .intk-lang button { background: var(--paper-2); border: none; padding: 6px 12px; cursor: pointer; font: inherit; color: var(--muted); }
  .intk-lang button.on { background: var(--accent); color: #fff; }
  .intk-patient { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .intk-patient label { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .intk-patient input { padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--paper-card); color: var(--ink); }
  .intk-grid { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper-card); }
  .intk-head { background: var(--brand, #223b5d); color: #fff; padding: 9px 14px; font-weight: 700; font-size: .9rem; }
  .intk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 14px; align-items: center; border-top: 1px solid var(--line); }
  .intk-row:first-child { border-top: none; }
  .intk-row .q { font-size: .88rem; color: var(--ink); font-weight: 600; }
  .intk-row.secondary .q { font-weight: 400; font-style: italic; color: var(--muted); padding-left: 18px; }
  .intk-row input[type=text], .intk-row select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; font: inherit; background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; }
  .intk-row .ck { display: inline-flex; align-items: center; gap: 7px; font-size: .85rem; color: var(--muted); }
  .intk-actions { display: flex; gap: 10px; margin-top: 16px; }
  /* preview modal */
  .intk-modal { width: min(860px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .intk-modal .body { overflow: auto; padding: 4px 2px; }
  .intk-prev { border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 46vh; background: #fff; }
  .intk-recpanel { margin-top: 14px; }
  .intk-rec { display: flex; align-items: flex-start; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
  .intk-rec .star { font-size: 22px; color: #ccc; cursor: pointer; line-height: 1; user-select: none; }
  .intk-rec .star.on { color: #FFD700; }
  .intk-rec .meta { flex: 1; }
  .intk-rec .code { font-weight: 700; }
  .intk-rec .just { font-size: .82rem; color: var(--muted); margin-top: 3px; }
  .intk-rec img { width: 64px; height: auto; border: 1px solid var(--line); border-radius: 4px; }
  .intk-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 12px; }
  .intk-foot .grow { flex: 1; }
  .intk-drop { border: 2px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; color: var(--muted); font-size: .8rem; cursor: pointer; }
  .intk-drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .intk-gallery { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .intk-thumb { position: relative; width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .intk-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .intk-thumb .rm { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--danger, #c13030); color: #fff; font-size: 11px; line-height: 16px; text-align: center; cursor: pointer; }
  :root[data-compact] .intk-row { grid-template-columns: 1fr; }
  /* bespoke buttons (the app styles controls per-view; no global .btn system) */
  .intk-btn { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper-2); color: var(--ink); font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .intk-btn:hover { background: var(--paper-card); }
  .intk-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .intk-btn.primary:hover { filter: brightness(1.05); }
  .intk-btn:disabled { opacity: .6; cursor: default; }
  .intk-modal .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .intk-modal .head h3 { margin: 0; font-size: 1rem; }
  .intk-modal .xclose { background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 6px; }
  .intk-modal .xclose:hover { background: var(--paper-2); color: var(--ink); }
</style>

// conditional-formatting answer keys, so the email coloring matches).

// ── PPD view ──────────────────────────────────────────────────────────────
function enterIntakePpdView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  var lang = INTAKE_STATE.ppd.lang;
  area.innerHTML =
    (COMPACT_MODE ? '<div class="compact-header">' + icon('send', 16) + ' PPD</div>' : '') +
    '<div class="intk-wrap">' +
      (COMPACT_MODE ? '' : '<div class="view-title-row"><h2>PPD — Patient Profile & Recommendation</h2></div>') +
      '<div class="intk-bar">' +
        intakeLangToggleHtml_('ppd') +
        '<span class="grow"></span>' +
      '</div>' +
      '<div class="intk-patient">' +
        '<label for="intk-ppd-patient">Patient Name &amp; Trx#</label>' +
        '<input type="text" id="intk-ppd-patient" placeholder="e.g. Jane Doe — TRX 12345" autocomplete="off">' +
      '</div>' +
      '<div class="intk-grid" id="intk-ppd-grid">' + intakeRenderPpdRows_(lang) + '</div>' +
      '<div class="intk-actions">' +
        '<button class="intk-btn primary" onclick="intakePpdPreview_()">' + icon('send', 14) + ' Preview &amp; Recommend</button>' +
        '<button class="intk-btn" onclick="intakeClearForm_(\'ppd\')">Clear</button>' +
      '</div>' +
    '</div>';
}

function intakeRenderPpdRows_(lang) {
  var qs = INTAKE_PPD_Q[lang] || INTAKE_PPD_Q.EN;
  var html = '';
  for (var i = 1; i < qs.length; i++) {
    var raw = qs[i];
    if (!raw || !String(raw).trim()) continue;
    var isSecondary = /^\s+/.test(raw);
    var text = String(raw).trim();
    var m = text.match(/^(\d+[a-z]?)\./);
    if (!m) { // section header (no leading number)
      html += '<div class="intk-head">' + esc(text) + '</div>';
      continue;
    }
    var qNum = m[1];
    html += '<div class="intk-row' + (isSecondary ? ' secondary' : '') + '" data-qnum="' + esc(qNum) + '">' +
      '<div class="q">' + esc(text) + '</div>' +
      '<input type="text" autocomplete="off" data-intk-qnum="' + esc(qNum) + '">' +
    '</div>';
  }
  return html;
}

// Collect { patientInfo, answers, rows, language } from the PPD DOM.
function intakeCollectPpd_() {
  var lang = INTAKE_STATE.ppd.lang;
  var qs = INTAKE_PPD_Q[lang] || INTAKE_PPD_Q.EN;
  var grid = document.getElementById('intk-ppd-grid');
  var answers = {};
  var rows = [];
  // walk the question array in order, pulling values from inputs by qNum
  for (var i = 1; i < qs.length; i++) {
    var raw = qs[i];
    if (!raw || !String(raw).trim()) continue;
    var isSecondary = /^\s+/.test(raw);
    var text = String(raw).trim();
    var m = text.match(/^(\d+[a-z]?)\./);
    if (!m) { rows.push({ isHeader: true, label: text }); continue; }
    var qNum = m[1];
    var input = grid ? grid.querySelector('input[data-intk-qnum="' + qNum + '"]') : null;
    var val = input ? input.value.trim() : '';
    answers[qNum] = val;
    rows.push({ qNum: qNum, label: text, value: val, isSecondary: isSecondary });
  }
  var patientEl = document.getElementById('intk-ppd-patient');
  return { patientInfo: patientEl ? patientEl.value.trim() : '', answers: answers, rows: rows, language: lang };
}

function intakePpdPreview_() {
  var payload = intakeCollectPpd_();
  if (!payload.patientInfo) { showToast('Enter the Patient Name & Trx# first.', 'toast-warn'); return; }
  var requested = currentView;
  showToast('Building preview…', '');
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      if (!res || res.error) { showToast((res && res.error) || 'Preview failed.', 'toast-error'); return; }
      INTAKE_STATE.preview = { formType: 'PPD', bodyHash: res.bodyHash, subject: res.subject, recommendations: res.recommendations, payload: payload };
      intakeOpenPpdPreviewModal_(res.html, res.recommendations);
    })
    .withFailureHandler(function (err) { if (currentView === requested) showToast('Preview failed: ' + (err.message || err), 'toast-error'); })
    .intakePreviewPPD(payload);
}

function intakeOpenPpdPreviewModal_(html, recs) {
  if (!INTAKE_STATE.ppd.agents) {
    google.script.run.withSuccessHandler(function (r) {
      INTAKE_STATE.ppd.agents = (r && r.agents) || [];
      intakeBuildPpdModal_(html, recs);
    }).withFailureHandler(function () { INTAKE_STATE.ppd.agents = []; intakeBuildPpdModal_(html, recs); }).getIntakeAgents();
  } else {
    intakeBuildPpdModal_(html, recs);
  }
}

function intakeBuildPpdModal_(html, recs) {
  var items = [].concat((recs && recs.complex) || [], (recs && recs.standard) || []);
  var panel = items.length
    ? items.map(function (p) {
        var id = String(p.hcpcs).replace(/\s+/g, '-');
        return '<div class="intk-rec" data-rec-id="' + esc(id) + '">' +
          '<span class="star" data-star="' + esc(id) + '" onclick="intakeToggleStar_(this)" title="Mark preferred">&#9733;</span>' +
          (p.imageUrl ? '<img src="' + esc(p.imageUrl) + '" alt="">' : '') +
          '<div class="meta"><div class="code">' + esc(p.hcpcs) + '</div><div class="just">' + esc(intakeStripTags_(p.justification)) + '</div></div>' +
          '<select class="status-sel" data-status="' + esc(id) + '">' +
            '<option value="none">— No selection —</option>' +
            '<option value="accepted">Accepted</option>' +
            '<option value="undecided">Undecided/Maybe</option>' +
            '<option value="rejected">Rejected</option>' +
          '</select>' +
        '</div>';
      }).join('')
    : '<p style="color:var(--muted);font-style:italic;">No products matched the provided answers.</p>';

  var agentOpts = '<option value="all">All Agents</option>' +
    (INTAKE_STATE.ppd.agents || []).map(function (a) { return '<option value="agent:' + esc(a.id) + '">' + esc(a.name) + '</option>'; }).join('');

  var body =
    '<div class="intk-prev">' + html + '</div>' +
    '<div class="intk-recpanel"><h4 style="margin:14px 0 8px;">Mark recommendations</h4>' + panel + '</div>' +
    '<div class="intk-foot">' +
      '<label><strong>Send to:</strong></label>' +
      '<select id="intk-ppd-recipient">' + agentOpts + '</select>' +
      '<span class="grow"></span>' +
      '<button class="intk-btn" data-intk-close="1">Cancel</button>' +
      '<button class="intk-btn primary" id="intk-ppd-send" onclick="intakePpdSend_()">' + icon('send', 14) + ' Send Email</button>' +
    '</div>';
  intakeOpenModal_('PPD Preview & Send', body);
}

function intakeToggleStar_(el) {
  var id = el.getAttribute('data-star');
  document.querySelectorAll('.intk-rec .star').forEach(function (s) { if (s !== el) s.classList.remove('on'); });
  el.classList.toggle('on');
}

function intakeGatherSelections_() {
  var sel = {};
  document.querySelectorAll('.intk-rec').forEach(function (row) {
    var id = row.getAttribute('data-rec-id');
    var statusEl = row.querySelector('.status-sel');
    var starEl = row.querySelector('.star');
    sel[id] = { status: statusEl ? statusEl.value : 'none', preferred: !!(starEl && starEl.classList.contains('on')) };
  });
  return sel;
}

function intakePpdSend_() {
  var st = INTAKE_STATE.preview;
  if (!st || st.formType !== 'PPD') { showToast('Preview expired — please preview again.', 'toast-warn'); return; }
  var recEl = document.getElementById('intk-ppd-recipient');
  var val = recEl ? recEl.value : 'all';
  var spec = val === 'all' ? { kind: 'all' } : { kind: 'agent', id: val.replace(/^agent:/, '') };
  st.payload.selections = intakeGatherSelections_();
  var btn = document.getElementById('intk-ppd-send');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { if (btn) { btn.disabled = false; btn.innerHTML = icon('send', 14) + ' Send Email'; } showToast((res && res.error) || 'Send failed.', 'toast-error'); return; }
      intakeCloseModal_();
      intakeClearForm_('ppd');
      showToast('PPD emailed to ' + res.recipient, 'toast-success');
    })
    .withFailureHandler(function (err) { if (btn) { btn.disabled = false; btn.innerHTML = icon('send', 14) + ' Send Email'; } showToast('Send failed: ' + (err.message || err), 'toast-error'); })
    .intakeSendPPD(st.payload, spec, st.bodyHash);
}

// ── Account-creation views (PMD / PAP share machinery) ────────────────────
function enterIntakePmdView(area) { intakeEnterAcct_('pmd', 'PMD Account Creation', area); }
function enterIntakePapView(area) { intakeEnterAcct_('pap', 'PAP Account Creation', area); }

function intakeAcctBank_(form) { return form === 'pap' ? INTAKE_PAP_Q : INTAKE_PMD_Q; }
function intakeAcctLayout_(form) { return form === 'pap' ? INTAKE_PAP_CLIENT : INTAKE_PMD_CLIENT; }

function intakeEnterAcct_(form, title, area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  var lang = INTAKE_STATE[form].lang;
  area.innerHTML =
    (COMPACT_MODE ? '<div class="compact-header">' + icon('user', 16) + ' ' + esc(title) + '</div>' : '') +
    '<div class="intk-wrap">' +
      (COMPACT_MODE ? '' : '<div class="view-title-row"><h2>' + esc(title) + '</h2></div>') +
      '<div class="intk-bar">' + intakeLangToggleHtml_(form) + '<span class="grow"></span></div>' +
      '<div class="intk-grid" id="intk-' + form + '-grid">' + intakeRenderAcctRows_(form, lang) + '</div>' +
      '<div class="intk-actions">' +
        '<button class="intk-btn primary" onclick="intakeAcctPreview_(\'' + form + '\')">' + icon('send', 14) + ' Preview &amp; Send</button>' +
        '<button class="intk-btn" onclick="intakeClearForm_(\'' + form + '\')">Clear</button>' +
      '</div>' +
    '</div>';
}

function intakeRenderAcctRows_(form, lang) {
  var qs = intakeAcctBank_(form)[lang] || intakeAcctBank_(form).EN;
  var L = intakeAcctLayout_(form);
  var html = '';
  for (var i = 0; i < qs.length; i++) {
    var label = String(qs[i] || '');
    if (L.headers.indexOf(i) >= 0) { html += '<div class="intk-head">' + esc(label) + '</div>'; continue; }
    var isSecondary = L.secondary.indexOf(i) >= 0;
    var control;
    if (L.checkboxes.indexOf(i) >= 0) {
      control = '<label class="ck"><input type="checkbox" data-intk-idx="' + i + '"> Yes</label>';
    } else if (L.selects[i]) {
      control = '<select data-intk-idx="' + i + '">' + L.selects[i].map(function (o) { return '<option value="' + esc(o) + '">' + esc(o || '— select —') + '</option>'; }).join('') + '</select>';
    } else {
      control = '<input type="text" autocomplete="off" data-intk-idx="' + i + '">';
    }
    html += '<div class="intk-row' + (isSecondary ? ' secondary' : '') + '"><div class="q">' + esc(label) + '</div>' + control + '</div>';
  }
  return html;
}

// DOB is form index 5 for both PMD & PAP; patient name is index 1.
function intakeCollectAcct_(form) {
  var lang = INTAKE_STATE[form].lang;
  var qs = intakeAcctBank_(form)[lang] || intakeAcctBank_(form).EN;
  var L = intakeAcctLayout_(form);
  var grid = document.getElementById('intk-' + form + '-grid');
  var rows = [], answers = {};
  for (var i = 0; i < qs.length; i++) {
    var label = String(qs[i] || '');
    if (L.headers.indexOf(i) >= 0) { rows.push({ qIndex: i, label: label, isHeader: true }); continue; }
    var el = grid ? grid.querySelector('[data-intk-idx="' + i + '"]') : null;
    var val;
    if (el && el.type === 'checkbox') val = el.checked ? 'TRUE' : 'FALSE';
    else val = el ? String(el.value).trim() : '';
    answers[i] = val;
    rows.push({ qIndex: i, label: label, value: val, isSecondary: L.secondary.indexOf(i) >= 0 });
  }
  var nameEl = grid ? grid.querySelector('[data-intk-idx="1"]') : null;
  var dobEl = grid ? grid.querySelector('[data-intk-idx="5"]') : null;
  return {
    patientInfo: nameEl ? String(nameEl.value).trim() : '',
    dob: dobEl ? String(dobEl.value).trim() : '',
    answers: answers, rows: rows, language: lang,
  };
}

function intakeAcctPreview_(form) {
  var payload = intakeCollectAcct_(form);
  if (!payload.patientInfo) { showToast('Enter the Patient Full Name first.', 'toast-warn'); return; }
  INTAKE_STATE[form].images = [];
  var requested = currentView;
  var fn = form === 'pap' ? 'intakePreviewPAP' : 'intakePreviewPMD';
  showToast('Building preview…', '');
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      if (!res || res.error) { showToast((res && res.error) || 'Preview failed.', 'toast-error'); return; }
      INTAKE_STATE.preview = { formType: form.toUpperCase(), form: form, bodyHash: res.bodyHash, subject: res.subject, payload: payload };
      intakeBuildAcctModal_(form, res.html);
    })
    .withFailureHandler(function (err) { if (currentView === requested) showToast('Preview failed: ' + (err.message || err), 'toast-error'); })
    [fn](payload);
}

function intakeBuildAcctModal_(form, html) {
  var defLabel = form === 'pap' ? 'Default (Sleep)' : 'Default (Sales)';
  var agentOpts = (INTAKE_STATE.ppd.agents || []).map(function (a) { return '<option value="agent:' + esc(a.id) + '">' + esc(a.name) + '</option>'; }).join('');
  var body =
    '<div class="intk-prev">' + html + '</div>' +
    '<div class="intk-drop" id="intk-drop" tabindex="0">' + icon('upload', 14) + ' Click, drag &amp; drop, or paste (Ctrl+V) images</div>' +
    '<input type="file" id="intk-file" accept="image/*" multiple style="display:none">' +
    '<div class="intk-gallery" id="intk-gallery"></div>' +
    '<div class="intk-foot">' +
      '<label><strong>Send to:</strong></label>' +
      '<select id="intk-acct-recipient"><option value="default">' + esc(defLabel) + '</option>' + agentOpts + '<option value="custom">Custom email…</option></select>' +
      '<input type="email" id="intk-acct-custom" placeholder="recipient@…" style="display:none;padding:7px 10px;border:1px solid var(--line);border-radius:7px;">' +
      '<span class="grow"></span>' +
      '<button class="intk-btn" data-intk-close="1">Cancel</button>' +
      '<button class="intk-btn primary" id="intk-acct-send" onclick="intakeAcctSend_(\'' + form + '\')">' + icon('send', 14) + ' Send Email</button>' +
    '</div>';
  intakeOpenModal_((form.toUpperCase()) + ' Preview & Send', body);

  // load agents lazily (shared cache on ppd.agents) so the dropdown fills
  if (!INTAKE_STATE.ppd.agents) {
    google.script.run.withSuccessHandler(function (r) {
      INTAKE_STATE.ppd.agents = (r && r.agents) || [];
      var sel = document.getElementById('intk-acct-recipient');
      if (sel) {
        var custom = sel.querySelector('option[value="custom"]');
        (INTAKE_STATE.ppd.agents || []).forEach(function (a) {
          var o = document.createElement('option'); o.value = 'agent:' + a.id; o.textContent = a.name;
          sel.insertBefore(o, custom);
        });
      }
    }).getIntakeAgents();
  }

  var recSel = document.getElementById('intk-acct-recipient');
  if (recSel) recSel.addEventListener('change', function () {
    var c = document.getElementById('intk-acct-custom');
    if (c) c.style.display = this.value === 'custom' ? 'inline-block' : 'none';
  });
  intakeSetupImageUpload_(form);
}

function intakeAcctSend_(form) {
  var st = INTAKE_STATE.preview;
  if (!st || st.form !== form) { showToast('Preview expired — please preview again.', 'toast-warn'); return; }
  var recSel = document.getElementById('intk-acct-recipient');
  var val = recSel ? recSel.value : 'default';
  var spec;
  if (val === 'default') spec = { kind: 'default' };
  else if (val === 'custom') {
    var custom = document.getElementById('intk-acct-custom');
    spec = { kind: 'custom', email: custom ? custom.value.trim() : '' };
    if (!spec.email) { showToast('Enter a recipient email.', 'toast-warn'); return; }
  } else spec = { kind: 'agent', id: val.replace(/^agent:/, '') };

  var images = INTAKE_STATE[form].images || [];
  var fn = form === 'pap' ? 'intakeSendPAP' : 'intakeSendPMD';
  var btn = document.getElementById('intk-acct-send');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { if (btn) { btn.disabled = false; btn.innerHTML = icon('send', 14) + ' Send Email'; } showToast((res && res.error) || 'Send failed.', 'toast-error'); return; }
      intakeCloseModal_();
      intakeClearForm_(form);
      showToast(form.toUpperCase() + ' emailed to ' + res.recipient, 'toast-success');
    })
    .withFailureHandler(function (err) { if (btn) { btn.disabled = false; btn.innerHTML = icon('send', 14) + ' Send Email'; } showToast('Send failed: ' + (err.message || err), 'toast-error'); })
    [fn](st.payload, spec, images, st.bodyHash);
}

// ── Image upload (PMD/PAP) ────────────────────────────────────────────────
function intakeSetupImageUpload_(form) {
  var drop = document.getElementById('intk-drop');
  var fileInput = document.getElementById('intk-file');
  if (!drop || !fileInput) return;
  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { intakeHandleFiles_(form, this.files); this.value = ''; });
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); }, false);
  });
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function () { drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function () { drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { intakeHandleFiles_(form, e.dataTransfer.files); });
  drop._intkPaste = function (e) {
    var items = (e.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) { intakeProcessImage_(form, items[i].getAsFile()); e.preventDefault(); }
    }
  };
  document.addEventListener('paste', drop._intkPaste);
}

function intakeHandleFiles_(form, files) {
  if (!files) return;
  for (var i = 0; i < files.length; i++) { if (files[i].type.indexOf('image/') === 0) intakeProcessImage_(form, files[i]); }
}

function intakeProcessImage_(form, file) {
  if (!file) return;
  var max = 12;
  if ((INTAKE_STATE[form].images || []).length >= max) { showToast('Up to ' + max + ' images.', 'toast-warn'); return; }
  var reader = new FileReader();
  reader.onload = function (e) { INTAKE_STATE[form].images.push(e.target.result); intakeRenderGallery_(form); };
  reader.readAsDataURL(file);
}

function intakeRenderGallery_(form) {
  var g = document.getElementById('intk-gallery');
  if (!g) return;
  g.innerHTML = (INTAKE_STATE[form].images || []).map(function (src, idx) {
    return '<div class="intk-thumb"><img src="' + esc(src) + '" alt=""><span class="rm" onclick="intakeRemoveImage_(\'' + form + '\',' + idx + ')">&#10005;</span></div>';
  }).join('');
}

function intakeRemoveImage_(form, idx) {
  INTAKE_STATE[form].images.splice(idx, 1);
  intakeRenderGallery_(form);
}

// ── Shared UI helpers ─────────────────────────────────────────────────────
function intakeLangToggleHtml_(form) {
  var lang = INTAKE_STATE[form].lang;
  return '<div class="intk-lang">' +
    '<button class="' + (lang === 'EN' ? 'on' : '') + '" onclick="intakeSetLang_(\'' + form + '\',\'EN\')">English</button>' +
    '<button class="' + (lang === 'ES' ? 'on' : '') + '" onclick="intakeSetLang_(\'' + form + '\',\'ES\')">Español</button>' +
  '</div>';
}

function intakeSetLang_(form, lang) {
  if (INTAKE_STATE[form].lang === lang) return;
  // preserve in-progress answers across the language flip (keys are qNum/qIndex)
  var snapshot = (form === 'ppd') ? intakeCollectPpd_() : intakeCollectAcct_(form);
  INTAKE_STATE[form].lang = lang;
  if (form === 'ppd') enterIntakePpdView(); else intakeEnterAcct_(form, form === 'pap' ? 'PAP Account Creation' : 'PMD Account Creation');
  intakeRestoreAnswers_(form, snapshot);
}

function intakeRestoreAnswers_(form, snapshot) {
  var grid = document.getElementById('intk-' + form + '-grid');
  if (!grid || !snapshot) return;
  if (form === 'ppd') {
    var pat = document.getElementById('intk-ppd-patient');
    if (pat) pat.value = snapshot.patientInfo || '';
    Object.keys(snapshot.answers || {}).forEach(function (qNum) {
      var el = grid.querySelector('input[data-intk-qnum="' + qNum + '"]');
      if (el) el.value = snapshot.answers[qNum];
    });
  } else {
    Object.keys(snapshot.answers || {}).forEach(function (idx) {
      var el = grid.querySelector('[data-intk-idx="' + idx + '"]');
      if (!el) return;
      if (el.type === 'checkbox') el.checked = snapshot.answers[idx] === 'TRUE';
      else el.value = snapshot.answers[idx];
    });
  }
}

function intakeClearForm_(form) {
  INTAKE_STATE[form].images = [];
  if (form === 'ppd') enterIntakePpdView();
  else intakeEnterAcct_(form, form === 'pap' ? 'PAP Account Creation' : 'PMD Account Creation');
}

function intakeStripTags_(s) { return String(s == null ? '' : s).replace(/<[^>]*>/g, ''); }

// Minimal modal built on the shared .overlay vocabulary (Escape-close + focus
// trap handled in script_core). Single instance; cleans up its paste listener.
function intakeOpenModal_(title, bodyHtml) {
  intakeCloseModal_();
  var ov = document.createElement('div');
  ov.className = 'overlay open';
  ov.id = 'intk-modal-overlay';
  ov.innerHTML = '<div class="modal intk-modal" role="dialog" aria-modal="true">' +
    '<div class="head"><h3>' + esc(title) + '</h3><button class="xclose" data-intk-close="1" aria-label="Close">' + icon('x', 16) + '</button></div>' +
    '<div class="body">' + bodyHtml + '</div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function (e) {
    if (e.target === ov || (e.target.closest && e.target.closest('[data-intk-close]'))) intakeCloseModal_();
  });
}

function intakeCloseModal_() {
  var ov = document.getElementById('intk-modal-overlay');
  if (!ov) return;
  var drop = document.getElementById('intk-drop');
  if (drop && drop._intkPaste) document.removeEventListener('paste', drop._intkPaste);
  ov.remove();
}
</script>
