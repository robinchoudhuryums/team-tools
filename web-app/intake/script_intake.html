  grp.setAttribute('data-val', intakeMultiParse_(val).join(', '));   // normalize (trim + drop empties)
  intakeCondRender_(grp);
}
// PURE — toggle a value in a condition-selection array (add if absent → append,
// remove if present). No exclusive logic (condition lists are free multi-select).
function intakeCondToggleValue_(current, value) {
  current = (current || []).slice();
  var i = current.indexOf(value);
  if (i >= 0) current.splice(i, 1); else current.push(value);
  return current;
}

// ── Pure serialization helpers (Node-pinned) ──────────────────────────────
// PURE — multi-select toggle with exclusive-option logic. current = selected
// values; value = clicked value; exclusive = the value that clears the rest.
function intakeMultiToggle_(current, value, exclusive) {
  current = (current || []).slice();
  var has = current.indexOf(value) >= 0;
  if (exclusive && value === exclusive) return has ? [] : [value];   // exclusive → only it (re-click clears)
  if (exclusive) { var ei = current.indexOf(exclusive); if (ei >= 0) current.splice(ei, 1); }  // a normal pick drops the exclusive
  if (has) current.splice(current.indexOf(value), 1);
  else current.push(value);
  return current;
}
// PURE — serialize selected values in OPTION order → deterministic comma string.
function intakeMultiSerialize_(selected, optionValues) {
  selected = selected || [];
  return (optionValues || []).filter(function (v) { return selected.indexOf(v) >= 0; }).join(', ');
}
// PURE — parse a comma string → trimmed, non-empty value array.
function intakeMultiParse_(str) {
  return String(str == null ? '' : str).split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
}
// PURE — reveal serialize/parse. Value: '' | '<option>' | '<revealOn>: <text>'.
function intakeRevealSerialize_(option, text, revealOn) {
  option = String(option || '');
  if (!option) return '';
  if (option === revealOn) { text = String(text || '').trim(); return text ? (option + ': ' + text) : option; }
  return option;
}
function intakeRevealParse_(str, revealOn) {
  str = String(str == null ? '' : str).trim();
  if (!str) return { option: '', text: '' };
  var pfx = String(revealOn || '') + ': ';
  if (revealOn && str === revealOn) return { option: revealOn, text: '' };
  if (revealOn && str.indexOf(pfx) === 0) return { option: revealOn, text: str.substring(pfx.length) };
  return { option: str, text: '' };
}
// PURE — Yes/No-reveals-multi (Q45). Value: '' | 'No' | '<revealOn>' |
// '<revealOn>: SubA, SubB'. `subs` are joined in the order passed (option order).
function intakeYnRevealSerialize_(yn, subs, revealOn) {
  yn = String(yn || '');
  if (!yn) return '';
  if (yn !== revealOn) return yn;                                  // 'No'
  subs = (subs || []).filter(function (s) { return s; });
  return subs.length ? (yn + ': ' + subs.join(', ')) : yn;        // 'Yes' | 'Yes: A, B'
}
function intakeYnRevealParse_(str, revealOn) {
  str = String(str == null ? '' : str).trim();
  revealOn = String(revealOn || 'Yes');
  if (!str) return { yn: '', subs: [] };
  var pfx = revealOn + ':';
  if (str.indexOf(pfx) === 0) {
    return { yn: revealOn, subs: str.substring(pfx.length).split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s; }) };
  }
  if (str.toLowerCase() === revealOn.toLowerCase()) return { yn: revealOn, subs: [] };
  if (str.toLowerCase() === 'no') return { yn: 'No', subs: [] };
  return { yn: '', subs: [] };   // legacy free-text → unselected (raw text stays in the stored row)
}
// PURE — Yes/No-reveals-number (Q40 attendant hours). Value: '' | 'No' |
// 'Yes' | 'Yes: <n> <unit>'. `num` is digits-only (the input sanitizes, but
// serialize re-strips defensively so drafts round-trip clean).
function intakeYnNumSerialize_(yn, num, unit) {
  yn = String(yn || '');
  if (!yn) return '';
  if (yn !== 'Yes') return 'No';
  var digits = String(num == null ? '' : num).replace(/\D/g, '');
  if (!digits) return 'Yes';
  return 'Yes: ' + digits + (unit ? ' ' + unit : '');
}
function intakeYnNumParse_(str) {
  str = String(str == null ? '' : str).trim();
  if (!str) return { yn: '', num: '' };
  var low = str.toLowerCase();
  if (low === 'no') return { yn: 'No', num: '' };
  if (low === 'yes') return { yn: 'Yes', num: '' };
  if (low.indexOf('yes:') === 0) {
    var digits = str.substring(4).replace(/\D/g, '');
    return { yn: 'Yes', num: digits };
  }
  return { yn: '', num: '' };   // legacy free-text → unselected (raw text stays in the stored row)
}

function intakePpdAfterChange_() {
  intakePpdApplyReveals_(document.getElementById('intk-ppd-form'));
  intakePpdUpdateProgress_();
  intakeSaveDraft_('ppd');
}

// SVG progress ring for the PPD side rail (rendered once; the fg arc is updated
// live via stroke-dashoffset by intakePpdUpdateProgress_, with a CSS transition).
var INTK_RING_R = 40, INTK_RING_C = 2 * Math.PI * 40;
// Progress ring, per form. The fill color is form-specific (PPD blue / PMD
// orange / PAP purple via --intake-<form>) and the element ids are namespaced
// by form so PPD/PMD/PAP can each own a ring. PPD ids stay 'intk-ppd-ring-*'.
// Literal token strings per form — built as full names (not string-concatenated
// from the form key) because the design-token hygiene tripwire reads var() names
// statically and would otherwise see an incomplete/undefined token.
var INTAKE_RING_COLOR = { ppd: 'var(--intake-ppd)', pmd: 'var(--intake-pmd)', pap: 'var(--intake-pap)' };
function intakeRingHtml_(form) {
  var c = INTK_RING_C.toFixed(1);
  var color = INTAKE_RING_COLOR[form] || 'var(--accent)';
  return '<div class="intk-ring"><svg viewBox="0 0 96 96" aria-hidden="true">' +
    '<circle cx="48" cy="48" r="' + INTK_RING_R + '" fill="none" stroke="var(--paper-3)" stroke-width="8"></circle>' +
    '<circle id="intk-' + form + '-ring-fg" class="intk-ring-fg" cx="48" cy="48" r="' + INTK_RING_R + '" fill="none" ' +
      'stroke="' + color + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + c + '" ' +
      'stroke-dashoffset="' + c + '" transform="rotate(-90 48 48)"></circle>' +
    '</svg><div class="pct" id="intk-' + form + '-ring-pct">0%</div></div>';
}
// Shared ring/count updater — writes the per-form ring offset + % + "n / total".
function intakeRingSet_(form, answered, total) {
  var pct = total ? Math.round((answered / total) * 100) : 0;
  var c = document.getElementById('intk-' + form + '-count');
  var fg = document.getElementById('intk-' + form + '-ring-fg');
  var pctEl = document.getElementById('intk-' + form + '-ring-pct');
  if (c) c.textContent = answered + ' / ' + total;
  if (fg) fg.style.strokeDashoffset = (INTK_RING_C * (1 - pct / 100)).toFixed(1);
  if (pctEl) pctEl.textContent = pct + '%';
}

function intakePpdUpdateProgress_() {
  var root = document.getElementById('intk-ppd-form');
  if (!root) return;
  // Iterate the shared section structure so per-section stepper state and the
  // overall ring/count come from one count (main questions only — 31a/33a excluded).
  var secs = intakePpdSections_(INTAKE_STATE.ppd.lang);
  var total = 0, answered = 0;
  for (var s = 0; s < secs.length; s++) {
    var main = secs[s].mainQNums, sTotal = main.length, sAns = 0;
    for (var q = 0; q < main.length; q++) { if (intakePpdGetVal_(root, main[q])) sAns++; }
    total += sTotal; answered += sAns;
    var stepEl = document.querySelector('.intk-step[data-sec="' + s + '"]');
    if (stepEl) {
      stepEl.classList.toggle('is-done', sTotal > 0 && sAns === sTotal);
      stepEl.classList.toggle('is-partial', sAns > 0 && sAns < sTotal);
    }
    var fracEl = document.querySelector('[data-sec-frac="' + s + '"]');
    if (fracEl) fracEl.textContent = sTotal ? (sAns + '/' + sTotal) : '';
  }
  intakeRingSet_('ppd', answered, total);
}

// Collect { patientInfo, answers, rows, language } from the PPD DOM.
function intakeCollectPpd_() {
  var lang = INTAKE_STATE.ppd.lang;
  var qs = INTAKE_PPD_Q[lang] || INTAKE_PPD_Q.EN;
  var root = document.getElementById('intk-ppd-form');
  var answers = {};
  var rows = [];
  for (var i = 1; i < qs.length; i++) {
    var raw = qs[i];
    if (!raw || !String(raw).trim()) continue;
    var isSecondary = /^\s+/.test(raw);
    var text = String(raw).trim();
    var m = text.match(/^(\d+[a-z]?)\./);
    if (!m) { rows.push({ isHeader: true, label: text }); continue; }
    var qNum = m[1];
    var val = root ? intakePpdGetVal_(root, qNum) : '';
    answers[qNum] = val;
    rows.push({ qNum: qNum, label: text, value: val, isSecondary: isSecondary });
  }
  // Operator 2026-08-25: the notes pseudo-question. Always a row (a blank one
  // renders the same italic N/A as every other blank field); the server email
  // builder renders payload.rows verbatim (esc_'d), so no server change; the
  // engine ignores non-numeric keys; AnswersJson carries it to the Sent tab.
  var notesVal = root ? intakePpdGetVal_(root, 'notes') : '';
  var nlc = INTAKE_PPD_NOTES[lang] || INTAKE_PPD_NOTES.EN;
  answers.notes = notesVal;
  rows.push({ isHeader: true, label: nlc.title });
  rows.push({ qNum: 'notes', label: nlc.label, value: notesVal, isSecondary: false });
  var patientEl = document.getElementById('intk-ppd-patient');
  return { patientInfo: patientEl ? patientEl.value.trim() : '', answers: answers, rows: rows, language: lang };
}

// ── Strongly-recommended-field soft check (operator 2026-08-25) ────────────
// Row lookup for a recommended key (PPD qNum or account bank index).
function intakeRecwarnLocate_(form, key) {
  var root = intakeFormRoot_(form);
  if (!root) return null;
  var el = (form === 'ppd')
    ? root.querySelector('[data-qnum="' + key + '"],[data-intk-qnum="' + key + '"]')
    : root.querySelector('.intk-yn[data-idx="' + key + '"],[data-intk-idx="' + key + '"]');
  return el ? el.closest('.intk-row') : null;
}
// Short label for the confirm list (bank lookup, truncated).
function intakeRecwarnLabel_(form, key) {
  var lang = INTAKE_STATE[form].lang;
  var lbl = '';
  if (form === 'ppd') {
    var qs = INTAKE_PPD_Q[lang] || INTAKE_PPD_Q.EN;
    for (var i = 1; i < qs.length; i++) {
      var t = String(qs[i] || '').trim();
      var m = t.match(/^(\d+[a-z]?)\./);
      if (m && m[1] === String(key)) { lbl = t; break; }
    }
    if (!lbl) lbl = 'Q' + key;
  } else {
    var bank = intakeAcctBank_(form)[lang] || intakeAcctBank_(form).EN;
    lbl = String(bank[key] || '').trim();
  }
  return lbl.length > 60 ? lbl.substring(0, 57) + '\u2026' : lbl;
}
/** Soft validation before Preview: highlight blank strongly-recommended
 *  fields (INTAKE_RECOMMENDED — never any other blank field) and ask ONCE
 *  whether to continue. Resolves true = proceed. Never a hard block; a form
 *  with nothing flagged resolves true with zero UI. Marks clear themselves
 *  when the field gains a value. */
function intakeWarnRecommended_(form) {
  var root = intakeFormRoot_(form);
  if (root) root.querySelectorAll('.intk-row.intk-recwarn').forEach(function (r) {
    r.classList.remove('intk-recwarn');
    var n = r.querySelector('.intk-recwarn-note'); if (n) n.remove();
  });
  if (!root) return Promise.resolve(true);
  var getVal = (form === 'ppd')
    ? function (k) { return intakePpdGetVal_(root, k); }
    : function (k) { return intakeAcctGetVal_(root, k); };
  var blanks = intakeRecommendedBlanks_(form, getVal);
  var marked = [];
  blanks.forEach(function (b) {
    var row = intakeRecwarnLocate_(form, b.key);
    // Reveal-hidden rows are hidden via inline display:none on the ROW
    // (intakePpdApplyReveals_) — check that, not offsetParent, which is
    // layout-dependent (and always null in the jsdom harness).
    if (!row || row.style.display === 'none') return;   // reveal-hidden → not warnable
    row.classList.add('intk-recwarn');
    if (!row.querySelector('.intk-recwarn-note')) {
      var note = document.createElement('div');
      note.className = 'intk-recwarn-note';
      note.textContent = b.hoursOnly
        ? 'Strongly recommended \u2014 enter the hours for the Yes above'
        : 'Strongly recommended \u2014 fill if available';
      row.appendChild(note);
    }
    if (!row._recwarnBound) {
      row._recwarnBound = true;
      var clearIfFilled = function () {
        var v = String(getVal(b.key) == null ? '' : getVal(b.key)).trim();
        var stillBad = !v || (b.hoursOnly && v === 'Yes');
        if (!stillBad) {
          row.classList.remove('intk-recwarn');
          var n2 = row.querySelector('.intk-recwarn-note'); if (n2) n2.remove();
        }
      };
      row.addEventListener('input', clearIfFilled);
      // Toggle buttons fire no 'input'; defer past their own click handler.
      row.addEventListener('click', function () { setTimeout(clearIfFilled, 0); });
    }
    marked.push(b);
  });
  if (!marked.length) return Promise.resolve(true);
  var first = intakeRecwarnLocate_(form, marked[0].key);
  if (first && first.scrollIntoView) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  var names = marked.slice(0, 5).map(function (m) {
    return intakeRecwarnLabel_(form, m.key) + (m.hoursOnly ? ' (hours)' : '');
  });
  var msg = marked.length + ' strongly-recommended field(s) are blank:\n\u2022 ' + names.join('\n\u2022 ') +
    (marked.length > 5 ? '\n\u2026and ' + (marked.length - 5) + ' more' : '') +
    '\n\nThey are highlighted on the form. Continue to preview anyway?';
  return uiConfirm({ title: 'Recommended fields are blank', message: msg, confirmLabel: 'Continue anyway', cancelLabel: 'Go back' });
}

function intakePpdPreview_() {
  var payload = intakeCollectPpd_();
  if (!payload.patientInfo) { showToast('Enter the Patient Name & Trx# first.', 'toast-warn'); return; }
  intakeWarnRecommended_('ppd').then(function (ok) { if (ok) intakePpdPreviewGo_(payload); });
}
function intakePpdPreviewGo_(payload) {
  var requested = currentView;
  showToast('Building preview…', '');
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      if (!res || res.error) { showToast((res && res.error) || 'Preview failed.', 'toast-error'); return; }
      INTAKE_STATE.preview = { formType: 'PPD', bodyHash: res.bodyHash, subject: res.subject, recommendations: res.recommendations, payload: payload };
      intakeOpenPpdPreviewModal_(res.html, res.recommendations);
    })
    .withFailureHandler(function (err) { if (currentView === requested) showToast('Preview failed: ' + (err.message || err), 'toast-error'); })
    .intakePreviewPPD(payload);
}

function intakeOpenPpdPreviewModal_(html, recs) {
  if (!INTAKE_STATE.ppd.agents) {
    // E10 (cycle 10): guard the SECOND async hop too — the preview RPC's
    // handler is view-guarded, but on a cold agents cache this extra fetch
    // wasn't, so a slow getIntakeAgents popped the body-mounted PHI preview
    // modal over whatever view the rep had navigated to (the INT-5 class).
    var requestedView = currentView;
    google.script.run.withSuccessHandler(function (r) {
      INTAKE_STATE.ppd.agents = (r && r.agents) || [];
      if (currentView !== requestedView) return;
      intakeBuildPpdModal_(html, recs);
    }).withFailureHandler(function () {
      INTAKE_STATE.ppd.agents = [];
      if (currentView !== requestedView) return;
      intakeBuildPpdModal_(html, recs);
    }).getIntakeAgents();
  } else {
    intakeBuildPpdModal_(html, recs);
  }
}

function intakeBuildPpdModal_(html, recs) {
  var items = [].concat((recs && recs.complex) || [], (recs && recs.standard) || []);
  var panel = items.length
    ? items.map(function (p) {
        var id = String(p.hcpcs).replace(/\s+/g, '-');
        var httpOnly = intakeHttpOnly_;
        var imgUrl = httpOnly(p.imageUrl);
        var pdfUrl = httpOnly(p.pdfLink);
        // Image opens full-size in a new tab (agent can right-click/copy/save to
        // text the patient); code links to the brochure PDF.
        var imgHtml = imgUrl
          ? '<a href="' + imgUrl + '" target="_blank" rel="noopener" title="Open full image"><img src="' + imgUrl + '" alt="' + esc(p.hcpcs) + '"></a>'
          : '<div class="intk-rec-noimg">no image</div>';
        var codeHtml = pdfUrl
          ? '<a href="' + pdfUrl + '" target="_blank" rel="noopener" class="code code-link" title="Open brochure">' + esc(p.hcpcs) + ' ' + icon('popOut', 11) + '</a>'
          : '<span class="code">' + esc(p.hcpcs) + '</span>';
        var actions = '<div class="intk-rec-actions">';
        if (imgUrl) actions += '<button type="button" class="intk-rec-mini" data-img="' + imgUrl + '" onclick="intakeCopyImage_(this)">' + icon('copy', 11) + ' Copy image</button>';
        if (imgUrl) actions += '<button type="button" class="intk-rec-mini" data-copy="' + imgUrl + '" onclick="intakeCopyLink_(this)">Image link</button>';
        if (pdfUrl) actions += '<button type="button" class="intk-rec-mini" data-copy="' + pdfUrl + '" onclick="intakeCopyLink_(this)">Brochure link</button>';
        actions += '</div>';
        return '<div class="intk-rec" data-rec-id="' + esc(id) + '">' +
          // A1 + A11: keyboard-reachable toggle with its state exposed.
          '<button type="button" class="star" data-star="' + esc(id) + '" aria-pressed="false"' +
            ' onclick="intakeToggleStar_(this)" title="Mark preferred (starred in the email)"' +
            ' aria-label="Mark ' + esc(p.hcpcs) + ' preferred">&#9733;</button>' +
          imgHtml +
          '<div class="meta">' + codeHtml +
            '<div class="just">' + esc(intakeStripTags_(p.justification)) + '</div>' + actions +
          '</div>' +
          '<select class="status-sel" aria-label="Recommendation status for ' + esc(p.hcpcs) + '" data-status="' + esc(id) + '" onchange="intakeRecStatusChange_(this)" title="Marked on the email sent to the agent">' +
            '<option value="none">— No selection —</option>' +
            '<option value="accepted">Accepted</option>' +
            '<option value="undecided">Undecided/Maybe</option>' +
            '<option value="rejected">Rejected</option>' +
          '</select>' +
        '</div>';
      }).join('')
    : '<p style="color:var(--muted);font-style:italic;">No products matched the provided answers.</p>';

  // Custom email… mirrors the PMD/PAP picker (operator 2026-08-17): the shared
  // server resolver has accepted kind:'custom' (validated) all along — this
  // footer was the one send surface that never offered it.
  var agentOpts = '<option value="all">All Agents</option>' +
    (INTAKE_STATE.ppd.agents || []).map(function (a) { return '<option value="agent:' + esc(a.id) + '">' + esc(a.name) + '</option>'; }).join('') +
    '<option value="custom">Custom email&hellip;</option>';

  // Recommendations first (the agent shares these with the patient — image to
  // text, code to open the brochure), email-body preview below.
  var body =
    '<div class="intk-recpanel"><h4 style="margin:0 0 8px;">Qualifying Power Mobility Devices</h4>' +
      '<div style="font-size:.78rem;color:var(--muted);margin-bottom:8px;">Click an image to open it (copy/save to text the patient); click the code to open the brochure. Star + Accepted/Rejected ride into the email.</div>' +
      panel + '</div>' +
    '<details style="margin-top:12px;"><summary style="cursor:pointer;font-size:.82rem;color:var(--muted);">Preview the email body</summary><div class="intk-prev" style="margin-top:8px;">' + html + '</div></details>' +
    '<div class="intk-foot">' +
      '<label for="intk-ppd-recipient"><strong>Send to:</strong></label>' +
      '<select id="intk-ppd-recipient">' + agentOpts + '</select>' +
      '<input type="email" id="intk-ppd-custom" placeholder="recipient@&hellip;" aria-label="Custom recipient email" style="display:none">' +
      '<span class="grow"></span>' +
      '<button class="intk-btn" data-intk-close="1">Cancel</button>' +
      '<button class="intk-btn primary" id="intk-ppd-send" onclick="intakePpdSend_()">' + icon('send', 14) + ' Send Email</button>' +
    '</div>';
  intakeOpenModal_('PPD Preview & Send', body);

  // The custom input reveals only when chosen — the intk-acct picker's pattern.
  var recSel = document.getElementById('intk-ppd-recipient');
  if (recSel) recSel.addEventListener('change', function () {
    var c = document.getElementById('intk-ppd-custom');
    if (c) {
      c.style.display = this.value === 'custom' ? 'inline-block' : 'none';
      if (this.value === 'custom') c.focus();
    }
  });
}

function intakeToggleStar_(el) {
  var id = el.getAttribute('data-star');
  // A11: the star is single-select — clear every other one's class AND its
  // aria-pressed, then mirror this one's new state onto the attribute.
  document.querySelectorAll('.intk-rec .star').forEach(function (s) {
    if (s !== el) { s.classList.remove('on'); s.setAttribute('aria-pressed', 'false'); }
  });
  el.classList.toggle('on');
  el.setAttribute('aria-pressed', el.classList.contains('on') ? 'true' : 'false');
}

// §6 settle — recommendation status feedback. Accepted draws a check (positive,
// no dim); Rejected dims the row (matches the greyed-rejected email semantic);
// any other value clears the settle. Modal-local; no hot-path interaction.
function intakeRecStatusChange_(sel) {
  var row = sel.closest('.intk-rec');
  if (!row) return;
  unsettleRow_(row);   // clear any prior settle so accepted↔rejected switches cleanly
  if (sel.value === 'accepted')      settleRow_(row, null, { dim: false });
  else if (sel.value === 'rejected') settleRow_(row, null, { check: false });
}

// Copy a URL (image or brochure) to the clipboard so the agent can paste it
// into their texting tool. navigator.clipboard with a <textarea> execCommand
// fallback (the HtmlService iframe often blocks the async clipboard API).
function intakeCopyLink_(btn) {
  var txt = btn.getAttribute('data-copy') || '';
  if (!txt) return;
  function fallback() {
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('Link copied', 'toast-success');
    } catch (e) { showToast('Copy failed — ' + txt, 'toast-error'); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { showToast('Link copied', 'toast-success'); flashCopied(btn); }, fallback);
  } else { fallback(); flashCopied(btn); }
}

// Best-effort copy of the actual device IMAGE bytes (so it can be pasted
// straight into a text). Clipboard image-write is unreliable in the iframe and
// needs permissive CORS on the image host, so it falls back to opening the
// image in a new tab for a native right-click copy/save.
function intakeCopyImage_(btn) {
  var url = btn.getAttribute('data-img');
  if (!url) return;
  function openIt() { window.open(url, '_blank', 'noopener'); showToast('Opened image — right-click to copy/save', ''); }
  try {
    if (navigator.clipboard && window.ClipboardItem && window.fetch) {
      fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
        var item = {}; item[blob.type || 'image/png'] = blob;
        return navigator.clipboard.write([new ClipboardItem(item)]);
      }).then(function () { showToast('Image copied — paste into your text', 'toast-success'); })
        .catch(openIt);
      return;
    }
  } catch (e) {}
  openIt();
}

function intakeGatherSelections_() {
  var sel = {};
  document.querySelectorAll('.intk-rec').forEach(function (row) {
    var id = row.getAttribute('data-rec-id');
    var statusEl = row.querySelector('.status-sel');
    var starEl = row.querySelector('.star');
    sel[id] = { status: statusEl ? statusEl.value : 'none', preferred: !!(starEl && starEl.classList.contains('on')) };
  });
  return sel;
}

function intakePpdSend_() {
  var st = INTAKE_STATE.preview;
  if (!st || st.formType !== 'PPD') { showToast('Preview expired — please preview again.', 'toast-warn'); return; }
  var recEl = document.getElementById('intk-ppd-recipient');
  var val = recEl ? recEl.value : 'all';
  var spec;
  if (val === 'all') spec = { kind: 'all' };
  else if (val === 'custom') {
    var custom = document.getElementById('intk-ppd-custom');
    spec = { kind: 'custom', email: custom ? custom.value.trim() : '' };
    if (!spec.email) { showToast('Enter a recipient email.', 'toast-warn'); return; }
  } else spec = { kind: 'agent', id: val.replace(/^agent:/, '') };
  st.payload.selections = intakeGatherSelections_();
  var btn = document.getElementById('intk-ppd-send');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  var requestedView = currentView;   // M8 — late-success guard (CN loader pattern)
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { if (btn) { btn.disabled = false; btn.innerHTML = icon('send', 14) + ' Send Email'; } showToast((res && res.error) || 'Send failed.', 'toast-error'); return; }
      intakeCloseModal_();
      intakeClearDraft_('ppd');   // drop the persisted draft (PHI) on a successful send
      // Re-render the (now-cleared) form only if the rep is still on this
      // view — a late success after nav-away must not clobber #view-area.
      // State still resets so stale images can't ride into the next send.
      if (currentView === requestedView) intakeClearForm_('ppd');
      else { INTAKE_STATE.ppd.images = []; INTAKE_STATE.preview = null; }   // drop PHI payload after send (F3)
      // M-5 (cycle 10): the email sent but the PHI submission record didn't
      // persist — surface it loudly instead of a silent server-side warn.
      if (res.storeWarning) showToast(res.storeWarning, 'toast-warn');
      else showToast('PPD emailed to ' + res.recipient, 'toast-success');
      intakeAutoLogNote_('ppd', st.payload, res.recipient, st.recommendations, currentView === requestedView);
    })
    .withFailureHandler(function (err) { if (btn) { btn.disabled = false; btn.innerHTML = icon('send', 14) + ' Send Email'; } showToast('Send failed: ' + (err.message || err), 'toast-error'); })
    .intakeSendPPD(st.payload, spec, st.bodyHash);
}

// ── Account-creation views (PMD / PAP share machinery) ────────────────────
function enterIntakePmdView(area) { intakeEnterAcct_('pmd', 'PMD Account', area); }
function enterIntakePapView(area) { intakeEnterAcct_('pap', 'PAP Account', area); }

function intakeAcctBank_(form) { return form === 'pap' ? INTAKE_PAP_Q : INTAKE_PMD_Q; }
function intakeAcctLayout_(form) { return form === 'pap' ? INTAKE_PAP_CLIENT : INTAKE_PMD_CLIENT; }

function intakeEnterAcct_(form, title, area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  var lang = INTAKE_STATE[form].lang;
  area.innerHTML =
    intakeAppBar_(form, title) +
    '<div class="intk-ppd-layout">' +
      '<div class="intk-main">' +
        '<div class="intk-sections intk-cat-' + form + '" id="intk-' + form + '-form">' + intakeRenderAcctSections_(form, lang) + '</div>' +
      '</div>' +
      '<aside class="intk-rail"><div class="intk-rail-sticky">' +
        '<span class="intk-rail-label">Progress</span>' +
        intakeRingHtml_(form) +
        '<span class="intk-rail-count" id="intk-' + form + '-count">0 / 0</span>' +
        '<button class="intk-btn primary" onclick="intakeAcctPreview_(\'' + form + '\')">' + icon('send', 14) + ' Preview &amp; Send</button>' +
        '<button class="intk-btn" onclick="intakeClearForm_(\'' + form + '\')">Clear</button>' +
      '</div></aside>' +
    '</div>';
  var f = document.getElementById('intk-' + form + '-form');
  if (f) {
    f.addEventListener('input', function () { intakeSaveDraft_(form); intakeAcctUpdateProgress_(form); });
    // Yes/No toggles are <button>s (no 'input' event) — refresh progress on click too.
    f.addEventListener('click', function (e) { if (e.target.closest('.intk-yn-btn')) intakeAcctUpdateProgress_(form); });
    f.addEventListener('keydown', intakeArrowNav_);   // pilot round 3 #7
  }
  intakeRestoreDraft_(form);
  intakeAcctUpdateProgress_(form);
  intakeConsumeNavHint_();
}

// Progress for the account forms: count answered (non-header) fields and drive
// the form's ring via the shared updater. Mirrors intakeAcctGetVal_'s element
// lookup (a .intk-yn group is "answered" only when its data-val is set, so a
// checkbox's default 'FALSE' doesn't inflate the count).
function intakeAcctUpdateProgress_(form) {
  var root = document.getElementById('intk-' + form + '-form');
  if (!root) return;
  var lang = INTAKE_STATE[form].lang;
  var qs = intakeAcctBank_(form)[lang] || intakeAcctBank_(form).EN;
  var L = intakeAcctLayout_(form);
  var total = 0, answered = 0;
  for (var i = 0; i < qs.length; i++) {
    if (!String(qs[i] || '').trim()) continue;
    if (L.headers.indexOf(i) >= 0) continue;
    total++;
    var grp = root.querySelector('.intk-yn[data-idx="' + i + '"]');
    if (grp) { if (String(grp.getAttribute('data-val') || '')) answered++; }
    else { var el = root.querySelector('[data-intk-idx="' + i + '"]'); if (el && String(el.value).trim()) answered++; }
  }
  intakeRingSet_(form, answered, total);
}

// Render account form as section panels (one .panel per header-group index).
function intakeRenderAcctSections_(form, lang) {
  var qs = intakeAcctBank_(form)[lang] || intakeAcctBank_(form).EN;
  var L = intakeAcctLayout_(form);
  var out = '';
  var rows = '';
  var sectionTitle = '';
  function flush() {
    if (!sectionTitle && !rows) return;
    out += '<div class="panel intk-section">' +
      (sectionTitle ? '<div class="section-kicker sec-title">' + esc(sectionTitle) + '</div>' : '') +
      rows + '</div>';
    rows = '';
  }
  for (var i = 0; i < qs.length; i++) {
    var label = String(qs[i] || '');
    if (L.headers.indexOf(i) >= 0) { flush(); sectionTitle = label; continue; }
    var isSecondary = L.secondary.indexOf(i) >= 0;
    var control;
    if (L.checkboxes.indexOf(i) >= 0) {
      // Yes/No color-coded toggle storing TRUE/FALSE (preserves the server
      // checkbox payload contract).
      control = '<div class="intk-yn" data-idx="' + i + '" data-form="' + form + '" data-val="" role="radiogroup" aria-label="' + esc(label) + '" onkeydown="intakePickKey_(event)">' +
        '<button type="button" class="intk-yn-btn yes" data-set="TRUE" role="radio" aria-checked="false" onclick="intakePick_(this)">Yes</button>' +
        '<button type="button" class="intk-yn-btn no" data-set="FALSE" role="radio" aria-checked="false" onclick="intakePick_(this)">No</button>' +
      '</div>';
    } else if (L.selects[i] && L.selects[i].length === 3 && L.selects[i][1] === 'Yes' && L.selects[i][2] === 'No') {
      // #10 — a ['','Yes','No'] select renders as the same color-coded Yes/No
      // toggle as PPD (storing 'Yes'/'No' — the server select layout's
      // conditional-coloring keys, contract preserved). data-ynsel marks it so
      // the collector reads '' (not 'FALSE') when unset.
      control = '<div class="intk-yn" data-idx="' + i + '" data-form="' + form + '" data-ynsel="1" data-val="" role="radiogroup" aria-label="' + esc(label) + '" onkeydown="intakePickKey_(event)">' +
        '<button type="button" class="intk-yn-btn yes" data-set="Yes" role="radio" aria-checked="false" onclick="intakePick_(this)">Yes</button>' +
        '<button type="button" class="intk-yn-btn no" data-set="No" role="radio" aria-checked="false" onclick="intakePick_(this)">No</button>' +
      '</div>';
    } else if (L.selects[i]) {
      control = '<select id="intk-' + form + '-q' + i + '" name="intk-' + form + '-q' + i + '" data-intk-idx="' + i + '">' +
        L.selects[i].map(function (o) { return '<option value="' + esc(o) + '">' + esc(o || '— select —') + '</option>'; }).join('') + '</select>';
    } else {
      control = '<input type="text" autocomplete="off" id="intk-' + form + '-q' + i + '" name="intk-' + form + '-q' + i + '" data-intk-idx="' + i + '">';
    }
    var isYnSel = L.selects[i] && L.selects[i].length === 3 && L.selects[i][1] === 'Yes' && L.selects[i][2] === 'No';
    var labelFor = (L.checkboxes.indexOf(i) >= 0 || isYnSel) ? '' : ' for="intk-' + form + '-q' + i + '"';
    rows += '<div class="intk-row' + (isSecondary ? ' secondary' : '') + '"><label class="q"' + labelFor + '>' + esc(label) + '</label>' + control + '</div>';
  }
  flush();
  return out;
}

// Read a single account answer by index. Any .intk-yn toggle (checkbox →
// TRUE/FALSE, or a Yes/No select-toggle marked data-ynsel → Yes/No) reads its
// data-val; otherwise the input/select value. (#10 generalized the toggle path.)
function intakeAcctGetVal_(root, i, isCheckbox) {
  var grp = root.querySelector('.intk-yn[data-idx="' + i + '"]');
  if (grp) {
    var v = String(grp.getAttribute('data-val') || '');
    // F(L-15): an UNTOUCHED toggle reads as '' (was 'FALSE' for checkbox-style
    // groups) — the draft round-trip was fabricating a lit "No" on every
    // untouched toggle after a restore, indistinguishable from a deliberate
    // answer. A deliberate "No" click stores data-val='FALSE' and still reads
    // back as 'FALSE'. The send path is unchanged: the server email renders
    // any non-'TRUE' checkbox value (''/'FALSE') as the same unchecked box.
    return v;
  }
  var el = root.querySelector('[data-intk-idx="' + i + '"]');
  return el ? String(el.value).trim() : '';
}

// DOB is form index 5 for both PMD & PAP; patient name is index 1.
function intakeCollectAcct_(form) {
  var lang = INTAKE_STATE[form].lang;
  var qs = intakeAcctBank_(form)[lang] || intakeAcctBank_(form).EN;
  var L = intakeAcctLayout_(form);
  var root = document.getElementById('intk-' + form + '-form');
  var rows = [], answers = {};
  for (var i = 0; i < qs.length; i++) {
    var label = String(qs[i] || '');
    if (L.headers.indexOf(i) >= 0) { rows.push({ qIndex: i, label: label, isHeader: true }); continue; }
    var isCheckbox = L.checkboxes.indexOf(i) >= 0;
    // F(L-15): no-root fallback is '' for every control (was 'FALSE' for
    // checkboxes) — consistent with intakeAcctGetVal_'s untouched value.
    var val = root ? intakeAcctGetVal_(root, i, isCheckbox) : '';
    answers[i] = val;
    rows.push({ qIndex: i, label: label, value: val, isSecondary: L.secondary.indexOf(i) >= 0 });
  }
  return {
    patientInfo: String(answers[1] || '').trim(),
    dob: String(answers[5] || '').trim(),
    answers: answers, rows: rows, language: lang,
  };
}

function intakeAcctPreview_(form) {
  var payload = intakeCollectAcct_(form);
  if (!payload.patientInfo) { showToast('Enter the Patient Full Name first.', 'toast-warn'); return; }
  intakeWarnRecommended_(form).then(function (ok) { if (ok) intakeAcctPreviewGo_(form, payload); });
}
function intakeAcctPreviewGo_(form, payload) {
  INTAKE_STATE[form].images = [];
  var requested = currentView;
  var fn = form === 'pap' ? 'intakePreviewPAP' : 'intakePreviewPMD';
  showToast('Building preview…', '');
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      if (!res || res.error) { showToast((res && res.error) || 'Preview failed.', 'toast-error'); return; }
      INTAKE_STATE.preview = { formType: form.toUpperCase(), form: form, bodyHash: res.bodyHash, subject: res.subject, payload: payload };
      intakeBuildAcctModal_(form, res.html);
    })
    .withFailureHandler(function (err) { if (currentView === requested) showToast('Preview failed: ' + (err.message || err), 'toast-error'); })
    [fn](payload);
}

function intakeBuildAcctModal_(form, html) {
  var defLabel = form === 'pap' ? 'Default (Sleep)' : 'Default (Sales)';
  var agentOpts = (INTAKE_STATE.ppd.agents || []).map(function (a) { return '<option value="agent:' + esc(a.id) + '">' + esc(a.name) + '</option>'; }).join('');
  var body =
    '<div class="intk-prev">' + html + '</div>' +
    '<div class="intk-drop" id="intk-drop" tabindex="0">' + icon('upload', 14) + ' Drag, click, or paste — up to 12 images</div>' +
    '<input type="file" id="intk-file" aria-label="Choose images to attach" accept="image/*" multiple style="display:none">' +
    '<div class="intk-gallery" id="intk-gallery"></div>' +
    '<div class="intk-foot">' +
      '<label for="intk-acct-recipient"><strong>Send to:</strong></label>' +
      '<select id="intk-acct-recipient"><option value="default">' + esc(defLabel) + '</option>' + agentOpts + '<option value="custom">Custom email…</option></select>' +
      '<input type="email" id="intk-acct-custom" placeholder="recipient@…" aria-label="Custom recipient email" style="display:none">' +
      '<span class="grow"></span>' +
      '<button class="intk-btn" data-intk-close="1">Cancel</button>' +
      '<button class="intk-btn primary" id="intk-acct-send" onclick="intakeAcctSend_(\'' + form + '\')">' + icon('send', 14) + ' Send Email</button>' +
    '</div>';
  intakeOpenModal_((form.toUpperCase()) + ' Preview & Send', body);

  // load agents lazily (shared cache on ppd.agents) so the dropdown fills
  if (!INTAKE_STATE.ppd.agents) {
    google.script.run.withSuccessHandler(function (r) {
      INTAKE_STATE.ppd.agents = (r && r.agents) || [];
      var sel = document.getElementById('intk-acct-recipient');
      if (sel) {
        var custom = sel.querySelector('option[value="custom"]');
        (INTAKE_STATE.ppd.agents || []).forEach(function (a) {
          var o = document.createElement('option'); o.value = 'agent:' + a.id; o.textContent = a.name;
          sel.insertBefore(o, custom);
        });
      }
    }).withFailureHandler(function (err) {
      // INT-4 — surface the failure instead of a silently agent-less picker
      // (Default / Custom recipients still work).
      showToast('Could not load the agent list: ' + ((err && err.message) || 'server error'), 'toast-warn');
    }).getIntakeAgents();
  }

  var recSel = document.getElementById('intk-acct-recipient');
  if (recSel) recSel.addEventListener('change', function () {
    var c = document.getElementById('intk-acct-custom');
    if (c) c.style.display = this.value === 'custom' ? 'inline-block' : 'none';
  });
  intakeSetupImageUpload_(form);
}

function intakeAcctSend_(form) {
  var st = INTAKE_STATE.preview;
  if (!st || st.form !== form) { showToast('Preview expired — please preview again.', 'toast-warn'); return; }
  var recSel = document.getElementById('intk-acct-recipient');
  var val = recSel ? recSel.value : 'default';
  var spec;
  if (val === 'default') spec = { kind: 'default' };
  else if (val === 'custom') {
    var custom = document.getElementById('intk-acct-custom');
    spec = { kind: 'custom', email: custom ? custom.value.trim() : '' };
    if (!spec.email) { showToast('Enter a recipient email.', 'toast-warn'); return; }
  } else spec = { kind: 'agent', id: val.replace(/^agent:/, '') };

  var images = INTAKE_STATE[form].images || [];
  var fn = form === 'pap' ? 'intakeSendPAP' : 'intakeSendPMD';
  var btn = document.getElementById('intk-acct-send');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  var requestedView = currentView;   // M8 — late-success guard (CN loader pattern)
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { if (btn) { btn.disabled = false; btn.innerHTML = icon('send', 14) + ' Send Email'; } showToast((res && res.error) || 'Send failed.', 'toast-error'); return; }
      intakeCloseModal_();
      intakeClearDraft_(form);   // drop the persisted draft (PHI) on a successful send
      if (currentView === requestedView) intakeClearForm_(form);
      else { INTAKE_STATE[form].images = []; INTAKE_STATE.preview = null; }   // drop PHI payload after send (F3)
      // M-5 (cycle 10): loud toast when the PHI submission record didn't persist.
      if (res.storeWarning) showToast(res.storeWarning, 'toast-warn');
      else showToast(form.toUpperCase() + ' emailed to ' + res.recipient, 'toast-success');
      intakeAutoLogNote_(form, st.payload, res.recipient, null, currentView === requestedView);
    })
    .withFailureHandler(function (err) { if (btn) { btn.disabled = false; btn.innerHTML = icon('send', 14) + ' Send Email'; } showToast('Send failed: ' + (err.message || err), 'toast-error'); })
    [fn](st.payload, spec, images, st.bodyHash);
}

// ── Image upload (PMD/PAP) ────────────────────────────────────────────────
function intakeSetupImageUpload_(form) {
  var drop = document.getElementById('intk-drop');
  var fileInput = document.getElementById('intk-file');
  if (!drop || !fileInput) return;
  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { intakeHandleFiles_(form, this.files); this.value = ''; });
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); }, false);
  });
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function () { drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function () { drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { intakeHandleFiles_(form, e.dataTransfer.files); });
  drop._intkPaste = function (e) {
    var items = (e.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) { intakeProcessImage_(form, items[i].getAsFile()); e.preventDefault(); }
    }
  };
  document.addEventListener('paste', drop._intkPaste);
}

function intakeHandleFiles_(form, files) {
  if (!files) return;
  for (var i = 0; i < files.length; i++) { if (files[i].type.indexOf('image/') === 0) intakeProcessImage_(form, files[i]); }
}

function intakeProcessImage_(form, file) {
  if (!file) return;
  var max = 12;
  if ((INTAKE_STATE[form].images || []).length >= max) { showToast('Up to ' + max + ' images.', 'toast-warn'); return; }
  var reader = new FileReader();
  reader.onload = function (e) {
    // INT-3 — re-check inside the async callback: dropping >12 files at once
    // passed every synchronous check while length was still 0, rendering a
    // gallery the server then silently sliced to 12 at send.
    if ((INTAKE_STATE[form].images || []).length >= max) { showToast('Up to ' + max + ' images — extra file skipped.', 'toast-warn'); return; }
    INTAKE_STATE[form].images.push(e.target.result);
    intakeRenderGallery_(form);
  };
  reader.readAsDataURL(file);
}

function intakeRenderGallery_(form) {
  var g = document.getElementById('intk-gallery');
  if (!g) return;
  g.innerHTML = (INTAKE_STATE[form].images || []).map(function (src, idx) {
    return '<div class="intk-thumb"><img src="' + esc(src) + '" alt="">' +
      '<button type="button" class="rm" aria-label="Remove image ' + (idx + 1) + '"' +   // A1
      ' onclick="intakeRemoveImage_(\'' + form + '\',' + idx + ')">&#10005;</button></div>';
  }).join('');
}

function intakeRemoveImage_(form, idx) {
  INTAKE_STATE[form].images.splice(idx, 1);
  intakeRenderGallery_(form);
}

// ── Draft autosave (parity with Call Notes) ───────────────────────────────
// Persists in-progress answers to ONE localStorage key per the house pattern
// (umsIntakeDrafts), restored on view enter, cleared on send + Clear. Drafts
// carry patient answers = PHI; they EXPIRE after 24h and are wiped on send/clear
// so PHI doesn't linger at rest (the module also drops the in-memory payload on
// send, F3). All access is try/catch'd (privacy-mode browsers).
var INTAKE_DRAFT_KEY = 'umsIntakeDrafts';
var INTAKE_DRAFT_MAX_AGE_MS = 24 * 60 * 60 * 1000;
var _intakeDraftTimer = null;

function intakeReadDrafts_() {
  try { return JSON.parse(localStorage.getItem(INTAKE_DRAFT_KEY) || '{}') || {}; }
  catch (e) { return {}; }
}
function intakeWriteDrafts_(all) {
  try { localStorage.setItem(INTAKE_DRAFT_KEY, JSON.stringify(all)); } catch (e) {}
}

var _intakeDraftForm = null;   // which form the pending debounce is for (M-2 flush)

function intakeFormRoot_(form) {
  return document.getElementById(form === 'ppd' ? 'intk-ppd-form' : 'intk-' + form + '-form');
}

function intakeDraftSaveNow_(form) {
  // F(M-2): a debounced save can fire AFTER the view is torn down (rep typed /
  // clicked a chip, then navigated within 400ms). With no form root the
  // collectors return an all-empty snapshot that would OVERWRITE the good
  // draft — a half-completed 45-question PPD silently gone. No root → skip;
  // the last flushed/saved draft stands.
  if (!intakeFormRoot_(form)) return;
  var snap = (form === 'ppd') ? intakeCollectPpd_() : intakeCollectAcct_(form);
  var draft = { answers: snap.answers || {}, at: Date.now() };
  if (form === 'ppd') draft.patientInfo = snap.patientInfo || '';
  var all = intakeReadDrafts_();
  all[form] = draft;
  intakeWriteDrafts_(all);
}

function intakeSaveDraft_(form) {
  if (_intakeDraftTimer) clearTimeout(_intakeDraftTimer);
  _intakeDraftForm = form;
  _intakeDraftTimer = setTimeout(function () {
    _intakeDraftTimer = null; _intakeDraftForm = null;
    intakeDraftSaveNow_(form);
  }, 400);
}

/** F(M-2) — flush a pending debounced draft save synchronously. Called from the
 *  shell's showView at the top of every navigation, while the outgoing view's
 *  DOM is still intact — so a keystroke typed <400ms before switching tools is
 *  captured instead of lost, and the torn-down-DOM path above never has to
 *  discard anything. Cheap no-op when nothing is pending. */
function intakeFlushDraftNow_() {
  if (!_intakeDraftTimer) return;
  clearTimeout(_intakeDraftTimer);
  var form = _intakeDraftForm;
  _intakeDraftTimer = null; _intakeDraftForm = null;
  // try/catch: this runs inside showView — a collector throw must never
  // block navigation (the draft is best-effort, the nav is not).
  try { if (form) intakeDraftSaveNow_(form); } catch (e) {}
}

function intakeRestoreDraft_(form) {
  var all = intakeReadDrafts_();
  var d = all[form];
  if (!d) return;
  if (!d.at || (Date.now() - d.at) > INTAKE_DRAFT_MAX_AGE_MS) { intakeClearDraft_(form); return; }
  var restored = false;
  if (form === 'ppd') {
    var root = document.getElementById('intk-ppd-form');
    var pat = document.getElementById('intk-ppd-patient');
    if (pat && d.patientInfo) { pat.value = d.patientInfo; restored = true; }
    if (root) Object.keys(d.answers || {}).forEach(function (qNum) {
      if (d.answers[qNum]) { intakePpdSetVal_(root, qNum, d.answers[qNum]); restored = true; }
    });
    intakePpdUpdateProgress_();
  } else {
    intakeApplyAcctAnswers_(form, d.answers || {});
    if (Object.keys(d.answers || {}).some(function (k) { return d.answers[k]; })) restored = true;
  }
  if (restored) showToast('Draft restored', '');
}

function intakeClearDraft_(form) {
  // Cancel a pending debounce for THIS form — a timer armed just before
  // Clear/send would otherwise fire after the wipe and re-save a snapshot.
  if (_intakeDraftTimer && _intakeDraftForm === form) {
    clearTimeout(_intakeDraftTimer);
    _intakeDraftTimer = null; _intakeDraftForm = null;
  }
  var all = intakeReadDrafts_();
  if (all[form]) { delete all[form]; intakeWriteDrafts_(all); }
}

// ── Sent tab (P15) — in-app viewer for past intake submissions ─────────────
// Caller-scoped server-side (rep sees own; manager sees all). Read-only.
// Answer labels are reconstructed client-side from the question banks using
// the submission's stored language, so nothing but the stored answers rides
// the wire twice. Every value is esc()'d before innerHTML.

function enterIntakeSentView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  area.innerHTML =
    intakeAppBar_('sent', 'Sent') +
    '<div class="intk-wrap">' +
      '<div class="intk-filter">' +
        '<div class="toolbar-tabs" role="group" aria-label="Filter by form type">' +
          ['ALL', 'PPD', 'PMD', 'PAP'].map(function (t) {
            return '<button class="toolbar-tab" aria-pressed="' + (INTAKE_STATE.sentFilter.type === t) + '" onclick="intakeSetSentFilter_(\'' + t + '\')">' + t + '</button>';
          }).join('') +
        '</div>' +
        '<input type="search" class="intk-search" id="intk-sent-search" placeholder="Search patient or rep…" value="' + esc(INTAKE_STATE.sentFilter.q) + '" oninput="intakeSentSearch_(this.value)" aria-label="Search sent submissions">' +
      '</div>' +
      '<div id="intk-sent-list">' + loSweep() + '</div>' +
    '</div>';
  // Stale-while-revalidate: if the Sent list was loaded recently, paint it
  // instantly from state and refresh behind the pill (no spinner). An empty list
  // is valid, so the freshness STAMP — not array length — gates the fast path.
  var painted = false;
  if (INTAKE_STATE.sentEntry && typeof viewCacheFresh_ === 'function' && viewCacheFresh_(INTAKE_STATE.sentEntry)) {
    intakeRenderSentHost_();
    if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(true);
    painted = true;
  }
  var requested = currentView;
  var done = function () { if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(false); };
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) { done(); return; }
      var host = document.getElementById('intk-sent-list');
      if (!host) { done(); return; }
      if (!res || res.error) {
        done();
        if (painted) { if (typeof showToast === 'function') showToast('Couldn’t refresh sent list — showing last loaded', 'toast-warn'); return; }
        host.innerHTML = errorStateHtml_((res && res.error) || 'Failed to load submissions');   // A12/INV-175
        return;
      }
      INTAKE_STATE.sent = res.submissions || [];
      INTAKE_STATE.sentIsManager = !!res.isManager;
      // C17 batch-5 (INV-169): the server caps the list — keep the pre-slice
      // total so the render can say "showing N of M" (absent on an older
      // server -> renders nothing, as before).
      INTAKE_STATE.sentTotal = (typeof res.total === 'number') ? res.total : null;
      INTAKE_STATE.sentEntry = { at: Date.now() };
      intakeRenderSentHost_();
      done();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requested) { done(); return; }
      done();
      if (painted) { if (typeof showToast === 'function') showToast('Couldn’t refresh sent list — showing last loaded', 'toast-warn'); return; }
      var host = document.getElementById('intk-sent-list');
      if (host) host.innerHTML = errorStateHtml_((err && err.message) || 'Failed to load submissions');   // A12/INV-175
    })
    .intakeListMySubmissions();
}

// ── CATALOG view (cycle-18 batch 8) ───────────────────────────────────────
// A read-only browse of the SAME Offerings catalog the PPD engine recommends
// from. Before this the only way to look up what a HCPCS code covers, what a
// chair's weight capacity is, or which brochure to send was to open the Intake
// SPREADSHEET — which also holds the PHI submission tabs. The endpoint reads
// Offerings!A2:F only (product data), so nothing patient-related can ride it.
function enterIntakeCatalogView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  area.innerHTML =
    intakeAppBar_('catalog', 'Catalog') +
    '<div class="intk-wrap">' +
      '<div class="intk-filter">' +
        '<div class="toolbar-tabs" role="group" aria-label="Filter by seat type">' +
          [['ALL', 'All'], ['S', 'Solid seat'], ['C', 'Captain']].map(function (t) {
            return '<button type="button" class="toolbar-tab" aria-pressed="' + (INTAKE_STATE.catalogFilter.seat === t[0]) +
              '" onclick="intakeSetCatalogSeat_(\'' + t[0] + '\')">' + esc(t[1]) + '</button>';
          }).join('') +
        '</div>' +
        // A14: named, because a placeholder is not an accessible name.
        '<input type="search" class="intk-search" id="intk-cat-search" aria-label="Search the catalog by HCPCS code or features"' +
          ' placeholder="Search HCPCS or features…" value="' + esc(INTAKE_STATE.catalogFilter.q) + '" oninput="intakeCatalogSearch_(this.value)">' +
      '</div>' +
      '<div id="intk-cat-list">' + loSweep() + '</div>' +
    '</div>';

  // Paint from cache instantly when we have one; the catalog is operator data
  // that changes rarely, so a stale paint behind a refresh is always right.
  var painted = false;
  if (INTAKE_STATE.catalog) { intakeRenderCatalogHost_(); painted = true; }
  var requested = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      var host = document.getElementById('intk-cat-list');
      if (!host) return;
      if (!res || res.error) {
        // A12/INV-175 — a failed read must never render as an empty catalog.
        if (painted) { if (typeof showToast === 'function') showToast('Couldn’t refresh the catalog — showing last loaded', 'toast-warn'); return; }
        host.innerHTML = errorStateHtml_((res && res.error) || 'Failed to load the catalog');
        return;
      }
      INTAKE_STATE.catalog = res.offerings || [];
      // INV-169 — keep the PRE-slice total so the render can say "showing N of M".
      INTAKE_STATE.catalogTotal = (typeof res.total === 'number') ? res.total : null;
      intakeRenderCatalogHost_();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requested) return;
      if (painted) { if (typeof showToast === 'function') showToast('Couldn’t refresh the catalog — showing last loaded', 'toast-warn'); return; }
      var host = document.getElementById('intk-cat-list');
      if (host) host.innerHTML = errorStateHtml_((err && err.message) || 'Failed to load the catalog');   // A12/INV-175
    })
    .intakeListOfferings();
}

function intakeSetCatalogSeat_(seat) {
  INTAKE_STATE.catalogFilter.seat = seat;
  document.querySelectorAll('#view-area .intk-filter .toolbar-tab').forEach(function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('onclick').indexOf("'" + seat + "'") >= 0 ? 'true' : 'false');
  });
  intakeRenderCatalogHost_();
}

function intakeCatalogSearch_(q) {
  INTAKE_STATE.catalogFilter.q = q || '';
  intakeRenderCatalogHost_();
}

/** PURE filter over the catalog rows. Seat matching mirrors the ENGINE's own
 *  rule — it tests for the LETTER 's' / 'c' anywhere in the cell rather than
 *  an exact word, because that is what intakeFilterRecommendations_ does, and
 *  a browse view that disagrees with the engine about which chairs are
 *  captain-seat would be worse than no filter at all. */
function intakeFilterCatalog_(rows, filter) {
  var q = String((filter && filter.q) || '').toLowerCase().trim();
  var seat = String((filter && filter.seat) || 'ALL').toUpperCase();
  return (rows || []).filter(function (r) {
    if (seat !== 'ALL') {
      var st = String(r.seatType || '').toLowerCase();
      if (seat === 'S' && st.indexOf('s') < 0) return false;
      if (seat === 'C' && st.indexOf('c') < 0) return false;
    }
    if (q) {
      var hay = (String(r.hcpcs || '') + ' ' + String(r.features || '')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function intakeRenderCatalogHost_() {
  var host = document.getElementById('intk-cat-list');
  if (!host) return;
  host.innerHTML = intakeRenderCatalogList_(
    intakeFilterCatalog_(INTAKE_STATE.catalog, INTAKE_STATE.catalogFilter),
    (INTAKE_STATE.catalog || []).length,
    INTAKE_STATE.catalogTotal);
}

function intakeRenderCatalogList_(rows, unfilteredLen, serverTotal) {
  if (!rows.length) {
    // .no-data is the shared, DEFINED empty-state class (the intake partial's
    // own idiom at the Sent list) — inventing an undeclared `.intk-empty`
    // would render unstyled text, the INV-184 class in reverse.
    return '<div class="no-data" style="padding:20px 0">' +
      ((INTAKE_STATE.catalog && INTAKE_STATE.catalog.length)
        ? 'No products match this filter.'
        : 'The Offerings catalog is empty.') + '</div>';
  }
  // INV-169: the cap note keys off the UNFILTERED length vs the server's
  // pre-slice total — a filtered-out row is not a server-capped one.
  var capNote = (serverTotal != null && serverTotal > unfilteredLen)
    ? ' · server holds ' + esc(String(serverTotal)) + ' total (list capped)'
    : '';
  var count = '<div class="intk-cat-count">' + esc(String(rows.length)) + ' product' + (rows.length === 1 ? '' : 's') +
    (rows.length !== unfilteredLen ? ' of ' + esc(String(unfilteredLen)) : '') + capNote + '</div>';
  var cards = rows.map(function (r) {
    var imgUrl = intakeHttpOnly_(r.imageUrl);
    var pdfUrl = intakeHttpOnly_(r.pdfLink);
    var imgHtml = imgUrl
      ? '<a href="' + imgUrl + '" target="_blank" rel="noopener" title="Open full image">' +
          '<img class="cat-img" src="' + imgUrl + '" alt="' + esc(r.hcpcs) + '" loading="lazy"></a>'
      : '<div class="cat-noimg">no image</div>';
    var codeHtml = pdfUrl
      ? '<a href="' + pdfUrl + '" target="_blank" rel="noopener" class="cat-code code-link" title="Open brochure">' +
          esc(r.hcpcs) + ' ' + icon('popOut', 11) + '</a>'
      : '<span class="cat-code">' + esc(r.hcpcs) + '</span>';
    // A blank capacity/seat is stated as UNRECORDED, never as a value — the
    // engine EXCLUDES such a row for any patient with a recorded weight
    // (INV-112 fail-closed), so showing a confident blank would mislead.
    var cap = String(r.weightCapacity || '').trim();
    var seat = String(r.seatType || '').trim();
    var specs = '<div class="intk-cat-spec">' +
      '<span>' + (cap ? esc(cap) + ' lb' : 'capacity not recorded') + '</span>' +
      '<span>' + (seat ? esc(seat) : 'seat not recorded') + '</span>' +
      '</div>';
    return '<div class="intk-cat-card">' + imgHtml + codeHtml +
      '<div class="cat-feat">' + esc(r.features || '') + '</div>' + specs + '</div>';
  }).join('');
  return count + '<div class="intk-cat-grid">' + cards + '</div>';
}

function intakeSetSentFilter_(type) {
  INTAKE_STATE.sentFilter.type = type;
  document.querySelectorAll('.intk-filter .toolbar-tab').forEach(function (b) {
    b.setAttribute('aria-pressed', b.textContent.trim() === type ? 'true' : 'false');
  });
  intakeRenderSentHost_();
}

function intakeSentSearch_(q) {
  INTAKE_STATE.sentFilter.q = q || '';
  intakeRenderSentHost_();
}

function intakeFilterSent_(subs) {
  var f = INTAKE_STATE.sentFilter;
  var q = String(f.q || '').toLowerCase().trim();
  return (subs || []).filter(function (s) {
    if (f.type && f.type !== 'ALL' && String(s.formType || '').toUpperCase() !== f.type) return false;
    if (q) {
      var hay = (String(s.patientInfo || '') + ' ' + String(s.repName || '')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function intakeRenderSentHost_() {
  var host = document.getElementById('intk-sent-list');
  if (!host) return;
  host.innerHTML = intakeRenderSentList_(intakeFilterSent_(INTAKE_STATE.sent), !!INTAKE_STATE.sentIsManager);
}

// Form-type pill tones (kicker-pill vocabulary).
function intakeFormPill_(formType) {
  var t = String(formType || '').toUpperCase();
  var tone = t === 'PPD' ? 'accent' : t === 'PMD' ? 'info' : t === 'PAP' ? 'warn' : '';
  return '<span class="kicker-pill"' + (tone ? ' data-tone="' + tone + '"' : '') + '>' + esc(t || '—') + '</span>';
}

function intakeRenderSentList_(subs, isManager) {
  if (!subs || subs.length === 0) {
    return '<div class="no-data" style="padding:20px 0">No matching intake submissions' +
      (isManager ? '.' : ' — your sent PPD / PMD / PAP forms will appear here.') + '</div>';
  }
  return '<div class="intk-grid">' +
    // C17 batch-5 (INV-169): "showing N of M" when the server capped the list
    // — a silent cap read as "exactly 100 submissions exist". Older servers
    // send no total -> the parenthetical simply doesn't render.
    '<div class="intk-head">' + (isManager ? 'All reps · ' : 'Your submissions · ') + subs.length + ' shown' +
      ((typeof INTAKE_STATE !== 'undefined' && INTAKE_STATE.sentTotal != null &&
        INTAKE_STATE.sentTotal > (INTAKE_STATE.sent || []).length)
        ? ' · server holds ' + INTAKE_STATE.sentTotal + ' total (list capped)' : '') +
      ' (newest first, max 100)</div>' +
    subs.map(function (s, i) {
      return '<div class="intk-sent-row">' +
        intakeFormPill_(s.formType) +
        '<div><div style="font-weight:600">' + esc(s.patientInfo || '(no patient label)') + '</div>' +
          '<div class="intk-sent-meta">' + esc(s.timestamp) +
          (isManager ? ' · ' + esc(s.repName) : '') + ' · to ' + esc(s.recipient) + '</div></div>' +
        '<button class="intk-btn" data-sent-idx="' + i + '" onclick="intakeOpenSent_(this)">View</button>' +
      '</div>';
    }).join('') + '</div>';
}

function intakeOpenSent_(btn) {
  // The button's index is into the CURRENT (filtered) view — recompute the same
  // filtered list to resolve it, so a filter doesn't misindex the lookup.
  var filtered = intakeFilterSent_(INTAKE_STATE.sent);
  var s = filtered[parseInt(btn.getAttribute('data-sent-idx'), 10)];
  if (!s) return;
  btn.disabled = true;
  var requestedView = currentView;   // INT-5 — don't pop the modal over another view
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      if (!res || res.error) { showToast((res && res.error) || 'Could not load the submission', 'toast-error'); return; }
      if (currentView !== requestedView) return;
      intakeOpenModal_(res.formType + ' — ' + (res.patientInfo || res.submissionId), intakeRenderSentDetail_(res));
    })
    .withFailureHandler(function (err) {
      btn.disabled = false;
      showToast((err && err.message) || 'Could not load the submission', 'toast-error');
    })
    .intakeGetSubmission(s.formType, s.submissionId);
}

function intakeRenderSentDetail_(d) {
  var lang = (d.language === 'ES') ? 'ES' : 'EN';
  var na = '<span style="color:var(--muted);font-style:italic">N/A</span>';
  var rowsHtml = '';
  if (d.formType === 'PPD') {
    var qs = INTAKE_PPD_Q[lang] || INTAKE_PPD_Q.EN;
    for (var i = 1; i < qs.length; i++) {
      var raw = qs[i];
      if (!raw || !String(raw).trim()) continue;
      var text = String(raw).trim();
      var m = text.match(/^(\d+[a-z]?)\./);
      if (!m) { rowsHtml += '<div class="intk-head">' + esc(text) + '</div>'; continue; }
      var val = (d.answers || {})[m[1]];
      rowsHtml += '<div class="intk-row' + (/^\s+/.test(raw) ? ' secondary' : '') + '">' +
        '<div class="q">' + esc(text) + '</div>' +
        '<div>' + (val ? esc(String(val)) : na) + '</div></div>';
    }
    var notesStored = (d.answers || {}).notes;
    if (notesStored) {
      var nls = INTAKE_PPD_NOTES[lang] || INTAKE_PPD_NOTES.EN;
      rowsHtml += '<div class="intk-head">' + esc(nls.title) + '</div>' +
        '<div class="intk-row"><div class="q">' + esc(nls.label) + '</div>' +
        '<div style="white-space:pre-wrap">' + esc(String(notesStored)) + '</div></div>';
    }
    var recs = [].concat(
      (d.recommendations && d.recommendations.complex) || [],
      (d.recommendations && d.recommendations.standard) || []);
    if (recs.length > 0) {
      rowsHtml += '<div class="intk-head">Recommendations sent</div>';
      recs.forEach(function (p) {
        var rid = String(p.hcpcs).replace(/\s+/g, '-');
        var sel = (d.selections || {})[rid] || {};
        var bits = [];
        if (sel.preferred) bits.push('★ preferred');
        if (sel.status && sel.status !== 'none') bits.push(sel.status);
        rowsHtml += '<div class="intk-row"><div class="q" style="font-weight:400">' + esc(String(p.hcpcs)) + '</div>' +
          '<div style="font-size:.82rem;color:var(--muted)">' + esc(bits.join(' · ') || '—') + '</div></div>';
      });
    }
    // Read-only engine explainability — the clinical factors the recommendation
    // engine derived from these answers (server `factors`, recomputed via the
    // shared derivation so it can't drift). Makes "why this HCPCS fired" auditable
    // without re-reading the engine. Every value esc()'d before innerHTML.
    if (d.factors && d.factors.length) {
      rowsHtml += '<div class="intk-head">Why these recommendations · engine factors</div>';
      d.factors.forEach(function (f) {
        rowsHtml += '<div class="intk-row"><div class="q" style="font-weight:400">' + esc(String(f.label)) + '</div>' +
          '<div style="font-size:.82rem">' + esc(String(f.value)) + '</div></div>';
      });
    }
  } else {
    var bank = (d.formType === 'PAP') ? INTAKE_PAP_Q : INTAKE_PMD_Q;
    var L = (d.formType === 'PAP') ? INTAKE_PAP_CLIENT : INTAKE_PMD_CLIENT;
    var qs2 = bank[lang] || bank.EN;
    for (var j = 0; j < qs2.length; j++) {
      var label2 = String(qs2[j] || '');
      if (L.headers.indexOf(j) >= 0) { rowsHtml += '<div class="intk-head">' + esc(label2) + '</div>'; continue; }
      var v2 = (d.answers || {})[j];
      var disp;
      if (L.checkboxes.indexOf(j) >= 0) disp = (v2 === 'TRUE') ? 'Yes' : 'No';
      else disp = (v2 == null || v2 === '') ? '' : String(v2);
      rowsHtml += '<div class="intk-row' + (L.secondary.indexOf(j) >= 0 ? ' secondary' : '') + '">' +
        '<div class="q">' + esc(label2) + '</div>' +
        '<div>' + (disp ? esc(disp) : na) + '</div></div>';
    }
    if (d.imageCount) {
      rowsHtml += '<div class="intk-row"><div class="q">Images attached</div><div>' + Number(d.imageCount) + '</div></div>';
    }
  }
  // Recipient feedback (operator 2026-08-13) — what the receiving agent typed
  // through the email's "Send feedback" button, newest-first. Renders for all
  // three form types; absent/empty renders nothing (most submissions get no
  // feedback, and an empty section would read as "no one has complaints yet",
  // which the data cannot support). Every server string esc()'d.
  var fbHtml = '';
  if (Array.isArray(d.feedback) && d.feedback.length) {
    fbHtml = '<div class="intk-head">Recipient feedback</div>';
    d.feedback.forEach(function (f) {
      fbHtml += '<div class="intk-row"><div class="q" style="font-weight:400">' +
        esc(String(f.fromName || f.fromEmail || 'Unknown')) +
        '<div style="font-size:.72rem;color:var(--muted)">' + esc(String(f.at || '')) + '</div></div>' +
        '<div style="font-size:.82rem;white-space:pre-wrap">' + esc(String(f.text || '')) + '</div></div>';
    });
  }
  var meta = '<div style="font-size:.8rem;color:var(--muted);margin-bottom:10px">' +
    esc(d.timestamp) + ' · sent by ' + esc(d.repName) + ' · to ' + esc(d.recipient) + '</div>';
  return meta + '<div class="intk-grid">' + rowsHtml + fbHtml + '</div>';
}

// ── Shared UI helpers ─────────────────────────────────────────────────────
function intakeLangToggleHtml_(form) {
  var lang = INTAKE_STATE[form].lang;
  return '<div class="toolbar-tabs" role="group" aria-label="Language">' +
    '<button class="toolbar-tab" aria-pressed="' + (lang === 'EN') + '" onclick="intakeSetLang_(\'' + form + '\',\'EN\')">EN</button>' +
    '<button class="toolbar-tab" aria-pressed="' + (lang === 'ES') + '" onclick="intakeSetLang_(\'' + form + '\',\'ES\')">ES</button>' +
  '</div>';
}

function intakeSetLang_(form, lang) {
  if (INTAKE_STATE[form].lang === lang) return;
  // preserve in-progress answers across the language flip (keys are qNum/qIndex)
  var snapshot = (form === 'ppd') ? intakeCollectPpd_() : intakeCollectAcct_(form);
  INTAKE_STATE[form].lang = lang;
  if (form === 'ppd') enterIntakePpdView(); else intakeEnterAcct_(form, form === 'pap' ? 'PAP Account' : 'PMD Account');
  intakeRestoreAnswers_(form, snapshot);
}

function intakeRestoreAnswers_(form, snapshot) {
  if (!snapshot) return;
  if (form === 'ppd') {
    var root = document.getElementById('intk-ppd-form');
    var pat = document.getElementById('intk-ppd-patient');
    if (pat) pat.value = snapshot.patientInfo || '';
    if (root) Object.keys(snapshot.answers || {}).forEach(function (qNum) {
      intakePpdSetVal_(root, qNum, snapshot.answers[qNum]);
    });
    // F(L-17): re-apply conditional reveals against the OVERLAID answers —
    // the view enter restored the (≤400ms-stale) draft and applied reveals
    // against THAT, so e.g. a just-set Q33=Yes left the Q33a row hidden with
    // its restored text invisible until the next input event.
    if (typeof intakePpdApplyReveals_ === 'function') intakePpdApplyReveals_(root);
    intakePpdUpdateProgress_();
  } else {
    intakeApplyAcctAnswers_(form, snapshot.answers || {});
    // F(L-17): sync the progress ring to the overlaid snapshot (it reflected
    // the stale draft until the next input event).
    if (typeof intakeAcctUpdateProgress_ === 'function') intakeAcctUpdateProgress_(form);
  }
}

// Apply an answers map (idx → value) to a rendered account form. Any .intk-yn
// toggle (checkbox TRUE/FALSE or Yes/No select-toggle) restores via its data-val
// + button states; everything else sets the input/select value. (#10 generalized.)
function intakeApplyAcctAnswers_(form, answers) {
  var root = document.getElementById('intk-' + form + '-form');
  if (!root) return;
  Object.keys(answers || {}).forEach(function (idx) {
    var i = parseInt(idx, 10);
    var grp = root.querySelector('.intk-yn[data-idx="' + i + '"]');
    if (grp) {
      var v = answers[idx] == null ? '' : String(answers[idx]);
      grp.setAttribute('data-val', v);
      grp.querySelectorAll('[data-set]').forEach(function (b) {
        var on = (b.getAttribute('data-set') === v);
        b.classList.toggle('on', on);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    } else {
      var el = root.querySelector('[data-intk-idx="' + i + '"]');
      if (el) el.value = answers[idx];
    }
  });
}

function intakeClearForm_(form) {
  INTAKE_STATE[form].images = [];
  // Drop the cached preview too — it holds the full patient-answer payload
  // (PHI). Clearing the form must not leave it resident in memory (F3).
  INTAKE_STATE.preview = null;
  intakeClearDraft_(form);
  if (form === 'ppd') enterIntakePpdView();
  else intakeEnterAcct_(form, form === 'pap' ? 'PAP Account' : 'PMD Account');
}

function intakeStripTags_(s) { return String(s == null ? '' : s).replace(/<[^>]*>/g, ''); }

// Minimal modal built on the shared .overlay vocabulary. Created via
// ensureOverlay (script_core) with intakeCloseModal_ as the close hook, so
// EVERY close path — Escape included — removes the document-level paste
// listener. (Esc previously only hid the node, leaking the listener app-wide:
// any image pasted anywhere kept accumulating into INTAKE_STATE silently.)
// CONTRACT (F4): `title` is esc()'d here, but `bodyHtml` is injected RAW via
// innerHTML — EVERY caller MUST esc() any user/patient/server-supplied value it
// places into bodyHtml before passing it in (same load-bearing discipline as
// buildCallNoteEmailHtml_'s esc_, INV-89). A new caller that passes an
// unescaped server string here is stored XSS. Today all callers comply
// (PPD/account previews, intakeRenderSentDetail_).
function intakeOpenModal_(title, bodyHtml) {
  intakeCloseModal_();
  var ov = ensureOverlay('intk-modal-overlay', { label: 'Intake preview', onClose: intakeCloseModal_ });
  ov.innerHTML = '<div class="modal intk-modal">' +
    '<div class="head"><h3>' + esc(title) + '</h3><button class="xclose" data-intk-close="1" aria-label="Close">' + icon('x', 16) + '</button></div>' +
    '<div class="body">' + bodyHtml + '</div></div>';
  ov.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('[data-intk-close]')) intakeCloseModal_();
  });
}

function intakeCloseModal_() {
  var ov = document.getElementById('intk-modal-overlay');
  if (!ov) return;
  var drop = document.getElementById('intk-drop');
  if (drop && drop._intkPaste) document.removeEventListener('paste', drop._intkPaste);
  ov.remove();
}

// ── Auto-drafted note after an intake send ──────────────────────────────────
// On a successful intake email send, build a CRM-paste note template, copy it to
// the clipboard, display it for the rep, and (best-effort) log it to the rep's
// Call Notes history tagged with the intake category (subformData.intakeType →
// the colored chip on the card). If the rep isn't enrolled in Call Notes the
// history write fails gracefully and the rep still gets the copyable draft.
function intakeAutoLogNote_(formType, payload, recipient, recs, onView) {
  var ft = String(formType || '').toLowerCase();
  var label = ft === 'ppd' ? 'PPD' : ft === 'pmd' ? 'PMD Account' : ft === 'pap' ? 'PAP Account' : 'Intake';
  var patient = (payload && payload.patientInfo) ? String(payload.patientInfo) : '';
  // PPD preview returns recommendations as { complex:[], standard:[] } of items
  // carrying .hcpcs — surface the qualifying codes in the note (best-effort).
  var codes = [];
  try {
    var items = [].concat((recs && recs.complex) || [], (recs && recs.standard) || []);
    codes = items.map(function (p) { return p && p.hcpcs; }).filter(Boolean);
  } catch (_) { codes = []; }
  var recoLine = codes.length ? 'Recommended: ' + codes.join(', ') + '\n' : '';
  var text =
    'Intake Form: ' + label + '\n' +
    'Patient & TRX: ' + (patient || 'N/A') + '\n' +
    'Emailed To: ' + (recipient || 'N/A') + '\n' +
    recoLine;

  intakeCopyText_(text);
  if (onView) intakeShowNoteDraftModal_(label, text);

  // Best-effort history write — reuses the rep-callable submitCallNote (locked +
  // audited server-side). Marked via subformData.intakeType (chip) + a TOP-LEVEL
  // tags array: sanitizeCallNotePayload_ reads tags from p.tags only and
  // whitelists subformData keys (INV-143) — intakeType is on that whitelist
  // (bounded ppd|pmd|pap enum); tags nested inside subformData are dropped
  // (the cycle-9 M-3 regression: both chip + tag silently vanished at submit).
  var notePayload = {
    caller: '',
    patientAndTrx: patient,
    issue: label + ' intake submitted',
    resolution: 'Emailed to ' + (recipient || 'N/A') + (codes.length ? ' · Rec: ' + codes.join(', ') : ''),
    tags: ['intake-' + ft],
    subformData: { intakeType: ft }
  };
  google.script.run
    .withSuccessHandler(function (res) {
      var ok = res && res.success;
      intakeNoteDraftStatus_(ok, ok ? 'Added to your Call Notes history' : ((res && res.error) || 'Could not add to Call Notes history'));
    })
    .withFailureHandler(function (err) {
      intakeNoteDraftStatus_(false, 'Could not add to history — ' + ((err && err.message) || err));
    })
    .submitCallNote(notePayload);
}

function intakeShowNoteDraftModal_(label, text) {
  var body =
    '<p style="margin:0 0 8px;font-size:.84rem;color:var(--muted);">A note was drafted from this ' + esc(label) +
      ' submission, copied to your clipboard, and added to your Call Notes history.</p>' +
    '<textarea class="intk-note-box" id="intk-note-box" aria-label="Call note text, ready to copy" readonly rows="5">' + esc(text) + '</textarea>' +
    '<div class="intk-note-status" id="intk-note-status">' + icon('clock', 12) + ' Saving to Call Notes…</div>' +
    '<div class="intk-foot">' +
      '<button class="intk-btn" onclick="intakeCopyNoteBox_()">' + icon('copy', 14) + ' Copy again</button>' +
      '<button class="intk-btn" onclick="intakeOpenCallNotes_()">' + icon('mail', 14) + ' Open Call Notes</button>' +
      '<span class="grow"></span>' +
      '<button class="intk-btn primary" data-intk-close="1">Done</button>' +
    '</div>';
  intakeOpenModal_('Note copied for the CRM', body);
}

// Cycle-9 L-23: close the modal BEFORE navigating — the intake modal is a
// document.body overlay, and showView only closes the KB drawer on nav, so the
// old bare enterTool() swapped #view-area BEHIND the still-open full-screen
// overlay (the button looked dead until the rep also pressed Done/Esc).
function intakeOpenCallNotes_() {
  try { intakeCloseModal_(); } catch (_) {}
  enterTool('callNotes', 'callNotes');
}

function intakeNoteDraftStatus_(ok, msg) {
  var el = document.getElementById('intk-note-status');
  if (!el) return;
  el.innerHTML = (ok ? icon('checkCircle', 12) : icon('warning', 12)) + ' ' + esc(msg);
  el.style.color = ok ? 'var(--success-deep)' : 'var(--warning-deep)';
}

function intakeCopyNoteBox_() {
  var el = document.getElementById('intk-note-box');
  if (el) intakeCopyText_(el.value);
}

// Copy plain text to the clipboard (navigator.clipboard with an execCommand
// fallback for HtmlService iframes — same pattern as the link/image copies).
function intakeCopyText_(txt) {
  function fallback() {
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('Note copied', 'toast-success');
    } catch (e) { showToast('Copy failed', 'toast-error'); }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { showToast('Note copied', 'toast-success'); }, fallback);
    } else { fallback(); }
  } catch (e) { fallback(); }
}
</script>
