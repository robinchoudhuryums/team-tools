  .intk-row .q { font-size: .88rem; color: var(--ink); font-weight: 600; }

  .intk-rec .star.on { color: #FFD700; }
  .intk-rec .meta { flex: 1; }
  .intk-rec .code { font-weight: 700; }
  .intk-rec .just { font-size: .82rem; color: var(--muted); margin-top: 3px; }
  .intk-rec img { width: 84px; height: auto; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  .intk-rec .code-link { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }

  .intk-rec-noimg { width: 84px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: .7rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; flex-shrink: 0; }
  .intk-rec-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }

  .intk-rec-mini:hover { background: var(--paper-card); }

// conditional-formatting answer keys, so the email coloring matches).

// ── PPD view ──────────────────────────────────────────────────────────────
function enterIntakePpdView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  var lang = INTAKE_STATE.ppd.lang;
  area.innerHTML =
    (COMPACT_MODE ? '<div class="compact-header">' + icon('send', 16) + ' PPD</div>' : '') +
    '<div class="intk-wrap">' +
      (COMPACT_MODE ? '' : '<div class="view-title-row"><h2>PPD — Patient Profile & Recommendation</h2></div>') +
      '<div class="intk-bar">' +
        intakeLangToggleHtml_('ppd') +
        '<span class="grow"></span>' +
      '</div>' +
      '<div class="intk-patient">' +
        '<label for="intk-ppd-patient">Patient Name &amp; Trx#</label>' +
        '<input type="text" id="intk-ppd-patient" placeholder="e.g. Jane Doe — TRX 12345" autocomplete="off">' +
      '</div>' +
      '<div class="intk-grid" id="intk-ppd-grid">' + intakeRenderPpdRows_(lang) + '</div>' +
      '<div class="intk-actions">' +
        '<button class="intk-btn primary" onclick="intakePpdPreview_()">' + icon('send', 14) + ' Preview &amp; Recommend</button>' +
        '<button class="intk-btn" onclick="intakeClearForm_(\'ppd\')">Clear</button>' +
      '</div>' +
    '</div>';
}

function intakeRenderPpdRows_(lang) {
  var qs = INTAKE_PPD_Q[lang] || INTAKE_PPD_Q.EN;
  var html = '';
  for (var i = 1; i < qs.length; i++) {
    var raw = qs[i];
    if (!raw || !String(raw).trim()) continue;
    var isSecondary = /^\s+/.test(raw);
    var text = String(raw).trim();
    var m = text.match(/^(\d+[a-z]?)\./);
    if (!m) { // section header (no leading number)
      html += '<div class="intk-head">' + esc(text) + '</div>';
      continue;
    }
    var qNum = m[1];
    html += '<div class="intk-row' + (isSecondary ? ' secondary' : '') + '" data-qnum="' + esc(qNum) + '">' +
      '<div class="q">' + esc(text) + '</div>' +
      '<input type="text" autocomplete="off" data-intk-qnum="' + esc(qNum) + '">' +
    '</div>';
  }
  return html;
}

// Collect { patientInfo, answers, rows, language } from the PPD DOM.
function intakeCollectPpd_() {
  var lang = INTAKE_STATE.ppd.lang;
  var qs = INTAKE_PPD_Q[lang] || INTAKE_PPD_Q.EN;
  var grid = document.getElementById('intk-ppd-grid');
  var answers = {};
  var rows = [];
  // walk the question array in order, pulling values from inputs by qNum
  for (var i = 1; i < qs.length; i++) {
    var raw = qs[i];
    if (!raw || !String(raw).trim()) continue;
    var isSecondary = /^\s+/.test(raw);
    var text = String(raw).trim();
    var m = text.match(/^(\d+[a-z]?)\./);
    if (!m) { rows.push({ isHeader: true, label: text }); continue; }
    var qNum = m[1];
    var input = grid ? grid.querySelector('input[data-intk-qnum="' + qNum + '"]') : null;
    var val = input ? input.value.trim() : '';
    answers[qNum] = val;
    rows.push({ qNum: qNum, label: text, value: val, isSecondary: isSecondary });
  }
  var patientEl = document.getElementById('intk-ppd-patient');
  return { patientInfo: patientEl ? patientEl.value.trim() : '', answers: answers, rows: rows, language: lang };
}

function intakePpdPreview_() {
  var payload = intakeCollectPpd_();
  if (!payload.patientInfo) { showToast('Enter the Patient Name & Trx# first.', 'toast-warn'); return; }
  var requested = currentView;
  showToast('Building preview…', '');
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      if (!res || res.error) { showToast((res && res.error) || 'Preview failed.', 'toast-error'); return; }
      INTAKE_STATE.preview = { formType: 'PPD', bodyHash: res.bodyHash, subject: res.subject, recommendations: res.recommendations, payload: payload };
      intakeOpenPpdPreviewModal_(res.html, res.recommendations);
    })
    .withFailureHandler(function (err) { if (currentView === requested) showToast('Preview failed: ' + (err.message || err), 'toast-error'); })
    .intakePreviewPPD(payload);
}

function intakeOpenPpdPreviewModal_(html, recs) {
  if (!INTAKE_STATE.ppd.agents) {
    google.script.run.withSuccessHandler(function (r) {
      INTAKE_STATE.ppd.agents = (r && r.agents) || [];
      intakeBuildPpdModal_(html, recs);
    }).withFailureHandler(function () { INTAKE_STATE.ppd.agents = []; intakeBuildPpdModal_(html, recs); }).getIntakeAgents();
  } else {
    intakeBuildPpdModal_(html, recs);
  }
}

function intakeBuildPpdModal_(html, recs) {
  var items = [].concat((recs && recs.complex) || [], (recs && recs.standard) || []);
  var panel = items.length
    ? items.map(function (p) {
        var id = String(p.hcpcs).replace(/\s+/g, '-');
        var imgUrl = p.imageUrl ? esc(p.imageUrl) : '';
        var pdfUrl = p.pdfLink ? esc(p.pdfLink) : '';
        // Image opens full-size in a new tab (agent can right-click/copy/save to
        // text the patient); code links to the brochure PDF.
        var imgHtml = imgUrl
          ? '<a href="' + imgUrl + '" target="_blank" rel="noopener" title="Open full image"><img src="' + imgUrl + '" alt="' + esc(p.hcpcs) + '"></a>'
          : '<div class="intk-rec-noimg">no image</div>';
        var codeHtml = pdfUrl
          ? '<a href="' + pdfUrl + '" target="_blank" rel="noopener" class="code code-link" title="Open brochure">' + esc(p.hcpcs) + ' ' + icon('popOut', 11) + '</a>'
          : '<span class="code">' + esc(p.hcpcs) + '</span>';
        var actions = '<div class="intk-rec-actions">';
        if (imgUrl) actions += '<button type="button" class="intk-rec-mini" data-img="' + imgUrl + '" onclick="intakeCopyImage_(this)">' + icon('copy', 11) + ' Copy image</button>';
        if (imgUrl) actions += '<button type="button" class="intk-rec-mini" data-copy="' + imgUrl + '" onclick="intakeCopyLink_(this)">Image link</button>';
        if (pdfUrl) actions += '<button type="button" class="intk-rec-mini" data-copy="' + pdfUrl + '" onclick="intakeCopyLink_(this)">Brochure link</button>';
        actions += '</div>';
        return '<div class="intk-rec" data-rec-id="' + esc(id) + '">' +
          '<span class="star" data-star="' + esc(id) + '" onclick="intakeToggleStar_(this)" title="Mark preferred (starred in the email)">&#9733;</span>' +
          imgHtml +
          '<div class="meta">' + codeHtml +
            '<div class="just">' + esc(intakeStripTags_(p.justification)) + '</div>' + actions +

function intakeToggleStar_(el) {

  el.classList.toggle('on');
}

// Copy a URL (image or brochure) to the clipboard so the agent can paste it
// into their texting tool. navigator.clipboard with a <textarea> execCommand
// fallback (the HtmlService iframe often blocks the async clipboard API).
function intakeCopyLink_(btn) {
  var txt = btn.getAttribute('data-copy') || '';
  if (!txt) return;
  function fallback() {
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('Link copied', 'toast-success');
    } catch (e) { showToast('Copy failed — ' + txt, 'toast-error'); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { showToast('Link copied', 'toast-success'); }, fallback);
  } else { fallback(); }
}

// Best-effort copy of the actual device IMAGE bytes (so it can be pasted
// straight into a text). Clipboard image-write is unreliable in the iframe and
// needs permissive CORS on the image host, so it falls back to opening the
// image in a new tab for a native right-click copy/save.
function intakeCopyImage_(btn) {
  var url = btn.getAttribute('data-img');
  if (!url) return;
  function openIt() { window.open(url, '_blank', 'noopener'); showToast('Opened image — right-click to copy/save', ''); }
  try {
    if (navigator.clipboard && window.ClipboardItem && window.fetch) {
      fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
        var item = {}; item[blob.type || 'image/png'] = blob;
        return navigator.clipboard.write([new ClipboardItem(item)]);
      }).then(function () { showToast('Image copied — paste into your text', 'toast-success'); })
        .catch(openIt);
      return;
    }
  } catch (e) {}
  openIt();
}

function intakeGatherSelections_() {
  var sel = {};
  document.querySelectorAll('.intk-rec').forEach(function (row) {
    var id = row.getAttribute('data-rec-id');
    var statusEl = row.querySelector('.status-sel');
    var starEl = row.querySelector('.star');
    sel[id] = { status: statusEl ? statusEl.value : 'none', preferred: !!(starEl && starEl.classList.contains('on')) };
  });
  return sel;
}

function intakePpdSend_() {
  var st = INTAKE_STATE.preview;

  st.payload.selections = intakeGatherSelections_();
  var btn = document.getElementById('intk-ppd-send');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  google.script.run
    .withSuccessHandler(function (res) {

      intakeCloseModal_();

    .intakeSendPPD(st.payload, spec, st.bodyHash);

function intakeRenderAcctRows_(form, lang) {
  var qs = intakeAcctBank_(form)[lang] || intakeAcctBank_(form).EN;
  var L = intakeAcctLayout_(form);
  var html = '';
  for (var i = 0; i < qs.length; i++) {
    var label = String(qs[i] || '');
    if (L.headers.indexOf(i) >= 0) { html += '<div class="intk-head">' + esc(label) + '</div>'; continue; }
    var isSecondary = L.secondary.indexOf(i) >= 0;
    var control;
    if (L.checkboxes.indexOf(i) >= 0) {
      control = '<label class="ck"><input type="checkbox" data-intk-idx="' + i + '"> Yes</label>';
    } else if (L.selects[i]) {
      control = '<select data-intk-idx="' + i + '">' + L.selects[i].map(function (o) { return '<option value="' + esc(o) + '">' + esc(o || '— select —') + '</option>'; }).join('') + '</select>';
    } else {
      control = '<input type="text" autocomplete="off" data-intk-idx="' + i + '">';
    }
    html += '<div class="intk-row' + (isSecondary ? ' secondary' : '') + '"><div class="q">' + esc(label) + '</div>' + control + '</div>';
  }
  return html;
}

// DOB is form index 5 for both PMD & PAP; patient name is index 1.
function intakeCollectAcct_(form) {
  var lang = INTAKE_STATE[form].lang;
  var qs = intakeAcctBank_(form)[lang] || intakeAcctBank_(form).EN;
  var L = intakeAcctLayout_(form);
  var grid = document.getElementById('intk-' + form + '-grid');
  var rows = [], answers = {};
  for (var i = 0; i < qs.length; i++) {
    var label = String(qs[i] || '');
    if (L.headers.indexOf(i) >= 0) { rows.push({ qIndex: i, label: label, isHeader: true }); continue; }
    var el = grid ? grid.querySelector('[data-intk-idx="' + i + '"]') : null;
    var val;
    if (el && el.type === 'checkbox') val = el.checked ? 'TRUE' : 'FALSE';
    else val = el ? String(el.value).trim() : '';
    answers[i] = val;
    rows.push({ qIndex: i, label: label, value: val, isSecondary: L.secondary.indexOf(i) >= 0 });
  }
  var nameEl = grid ? grid.querySelector('[data-intk-idx="1"]') : null;
  var dobEl = grid ? grid.querySelector('[data-intk-idx="5"]') : null;
  return {
    patientInfo: nameEl ? String(nameEl.value).trim() : '',
    dob: dobEl ? String(dobEl.value).trim() : '',
    answers: answers, rows: rows, language: lang,
  };
}

function intakeAcctPreview_(form) {

  var defLabel = form === 'pap' ? 'Default (Sleep)' : 'Default (Sales)';

function intakeAcctSend_(form) {
  var st = INTAKE_STATE.preview;

  var images = INTAKE_STATE[form].images || [];

  google.script.run
    .withSuccessHandler(function (res) {

      intakeCloseModal_();
      intakeClearForm_(form);
      showToast(form.toUpperCase() + ' emailed to ' + res.recipient, 'toast-success');
    })
    .withFailureHandler(function (err) { if (btn) { btn.disabled = false; btn.innerHTML = icon('send', 14) + ' Send Email'; } showToast('Send failed: ' + (err.message || err), 'toast-error'); })
    [fn](st.payload, spec, images, st.bodyHash);

// ── Image upload (PMD/PAP) ────────────────────────────────────────────────
function intakeSetupImageUpload_(form) {
  var drop = document.getElementById('intk-drop');
  var fileInput = document.getElementById('intk-file');
  if (!drop || !fileInput) return;
  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { intakeHandleFiles_(form, this.files); this.value = ''; });
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); }, false);
  });
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function () { drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function () { drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { intakeHandleFiles_(form, e.dataTransfer.files); });
  drop._intkPaste = function (e) {
    var items = (e.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) { intakeProcessImage_(form, items[i].getAsFile()); e.preventDefault(); }
    }
  };
  document.addEventListener('paste', drop._intkPaste);
}

function intakeHandleFiles_(form, files) {
  if (!files) return;
  for (var i = 0; i < files.length; i++) { if (files[i].type.indexOf('image/') === 0) intakeProcessImage_(form, files[i]); }
}

function intakeProcessImage_(form, file) {
  if (!file) return;
  var max = 12;
  if ((INTAKE_STATE[form].images || []).length >= max) { showToast('Up to ' + max + ' images.', 'toast-warn'); return; }
  var reader = new FileReader();
  reader.onload = function (e) { INTAKE_STATE[form].images.push(e.target.result); intakeRenderGallery_(form); };
  reader.readAsDataURL(file);
}

function intakeRenderGallery_(form) {
  var g = document.getElementById('intk-gallery');
  if (!g) return;
  g.innerHTML = (INTAKE_STATE[form].images || []).map(function (src, idx) {
    return '<div class="intk-thumb"><img src="' + esc(src) + '" alt=""><span class="rm" onclick="intakeRemoveImage_(\'' + form + '\',' + idx + ')">&#10005;</span></div>';
  }).join('');
}

function intakeRemoveImage_(form, idx) {
  INTAKE_STATE[form].images.splice(idx, 1);
  intakeRenderGallery_(form);
}

// Caller-scoped server-side (rep sees own; manager sees all). Read-only.
// Answer labels are reconstructed client-side from the question banks using
// the submission's stored language, so nothing but the stored answers rides
// the wire twice. Every value is esc()'d before innerHTML.

function enterIntakeSentView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  area.innerHTML =
    (COMPACT_MODE ? '<div class="compact-header">' + icon('send', 16) + ' Sent Intake</div>' : '<div class="view-title-row"><h2>Sent Intake Forms</h2></div>') +

function intakeRenderSentList_(subs, isManager) {
  if (!subs || subs.length === 0) {
    return '<div class="no-data" style="padding:20px 0">No intake submissions yet' +
      (isManager ? '.' : ' — your sent PPD / PMD / PAP forms will appear here.') + '</div>';
  }

    '<div class="intk-head">' + (isManager ? 'All reps · ' : 'Your submissions · ') + 'newest first (max 100)</div>' +

        '<div class="q" style="font-weight:400"><strong>' + esc(s.formType) + '</strong> · ' + esc(s.patientInfo || '(no patient label)') +

function intakeOpenSent_(btn) {
  var s = (INTAKE_STATE.sent || [])[parseInt(btn.getAttribute('data-sent-idx'), 10)];
  if (!s) return;
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      if (!res || res.error) { showToast((res && res.error) || 'Could not load the submission', 'toast-error'); return; }
      intakeOpenModal_(res.formType + ' — ' + (res.patientInfo || res.submissionId), intakeRenderSentDetail_(res));
    })
    .withFailureHandler(function (err) {
      btn.disabled = false;
      showToast((err && err.message) || 'Could not load the submission', 'toast-error');
    })
    .intakeGetSubmission(s.formType, s.submissionId);
}

function intakeRenderSentDetail_(d) {
  var lang = (d.language === 'ES') ? 'ES' : 'EN';
  var na = '<span style="color:var(--muted);font-style:italic">N/A</span>';
  var rowsHtml = '';
  if (d.formType === 'PPD') {
    var qs = INTAKE_PPD_Q[lang] || INTAKE_PPD_Q.EN;
    for (var i = 1; i < qs.length; i++) {
      var raw = qs[i];
      if (!raw || !String(raw).trim()) continue;
      var text = String(raw).trim();
      var m = text.match(/^(\d+[a-z]?)\./);
      if (!m) { rowsHtml += '<div class="intk-head">' + esc(text) + '</div>'; continue; }
      var val = (d.answers || {})[m[1]];
      rowsHtml += '<div class="intk-row' + (/^\s+/.test(raw) ? ' secondary' : '') + '">' +
        '<div class="q">' + esc(text) + '</div>' +
        '<div>' + (val ? esc(String(val)) : na) + '</div></div>';
    }
    var recs = [].concat(
      (d.recommendations && d.recommendations.complex) || [],
      (d.recommendations && d.recommendations.standard) || []);
    if (recs.length > 0) {
      rowsHtml += '<div class="intk-head">Recommendations sent</div>';
      recs.forEach(function (p) {
        var rid = String(p.hcpcs).replace(/\s+/g, '-');
        var sel = (d.selections || {})[rid] || {};
        var bits = [];
        if (sel.preferred) bits.push('★ preferred');
        if (sel.status && sel.status !== 'none') bits.push(sel.status);
        rowsHtml += '<div class="intk-row"><div class="q" style="font-weight:400">' + esc(String(p.hcpcs)) + '</div>' +
          '<div style="font-size:.82rem;color:var(--muted)">' + esc(bits.join(' · ') || '—') + '</div></div>';
      });
    }
  } else {
    var bank = (d.formType === 'PAP') ? INTAKE_PAP_Q : INTAKE_PMD_Q;
    var L = (d.formType === 'PAP') ? INTAKE_PAP_CLIENT : INTAKE_PMD_CLIENT;
    var qs2 = bank[lang] || bank.EN;
    for (var j = 0; j < qs2.length; j++) {
      var label2 = String(qs2[j] || '');
      if (L.headers.indexOf(j) >= 0) { rowsHtml += '<div class="intk-head">' + esc(label2) + '</div>'; continue; }
      var v2 = (d.answers || {})[j];
      var disp;
      if (L.checkboxes.indexOf(j) >= 0) disp = (v2 === 'TRUE') ? 'Yes' : 'No';
      else disp = (v2 == null || v2 === '') ? '' : String(v2);
      rowsHtml += '<div class="intk-row' + (L.secondary.indexOf(j) >= 0 ? ' secondary' : '') + '">' +
        '<div class="q">' + esc(label2) + '</div>' +
        '<div>' + (disp ? esc(disp) : na) + '</div></div>';
    }
    if (d.imageCount) {
      rowsHtml += '<div class="intk-row"><div class="q">Images attached</div><div>' + Number(d.imageCount) + '</div></div>';
    }
  }
  var meta = '<div style="font-size:.8rem;color:var(--muted);margin-bottom:10px">' +
    esc(d.timestamp) + ' · sent by ' + esc(d.repName) + ' · to ' + esc(d.recipient) + '</div>';
  return meta + '<div class="intk-grid">' + rowsHtml + '</div>';
}

  return '<div class="intk-lang">' +
    '<button class="' + (lang === 'EN' ? 'on' : '') + '" onclick="intakeSetLang_(\'' + form + '\',\'EN\')">English</button>' +
    '<button class="' + (lang === 'ES' ? 'on' : '') + '" onclick="intakeSetLang_(\'' + form + '\',\'ES\')">Español</button>' +
  '</div>';
}

function intakeSetLang_(form, lang) {
  if (INTAKE_STATE[form].lang === lang) return;
  // preserve in-progress answers across the language flip (keys are qNum/qIndex)
  var snapshot = (form === 'ppd') ? intakeCollectPpd_() : intakeCollectAcct_(form);
  INTAKE_STATE[form].lang = lang;
  if (form === 'ppd') enterIntakePpdView(); else intakeEnterAcct_(form, form === 'pap' ? 'PAP Account Creation' : 'PMD Account Creation');
  intakeRestoreAnswers_(form, snapshot);
}

function intakeRestoreAnswers_(form, snapshot) {
  var grid = document.getElementById('intk-' + form + '-grid');
  if (!grid || !snapshot) return;
  if (form === 'ppd') {
    var pat = document.getElementById('intk-ppd-patient');
    if (pat) pat.value = snapshot.patientInfo || '';
    Object.keys(snapshot.answers || {}).forEach(function (qNum) {
      var el = grid.querySelector('input[data-intk-qnum="' + qNum + '"]');
      if (el) el.value = snapshot.answers[qNum];
    });
  } else {
    Object.keys(snapshot.answers || {}).forEach(function (idx) {
      var el = grid.querySelector('[data-intk-idx="' + idx + '"]');
      if (!el) return;
      if (el.type === 'checkbox') el.checked = snapshot.answers[idx] === 'TRUE';
      else el.value = snapshot.answers[idx];
    });
  }
}

function intakeClearForm_(form) {
  INTAKE_STATE[form].images = [];
  if (form === 'ppd') enterIntakePpdView();
  else intakeEnterAcct_(form, form === 'pap' ? 'PAP Account Creation' : 'PMD Account Creation');
}

function intakeStripTags_(s) { return String(s == null ? '' : s).replace(/<[^>]*>/g, ''); }

// Minimal modal built on the shared .overlay vocabulary. Created via
// ensureOverlay (script_core) with intakeCloseModal_ as the close hook, so
// EVERY close path — Escape included — removes the document-level paste
// listener. (Esc previously only hid the node, leaking the listener app-wide:
// any image pasted anywhere kept accumulating into INTAKE_STATE silently.)
function intakeOpenModal_(title, bodyHtml) {
  intakeCloseModal_();
  var ov = ensureOverlay('intk-modal-overlay', { onClose: intakeCloseModal_ });
  ov.innerHTML = '<div class="modal intk-modal" role="dialog" aria-modal="true">' +
    '<div class="head"><h3>' + esc(title) + '</h3><button class="xclose" data-intk-close="1" aria-label="Close">' + icon('x', 16) + '</button></div>' +
    '<div class="body">' + bodyHtml + '</div></div>';
  ov.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('[data-intk-close]')) intakeCloseModal_();
  });
}

function intakeCloseModal_() {
  var ov = document.getElementById('intk-modal-overlay');
  if (!ov) return;
  var drop = document.getElementById('intk-drop');
  if (drop && drop._intkPaste) document.removeEventListener('paste', drop._intkPaste);
  ov.remove();
}
</script>
