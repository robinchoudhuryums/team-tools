<style>
  /* ── Intake tool (PPD + PMD/PAP account creation) — Console redesign ──── */
  /* Shell uses the shared .app-bar / .toolbar-tabs / .panel / .kicker-pill
     vocabulary (no bespoke navy --brand header, no .intk-lang). View-scoped
     .intk-* classes layer the form-specific controls on top of the tokens. */
  .intk-wrap { max-width: 920px; margin: 0 auto; }
  .intk-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .intk-bar .grow { flex: 1; }
  .intk-patient { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .intk-patient label { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .intk-patient input { padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; background: var(--paper-card); color: var(--ink); }

  /* PPD layout — questionnaire + sticky side progress rail (ring + actions
     that scroll with the user). Replaces the old pinned top bar. */
  /* default align-items:stretch so the rail cell spans the full questionnaire
     height — gives position:sticky room to travel as the user scrolls */
  .intk-ppd-layout { display: grid; grid-template-columns: 1fr 210px; gap: 22px; max-width: 1060px; margin: 0 auto; }
  .intk-main { min-width: 0; }
  /* Sticks lower in the viewport (≈middle) rather than hugging the top as the
     questionnaire scrolls; clamped so the rail's buttons stay on-screen on short
     viewports. */
  .intk-rail-sticky { position: sticky; top: clamp(14px, 16vh, 150px); display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 16px 14px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper-card); box-shadow: var(--shadow-sm); }
  .intk-rail-label { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .intk-ring { position: relative; width: 104px; height: 104px; }
  .intk-ring svg { display: block; width: 100%; height: 100%; }
  .intk-ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: 20px; color: var(--ink); }
  .intk-ring-fg { transition: stroke-dashoffset .45s var(--ease); }
  .intk-rail-count { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: -4px; }
  .intk-rail .intk-btn { width: 100%; justify-content: center; }
  /* Per-section stepper: a clickable section navigator with done/partial state. */
  .intk-stepper { width: 100%; display: flex; flex-direction: column; gap: 2px; margin: 2px 0 4px; }
  .intk-step { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 7px; padding: 5px 7px; cursor: pointer;
    color: var(--muted); font-size: 12px; line-height: 1.25; transition: background .12s, color .12s; }
  .intk-step:hover { background: var(--paper-2); color: var(--ink); }
  .intk-step-dot { flex: none; width: 9px; height: 9px; border-radius: 50%;
    border: 1.5px solid var(--line); background: var(--paper-3); transition: background .15s, border-color .15s; }
  .intk-step.is-partial .intk-step-dot { border-color: var(--warn); background: var(--warn-soft); }
  .intk-step.is-done .intk-step-dot { border-color: var(--accent); background: var(--accent); }
  .intk-step.is-done { color: var(--ink); }
  .intk-step-lbl { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .intk-step-frac { flex: none; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  @media (max-width: 760px) {
    .intk-ppd-layout { grid-template-columns: 1fr; }
    .intk-rail { order: -1; }
    .intk-rail-sticky { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 10px 14px; }
    .intk-ring { width: 64px; height: 64px; }
    .intk-ring .pct { font-size: 14px; }
    .intk-rail-label { width: 100%; text-align: center; }
    .intk-rail .intk-btn { width: auto; }
    /* Wrap the stepper into a horizontal chip row on narrow screens. */
    .intk-stepper { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px; }
    .intk-step { width: auto; border: 1px solid var(--line); }
    .intk-step-lbl { max-width: 120px; }
  }

  /* Section panels (one per question group) */
  .intk-sections { display: flex; flex-direction: column; gap: 14px; }
  .intk-section .sec-title { margin-bottom: 4px; }
  /* #4 — per-category section-header color (PPD blue, PMD orange, PAP purple),
     so each Intake tab's cards read as its own category. Header gets a tinted
     bar + accent left-rail + colored label. */
  .intk-cat-ppd .sec-title,
  .intk-cat-pmd .sec-title,
  .intk-cat-pap .sec-title {
    margin: -2px -2px 10px; padding: 10px 15px; border-radius: var(--radius-sm);
    border-left: 4px solid var(--muted); font-weight: 700; letter-spacing: .04em;
    font-size: 12.5px;
  }
  .intk-cat-ppd .sec-title { background: var(--info-soft);        border-left-color: var(--info);   color: var(--info-deep); }
  .intk-cat-pmd .sec-title { background: var(--warn-soft);        border-left-color: var(--warn);   color: var(--warning-deep); }
  .intk-cat-pap .sec-title { background: rgba(124, 92, 208, .14); border-left-color: #7c5cd0;       color: #6a45c0; }
  :root[data-mode="dark"] .intk-cat-pap .sec-title { color: #c3a8f5; }
  /* Category-tinted top rail on each section card for extra at-a-glance cueing */
  .intk-cat-ppd .intk-section { box-shadow: var(--shadow-sm), inset 0 2px 0 var(--info); }
  .intk-cat-pmd .intk-section { box-shadow: var(--shadow-sm), inset 0 2px 0 var(--warn); }
  .intk-cat-pap .intk-section { box-shadow: var(--shadow-sm), inset 0 2px 0 #7c5cd0; }

  /* Question row — label + control */
  .intk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 0; align-items: center; border-top: 1px solid var(--line); }
  .intk-row:first-child { border-top: none; }
  .intk-row .q { font-size: .88rem; color: var(--ink); font-weight: 600; }
  .intk-row.secondary .q { font-weight: 400; font-style: italic; color: var(--muted); padding-left: 18px; }
  .intk-row input[type=text], .intk-row input[type=email], .intk-row input[type=date], .intk-row select, .intk-row textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); font: inherit; background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; }

  /* Yes/No color-coded toggle (PPD + account Yes/No items) */
  .intk-yn { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; width: fit-content; }
  .intk-yn-btn { appearance: none; border: none; background: var(--paper-2); color: var(--muted); font: inherit; font-size: .85rem; padding: 6px 18px; cursor: pointer; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
  .intk-yn-btn + .intk-yn-btn { border-left: 1px solid var(--line); }
  .intk-yn-btn:hover { color: var(--ink); }
  .intk-yn-btn.yes.on { background: var(--accent); color: var(--paper); }
  .intk-yn-btn.no.on  { background: var(--destructive); color: var(--paper); }

  /* Consistent-pain severity scale (None / Mild / Mod / Severe) */
  .intk-sev { display: flex; gap: 6px; }
  .intk-sev-chip { flex: 1; appearance: none; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-2); color: var(--muted); font: inherit; font-size: .78rem; padding: 6px 4px; cursor: pointer; text-align: center; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
  .intk-sev-chip:hover { color: var(--ink); }
  .intk-sev-chip.on[data-set="None"]   { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .intk-sev-chip.on[data-set="Mild"]   { background: var(--warn-soft); color: var(--warning-deep); border-color: transparent; }
  .intk-sev-chip.on[data-set="Mod"]    { background: var(--warn); color: var(--paper); border-color: var(--warn); }
  .intk-sev-chip.on[data-set="Severe"] { background: var(--destructive); color: var(--paper); border-color: var(--destructive); }

  /* PPD redesign Phase 1 — new control kinds (unused until Phase 2 opts questions in).
     Operator feedback 2026-07-09: `choice` groups were a JOINED segmented box that
     wrapped awkwardly with 3 long labels (Q2–Q6 — the second line rendered as a
     detached box with a stray gap). They now render as the same separated pill
     buttons the `multi` kind uses (the Q1 look), which wrap cleanly; markup and
     values are unchanged, CSS only. `.intk-reveal-opts` shares .intk-choice-btn
     children, so it gets the same pill treatment. */
  .intk-choice { display: flex; flex-wrap: wrap; gap: 6px; }
  .intk-choice-btn { appearance: none; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-2); color: var(--muted); font: inherit; font-size: .82rem; padding: 6px 14px; cursor: pointer; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
  .intk-choice-btn:hover { color: var(--ink); }
  .intk-choice-btn.on { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  .intk-multi { display: flex; flex-wrap: wrap; gap: 6px; }
  .intk-multi-btn { appearance: none; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-2); color: var(--muted); font: inherit; font-size: .82rem; padding: 6px 14px; cursor: pointer; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
  .intk-multi-btn:hover { color: var(--ink); }
  .intk-multi-btn.on { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  /* Operator feedback 2026-07-09 — severity-toned SELECTED states for the
     engine-critical multis (Q25/Q31a/Q34). data-tone is DISPLAY-ONLY config
     (the stored value is still the option's canonical-English `v` — INV-112);
     the palette mirrors the pain scale: warn ≈ Mild, danger ≈ Severe, and
     'no' = the dark ink chip the scale uses for "None". */
  .intk-multi-btn.on[data-tone="warn"]   { background: var(--warn-soft); color: var(--warning-deep); border-color: transparent; }
  .intk-multi-btn.on[data-tone="danger"] { background: var(--destructive-soft); color: var(--danger-deep); border-color: transparent; }
  .intk-multi-btn.on[data-tone="no"]     { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .intk-numunit { display: inline-flex; align-items: center; gap: 8px; }
  .intk-numunit input { width: 6.5em; }
  .intk-unit { font-size: .85rem; color: var(--muted); }
  .intk-reveal { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .intk-reveal-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .intk-reveal-text { min-width: 240px; }
  /* Operator feedback 2026-07-09 — Q40 two-part control: Yes/No, then a
     number-only field + unit text revealed on Yes (the ynreveal layout). */
  .intk-ynnum { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  /* Phase 3 — curated condition picker (search box + filterable multi-select + chips). */
  .intk-condition { display: flex; flex-direction: column; gap: 8px; max-width: 460px; }
  .intk-cond-filter { width: 100%; }
  .intk-cond-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 172px; overflow-y: auto; padding: 2px; }
  .intk-cond-opt { appearance: none; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-2); color: var(--muted); font: inherit; font-size: .82rem; padding: 5px 12px; cursor: pointer; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
  .intk-cond-opt:hover { color: var(--ink); }
  .intk-cond-opt.on { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  .intk-cond-add { appearance: none; border: 1px dashed var(--accent); border-radius: var(--radius-sm); background: transparent; color: var(--accent); font: inherit; font-size: .82rem; padding: 5px 12px; cursor: pointer; }
  .intk-cond-selected { display: flex; flex-wrap: wrap; gap: 6px; }
  .intk-cond-selected:empty { display: none; }
  .intk-cond-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-soft); color: var(--ink); border-radius: 999px; font-size: .8rem; padding: 3px 6px 3px 11px; }
  .intk-cond-chip-x { appearance: none; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 3px; }
  .intk-cond-chip-x:hover { color: var(--danger); }
  /* Phase 4 — label help glyph, Yes/No-reveals-multi, conditional-hide row.
     Operator feedback 2026-07-09: the glyph's NATIVE title tooltip clashed with
     the app's visual language — replaced with a tokened CSS bubble driven by
     data-tip (attr() content; shows on hover AND keyboard focus). The ink-on-
     paper inversion flips correctly in dark mode; left-anchored so it grows
     into the row instead of clipping off the label column's left edge. */
  .intk-help { position: relative; display: inline-flex; vertical-align: middle; margin-left: 5px; color: var(--muted); cursor: help; }
  .intk-help:hover, .intk-help:focus-visible { color: var(--accent); outline: none; }
  .intk-help::after {
    content: attr(data-tip);
    position: absolute; left: -10px; bottom: calc(100% + 9px); z-index: 30;
    width: min(320px, 58vw);
    background: var(--ink); color: var(--paper);
    font-size: .76rem; font-weight: 400; line-height: 1.5; text-transform: none; letter-spacing: 0;
    padding: 9px 12px; border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
    opacity: 0; visibility: hidden; transform: translateY(4px); pointer-events: none;
    transition: opacity var(--t) var(--ease), transform var(--t) var(--ease), visibility var(--t);
  }
  .intk-help::before {   /* caret */
    content: ''; position: absolute; left: 2px; bottom: calc(100% + 3px); z-index: 30;
    border: 6px solid transparent; border-top-color: var(--ink); border-bottom: none;
    opacity: 0; visibility: hidden; transform: translateY(4px); pointer-events: none;
    transition: opacity var(--t) var(--ease), transform var(--t) var(--ease), visibility var(--t);
  }
  .intk-help:hover::after, .intk-help:focus-visible::after,
  .intk-help:hover::before, .intk-help:focus-visible::before { opacity: 1; visibility: visible; transform: translateY(0); }
  .intk-ynreveal { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .intk-yr-sub { display: flex; flex-wrap: wrap; gap: 6px; }

  .intk-row textarea { resize: vertical; min-height: 58px; }
  /* Strongly-recommended-blank mark (operator 2026-08-25) — set by the
     pre-preview check, cleared when the field gains a value. Warn tokens
     only — a recommendation, never an error tone. */
  .intk-row.intk-recwarn { background: var(--warn-soft); border-radius: var(--radius-sm); padding-left: 8px; padding-right: 8px; }
  .intk-recwarn-note { grid-column: 1 / -1; font-size: .74rem; color: var(--warning-deep); }
  .intk-row .ck { display: inline-flex; align-items: center; gap: 7px; font-size: .85rem; color: var(--muted); }
  .intk-actions { display: flex; gap: 10px; margin-top: 16px; }

  /* Tokened group header (Sent list/detail + legacy uses; no more navy --brand) */
  .intk-head { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--paper-2); padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .intk-grid { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; background: var(--paper-card); }
  .intk-grid .intk-row { padding-left: 14px; padding-right: 14px; }

  /* Sent tab filter bar + rows */
  .intk-filter { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .intk-search { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; background: var(--paper-card); color: var(--ink); }
  .intk-sent-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  .intk-sent-row:first-child { border-top: none; }
  .intk-sent-meta { font-size: .76rem; color: var(--muted); margin-top: 2px; }

  /* Catalog browse tab (cycle-18 batch 8). The grid is INTRINSIC
     (auto-fill/minmax), so it reflows at every width on its own and owes no
     viewport breakpoint — the A2_INTRINSIC carve-out. */
  .intk-cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; align-items: start; }
  .intk-cat-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-card); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .intk-cat-card .cat-img { width: 100%; height: 110px; object-fit: contain; background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .intk-cat-card .cat-noimg { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; font-size: .72rem; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius-sm); }
  .intk-cat-card .cat-code { font-weight: 700; font-size: 1rem; }
  /* The recommendation cards' brochure-link treatment is scoped to .intk-rec,
     so without this the catalog's HCPCS link fell back to the UA default
     (blue + underline) — the app has ONE link vocabulary. */
  .intk-cat-card .code-link { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .intk-cat-card .code-link:hover { text-decoration: underline; }
  .intk-cat-card .cat-feat { font-size: .82rem; color: var(--ink); }
  .intk-cat-spec { display: flex; flex-wrap: wrap; gap: 6px; }
  .intk-cat-spec span { font-size: .7rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted-2); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 1px 8px; }
  .intk-cat-count { font-size: .78rem; color: var(--muted); margin-bottom: 10px; }

  /* preview modal */
  .intk-modal { width: min(860px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .intk-modal .body { overflow: auto; padding: 4px 2px; }
  /* #fff is DELIBERATE (mode-invariant): the preview hosts the rendered
     email body, whose colors are inline light-palette hex (CN_EMAIL_PALETTE)
     — a dark canvas would make the email text unreadable in dark mode. */
  .intk-prev { border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: 46vh; background: #fff; }
  .intk-recpanel { margin-top: 14px; }
  .intk-rec { display: flex; align-items: flex-start; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; }
  /* A1 (cycle 13): <button>, not <span>. This is the worst of the six click-only
     controls — starring marks the PREFERRED device in the clinical email that is
     actually sent to the agent, and there was no alternative path. */
  .intk-rec .star { appearance: none; -webkit-appearance: none; background: none; border: 0; padding: 0;
    font-family: inherit; font-size: 22px; color: var(--muted-2); cursor: pointer; line-height: 1; user-select: none; }
  .intk-rec .star.on { color: var(--accent); }
  .intk-rec .meta { flex: 1; }
  .intk-rec .code { font-weight: 700; }
  .intk-rec .just { font-size: .82rem; color: var(--muted); margin-top: 3px; }
  .intk-rec img { width: 84px; height: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; }
  .intk-rec .code-link { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .intk-rec .code-link:hover { text-decoration: underline; }
  .intk-rec-noimg { width: 84px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: .7rem; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius-sm); flex-shrink: 0; }
  .intk-rec-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .intk-rec-mini { font: inherit; font-size: .72rem; padding: 3px 8px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-2); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .intk-rec-mini:hover { background: var(--paper-card); }
  .intk-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 12px; }
  .intk-foot .grow { flex: 1; }
  .intk-foot select, .intk-foot input[type=email] { padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); font: inherit; background: var(--paper); color: var(--ink); }
  .intk-drop { border: 2px dashed var(--line-2); border-radius: var(--radius); padding: 12px; text-align: center; color: var(--muted); font-size: .8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .intk-drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .intk-gallery { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .intk-thumb { position: relative; width: 46px; height: 46px; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
  .intk-thumb img { width: 100%; height: 100%; object-fit: cover; }
  /* A1 (cycle 13): <button>, not <span> — removing one attached image was
     keyboard-unreachable; the only alternative was clearing the whole form. */
  .intk-thumb .rm { appearance: none; -webkit-appearance: none; border: 0; padding: 0; font-family: inherit;
    position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: var(--destructive); color: #fff; font-size: 11px; line-height: 16px; text-align: center; cursor: pointer; }
  :root[data-compact] .intk-row { grid-template-columns: 1fr; }
  /* F3 (cycle 16) — the A2 rule: this had a compact override and no viewport
     breakpoint, so a phone kept the 2-up desktop split. MEASURED at 390px:
     157px per column, i.e. 157px for question text like "Do you have
     consistent or frequent numbness/tingling in hands, feet or legs?" on a
     46-question clinical intake. The existing 760px query stacks the PPD
     LAYOUT (rail above form), which leaves each half ~350px and is still fine;
     2-up only stops working further down, hence a separate breakpoint. */
  @media (max-width: 560px) {

// had no notes field). Key 'notes' is NON-numeric on purpose: the engine reads
// only numbered keys, intakePpdSections_'s numeric-prefix parse never sees it
// (so the 46-question progress ring is untouched), and the get/set fallback
// selector [data-intk-qnum] addresses it — which gives drafts, restore, and
// collection the field for free.
var INTAKE_PPD_NOTES = {
  EN: { title: 'Additional Notes', label: 'Additional notes (optional)' },
  ES: { title: 'Notas Adicionales', label: 'Notas adicionales (opcional)' },
};

// Strongly-recommended fields (operator lists, 2026-08-25). Blank ones get a
// warn highlight + ONE confirm before preview — never a hard block, and never
// any field outside these lists. PPD keys are qNums; PMD/PAP are question-bank
// ARRAY indices (headers occupy indices too, so these are NOT the operator's
// 1-based field numbers — the mapping is pinned against the live bank labels
// in run.js so a bank edit fails CI instead of warning on the wrong field).
var INTAKE_RECOMMENDED = {
  ppd: (function () {
    var a = []; for (var i = 1; i <= 23; i++) a.push(String(i));
    return a.concat(['37', '38', '39a', '44']);   // + the Q40-hours conditional below
  })(),
  // #1 name, #2 primary phone, #5 DOB, #6 address, #7 primary insurance,
  // #10 PCP, #11 MDO ph, #13 height, #14 weight, #15 devices, #19 prior PME
  pmd: [1, 2, 5, 6, 8, 12, 13, 15, 16, 17, 22],
  // #1 name, #2 primary phone, #5 DOB, #6 address, #7 primary insurance,
  // #10 PCP, #11 MDO ph, #16 has CPAP, #20 machine/supplies/both
  pap: [1, 2, 5, 6, 8, 12, 13, 19, 23],
};

/** Pure core of the pre-preview check: which strongly-recommended fields are
 *  blank, given a value-lookup fn (Node-pinned with a stub getVal). The ONE
 *  conditional: PPD Q40 (ynnum) answered exactly 'Yes' means the Yes toggle is
 *  set but the hours number is blank — the operator's "if yes then hours". */
function intakeRecommendedBlanks_(form, getVal) {
  var keys = INTAKE_RECOMMENDED[form] || [];
  var out = [];
  for (var i = 0; i < keys.length; i++) {
    var v = String(getVal(keys[i]) == null ? '' : getVal(keys[i])).trim();
    if (!v) out.push({ key: keys[i] });
  }
  if (form === 'ppd') {
    var q40 = String(getVal('40') || '').trim();
    if (q40 === 'Yes') out.push({ key: '40', hoursOnly: true });
  }
  return out;
}

// ── App-bar header (shared shell vocabulary; replaces the bespoke navy bar) ──
/** F(L-19), hoisted in cycle-18 batch 8 — the ONE http(s) scheme whitelist for
 *  the operator-owned Offerings URL columns (E pdfLink / F imageUrl). esc()
 *  prevents attribute breakout but a `javascript:` URL typed into that sheet
 *  would still become a live href / <img> src, so the scheme is checked
 *  BEFORE the value reaches an attribute — the kbMd_ link discipline. It lives
 *  at module scope because the recommendation cards and the Catalog browse tab
 *  both need it, and a duplicated security predicate is exactly the
 *  parallel-source class this codebase bans. Returns '' (falsy) for anything
 *  that is not http(s), so every caller's `url ? … : fallback` still holds. */
function intakeHttpOnly_(u) {
  return /^https?:\/\//i.test(String(u || '').trim()) ? esc(u) : '';
}

function intakeAppBar_(form, name) {
  if (COMPACT_MODE) return '';   /* pop-out: the tool tab bar names the active tab (2026-08-11) */
  var right = (form === 'sent' || form === 'catalog') ? '' : intakeLangToggleHtml_(form);
  return '<div class="app-bar"><div class="app-bar-left">' +
      '<div class="breadcrumb"><span>Intake</span><span class="crumb-sep">›</span><span class="crumb-current">' + esc(name) + '</span></div>' +
      '<h1 class="display-title">' + esc(name) + '</h1>' +
    '</div><div class="app-bar-right">' + right + '</div></div>';
}

// ── PPD view ──────────────────────────────────────────────────────────────
function enterIntakePpdView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  var lang = INTAKE_STATE.ppd.lang;
  area.innerHTML =
    intakeAppBar_('ppd', 'PPD') +
    '<div class="intk-ppd-layout">' +
      '<div class="intk-main">' +
        '<div class="intk-patient">' +
          '<label for="intk-ppd-patient">Patient Name &amp; Trx#</label>' +
          '<input type="text" id="intk-ppd-patient" name="intk-ppd-patient" placeholder="e.g. Jane Doe — TRX 12345" autocomplete="off">' +
        '</div>' +
        '<div class="intk-sections intk-cat-ppd" id="intk-ppd-form">' + intakeRenderPpdSections_(lang) + '</div>' +
      '</div>' +
      '<aside class="intk-rail"><div class="intk-rail-sticky">' +
        '<span class="intk-rail-label">Progress</span>' +
        intakeRingHtml_('ppd') +
        // E14 (cycle 10): 46 incl. Q39a (the cycle-8 ring fix) — the updater
        // overwrites this synchronously today, but the seed literal must not
        // drift from the real denominator (a future render path without the
        // updater would show the wrong total).
        '<span class="intk-rail-count" id="intk-ppd-count">0 / 46</span>' +

        intakePpdStepperHtml_(lang) +
        '<button class="intk-btn primary" onclick="intakePpdPreview_()">' + icon('send', 14) + ' Preview &amp; Recommend</button>' +
        '<button class="intk-btn" onclick="intakeClearForm_(\'ppd\')">Clear</button>' +
      '</div></aside>' +
    '</div>';

  var form = document.getElementById('intk-ppd-form');
  if (form) {
    form.addEventListener('input', intakePpdAfterChange_);
    // Yes/No + severity controls are <button>s (no 'input' event) — intakePick_
    // already updates progress, but a delegated click listener guarantees the
    // bar fills on every toggle even if a control path is ever added that
    // bypasses intakePick_.
    form.addEventListener('click', function (e) {
      if (e.target.closest('.intk-yn-btn, .intk-sev-chip')) intakePpdUpdateProgress_();
    });
    form.addEventListener('keydown', intakeArrowNav_);   // pilot round 3 #7
  }
  var pat = document.getElementById('intk-ppd-patient');
  if (pat) pat.addEventListener('input', intakePpdAfterChange_);
  intakeRestoreDraft_('ppd');
  intakePpdApplyReveals_(form);   // hide Q33a etc. per restored parent answers
  intakePpdUpdateProgress_();
  intakeConsumeNavHint_();
}

// ── Pilot round 3 (#7): arrow-key field navigation ──────────────────────────
// ArrowDown with the caret at the END of a text field focuses the NEXT visible
// text field in the form; ArrowUp at the START goes back — the Call Notes
// boundary-hop pattern (operator feedback 2026-06-12 r2) applied to the intake
// forms' real <input>/<textarea> controls. Deliberately UNTOUCHED: arrows
// inside the radiogroup controls (.intk-yn/.intk-sev/.intk-choice —
// intakePickKey_ owns those), <select> (arrows change its value), and any
// non-text input type (date/number steppers). Hidden reveal rows are skipped
// (offsetParent visibility test), and there is no wrap at the form's edges.
function intakeCaretAtEdge_(el, edge) {
  var s, e;
  try { s = el.selectionStart; e = el.selectionEnd; } catch (err) { return true; }
  if (s == null || e == null) return true;   // selection unsupported — treat as hoppable
  if (s !== e) return false;                 // a real selection keeps its arrow keys
  var len = String(el.value || '').length;
  return edge === 'start' ? s === 0 : s === len;
}

function intakeNavFields_(root) {
  return Array.prototype.filter.call(
    root.querySelectorAll('input[type="text"], textarea'),
    function (f) { return !f.disabled && f.offsetParent !== null; });
}

function intakeArrowNav_(e) {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  if (e.shiftKey || e.altKey || e.metaKey || e.ctrlKey) return;
  var el = e.target;
  if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
  if (el.tagName === 'INPUT' && el.type !== 'text') return;
  var fwd = e.key === 'ArrowDown';
  if (!intakeCaretAtEdge_(el, fwd ? 'end' : 'start')) return;
  var root = el.closest('.intk-sections');
  if (!root) return;
  var fields = intakeNavFields_(root);
  var i = fields.indexOf(el);
  if (i < 0) return;
  var next = fields[i + (fwd ? 1 : -1)];
  if (!next) return;   // at the form's edge — no wrap
  e.preventDefault();
  next.focus();
  try {
    var L = String(next.value || '').length;
    next.setSelectionRange(fwd ? 0 : L, fwd ? 0 : L);
  } catch (err) {}
}

// Consume a shared cross-tool nav hint targeting Intake (e.g. a Spanish Inbox
// tool-suggestion chip): render the request context banner at the top of the
// form so the rep keeps the request in view while filling it. One-shot.
function intakeConsumeNavHint_() {
  if (typeof appTakeNavHint_ !== 'function') return;
  var hint = appTakeNavHint_('intake');
  if (!hint) return;
  var area = document.getElementById('view-area');
  var container = area && (area.querySelector('.intk-main') || area.querySelector('.intk-wrap'));
  if (container && typeof appShowNavHintBanner_ === 'function') appShowNavHintBanner_(hint, container);
  if (typeof showToast === 'function') showToast('Working from a Spanish Inbox request', 'toast-success');
}

// SINGLE SOURCE OF TRUTH for the PPD section structure — used by the renderer
// (to assign stable section ids), the side-rail stepper (labels + goto), AND the
// progress updater (per-section + overall counts). Parses INTAKE_PPD_Q[lang] into
// ordered sections; `mainQNums` are the bare-numbered questions that count toward
// progress (31a/33a sub-questions render but don't count — mirrors the prior
// `/^(\d+)\./` progress filter). Keep all three consumers on this so they can't
// drift (same discipline as INTAKE_*_LAYOUT mirroring).
function intakePpdSections_(lang) {
  var qs = INTAKE_PPD_Q[lang] || INTAKE_PPD_Q.EN;
  var secs = [];
  var cur = null;
  for (var i = 1; i < qs.length; i++) {
    var raw = qs[i];
    if (!raw || !String(raw).trim()) continue;
    var isSecondary = /^\s+/.test(raw);
    var text = String(raw).trim();
    var m = text.match(/^(\d+[a-z]?)\./);
    if (!m) { cur = { title: text, rows: [], mainQNums: [] }; secs.push(cur); continue; }
    if (!cur) { cur = { title: '', rows: [], mainQNums: [] }; secs.push(cur); }
    cur.rows.push({ qNum: m[1], text: text, isSecondary: isSecondary });
    // F(cycle-8): Q39a counts toward the progress ring/stepper. The bare-digit
    // filter excludes the lettered SUB-questions (31a/33a — conditional
    // follow-ups), but 39a is a FULL-WEIGHT primary row that happens to be
    // lettered only to avoid renumbering — and it is the sole trigger of the
    // engine's mobile-home K0821 rule. A rep could see "45/45 complete" with
    // the engine-critical dwelling answer blank.
    if (/^\d+$/.test(m[1]) || m[1] === '39a') cur.mainQNums.push(m[1]);
  }
  return secs;
}

// Render PPD as section panels (one .panel per question group header), each with
// a stable id (intk-ppd-sec-<idx>) so the side-rail stepper can scroll to it.
function intakeRenderPpdSections_(lang) {
  var secs = intakePpdSections_(lang);
  var out = '';
  for (var s = 0; s < secs.length; s++) {
    var sec = secs[s];
    var rows = '';
    for (var r = 0; r < sec.rows.length; r++) {
      rows += intakePpdRowHtml_(sec.rows[r].qNum, sec.rows[r].text, sec.rows[r].isSecondary);
    }
    out += '<div class="panel intk-section" id="intk-ppd-sec-' + s + '">' +
      (sec.title ? '<div class="section-kicker sec-title">' + esc(sec.title) + '</div>' : '') +
      rows + '</div>';
  }
  // Operator 2026-08-25: free-text notes panel AFTER the question sections —
  // inside #intk-ppd-form (the collectors/draft listeners are scoped to it).
  // Not a bank entry, so the stepper and the 46-question ring never count it.
  var nl = INTAKE_PPD_NOTES[lang] || INTAKE_PPD_NOTES.EN;
  out += '<div class="panel intk-section" id="intk-ppd-sec-notes">' +
    '<div class="section-kicker sec-title">' + esc(nl.title) + '</div>' +
    '<div class="intk-row"><label class="q" for="intk-ppd-qnotes">' + esc(nl.label) + '</label>' +
    '<textarea id="intk-ppd-qnotes" name="intk-ppd-qnotes" rows="3" data-intk-qnum="notes"></textarea></div></div>';
  return out;
}

// Side-rail per-section stepper: one clickable step per PPD section that scrolls
// to it and shows answered/total + a done/partial state (updated live by
// intakePpdUpdateProgress_).
function intakePpdStepperHtml_(lang) {
  var secs = intakePpdSections_(lang);
  var out = '<div class="intk-stepper" id="intk-ppd-stepper">';
  for (var s = 0; s < secs.length; s++) {
    var title = secs[s].title || ('Section ' + (s + 1));
    out += '<button type="button" class="intk-step" data-sec="' + s + '" ' +
        'onclick="intakePpdGotoSection_(' + s + ')" title="' + esc(title) + '">' +
        '<span class="intk-step-dot" aria-hidden="true"></span>' +
        '<span class="intk-step-lbl">' + esc(title) + '</span>' +
        '<span class="intk-step-frac" data-sec-frac="' + s + '"></span>' +
      '</button>';
  }
  return out + '</div>';
}

function intakePpdGotoSection_(s) {
  var el = document.getElementById('intk-ppd-sec-' + s);
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function intakePpdRowHtml_(qNum, text, isSecondary) {
  var ctrl = intakePpdControl_(qNum);   // Phase 1: null for every question (framework only)
  var type = intakePpdType_(qNum);
  var control, hasInputId;
  if (ctrl) {
    control = intakePpdControlHtml_(ctrl, qNum, text);
    // numunit has a real <input id>; multi/reveal/condition are labelled groups
    // (aria-label carries the question), so no label `for=` target.
    hasInputId = (ctrl.kind === 'numunit');
  } else if (type === 'yn') {
    control = intakeYnControlHtml_('data-qnum="' + esc(qNum) + '"', text); hasInputId = false;
  } else if (type === 'sev') {
    control = intakeSevControlHtml_('data-qnum="' + esc(qNum) + '"', text); hasInputId = false;
  } else if (type === 'num') {
    hasInputId = true;   // the input below carries id="intk-ppd-q<n>" — wire the label to it
    control = '<input type="text" inputmode="numeric" autocomplete="off" id="intk-ppd-q' + esc(qNum) + '" name="intk-ppd-q' + esc(qNum) + '" data-intk-qnum="' + esc(qNum) + '">'; hasInputId = true;
  } else {
    hasInputId = true;   // as above — a real input id, so the label can target it
    control = '<input type="text" autocomplete="off" id="intk-ppd-q' + esc(qNum) + '" name="intk-ppd-q' + esc(qNum) + '" data-intk-qnum="' + esc(qNum) + '">'; hasInputId = true;
  }
  var labelFor = hasInputId ? ' for="intk-ppd-q' + esc(qNum) + '"' : '';
  // Phase 4 — optional hover-help glyph after the label text.
  // data-tip drives the tokened CSS tooltip (no native `title` — the two
  // would double up); aria-label keeps it readable to screen readers.
  var help = INTAKE_PPD_HELP[qNum]
    ? '<span class="intk-help" tabindex="0" role="img" data-tip="' + esc(INTAKE_PPD_HELP[qNum]) + '" aria-label="' + esc(INTAKE_PPD_HELP[qNum]) + '">' + icon('info', 13) + '</span>'
    : '';
  // Phase 4 — conditional-visibility: a reveal row starts hidden; intakePpdApplyReveals_
  // shows it when the parent answer matches.
  var rev = INTAKE_PPD_REVEAL[qNum];
  var revAttrs = rev ? ' data-reveal-q="' + esc(rev.whenQ) + '" data-reveal-val="' + esc(rev.whenVal) + '" style="display:none"' : '';
  return '<div class="intk-row' + (isSecondary ? ' secondary' : '') + '"' + revAttrs + '>' +
    '<label class="q"' + labelFor + '>' + esc(text) + help + '</label>' + control + '</div>';
}

// Phase 4 — show/hide conditional-reveal rows (INTAKE_PPD_REVEAL) from their parent
// answer; when hidden, clear the child so a stale value can't ride into the payload.
function intakePpdApplyReveals_(root) {
  if (!root) return;
  root.querySelectorAll('.intk-row[data-reveal-q]').forEach(function (row) {
    var pq = row.getAttribute('data-reveal-q');
    var want = row.getAttribute('data-reveal-val') || '';
    var have = intakePpdGetVal_(root, pq);
    var show = String(have || '').toLowerCase() === want.toLowerCase();
    row.style.display = show ? '' : 'none';
    if (!show) {
      var cq = row.querySelector('[data-intk-qnum]');
      if (cq && cq.value) cq.value = '';   // clear the hidden child's text
    }
  });
}

// Yes/No segmented toggle (role=radiogroup). `attrs` carries the identity
// (data-qnum for PPD, data-idx+data-form for account). aria-label = question.
function intakeYnControlHtml_(attrs, ariaLabel) {
  return '<div class="intk-yn" ' + attrs + ' data-val="" role="radiogroup" aria-label="' + esc(ariaLabel) + '" onkeydown="intakePickKey_(event)">' +
    '<button type="button" class="intk-yn-btn yes" data-set="Yes" role="radio" aria-checked="false" onclick="intakePick_(this)">Yes</button>' +
    '<button type="button" class="intk-yn-btn no" data-set="No" role="radio" aria-checked="false" onclick="intakePick_(this)">No</button>' +
  '</div>';
}

function intakeSevControlHtml_(attrs, ariaLabel) {
  var chips = INTAKE_SEV_LEVELS.map(function (lv) {
    return '<button type="button" class="intk-sev-chip" data-set="' + lv + '" role="radio" aria-checked="false" onclick="intakePick_(this)">' + lv + '</button>';
  }).join('');
  return '<div class="intk-sev" ' + attrs + ' data-val="" role="radiogroup" aria-label="' + esc(ariaLabel) + '" onkeydown="intakePickKey_(event)">' + chips + '</div>';
}

// Shared pick handler for Yes/No + severity (PPD and account checkboxes).
function intakePick_(btn) {
  var grp = btn.closest('.intk-yn,.intk-sev,.intk-choice');   // .intk-choice = Phase 1 single-select multi-button
  if (!grp) return;
  // Operator 2026-08-25: clicking the ALREADY-SELECTED button clears the group
  // (an accidental click on a question meant to stay blank was otherwise
  // permanent — only a different answer could displace it). '' is the
  // pre-answer state everywhere downstream: the engine reads it as
  // unanswered, the email renders N/A, drafts round-trip it.
  if (btn.classList.contains('on')) {
    grp.setAttribute('data-val', '');
    grp.querySelectorAll('[data-set]').forEach(function (b) {
      b.classList.remove('on'); b.setAttribute('aria-checked', 'false');
    });
    if (grp.getAttribute('data-qnum') != null) intakePpdAfterChange_();
    else { var f0 = grp.getAttribute('data-form'); if (f0) intakeSaveDraft_(f0); }
    return;
  }
  var val = btn.getAttribute('data-set');
  grp.setAttribute('data-val', val);
  grp.querySelectorAll('[data-set]').forEach(function (b) {
    var on = (b === btn);
    b.classList.toggle('on', on);
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    // §7 pop — the newly-selected chip/toggle gives a quick scale feedback.
    if (on) { b.classList.remove('popping'); void b.offsetWidth; b.classList.add('popping'); }
  });
  if (grp.getAttribute('data-qnum') != null) intakePpdAfterChange_();
  else { var f = grp.getAttribute('data-form'); if (f) intakeSaveDraft_(f); }
}

// Arrow-key navigation within a radiogroup (a11y).
function intakePickKey_(e) {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  var grp = e.currentTarget;
  var btns = Array.prototype.slice.call(grp.querySelectorAll('[data-set]'));
  if (!btns.length) return;
  var cur = btns.findIndex(function (b) { return b.classList.contains('on'); });
  var next = (e.key === 'ArrowLeft' || e.key === 'ArrowUp')
    ? (cur <= 0 ? btns.length - 1 : cur - 1)
    : (cur < 0 || cur >= btns.length - 1 ? 0 : cur + 1);
  e.preventDefault();
  btns[next].focus();
  intakePick_(btns[next]);
}

// F(cycle-8): arrow-key nav for the ynreveal (Q45) / ynnum (Q40) INNER Yes/No
// radiogroups — they declared role="radiogroup" but bound no keydown, so
// keyboard arrow selection silently didn't work on exactly these two while
// every sibling radiogroup has it. Generic: clicks the next button so each
// control's own onclick (intakeYrPickYn_ / intakeYnNumPickYn_) runs.
function intakeYnKey_(e) {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  var btns = Array.prototype.slice.call(e.currentTarget.querySelectorAll('[data-set]'));
  if (!btns.length) return;
  var cur = btns.findIndex(function (b) { return b.classList.contains('on'); });
  var next = (e.key === 'ArrowLeft' || e.key === 'ArrowUp')
    ? (cur <= 0 ? btns.length - 1 : cur - 1)
    : (cur < 0 || cur >= btns.length - 1 ? 0 : cur + 1);
  e.preventDefault();
  btns[next].focus();
  btns[next].click();
}

// Get/set a single PPD answer value across all control types.
function intakePpdGetVal_(root, qNum) {
  // Phase 1 new group kinds first (multi/reveal have bespoke serialization).
  var multi = root.querySelector('.intk-multi[data-qnum="' + qNum + '"]');
  if (multi) return intakeMultiGet_(multi);
  var reveal = root.querySelector('.intk-reveal[data-qnum="' + qNum + '"]');
  if (reveal) return intakeRevealGet_(reveal);
  var ynrev = root.querySelector('.intk-ynreveal[data-qnum="' + qNum + '"]');
  if (ynrev) return intakeYnRevealGet_(ynrev);
  var ynnum = root.querySelector('.intk-ynnum[data-qnum="' + qNum + '"]');
  if (ynnum) return intakeYnNumGet_(ynnum);
  var cond = root.querySelector('.intk-condition[data-qnum="' + qNum + '"]');
  if (cond) return intakeConditionGet_(cond);
  var input = root.querySelector('[data-intk-qnum="' + qNum + '"]');
  if (input) return String(input.value || '').trim();
  var grp = root.querySelector('.intk-yn[data-qnum="' + qNum + '"],.intk-sev[data-qnum="' + qNum + '"],.intk-choice[data-qnum="' + qNum + '"]');
  return grp ? String(grp.getAttribute('data-val') || '') : '';
}
function intakePpdSetVal_(root, qNum, val) {
  var multi = root.querySelector('.intk-multi[data-qnum="' + qNum + '"]');
  if (multi) { intakeMultiSet_(multi, val); return; }
  var reveal = root.querySelector('.intk-reveal[data-qnum="' + qNum + '"]');
  if (reveal) { intakeRevealSet_(reveal, val); return; }
  var ynrev = root.querySelector('.intk-ynreveal[data-qnum="' + qNum + '"]');
  if (ynrev) { intakeYnRevealSet_(ynrev, val); return; }
  var ynnum = root.querySelector('.intk-ynnum[data-qnum="' + qNum + '"]');
  if (ynnum) { intakeYnNumSet_(ynnum, val); return; }
  var cond = root.querySelector('.intk-condition[data-qnum="' + qNum + '"]');
  if (cond) { intakeConditionSet_(cond, val); return; }
  var input = root.querySelector('[data-intk-qnum="' + qNum + '"]');
  if (input) { input.value = val == null ? '' : val; return; }
  var grp = root.querySelector('.intk-yn[data-qnum="' + qNum + '"],.intk-sev[data-qnum="' + qNum + '"],.intk-choice[data-qnum="' + qNum + '"]');
  if (!grp) return;
  grp.setAttribute('data-val', val == null ? '' : val);
  grp.querySelectorAll('[data-set]').forEach(function (b) {
