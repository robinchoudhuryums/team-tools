// ─── MANAGER: EDIT DAY MODAL ──────────────────────────────────────────────
var _deEmpId = null, _deEmpName = null, _deDate = null;

// ── Team punches calendar (operator 2026-08-31) ──────────────────────────
// The manager cut the app lacked: every rep's punch times for an ARBITRARY
// date in one place. Month calendar (the Time/PTO .cal-* visual vocabulary)
// with a full-width team punch table below for the selected day; pencil per
// row opens the existing Day Edit modal prefilled to that rep + date.
// SWR: per-month cache paints instantly on re-render/nav (key-exact write
// BEFORE the seq check, INV-156; clean rounds only); painted refresh
// failures keep last-good via warn toast, cold failures render the error
// card (C17-5). Dates/months derive from the MANAGER's roster tz via
// isoDateTz(empTz()) — never browser-local (the F6 discipline).
var TEAMCAL = { month: null, selDate: null, cache: {}, seq: 0 };
var TCAL_DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];   // DAY_ABBR is server-only (Code.js)

function loadTeamCalendar_() {
  if (!document.getElementById('mgr-team-cal')) return;
  if (!TEAMCAL.month) {
    var t = isoDateTz(empTz());
    TEAMCAL.month = t.substring(0, 7);
    TEAMCAL.selDate = t;
  }
  tcalFetch_(TEAMCAL.month);
}

function tcalFetch_(month) {
  var slot = document.getElementById('mgr-team-cal');
  if (!slot) return;
  if (TEAMCAL.cache[month]) tcalRender_();
  else slot.innerHTML = '<div class="card"><h2 class="card-label">Team Punches</h2>' + loSkeleton(3) + '</div>';
  var seq = ++TEAMCAL.seq;
  google.script.run
    .withSuccessHandler(function (res) {
      // Key-exact cache write BEFORE the seq/view check (INV-156 — a stale
      // response warms its own month; only the render drops). Error rounds
      // are never cached (INV-129).
      if (res && !res.error) TEAMCAL.cache[month] = res;
      if (seq !== TEAMCAL.seq || currentView !== 'manage') return;
      if (res && res.error) { tcalFail_(res.error); return; }
      tcalRender_();
    })
    .withFailureHandler(function (err) {
      if (seq !== TEAMCAL.seq || currentView !== 'manage') return;
      tcalFail_((err && err.message) || 'Load failed');
    })
    .getTeamCalendar(month);
}

function tcalFail_(msg) {
  var slot = document.getElementById('mgr-team-cal');
  if (!slot) return;
  if (TEAMCAL.cache[TEAMCAL.month]) {   // painted → keep last-good (C17-5)
    showToast('Could not refresh team punches: ' + msg, 'toast-warn');
    tcalRender_();
    return;
  }
  slot.innerHTML = '<div class="card"><h2 class="card-label">Team Punches</h2>' + errorStateHtml_(msg) + '</div>';
}

function tcalNav_(delta) {
  var p = TEAMCAL.month.split('-');
  var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1 + delta, 1);
  var m = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  var curMonth = isoDateTz(empTz()).substring(0, 7);
  if (m > curMonth) return;             // punches never exist in a future month
  TEAMCAL.month = m;
  TEAMCAL.selDate = (m === curMonth) ? isoDateTz(empTz()) : m + '-01';
  tcalFetch_(m);
}

function tcalSelect_(dateIso) { TEAMCAL.selDate = dateIso; tcalRender_(); }

function tcalRender_() {
  var slot = document.getElementById('mgr-team-cal');
  var data = TEAMCAL.cache[TEAMCAL.month];
  if (!slot || !data) return;
  var p = TEAMCAL.month.split('-');
  var year = parseInt(p[0], 10), month = parseInt(p[1], 10);
  var todayIso = isoDateTz(empTz());
  var curMonth = todayIso.substring(0, 7);
  var lastDay = new Date(year, month, 0).getDate();
  var firstDow = new Date(year, month - 1, 1).getDay();

  var cal = '<div class="cal-grid">';
  ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].forEach(function (d) { cal += '<div class="cal-dow">' + d + '</div>'; });
  for (var i = 0; i < firstDow; i++) cal += '<div class="cal-cell"></div>';
  for (var d = 1; d <= lastDay; d++) {
    var dateIso = TEAMCAL.month + '-' + String(d).padStart(2, '0');
    var dow = new Date(year, month - 1, d).getDay();
    var day = data.days[dateIso];
    var punched = day ? day.reps.length : 0;
    var anyIncomplete = !!(day && day.reps.some(function (r) { return r.incomplete; }));
    var offN = day ? day.off.length : 0;
    var hol = data.holidays[dateIso];
    var sel = dateIso === TEAMCAL.selDate;

    var cls = 'cal-cell clickable';
    if (dow === 0 || dow === 6) cls += ' weekend';
    if (dateIso === todayIso) cls += ' today';
    if (punched) cls += anyIncomplete ? ' has-pending' : ' has-worked';
    if (sel) cls += ' tcal-sel';

    var parts = [MONTH_NAMES[month - 1] + ' ' + d];
    if (dateIso === todayIso) parts.push('today');
    if (hol) parts.push('US holiday');
    parts.push(punched + ' punched');
    if (anyIncomplete) parts.push('incomplete day(s)');
    if (offN) parts.push(offN + ' off');
    var holidayMark = hol ? '<div class="cal-holiday">' + icon('star', 12) + '</div>' : '';
    var corner = punched ? '<div class="cal-hrs">' + punched + '</div>'
      : (offN ? '<div class="cal-tm">+' + offN + '</div>' : '');
    var dot = '';
    if (offN) {
      var anyApproved = day.off.some(function (o) { return o.status === 'approved'; });
      dot = '<div class="cal-dot ' + (anyApproved ? 'approved' : 'pending') + '"></div>';
    }
    cal += '<div class="' + cls + '" data-date="' + dateIso + '" role="button" tabindex="0"' +
      ' aria-pressed="' + (sel ? 'true' : 'false') + '" aria-label="' + esc(parts.join(', ')) + '">' +
      holidayMark + '<span class="cal-dn">' + d + '</span>' + dot + corner + '</div>';
  }
  cal += '</div>';

  var monthLabel = MONTH_NAMES[month - 1] + ' ' + year;
  var atCur = TEAMCAL.month >= curMonth;
  var head = '<div class="tcal-head">' +
    '<button type="button" class="refresh-btn" onclick="tcalNav_(-1)" aria-label="Previous month">‹</button>' +
    '<span class="tcal-month">' + esc(monthLabel) + '</span>' +
    '<button type="button" class="refresh-btn" onclick="tcalNav_(1)" aria-label="Next month"' + (atCur ? ' disabled' : '') + '>›</button>' +
    '</div>';

  var archNote = data.archiveNote
    ? '<div class="tcal-note">This month predates the live Timesheet tab — rows may have moved to the archive; use an export for full history.</div>'
    : '';
  var legend = '<div class="tcal-note">Cell badge = reps punched · +N = reps off · amber tint = incomplete day(s) present</div>';

  slot.innerHTML = '<div class="card"><h2 class="card-label with-count"><span>Team Punches</span>' +
    '<span class="count-pill">' + esc(String((data.days[TEAMCAL.selDate] || { reps: [] }).reps.length)) + '/' + esc(String(data.rosterCount)) + ' punched</span></h2>' +
    '<div class="tcal-cal">' + head + cal + legend + archNote + '</div>' +
    tcalDayTableHtml_(data) + '</div>';

  // Delegated cell handlers (the Time/PTO calendar's pattern — divs carry
  // role=button + tabindex; NO inline onclick on a div, per INV-173/A1).
  slot.querySelectorAll('.cal-cell[data-date]').forEach(function (cell) {
    cell.addEventListener('click', function () { tcalSelect_(cell.getAttribute('data-date')); });
    cell.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tcalSelect_(cell.getAttribute('data-date')); }
    });
  });
  slot.querySelectorAll('[data-tcal-edit]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      openDayEditModal(btn.getAttribute('data-tcal-edit'), btn.getAttribute('data-tcal-name') || '', TEAMCAL.selDate);
    });
  });
}

function tcalDayTableHtml_(data) {
  var dateIso = TEAMCAL.selDate;
  var day = data.days[dateIso] || { reps: [], off: [] };
  var todayIso = isoDateTz(empTz());
  var p = dateIso.split('-');
  var dow = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)).getDay();
  var isWeekend = dow === 0 || dow === 6;
  var title = TCAL_DOW[dow] + ', ' + MONTH_NAMES[parseInt(p[1], 10) - 1] + ' ' + parseInt(p[2], 10);
  var hol = data.holidays[dateIso];

  // Merge in "no punches" rows from the roster (mgrData.liveStatus — the same
  // INV-183-filtered set) so an ABSENT rep is visible, not silently missing —
  // but only on past/current weekdays, and never for reps already listed off.
  var rows = day.reps.slice();
  if (!isWeekend && dateIso <= todayIso && mgrData && mgrData.liveStatus) {
    var seen = {}, seenName = {};
    day.reps.forEach(function (r) { seen[r.id] = 1; seenName[r.name] = 1; });
    var offNames = {};
    day.off.forEach(function (o) { offNames[o.name] = 1; });
    mgrData.liveStatus.forEach(function (ls) {
      if (seen[ls.id] || seenName[ls.name] || offNames[ls.name]) return;
      rows.push({ id: ls.id, name: ls.name, noPunches: true, hours: null, punchCount: 0 });
    });
    rows.sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  var adjWin = (typeof data.adjustWindowDays === 'number' && data.adjustWindowDays) || 30;
  var editable = dateIso <= todayIso && daysBetweenIso(dateIso, todayIso) <= adjWin;
  var adjChip = ' <span style="font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px">ADJ</span>';
  var dash = '<span style="color:var(--muted-3)">—</span>';
  function tCell(t, adj) { return t ? esc(dispTime(t)) + (adj ? adjChip : '') : dash; }

  var table = mtRenderTable_({
    columns: [
      { key: 'name', label: 'Rep', name: true, cell: function (r) { return esc(r.name); } },
      { key: 'in', label: 'Clock In', cell: function (r) { return r.noPunches ? '<span style="color:var(--muted)">no punches</span>' : tCell(r.clockIn, r.adjClockIn); } },
      { key: 'lo', label: 'Lunch Out', cell: function (r) { return r.noPunches ? '' : tCell(r.lunchOut, r.adjLunchOut); } },
      { key: 'li', label: 'Lunch In', cell: function (r) { return r.noPunches ? '' : tCell(r.lunchIn, r.adjLunchIn); } },
      { key: 'out', label: 'Clock Out', cell: function (r) {
          if (r.noPunches) return '';
          var extra = r.punchCount > (['clockIn','lunchOut','lunchIn','clockOut'].filter(function (k) { return r[k]; }).length)
            ? ' <span style="font-size:10px;color:var(--muted)" title="This day has punch rows beyond the four columns shown — a second break, or duplicates. The Hours figure already counts every break pair, and Day Edit now lists every pair, so opening it here is safe.">+' + (r.punchCount - ['clockIn','lunchOut','lunchIn','clockOut'].filter(function (k) { return r[k]; }).length) + '</span>' : '';
          return tCell(r.clockOut, r.adjClockOut) + extra;
        } },
      { key: 'hours', label: 'Hours', numeric: true, cell: function (r) {
          if (typeof r.hours === 'number') return '<b>' + esc(fmtHrs(r.hours)) + '</b>';
          if (r.inProgress) return '<span style="color:var(--muted)">in progress</span>';
          if (r.incomplete) return '<span style="color:var(--warning-deep)">incomplete</span>';
          return dash;
        } },
      { key: 'edit', label: '', cell: function (r) {
          return editable
            ? '<button type="button" class="refresh-btn" data-tcal-edit="' + esc(r.id) + '" data-tcal-name="' + esc(r.name) + '" aria-label="Edit day for ' + esc(r.name) + '">' + icon('adjust', 12) + '</button>'
            : '';
        } },
    ],
    rows: rows,
    rowClass: function (r) { return r.noPunches ? 'tcal-row-mute' : (r.incomplete ? 'tcal-row-warn' : ''); },
    empty: '<div class="m-empty">' + (dateIso > todayIso ? 'Future date — no punches yet.' : 'No punches on this day.') + '</div>',
  });

  var offHtml = day.off.length
    ? '<div class="tcal-off" role="list" aria-label="Reps off this day">' + day.off.map(function (o) {
        return '<span class="tcal-off-chip ' + (o.status === 'approved' ? 'approved' : 'pending') + '" role="listitem">' +
          esc(o.name) + ' · ' + esc(o.type) + (o.status === 'pending' ? ' (pending)' : '') + '</span>';
      }).join('') + '</div>'
    : '';
  var editNote = !editable && dateIso <= todayIso
    ? '<div class="tcal-note">Older than the ' + adjWin + '-day adjust window — edits need the sheet directly.</div>' : '';

  return '<div class="tcal-day-title">' + esc(title) + (hol ? ' · ' + esc(hol) + ' (US holiday)' : '') + '</div>' +
    table + offHtml + editNote;
}

/* ─── DAY EDIT · BREAK PAIRS (A4) ─────────────────────────────────────
 * The modal used to carry four fixed slots, so the ONLY way to save a day
 * that legitimately carried two breaks was to collapse it to one pair —
 * silently deleting recorded unpaid time (INV-155's named gap, closed here).
 * The list is now N rows. Everything below reads and writes it; the server
 * (`managerParseBreakSlots_`) stays authoritative on validation.
 */

/** Client-side convenience cap. MIRROR of MANAGER_DAY_MAX_BREAKS in Code.js —
 *  the server refuses past it with a named error either way, so a drift
 *  degrades to a server rejection rather than a bad write. Pinned equal. */
var DE_MAX_BREAKS = 12;

/** Read the break rows currently in the DOM as [{out, in}] (HH:MM strings).
 *  Order is DOM order — the server re-sorts onto the shift timeline, so a
 *  manager entering pairs out of order still saves correctly. */
function deReadBreaks_() {
  var host = document.getElementById('de-breaks');
  if (!host) return [];
  var out = [];
  var rows = host.querySelectorAll('[data-de-break]');
  for (var i = 0; i < rows.length; i++) {
    out.push({
      out: (rows[i].querySelector('.de-brk-out') || {}).value || '',
      in:  (rows[i].querySelector('.de-brk-in')  || {}).value || '',
    });
  }
  return out;
}

/** Render the break list. Each row carries labelled inputs (INV-195) and a
 *  real remove <button> (INV-173); ids are re-minted per render so they stay
 *  unique after an add/remove. */
function deRenderBreaks_(pairs) {
  var host = document.getElementById('de-breaks');
  if (!host) return;
  var list = pairs || [];
  if (!list.length) {
    host.innerHTML = '<div class="de-breaks-empty">No breaks recorded for this day.</div>';
  } else {
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var n = i + 1;
      html += '<div class="de-break-row" data-de-break>' +
        '<div class="field"><label for="de-brk-out-' + i + '">Break ' + n + ' · leave</label>' +
        '<input type="time" id="de-brk-out-' + i + '" class="de-brk-out" value="' + esc(list[i].out || '') + '"></div>' +
        '<div class="field"><label for="de-brk-in-' + i + '">Break ' + n + ' · return</label>' +
        '<input type="time" id="de-brk-in-' + i + '" class="de-brk-in" value="' + esc(list[i].in || '') + '"></div>' +
        '<button type="button" class="de-break-rm" data-de-break-rm="' + i + '" ' +
        'aria-label="Remove break ' + n + '" title="Remove break ' + n + '">' + icon('trash', 15) + '</button>' +
      '</div>';
    }
    host.innerHTML = html;
  }
  deSyncRangeMode_();
}

/** Set the list from the server's day shape. Prefers the A4 `breaks` array;
 *  falls back to the legacy lunchOut/lunchIn scalars so an older server (or a
 *  cached payload predating the deploy) still prefills its single pair. */
function deSetBreaksFromDay_(day) {
  var pairs = [];
  if (day && Array.isArray(day.breaks)) {
    for (var i = 0; i < day.breaks.length; i++) {
      pairs.push({
        out: (day.breaks[i].out || '').substring(0, 5),
        in:  (day.breaks[i].in  || '').substring(0, 5),
      });
    }
  } else if (day && (day.lunchOut || day.lunchIn)) {
    pairs.push({
      out: (day.lunchOut || '').substring(0, 5),
      in:  (day.lunchIn  || '').substring(0, 5),
    });
  }
  deRenderBreaks_(pairs);
}

/** Range mode accepts ONE break pair (operator decision — adding is not
 *  idempotent and replacing contradicts INV-108's additive contract), so with
 *  a "To" date filled the add control is disabled and the reason is stated.
 *  The server refuses a multi-pair range payload by name regardless. */
function deSyncRangeMode_() {
  var toEl = document.getElementById('de-date-to');
  var addBtn = document.getElementById('de-break-add');
  var note = document.getElementById('de-breaks-note');
  var rangeMode = !!(toEl && toEl.value);
  var count = deReadBreaks_().length;
  if (addBtn) {
    addBtn.disabled = rangeMode || count >= DE_MAX_BREAKS;
    addBtn.title = rangeMode
      ? 'Range mode applies one break pair per day'
      : (count >= DE_MAX_BREAKS ? 'Maximum ' + DE_MAX_BREAKS + ' breaks' : '');
  }
  if (note) {
    var over = rangeMode && count > 1;
    note.hidden = !rangeMode;
    note.textContent = over
      ? 'Range mode applies one break pair per day — remove the extra pair(s) or clear “To”.'
      : 'Range mode applies one break pair per day.';
    note.className = over ? 'de-breaks-note is-warn' : 'de-breaks-note';
  }
}

function openDayEditModal(empId, empName, prefillDate) {
  _deEmpId = empId;
  _deEmpName = empName;
  // M-2 (cycle 10): bound the picker on the TARGET employee's "today", not the
  // manager's — the server validates daysBack in the target's tz (INV-05/07),
  // so an offshore (IST/PHT) rep's in-progress local day is a VALID edit date
  // that a manager-tz max forbade every CT afternoon (and the modal silently
  // opened on the rep's previous day). Fall back to the manager's tz when the
  // live-status entry is missing (server stays authoritative regardless).
  var targetTz = null;
  try {
    var ls = (mgrData && mgrData.liveStatus) || [];
    for (var i = 0; i < ls.length; i++) {
      if (ls[i].id === empId) { targetTz = ls[i].timezone || null; break; }
    }
  } catch (e) {}
  var tz = targetTz || empTz();
  var today = isoDateTz(tz);
  _deDate = today;
  document.getElementById('day-edit-subtitle').textContent = empName;
  var deDateEl = document.getElementById('de-date');
  deDateEl.value = today;
  // Match the Adjust modal: no future edits (server rejects daysBack<0) and
  // no edits older than the adjust window. Use the server-shipped
  // CONFIG.ADJUST_WINDOW_DAYS (via getManagerDashboard) so the picker tracks
  // the real limit instead of a hardcoded 30; fall back to 30 if absent.
  // Server still enforces the limit authoritatively.
  var adjustWindowDays = (mgrData && typeof mgrData.adjustWindowDays === 'number')
    ? mgrData.adjustWindowDays : 30;
  deDateEl.max = today;
  var deMin = new Date(today + 'T00:00:00Z');
  deMin.setUTCDate(deMin.getUTCDate() - adjustWindowDays);
  deDateEl.min = deMin.toISOString().substring(0, 10);
  // Team-calendar pencil (operator 2026-08-31): prefill to the clicked date
  // when it sits inside the picker's own [min, today] bounds — the
  // openAdjustModal(prefillDate) precedent; the server stays authoritative.
  if (prefillDate && /^\d{4}-\d{2}-\d{2}$/.test(String(prefillDate)) &&
      prefillDate >= deDateEl.min && prefillDate <= today) {
    _deDate = prefillDate;
    deDateEl.value = prefillDate;
  }
  document.getElementById('de-clockin').value = '';
  document.getElementById('de-clockout').value = '';
  document.getElementById('de-reason').value = '';
  // #4b — multi-day "To" picker; cleared on open. F(cycle-8 M-2): min is the
  // day AFTER the edit date (range mode requires To > From — a To on/before
  // the edit date used to silently downgrade to the destructive single-day
  // save), max stays today.
  var deToEl = document.getElementById('de-date-to');
  if (deToEl) { deToEl.value = ''; deToEl.min = deNextDay_(_deDate); deToEl.max = today; }
  // A4: render the (empty) break list AFTER the To reset — deRenderBreaks_
  // re-syncs range mode off the live To value, so clearing it afterwards would
  // leave the add control disabled from the PREVIOUS session. The prefill
  // usually re-syncs a moment later, but not when the day has no row or the
  // read fails, which is exactly when a manager is adding punches by hand.
  deRenderBreaks_([]);
  document.getElementById('day-edit-overlay').classList.add('open');
  loadDayEditPunches(empId, _deDate, _deDate);
}

function loadDayEditPunches(empId, start, end) {
  google.script.run
    .withSuccessHandler(function (data) {
      // Response-identity guard (L9): quickly reopening the modal for a
      // different employee on the same default date let employee A's late
      // response fill employee B's slots — saving would have written A's
      // times to B. The date check alone can't catch that.
      if (empId !== _deEmpId) return;
      if (data.error) return;
      var day = (data.days || []).find(function (d) { return d.date === _deDate; });
      if (!day) return;
      document.getElementById('de-clockin').value  = day.clockIn  ? day.clockIn.substring(0, 5) : '';
      document.getElementById('de-clockout').value = day.clockOut ? day.clockOut.substring(0, 5) : '';
      deSetBreaksFromDay_(day);
    })
    .withFailureHandler(function () {})
    .getEmployeeTimesheetForManager(empId, start, end);
}

/* A4 break-list controls. Add/remove SNAPSHOT the typed values first and
 * re-render from the snapshot (the cnRenderSubforms_ pattern) — re-rendering
 * without it would wipe every other row's in-progress input. Remove is
 * delegated on the host so it survives each re-render. */
document.getElementById('de-break-add').addEventListener('click', function () {
  if (this.disabled) return;
  var pairs = deReadBreaks_();
  if (pairs.length >= DE_MAX_BREAKS) return;
  pairs.push({ out: '', in: '' });
  deRenderBreaks_(pairs);
  var last = document.querySelectorAll('#de-breaks .de-brk-out');
  if (last.length) last[last.length - 1].focus();
});
document.getElementById('de-breaks').addEventListener('click', function (e) {
  var btn = e.target.closest ? e.target.closest('[data-de-break-rm]') : null;
  if (!btn) return;
  var idx = parseInt(btn.getAttribute('data-de-break-rm'), 10);
  var pairs = deReadBreaks_();
  if (!(idx >= 0) || idx >= pairs.length) return;
  pairs.splice(idx, 1);
  deRenderBreaks_(pairs);
});
// Filling/clearing "To" flips range mode, which caps the list at one pair.
document.getElementById('de-date-to').addEventListener('change', deSyncRangeMode_);
// Typing into a break field can change nothing structural, but the row COUNT
// is what gates the add button and the range note, so keep them in step.
document.getElementById('de-breaks').addEventListener('input', deSyncRangeMode_);

document.getElementById('de-cancel').addEventListener('click', function () {
  document.getElementById('day-edit-overlay').classList.remove('open');
});
document.getElementById('day-edit-overlay').addEventListener('click', function (e) {
  if (e.target === document.getElementById('day-edit-overlay'))
    document.getElementById('day-edit-overlay').classList.remove('open');
});

/** ISO day after `iso` (UTC math — DST-immune, the deMin pattern above). */
function deNextDay_(iso) {
  var d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + 1);
  return d.toISOString().substring(0, 10);
}

/** ISO date ± n days via UTC-noon anchoring (the computeRange pattern —
 *  DST-immune). F(cycle-8): the Coverage/Punctuality presets computed
 *  local-midnight ± N*86400000, which lands at 23:00 the PRIOR day across a
 *  browser-local DST transition (US managers, March/November), silently
 *  shifting the default window by one day. */
function mgrAddDaysIso_(iso, n) {
  var d = new Date(iso + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().substring(0, 10);
}

document.getElementById('de-date').addEventListener('change', function () {
  var d = this.value;
  if (!d || !_deEmpId) return;
  _deDate = d;
  // F(cycle-8 M-2): keep the "To" picker's floor tracking the edit date; a
  // now-invalid To (≤ the new From) is cleared rather than silently kept.
  var deToEl = document.getElementById('de-date-to');
  if (deToEl) { deToEl.min = deNextDay_(d); if (deToEl.value && deToEl.value <= d) deToEl.value = ''; }
  document.getElementById('de-clockin').value = '';
  document.getElementById('de-clockout').value = '';
  deRenderBreaks_([]);
  loadDayEditPunches(_deEmpId, d, d);
});

document.getElementById('de-save').addEventListener('click', function () {
  if (!_deEmpId || !_deDate) return;
  // A4: the break LIST is the day. A blank clock slot still deletes that punch
  // (unchanged S7 semantics); an empty breaks array deletes every break row.
  var slots = {
    ClockIn:  document.getElementById('de-clockin').value || '',
    ClockOut: document.getElementById('de-clockout').value || '',
    breaks:   deReadBreaks_(),
  };
  var reason = document.getElementById('de-reason').value.trim();
  var toDate = (document.getElementById('de-date-to') || {}).value || '';
  // F(cycle-8 M-2): a filled "To" on/before the edit date used to silently
  // DOWNGRADE to the single-day save — a full-day reconcile where every blank
  // slot DELETES that punch (the deliberate opposite of range mode's additive
  // blank-is-untouched semantics, INV-108). A manager expecting an additive
  // range apply could wipe the day's other punches. Reject instead of guessing.
  if (toDate && toDate <= _deDate) {
    showToast('“To” must be after the edit date — clear it for a single-day save', 'toast-error');
    return;
  }
  var rangeMode = toDate && toDate > _deDate;   // #4b — multi-day additive apply
  var btn = document.getElementById('de-save');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  var onOk = function (result) {
    btn.disabled = false;
    btn.textContent = 'Save Changes';
    if (!result.success) { showToast((result.error || 'Error'), 'toast-error'); return; }
    document.getElementById('day-edit-overlay').classList.remove('open');
    showToast(rangeMode
      ? ('Applied ' + (result.punchesWritten || 0) + ' punch(es) across ' + (result.daysTouched || 0) + ' day(s)')
      : (result.changes > 0 ? result.summary : 'No changes needed'), 'toast-success');
    refreshViewIfCurrent('manage', 'Refreshing…', loadManagerDashboard);
  };
  var onErr = function (err) {
    btn.disabled = false;
    btn.textContent = 'Save Changes';
    showToast((err.message || 'Server error'), 'toast-error');
  };
  if (rangeMode) {
    google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)
      .managerSaveDayRange(_deEmpId, _deDate, toDate, slots, reason);
  } else {
    google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)
      .managerSaveDay(_deEmpId, _deDate, slots, reason);
  }
});

/** 7-bar daily-hours sparkline inside each live-status card (V4·E3).
 *  Bars are flex-sized; hours-mapped heights scale within the row.
 *  Bars colored: zero (dim), short (<6h warn-toned), normal accent.
 *  Returns '' for missing/empty arrays so non-tracking reps don't see
 *  a placeholder. */
function renderEmpSparkline_(recentHours) {
  if (!recentHours || recentHours.length === 0) return '';
  const max = Math.max(8, ...recentHours.map(d => d.hours || 0));
  const totalHrs = recentHours.reduce((s, d) => s + (d.hours || 0), 0);
  const daysWorked = recentHours.filter(d => (d.hours || 0) > 0).length;
  if (totalHrs === 0) return '';
  const bars = recentHours.map(d => {
    const h = d.hours || 0;
    const px = h === 0 ? 0 : Math.max(2, Math.round((h / max) * 18));
    const cls = ['bar'];
    if (h === 0) cls.push('zero');
    else if (h < 6) cls.push('short');
    const dlabel = d.date ? d.date.slice(5) : '';
    return `<div class="${cls.join(' ')}" title="${esc(dlabel + ': ' + (h ? h.toFixed(1) + 'h' : 'off'))}" style="height:${px}px"></div>`;
  }).join('');
  return `<div class="emp-spark-wrap">
    <div class="emp-spark">${bars}</div>
    <span class="emp-spark-total">${formatHoursShort(totalHrs)}·${daysWorked}d</span>
  </div>`;
}

/** 14-bar sparkline for the manager telemetry strip (V4·E2). Tone is
 *  applied to the latest bar so the eye lands on "right now"; empty
 *  trends collapse to nothing rather than render a row of zero-height
 *  placeholders. */
function renderTelSparkline_(trend, tone) {
  if (!trend || trend.length === 0) return '';
  const max = Math.max(1, ...trend.map(d => d.count || 0));
  const bars = trend.map((d, i) => {
    const c = d.count || 0;
    const h = c === 0 ? 0 : Math.max(2, Math.round((c / max) * 18));
    const isLast = i === trend.length - 1;
    const cls = ['bar'];
    if (c === 0) cls.push('zero');
    if (isLast && tone && c > 0) cls.push(tone);
    const title = `${d.date}: ${c}`;
    return `<div class="${cls.join(' ')}" title="${esc(title)}" style="height:${h}px"></div>`;
  }).join('');
  return `<div class="tel-spark">${bars}</div>`;
}

function renderAnalyticsSection(data) {
  const trend = data.punchTrend || [];
  const toSum = data.toSummary || { approved: 0, pending: 0, denied: 0 };
  if (trend.length === 0 && !toSum.approved && !toSum.pending && !toSum.denied) return '';

  const max = Math.max(1, ...trend.map(d => d.count));
  const barW = Math.floor(100 / Math.max(trend.length, 1));
  const bars = trend.map(d => {
    const h = Math.round((d.count / max) * 80);
    const label = d.date.slice(5);
    // D7 (cycle 10): esc() the server-derived label + count (shape-bound
    // today, but the documented rule is every server string routes through
    // esc() — the inconsistency was accidental, not a decision).
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0">
      <div style="font-family:var(--mono);font-size:11px;color:var(--ink);margin-bottom:2px">${esc(String(d.count))}</div>
      <div style="width:70%;height:${h}px;min-height:2px;background:var(--accent);border-radius:3px 3px 0 0"></div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px">${esc(label)}</div>
    </div>`;
  }).join('');

  const toTotal = toSum.approved + toSum.pending + toSum.denied;
  const toParts = [];
  if (toSum.approved) toParts.push(`<span style="color:var(--success-deep)">${toSum.approved} approved</span>`);
  if (toSum.pending)  toParts.push(`<span style="color:var(--warning-deep)">${toSum.pending} pending</span>`);
  if (toSum.denied)   toParts.push(`<span style="color:var(--danger-deep)">${toSum.denied} denied</span>`);

  return `
    <div class="metric-grid mgr-analytics">
      <div class="card" style="margin-bottom:16px">
        <h2 class="card-label">Punch Activity · last 7 days</h2>
        <div style="display:flex;align-items:flex-end;gap:2px;height:100px;padding:4px 0">${bars}</div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <h2 class="card-label">Time Off · this month</h2>
        <div style="font-size:28px;font-weight:600;color:var(--ink);margin:12px 0 4px">${toTotal}</div>
        <div style="font-size:12px;color:var(--muted)">requests total</div>
        <div class="mgr-to-parts">${toParts.join('')}</div>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
//  COVERAGE PLANNER (#3 — manager forward staffing view, managerOnly tab)
// ════════════════════════════════════════════════════════════════════════════
var COV_STATE = { from: '', to: '', customOpen: false };
// M4 — FORWARD presets: Coverage is a staffing plan, so its presets look
// ahead (the server caps the range at 14 days). Reusing 7D/30D/QTR here would
// point a staffing planner at the past.
var COV_PRESETS = [{ key: 'week', label: 'This week', off: 0, len: 7 }, { key: 'next', label: 'Next week', off: 7, len: 7 }, { key: '2w', label: '2 weeks', off: 0, len: 14 }];
function covActivePreset_() {
  var todayIso = isoDateTz(empTz());
  for (var i = 0; i < COV_PRESETS.length; i++) {
    var p = COV_PRESETS[i];
    if (COV_STATE.from === mgrAddDaysIso_(todayIso, p.off) && COV_STATE.to === mgrAddDaysIso_(todayIso, p.off + p.len - 1)) return p.key;
  }
  return '';
}
function covToggleCustom_(scope, rowId) {
  var next = mtDateRangeToggle_(scope, rowId);
  if (next !== null) COV_STATE.customOpen = next;
}
function covPreset_(key) {
  var p = null;
  COV_PRESETS.forEach(function (x) { if (x.key === key) p = x; });
  if (!p) return;
  var todayIso = isoDateTz(empTz());
  COV_STATE.from = mgrAddDaysIso_(todayIso, p.off);
  COV_STATE.to = mgrAddDaysIso_(todayIso, p.off + p.len - 1);
  COV_STATE.defaultDay = null;   // D5 — a preset is a user choice; sticks across midnight
  var f = document.getElementById('cov-from'), t = document.getElementById('cov-to');
  if (f) f.value = COV_STATE.from;
  if (t) t.value = COV_STATE.to;
  mtDateRangeSync_('cov', key);
  covLoad_();
}

function enterCoverageView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  // D5 (cycle 10): re-anchor a still-DEFAULT window after midnight — a
  // long-lived tab (the pinned pop-out pattern) re-entering Coverage kept
  // yesterday-anchored defaults with no signal. `defaultDay` marks the range
  // as default-derived; a user-chosen range (the Load button clears the mark)
  // is never touched. The Clock view reconciles day rollover the same way.
  var covToday = isoDateTz(empTz());
  if (COV_STATE.defaultDay && COV_STATE.defaultDay !== covToday) COV_STATE.from = null;
  if (!COV_STATE.from) {
    // F(L-5): anchor "today" to the roster tz (isoDateTz/empTz — the F6
    // discipline the sibling modals in this file follow), not the browser
    // clock — a manager whose machine tz differs from their roster tz got a
    // default window starting on the wrong server day.
    var todayIso = covToday;
    COV_STATE.defaultDay = todayIso;
    COV_STATE.from = todayIso;
    COV_STATE.to = mgrAddDaysIso_(todayIso, 6);   // F(cycle-8): DST-safe
  }
  var active = covActivePreset_();
  var open = COV_STATE.customOpen || active === '';
  var control = mtDateRange_({ scope: 'cov', ariaLabel: 'Coverage range',
    presets: COV_PRESETS.map(function (p) { return { key: p.key, label: p.label }; }),
    active: active, onPreset: 'covPreset_', rowId: 'cov-custom', customOpen: open, onToggle: 'covToggleCustom_' });
  area.innerHTML =
    (COMPACT_MODE
      ? control   /* pop-out: the tool tab bar names the active tab (2026-08-11) */
      : '<div class="app-bar"><div class="app-bar-left">' +
          '<div class="breadcrumb"><span>Manage</span><span class="crumb-sep">›</span><span class="crumb-current">Coverage</span></div>' +
          '<h1 class="display-title">Coverage</h1>' +
        '</div><div class="app-bar-right">' + control + '</div></div>') +
    mtDateRangeRow_('cov-custom', open,
      '<div class="field"><label for="cov-from">From</label><input type="date" id="cov-from" value="' + esc(COV_STATE.from) + '"></div>' +
      '<div class="field"><label for="cov-to">To</label><input type="date" id="cov-to" value="' + esc(COV_STATE.to) + '"></div>' +
      '<button type="button" class="refresh-btn" id="cov-load">Load</button>') +
    '<div id="cov-body">' + loSweep() + '</div>';
  var loadBtn = document.getElementById('cov-load');
  if (loadBtn) loadBtn.onclick = function () {
    COV_STATE.from = document.getElementById('cov-from').value;
    COV_STATE.to = document.getElementById('cov-to').value;
    COV_STATE.defaultDay = null;   // D5 — user-chosen range sticks across midnight
    mtDateRangeSync_('cov', covActivePreset_());
    covLoad_();
  };
  covLoad_();
}

// Cycle-9 L-31: a view-key guard alone can't stop a SAME-VIEW race — two
// quick Loads with different ranges both pass it, and if response A lands
// after B the heatmap shows range A's data under range B's inputs (the
// INV-146 class). The seq token drops the out-of-order response.
var _covSeq = 0;
function covLoad_() {
  var body = document.getElementById('cov-body'); if (!body) return;
  var requested = currentView;
  var seq = ++_covSeq;
  body.innerHTML = loSweep();
  google.script.run
    .withSuccessHandler(function (data) { if (currentView !== requested || seq !== _covSeq) return; covRender_(data); })
    .withFailureHandler(function (err) {
      if (currentView !== requested || seq !== _covSeq) return;
      // A12/INV-175: `.no-data` is the designed EMPTY card, also used two
      // lines below for "No coverage in range." — a failed RPC must not look
      // like a quiet range with nobody scheduled. No outer esc().
      body.innerHTML = errorStateHtml_((err && err.message) || 'Failed to load coverage');
    })
    .getCoveragePlan(COV_STATE.from, COV_STATE.to);
}

// §5b — one days × hours heatmap (rows = days, cols = working hours 6a–9p) +
// an understaffed risk callout. Per-day rep detail expands on clicking the day.
var COV_HOUR_START = 6, COV_HOUR_END = 21;
function covFmtHr_(h) { var hh = (h % 24); var ap = hh < 12 ? 'a' : 'p'; var h12 = hh % 12 || 12; return h12 + ap; }
function covToggleDay_(id, btn) {
  var el = document.getElementById(id);
  if (!el) return;
  var open = (el.style.display === 'none');
  el.style.display = open ? '' : 'none';
  // A11: mirror the open state onto the trigger. `btn` is optional so an older
  // cached render (or a direct call) still toggles rather than throwing.
  if (btn && btn.setAttribute) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function covRepsHtml_(day) {
  if (!day.reps || !day.reps.length) return '<div style="font-size:12px;color:var(--muted)">No reps scheduled.</div>';
  return '<div class="cov-reps">' + day.reps.map(function (r) {
    var statusCls = (r.status === 'off') ? 'off' : (r.status === 'tentative' ? 'tentative' : 'working');
    // F(cycle-8): a cross-tz shift can START on the previous manager-tz day
    // (IST local Jul-10 → mgr Jul-9 21:30–Jul-10 06:30); without the marker a
    // bare "9:30 PM – 6:30 AM" read as THIS day's evening coverage.
    var prevMark = r.startsPrevDay ? '<span style="color:var(--muted);font-size:10px;"> (from prev. day)</span>' : '';
    var lbl = (r.status === 'off')
      ? ('Off' + (r.ptoType ? (' · ' + esc(r.ptoType)) : ''))
      : (r.status === 'tentative'
          ? ('Tentative' + (r.ptoType ? (' · ' + esc(r.ptoType)) : ''))
          : (esc(r.startMgr) + ' – ' + esc(r.endMgr) + prevMark));
    return '<div class="cov-rep ' + statusCls + '">' +
      '<span class="cov-rep-name">' + esc(r.name) + '</span>' +
      '<span class="cov-rep-tz">' + esc(r.tz) + '</span>' +
      '<span class="cov-rep-status">' + lbl + '</span></div>';
  }).join('') + '</div>';
}

// Reps off/tentative on a day, for the risk callout's "— who" suffix (escaped).
function covOffReps_(day) {
  var names = (day.reps || []).filter(function (r) { return r.status === 'off' || r.status === 'tentative'; })
    .map(function (r) { return esc(r.name) + (r.ptoType ? (' (' + esc(r.ptoType) + ')') : ''); });
  return names.join(', ');
}

// Group consecutive understaffed hours (confirmed < minStaff) within the window
// into ranges, each rendered as one risk line (all dynamic parts esc'd).
function covDayRisks_(day, byHour, hours, minStaff) {
  var out = [], runStart = null, runC = null;
  var who = covOffReps_(day);
  function flush(endH) {
    if (runStart === null) return;
    out.push('<b>' + esc(day.weekday.slice(0, 3)) + ' ' + covFmtHr_(runStart) + '–' + covFmtHr_(endH + 1) + '</b> · ' +
      esc(String(runC)) + ' working, need ' + esc(String(minStaff)) + (who ? (' — ' + who) : ''));   // D7 — full esc() parity with the function's own claim
    runStart = null; runC = null;
  }
  hours.forEach(function (h) {
    var x = byHour[h] || { confirmed: 0 };
    var c = x.confirmed || 0;
    if (c < minStaff) { if (runStart === null) { runStart = h; runC = c; } else { runC = Math.min(runC, c); } }
    else { flush(h - 1); }
  });
  flush(hours[hours.length - 1]);
  return out;
}

function covRender_(data) {
  var body = document.getElementById('cov-body'); if (!body) return;
  if (!data || data.error) { body.innerHTML = errorStateHtml_((data && data.error) || 'No data'); return; }   // A12
  if (!data.days || !data.days.length) { body.innerHTML = '<div class="no-data">No coverage in range.</div>'; return; }   // genuinely empty — stays quiet
  var minStaff = data.minStaff || 2;
  var good = data.goodStaff || minStaff;   // ≥good = green; minStaff..good-1 = amber; <minStaff = red
  // Display + flag only business hours [start, end) (manager tz) — off-hours and
  // weekends are out of scope (we're closed), so they're not shown/flagged.
  var bizStart = (typeof data.businessStartHour === 'number') ? data.businessStartHour : COV_HOUR_START;
  var bizEnd = (typeof data.businessEndHour === 'number') ? data.businessEndHour : (COV_HOUR_END + 1);
  var hours = []; for (var h = bizStart; h < bizEnd; h++) hours.push(h);

  // F4 (cycle 16): the PTO overlay is best-effort server-side. When it fails,
  // ptoMap is empty and EVERY rep counts as working — so this grid renders
  // green on a day half the team is off. Say so loudly: an understaffing
  // planner that silently reports full staffing is worse than one that
  // refuses to answer. role="alert" matches the errorStateHtml_ posture.
  var ptoWarn = data.ptoUnavailable
    ? '<div class="error-state" role="alert" style="margin-bottom:10px">' + icon('warning', 16) +
      ' Time-off data could not be read, so this grid shows every rep as working — ' +
      'approved and pending PTO is NOT reflected. Treat the staffing bands as an upper bound and reload.</div>'
    : '';

  var note = '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">Times in ' + esc(data.managerTz || '') +
    ' · business hours ' + covFmtHr_(bizStart) + '–' + covFmtHr_(bizEnd) +
    '. Shifts use each rep’s roster Schedule override (column O) when set, else their timezone’s default. Hours with fewer than ' + esc(String(minStaff)) + ' working reps are flagged — click a day for the rep breakdown.</div>';
  var accLabel = (minStaff >= good - 1) ? String(minStaff) : (minStaff + '–' + (good - 1));
  var legend = '<div class="cov-legend">' +
    '<span><span class="sw" style="background:var(--accent-soft)"></span>Good (≥' + good + ')</span>' +
    '<span><span class="sw" style="background:var(--warn-soft)"></span>Acceptable (' + accLabel + ')</span>' +
    '<span><span class="sw" style="background:var(--destructive-soft)"></span>Concerning (<' + minStaff + ')</span>' +
    '</div>';

  var cols = 'minmax(110px,auto) repeat(' + hours.length + ',1fr)';
  var grid = '<div class="cov-heat" style="grid-template-columns:' + cols + '"><div></div>';
  hours.forEach(function (hr) { grid += '<div class="ch-hr">' + covFmtHr_(hr) + '</div>'; });

  var risks = [];
  data.days.forEach(function (day, di) {
    var byHour = {};
    (day.hours || []).forEach(function (x) { byHour[x.hour] = x; });
    var detailId = 'cov-d-' + di;
    // A1 + A11: a keyboard-reachable disclosure button. aria-expanded/-controls
    // tell assistive tech whether this day's rep detail is open; covToggleDay_
    // keeps the attribute in step.
    grid += '<button type="button" class="cov-day-lbl' + (day.closed ? ' is-closed' : '') +
      '" aria-expanded="false" aria-controls="' + detailId +
      '" onclick="covToggleDay_(\'' + detailId + '\', this)">' +
      '<span class="chev">' + icon('chevronRight', 12) + '</span>' +
      esc(day.weekday.slice(0, 3)) + ' ' + esc(String(day.date).slice(5)) +
      (day.holidayName ? ' <span class="hol">' + esc(day.holidayName) + '</span>' : '') +
      (day.closed ? ' <span class="cov-closed-tag">closed</span>' : '') + '</button>';
    hours.forEach(function (hr, hi) {
      var x = byHour[hr] || { confirmed: 0, tentative: 0 };
      var c = x.confirmed || 0, t = x.tentative || 0;
      // Closed days are never flagged (we're not open) — render a neutral cell.
      // Three bands on CONFIRMED reps (every shown hour is a business hour, so 0
      // is concerning, not neutral): ≥good green, ≥minStaff amber, else red.
      var cls = day.closed ? 'closed'
        : ((c >= good) ? 'ok' : (c >= minStaff ? 'risk' : 'low'));
      // §5 grid stagger-in — delay by cell position, capped < ~350ms total.
      var d = Math.min((di * hours.length + hi) * 6, 340);
      var title = day.closed ? (covFmtHr_(hr) + ' — closed')
        : (covFmtHr_(hr) + ' — ' + c + ' working' + (t ? (' (+' + t + ' tentative)') : ''));
      grid += '<div class="cov-cell hm ' + cls + '" style="--d:' + d + 'ms" title="' + esc(title) + '">' + (day.closed ? '' : (c || '')) + '</div>';
    });
    grid += '<div class="cov-detail" id="' + detailId + '" style="display:none">' + covRepsHtml_(day) + '</div>';
    if (!day.closed) risks = risks.concat(covDayRisks_(day, byHour, hours, minStaff));
  });
  grid += '</div>';

  var risk = risks.length
    ? '<div class="panel cov-risk" data-tone="destructive"><h2 class="card-label">Understaffed slots</h2>' +
        '<div class="cov-risk-list">' +
        risks.map(function (r) { return '<div class="cov-risk-item">' + r + '</div>'; }).join('') +
        '</div></div>'
    // F4: the all-clear is the one conclusion a missing PTO overlay makes
    // unsafe — with no PTO applied, "no understaffed hours" is guaranteed
    // rather than earned. Downgrade it to a neutral, explicitly-conditional
    // statement instead of a green check.
    : (data.ptoUnavailable
        ? '<div class="panel cov-risk" data-tone="warn"><h2 class="card-label">Coverage</h2>' +
            '<div style="font-size:13px;color:var(--muted)">' + icon('warning', 14) +
            ' No understaffed hours found — but time-off data is missing, so this is not an all-clear.</div></div>'
        : '<div class="panel cov-risk" data-tone="sage"><h2 class="card-label">Coverage</h2>' +
            '<div style="font-size:13px;color:var(--muted)">' + icon('checkCircle', 14) +
            ' All business hours meet the ' + esc(String(minStaff)) + '-rep minimum in this range.</div></div>');

  body.innerHTML = ptoWarn + note + legend + grid + risk;
}

// ════════════════════════════════════════════════════════════════════════════
//  PUNCTUALITY (start-time adherence vs scheduled shift start, managerOnly tab)
// ════════════════════════════════════════════════════════════════════════════
var PUNCT_STATE = { from: '', to: '', sort: { key: 'onTimePct', dir: 'asc' }, customOpen: false, data: null };
var PUNCT_PRESETS = [{ key: '7d', label: '7D', days: 7 }, { key: '30d', label: '30D', days: 30 }, { key: 'qtr', label: 'QTR', days: 90 }];

/** Which backward preset the current range matches ('' = custom). */
function punctActivePreset_() {
  var todayIso = isoDateTz(empTz());
  if (PUNCT_STATE.to !== todayIso) return '';
  for (var i = 0; i < PUNCT_PRESETS.length; i++) {
    if (PUNCT_STATE.from === mgrAddDaysIso_(todayIso, -(PUNCT_PRESETS[i].days - 1))) return PUNCT_PRESETS[i].key;
  }
  return '';
}

function enterPunctualityView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  // D5 (cycle 10): re-anchor a still-DEFAULT window after midnight (see
  // enterCoverageView) — user-chosen ranges are never touched.
  var punctToday = isoDateTz(empTz());
  if (PUNCT_STATE.defaultDay && PUNCT_STATE.defaultDay !== punctToday) PUNCT_STATE.from = null;
  if (!PUNCT_STATE.from) {
    // F(L-5): roster-tz "today" (isoDateTz/empTz), not the browser clock.
    var todayIso = punctToday;
    PUNCT_STATE.defaultDay = todayIso;
    PUNCT_STATE.to = todayIso;
    PUNCT_STATE.from = mgrAddDaysIso_(todayIso, -29);   // default last 30 days (F(cycle-8): DST-safe)
  }
  var active = punctActivePreset_();
  var open = PUNCT_STATE.customOpen || active === '';
  area.innerHTML =
    (COMPACT_MODE
      ? ''   /* pop-out: the tool tab bar names the active tab (2026-08-11) */
      : '<div class="app-bar"><div class="app-bar-left">' +
          '<div class="breadcrumb"><span>Manage</span><span class="crumb-sep">›</span><span class="crumb-current">Punctuality</span></div>' +
          '<h1 class="display-title">Punctuality</h1>' +
          '<p class="view-subtitle">Start-time adherence vs each rep’s scheduled shift start. On-time = clock-in within the grace window.</p>' +
        '</div><div class="app-bar-right">' +
          // M4 — the shared range control, BACKWARD presets (this tab looks back).
          mtDateRange_({ scope: 'punct', ariaLabel: 'Punctuality range',
            presets: PUNCT_PRESETS.map(function (p) { return { key: p.key, label: p.label }; }),
            active: active, onPreset: 'punctPreset_', rowId: 'punct-custom', customOpen: open, onToggle: 'punctToggleCustom_' }) +
        '</div></div>') +
    (COMPACT_MODE
      ? mtDateRange_({ scope: 'punct', ariaLabel: 'Punctuality range',
          presets: PUNCT_PRESETS.map(function (p) { return { key: p.key, label: p.label }; }),
          active: active, onPreset: 'punctPreset_', rowId: 'punct-custom', customOpen: open, onToggle: 'punctToggleCustom_' })
      : '') +
    mtDateRangeRow_('punct-custom', open,
      '<div class="field"><label for="punct-from">From</label><input type="date" id="punct-from" value="' + esc(PUNCT_STATE.from) + '"></div>' +
      '<div class="field"><label for="punct-to">To</label><input type="date" id="punct-to" value="' + esc(PUNCT_STATE.to) + '"></div>' +
      '<button type="button" class="refresh-btn" id="punct-load">Load</button>') +
    '<div id="punct-body">' + loSweep() + '</div>';
  var b = document.getElementById('punct-load');
  if (b) b.onclick = function () {
    PUNCT_STATE.from = document.getElementById('punct-from').value;
    PUNCT_STATE.to = document.getElementById('punct-to').value;
    PUNCT_STATE.defaultDay = null;   // D5 — user-chosen range sticks across midnight
    mtDateRangeSync_('punct', punctActivePreset_());
    punctLoad_();
  };
  punctLoad_();
}

function punctToggleCustom_(scope, rowId) {
  var next = mtDateRangeToggle_(scope, rowId);
  if (next !== null) PUNCT_STATE.customOpen = next;
}

function punctPreset_(key) {
  var p = null;
  PUNCT_PRESETS.forEach(function (x) { if (x.key === key) p = x; });
  if (!p) return;
  // F(L-5): roster-tz "today" (isoDateTz/empTz), not the browser clock.
  var todayIso = isoDateTz(empTz());
  PUNCT_STATE.to = todayIso;
  PUNCT_STATE.from = mgrAddDaysIso_(todayIso, -(p.days - 1));   // F(cycle-8): DST-safe
  PUNCT_STATE.defaultDay = null;   // D5 — a preset is a user choice; sticks across midnight
  var f = document.getElementById('punct-from'), t = document.getElementById('punct-to');
  if (f) f.value = PUNCT_STATE.from;
  if (t) t.value = PUNCT_STATE.to;
  mtDateRangeSync_('punct', key);
  punctLoad_();
}

function punctFmtMin_(m) {
  var hh = Math.floor(m / 60), mm = m % 60, ap = hh < 12 ? 'AM' : 'PM', h12 = hh % 12 || 12;
  return h12 + ':' + ('0' + mm).slice(-2) + ' ' + ap;
}
function punctFmtDate_(iso) {
  if (!iso) return '';
  var p = String(iso).split('-');
  return MONTH_NAMES[parseInt(p[1], 10) - 1].slice(0, 3) + ' ' + parseInt(p[2], 10);
}

var _punctSeq = 0;   // cycle-9 L-31 — same-view range race (see covLoad_)
function punctLoad_() {
  var body = document.getElementById('punct-body'); if (!body) return;
  var requested = currentView;
  var seq = ++_punctSeq;
  body.innerHTML = loSweep();
  google.script.run
    .withSuccessHandler(function (data) { if (currentView !== requested || seq !== _punctSeq) return; PUNCT_STATE.data = data; punctRender_(data); })
    .withFailureHandler(function (err) {
      if (currentView !== requested || seq !== _punctSeq) return;
      body.innerHTML = errorStateHtml_((err && err.message) || 'Failed to load punctuality');   // A12
    })
    .getPunctualityReport(PUNCT_STATE.from, PUNCT_STATE.to);
}

/** M3 — "Worth a conversation": reps below the concern band (on-time < 75%)
 *  or with an average late arrival past 15 minutes. FACTS ONLY — the trend
 *  word compares the newest weekly bucket with the oldest one that has graded
 *  days (Worsening / Flat / Improving at ±5 points), and nothing here is a
 *  verdict beyond the bands the table already paints. Pure, Node-pinned. */
function punctOutliers_(reps) {
  return (reps || []).filter(function (r) {
    return (r.onTimePct != null && r.onTimePct < 75) || (r.late > 0 && r.avgLate > 15);
  }).map(function (r) {
    return { id: r.id, name: r.name, onTimePct: r.onTimePct, late: r.late, avgLate: r.avgLate,
      worst: r.worst, worstDate: r.worstDate || null, trend: punctTrend_(r.weekly) };
  });
}
function punctTrend_(weekly) {
  var graded = (weekly || []).filter(function (w) { return w && w.onTimePct != null; });
  if (graded.length < 2) return { word: 'Flat', delta: null };
  var delta = graded[graded.length - 1].onTimePct - graded[0].onTimePct;
  return { word: delta <= -5 ? 'Worsening' : (delta >= 5 ? 'Improving' : 'Flat'), delta: delta };
}
function punctTrendChip_(t) {
  var tone = t.word === 'Worsening' ? 'destructive' : (t.word === 'Improving' ? 'sage' : 'info');
  return '<span class="kicker-pill" data-tone="' + tone + '">' + esc(t.word) +
    (t.delta != null ? ' ' + (t.delta > 0 ? '+' : '') + t.delta + 'pt' : '') + '</span>';
}

/** M2f — Log coaching from a punctuality row: parks a narrative on
 *  COACH_PREFILL (the park-and-consume pattern, C8) and opens Training →
 *  Coaching in Team mode. The TOOL key is `develop` (cycle-9 H-1). */
function punctCoach_(btn) {
  var id = btn.getAttribute('data-emp-id');
  var reps = (PUNCT_STATE.data && PUNCT_STATE.data.reps) || [];
  var r = null; reps.forEach(function (x) { if (x.id === id) r = x; });
  if (!r) return;
  var days = PUNCT_STATE.data.from && PUNCT_STATE.data.to ? punctDaysBetween_(PUNCT_STATE.data.from, PUNCT_STATE.data.to) + 1 : 0;
  var what = r.onTimePct + '% on-time over ' + (days || r.days) + ' days; ' + r.late + ' late day' + (r.late === 1 ? '' : 's') +
    (r.worst ? ', worst ' + r.worst + 'm' + (r.worstDate ? ' on ' + punctFmtDate_(r.worstDate) : '') : '') + '.';
  window.COACH_PREFILL = { empId: id, patientTRX: '', noteId: '', what: what };
  if (typeof enterTool === 'function') enterTool('develop', 'coaching');
}
function punctDaysBetween_(a, b) {
  var pa = a.split('-'), pb = b.split('-');
  return Math.round((Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 86400000);
}

function punctSort_(key) {
  var s = PUNCT_STATE.sort;
  if (s.key === key) s.dir = (s.dir === 'asc' ? 'desc' : 'asc');
  else { s.key = key; s.dir = (key === 'name' || key === 'startMin') ? 'asc' : (key === 'onTimePct' ? 'asc' : 'desc'); }
  if (PUNCT_STATE.data) punctRender_(PUNCT_STATE.data);
}

/** The expanded row (M2d): the record on the left (day strip + late-day
 *  chips), the diagnosis on the right (scheduled-vs-actual timeline + weekly
 *  bars), then the actions. Everything draws from dayDetail. */
function punctDetailHtml_(r, grace) {
  var dd = r.dayDetail || [];
  if (!dd.length) return '';
  var n = { ontime: 0, late: 0, late15: 0, off: 0, holiday: 0, nopunch: 0 };
  dd.forEach(function (d) {
    if (d.state === 'late') { n.late++; if (d.lateMin > 15) n.late15++; }
    else if (n[d.state] !== undefined) n[d.state]++;
  });
  var stripLabel = dd.length + ' days: ' + n.ontime + ' on time, ' + n.late + ' late, ' + n.late15 +
    ' late over 15 minutes, ' + n.off + ' time off, ' + n.holiday + ' holiday' + (n.holiday === 1 ? '' : 's') +
    (n.nopunch ? ', ' + n.nopunch + ' with no clock-in' : '');
  var strip = '<div class="pt-strip" role="img" aria-label="' + esc(stripLabel) + '">' + dd.map(function (d) {
    var cls = d.state === 'late' ? (d.lateMin > 15 ? 'late15' : 'late') : d.state;
    var t = punctFmtDate_(d.date) + ' — ' + (d.state === 'ontime' ? 'on time' : d.state === 'late' ? d.lateMin + 'm late'
      : d.state === 'off' ? 'time off (' + (d.ptoType || '') + ')' : d.state === 'holiday' ? (d.holidayName || 'holiday') : 'no clock-in');
    return '<i class="pt-day ' + cls + '" title="' + esc(t) + '"></i>';
  }).join('') + '</div>';
  var legend = '<div class="pt-legend"><span><i class="pt-day ontime"></i>on time</span><span><i class="pt-day late"></i>late ≤15m</span>' +
    '<span><i class="pt-day late15"></i>late &gt;15m</span><span><i class="pt-day off"></i>time off</span><span><i class="pt-day holiday"></i>holiday</span>' +
    (n.nopunch ? '<span><i class="pt-day nopunch"></i>no clock-in</span>' : '') + '</div>';
  var lateDays = dd.filter(function (d) { return d.state === 'late'; }).sort(function (a, b) { return b.lateMin - a.lateMin; });
  var LATE_CAP = 8;
  var chips = lateDays.length
    ? '<div class="pt-late">' + lateDays.slice(0, LATE_CAP).map(function (d) {
        return '<span class="cn-pill" data-tone="' + (d.lateMin > 15 ? 'crit' : 'warn') + '">' + esc(punctFmtDate_(d.date)) + ' · ' + d.lateMin + 'm</span>';
      }).join('') + (lateDays.length > LATE_CAP ? '<span class="cn-pill" data-tone="muted">+' + (lateDays.length - LATE_CAP) + ' more</span>' : '') + '</div>'
    : '<div class="pt-quiet">No late days in this range.</div>';
  // Scheduled start vs actual: a 0–60 min axis from 15 minutes early to 45
  // minutes late, the grace window shaded, one dot per clock-in.
  var SPAN = 60, EARLY = 15;
  var pos = function (m) { return Math.max(0, Math.min(100, ((m + EARLY) / SPAN) * 100)); };
  var dots = dd.filter(function (d) { return d.actualMin != null; }).map(function (d) {
    var delta = d.actualMin - d.schedStartMin;
    return '<i class="pt-dot ' + (delta > grace ? (delta > 15 ? 'late15' : 'late') : 'ontime') + '" style="left:' + pos(delta).toFixed(1) + '%" title="' +
      esc(punctFmtDate_(d.date) + ' — ' + punctFmtMin_(d.actualMin) + (delta > 0 ? ' (+' + delta + 'm)' : '')) + '"></i>';
  }).join('');
  var timeline = '<div class="pt-tl" role="img" aria-label="' + esc('Clock-ins relative to the ' + punctFmtMin_(r.startMin) + ' start; grace ' + grace + ' minutes') + '">' +
    '<span class="pt-tl-grace" style="left:' + pos(0).toFixed(1) + '%;width:' + ((grace / SPAN) * 100).toFixed(1) + '%"></span>' +
    '<span class="pt-tl-rule" style="left:' + pos(0).toFixed(1) + '%"></span>' + dots + '</div>' +
    '<div class="pt-tl-axis"><span>−15m</span><span>' + esc(punctFmtMin_(r.startMin)) + '</span><span>+45m</span></div>';
  var weekly = r.weekly || [];
  var bars = '<div class="pt-weeks">' + weekly.map(function (w) {
    var pct = w.onTimePct;
    var tone = pct == null ? 'none' : mtPctTone_(pct, 90, 75).replace('m-pct-', '');
    return '<div class="pt-week" title="' + esc(punctFmtDate_(w.from) + '–' + punctFmtDate_(w.to) + ': ' + (pct == null ? 'no graded days' : pct + '% (' + w.onTime + '/' + w.days + ')')) + '">' +
      '<div class="pt-week-bar"><i class="' + tone + '" style="height:' + (pct == null ? 0 : pct) + '%"></i></div>' +
      '<div class="pt-week-lbl">' + (pct == null ? '—' : pct + '%') + '</div></div>';
  }).join('') + '</div>';
  var trend = punctTrend_(weekly);
  var prev = (r.prevOnTimePct != null)
    ? '<div class="pt-quiet">Previous range: ' + r.prevOnTimePct + '% (' + r.prevOnTime + '/' + r.prevDays + ' days)</div>' : '';
  return '<div class="pt-detail">' +
    '<div class="pt-col"><h3 class="pt-h">Day by day</h3>' + strip + legend + '<h3 class="pt-h">Late days</h3>' + chips + '</div>' +
    '<div class="pt-col"><h3 class="pt-h">Scheduled start vs actual</h3>' + timeline +
      '<h3 class="pt-h">On-time by week ' + punctTrendChip_(trend) + '</h3>' + bars + prev +
      '<div class="pt-actions">' +
        '<button type="button" class="pending-btn pb-approve" data-emp-id="' + esc(r.id) + '" onclick="punctCoach_(this)">' + icon('bulb', 13) + 'Log coaching</button>' +
        '<button type="button" class="refresh-btn" data-emp-id="' + esc(r.id) + '" data-emp-name="' + esc(r.name) + '" onclick="openDayEditModal(this.dataset.empId, this.dataset.empName)">' + icon('adjust', 13) + 'Open timesheet</button>' +
      '</div></div>' +
  '</div>';
}

function punctRender_(data) {
  var body = document.getElementById('punct-body'); if (!body) return;
  if (!data || data.error) { body.innerHTML = errorStateHtml_((data && data.error) || 'No data'); return; }   // A12
  var reps = data.reps || [];
  if (!reps.length) { body.innerHTML = '<div class="no-data">No clock-ins in this range.</div>'; return; }   // genuinely empty — stays quiet
  var totDays = 0, totOn = 0, totLateDays = 0, totLateMin = 0, worstAll = 0, worstRep = null, prevDays = 0, prevOn = 0;
  reps.forEach(function (r) {
    totDays += r.days; totOn += r.onTime;
    if (r.late) { totLateDays += r.late; totLateMin += r.avgLate * r.late; }
    if (r.worst > worstAll) { worstAll = r.worst; worstRep = r; }
    prevDays += r.prevDays || 0; prevOn += r.prevOnTime || 0;
  });
  var teamPct = totDays ? Math.round((totOn / totDays) * 100) : 0;
  var prevPct = prevDays ? Math.round((prevOn / prevDays) * 100) : null;
  var teamAvgLate = totLateDays ? Math.round(totLateMin / totLateDays) : 0;
  var teamCls = teamPct >= 90 ? 'success' : (teamPct >= 75 ? 'warn' : 'crit');
  var lateCls = teamAvgLate <= 5 ? 'success' : (teamAvgLate <= 15 ? 'warn' : 'crit');
  var deltaTxt = prevPct == null ? 'no previous range to compare'
    : ((teamPct - prevPct > 0 ? '+' : '') + (teamPct - prevPct) + 'pt vs ' + esc(punctFmtDate_(data.prevFrom)) + '–' + esc(punctFmtDate_(data.prevTo)));
  var note = '<div style="font-size:12px;color:var(--muted);margin-bottom:14px">On-time = clock-in within ' + esc(String(data.grace)) +
    ' min of the scheduled start. Only days with a clock-in are graded; time off and holidays are drawn in the day-by-day record but never counted against a rep.' +
    (data.ptoUnavailable ? ' <span style="color:var(--warning-deep)">' + icon('warning', 11) + ' Time-off data could not be read — approved PTO days show as no clock-in.</span>' : '') + '</div>';
  var summary = '<div class="telemetry" style="margin-bottom:16px">' +
    '<div class="tel-cell"><div class="tel-label">Team on-time</div><div class="tel-value ' + teamCls + '">' + teamPct + '%</div><div class="tel-sub">' + totOn + ' / ' + totDays + ' days · ' + deltaTxt + '</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Reps</div><div class="tel-value">' + reps.length + '</div><div class="tel-sub">with clock-ins</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Avg late</div><div class="tel-value ' + (totLateDays ? lateCls : '') + '">' + (totLateDays ? teamAvgLate + 'm' : '0m') + '</div><div class="tel-sub">on late days</div></div>' +
    '<div class="tel-cell' + (worstAll > 15 ? ' pt-worst' : '') + '"><div class="tel-label">Worst</div><div class="tel-value ' + (worstAll > 15 ? 'crit' : '') + '">' + (worstAll ? worstAll + 'm' : '—') + '</div>' +
      '<div class="tel-sub">' + (worstRep ? esc(worstRep.name.split(' ')[0]) + (worstRep.worstDate ? ' · ' + esc(punctFmtDate_(worstRep.worstDate)) : '') : 'single day') + '</div></div>' +
    '</div>';
  // M3 — outliers. Nothing renders when the list is empty (no empty panel).
  var outliers = punctOutliers_(reps);
  var outHtml = outliers.length
    ? '<div class="panel pt-outliers" data-tone="destructive"><h2 class="card-label"><span>Worth a conversation</span><span class="count-pill danger">' + outliers.length + '</span></h2>' +
      '<div class="pt-out-list">' + outliers.map(function (o) {
        return '<div class="pt-out"><div class="pt-out-main"><span class="pt-out-name">' + esc(o.name) + '</span> ' +
          '<span class="' + mtPctTone_(o.onTimePct, 90, 75) + '">' + o.onTimePct + '%</span> ' + punctTrendChip_(o.trend) +
          '<span class="pt-out-sub">' + o.late + ' late day' + (o.late === 1 ? '' : 's') + (o.late ? ' · avg ' + o.avgLate + 'm' : '') +
          (o.worst ? ' · worst ' + o.worst + 'm' + (o.worstDate ? ' on ' + esc(punctFmtDate_(o.worstDate)) : '') : '') + '</span></div>' +
          '<button type="button" class="pending-btn pb-approve" data-emp-id="' + esc(o.id) + '" onclick="punctCoach_(this)">' + icon('bulb', 13) + 'Log coaching</button></div>';
      }).join('') + '</div></div>'
    : '';
  // Sort (default on-time ascending — least punctual first, now a real control).
  var s = PUNCT_STATE.sort;
  var sorted = reps.slice().sort(function (a, b) {
    var av = a[s.key], bv = b[s.key];
    if (av == null) av = (s.key === 'name') ? '' : -1;
    if (bv == null) bv = (s.key === 'name') ? '' : -1;
    var c = (typeof av === 'string') ? av.localeCompare(bv) : (av - bv);
    if (c === 0) c = b.late - a.late;
    return s.dir === 'asc' ? c : -c;
  });
  var cols = [
    { key: 'name', label: 'Rep', name: true, sortable: true, cell: function (r) {
        var has = r.dayDetail && r.dayDetail.length;
        return esc(r.name) + (has
          ? ' <button type="button" class="m-qtoggle" aria-expanded="false" aria-controls="punct-r-' + esc(String(r.id).replace(/[^\w.$-]/g, '')) + '"' +
            ' aria-label="Day-by-day record for ' + esc(r.name) + '" onclick="cnToggleDetailRow_(this)">' + icon('chevronDown', 12) + '</button>' : '');
      } },
    { key: 'startMin', label: 'Shift start', numeric: true, sortable: true, cell: function (r) { return esc(punctFmtMin_(r.startMin)); } },
    { key: 'days', label: 'Days', numeric: true, sortable: true, cell: function (r) { return String(r.days); } },
    { key: 'onTimePct', label: 'On-time', numeric: true, sortable: true, cell: function (r) {
        var cls = mtPctTone_(r.onTimePct, 90, 75);
        return '<span class="' + cls + '">' + r.onTimePct + '%</span><div class="pt-bar"><i class="' + cls + '" style="width:' + r.onTimePct + '%"></i></div>';
      } },
    { key: 'avgLate', label: 'Avg late', numeric: true, sortable: true, cell: function (r) { return r.late ? r.avgLate + 'm' : '—'; } },
    { key: 'worst', label: 'Worst', numeric: true, sortable: true, cell: function (r) { return r.worst ? r.worst + 'm' : '—'; } },
    { key: 'lunchOnTimePct', label: 'Lunch', numeric: true, sortable: true, cell: function (r) {
        return r.lunchOnTimePct == null
          ? '<span class="pt-na" title="No scheduled lunch break, or no lunch punches in range">—</span>'
          : '<span class="' + mtPctTone_(r.lunchOnTimePct, 90, 75) + '">' + r.lunchOnTimePct + '%</span>';
      } },
  ];
  var table = mtRenderTable_({
    columns: cols, rows: sorted, sort: s, onSort: 'punctSort_',
    rowId: function (r) { return 'punct-r-' + r.id; },
    detailRow: function (r) { return punctDetailHtml_(r, data.grace); },
    empty: '<div class="no-data">No clock-ins in this range.</div>',
  });
  body.innerHTML = summary + outHtml + note +
    '<div class="panel pt-wrap"><h2 class="card-label"><span>Per-rep punctuality</span></h2>' + table + '</div>';
}
</script>
