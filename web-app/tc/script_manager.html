<style>
  /* #3 — Coverage planner */
  .cov-strip { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin: 10px 0 2px; }
  .cov-h { height: 26px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 9px; color: var(--ink); background: var(--paper-2); }
  .cov-h i { font-style: normal; opacity: .75; }
  .cov-h.ok   { background: var(--accent-soft); }
  .cov-h.risk { background: var(--warn-soft); }
  .cov-h.low  { background: var(--destructive-soft); }
  .cov-h.none { background: var(--paper-2); }
  .cov-hours-axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; color: var(--muted); margin-bottom: 10px; }
  .cov-reps { display: flex; flex-direction: column; gap: 2px; }
  .cov-rep { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .cov-rep:last-child { border-bottom: none; }
  .cov-rep-name { font-weight: 600; color: var(--ink); }
  .cov-rep-tz { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .cov-rep-status { font-family: var(--mono); font-size: 11px; color: var(--ink); }
  .cov-rep.off .cov-rep-name, .cov-rep.off .cov-rep-status { color: var(--muted); }
  .cov-rep.tentative .cov-rep-status { color: var(--warning-deep); }
  /* #3 / §5b — week heatmap (days × hours) replacing the stacked per-day strips */
  .cov-heat { display: grid; gap: 3px; align-items: center; margin: 6px 0 4px; }
  .cov-heat .ch-hr { font-family: var(--mono); font-size: 9px; color: var(--muted); text-align: center; }
  /* A1 (cycle 13): <button>, not <div> — expanding a day's rep detail had no
     keyboard path. Reset keeps it visually identical to the div it replaced. */
  .cov-day-lbl { appearance: none; -webkit-appearance: none; background: none; border: 0; padding: 0;
    font-family: inherit; text-align: left;
    font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .cov-day-lbl:hover { color: var(--accent); }
  .cov-day-lbl .chev { color: var(--muted-3); display: inline-flex; }
  .cov-day-lbl .hol { font-family: var(--mono); font-size: 9px; color: var(--warning-deep); }
  .cov-cell { height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px; color: var(--ink); }
  .cov-cell.ok   { background: var(--accent-soft); }
  .cov-cell.risk { background: var(--warn-soft); }
  .cov-cell.low  { background: var(--destructive-soft); }
  .cov-cell.none { background: var(--paper-2); color: var(--muted-2); }
  .cov-cell.closed { background: repeating-linear-gradient(45deg, var(--paper-2), var(--paper-2) 4px, var(--paper) 4px, var(--paper) 8px); }
  .cov-day-lbl.is-closed { color: var(--muted-2); }
  .cov-closed-tag { font-family: var(--mono); font-size: 9px; color: var(--muted-2); letter-spacing: .08em; text-transform: uppercase; }
  .cov-detail { grid-column: 1 / -1; padding: 4px 0 8px; border-bottom: 1px solid var(--line); }
  .cov-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 10px 0; }
  .cov-legend .sw { width: 13px; height: 13px; border-radius: 3px; display: inline-block; vertical-align: -2px; margin-right: 5px; }
  .cov-risk { margin-top: 16px; }
  /* #2c — understaffed slots span the card width in responsive columns instead
     of one narrow column with dead space. */
  .cov-risk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2px 20px; margin-top: 4px; }
  .cov-risk-item { font-size: 13px; padding: 3px 0; color: var(--ink); }
  .cov-risk-item b { font-family: var(--mono); }
  /* Punctuality table */
  /* ─── MANAGE TIME — grouped scroll (design handoff PR 3, M5) ────────── */
  .mgr-group-h { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 22px 0 10px;
    font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .mgr-group-toggle { appearance: none; -webkit-appearance: none; font: inherit; letter-spacing: inherit; text-transform: inherit;
    background: none; border: 0; padding: 0; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .mgr-group-toggle:hover { color: var(--accent); }
  .mgr-group-toggle:focus-visible { outline: none; box-shadow: var(--ring-focus); border-radius: 4px; }
  .mgr-group-toggle .chev { display: inline-flex; color: var(--muted-3); }
  .mgr-group-sum { display: flex; flex-wrap: wrap; gap: 4px 14px; font-weight: 400; letter-spacing: .04em; text-transform: none; font-family: var(--ui); font-size: 12px; }
  .mgr-sum-state[data-tone="ok"]   { color: var(--success-deep); }
  .mgr-sum-state[data-tone="warn"] { color: var(--warning-deep); }
  .mgr-sum-state[data-tone="crit"] { color: var(--danger-deep); font-weight: 600; }
  .mgr-group[hidden] { display: none; }
  .mgr-card-sub { font-size: 12px; color: var(--muted); margin: -6px 0 10px; }
  .card[data-tone="warn"]        { box-shadow: inset 3px 0 0 var(--warn); }
  .card[data-tone="destructive"] { box-shadow: inset 3px 0 0 var(--destructive); }

  /* ─── PUNCTUALITY (design handoff PR 3, M1–M3) — the table rides the shared
     .m-table; these are the cell/detail pieces. The retired hand-rolled
     hand-rolled table/card/bar/preset rules are retired and banned (INV-184). */
  .pt-bar { height: 5px; border-radius: 3px; background: var(--paper-2); overflow: hidden; margin-top: 5px; min-width: 56px; }
  .pt-bar > i { display: block; height: 100%; border-radius: 3px; background: var(--muted-3); }
  .pt-bar > i.m-pct-high { background: var(--accent); }
  .pt-bar > i.m-pct-mid  { background: var(--warn); }
  .pt-bar > i.m-pct-low  { background: var(--destructive); }
  .pt-na { color: var(--muted-3); cursor: help; }
  .pt-worst { box-shadow: inset 3px 0 0 var(--destructive); }
  .pt-outliers { margin-bottom: 16px; }
  .pt-out-list { display: flex; flex-direction: column; gap: 6px; }
  .pt-out { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
  .pt-out:last-child { border-bottom: none; }
  .pt-out-main { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .pt-out-name { font-weight: 600; color: var(--ink); }
  .pt-out-sub { font-size: 12px; color: var(--muted); }
  .pt-wrap .m-table { width: 100%; }
  .pt-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 28px; padding: 8px 4px 10px; background: var(--paper-2); border-radius: var(--radius); }
  .pt-col { min-width: 0; }
  .pt-h { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; display: flex; align-items: center; gap: 8px; }
  .pt-strip { display: flex; flex-wrap: wrap; gap: 3px; }
  .pt-day { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--muted-3); }
  .pt-day.ontime  { background: var(--accent); }
  .pt-day.late    { background: var(--warn); }
  .pt-day.late15  { background: var(--destructive); }
  .pt-day.off     { background: var(--paper-3); border: 1px dashed var(--muted-3); box-sizing: border-box; }
  .pt-day.holiday { background: var(--info-soft); }
  .pt-day.nopunch { background: var(--paper-card); border: 1px solid var(--line); box-sizing: border-box; }
  .pt-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .pt-legend .pt-day { vertical-align: -2px; margin-right: 4px; }
  .pt-late { display: flex; flex-wrap: wrap; gap: 4px; }
  .pt-quiet { font-size: 12px; color: var(--muted); }
  .pt-tl { position: relative; height: 22px; background: var(--paper-card); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .pt-tl-grace { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); }
  .pt-tl-rule { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .6; }
  .pt-dot { position: absolute; top: 6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--accent); opacity: .85; }
  .pt-dot.late   { background: var(--warn); }
  .pt-dot.late15 { background: var(--destructive); }
  .pt-tl-axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 2px; }
  .pt-weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; }
  .pt-week-bar { height: 44px; background: var(--paper-card); border: 1px solid var(--line); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
  .pt-week-bar > i { display: block; width: 100%; background: var(--muted-3); }
  .pt-week-bar > i.high { background: var(--accent); }
  .pt-week-bar > i.mid  { background: var(--warn); }
  .pt-week-bar > i.low  { background: var(--destructive); }
  .pt-week-lbl { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; margin-top: 2px; }
  .pt-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  @media (max-width: 720px) {
    .pt-detail { grid-template-columns: 1fr; }
    /* Drop Shift start (2), Avg late (5) and Lunch (7); keep Rep / Days / On-time / Worst. */
    .pt-wrap .m-table th:nth-child(2), .pt-wrap .m-table td:nth-child(2),
    .pt-wrap .m-table th:nth-child(5), .pt-wrap .m-table td:nth-child(5),
    .pt-wrap .m-table th:nth-child(7), .pt-wrap .m-table td:nth-child(7) { display: none; }
  }
  /* Team punches calendar (operator 2026-08-31) — reuses the Time/PTO
     .cal-* vocabulary from styles.html; only the team-specific bits live
     here. Selection is a distinct inset ring (info, not the accent the
     .today ring uses) so today + selected read as two different facts. */
  /* The calendar keeps the Time/PTO cell SIZE (.cal-cell is aspect-ratio: 1,
     so a full-width grid would render ~180px cells and a ~1100px-tall month);
     the .cal-card 720px cap is the existing answer, applied to the grid only
     so the day TABLE below still spans the card. */
  .tcal-cal { max-width: 720px; margin: 0 auto 4px; }
  .tcal-head { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
  .tcal-month { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); min-width: 130px; text-align: center; }
  .cal-cell.tcal-sel { box-shadow: inset 0 0 0 2px var(--info); }
  .cal-cell.today.tcal-sel { box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 0 4px var(--info); }
  .tcal-row-warn td { background: var(--warn-soft); }
  .tcal-row-mute td { color: var(--muted); }
  .tcal-day-title { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
  .tcal-off { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tcal-off-chip { font-size: 12px; padding: 2px 9px; border-radius: var(--radius-pill); border: 1px solid var(--line); }
  .tcal-off-chip.approved { background: var(--accent-soft); }
  .tcal-off-chip.pending { background: var(--warn-soft); }
  .tcal-note { font-size: 11px; color: var(--muted); margin-top: 8px; }
  /* Follow-on (2026-09-01): the manager analytics pair carried an INLINE
     `grid-template-columns:1fr 1fr`, which beats every stylesheet rule
     including the shell's own media queries — so the two CARDS stayed 2-up at
     390px and the Time Off card pushed the page 44px sideways. It is also
     invisible to the A2 tripwire, which scans stylesheets. A real class with a
     real breakpoint instead; ≤700px because the pair holds a 7-bar chart and a
     three-part status line, not the 4-up metric TILES `.metric-grid` is sized
     for. (Measured at 390px: 434 → 390, i.e. zero page overflow.) */
  .mgr-analytics { grid-template-columns: 1fr 1fr; margin-bottom: 0; }
  @media (max-width: 700px) { .mgr-analytics { grid-template-columns: 1fr; } }
  /* The status line is three coloured spans; without wrap it has a hard
     min-content width that no column count can satisfy on a phone. */
  .mgr-to-parts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; margin-top: 8px; }
</style>
<script>
// ════════════════════════════════════════════════════════════════════════════
//  MANAGER VIEW
// ════════════════════════════════════════════════════════════════════════════

// F(L-6): the enter path renders the full-view spinner — on error the toast
// alone stranded the Manage Time view on "Loading…" forever. Replace the
// loader with a retryable error state.
function mgrLoadError_(msg) {
  if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(false);
  // SWR (2026-08-28): a failed background REFRESH must not wipe the painted
  // last-good dashboard with an error screen (the C17-5 preserve-last-good
  // posture) — #mgr-refresh existing means a dashboard is rendered.
  if (document.getElementById('mgr-refresh') && currentView === 'manage') {
    showToast('Could not refresh the dashboard: ' + msg, 'toast-warn');
    return;
  }
  showToast(msg, 'toast-error');
  const area = document.getElementById('view-area');
  if (area && currentView === 'manage') {
    area.innerHTML = '<div class="state-center"><p>' + esc(msg) + '</p>' +
      '<button class="refresh-btn" onclick="enterManagerView()">' + icon('refresh', 12) + 'Retry</button></div>';
  }
}

// Design handoff PR 3 (M5) — Manage Time group state. Session-only (the doc
// says "collapsed by default" and nothing more — a persisted key was
// deliberately dropped), re-applied by renderManagerView on every re-render.
// NOT a third mgrSwrRenderBlocked_ condition: a refresh landing on a
// collapsed group re-renders it collapsed, losing nothing.
var MGR_STATE = { collapsed: { periodic: true } };
function mgrToggleGroup_(key, btn) {
  var el = document.getElementById('mgr-' + key);
  if (!el) return;
  var open = el.hasAttribute('hidden');
  if (open) el.removeAttribute('hidden'); else el.setAttribute('hidden', '');
  MGR_STATE.collapsed[key] = !open;
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  var chev = btn.querySelector('.chev');
  if (chev) chev.innerHTML = icon(open ? 'chevronDown' : 'chevronRight', 14);
}
/** The Periodic summary row's per-panel state — a collapsed panel still
 *  SAYS what it found. tone: 'ok' | 'warn' | 'crit'. */
function mgrSetSummary_(id, text, tone) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.setAttribute('data-tone', tone || 'ok');
}
/** Age in whole days of the oldest pending request (roster-tz today), or
 *  null when the queue is empty / unstamped. */
function mgrOldestPendingDays_(pending) {
  var oldest = null;
  (pending || []).forEach(function (p) {
    var d = String(p.submittedAt || '').slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    if (oldest === null || d < oldest) oldest = d;
  });
  if (oldest === null) return null;
  var t = isoDateTz(empTz()).split('-'), o = oldest.split('-');
  var days = Math.round((Date.UTC(+t[0], +t[1] - 1, +t[2]) - Date.UTC(+o[0], +o[1] - 1, +o[2])) / 86400000);
  return days < 0 ? 0 : days;
}

// SWR render guard (2026-08-28): a background refresh must never wipe
// in-progress interaction — a checked bulk-select box, or any open overlay
// (Day Edit etc. re-fetch after their own submit anyway). Blocked = the
// fresh data still lands in mgrData (state stays warm); the view re-renders
// on the next enter/refresh.
function mgrSwrRenderBlocked_() {
  if (document.querySelector('.mgr-pending-chk:checked')) return true;
  if (document.querySelector('.overlay.open')) return true;
  return false;
}

function loadManagerDashboard() {
  google.script.run
    .withSuccessHandler(data => {
      if (data.error) { mgrLoadError_(data.error); return; }
      mgrData = data;
      if (typeof viewRefreshingPill_ === 'function') viewRefreshingPill_(false);
      const area = document.getElementById('view-area');
      if (!area || currentView !== 'manage') return;
      if (document.getElementById('mgr-refresh') && mgrSwrRenderBlocked_()) return;   // state warm, render deferred
      renderManagerView(area, data); loadPtoReconciliation_(); loadSheetDoctor_(); loadPendingAdjustments_(); loadTeamCalendar_();
    })
    .withFailureHandler(err => mgrLoadError_(err.message||'Load failed'))
    .getManagerDashboard();
}

// ── PTO balance reconciliation (Plan B1) ─────────────────────────────────
// Lazy, best-effort: fills #mgr-pto-recon only when getPtoReconciliation finds
// drift (reps double-deducted from duplicate same-date approvals — the H1 bug
// class). Renders nothing when clean, so the card is invisible in the common case.
function loadPtoReconciliation_() {
  const slot = document.getElementById('mgr-pto-recon');
  if (!slot) return;
  google.script.run
    .withSuccessHandler(function (res) {
      const s = document.getElementById('mgr-pto-recon');
      if (!s || currentView !== 'manage') return;
      // C17-7 — a FAILED check is not a CLEAN check (INV-187): only a
      // genuinely drift-free result may stay invisible.
      if (res && res.error) { s.innerHTML = errorStateHtml_('PTO reconciliation check could not run — this is a failed check, not a clean result. (' + res.error + ')'); mgrSetSummary_('mgr-sum-pto', 'check failed', 'warn'); return; }
      // M5 — a clean lazy card still STATES its state in the Periodic summary
      // row ("all clear"), never nothing: a collapsed group must not hide it.
      if (!res || !res.reps || res.reps.length === 0) { s.innerHTML = ''; mgrSetSummary_('mgr-sum-pto', 'all clear', 'ok'); return; }
      mgrSetSummary_('mgr-sum-pto', res.reps.length + ' mismatch' + (res.reps.length === 1 ? '' : 'es') + ' · ' + res.reps.map(function (r) { return r.name; }).join(', '), 'crit');
      s.innerHTML = renderPtoReconCard_(res);
    })
    .withFailureHandler(function (err) {
      const s = document.getElementById('mgr-pto-recon');
      if (!s || currentView !== 'manage') return;
      s.innerHTML = errorStateHtml_('PTO reconciliation check could not run — this is a failed check, not a clean result. (' + ((err && err.message) || 'load failed') + ')');
      mgrSetSummary_('mgr-sum-pto', 'check failed', 'warn');
    })
    .getPtoReconciliation();
}

function renderPtoReconCard_(res) {
  const rows = res.reps.map(function (r) {
    const over = [];
    if (r.overAnnual > 0) over.push(r.overAnnual + ' annual');
    if (r.overSick > 0)   over.push(r.overSick + ' sick');
    const dates = r.dates.map(function (d) {
      return esc(d.date) + ' (' + d.approvedCount + '×)';
    }).join(', ');
    return '<div style="padding:8px 0;border-bottom:1px dashed var(--line)">' +
      '<div style="display:flex;align-items:flex-start;gap:10px">' +
        '<div style="flex:1">' +
          '<div style="font-weight:600;font-size:13px;color:var(--ink)">' + esc(r.name) +
            ' <span style="color:var(--danger-deep)">— over-charged ' + esc(over.join(' + ')) + ' day(s)</span></div>' +
          '<div style="font-size:12px;color:var(--muted);margin-top:2px">Duplicate approved dates: ' + dates + '</div>' +
          '<div style="font-size:11px;color:var(--muted);margin-top:2px">Current balance: ' +
            esc(String(r.storedAnnual)) + ' annual / ' + esc(String(r.storedSick)) + ' sick</div>' +
        '</div>' +
        '<button class="pending-btn pb-approve" style="flex:0 0 auto" ' +
          'data-emp-id="' + esc(r.empId) + '" data-emp-name="' + esc(r.name) + '" ' +
          'onclick="fixPtoReconRep_(this)">' + icon('check', 14) + 'Credit &amp; reconcile</button>' +
      '</div>' +
    '</div>';
  }).join('');
  return '<div class="card" style="border-color:var(--danger)">' +
    '<h2 class="card-label with-count"><span>PTO Balance Drift</span>' +
      '<span class="count-pill danger">' + res.reps.length + '</span></h2>' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">These reps have more than one <em>approved</em> time-off row on the same date and were likely double-deducted (the H1 bug, now prevented for new requests). “Credit &amp; reconcile” credits the over-charge back and marks the duplicate rows reconciled (idempotent); or correct manually via Adjust.</div>' +
    rows +
  '</div>';
}

/** Credit the over-charge back to the rep and neutralize the duplicate rows
 *  (server-side fixPtoReconciliation). Confirms first (it adjusts a balance). */
function fixPtoReconRep_(btn) {
  const empId = btn.getAttribute('data-emp-id');
  const name = btn.getAttribute('data-emp-name') || 'this rep';
  uiConfirm({
    title: 'Reconcile PTO balance',
    message: 'Credit the over-charged day(s) back to ' + name + ' and mark the duplicate approved rows as reconciled? This adjusts their balance and writes an audit entry.',
    tone: 'danger', confirmLabel: 'Credit & reconcile',
  }).then(function (ok) {
    if (!ok) return;
    btn.disabled = true; btn.textContent = 'Reconciling…';
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          showToast((res && res.error) || 'Reconcile failed', 'toast-error');
          btn.disabled = false; return;
        }
        showToast(res.fixed
          ? ('Credited ' + (res.creditedAnnual || 0) + ' annual / ' + (res.creditedSick || 0) + ' sick back')
          : 'Nothing to reconcile', 'toast-success');
        loadPtoReconciliation_();   // refresh — the rep should drop off when clean
      })
      .withFailureHandler(function (err) {
        showToast((err && err.message) || 'Reconcile failed', 'toast-error');
        btn.disabled = false;
      })
      .fixPtoReconciliation(empId);
  });
}

// ── Batch L — Timesheet sheet doctor ────────────────────────────────────
// Lazy, best-effort (the PTO-recon lazy-card pattern): fills #mgr-sheet-doctor
// only when getTimesheetDoctor finds duplicate punch rows (pre-INV-155
// leftovers) or inverted ClockIn/ClockOut pairs (the mis-keyed AM/PM class
// that calcHours_'s deliberate overnight wrap renders as a huge day — C3).
// Duplicates get a one-click collapse (keeps the LAST row, the same one
// findExistingPunch_/managerSaveDay use); inverted pairs are report-only —
// fixing one is a judgment call for Day Edit.
function loadSheetDoctor_() {
  const slot = document.getElementById('mgr-sheet-doctor');
  if (!slot) return;
  google.script.run
    .withSuccessHandler(function (res) {
      const s = document.getElementById('mgr-sheet-doctor');
      if (!s || currentView !== 'manage') return;
      // C17-7 — same failed-vs-clean split as loadPtoReconciliation_.
      if (res && res.error) { s.innerHTML = errorStateHtml_('Timesheet doctor scan could not run — this is a failed check, not a clean result. (' + res.error + ')'); mgrSetSummary_('mgr-sum-doctor', 'scan failed', 'warn'); return; }
      if (!res ||
          ((!res.duplicates || !res.duplicates.length) && (!res.inverted || !res.inverted.length))) {
        s.innerHTML = ''; mgrSetSummary_('mgr-sum-doctor', 'all clear', 'ok'); return;   // M5 — state, never silence
      }
      var nd = (res.totalDuplicates != null) ? res.totalDuplicates : (res.duplicates || []).length;
      var ni = (res.totalInverted != null) ? res.totalInverted : (res.inverted || []).length;
      mgrSetSummary_('mgr-sum-doctor', (nd ? nd + ' duplicate' : '') + (nd && ni ? ' · ' : '') + (ni ? ni + ' inverted' : ''), 'warn');
      s.innerHTML = renderSheetDoctorCard_(res);
    })
    .withFailureHandler(function (err) {
      const s = document.getElementById('mgr-sheet-doctor');
      if (!s || currentView !== 'manage') return;
      s.innerHTML = errorStateHtml_('Timesheet doctor scan could not run — this is a failed check, not a clean result. (' + ((err && err.message) || 'load failed') + ')');
      mgrSetSummary_('mgr-sum-doctor', 'scan failed', 'warn');
    })
    .getTimesheetDoctor();
}

function renderSheetDoctorCard_(res) {
  const dups = (res.duplicates || []).map(function (d) {
    return '<div style="padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px">' +
      '<span style="font-weight:600;color:var(--ink)">' + esc(d.name || d.empId) + '</span> · ' +
      esc(d.date) + ' · ' + esc(d.type) + ' ×' + esc(String(d.count)) +
      ' <span style="color:var(--muted)">(' + d.times.map(esc).join(', ') + ')</span></div>';
  }).join('');
  const invs = (res.inverted || []).map(function (v) {
    const detail = (v.kind === 'lunch')
      ? 'lunch out ' + esc(v.lunchOut) + ' → return ' + esc(v.lunchIn) +
        ' <span style="color:var(--warning-deep)">return precedes the leave — check AM/PM via Day Edit</span>'
      : 'in ' + esc(v.clockIn) + ' → out ' + esc(v.clockOut) +
        ' <span style="color:var(--warning-deep)">reads as an overnight day — check AM/PM via Day Edit</span>';
    return '<div style="padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px">' +
      '<span style="font-weight:600;color:var(--ink)">' + esc(v.name || v.empId) + '</span> · ' +
      esc(v.date) + ' · ' + detail + '</div>';
  }).join('');
  // F2 (cycle 12): report the REAL totals, not the payload-capped list length,
  // and label the button with what the server will actually do this run.
  const shownDup = (res.duplicates || []).length;
  const shownInv = (res.inverted || []).length;
  const totDup = (res.totalDuplicates != null) ? res.totalDuplicates : shownDup;
  const totInv = (res.totalInverted != null) ? res.totalInverted : shownInv;
  const total = totDup + totInv;
  const fixCap = res.fixMaxRows || 0;
  const dupRows = (res.totalDuplicateRows != null) ? res.totalDuplicateRows : shownDup;
  const willFix = (fixCap && dupRows > fixCap) ? fixCap : dupRows;
  const truncNote = res.truncated
    ? '<div style="font-size:12px;color:var(--warning-deep);margin-bottom:8px">' +
        icon('warning', 11) + ' Showing ' + esc(String(shownDup)) + ' of ' + esc(String(totDup)) +
        ' duplicate group(s) and ' + esc(String(shownInv)) + ' of ' + esc(String(totInv)) +
        ' inverted pair(s) — fix these, then re-run to see the rest.</div>'
    : '';
  return '<div class="card" style="border-color:var(--warn)">' +
    '<h2 class="card-label with-count"><span>Timesheet Doctor</span>' +
      '<span class="count-pill warn">' + total + '</span></h2>' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">Scan of the last ' +
      esc(String(res.windowDays)) + ' days. Duplicate rows predate the live sequence guard; ' +
      'collapsing keeps the latest row per punch (the row Day Edit already shows). ' +
      'Inverted in/out pairs are report-only — correct them via Day Edit.</div>' +
    truncNote +
    (dups ? '<h2 class="card-label" style="margin:6px 0 2px">Duplicate punches</h2>' + dups : '') +
    (dupRows
      ? '<div style="margin:8px 0 4px"><button class="pending-btn pb-approve" onclick="fixSheetDoctorDups_(this)">' +
          icon('check', 14) + 'Collapse ' + willFix + ' duplicate row(s)' +
          (willFix < dupRows ? ' (of ' + dupRows + ' — re-run for the rest)' : '') +
          '</button></div>'
      : '') +
    (invs ? '<h2 class="card-label" style="margin:10px 0 2px">Inverted in/out &amp; lunch pairs</h2>' + invs : '') +
  '</div>';
}

function fixSheetDoctorDups_(btn) {
  uiConfirm({
    title: 'Collapse duplicate punches',
    message: 'Delete the earlier duplicate row(s) per (employee, date, punch type), keeping the latest row — the one Day Edit displays? Each deletion writes an audit entry. Runs in bounded batches (punches are briefly blocked while it runs), so a large backlog may need more than one click; idempotent either way.',
    tone: 'danger', confirmLabel: 'Collapse duplicates',
  }).then(function (ok) {
    if (!ok) return;
    btn.disabled = true; btn.textContent = 'Collapsing…';
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          showToast((res && res.error) || 'Collapse failed', 'toast-error');
          btn.disabled = false; return;
        }
        // F2: `remaining` > 0 means the run hit its per-run bound — say so
        // instead of implying the backlog is clear.
        const rem = res.remaining || 0;
        showToast('Collapsed ' + (res.collapsed || 0) + ' duplicate row(s)' +
          (rem ? ' — ' + rem + ' left, click again' : ''),
          rem ? 'toast-warn' : 'toast-success');
        loadSheetDoctor_();   // refresh — clean groups drop off
      })
      .withFailureHandler(function (err) {
        showToast((err && err.message) || 'Collapse failed', 'toast-error');
        btn.disabled = false;
      })
      .fixTimesheetDuplicates();
  });
}

// ── Pending punch-adjustment requests (#4a) ─────────────────────────────
// Lazy, best-effort: fills #mgr-adjust-queue only when there are pending
// employee adjustment requests. Approve → server writes the ADJ- punch for the
// target rep; Deny → marks denied. Mirrors the PTO-recon lazy card.
function loadPendingAdjustments_() {
  const slot = document.getElementById('mgr-adjust-queue');
  if (!slot) return;
  google.script.run
    .withSuccessHandler(function (res) {
      const s = document.getElementById('mgr-adjust-queue');
      if (!s || currentView !== 'manage') return;
      // C17-7 — this is an OPERATIONAL queue, not a diagnostic: a failed
      // read rendering '' was byte-identical to "no requests pending", so
      // employee-submitted adjustments silently never surfaced (INV-187 —
      // the degraded output was MORE reassuring than the healthy one).
      // Only a genuinely empty result may render nothing.
      if (res && res.error) { s.innerHTML = errorStateHtml_('Couldn\'t load pending punch-adjustment requests — the queue may NOT be empty. Refresh to retry. (' + res.error + ')'); return; }
      if (!res || !res.requests || res.requests.length === 0) { s.innerHTML = ''; return; }
      s.innerHTML = renderAdjustQueueCard_(res.requests);
    })
    .withFailureHandler(function (err) {
      const s = document.getElementById('mgr-adjust-queue');
      if (!s || currentView !== 'manage') return;
      s.innerHTML = errorStateHtml_('Couldn\'t load pending punch-adjustment requests — the queue may NOT be empty. Refresh to retry. (' + ((err && err.message) || 'load failed') + ')');
    })
    .managerGetPendingAdjustments();
}

function renderAdjustQueueCard_(requests) {
  const rows = requests.map(function (r) {
    // B3: a RESUME is a different decision from a missed punch — it converts
    // the rep's clock-out into a break, so the hours they were away become
    // unpaid. Saying "ClockOut 19:30" would describe the punch it consumes, not
    // what approving does. State the effect.
    const isResume = r.action === 'resume';
    const detail = isResume
      ? 'Resume shift · ' + r.date + ' · back at ' + r.time +
        ' (clock-out becomes a break — the gap is unpaid)'
      : r.punchType + ' · ' + r.date + ' · ' + r.time;
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)">' +
      '<div style="flex:1">' +
        '<div style="font-weight:600;font-size:13px;color:var(--ink)">' + esc(r.empName) +
          ' <span style="color:var(--muted);font-weight:400">— ' + esc(detail) + '</span></div>' +
        (r.reason ? '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(r.reason) + '</div>' : '') +
      '</div>' +
      '<button class="pending-btn pb-approve" data-req-id="' + esc(r.reqId) + '" data-act="Approved" onclick="adjDecide_(this)">' + icon('check', 14) + 'Approve</button>' +
      '<button class="pending-btn pb-deny" data-req-id="' + esc(r.reqId) + '" data-act="Denied" onclick="adjDecide_(this)">' + icon('x', 14) + 'Deny</button>' +
    '</div>';
  }).join('');
  return '<div class="card">' +
    '<h2 class="card-label with-count"><span>Pending Punch Adjustments</span>' +
      '<span class="count-pill warn">' + requests.length + '</span></h2>' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">Employee-requested punch corrections. Approve writes the adjustment to the timesheet; deny discards it.</div>' +
    rows +
  '</div>';
}

function adjDecide_(btn) {
  const reqId = btn.getAttribute('data-req-id');
  const action = btn.getAttribute('data-act');
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { showToast((res && res.error) || 'Action failed', 'toast-error'); btn.disabled = false; return; }
      showToast(action === 'Approved' ? 'Adjustment approved' : 'Request denied', 'toast-success');
      loadPendingAdjustments_();
    })
    .withFailureHandler(function (err) { showToast((err && err.message) || 'Action failed', 'toast-error'); btn.disabled = false; })
    .updatePunchAdjustStatus(reqId, action);
}

function renderManagerView(area, data) {
  const counts = { clocked_in: 0, on_lunch: 0, clocked_out: 0, not_in: 0 };
  // D3 (cycle 10): tolerate an unknown status value — `counts[e.status]++` on
  // one bad row NaN-poisoned a counter, and the card map's `MGR_STATUS[e.status]`
  // threw and blanked the ENTIRE manager landing. The Clock-view teammate card
  // already had this `|| not_in` fallback; one server enum change or hand-edited
  // row shouldn't brick the view.
  data.liveStatus.forEach(e => { if (counts[e.status] !== undefined) counts[e.status]++; else counts.not_in++; });
  const totalEmp = data.liveStatus.length;
  const mgrTzAbbr = data.mgrTzAbbr || '';
  const pendingCount = data.pending.length;
  const missedCount = data.missedPunches.length;

  // ── Hero telemetry strip (V4·E2) ────────────────────────────────────────
  // 4-cell horizontal strip with mono-tabular values. Missed + Pending carry
  // 14-day sparklines (data.missedTrend / data.pendingTrend); Active + On
  // Lunch are static counts per the C6 decision. The sub-line surfaces the
  // most actionable specific (first missed rep + day, oldest pending rep).
  const missedSub = data.missedPunches.length > 0
    ? (() => {
        const m = data.missedPunches[0];
        const parts = m.date.split('-');
        const dlabel = `${MONTH_NAMES[parseInt(parts[1],10)-1].slice(0,3)} ${parseInt(parts[2],10)}`;
        const extra = data.missedPunches.length > 1 ? ` +${data.missedPunches.length - 1}` : '';
        return `${esc(m.empName.split(' ')[0])} ${dlabel}${extra}`;
      })()
    : `last ${data.missedLookbackDays} days · clean`;
  const pendingSub = data.pending.length > 0
    ? (() => {
        const p = data.pending[0];
        return `oldest: ${esc(p.empName.split(' ')[0])} ${p.date.slice(5)}`;
      })()
    : 'queue empty';

  const heroHtml = `
    <div class="telemetry">
      <div class="tel-cell">
        <div class="tel-label">Active</div>
        <div class="tel-value ${counts.clocked_in > 0 ? 'success' : ''}">${counts.clocked_in}</div>
        <div class="tel-sub">of ${totalEmp} team members</div>
      </div>
      <div class="tel-cell">
        <div class="tel-label">On Lunch</div>
        <div class="tel-value">${counts.on_lunch}</div>
        <div class="tel-sub">currently away</div>
      </div>
      <div class="tel-cell">
        <div class="tel-label">Missed · ${data.missedLookbackDays}d</div>
        <div class="tel-value ${missedCount > 0 ? 'crit' : ''}">${missedCount}</div>
        ${renderTelSparkline_(data.missedTrend, missedCount > 0 ? 'crit' : null)}
        <div class="tel-sub">${missedSub}</div>
      </div>
      <div class="tel-cell">
        <div class="tel-label">Pending</div>
        <div class="tel-value ${pendingCount > 0 ? 'warn' : ''}">${pendingCount}</div>
        ${renderTelSparkline_(data.pendingTrend, pendingCount > 0 ? 'warn' : null)}
        <div class="tel-sub">${pendingSub}</div>
      </div>
    </div>`;

  // ── Live status: employee grid cards ────────────────────────────────────
  const liveHtml = data.liveStatus.length === 0
    ? '<div class="no-data">No employees registered</div>'
    : '<div class="emp-grid">' + data.liveStatus.map(e => {
        const meta = MGR_STATUS[e.status] || MGR_STATUS.not_in;   // D3 — see counts above
        const initials = e.name.split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
        let line;
        if (e.lastPunchType) {
          const showMgr = e.lastPunchTimeMgr && e.empTzAbbr !== e.mgrTzAbbr;
          // Paired-timezone chip (V4·E5): local time emphasized, manager time
          // secondary; the second segment is omitted when both tzs match.
          const tzChip = `<span class="tz-chip">`
            + `<span class="seg local"><span class="t">${dispTime(e.lastPunchTime)}</span><span class="z">${esc(e.empTzAbbr)}</span></span>`
            + (showMgr
                ? `<span class="seg"><span class="t">${dispTime(e.lastPunchTimeMgr)}</span><span class="z">${esc(e.mgrTzAbbr)}</span></span>`
                : '')
            + `</span>`;
          line = `${prettyType(e.lastPunchType)} · ${tzChip}`;
        } else {
          line = '<span style="color:var(--muted);font-style:italic">No punches today</span>';
        }
        // V4·E3 — 7-day daily-hours sparkline under the status line.
        const sparkSection = renderEmpSparkline_(e.recentHours);
        // Batch 8: the actions moved OFF the name row. MEASURED at 1440 —
        // the card is 181px, and two 26px buttons plus their gaps left the
        // name 33px for a 75px name ("Av…"). One button had already cost it
        // 69px; a second made it unreadable. Their own row costs ~30px of
        // card height and gives the name the full width back.
        return `<div class="emp-card">
          <div class="emp-card-top">
            <div class="emp-avatar ${meta.avCls}">${esc(initials)}</div>
            <div class="emp-name" title="${esc(e.name)}">${esc(e.name)}</div>
          </div>
          <div class="emp-status-line">${line}</div>
          ${sparkSection}
          <div class="emp-card-actions">
            <button class="de-open-btn" title="Edit day" aria-label="Edit day for ${esc(e.name)}" data-emp-id="${esc(e.id)}" data-emp-name="${esc(e.name)}">${icon('adjust', 13)}</button>
            <button class="de-open-btn ps-open-btn" title="Pay statement" aria-label="Pay statement for ${esc(e.name)}" data-emp-id="${esc(e.id)}" data-emp-name="${esc(e.name)}">${icon('fileText', 13)}</button>
          </div>
        </div>`;
      }).join('') + '</div>';

  // ── Pending time-off (now with balance context) ─────────────────────────
  const pendingHtml = data.pending.length === 0
    ? '<div class="no-data">No pending requests</div>'
    : data.pending.map(p => {
        const parts = p.date.split('-');
        const mo = MONTH_NAMES[parseInt(parts[1],10)-1].slice(0,3).toUpperCase();
        const dy = parseInt(parts[2],10);
        const yr = parts[0];

        // Approval-queue signal chips (V1·E5): surface US holidays, teammates
        // already off the same day, and the projected balance after deduction
        // as discrete chips. Holiday + team conflicts are also echoed (plain
        // text) into the Approve confirm dialog via the data-conflict-hint
        // attribute below so the manager can't dismiss the warning by reflex.
        const holidayRaw = p.holidayName || '';
        const conflictsApproved = p.conflictsOff ? p.conflictsOff.filter(c => c.status === 'approved').length : 0;
        const conflictsPending  = p.conflictsOff ? p.conflictsOff.filter(c => c.status === 'pending').length  : 0;

        const sigChips = [];
        if (holidayRaw) {
          sigChips.push(`<span class="sig hol">${icon('star', 11)}${esc(holidayRaw).toUpperCase()}</span>`);
        }
        if (conflictsApproved + conflictsPending > 0) {
          const teamBits = [];
          if (conflictsApproved > 0) teamBits.push(`${conflictsApproved} off`);
          if (conflictsPending > 0)  teamBits.push(`${conflictsPending} pending`);
          sigChips.push(`<span class="sig team">${icon('info', 11)}${teamBits.join(', ')}</span>`);
        }
        if (data.ptoEnabled && p.currentBalance !== null && p.currentBalance !== undefined) {
          const bucketLabel = p.leaveBucket === 'sick' ? 'Sick' : 'Annual';
          const negCls = p.projectedBalance < 0 ? ' neg' : '';
          sigChips.push(`<span class="sig bal${negCls}">${bucketLabel} ${formatLeaveDays(p.currentBalance)} → ${formatLeaveDays(p.projectedBalance)} d</span>`);
        }
        const signalsHtml = sigChips.length ? `<div class="signals">${sigChips.join('')}</div>` : '';

        const confirmBits = [];
        if (holidayRaw) confirmBits.push(`${holidayRaw} (US holiday)`);
        const otherBits = [];
        if (conflictsApproved > 0) otherBits.push(`${conflictsApproved} approved off`);
        if (conflictsPending > 0)  otherBits.push(`${conflictsPending} pending`);
        if (otherBits.length) confirmBits.push(otherBits.join(', '));
        const conflictForConfirm = confirmBits.join(' · ');

        return `<div class="pending-card">
          <div class="pending-top">
            <input type="checkbox" class="mgr-pending-chk" style="width:auto;margin:0;flex-shrink:0;cursor:pointer"
              data-emp-id="${esc(p.empId)}" data-date="${esc(p.date)}" data-submitted-at="${esc(p.submittedAt)}"
              data-emp-name="${esc(p.empName)}">
            <div class="pending-date-block">
              <div class="pending-date-d">${dy}</div>
              <div class="pending-date-m">${mo}</div>
            </div>
            <div style="flex:1;min-width:0">
              <div class="pending-emp">${esc(p.empName)}</div>
              <div class="pending-meta">${esc(p.type)} · ${yr}</div>
              ${p.notes && p.notes !== 'undefined' ? `<div class="pending-notes">"${esc(p.notes)}"</div>` : ''}
              ${signalsHtml}
            </div>
          </div>
          <div class="pending-actions">
            <button class="pending-btn pb-approve" data-status="Approved"
              data-emp-id="${esc(p.empId)}" data-date="${esc(p.date)}" data-submitted-at="${esc(p.submittedAt)}"
              data-emp-name="${esc(p.empName)}" data-projected-balance="${p.projectedBalance != null ? p.projectedBalance : ''}"
              data-leave-bucket="${esc(p.leaveBucket || '')}" data-conflict-hint="${esc(conflictForConfirm)}">${icon('check', 14)}Approve</button>
            <button class="pending-btn pb-deny" data-status="Denied"
              data-emp-id="${esc(p.empId)}" data-date="${esc(p.date)}" data-submitted-at="${esc(p.submittedAt)}"
              data-emp-name="${esc(p.empName)}">${icon('x', 14)}Deny</button>
          </div>
        </div>`;
      }).join('');

  // ── Missed clock-outs ───────────────────────────────────────────────────
  const missedHtml = data.missedPunches.length === 0
    ? '<div class="no-data">No missed clock-outs</div>'
    : data.missedPunches.map(m => {
        const parts = m.date.split('-');
        const dateLabel = `${MONTH_NAMES[parseInt(parts[1],10)-1].slice(0,3)} ${parseInt(parts[2],10)}, ${parts[0]}`;
        return `<div class="missed-row">
          <div class="missed-icon">${icon('warning', 16)}</div>
          <div class="missed-info">
            <div class="missed-emp">${esc(m.empName)}</div>
            <div class="missed-date">${esc(dateLabel)}</div>
          </div>
        </div>`;
      }).join('');

  // ── Recent punches (NEW Phase 7 — for delete) ───────────────────────────
  const recent = data.recentPunches || [];
  const recentHtml = recent.length === 0
    ? '<div class="no-data">No recent punches</div>'
    : recent.map(p => {
        const dateParts = p.date.split('-');
        const dateShort = `${MONTH_NAMES[parseInt(dateParts[1],10)-1].slice(0,3)} ${parseInt(dateParts[2],10)}`;
        const adjTag = p.isAdjustment ? `<span class="adj-pill">${icon('adjust', 10)} adj</span>` : '';
        const delBtn = p.canDelete
          ? `<button class="rp-del" title="Delete this punch" aria-label="Delete punch"
              data-emp="${esc(p.empId)}" data-date="${esc(p.date)}"
              data-time="${esc(p.time)}" data-type="${esc(p.type)}"
              data-name="${esc(p.empName)}">${icon('trash', 14)}</button>`
          : '<div class="rp-del-spacer"></div>';
        return `<div class="rp-row">
          <div class="rp-info">
            <div class="rp-top">
              <span class="rp-emp">${esc(p.empName)}</span>
              ${adjTag}
            </div>
            <div class="rp-detail">
              ${prettyType(p.type)} · ${dateShort} ${dispTime(p.time)}
              <span class="tz-tag">${esc(p.empTzAbbr)}</span>
            </div>
          </div>
          ${delBtn}
        </div>`;
      }).join('');

  // ── Recent activity (audit log w/ tz-converted + reasons) ───────────────
  const auditHtml = data.recentAudits.length === 0
    ? '<div class="no-data">No recent activity</div>'
    : data.recentAudits.map(a => {
        const tsShort = a.timestampMgr || (a.timestamp ? a.timestamp.substring(5, 16) : '');
        const adj = a.isAdjustment ? `<span class="audit-adj-tag">ADJ ${a.daysBack}d</span>` : '';
        const detail = a.action === 'TimeOffRequest' || a.action === 'TimeOffStatusChange'
          ? `${a.action.replace(/([A-Z])/g, ' $1').trim()} for ${a.punchDate}`
          : a.action === 'PunchDelete'
          ? `Punch deleted: ${a.punchDate} ${dispTime(a.punchTime)}`
          : a.action === 'PunchSelfUndo'
          ? `${a.notes} (${a.punchDate} ${dispTime(a.punchTime)})`
          : a.action === 'PunchEdit' || a.action === 'PunchAdd'
          ? `${a.notes} on ${a.punchDate}`
          : a.action === 'TimeOffCancel'
          ? `Time off cancelled for ${a.punchDate}`
          : `${a.action} ${a.punchDate}${a.punchTime ? ' ' + dispTime(a.punchTime) : ''}`;
        const reasonHtml = a.notes && a.isAdjustment
          ? `<div class="audit-reason">"${esc(a.notes)}"</div>` : '';
        return `<div class="audit-row">
          <div class="audit-ts">${esc(tsShort)}</div>
          <div class="audit-body">
            <span class="audit-emp">${esc(a.empName)}</span>
            <span class="audit-action"> · ${esc(detail)}</span>${adj}
            ${reasonHtml}
          </div>
        </div>`;
      }).join('');

function openExportModal() {

  const todayIso = fmt.format(now);
  const firstOfMonth = todayIso.substring(0, 7) + '-01';

document.getElementById('exp-cancel').addEventListener('click', () =>

document.getElementById('export-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('export-overlay'))
    document.getElementById('export-overlay').classList.remove('open');
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tz = empTz();
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz });
    const now = new Date();
    const todayIso = fmt.format(now);
    const parts = todayIso.split('-');
    const today = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    let start, end;
    const preset = btn.dataset.preset;
    if (preset === 'this-month') {
      start = new Date(today.getFullYear(), today.getMonth(), 1);
      end = today;
    } else if (preset === 'last-month') {
      start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      end = new Date(today.getFullYear(), today.getMonth(), 0);
    } else if (preset === 'last-14') {
      start = new Date(today); start.setDate(today.getDate() - 13);
      end = today;
    } else if (preset === 'last-30') {
      start = new Date(today); start.setDate(today.getDate() - 29);
      end = today;
    }
    document.getElementById('exp-start').value = isoDate(start);
    document.getElementById('exp-end').value   = isoDate(end);
  });
});

document.getElementById('exp-submit').addEventListener('click', () => {

  if (start > end)     { showToast('Start date must be before end date','toast-error'); return; }
