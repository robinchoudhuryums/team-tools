    document.getElementById('day-edit-overlay').classList.remove('open');
    showToast(rangeMode
      ? ('Applied ' + (result.punchesWritten || 0) + ' punch(es) across ' + (result.daysTouched || 0) + ' day(s)')
      : (result.changes > 0 ? result.summary : 'No changes needed'), 'toast-success');
    refreshViewIfCurrent('manage', 'Refreshing…', loadManagerDashboard);
  };
  var onErr = function (err) {
    btn.disabled = false;
    btn.textContent = 'Save Changes';
    showToast((err.message || 'Server error'), 'toast-error');
  };
  if (rangeMode) {
    google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)
      .managerSaveDayRange(_deEmpId, _deDate, toDate, slots, reason);
  } else {
    google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)
      .managerSaveDay(_deEmpId, _deDate, slots, reason);
  }
});

/** 7-bar daily-hours sparkline inside each live-status card (V4·E3).
 *  Bars are flex-sized; hours-mapped heights scale within the row.
 *  Bars colored: zero (dim), short (<6h warn-toned), normal accent.
 *  Returns '' for missing/empty arrays so non-tracking reps don't see
 *  a placeholder. */
function renderEmpSparkline_(recentHours) {
  if (!recentHours || recentHours.length === 0) return '';
  const max = Math.max(8, ...recentHours.map(d => d.hours || 0));
  const totalHrs = recentHours.reduce((s, d) => s + (d.hours || 0), 0);
  const daysWorked = recentHours.filter(d => (d.hours || 0) > 0).length;
  if (totalHrs === 0) return '';
  const bars = recentHours.map(d => {
    const h = d.hours || 0;
    const px = h === 0 ? 0 : Math.max(2, Math.round((h / max) * 18));
    const cls = ['bar'];
    if (h === 0) cls.push('zero');
    else if (h < 6) cls.push('short');
    const dlabel = d.date ? d.date.slice(5) : '';
    return `<div class="${cls.join(' ')}" title="${esc(dlabel + ': ' + (h ? h.toFixed(1) + 'h' : 'off'))}" style="height:${px}px"></div>`;
  }).join('');
  return `<div class="emp-spark-wrap">
    <div class="emp-spark">${bars}</div>
    <span class="emp-spark-total">${formatHoursShort(totalHrs)}·${daysWorked}d</span>
  </div>`;
}

/** 14-bar sparkline for the manager telemetry strip (V4·E2). Tone is
 *  applied to the latest bar so the eye lands on "right now"; empty
 *  trends collapse to nothing rather than render a row of zero-height
 *  placeholders. */
function renderTelSparkline_(trend, tone) {
  if (!trend || trend.length === 0) return '';
  const max = Math.max(1, ...trend.map(d => d.count || 0));
  const bars = trend.map((d, i) => {
    const c = d.count || 0;
    const h = c === 0 ? 0 : Math.max(2, Math.round((c / max) * 18));
    const isLast = i === trend.length - 1;
    const cls = ['bar'];
    if (c === 0) cls.push('zero');
    if (isLast && tone && c > 0) cls.push(tone);
    const title = `${d.date}: ${c}`;
    return `<div class="${cls.join(' ')}" title="${esc(title)}" style="height:${h}px"></div>`;
  }).join('');
  return `<div class="tel-spark">${bars}</div>`;
}

function renderAnalyticsSection(data) {
  const trend = data.punchTrend || [];
  const toSum = data.toSummary || { approved: 0, pending: 0, denied: 0 };
  if (trend.length === 0 && !toSum.approved && !toSum.pending && !toSum.denied) return '';

  const max = Math.max(1, ...trend.map(d => d.count));
  const barW = Math.floor(100 / Math.max(trend.length, 1));
  const bars = trend.map(d => {
    const h = Math.round((d.count / max) * 80);
    const label = d.date.slice(5);
    // D7 (cycle 10): esc() the server-derived label + count (shape-bound
    // today, but the documented rule is every server string routes through
    // esc() — the inconsistency was accidental, not a decision).
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0">
      <div style="font-family:var(--mono);font-size:11px;color:var(--ink);margin-bottom:2px">${esc(String(d.count))}</div>
      <div style="width:70%;height:${h}px;min-height:2px;background:var(--accent);border-radius:3px 3px 0 0"></div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px">${esc(label)}</div>
    </div>`;
  }).join('');

  const toTotal = toSum.approved + toSum.pending + toSum.denied;
  const toParts = [];
  if (toSum.approved) toParts.push(`<span style="color:var(--success-deep)">${toSum.approved} approved</span>`);
  if (toSum.pending)  toParts.push(`<span style="color:var(--warning-deep)">${toSum.pending} pending</span>`);
  if (toSum.denied)   toParts.push(`<span style="color:var(--danger-deep)">${toSum.denied} denied</span>`);

  return `
    <div class="metric-grid" style="grid-template-columns:1fr 1fr;margin-bottom:0">
      <div class="card" style="margin-bottom:16px">
        <h2 class="card-label">Punch Activity · last 7 days</h2>
        <div style="display:flex;align-items:flex-end;gap:2px;height:100px;padding:4px 0">${bars}</div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <h2 class="card-label">Time Off · this month</h2>
        <div style="font-size:28px;font-weight:600;color:var(--ink);margin:12px 0 4px">${toTotal}</div>
        <div style="font-size:12px;color:var(--muted)">requests total</div>
        <div style="font-size:13px;margin-top:8px;display:flex;gap:12px">${toParts.join('')}</div>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
//  COVERAGE PLANNER (#3 — manager forward staffing view, managerOnly tab)
// ════════════════════════════════════════════════════════════════════════════
var COV_STATE = { from: '', to: '' };

function enterCoverageView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  var isoLocal = function (d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  };
  // D5 (cycle 10): re-anchor a still-DEFAULT window after midnight — a
  // long-lived tab (the pinned pop-out pattern) re-entering Coverage kept
  // yesterday-anchored defaults with no signal. `defaultDay` marks the range
  // as default-derived; a user-chosen range (the Load button clears the mark)
  // is never touched. The Clock view reconciles day rollover the same way.
  var covToday = isoDateTz(empTz());
  if (COV_STATE.defaultDay && COV_STATE.defaultDay !== covToday) COV_STATE.from = null;
  if (!COV_STATE.from) {
    // F(L-5): anchor "today" to the roster tz (isoDateTz/empTz — the F6
    // discipline the sibling modals in this file follow), not the browser
    // clock — a manager whose machine tz differs from their roster tz got a
    // default window starting on the wrong server day.
    var todayIso = covToday;
    COV_STATE.defaultDay = todayIso;
    COV_STATE.from = todayIso;
    COV_STATE.to = mgrAddDaysIso_(todayIso, 6);   // F(cycle-8): DST-safe
  }
  area.innerHTML =
    (COMPACT_MODE
      ? ''   /* pop-out: the tool tab bar names the active tab (2026-08-11) */
      : '<div class="view-title-row"><div><h1 class="view-title">Coverage</h1><p>Forward staffing across timezones with PTO overlaid — understaffed manager-tz hours are flagged.</p></div></div>') +
    '<div class="cov-controls" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px">' +
      '<div class="field"><label>From</label><input type="date" id="cov-from" value="' + esc(COV_STATE.from) + '"></div>' +
      '<div class="field"><label>To</label><input type="date" id="cov-to" value="' + esc(COV_STATE.to) + '"></div>' +
      '<button class="refresh-btn" id="cov-load">Load</button>' +
    '</div>' +
    '<div id="cov-body">' + loSweep() + '</div>';
  var loadBtn = document.getElementById('cov-load');
  if (loadBtn) loadBtn.onclick = function () {
    COV_STATE.from = document.getElementById('cov-from').value;
    COV_STATE.to = document.getElementById('cov-to').value;
    COV_STATE.defaultDay = null;   // D5 — user-chosen range sticks across midnight
    covLoad_();
  };
  covLoad_();
}

// Cycle-9 L-31: a view-key guard alone can't stop a SAME-VIEW race — two
// quick Loads with different ranges both pass it, and if response A lands
// after B the heatmap shows range A's data under range B's inputs (the
// INV-146 class). The seq token drops the out-of-order response.
var _covSeq = 0;
function covLoad_() {
  var body = document.getElementById('cov-body'); if (!body) return;
  var requested = currentView;
  var seq = ++_covSeq;
  body.innerHTML = loSweep();
  google.script.run
    .withSuccessHandler(function (data) { if (currentView !== requested || seq !== _covSeq) return; covRender_(data); })
    .withFailureHandler(function (err) {
      if (currentView !== requested || seq !== _covSeq) return;
      // A12/INV-175: `.no-data` is the designed EMPTY card, also used two
      // lines below for "No coverage in range." — a failed RPC must not look
      // like a quiet range with nobody scheduled. No outer esc().
      body.innerHTML = errorStateHtml_((err && err.message) || 'Failed to load coverage');
    })
    .getCoveragePlan(COV_STATE.from, COV_STATE.to);
}

// §5b — one days × hours heatmap (rows = days, cols = working hours 6a–9p) +
// an understaffed risk callout. Per-day rep detail expands on clicking the day.
var COV_HOUR_START = 6, COV_HOUR_END = 21;
function covFmtHr_(h) { var hh = (h % 24); var ap = hh < 12 ? 'a' : 'p'; var h12 = hh % 12 || 12; return h12 + ap; }
function covToggleDay_(id, btn) {
  var el = document.getElementById(id);
  if (!el) return;
  var open = (el.style.display === 'none');
  el.style.display = open ? '' : 'none';
  // A11: mirror the open state onto the trigger. `btn` is optional so an older
  // cached render (or a direct call) still toggles rather than throwing.
  if (btn && btn.setAttribute) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function covRepsHtml_(day) {
  if (!day.reps || !day.reps.length) return '<div style="font-size:12px;color:var(--muted)">No reps scheduled.</div>';
  return '<div class="cov-reps">' + day.reps.map(function (r) {
    var statusCls = (r.status === 'off') ? 'off' : (r.status === 'tentative' ? 'tentative' : 'working');
    // F(cycle-8): a cross-tz shift can START on the previous manager-tz day
    // (IST local Jul-10 → mgr Jul-9 21:30–Jul-10 06:30); without the marker a
    // bare "9:30 PM – 6:30 AM" read as THIS day's evening coverage.
    var prevMark = r.startsPrevDay ? '<span style="color:var(--muted);font-size:10px;"> (from prev. day)</span>' : '';
    var lbl = (r.status === 'off')
      ? ('Off' + (r.ptoType ? (' · ' + esc(r.ptoType)) : ''))
      : (r.status === 'tentative'
          ? ('Tentative' + (r.ptoType ? (' · ' + esc(r.ptoType)) : ''))
          : (esc(r.startMgr) + ' – ' + esc(r.endMgr) + prevMark));
    return '<div class="cov-rep ' + statusCls + '">' +
      '<span class="cov-rep-name">' + esc(r.name) + '</span>' +
      '<span class="cov-rep-tz">' + esc(r.tz) + '</span>' +
      '<span class="cov-rep-status">' + lbl + '</span></div>';
  }).join('') + '</div>';
}

// Reps off/tentative on a day, for the risk callout's "— who" suffix (escaped).
function covOffReps_(day) {
  var names = (day.reps || []).filter(function (r) { return r.status === 'off' || r.status === 'tentative'; })
    .map(function (r) { return esc(r.name) + (r.ptoType ? (' (' + esc(r.ptoType) + ')') : ''); });
  return names.join(', ');
}

// Group consecutive understaffed hours (confirmed < minStaff) within the window
// into ranges, each rendered as one risk line (all dynamic parts esc'd).
function covDayRisks_(day, byHour, hours, minStaff) {
  var out = [], runStart = null, runC = null;
  var who = covOffReps_(day);
  function flush(endH) {
    if (runStart === null) return;
    out.push('<b>' + esc(day.weekday.slice(0, 3)) + ' ' + covFmtHr_(runStart) + '–' + covFmtHr_(endH + 1) + '</b> · ' +
      esc(String(runC)) + ' working, need ' + esc(String(minStaff)) + (who ? (' — ' + who) : ''));   // D7 — full esc() parity with the function's own claim
    runStart = null; runC = null;
  }
  hours.forEach(function (h) {
    var x = byHour[h] || { confirmed: 0 };
    var c = x.confirmed || 0;
    if (c < minStaff) { if (runStart === null) { runStart = h; runC = c; } else { runC = Math.min(runC, c); } }
    else { flush(h - 1); }
  });
  flush(hours[hours.length - 1]);
  return out;
}

function covRender_(data) {
  var body = document.getElementById('cov-body'); if (!body) return;
  if (!data || data.error) { body.innerHTML = errorStateHtml_((data && data.error) || 'No data'); return; }   // A12
  if (!data.days || !data.days.length) { body.innerHTML = '<div class="no-data">No coverage in range.</div>'; return; }   // genuinely empty — stays quiet
  var minStaff = data.minStaff || 2;
  var good = data.goodStaff || minStaff;   // ≥good = green; minStaff..good-1 = amber; <minStaff = red
  // Display + flag only business hours [start, end) (manager tz) — off-hours and
  // weekends are out of scope (we're closed), so they're not shown/flagged.
  var bizStart = (typeof data.businessStartHour === 'number') ? data.businessStartHour : COV_HOUR_START;
  var bizEnd = (typeof data.businessEndHour === 'number') ? data.businessEndHour : (COV_HOUR_END + 1);
  var hours = []; for (var h = bizStart; h < bizEnd; h++) hours.push(h);

  // F4 (cycle 16): the PTO overlay is best-effort server-side. When it fails,
  // ptoMap is empty and EVERY rep counts as working — so this grid renders
  // green on a day half the team is off. Say so loudly: an understaffing
  // planner that silently reports full staffing is worse than one that
  // refuses to answer. role="alert" matches the errorStateHtml_ posture.
  var ptoWarn = data.ptoUnavailable
    ? '<div class="error-state" role="alert" style="margin-bottom:10px">' + icon('warning', 16) +
      ' Time-off data could not be read, so this grid shows every rep as working — ' +
      'approved and pending PTO is NOT reflected. Treat the staffing bands as an upper bound and reload.</div>'
    : '';

  var note = '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">Times in ' + esc(data.managerTz || '') +
    ' · business hours ' + covFmtHr_(bizStart) + '–' + covFmtHr_(bizEnd) +
    '. Shifts use each rep’s roster Schedule override (column O) when set, else their timezone’s default. Hours with fewer than ' + esc(String(minStaff)) + ' working reps are flagged — click a day for the rep breakdown.</div>';
  var accLabel = (minStaff >= good - 1) ? String(minStaff) : (minStaff + '–' + (good - 1));
  var legend = '<div class="cov-legend">' +
    '<span><span class="sw" style="background:var(--accent-soft)"></span>Good (≥' + good + ')</span>' +
    '<span><span class="sw" style="background:var(--warn-soft)"></span>Acceptable (' + accLabel + ')</span>' +
    '<span><span class="sw" style="background:var(--destructive-soft)"></span>Concerning (<' + minStaff + ')</span>' +
    '</div>';

  var cols = 'minmax(110px,auto) repeat(' + hours.length + ',1fr)';
  var grid = '<div class="cov-heat" style="grid-template-columns:' + cols + '"><div></div>';
  hours.forEach(function (hr) { grid += '<div class="ch-hr">' + covFmtHr_(hr) + '</div>'; });

  var risks = [];
  data.days.forEach(function (day, di) {
    var byHour = {};
    (day.hours || []).forEach(function (x) { byHour[x.hour] = x; });
    var detailId = 'cov-d-' + di;
    // A1 + A11: a keyboard-reachable disclosure button. aria-expanded/-controls
    // tell assistive tech whether this day's rep detail is open; covToggleDay_
    // keeps the attribute in step.
    grid += '<button type="button" class="cov-day-lbl' + (day.closed ? ' is-closed' : '') +
      '" aria-expanded="false" aria-controls="' + detailId +
      '" onclick="covToggleDay_(\'' + detailId + '\', this)">' +
      '<span class="chev">' + icon('chevronRight', 12) + '</span>' +
      esc(day.weekday.slice(0, 3)) + ' ' + esc(String(day.date).slice(5)) +
      (day.holidayName ? ' <span class="hol">' + esc(day.holidayName) + '</span>' : '') +
      (day.closed ? ' <span class="cov-closed-tag">closed</span>' : '') + '</button>';
    hours.forEach(function (hr, hi) {
      var x = byHour[hr] || { confirmed: 0, tentative: 0 };
      var c = x.confirmed || 0, t = x.tentative || 0;
      // Closed days are never flagged (we're not open) — render a neutral cell.
      // Three bands on CONFIRMED reps (every shown hour is a business hour, so 0
      // is concerning, not neutral): ≥good green, ≥minStaff amber, else red.
      var cls = day.closed ? 'closed'
        : ((c >= good) ? 'ok' : (c >= minStaff ? 'risk' : 'low'));
      // §5 grid stagger-in — delay by cell position, capped < ~350ms total.
      var d = Math.min((di * hours.length + hi) * 6, 340);
      var title = day.closed ? (covFmtHr_(hr) + ' — closed')
        : (covFmtHr_(hr) + ' — ' + c + ' working' + (t ? (' (+' + t + ' tentative)') : ''));
      grid += '<div class="cov-cell hm ' + cls + '" style="--d:' + d + 'ms" title="' + esc(title) + '">' + (day.closed ? '' : (c || '')) + '</div>';
    });
    grid += '<div class="cov-detail" id="' + detailId + '" style="display:none">' + covRepsHtml_(day) + '</div>';
    if (!day.closed) risks = risks.concat(covDayRisks_(day, byHour, hours, minStaff));
  });
  grid += '</div>';

  var risk = risks.length
    ? '<div class="panel cov-risk" data-tone="destructive"><h2 class="card-label">Understaffed slots</h2>' +
        '<div class="cov-risk-list">' +
        risks.map(function (r) { return '<div class="cov-risk-item">' + r + '</div>'; }).join('') +
        '</div></div>'
    // F4: the all-clear is the one conclusion a missing PTO overlay makes
    // unsafe — with no PTO applied, "no understaffed hours" is guaranteed
    // rather than earned. Downgrade it to a neutral, explicitly-conditional
    // statement instead of a green check.
    : (data.ptoUnavailable
        ? '<div class="panel cov-risk" data-tone="warn"><h2 class="card-label">Coverage</h2>' +
            '<div style="font-size:13px;color:var(--muted)">' + icon('warning', 14) +
            ' No understaffed hours found — but time-off data is missing, so this is not an all-clear.</div></div>'
        : '<div class="panel cov-risk" data-tone="sage"><h2 class="card-label">Coverage</h2>' +
            '<div style="font-size:13px;color:var(--muted)">' + icon('checkCircle', 14) +
            ' All business hours meet the ' + esc(String(minStaff)) + '-rep minimum in this range.</div></div>');

  body.innerHTML = ptoWarn + note + legend + grid + risk;
}

// ════════════════════════════════════════════════════════════════════════════
//  PUNCTUALITY (start-time adherence vs scheduled shift start, managerOnly tab)
// ════════════════════════════════════════════════════════════════════════════
var PUNCT_STATE = { from: '', to: '' };

function enterPunctualityView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  var isoLocal = function (d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  };
  // D5 (cycle 10): re-anchor a still-DEFAULT window after midnight (see
  // enterCoverageView) — user-chosen ranges are never touched.
  var punctToday = isoDateTz(empTz());
  if (PUNCT_STATE.defaultDay && PUNCT_STATE.defaultDay !== punctToday) PUNCT_STATE.from = null;
  if (!PUNCT_STATE.from) {
    // F(L-5): roster-tz "today" (isoDateTz/empTz), not the browser clock.
    var todayIso = punctToday;
    PUNCT_STATE.defaultDay = todayIso;
    PUNCT_STATE.to = todayIso;
    PUNCT_STATE.from = mgrAddDaysIso_(todayIso, -29);   // default last 30 days (F(cycle-8): DST-safe)
  }
  area.innerHTML =
    (COMPACT_MODE
      ? ''   /* pop-out: the tool tab bar names the active tab (2026-08-11) */
      : '<div class="view-title-row"><div><h1 class="view-title">Punctuality</h1><p>Start-time adherence vs each rep’s scheduled shift start (per-timezone). On-time = clock-in within the grace window.</p></div></div>') +
    '<div class="cov-controls" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px">' +
      '<div class="field"><label>From</label><input type="date" id="punct-from" value="' + esc(PUNCT_STATE.from) + '"></div>' +
      '<div class="field"><label>To</label><input type="date" id="punct-to" value="' + esc(PUNCT_STATE.to) + '"></div>' +
      '<button class="refresh-btn" id="punct-load">Load</button>' +
      '<div class="punct-presets">' +
        '<button type="button" class="punct-preset" data-punct-days="7">7D</button>' +
        '<button type="button" class="punct-preset" data-punct-days="30">30D</button>' +
        '<button type="button" class="punct-preset" data-punct-days="90">QTR</button>' +
      '</div>' +
    '</div>' +
    '<div id="punct-body">' + loSweep() + '</div>';
  var b = document.getElementById('punct-load');
  if (b) b.onclick = function () {
    PUNCT_STATE.from = document.getElementById('punct-from').value;
    PUNCT_STATE.to = document.getElementById('punct-to').value;
    PUNCT_STATE.defaultDay = null;   // D5 — user-chosen range sticks across midnight
    punctLoad_();
  };
  area.querySelectorAll('.punct-preset').forEach(function (el) {
    el.onclick = function () { punctPreset_(parseInt(el.getAttribute('data-punct-days'), 10)); };
  });
  punctLoad_();
}

function punctPreset_(days) {
  var iso = function (d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  };
  // F(L-5): roster-tz "today" (isoDateTz/empTz), not the browser clock.
  var todayIso = isoDateTz(empTz());
  PUNCT_STATE.to = todayIso;
  PUNCT_STATE.from = mgrAddDaysIso_(todayIso, -(days - 1));   // F(cycle-8): DST-safe
  PUNCT_STATE.defaultDay = null;   // D5 — a preset is a user choice; sticks across midnight
  var f = document.getElementById('punct-from'), t = document.getElementById('punct-to');
  if (f) f.value = PUNCT_STATE.from;
  if (t) t.value = PUNCT_STATE.to;
  punctLoad_();
}

function punctFmtMin_(m) {
  var hh = Math.floor(m / 60), mm = m % 60, ap = hh < 12 ? 'AM' : 'PM', h12 = hh % 12 || 12;
  return h12 + ':' + ('0' + mm).slice(-2) + ' ' + ap;
}

var _punctSeq = 0;   // cycle-9 L-31 — same-view range race (see covLoad_)
function punctLoad_() {
  var body = document.getElementById('punct-body'); if (!body) return;
  var requested = currentView;
  var seq = ++_punctSeq;
  body.innerHTML = loSweep();
  google.script.run
    .withSuccessHandler(function (data) { if (currentView !== requested || seq !== _punctSeq) return; punctRender_(data); })
    .withFailureHandler(function (err) {
      if (currentView !== requested || seq !== _punctSeq) return;
      body.innerHTML = errorStateHtml_((err && err.message) || 'Failed to load punctuality');   // A12
    })
    .getPunctualityReport(PUNCT_STATE.from, PUNCT_STATE.to);
}

function punctRender_(data) {
  var body = document.getElementById('punct-body'); if (!body) return;
  if (!data || data.error) { body.innerHTML = errorStateHtml_((data && data.error) || 'No data'); return; }   // A12
  var reps = data.reps || [];
  if (!reps.length) { body.innerHTML = '<div class="no-data">No clock-ins in this range.</div>'; return; }   // genuinely empty — stays quiet
  var totDays = 0, totOn = 0, totLateDays = 0, totLateMin = 0, worstAll = 0;
  reps.forEach(function (r) {
    totDays += r.days; totOn += r.onTime;
    if (r.late) { totLateDays += r.late; totLateMin += r.avgLate * r.late; }
    if (r.worst > worstAll) worstAll = r.worst;
  });
  var teamPct = totDays ? Math.round((totOn / totDays) * 100) : 0;
  var teamAvgLate = totLateDays ? Math.round(totLateMin / totLateDays) : 0;
  var toneCol = function (p) { return p >= 90 ? 'var(--success-deep)' : (p >= 75 ? 'var(--warning-deep)' : 'var(--danger-deep)'); };
  var teamCls = teamPct >= 90 ? 'success' : (teamPct >= 75 ? 'warn' : 'crit');
  var lateCls = teamAvgLate <= 5 ? 'success' : (teamAvgLate <= 15 ? 'warn' : 'crit');
  var note = '<div style="font-size:12px;color:var(--muted);margin-bottom:14px">On-time = clock-in within ' + esc(String(data.grace)) +
    ' min of the scheduled start. Only days with a clock-in are counted. Least punctual first.</div>';
  var summary = '<div class="telemetry" style="max-width:760px;margin-bottom:16px">' +
    '<div class="tel-cell"><div class="tel-label">Team on-time</div><div class="tel-value ' + teamCls + '">' + teamPct + '%</div><div class="tel-sub">' + totOn + ' / ' + totDays + ' days</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Reps</div><div class="tel-value">' + reps.length + '</div><div class="tel-sub">with clock-ins</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Avg late</div><div class="tel-value ' + (totLateDays ? lateCls : '') + '">' + (totLateDays ? teamAvgLate + 'm' : '0m') + '</div><div class="tel-sub">on late days</div></div>' +
    '<div class="tel-cell"><div class="tel-label">Worst</div><div class="tel-value ' + (worstAll > 15 ? 'crit' : '') + '">' + (worstAll ? worstAll + 'm' : '—') + '</div><div class="tel-sub">single day</div></div>' +
    '</div>';
  var rowsHtml = reps.map(function (r) {
    return '<tr>' +
      '<td>' + esc(r.name) + '</td>' +
      '<td class="num">' + esc(punctFmtMin_(r.startMin)) + '</td>' +
      '<td class="num">' + r.days + '</td>' +
      '<td class="num"><span style="color:' + toneCol(r.onTimePct) + ';font-weight:700">' + r.onTimePct + '%</span>' +
        '<div class="punct-bar"><i style="width:' + r.onTimePct + '%;background:' + toneCol(r.onTimePct) + '"></i></div></td>' +
      '<td class="num">' + (r.late ? r.avgLate + 'm' : '—') + '</td>' +
      '<td class="num">' + (r.worst ? r.worst + 'm' : '—') + '</td>' +
      '<td class="num">' + (r.lunchOnTimePct == null ? '—' : r.lunchOnTimePct + '%') + '</td>' +
    '</tr>';
  }).join('');
  body.innerHTML = summary + note +
    '<div class="punct-card"><div class="punct-card-h">Per-rep punctuality</div>' +
    '<div style="overflow-x:auto"><table class="punct-table"><thead><tr>' +
      '<th>Rep</th><th class="num">Shift start</th><th class="num">Days</th><th class="num">On-time</th>' +
      '<th class="num">Avg late</th><th class="num">Worst</th><th class="num">Lunch on-time</th>' +
    '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div></div>';
}
</script>
