<script>
// ════════════════════════════════════════════════════════════════════════════
//  MANAGER VIEW
// ════════════════════════════════════════════════════════════════════════════

function loadManagerDashboard() {
  google.script.run
    .withSuccessHandler(data => {
      if (data.error) { showToast(data.error, 'toast-error'); return; }
      mgrData = data;
      const area = document.getElementById('view-area');
      if (area && currentView === 'manage') { renderManagerView(area, data); loadPtoReconciliation_(); loadPendingAdjustments_(); }
    })
    .withFailureHandler(err => showToast((err.message||'Load failed'),'toast-error'))
    .getManagerDashboard();
}

// ── PTO balance reconciliation (Plan B1) ─────────────────────────────────
// Lazy, best-effort: fills #mgr-pto-recon only when getPtoReconciliation finds
// drift (reps double-deducted from duplicate same-date approvals — the H1 bug
// class). Renders nothing when clean, so the card is invisible in the common case.
function loadPtoReconciliation_() {
  const slot = document.getElementById('mgr-pto-recon');
  if (!slot) return;
  google.script.run
    .withSuccessHandler(function (res) {
      const s = document.getElementById('mgr-pto-recon');
      if (!s || currentView !== 'manage') return;
      if (!res || res.error || !res.reps || res.reps.length === 0) { s.innerHTML = ''; return; }
      s.innerHTML = renderPtoReconCard_(res);
    })
    .withFailureHandler(function () { /* best-effort — stay silent on failure */ })
    .getPtoReconciliation();
}

function renderPtoReconCard_(res) {
  const rows = res.reps.map(function (r) {
    const over = [];
    if (r.overAnnual > 0) over.push(r.overAnnual + ' annual');
    if (r.overSick > 0)   over.push(r.overSick + ' sick');
    const dates = r.dates.map(function (d) {
      return esc(d.date) + ' (' + d.approvedCount + '×)';
    }).join(', ');
    return '<div style="padding:8px 0;border-bottom:1px dashed var(--line)">' +
      '<div style="display:flex;align-items:flex-start;gap:10px">' +
        '<div style="flex:1">' +
          '<div style="font-weight:600;font-size:13px;color:var(--ink)">' + esc(r.name) +
            ' <span style="color:var(--danger-deep)">— over-charged ' + esc(over.join(' + ')) + ' day(s)</span></div>' +
          '<div style="font-size:12px;color:var(--muted);margin-top:2px">Duplicate approved dates: ' + dates + '</div>' +
          '<div style="font-size:11px;color:var(--muted);margin-top:2px">Current balance: ' +
            esc(String(r.storedAnnual)) + ' annual / ' + esc(String(r.storedSick)) + ' sick</div>' +
        '</div>' +
        '<button class="pending-btn pb-approve" style="flex:0 0 auto" ' +
          'data-emp-id="' + esc(r.empId) + '" data-emp-name="' + esc(r.name) + '" ' +
          'onclick="fixPtoReconRep_(this)">' + icon('check', 14) + 'Credit &amp; reconcile</button>' +
      '</div>' +
    '</div>';
  }).join('');
  return '<div class="card" style="border-color:var(--danger)">' +
    '<div class="card-label with-count"><span>PTO Balance Drift</span>' +
      '<span class="count-pill danger">' + res.reps.length + '</span></div>' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">These reps have more than one <em>approved</em> time-off row on the same date and were likely double-deducted (the H1 bug, now prevented for new requests). “Credit &amp; reconcile” credits the over-charge back and marks the duplicate rows reconciled (idempotent); or correct manually via Adjust.</div>' +
    rows +
  '</div>';
}

/** Credit the over-charge back to the rep and neutralize the duplicate rows
 *  (server-side fixPtoReconciliation). Confirms first (it adjusts a balance). */
function fixPtoReconRep_(btn) {
  const empId = btn.getAttribute('data-emp-id');
  const name = btn.getAttribute('data-emp-name') || 'this rep';
  uiConfirm({
    title: 'Reconcile PTO balance',
    message: 'Credit the over-charged day(s) back to ' + name + ' and mark the duplicate approved rows as reconciled? This adjusts their balance and writes an audit entry.',
    tone: 'danger', confirmLabel: 'Credit & reconcile',
  }).then(function (ok) {
    if (!ok) return;
    btn.disabled = true; btn.textContent = 'Reconciling…';
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          showToast((res && res.error) || 'Reconcile failed', 'toast-error');
          btn.disabled = false; return;
        }
        showToast(res.fixed
          ? ('Credited ' + (res.creditedAnnual || 0) + ' annual / ' + (res.creditedSick || 0) + ' sick back')
          : 'Nothing to reconcile', 'toast-success');
        loadPtoReconciliation_();   // refresh — the rep should drop off when clean
      })
      .withFailureHandler(function (err) {
        showToast((err && err.message) || 'Reconcile failed', 'toast-error');
        btn.disabled = false;
      })
      .fixPtoReconciliation(empId);
  });
}

// ── Pending punch-adjustment requests (#4a) ─────────────────────────────
// Lazy, best-effort: fills #mgr-adjust-queue only when there are pending
// employee adjustment requests. Approve → server writes the ADJ- punch for the
// target rep; Deny → marks denied. Mirrors the PTO-recon lazy card.
function loadPendingAdjustments_() {
  const slot = document.getElementById('mgr-adjust-queue');
  if (!slot) return;
  google.script.run
    .withSuccessHandler(function (res) {
      const s = document.getElementById('mgr-adjust-queue');
      if (!s || currentView !== 'manage') return;
      if (!res || res.error || !res.requests || res.requests.length === 0) { s.innerHTML = ''; return; }
      s.innerHTML = renderAdjustQueueCard_(res.requests);
    })
    .withFailureHandler(function () { /* best-effort */ })
    .managerGetPendingAdjustments();
}

function renderAdjustQueueCard_(requests) {
  const rows = requests.map(function (r) {
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)">' +
      '<div style="flex:1">' +
        '<div style="font-weight:600;font-size:13px;color:var(--ink)">' + esc(r.empName) +
          ' <span style="color:var(--muted);font-weight:400">— ' + esc(r.punchType) + ' · ' + esc(r.date) + ' · ' + esc(r.time) + '</span></div>' +
        (r.reason ? '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(r.reason) + '</div>' : '') +
      '</div>' +
      '<button class="pending-btn pb-approve" data-req-id="' + esc(r.reqId) + '" data-act="Approved" onclick="adjDecide_(this)">' + icon('check', 14) + 'Approve</button>' +
      '<button class="pending-btn pb-deny" data-req-id="' + esc(r.reqId) + '" data-act="Denied" onclick="adjDecide_(this)">' + icon('x', 14) + 'Deny</button>' +
    '</div>';
  }).join('');
  return '<div class="card">' +
    '<div class="card-label with-count"><span>Pending Punch Adjustments</span>' +
      '<span class="count-pill warn">' + requests.length + '</span></div>' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">Employee-requested punch corrections. Approve writes the adjustment to the timesheet; deny discards it.</div>' +
    rows +
  '</div>';
}

function adjDecide_(btn) {
  const reqId = btn.getAttribute('data-req-id');
  const action = btn.getAttribute('data-act');
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { showToast((res && res.error) || 'Action failed', 'toast-error'); btn.disabled = false; return; }
      showToast(action === 'Approved' ? 'Adjustment approved' : 'Request denied', 'toast-success');
      loadPendingAdjustments_();
    })
    .withFailureHandler(function (err) { showToast((err && err.message) || 'Action failed', 'toast-error'); btn.disabled = false; })
    .updatePunchAdjustStatus(reqId, action);
}

function renderManagerView(area, data) {
  const counts = { clocked_in: 0, on_lunch: 0, clocked_out: 0, not_in: 0 };
  data.liveStatus.forEach(e => { counts[e.status]++; });
  const totalEmp = data.liveStatus.length;
  const mgrTzAbbr = data.mgrTzAbbr || '';
  const pendingCount = data.pending.length;
  const missedCount = data.missedPunches.length;

  // ── Hero telemetry strip (V4·E2) ────────────────────────────────────────
  // 4-cell horizontal strip with mono-tabular values. Missed + Pending carry
  // 14-day sparklines (data.missedTrend / data.pendingTrend); Active + On
  // Lunch are static counts per the C6 decision. The sub-line surfaces the
  // most actionable specific (first missed rep + day, oldest pending rep).
  const missedSub = data.missedPunches.length > 0
    ? (() => {
        const m = data.missedPunches[0];
        const parts = m.date.split('-');
        const dlabel = `${MONTH_NAMES[parseInt(parts[1],10)-1].slice(0,3)} ${parseInt(parts[2],10)}`;
        const extra = data.missedPunches.length > 1 ? ` +${data.missedPunches.length - 1}` : '';
        return `${esc(m.empName.split(' ')[0])} ${dlabel}${extra}`;
      })()
    : `last ${data.missedLookbackDays} days · clean`;
  const pendingSub = data.pending.length > 0
    ? (() => {
        const p = data.pending[0];
        return `oldest: ${esc(p.empName.split(' ')[0])} ${p.date.slice(5)}`;
      })()
    : 'queue empty';

  const heroHtml = `
    <div class="telemetry">
      <div class="tel-cell">
        <div class="tel-label">Active</div>
        <div class="tel-value ${counts.clocked_in > 0 ? 'success' : ''}">${counts.clocked_in}</div>
        <div class="tel-sub">of ${totalEmp} team members</div>
      </div>
      <div class="tel-cell">
        <div class="tel-label">On Lunch</div>
        <div class="tel-value">${counts.on_lunch}</div>
        <div class="tel-sub">currently away</div>
      </div>
      <div class="tel-cell">
        <div class="tel-label">Missed · ${data.missedLookbackDays}d</div>
        <div class="tel-value ${missedCount > 0 ? 'crit' : ''}">${missedCount}</div>
        ${renderTelSparkline_(data.missedTrend, missedCount > 0 ? 'crit' : null)}
        <div class="tel-sub">${missedSub}</div>
      </div>
      <div class="tel-cell">
        <div class="tel-label">Pending</div>
        <div class="tel-value ${pendingCount > 0 ? 'warn' : ''}">${pendingCount}</div>
        ${renderTelSparkline_(data.pendingTrend, pendingCount > 0 ? 'warn' : null)}
        <div class="tel-sub">${pendingSub}</div>
      </div>
    </div>`;

  // ── Live status: employee grid cards ────────────────────────────────────
  const liveHtml = data.liveStatus.length === 0
    ? '<div class="no-data">No employees registered</div>'
    : '<div class="emp-grid">' + data.liveStatus.map(e => {
        const meta = MGR_STATUS[e.status];
        const initials = e.name.split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
        let line;
        if (e.lastPunchType) {
          const showMgr = e.lastPunchTimeMgr && e.empTzAbbr !== e.mgrTzAbbr;
          // Paired-timezone chip (V4·E5): local time emphasized, manager time
          // secondary; the second segment is omitted when both tzs match.
          const tzChip = `<span class="tz-chip">`
            + `<span class="seg local"><span class="t">${dispTime(e.lastPunchTime)}</span><span class="z">${esc(e.empTzAbbr)}</span></span>`
            + (showMgr
                ? `<span class="seg"><span class="t">${dispTime(e.lastPunchTimeMgr)}</span><span class="z">${esc(e.mgrTzAbbr)}</span></span>`
                : '')
            + `</span>`;
          line = `${prettyType(e.lastPunchType)} · ${tzChip}`;
        } else {
          line = '<span style="color:var(--muted);font-style:italic">No punches today</span>';
        }
        // V4·E3 — 7-day daily-hours sparkline under the status line.
        const sparkSection = renderEmpSparkline_(e.recentHours);
        return `<div class="emp-card">
          <div class="emp-card-top">
            <div class="emp-avatar ${meta.avCls}">${esc(initials)}</div>
            <div class="emp-name">${esc(e.name)}</div>
            <button class="de-open-btn" title="Edit day" data-emp-id="${esc(e.id)}" data-emp-name="${esc(e.name)}">${icon('adjust', 13)}</button>
          </div>
          <div class="emp-status-line">${line}</div>
          ${sparkSection}
        </div>`;
      }).join('') + '</div>';

  // ── Pending time-off (now with balance context) ─────────────────────────
  const pendingHtml = data.pending.length === 0
    ? '<div class="no-data">No pending requests</div>'
    : data.pending.map(p => {
        const parts = p.date.split('-');
        const mo = MONTH_NAMES[parseInt(parts[1],10)-1].slice(0,3).toUpperCase();
        const dy = parseInt(parts[2],10);
        const yr = parts[0];

        // Approval-queue signal chips (V1·E5): surface US holidays, teammates
        // already off the same day, and the projected balance after deduction
        // as discrete chips. Holiday + team conflicts are also echoed (plain
        // text) into the Approve confirm dialog via the data-conflict-hint
        // attribute below so the manager can't dismiss the warning by reflex.
        const holidayRaw = p.holidayName || '';
        const conflictsApproved = p.conflictsOff ? p.conflictsOff.filter(c => c.status === 'approved').length : 0;
        const conflictsPending  = p.conflictsOff ? p.conflictsOff.filter(c => c.status === 'pending').length  : 0;

        const sigChips = [];
        if (holidayRaw) {
          sigChips.push(`<span class="sig hol">${icon('star', 11)}${esc(holidayRaw).toUpperCase()}</span>`);
        }
        if (conflictsApproved + conflictsPending > 0) {
          const teamBits = [];
          if (conflictsApproved > 0) teamBits.push(`${conflictsApproved} off`);
          if (conflictsPending > 0)  teamBits.push(`${conflictsPending} pending`);
          sigChips.push(`<span class="sig team">${icon('info', 11)}${teamBits.join(', ')}</span>`);
        }
        if (data.ptoEnabled && p.currentBalance !== null && p.currentBalance !== undefined) {
          const bucketLabel = p.leaveBucket === 'sick' ? 'Sick' : 'Annual';
          const negCls = p.projectedBalance < 0 ? ' neg' : '';
          sigChips.push(`<span class="sig bal${negCls}">${bucketLabel} ${formatLeaveDays(p.currentBalance)} → ${formatLeaveDays(p.projectedBalance)} d</span>`);
        }
        const signalsHtml = sigChips.length ? `<div class="signals">${sigChips.join('')}</div>` : '';

        const confirmBits = [];
        if (holidayRaw) confirmBits.push(`${holidayRaw} (US holiday)`);
        const otherBits = [];
        if (conflictsApproved > 0) otherBits.push(`${conflictsApproved} approved off`);
        if (conflictsPending > 0)  otherBits.push(`${conflictsPending} pending`);
        if (otherBits.length) confirmBits.push(otherBits.join(', '));
        const conflictForConfirm = confirmBits.join(' · ');

        return `<div class="pending-card">
          <div class="pending-top">
            <input type="checkbox" class="mgr-pending-chk" style="width:auto;margin:0;flex-shrink:0;cursor:pointer"
              data-emp-id="${esc(p.empId)}" data-date="${esc(p.date)}" data-submitted-at="${esc(p.submittedAt)}"
              data-emp-name="${esc(p.empName)}">
            <div class="pending-date-block">
              <div class="pending-date-d">${dy}</div>
              <div class="pending-date-m">${mo}</div>
            </div>
            <div style="flex:1;min-width:0">
              <div class="pending-emp">${esc(p.empName)}</div>
              <div class="pending-meta">${esc(p.type)} · ${yr}</div>
              ${p.notes && p.notes !== 'undefined' ? `<div class="pending-notes">"${esc(p.notes)}"</div>` : ''}
              ${signalsHtml}
            </div>
          </div>
          <div class="pending-actions">
            <button class="pending-btn pb-approve" data-status="Approved"
              data-emp-id="${esc(p.empId)}" data-date="${esc(p.date)}" data-submitted-at="${esc(p.submittedAt)}"
              data-emp-name="${esc(p.empName)}" data-projected-balance="${p.projectedBalance != null ? p.projectedBalance : ''}"
              data-leave-bucket="${esc(p.leaveBucket || '')}" data-conflict-hint="${esc(conflictForConfirm)}">${icon('check', 14)}Approve</button>
            <button class="pending-btn pb-deny" data-status="Denied"
              data-emp-id="${esc(p.empId)}" data-date="${esc(p.date)}" data-submitted-at="${esc(p.submittedAt)}"
              data-emp-name="${esc(p.empName)}">${icon('x', 14)}Deny</button>
          </div>
        </div>`;
      }).join('');

  // ── Missed clock-outs ───────────────────────────────────────────────────
  const missedHtml = data.missedPunches.length === 0
    ? '<div class="no-data">No missed clock-outs</div>'
    : data.missedPunches.map(m => {
        const parts = m.date.split('-');
        const dateLabel = `${MONTH_NAMES[parseInt(parts[1],10)-1].slice(0,3)} ${parseInt(parts[2],10)}, ${parts[0]}`;
        return `<div class="missed-row">
          <div class="missed-icon">${icon('warning', 16)}</div>
          <div class="missed-info">
            <div class="missed-emp">${esc(m.empName)}</div>
            <div class="missed-date">${esc(dateLabel)}</div>
          </div>
        </div>`;
      }).join('');

  // ── Recent punches (NEW Phase 7 — for delete) ───────────────────────────
  const recent = data.recentPunches || [];
  const recentHtml = recent.length === 0
    ? '<div class="no-data">No recent punches</div>'
    : recent.map(p => {
        const dateParts = p.date.split('-');
        const dateShort = `${MONTH_NAMES[parseInt(dateParts[1],10)-1].slice(0,3)} ${parseInt(dateParts[2],10)}`;
        const adjTag = p.isAdjustment ? `<span class="adj-pill">${icon('adjust', 10)} adj</span>` : '';
        const delBtn = p.canDelete
          ? `<button class="rp-del" title="Delete this punch" aria-label="Delete punch"
              data-emp="${esc(p.empId)}" data-date="${esc(p.date)}"
              data-time="${esc(p.time)}" data-type="${esc(p.type)}"
              data-name="${esc(p.empName)}">${icon('trash', 14)}</button>`
          : '<div class="rp-del-spacer"></div>';
        return `<div class="rp-row">
          <div class="rp-info">
            <div class="rp-top">
              <span class="rp-emp">${esc(p.empName)}</span>
              ${adjTag}
            </div>
            <div class="rp-detail">
              ${prettyType(p.type)} · ${dateShort} ${dispTime(p.time)}
              <span class="tz-tag">${esc(p.empTzAbbr)}</span>
            </div>
          </div>
          ${delBtn}
        </div>`;
      }).join('');

  // ── Recent activity (audit log w/ tz-converted + reasons) ───────────────
  const auditHtml = data.recentAudits.length === 0
    ? '<div class="no-data">No recent activity</div>'
    : data.recentAudits.map(a => {
        const tsShort = a.timestampMgr || (a.timestamp ? a.timestamp.substring(5, 16) : '');
        const adj = a.isAdjustment ? `<span class="audit-adj-tag">ADJ ${a.daysBack}d</span>` : '';
        const detail = a.action === 'TimeOffRequest' || a.action === 'TimeOffStatusChange'
          ? `${a.action.replace(/([A-Z])/g, ' $1').trim()} for ${a.punchDate}`
          : a.action === 'PunchDelete'
          ? `Punch deleted: ${a.punchDate} ${dispTime(a.punchTime)}`
          : a.action === 'PunchSelfUndo'
          ? `${a.notes} (${a.punchDate} ${dispTime(a.punchTime)})`
          : a.action === 'PunchEdit' || a.action === 'PunchAdd'
          ? `${a.notes} on ${a.punchDate}`
          : a.action === 'TimeOffCancel'
          ? `Time off cancelled for ${a.punchDate}`
          : `${a.action} ${a.punchDate}${a.punchTime ? ' ' + dispTime(a.punchTime) : ''}`;
        const reasonHtml = a.notes && a.isAdjustment
          ? `<div class="audit-reason">"${esc(a.notes)}"</div>` : '';
        return `<div class="audit-row">
          <div class="audit-ts">${esc(tsShort)}</div>
          <div class="audit-body">
            <span class="audit-emp">${esc(a.empName)}</span>
            <span class="audit-action"> · ${esc(detail)}</span>${adj}
            ${reasonHtml}
          </div>
        </div>`;
      }).join('');

  const auditFootnote = mgrTzAbbr
    ? `<div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:10px;text-align:right;letter-spacing:.08em;text-transform:uppercase">Times shown in ${esc(mgrTzAbbr)}</div>`
    : '';

  area.innerHTML = `
    ${COMPACT_MODE
      ? `<div class="compact-header"><div class="ch-title">${icon('manage', 16)} Manager</div><div class="ch-actions"><button class="refresh-btn" id="mgr-refresh">${icon('refresh', 14)}</button><button class="ch-action-btn" title="Close window" onclick="window.close()">${icon('x', 14)}</button></div></div>`
      : `<div class="app-bar"><div class="app-bar-left"><div class="breadcrumb"><span>Time Clock</span><span class="crumb-sep">›</span><span class="crumb-current">Manager Dashboard</span></div><h1 class="display-title">Manager Dashboard</h1></div><div class="app-bar-right"><button class="refresh-btn" id="mgr-refresh">${icon('refresh', 14)}Refresh</button></div></div>`}

    ${heroHtml}
    ${renderAnalyticsSection(data)}
    <div id="mgr-pto-recon"></div>
    <div id="mgr-adjust-queue"></div>

    <div class="card">
      <div class="card-label with-count">
        <span>Live Status</span>
        <span class="count-pill">${counts.clocked_in}/${totalEmp} in</span>
      </div>
      ${liveHtml}
    </div>

    <div class="card">
      <div class="card-label with-count">
        <span>Pending Time Off</span>
        <span style="display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0">
          ${data.pending.length > 0 ? `<span class="count-pill ${data.pending.length>0?'warn':''}">${data.pending.length}</span>` : ''}
          <button class="refresh-btn" id="mgr-add-timeoff">${icon('plus', 12)}Add Time Off</button>
        </span>
      </div>
      ${data.pending.length > 1 ? `<div id="mgr-bulk-bar" style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2)">
        <label style="display:flex;align-items:center;gap:6px;margin:0;font-size:12px;font-family:var(--ui);text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);cursor:pointer">
          <input type="checkbox" id="mgr-select-all" style="width:auto;margin:0"> Select all
        </label>
        <span style="flex:1"></span>
        <button class="pending-btn pb-approve" id="mgr-bulk-approve" disabled>${icon('check', 14)}Approve Selected</button>
        <button class="pending-btn pb-deny" id="mgr-bulk-deny" disabled>${icon('x', 14)}Deny Selected</button>
      </div>` : ''}
      ${pendingHtml}
    </div>

    <div class="card">
      <div class="card-label with-count">
        <span>Missed Clock-Outs · last ${data.missedLookbackDays}d</span>
        ${data.missedPunches.length > 0 ? `<span class="count-pill danger">${data.missedPunches.length}</span>` : ''}
      </div>
      ${missedHtml}
    </div>

    <div class="card">
      <div class="card-label">Export ADP Upload</div>
      <button class="export-btn-large" id="mgr-export">${icon('download', 16)}Generate ADP Export</button>
    </div>

    <div class="card">
      <div class="card-label with-count">
        <span>Recent Punches · within ${data.mgrDeleteWindowDays}d to delete</span>
        ${recent.length > 0 ? `<span class="count-pill">${recent.length}</span>` : ''}
      </div>
      ${recentHtml}
    </div>

    <div class="card">
      <div class="card-label">Recent Activity</div>
      ${auditHtml}
      ${auditFootnote}
    </div>`;

  document.getElementById('mgr-refresh').addEventListener('click', () => {
    renderLoading(area, 'Refreshing…');
    loadManagerDashboard();
  });
  document.getElementById('mgr-export').addEventListener('click', openExportModal);
  document.getElementById('mgr-add-timeoff').addEventListener('click', () => openMgrTimeOffModal(data));

  // Approve / Deny buttons
  document.querySelectorAll('.pending-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset;
      const newStatus = d.status;
      const verb = newStatus === 'Approved' ? 'Approve' : 'Deny';
      let msg = `${verb} time off request from ${d.empName}?`;
      if (newStatus === 'Approved' && d.projectedBalance !== '' && parseFloat(d.projectedBalance) < 0) {
        const bucket = d.leaveBucket === 'sick' ? 'sick' : 'annual';
        msg += `\n\n⚠ This will take their ${bucket} leave balance to ${d.projectedBalance} day(s) (negative).`;
      }
      if (newStatus === 'Approved' && d.conflictHint) {
        msg += `\n\n⚠ Heads up: ${d.conflictHint}.`;
      }
      uiConfirm({
        title: verb + ' time off',
        message: msg,
        confirmLabel: verb,
        tone: newStatus === 'Denied' ? 'danger' : undefined,
      }).then(ok => {
        if (!ok) return;
        handleApprovalAction(d.empId, d.date, d.submittedAt, newStatus, btn);
      });
    });
  });

  // Bulk approve/deny wiring
  const selectAll = document.getElementById('mgr-select-all');
  const bulkApprove = document.getElementById('mgr-bulk-approve');
  const bulkDeny = document.getElementById('mgr-bulk-deny');
  function updateBulkBar() {
    const checked = document.querySelectorAll('.mgr-pending-chk:checked');
    if (bulkApprove) bulkApprove.disabled = checked.length === 0;
    if (bulkDeny)    bulkDeny.disabled = checked.length === 0;
  }
  if (selectAll) {
    selectAll.addEventListener('change', () => {
      document.querySelectorAll('.mgr-pending-chk').forEach(c => { c.checked = selectAll.checked; });
      updateBulkBar();
    });
  }
  document.querySelectorAll('.mgr-pending-chk').forEach(c => {
    c.addEventListener('change', updateBulkBar);
  });
  function handleBulkAction(status) {
    const checked = Array.from(document.querySelectorAll('.mgr-pending-chk:checked'));
    if (checked.length === 0) return;
    const names = checked.map(c => c.dataset.empName).join(', ');
    const verb = status === 'Approved' ? 'Approve' : 'Deny';
    uiConfirm({
      title: 'Bulk ' + verb.toLowerCase(),
      message: `${verb} ${checked.length} request(s) for: ${names}?`,
      confirmLabel: verb + ' all',
      tone: status === 'Denied' ? 'danger' : undefined,
    }).then(ok => {
      if (!ok) return;
      handleBulkActionConfirmed_(status, checked);
    });
  }
  function handleBulkActionConfirmed_(status, checked) {
    if (bulkApprove) bulkApprove.disabled = true;
    if (bulkDeny) bulkDeny.disabled = true;
    let done = 0, errors = 0;
    checked.forEach(c => {
      google.script.run
        .withSuccessHandler(res => {
          done++;
          if (!res.success) errors++;
          if (done === checked.length) {
            if (errors > 0) showToast(`${done - errors} succeeded, ${errors} failed`, 'toast-warn');
            else showToast(`${done} ${status.toLowerCase()}`, 'toast-success');
            renderLoading(document.getElementById('view-area'), 'Refreshing…');
            loadManagerDashboard();
          }
        })
        .withFailureHandler(() => {
          done++; errors++;
          if (done === checked.length) {
            showToast(`${done - errors} succeeded, ${errors} failed`, 'toast-warn');
            renderLoading(document.getElementById('view-area'), 'Refreshing…');
            loadManagerDashboard();
          }
        })
        .updateTimeOffStatus(c.dataset.empId, c.dataset.date, c.dataset.submittedAt, status);
    });
  }
  if (bulkApprove) bulkApprove.addEventListener('click', () => handleBulkAction('Approved'));
  if (bulkDeny)    bulkDeny.addEventListener('click', () => handleBulkAction('Denied'));

  // Delete punch buttons (Phase 7)
  document.querySelectorAll('.rp-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const empId = btn.dataset.emp;
      const date = btn.dataset.date;
      const time = btn.dataset.time;
      const type = btn.dataset.type;
      const empName = btn.dataset.name;
      uiConfirm({
        title: 'Delete punch',
        message:
          `Delete ${prettyType(type)} for ${empName} on ${date} at ${dispTime(time)}?\n\n` +
          `This permanently removes the punch and cannot be undone.`,
        confirmLabel: 'Delete',
        tone: 'danger',
      }).then(ok => {
        if (!ok) return;
        handleDeletePunch(empId, date, time, type, btn);
      });
    });
  });

  // Edit Day buttons on employee cards
  document.querySelectorAll('.de-open-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      openDayEditModal(btn.dataset.empId, btn.dataset.empName);
    });
  });
}

function prettyType(type) {
  return ({
    ClockIn: 'Clock In', LunchOut: 'Lunch Out', LunchIn: 'Lunch Return', ClockOut: 'Clock Out',
  })[type] || esc(type);
}

function handleApprovalAction(empId, date, submittedAt, newStatus, btn) {
  const card = btn.closest('.pending-card');
  card.querySelectorAll('.pending-btn').forEach(b => { b.disabled = true; });
  google.script.run
    .withSuccessHandler(result => {
      if (!result.success) {
        showToast((result.error||'Error'),'toast-error');
        card.querySelectorAll('.pending-btn').forEach(b => { b.disabled = false; });
        return;
      }
      const balMsg = result.newBalance !== null && result.newBalance !== undefined
        ? ` · balance: ${formatLeaveDays(result.newBalance)}` : '';
      showToast(`${newStatus}${balMsg}`, 'toast-success');
      renderLoading(document.getElementById('view-area'), 'Refreshing…');
      loadManagerDashboard();
    })
    .withFailureHandler(err => {
      showToast((err.message||'Server error'),'toast-error');
      card.querySelectorAll('.pending-btn').forEach(b => { b.disabled = false; });
    })
    .updateTimeOffStatus(empId, date, submittedAt, newStatus);
}

function handleDeletePunch(empId, date, time, type, btn) {
  btn.disabled = true;
  // Briefly substitute the trash glyph with an ellipsis while the
  // request is in flight; restore the SVG on failure (success will
  // re-render the whole list).
  const original = btn.innerHTML;
  btn.innerHTML = '<span style="font-family:var(--mono);font-size:12px">…</span>';
  google.script.run
    .withSuccessHandler(r => {
      if (!r.success) {
        btn.disabled = false; btn.innerHTML = original;
        showToast((r.error||'Error'), 'toast-error');
        return;
      }
      showToast('Punch deleted', 'toast-success');
      renderLoading(document.getElementById('view-area'), 'Refreshing…');
      loadManagerDashboard();
    })
    .withFailureHandler(err => {
      btn.disabled = false; btn.innerHTML = original;
      showToast((err.message||'Server error'), 'toast-error');
    })
    .deletePunch(empId, date, time, type);
}

// ── ADP EXPORT MODAL ──────────────────────────────────────────────────────
function openExportModal() {
  const tz = empTz();
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz });
  const now = new Date();
  const todayIso = fmt.format(now);
  const firstOfMonth = todayIso.substring(0, 7) + '-01';
  document.getElementById('exp-start').value = firstOfMonth;
  document.getElementById('exp-end').value   = todayIso;
  document.getElementById('export-overlay').classList.add('open');
}

document.getElementById('exp-cancel').addEventListener('click', () =>
  document.getElementById('export-overlay').classList.remove('open'));
document.getElementById('export-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('export-overlay'))
    document.getElementById('export-overlay').classList.remove('open');
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tz = empTz();
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz });
    const now = new Date();
    const todayIso = fmt.format(now);
    const parts = todayIso.split('-');
    const today = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    let start, end;
    const preset = btn.dataset.preset;
    if (preset === 'this-month') {
      start = new Date(today.getFullYear(), today.getMonth(), 1);
      end = today;
    } else if (preset === 'last-month') {
      start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      end = new Date(today.getFullYear(), today.getMonth(), 0);
    } else if (preset === 'last-14') {
      start = new Date(today); start.setDate(today.getDate() - 13);
      end = today;
    } else if (preset === 'last-30') {
      start = new Date(today); start.setDate(today.getDate() - 29);
      end = today;
    }
    document.getElementById('exp-start').value = isoDate(start);
    document.getElementById('exp-end').value   = isoDate(end);
  });
});

document.getElementById('exp-submit').addEventListener('click', () => {
  const start = document.getElementById('exp-start').value;
  const end   = document.getElementById('exp-end').value;
  if (!start || !end) { showToast('Please pick both dates','toast-error'); return; }
  if (start > end)     { showToast('Start date must be before end date','toast-error'); return; }
  const btn = document.getElementById('exp-submit');
  btn.disabled = true;
  btn.textContent = 'Generating…';
  google.script.run
    .withSuccessHandler(result => {
      btn.disabled = false;
      btn.textContent = 'Generate Export';
      if (!result.success) { showToast((result.error||'Error'),'toast-error'); return; }
      document.getElementById('export-overlay').classList.remove('open');
      showToast(`Generated ${result.rowCount} rows — opening sheet`, 'toast-success');
      window.open(result.url, '_blank');
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = 'Generate Export';
      showToast((err.message||'Server error'),'toast-error');
    })
    .exportAdpRange(start, end);
});

// ─── MANAGER: EDIT DAY MODAL ──────────────────────────────────────────────
var _deEmpId = null, _deEmpName = null, _deDate = null;

function openDayEditModal(empId, empName) {
  _deEmpId = empId;
  _deEmpName = empName;
  var tz = empTz();
  var today = isoDateTz(tz);
  _deDate = today;
  document.getElementById('day-edit-subtitle').textContent = empName;
  var deDateEl = document.getElementById('de-date');
  deDateEl.value = today;
  // Match the Adjust modal: no future edits (server rejects daysBack<0) and
  // no edits older than the adjust window. Use the server-shipped
  // CONFIG.ADJUST_WINDOW_DAYS (via getManagerDashboard) so the picker tracks
  // the real limit instead of a hardcoded 30; fall back to 30 if absent.
  // Server still enforces the limit authoritatively.
  var adjustWindowDays = (mgrData && typeof mgrData.adjustWindowDays === 'number')
    ? mgrData.adjustWindowDays : 30;
  deDateEl.max = today;
  var deMin = new Date(today + 'T00:00:00Z');
  deMin.setUTCDate(deMin.getUTCDate() - adjustWindowDays);
  deDateEl.min = deMin.toISOString().substring(0, 10);
  document.getElementById('de-clockin').value = '';
  document.getElementById('de-lunchout').value = '';
  document.getElementById('de-lunchin').value = '';
  document.getElementById('de-clockout').value = '';
  document.getElementById('de-reason').value = '';
  // #4b — multi-day "To" picker shares the From picker's bounds; cleared on open.
  var deToEl = document.getElementById('de-date-to');
  if (deToEl) { deToEl.value = ''; deToEl.min = deDateEl.min; deToEl.max = today; }
  document.getElementById('day-edit-overlay').classList.add('open');
  loadDayEditPunches(empId, today, today);
}

function loadDayEditPunches(empId, start, end) {
  google.script.run
    .withSuccessHandler(function (data) {
      if (data.error) return;
      var day = (data.days || []).find(function (d) { return d.date === _deDate; });
      if (!day) return;
      document.getElementById('de-clockin').value  = day.clockIn  ? day.clockIn.substring(0, 5) : '';
      document.getElementById('de-lunchout').value = day.lunchOut ? day.lunchOut.substring(0, 5) : '';
      document.getElementById('de-lunchin').value  = day.lunchIn  ? day.lunchIn.substring(0, 5) : '';
      document.getElementById('de-clockout').value = day.clockOut ? day.clockOut.substring(0, 5) : '';
    })
    .withFailureHandler(function () {})
    .getEmployeeTimesheetForManager(empId, start, end);
}

document.getElementById('de-cancel').addEventListener('click', function () {
  document.getElementById('day-edit-overlay').classList.remove('open');
});
document.getElementById('day-edit-overlay').addEventListener('click', function (e) {
  if (e.target === document.getElementById('day-edit-overlay'))
    document.getElementById('day-edit-overlay').classList.remove('open');
});

document.getElementById('de-date').addEventListener('change', function () {
  var d = this.value;
  if (!d || !_deEmpId) return;
  _deDate = d;
  document.getElementById('de-clockin').value = '';
  document.getElementById('de-lunchout').value = '';
  document.getElementById('de-lunchin').value = '';
  document.getElementById('de-clockout').value = '';
  loadDayEditPunches(_deEmpId, d, d);
});

document.getElementById('de-save').addEventListener('click', function () {
  if (!_deEmpId || !_deDate) return;
  var slots = {
    ClockIn:  document.getElementById('de-clockin').value || '',
    LunchOut: document.getElementById('de-lunchout').value || '',
    LunchIn:  document.getElementById('de-lunchin').value || '',
    ClockOut: document.getElementById('de-clockout').value || '',
  };
  var reason = document.getElementById('de-reason').value.trim();
  var toDate = (document.getElementById('de-date-to') || {}).value || '';
  var rangeMode = toDate && toDate > _deDate;   // #4b — multi-day additive apply
  var btn = document.getElementById('de-save');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  var onOk = function (result) {
    btn.disabled = false;
    btn.textContent = 'Save Changes';
    if (!result.success) { showToast((result.error || 'Error'), 'toast-error'); return; }
    document.getElementById('day-edit-overlay').classList.remove('open');
    showToast(rangeMode
      ? ('Applied ' + (result.punchesWritten || 0) + ' punch(es) across ' + (result.daysTouched || 0) + ' day(s)')
      : (result.changes > 0 ? result.summary : 'No changes needed'), 'toast-success');
    renderLoading(document.getElementById('view-area'), 'Refreshing…');
    loadManagerDashboard();
  };
  var onErr = function (err) {
    btn.disabled = false;
    btn.textContent = 'Save Changes';
    showToast((err.message || 'Server error'), 'toast-error');
  };
  if (rangeMode) {
    google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)
      .managerSaveDayRange(_deEmpId, _deDate, toDate, slots, reason);
  } else {
    google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)
      .managerSaveDay(_deEmpId, _deDate, slots, reason);
  }
});

/** 7-bar daily-hours sparkline inside each live-status card (V4·E3).
 *  Bars are flex-sized; hours-mapped heights scale within the row.
 *  Bars colored: zero (dim), short (<6h warn-toned), normal accent.
 *  Returns '' for missing/empty arrays so non-tracking reps don't see
 *  a placeholder. */
function renderEmpSparkline_(recentHours) {
  if (!recentHours || recentHours.length === 0) return '';
  const max = Math.max(8, ...recentHours.map(d => d.hours || 0));
  const totalHrs = recentHours.reduce((s, d) => s + (d.hours || 0), 0);
  const daysWorked = recentHours.filter(d => (d.hours || 0) > 0).length;
  if (totalHrs === 0) return '';
  const bars = recentHours.map(d => {
    const h = d.hours || 0;
    const px = h === 0 ? 0 : Math.max(2, Math.round((h / max) * 18));
    const cls = ['bar'];
    if (h === 0) cls.push('zero');
    else if (h < 6) cls.push('short');
    const dlabel = d.date ? d.date.slice(5) : '';
    return `<div class="${cls.join(' ')}" title="${esc(dlabel + ': ' + (h ? h.toFixed(1) + 'h' : 'off'))}" style="height:${px}px"></div>`;
  }).join('');
  return `<div class="emp-spark-wrap">
    <div class="emp-spark">${bars}</div>
    <span class="emp-spark-total">${formatHoursShort(totalHrs)}·${daysWorked}d</span>
  </div>`;
}

/** 14-bar sparkline for the manager telemetry strip (V4·E2). Tone is
 *  applied to the latest bar so the eye lands on "right now"; empty
 *  trends collapse to nothing rather than render a row of zero-height
 *  placeholders. */
function renderTelSparkline_(trend, tone) {
  if (!trend || trend.length === 0) return '';
  const max = Math.max(1, ...trend.map(d => d.count || 0));
  const bars = trend.map((d, i) => {
    const c = d.count || 0;
    const h = c === 0 ? 0 : Math.max(2, Math.round((c / max) * 18));
    const isLast = i === trend.length - 1;
    const cls = ['bar'];
    if (c === 0) cls.push('zero');
    if (isLast && tone && c > 0) cls.push(tone);
    const title = `${d.date}: ${c}`;
    return `<div class="${cls.join(' ')}" title="${esc(title)}" style="height:${h}px"></div>`;
  }).join('');
  return `<div class="tel-spark">${bars}</div>`;
}

function renderAnalyticsSection(data) {
  const trend = data.punchTrend || [];
  const toSum = data.toSummary || { approved: 0, pending: 0, denied: 0 };
  if (trend.length === 0 && !toSum.approved && !toSum.pending && !toSum.denied) return '';

  const max = Math.max(1, ...trend.map(d => d.count));
  const barW = Math.floor(100 / Math.max(trend.length, 1));
  const bars = trend.map(d => {
    const h = Math.round((d.count / max) * 80);
    const label = d.date.slice(5);
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0">
      <div style="font-family:var(--mono);font-size:11px;color:var(--ink);margin-bottom:2px">${d.count}</div>
      <div style="width:70%;height:${h}px;min-height:2px;background:var(--accent);border-radius:3px 3px 0 0"></div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px">${label}</div>
    </div>`;
  }).join('');

  const toTotal = toSum.approved + toSum.pending + toSum.denied;
  const toParts = [];
  if (toSum.approved) toParts.push(`<span style="color:var(--success-deep)">${toSum.approved} approved</span>`);
  if (toSum.pending)  toParts.push(`<span style="color:var(--warning-deep)">${toSum.pending} pending</span>`);
  if (toSum.denied)   toParts.push(`<span style="color:var(--danger-deep)">${toSum.denied} denied</span>`);

  return `
    <div class="metric-grid" style="grid-template-columns:1fr 1fr;margin-bottom:0">
      <div class="card" style="margin-bottom:16px">
        <div class="card-label">Punch Activity · last 7 days</div>
        <div style="display:flex;align-items:flex-end;gap:2px;height:100px;padding:4px 0">${bars}</div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-label">Time Off · this month</div>
        <div style="font-size:28px;font-weight:600;color:var(--ink);margin:12px 0 4px">${toTotal}</div>
        <div style="font-size:12px;color:var(--muted)">requests total</div>
        <div style="font-size:13px;margin-top:8px;display:flex;gap:12px">${toParts.join('')}</div>
      </div>
    </div>`;
}
