<style>
  /* ── Clock-view redesign (#5a) — layers on the styles.html clock vocabulary ── */
  /* Time-of-day "sky" gradient card. Gradient hexes are decorative, time-of-day
     specific, and have no token equivalent (the CN_EMAIL_PALETTE precedent for
     justified inline hex). White text + shadow for contrast over the gradient. */
  .clk.clk-sky { position: relative; overflow: hidden; color: #fff; border-radius: var(--radius-lg); padding: 16px 18px; text-shadow: 0 1px 3px rgba(0, 0, 0, .35); background: #243056; }
  /* §10 sky cross-fade — stacked gradient layers (CSS can't transition between
     two gradients, so we cross-fade opacity between two absolute layers). */
  .clk-sky-layers { position: absolute; inset: 0; z-index: 0; border-radius: inherit; overflow: hidden; }
  .clk-sky > :not(.clk-sky-layers):not(.clk-sky-bg):not(.clk-bg-ctrl) { position: relative; z-index: 1; }
  /* Optional per-browser background image ("for fun") — a downscaled raster
     data-URL (localStorage) shown as the CLOCK CARD's background. Operator fix
     2026-07-09: since the Dashboard redesign the hero IS the clock tile, whose
     opaque sky gradient sat ON TOP of the photo layer — the upload "worked"
     (localStorage set, clear button appeared) but the photo was 100% hidden.
     With a photo set, the tile goes transparent and the sky-gradient layers
     hide, so the photo (with its baked dark scrim) IS the card; the white
     time/text + phase glyph render over it unchanged. Clearing restores the
     time-of-day sky. */
  .hero { position: relative; overflow: hidden; }
  .clk-hero-bg { position: absolute; inset: 0; z-index: 0; display: none;
    background-size: cover; background-position: center; border-radius: inherit; }
  .hero.has-bg .clk-hero-bg { display: block; }
  .hero > .greet, .hero > .clk { position: relative; z-index: 1; }
  .hero.has-bg .clk.clk-sky { background: transparent; }
  .hero.has-bg .clk-sky-layers { display: none; }
  /* Over a photo the greeting text turns light for contrast (the clock tile is
     opaque, so it needs no change). */
  .hero.has-bg .greet-kicker { color: rgba(255, 255, 255, .82); }
  .hero.has-bg .greet-name { color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
  .hero.has-bg .status-sentence { color: rgba(255, 255, 255, .94); text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
  .hero.has-bg .status-sentence strong { color: #fff; }
  .clk-bg-ctrl { position: absolute; right: 10px; bottom: 8px; z-index: 2; display: flex; gap: 6px; }
  .clk-bg-btn { appearance: none; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .34); color: #fff; border-radius: 8px;
    cursor: pointer; opacity: .5; transition: opacity .15s ease, background .15s ease; }
  .clk-sky:hover .clk-bg-btn, .hero:hover .clk-bg-btn, .clk-bg-btn:focus-visible { opacity: 1; }
  .clk-bg-btn:hover { background: rgba(255, 255, 255, .3); }
  .clk-sky .clk-time { color: #fff; }
  /* V-2 (cycle 12): the AM/PM is a nested span whose own rule in styles.html
     (`.hero .clk-time .ampm { color: var(--muted) }`, specificity 0,3,0) BEAT
     the 0,2,0 `.clk-sky .clk-time` override above — so it was the one element
     on this card still painted with a THEME-FLIPPING token while the card's
     sky gradient is FIXED (identical in both modes). Measured contrast against
     that gradient: light 2.08:1 / 3.46 / 5.82; dark 1.20-2.00:1 across the
     whole card — AM/PM was effectively invisible in dark mode, on the live
     clock of a time-tracking app. Fixed colour, matching its .clk-meta /
     .clk-regions siblings. RULE: any text on this card must use a literal
     colour, never a --muted/--ink token. */
  .clk-sky .clk-time .ampm { color: rgba(255, 255, 255, .88); }
  .clk-sky .clk-meta, .clk-sky .clk-regions { color: rgba(255, 255, 255, .92); }
  .clk-sky .clk-region b { color: #fff; }
  /* Rotating world-clock chip — one zone at a time, slides in on each rotation
     (neutralized by the global prefers-reduced-motion block). */
  .clk-region-rot { display: inline-flex; align-items: baseline; gap: 5px; animation: clkRegSlide .42s var(--ease) both; }
  @keyframes clkRegSlide { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  /* Night-sky decor (operator picks a+b+d, 2026-07-10) — star field, shooting
     star, moon. All inside .clk-sky-layers (z 0, hidden with a photo bg); the
     twinkle/streak keyframes animate opacity/transform only and are killed by
     the global prefers-reduced-motion block (clkShootMaybe_ additionally skips
     spawning streaks there, so no static line lingers). Whites are the same
     decorative-inline-hex class as the sky gradients. */
  .clk-stars { position: absolute; inset: 0; pointer-events: none; }
  .clk-stars .st { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff;
    opacity: .3; animation: clkTwinkle 3.6s ease-in-out infinite; }
  .clk-stars .st.big { width: 3px; height: 3px; box-shadow: 0 0 4px rgba(255, 255, 255, .55); }
  @keyframes clkTwinkle { 0%, 100% { opacity: .22; } 50% { opacity: .95; } }
  .clk-shoot { position: absolute; width: 74px; height: 2px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff);
    animation: clkShoot 1.15s ease-out forwards; }
  @keyframes clkShoot {
    from { opacity: 0; transform: translate(0, 0) rotate(-32deg); }
    12%  { opacity: .95; }
    to   { opacity: 0; transform: translate(-150px, 94px) rotate(-32deg); }
  }
  .clk-moon { position: absolute; right: 16px; top: 42px; width: 30px; height: 30px; border-radius: 50%;
    background: #f2eddc; overflow: hidden; box-shadow: 0 0 14px rgba(255, 246, 214, .35); pointer-events: auto; }
  .clk-moon .shade { position: absolute; inset: 0; border-radius: 50%; background: rgba(14, 18, 38, .92); }

  /* Dashboard card-shaped skeletons (operator pick 2026-07-10) — compose the
     shared .skel shimmer (styles.html) into the shapes the briefing cards
     render with, so loading holds the layout instead of a stray sweep bar. */
  .dash-skel-label { display: block; width: 110px; height: 10px; margin-bottom: 14px; }
  .dash-skel-seg { display: block; width: 190px; height: 26px; border-radius: 999px; margin-bottom: 14px; }
  .dash-skel-big { display: block; width: 46%; height: 30px; margin-bottom: 16px; }
  .dash-skel-kpis { display: flex; gap: 10px; }
  .dash-skel-kpi { flex: 1; height: 54px; border-radius: var(--radius-sm); }

  /* Greeting-bar rotator (operator feedback 2026-07-09) — the status line
     rotates upward-carousel style with What's-new update slides. Same slide-up
     animation as the world-clock chip (same reduced-motion neutralization). */
  .dash-greet-rot { min-height: 1.5em; overflow: hidden; }
  .greet-rot-item { display: inline-block; max-width: 100%; animation: clkRegSlide .42s var(--ease) both; }
  .greet-upd { appearance: none; border: none; background: none; padding: 0; font: inherit; color: inherit;
    cursor: pointer; display: inline-flex; align-items: center; gap: 7px; max-width: 100%; text-align: left; }
  .greet-upd svg { flex-shrink: 0; color: var(--accent); }
  .greet-upd:hover .greet-upd-txt { text-decoration: underline; }
  .greet-upd-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .greet-upd-new { flex-shrink: 0; font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .1em;
    color: var(--paper); background: var(--accent); border-radius: 999px; padding: 1px 6px; }
  .clk-sky-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .clk-phase { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .95; display: inline-flex; align-items: center; gap: 5px; }
  .clk-tz-pill { appearance: none; background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .4); color: #fff; font: inherit; font-size: 11px; border-radius: 999px; padding: 2px 9px; cursor: pointer; }
  .clk-tz-pill option { color: var(--ink); }

  /* Live shift strip = the control surface (header + ribbon + punch buttons). */
  .shift-strip { border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper-card); box-shadow: var(--shadow-sm); padding: 14px 16px; margin: 14px 0; }
  /* Cycle-13 follow-on: `flex-wrap: wrap` was MISSING, so the five children
     (label · state pill · spacer · coverage · hours) were forced onto one line
     and the hours readout ran past the card edge in the 360px Dashboard rail —
     "5h 54m worked · 32m lunch" clipped mid-word. V-4 (cycle 12) had already
     made `.ss-hours` wrap INTERNALLY between its two readouts, but an inner
     wrap cannot help when the PARENT row has nowhere to wrap to. `.ss-grow` is
     `flex: 1` with a 0 basis, so it contributes nothing to line-breaking and
     wide layout is unchanged; it just fills whatever is left on its own line. */
  .shift-strip-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 10px; }
  /* #4 — break schedule chips under the ribbon */
  .clk-brk-sched { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
  .clk-brk-label { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .clk-brk-chip { font-family: var(--mono); font-size: 10.5px; background: var(--warn-soft); color: var(--warning-deep); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  /* Lunch shaded darker than the 15-min breaks so it reads as the main break. */
  .clk-brk-chip.lunch { background: var(--warn); color: var(--paper); font-weight: 600; }
  .ss-label { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .ss-state { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 2px 9px; }
  .ss-state.working { background: var(--accent-soft); color: var(--success-deep); }
  .ss-state.lunch   { background: var(--warn-soft); color: var(--warning-deep); }
  .ss-state.out     { background: var(--paper-2); color: var(--muted); }
  .ss-grow { flex: 1; }
  .ss-hours { font-family: var(--mono); font-size: .86rem; font-weight: 700; color: var(--ink); }
  .ss-hours .ss-sub { font-weight: 400; color: var(--muted); }
  /* V-4 — see the render comment: the parent may wrap between readouts,
     an individual duration may never break inside itself. */
  .ss-hours { display: inline-flex; flex-wrap: wrap; gap: 0 5px; }
  .ss-hours .ss-val { white-space: nowrap; }
  /* Inline note-coverage in the shift header (#3 — replaces the donut strip). */
  .ss-cov { display: inline-flex; align-items: center; gap: 8px; }
  .ss-cov-pct { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .03em; color: var(--muted); }
  .ss-cov-pct.good { color: var(--success-deep); }
  .ss-cov-pct.warn { color: var(--warning-deep); }
  .ss-cov-pct.crit { color: var(--danger-deep); }
  .ss-cov-ok { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11px; color: var(--success-deep); }
  .ss-cov-cta { display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 11px; font-weight: 600;
    color: var(--warning-deep); background: var(--warn-soft); border: 1px solid transparent; border-radius: 999px;
    padding: 2px 9px; cursor: pointer; transition: background .12s; }
  .ss-cov-cta:hover { background: var(--warn-soft); border-color: var(--warn); }
  .shift-strip .actions { margin-top: 12px; margin-bottom: 0; }

  /* Note-volume histogram behind the ribbon track (C2 — sourced from today's
     own notes bucketed by rep-local hour; Timestamp is stored in the rep's tz). */
  .ribbon-hist { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  /* Per-hour note-volume bars behind the shift bar (the in-ribbon "coverage"
     view — replaces the old separate donut strip). Prominent enough to read as
     a background histogram of when the rep logged notes. */
  .ribbon-hist .hbar { position: absolute; bottom: 0; width: 7px; transform: translateX(-50%); border-radius: 2px 2px 0 0;
    background: rgba(15, 138, 82, .34); background: color-mix(in oklch, var(--accent) 34%, transparent); }
  /* Scheduled break bands (amber) drawn over the work segments. */
  .r-break { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--warn);
    background: rgba(183, 121, 31, .22); background: color-mix(in oklch, var(--warn) 20%, transparent); }

  /* Lunch / clock action colors (mirror the ribbon lunch = warn). */
  .actions .prime.prime-warn { background: var(--warn); border-color: var(--warn); color: var(--paper); }
  .actions .prime.prime-neutral { background: var(--paper-card); border-color: var(--line-2); color: var(--ink); }
  .actions .sec.act-lunchout { color: var(--warning-deep); }
  .actions .sec.act-lunchin, .actions .sec.act-clockin, .actions .sec.act-lunchin svg { color: var(--success-deep); }

  /* Punch-button icon morph (LunchOut: headset→mug, LunchIn: mug→headset),
     shown as the in-flight loading state. Two glyphs stacked; cross-fade +
     scale/rotate, transform/opacity only. Ends on the destination glyph and
     holds it until the state re-render swaps the whole button. */
  .clk-morph { position: relative; display: inline-flex; width: 18px; height: 18px; }
  .clk-morph .cm-from, .clk-morph .cm-to { position: absolute; inset: 0; display: inline-flex; }
  .clk-morph .cm-from { animation: clkMorphOut .42s var(--ease) forwards; }
  .clk-morph .cm-to   { opacity: 0; animation: clkMorphIn .42s var(--ease) forwards; }
  @keyframes clkMorphOut { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(.55) rotate(-18deg); } }
  @keyframes clkMorphIn  { 0% { opacity: 0; transform: scale(.55) rotate(18deg); } 100% { opacity: 1; transform: none; } }

  /* (F(cycle-8): the .clk-row3 / .pto-mini / .pto-pips cluster was removed —
     the Dashboard redesign relocated Annual PTO to the Time/PTO tab and
     nothing emitted the markup; the orphaned renderPtoMini_ + CSS read as if
     the Clock view still rendered PTO. INV-74/L11 class.) */
  /* Pop-out (compact) density: drop the secondary world-clock strip + greeting
     kicker (the big clock already shows the rep's time), and tighten the cards
     so the actionable bits — clock, punch buttons, today's punches — sit higher. */
  :root[data-compact] #clk-regions { display: none !important; }
  :root[data-compact] .hero .greet-kicker { display: none; }
  :root[data-compact] .hero { padding: 14px 16px 12px; gap: 10px; }
  :root[data-compact] .shift-strip { padding: 12px 14px; margin: 10px 0; }

  /* ── Dashboard (Time Clock → Dashboard) ──────────────────────────────────
     Two-column grid: clock rail (left) + briefing carousels (main). The
     minmax(0,1fr) on the main column is LOAD-BEARING — a bare 1fr has an
     implicit min-width:auto floor that the carousel viewports would blow past. */
  .dash-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
  .dash-rail { min-width: 0; }
  .dash-rail .shift-strip { margin: 14px 0; }
  .dash-rail .card { margin-top: 14px; }
  /* On the dashboard the gradient sky IS the card — drop the white .hero frame
     (bg/border/padding/shadow) so the clock isn't redundantly boxed (d1). */
  .dash-hero { display: block; background: none; border: none; box-shadow: none; padding: 0; margin: 0; border-radius: var(--radius-lg); }
  .dash-main { min-width: 0; }
  /* Greeting is a full-width header above both columns, in a subtle panel. */
  .dash-greet-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 18px; }
  .dash-onclock { display: inline-flex; align-items: center; gap: 7px; flex: none; font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--success-deep); background: var(--accent-soft); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .dash-onclock-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success-deep); }
  /* Metric carousels side by side (the inbox switcher stays full-width below). */
  .dash-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 16px; }
  .dash-pair .dash-card, .dash-pair .card { margin-bottom: 0; }
  .dash-foot { margin-bottom: 0; }   /* Today's Punches + teammate, moved off the left rail */
  @media (max-width: 1100px) { .dash-pair { grid-template-columns: 1fr; } }
  /* The dashboard is an app surface, not prose — let it breathe wider than the
     default --content-max so wide monitors aren't mostly empty margin. */
  .view-area:has(#dash-grid) { max-width: 1480px; }
  /* Compact (?compact=1 pop-out): single column, hide the greeting + the briefing
     carousels, but KEEP the foot (Today's Punches + teammate) so the pinned
     pop-out still shows punches under the clock. */
  :root[data-compact] .dash-grid { grid-template-columns: 1fr; }
  :root[data-compact] #dash-cards { display: none; }
  :root[data-compact] .dash-greet-bar { display: none; }

  .dash-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
  .dash-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; row-gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  /* A13 (cycle 13): an <h2>, not a span — margin:0 zeroes the UA h2 default so
     the flex head row is pixel-identical. */
  .dash-seclabel { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
  /* Segmented chip — tinted track, sliding white highlight, labels above it. */
  .dash-seg { position: relative; display: flex; background: var(--paper-2); border-radius: 8px; padding: 3px; min-width: 212px; }
  .dash-seg-hi { position: absolute; top: 3px; bottom: 3px; left: 3px; background: var(--paper-card); border-radius: 6px;
    box-shadow: var(--shadow-sm); transition: transform .35s cubic-bezier(.4, 0, .2, 1); }
  /* A1 (cycle 13): <button>, not <span> — the period switcher had no keyboard
     path at all and no alternative route to Yesterday/MTD/YTD. The reset keeps
     it pixel-identical to the span it replaced. */
  .dash-seg-opt { appearance: none; -webkit-appearance: none; background: none; border: 0;
    flex: 1; text-align: center; padding: 5px 6px; font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .02em;
    cursor: pointer; position: relative; z-index: 1; color: var(--muted); white-space: nowrap; }
  .dash-seg-opt.on { color: var(--ink); }
  /* Carousel viewport + track. align-items:flex-start is LOAD-BEARING — without
     it flex's default `stretch` equalizes every slide to the tallest, so the JS
     height-fit (clkDashFit_) would always measure the max, not the active slide,
     leaving an empty gap under a sparse slide. The .dash-vp height transition
     animates the card grow/shrink as periods switch — a deliberate, bounded
     exception to the carousel's otherwise transform-only motion (one element,
     user-triggered, reduced-motion-neutralized below). */
  .dash-vp { overflow: hidden; transition: height .38s cubic-bezier(.4, 0, .2, 1); }
  .dash-trk { display: flex; align-items: flex-start; transition: transform .4s cubic-bezier(.4, 0, .2, 1); }
  .dash-sld { min-width: 100%; }
  .dash-kpis { display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: flex-end; }
  .dash-kpi-v { font-family: var(--display, var(--ui)); font-size: 1.3rem; font-weight: 700; color: var(--ink); line-height: 1; }
  .dash-kpi-l { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
  .dash-kpi-big .dash-kpi-v { font-size: 2rem; color: var(--accent); }
  .dash-card-foot { font-size: 10px; color: var(--muted); margin-top: 12px; }
  .dash-empty { font-size: 13px; color: var(--muted); min-height: 56px; display: flex; align-items: center; }
  /* Spanish pending-request preview (d2) — surfaced when there are open requests. */
  .dash-sp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .dash-sp-count { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink); }
  .dash-sp-count svg { width: 13px; height: 13px; color: var(--accent); }
  .dash-sp-median { font-size: 10px; color: var(--muted); }
  .dash-sp-nav { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
  .dash-sp-arrow { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; padding: 0;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper-card); color: var(--ink); cursor: pointer; }
  .dash-sp-arrow:hover { background: var(--paper-2); border-color: var(--border-strong); }
  .dash-sp-req { background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .dash-sp-from { font-size: 13px; font-weight: 600; color: var(--ink); }
  .dash-sp-age { font-weight: 400; color: var(--muted); }
  .dash-sp-snip { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .dash-proj { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--info-deep); margin-top: 8px; }
  .dash-link { font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .dash-link:hover { text-decoration: underline; }

  /* Mobile / stacked — rail on top, carousels below, full width. */
  @media (max-width: 860px) {
    .dash-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dash-vp, .dash-trk, .dash-seg-hi { transition: none; }
    .clk-morph .cm-from { display: none; }
    .clk-morph .cm-to { opacity: 1; animation: none; }
  }
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  CLOCK VIEW
// ════════════════════════════════════════════════════════════════════════════

// Overridden from server's CONFIG.SELF_UNDO_WINDOW_SECONDS via getEmployeeState
// in script_core.html's init handler. Default kept as a safety net.
let SELF_UNDO_WINDOW_SECONDS = 300;

/** Clock view enter handler. Round 2 · 8b moved the rep's timesheet
 *  section out of this view into the Time / PTO tab, so the Clock tab
 *  is now punches + actions + ribbon + cov + ledger + teammate only —
 *  no timesheet rail below. enterClockCombinedView is kept as the entry
 *  name (TOOLS registry still references it) but the body is now a
 *  thin wrapper around renderClockView. */
function enterClockCombinedView(area) {
  stopClock();
  renderClockView(area);   // instant paint from cached empState
  startClock();
  clkRefreshState_();      // then reconcile to current truth (day rollover, a
                           // manager's approved punch fix, a forgotten clock-out)
  clkBindFreshness_();     // refresh on tab focus/visibility (idempotent)
}

/** Re-fetch employee state and re-render the Clock view if still active. Fixes
 *  stale button state when a tab is left open across midnight (a forgotten
 *  clock-out shouldn't carry into the new day) or after a manager approves a
 *  punch-adjust for today — the open tab now reconciles instead of showing the
 *  prior day's "Clock Out" / pre-fix buttons. */
function clkRefreshState_() {
  google.script.run
    .withSuccessHandler(function (state) {
      if (!state || state.error) return;
      empState = state;
      adjustWindowDays = state.adjustWindowDays || 30;
      _clkLastDay = isoDateTz(empTz());
      if (currentView === 'clock') {
        var area = getClockArea_();
        if (area) { renderClockView(area); startClock(); }
      }
    })
    .withFailureHandler(function () {})
    .getEmployeeState();
}

/** Bind a one-time focus/visibility refresh so a Clock tab left open reconciles
 *  when the rep returns to it (no background push in Apps Script web apps). */
var _clkFreshnessBound = false;
var _clkLastWake = 0;
function clkBindFreshness_() {
  if (_clkFreshnessBound) return;
  _clkFreshnessBound = true;
  // Throttle the reconcile so a flurry of focus/visibility events (alt-tab,
  // clicking back from the CRM) doesn't fire getEmployeeState + a full re-render
  // each time. The dashboard cache (SWR) already prevents the loader flash; this
  // also bounds the server round-trips.
  var onWake = function () {
    if (currentView !== 'clock' || document.hidden) return;
    var now = Date.now();
    if (now - _clkLastWake < 20000) return;
    _clkLastWake = now;
    clkRefreshState_();
  };
  window.addEventListener('focus', onWake);
  document.addEventListener('visibilitychange', onWake);
}

/** Returns the container the clock view renders into. Pre-8b this had
 *  to distinguish a #clk-section nested under the combined view; now
 *  it's just the view-area. Kept as a wrapper so handlePunch /
 *  selfDeletePunch handlers don't have to change. */
function getClockArea_() {
  return document.getElementById('view-area');
}

function renderClockView(area) {
  const s = empState;
  // Resolved shift schedule from the server (per-tz; PH agents 8:30, others
  // 8:00 — see CONFIG.SHIFT_SCHEDULE / getShiftSchedule_). Drives the ribbon
  // band + countdown before clock-in; both re-anchor to actual ClockIn after.
  CLK_SCHEDULE = (s && s.schedule) ? s.schedule : null;
  const tzAbbr = s.timezoneAbbr || '';
  const tz = empTz();
  const weekday = new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'long' }).format(new Date());
  const dateStr = new Intl.DateTimeFormat('en-US', { timeZone: tz, month: 'long', day: 'numeric' }).format(new Date());
  const kicker = `Today · ${weekday}`;

  const stats = computeShiftStats_(s.punches, tz);
  const statusSentence = buildStatusSentence_(stats, s.nextActions, tzAbbr);
  clkBuildRegionFmts_(tz, tzAbbr);   // item 5 — world-clock strip formatters
  if (!CLK_DISPLAY_TZ) CLK_DISPLAY_TZ = tz;   // tz selector default = rep's roster tz

  // Shift-strip header: state pill + hours-worked readout (hours moved off the
  // old ledger here per #5a).
  const stateLabel = stats ? (stats.state === 'lunch' ? 'On lunch' : stats.state === 'out' ? 'Done' : 'Working') : 'Not in';
  const stateCls   = stats ? (stats.state === 'lunch' ? 'lunch' : stats.state === 'out' ? 'out' : 'working') : 'out';
  const hoursReadout = stats
    // V-4 (cycle 12): each value+unit+word is its own nowrap span, so
    // "5h 54m worked · 32m lunch" wraps only BETWEEN the two readouts and never
    // mid-value (it used to break as "5h / 54m / worked / · 32m / lunch" at both
    // 1440px and 390px). Exactly the rule cycle-11's V-10 applied to `.tz-chip`
    // — "a time must never break internally" — on its sibling component.
    ? `<span class="ss-hours"><span class="ss-val">${stats.workedHM.h}h ${String(stats.workedHM.m).padStart(2,'0')}m worked</span>` +
        (stats.lunchMinutes ? ` <span class="ss-sub ss-val">· ${stats.lunchMinutes}m lunch</span>` : '') + `</span>`
    : `<span class="ss-hours ss-sub">Not clocked in yet</span>`;

  // Dashboard (Time Clock → Dashboard): two-column grid — clock rail (left) +
  // briefing carousels (main). The greeting moves to the top of the main column
  // so the clock card fits the 360px rail; #clk-hero is kept (just the clock now)
  // so the umsClockBg background + all clock machinery (#clk-sky, #live-time,
  // #clk-regions, ribbon) keep working. Annual PTO relocated to the Time/PTO tab.
  const isMgr = !!(s && s.isManager);
  const onClock = !!(stats && (stats.state === 'working' || stats.state === 'lunch'));
  const onClockPill = onClock
    ? `<span class="dash-onclock"><span class="dash-onclock-dot"></span>${stats.state === 'lunch' ? 'On lunch' : 'On the clock'}</span>`
    : '';
  CLK_GREET_ROT.statusHtml = statusSentence;   // slide 0 of the greeting rotator
  area.innerHTML = `
    <div class="dash-greet-bar">
      <div class="dash-greet-text">
        <div class="greet-kicker">${esc(kicker)}</div>
        <div class="greet-name">Hi, ${esc(greetName)}</div>
        <div class="status-sentence dash-greet-rot" id="greet-rot">${statusSentence}</div>
      </div>
      ${onClockPill}
    </div>
    <div class="dash-grid" id="dash-grid">
      <div class="dash-rail">
        <div class="hero dash-hero" id="clk-hero">
          <div class="clk-hero-bg" id="clk-hero-bg"></div>
          <div class="clk clk-sky" id="clk-sky">
            <div class="clk-sky-layers"><div class="sky-layer" id="clk-sky-a"></div><div class="sky-layer" id="clk-sky-b"></div></div>
            <div class="clk-sky-top">
              <span class="clk-phase" id="clk-phase"></span>
              ${tzSelectHtml_(tz, tzAbbr)}
            </div>
            <div class="clk-time tabular" id="live-time">--:--:--<span class="ampm"></span></div>
            <div class="clk-meta">
              <span id="clk-date">${esc(dateStr)}</span>
              ${tzAbbr ? `<span class="sep">·</span><span>${esc(tzAbbr)}</span>` : ''}
            </div>
            <div class="clk-regions" id="clk-regions" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-family:var(--mono);font-size:11px"></div>
            <div class="clk-next-break" id="clk-next-break" style="margin-top:6px"></div>
            <div class="clk-bg-ctrl">
              <button class="clk-bg-btn" id="clk-bg-set" title="Set a background image (saved to this browser only)" aria-label="Set clock background image" onclick="clkBgChoose_(event)">${icon('image', 13)}</button>
              <button class="clk-bg-btn" id="clk-bg-clear" title="Remove background" aria-label="Remove clock background" style="display:none" onclick="clkBgClear_(event)">${icon('x', 13)}</button>
            </div>
            <input type="file" id="clk-bg-input" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="clkBgOnFile_(this)">
          </div>
        </div>

        <div class="shift-strip">
          <div class="shift-strip-head">
            <span class="ss-label">Today's shift</span>
            <span class="ss-state ${stateCls}">${esc(stateLabel)}</span>
            <span class="ss-grow"></span>
            <span class="ss-cov" id="clk-shift-cov"></span>
            ${hoursReadout}
          </div>
          ${renderDayRibbon_(s.punches, stats, tz)}
          ${clkBreakScheduleHtml_()}
          ${renderActions(s.nextActions, { afterLunch: !!(stats && stats.state === 'working' && (s.punches || []).some(p => p.type === 'LunchIn')) })}
        </div>
      </div>

      <div class="dash-main" id="dash-main">
        <div id="dash-cards">${clkDashSkeleton_()}</div>
        <div class="dash-pair dash-foot">
          <div class="card">
            <h2 class="card-label">Today's Punches</h2>

    </div>`;
  bindClockBtns();
  bindSelfUndoBtns();
  loadTeammateStatus();
  loadCoverageStrip_();
  clkApplySky_(true);        // initial gradient + phase glyph
  clkBgApply_();             // optional per-browser background image (localStorage)
  clkUpdateRegions_();       // paint the rotating world-clock strip immediately
  clkBindTzSelect_();
  clkLoadNoteVolume_();      // C2 — note-volume histogram (async, best-effort)
  clkLoadDashboard_(isMgr);  // briefing carousels (async, best-effort)
}

// ── Dashboard briefing carousels (Time Clock → Dashboard) ────────────────────
// Period-aggregated metric cards (Yesterday / MTD / YTD) in a clipped carousel
// driven by a sliding segmented chip. Data via getDashboardMetrics (own +
// cohort-guarded team, INV-124). Every server string esc()'d. Manager + agent
// share the same two carousels (the team carousel is the dept rollup for a
// manager). v1 scope — the Spanish↔Requests switcher + the MTD/YTD projection
// cone are documented follow-ons.
var CLK_DASH_PERIODS = ['yesterday', 'mtd', 'ytd'];
var CLK_DASH_LABELS = ['Yesterday', 'MTD', 'YTD'];
var CLK_DASH = { mine: 0, team: 0, data: {}, isMgr: false, loadedDay: '', loadedAt: 0, extra: null, extraDay: '', extraAt: 0, spIdx: 0 };
// Stale-while-revalidate freshness window: a re-render within this of the last
// load renders from cache with NO loader and NO refetch; older renders still
// paint the cache instantly, then refresh in the background (silent swap). This
// kills the "cards vanish → line-loader → reappear" flash on every window focus
// (clkRefreshState_ re-renders the whole Clock view on focus/visibilitychange).
var CLK_DASH_FRESH_MS = 60000;

// Card-shaped skeletons (operator pick 2026-07-10) — the Dashboard's loading
// states are placeholders shaped like what will land (the sweep bar read as a
// stray line and the layout jumped when content arrived). Composed from the
// shared .skel shimmer (styles.html), so the reduced-motion block and dark
// mode behave like every other skeleton.
function clkDashSkelKpis_() {
  return '<div class="dash-kpis dash-skel-kpis" aria-hidden="true">' +
    '<span class="skel dash-skel-kpi"></span><span class="skel dash-skel-kpi"></span><span class="skel dash-skel-kpi"></span>' +
  '</div>';
}
function clkDashSkelCard_() {
  return '<div class="dash-card" aria-hidden="true">' +
    '<span class="skel dash-skel-label"></span>' +
    '<span class="skel dash-skel-seg"></span>' +
    '<span class="skel dash-skel-big"></span>' +
    clkDashSkelKpis_() +
  '</div>';
}
/** The initial #dash-cards loading state — a 2-up pair mimicking the two
 *  metric carousels (label + segmented chip + hero value + KPI tiles). */
function clkDashSkeleton_() {
  return '<div class="dash-pair" role="status" aria-label="Loading dashboard">' +
    clkDashSkelCard_() + clkDashSkelCard_() +
  '</div>';
}

/** Fetch all three periods up front (server-cached per (emp,period)); render the
 *  carousels when they all resolve. Guards on currentView (late-callback). */
function clkLoadDashboard_(isMgr) {
  // F(cycle-8 M-12): the compact pop-out hides #dash-cards + the greeting bar
  // entirely (:root[data-compact] CSS) but still paid ~3 getDashboardMetrics
  // RPCs per launch — and again on every ≥20s focus wake once the 60s SWR
  // lapsed — for UI that can never be seen. The pinned-all-shift pop-out is
  // exactly the window that multiplied the waste (deployer-account quota).
  if (typeof COMPACT_MODE !== 'undefined' && COMPACT_MODE) return;
  CLK_DASH.isMgr = !!isMgr;
  var host = document.getElementById('dash-cards');
  if (!host) return;
  var today = isoDateTz(empTz());
  var need = CLK_DASH_PERIODS.length;
  var hasCache = CLK_DASH.data && Object.keys(CLK_DASH.data).length >= need && CLK_DASH.loadedDay === today;
  // Cache present → paint it instantly (replaces the loader renderClockView just
  // set, in the SAME tick, so nothing flashes). Skip the refetch when it's fresh.
  if (hasCache) {
    clkRenderDashboard_();
    if (Date.now() - (CLK_DASH.loadedAt || 0) < CLK_DASH_FRESH_MS) return;
  } else {
    CLK_DASH.mine = 0; CLK_DASH.team = 0;   // first load (or new day) → reset carousels
  }
  var requestedView = currentView, got = {}, done = 0, anyFail = false;
  var finish = function (pk, res) {
    var ok = !!(res && !res.error);
    // D2a (cycle 10): a failed refetch keeps the LAST-GOOD payload for that
    // period instead of overwriting it with null (which rendered the
    // authoritative-sounding "No call data for this period.").
    got[pk] = ok ? res : ((CLK_DASH.data && CLK_DASH.data[pk]) || null);
    if (!ok) anyFail = true;
    if (++done < need || currentView !== requestedView) return;
    CLK_DASH.data = got; CLK_DASH.loadedDay = today;
    // D2a: never stamp a failed round as FRESH — the old stamp cached the
    // failure for the full 60s window (re-renders early-return on fresh), so
    // a transient blip read as confident no-data. A stale stamp makes the
    // next re-render (focus / nav-back) retry quietly.
    CLK_DASH.loadedAt = anyFail ? 0 : Date.now();
    clkRenderDashboard_();   // background swap (or first paint); no loader either way
  };
  CLK_DASH_PERIODS.forEach(function (pk) {
    google.script.run
      .withSuccessHandler(function (res) { finish(pk, res); })
      .withFailureHandler(function () { finish(pk, null); })
      .getDashboardMetrics(pk);
  });
}

// ── Carousel height-fit ──────────────────────────────────────────────────────
// Each carousel viewport (.dash-vp) clips a flex track of equal-width slides, so
// without help it'd take the TALLEST slide's height (a sparse active slide then
// shows with a gap under it). Pin the viewport to the ACTIVE slide's height —
// after each render (rAF, so slides have laid out), on every period switch, and
// on resize (the KPI row wraps). Skip when hidden (offsetHeight 0 — e.g. in-page
// compact / pop-out) so we never pin 0px and strand the viewport collapsed.
var _dashFitBound = false;
function clkDashFit_(key) {
  var trk = document.getElementById('dash-trk-' + key);
  if (!trk) return;
  var active = trk.children[CLK_DASH[key] || 0];
  if (active && active.offsetHeight) trk.parentElement.style.height = active.offsetHeight + 'px';
}
function clkDashFitAll_() { ['mine', 'team'].forEach(clkDashFit_); }   // extras are static 2-up cards now (no carousel)
function clkBindDashFit_() {
  if (_dashFitBound) return;
  _dashFitBound = true;
  window.addEventListener('resize', clkDashFitAll_);   // no-op off the dashboard (fit guards on the track)
}

function clkRenderDashboard_() {
  var host = document.getElementById('dash-cards');
  if (!host) return;
  host.innerHTML =
    '<div class="dash-pair">' +
      clkDashCarouselHtml_('mine', 'Your numbers') +
      clkDashCarouselHtml_('team', CLK_DASH.isMgr ? 'Department' : 'Team') +
    '</div>' +
    '<div id="dash-extra"></div>';
  clkBindDashFit_();
  requestAnimationFrame(clkDashFitAll_);   // fit mine/team once laid out (sw fits when its extras render)
  clkLoadDashboardExtras_();   // manager Spanish↔Requests switcher / Spanish-rep card
}

/** One carousel: a segmented chip (period selector) + a clipped track of 3 slides. */
function clkDashCarouselHtml_(key, title) {
  var i = CLK_DASH[key] || 0;
  var slides = CLK_DASH_PERIODS.map(function (pk) {
    var res = CLK_DASH.data[pk];
    var card = (key === 'mine') ? clkDashOwnCard_(res) : clkDashTeamCard_(res);
    return '<div class="dash-sld">' + card + '</div>';
  }).join('');
  return '<div class="dash-card">' +
    '<div class="dash-card-head"><h2 class="dash-seclabel">' + esc(title) + '</h2>' + clkDashSegHtml_(key) + '</div>' +
    '<div class="dash-vp"><div class="dash-trk" id="dash-trk-' + key + '" style="transform:translateX(-' + (i * 100) + '%)">' + slides + '</div></div>' +
  '</div>';
}

/** Sliding segmented chip — an absolutely-positioned highlight pill moved by
 *  translateX, one clickable label per option. `labels` defaults to the period
 *  set (Yesterday/MTD/YTD); the Spanish↔Requests switcher passes its own. */
function clkDashSegHtml_(key, labels) {
  labels = labels || CLK_DASH_LABELS;
  var i = CLK_DASH[key] || 0, n = labels.length;
  var w = 'calc((100% - 6px) / ' + n + ')';
  // A1: keyboard-reachable <button>. A11: aria-pressed carries the active
  // state — the `.on` class alone is invisible to assistive tech, so a screen
  // reader could not tell which period was showing.
  var html = labels.map(function (lbl, idx) {
    return '<button type="button" class="dash-seg-opt' + (idx === i ? ' on' : '') +
      '" aria-pressed="' + (idx === i ? 'true' : 'false') +
      '" onclick="clkDashSet_(\'' + key + '\',' + idx + ')">' + esc(lbl) + '</button>';
  }).join('');
  return '<div class="dash-seg" role="group" aria-label="Period">' +
    '<div class="dash-seg-hi" style="width:' + w + ';transform:translateX(' + (i * 100) + '%)"></div>' + html + '</div>';
}

/** Switch a carousel to period index — transform-only (track + highlight); no
 *  re-render so it stays cheap on the Apps Script webview. */
function clkDashSet_(key, idx) {
  CLK_DASH[key] = idx;
  var trk = document.getElementById('dash-trk-' + key);
  if (trk) trk.style.transform = 'translateX(-' + (idx * 100) + '%)';
  var card = trk && trk.closest('.dash-card');
  var seg = card && card.querySelector('.dash-seg');
  if (seg) {
    var hi = seg.querySelector('.dash-seg-hi');
    if (hi) hi.style.transform = 'translateX(' + (idx * 100) + '%)';
    // A11: keep aria-pressed in step with the `.on` class on every switch.
    seg.querySelectorAll('.dash-seg-opt').forEach(function (o, j) {
      o.classList.toggle('on', j === idx);
      o.setAttribute('aria-pressed', j === idx ? 'true' : 'false');
    });
  }
  clkDashFit_(key);   // re-fit the viewport to the newly-active slide
}

function clkDashKpi_(label, val, big) {
  return '<div class="dash-kpi' + (big ? ' dash-kpi-big' : '') + '">' +
    '<div class="dash-kpi-v tabular">' + esc(String(val)) + '</div>' +
    '<div class="dash-kpi-l">' + esc(label) + '</div></div>';
}
function clkDashEmpty_(res) {
  return '<div class="dash-empty">No call data for ' + esc((res && res.label) || 'this period') + '.</div>';
}
/** Pure (Node-pinned) — run-rate projection of a period-to-date COUNT to the
 *  period end, from the aggregate + elapsed fraction. Returns null for the
 *  'yesterday' period, a null value, < 3 elapsed days (too early to project),
 *  or a complete period. Rates (pct) are NOT projected — only volumes. */
function dashProjection_(value, fromIso, toIso, periodKey) {
  if ((periodKey !== 'mtd' && periodKey !== 'ytd') || value == null ||
      !/^\d{4}-\d{2}-\d{2}$/.test(String(fromIso)) || !/^\d{4}-\d{2}-\d{2}$/.test(String(toIso))) return null;
  var elapsed = Math.round((Date.parse(toIso + 'T00:00:00Z') - Date.parse(fromIso + 'T00:00:00Z')) / 86400000) + 1;
  if (elapsed < 3) return null;
  var y = +toIso.slice(0, 4), total, endLabel;
  if (periodKey === 'mtd') {
    var m = +toIso.slice(5, 7);
    total = new Date(Date.UTC(y, m, 0)).getUTCDate();   // last day-of-month
    endLabel = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m - 1] + ' ' + total;
  } else {
    total = ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365;
    endLabel = 'Dec 31';
  }
  if (elapsed >= total) return null;
  return { projected: Math.round(value * (total / elapsed)), elapsed: elapsed, total: total, endLabel: endLabel };
}

function clkDashOwnCard_(res) {
  if (!res || !res.own) return clkDashEmpty_(res);
  var o = res.own;
  var kpis = '<div class="dash-kpis">' +
    clkDashKpi_('Transfer %', o.transferPct != null ? o.transferPct + '%' : '—', true) +
    clkDashKpi_('% Answered', o.pctAnswered != null ? o.pctAnswered + '%' : '—') +
    clkDashKpi_('Answered', o.answered != null ? o.answered : '—') +
    clkDashKpi_('Missed', o.missed != null ? o.missed : '—') +
    clkDashKpi_('Avg talk', o.attFormatted || '—') +
  '</div>';
  var foot = '<div class="dash-card-foot mono">' + esc(res.label) + (o.calls != null ? ' · ' + o.calls + ' calls' : '') + '</div>';
  // Run-rate projection (MTD/YTD only, ≥3 days elapsed) — a client calc on the
  // aggregate. The full daily "cone" chart would need a series in the endpoint.
  var proj = dashProjection_(o.answered, res.from, res.to, res.periodKey);
  var projHtml = proj ? '<div class="dash-proj mono">' + icon('chart', 11) +
    ' On pace for ~' + proj.projected + ' answered by ' + esc(proj.endLabel) + '</div>' : '';
  return kpis + foot + projHtml;
}
function clkDashTeamCard_(res) {
  if (!res) return clkDashEmpty_(res);
  if (!res.team) return '<div class="dash-empty">Team data hidden — fewer than ' + (res.kpiMinCohort || 3) + ' reps reported this period.</div>';
  var t = res.team;
  var kpis = '<div class="dash-kpis">' +
    clkDashKpi_('Transfer %', t.transferPct != null ? t.transferPct + '%' : '—', true) +
    clkDashKpi_('% Answered', t.pctAnswered != null ? t.pctAnswered + '%' : '—') +
    clkDashKpi_('Answered', t.answered != null ? t.answered : '—') +
    clkDashKpi_('Missed', t.missed != null ? t.missed : '—') +
  '</div><div class="dash-card-foot mono">' + esc(res.label) + ' · ' + (res.cohort || 0) + ' reps</div>';
  var proj = dashProjection_(t.answered, res.from, res.to, res.periodKey);
  return kpis + (proj ? '<div class="dash-proj mono">' + icon('chart', 11) +
    ' On pace for ~' + proj.projected + ' answered by ' + esc(proj.endLabel) + '</div>' : '');
}

// ── Manager Spanish↔Requests switcher / Spanish-rep card (dashboard extras) ──
function clkLoadDashboardExtras_() {
  // F(cycle-8 M-12): same compact gate as clkLoadDashboard_ — the extras row
  // is inside the hidden #dash-cards column in the pop-out.
  if (typeof COMPACT_MODE !== 'undefined' && COMPACT_MODE) return;
  var host = document.getElementById('dash-extra');
  if (!host) return;
  var canSp = !!(empState && empState.canSeeSpanish);
  var today = isoDateTz(empTz());
  // SWR (same as the metrics): paint cached extras instantly, refetch only when
  // stale — so a focus-driven re-render never flashes the loader.
  var hasCache = CLK_DASH.extra && CLK_DASH.extraDay === today;
  if (hasCache) clkRenderDashboardExtras_();
  if (hasCache && Date.now() - (CLK_DASH.extraAt || 0) < CLK_DASH_FRESH_MS) return;
  if (!hasCache) {
    CLK_DASH.extra = { spanish: undefined, requests: undefined, spanishPending: undefined, training: undefined };
    CLK_DASH.spIdx = 0;
  }
  // D2a (cycle 10): stamp the DAY at request time but freshness only on a
  // SUCCESS — the old request-time extraAt stamp cached error placeholders as
  // fresh for the full 60s window. On a failed refetch the prior good card
  // stays (only a cold miss shows the error placeholder), and the stale
  // stamp makes the next enter retry.
  CLK_DASH.extraDay = today;
  var requestedView = currentView;
  var render = function () { if (currentView === requestedView) clkRenderDashboardExtras_(); };
  // C17-15 (cycle 17) — freshness is stamped ONLY when the WHOLE round
  // succeeded (INV-156/129: an SWR cache never stamps a failed round fresh).
  // The old per-RPC fresh() stamped on EACH success, so a mixed round (dept
  // requests ok, training failed on a cold miss) cached the error placeholder
  // as fresh for the full 60s window and the next enter early-returned
  // without a retry — the D2a comment's claim held only when ALL fetches
  // failed. Same shape as the metrics loader's anyFail -> loadedAt=0.
  var expected = canSp ? 3 : 2;
  var anyFail = false;
  var settle = function () { if (--expected === 0 && !anyFail) CLK_DASH.extraAt = Date.now(); };
  var fresh = function () { settle(); };
  var failSet = function (key, val) {   // keep last-good; placeholder only on a cold miss
    anyFail = true; settle();
    if (CLK_DASH.extra[key] === undefined) CLK_DASH.extra[key] = val;
  };
  if (!hasCache) render();   // loading shell on first load; refresh swaps silently
  if (canSp) {
    google.script.run
      .withSuccessHandler(function (r) { CLK_DASH.extra.spanish = r || { error: 'No data' }; fresh(); render(); })
      .withFailureHandler(function () { failSet('spanish', { error: 'Spanish inbox unavailable' }); render(); })

      .withSuccessHandler(function (r) { CLK_DASH.extra.spanishPending = (r && r.pending) ? r : { pending: [] }; fresh(); render(); })

  google.script.run
    .withSuccessHandler(function (r) { CLK_DASH.extra.requests = r || { error: 'No data' }; fresh(); render(); })
    .withFailureHandler(function () { failSet('requests', { error: 'Dept requests unavailable' }); render(); })

/** Computes "worked", "lunch", "since" stats from today's punches.
 *  Returns null if no punches yet. State machine walks ClockIn/LunchOut/
 *  LunchIn/ClockOut transitions and sums in-state durations, with the
 *  final open session extending to "now". Shift-end is anchored to the
 *  first ClockIn + 9h (per C3 — no per-rep schedule data exists yet,
 *  and CSR agents are nearly all 8a–5p CST). */
function computeShiftStats_(punches, tz) {
  if (!punches || punches.length === 0) return null;
  const toMin = (hms) => {
    const p = String(hms).split(':');
    return (parseInt(p[0],10)||0) * 60 + (parseInt(p[1],10)||0) + (parseInt(p[2],10)||0)/60;
  };
  const firstClockIn = punches.find(p => p.type === 'ClockIn');
  if (!firstClockIn) return null;
  const nowMin = toMin(liveTimeHmsTz(tz));

  let workedMin = 0, lunchMin = 0;
  let state = 'out';
  let stateSince = null;

  for (const p of punches) {
    const t = toMin(p.time);
    if (stateSince !== null) {
      const dur = Math.max(0, t - stateSince);
      if (state === 'working') workedMin += dur;
      else if (state === 'lunch') lunchMin += dur;
    }
    if (p.type === 'ClockIn' || p.type === 'LunchIn') { state = 'working'; stateSince = t; }
    else if (p.type === 'LunchOut') { state = 'lunch'; stateSince = t; }
    else if (p.type === 'ClockOut') { state = 'out'; stateSince = null; }
  }
  if (stateSince !== null) {
    const dur = Math.max(0, nowMin - stateSince);
    if (state === 'working') workedMin += dur;
    else if (state === 'lunch') lunchMin += dur;
  }

  let clockedInSince = null;
  if (state === 'working' || state === 'lunch') {
    const ins = punches.filter(p => p.type === 'ClockIn' || p.type === 'LunchIn');
    clockedInSince = ins.length ? ins[ins.length - 1].time : firstClockIn.time;
  }

  const firstInMin = toMin(firstClockIn.time);
  const shiftEndMin = firstInMin + clkSchedLenMin_();
  const fmtClk = (mm) => {
    const total = ((mm % 1440) + 1440) % 1440;
    const h = Math.floor(total / 60), m = Math.floor(total % 60);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  };

  return {
    state,
    clockedInSince,
    workedHM: { h: Math.floor(workedMin / 60), m: Math.floor(workedMin % 60) },
    workedHours: workedMin / 60,
    lunchMinutes: Math.round(lunchMin),
    shiftEndTime: fmtClk(shiftEndMin),
    minutesUntilShiftEnd: shiftEndMin - nowMin,
  };
}

function buildStatusSentence_(stats, nextActions, tzAbbr) {
  if (!stats) {
    return `You haven't clocked in yet — tap <strong>Clock In</strong> to start your day.`;
  }
  const tzSuffix = tzAbbr ? ` ${esc(tzAbbr)}` : '';
  const workedStr = `<strong>${stats.workedHM.h}h ${stats.workedHM.m}m</strong> worked today`;
  const lunchStr = stats.lunchMinutes > 0 ? ` · <strong>${stats.lunchMinutes}m</strong> lunch` : '';

  if (stats.state === 'out') {
    return `Shift complete · ${workedStr}${lunchStr}.`;
  }
  const stateLabel = stats.state === 'lunch' ? 'on lunch since' : 'clocked in since';
  const since = stats.clockedInSince ? `<strong>${dispTime(stats.clockedInSince)}${tzSuffix}</strong>` : '—';

  let endStr = '';
  if (stats.minutesUntilShiftEnd > 0) {
    const eh = Math.floor(stats.minutesUntilShiftEnd / 60);
    const em = Math.floor(stats.minutesUntilShiftEnd % 60);
    endStr = ` · <strong>${eh}h ${em}m</strong> until end of shift`;
  } else if (stats.minutesUntilShiftEnd < 0) {
    const over = Math.abs(stats.minutesUntilShiftEnd);
    const oh = Math.floor(over / 60), om = Math.floor(over % 60);
    endStr = ` · <strong>${oh}h ${om}m</strong> past end of shift`;
  }
  return `You're ${stateLabel} ${since}. ${workedStr}${lunchStr}${endStr}.`;
}

// ── Sky gradient + timezone selector (#5a) ──────────────────────────────────
// The big clock card carries a time-of-day gradient that recomputes from the
// DISPLAYED tz's current hour (default = the rep's roster tz; the pill lets them
// preview any world-clock zone). Driven off the existing 1Hz startClock tick;
// the gradient only repaints when the displayed hour changes.
let CLK_DISPLAY_TZ = null;
let _clkLastSkyHour = -1;
let _clkLastDay = null;   // rep-tz date last rendered — drives the day-rollover refresh

function tzSelectHtml_(repTz, repAbbr) {
  const zones = [{ label: repAbbr || 'Local', tz: repTz }];

    zones.map(function (z) {

function clkBindTzSelect_() {

  });
}
function clkDisplayHour_() {
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: CLK_DISPLAY_TZ || empTz(), hour: 'numeric', hour12: false }).formatToParts(new Date());
  let h = 0; parts.forEach(function (p) { if (p.type === 'hour') h = parseInt(p.value, 10) || 0; });
  return h % 24;
}
/** Time-of-day gradient + phase label/glyph for an hour. Decorative hexes (no
 *  token equivalent — the CN_EMAIL_PALETTE inline-hex precedent).
 *  Night sub-phases (operator picks a+b+d, 2026-07-10): overnight-local teams
 *  (IST) used to sit in one flat "Night" for nearly the whole shift. The night
 *  now walks Dusk → Nightfall → Midnight → Late night → Pre-dawn, each with
 *  its own gradient and a `stars` density (0–3) that drives the twinkling
 *  star field + moon rendered by clkSkyDecor_. Node-pinned. */
function clkSkyFor_(h) {
  if (h >= 5 && h < 8)   return { grad: 'linear-gradient(135deg,#e8835a,#f6c177)', phase: 'Sunrise',       glyph: 'sun',  stars: 0 };
  if (h >= 8 && h < 12)  return { grad: 'linear-gradient(135deg,#4a89c8,#9ec9e8)', phase: 'Morning',       glyph: 'sun',  stars: 0 };
  if (h >= 12 && h < 17) return { grad: 'linear-gradient(135deg,#3f78c0,#f0c674)', phase: 'Mid-afternoon', glyph: 'sun',  stars: 0 };
  if (h >= 17 && h < 20) return { grad: 'linear-gradient(135deg,#6a4a8c,#e0916a)', phase: 'Dusk',          glyph: 'moon', stars: 1 };
  if (h >= 20 && h < 23) return { grad: 'linear-gradient(135deg,#2b3163,#54406e)', phase: 'Nightfall',     glyph: 'moon', stars: 2 };
  if (h >= 23 || h < 2)  return { grad: 'linear-gradient(135deg,#141a36,#2c2452)', phase: 'Midnight',      glyph: 'moon', stars: 3 };
  if (h >= 2 && h < 4)   return { grad: 'linear-gradient(135deg,#1a2144,#3b2d5c)', phase: 'Late night',    glyph: 'moon', stars: 3 };
  return { grad: 'linear-gradient(135deg,#232a52,#7a4a63)', phase: 'Pre-dawn', glyph: 'moon', stars: 1 };   // 4–5
}

/** (d) Real lunar phase — days since a reference new moon (2000-01-06 18:14
 *  UTC) mod the synodic month. Returns { frac (0 = new → .5 = full), octant
 *  0–7, name }. Self-contained + pure (Node-pinned); decorative accuracy
 *  (±hours) is plenty for a 30px moon. */
function clkMoonPhase_(ms) {
  var NAMES = ['New Moon', 'Waxing Crescent', 'First Quarter', 'Waxing Gibbous',
               'Full Moon', 'Waning Gibbous', 'Last Quarter', 'Waning Crescent'];
  var SYNODIC = 29.530588853 * 86400000;
  var ref = Date.UTC(2000, 0, 6, 18, 14);
  var frac = (((ms - ref) % SYNODIC + SYNODIC) % SYNODIC) / SYNODIC;
  var octant = Math.floor(frac * 8 + 0.5) % 8;
  return { frac: frac, octant: octant, name: NAMES[octant] };
}
// Two-circle moon rendering: the dark shade disc slides by octant to carve the
// lit shape (negative = waxing reveals the right limb, positive = waning).
var CLK_MOON_SHADE = ['0%', '-32%', '-52%', '-74%', '-102%', '74%', '52%', '32%'];

/** (b)+(d) — star field + moon. Lives INSIDE .clk-sky-layers, so a set
 *  background photo (.has-bg hides the layers) hides the decor with it, and
 *  everything sits under the z-1 card content. Star positions are
 *  deterministic (index-hashed), so re-renders never scatter them; the
 *  twinkle keyframes are neutralized by the global reduced-motion block. */
var _clkLastStarDensity = -1;
function clkSkyDecor_(sky) {
  var host = document.querySelector('#clk-sky .clk-sky-layers');
  if (!host) return;
  var deco = document.getElementById('clk-sky-deco');
  if (!deco) {
    deco = document.createElement('div');
    deco.id = 'clk-sky-deco';
    deco.className = 'clk-stars';
    host.appendChild(deco);
    _clkLastStarDensity = -1;   // fresh card — force a rebuild
  }
  var density = sky.stars || 0;
  if (density === _clkLastStarDensity) return;
  _clkLastStarDensity = density;
  var counts = [0, 9, 16, 26];
  var n = counts[density] || 0;
  var html = '';
  for (var i = 0; i < n; i++) {
    var left = (i * 37 + 13) % 100;
    var top = (i * 53 + 7) % 88;
    html += '<span class="st' + (i % 5 === 0 ? ' big' : '') + '" style="left:' + left + '%;top:' + top +
      '%;animation-delay:' + ((i % 7) * 0.55).toFixed(2) + 's;animation-duration:' + (2.8 + (i % 4) * 0.7).toFixed(1) + 's"></span>';
  }
  if (density > 0) {
    var moon = clkMoonPhase_(Date.now());
    html += '<span class="clk-moon" title="' + esc(moon.name) + '" aria-label="' + esc(moon.name) + '">' +
      '<span class="shade" style="transform:translateX(' + CLK_MOON_SHADE[moon.octant] + ')"></span></span>';
  }
  deco.innerHTML = html;
}

/** (b) Shooting star — the mid-shift marker: fires only in deep night
 *  (density ≥ 2), only after the rep-local shift midpoint, every ~2.5–4.5 min
 *  from the 1Hz tick (a cheap ms compare per second). Skipped under
 *  prefers-reduced-motion (a non-animating streak would just linger) and when
 *  a background photo replaces the sky. Purely decorative — every guard
 *  degrades to "no streak". */
var _clkNextShootAt = 0;
function clkShootMaybe_() {
  if (_clkLastStarDensity < 2) return;
  var now = Date.now();
  if (!_clkNextShootAt) { _clkNextShootAt = now + 20000 + Math.random() * 40000; return; }
  if (now < _clkNextShootAt) return;
  _clkNextShootAt = now + 150000 + Math.random() * 120000;
  try { if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  var hero = document.getElementById('clk-hero');
  if (hero && hero.classList.contains('has-bg')) return;   // photo replaces the sky
  // After the rep-local shift midpoint only (the operator's "after mid-shift").
  try {
    var start = (typeof clkSchedStartMin_ === 'function') ? clkSchedStartMin_() : 480;
    var len = (typeof clkSchedLenMin_ === 'function') ? clkSchedLenMin_() : 540;
    var parts = new Intl.DateTimeFormat('en-US', { timeZone: empTz(), hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date());
    var hh = 0, mm = 0;
    parts.forEach(function (x) {
      if (x.type === 'hour') hh = parseInt(x.value, 10) || 0;
      if (x.type === 'minute') mm = parseInt(x.value, 10) || 0;
    });
    if (((hh % 24) * 60 + mm) < start + len / 2) return;
  } catch (e) { return; }
  var deco = document.getElementById('clk-sky-deco');
  if (!deco) return;
  var s = document.createElement('span');
  s.className = 'clk-shoot';
  s.style.left = (35 + Math.random() * 55) + '%';
  s.style.top = (5 + Math.random() * 30) + '%';
  deco.appendChild(s);
  setTimeout(function () { try { s.remove(); } catch (e) {} }, 1600);
}

function clkApplySky_(force) {
  const card = document.getElementById('clk-sky');
  if (!card) return;
  const h = clkDisplayHour_();
  if (!force && h === _clkLastSkyHour) return;
  _clkLastSkyHour = h;
  const sky = clkSkyFor_(h);
  // §10 cross-fade — paint the inactive layer with the new gradient, then toggle
  // .on so the sky dissolves between phases. Falls back to a flat card bg if the
  // layers aren't present (e.g. an older cached render).
  const a = document.getElementById('clk-sky-a');
  const b = document.getElementById('clk-sky-b');
  if (a && b) {
    const incoming = a.classList.contains('on') ? b : a;
    const outgoing = incoming === a ? b : a;
    incoming.style.background = sky.grad;
    incoming.classList.add('on');
    outgoing.classList.remove('on');
  } else {
    card.style.background = sky.grad;
  }
  clkSkyDecor_(sky);   // (b)+(d) stars + moon (no-op when the density is unchanged)
  const ph = document.getElementById('clk-phase');
  if (ph) ph.innerHTML = icon(sky.glyph, 12) + ' ' + esc(sky.phase.toUpperCase());
}

// ── Clock-card background image (per-browser, opt-in, "for fun") ───────────────
// Stored as a downscaled raster data-URL in localStorage['umsClockBg'] — NEVER
// server-side, so any accidental PHI stays in this browser and it adds zero
// operator state. Applied as the GREETING (hero) CARD background — behind both
// the greeting text and the clock tile, which keeps its own sky gradient; a dark
// scrim is baked into the image (clkBgApply_) so the greeting text stays legible.
var CLK_BG_KEY = 'umsClockBg';
var CLK_BG_MAX_CHARS = 1500000;                                  // ~1.1MB data-URL cap (localStorage-safe)
var CLK_BG_TYPES = { 'image/png': 1, 'image/jpeg': 1, 'image/webp': 1 };   // raster only — no SVG (script-capable)

function clkBgGet_() { try { return localStorage.getItem(CLK_BG_KEY) || ''; } catch (e) { return ''; } }

function clkBgApply_() {
  var hero = document.getElementById('clk-hero'); if (!hero) return;
  var bgEl = document.getElementById('clk-hero-bg');
  var clearBtn = document.getElementById('clk-bg-clear');
  var data = clkBgGet_();
  if (data && bgEl) {
    // Bake a time-of-day-independent dark scrim over the image for legibility.
    bgEl.style.backgroundImage = 'linear-gradient(rgba(12,18,38,.30), rgba(12,18,38,.46)), url("' + data + '")';
    hero.classList.add('has-bg');

    if (bgEl) bgEl.style.backgroundImage = '';
    hero.classList.remove('has-bg');

function clkBgChoose_(ev) { if (ev) ev.stopPropagation(); var i = document.getElementById('clk-bg-input'); if (i) i.click(); }

function clkBgClear_(ev) {
  if (ev) ev.stopPropagation();
  try { localStorage.removeItem(CLK_BG_KEY); } catch (e) {}
  clkBgApply_();
  if (typeof showToast === 'function') showToast('Background cleared', 'toast-info');
}

function clkBgOnFile_(input) {
  var file = input && input.files && input.files[0];
  if (input) input.value = '';                                  // allow re-picking the same file later
  if (!file) return;
  if (!CLK_BG_TYPES[file.type]) { if (typeof showToast === 'function') showToast('Use a PNG, JPEG, or WebP image', 'toast-error'); return; }
  clkBgDownscale_(file, function (dataUrl) {
    if (!dataUrl) { if (typeof showToast === 'function') showToast('Could not read that image', 'toast-error'); return; }
    if (dataUrl.length > CLK_BG_MAX_CHARS) { if (typeof showToast === 'function') showToast('That image is still too large after resizing — try a smaller one', 'toast-error'); return; }
    try { localStorage.setItem(CLK_BG_KEY, dataUrl); }
    catch (e) { if (typeof showToast === 'function') showToast('Couldn’t save the background (browser storage is full)', 'toast-error'); return; }
    clkBgApply_();
    if (typeof showToast === 'function') showToast('Background set (this browser only)', 'toast-success');
  });
}

// Downscale to ≤ maxW wide via canvas + re-encode as JPEG so the stored data-URL
// stays small (a raw phone photo would blow the localStorage quota / slow boot).
function clkBgDownscale_(file, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      try {
        var maxW = 1280;
        var scale = Math.min(1, maxW / (img.width || maxW));
        var w = Math.max(1, Math.round((img.width || maxW) * scale));
        var h = Math.max(1, Math.round((img.height || maxW) * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.82));
      } catch (e) { cb(null); }
    };
    img.onerror = function () { cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/** Render the big time in the displayed tz (extracted from startClock so the
 *  tz-pill change can refresh it without waiting for the next tick). */
function clkTickTime_() {
  const el = document.getElementById('live-time');
  if (!el) return;
  const raw = liveTimeTz(CLK_DISPLAY_TZ || empTz());
  const m = raw.match(/^(.*?)\s*(AM|PM)$/i);
  if (m) { el.innerHTML = esc(m[1]) + '<span class="ampm">' + esc(m[2]) + '</span>'; }
  else { el.textContent = raw; }
}

/** C2 — note-volume histogram behind the ribbon. Buckets are server-computed by
 *  rep-local hour (getMyNoteHourBuckets — the note Timestamp is stored in the
 *  rep's tz, so the hour aligns with the ribbon's 6a–10p axis). Its own endpoint
 *  (not getMyCallNotes) keeps the Clock view's hot path to one extra bounded
 *  read. Best-effort; the histogram is simply absent on failure. */
// F6 — last-good buckets keyed by day so a focus re-render paints the histogram
// instantly instead of blanking it until the refetch lands. SWR: refetch in the
// background to pick up notes logged elsewhere; reset on day change.
var CLK_NOTEVOL_CACHE = { day: '', buckets: null };
function clkRenderNoteVolume_(buckets) {
  const hist = document.getElementById('ribbon-hist');
  if (!hist || !buckets) return;
  const max = Math.max(1, Math.max.apply(null, buckets));
  let html = '';
  for (let h = 0; h < 24; h++) {
    if (!buckets[h]) continue;
    const mid = h * 60 + 30;
    if (mid < RIBBON_START_MIN || mid > RIBBON_END_MIN) continue;
    const ht = Math.max(4, Math.round((buckets[h] / max) * 100));
    html += '<div class="hbar" style="left:' + ribbonPct_(mid).toFixed(2) + '%;height:' + ht + '%" title="' +
      esc(buckets[h] + ' note' + (buckets[h] === 1 ? '' : 's') + ' · ' + ribbonFormatHm_(h * 60)) + '"></div>';
  }
  hist.innerHTML = html;
}
function clkLoadNoteVolume_() {
  const today = isoDateTz(empTz());
  if (CLK_NOTEVOL_CACHE.day === today && CLK_NOTEVOL_CACHE.buckets) clkRenderNoteVolume_(CLK_NOTEVOL_CACHE.buckets);
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== 'clock') return;
      if (!res || res.error || !res.buckets) return;
      CLK_NOTEVOL_CACHE.day = today;
      CLK_NOTEVOL_CACHE.buckets = res.buckets;
      clkRenderNoteVolume_(res.buckets);
    })
    .withFailureHandler(function () {})
    .getMyNoteHourBuckets(today);
}

// ── DAY RIBBON (V4·E1) ─────────────────────────────────────────────────
// Horizontal time-of-day ribbon spanning 06:00–22:00. Renders the rep's
// scheduled shift (dashed band, default 8a–5p CST per C3 or anchored to
// first ClockIn + 9h once they've clocked in) and their actual work +
// lunch segments. Punch markers + a pulsing now-cursor complete the
// picture. The now-cursor is refreshed every 60s by RIBBON_NOW_INTERVAL.
const RIBBON_START_MIN = 6 * 60;    // 06:00 → 360
const RIBBON_END_MIN   = 22 * 60;   // 22:00 → 1320
const RIBBON_SPAN_MIN  = RIBBON_END_MIN - RIBBON_START_MIN;  // 960
const RIBBON_DEFAULT_SHIFT_START = 8 * 60;   // 08:00 — default CST shift start (C3)
const RIBBON_DEFAULT_SHIFT_LEN   = 9 * 60;   // 9h

// Resolved shift schedule { startMin, lengthMin } from getEmployeeState
// (CONFIG.SHIFT_SCHEDULE, per-tz). Set by renderClockView; null until then,
// in which case the RIBBON_DEFAULT_* constants apply.
let CLK_SCHEDULE = null;
function clkSchedStartMin_() { return (CLK_SCHEDULE && typeof CLK_SCHEDULE.startMin === 'number') ? CLK_SCHEDULE.startMin : RIBBON_DEFAULT_SHIFT_START; }
function clkSchedLenMin_()   { return (CLK_SCHEDULE && typeof CLK_SCHEDULE.lengthMin === 'number') ? CLK_SCHEDULE.lengthMin : RIBBON_DEFAULT_SHIFT_LEN; }

// Clock-view world-clock strip (item 5): US customer-service regions + the
// rep's own offshore tz (IST/PHT) when it isn't already a US zone. Pure
// client-side Intl.DateTimeFormat — no server cost. Formatters are cached
// (built once per render) so the per-second tick doesn't reconstruct them.
const CLK_REGION_ZONES = [
  { label: 'ET',  tz: 'America/New_York' },
  { label: 'CT',  tz: 'America/Chicago' },
  { label: 'PT',  tz: 'America/Los_Angeles' },
  { label: 'HST', tz: 'Pacific/Honolulu' },
  { label: 'IST', tz: 'Asia/Kolkata' },   // offshore team zones — always listed
  { label: 'PHT', tz: 'Asia/Manila' },
];
let CLK_REGION_FMTS = [];
// Rotation state — the strip shows ONE non-displayed zone at a time and cycles,
// instead of listing them all (declutter). Reset per render in clkBuildRegionFmts_.
const CLK_REGION_ROTATE_MS = 4500;
let _clkRegionIdx = -1;
let _clkRegionRotateAt = 0;
function clkBuildRegionFmts_(repTz, repAbbr) {
  const zones = CLK_REGION_ZONES.slice();
  if (repTz && !zones.some(function (z) { return z.tz === repTz; })) {
    zones.unshift({ label: repAbbr || 'Local', tz: repTz });   // offshore reps see their own tz first
  }
  CLK_REGION_FMTS = zones.map(function (z) {
    let fmt = null;
    try { fmt = new Intl.DateTimeFormat('en-US', { timeZone: z.tz, hour: 'numeric', minute: '2-digit' }); }
    catch (e) { fmt = null; }   // unknown tz → drop
    return { label: z.label, tz: z.tz, fmt: fmt };
  }).filter(function (z) { return z.fmt; });
  _clkRegionIdx = -1; _clkRegionRotateAt = 0;   // restart the rotation on each render
}
// Zones eligible for rotation = all formatted zones EXCEPT the one currently in
// the big clock (that tz is already the headline).
function clkRotationZones_() {
  const disp = (typeof CLK_DISPLAY_TZ !== 'undefined' && CLK_DISPLAY_TZ) ? CLK_DISPLAY_TZ : empTz();
  return CLK_REGION_FMTS.filter(function (z) { return z.tz !== disp; });
}
// 1Hz tick: keep the displayed zone's time live, and slide to the next zone every
// CLK_REGION_ROTATE_MS. Re-renders the element (to animate) only on a rotation step;
// otherwise it just updates the minute in place.
function clkUpdateRegions_() {
  const host = document.getElementById('clk-regions');
  if (!host) return;
  const zones = clkRotationZones_();
  if (!zones.length) { host.innerHTML = ''; return; }
  const now = Date.now();
  let rotate = (now >= _clkRegionRotateAt);
  if (_clkRegionIdx < 0 || _clkRegionIdx >= zones.length) { _clkRegionIdx = 0; rotate = true; }
  else if (rotate) { _clkRegionIdx = (_clkRegionIdx + 1) % zones.length; }
  if (rotate) _clkRegionRotateAt = now + CLK_REGION_ROTATE_MS;
  const z = zones[_clkRegionIdx];
  const timeStr = z.fmt.format(new Date());
  const timeEl = host.querySelector('.clk-region-time');
  if (rotate || !timeEl) {
    host.innerHTML = '<span class="clk-region clk-region-rot">' +
      '<b>' + esc(z.label) + '</b> <span class="clk-region-time">' + esc(timeStr) + '</span></span>';
  } else {
    timeEl.textContent = timeStr;   // same zone, just tick the minute — no re-animate
  }

function ribbonPct_(min) {
  if (typeof min !== 'number' || isNaN(min)) return 0;
  return Math.max(0, Math.min(100, ((min - RIBBON_START_MIN) / RIBBON_SPAN_MIN) * 100));
}
function ribbonTimeToMin_(hms) {
  const p = String(hms || '').split(':');
  if (p.length < 2) return NaN;

}
function ribbonFormatHm_(min) {
  const total = ((min % 1440) + 1440) % 1440;
  const h24 = Math.floor(total / 60), mm = Math.floor(total % 60);
  const h12 = h24 % 12 || 12;
  const ampm = h24 >= 12 ? 'p' : 'a';
  return `${h12}:${String(mm).padStart(2,'0')}${ampm}`;
}
const RIBBON_PUNCH_LABELS = { ClockIn: 'IN', LunchOut: 'LO', LunchIn: 'LI', ClockOut: 'OUT' };

function renderDayRibbon_(punches, stats, tz) {
  // Determine the scheduled band. If the rep has clocked in, anchor to
  // their actual first ClockIn + 9h (better matches non-standard shifts).
  // Otherwise use the 8a–5p CST default per C3.
  let schedStart = clkSchedStartMin_();
  let schedEnd   = clkSchedStartMin_() + clkSchedLenMin_();
  if (punches && punches.length) {
    const firstIn = punches.find(p => p.type === 'ClockIn');
    if (firstIn) {
      const firstInMin = ribbonTimeToMin_(firstIn.time);
      if (!isNaN(firstInMin)) {
        schedStart = firstInMin;
        schedEnd   = firstInMin + clkSchedLenMin_();
      }
    }
  }

  // Build the segment list by walking punches; an open trailing session
  // (rep still working / on lunch) extends to "now".
  const segments = [];
  let curState = 'out', curStart = null;
  (punches || []).forEach(p => {
    const t = ribbonTimeToMin_(p.time);
    if (isNaN(t)) return;
    if (curState === 'working' && curStart !== null) {
      segments.push({ type: 'work', startMin: curStart, endMin: t });
    } else if (curState === 'lunch' && curStart !== null) {
      segments.push({ type: 'lunch', startMin: curStart, endMin: t });
    }
    if (p.type === 'ClockIn' || p.type === 'LunchIn') { curState = 'working'; curStart = t; }
    else if (p.type === 'LunchOut') { curState = 'lunch'; curStart = t; }
    else if (p.type === 'ClockOut') { curState = 'out'; curStart = null; }
  });
  const isActive = (curState === 'working' || curState === 'lunch') && curStart !== null;
  if (isActive) {
    const nowMin = ribbonTimeToMin_(liveTimeHmsTz(tz));
    segments.push({ type: curState === 'lunch' ? 'lunch' : 'work', startMin: curStart, endMin: nowMin });
  }

  // Compose markup.
  const schedLeft = ribbonPct_(schedStart);
  const schedWidth = Math.max(0, ribbonPct_(schedEnd) - ribbonPct_(schedStart));
  const segHtml = segments.map(s => {
    const l = ribbonPct_(s.startMin);
    const w = Math.max(0, ribbonPct_(s.endMin) - ribbonPct_(s.startMin));
    if (w <= 0) return '';
    return `<div class="r-seg ${s.type}" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%"
      title="${RIBBON_PUNCH_LABELS[s.type === 'lunch' ? 'LunchOut' : 'ClockIn'] || ''} ${ribbonFormatHm_(s.startMin)}–${ribbonFormatHm_(s.endMin)}"></div>`;
  }).join('');

  // V-2: labels get a greedy two-row stagger so close punches (every
  // LunchOut→LunchIn pair) don't overlap; a label that fits neither row
  // (rapid adjust cluster) renders bar-only — Today's Punches carries the
  // times. Width is estimated at ~5.6px/char (9px mono + chrome) against a
  // conservative 300px wide-mode ribbon; compact mode hides labels entirely.
  const rowEnds = [-Infinity, -Infinity];
  const punchHtml = (punches || [])
    .map(p => ({ p: p, m: ribbonTimeToMin_(p.time) }))
    .filter(x => !isNaN(x.m) && x.m >= RIBBON_START_MIN && x.m <= RIBBON_END_MIN)
    .sort((a, b) => a.m - b.m)
    .map(x => {
      const lbl = RIBBON_PUNCH_LABELS[x.p.type] || '';
      const text = lbl + ' ' + ribbonFormatHm_(x.m);
      const pct = ribbonPct_(x.m);
      const halfW = (text.length * 5.6 + 10) / 300 * 100 / 2;
      let cls = '';
      if (pct - halfW >= rowEnds[0] + 1) { rowEnds[0] = pct + halfW; }
      else if (pct - halfW >= rowEnds[1] + 1) { rowEnds[1] = pct + halfW; cls = ' r2'; }
      else { cls = ' collided'; }
      return `<div class="r-punch" style="left:${pct.toFixed(2)}%">
        <span class="lbl${cls}">${esc(text)}</span>
        <span class="bar"></span>
      </div>`;
    }).join('');

  // Scheduled break bands (#5a) — amber ticks from CLK_SCHEDULE.breaks, drawn
  // over the work segments so an in-shift break reads as a tint on the bar.
  const breakHtml = clkBreaks_().map(b => {
    if (typeof b.startMin !== 'number') return '';
    if (b.startMin < RIBBON_START_MIN || b.startMin > RIBBON_END_MIN) return '';
    const l = ribbonPct_(b.startMin);
    const w = Math.max(0.6, ribbonPct_(b.startMin + (b.lenMin || 0)) - l);
    return `<div class="r-break" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%"
      title="${esc((b.label || 'Break') + ' ' + ribbonFormatHm_(b.startMin))}"></div>`;
  }).join('');

  const nowMin = ribbonTimeToMin_(liveTimeHmsTz(tz));
  const nowHtml = isActive && !isNaN(nowMin)
    ? `<div class="r-now" id="r-now-cursor" style="left:${ribbonPct_(nowMin).toFixed(2)}%"></div>`
    : '';

  // Hour axis labels at 06, 09, 12, 15, 18, 21.
  const axisHours = [6, 9, 12, 15, 18, 21];
  const axisHtml = axisHours.map(h => {
    const pct = ribbonPct_(h * 60);
    const label = h === 12 ? '12p' : (h < 12 ? `${h}a` : `${h - 12}p`);
    return `<span style="left:${pct.toFixed(2)}%">${label}</span>`;
  }).join('');

  return `<div class="ribbon-wrap">
    <div class="ribbon-axis-row">${axisHtml}</div>
    <div class="ribbon">
      <div class="ribbon-track">
        <div class="ribbon-hist" id="ribbon-hist"></div>
        <div class="r-sched" style="left:${schedLeft.toFixed(2)}%;width:${schedWidth.toFixed(2)}%"
          title="Scheduled ${ribbonFormatHm_(schedStart)}–${ribbonFormatHm_(schedEnd)}"></div>
        ${segHtml}
        ${breakHtml}
        ${punchHtml}
        ${nowHtml}
      </div>
    </div>
    <div class="ribbon-legend">
      <span class="r-leg-item"><span class="swatch"></span>Worked</span>
      <span class="r-leg-item"><span class="swatch lunch"></span>Lunch</span>
      <span class="r-leg-item"><span class="swatch sched"></span>Scheduled</span>
      ${breakHtml ? `<span class="r-leg-item"><span class="swatch" style="background:var(--warn)"></span>Break</span>` : ''}
      <span class="r-leg-item"><span class="swatch" style="background:rgba(15,138,82,.16);background:color-mix(in oklch,var(--accent) 16%,transparent)"></span>Notes</span>
      ${isActive ? `<span class="r-leg-item"><span class="swatch now"></span>Now</span>` : ''}
    </div>
  </div>`;
}

let _ribbonNowInterval = null;

  const tick = () => {

}

    if (/afternoon/i.test(l)) return 'B2';

  };

}
