  const next = clkNextBreak_(clkNowMin_(tz));
  if (!next) { host.innerHTML = ''; return; }
  const b = next.brk;
  const chip = function (txt) {
    return '<span style="display:inline-block;font-size:11px;font-family:var(--mono);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;">' + esc(txt) + '</span>';
  };
  if (next.inProgress) {
    host.innerHTML = chip('On ' + b.label + ' · until ' + clkFmtMin_(b.startMin + b.lenMin));
    return;
  }
  host.innerHTML = chip('Next break · ' + b.label + ' at ' + clkFmtMin_(b.startMin) +
    (next.minsUntil <= 90 ? ' (in ' + next.minsUntil + 'm)' : ''));
  const lead = clkBreakReminderMin_();
  if (next.minsUntil >= 0 && next.minsUntil <= lead) {
    const key = isoDateTz(tz) + ':' + b.startMin;
    if (!_clkRemindedBreaks[key]) {
      _clkRemindedBreaks[key] = true;
      if (typeof showToast === 'function') {
        showToast(b.label + ' in ' + (next.minsUntil <= 0 ? 'a moment' : next.minsUntil + ' min'), 'toast-warn');
      }
    }
  }
}

/** Note coverage — now rendered INLINE in the shift-strip header (#3): the
 *  per-hour note bars behind the day ribbon are the visual histogram, and the
 *  header carries a compact coverage % + a "File N missing" link when answered
 *  calls outnumber logged notes. Fetches getMyMetrics(today); hides entirely
 *  when the rep had no call activity today. Cached in CLK_COVERAGE_CACHE to
 *  avoid re-fetching on every re-render. */
var CLK_COVERAGE_CACHE = { date: null, data: null };

function loadCoverageStrip_() {
  const slot = document.getElementById('clk-shift-cov');
  if (!slot) return;
  const today = isoDateTz(empTz());
  // Cycle-9 M-6 — SWR, matching CLK_NOTEVOL_CACHE (F6): the old cache-hit
  // early-return froze "N% logged · File N missing" for the WHOLE day — the
  // documented nav-away-and-back refresh path re-entered here and hit the
  // cache, so a rep who filed the missing notes kept seeing the stale CTA
  // until reload/midnight (worst in the pinned all-shift pop-out). Paint the
  // cache instantly, then ALWAYS refetch in the background — getMyMetrics is
  // server-result-cached 5 min (L-1), so the refetch is quota-cheap and the
  // strip is now at most ~5 min stale instead of all-day.
  const hadCache = CLK_COVERAGE_CACHE.date === today && !!CLK_COVERAGE_CACHE.data;
  if (hadCache && currentView === 'clock') renderCoverageStrip_(slot, CLK_COVERAGE_CACHE.data);
  google.script.run
    .withSuccessHandler(function (data) {
      // Keep the last-good render on an error response (blank only when we
      // had nothing to show — the pre-SWR behavior for a cold miss).
      if (!data || data.error) { if (!hadCache) slot.innerHTML = ''; return; }
      CLK_COVERAGE_CACHE = { date: today, data };
      if (currentView === 'clock') renderCoverageStrip_(slot, data);
    })
    .withFailureHandler(function () { if (!hadCache) slot.innerHTML = ''; })
    .getMyMetrics(today);
}

function renderCoverageStrip_(slot, data) {
  const cdr = data.cdr;
  const noteCount = data.noteCount || 0;
  const answered = cdr ? (cdr.totalAnswered || 0) : 0;
  // Hide entirely if no call activity today (avoids noise for non-CSR reps)
  if (noteCount === 0 && answered === 0) { slot.innerHTML = ''; return; }

  // F5 (cycle 12): the server could not read this rep's notes Sheet, so
  // noteCount is 0 by ignorance, not by fact. Rendering the normal strip would
  // show "0% logged" in CRIT tone and a "File <every answered call> missing"
  // CTA — telling the rep to redo work they already did. Say what actually
  // happened instead (the errorStateHtml_ posture from batch J, inline).
  if (data.noteCountUnavailable) {
    slot.innerHTML = '<span class="ss-cov-pct warn" title="Your call-notes Sheet could not be read — the coverage figure is unavailable, not zero">' +
      icon('warning', 11) + ' notes unavailable</span>';
    return;
  }

  // F(cycle-8): coerce the server values to numbers before they enter markup /
  // the inline onclick (esc() discipline for non-string slots).
  const covPct = data.noteCoverage != null ? Number(data.noteCoverage) : null;
  const missing = answered - noteCount;
  const toneCls = covPct == null ? '' : (covPct >= 80 ? 'good' : (covPct >= 50 ? 'warn' : 'crit'));
  const title = answered > 0
    ? noteCount + ' notes logged for ' + answered + ' answered calls today'
    : noteCount + ' notes today';

  let html = '';
  if (covPct != null) {
    html += `<span class="ss-cov-pct ${toneCls}" title="${esc(title)}">${covPct}% logged</span>`;
  } else if (noteCount > 0) {
    html += `<span class="ss-cov-pct" title="${esc(title)}">${noteCount} notes</span>`;
  }
  if (missing > 0) {
    // Round 2 · 8z — fileMissingCalls_ sets an in-memory nav hint the Log view
    // consumes (CDR is per-(agent,date) aggregated, so it carries the date).
    const today = isoDateTz(empTz());
    html += `<button class="ss-cov-cta" onclick="fileMissingCalls_('${esc(today)}', ${missing})">${icon('adjust', 11)} File ${missing} missing</button>`;
  } else if (noteCount > 0 && answered > 0) {
    html += `<span class="ss-cov-ok">${icon('check', 11)} covered</span>`;
  }
  slot.innerHTML = html;
}

// renderPtoRings + ptoRingSvg — removed in Round 2 (Phase 8d). The Clock
// view's renderPtoRings was orphaned after Phase 2's hero/ledger swap;
// ptoRingSvg was the last surviving helper from that era (still consumed

// the rectangular .pto-tile). With no remaining callers, both are gone
// along with the .pto-card / .pto-rings / .pto-ring / .pto-svg* CSS that
// fed them.

function renderPunchHistory(punches) {
  if (!punches || punches.length === 0)
    return '<div class="no-data">No punches recorded yet today</div>';
  // Use client-local clock to decide which punches are still in the undo window.
  // Server re-validates on submit, so stale UI just causes a friendly error.
  const tz = empTz();
  const nowHMS = liveTimeHmsTz(tz);
  return '<div class="punch-list">' + punches.map(p => {
    const m  = PUNCH_META[p.type] || { label:p.type, icon:'info', dir:p.direction==='IN'?'in':'out' };
    const dc = m.dir === 'in' ? 'in' : 'out';
    const adj = p.isAdjustment ? `<span class="adj-pill">${icon('adjust', 10)} adj</span>` : '';
    // F(cycle-8): timeDiffSecondsClient returns the -1 SENTINEL for malformed /
    // wrapped-beyond-window times — and `-1 <= 300` is true, so a stale
    // post-midnight punch list rendered undo buttons on EVERYTHING (each
    // rejected server-side). Eligibility requires a non-negative diff.
    const undoDiff = timeDiffSecondsClient(p.time, nowHMS);
    const eligible = !p.isAdjustment && undoDiff >= 0 && undoDiff <= SELF_UNDO_WINDOW_SECONDS;
    const undoBtn = eligible
      ? `<button class="punch-undo" title="Undo this punch (within ${Math.round(SELF_UNDO_WINDOW_SECONDS/60)}min)"
           data-date="${esc(empState.today)}" data-time="${esc(p.time)}" data-type="${esc(p.type)}"
           data-label="${esc(m.label)}">×</button>`
      : '';
    return `<div class="punch-row">
      <div class="punch-icon ${dc}">${icon(m.icon, 18)}</div>
      <div class="punch-name">${esc(m.label)} ${adj}</div>
      <div class="punch-tag ${dc}">${esc(p.direction)}</div>
      <div class="punch-tv">${dispTime(p.time)}</div>
      ${undoBtn}
    </div>`;
  }).join('') + '</div>';
}

/** Live time in tz formatted "HH:mm:ss" — used for client-side undo eligibility. */
function liveTimeHmsTz(tz) {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  }).format(new Date());
}

/** Client mirror of server's timeDiffSeconds_. Returns -1 if either string
 *  is malformed or the result wraps past midnight (punch at 23:58, now at
 *  00:02 → negative raw diff but really 4 minutes). Midnight wrap is capped
 *  at the undo window so a punch from yesterday doesn't look eligible. */
function timeDiffSecondsClient(earlier, later) {
  const toSec = (t) => {
    const p = String(t).split(':');
    if (p.length < 2) return NaN;
    return (parseInt(p[0],10)||0)*3600 + (parseInt(p[1],10)||0)*60 + (parseInt(p[2],10)||0);
  };
  const a = toSec(earlier), b = toSec(later);
  if (isNaN(a) || isNaN(b)) return -1;
  const diff = b - a;
  if (diff >= 0) return diff;
  const wrapped = 86400 + diff;
  return wrapped <= SELF_UNDO_WINDOW_SECONDS ? wrapped : -1;
}

function renderActions(actions, opts) {
  if (!actions || actions.length === 0) return '<div class="no-data">No actions available</div>';
  const onlyAdjust = actions.length === 1 && actions[0] === 'Adjust';
  if (onlyAdjust) {
    return `<div class="shift-done-msg">${icon('checkCircle', 16)}Shift complete for today</div>`
      + `<div class="actions"><button class="sec" data-action="Adjust">${icon('adjust', 18)}Adjust</button></div>`;
  }
  // Pick the primary CTA by state (#5a): ClockIn (start) → LunchIn (back from
  // lunch) → LunchOut (the frequent mid-shift action, gold) → ClockOut (end) →
  // first remaining. Adjust is always last as a secondary. Each button is also
  // color-coded by punch type (lunch = warn, in = accent, out = neutral).
  // AFTER the rep has already taken a lunch today (opts.afterLunch — a LunchIn
  // exists), ClockOut becomes the primary instead of LunchOut: most CSRs take
  // one lunch, so "Clock Out" is the expected next action and "Lunch Out" as the
  // big gold CTA risked accidental clicks. LunchOut stays available as a
  // secondary for a rare second break.
  const order = (opts && opts.afterLunch)
    ? ['ClockIn', 'LunchIn', 'ClockOut', 'LunchOut']
    : ['ClockIn', 'LunchIn', 'LunchOut', 'ClockOut'];
  let primary = order.find(a => actions.indexOf(a) >= 0)
    || actions.find(a => a !== 'Adjust')
    || 'Adjust';
  const secondaries = actions.filter(a => a !== primary && a !== 'Adjust');

  const pm = PUNCH_META[primary];
  let primeCls = 'prime';
  if (primary === 'LunchOut') primeCls = 'prime prime-warn act-lunchout';
  else if (primary === 'ClockOut') primeCls = 'prime prime-neutral act-clockout';
  else primeCls = 'prime ' + clkActTypeCls_(primary);   // ClockIn / LunchIn → accent default
  let html = `<div class="actions">`;
  html += `<button class="${primeCls}" data-action="${primary}">${icon(clkIdleGlyph_(primary), 18)}${pm.label}</button>`;
  secondaries.forEach(a => {
    const m = PUNCH_META[a];
    html += `<button class="sec ${clkActTypeCls_(a)}" data-action="${a}">${icon(clkIdleGlyph_(a), 18)}${m.label}</button>`;
  });
  html += `<button class="sec" data-action="Adjust">${icon('adjust', 18)}Adjust</button>`;
  html += `</div>`;
  return html;
}

function clkActTypeCls_(a) {
  return a === 'LunchOut' ? 'act-lunchout'
    : a === 'LunchIn' ? 'act-lunchin'
    : a === 'ClockIn' ? 'act-clockin'
    : a === 'ClockOut' ? 'act-clockout' : '';
}

// Punch-button icon morph: the IDLE glyph is the rep's current state, the
// destination glyph is where the punch takes them, and it also matches the NEXT
// state's PRIMARY idle glyph so the morph carries seamlessly into the re-render.
// LunchOut (working→break): headset→mug — and On-Lunch's primary is LunchIn
// (idle = mug). LunchIn (break→back): mug→doorExit — because a lunch RETURN sets
// afterLunch, which makes ClockOut (idle = doorExit) the primary, NOT LunchOut
// (F7). A pre-afterLunch build landed on `headset` (the old LunchOut-primary idle)
// and is now a half-step behind the re-render; doorExit keeps the carry-through.
const PUNCH_MORPH = {
  LunchOut: { from: 'headset',   to: 'coffeeMug' },
  LunchIn:  { from: 'coffeeMug', to: 'doorExit'  },
};
/** Idle glyph for a punch button — the morph's `from` (current state) when the
 *  action morphs, else the PUNCH_META icon. */
function clkIdleGlyph_(a) {
  return (PUNCH_MORPH[a] && PUNCH_MORPH[a].from) || (PUNCH_META[a] && PUNCH_META[a].icon) || 'info';
}
/** In-flight morph markup for a punch button (two stacked glyphs cross-fading
 *  from `from` to `to`). Plays once on insert, then holds the destination. */
function clkPunchMorphHtml_(morph) {
  return '<span class="clk-morph">'
    + '<span class="cm-from">' + icon(morph.from, 18) + '</span>'
    + '<span class="cm-to">' + icon(morph.to, 18) + '</span>'
    + '</span>';
}

function bindClockBtns() {

    btn.addEventListener('click', () => {
      const a = btn.dataset.action;
      if (a === 'Adjust') { openAdjustModal(); return; }
      handlePunch(a);
    });
  });

// ── Greeting-bar rotator (operator feedback 2026-07-09) ─────────────────────
// The greeting bar's third line rotates upward-carousel style: slide 0 is the
// live status sentence; the rest are "What's new" update lines (one per list
// item of the WHATSNEW_KB_ID article, via the pure whatsNewItems_). Clicking
// an update slide opens the full What's-new panel (whose dismissal stamps the
// seen-flag and clears the NEW accent). Rotation pauses on hover, only runs
// with ≥2 slides, reuses the world-clock strip's slide-up animation (which the
// global prefers-reduced-motion block neutralizes), and is tied to the
// startClock/stopClock lifecycle so no timer survives a tab nav-away.
var CLK_GREET_ROT = { idx: 0, timer: null, statusHtml: '', hover: false };
var CLK_GREET_ROT_MS = 8000;

function clkGreetSlides_() {
  var slides = [{ html: CLK_GREET_ROT.statusHtml || '' }];
  try {
    if (typeof WHATSNEW_STATE !== 'undefined' && WHATSNEW_STATE && WHATSNEW_STATE.bodyMd &&
        typeof whatsNewItems_ === 'function') {
      var unseen = false;
      try { unseen = whatsNewShouldShow_(localStorage.getItem('umsWhatsNew'), WHATSNEW_STATE.stamp); } catch (e) {}
      whatsNewItems_(WHATSNEW_STATE.bodyMd).forEach(function (t) {
        slides.push({
          html: '<button type="button" class="greet-upd" onclick="whatsNewOpen_()" title="Open What\'s new">' +
            icon('star', 12) + (unseen ? '<span class="greet-upd-new">NEW</span>' : '') +
            '<span class="greet-upd-txt">' + esc(t) + '</span></button>',
        });
      });
    }
  } catch (e) { /* updates are decorative — never break the greeting */ }
  return slides;
}

function clkGreetRotStart_() {
  clkGreetRotStop_();
  // F(cycle-8 M-12): the greeting bar is display:none in the compact pop-out —
  // don't tick an 8s timer against invisible slides all shift.
  if (typeof COMPACT_MODE !== 'undefined' && COMPACT_MODE) return;
  CLK_GREET_ROT.idx = 0;
  // F(cycle-8 M-7): reset the hover-hold — a re-render mid-hover replaced the
  // element before mouseleave could fire, stranding hover=true so every
  // future tick held "the slide being read" forever (the carousel silently
  // froze for the session; the stale flag even survived nav-away/return).
  CLK_GREET_ROT.hover = false;
  clkGreetRotBind_();   // bind NOW (render just happened) so hover-hold works during the first cycle too
  CLK_GREET_ROT.timer = setInterval(clkGreetRotTick_, CLK_GREET_ROT_MS);
}
function clkGreetRotStop_() {
  if (CLK_GREET_ROT.timer) { clearInterval(CLK_GREET_ROT.timer); CLK_GREET_ROT.timer = null; }
}
/** (Re)bind hover-hold on the current #greet-rot element. F(cycle-8 M-7): a
 *  FRESH element (this render's) also clears a stale hover flag — the pointer
 *  can't be "in" an element that was just created without a new mouseenter. */
function clkGreetRotBind_() {
  var el = document.getElementById('greet-rot');
  if (!el || el._rotBound) return;
  el.addEventListener('mouseenter', function () { CLK_GREET_ROT.hover = true; });
  el.addEventListener('mouseleave', function () { CLK_GREET_ROT.hover = false; });
  el._rotBound = true;
  CLK_GREET_ROT.hover = false;
}
function clkGreetRotTick_() {
  var el = document.getElementById('greet-rot');
  if (!el) return;                    // mid-render; stopClock cleans the timer on nav-away
  clkGreetRotBind_();                 // re-render replaced the element → rebind + clear stale hover
  if (CLK_GREET_ROT.hover) return;    // reading — hold this slide
  var slides = clkGreetSlides_();
  if (slides.length < 2) return;      // nothing to rotate (no What's-new configured)
  CLK_GREET_ROT.idx = (CLK_GREET_ROT.idx + 1) % slides.length;
  el.innerHTML = '<span class="greet-rot-item">' + slides[CLK_GREET_ROT.idx].html + '</span>';
}
/** Called by whatsNewInit_ when the What's-new payload lands after the view
 *  rendered — ensures the timer is running so the new slides start rotating. */
function clkGreetRotRefresh_() {
  if (!CLK_GREET_ROT.timer && document.getElementById('greet-rot')) clkGreetRotStart_();
}

function startClock() {
  stopClock();
  if (_clkLastDay === null) _clkLastDay = isoDateTz(empTz());
  const tick = () => {
    if (!document.getElementById('live-time')) return;
    clkTickTime_();        // big time in the displayed tz (#5a)
    clkApplySky_();        // repaint the sky gradient when the displayed hour rolls over
    clkShootMaybe_();      // (b) occasional shooting star after mid-shift (cheap ms compare)
    clkUpdateRegions_();   // item 5 — refresh the world-clock strip (cached formatters)
    clkUpdateBreak_();     // item 1 — next-break chip + X-min reminder toast
    // Day rollover — a tab open past midnight must reconcile state so a
    // forgotten clock-out doesn't carry "Clock Out" into the new day.
    const dayNow = isoDateTz(empTz());
    if (dayNow !== _clkLastDay) { _clkLastDay = dayNow; clkRefreshState_(); }
  };
  tick(); clockInterval = setInterval(tick, 1000);
  startRibbonNowCursor_();
  clkGreetRotStart_();   // greeting-bar rotator (status ↔ What's-new slides)
}
function stopClock() {
  if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
  stopRibbonNowCursor_();
  clkGreetRotStop_();
}

function handlePunch(punchType) {
  const tz = empTz();
  const nowStr = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: 'numeric', minute: '2-digit',
  }).format(new Date());
  uiConfirm({
    title: 'Record punch',
    message: `Record "${PUNCH_META[punchType].label}" at ${nowStr}?`,
    confirmLabel: PUNCH_META[punchType].label,
  }).then(ok => {
    if (!ok) return;
    submitPunch(punchType, null);
  });
}

function submitPunch(punchType, custom) {
  setClockBtnsDisabled(true);
  // #3 — immediate visual feedback: the primary action shows an inline loader
  // ("Working…") the instant it's clicked, instead of just going disabled until
  // the toast lands. Restored on failure; replaced by the re-render on success.
  // F3 — animate the button that was actually CLICKED, not whichever button is
  // currently `.prime`. After a lunch return ClockOut becomes prime and LunchOut
  // demotes to a secondary, so a second-lunch click must morph the LunchOut
  // button, not the unrelated ClockOut prime. Fall back to `.prime` defensively.
  var btn = document.querySelector('.actions [data-action="' + punchType + '"]')
    || document.querySelector('.actions .prime');
  var btnHtml = btn ? btn.innerHTML : null;
  // In-flight feedback: lunch punches morph the icon (headset↔mug) toward their
  // destination; other punches show the dots loader. Both say "Working…".
  var morph = PUNCH_MORPH[punchType];
  if (btn) btn.innerHTML = (morph ? clkPunchMorphHtml_(morph)
    : '<span class="lo-dots"><span></span><span></span><span></span></span>') + ' Working…';
  google.script.run
    .withSuccessHandler(result => {
      setClockBtnsDisabled(false);
      if (!result.success) {
        if (btn && btnHtml != null) btn.innerHTML = btnHtml;
        showToast((result.error||'Error'), 'toast-error'); return;
      }
      const tag = result.isAdjustment ? ' (adj)' : '';
      showToast(`${PUNCH_META[punchType].label}${tag} at ${result.displayTime}`, 'toast-success');
      google.script.run
        .withSuccessHandler(state => {
          empState = state;
          adjustWindowDays = state.adjustWindowDays || 30;
          // Round 2 · 8b — re-renders target view-area directly now that
          // the Clock view no longer hosts a timesheet section below.
          const area = getClockArea_();
          if (area && currentView === 'clock') { renderClockView(area); startClock(); }
        })
        .withFailureHandler(() => {
          // D2b (cycle 10): the punch SUCCEEDED but the state refresh died —
          // the buttons were already re-enabled while the clicked one still
          // read "Working…" over the PRE-punch action row, inviting a second
          // click (another recordPunch; the M-1 sequence guard now rejects a
          // duplicate, but the rep shouldn't be led there). Restore the
          // label and say the punch was recorded.
          if (btn && btnHtml != null) btn.innerHTML = btnHtml;
          showToast('Punch recorded — couldn’t refresh the view. Reload to see current status.', 'toast-warn');
        })
        .getEmployeeState();
    })
    .withFailureHandler(err => {
      setClockBtnsDisabled(false);
      // F(M-1): these were the pre-F3 names (`prime`/`primeHtml`) — the
      // ReferenceError swallowed the toast and left the clicked button stuck
      // on "Working…" for every transport failure / server throw.
      if (btn && btnHtml != null) btn.innerHTML = btnHtml;
      showToast((err.message||'Server error'), 'toast-error');
    })
    .recordPunch(punchType, custom);
}

function setClockBtnsDisabled(v) { document.querySelectorAll('.actions .prime, .actions .sec').forEach(b => { b.disabled = v; }); }

// ── ADJUST MODAL (#4a — batch request → manager approval) ───────────────────
// Employees no longer write punches immediately; they queue one or more
// adjustment requests here and submit them for manager approval
// (submitPunchAdjustRequests). The manager approves/denies from the dashboard.
var ADJ_BATCH = [];
function adjRenderBatch_() {
  const host = document.getElementById('adj-batch-list');
  if (!host) return;
  if (ADJ_BATCH.length === 0) { host.innerHTML = ''; return; }
  const label = function (t) { return (PUNCH_META[t] && PUNCH_META[t].label) || t; };
  host.innerHTML = '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px">To submit (' + ADJ_BATCH.length + ')</div>' +
    ADJ_BATCH.map(function (e, i) {
      return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px">' +
        '<span style="flex:1">' + esc(e.date) + ' · ' + esc(label(e.punchType)) + ' · ' + esc(e.time) + (e.reason ? ' · ' + esc(e.reason) : '') + '</span>' +
        '<button class="cn-act-btn" title="Remove" onclick="adjRemoveBatch_(' + i + ')">✕</button>' +
      '</div>';
    }).join('');
}
function adjRemoveBatch_(i) { ADJ_BATCH.splice(i, 1); adjRenderBatch_(); }
function adjReadEntry_() {
  const date = document.getElementById('adj-date').value;
  const punchType = document.getElementById('adj-type').value;
  const time = document.getElementById('adj-time').value;
  const reason = document.getElementById('adj-reason').value.trim();
  if (!date || !time) { showToast('Please fill in date and time', 'toast-error'); return null; }
  const today = isoDateTz(empTz());
  const diff = daysBetweenIso(date, today);
  const threshold = (empState && empState.adjustReasonThresholdDays) || 7;
  if (diff > threshold && !reason) {
    showToast('A reason is required for adjustments more than ' + threshold + ' days back', 'toast-error');
    document.getElementById('adj-reason').focus();
    return null;
  }
  return { date: date, punchType: punchType, time: time, reason: reason };
}
function adjLoadPending_() {
  const host = document.getElementById('adj-pending-list');
  if (!host) return;
  google.script.run.withSuccessHandler(function (res) {
    const h = document.getElementById('adj-pending-list');
    if (!h || !res || res.error || !Array.isArray(res.requests)) return;
    const pend = res.requests.filter(function (r) { return String(r.status).toLowerCase() === 'pending'; });
    if (pend.length === 0) { h.innerHTML = ''; return; }
    const label = function (t) { return (PUNCH_META[t] && PUNCH_META[t].label) || t; };
    h.innerHTML = '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px">Awaiting approval (' + pend.length + ')</div>' +
      pend.map(function (r) {
        return '<div style="padding:2px 0">' + esc(r.date) + ' · ' + esc(label(r.punchType)) + ' · ' + esc(r.time) + '</div>';
      }).join('');
  }).withFailureHandler(function () {}).getMyPunchAdjustRequests();
}

function openAdjustModal() {
  const tz = empTz();
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz });
  const now = new Date();
  const todayIso = fmt.format(now);
  // D4 (cycle 10): pure ISO-string day math (mgrAddDaysIso_, the cycle-8
  // Coverage/Punctuality fix) instead of browser-LOCAL setDate() then rep-tz
  // formatting — the hybrid could land the picker floor a day off when the
  // browser tz ≠ rep tz (offshore reps on US-imaged machines). Server stays
  // authoritative (INV-06) — this only stops the picker over/under-blocking.
  const minIso = mgrAddDaysIso_(todayIso, -adjustWindowDays);

  document.getElementById('adj-date').value = todayIso;
  document.getElementById('adj-date').min   = minIso;
  document.getElementById('adj-date').max   = todayIso;
  document.getElementById('adj-time').value = timeHmTz(tz);
  document.getElementById('adj-reason').value = '';
  updateAdjReasonRequirement();
  ADJ_BATCH = [];
  adjRenderBatch_();
  adjLoadPending_();
  // "Apply now" (immediate fix) shows only when the employeeImmediateAdjust
  // flag is on; the server enforces the same gate (recordPunch).
  const applyBtn = document.getElementById('adj-apply-now');
  if (applyBtn) applyBtn.style.display = flagOn_('employeeImmediateAdjust') ? '' : 'none';
  document.getElementById('adjust-overlay').classList.add('open');
}

/**
 * Switches the reason label between optional / required based on how far back
 * the selected date is from today (in the employee's timezone).
 */
function updateAdjReasonRequirement() {
  const dateInput = document.getElementById('adj-date');
  const label = document.getElementById('adj-reason-label');
  const reason = document.getElementById('adj-reason');
  if (!dateInput || !label || !reason) return;
  const date = dateInput.value;
  if (!date) return;
  const today = isoDateTz(empTz());
  const diff = daysBetweenIso(date, today);
  const threshold = (empState && empState.adjustReasonThresholdDays) || 7;
  if (diff > threshold) {
    label.innerHTML = 'Reason <span class="req-marker">(required)</span>';
    reason.placeholder = `Required — this punch is ${diff} days back. Brief explanation:`;
  } else {
    label.innerHTML = 'Reason <span class="opt-marker">(optional)</span>';
    reason.placeholder = 'e.g. Forgot to clock out, system was down…';
  }
}


document.getElementById('adj-cancel').addEventListener('click', () =>
  document.getElementById('adjust-overlay').classList.remove('open'));
document.getElementById('adjust-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('adjust-overlay'))
    document.getElementById('adjust-overlay').classList.remove('open');
});
document.getElementById('adj-date').addEventListener('change', updateAdjReasonRequirement);

document.getElementById('adj-add').addEventListener('click', () => {
  const entry = adjReadEntry_();
  if (!entry) return;
  ADJ_BATCH.push(entry);
  adjRenderBatch_();
  // Keep date + type, clear time + reason for the next entry.
  document.getElementById('adj-time').value = '';
  document.getElementById('adj-reason').value = '';
});

// "Apply now" — immediate single fix (employeeImmediateAdjust flag on). Uses
// the legacy recordPunch(custom) path; the server re-checks the flag.
document.getElementById('adj-apply-now').addEventListener('click', () => {
  const entry = adjReadEntry_();
  if (!entry) return;
  document.getElementById('adjust-overlay').classList.remove('open');
  submitPunch(entry.punchType, { date: entry.date, time: entry.time, reason: entry.reason });
});

document.getElementById('adj-submit').addEventListener('click', () => {
  // Include a currently-filled entry so a single adjustment doesn't require
  // clicking "Add to list" first.
  if (document.getElementById('adj-time').value) {
    const entry = adjReadEntry_();
    if (!entry) return;
    ADJ_BATCH.push(entry);
    document.getElementById('adj-time').value = '';
    document.getElementById('adj-reason').value = '';
  }
  if (ADJ_BATCH.length === 0) { showToast('Add at least one adjustment', 'toast-warn'); return; }
  const btn = document.getElementById('adj-submit');
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      if (!res || !res.success) { showToast((res && res.error) || 'Submit failed', 'toast-error'); return; }
      document.getElementById('adjust-overlay').classList.remove('open');
      ADJ_BATCH = [];
      showToast(res.count + ' adjustment request(s) submitted for approval', 'toast-success');
    })
    .withFailureHandler(function (err) { btn.disabled = false; showToast((err && err.message) || 'Submit failed', 'toast-error'); })
    .submitPunchAdjustRequests(ADJ_BATCH);
});
</script>
