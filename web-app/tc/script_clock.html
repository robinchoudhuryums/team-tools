<script>
// ════════════════════════════════════════════════════════════════════════════
//  CLOCK VIEW
// ════════════════════════════════════════════════════════════════════════════

// Overridden from server's CONFIG.SELF_UNDO_WINDOW_SECONDS via getEmployeeState
// in script_core.html's init handler. Default kept as a safety net.
let SELF_UNDO_WINDOW_SECONDS = 300;

/** Combined Clock+Timesheet enter handler — top section is the clock UI,
 *  below it is the rep's current timesheet. Replaces the prior separate
 *  enterClockView + enterTimesheetView tabs. Re-renders of the clock UI
 *  (after a punch) target `#clk-section` so the timesheet section below
 *  isn't wiped on each interaction. */
function enterClockCombinedView(area) {
  stopClock();
  // Default timesheet range if not yet set (mirror enterTimesheetView's logic)
  if (!tsStart) {
    const range = computeRange(tsViewMode, isoDateTz(empTz()), 0);
    tsStart = range.start; tsEnd = range.end;
  }
  area.innerHTML = `
    <div id="clk-section"></div>
    <div class="clk-ts-divider">
      <div class="clk-ts-divider-line"></div>
      <span class="clk-ts-divider-label">Your Timesheet</span>
      <div class="clk-ts-divider-line"></div>
    </div>
    <div id="clk-ts-section"></div>
  `;
  const clkSection = document.getElementById('clk-section');
  renderClockView(clkSection);
  startClock();
  const tsSection = document.getElementById('clk-ts-section');
  tsSection.innerHTML = '<div class="state-center"><div class="spinner"></div><div class="state-label">Loading timesheet…</div></div>';
  loadTimesheet(tsStart, tsEnd, tsSection);
}

/** The clock view's interactive handlers (handlePunch, self-undo, etc.) write
 *  to a parent container via innerHTML. In the combined view that container
 *  must be the clock SECTION (#clk-section) — replacing the view-area would
 *  wipe the timesheet below. Fall back to view-area for any standalone use. */
function getClockArea_() {
  return document.getElementById('clk-section') || document.getElementById('view-area');
}

function renderClockView(area) {
  const s = empState;
  const tzAbbr = s.timezoneAbbr || '';
  const tz = empTz();
  const weekday = new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'long' }).format(new Date());
  const dateStr = new Intl.DateTimeFormat('en-US', { timeZone: tz, month: 'long', day: 'numeric' }).format(new Date());
  const kicker = `Today · ${weekday}`;
  const greetName = (s.name || '').split(' ')[0] || 'there';
  const stats = computeShiftStats_(s.punches, tz);
  const statusSentence = buildStatusSentence_(stats, s.nextActions, tzAbbr);

  area.innerHTML = `
    <div class="hero">
      <div class="greet">
        <div class="greet-kicker">${esc(kicker)}</div>
        <div class="greet-name">Hi, ${esc(greetName)}</div>
        <div class="status-sentence">${statusSentence}</div>
      </div>
      <div class="clk">
        <div class="clk-time tabular" id="live-time">--:--:--<span class="ampm"></span></div>
        <div class="clk-meta">
          <span>${esc(dateStr)}</span>
          ${tzAbbr ? `<span class="sep">·</span><span>${esc(tzAbbr)}</span>` : ''}
        </div>
      </div>
    </div>

    ${renderActions(s.nextActions)}

    ${renderDayRibbon_(s.punches, stats, tz)}

    <div id="clk-cov-slot"></div>

    ${renderLedger_(s, stats)}

    <div class="card">
      <div class="card-label">Today's Punches</div>
      ${renderPunchHistory(s.punches)}
    </div>

    <div id="teammate-card-slot"></div>`;
  bindClockBtns();
  bindSelfUndoBtns();
  loadTeammateStatus();
  loadCoverageStrip_();
}

/** Computes "worked", "lunch", "since" stats from today's punches.
 *  Returns null if no punches yet. State machine walks ClockIn/LunchOut/
 *  LunchIn/ClockOut transitions and sums in-state durations, with the
 *  final open session extending to "now". Shift-end is anchored to the
 *  first ClockIn + 9h (per C3 — no per-rep schedule data exists yet,
 *  and CSR agents are nearly all 8a–5p CST). */
function computeShiftStats_(punches, tz) {
  if (!punches || punches.length === 0) return null;
  const toMin = (hms) => {
    const p = String(hms).split(':');
    return (parseInt(p[0],10)||0) * 60 + (parseInt(p[1],10)||0) + (parseInt(p[2],10)||0)/60;
  };
  const firstClockIn = punches.find(p => p.type === 'ClockIn');
  if (!firstClockIn) return null;
  const nowMin = toMin(liveTimeHmsTz(tz));

  let workedMin = 0, lunchMin = 0;
  let state = 'out';
  let stateSince = null;

  for (const p of punches) {
    const t = toMin(p.time);
    if (stateSince !== null) {
      const dur = Math.max(0, t - stateSince);
      if (state === 'working') workedMin += dur;
      else if (state === 'lunch') lunchMin += dur;
    }
    if (p.type === 'ClockIn' || p.type === 'LunchIn') { state = 'working'; stateSince = t; }
    else if (p.type === 'LunchOut') { state = 'lunch'; stateSince = t; }
    else if (p.type === 'ClockOut') { state = 'out'; stateSince = null; }
  }
  if (stateSince !== null) {
    const dur = Math.max(0, nowMin - stateSince);
    if (state === 'working') workedMin += dur;
    else if (state === 'lunch') lunchMin += dur;
  }

  let clockedInSince = null;
  if (state === 'working' || state === 'lunch') {
    const ins = punches.filter(p => p.type === 'ClockIn' || p.type === 'LunchIn');
    clockedInSince = ins.length ? ins[ins.length - 1].time : firstClockIn.time;
  }

  const firstInMin = toMin(firstClockIn.time);
  const shiftEndMin = firstInMin + 9 * 60;
  const fmtClk = (mm) => {
    const total = ((mm % 1440) + 1440) % 1440;
    const h = Math.floor(total / 60), m = Math.floor(total % 60);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  };

  return {
    state,
    clockedInSince,
    workedHM: { h: Math.floor(workedMin / 60), m: Math.floor(workedMin % 60) },
    workedHours: workedMin / 60,
    lunchMinutes: Math.round(lunchMin),
    shiftEndTime: fmtClk(shiftEndMin),
    minutesUntilShiftEnd: shiftEndMin - nowMin,
  };
}

function buildStatusSentence_(stats, nextActions, tzAbbr) {
  if (!stats) {
    return `You haven't clocked in yet — tap <strong>Clock In</strong> to start your day.`;
  }
  const tzSuffix = tzAbbr ? ` ${esc(tzAbbr)}` : '';
  const workedStr = `<strong>${stats.workedHM.h}h ${stats.workedHM.m}m</strong> worked today`;
  const lunchStr = stats.lunchMinutes > 0 ? ` · <strong>${stats.lunchMinutes}m</strong> lunch` : '';

  if (stats.state === 'out') {
    return `Shift complete · ${workedStr}${lunchStr}.`;
  }
  const stateLabel = stats.state === 'lunch' ? 'on lunch since' : 'clocked in since';
  const since = stats.clockedInSince ? `<strong>${dispTime(stats.clockedInSince)}${tzSuffix}</strong>` : '—';

  let endStr = '';
  if (stats.minutesUntilShiftEnd > 0) {
    const eh = Math.floor(stats.minutesUntilShiftEnd / 60);
    const em = Math.floor(stats.minutesUntilShiftEnd % 60);
    endStr = ` · <strong>${eh}h ${em}m</strong> until end of shift`;
  } else if (stats.minutesUntilShiftEnd < 0) {
    const over = Math.abs(stats.minutesUntilShiftEnd);
    const oh = Math.floor(over / 60), om = Math.floor(over % 60);
    endStr = ` · <strong>${oh}h ${om}m</strong> past end of shift`;
  }
  return `You're ${stateLabel} ${since}. ${workedStr}${lunchStr}${endStr}.`;
}

/** 4-cell ledger strip: Annual / Sick / Hours Today / Pay-period.
 *  Hours Today is computed from punches client-side. Pay-period hours
 *  comes from tsData if loaded (combined Clock+Timesheet view auto-
 *  loads the timesheet section below); otherwise shows "—" until the
 *  timesheet load completes. Annual/Sick cells gracefully hide via
 *  muted text when ptoEnabled is false (contractor reps). */
function renderLedger_(s, stats) {
  const annualVal = s.ptoEnabled
    ? `<div class="cell-value">${formatLeaveDays(s.annualLeave || 0)}</div><div class="cell-sub">of ${formatLeaveDays(s.annualLeaveMax || 15)} days</div>`
    : `<div class="cell-value muted">—</div><div class="cell-sub">not tracked</div>`;
  const sickVal = s.ptoEnabled
    ? `<div class="cell-value">${formatLeaveDays(s.sickLeave || 0)}</div><div class="cell-sub">of ${formatLeaveDays(s.sickLeaveMax || 10)} days</div>`
    : `<div class="cell-value muted">—</div><div class="cell-sub">not tracked</div>`;
  const hoursToday = stats
    ? `<div class="cell-value">${stats.workedHM.h}h ${String(stats.workedHM.m).padStart(2,'0')}m</div><div class="cell-sub">${stats.lunchMinutes ? stats.lunchMinutes + 'm lunch' : 'no lunch yet'}</div>`
    : `<div class="cell-value muted">0h</div><div class="cell-sub">not in yet</div>`;
  // Pay-period cell — lazy-populated from tsData when the combined view's
  // timesheet section finishes loading. See lazyUpdatePayPeriodCell_.
  const ppLabel = s.payCycle === 'Biweekly' ? 'Pay period' : 'This month';
  let ppVal;
  if (tsData && typeof tsData.totalHours === 'number') {
    ppVal = `<div class="cell-value">${fmtHrs(tsData.totalHours)}</div><div class="cell-sub">${tsData.daysWorked || 0} days worked</div>`;
  } else {
    ppVal = `<div class="cell-value muted" id="clk-pp-val">—</div><div class="cell-sub" id="clk-pp-sub">loading…</div>`;
  }
  return `<div class="ledger">
    <div class="cell"><div class="cell-label">Annual</div>${annualVal}</div>
    <div class="cell"><div class="cell-label">Sick</div>${sickVal}</div>
    <div class="cell"><div class="cell-label">Hours today</div>${hoursToday}</div>
    <div class="cell"><div class="cell-label">${ppLabel}</div>${ppVal}</div>
  </div>`;
}

/** Update the pay-period ledger cell once tsData arrives. Called by
 *  loadTimesheet's success path (via the global hook). Silently no-ops
 *  if the cell isn't in the DOM (rep navigated away). */
function lazyUpdatePayPeriodCell_() {
  const val = document.getElementById('clk-pp-val');
  const sub = document.getElementById('clk-pp-sub');
  if (!val || !sub || !tsData || typeof tsData.totalHours !== 'number') return;
  val.textContent = fmtHrs(tsData.totalHours);
  val.classList.remove('muted');
  sub.textContent = `${tsData.daysWorked || 0} days worked`;
}

// ── DAY RIBBON (V4·E1) ─────────────────────────────────────────────────
// Horizontal time-of-day ribbon spanning 06:00–22:00. Renders the rep's
// scheduled shift (dashed band, default 8a–5p CST per C3 or anchored to
// first ClockIn + 9h once they've clocked in) and their actual work +
// lunch segments. Punch markers + a pulsing now-cursor complete the
// picture. The now-cursor is refreshed every 60s by RIBBON_NOW_INTERVAL.
const RIBBON_START_MIN = 6 * 60;    // 06:00 → 360
const RIBBON_END_MIN   = 22 * 60;   // 22:00 → 1320
const RIBBON_SPAN_MIN  = RIBBON_END_MIN - RIBBON_START_MIN;  // 960
const RIBBON_DEFAULT_SHIFT_START = 8 * 60;   // 08:00 — default CST shift start (C3)
const RIBBON_DEFAULT_SHIFT_LEN   = 9 * 60;   // 9h

function ribbonPct_(min) {
  if (typeof min !== 'number' || isNaN(min)) return 0;
  return Math.max(0, Math.min(100, ((min - RIBBON_START_MIN) / RIBBON_SPAN_MIN) * 100));
}
function ribbonTimeToMin_(hms) {
  const p = String(hms || '').split(':');
  if (p.length < 2) return NaN;
  return (parseInt(p[0],10)||0) * 60 + (parseInt(p[1],10)||0) + (parseInt(p[2],10)||0)/60;
}
function ribbonFormatHm_(min) {
  const total = ((min % 1440) + 1440) % 1440;
  const h24 = Math.floor(total / 60), mm = Math.floor(total % 60);
  const h12 = h24 % 12 || 12;
  const ampm = h24 >= 12 ? 'p' : 'a';
  return `${h12}:${String(mm).padStart(2,'0')}${ampm}`;
}
const RIBBON_PUNCH_LABELS = { ClockIn: 'IN', LunchOut: 'LO', LunchIn: 'LI', ClockOut: 'OUT' };

function renderDayRibbon_(punches, stats, tz) {
  // Determine the scheduled band. If the rep has clocked in, anchor to
  // their actual first ClockIn + 9h (better matches non-standard shifts).
  // Otherwise use the 8a–5p CST default per C3.
  let schedStart = RIBBON_DEFAULT_SHIFT_START;
  let schedEnd   = RIBBON_DEFAULT_SHIFT_START + RIBBON_DEFAULT_SHIFT_LEN;
  if (punches && punches.length) {
    const firstIn = punches.find(p => p.type === 'ClockIn');
    if (firstIn) {
      const firstInMin = ribbonTimeToMin_(firstIn.time);
      if (!isNaN(firstInMin)) {
        schedStart = firstInMin;
        schedEnd   = firstInMin + RIBBON_DEFAULT_SHIFT_LEN;
      }
    }
  }

  // Build the segment list by walking punches; an open trailing session
  // (rep still working / on lunch) extends to "now".
  const segments = [];
  let curState = 'out', curStart = null;
  (punches || []).forEach(p => {
    const t = ribbonTimeToMin_(p.time);
    if (isNaN(t)) return;
    if (curState === 'working' && curStart !== null) {
      segments.push({ type: 'work', startMin: curStart, endMin: t });
    } else if (curState === 'lunch' && curStart !== null) {
      segments.push({ type: 'lunch', startMin: curStart, endMin: t });
    }
    if (p.type === 'ClockIn' || p.type === 'LunchIn') { curState = 'working'; curStart = t; }
    else if (p.type === 'LunchOut') { curState = 'lunch'; curStart = t; }
    else if (p.type === 'ClockOut') { curState = 'out'; curStart = null; }
  });
  const isActive = (curState === 'working' || curState === 'lunch') && curStart !== null;
  if (isActive) {
    const nowMin = ribbonTimeToMin_(liveTimeHmsTz(tz));
    segments.push({ type: curState === 'lunch' ? 'lunch' : 'work', startMin: curStart, endMin: nowMin });
  }

  // Compose markup.
  const schedLeft = ribbonPct_(schedStart);
  const schedWidth = Math.max(0, ribbonPct_(schedEnd) - ribbonPct_(schedStart));
  const segHtml = segments.map(s => {
    const l = ribbonPct_(s.startMin);
    const w = Math.max(0, ribbonPct_(s.endMin) - ribbonPct_(s.startMin));
    if (w <= 0) return '';
    return `<div class="r-seg ${s.type}" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%"
      title="${RIBBON_PUNCH_LABELS[s.type === 'lunch' ? 'LunchOut' : 'ClockIn'] || ''} ${ribbonFormatHm_(s.startMin)}–${ribbonFormatHm_(s.endMin)}"></div>`;
  }).join('');

  const punchHtml = (punches || []).map(p => {
    const m = ribbonTimeToMin_(p.time);
    if (isNaN(m)) return '';
    if (m < RIBBON_START_MIN || m > RIBBON_END_MIN) return '';
    const lbl = RIBBON_PUNCH_LABELS[p.type] || '';
    return `<div class="r-punch" style="left:${ribbonPct_(m).toFixed(2)}%">
      <span class="lbl">${esc(lbl)} ${esc(ribbonFormatHm_(m))}</span>
      <span class="bar"></span>
    </div>`;
  }).join('');

  const nowMin = ribbonTimeToMin_(liveTimeHmsTz(tz));
  const nowHtml = isActive && !isNaN(nowMin)
    ? `<div class="r-now" id="r-now-cursor" style="left:${ribbonPct_(nowMin).toFixed(2)}%"></div>`
    : '';

  // Hour axis labels at 06, 09, 12, 15, 18, 21.
  const axisHours = [6, 9, 12, 15, 18, 21];
  const axisHtml = axisHours.map(h => {
    const pct = ribbonPct_(h * 60);
    const label = h === 12 ? '12p' : (h < 12 ? `${h}a` : `${h - 12}p`);
    return `<span style="left:${pct.toFixed(2)}%">${label}</span>`;
  }).join('');

  return `<div class="ribbon-wrap">
    <div class="ribbon-axis-row">${axisHtml}</div>
    <div class="ribbon">
      <div class="ribbon-track">
        <div class="r-sched" style="left:${schedLeft.toFixed(2)}%;width:${schedWidth.toFixed(2)}%"
          title="Scheduled ${ribbonFormatHm_(schedStart)}–${ribbonFormatHm_(schedEnd)}"></div>
        ${segHtml}
        ${punchHtml}
        ${nowHtml}
      </div>
    </div>
    <div class="ribbon-legend">
      <span class="r-leg-item"><span class="swatch"></span>Worked</span>
      <span class="r-leg-item"><span class="swatch lunch"></span>Lunch</span>
      <span class="r-leg-item"><span class="swatch sched"></span>Scheduled</span>
      ${isActive ? `<span class="r-leg-item"><span class="swatch now"></span>Now</span>` : ''}
    </div>
  </div>`;
}

let _ribbonNowInterval = null;
/** Refreshes the .r-now cursor's left position every 60s. Called from
 *  startClock(); cleared by stopClock(). Cursor element is rendered
 *  inside renderClockView; if it's not in the DOM (rep not currently
 *  active or nav'd away), the interval no-ops. */
function startRibbonNowCursor_() {
  stopRibbonNowCursor_();
  const tz = empTz();
  const tick = () => {
    const cursor = document.getElementById('r-now-cursor');
    if (!cursor) return;
    const nowMin = ribbonTimeToMin_(liveTimeHmsTz(tz));
    cursor.style.left = ribbonPct_(nowMin).toFixed(2) + '%';
  };
  _ribbonNowInterval = setInterval(tick, 60000);
}
function stopRibbonNowCursor_() {
  if (_ribbonNowInterval) { clearInterval(_ribbonNowInterval); _ribbonNowInterval = null; }
}

/** Note-coverage strip (V1·E3). Fetches via getMyMetrics(today). Renders
 *  a donut gauge for note coverage + 30-day mini-bar trend + "File N
 *  missing" CTA when answered > notes. Hides entirely when the rep had
 *  no call activity today (no notes AND no CDR rows). Cached in
 *  CLK_COVERAGE_CACHE to avoid re-fetching on every re-render. */
var CLK_COVERAGE_CACHE = { date: null, data: null };

function loadCoverageStrip_() {
  const slot = document.getElementById('clk-cov-slot');
  if (!slot) return;
  const today = isoDateTz(empTz());
  if (CLK_COVERAGE_CACHE.date === today && CLK_COVERAGE_CACHE.data) {
    renderCoverageStrip_(slot, CLK_COVERAGE_CACHE.data);
    return;
  }
  google.script.run
    .withSuccessHandler(function (data) {
      if (!data || data.error) { slot.innerHTML = ''; return; }
      CLK_COVERAGE_CACHE = { date: today, data };
      // Only render if we're still on the clock view (rep didn't nav away)
      if (currentView === 'clock') renderCoverageStrip_(slot, data);
    })
    .withFailureHandler(function () { slot.innerHTML = ''; })
    .getMyMetrics(today);
}

function renderCoverageStrip_(slot, data) {
  const cdr = data.cdr;
  const noteCount = data.noteCount || 0;
  const answered = cdr ? (cdr.totalAnswered || 0) : 0;
  // Hide entirely if no call activity today (avoids noise for non-CSR reps)
  if (noteCount === 0 && answered === 0) { slot.innerHTML = ''; return; }

  const covPct = data.noteCoverage != null ? data.noteCoverage : null;
  const missing = answered - noteCount;
  const toneCls = covPct == null ? '' : (covPct >= 80 ? '' : (covPct >= 50 ? 'warn' : 'crit'));

  // Donut gauge — coverage ratio expressed on a 0–100 scale, clipped at 100.
  const r = 22, c = 2 * Math.PI * r;
  const pctClipped = Math.max(0, Math.min(100, covPct == null ? 0 : covPct));
  const dashOffset = c * (1 - pctClipped / 100);
  const gauge = `<div class="cov-gauge">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle class="bg" cx="28" cy="28" r="${r}"/>
      <circle class="fg ${toneCls}" cx="28" cy="28" r="${r}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${dashOffset.toFixed(2)}" transform="rotate(-90 28 28)"/>
    </svg>
    <div class="num">${covPct != null ? covPct + '%' : '—'}</div>
  </div>`;

  // 30-day mini-bar trend (from data.trend, %answered per day)
  let trendBars = '';
  if (data.trend && data.trend.length > 0) {
    const max = Math.max(1, ...data.trend.map(d => d.pctAnswered || 0));
    trendBars = '<div class="cov-trend">' + data.trend.map((d, i) => {
      const v = d.pctAnswered || 0;
      const h = v === 0 ? 0 : Math.max(2, Math.round((v / max) * 22));
      const cls = ['bar'];
      if (v === 0) cls.push('zero');
      if (i === data.trend.length - 1) cls.push('today');
      return `<div class="${cls.join(' ')}" title="${esc(d.date + ': ' + v + '%')}" style="height:${h}px"></div>`;
    }).join('') + '</div>';
  }

  const detailLine = answered > 0
    ? `<strong>${noteCount}</strong> notes for <strong>${answered}</strong> calls today`
    : `<strong>${noteCount}</strong> notes today`;

  let ctaHtml = '';
  if (missing > 0) {
    ctaHtml = `<button class="cov-cta" onclick="enterTool('callNotes')">${icon('adjust', 12)}File ${missing} missing</button>`;
  } else if (noteCount > 0 && answered > 0 && covPct >= 100) {
    ctaHtml = `<button class="cov-cta muted" onclick="enterTool('callNotes')">${icon('check', 12)}All covered</button>`;
  }

  slot.innerHTML = `<div class="cov">
    ${gauge}
    <div class="cov-meta">
      <div class="cov-label">Note coverage · today</div>
      <div class="cov-detail">${detailLine}</div>
      ${trendBars}
    </div>
    ${ctaHtml}
  </div>`;
}

/** Load teammate status into the slot below Actions (best-effort, silent on failure). */
function loadTeammateStatus() {
  const slot = document.getElementById('teammate-card-slot');
  if (!slot) return;
  google.script.run
    .withSuccessHandler(data => {
      if (!data || !data.enabled || data.error) { slot.innerHTML = ''; return; }
      renderTeammateCard(slot, data.teammates);
    })
    .withFailureHandler(() => { slot.innerHTML = ''; })
    .getTeammateStatus();
}

function renderTeammateCard(slot, teammates) {
  if (!teammates || teammates.length === 0) { slot.innerHTML = ''; return; }
  const TM_STATUS = {
    clocked_in:  { label:'In',     avCls:'av-active' },
    on_lunch:    { label:'Lunch',  avCls:'av-lunch'  },
    clocked_out: { label:'Done',   avCls:'av-done'   },
    not_in:      { label:'—',      avCls:'av-idle'   },
  };
  const counts = { clocked_in: 0, on_lunch: 0, clocked_out: 0, not_in: 0 };
  teammates.forEach(t => { counts[t.status]++; });
  const summary = `${counts.clocked_in} in · ${counts.on_lunch} on lunch · ${counts.clocked_out + counts.not_in} away`;

  const cardsHtml = teammates.map(t => {
    const meta = TM_STATUS[t.status] || TM_STATUS.not_in;
    const initials = t.name.split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
    const youTag = t.isSelf ? ' <span class="emp-self-tag">you</span>' : '';
    return `<div class="emp-card emp-card-compact${t.isSelf ? ' is-self' : ''}">
      <div class="emp-card-top">
        <div class="emp-avatar ${meta.avCls}">${esc(initials)}</div>
        <div class="emp-name">${esc(t.name)}${youTag}</div>
      </div>
      <div class="emp-status-line">${meta.label}</div>
    </div>`;
  }).join('');

  slot.innerHTML = `
    <div class="card">
      <div class="card-label with-count">
        <span>Team Right Now</span>
        <span style="font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:.04em">${summary}</span>
      </div>
      <div class="emp-grid">${cardsHtml}</div>
    </div>`;
}

function bindSelfUndoBtns() {
  document.querySelectorAll('.punch-undo').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const date = btn.dataset.date;
      const time = btn.dataset.time;
      const type = btn.dataset.type;
      const label = btn.dataset.label || type;
      if (!confirm(`Undo your "${label}" punch at ${dispTime(time)}?\n\nThis only works within ${Math.round(SELF_UNDO_WINDOW_SECONDS/60)} min of the punch.`)) return;
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(result => {
          if (!result.success) {
            btn.disabled = false;
            showToast((result.error || 'Could not undo'), 'toast-error');
            return;
          }
          showToast('Punch undone', 'toast-success');
          google.script.run
            .withSuccessHandler(state => {
              empState = state;
              // Target #clk-section in the combined view so the timesheet
              // section below survives the re-render. Falls back to view-area.
              const area = getClockArea_();
              if (area && currentView === 'clock') renderClockView(area);
              startClock();
            })
            .withFailureHandler(()=>{})
            .getEmployeeState();
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          showToast((err.message||'Server error'), 'toast-error');
        })
        .selfDeletePunch(date, time, type);
    });
  });
}

/** Two-ring PTO donut (annual + sick) shown beneath the hero clock. */
function renderPtoRings(s) {
  if (!s.ptoEnabled) return '';
  const annualMax = Math.max(s.annualLeaveMax || 15, s.annualLeave || 0, 1);
  const sickMax   = Math.max(s.sickLeaveMax   || 10, s.sickLeave   || 0, 1);
  const annual = ptoRingSvg(s.annualLeave, annualMax, 'annual');
  const sick   = ptoRingSvg(s.sickLeave,   sickMax,   'sick');
  return `
    <div class="card pto-card">
      <div class="card-label">Leave Balance</div>
      <div class="pto-rings">
        <div class="pto-ring">
          <div class="pto-svg">${annual.svg}
            <div class="pto-ring-center">
              <div class="pto-ring-val">${annual.label}</div>
              <div class="pto-ring-of">of ${annual.maxLabel}</div>
            </div>
          </div>
          <div class="pto-ring-label">Annual</div>
        </div>
        <div class="pto-ring">
          <div class="pto-svg">${sick.svg}
            <div class="pto-ring-center">
              <div class="pto-ring-val">${sick.label}</div>
              <div class="pto-ring-of">of ${sick.maxLabel}</div>
            </div>
          </div>
          <div class="pto-ring-label">Sick</div>
        </div>
      </div>
    </div>`;
}

function ptoRingSvg(value, max, cls) {
  const v = Math.max(0, Number(value) || 0);
  const m = Math.max(1, Number(max)   || 1);
  const pct = Math.min(1, v / m);
  const r = 48, c = 2 * Math.PI * r;
  const dashOffset = c * (1 - pct);
  const fgCls = v <= 0 ? 'depleted' : cls;
  const svg = `<svg viewBox="0 0 120 120" width="120" height="120">
      <circle class="pto-svg-bg" cx="60" cy="60" r="${r}" stroke-width="10"/>
      <circle class="pto-svg-fg ${fgCls}" cx="60" cy="60" r="${r}" stroke-width="10"
        stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${dashOffset.toFixed(2)}"/>
    </svg>`;
  // Format: integer if whole, .5 if half
  const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, '');
  return { svg, label: fmt(v), maxLabel: fmt(m) };
}

function renderPunchHistory(punches) {
  if (!punches || punches.length === 0)
    return '<div class="no-data">No punches recorded yet today</div>';
  // Use client-local clock to decide which punches are still in the undo window.
  // Server re-validates on submit, so stale UI just causes a friendly error.
  const tz = empTz();
  const nowHMS = liveTimeHmsTz(tz);
  return '<div class="punch-list">' + punches.map(p => {
    const m  = PUNCH_META[p.type] || { label:p.type, icon:'info', dir:p.direction==='IN'?'in':'out' };
    const dc = m.dir === 'in' ? 'in' : 'out';
    const adj = p.isAdjustment ? `<span class="adj-pill">${icon('adjust', 10)} adj</span>` : '';
    const eligible = !p.isAdjustment && timeDiffSecondsClient(p.time, nowHMS) <= SELF_UNDO_WINDOW_SECONDS;
    const undoBtn = eligible
      ? `<button class="punch-undo" title="Undo this punch (within ${Math.round(SELF_UNDO_WINDOW_SECONDS/60)}min)"
           data-date="${esc(empState.today)}" data-time="${esc(p.time)}" data-type="${esc(p.type)}"
           data-label="${esc(m.label)}">×</button>`
      : '';
    return `<div class="punch-row">
      <div class="punch-icon ${dc}">${icon(m.icon, 18)}</div>
      <div class="punch-name">${m.label} ${adj}</div>
      <div class="punch-tag ${dc}">${p.direction}</div>
      <div class="punch-tv">${dispTime(p.time)}</div>
      ${undoBtn}
    </div>`;
  }).join('') + '</div>';
}

/** Live time in tz formatted "HH:mm:ss" — used for client-side undo eligibility. */
function liveTimeHmsTz(tz) {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  }).format(new Date());
}

/** Client mirror of server's timeDiffSeconds_. Returns -1 if either string
 *  is malformed or the result wraps past midnight (punch at 23:58, now at
 *  00:02 → negative raw diff but really 4 minutes). Midnight wrap is capped
 *  at the undo window so a punch from yesterday doesn't look eligible. */
function timeDiffSecondsClient(earlier, later) {
  const toSec = (t) => {
    const p = String(t).split(':');
    if (p.length < 2) return NaN;
    return (parseInt(p[0],10)||0)*3600 + (parseInt(p[1],10)||0)*60 + (parseInt(p[2],10)||0);
  };
  const a = toSec(earlier), b = toSec(later);
  if (isNaN(a) || isNaN(b)) return -1;
  const diff = b - a;
  if (diff >= 0) return diff;
  const wrapped = 86400 + diff;
  return wrapped <= SELF_UNDO_WINDOW_SECONDS ? wrapped : -1;
}

function renderActions(actions) {
  if (!actions || actions.length === 0) return '<div class="no-data">No actions available</div>';
  const onlyAdjust = actions.length === 1 && actions[0] === 'Adjust';
  if (onlyAdjust) {
    return `<div class="shift-done-msg">${icon('checkCircle', 16)}Shift complete for today</div>`
      + `<div class="actions"><button class="sec" data-action="Adjust">${icon('adjust', 18)}Adjust</button></div>`;
  }
  // Pick the primary CTA by state per redesign: prefer ClockIn (start of day) →
  // LunchIn (returning from lunch) → ClockOut (end of day) → first remaining.
  // Adjust is always rendered last as a secondary.
  const order = ['ClockIn', 'LunchIn', 'ClockOut'];
  let primary = order.find(a => actions.indexOf(a) >= 0)
    || actions.find(a => a !== 'Adjust')
    || 'Adjust';
  const secondaries = actions.filter(a => a !== primary && a !== 'Adjust');

  const pm = PUNCH_META[primary];
  const primeCls = primary === 'ClockOut' ? 'prime clockout' : 'prime';
  let html = `<div class="actions">`;
  html += `<button class="${primeCls}" data-action="${primary}">${icon(pm.icon, 18)}${pm.label}</button>`;
  secondaries.forEach(a => {
    const m = PUNCH_META[a];
    html += `<button class="sec" data-action="${a}">${icon(m.icon, 18)}${m.label}</button>`;
  });
  html += `<button class="sec" data-action="Adjust">${icon('adjust', 18)}Adjust</button>`;
  html += `</div>`;
  return html;
}

function bindClockBtns() {
  document.querySelectorAll('.actions .prime, .actions .sec').forEach(btn => {
    btn.addEventListener('click', () => {
      const a = btn.dataset.action;
      if (a === 'Adjust') { openAdjustModal(); return; }
      handlePunch(a);
    });
  });
}

function startClock() {
  stopClock();
  const tz = empTz();
  const tick = () => {
    const el = document.getElementById('live-time');
    if (!el) return;
    const raw = liveTimeTz(tz);   // e.g. "9:34:22 AM"
    const m = raw.match(/^(.*?)\s*(AM|PM)$/i);
    if (m) {
      el.innerHTML = esc(m[1]) + '<span class="ampm">' + esc(m[2]) + '</span>';
    } else {
      el.textContent = raw;
    }
  };
  tick(); clockInterval = setInterval(tick, 1000);
  startRibbonNowCursor_();
}
function stopClock() {
  if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
  stopRibbonNowCursor_();
}

function handlePunch(punchType) {
  const tz = empTz();
  const nowStr = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: 'numeric', minute: '2-digit',
  }).format(new Date());
  if (!confirm(`Record "${PUNCH_META[punchType].label}" at ${nowStr}?`)) return;
  submitPunch(punchType, null);
}

function submitPunch(punchType, custom) {
  setClockBtnsDisabled(true);
  google.script.run
    .withSuccessHandler(result => {
      setClockBtnsDisabled(false);
      if (!result.success) { showToast((result.error||'Error'), 'toast-error'); return; }
      const tag = result.isAdjustment ? ' (adj)' : '';
      showToast(`${PUNCH_META[punchType].label}${tag} at ${result.displayTime}`, 'toast-success');
      google.script.run
        .withSuccessHandler(state => {
          empState = state;
          adjustWindowDays = state.adjustWindowDays || 30;
          // Target #clk-section in the combined Clock+Timesheet view so the
          // timesheet below isn't wiped. Falls back to view-area otherwise.
          const area = getClockArea_();
          if (area && currentView === 'clock') renderClockView(area);
          startClock();
        })
        .withFailureHandler(()=>{})
        .getEmployeeState();
    })
    .withFailureHandler(err => {
      setClockBtnsDisabled(false);
      showToast((err.message||'Server error'), 'toast-error');
    })
    .recordPunch(punchType, custom);
}

function setClockBtnsDisabled(v) { document.querySelectorAll('.actions .prime, .actions .sec').forEach(b => { b.disabled = v; }); }

// ── ADJUST MODAL ──────────────────────────────────────────────────────────
function openAdjustModal() {
  const tz = empTz();
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz });
  const now = new Date();
  const back = new Date(now); back.setDate(back.getDate() - adjustWindowDays);
  const todayIso = fmt.format(now);
  const minIso = fmt.format(back);

  document.getElementById('adj-date').value = todayIso;
  document.getElementById('adj-date').min   = minIso;
  document.getElementById('adj-date').max   = todayIso;
  document.getElementById('adj-time').value = timeHmTz(tz);
  document.getElementById('adj-reason').value = '';
  updateAdjReasonRequirement();
  document.getElementById('adjust-overlay').classList.add('open');
}

/**
 * Switches the reason label between optional / required based on how far back
 * the selected date is from today (in the employee's timezone).
 */
function updateAdjReasonRequirement() {
  const dateInput = document.getElementById('adj-date');
  const label = document.getElementById('adj-reason-label');
  const reason = document.getElementById('adj-reason');
  if (!dateInput || !label || !reason) return;
  const date = dateInput.value;
  if (!date) return;
  const today = isoDateTz(empTz());
  const diff = daysBetweenIso(date, today);
  const threshold = (empState && empState.adjustReasonThresholdDays) || 7;
  if (diff > threshold) {
    label.innerHTML = 'Reason <span class="req-marker">(required)</span>';
    reason.placeholder = `Required — this punch is ${diff} days back. Brief explanation:`;
  } else {
    label.innerHTML = 'Reason <span class="opt-marker">(optional)</span>';
    reason.placeholder = 'e.g. Forgot to clock out, system was down…';
  }
}

function daysBetweenIsoLocal(earlierIso, laterIso) {
  // (kept for callers in this file; prefer shared daysBetweenIso from core)
  return daysBetweenIso(earlierIso, laterIso);
}

document.getElementById('adj-cancel').addEventListener('click', () =>
  document.getElementById('adjust-overlay').classList.remove('open'));
document.getElementById('adjust-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('adjust-overlay'))
    document.getElementById('adjust-overlay').classList.remove('open');
});
document.getElementById('adj-date').addEventListener('change', updateAdjReasonRequirement);

document.getElementById('adj-submit').addEventListener('click', () => {
  const date = document.getElementById('adj-date').value;
  const type = document.getElementById('adj-type').value;
  const time = document.getElementById('adj-time').value;
  const reason = document.getElementById('adj-reason').value.trim();
  if (!date || !time) { showToast('Please fill in all fields','toast-error'); return; }
  const today = isoDateTz(empTz());
  const diff = daysBetweenIso(date, today);
  const threshold = (empState && empState.adjustReasonThresholdDays) || 7;
  if (diff > threshold && !reason) {
    showToast(`A reason is required for adjustments more than ${threshold} days back`, 'toast-error');
    document.getElementById('adj-reason').focus();
    return;
  }
  document.getElementById('adjust-overlay').classList.remove('open');
  submitPunch(type, { date, time, reason });
});
</script>
