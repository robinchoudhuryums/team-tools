<script>
// ════════════════════════════════════════════════════════════════════════════
//  TIMESHEET RANGE HELPERS
//  ────────────────────────────────────────────────────────────────────────
//  The standalone/combined Timesheet VIEW was dismantled in Round 2 · 8b —
//  the pay-period content now lives in the Time / PTO tab's Timesheet-mode
//  side rail (tc/script_timeoff.html :: loadTimesheetSideRail_), which loads
//  its own data via getTimesheetData. What remains here are the two pure
//  range helpers that side rail still uses. The orphaned render cluster
//  (loadTimesheet / renderTimesheetView / renderTimesheetCalendar /
//  renderDayCard / ptChip / rangeLabel / parseIso) was pruned in Cycle 2
//  (L11) — it was unreachable, and its retained `currentView === 'clock'`
//  guard could only ever fail, a tripwire pointing the wrong way.
// ════════════════════════════════════════════════════════════════════════════

/** Pay-period ('period', biweekly anchored to empState.payAnchor) or calendar
 *  month range containing refDateIso, shifted by `offset` periods/months.
 *  UTC-noon anchoring keeps the arithmetic DST-safe. */
function computeRange(mode, refDateIso, offset) {
  const ref = new Date(refDateIso + 'T12:00:00Z');
  if (mode === 'period' && empState && empState.payAnchor) {
    const anchor = new Date(empState.payAnchor + 'T12:00:00Z');
    const daysDiff = Math.round((ref - anchor) / 86400000);
    const currentIdx = Math.floor((daysDiff + 13) / 14);
    const idx = currentIdx + offset;
    const endMs = anchor.getTime() + idx * 14 * 86400000;
    const startMs = endMs - 13 * 86400000;
    return { start: isoFromMs(startMs), end: isoFromMs(endMs) };
  }
  const y = ref.getUTCFullYear();
  const m = ref.getUTCMonth();
  const targetDate = new Date(Date.UTC(y, m + offset, 1));
  const ty = targetDate.getUTCFullYear();
  const tm = targetDate.getUTCMonth();
  const lastDay = new Date(Date.UTC(ty, tm + 1, 0)).getUTCDate();
  return { start: `${ty}-${pad(tm+1)}-01`, end: `${ty}-${pad(tm+1)}-${pad(lastDay)}` };
}

function isoFromMs(ms) {
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
}
</script>
