<script>
// ════════════════════════════════════════════════════════════════════════════
//  TIME OFF VIEW
// ════════════════════════════════════════════════════════════════════════════

// Per-(year, month) calendar payload cache for instant-paint month navigation
// (stale-while-revalidate). Cleared on any time-off mutation so a PTO change is
// never masked by a stale cached month.
var CAL_CACHE = {};
function calCacheKey_(y, m) { return y + '-' + m; }

// F(L-6): a non-silent load renders the full-view spinner first — on error the
// toast alone stranded the view on "Loading…" forever. Replace the loader with
// a retryable error state (the Metrics pattern); silent refreshes keep the
// already-painted view and just toast.
function calLoadError_(msg, opts) {
  showToast(msg, 'toast-error');
  if (opts && opts.silent) return;
  const area = document.getElementById('view-area');
  if (area && currentView === 'timeoff') {
    area.innerHTML = '<div class="state-center"><p>' + esc(msg) + '</p>' +
      '<button class="refresh-btn" onclick="enterTimeoffView()">' + icon('refresh', 12) + 'Retry</button></div>';
  }
}

function loadCalendar(year, month, opts) {
  opts = opts || {};
  google.script.run
    .withSuccessHandler(data => {
      if (opts.silent) viewRefreshingPill_(false);
      if (data.error) { calLoadError_(data.error, opts); return; }
      CAL_CACHE[calCacheKey_(year, month)] = { data: data, at: Date.now() };
      // Render only if the user is still on this exact month — a fast double-nav
      // or a nav-away must not let a late/stale fetch clobber the current view.
      // (Every caller sets calYear/calMonth to its target before calling.)
      if (currentView !== 'timeoff' || year !== calYear || month !== calMonth) return;
      calData = data;
      const area = document.getElementById('view-area');
      if (area) renderTimeOffView(area, data);
    })
    .withFailureHandler(err => { if (opts.silent) viewRefreshingPill_(false); calLoadError_((err.message||'Load failed'), opts); })
    .getCalendarData(year, month);
}

// Month navigation with instant-paint: repaint from the per-month cache
// immediately (no full-view spinner), then revalidate in the background behind
// the shared "Refreshing…" pill when the cached copy is stale. A cache miss
// falls back to the full loader. Mirrors the #81/#82 stale-while-revalidate pattern.
function calNavTo_(ny, nm) {
  calYear = ny; calMonth = nm;
  const area = document.getElementById('view-area');
  const entry = CAL_CACHE[calCacheKey_(ny, nm)];
  if (entry && entry.data) {
    calData = entry.data;
    if (area) renderTimeOffView(area, entry.data);          // instant
    if (typeof viewCacheFresh_ !== 'function' || !viewCacheFresh_(entry, VIEW_CACHE_TTL_MS)) {
      viewRefreshingPill_(true);
      loadCalendar(ny, nm, { silent: true });               // quiet background refresh
    }
  } else {
    if (area) renderLoading(area, 'Loading calendar…', 'clock');
    loadCalendar(ny, nm);
  }
}

function renderTimeOffView(area, data) {
  const tz = empTz();
  const todayIso = data.today || isoDateTz(tz);
  const todayParts = todayIso.split('-');
  const todayY = parseInt(todayParts[0], 10);
  const todayM = parseInt(todayParts[1], 10);
  const curYM = todayY * 12 + todayM;
  const thisYM = data.year * 12 + data.month;
  const canPrev = thisYM > curYM - 3;
  const canNext = thisYM < curYM + 3;

  const workedSet = new Set(data.workedDates);
  const hoursMap = data.workedHoursByDate || {};
  const ownMap = {};
  data.timeOffRequests.forEach(r => { ownMap[r.date] = r; });
  const tmByDate = {};
  data.teammates.forEach(t => {
    if (!tmByDate[t.date]) tmByDate[t.date] = [];
    tmByDate[t.date].push(t);
  });
  const holidayMap = {};
  data.holidays.forEach(h => { holidayMap[h.date] = h; });

  // ── Leave balance (right rail beside calendar, Round 2 · 8d tile) ──────
  // Rectangular tile replaces the prior PTO ring donut. Shows current annual
  // balance, a progress bar against the annual max, and a footer with
  // planned upcoming days + projected balance after those plans land.
  // Per-employee ptoEnabled flag hides this entirely for contractors.
  let balanceCardHtml = '';
  if (data.ptoEnabled && data.annualLeave !== undefined) {
    const annual = data.annualLeave || 0;
    const annualMax = Math.max(data.annualLeaveMax || 15, annual, 1);
    const pct = Math.min(100, Math.max(0, (annual / annualMax) * 100));
    // Sum planned days: upcoming requests (today and future) that are
    // pending or approved, using the same LEAVE_DEDUCTION_CLIENT map as
    // the day-modal balance preview (INV-72: client mirror of server's
    // getLeaveDeduction_; stays in sync).
    const todayIsoLocal = data.today || isoDateTz(empTz());
    const upcomingReqs = (data.allRequests || [])
      .filter(r => r.date >= todayIsoLocal)
      .filter(r => {
        const s = String(r.status || '').toLowerCase();
        return s === 'pending' || s === 'approved';
      })
      .sort((a, b) => a.date.localeCompare(b.date));
    let plannedDays = 0;         // all upcoming annual PTO (pending + approved) — the "Nd planned" tally
    let pendingPlannedDays = 0;  // only PENDING is not-yet-deducted (F4)
    upcomingReqs.forEach(r => {
      const ded = (typeof getLeaveDeductionClient_ === 'function')
        ? getLeaveDeductionClient_(r.type)
        : { bucket: 'annual', days: 1.0 };
      if (ded.bucket === 'annual') {
        const days = ded.days || 0;
        plannedDays += days;
        if (String(r.status || '').toLowerCase() === 'pending') pendingPlannedDays += days;
      }
    });
    plannedDays = Math.round(plannedDays * 10) / 10;
    pendingPlannedDays = Math.round(pendingPlannedDays * 10) / 10;
    // Projected balance AFTER upcoming plans land. The server already deducted
    // APPROVED future requests from `annual` (Pending→Approved transition,
    // INV-03/25), so subtracting them again double-counts — only the PENDING
    // days are not-yet-deducted. (F4: the old `annual - plannedDays` understated
    // the post-plan balance by every approved upcoming day.)
    const remaining = Math.round((annual - pendingPlannedDays) * 10) / 10;
    // Months left in the current calendar year, derived from the employee-tz
    // "today" (todayIso = data.today) — NOT browser-local time, which is wrong
    // across a tz boundary on Dec 31 / Jan 1 (F18). 0-indexed month: January →
    // 12 left, December → 1 left; current month counts as remaining.
    const curYear = parseInt(todayIso.slice(0, 4), 10);
    const monthsLeft = 12 - (parseInt(todayIso.slice(5, 7), 10) - 1);
    // Next-request label: first upcoming request's date as "MMM D", or empty.
    let nextLabel = '';
    if (upcomingReqs.length > 0) {
      const p = upcomingReqs[0].date.split('-');
      nextLabel = `${MONTH_NAMES[parseInt(p[1],10)-1].slice(0,3).toUpperCase()} ${parseInt(p[2],10)}`;
    }
    const ftrRight = upcomingReqs.length > 0
      ? `${formatLeaveDays(remaining)}d after ${nextLabel}`
      : 'nothing planned';
    balanceCardHtml = `
      <div class="pto-tile">
        <div class="head">
          <span class="lbl">Annual leave</span>
          <span class="meta">${curYear} · ${monthsLeft}MO LEFT</span>
        </div>
        <div class="v-row">
          <span class="v num">${formatLeaveDays(annual)}</span>
          <span class="denom">/ ${formatLeaveDays(annualMax)} days</span>
        </div>
        <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
        <div class="ftr">
          <span>${formatLeaveDays(plannedDays)}d planned</span>
          <span>${esc(ftrRight)}</span>
        </div>
      </div>`;
  }

  let calHtml = '<div class="cal-grid">';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => { calHtml += `<div class="cal-dow">${d}</div>`; });
  for (let i = 0; i < data.firstDayOfWeek; i++) calHtml += '<div class="cal-cell"></div>';

  for (let d = 1; d <= data.lastDay; d++) {
    const dateStr = `${data.year}-${String(data.month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(data.year, data.month - 1, d).getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isToday = dateStr === todayIso;
    const hasWork = workedSet.has(dateStr);
    const own = ownMap[dateStr];
    const tms = tmByDate[dateStr];
    const hol = holidayMap[dateStr];
    const hasContent = hasWork || own || (tms && tms.length) || hol || (dateStr >= todayIso && !isWeekend);

    let cls = 'cal-cell';
    if (isWeekend) cls += ' weekend';
    if (isToday) cls += ' today';
    if (hasWork && !own) cls += ' has-worked';
    if (own) {
      const st = (own.status||'').toLowerCase();
      cls += st==='approved'?' has-approved':st==='denied'?' has-denied':' has-pending';
    }
    if (hasContent) cls += ' clickable';
    // Round 2 · 8c — hover-triggered day modal. Use data-date so
    // bindCalHover_ can install mouseenter/leave/click handlers via
    // event delegation; the legacy inline onclick path is replaced.
    // A11y batch H: interactive cells are keyboard-reachable (tabindex=0 +
    // role=button; Enter/Space pins the day modal — bound in bindCalHover_)
    // and carry an aria-label summarizing the day's state, since the dots/
    // badges are visual-only.
    let ariaLabel = '';
    if (hasContent) {
      const parts = [MONTH_NAMES[data.month - 1] + ' ' + d];
      if (isToday) parts.push('today');
      if (hol) parts.push('US holiday');
      if (hasWork) parts.push('worked');
      if (own) parts.push(((own.type || 'time off') + ' ' + (own.status || '')).trim());
      if (tms && tms.length) parts.push(tms.length + ' teammate' + (tms.length > 1 ? 's' : '') + ' off');
      ariaLabel = parts.join(', ');
    }
    const dataAttr = hasContent
      ? `data-date="${dateStr}" role="button" tabindex="0" aria-label="${esc(ariaLabel)}"`
      : '';
    let dot = '';
    if (hasWork && !own) dot = '<div class="cal-dot worked"></div>';
    if (own) {
      const st = (own.status||'').toLowerCase();
      dot = `<div class="cal-dot ${st==='approved'?'approved':st==='denied'?'denied':'pending'}"></div>`;
    }
    const holidayMark = hol ? `<div class="cal-holiday">${icon('star', 12)}</div>` : '';
    // Corner badge priority: worked hours > teammate count
    let cornerMark = '';
    const hrs = hoursMap[dateStr];
    if (hasWork && hrs !== undefined && hrs !== null && hrs !== 'inProgress') {
      cornerMark = `<div class="cal-hrs">${formatHoursShort(hrs)}</div>`;
    } else if (hasWork && hrs === 'inProgress') {
      cornerMark = `<div class="cal-hrs in-progress">●</div>`;
    } else if (tms && tms.length) {
      cornerMark = `<div class="cal-tm">+${tms.length}</div>`;
    }
    calHtml += `<div class="${cls}" ${dataAttr}>${holidayMark}<span class="cal-dn">${d}</span>${dot}${cornerMark}</div>`;
  }
  calHtml += '</div>';

  // Legend — tokens fixed (the prior `--green`/`--amber`/`--blue`/
  // `--ink-s`/`--ink-m` were never defined anywhere and rendered as
  // browser-default colors).
  const legendHtml = `<div class="cal-legend">
    <div class="leg-item"><div class="leg-dot" style="background:var(--good);border-radius:1px"></div>Worked</div>
    <div class="leg-item"><div class="leg-dot" style="background:transparent;border:1.5px solid var(--warn);box-sizing:border-box"></div>Pending</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--accent)"></div>Approved</div>
    <div class="leg-item"><span class="leg-star">${icon('star', 12)}</span>US Holiday</div>
    <div class="leg-item"><span style="font-family:var(--mono);font-weight:600;font-size:10px;color:var(--muted);letter-spacing:.04em">+N</span>Teammates off</div>
    <div class="leg-item" style="color:var(--muted);font-size:11px;width:100%">Tap any day for details</div>
  </div>`;

  let reqHtml = '';
  if (data.allRequests && data.allRequests.length > 0) {
    reqHtml = `<hr class="section-divider">
      <div class="card-label" style="margin-bottom:10px">Your Requests</div>
      <div class="req-list">` +
      data.allRequests.map(r => {
        const p = r.date.split('-');
        const mo = MONTH_NAMES[parseInt(p[1],10)-1].slice(0,3).toUpperCase();
        const dy = parseInt(p[2],10);
        const st = (r.status||'pending').toLowerCase();
        const bCls = st==='approved'?'rb-approved':st==='denied'?'rb-denied':'rb-pending';
        const cancelBtn = st === 'pending'
          ? `<button class="req-cancel-btn" data-date="${esc(r.date)}" data-submitted="${esc(r.submittedAt)}">Cancel</button>`
          : '';
        return `<div class="req-card">
          <div class="req-date-block"><div class="req-date-d">${dy}</div><div class="req-date-m">${mo}</div></div>
          <div class="req-info"><div class="req-type">${esc(r.type)}</div>
            ${r.notes && r.notes !== 'undefined' ? `<div class="req-notes">${esc(r.notes)}</div>` : ''}</div>
          <div class="req-side">
            <div class="req-badge ${bCls}">${esc(r.status)}</div>
            ${cancelBtn}
          </div>
        </div>`;
      }).join('') + '</div>';
  }

  // Round 2 · 8b — Time / PTO merge. Mode toggle picks the side rail
  // emphasis: Time Off (default) shows the PTO tile + upcoming-request
  // context; Timesheet shows the rep's pay-period totals + recent days.
  // Persisted to localStorage.umsMergeMode. The calendar itself is
  // unchanged in both modes — it carries worked-hours AND PTO badges.
  const mergeMode = (function () {
    try {
      const v = localStorage.getItem('umsMergeMode');
      return v === 'timesheet' ? 'timesheet' : 'timeoff';
    } catch (e) { return 'timeoff'; }
  })();
  const modeBar = `
    <div class="mp-modes" role="tablist" aria-label="Time / PTO mode">
      <button type="button" role="tab" class="mp-mode${mergeMode==='timeoff'?' on':''}" data-mode="timeoff" aria-selected="${mergeMode==='timeoff'}">${icon('timeoff', 13)} Time Off</button>
      <button type="button" role="tab" class="mp-mode${mergeMode==='timesheet'?' on':''}" data-mode="timesheet" aria-selected="${mergeMode==='timesheet'}">${icon('timesheet', 13)} Timesheet</button>
    </div>`;
  const sideRailHtml = mergeMode === 'timesheet'
    ? `<div id="ts-side-rail">${renderTimesheetSideRailPlaceholder_()}</div>`
    : balanceCardHtml;

  area.innerHTML = `
    ${COMPACT_MODE
      ? `<div class="compact-header"><div class="ch-title">${icon('timeoff', 16)} Time / PTO</div><div class="ch-actions"><button class="ch-action-btn" title="Close window" onclick="window.close()">${icon('x', 14)}</button></div></div>`
      : `<div class="app-bar"><div class="app-bar-left"><div class="breadcrumb"><span>Time Clock</span><span class="crumb-sep">›</span><span class="crumb-current">Time / PTO</span></div><h1 class="display-title">Time / PTO</h1></div><div class="app-bar-right">${modeBar}</div></div>`}
    ${COMPACT_MODE ? modeBar : ''}
    <div class="month-nav">
      <button class="month-nav-btn" id="cal-prev" ${!canPrev?'disabled':''} aria-label="Previous month">${icon('chevronLeft', 16)}</button>
      <span class="month-label">${esc(data.monthName)}</span>
      <button class="month-nav-btn" id="cal-next" ${!canNext?'disabled':''} aria-label="Next month">${icon('chevronRight', 16)}</button>
    </div>
    <div class="timeoff-layout">
      <div class="timeoff-main">
        <div class="card cal-card">${calHtml}${legendHtml}</div>
      </div>
      <div class="timeoff-side">
        ${sideRailHtml}
      </div>
    </div>
    ${reqHtml}`;

  document.getElementById('cal-prev').addEventListener('click', () => {
    if (!canPrev) return;
    const nm = data.month === 1 ? 12 : data.month - 1;
    const ny = data.month === 1 ? data.year - 1 : data.year;
    calNavTo_(ny, nm);
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    if (!canNext) return;
    const nm = data.month === 12 ? 1 : data.month + 1;
    const ny = data.month === 12 ? data.year + 1 : data.year;
    calNavTo_(ny, nm);
  });

  // Round 2 · 8c — wire hover (or tap-only on touch) for the day modal.
  bindCalHover_();

  // Round 2 · 8b — mode toggle wiring. Persists to localStorage and
  // re-renders the entire view (calendar + side rail) so the new mode's
  // chrome shows up cleanly.
  document.querySelectorAll('.mp-mode').forEach(btn => {
    btn.addEventListener('click', () => {
      const next = btn.dataset.mode;
      if (next === mergeMode) return;
      try { localStorage.setItem('umsMergeMode', next); } catch (e) {}
      // Re-render via the existing calendar render path
      renderTimeOffView(area, data);
    });
  });

  // Round 2 · 8b — if we're in Timesheet mode, fetch the rep's current
  // pay-period data to populate the side rail. tsData lives at module
  // scope so it stays warm across renders; the lazy fetch ensures the
  // tile shows real numbers within a second or two of entering the tab.
  if (mergeMode === 'timesheet') {
    loadTimesheetSideRail_();
  }

  // Cancel button wiring
  document.querySelectorAll('.req-cancel-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const date = btn.dataset.date;
      const submittedAt = btn.dataset.submitted;
      const parts = date.split('-');
      const human = `${MONTH_NAMES[parseInt(parts[1],10)-1].slice(0,3)} ${parseInt(parts[2],10)}, ${parts[0]}`;
      uiConfirm({
        title: 'Cancel time off',
        message: `Cancel your time off request for ${human}?`,
        confirmLabel: 'Cancel request',
        cancelLabel: 'Keep it',
        tone: 'danger',
      }).then(ok => {
        if (!ok) return;
        btn.disabled = true;
        btn.textContent = '...';
        google.script.run
          .withSuccessHandler(r => {
            if (!r.success) {
              btn.disabled = false; btn.textContent = 'Cancel';
              showToast((r.error||'Error'), 'toast-error');
              return;
            }
            showToast('Request cancelled', 'toast-success');
            CAL_CACHE = {};   // a PTO change invalidates every cached month
            refreshViewIfCurrent('timeoff', 'Loading calendar…', function () { loadCalendar(calYear, calMonth); });
          })
          .withFailureHandler(err => {
            btn.disabled = false; btn.textContent = 'Cancel';
            showToast((err.message||'Server error'), 'toast-error');
          })
          .cancelTimeOffRequest(date, submittedAt);
      });
    });
  });
}

function formatLeaveDays(n) {
  if (n === null || n === undefined) return '—';
  // Show as integer if whole, else 1 decimal
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

// ── ROUND 2 · 8b — TIMESHEET-MODE SIDE RAIL ────────────────────────────
// In Timesheet mode the side rail shows the rep's current pay-period
// totals (mirror of the .pto-tile layout, tuned for hours) plus a
// recent-activity list (last 5 days with data). tsData is the source
// of truth — fetched via the existing getTimesheetData endpoint.

/** Placeholder rendered into #ts-side-rail before tsData arrives. */
function renderTimesheetSideRailPlaceholder_() {
  return `
    <div class="pto-tile">
      <div class="head"><span class="lbl">Pay period</span><span class="meta">LOADING</span></div>
      <div class="v-row"><span class="v num">—</span><span class="denom">/ — hours</span></div>
      <div class="bar"><i style="width:0%"></i></div>
      <div class="ftr"><span>—</span><span>—</span></div>
    </div>`;
}

/** Fires getTimesheetData for the rep's current pay period (biweekly if
 *  configured, else current calendar month) and updates the side rail
 *  with the resulting totals + recent days list. */
function loadTimesheetSideRail_() {
  // Compute range. Mirrors enterClockCombinedView's prior logic: use
  // existing tsViewMode + computeRange so cached tsData (if present from
  // a previous load) reflects the rep's payCycle.
  const range = computeRange(tsViewMode, isoDateTz(empTz()), 0);
  google.script.run
    .withSuccessHandler(data => {
      if (!data || data.error) return;
      tsData = data; tsStart = data.startDate; tsEnd = data.endDate;
      if (currentView !== 'timeoff') return;
      const slot = document.getElementById('ts-side-rail');
      if (slot) slot.innerHTML = renderTimesheetSideRail_(data);
    })
    .withFailureHandler(() => {})
    .getTimesheetData(range.start, range.end);
}

/** Renders the populated Timesheet side rail: pay-period tile + recent
 *  activity list. Target hours derived from payCycle (80 for biweekly,
 *  8 × working-days for monthly fallback). */
function renderTimesheetSideRail_(d) {
  const totalHours = Number(d.totalHours) || 0;
  const daysWorked = Number(d.daysWorked) || 0;
  // Target: biweekly = 80h; monthly = 8h × business days in the range.
  let targetHours;
  if (d.payCycle === 'Biweekly') {
    targetHours = 80;
  } else {
    // Count weekdays in days[]
    const weekdayCount = (d.days || []).filter(x => !x.isWeekend).length;
    targetHours = weekdayCount * 8;
  }
  const pct = targetHours > 0 ? Math.min(100, Math.max(0, (totalHours / targetHours) * 100)) : 0;
  const rangeLabel = (() => {
    if (!d.startDate || !d.endDate) return '';
    const s = d.startDate.split('-'), e = d.endDate.split('-');
    const sm = MONTH_NAMES[parseInt(s[1],10)-1].slice(0,3).toUpperCase();
    const em = MONTH_NAMES[parseInt(e[1],10)-1].slice(0,3).toUpperCase();
    return `${sm} ${parseInt(s[2],10)} – ${em} ${parseInt(e[2],10)}`;
  })();
  const incompleteHtml = d.incompleteCount > 0
    ? `<span style="color:var(--warning-deep)">${d.incompleteCount} incomplete</span>`
    : 'all complete';

  // Recent activity list — last 5 days with data, newest first.
  const recent = (d.days || []).filter(x => x.hasData).slice(-5).reverse();
  const recentHtml = recent.length === 0
    ? '<div class="no-data" style="padding:14px 0">No recent activity in this period</div>'
    : `<div class="ts-recent-list">${recent.map(x => {
        const dateParts = x.date.split('-');
        const dlabel = `${MONTH_NAMES[parseInt(dateParts[1],10)-1].slice(0,3)} ${parseInt(dateParts[2],10)}`;
        const hrs = (typeof x.hoursWorked === 'number') ? fmtHrs(x.hoursWorked) : (x.inProgress ? '·' : '—');
        const inOut = (x.clockIn && x.clockOut)
          ? `${dispTime(x.clockIn)} – ${dispTime(x.clockOut)}`
          : (x.clockIn ? `${dispTime(x.clockIn)} – —` : '—');
        const incomp = x.isIncomplete
          ? '<span class="ts-recent-warn">incomplete</span>'
          : '';
        return `<div class="ts-recent-row">
          <div class="ts-recent-d">${esc(dlabel)}</div>
          <div class="ts-recent-mid">${esc(inOut)} ${incomp}</div>
          <div class="ts-recent-h">${esc(hrs)}</div>
        </div>`;
      }).join('')}</div>`;

  return `
    <div class="pto-tile">
      <div class="head"><span class="lbl">Pay period</span><span class="meta">${esc(rangeLabel)}</span></div>
      <div class="v-row">
        <span class="v num">${fmtHrs(totalHours)}</span>
        <span class="denom">/ ${targetHours}h target</span>
      </div>
      <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="ftr">
        <span>${daysWorked}d worked</span>
        <span>${incompleteHtml}</span>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="card-label">Recent activity</div>
      ${recentHtml}
    </div>`;
}

// ── DAY DETAILS MODAL ─────────────────────────────────────────────────────
// Client-side leave-deduction map. Mirrors server's getLeaveDeduction_
// (Code.js) — keep in sync if the server map changes. Used for the
// V1·E2 balance-after preview row that updates live as the rep selects
// a Type. Unknown types default to { annual, 1.0 } matching the server.
const LEAVE_DEDUCTION_CLIENT = {
  'Full Day':              { bucket: 'annual', days: 1.0 },
  'Half Day - Morning':    { bucket: 'annual', days: 0.5 },
  'Half Day - Afternoon':  { bucket: 'annual', days: 0.5 },
  'Sick Leave':            { bucket: 'sick',   days: 1.0 },
  'Personal Day':          { bucket: 'annual', days: 1.0 },
  'Unpaid Leave':          { bucket: null,     days: 0   },
};
function getLeaveDeductionClient_(type) {
  // Case-insensitive + trimmed lookup to mirror the server's
  // getLeaveDeduction_ (which lowercases + trims) — INV-72. The map above
  // stays the source of truth for the type list; this just matches the
  // server's matching semantics so a casing difference can't mis-preview.
  const key = String(type || '').trim().toLowerCase();
  for (const k in LEAVE_DEDUCTION_CLIENT) {
    if (k.toLowerCase() === key) return LEAVE_DEDUCTION_CLIENT[k];
  }
  return { bucket: 'annual', days: 1.0 };
}

function openDayModal(dateStr) {
  if (!calData) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
  dayModalDate = dateStr;
  const todayIso = calData.today || isoDateTz(empTz());
  const parts = dateStr.split('-');
  const dateObj = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  const dow = dateObj.getDay();
  const isWeekend = dow === 0 || dow === 6;
  const dateLabel = `${DOW_NAMES[dow]}, ${MONTH_NAMES[parseInt(parts[1],10)-1]} ${parseInt(parts[2],10)}`;
  const workedSet = new Set(calData.workedDates);
  const hasWork = workedSet.has(dateStr);
  const own = calData.timeOffRequests.find(r => r.date === dateStr);
  const teammates = calData.teammates.filter(t => t.date === dateStr);
  const holiday = calData.holidays.find(h => h.date === dateStr);

  document.getElementById('day-title').textContent = dateLabel;
  document.getElementById('day-subtitle').textContent = parts[0];

  let body = '';

  // Your-status row first when applicable (already-requested or already-worked)
  if (own) {
    const st = (own.status||'pending').toLowerCase();
    const cls = st==='approved'?'own-approved':st==='denied'?'own-denied':'own-pending';
    body += `<div class="day-section"><div class="day-info-row ${cls}">
      <span class="di-icon">${icon('info', 16)}</span>
      <span class="di-text">Your time off request: ${esc(own.type)}${own.notes && own.notes !== 'undefined' ? ' — ' + esc(own.notes) : ''}</span>
      <span class="di-tag">${esc(own.status)}</span>
    </div></div>`;
  } else if (hasWork) {
    body += `<div class="day-section"><div class="day-info-row worked">
      <span class="di-icon">${icon('checkCircle', 16)}</span><span class="di-text">You worked this day</span>
    </div></div>`;
  }

  // V1·E2 — Heads-up conflict banners (holiday + teammates). Stacked
  // .conflict rows with info/warn tones so the rep sees the actionable
  // signals before they pick a type.
  const headsUpBanners = [];
  if (holiday) {
    headsUpBanners.push(
      `<div class="conflict info">${icon('star', 14)}<span><strong>${esc(holiday.name)}</strong> — US holiday<span class="conflict-sub">Federal observance; offices may be closed.</span></span></div>`
    );
  }
  if (teammates.length > 0) {
    const apprCount = teammates.filter(t => (t.status||'').toLowerCase() === 'approved').length;
    const pendCount = teammates.filter(t => (t.status||'').toLowerCase() === 'pending').length;
    const breakdownParts = [];
    if (apprCount > 0) breakdownParts.push(`${apprCount} approved off`);
    if (pendCount > 0) breakdownParts.push(`${pendCount} pending`);
    const names = teammates.slice(0, 3).map(t => esc(t.name)).join(', ')
      + (teammates.length > 3 ? `, +${teammates.length - 3} more` : '');
    headsUpBanners.push(
      `<div class="conflict warn">${icon('info', 14)}<span><strong>${teammates.length} teammate${teammates.length>1?'s':''} off</strong> · ${breakdownParts.join(', ')}<span class="conflict-sub">${names}</span></span></div>`
    );
  }
  // "Day is clear" banner — only when the rep COULD request (not weekend,
  // future-or-today, not already requested) and there are no conflicts.
  const canRequest = !isWeekend && dateStr >= todayIso && !own;
  if (canRequest && headsUpBanners.length === 0) {
    headsUpBanners.push(
      `<div class="conflict ok">${icon('checkCircle', 14)}<span>No conflicts — clear day on the calendar.</span></div>`
    );
  }
  if (headsUpBanners.length > 0) {
    body += `<div class="day-section">
      <div class="day-section-label">Heads up</div>
      ${headsUpBanners.join('')}
    </div>`;
  }

  // Teammates roster (kept as a section so the rep can scan WHO is off).
  if (teammates.length > 0) {
    let tmHtml = `<div class="day-section"><div class="day-section-label">Teammates off (${teammates.length})</div>`;
    teammates.forEach(t => {
      const st = (t.status||'pending').toLowerCase();
      tmHtml += `<div class="tm-row">
        <span class="tm-name">${esc(t.name)}</span>
        <span class="tm-type">${esc(t.type)}</span>
        <span class="tm-badge ${st}">${esc(t.status)}</span></div>`;
    });
    tmHtml += `</div>`;
    body += tmHtml;
  }

  // Past-day no-op fallback.
  if (!body && !isWeekend && dateStr >= todayIso) {
    body = `<div class="day-section"><div class="day-info-row">
      <span class="di-icon">${icon('timeoff', 16)}</span><span class="di-text">No activity recorded for this day yet.</span></div></div>`;
  }
  document.getElementById('day-body').innerHTML = body;

  const formSec = document.getElementById('day-form-section');
  const submitBtn = document.getElementById('day-submit');
  if (canRequest) {
    formSec.style.display = ''; submitBtn.style.display = '';
    document.getElementById('day-type').value = 'Full Day';
    document.getElementById('day-notes').value = '';
    updateDayBalancePreview_();
  } else {
    formSec.style.display = 'none'; submitBtn.style.display = 'none';
  }
  document.getElementById('day-overlay').classList.add('open');
}

/** Live-updates the "Annual leave after" preview row when the rep
 *  picks a Type. Skipped entirely when PTO tracking is off or the
 *  selected type deducts from no bucket (Unpaid Leave). */
function updateDayBalancePreview_() {
  const previewEl = document.getElementById('day-balance-preview');
  if (!previewEl) return;
  if (!calData || !calData.ptoEnabled) { previewEl.innerHTML = ''; return; }
  const type = document.getElementById('day-type').value;
  const ded = getLeaveDeductionClient_(type);
  if (!ded.bucket) {
    previewEl.innerHTML = `<div class="balance-after">
      <span class="ba-label">Balance impact</span>
      <span class="ba-val">No deduction (unpaid)</span>
    </div>`;
    return;
  }
  const cur = ded.bucket === 'sick' ? (calData.sickLeave || 0) : (calData.annualLeave || 0);
  const proj = +(cur - ded.days).toFixed(2);
  const bucketLabel = ded.bucket === 'sick' ? 'Sick leave after' : 'Annual leave after';
  const projCls = proj < 0 ? 'neg' : '';
  previewEl.innerHTML = `<div class="balance-after">
    <span class="ba-label">${bucketLabel}</span>
    <span class="ba-val">${formatLeaveDays(cur)} → <strong class="${projCls}">${formatLeaveDays(proj)}</strong> days</span>
  </div>`;
}

document.getElementById('day-cancel').addEventListener('click', () => {
  dayPopoverPinned = false;
  closeDayPopover_();
});
document.getElementById('day-overlay').addEventListener('click', e => {
  // Clicking outside the modal closes + unpins. In hover-mode the overlay
  // backdrop is transparent + non-interactive (pointer-events:none), so this
  // path only fires when the modal is pinned (regular centered modal).
  if (e.target === document.getElementById('day-overlay')) {
    dayPopoverPinned = false;
    closeDayPopover_();
  }
});

// ── ROUND 2 · 8c — HOVER-TRIGGERED DAY MODAL ───────────────────────────
// Cells with [data-date] open the day modal on mouseenter (120ms grace),
// schedule close on mouseleave (200ms grace — cancelled if the cursor
// enters the modal). Click pins the modal until click-outside or Esc.
// On touch devices (matchMedia '(hover: none)') hover is skipped and only
// tap pins. The shell-level Escape handler in script_core.html closes any
// open .overlay; my listener below piggybacks to reset the pin flag.
let dayHoverTimer = null, dayCloseTimer = null, dayPopoverPinned = false;

function bindCalHover_() {
  const overlay = document.getElementById('day-overlay');
  if (!overlay) return;
  const isTouchOnly = (typeof window.matchMedia === 'function')
    && window.matchMedia('(hover: none)').matches;
  document.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
    // Click always pins the modal (works on hover AND touch devices).
    cell.addEventListener('click', () => {
      clearTimeout(dayHoverTimer); clearTimeout(dayCloseTimer);
      openDayPopover_(cell, /* pin */ true);
    });
    // A11y batch H: Enter/Space on a focused cell = click (pin the modal).
    cell.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      clearTimeout(dayHoverTimer); clearTimeout(dayCloseTimer);
      openDayPopover_(cell, /* pin */ true);
    });
    // Hover-open only on hover-capable input devices.
    if (isTouchOnly) return;
    cell.addEventListener('mouseenter', () => {
      clearTimeout(dayCloseTimer);
      if (dayPopoverPinned) return;
      clearTimeout(dayHoverTimer);
      // D6 (cycle 10): a removed cell never fires mouseleave, so a pending
      // hover timer could open the (static, view-outliving) popover with
      // stale calData over whatever view replaced the calendar. Fire only if
      // the cell is still in the live DOM.
      dayHoverTimer = setTimeout(() => { if (document.contains(cell)) openDayPopover_(cell, false); }, 120);
    });
    cell.addEventListener('mouseleave', () => {
      clearTimeout(dayHoverTimer);
      if (dayPopoverPinned) return;
      dayCloseTimer = setTimeout(closeDayPopover_, 200);
    });
  });
  // Modal itself cancels close on enter, schedules on leave
  if (!overlay._cnHoverBound) {
    overlay._cnHoverBound = true;
    overlay.addEventListener('mouseenter', () => clearTimeout(dayCloseTimer));
    overlay.addEventListener('mouseleave', () => {
      if (dayPopoverPinned) return;
      dayCloseTimer = setTimeout(closeDayPopover_, 200);
    });
    // Reset pin flag whenever Esc fires (the shell-level handler at
    // script_core.html closes the overlay; we just reset the flag).
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') dayPopoverPinned = false;
    });
  }
}

function openDayPopover_(cell, pin) {
  const dateStr = cell.dataset.date;
  if (!dateStr) return;
  dayPopoverPinned = !!pin;
  const overlay = document.getElementById('day-overlay');
  // Hover-mode (not pinned) → tethered popover, transparent backdrop.
  // Pinned → centered modal with backdrop (default styling).
  overlay.classList.toggle('hover-mode', !pin);
  // Populate the modal's contents via the existing helper.
  openDayModal(dateStr);
  if (!pin) positionDayPopover_(cell);
  else {
    // Clear any tethered positioning so the centered modal CSS takes over.
    const modal = overlay.querySelector('.modal');
    if (modal) { modal.style.top = ''; modal.style.left = ''; }
  }
}

function closeDayPopover_() {
  const overlay = document.getElementById('day-overlay');
  if (!overlay) return;
  overlay.classList.remove('open');
  overlay.classList.remove('hover-mode');
  const modal = overlay.querySelector('.modal');
  if (modal) { modal.style.top = ''; modal.style.left = ''; }
}

/** Tether the day modal to the hovered cell. Places to the right of the
 *  cell by default; flips to the left if right would overflow the viewport.
 *  Vertically clamps to keep the modal fully on-screen. */
function positionDayPopover_(cell) {
  const overlay = document.getElementById('day-overlay');
  const modal = overlay.querySelector('.modal');
  if (!modal) return;
  // Force layout so we can read modal width/height before positioning
  modal.style.visibility = 'hidden';
  modal.style.top = '0px'; modal.style.left = '0px';
  const r = cell.getBoundingClientRect();
  const mw = modal.offsetWidth, mh = modal.offsetHeight;
  const gap = 14;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = r.right + gap;
  if (left + mw > vw - 8) left = r.left - mw - gap;
  if (left < 8) left = 8;
  let top = r.top + (r.height / 2) - (mh / 2);
  if (top < 8) top = 8;
  if (top + mh > vh - 8) top = vh - mh - 8;
  modal.style.left = left + 'px';
  modal.style.top = top + 'px';
  modal.style.visibility = '';
}
// Live balance preview when Type changes (V1·E2).
document.getElementById('day-type').addEventListener('change', updateDayBalancePreview_);
document.getElementById('day-submit').addEventListener('click', () => {
  const type = document.getElementById('day-type').value;
  const notes = document.getElementById('day-notes').value.trim();
  const btn = document.getElementById('day-submit');
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(result => {
      btn.disabled = false;
      // D1 (cycle 10): check the RESULT before closing — a server-side
      // rejection (the INV-94 already-requested-date guard is the common one)
      // used to dismiss the modal and discard the rep's typed notes + type
      // selection, while a transport failure correctly kept it open. Both
      // failure shapes now keep the modal open for fix-and-retry.
      if (!result.success) { showToast((result.error||'Error'),'toast-error'); return; }
      document.getElementById('day-overlay').classList.remove('open');
      // Cycle-9 L-30: a request is typically submitted from a CLICK-PINNED
      // popover, and this close path never reset the pin flag — the re-bound
      // calendar cells' mouseenter handlers early-return on it, so hover-open
      // (Round 2 · 8c) was dead until an Esc or cell click.
      dayPopoverPinned = false;
      showToast('Time off request submitted','toast-success');
      CAL_CACHE = {};   // a PTO change invalidates every cached month
      refreshViewIfCurrent('timeoff', 'Loading calendar…', function () { loadCalendar(calYear, calMonth); });
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      showToast((err.message||'Server error'),'toast-error');
    })
    .submitTimeOffRequest(dayModalDate, type, notes);
});
</script>
