<style>
  /* ── Onboarding tour — coach-marks (operator feedback 2026-06-12) ───────
     Hand-rolled spotlight (no library): a fixed click-catcher blocks the app
     while the tour runs, a spotlight box draws a huge box-shadow "ring" that
     dims everything except the target, and a tooltip card carries the copy.
     Mounted on document.body so Call Notes' #view-area re-renders never wipe
     it; z-index sits ABOVE the overlay/drawer layer (50/55) but below toasts
     (999). */
  #tour-block { position: fixed; inset: 0; z-index: 200; display: none; background: transparent; }
  #tour-block.dim { background: rgba(0,0,0,.55); }
  #tour-block.show { display: block; }
  #tour-spot {
    position: fixed; z-index: 201; border-radius: 10px; pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.55), 0 0 0 3px var(--accent);
    transition: top .25s var(--ease), left .25s var(--ease), width .25s var(--ease), height .25s var(--ease);
    display: none;
  }
  #tour-spot.show { display: block; }
  #tour-pop {
    position: fixed; z-index: 202; width: min(340px, 92vw);
    background: var(--paper-card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg);
    padding: 16px 18px; display: none; opacity: 0;
    transition: opacity .18s var(--ease);
  }
  #tour-pop.show { display: block; }
  /* .in drives the fade — the tooltip stays invisible (opacity 0) while its
     content swaps + it repositions, then fades in at the new spot, so the
     new text never flashes at the previous position. */
  #tour-pop.in { opacity: 1; }
  .tour-kicker { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 4px; }
  .tour-title { font-family: var(--display); font-size: 1.05rem; font-weight: 700; margin: 0 0 6px; line-height: 1.25; }
  .tour-body { font-size: .88rem; line-height: 1.55; color: var(--ink); }
  .tour-body kbd { font-family: var(--mono); font-size: .78em; background: var(--paper-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; }
  .tour-foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .tour-dots { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }
  .tour-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); transition: background var(--t) var(--ease); }
  .tour-dot.on { background: var(--accent); }
  .tour-btn { font: inherit; font-size: .82rem; padding: 6px 13px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--paper-2); color: var(--ink); }
  .tour-btn:hover { border-color: var(--border-strong); }
  /* C17-8 (cycle 17): color was #fff — a FIXED color on a THEME-FLIPPING
     token (the inverse of the V-2/INV-166 rule). Dark-mode --accent is a
     LIGHT green (#7af2a1), so the tour's only advance button measured
     ~1.4:1. var(--paper-card) is what every other accent-filled primary
     uses — near-white in light mode, near-black in dark. */
  .tour-btn.primary { background: var(--accent); border-color: transparent; color: var(--paper-card); font-weight: 600; }
  .tour-btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 8px; }
  .tour-btn.ghost:hover { color: var(--ink); }
  .tour-skip { position: absolute; top: 10px; right: 12px; font-size: .74rem; }
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  ONBOARDING TOUR — interactive coach-marks (operator feedback 2026-06-12).
//  Auto-starts on a rep's first load; replayable from Settings (and the Call
//  Notes "?" menu). Steps are a declarative registry; the engine navigates to
//  each step's tool/tab via enterTool, then spotlights its selector. A step
//  whose target isn't in the DOM is SKIPPED (never strands the tour).
//  T1 (operator 2026-11-11): every tool has steps, and a step is shown only
//  where its TAB is visible to this user — the same `tabVisibleForUser_` the
//  tab bar uses, so a manager, Spanish, QA or admin step follows its tab's
//  gate (and View-as) with no second list. A step carries `since` (the tour
//  version it arrived in): someone who saw an older version gets only the
//  newer steps, introduced by a "what's new" card, not the whole tour again.
//  Pinned by Node pins (every view a TOOLS tab key, every selector in the
//  source, the gate and the what's-new filter driven) and by
//  test/visual/tour-check.mjs, which walks every step in a real browser per
//  role and fails on a target that never appears.
// ════════════════════════════════════════════════════════════════════════════
const TOUR_LS_KEY = 'umsTour';
// Bump to offer the NEW steps (those with `since` above a person's stored
// version) after a material UI change; the stored `seenVersion` is the last
// version they finished or skipped.
const TOUR_VERSION = 2;

// Each step: { id, tool, view, selector|null, title, body, since?, intro?, placement? }.
// selector null = a centered card with a full dim (intro / abstract concepts).
// since = the tour version the step arrived in (default 1).
// intro = 'full' (only the full tour's opening) or 'new' (only the what's-new opening).
// The gate is the step's TAB (TOOLS[tool].tabs[view]) — never a flag here.
const TOUR_STEPS = [
  { id: 'welcome', tool: 'timeClock', view: 'clock', selector: null, intro: 'full',
    title: 'Welcome to Team Tools',
    body: 'A short tour of every tool you can use. Skip any time, and replay it later from <strong>Settings</strong> (the gear).' },
  { id: 'whatsnew', tool: 'timeClock', view: 'clock', selector: null, intro: 'new', since: 2,
    title: 'What’s new since your last tour',
    body: 'A few quick stops on what has changed — new tools, new tabs, and where things moved. Skip any time; the full tour is in <strong>Settings</strong>.' },
  { id: 'sidebar', tool: 'timeClock', view: 'clock', selector: '.sidebar',
    title: 'Your tools',
    body: 'Each item here is a tool — Dashboard, Call Notes, Reference, Intake, Training and the rest you have access to. Drag the right edge to resize, or double-click it to collapse to icons.' },
  { id: 'tabs', tool: 'timeClock', view: 'clock', selector: '#tool-tab-bar',
    title: 'Tabs within a tool',
    body: 'Every tool has its own tabs along this bar. You only see the tabs your role uses — managers, QA reviewers and the Spanish team each have extra ones.' },
  { id: 'settings', tool: 'timeClock', view: 'clock', selector: '[data-settings-toggle]', since: 2,
    title: 'Settings',
    body: 'The gear holds the theme, colour palette, break and clock-out alerts, <strong>Customize widgets</strong> for your Dashboard, and <strong>Replay the tour</strong>.' },
  { id: 'popout', tool: 'timeClock', view: 'clock', selector: '.sb-popout-btn',
    title: 'Pop-out panel',
    body: 'Pops the current view into a small always-handy window. Tip: pin it above other windows with PowerToys <kbd>Win</kbd>+<kbd>Ctrl</kbd>+<kbd>T</kbd> so you can log notes over the CRM.' },
  { id: 'clock', tool: 'timeClock', view: 'clock', selector: '.actions',
    title: 'Clock in & out',
    body: 'Punch in, go to lunch, and clock out from here. The big button always shows your next action; your times convert to your manager’s timezone automatically.' },
  { id: 'ribbon', tool: 'timeClock', view: 'clock', selector: '.ribbon-wrap',
    title: 'Your shift at a glance',
    body: 'This ribbon shows your scheduled shift, your punches, and a live cursor through the day — a quick read on where you are in your shift.' },
  { id: 'widgets', tool: 'timeClock', view: 'clock', selector: '#dash-widgets .dash-w', since: 2,
    title: 'Your Dashboard',
    body: 'Widgets for the day — your calls, notes, reminders and what needs you. Choose and arrange them with <strong>Customize widgets</strong> in Settings.' },
  { id: 'stats', tool: 'timeClock', view: 'metricsMyStats', selector: '#m-my-content .m-hero', since: 2,
    title: 'Stats',
    body: 'Your calls, answer rate and talk time for any day or range, with <strong>Adjusted</strong> figures that count your outbound calls and long intake calls. <strong>Team</strong> shows the team’s totals.' },
  { id: 'spanish', tool: 'timeClock', view: 'metricsSpanish', selector: '#spanish-head', since: 2,
    title: 'Spanish Inbox',
    body: 'Spanish voicemails and emails waiting for a call-back — the counts here, the list below. Claim one, call back, then <strong>Resolve</strong> with an outcome — select several to resolve them together.' },
  { id: 'timeoff', tool: 'timeClock', view: 'timeoff', selector: '.to-actions',
    title: 'Time off & timesheet',
    body: 'Request PTO and review your timesheet on the <strong>Time / PTO</strong> tab. The calendar shows worked hours and approved days off; request time off here; your leave balance and pay-period hours sit just below.' },
  { id: 'cn-frame', tool: 'callNotes', view: 'callNotes', selector: '#cn-frame',
    title: 'The note template',
    body: 'Log a call by filling these fields. <kbd>Tab</kbd> or <kbd>Enter</kbd> moves to the next field; a fresh click selects the field so you can type right over it; arrow keys hop fields at the edges.' },
  { id: 'cn-flags', tool: 'callNotes', view: 'callNotes', selector: '.rail-flags',
    title: 'Flags',
    body: 'Flag a note <strong>Action</strong> (follow-up), <strong>Training</strong> (ask a manager), <strong>Review</strong> (great call), or <strong>Urgent</strong>. Each has its own colour so your flagged notes read at a glance.' },
  { id: 'cn-tags', tool: 'callNotes', view: 'callNotes', selector: '#cn-tag-input',
    title: 'Tags',
    body: 'Add freeform tags here (press <kbd>Enter</kbd> to add). As you type the Issue and Resolution, tags you’ve used before are suggested just below — one click to apply.' },
  { id: 'cn-save', tool: 'callNotes', view: 'callNotes', selector: '.rail-actions',
    title: 'Saving a note',
    body: '<strong>Save &amp; Copy</strong> (<kbd>Ctrl/⌘</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd>) saves and copies a CRM-ready version to your clipboard. <strong>Save &amp; Compose</strong> also opens the email composer. Drag-select anywhere in the template and copy — you always get the full note.' },

    title: 'Find past notes',
    body: 'Filter today’s notes by flag here, or jump into History and Search (the tabs above) to find any past call by caller, patient/TRX, or text. Sent Forms lists the forms you have sent.' },
  { id: 'cn-scratch', tool: 'callNotes', view: 'callNotes', selector: '#cn-scratch-btn', since: 2,
    title: 'Scratchpad',
    body: 'Personal notes that follow you across devices — pages, checklists, highlights. Open it from any page with <kbd>Ctrl/⌘</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>; the bell beside it holds your scheduled call reminders.' },
  { id: 'cn-help', tool: 'callNotes', view: 'callNotes', selector: '#cn-help-btn',
    title: 'Shortcuts',

  { id: 'dept-requests', tool: 'callNotes', view: 'metricsDeptReq', selector: '#dr-body .view-title-row', since: 2,
    title: 'Dept Requests',
    body: 'The requests you have sent to other departments, with how long each has waited. A department’s reply resolves it; you can also mark one resolved yourself.' },
  { id: 'team-notes', tool: 'callNotes', view: 'callNotesManage', selector: '#tool-tab-bar',
    title: 'Managers: Team Notes',
    body: 'Team Notes shows every rep’s notes, flags and training questions, with a cross-rep search — answer a training question from the note itself.' },
  { id: 'reference', tool: 'reference', view: 'reference', selector: '#kb-search', since: 2,
    title: 'Reference',
    body: 'Search the handbook, articles, payor tables and prices. <kbd>Ctrl/⌘</kbd>+<kbd>K</kbd> opens the same search in a drawer over whatever you are doing, so you never leave the call.' },
  { id: 'intake', tool: 'intake', view: 'intakePpd', selector: '.intk-rail-sticky', since: 2,
    title: 'Intake',
    body: 'PPD, PMD and PAP intake forms. Fields warn rather than block, drafts are kept in this browser, an insurance card can be read from a photo, and sending logs the intake call note for you.' },
  { id: 'training', tool: 'develop', view: 'trainingHome', selector: '#tr-home-content', since: 2,
    title: 'Training & Employee Docs',
    body: 'Your assigned training and quizzes. <strong>Coaching</strong> holds your coaching items and 1-on-1s, and <strong>My Docs</strong> the documents waiting for your signature.' },
  { id: 'team-training', tool: 'develop', view: 'trainingManage', selector: '#tr-mgr-content', since: 2,
    title: 'Managers: Team Training',
    body: 'Assign training and quizzes to your team and see who is behind. <strong>Issue Docs</strong> sends signable documents.' },
  { id: 'qa', tool: 'qa', view: 'qaQueue', selector: '.qa-section', since: 2,
    title: 'QA',
    body: 'Call recordings to review: claim one, score it on the scorecard, and leave timestamped comments. <strong>Stats</strong> and <strong>Log</strong> follow each period’s audit.' },
  { id: 'manage', tool: 'manage', view: 'manage', selector: '.mgr-needs-pair', since: 2,
    title: 'Managers: Manage',
    body: '<strong>Needs you</strong> — time-off and punch requests waiting for you — then your team’s live status. <strong>Coverage</strong> and <strong>Punctuality</strong> are the tabs beside it.' },
  { id: 'admin', tool: 'manage', view: 'callNotesAdmin', selector: '.cn-admin-tabs', since: 2,
    title: 'Admin',
    body: 'Deploy readiness, automation and storage health, the team roster, and the app’s settings. A red dot on System means something needs a look.' },
];

let TOUR_I = -1;
let TOUR_ACTIVE = false;
// 'full' (every step this user can see) or 'new' (only the steps added since
// their stored version) — set by tourStart, read by the kicker.
let TOUR_MODE = 'full';

function tourPrefs_() {
  try { return JSON.parse(localStorage.getItem(TOUR_LS_KEY) || '{}') || {}; }
  catch (_) { return {}; }
}
function tourSave_(p) {
  try { localStorage.setItem(TOUR_LS_KEY, JSON.stringify(p)); } catch (_) {}
}
/** The stored version, or 0 when the tour was never finished or skipped. */
function tourSeenVersion_() {
  const v = Number(tourPrefs_().seenVersion);
  return isFinite(v) && v > 0 ? Math.floor(v) : 0;
}
/** T1: which tour a first load owes this person — 'full' when they never saw
 *  one, 'new' when some step newer than the version they saw is visible to
 *  them, else '' (nothing). A stored version at or above TOUR_VERSION (a newer
 *  deployment seen first) owes nothing because no step is newer than it — the
 *  filter is the one rule, so there is no second version compare to drift. */
function tourAutoMode_() {
  const seen = tourSeenVersion_();
  if (!seen) return 'full';
  return tourVisibleSteps_('new', seen).some(function (s) { return !s.intro; }) ? 'new' : '';
}
/** Called from the boot sequence after enterTool. Best-effort, typeof-guarded
 *  there. Doesn't run in the compact pop-out or on a deep-link landing. */
function tourMaybeAutoStart_() {
  if (COMPACT_MODE) return;
  // Don't hijack a deep-link landing (?tool=<tabKey>): a recipient/bookmark
  // arriving on a specific tab shouldn't be yanked to step 0. Same predicate
  // the boot caller uses to honor the deep-link (script_core). Replay from
  // Settings or the ? menu is unaffected (they call tourStart directly).
  if (typeof INITIAL_VIEW_FROM_URL !== 'undefined' && INITIAL_VIEW_FROM_URL &&
      typeof VIEW_TO_TOOL !== 'undefined' && VIEW_TO_TOOL[INITIAL_VIEW_FROM_URL]) return;
  const mode = tourAutoMode_();
  if (!mode) return;
  // Let the first view settle a beat before spotlighting it.
  setTimeout(function () { tourStart(mode); }, 600);
}

/** T1: a step is shown iff its TAB is visible to this user — the tab bar's
 *  own gate (`tabVisibleForUser_`: adminOnly, managerOnly, the `also` flags),
 *  so a role's steps follow its tabs, View-as included. A step naming no
 *  registered tab is never shown. */
function tourStepVisible_(s) {
  if (!s || typeof TOOLS === 'undefined') return false;
  const tool = TOOLS[s.tool];
  const tab = tool && tool.tabs ? tool.tabs[s.view] : null;
  return !!tab && tabVisibleForUser_(tab);
}
/** The steps this run shows. 'full': every visible step except the what's-new
 *  opening. 'new': the visible steps that arrived after `seen`, opened by the
 *  what's-new card (never the full tour's welcome). */
function tourVisibleSteps_(mode, seen) {
  const isNew = mode === 'new';
  const after = isNew ? (Number(seen) || 0) : 0;
  return TOUR_STEPS.filter(function (s) {
    if (!tourStepVisible_(s)) return false;
    if (s.intro) return s.intro === (isNew ? 'new' : 'full');
    return !isNew || (s.since || 1) > after;
  });
}

let _tourReturnView = '';
// SH-04 (cycle 23): the element that had focus when the tour started, handed
// back when it ends (the overlay lifecycle's _restoreFocus, for a surface that
// is not an overlay).
let _tourRestoreFocus = null;

function tourStart(mode) {
  if (TOUR_ACTIVE) return;
  TOUR_MODE = mode === 'new' ? 'new' : 'full';
  const steps = tourVisibleSteps_(TOUR_MODE, tourSeenVersion_());
  if (!steps.length) return;
  TOUR_ACTIVE = true;
  // Remember where the rep was so tourEnd_ can return them (the tour navigates
  // through several tabs; without this it strands the rep on the last step's
  // view — Call Notes / Team Notes — instead of where they invoked it).
  _tourReturnView = (typeof currentView !== 'undefined') ? currentView : '';
  const ae = document.activeElement;
  _tourRestoreFocus = (ae && ae !== document.body) ? ae : null;
  TOUR_VISIBLE = steps;
  TOUR_I = -1;
  tourEnsureNodes_();
  window.addEventListener('resize', tourReposition_);
  document.addEventListener('keydown', tourKeydown_, true);
  tourNext_();
}

let TOUR_VISIBLE = [];

function tourEnsureNodes_() {
  // Guard against duplicate nodes on a re-entry. (Idempotency also holds via
  // tourEnd_'s teardown + the TOUR_ACTIVE re-entry guard, but check a node we
  // actually create — the prior `tour-root` id was never created, so the guard
  // was dead.)
  if (document.getElementById('tour-block')) return;
  const block = document.createElement('div'); block.id = 'tour-block';
  const spot = document.createElement('div'); spot.id = 'tour-spot';
  const pop = document.createElement('div'); pop.id = 'tour-pop';
  // SH-04 (cycle 23): the popover is a modal DIALOG — it dims and blocks the
  // page — but it had no role, no name and never took focus, so a keyboard or
  // screen-reader user stayed on (and could activate) the controls under the
  // dim layer. Named by the step title, described by its body; focus moves to
  // the primary button on every step and Tab cycles inside (tourKeydown_).
  pop.setAttribute('role', 'dialog');
  pop.setAttribute('aria-modal', 'true');
  pop.setAttribute('aria-labelledby', 'tour-pop-title');
  pop.setAttribute('aria-describedby', 'tour-pop-body');
  document.body.appendChild(block);
  document.body.appendChild(spot);
  document.body.appendChild(pop);
}

function tourNext_() { tourGoTo_(TOUR_I + 1, +1); }
function tourPrev_() { tourGoTo_(TOUR_I - 1, -1); }

/** Navigate to step `i`, then WAIT for its target to appear before painting.
 *  Views render asynchronously (e.g. enterCallNotesView shows a spinner and
 *  only builds #cn-frame after its RPCs return), so a synchronous querySelector
 *  right after enterTool would miss every async-rendered target and wrongly
 *  skip the step — the Step-7→14 jump. We poll for up to ~1.8s; only a real
 *  timeout skips the step, advancing in `dir` so Back still works. */
function tourGoTo_(i, dir) {
  if (i < 0) return;
  if (i >= TOUR_VISIBLE.length) { tourEnd_(true); return; }
  const step = TOUR_VISIBLE[i];
  TOUR_I = i;
  // Fade the tooltip out before navigating so the content swap + spotlight
  // move happen behind a quick fade (no "text changes before the box moves").
  const pop = document.getElementById('tour-pop');
  if (pop) pop.classList.remove('in');
  if (currentView !== step.view) {
    const toolKey = VIEW_TO_TOOL[step.view];
    if (toolKey) enterTool(toolKey, step.view);
  }
  if (!step.selector) { setTimeout(function () { tourPaint_(step); }, 90); return; }
  let tries = 0;
  const MAX = 24;   // ~1.9s at 80ms
  (function poll() {
    if (!TOUR_ACTIVE || TOUR_I !== i) return;   // superseded by a faster click
    if (tourVisibleTarget_(step.selector)) { tourPaint_(step); return; }
    if (++tries >= MAX) { tourGoTo_(i + dir, dir); return; }   // genuinely absent/hidden → skip
    setTimeout(poll, 80);
  })();
}

// Cycle-11 L-10: DOM presence isn't targetability — below 1024px the sidebar
// is display:none but still in the DOM, so `.sidebar` / `.sb-popout-btn`
// "succeeded" and the tour painted a 0×0 spotlight at the viewport corner on
// tablet/mobile first-runs. A target must be VISIBLE (non-zero rect); when a
// selector matches several nodes (the pop-out button exists in both the
// sidebar and the mobile header), the first visible one wins.
function tourVisibleTarget_(selector) {
  let nodes;
  try { nodes = document.querySelectorAll(selector); } catch (_) { return null; }
  for (let n = 0; n < nodes.length; n++) {
    const r = nodes[n].getBoundingClientRect();
    if (r.width > 0 && r.height > 0) return nodes[n];
  }
  return null;
}

function tourPaint_(step) {
  if (!TOUR_ACTIVE) return;
  const block = document.getElementById('tour-block');
  const spot = document.getElementById('tour-spot');
  const pop = document.getElementById('tour-pop');
  if (!block || !spot || !pop) return;
  block.classList.add('show');
  // L-10: first VISIBLE match (not first DOM match) — see tourVisibleTarget_.
  const target = step.selector ? tourVisibleTarget_(step.selector) : null;

  // Swap the content while the tooltip is faded out (tourGoTo_ removed .in),
  // so the new text is never visible at the old position — it fades in only
  // once repositioned. Keep .show (display) on; .in drives opacity.
  pop.classList.add('show');
  pop.innerHTML = tourPopHtml_(step);
  tourWirePop_();
  tourFocusPop_();

  if (target) {
    block.classList.remove('dim');
    try { target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {}
    // Re-measure after the scroll settles, move the spotlight, place + fade
    // the tooltip in at its destination.
    setTimeout(function () {
      if (!TOUR_ACTIVE) return;
      const r = target.getBoundingClientRect();
      const pad = 6;
      spot.style.top = (r.top - pad) + 'px';
      spot.style.left = (r.left - pad) + 'px';
      spot.style.width = (r.width + pad * 2) + 'px';
      spot.style.height = (r.height + pad * 2) + 'px';
      spot.classList.add('show');
      tourPlacePop_(pop, r, step.placement);
      requestAnimationFrame(function () { pop.classList.add('in'); });
    }, 180);
  } else {
    // Centered step — full dim, no spotlight.
    spot.classList.remove('show');
    block.classList.add('dim');
    pop.style.left = Math.max(8, (window.innerWidth - pop.offsetWidth) / 2) + 'px';
    pop.style.top = Math.max(8, (window.innerHeight - pop.offsetHeight) / 2) + 'px';
    requestAnimationFrame(function () { pop.classList.add('in'); });
  }
}

/** Place the tooltip near the target — below if there's room, else above,
 *  else beside it (T1: a tall target used to get the card centred ON it, over
 *  the very thing the step describes); always clamped on-screen. */
function tourPlacePop_(pop, r, placement) {
  pop.classList.add('show');
  const pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 12, vw = window.innerWidth, vh = window.innerHeight;
  let top, left;
  const below = r.bottom + gap + ph <= vh;
  const above = r.top - gap - ph >= 0;
  if (!below && !above) {
    const right = r.right + gap + pw <= vw - 8, leftSide = r.left - gap - pw >= 8;
    if (right || leftSide) {
      left = right ? r.right + gap : r.left - gap - pw;
      top = Math.min(Math.max(8, Math.max(r.top, 0) + 8), vh - ph - 8);
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      return;
    }
  }
  if (placement === 'above' ? above : (below || !above)) {
    top = below ? r.bottom + gap : Math.max(8, (vh - ph) / 2);
  } else {
    top = r.top - gap - ph;
  }
  left = r.left + r.width / 2 - pw / 2;
  left = Math.min(Math.max(8, left), vw - pw - 8);
  top = Math.min(Math.max(8, top), vh - ph - 8);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}

function tourPopHtml_(step) {
  const total = TOUR_VISIBLE.length;
  const dots = TOUR_VISIBLE.map(function (_, j) {
    return '<span class="tour-dot' + (j === TOUR_I ? ' on' : '') + '"></span>';
  }).join('');
  const last = TOUR_I >= total - 1;
  const first = TOUR_I <= 0;
  return '' +
    '<button class="tour-btn ghost tour-skip" data-tour="skip">Skip</button>' +
    '<div class="tour-kicker">' + (TOUR_MODE === 'new' ? 'What’s new · ' : 'Step ') + (TOUR_I + 1) + ' of ' + total + '</div>' +
    '<div class="tour-title" id="tour-pop-title">' + step.title + '</div>' +
    '<div class="tour-body" id="tour-pop-body">' + step.body + '</div>' +
    '<div class="tour-foot">' +
      '<div class="tour-dots">' + dots + '</div>' +
      (first ? '' : '<button class="tour-btn" data-tour="prev">Back</button>') +
      '<button class="tour-btn primary" data-tour="next">' + (last ? 'Done' : 'Next') + '</button>' +
    '</div>';
}
function tourWirePop_() {
  const pop = document.getElementById('tour-pop');
  if (!pop) return;
  pop.querySelectorAll('[data-tour]').forEach(function (b) {
    b.addEventListener('click', function () {
      const a = b.getAttribute('data-tour');
      if (a === 'skip') tourEnd_(false);
      else if (a === 'prev') tourPrev_();
      else tourNext_();
    });
  });
}

/** SH-04 — land focus on the step's primary button (the content was just
 *  replaced, so the old focused node is gone). */
function tourFocusPop_() {
  const pop = document.getElementById('tour-pop');
  const btn = pop && pop.querySelector('[data-tour="next"]');
  if (btn) { try { btn.focus({ preventScroll: true }); } catch (_) { try { btn.focus(); } catch (__) {} } }
}

function tourReposition_() {
  if (!TOUR_ACTIVE || TOUR_I < 0) return;
  tourPaint_(TOUR_VISIBLE[TOUR_I]);
}
function tourKeydown_(e) {
  if (!TOUR_ACTIVE) return;
  // D12 (cycle 10): stopImmediatePropagation, not stopPropagation — the
  // uiConfirm/uiPrompt key handlers are ALSO document-level capture listeners
  // (same node, same phase), so plain stopPropagation couldn't stop them and
  // one Escape would both end the tour AND resolve an open dialog false,
  // cancelling its flow (the exact INV-83 cycle-8 stacked-dialog lesson).
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); tourEnd_(false); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); tourNext_(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); tourPrev_(); }
  else if (e.key === 'Tab') {
    // SH-04: Tab cycles the popover's buttons — never the page under the dim.
    const pop = document.getElementById('tour-pop');
    const btns = pop ? Array.prototype.slice.call(pop.querySelectorAll('button')) : [];
    if (!btns.length) return;
    e.preventDefault();
    const at = btns.indexOf(document.activeElement);
    const next = at < 0 ? 0 : (at + (e.shiftKey ? btns.length - 1 : 1)) % btns.length;
    btns[next].focus();
  }
}

function tourEnd_(completed) {
  TOUR_ACTIVE = false;
  window.removeEventListener('resize', tourReposition_);
  document.removeEventListener('keydown', tourKeydown_, true);
  ['tour-block', 'tour-spot', 'tour-pop'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  });
  // Stamp seen so auto-start won't fire again (until TOUR_VERSION bumps).
  const p = tourPrefs_();
  p.seenVersion = TOUR_VERSION;
  tourSave_(p);
  // Return the rep to where they started (the tour navigated them away).
  if (_tourReturnView && _tourReturnView !== currentView &&
      typeof VIEW_TO_TOOL !== 'undefined' && VIEW_TO_TOOL[_tourReturnView] &&
      typeof enterTool === 'function') {
    enterTool(VIEW_TO_TOOL[_tourReturnView], _tourReturnView);
  }
  _tourReturnView = '';
  // SH-04: hand focus back to where it was, when that element still exists.
  const restore = _tourRestoreFocus;
  _tourRestoreFocus = null;
  if (restore && restore.isConnected) { try { restore.focus(); } catch (_) {} }
  if (completed) showToast('Tour complete — replay it anytime from Settings', 'toast-success');
}
</script>
