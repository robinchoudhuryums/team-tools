<style>
  /* ── Employee Docs — T3 (My Docs + Issue Docs) ──────────────────────── */
  .ed-reader { width: min(760px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .ed-reader .body { overflow-y: auto; padding: 4px 2px; }
  .ed-reader .foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 10px; flex-wrap: wrap; }
  .ed-ack { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 12px 14px; margin-top: 14px; }
  .ed-ack label.ack { display: flex; align-items: flex-start; gap: 8px; font-size: .86rem; cursor: pointer; }
  .ed-sig-section { display: none; margin-top: 12px; }
  .ed-sig-section.show { display: block; }
  .ed-sig-wrap { position: relative; border: 1px dashed var(--border-strong); border-radius: 8px; background: var(--paper-card); }
  .ed-sig-wrap canvas { display: block; border-radius: 8px; touch-action: none; }
  /* Typed-signature alternative (a11y) — link-style disclosure under the pad. */
  .ed-sig-typed-toggle {
    display: inline-block; margin-top: 6px; padding: 0;
    background: none; border: none; cursor: pointer;
    font-size: 12px; color: var(--accent-2); text-decoration: underline;
    font-family: inherit;
  }
  .ed-sig-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .82rem; pointer-events: none; }
  .ed-sig-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .ed-void-note { border-left: 3px solid var(--danger-deep); background: var(--destructive-soft); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: .84rem; margin-bottom: 12px; }
  .ed-issue { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 14px 16px; margin-bottom: 18px; max-width: 860px; }
  .ed-issue h3 { margin: 0 0 10px; font-size: .95rem; }
  .ed-issue .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 10px; }
  .ed-issue label { display: block; font-size: .76rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .ed-issue select, .ed-issue input[type=text], .ed-issue input[type=date] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
  .ed-issue input[type=text] { width: min(420px, 100%); box-sizing: border-box; }
  .ed-issue textarea { font-family: var(--mono, monospace); font-size: .85rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; min-height: 180px; resize: vertical; }
  .ed-issue .hint { font-size: .74rem; color: var(--muted); margin-top: 3px; }
  .ed-verify { font-size: .82rem; }
  .ed-verify .ok { color: var(--success-deep); font-weight: 600; }
  .ed-verify .bad { color: var(--danger-deep); font-weight: 600; }
  /* ── v2: fillable fields + field builder + templates + per-employee groups ── */
  .ed-fields { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 12px 14px; margin-top: 14px; }
  .ed-fields-h { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .ed-field { margin-bottom: 12px; }
  .ed-field > label { display: block; font-size: .82rem; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .ed-field .ed-req { color: var(--danger-deep); }
  .ed-field input[type=text], .ed-field input[type=date], .ed-field textarea { font: inherit; width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper-card); color: var(--ink); }
  .ed-field textarea { min-height: 90px; resize: vertical; }
  .ed-resp-ro { white-space: pre-wrap; font-size: .9rem; color: var(--ink); background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .ed-field-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .ed-field-label { flex: 1; min-width: 200px; font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
  .ed-field-type { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
  .ed-field-req { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .ed-tpl-manage { margin: -6px 0 18px; max-width: 860px; }
  .ed-tpl-manage summary { cursor: pointer; font-size: .84rem; color: var(--muted); }
  .ed-tpl-rows { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .ed-tpl-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper-card); padding: 7px 10px; font-size: .88rem; }
  .ed-tpl-meta { color: var(--muted); font-size: .78rem; }
  .ed-emp-group { margin-bottom: 16px; }
  .ed-emp-name { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem; color: var(--ink); margin-bottom: 6px; }
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  EMPLOYEE DOCS — client, T3 (My Docs + Issue Docs).
//  Per-employee signable documents: frozen markdown rendered via the global
//  kbMd_; acknowledgment signature on a canvas pad (adapted from
//  form_public.html — same ≤600px export cap so the base64 stays under the
//  INV-96 cell cap; capture stays full-res). Reader/sign modals are
//  ensureOverlay dynamic overlays. Spec: docs/training-employee-docs-spec.md.
// ════════════════════════════════════════════════════════════════════════════
var ED_STATE = { my: null, dash: null, emps: null, templates: null, readerDocId: null, sigPad: null, issueFields: [] };

/** Pure chip markup — Node-pinned. */
function edChipHtml_(doc) {
  var s, label;
  if (doc.status === 'void') { s = 'pending'; label = 'Void'; }
  else if (doc.status === 'draft') { s = 'pending'; label = 'Draft'; }
  else if (doc.status === 'signed') { s = 'done'; label = 'Signed'; }
  else if (doc.status === 'completed') { s = 'done'; label = 'Completed'; }
  else if (doc.requiresSignature) {
    s = 'overdue';
    label = doc.overdue ? 'Overdue' : 'Needs signature';
  } else if (doc.needsAction || doc.fieldCount) {
    s = 'overdue';
    label = doc.overdue ? 'Overdue' : 'Needs completion';
  } else { s = 'pending'; label = 'For review'; }
  return '<span class="tr-chip ' + s + '">' + label + '</span>';
}

// ── Signature pad (adapted from form_public.html initSignaturePad) ────────
function edInitSigPad_(canvas, placeholderEl) {
  var ctx = canvas.getContext('2d');
  var drawing = false, hasDrawn = false;
  function resizeCanvas() {
    var rect = canvas.parentElement.getBoundingClientRect();
    if (!rect.width) return;             // hidden — re-run on reveal (S61 gotcha)
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = 140 * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = '140px';
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink') || '#101418';
  }
  resizeCanvas();
  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function start(e) {
    drawing = true;
    if (placeholderEl) placeholderEl.style.display = 'none';
    var p = getPos(e);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    e.preventDefault();
  }
  function move(e) {
    if (!drawing) return;
    hasDrawn = true;
    var p = getPos(e);
    ctx.lineTo(p.x, p.y); ctx.stroke();
    e.preventDefault();
  }
  function end() { drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
  // Typed-signature alternative (a11y) — the form_public SIG_PAD twin:
  // renders the typed name onto the pad so the exported PNG (size cap,
  // signature hash, certificate) is identical in kind to a drawn one.
  function drawTypedName(name) {
    name = String(name || '').trim();
    resizeCanvas();
    hasDrawn = false;
    if (!name) { if (placeholderEl) placeholderEl.style.display = ''; return; }
    if (placeholderEl) placeholderEl.style.display = 'none';
    var w = parseFloat(canvas.style.width) || 300;
    var size = 34;
    var face = 'italic {s}px "Segoe Script","Brush Script MT","Lucida Handwriting",cursive';
    ctx.font = face.replace('{s}', size);
    var tw = ctx.measureText(name).width;
    if (tw > w - 24) {
      size = Math.max(14, Math.floor(size * (w - 24) / tw));
      ctx.font = face.replace('{s}', size);
    }
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink') || '#101418';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, 12, 70);
    hasDrawn = true;
  }
  return {
    isEmpty: function () { return !hasDrawn; },
    clear: function () {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasDrawn = false;
      resizeCanvas();
      if (placeholderEl) placeholderEl.style.display = '';
    },
    resize: function () { if (!hasDrawn) resizeCanvas(); },
    setTypedName: drawTypedName,
    // Export capped at 600px wide — same INV-96 reasoning as form_public's
    // SIG_PAD.toDataURL (retina capture canvases yield base64 large enough
    // to trip the server's per-cell cap; line art downscales crisply).
    toDataURL: function () {
      var MAX_W = 600;
      if (!hasDrawn || canvas.width <= MAX_W) return canvas.toDataURL('image/png');
      try {
        var scale = MAX_W / canvas.width;
        var tmp = document.createElement('canvas');
        tmp.width = MAX_W;
        tmp.height = Math.max(1, Math.round(canvas.height * scale));
        tmp.getContext('2d').drawImage(canvas, 0, 0, tmp.width, tmp.height);
        return tmp.toDataURL('image/png');
      } catch (e) { return canvas.toDataURL('image/png'); }
    },
  };
}

// ── Rep view: My Docs ──────────────────────────────────────────────────────
function enterMyDocsView() {
  if (typeof stopClock === 'function') stopClock();
  if (typeof cnStopAmbientPolling_ === 'function') cnStopAmbientPolling_();
  var area = document.getElementById('view-area');
  if (!area) return;
  area.innerHTML =
        '<div class="view-title-row" style="' + (COMPACT_MODE ? 'display:none' : '') + '"><h1 class="view-title">My Documents</h1></div>' +
    '<div id="ed-my-content"><div class="m-loading"><span class="lo-glyph">' + icon('fileText', 26) + '</span> Loading documents&hellip;</div></div>';
  var requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (data) {
      ED_STATE.my = data;
      if (currentView !== requestedView) return;
      edRenderMy_();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      var el = document.getElementById('ed-my-content');
      if (el) el.innerHTML = errorStateHtml_((err && err.message) || err);   // A12
    })
    .getMyDocs();
}

function edRenderMy_() {
  var el = document.getElementById('ed-my-content');
  if (!el) return;
  var data = ED_STATE.my || {};
  if (data.error) { el.innerHTML = errorStateHtml_(data.error); return; }   // A12
  var docs = data.docs || [];
  if (!docs.length) { el.innerHTML = '<div class="tr-empty">No documents on file.</div>'; return; }
  var h = '<div class="tr-list">';
  docs.forEach(function (d) {
    h += '<div class="tr-row' + (d.status === 'signed' ? ' done' : '') + '">' +
      edChipHtml_(d) +
      '<div><button class="tr-title" data-ed-open="' + esc(d.docId) + '">' + esc(d.title) + '</button>' +
      '<div class="tr-meta">' + esc(d.docType) + ' · issued ' + esc(String(d.issuedAt).substring(0, 10)) +
        (d.dueAt ? ' · due ' + esc(d.dueAt) : '') +
        (d.signedAt ? ' · signed ' + esc(String(d.signedAt).substring(0, 10)) : '') +
      '</div></div>' +
      '<div class="tr-spacer"></div>' +
      (d.status === 'issued' && d.requiresSignature
        ? '<button class="tr-complete-btn" data-ed-open="' + esc(d.docId) + '">' + icon('adjust', 13) + ' Review &amp; sign</button>' : '') +
      '</div>';
  });
  h += '</div>';
  el.innerHTML = h;
  if (!el._edDelegated) {
    el._edDelegated = true;
    el.addEventListener('click', function (e) {
      var open = e.target.closest('[data-ed-open]');
      if (open) edOpenDoc_(open.getAttribute('data-ed-open'));
    });
  }
}

// ── Doc reader / sign modal (shared by rep + manager dashboard View) ──────
function edOpenDoc_(docId) {
  ED_STATE.readerDocId = docId;
  ED_STATE.sigPad = null;
  var overlay = ensureOverlay('ed-reader-overlay', { label: 'Employee document', onClose: edCloseDoc_ });
  overlay.innerHTML = '<div class="modal ed-reader"><div class="body"><div class="m-loading" role="status"><span class="lo-dots"><span></span><span></span><span></span></span> Loading&hellip;</div></div></div>';
  google.script.run
    .withSuccessHandler(function (doc) {
      if (ED_STATE.readerDocId !== docId) return;
      edRenderDoc_(doc);
    })
    .withFailureHandler(function (err) {
      if (ED_STATE.readerDocId !== docId) return;
      var o = document.getElementById('ed-reader-overlay');
      if (o) o.querySelector('.body').innerHTML = errorStateHtml_((err && err.message) || err);   // A12
    })
    .getMyDoc(docId);
}

function edRenderDoc_(doc) {
  var overlay = document.getElementById('ed-reader-overlay');
  if (!overlay) return;
  if (!doc || doc.error) {
    overlay.querySelector('.body').innerHTML = errorStateHtml_((doc && doc.error) || 'Not found.');   // A12
    return;
  }
  var body = '';
  if (doc.status === 'void') {
    body += '<div class="ed-void-note">This document was voided' + (doc.voidReason ? ': ' + esc(doc.voidReason) : '.') + '</div>';
  }
  body += '<div class="kb-article"><h1>' + esc(doc.title) + '</h1>' + kbMd_(doc.bodyMd || '') + '</div>';

  // Fillable fields: editable for the owner while issued; read-only (showing
  // the stored responses) for a completed doc or a manager viewing it.
  var fields = doc.fields || [];
  var responses = doc.responses || {};
  var editable = !!doc.canComplete;
  if (fields.length) {
    body += '<div class="ed-fields"><div class="ed-fields-h">' + (editable ? 'Please complete' : 'Responses') + '</div>';
    fields.forEach(function (f) {
      var val = responses[f.id] != null ? responses[f.id] : '';
      body += '<div class="ed-field"><label>' + esc(f.label) + (f.required && editable ? ' <span class="ed-req">*</span>' : '') + '</label>';
      if (editable) {
        if (f.type === 'textarea') body += '<textarea class="ed-resp" data-fid="' + esc(f.id) + '">' + esc(val) + '</textarea>';
        else if (f.type === 'date') body += '<input type="date" class="ed-resp" data-fid="' + esc(f.id) + '" value="' + esc(val) + '">';
        else body += '<input type="text" class="ed-resp" data-fid="' + esc(f.id) + '" maxlength="8000" value="' + esc(val) + '">';
      } else {
        body += '<div class="ed-resp-ro">' + (val ? esc(val) : '<em>—</em>') + '</div>';
      }
      body += '</div>';
    });
    body += '</div>';
  }

  var canSign = !!doc.ackText;   // server includes it only for owner + issued + requiresSignature
  if (canSign) {
    body += '<div class="ed-ack">' +
      '<label class="ack"><input type="checkbox" id="ed-ack-check"> <span>' + esc(doc.ackText) + '</span></label>' +
      '<div class="ed-sig-section" id="ed-sig-section">' +
        '<div class="ed-sig-wrap"><canvas id="ed-sig-canvas"></canvas><div class="ed-sig-ph" id="ed-sig-ph">Tap or click and drag here to sign</div></div>' +
        '<button type="button" class="ed-sig-typed-toggle" id="ed-sig-typed-toggle" aria-expanded="false">Can’t use the pad? Type your signature instead</button>' +
        '<div id="ed-sig-typed-field" style="display:none;margin:6px 0 2px">' +
          '<label for="ed-sig-typed-input" style="display:block;font-size:12px;color:var(--muted);margin-bottom:3px">Type your full legal name as your signature</label>' +
          '<input type="text" id="ed-sig-typed-input" maxlength="80" autocomplete="name" style="width:100%;max-width:340px">' +
        '</div>' +
        '<div class="ed-sig-row">' +
          '<button class="kb-btn" id="ed-sig-clear">Clear</button>' +
          '<div class="tr-spacer" style="flex:1"></div>' +
          '<button class="tr-complete-btn" id="ed-sign-btn">' + icon('check', 13) + ' Sign document</button>' +
        '</div>' +
      '</div></div>';
  }
  // Fields-only doc (no signature required): a standalone Submit button.
  if (editable && !canSign) {
    body += '<div class="ed-sig-row" style="margin-top:14px;"><div class="tr-spacer" style="flex:1"></div>' +
      '<button class="tr-complete-btn" id="ed-sign-btn">' + icon('check', 13) + ' Submit</button></div>';
  }
  if (doc.status === 'signed' || doc.status === 'completed') {
    body += '<p class="tr-meta" style="margin-top:14px;">' + icon('checkCircle', 13) + ' ' +
      (doc.status === 'signed' ? 'Signed ' : 'Completed ') + esc(String(doc.signedAt).substring(0, 10)) + '</p>';
  }
  overlay.innerHTML =
    '<div class="modal ed-reader">' +
      '<div class="body">' + body + '</div>' +
      '<div class="foot"><button class="kb-btn" onclick="edCloseDoc_()">Close</button></div>' +
    '</div>';
  if (canSign) {
    var canvas = document.getElementById('ed-sig-canvas');
    ED_STATE.sigPad = edInitSigPad_(canvas, document.getElementById('ed-sig-ph'));
    document.getElementById('ed-ack-check').addEventListener('change', function () {
      var sec = document.getElementById('ed-sig-section');
      sec.classList.toggle('show', this.checked);
      // The canvas had a 0-width box while hidden — re-size on reveal,
      // guarded so an uncheck→recheck can't wipe a drawn signature (S61).
      if (this.checked && ED_STATE.sigPad && ED_STATE.sigPad.isEmpty()) ED_STATE.sigPad.resize();
    });
    document.getElementById('ed-sig-clear').addEventListener('click', function () {
      if (ED_STATE.sigPad) ED_STATE.sigPad.clear();
      var ti = document.getElementById('ed-sig-typed-input');
      if (ti) ti.value = '';
    });
    // Typed-signature alternative (a11y) — toggle reveals a text input whose
    // value renders onto the pad via the pad's setTypedName.
    var tglBtn = document.getElementById('ed-sig-typed-toggle');
    var tglField = document.getElementById('ed-sig-typed-field');
    var tglInput = document.getElementById('ed-sig-typed-input');
    if (tglBtn && tglField && tglInput) {
      tglBtn.addEventListener('click', function () {
        var open = tglField.style.display !== 'none';
        tglField.style.display = open ? 'none' : '';
        tglBtn.setAttribute('aria-expanded', String(!open));
        if (!open) tglInput.focus();
      });
      tglInput.addEventListener('input', function () {
        if (ED_STATE.sigPad && ED_STATE.sigPad.setTypedName) ED_STATE.sigPad.setTypedName(tglInput.value);
      });
    }
  }
  var signBtn = document.getElementById('ed-sign-btn');
  if (signBtn) signBtn.addEventListener('click', function () { edSubmitSignature_(doc.docId, this, canSign); });
}

/** Gather the employee's field responses keyed by field id. */
function edGatherResponses_() {
  var out = {};
  document.querySelectorAll('#ed-reader-overlay .ed-resp').forEach(function (el) {
    out[el.dataset.fid] = el.value;
  });
  return out;
}

function edSubmitSignature_(docId, btn, needsSig) {
  if (needsSig && (!ED_STATE.sigPad || ED_STATE.sigPad.isEmpty())) {
    showToast('Draw your signature first.', 'error');
    return;
  }
  var label = needsSig ? ' Sign document' : ' Submit';
  if (btn) { btn.disabled = true; btn.textContent = needsSig ? 'Signing…' : 'Submitting…'; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        if (btn) { btn.disabled = false; btn.innerHTML = icon('check', 13) + label; }
        showToast((res && res.error) || 'Could not submit.', 'error');
        return;
      }
      showToast(needsSig ? 'Document signed.' : 'Document completed.', 'success');
      var docs = (ED_STATE.my && ED_STATE.my.docs) || [];
      for (var i = 0; i < docs.length; i++) {
        if (docs[i].docId === docId) { docs[i].status = needsSig ? 'signed' : 'completed'; docs[i].signedAt = res.signedAt; docs[i].needsAction = false; }
      }
      edCloseDoc_();
      if (currentView === 'myDocs') edRenderMy_();
    })
    .withFailureHandler(function (err) {
      if (btn) { btn.disabled = false; btn.innerHTML = icon('check', 13) + label; }
      showToast('Could not submit: ' + ((err && err.message) || err), 'error');
    })
    .acknowledgeDoc(docId, needsSig && ED_STATE.sigPad ? ED_STATE.sigPad.toDataURL() : '', edGatherResponses_());
}

/** Idempotent (ensureOverlay contract). */
function edCloseDoc_() {
  ED_STATE.readerDocId = null;
  ED_STATE.sigPad = null;
  var o = document.getElementById('ed-reader-overlay');
  if (o) { o.classList.remove('open'); o.innerHTML = ''; }
}

// ── Manager view: Issue Docs ───────────────────────────────────────────────
function enterDocsManageView() {
  if (typeof stopClock === 'function') stopClock();
  if (typeof cnStopAmbientPolling_ === 'function') cnStopAmbientPolling_();
  var area = document.getElementById('view-area');
  if (!area) return;
  area.innerHTML =
        '<div class="view-title-row" style="' + (COMPACT_MODE ? 'display:none' : '') + '"><h1 class="view-title">Employee Documents</h1></div>' +
    '<div id="ed-mgr-content"><div class="m-loading"><span class="lo-glyph">' + icon('fileText', 26) + '</span> Loading&hellip;</div></div>';
  edLoadMgr_();
}

function edLoadMgr_() {
  var requestedView = currentView;
  // Batch-6 (cycle 17, INV-156) — same-view seq token; see trainLoadMgr_.
  ED_STATE.mgrSeq = (ED_STATE.mgrSeq || 0) + 1;
  var seq = ED_STATE.mgrSeq;
  var got = 0, failed = false;
  function done() {
    got++;
    if (got < 3 || failed || currentView !== requestedView || seq !== ED_STATE.mgrSeq) return;
    edRenderMgr_();
  }
  function onFail(err) {
    if (failed || seq !== ED_STATE.mgrSeq) return;
    failed = true;
    if (currentView !== requestedView) return;
    var el = document.getElementById('ed-mgr-content');
    if (el) el.innerHTML = errorStateHtml_('Could not load: ' + ((err && err.message) || err));   // A12
  }
  google.script.run.withSuccessHandler(function (d) { if (seq !== ED_STATE.mgrSeq) return; ED_STATE.dash = d; done(); }).withFailureHandler(onFail).getDocsDashboard();
  google.script.run.withSuccessHandler(function (d) { if (seq !== ED_STATE.mgrSeq) return; ED_STATE.emps = d; done(); }).withFailureHandler(onFail).getEmployeesList();
  google.script.run.withSuccessHandler(function (d) { if (seq !== ED_STATE.mgrSeq) return; ED_STATE.templates = d; done(); }).withFailureHandler(onFail).getEmpDocTemplates();
}

function edRenderMgr_() {
  var el = document.getElementById('ed-mgr-content');
  if (!el) return;
  var dash = ED_STATE.dash || {};
  if (dash.error) { el.innerHTML = errorStateHtml_(dash.error); return; }   // A12
  var emps = (ED_STATE.emps && ED_STATE.emps.employees) || [];

  var empSel = '<select id="ed-is-emp"><option value="">Pick an employee…</option>';
  emps.forEach(function (e) { empSel += '<option value="' + esc(e.id) + '">' + esc(e.name) + '</option>'; });
  empSel += '</select>';

  var templates = (ED_STATE.templates && ED_STATE.templates.templates) || [];
  var tplPick = '<select id="ed-tpl-pick"><option value="">Start from scratch…</option>';
  templates.forEach(function (t) { tplPick += '<option value="' + esc(t.templateId) + '">' + esc(t.name) + '</option>'; });
  tplPick += '</select>';

  var h = '<div class="ed-issue"><h3>Create a document</h3>' +
    '<div class="row"><div style="flex:1;min-width:240px;"><label>Template</label>' + tplPick +
      '<div class="hint">Pick a template to prefill the body + fields, or build from scratch.</div></div>' +
      '<div style="align-self:flex-end;"><button class="kb-btn" id="ed-tpl-save">' + icon('fileText', 13) + ' Save current as template</button></div></div>' +
    '<div class="row">' +
      '<div><label>Employee</label>' + empSel + '</div>' +
      '<div><label for="ed-is-type">Type</label><select id="ed-is-type">' +
        '<option value="review">Performance review</option>' +
        '<option value="pip">Performance improvement plan</option>' +
        '<option value="policy">Policy acknowledgment</option>' +
        '<option value="other">Other</option></select></div>' +
      '<div><label for="ed-is-due">Due date (optional)</label><input type="date" id="ed-is-due"></div>' +
      '<div><label>Signature</label><label style="font-weight:400;font-size:.84rem;display:flex;align-items:center;gap:6px;margin-top:8px;"><input type="checkbox" id="ed-is-sig" checked> Require signature</label></div>' +
    '</div>' +
    '<div class="row"><div style="flex:1;min-width:280px;"><label for="ed-is-title">Title</label><input type="text" id="ed-is-title" maxlength="200" placeholder="e.g. 2026 Annual Performance Review"></div></div>' +
    '<div class="row"><div style="flex:1;width:100%;"><label for="ed-is-body">Body (markdown — frozen at issue)</label>' +
      '<textarea id="ed-is-body" placeholder="Write the document here, or convert a Google Doc below."></textarea>' +
      '<div class="hint">Content is hashed and locked when you issue — a correction means voiding and re-issuing. ' +
      '<button class="tr-link" id="ed-is-convert">Convert a Google Doc to markdown</button></div></div></div>' +
    '<div class="row"><div style="flex:1;width:100%;"><label>Fields the employee completes (optional)</label>' +
      '<div id="ed-fields-list"></div>' +
      '<button class="kb-btn" id="ed-add-field" style="margin-top:6px;">' + icon('plus', 12) + ' Add field</button>' +
      '<div class="hint">Free-text / paragraph / date fields the employee fills in (e.g. self-assessment). The signature & date is separate (toggle above).</div></div></div>' +
    '<div class="row" style="gap:8px;">' +
      '<button class="kb-btn" id="ed-save-draft">' + icon('fileText', 13) + ' Save as draft</button>' +
      '<button class="tr-complete-btn" id="ed-is-go">' + icon('send', 13) + ' Issue &amp; release</button>' +
    '</div>' +
    '</div>';

  // Template management (delete) — only when templates exist.
  if (templates.length) {
    h += '<details class="ed-tpl-manage"><summary>Manage templates (' + templates.length + ')</summary><div class="ed-tpl-rows">';
    templates.forEach(function (t) {
      h += '<div class="ed-tpl-row"><span>' + esc(t.name) + ' <span class="ed-tpl-meta">' + esc(t.docType) + ((t.fields || []).length ? ' · ' + t.fields.length + ' field(s)' : '') + '</span></span>' +
        '<button class="tr-revoke-btn" data-ed-tpl-del="' + esc(t.templateId) + '">Delete</button></div>';
    });
    h += '</div></details>';
  }

  var docs = dash.docs || [];
  if (docs.length) {
    // Group by employee for "view and manage per employee".
    var byEmp = {};
    docs.forEach(function (d) { (byEmp[d.empId] = byEmp[d.empId] || { name: d.empName, rows: [] }).rows.push(d); });
    var empIds = Object.keys(byEmp).sort(function (a, b) { return byEmp[a].name.localeCompare(byEmp[b].name); });
    h += '<h2 class="tr-section-h">Documents (your team)</h2>';
    empIds.forEach(function (id) {
      var g = byEmp[id];
      h += '<div class="ed-emp-group"><div class="ed-emp-name">' + icon('user', 13) + ' ' + esc(g.name) + '</div>' +
        '<table class="tr-table"><thead><tr><th>Type</th><th>Title</th><th>Status</th><th>Due</th><th>Signed</th><th></th></tr></thead><tbody>';
      g.rows.forEach(function (d) {
        h += '<tr><td>' + esc(d.docType) + '</td>' +
          '<td><button class="tr-title" data-ed-open="' + esc(d.docId) + '">' + esc(d.title) + '</button>' +
            ((d.fieldCount) ? ' <span class="ed-tpl-meta">' + d.fieldCount + ' field(s)</span>' : '') + '</td>' +
          '<td>' + edChipHtml_(d) + '</td>' +
          '<td>' + esc(d.dueAt || '—') + (d.overdue ? ' <span class="tr-cell-overdue">!</span>' : '') + '</td>' +
          '<td>' + esc(d.signedAt ? String(d.signedAt).substring(0, 10) : '—') + '</td>' +
          '<td>' +
            (d.status === 'draft' ? '<button class="tr-complete-btn" data-ed-release="' + esc(d.docId) + '">Release</button> ' : '') +
            (d.requiresSignature && d.status !== 'draft' ? '<button class="kb-btn" data-ed-verify="' + esc(d.docId) + '">Verify</button> ' : '') +
            (d.status !== 'void' ? '<button class="tr-revoke-btn" data-ed-void="' + esc(d.docId) + '">Void</button>' : '') +
          '</td></tr>';
      });
      h += '</tbody></table></div>';
    });
  } else {
    h += '<div class="tr-empty">No documents visible to you yet. You see docs you issued plus docs for employees whose roster ManagerEmail (column M) is you.</div>';
  }
  el.innerHTML = h;

  edRenderIssueFields_();
  document.getElementById('ed-is-go').addEventListener('click', function () { edSubmitIssue_(true); });
  document.getElementById('ed-save-draft').addEventListener('click', function () { edSubmitIssue_(false); });
  document.getElementById('ed-is-convert').addEventListener('click', edConvertDoc_);
  document.getElementById('ed-add-field').addEventListener('click', edAddField_);
  document.getElementById('ed-tpl-save').addEventListener('click', edSaveAsTemplate_);
  var tp = document.getElementById('ed-tpl-pick');
  if (tp) tp.addEventListener('change', function () { edApplyTemplate_(this.value); });
  if (!el._edMgrDelegated) {
    el._edMgrDelegated = true;
    el.addEventListener('click', function (e) {
      var t;
      if ((t = e.target.closest('[data-ed-open]'))) { edOpenDoc_(t.getAttribute('data-ed-open')); return; }
      if ((t = e.target.closest('[data-ed-verify]'))) { edVerify_(t.getAttribute('data-ed-verify')); return; }
      if ((t = e.target.closest('[data-ed-release]'))) { edRelease_(t.getAttribute('data-ed-release')); return; }
      if ((t = e.target.closest('[data-ed-tpl-del]'))) { edDeleteTemplate_(t.getAttribute('data-ed-tpl-del')); return; }
      if ((t = e.target.closest('[data-ed-field-del]'))) { edRemoveField_(+t.getAttribute('data-ed-field-del')); return; }
      if ((t = e.target.closest('[data-ed-void]'))) edVoid_(t.getAttribute('data-ed-void'));
    });
  }
}

// ── Fillable-field builder (manager Issue form) ─────────────────────────────
function edRenderIssueFields_() {
  var host = document.getElementById('ed-fields-list');
  if (!host) return;
  var fields = ED_STATE.issueFields || [];
  if (!fields.length) { host.innerHTML = '<div class="ed-tpl-meta" style="padding:4px 0;">No fields — the employee will only sign (if required).</div>'; return; }
  var h = '';
  fields.forEach(function (f, i) {
    h += '<div class="ed-field-row">' +
      '<input type="text" class="ed-field-label" data-ed-fi="' + i + '" maxlength="200" placeholder="Field label (e.g. Your accomplishments this year)" value="' + esc(f.label || '') + '" aria-label="Field label">' +
      '<select class="ed-field-type" data-ed-fi="' + i + '">' +
        '<option value="text"' + (f.type === 'text' ? ' selected' : '') + '>Short text</option>' +
        '<option value="textarea"' + (f.type === 'textarea' ? ' selected' : '') + '>Paragraph</option>' +
        '<option value="date"' + (f.type === 'date' ? ' selected' : '') + '>Date</option>' +
      '</select>' +
      '<label class="ed-field-req"><input type="checkbox" data-ed-fi="' + i + '"' + (f.required !== false ? ' checked' : '') + '> Required</label>' +
      '<button class="tr-revoke-btn" data-ed-field-del="' + i + '">' + icon('x', 12) + '</button>' +
    '</div>';
  });
  host.innerHTML = h;
  // Live-sync edits back into state (so add/remove preserves them).
  host.querySelectorAll('.ed-field-label').forEach(function (el) {
    el.addEventListener('input', function () { ED_STATE.issueFields[+this.dataset.edFi].label = this.value; });
  });
  host.querySelectorAll('.ed-field-type').forEach(function (el) {
    el.addEventListener('change', function () { ED_STATE.issueFields[+this.dataset.edFi].type = this.value; });
  });
  host.querySelectorAll('.ed-field-req input').forEach(function (el) {
    el.addEventListener('change', function () { ED_STATE.issueFields[+this.dataset.edFi].required = this.checked; });
  });
}
function edAddField_() {
  ED_STATE.issueFields.push({ label: '', type: 'text', required: true });
  edRenderIssueFields_();
}
function edRemoveField_(i) {
  ED_STATE.issueFields.splice(i, 1);
  edRenderIssueFields_();
}

// ── Templates ───────────────────────────────────────────────────────────────
function edApplyTemplate_(templateId) {
  if (!templateId) return;
  var templates = (ED_STATE.templates && ED_STATE.templates.templates) || [];
  var t = null;
  for (var i = 0; i < templates.length; i++) { if (templates[i].templateId === templateId) { t = templates[i]; break; } }
  if (!t) return;
  var typeEl = document.getElementById('ed-is-type'); if (typeEl) typeEl.value = t.docType || 'review';
  var bodyEl = document.getElementById('ed-is-body'); if (bodyEl) bodyEl.value = t.bodyMd || '';
  var sigEl = document.getElementById('ed-is-sig'); if (sigEl) sigEl.checked = t.requiresSignature !== false;
  var titleEl = document.getElementById('ed-is-title'); if (titleEl && !titleEl.value.trim()) titleEl.value = t.name || '';
  ED_STATE.issueFields = (t.fields || []).map(function (f) { return { label: f.label, type: f.type, required: f.required !== false }; });
  edRenderIssueFields_();
  showToast('Template applied — review and personalize.', 'info');
}
function edSaveAsTemplate_() {
  var bodyMd = (document.getElementById('ed-is-body') || {}).value || '';
  if (!bodyMd.trim()) { showToast('Write a body first, then save it as a template.', 'warn'); return; }
  uiPrompt({
    title: 'Save as template',
    message: 'Reusable for any employee. Stores the body + fields + type + signature setting (no employee data).',
    placeholder: 'e.g. Annual Performance Review',
    validator: function (v) { return v && v.trim() ? '' : 'Give the template a name.'; },
  }).then(function (name) {
    if (!name) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) { showToast((res && res.error) || 'Could not save template.', 'error'); return; }
        showToast('Template saved.', 'success');
        if (currentView === 'docsManage') edLoadMgr_();
      })
      .withFailureHandler(function (err) { showToast('Could not save: ' + ((err && err.message) || err), 'error'); })
      .saveEmpDocTemplate({
        name: name,
        docType: (document.getElementById('ed-is-type') || {}).value || 'review',
        bodyMd: bodyMd,
        requiresSignature: !!(document.getElementById('ed-is-sig') || {}).checked,
        fields: edGatherFields_(),
      });
  });
}
function edDeleteTemplate_(templateId) {
  uiConfirm({ title: 'Delete this template?', message: 'Already-issued documents are unaffected.', confirmLabel: 'Delete', tone: 'danger' })
    .then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) { showToast((res && res.error) || 'Could not delete.', 'error'); return; }
          showToast('Template deleted.', 'success');
          if (currentView === 'docsManage') edLoadMgr_();
        })
        .withFailureHandler(function (err) { showToast('Could not delete: ' + ((err && err.message) || err), 'error'); })
        .deleteEmpDocTemplate(templateId);
    });
}
function edGatherFields_() {
  return (ED_STATE.issueFields || []).filter(function (f) { return f.label && f.label.trim(); })
    .map(function (f) { return { label: f.label.trim(), type: f.type || 'text', required: f.required !== false }; });
}
function edRelease_(docId) {
  uiConfirm({ title: 'Release to the employee?', message: 'The employee is notified by email and can complete it.', confirmLabel: 'Release' })
    .then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) { showToast((res && res.error) || 'Release failed.', 'error'); return; }
          showToast('Released.', 'success');
          if (currentView === 'docsManage') edLoadMgr_();
        })
        .withFailureHandler(function (err) { showToast('Release failed: ' + ((err && err.message) || err), 'error'); })
        .releaseDoc(docId);
    });
}

/** Reuses the manager-gated KB Phase-2 converter to pre-fill the body. */
function edConvertDoc_() {
  uiPrompt({
    title: 'Convert a Google Doc',
    message: 'Paste the Doc share URL. The converted markdown fills the body for your review — the Doc itself is never modified.',
    placeholder: 'https://docs.google.com/document/d/…',
  }).then(function (url) {
    if (!url) return;
    showToast('Converting…', 'info');
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.error) { showToast((res && res.error) || 'Conversion failed.', 'error'); return; }
        var body = document.getElementById('ed-is-body');
        if (body) body.value = res.markdown || '';
        var title = document.getElementById('ed-is-title');
        if (title && !title.value && res.docTitle) title.value = res.docTitle;
        showToast('Converted' + (res.warnings && res.warnings.length ? ' with ' + res.warnings.length + ' warning(s) — review the body' : '') + '.', 'success');
      })
      .withFailureHandler(function (err) { showToast('Conversion failed: ' + ((err && err.message) || err), 'error'); })
      .kbConvertDriveDoc({ driveUrl: url });
  });
}

function edSubmitIssue_(release) {
  var payload = {
    empId: (document.getElementById('ed-is-emp') || {}).value || '',
    docType: (document.getElementById('ed-is-type') || {}).value || '',
    title: (document.getElementById('ed-is-title') || {}).value || '',
    bodyMd: (document.getElementById('ed-is-body') || {}).value || '',
    dueAt: (document.getElementById('ed-is-due') || {}).value || '',
    requiresSignature: !!(document.getElementById('ed-is-sig') || {}).checked,
    fields: edGatherFields_(),
    release: !!release,
  };
  if (!payload.empId) { showToast('Pick an employee.', 'error'); return; }
  if (!payload.title.trim()) { showToast('Title is required.', 'error'); return; }
  if (!payload.bodyMd.trim()) { showToast('Document body is required.', 'error'); return; }
  uiConfirm({
    title: release ? 'Issue & release document?' : 'Save as draft?',
    message: release
      ? ('The content is frozen and hashed at issue. The employee is notified by email' + (payload.requiresSignature ? ' and asked to sign' : '') + '.')
      : 'Saved as a draft — the employee can\'t see it until you Release it.',
    confirmLabel: release ? 'Issue & release' : 'Save draft',
  }).then(function (ok) {
    if (!ok) return;
    var btn = document.getElementById(release ? 'ed-is-go' : 'ed-save-draft');
    if (btn) btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) btn.disabled = false;
        if (!res || !res.success) { showToast((res && res.error) || 'Save failed.', 'error'); return; }
        showToast(res.status === 'draft' ? 'Draft saved.' : 'Document issued.', 'success');
        ED_STATE.issueFields = [];
        if (currentView === 'docsManage') edLoadMgr_();
      })
      .withFailureHandler(function (err) {
        if (btn) btn.disabled = false;
        showToast('Save failed: ' + ((err && err.message) || err), 'error');
      })
      .issueDoc(payload);
  });
}

function edVerify_(docId) {
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || res.error) { showToast((res && res.error) || 'Verify failed.', 'error'); return; }
      // Cycle-9 M-8: a fields-only completion carries the same hash artifact
      // (empty-signature DocSignatures row) — res.completed distinguishes it
      // from a signature so the copy doesn't claim a signature that isn't there.
      if (!res.signed && !res.completed) { showToast('Not signed yet' + (res.contentMatch === false ? ' — CONTENT HASH MISMATCH (row altered after issue!)' : '.'), res.contentMatch === false ? 'error' : 'info'); return; }
      var word = res.completed ? 'completed' : 'signed';
      if (!res.tampered && res.match === true) {
        showToast('✓ Integrity verified — ' + (res.completed ? 'completion' : 'signature') + ' and content hashes match (' + word + ' ' + String(res.signedAt).substring(0, 10) + ').', 'success');
      } else if (res.match === null) {
        showToast((res.completed ? 'Completed' : 'Signed') + ' (legacy row — no stored hash to verify).', 'info');
      } else {
        showToast('✗ INTEGRITY MISMATCH — the stored record was altered after ' + word + '. Investigate via the AuditLog witness row.', 'error');
      }
    })
    .withFailureHandler(function (err) { showToast('Verify failed: ' + ((err && err.message) || err), 'error'); })
    .verifyDocSignature(docId);
}

function edVoid_(docId) {
  uiConfirm({
    title: 'Void this document?',
    message: 'It stays on record marked void (never deleted); a signed doc keeps its signature. Issue a new doc for a corrected version.',
    confirmLabel: 'Void', tone: 'danger',
  }).then(function (ok) {
    if (!ok) return;
    uiPrompt({
      title: 'Reason (optional)',
      message: 'Shown to the employee on their voided document — e.g. "superseded by corrected version". Keep it free of internal or sensitive notes.',
      placeholder: 'Reason…',
    }).then(function (reason) {
      if (reason === null) return;   // Esc/cancel on the prompt aborts the void
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) { showToast((res && res.error) || 'Void failed.', 'error'); return; }
          showToast('Document voided.', 'success');
          if (currentView === 'docsManage') edLoadMgr_();
        })
        .withFailureHandler(function (err) { showToast('Void failed: ' + ((err && err.message) || err), 'error'); })
        .voidDoc(docId, reason || '');
    });
  });
}
</script>
