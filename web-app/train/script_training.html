<style>
  /* ── Training & Employee Docs — T1 (training) ───────────────────────── */
  .tr-sum { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .tr-sum .cell { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 10px 16px; min-width: 96px; }
  .tr-sum .cell-label { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .tr-sum .cell-val { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tr-sum .cell-val.warn { color: var(--warning-deep, #b86e00); }
  .tr-list { display: flex; flex-direction: column; gap: 8px; max-width: 860px; }
  .tr-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 10px 14px; }
  .tr-row.done { opacity: .72; }
  .tr-row .tr-title { font: inherit; font-size: .92rem; font-weight: 600; background: none; border: none; color: var(--ink); cursor: pointer; text-align: left; padding: 0; }
  .tr-row .tr-title:hover { color: var(--accent); }
  .tr-row .tr-meta { font-size: .76rem; color: var(--muted); }
  .tr-row .tr-spacer { flex: 1; }
  .tr-chip { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; flex-shrink: 0; }
  .tr-chip.done { background: var(--accent-soft); color: var(--success-deep); }
  .tr-chip.pending { background: var(--paper-2); color: var(--muted); }
  .tr-chip.overdue { background: var(--destructive-soft); color: var(--danger-deep); }
  .tr-complete-btn { font: inherit; font-size: .78rem; padding: 5px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--accent-soft); color: var(--success-deep); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
  /* inline button spinner — quiz save/delete in-flight (operator feedback r4) */
  .tr-spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; opacity: .8; animation: trSpin .7s linear infinite; vertical-align: -1px; }
  @keyframes trSpin { to { transform: rotate(360deg); } }
  .tr-complete-btn[disabled] { opacity: .5; cursor: default; }
  .tr-empty { color: var(--muted); font-size: .9rem; padding: 24px 0; }
  /* reader modal */
  .tr-reader { width: min(760px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .tr-reader .body { overflow-y: auto; padding: 4px 2px; }
  .tr-reader .foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 10px; }
  .tr-reader iframe { width: 100%; min-height: 55vh; border: 1px solid var(--line); border-radius: 8px; }
  /* manager: assign form + matrix */
  .tr-assign { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 14px 16px; margin-bottom: 18px; max-width: 860px; }
  .tr-assign h3 { margin: 0 0 10px; font-size: .95rem; }
  .tr-assign .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .tr-assign label { display: block; font-size: .76rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .tr-assign select, .tr-assign input[type=date] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
  .tr-emp-box { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 8px 10px; max-height: 200px; overflow-y: auto; min-width: 280px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 14px; align-content: start; }
  .tr-emp-box label { display: flex; align-items: center; gap: 7px; font-size: .84rem; font-weight: 400; color: var(--ink); margin: 0; padding: 3px 0; cursor: pointer; }
  .tr-emp-box label:first-child { grid-column: 1 / -1; padding-bottom: 5px; margin-bottom: 3px; border-bottom: 1px solid var(--line); }
  .tr-emp-box input[type="checkbox"] { width: 15px; height: 15px; flex-shrink: 0; }
  .tr-table { border-collapse: collapse; font-size: .84rem; max-width: 100%; overflow-x: auto; display: block; }
  .tr-table th { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
  .tr-table td { padding: 7px 14px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tr-table tbody tr:last-child td { border-bottom: none; }
  .tr-cell-done { color: var(--success-deep); font-weight: 700; }
  .tr-cell-overdue { color: var(--danger-deep); font-weight: 700; }
  .tr-cell-pending { color: var(--muted); }
  .tr-revoke-btn { font: inherit; font-size: .74rem; padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-2); color: var(--danger-deep); cursor: pointer; }
  :root[data-compact] .tr-row { flex-wrap: wrap; }
  .tr-link { font: inherit; font-size: .76rem; background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  /* quiz-taking modal */
  .tr-quiz { width: min(680px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .tr-quiz .body { overflow-y: auto; padding: 4px 2px; }
  .tr-quiz .foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 10px; }
  .tr-q { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 12px 14px; margin-bottom: 10px; }
  .tr-q .tr-q-text { font-weight: 600; font-size: .92rem; margin-bottom: 8px; }
  .tr-q label { display: flex; align-items: flex-start; gap: 8px; font-size: .88rem; padding: 4px 2px; cursor: pointer; border-radius: 6px; }
  .tr-q label:hover { background: var(--paper-2); }
  .tr-q.right { border-color: var(--accent); background: var(--accent-soft); }
  .tr-q.wrong { border-color: var(--destructive-soft); background: var(--destructive-soft); }
  .tr-q .tr-q-verdict { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
  .tr-q.right .tr-q-verdict { color: var(--success-deep); }
  .tr-q.wrong .tr-q-verdict { color: var(--danger-deep); }
  .tr-score { text-align: center; padding: 14px 0 6px; }
  .tr-score .big { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tr-score.pass .big { color: var(--success-deep); }
  .tr-score.fail .big { color: var(--danger-deep); }
  .tr-score .sub { font-size: .86rem; color: var(--muted); }
  /* quiz editor modal */
  .tr-qed { width: min(720px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .tr-qed .body { overflow-y: auto; padding: 4px 2px; }
  .tr-qed .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .tr-qed label { font-size: .76rem; font-weight: 600; color: var(--muted); }
  .tr-qed input[type=text], .tr-qed input[type=number], .tr-qed select, .tr-qed textarea { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; }
  .tr-qed .foot { display: flex; gap: 10px; justify-content: flex-end; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 8px; }
  .tr-qed-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .tr-qed-warn { border-left: 3px solid var(--warning-deep, #b86e00); background: var(--warn-soft); border-radius: 0 8px 8px 0; padding: 8px 12px; margin-bottom: 12px; font-size: .8rem; color: var(--ink); }
  .tr-qed-warn ul { margin: 4px 0 0; padding-left: 18px; }
  .tr-qed-warn li { margin: 2px 0; }
  .tr-qed-q { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 12px 14px; margin-bottom: 10px; }
  .tr-qed-q .opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tr-qed-q .opt-row input[type=text] { flex: 1; }
  .tr-qed-q .qhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .tr-qed-q .qhead .qn { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); flex: 1; }
  .tr-qed-hint { font-size: .74rem; color: var(--muted); margin-top: 2px; }
  .tr-cell-att { font-size: .68rem; color: var(--muted); }

  /* §3a — checklist completion-ring header */
  .tr-head { display: flex; align-items: center; gap: 18px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper-card); padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow-sm); max-width: 860px; }
  .tr-head-main { flex: 1; min-width: 0; }
  .tr-head-title { font-family: var(--display); font-size: 1.3rem; font-weight: 600; color: var(--ink); }
  .tr-head-sub { font-size: .85rem; color: var(--muted); margin-top: 2px; }
  .tr-head-sub .tr-overdue-n { color: var(--danger-deep); font-weight: 600; }
  .tr-head .tr-sum { margin-bottom: 0; }
  .tr-ring { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
  .tr-ring svg { transform: rotate(-90deg); display: block; }
  .tr-ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: .95rem; color: var(--ink); }
  :root[data-compact] .tr-head { flex-wrap: wrap; }
  /* C17-10 (cycle 17): the checklist header had ONLY the pop-out wrap above —
     the A2-family trap in flex form, and this file's first media query. At
     390px the 72px ring + two min-width:96px tiles squeezed .tr-head-main
     to ~18px, clipping "My Training" (measured by cycle-16 Batch 4, left
     unfixed). Wrap at narrow viewports: ring + title row, tiles below. */
  @media (max-width: 560px) {
    .tr-head { flex-wrap: wrap; }
    .tr-head .tr-sum { width: 100%; }
    .tr-head-main { min-width: 55%; }
  }
  /* overdue checklist row gets the panel[data-tone] accent rail */
  .tr-row.overdue { box-shadow: inset 3px 0 0 var(--destructive); }
  /* quiz action = primary; article action stays accent-soft */
  .tr-complete-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .tr-complete-btn.primary:hover { filter: brightness(1.05); }

  /* §3b — manager completion matrix (reps × items status grid) */
  .tr-legend { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 0 0 10px; font-size: .78rem; color: var(--muted); }
  .tr-legend .sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; vertical-align: -2px; margin-right: 5px; }
  /* inline-grid + max-content so a small matrix sits next to the employee name
     instead of flinging the lone cell to the far right (design rev D/2) */
  .tr-matrix { display: inline-grid; gap: 6px 4px; align-items: center; }
  .tr-matrix-wrap { overflow-x: auto; }
  .tr-matrix .mh { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .tr-matrix .mh-num { text-align: center; }
  .tr-matrix .mh-cov { text-align: right; }
  .tr-m-emp { font-size: .84rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-cell-sq { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; margin: 0 auto; font-family: var(--mono); font-weight: 700; font-size: .8rem; }
  .tr-cell-sq.done { background: var(--accent); color: var(--paper); }
  .tr-cell-sq.overdue { background: var(--destructive); color: var(--paper); }
  .tr-cell-sq.pending { background: var(--paper-2); border: 1px solid var(--line); }
  .tr-cov { font-family: var(--mono); font-weight: 700; font-size: .82rem; text-align: right; }
  .tr-cov.full { color: var(--success-deep); }
  .tr-cov.mid  { color: var(--warning-deep); }
  .tr-cov.low  { color: var(--danger-deep); }
  .tr-key { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 10px; font-size: .74rem; color: var(--muted); }
  .tr-key b { color: var(--ink); font-family: var(--mono); }
  /* §D/2 — card the manager view's bottom sections (matrix / assignments /
     quizzes / analytics), matching the carded telemetry strip + assign form */
  .tr-card { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card);
    padding: 14px 16px; margin-bottom: 18px; max-width: 100%; }
  .tr-card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  /* A13 (cycle 13): an <h2>, not a span — margin:0 zeroes the UA h2 default so
     the flex head row is pixel-identical. */
  .tr-card-title { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); margin: 0; }
  /* C17 batch-3/4: .tr-section-h was used on two manager surfaces (EmpDocs
     team dashboard, Coaching "By employee") but DEFINED NOWHERE — the
     headings rendered as unstyled body text, and as <div>s they were
     invisible to heading navigation (INV-178). Now real <h2>s with a
     defined style; shared here because both consumers already use this
     partial's .tr-* vocabulary (like .tr-empty). Sentence-case per the
     batch-J register rule. */
  .tr-section-h { font-family: var(--ui); font-size: .95rem; font-weight: 600;
    color: var(--ink); margin: 18px 0 8px; }
  .tr-card-badge { font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: var(--paper-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; flex-shrink: 0; }
  .tr-empty-well { border: 1px dashed var(--line); border-radius: 10px; padding: 18px 16px;
    text-align: center; color: var(--muted); font-size: .9rem; }
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  TRAINING & EMPLOYEE DOCS — client, T1 (training checklist + manager matrix).
//  Content is KB items rendered via the global kbMd_ (articles) or the Drive
//  /preview iframe (embeds) in a reader modal — no Reference-partial changes
//  needed. Employee Docs tabs land in T3.
//  Spec: docs/training-employee-docs-spec.md.
// ════════════════════════════════════════════════════════════════════════════
var TRAIN_STATE = { my: null, dash: null, kbTree: null, emps: null, readerItemId: null };

/** Pure chip markup — pinned by the Node harness. */
function trainChipHtml_(status) {
  var s = (status === 'done' || status === 'overdue') ? status : 'pending';
  var label = s === 'done' ? 'Done' : s === 'overdue' ? 'Overdue' : 'Pending';
  return '<span class="tr-chip ' + s + '">' + label + '</span>';
}

/** SVG completion ring (track + accent arc) with the % centered. */
function trainRingHtml_(pct) {
  var r = 32, c = 2 * Math.PI * r, off = c * (1 - (pct || 0) / 100);
  return '<div class="tr-ring"><svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">' +
    '<circle cx="36" cy="36" r="' + r + '" fill="none" stroke="var(--paper-3)" stroke-width="7"></circle>' +
    // §3 ring fill — animate from empty (--circ) to filled (--target=off).
    '<circle class="ring-arc" style="--circ:' + c.toFixed(1) + ';--target:' + off.toFixed(1) + '" cx="36" cy="36" r="' + r + '" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"></circle>' +
    '</svg><div class="pct">' + (pct || 0) + '%</div></div>';
}

/** Coverage-% tone class (100 → success, ≥50 → warn, else danger). */
function trainCoverageClass_(pct) { return pct >= 100 ? 'full' : pct >= 50 ? 'mid' : 'low'; }

// ── Rep view: My Training ──────────────────────────────────────────────────
function enterTrainingHomeView() {
  if (typeof stopClock === 'function') stopClock();
  if (typeof cnStopAmbientPolling_ === 'function') cnStopAmbientPolling_();
  var area = document.getElementById('view-area');
  if (!area) return;
  area.innerHTML =
    (COMPACT_MODE ? '<div class="compact-header">' + icon('check', 16) + ' My Training</div>' : '') +
    '<div id="tr-home-content"><div class="m-loading"><span class="lo-glyph">' + icon('check', 26) + '</span> Loading training&hellip;</div></div>';
  trainLoadMy_();
}

function trainLoadMy_() {
  var requestedView = currentView;
  google.script.run
    .withSuccessHandler(function (data) {
      TRAIN_STATE.my = data;                       // state updates unconditionally (cache stays warm)
      if (currentView !== requestedView) return;   // late-callback guard (CN loader pattern)
      trainRenderMy_();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView) return;
      var el = document.getElementById('tr-home-content');
      if (el) el.innerHTML = errorStateHtml_('Could not load training: ' + ((err && err.message) || err));   // A12
    })
    .getMyTraining();
}

function trainRenderMy_() {
  var el = document.getElementById('tr-home-content');
  if (!el) return;
  var data = TRAIN_STATE.my || {};
  if (data.error) { el.innerHTML = errorStateHtml_(data.error); return; }   // A12
  var items = data.items || [];
  if (!items.length) {
    el.innerHTML = '<div class="tr-empty">Nothing assigned right now — you’re all caught up.</div>';
    return;
  }
  var done = 0, overdue = 0;
  items.forEach(function (it) { if (it.status === 'done') done++; if (it.status === 'overdue') overdue++; });
  var pct = items.length ? Math.round((done / items.length) * 100) : 0;
  var left = items.length - done;
  var h = '<div class="tr-head">' +
    trainRingHtml_(pct) +
    '<div class="tr-head-main">' +
      '<div class="tr-head-title">My Training</div>' +
      '<div class="tr-head-sub">' + done + ' of ' + items.length + ' complete' +
        (overdue ? ' · <span class="tr-overdue-n">' + overdue + ' overdue</span>' : '') + '</div>' +
    '</div>' +
    '<div class="tr-sum">' +
      '<div class="cell"><div class="cell-label">Done</div><div class="cell-val">' + done + '</div></div>' +
      '<div class="cell"><div class="cell-label">Left</div><div class="cell-val">' + left + '</div></div>' +
    '</div>' +
    '</div><div class="tr-list">';
  items.forEach(function (it) {
    var isQuiz = it.itemType === 'quiz';
    var meta = (it.dueDate ? 'Due ' + esc(it.dueDate) : 'No due date') +
      (it.completed ? ' · completed ' + esc(String(it.completedAt).substring(0, 10)) : '');
    if (isQuiz && it.quiz) {
      meta = 'Quiz · ' + it.quiz.questionCount + ' question' + (it.quiz.questionCount === 1 ? '' : 's') +
        ' · pass ≥' + it.quiz.passPct + '%' +
        (it.quiz.attempts ? ' · attempt' + (it.quiz.attempts === 1 ? '' : 's') + ': ' + it.quiz.attempts : '') +
        (it.quiz.lastScorePct !== null && it.quiz.lastScorePct !== undefined && it.quiz.attempts ? ' · last score ' + it.quiz.lastScorePct + '%' : '') +
        ' · ' + meta;
    }
    var action = '';
    if (!it.completed) {
      action = isQuiz
        ? '<button class="tr-complete-btn primary" data-tr-quiz="' + esc(it.itemId) + '">' + icon('list', 13) + ' Take quiz</button>'
        : '<button class="tr-complete-btn" data-tr-complete="' + esc(it.itemId) + '">' + icon('check', 13) + ' Mark complete</button>';
    }
    var titleAttr = isQuiz ? 'data-tr-quiz="' + esc(it.itemId) + '"' : 'data-tr-open="' + esc(it.itemId) + '"';
    h += '<div class="tr-row ' + esc(it.status) + '" data-item-id="' + esc(it.itemId) + '">' +
      trainChipHtml_(it.status) +
      '<div><button class="tr-title" ' + titleAttr + '>' + esc(it.title) + '</button>' +
      '<div class="tr-meta">' + meta + '</div>' +
      (isQuiz && it.quiz && it.quiz.kbItemId
        ? '<div class="tr-meta"><button class="tr-link" data-tr-open="' + esc(it.quiz.kbItemId) + '">Review the material first</button></div>' : '') +
      '</div>' +
      '<div class="tr-spacer"></div>' + action +
      '</div>';
  });
  h += '</div>';
  el.innerHTML = h;
  if (!el._trDelegated) {
    el._trDelegated = true;
    el.addEventListener('click', function (e) {
      var open = e.target.closest('[data-tr-open]');
      if (open) { trainOpenReader_(open.getAttribute('data-tr-open')); return; }
      var quiz = e.target.closest('[data-tr-quiz]');
      if (quiz) { trainOpenQuiz_(quiz.getAttribute('data-tr-quiz')); return; }
      var comp = e.target.closest('[data-tr-complete]');
      if (comp) trainMarkComplete_(comp.getAttribute('data-tr-complete'), comp);
    });
  }
}

function trainItemById_(itemId) {
  var items = (TRAIN_STATE.my && TRAIN_STATE.my.items) || [];
  for (var i = 0; i < items.length; i++) if (items[i].itemId === itemId) return items[i];
  return null;
}

/** Pessimistic (low-frequency; server state is the deliverable). */
function trainMarkComplete_(itemId, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        if (btn) { btn.disabled = false; btn.innerHTML = icon('check', 13) + ' Mark complete'; }
        showToast((res && res.error) || 'Could not mark complete.', 'error');
        return;
      }
      var it = trainItemById_(itemId);
      if (it) { it.completed = true; it.completedAt = res.completedAt || ''; it.status = 'done'; }
      showToast('Training marked complete.', 'success');
      // §6 settle — dim + strike + draw a check on the row, then let the list
      // re-render to its canonical done state once the animation has played.
      var row = null;
      document.querySelectorAll('.tr-row[data-item-id]').forEach(function (r) {
        if (r.getAttribute('data-item-id') === itemId) row = r;
      });
      if (row && currentView === 'trainingHome') {
        settleRow_(row, '.tr-title');
        setTimeout(function () { if (currentView === 'trainingHome') trainRenderMy_(); }, 420);
      } else if (currentView === 'trainingHome') {
        trainRenderMy_();
      }

    '</div></div>';

function trainSubmitQuiz_() {
  var quiz = TRAIN_STATE.quizDef;
  var quizId = TRAIN_STATE.quizTaking;
  if (!quiz || !quizId) return;
  var answers = [], unanswered = 0;
  quiz.questions.forEach(function (q, qi) {
    var sel = document.querySelector('input[name="tr-q-' + qi + '"]:checked');
    if (!sel) unanswered++;
    answers.push(sel ? Number(sel.value) : -1);
  });
  var go = function () {
    var btn = document.getElementById('tr-quiz-submit');
    if (btn) { btn.disabled = true; btn.textContent = 'Grading…'; }
    google.script.run
      .withSuccessHandler(function (res) {
        // E13 (cycle 10): update the CHECKLIST STATE before the modal-identity
        // guard — the server recorded the attempt (and, on a pass, the
        // completion) regardless of whether the rep cancelled the modal while
        // grading was in flight; the old ordering skipped the bookkeeping, so
        // the checklist showed Pending + a stale attempt count and the rep
        // might needlessly retake. Only the RESULT VIEW render stays gated on
        // the modal still being open.
        if (res && res.success) {
          var it = trainItemById_(quizId);
          if (it) {
            if (it.quiz) { it.quiz.attempts = res.attempt; it.quiz.lastScorePct = res.scorePct; }
            if (res.passed) { it.completed = true; it.status = 'done'; }
          }
          if (currentView === 'trainingHome') trainRenderMy_();
        }
        if (TRAIN_STATE.quizTaking !== quizId) return;
        if (!res || !res.success) {
          if (btn) { btn.disabled = false; btn.innerHTML = icon('check', 13) + ' Submit answers'; }
          showToast((res && res.error) || 'Could not grade the quiz.', 'error');
          return;
        }
        trainRenderQuizResult_(quiz, answers, res);
      })
      .withFailureHandler(function (err) {
        if (btn) { btn.disabled = false; btn.innerHTML = icon('check', 13) + ' Submit answers'; }
        showToast('Could not grade the quiz: ' + ((err && err.message) || err), 'error');
      })
      .submitQuizAttempt(quizId, answers);
  };
  if (unanswered) {
    uiConfirm({
      title: 'Unanswered questions',
      message: unanswered + ' question' + (unanswered === 1 ? ' is' : 's are') + ' unanswered and will count as wrong. Submit anyway?',
      confirmLabel: 'Submit',
    }).then(function (ok) { if (ok) go(); });
  } else { go(); }
}

function trainRenderQuizResult_(quiz, answers, res) {
  var overlay = document.getElementById('train-quiz-overlay');
  if (!overlay) return;
  var h = '<div class="modal tr-quiz"><div class="body">' +
    '<div class="tr-score ' + (res.passed ? 'pass' : 'fail') + '">' +
      '<div class="big">' + res.scorePct + '%</div>' +
      '<div class="sub">' + (res.passed ? 'Passed' : 'Not passed') + ' · ' + res.right + '/' + res.total + ' correct · pass ≥' + res.passPct + '% · attempt ' + res.attempt + '</div>' +
    '</div>';
  quiz.questions.forEach(function (q, qi) {
    var ok = !!res.perQuestion[qi];
    var your = answers[qi] >= 0 ? q.options[answers[qi]] : '(no answer)';
    h += '<div class="tr-q ' + (ok ? 'right' : 'wrong') + '">' +
      '<div class="tr-q-text">' + (qi + 1) + '. ' + esc(q.q) + '</div>' +
      '<div class="tr-meta">Your answer: ' + esc(your) + '</div>' +
      '<div class="tr-q-verdict">' + (ok ? '✓ Correct' : '✗ Incorrect — review the material and retake') + '</div>' +
      '</div>';
  });
  h += '</div><div class="foot">' +
    (res.passed ? '' : '<button class="kb-btn" id="tr-quiz-retake">' + icon('refresh', 13) + ' Retake</button>') +
    '<button class="tr-complete-btn" onclick="trainCloseQuiz_()">Done</button>' +
    '</div></div>';
  overlay.innerHTML = h;
  var rt = document.getElementById('tr-quiz-retake');
  if (rt) rt.addEventListener('click', function () { trainRenderQuizForm_(quiz); });
}

function trainCloseQuiz_() {

function trainLoadMgr_() {
  var requestedView = currentView;
  var got = 0, failed = false;
  function done() {
    got++;
    if (got < 5 || failed || currentView !== requestedView) return;
    trainRenderMgr_();
  }
  function onFail(err) {
    if (failed) return;
    failed = true;
    if (currentView !== requestedView) return;
    var el = document.getElementById('tr-mgr-content');
    if (el) el.innerHTML = errorStateHtml_('Could not load: ' + ((err && err.message) || err));   // A12
  }
  google.script.run.withSuccessHandler(function (d) { TRAIN_STATE.dash = d; done(); }).withFailureHandler(onFail).getTrainingDashboard();
  google.script.run.withSuccessHandler(function (d) { TRAIN_STATE.kbTree = d; done(); }).withFailureHandler(onFail).getReferenceTree();
  google.script.run.withSuccessHandler(function (d) { TRAIN_STATE.emps = d; done(); }).withFailureHandler(onFail).getEmployeesList();
  google.script.run.withSuccessHandler(function (d) { TRAIN_STATE.quizzes = d; done(); }).withFailureHandler(onFail).getQuizzes();
  // E12 (cycle 10): the analytics aggregate is DECORATIVE (a panel), but it
  // shared the fatal onFail — its failure (the most plausible of the five: a
  // bounded-tail scan) took down assignment, the completion matrix, and quiz
  // authoring with it. Degrade to a panel-level "unavailable" instead.
  google.script.run
    .withSuccessHandler(function (d) { TRAIN_STATE.quizAnalytics = d; done(); })
    .withFailureHandler(function () { TRAIN_STATE.quizAnalytics = { error: 'Analytics unavailable' }; done(); })
    .getQuizAnalytics();
}

function trainRenderMgr_() {
  var el = document.getElementById('tr-mgr-content');
  if (!el) return;
  var dash = TRAIN_STATE.dash || {};
  if (dash.error) { el.innerHTML = errorStateHtml_(dash.error); return; }   // A12
  var kbItems = (TRAIN_STATE.kbTree && TRAIN_STATE.kbTree.items) || [];
  var emps = (TRAIN_STATE.emps && TRAIN_STATE.emps.employees) || [];

  // Assign form — KB items grouped by department + a Quizzes group. The
  // option value carries the itemType prefix ('kb:' / 'quiz:').
  var byDept = {};
  kbItems.forEach(function (it) { (byDept[it.department] = byDept[it.department] || []).push(it); });
  var quizzes = (TRAIN_STATE.quizzes && TRAIN_STATE.quizzes.quizzes) || [];
  var sel = '<select id="tr-as-item"><option value="">Pick an item…</option>';
  if (quizzes.length) {
    sel += '<optgroup label="Quizzes">';
    quizzes.forEach(function (q) { sel += '<option value="quiz:' + esc(q.quizId) + '">' + esc(q.title) + '</option>'; });
    sel += '</optgroup>';
  }
  Object.keys(byDept).sort().forEach(function (d) {
    sel += '<optgroup label="' + esc(d) + '">';
    byDept[d].forEach(function (it) { sel += '<option value="kb:' + esc(it.id) + '">' + esc(it.title) + '</option>'; });
    sel += '</optgroup>';
  });
  sel += '</select>';
  var empBox = '<div class="tr-emp-box"><label><input type="checkbox" id="tr-as-all"> <strong>All employees</strong></label>';
  emps.forEach(function (e) {
    empBox += '<label><input type="checkbox" class="tr-as-emp" value="' + esc(e.id) + '"> ' + esc(e.name) + '</label>';
  });
  empBox += '</div>';

  // #5 — at-a-glance status cards (assigned items / reps tracked / overall
  // completion / overdue) computed from the dashboard matrix.
  var mItems = dash.items || [], mReps = dash.reps || [];
  var totalCells = mReps.length * mItems.length, doneCells = 0, overdueCells = 0;
  mReps.forEach(function (r) {
    mItems.forEach(function (it) {
      var s = r.items && r.items[it.key];
      if (s === 'done') doneCells++; else if (s === 'overdue') overdueCells++;
    });
  });
  var pct = totalCells ? Math.round((doneCells / totalCells) * 100) : 0;
  var pctCls = pct >= 80 ? 'success' : (pct >= 50 ? 'warn' : 'crit');
  var statCell = function (label, value, sub, cls) {
    return '<div class="tel-cell"><div class="tel-label">' + label + '</div>' +
      '<div class="tel-value ' + (cls || '') + '">' + esc(String(value)) + '</div>' +
      '<div class="tel-sub">' + esc(sub) + '</div></div>';
  };
  var statStrip = (mItems.length || mReps.length)
    ? '<div class="telemetry" style="max-width:860px;margin-bottom:18px">' +
        statCell('Assigned', mItems.length, 'items') +
        statCell('Reps', mReps.length, 'tracked') +
        statCell('Complete', pct + '%', doneCells + ' / ' + totalCells, pctCls) +
        statCell('Overdue', overdueCells, 'cells', overdueCells > 0 ? 'crit' : '') +
      '</div>'
    : '';

  var h = statStrip +
    '<div class="tr-assign"><h3>Assign training</h3><div class="row">' +
    '<div><label>Reference item</label>' + sel + '</div>' +
    '<div><label>Employees</label>' + empBox + '</div>' +
    '<div><label>Due date (optional)</label><input type="date" id="tr-as-due"></div>' +
    '<div><label>&nbsp;</label><button class="tr-complete-btn" id="tr-as-go">' + icon('plus', 13) + ' Assign</button></div>' +
    '</div></div>';

  // Completion matrix — reps × items status grid (§3b). Squares: Done = accent,
  // Overdue = destructive, Pending = bordered. Reps sorted least-covered first.
  var items = dash.items || [], reps = dash.reps || [];
  if (items.length) {
    var N = items.length;
    var withCov = reps.map(function (r) {
      var d = 0; items.forEach(function (it) { if (r.items[it.key] === 'done') d++; });
      return { r: r, pct: N ? Math.round((d / N) * 100) : 0 };
    });
    withCov.sort(function (a, b) { return a.pct - b.pct || a.r.name.localeCompare(b.r.name); });

    h += '<div class="tr-card"><div class="tr-card-h"><h2 class="tr-card-title">Completion matrix</h2>' +
        '<span class="tr-card-badge">' + reps.length + ' rep · ' + N + ' item</span></div>' +
      '<div class="tr-legend">' +
        '<span><span class="sw" style="background:var(--accent)"></span>Done</span>' +
        '<span><span class="sw" style="background:var(--destructive)"></span>Overdue</span>' +
        '<span><span class="sw" style="background:var(--paper-2);border:1px solid var(--line)"></span>Pending</span>' +
      '</div>' +
      '<div class="tr-matrix-wrap"><div class="tr-matrix" style="grid-template-columns:minmax(140px,240px) repeat(' + N + ', 30px) 70px">';
    // header row
    h += '<div class="mh mh-emp">Employee</div>';
    items.forEach(function (it, i) { h += '<div class="mh mh-num" title="' + esc(it.title) + '">' + (i + 1) + '</div>'; });
    h += '<div class="mh mh-cov">Cov</div>';
    // body rows (sorted)
    withCov.forEach(function (w) {
      h += '<div class="tr-m-emp" title="' + esc(w.r.name) + '">' + esc(w.r.name) + '</div>';
      items.forEach(function (it) {
        var s = w.r.items[it.key];
        var sq = s === 'done' ? '<span class="tr-cell-sq done" title="Done">' + icon('check', 13) + '</span>'
          : s === 'overdue' ? '<span class="tr-cell-sq overdue" title="Overdue">!</span>'
          : s === 'pending' ? '<span class="tr-cell-sq pending" title="Pending"></span>' : '<span></span>';
        h += '<div>' + sq + '</div>';
      });
      h += '<div class="tr-cov ' + trainCoverageClass_(w.pct) + '">' + w.pct + '%</div>';
    });
    h += '</div></div>';
    // numbered item key (carries the per-item done/assigned count the old header had)
    h += '<div class="tr-key">' + items.map(function (it, i) {
      return '<span><b>' + (i + 1) + '</b> ' + esc(it.title) + ' (' + it.done + '/' + it.assigned + (it.overdue ? ' · ' + it.overdue + ' late' : '') + ')</span>';
    }).join('') + '</div>';
    h += '</div>';
  } else {
    h += '<div class="tr-card"><div class="tr-empty-well">No training assigned yet — use the form above to assign a Reference item.</div></div>';
  }

  // Active assignments (revoke).
  var assigns = dash.assignments || [];
  if (assigns.length) {
    h += '<div class="tr-card"><div class="tr-card-h"><h2 class="tr-card-title">Active assignments</h2>' +
        '<span class="tr-card-badge">' + assigns.length + '</span></div>' +
      '<table class="tr-table"><thead><tr>' +
      '<th>Item</th><th>Assigned to</th><th>Due</th><th>Assigned</th><th></th></tr></thead><tbody>';
    assigns.forEach(function (a) {
      h += '<tr><td>' + esc(a.title) + '</td><td>' + esc(a.empLabel) + '</td>' +
        '<td>' + esc(a.dueDate || '—') + '</td><td>' + esc(String(a.assignedAt).substring(0, 10)) + '</td>' +
        '<td><button class="tr-revoke-btn" data-tr-revoke="' + esc(a.assignId) + '">Revoke</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  // Quizzes — authoring (T2).
  h += '<div class="tr-card"><div class="tr-card-h"><h2 class="tr-card-title">Quizzes</h2>' +
      (quizzes.length ? '<span class="tr-card-badge">' + quizzes.length + '</span>' : '') + '</div>';
  if (quizzes.length) {
    h += '<table class="tr-table"><thead><tr><th>Quiz</th><th>Questions</th><th>Pass</th><th>Linked item</th><th></th></tr></thead><tbody>';
    var kbTitleById = {};
    kbItems.forEach(function (it) { kbTitleById[it.id] = it.title; });
    quizzes.forEach(function (q) {
      h += '<tr><td>' + esc(q.title) + '</td><td>' + q.questionCount + '</td><td>≥' + q.passPct + '%</td>' +
        '<td>' + esc(q.kbItemId ? (kbTitleById[q.kbItemId] || '(deleted item)') : '—') + '</td>' +
        '<td><button class="kb-btn" data-tr-quiz-edit="' + esc(q.quizId) + '">Edit</button> ' +
        '<button class="tr-revoke-btn" data-tr-quiz-del="' + esc(q.quizId) + '">Delete</button></td></tr>';
    });
    h += '</tbody></table>';
  } else {
    h += '<div class="tr-empty-well">No quizzes yet — create one to assess training with a graded, retryable check.</div>';
  }
  h += '<p style="margin:12px 0 0"><button class="tr-complete-btn" id="tr-quiz-new">' + icon('plus', 13) + ' New quiz</button></p>';
  h += '</div>';

  // Quiz analytics (T4) — read-only aggregate; no answer keys, no per-rep rows.
  var qa = (TRAIN_STATE.quizAnalytics && TRAIN_STATE.quizAnalytics.quizzes) || [];
  if (!qa.length && TRAIN_STATE.quizAnalytics && TRAIN_STATE.quizAnalytics.error) {
    // E12 — panel-level degradation: the rest of Team Training renders.
    h += '<div class="tr-card"><div class="tr-card-h"><h2 class="tr-card-title">Quiz analytics</h2></div>' +
      errorStateHtml_(TRAIN_STATE.quizAnalytics.error + ' — re-enter the tab to retry.') + '</div>';   // A12
  }
  if (qa.length) {
    h += '<div class="tr-card"><div class="tr-card-h"><h2 class="tr-card-title">Quiz analytics</h2>' +
        '<span class="tr-card-badge">' + qa.length + '</span></div>' +
      '<table class="tr-table"><thead><tr><th>Quiz</th><th>Attempts</th><th>Passed</th><th>Pass rate</th><th>Avg score</th><th>Avg tries</th></tr></thead><tbody>';
    qa.forEach(function (q) {
      var passCls = (q.passRate === null) ? '' : (q.passRate >= 80 ? 'tr-cell-done' : q.passRate >= 50 ? 'tr-cell-pending' : 'tr-cell-overdue');
      h += '<tr><td>' + esc(q.title) + '</td>' +
        '<td>' + q.attemptCount + '</td>' +
        '<td>' + q.repsPassed + '/' + q.repsAttempted + '</td>' +
        '<td>' + (q.passRate === null ? '—' : '<span class="' + passCls + '">' + q.passRate + '%</span>') + '</td>' +
        '<td>' + (q.avgScore === null ? '—' : q.avgScore + '%') + '</td>' +
        '<td>' + (q.avgAttemptsPerRep === null ? '—' : q.avgAttemptsPerRep) + '</td></tr>';
    });
    h += '</tbody></table></div>';

  el.innerHTML = h;

  document.getElementById('tr-as-go').addEventListener('click', trainSubmitAssign_);

  if (!el._trMgrDelegated) {

      var rv = e.target.closest('[data-tr-revoke]');

      if (qe) { trainOpenQuizEditor_(qe.getAttribute('data-tr-quiz-edit')); return; }
      var qd = e.target.closest('[data-tr-quiz-del]');
      if (qd) trainDeleteQuiz_(qd.getAttribute('data-tr-quiz-del'), qd);
    });
  }
}

function trainSubmitAssign_() {
  var raw = (document.getElementById('tr-as-item') || {}).value || '';
  if (!raw) { showToast('Pick an item to assign.', 'error'); return; }
  var sep = raw.indexOf(':');
  var itemType = raw.substring(0, sep), itemId = raw.substring(sep + 1);
  var empIds;
  if ((document.getElementById('tr-as-all') || {}).checked) {
    empIds = '*';
  } else {
    empIds = Array.prototype.slice.call(document.querySelectorAll('.tr-as-emp:checked')).map(function (c) { return c.value; });
    if (!empIds.length) { showToast('Pick at least one employee (or All employees).', 'error'); return; }
  }
  var dueDate = (document.getElementById('tr-as-due') || {}).value || '';
  var btn = document.getElementById('tr-as-go');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) btn.disabled = false;
      if (!res || !res.success) { showToast((res && res.error) || 'Assignment failed.', 'error'); return; }
      showToast('Training assigned.', 'success');
      if (currentView === 'trainingManage') trainLoadMgr_();
    })
    .withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      showToast('Assignment failed: ' + ((err && err.message) || err), 'error');
    })
    .saveTrainingAssignment({ itemType: itemType, itemId: itemId, empIds: empIds, dueDate: dueDate });
}

// ── Quiz editor (manager, T2) ──────────────────────────────────────────────
function trainQuizById_(quizId) {
  var qs = (TRAIN_STATE.quizzes && TRAIN_STATE.quizzes.quizzes) || [];
  for (var i = 0; i < qs.length; i++) if (qs[i].quizId === quizId) return qs[i];
  return null;
}

function trainOpenQuizEditor_(quizId) {
  var existing = quizId ? trainQuizById_(quizId) : null;
  TRAIN_STATE.qed = existing
    ? { quizId: quizId, title: existing.title, kbItemId: existing.kbItemId, passPct: existing.passPct,
        questions: existing.questions.map(function (q) { return { q: q.q, options: q.options.slice(), correct: q.correct }; }) }
    : { quizId: '', title: '', kbItemId: '', passPct: 80, questions: [{ q: '', options: ['', ''], correct: 0 }] };
  var overlay = ensureOverlay('train-qed-overlay', { onClose: trainCloseQuizEditor_ });
  trainRenderQuizEditor_(overlay);
}

function trainRenderQuizEditor_(overlay) {
  overlay = overlay || document.getElementById('train-qed-overlay');
  var st = TRAIN_STATE.qed;
  if (!overlay || !st) return;
  var kbItems = (TRAIN_STATE.kbTree && TRAIN_STATE.kbTree.items) || [];
  var kbSel = '<select id="tr-qed-kb"><option value="">(none)</option>';
  kbItems.forEach(function (it) {
    kbSel += '<option value="' + esc(it.id) + '"' + (it.id === st.kbItemId ? ' selected' : '') + '>' + esc(it.title) + '</option>';
  });
  kbSel += '</select>';
  var warnHtml = (st._importWarnings && st._importWarnings.length)
    ? '<div class="tr-qed-warn">' + icon('warning', 13) + ' <strong>Imported with notes:</strong><ul>' +
        st._importWarnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>'
    : '';
  var h = '<div class="modal tr-qed"><div class="body">' +
    '<div class="tr-qed-head"><h2 style="margin:0;">' + (st.quizId ? 'Edit quiz' : 'New quiz') + '</h2>' +
      (st.quizId ? '' : '<button class="kb-btn" id="tr-qed-import" title="Pull questions + correct answers from a Google Forms quiz">' + icon('download', 12) + ' Import from Google Forms</button>') +
    '</div>' +
    warnHtml +
    '<div class="field"><label>Title</label><input type="text" id="tr-qed-title" maxlength="120" value="' + esc(st.title) + '"></div>' +
    '<div class="field"><label>Pass threshold (%)</label><input type="number" id="tr-qed-pass" min="0" max="100" value="' + Number(st.passPct) + '"></div>' +
    '<div class="field"><label>Linked Reference item (optional — shown as "review the material")</label>' + kbSel + '</div>';
  st.questions.forEach(function (q, qi) {
    h += '<div class="tr-qed-q"><div class="qhead"><span class="qn">Question ' + (qi + 1) + '</span>' +
      (st.questions.length > 1 ? '<button class="tr-revoke-btn" data-qed-delq="' + qi + '">Remove</button>' : '') + '</div>' +
      '<div class="field"><textarea data-qed-q="' + qi + '" rows="2" maxlength="500" placeholder="Question text">' + esc(q.q) + '</textarea></div>';
    q.options.forEach(function (opt, oi) {
      h += '<div class="opt-row">' +
        '<input type="radio" name="tr-qed-correct-' + qi + '" value="' + oi + '"' + (q.correct === oi ? ' checked' : '') + ' title="Correct answer">' +
        '<input type="text" data-qed-opt="' + qi + ':' + oi + '" maxlength="200" placeholder="Option ' + (oi + 1) + '" value="' + esc(opt) + '">' +
        (q.options.length > 2 ? '<button class="tr-revoke-btn" data-qed-delopt="' + qi + ':' + oi + '">×</button>' : '') +
        '</div>';
    });
    if (q.options.length < 6) h += '<button class="kb-btn" data-qed-addopt="' + qi + '">+ Option</button>';
    h += '<div class="tr-qed-hint">Pick the radio next to the correct option. Reps never see which it is.</div></div>';
  });
  h += (st.questions.length < 50 ? '<button class="kb-btn" id="tr-qed-addq">+ Question</button>' : '') +
    '</div><div class="foot">' +
    '<button class="kb-btn" onclick="trainCloseQuizEditor_()">Cancel</button>' +
    '<button class="tr-complete-btn" id="tr-qed-save">' + icon('check', 13) + ' Save quiz</button>' +
    '</div></div>';
  overlay.innerHTML = h;

  var imp = document.getElementById('tr-qed-import');
  if (imp) imp.addEventListener('click', trainImportQuizFromForm_);
  var aq = document.getElementById('tr-qed-addq');
  if (aq) aq.addEventListener('click', function () {
    trainQedSnapshot_();
    TRAIN_STATE.qed.questions.push({ q: '', options: ['', ''], correct: 0 });
    trainRenderQuizEditor_();
  });
  document.getElementById('tr-qed-save').addEventListener('click', trainSaveQuizFromEditor_);
  if (!overlay._qedDelegated) {
    overlay._qedDelegated = true;
    overlay.addEventListener('click', function (e) {
      var t;
      if ((t = e.target.closest('[data-qed-addopt]'))) {
        trainQedSnapshot_();
        TRAIN_STATE.qed.questions[Number(t.getAttribute('data-qed-addopt'))].options.push('');
        trainRenderQuizEditor_();
      } else if ((t = e.target.closest('[data-qed-delopt]'))) {
        trainQedSnapshot_();
        var p = t.getAttribute('data-qed-delopt').split(':');
        var qq = TRAIN_STATE.qed.questions[Number(p[0])];
        qq.options.splice(Number(p[1]), 1);
        if (qq.correct >= qq.options.length) qq.correct = 0;
        trainRenderQuizEditor_();
      } else if ((t = e.target.closest('[data-qed-delq]'))) {
        trainQedSnapshot_();
        TRAIN_STATE.qed.questions.splice(Number(t.getAttribute('data-qed-delq')), 1);
        trainRenderQuizEditor_();
      }
    });
  }
}

/** Snapshot the editor DOM into state before any structural re-render so
 *  in-progress typing survives (the cnRenderSubforms_ lesson). */
function trainQedSnapshot_() {
  var st = TRAIN_STATE.qed;
  if (!st || !document.getElementById('train-qed-overlay')) return;
  var v = function (id) { var el = document.getElementById(id); return el ? el.value : null; };
  if (v('tr-qed-title') !== null) st.title = v('tr-qed-title');
  if (v('tr-qed-pass') !== null) st.passPct = Number(v('tr-qed-pass'));
  if (v('tr-qed-kb') !== null) st.kbItemId = v('tr-qed-kb');
  st.questions.forEach(function (q, qi) {
    var qEl = document.querySelector('[data-qed-q="' + qi + '"]');
    if (qEl) q.q = qEl.value;
    q.options.forEach(function (_, oi) {
      var oEl = document.querySelector('[data-qed-opt="' + qi + ':' + oi + '"]');
      if (oEl) q.options[oi] = oEl.value;
    });
    var sel = document.querySelector('input[name="tr-qed-correct-' + qi + '"]:checked');
    if (sel) q.correct = Number(sel.value);
  });
}

/** Operator feedback (2026-06-15) — import an existing Google Forms quiz.
 *  READ-ONLY on the server; fills the editor for review (nothing saves until
 *  the manager clicks Save quiz). Only on NEW quizzes (the button is hidden
 *  when editing an existing one). */
function trainImportQuizFromForm_() {
  trainQedSnapshot_();   // preserve anything already typed (title/pass/kb link)
  uiPrompt({
    title: 'Import from Google Forms',
    message: 'Paste the EDIT url of a Google Forms quiz (it contains /forms/d/<id>/edit). Multiple-choice questions and their marked correct answers are imported for your review — nothing is saved until you click Save quiz.',
    placeholder: 'https://docs.google.com/forms/d/…/edit',
  }).then(function (url) {
    if (!url) return;
    showToast('Importing…', 'info');
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.error) { showToast((res && res.error) || 'Import failed.', 'error'); return; }
        var st = TRAIN_STATE.qed || (TRAIN_STATE.qed = { quizId: '', kbItemId: '', passPct: 80, questions: [] });
        if (res.title) st.title = res.title;
        if (typeof res.passPct === 'number') st.passPct = res.passPct;
        if (res.questions && res.questions.length) st.questions = res.questions;
        st._importWarnings = res.warnings || [];
        trainRenderQuizEditor_();
        var w = (res.warnings || []).length;
        showToast('Imported ' + res.questions.length + ' question' + (res.questions.length === 1 ? '' : 's') +
          (w ? ' · ' + w + ' note' + (w === 1 ? '' : 's') + ' — review below' : '') + '.', w ? 'warn' : 'success');
      })
      .withFailureHandler(function (err) { showToast('Import failed: ' + err.message, 'error'); })
      .importQuizFromForm(url);
  });
}

function trainSaveQuizFromEditor_() {
  trainQedSnapshot_();
  var st = TRAIN_STATE.qed;
  if (!st) return;
  var btn = document.getElementById('tr-qed-save');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="tr-spin"></span> Saving…'; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        if (btn) { btn.disabled = false; btn.innerHTML = icon('check', 13) + ' Save quiz'; }
        showToast((res && res.error) || 'Save failed.', 'error');
        return;
      }
      showToast('Quiz saved.', 'success');
      trainCloseQuizEditor_();
      if (currentView === 'trainingManage') trainLoadMgr_();
    })
    .withFailureHandler(function (err) {
      if (btn) { btn.disabled = false; btn.innerHTML = icon('check', 13) + ' Save quiz'; }
      showToast('Save failed: ' + ((err && err.message) || err), 'error');
    })
    .saveQuiz({ quizId: st.quizId, title: st.title, kbItemId: st.kbItemId, passPct: st.passPct, questions: st.questions });
}

/** Idempotent (ensureOverlay contract). */
function trainCloseQuizEditor_() {
  TRAIN_STATE.qed = null;
  var o = document.getElementById('train-qed-overlay');
  if (o) { o.classList.remove('open'); o.innerHTML = ''; }
}

function trainDeleteQuiz_(quizId, btn) {
  uiConfirm({
    title: 'Delete quiz?',
    message: 'Assignments pointing at it drop off checklists; past attempts and completions are kept.',
    confirmLabel: 'Delete', tone: 'danger',
  }).then(function (ok) {
    if (!ok) return;
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="tr-spin"></span> Deleting…'; }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          if (btn) { btn.disabled = false; btn.textContent = 'Delete'; }
          showToast((res && res.error) || 'Delete failed.', 'error');
          return;
        }
        showToast('Quiz deleted.', 'success');
        if (currentView === 'trainingManage') trainLoadMgr_();
      })
      .withFailureHandler(function (err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Delete'; }
        showToast('Delete failed: ' + ((err && err.message) || err), 'error');
      })
      .deleteQuiz(quizId);
  });
}

function trainRevoke_(assignId) {
  uiConfirm({
    title: 'Revoke assignment?',
    message: 'The item disappears from the assignee’s checklist. Completion history is kept.',
    confirmLabel: 'Revoke', tone: 'danger',
  }).then(function (ok) {
    if (!ok) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) { showToast((res && res.error) || 'Revoke failed.', 'error'); return; }
        showToast('Assignment revoked.', 'success');
        if (currentView === 'trainingManage') trainLoadMgr_();
      })
      .withFailureHandler(function (err) { showToast('Revoke failed: ' + ((err && err.message) || err), 'error'); })
      .revokeTrainingAssignment(assignId);
  });
}
</script>
