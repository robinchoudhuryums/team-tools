"cost-share": "<svg class=\"kbdg kbdg-cost-share\" viewBox=\"0 0 1160 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"group\" aria-label=\"Deductible, then the 80/20 split\"><defs><marker id=\"mkm10cos\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8 z\" fill=\"var(--dg-muted)\"/><\/marker><\/defs><style>.kbdg-cost-share .dg-lane{fill:var(--dg-panel)}.kbdg-cost-share .dg-lane-b{fill:none;stroke:var(--dg-rule);stroke-width:1}.kbdg-cost-share .dg-lbl{font:600 11px var(--ui);fill:var(--dg-muted);\n    letter-spacing:.06em;text-transform:uppercase}.kbdg-cost-share .dg-box{stroke-width:1.5;rx:4}.kbdg-cost-share .dg-t{font:600 12px var(--ui);fill:var(--dg-bg)}.kbdg-cost-share .dg-ti{font:600 12px var(--ui);fill:var(--dg-navy)}.kbdg-cost-share .dg-s{font:400 10.5px var(--ui);fill:var(--dg-muted)}.kbdg-cost-share .dg-sec{font:600 10px var(--ui);fill:var(--dg-accent)}.kbdg-cost-share .dg-so{font:400 10.5px var(--ui);fill:var(--dg-bg);opacity:.88}.kbdg-cost-share .dg-seco{font:700 10px var(--ui);fill:var(--dg-bg);text-decoration:underline}.kbdg-cost-share .dg-arr{stroke:var(--dg-muted);stroke-width:1.5;fill:none;marker-end:url(#mkm10cos)}.kbdg-cost-share .dg-arr-d{stroke:var(--dg-muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;\n    marker-end:url(#mkm10cos)}.kbdg-cost-share .dg-h{font:700 13px var(--ui);fill:var(--dg-navy)}<\/style><text class=\"dg-h\" x=\"580.0\" y=\"22\" text-anchor=\"middle\">Original Medicare \u2014 who pays for approved charges through the year<\/text><text x=\"40\" y=\"56\" style=\"font:600 11px var(--mono);fill:var(--dg-muted)\">JANUARY 1<\/text><text x=\"1120\" y=\"56\" text-anchor=\"end\" style=\"font:600 11px var(--mono);fill:var(--dg-muted)\">DECEMBER 31<\/text><rect x=\"40\" y=\"70\" width=\"336\" height=\"150\" rx=\"4\" fill=\"var(--dg-watch-bg)\" stroke=\"var(--dg-watch-ink)\" stroke-width=\"1.2\"/><text x=\"208.0\" y=\"133.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-watch-ink)\">Patient pays 100%<\/text><text x=\"208.0\" y=\"149.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">until the annual Part B<\/text><text x=\"208.0\" y=\"165.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">deductible is met \u2014 <a class=\"kb-xref\" href=\"#\" data-kb-id=\"man-10-2\" data-kb-anchor=\"\">10.2<\/a><\/text><rect x=\"384\" y=\"70\" width=\"736\" height=\"117.0\" rx=\"4\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"1.2\"/><text x=\"752.0\" y=\"124.5\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-accent)\">Medicare pays 80%<\/text><text x=\"752.0\" y=\"140.5\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-accent)\">of the approved amount<\/text><rect x=\"384\" y=\"193.0\" width=\"736\" height=\"27.0\" rx=\"4\" fill=\"var(--dg-watch-bg)\" stroke=\"var(--dg-watch-ink)\" stroke-width=\"1.2\"/><text x=\"752.0\" y=\"210.5\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-watch-ink)\">Patient pays 20%<\/text><line x1=\"380\" y1=\"60\" x2=\"380\" y2=\"234\" stroke=\"var(--dg-muted)\" stroke-dasharray=\"4 3\"/><text x=\"380\" y=\"250\" text-anchor=\"middle\" style=\"font:600 11px var(--mono);fill:var(--dg-muted)\">DEDUCTIBLE MET<\/text><rect x=\"40\" y=\"270\" width=\"1080\" height=\"44\" rx=\"5\" fill=\"var(--dg-panel)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"580.0\" y=\"288.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-ink)\">A secondary can take the patient's share<\/text><text x=\"580.0\" y=\"304.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">Medigap (most plans) covers the 20%. Full Medicaid or QMB \u2192 $0, including the deductible. No secondary \u2192 no yearly cap \u2014 <a class=\"kb-xref\" href=\"#\" data-kb-id=\"man-10-6\" data-kb-anchor=\"\">10.6<\/a><\/text><\/svg>",

0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">Express condolences. Note the date of death<\/text><path class=\"dg-arr\" d=\"M580 142 L580 166\"/><rect x=\"400\" y=\"166\" width=\"360\" height=\"44\" rx=\"5\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"2\"/><text x=\"580.0\" y=\"192.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-navy)\">For each item \u2014 is it patient-owned?<\/text><path class=\"dg-arr\" d=\"M580 210 V230 H285 V250\"/><text x=\"296\" y=\"244\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">YES<\/text><path class=\"dg-arr\" d=\"M580 210 V230 H875 V250\"/><text x=\"886\" y=\"244\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">NO<\/text><rect x=\"80\" y=\"250\" width=\"410\" height=\"62\" rx=\"5\" fill=\"var(--dg-scr-bg)\" stroke=\"var(--dg-scr-ink)\" stroke-width=\"1.4\"/><text x=\"285.0\" y=\"269.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-scr-ink)\">It belongs to the family now<\/text><text x=\"285.0\" y=\"285.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-scr-ink)\">Theirs to keep, donate or dispose of.<\/text><text x=\"285.0\" y=\"301.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-scr-ink)\">Nothing to collect<\/text><rect x=\"670\" y=\"250\" width=\"410\" height=\"62\" rx=\"5\" fill=\"var(--dg-bg)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"875.0\" y=\"269.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-ink)\">Create a pick-up ticket<\/text><text x=\"875.0\" y=\"285.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">Confirm best contact and pick-up address. Field<\/text><text x=\"875.0\" y=\"301.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">Ops will verify and call back in 24\u201348 hours<\/text><rect x=\"80\" y=\"330\" width=\"410\" height=\"44\" rx=\"5\" fill=\"var(--dg-pol-bg)\" stroke=\"var(--dg-pol-ink)\" stroke-width=\"1.4\"/><text x=\"285.0\" y=\"348.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-pol-ink)\">Oxygen is never patient-owned \u2014 a<\/text><text x=\"285.0\" y=\"364.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-pol-ink)\">concentrator always comes back<\/text><rect x=\"670\" y=\"330\" width=\"410\" height=\"44\" rx=\"5\" fill=\"var(--dg-panel)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"875.0\" y=\"348.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">Would they rather pay the remaining cost<\/text><text x=\"875.0\" y=\"364.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">and keep the items? Transfer to Billing<\/text><\/svg>",

ved<\/text><rect x=\"970\" y=\"412\" width=\"150\" height=\"40\" rx=\"5\" fill=\"var(--dg-watch-bg)\" stroke=\"var(--dg-watch-ink)\" stroke-width=\"1.4\"/><text x=\"1045.0\" y=\"436.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">Schedule a tech visit<\/text><path class=\"dg-arr\" d=\"M580.0 326 L580.0 372\"/><text x=\"586.0\" y=\"345.0\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">YES<\/text><rect x=\"430\" y=\"372\" width=\"300\" height=\"52\" rx=\"5\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"2\"/><text x=\"580.0\" y=\"394.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">Alarm or red light<\/text><text x=\"580.0\" y=\"410.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">after powering up?<\/text><path class=\"dg-arr\" d=\"M430 398 L380 398\"/><text x=\"396\" y=\"391\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">NO<\/text><rect x=\"40\" y=\"366\" width=\"340\" height=\"64\" rx=\"5\" fill=\"var(--dg-bg)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"210.0\" y=\"386.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">A yellow light at startup is normal<\/text><text x=\"210.0\" y=\"402.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">for about 15 minutes. If it persists,<\/text><text x=\"210.0\" y=\"418.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">schedule service on a regular weekday<\/text><path class=\"dg-arr\" d=\"M580.0 424 L580.0 462\"/><text x=\"586.0\" y=\"439.0\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">YES<\/text><rect x=\"430\" y=\"462\" width=\"300\" height=\"40\" rx=\"5\" fill=\"var(--dg-bg)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"580.0\" y=\"486.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">Ask them to remove ALL tubing<\/text><path class=\"dg-arr\" d=\"M580.0 502 L580.0 536\"/><rect x=\"430\" y=\"536\" width=\"300\" height=\"52\" rx=\"5\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"2\"/><text x=\"580.0\" y=\"558.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">Oxygen flow back to normal?<\/text><text x=\"580.0\" y=\"574.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">No overheating?<\/text><path class=\"dg-arr\" d=\"M430 562 L380 562\"/><text x=\"392\" y=\"555\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">YES<\/text><rect x=\"40\" y=\"536\" width=\"340\" height=\"52\" rx=\"5\" fill=\"var(--dg-scr-bg)\" stroke=\"var(--dg-scr-ink)\" stroke-width=\"1.4\"/><text x=\"210.0\" y=\"558.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-scr-ink)\">No machine issue.<\/text><text x=\"210.0\" y=\"574.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-scr-ink)\">Ask them to replace the tubing<\/text><path class=\"dg-arr\" d=\"M730 562 L790 562\"/><text x=\"742\" y=\"555\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">NO<\/text><rect x=\"790\" y=\"536\" width=\"330\" height=\"52\" rx=\"5\" fill=\"var(--dg-watch-bg)\" stroke=\"var(--dg-watch-ink)\" stroke-width=\"1.4\"/><text x=\"955.0\" y=\"558.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">Schedule a tech visit<\/text><text x=\"955.0\" y=\"574.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">and create a service ticket<\/text><rect x=\"40\" y=\"630\" width=\"520\" height=\"92\" rx=\"5\" fill=\"var(--dg-panel)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"300.0\" y=\"656.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-ink)\">Water in the tubing?<\/text><text x=\"300.0\" y=\"672.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">Usually an overfilled humidifier bottle. Ask them<\/text><text x=\"300.0\" y=\"688.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">to keep water below the max line, then remove<\/text><text x=\"300.0\" y=\"704.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">the bottle and test without it<\/text><rect x=\"600\" y=\"630\" width=\"520\" height=\"92\" rx=\"5\" fill=\"var(--dg-panel)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"860.0\" y=\"656.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-ink)\">Humidifier bottles<\/text><text x=\"860.0\" y=\"672.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">When ordering one, add humidifier adapter tubing.<\/text><text x=\"860.0\" y=\"688.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">Patients should keep at least one E cylinder<\/text><text x=\"860.0\" y=\"704.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">at home for a power outage<\/text><text x=\"580.0\" y=\"760\" text-anchor=\"middle\" class=\"dg-s\">Troubleshoot only a patient who is stable and on a backup supply.<\/text><\/svg>",
"pmd-pickup": "<svg class=\"kbdg kbdg-pmd-pickup\" viewBox=\"0 0 1160 540\" xmlns=\"http://www.w3.org/2000/svg\" role=\"group\" aria-label=\"PMD pick-up decision\"><defs><marker id=\"mkm3pick\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8 z\" fill=\"var(--dg-muted)\"/><\/marker><\/defs><style>.kbdg-pmd-pickup .dg-lane{fill:var(--dg-panel)}.kbdg-pmd-pickup .dg-lane-b{fill:none;stroke:var(--dg-rule);stroke-width:1}.kbdg-pmd-pickup .dg-lbl{font:600 11px var(--ui);fill:var(--dg-muted);\n    letter-spacing:.06em;text-transform:uppercase}.kbdg-pmd-pickup .dg-box{stroke-width:1.5;rx:4}.kbdg-pmd-pickup .dg-t{font:600 12px var(--ui);fill:var(--dg-bg)}.kbdg-pmd-pickup .dg-ti{font:600 12px var(--ui);fill:var(--dg-navy)}.kbdg-pmd-pickup .dg-s{font:400 10.5px var(--ui);fill:var(--dg-muted)}.kbdg-pmd-pickup .dg-sec{font:600 10px var(--ui);fill:var(--dg-accent)}.kbdg-pmd-pickup .dg-so{font:400 10.5px var(--ui);fill:var(--dg-bg);opacity:.88}.kbdg-pmd-pickup .dg-seco{font:700 10px var(--ui);fill:var(--dg-bg);text-decoration:underline}.kbdg-pmd-pickup .dg-arr{stroke:var(--dg-muted);stroke-width:1.5;fill:none;marker-end:url(#mkm3pick)}.kbdg-pmd-pickup .dg-arr-d{stroke:var(--dg-muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;\n    marker-end:url(#mkm3pick)}.kbdg-pmd-pickup .dg-h{font:700 13px var(--ui);fill:var(--dg-navy)}<\/style><text class=\"dg-h\" x=\"580.0\" y=\"22\" text-anchor=\"middle\">Caller asks us to pick up a power chair<\/text><rect x=\"410\" y=\"40\" width=\"340\" height=\"38\" rx=\"5\" fill=\"var(--dg-navy)\" stroke=\"var(--dg-navy)\" stroke-width=\"1.4\"/><text x=\"580.0\" y=\"63.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-bg)\">Caller asks for a PMD pick-up<\/text><path class=\"dg-arr\" d=\"M580 78 L580 102\"/><rect x=\"410\" y=\"102\" width=\"340\" height=\"44\" rx=\"5\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"2\"/><text x=\"580.0\" y=\"128.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-navy)\">Why do they want it collected?<\/text><path class=\"dg-arr\" d=\"M580 146 V164 H152 V184\"/><rect x=\"20\" y=\"184\" width=\"264\" height=\"44\" rx=\"5\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"2\"/><text x=\"152.0\" y=\"202.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">Uncomfortable, or sounds<\/text><text x=\"152.0\" y=\"218.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">adjustable<\/text><path class=\"dg-arr\" d=\"M152 228 L152 252\"/><rect x=\"20\" y=\"252\" width=\"264\" height=\"72\" rx=\"5\" fill=\"var(--dg-scr-bg)\" stroke=\"var(--dg-scr-ink)\" stroke-width=\"1.4\"/><text x=\"152.0\" y=\"268.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-scr-ink)\">Transfer to Service<\/text><text x=\"152.0\" y=\"284.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-scr-ink)\">No pick-up ticket.<\/text><text x=\"152.0\" y=\"300.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-scr-ink)\">Fit problems are often<\/text><text x=\"152.0\" y=\"316.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-scr-ink)\">adjustable<\/text><path class=\"dg-arr\" d=\"M580 146 V164 H437 V184\"/><rect x=\"305\" y=\"184\" width=\"264\" height=\"44\" rx=\"5\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"2\"/><text x=\"437.0\" y=\"210.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">Technical fault<\/text><path class=\"dg-arr\" d=\"M437 228 L437 252\"/><rect x=\"305\" y=\"252\" width=\"264\" height=\"72\" rx=\"5\" fill=\"var(--dg-scr-bg)\" stroke=\"var(--dg-scr-ink)\" stroke-width=\"1.4\"/><text x=\"437.0\" y=\"284.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-scr-ink)\">Repair, not pick-up<\/text><text x=\"437.0\" y=\"300.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-scr-ink)\">No pick-up ticket<\/text><path class=\"dg-arr\" d=\"M580 146 V164 H722 V184\"/><rect x=\"590\" y=\"184\" width=\"264\" height=\"44\" rx=\"5\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"2\"/><text x=\"722.0\" y=\"210.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">Can't afford it<\/text><path class=\"dg-arr\" d=\"M722 228 L722 252\"/><rect x=\"590\" y=\"252\" width=\"264\" height=\"72\" rx=\"5\" fill=\"var(--dg-watch-bg)\" stroke=\"var(--dg-watch-ink)\" stroke-width=\"1.4\"/><text x=\"722.0\" y=\"276.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-watch-ink)\">Offer the EAA or a payment<\/text><text x=\"722.0\" y=\"292.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">plan first \u2014 <a class=\"kb-xref\" href=\"#\" data-kb-id=\"man-5-9\" data-kb-anchor=\"5.9.3\">5.9.3<\/a><\/text><text x=\"722.0\" y=\"308.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">(n/a for OOP orders)<\/text><path class=\"dg-arr\" d=\"M580 146 V164 H1007 V184\"/><rect x=\"875\" y=\"184\" width=\"264\" height=\"44\" rx=\"5\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"2\"/><text x=\"1007.0\" y=\"210.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">None of these<\/text><path class=\"dg-arr\" d=\"M1007 228 L1007 252\"/><rect x=\"875\" y=\"252\" width=\"264\" height=\"44\" rx=\"5\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"2\"/><text x=\"1007.0\" y=\"278.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-navy)\">Is it patient-owned?<\/text><path class=\"dg-arr\" d=\"M960 296 L960 340\"/><text x=\"966\" y=\"322\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">YES<\/text><rect x=\"870\" y=\"340\" width=\"180\" height=\"62\" rx=\"5\" fill=\"var(--dg-bg)\" stroke=\"var(--dg-ru ill=\"var(--dg-bg)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"1011.0\" y=\"432.0\" text-anchor=\"middle\" style=\"font:700 12.5px var(--ui);fill:var(--dg-navy)\">Received<\/text><text x=\"1011.0\" y=\"449.0\" text-anchor=\"middle\" style=\"font:500 11px var(--ui);fill:var(--dg-ink)\">in our warehouse<\/text><rect x=\"898\" y=\"478\" width=\"226\" height=\"40\" rx=\"6\" fill=\"var(--dg-bg)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"1011.0\" y=\"502.0\" text-anchor=\"middle\" style=\"font:700 12.5px var(--ui);fill:var(--dg-navy)\">Scheduling<\/text><rect x=\"898\" y=\"530\" width=\"226\" height=\"64\" rx=\"6\" fill=\"var(--dg-scr-bg)\" stroke=\"var(--dg-scr-ink)\" stroke-width=\"1.4\"/><text x=\"1011.0\" y=\"546.0\" text-anchor=\"middle\" style=\"font:700 12.5px var(--ui);fill:var(--dg-scr-ink)\">Delivered<\/text><text x=\"1011.0\" y=\"563.0\" text-anchor=\"middle\" style=\"font:500 11px var(--ui);fill:var(--dg-ink)\">patient must be home; tech will<\/text><text x=\"1011.0\" y=\"577.0\" text-anchor=\"middle\" style=\"font:500 11px var(--ui);fill:var(--dg-ink)\">educate and adjust as needed<\/text><path class=\"dg-arr\" d=\"M1011 368 L1011 380\"/><path class=\"dg-arr\" d=\"M1011 404 L1011 416\"/><path class=\"dg-arr\" d=\"M1011 466 L1011 478\"/><path class=\"dg-arr\" d=\"M1011 518 L1011 530\"/><path class=\"dg-arr\" d=\"M860 572 H874 V336 H898\"/><path d=\"M852 354 H898\" stroke=\"var(--dg-pol-ink)\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\" fill=\"none\"/><text x=\"20\" y=\"702\" text-anchor=\"start\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">TYPICAL TIME<\/text><line x1=\"20\" y1=\"720\" x2=\"566\" y2=\"720\" stroke=\"var(--dg-muted)\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><text x=\"293\" y=\"742\" text-anchor=\"middle\" style=\"font:500 11px var(--ui);fill:var(--dg-muted)\">Sales, PAK and Qualifications vary \u2014 mostly on how quickly the provider returns correct paperwork<\/text><rect x=\"590\" y=\"713\" width=\"262\" height=\"14\" rx=\"3\" fill=\"var(--dg-accent)\"/><text x=\"721\" y=\"744\" text-anchor=\"middle\" style=\"font:700 11.5px var(--ui);fill:var(--dg-navy)\">PAR: about 14 days<\/text><rect x=\"898\" y=\"713\" width=\"150\" height=\"14\" rx=\"3\" fill=\"var(--dg-accent)\"/><text x=\"973\" y=\"744\" text-anchor=\"middle\" style=\"font:700 11.5px var(--ui);fill:var(--dg-navy)\">2\u20133 weeks to warehouse<\/text><line x1=\"1054\" y1=\"720\" x2=\"1140\" y2=\"720\" stroke=\"var(--dg-muted)\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><text x=\"580.0\" y=\"778\" text-anchor=\"middle\" style=\"font:500 11px var(--ui);fill:var(--dg-muted)\">Dashed boxes happen only when the order needs them. With no PT or ATP eval, Qualifications moves straight to order verification.<\/text><\/svg>",

0\" stroke=\"var(--dg-rule)\" stroke-dasharray=\"3 4\"/><text x=\"391.5\" y=\"54\" text-anchor=\"middle\" style=\"font:600 11px var(--mono);fill:var(--dg-muted)\">Month 13<\/text><line x1=\"748.0\" y1=\"62\" x2=\"748.0\" y2=\"390\" stroke=\"var(--dg-rule)\" stroke-dasharray=\"3 4\"/><text x=\"748.0\" y=\"54\" text-anchor=\"middle\" style=\"font:600 11px var(--mono);fill:var(--dg-muted)\">Month 36<\/text><line x1=\"1120.0\" y1=\"62\" x2=\"1120.0\" y2=\"390\" stroke=\"var(--dg-rule)\" stroke-dasharray=\"0\"/><text x=\"1120.0\" y=\"54\" text-anchor=\"middle\" style=\"font:600 11px var(--mono);fill:var(--dg-muted)\">5 years<\/text><text x=\"20\" y=\"116\" style=\"font:700 13px var(--ui);fill:var(--dg-navy)\">Capped rental<\/text><text x=\"20\" y=\"132\" style=\"font:500 11px var(--ui);fill:var(--dg-muted)\">most DME<\/text><rect x=\"190.0\" y=\"96\" width=\"199.5\" height=\"46\" rx=\"4\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"1.2\"/><text x=\"290.75\" y=\"116.0\" text-anchor=\"middle\" style=\"font:700 11.5px var(--ui);fill:var(--dg-accent)\">Rented \u2014 13 months<\/text><text x=\"290.75\" y=\"130.0\" text-anchor=\"middle\" style=\"font:500 11.5px var(--ui);fill:var(--dg-accent)\">UMS owns and repairs it<\/text><rect x=\"391.5\" y=\"96\" width=\"726.5\" height=\"46\" rx=\"4\" fill=\"var(--dg-scr-bg)\" stroke=\"var(--dg-scr-ink)\" stroke-width=\"1.2\"/><text x=\"755.75\" y=\"116.0\" text-anchor=\"middle\" style=\"font:700 11.5px var(--ui);fill:var(--dg-scr-ink)\">Patient owns it<\/text><text x=\"755.75\" y=\"130.0\" text-anchor=\"middle\" style=\"font:500 11.5px var(--ui);fill:var(--dg-scr-ink)\">Medicare covers repairs, with cost-sharing<\/text><text x=\"20\" y=\"216\" style=\"font:700 13px var(--ui);fill:var(--dg-navy)\">Oxygen<\/text><text x=\"20\" y=\"232\" style=\"font:500 11px var(--ui);fill:var(--dg-muted)\">concentrators, cylinders<\/text><rect x=\"190.0\" y=\"196\" width=\"556.0\" height=\"46\" rx=\"4\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"1.2\"/><text x=\"469.0\" y=\"216.0\" text-anchor=\"middle\" style=\"font:700 11.5px var(--ui);fill:var(--dg-accent)\">Rented \u2014 36 months<\/text><text x=\"469.0\" y=\"230.0\" text-anchor=\"middle\" style=\"font:500 11.5px var(--ui);fill:var(--dg-accent)\">UMS owns and services it<\/text><rect x=\"748.0\" y=\"196\" width=\"370.0\" height=\"46\" rx=\"4\" fill=\"var(--dg-watch-bg)\" stroke=\"var(--dg-watch-ink)\" stroke-width=\"1.2\"/><text x=\"934.0\" y=\"216.0\" text-anchor=\"middle\" style=\"font:700 11.5px var(--ui);fill:var(--dg-watch-ink)\">No rental charge \u2014 UMS still owns it<\/text><text x=\"934.0\" y=\"230.0\" text-anchor=\"middle\" style=\"font:500 11.5px var(--ui);fill:var(--dg-watch-ink)\">Servicing continues; fee every 6 months<\/text><text x=\"1116.0\" y=\"260\" text-anchor=\"end\" style=\"font:500 11px var(--ui);fill:var(--dg-muted)\">After 5 years: a new 36-month rental may begin<\/text><text x=\"20\" y=\"316\" style=\"font:700 13px var(--ui);fill:var(--dg-navy)\">Continuous rental<\/text><text x=\"20\" y=\"332\" style=\"font:500 11px var(--ui);fill:var(--dg-muted)\">ventilators, E0471<\/text><rect x=\"190.0\" y=\"296\" width=\"928.0\" height=\"46\" rx=\"4\" fill=\"var(--dg-pol-bg)\" stroke=\"var(--dg-pol-ink)\" stroke-width=\"1.2\"/><text x=\"655.0\" y=\"323.0\" text-anchor=\"middle\" style=\"font:700 11.5px var(--ui);fill:var(--dg-pol-ink)\">Rented monthly for as long as it's needed \u2014 never owned<\/text><rect x=\"20\" y=\"400\" width=\"1120\" height=\"48\" rx=\"5\" fill=\"var(--dg-pol-bg)\" stroke=\"var(--dg-pol-ink)\" stroke-width=\"1.4\"/><text x=\"580.0\" y=\"420.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-pol-ink)\">The patient never owns oxygen equipment<\/text><text x=\"580.0\" y=\"436.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-pol-ink)\">Say: \"Medicare pays for the rental for 36 months. After that you keep using it at no rental charge "resupply-windows": "<svg class=\"kbdg kbdg-resupply-windows\" viewBox=\"0 0 1160 420\" xmlns=\"http://www.w3.org/2000/svg\" role=\"group\" aria-label=\"Resupply contact and shipping windows\"><defs><marker id=\"mkm11res\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8 z\" fill=\"var(--dg-muted)\"/><\/marker><\/defs><style>.kbdg-resupply-windows .dg-lane{fill:var(--dg-panel)}.kbdg-resupply-windows .dg-lane-b{fill:none;stroke:var(--dg-rule);stroke-width:1}.kbdg-resupply-windows .dg-lbl{font:600 11px var(--ui);fill:var(--dg-muted);\n    letter-spacing:.06em;text-transform:uppercase}.kbdg-resupply-windows .dg-box{stroke-width:1.5;rx:4}.kbdg-resupply-windows .dg-t{font:600 12px var(--ui);fill:var(--dg-bg)}.kbdg-resupply-windows .dg-ti{font:600 12px var(--ui);fill:var(--dg-navy)}.kbdg-resupply-windows .dg-s{font:400 10.5px var(--ui);fill:var(--dg-muted)}.kbdg-resupply-windows .dg-sec{font:600 10px var(--ui);fill:var(--dg-accent)}.kbdg-resupply-windows .dg-so{font:400 10.5px var(--ui);fill:var(--dg-bg);opacity:.88}.kbdg-resupply-windows .dg-seco{font:700 10px var(--ui);fill:var(--dg-bg);text-decoration:underline}.kbdg-resupply-windows .dg-arr{stroke:var(--dg-muted);stroke-width:1.5;fill:none;marker-end:url(#mkm11res)}.kbdg-resupply-windows .dg-arr-d{stroke:var(--dg-muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;\n    marker-end:url(#mkm11res)}.kbdg-resupply-windows .dg-h{font:700 13px var(--ui);fill:var(--dg-navy)}<\/style><text class=\"dg-h\" x=\"580.0\" y=\"22\" text-anchor=\"middle\">Resupply \u2014 why we can't send it early<\/text><rect x=\"120.0\" y=\"84\" width=\"56.470588235294116\" height=\"40\" rx=\"4\" fill=\"var(--dg-panel)\" stroke=\"var(--dg-rule)\"/><rect x=\"176.47058823529412\" y=\"84\" width=\"564.7058823529411\" height=\"40\" fill=\"var(--dg-scr-bg)\" stroke=\"var(--dg-scr-ink)\"/><text x=\"458.8235294117647\" y=\"109\" text-anchor=\"middle\" style=\"font:600 12px var(--ui);fill:var(--dg-scr-ink)\">Patient can confirm the refill<\/text><rect x=\"741.1764705882352\" y=\"84\" width=\"282.3529411764706\" height=\"40\" fill=\"var(--dg-scr-ink)\" opacity=\".88\"/><text x=\"882.3529411764705\" y=\"109\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-bg)\">Confirm and ship<\/text><line x1=\"176.47058823529412\" y1=\"70\" x2=\"176.47058823529412\" y2=\"150\" stroke=\"var(--dg-navy)\" stroke-width=\"1.5\"/><text x=\"176.47058823529412\" y=\"166\" text-anchor=\"middle\" style=\"font:700 11px var(--mono);fill:var(--dg-muted);fill:var(--dg-navy)\">30 days before<\/text><text x=\"176.47058823529412\" y=\"182\" text-anchor=\"middle\" class=\"dg-s\">contact window opens<\/text><line x1=\"741.1764705882352\" y1=\"70\" x2=\"741.1764705882352\" y2=\"150\" stroke=\"var(--dg-navy)\" stroke-width=\"1.5\"/><text x=\"741.1764705882352\" y=\"166\" text-anchor=\"middle\" style=\"font:700 11px var(--mono);fill:var(--dg-muted);fill:var(--dg-navy)\">10 days before<\/text><text x=\"741.1764705882352\" y=\"182\" text-anchor=\"middle\" class=\"dg-s\">earliest ship date<\/text><line x1=\"1023.5294117647059\" y1=\"70\" x2=\"1023.5294117647059\" y2=\"150\" stroke=\"var(--dg-navy)\" stroke-width=\"1.5\"/><text x=\"1023.5294117647059\" y=\"166\" text-anchor=\"middle\" style=\"font:700 11px var(--mono);fill:var(--dg-muted);fill:var(--dg-navy)\">Supply runs out<\/text><text x=\"1023.5294117647059\" y=\"182\" text-anchor=\"middle\" class=\"dg-s\">next supply due<\/text><text x=\"733.1764705882352\" y=\"62\" text-anchor=\"end\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">Shipping before this line makes the claim non-payable \u2192<\/text><text x=\"882.3529411764706\" y=\"62\" text-anchor=\"middle\" style=\"font:700 11px var(--mono);fill:var(--dg-muted);fill:var(--dg-scr-ink)\">SHIP DATE = DATE OF SERVICE<\/text><rect x=\"40\" y=\"206\" width=\"350\" height=\"66\" rx=\"5\" fill=\"var(--dg-pol-bg)\" stroke=\"var(--dg-pol-ink)\" stroke-width=\"1.4\"/><text x=\"215.0\" y=\"227.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-pol-ink)\">PAP has a second gate<\/text><text x=\"215.0\" y=\"243.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-pol-ink)\">Documented use and a doctor visit \u2014<\/text><text x=\"215.0\" y=\"259.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-pol-ink)\">out of compliance, no supplies \u2014 <a class=\"kb-xref\" href=\"#\" data-kb-id=\"man-3-7\" data-kb-anchor=\"3.7.4\">3.7.4<\/a><\/text><rect x=\"405\" y=\"206\" width=\"350\" height=\"66\" rx=\"5\" fill=\"var(--dg-panel)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"580.0\" y=\"227.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-ink)\">Nebulizer supplies<\/text><text x=\"580.0\" y=\"243.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">No more than a three-month quantity<\/text><text x=\"580.0\" y=\"259.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">in one shipment \u2014 <a class=\"kb-xref\" href=\"#\" data-kb-id=\"man-3-3\" data-kb-anchor=\"3.3.3\">3.3.3<\/a><\/text><rect x=\"770\" y=\"206\" width=\"350\" height=\"66\" rx=\"5\" fill=\"var(--dg-panel)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"945.0\" y=\"227.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-ink)\">Oxygen tanks are different<\/text><text x=\"945.0\" y=\"243.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">A rental accessory \u2014 once a week, two<\/text><text x=\"945.0\" y=\"259.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">business days' notice \u2014 <a class=\"kb-xref\" href=\"#\" data-kb-id=\"man-7-2\" data-kb-anchor=\"7.2.1\">7.2.1<\/a><\/text><rect x=\"40\" y=\"290\" width=\"1080\" height=\"60\" rx=\"5\" fill=\"var(--dg-panel)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"580.0\" y=\"308.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-ink)\">Say:<\/text><text x=\"580.0\" y=\"324.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">\"Insurance sets the window for when we can send the next shipment \u2014 we're not able to ship earlier than the allowed<\/text><text x=\"580.0\" y=\"340.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">timeframe before you run out, per insurance guidelines. I'll follow up with that team to make sure it goes out as soon as possible.\"<\/text><text x=\"580.0\" y=\"386\" text-anchor=\"middle\" class=\"dg-s\">Medicare's rules. Texas Medicaid bills one month's supply at a time, so eligibility is checked each month.<\/text><\/svg>",

\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">Needs to be<\/text><text x=\"1007.0\" y=\"474.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">re-opened<\/text><path class=\"dg-arr\" d=\"M1007 484 L1007 506\"/><rect x=\"875\" y=\"506\" width=\"264\" height=\"112\" rx=\"5\" fill=\"var(--dg-watch-bg)\" stroke=\"var(--dg-watch-ink)\" stroke-width=\"1.4\"/><text x=\"1007.0\" y=\"542.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-watch-ink)\">Needs review first<\/text><text x=\"1007.0\" y=\"558.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">No transfer necessary. Email<\/text><text x=\"1007.0\" y=\"574.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">the department who last worked<\/text><text x=\"1007.0\" y=\"590.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">on or closed the order<\/text><text x=\"580.0\" y=\"650\" text-anchor=\"middle\" class=\"dg-s\">Documents go out by fax or through email or Parachute/SutureSign \u2014 a provider who \"never got it\" may be looking in the wrong place.<\/text><\/svg>",
"swap-out": "<svg class=\"kbdg kbdg-swap-out\" viewBox=\"0 0 1160 420\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Equipment swap-out decision\"><defs><marker id=\"mkm8bswa\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8 z\" fill=\"var(--dg-muted)\"/><\/marker><\/defs><style>.kbdg-swap-out .dg-lane{fill:var(--dg-panel)}.kbdg-swap-out .dg-lane-b{fill:none;stroke:var(--dg-rule);stroke-width:1}.kbdg-swap-out .dg-lbl{font:600 11px var(--ui);fill:var(--dg-muted);\n    letter-spacing:.06em;text-transform:uppercase}.kbdg-swap-out .dg-box{stroke-width:1.5;rx:4}.kbdg-swap-out .dg-t{font:600 12px var(--ui);fill:var(--dg-bg)}.kbdg-swap-out .dg-ti{font:600 12px var(--ui);fill:var(--dg-navy)}.kbdg-swap-out .dg-s{font:400 10.5px var(--ui);fill:var(--dg-muted)}.kbdg-swap-out .dg-sec{font:600 10px var(--ui);fill:var(--dg-accent)}.kbdg-swap-out .dg-so{font:400 10.5px var(--ui);fill:var(--dg-bg);opacity:.88}.kbdg-swap-out .dg-seco{font:700 10px var(--ui);fill:var(--dg-bg);text-decoration:underline}.kbdg-swap-out .dg-arr{stroke:var(--dg-muted);stroke-width:1.5;fill:none;marker-end:url(#mkm8bswa)}.kbdg-swap-out .dg-arr-d{stroke:var(--dg-muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3;\n    marker-end:url(#mkm8bswa)}.kbdg-swap-out .dg-h{font:700 13px var(--ui);fill:var(--dg-navy)}<\/style><text class=\"dg-h\" x=\"580.0\" y=\"22\" text-anchor=\"middle\">Patient wants a different version of an item<\/text><rect x=\"410\" y=\"38\" width=\"340\" height=\"38\" rx=\"5\" fill=\"var(--dg-navy)\" stroke=\"var(--dg-navy)\" stroke-width=\"1.4\"/><text x=\"580.0\" y=\"61.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-bg)\">Patient asks to swap an item<\/text><path class=\"dg-arr\" d=\"M580 76 L580 100\"/><rect x=\"350\" y=\"100\" width=\"460\" height=\"52\" rx=\"5\" fill=\"var(--dg-tint)\" stroke=\"var(--dg-accent)\" stroke-width=\"2\"/><text x=\"580.0\" y=\"122.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-navy)\">Does the change need new documents from the MDO?<\/text><text x=\"580.0\" y=\"138.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-navy)\">Different or additional HCPCS code, or new MRx<\/text><path class=\"dg-arr\" d=\"M580 152 V172 H235 V192\"/><text x=\"246\" y=\"186\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">NO<\/text><path class=\"dg-arr\" d=\"M580 152 V172 H830 V192\"/><text x=\"841\" y=\"186\" style=\"font:700 11px var(--mono);fill:var(--dg-muted)\">YES<\/text><rect x=\"60\" y=\"192\" width=\"350\" height=\"62\" rx=\"5\" fill=\"var(--dg-scr-bg)\" stroke=\"var(--dg-scr-ink)\" stroke-width=\"1.4\"/><text x=\"235.0\" y=\"211.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-scr-ink)\">Transfer to Service<\/text><text x=\"235.0\" y=\"227.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-scr-ink)\">They create a swap-out service ticket.<\/text><text x=\"235.0\" y=\"243.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-scr-ink)\">Nothing else needed<\/text><rect x=\"610\" y=\"192\" width=\"440\" height=\"54\" rx=\"5\" fill=\"var(--dg-bg)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"830.0\" y=\"215.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-ink)\">1. Create a pick-up ticket<\/text><text x=\"830.0\" y=\"231.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">for the item they already have<\/text><path class=\"dg-arr\" d=\"M830 246 L830 258\"/><rect x=\"610\" y=\"258\" width=\"440\" height=\"54\" rx=\"5\" fill=\"var(--dg-bg)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"830.0\" y=\"281.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-ink)\">2. Note on the ticket<\/text><text x=\"830.0\" y=\"297.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">coordinate the pick-up with the new delivery<\/text><path class=\"dg-arr\" d=\"M830 312 L830 324\"/><rect x=\"610\" y=\"324\" width=\"440\" height=\"54\" rx=\"5\" fill=\"var(--dg-bg)\" stroke=\"var(--dg-rule)\" stroke-width=\"1.4\"/><text x=\"830.0\" y=\"347.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-ink)\">3. Email the intake department<\/text><text x=\"830.0\" y=\"363.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-ink)\">so they request documents and open the order<\/text><rect x=\"60\" y=\"330\" width=\"350\" height=\"64\" rx=\"5\" fill=\"var(--dg-watch-bg)\" stroke=\"var(--dg-watch-ink)\" stroke-width=\"1.4\"/><text x=\"235.0\" y=\"350.0\" text-anchor=\"middle\" style=\"font:700 12px var(--ui);fill:var(--dg-watch-ink)\">The email starts the new order<\/text><text x=\"235.0\" y=\"366.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">Without it, the patient's equipment is<\/text><text x=\"235.0\" y=\"382.0\" text-anchor=\"middle\" style=\"font:500 12px var(--ui);fill:var(--dg-watch-ink)\">collected and nothing replaces it<\/text><\/svg>",
