<style>
  /* ── Reference / Knowledge Base tool ─────────────────────────────────── */
  .kb-wrap { display: grid; grid-template-columns: 280px 1fr; gap: 16px; height: calc(100vh - 150px); min-height: 420px; }
  .kb-side { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 12px; overflow: hidden; }
  .kb-side input#kb-search { padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--paper); color: var(--ink); }
  #kb-tree { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .kb-add { align-self: flex-start; font: inherit; font-size: .8rem; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--accent-soft); color: var(--success-deep); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  .kb-dept { margin-bottom: 6px; }

  .kb-item { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; font: inherit; font-size: .86rem; padding: 7px 9px; border: none; border-radius: 7px; background: none; color: var(--ink); cursor: pointer; }
  .kb-item:hover { background: var(--paper-2); }
  .kb-item.on { background: var(--accent-soft); color: var(--success-deep); }
  .kb-item .kb-snip { font-size: .74rem; color: var(--muted); }
  /* #4 — review-due row: the kb-item button + a small Mark-reviewed action. */
  .kb-reviewdue-row { display: flex; align-items: center; gap: 2px; }
  .kb-reviewdue-row .kb-item { flex: 1; min-width: 0; }
  .kb-review-btn { flex-shrink: 0; appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--paper-card); color: var(--success-deep, var(--accent)); border-radius: 7px; padding: 5px 7px; display: inline-flex; align-items: center; transition: background var(--t) var(--ease), border-color var(--t) var(--ease); }
  .kb-review-btn:hover { background: var(--paper-2); border-color: var(--border-strong); }
  .kb-review-btn svg { width: 13px; height: 13px; }
  .kb-main { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 18px 22px; overflow-y: auto; display: flex; flex-direction: column; }
  .kb-empty, .kb-loading { color: var(--muted); font-size: .9rem; margin: auto; text-align: center; }
  .kb-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 14px; }
  .kb-item-head h2 { margin: 0; font-size: 1.15rem; }
  .kb-item-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
  .kb-btn { font: inherit; font-size: .76rem; padding: 4px 9px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-card); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .kb-btn:hover { background: var(--paper-2); }
  .kb-btn.danger { color: var(--danger); border-color: var(--destructive-soft); }
  .kb-embed { flex: 1; width: 100%; min-height: 60vh; border: 1px solid var(--line); border-radius: 8px; }
  /* rendered markdown - Console document register: display-font headings,
     mono uppercase kickers for table headers, hairline row separators (the
     app has no bordered grids anywhere - tables match the ledger/punch-row
     vocabulary), accent-soft blockquote callouts. */
  .kb-article { line-height: 1.65; font-size: .95rem; max-width: 760px; color: var(--ink); }
  .kb-article h1, .kb-article h2, .kb-article h3, .kb-article h4, .kb-article h5, .kb-article h6 {
    font-family: var(--display); line-height: 1.25; letter-spacing: -.01em; margin: 1.3em 0 .45em; }
  .kb-article h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em; }
  .kb-article h2 { font-size: 1.2rem; font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .kb-article h3 { font-size: 1.05rem; font-weight: 600; }
  .kb-article h4 { font-size: .98rem; font-weight: 600; }
  .kb-article > h1:first-child, .kb-article > h2:first-child, .kb-article > h3:first-child { margin-top: .2em; }
  .kb-article p { margin: .6em 0; }
  .kb-article ul, .kb-article ol { margin: .5em 0; padding-left: 1.5em; }
  .kb-article li { margin: .25em 0; }
  .kb-article a { color: var(--accent); text-underline-offset: 2px; }
  .kb-article code { background: var(--paper-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono, monospace); font-size: .88em; }
  .kb-article pre { background: var(--paper-2); padding: 12px 14px; border-radius: var(--radius); overflow-x: auto; }
  .kb-article pre code { background: none; padding: 0; }
  .kb-article blockquote { border-left: 3px solid var(--accent); background: var(--accent-soft); margin: .8em 0; padding: 8px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
  .kb-article hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .kb-article table { border-collapse: collapse; margin: 1em 0; display: block; max-width: 100%; overflow-x: auto; }
  .kb-article th { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 16px 6px 0; border-bottom: 1px solid var(--border-strong); }
  .kb-article td { padding: 8px 16px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .kb-article tbody tr:last-child td { border-bottom: none; }
  .kb-article img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: block; margin: .9em 0; }
  .kb-article a.kb-img-lnk { display: inline-block; max-width: 100%; }
  /* §4 — collapsible department headers (chevron + count) */
  .kb-dept-toggle { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; font: inherit; background: none; border: none; cursor: pointer; padding: 8px 6px 4px; }
  .kb-dept-toggle:hover .kb-dept-name { color: var(--ink); }
  .kb-dept-name { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .kb-dept-count { margin-left: auto; font-family: var(--mono); font-size: .66rem; color: var(--muted-3); }
  .kb-chevron { display: inline-flex; color: var(--muted-3); transition: transform .2s var(--ease); }
  /* §8 — animate the department collapse via the body's max-height + chevron rotate */

  .kb-dept.collapsed .kb-dept-body { max-height: 0; }
  .kb-dept.collapsed .kb-chevron { transform: rotate(-90deg); }

  /* §4 — landing panel (right side when nothing is selected) */
  .kb-land { max-width: 760px; }
  .kb-land-sec { margin-bottom: 22px; }
  .kb-land-h { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .kb-land-h .kb-land-sub { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted-3); }
  .kb-land-pill { font-family: var(--mono); font-size: 10px; font-weight: 700; background: var(--warn-soft); color: var(--warning-deep); border-radius: 999px; padding: 1px 7px; }
  .kb-land-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; background: none; border: none; border-bottom: 1px solid var(--line); padding: 9px 2px; cursor: pointer; color: var(--ink); }
  .kb-land-row:last-child { border-bottom: none; }
  .kb-land-row:hover { background: var(--paper-2); }
  .kb-land-ic { color: var(--muted); display: inline-flex; flex-shrink: 0; }
  .kb-land-t { font-size: .9rem; font-weight: 600; }
  .kb-land-meta { margin-left: auto; font-size: .76rem; color: var(--muted); white-space: nowrap; }
  .kb-land-none { font-size: .84rem; color: var(--muted); font-style: italic; padding: 4px 2px; }
  .kb-land-rd { cursor: default; }
  .kb-land-rd:hover { background: none; }
  .kb-land-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
  .kb-land-rd-open { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: none; text-align: left; font: inherit; cursor: pointer; color: var(--ink); padding: 0; }
  .kb-land-rd-open:hover .kb-land-t { color: var(--accent); }

  /* editor modal */
  .kb-ed { width: min(720px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .kb-ed .body { overflow: auto; padding: 4px 2px; }
  .kb-ed .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .kb-ed label { font-size: .76rem; font-weight: 600; color: var(--muted); }
  .kb-ed input, .kb-ed textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; }
  .kb-ed textarea { min-height: 200px; font-family: var(--mono, monospace); font-size: .85rem; resize: vertical; }
  .kb-typetog { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .kb-typetog button { background: var(--paper-2); border: none; padding: 6px 14px; cursor: pointer; font: inherit; color: var(--muted); }
  .kb-typetog button.on { background: var(--accent); color: #fff; }
  .kb-ed-prev { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--paper); margin-top: 6px; max-height: 240px; overflow: auto; }
  .kb-ed-foot { display: flex; gap: 10px; justify-content: flex-end; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 8px; }
  :root[data-compact] .kb-wrap { grid-template-columns: 1fr; height: auto; }
  /* - KB slide-over drawer (shell capability) - sits ABOVE the overlay layer
     (z 50) so it stays readable + usable while the email composer or other

     paint over it. */
  #kb-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 92vw); background: var(--paper-card); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); z-index: 55; display: flex; flex-direction: column; transform: translateX(102%); transition: transform .22s var(--ease); }
  #kb-drawer.open { transform: translateX(0); }
  .kbd-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .kbd-kicker { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); flex: 1; }
  .kbd-x { background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 6px; display: inline-flex; }
  .kbd-x:hover { background: var(--paper-2); color: var(--ink); }
  .kbd-search { padding: 10px 14px 0; flex-shrink: 0; }
  .kbd-search input { width: 100%; box-sizing: border-box; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--paper); color: var(--ink); }
  .kbd-body { overflow-y: auto; flex: 1; padding: 10px 14px 16px; }
  .kbd-sec { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 12px 0 4px; display: flex; align-items: center; gap: 8px; }
  .kbd-sec .kbd-tgl { margin-left: auto; font-family: var(--ui); font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .kbd-item { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; font: inherit; font-size: .86rem; padding: 7px 9px; border: none; border-radius: 7px; background: none; color: var(--ink); cursor: pointer; }
  .kbd-item:hover { background: var(--paper-2); }
  .kbd-item .kb-snip { font-size: .74rem; color: var(--muted); }
  .kbd-empty { color: var(--muted); font-size: .84rem; padding: 6px 0; }
  .kbd-back { font: inherit; font-size: .8rem; border: 1px solid var(--line); border-radius: 7px; background: var(--paper-2); color: var(--ink); cursor: pointer; padding: 4px 10px; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 10px; }
  .kbd-embed-card { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 14px; margin-top: 8px; }
  .kbd-guid-card { border: 1px solid var(--accent-soft); border-radius: 10px; background: var(--paper); padding: 10px 12px; font-size: .84rem; line-height: 1.5; color: var(--ink); margin-bottom: 4px; }
  #kb-drawer-tab { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 44; writing-mode: vertical-rl; font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); background: var(--paper-card); border: 1px solid var(--line); border-right: none; border-radius: 8px 0 0 8px; padding: 10px 4px; cursor: pointer; display: none; }
  #kb-drawer-tab:hover { color: var(--ink); background: var(--paper-2); }
  #kb-drawer-tab.show { display: block; }
  :root[data-compact] #kb-drawer-tab { display: none !important; }
  /* — section-aware search: compiled chunk view + section nav rows — */
  .kb-item-sec { padding-left: 26px; font-size: .8rem; color: var(--muted); }
  .kb-item-sec:hover { color: var(--ink); }
  .kb-chunk-doc { margin-bottom: 14px; }
  .kb-chunk-doc-h { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; font: inherit; font-size: .9rem; font-weight: 600; padding: 6px 2px; border: none; background: none; color: var(--ink); cursor: pointer; }
  .kb-chunk-doc-h:hover .kb-chunk-doc-t { color: var(--accent); }
  .kb-chunk-doc-h .kb-snip { font-weight: 400; margin-left: auto; }
  .kb-chunk { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 4px 14px 10px; margin: 6px 0; }
  .kb-chunk-h { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 0 2px; }
  .kb-chunk-go { margin-left: auto; font: inherit; font-size: .72rem; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-2); color: var(--muted); cursor: pointer; padding: 2px 8px; }
  .kb-chunk-go:hover { color: var(--ink); background: var(--paper-card); }
  .kb-chunk-body { font-size: .9rem; }
  .kb-h-flash { background: var(--accent-soft); border-radius: 4px; transition: background 1.2s ease; }
  /* Operator feedback (2026-06-12): search-term highlight in result chunks
     (drawer + Reference compiled view). */
  mark.kb-hl { background: var(--selection-bg); color: inherit; border-radius: 3px; padding: 0 1px; }
  /* Operator feedback (2026-06-12 r2): Docs-style link hover card — shows
     the destination + Copy link / Open. Singleton, fixed, above the drawer. */
  #kb-linkcard {
    position: fixed; z-index: 60; display: none;
    max-width: 340px; background: var(--paper-card);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg);
    padding: 8px 10px; font-size: .8rem;
  }
  #kb-linkcard.show { display: block; }
  #kb-linkcard .lc-url { color: var(--muted); word-break: break-all; font-family: var(--mono); font-size: 10.5px; margin-bottom: 6px; }
  #kb-linkcard .lc-row { display: flex; gap: 6px; }
  #kb-linkcard .lc-btn { font: inherit; font-size: .74rem; padding: 3px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper-2); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  #kb-linkcard .lc-btn:hover { background: var(--paper); border-color: var(--border-strong); }
  /* drawer auto-search in-flight indicator */
  .kbd-search { position: relative; }
  .kbd-spin {
    position: absolute; right: 24px; top: 50%; margin-top: 1px;
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    display: none; transform: translateY(-50%);
  }
  .kbd-spin.on { display: block; animation: kbdSpin .7s linear infinite; }
  @keyframes kbdSpin { to { transform: translateY(-50%) rotate(360deg); } }
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  REFERENCE / KNOWLEDGE BASE — client (Phase 1).
//  Per-department tree + full-text search + reader. Articles are markdown
//  (stored as source server-side, rendered here via kbMd_, which escapes HTML
//  first so authored content can't inject script). Embeds render the Drive
//  preview iframe. Managers get inline add/edit/delete.
// ════════════════════════════════════════════════════════════════════════════
var KB_STATE = { tree: [], isManager: false, isAdmin: false, currentId: null, landing: false, usage: null, reviewDue: null };
var KB_EDIT = null;

// Compact markdown → HTML. Escapes HTML up front (so raw tags/script in the
// source are inert), then applies a safe subset: headings, bold/italic, inline
// + fenced code, links (http(s)/mailto only), images (http(s) only), GFM
// tables, ul/ol, blockquote, hr, paragraphs.
// Anchor slug for heading ids - MUST stay identical to the server kbSlug_
// in Code.js (searchReference computes the anchors that kbMd_'s ids must
// match). The entity de-escape makes the two agree even though kbMd_ slugs
// ESCAPED source while the server slugs raw markdown. Node parity test.
function kbSlug_(text) {
  return String(text || '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function kbMd_(src) {
  src = String(src == null ? '' : src).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  var blocks = [];
  var hSeen = {};   // duplicate-heading id dedup - same -2/-3 walk as kbSplitSections_
  src = src.replace(/```([\s\S]*?)```/g, function (_, code) { blocks.push(code); return '␀C' + (blocks.length - 1) + '␀'; });
  function inline(t) {
    // Images BEFORE links (otherwise the link rule renders the [alt](url)
    // part as an anchor with a stray "!"). http(s) only - no mailto for an
    // img src. Quotes are percent-encoded in the URL and entity-escaped in
    // the alt: the top-level escape covers &/</> but NOT quotes, so either
    // attribute could otherwise be broken out of (same guard as link href).
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, url) {
      if (!/^https?:/i.test(url)) return alt;
      url = url.replace(/"/g, '%22').replace(/'/g, '%27');
      alt = alt.replace(/"/g, '&quot;');
      return '<a href="' + url + '" target="_blank" rel="noopener" class="kb-img-lnk">' +
        '<img src="' + url + '" alt="' + alt + '" loading="lazy"></a>';
    });
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, txt, url) {
      if (!/^(https?:|mailto:)/i.test(url)) return txt;
      // The top-level escape covers &, <, > but NOT quotes — a `"` in the URL
      // would otherwise break out of the href attribute (attribute injection,
      // e.g. an onmouseover handler). Percent-encode both quote characters.
      url = url.replace(/"/g, '%22').replace(/'/g, '%27');
      return '<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>';
    });
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    return t;
  }
  // Split a GFM table row into cells. \| escapes a literal pipe inside a
  // cell (the Doc converter emits that); \u0001 can't appear in the escaped
  // source, so it's a safe sentinel.
  function tableCells(row) {
    row = row.replace(/\\\|/g, '\u0001').trim().replace(/^\|/, '').replace(/\|$/, '');
    return row.split('|').map(function (c) { return c.replace(/\u0001/g, '|').trim(); });
  }
  var lines = src.split(/\r?\n/), html = '', i = 0;
  while (i < lines.length) {
    var ln = lines[i];
    var cm = ln.trim().match(/^␀C(\d+)␀$/);
    if (cm) { html += '<pre><code>' + blocks[+cm[1]] + '</code></pre>'; i++; continue; }
    if (/^\s*$/.test(ln)) { i++; continue; }
    var h = ln.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      var lvl = h[1].length;
      var hid = kbSlug_(h[2]);
      if (hid) { hSeen[hid] = (hSeen[hid] || 0) + 1; if (hSeen[hid] > 1) hid += '-' + hSeen[hid]; }
      html += '<h' + lvl + (hid ? ' id="kb-h-' + hid + '"' : '') + '>' + inline(h[2]) + '</h' + lvl + '>';
      i++; continue;
    }
    // GFM table: a |-prefixed header line followed by a |---|:---:| separator
    // line (dashes/colons/pipes/spaces only, at least one dash). Body rows
    // clamp to the header's column count.
    if (/^\s*\|/.test(ln) && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && /-/.test(lines[i + 1])) {
      var headCells = tableCells(ln);
      var aligns = tableCells(lines[i + 1]).map(function (sep) {
        var al = /^:/.test(sep), ar = /:$/.test(sep);
        return al && ar ? 'center' : (ar ? 'right' : (al ? 'left' : ''));
      });
      var tbl = '<table><thead><tr>';
      headCells.forEach(function (c, ci) {
        tbl += '<th' + (aligns[ci] ? ' style="text-align:' + aligns[ci] + '"' : '') + '>' + inline(c) + '</th>';
      });
      tbl += '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        var cells = tableCells(lines[i]);
        tbl += '<tr>';
        for (var ci2 = 0; ci2 < headCells.length; ci2++) {
          tbl += '<td' + (aligns[ci2] ? ' style="text-align:' + aligns[ci2] + '"' : '') + '>' +
            inline(cells[ci2] == null ? '' : cells[ci2]) + '</td>';
        }
        tbl += '</tr>';
        i++;
      }
      tbl += '</tbody></table>';
      html += tbl;
      continue;
    }
    if (/^\s*[-*]\s+/.test(ln)) { html += '<ul>'; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { html += '<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'; i++; } html += '</ul>'; continue; }
    if (/^\s*\d+\.\s+/.test(ln)) { html += '<ol>'; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { html += '<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'; i++; } html += '</ol>'; continue; }
    if (/^\s*>\s?/.test(ln)) { html += '<blockquote>'; while (i < lines.length && /^\s*>\s?/.test(lines[i])) { html += inline(lines[i].replace(/^\s*>\s?/, '')) + ' '; i++; } html += '</blockquote>'; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(ln)) { html += '<hr>'; i++; continue; }
    var para = ln; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s/.test(lines[i]) && !/^\s*>/.test(lines[i]) && !/^\s*\|/.test(lines[i]) && !/^␀C\d+␀$/.test(lines[i].trim())) { para += ' ' + lines[i]; i++; }
    html += '<p>' + inline(para) + '</p>';
  }
  return html;
}

/** Landing panel (right side, nothing selected): Recently viewed (localStorage

function kbRenderLanding_() {
  var main = document.getElementById('kb-main'); if (!main) return;
  var prefs = kbPanelPrefs_();

  var treeById = {};

    });
  } else {
    h += '<div class="kb-land-none">Items you open will show up here.</div>';
  }
  h += '</div>';

    h += '<div class="kb-land-sec"><div class="kb-land-h">Most used <span class="kb-land-sub">· 30d</span></div>';
    if (usage.length) {
      usage.forEach(function (u) {
        var it = treeById[u.id];
        h += '<button class="kb-land-row" data-kb-id="' + esc(u.id) + '" onclick="kbOpenItem_(this.getAttribute(\'data-kb-id\'))">' +
          '<span class="kb-land-ic">' + icon(it ? kbItemIcon_(it) : 'fileText', 15) + '</span>' +
          '<span class="kb-land-t">' + esc(u.title) + '</span>' +
          '<span class="kb-land-meta">' + u.count + ' open' + (u.count === 1 ? '' : 's') +
            (u.drawerCount ? ' · ' + u.drawerCount + ' in-call' : '') + '</span></button>';
      });
    } else {
      h += '<div class="kb-land-none">No opens recorded in the last 30 days yet.</div>';
    }
    h += '</div>';
  }

  // Review due (manager-only)
  if (KB_STATE.isManager) {
    var rd = (KB_STATE.reviewDue && KB_STATE.reviewDue.items) || [];
    if (rd.length) {
      h += '<div class="kb-land-sec"><div class="kb-land-h">Review due <span class="kb-land-pill">' + rd.length + '</span>' +
        '<span class="kb-land-sub">· ' + esc(String((KB_STATE.reviewDue && KB_STATE.reviewDue.dueDays) || 90)) + 'd+</span></div>';
      rd.forEach(function (it) {
        var age = (it.ageDays == null) ? 'never reviewed'
          : (it.basedOnUpdate ? ('edited ' + it.ageDays + 'd ago') : ('reviewed ' + it.ageDays + 'd ago'));
        h += '<div class="kb-land-row kb-land-rd">' +
          '<span class="kb-land-dot" title="Review due"></span>' +
          '<button class="kb-land-rd-open" data-kb-id="' + esc(it.id) + '" onclick="kbOpenItem_(this.getAttribute(\'data-kb-id\'))">' +
            '<span class="kb-land-t">' + esc(it.title) + '</span>' +
            '<span class="kb-land-meta">' + esc(age) + (it.views ? ' · ' + it.views + ' view' + (it.views === 1 ? '' : 's') : '') + '</span>' +
          '</button>' +
          '<button class="kb-btn" data-kb-id="' + esc(it.id) + '" title="Mark reviewed (resets the staleness clock without editing)" ' +
            'onclick="kbMarkReviewedClick_(this.getAttribute(\'data-kb-id\'))">' + icon('check', 13) + ' Reviewed</button>' +
        '</div>';
      });
      h += '</div>';
    }
  }

  h += '</div>';
  main.innerHTML = h;

// Group section-level results by doc (insertion order = best-score-first).
function kbGroupResults_(results) {
  var groups = [], byId = {};
  (results || []).forEach(function (r) {
    if (!byId[r.id]) { byId[r.id] = { id: r.id, title: r.title, department: r.department, type: r.type, chunks: [] }; groups.push(byId[r.id]); }
    if (r.chunkMd || r.heading) byId[r.id].chunks.push(r);
  });
  return groups;
}

// The compiled view: every matching section rendered inline, grouped by doc.
// `openFn` is the click handler name ('kbOpenItem_' in the tab,
// 'kbDrawerOpenItem_' in the drawer) - both accept (id, anchor) and jump to
// the section in the full article. chunkMd renders through kbMd_ (escape-
// first, same safety boundary as the article reader).
// Operator feedback (2026-06-12) — highlight the query terms inside the
// rendered result chunks. Token regex is the pure, Node-pinned part; the
// wrapper walks TEXT NODES of already-rendered (kbMd_-escaped) DOM and
// wraps matches in <mark> — never string-level HTML surgery, so it cannot
// re-open the escaping boundary.
// Operator feedback (2026-06-12 r2) — Docs-style hover card on links inside
// rendered KB content (Reference article/chunks + the drawer). Shows the
// destination URL with Copy link / Open actions. Delegated document-level
// mouseover bound ONCE; only fires for links inside .kb-article, .kb-chunk-body
// or the drawer body, so it can't affect the rest of the app.
var KB_LINKCARD = { el: null, hideTimer: null, href: '' };
function kbLinkCardEl_() {
  if (KB_LINKCARD.el) return KB_LINKCARD.el;
  var el = document.createElement('div');
  el.id = 'kb-linkcard';
  document.body.appendChild(el);
  el.addEventListener('mouseenter', function () { clearTimeout(KB_LINKCARD.hideTimer); });
  el.addEventListener('mouseleave', function () { kbLinkCardHide_(); });
  KB_LINKCARD.el = el;
  return el;
}
function kbLinkCardShow_(a) {
  var href = a.getAttribute('href') || '';
  if (!/^https?:|^mailto:/i.test(href)) return;
  var el = kbLinkCardEl_();
  clearTimeout(KB_LINKCARD.hideTimer);
  KB_LINKCARD.href = href;
  var shown = href.length > 110 ? href.substring(0, 107) + '…' : href;
  el.innerHTML =
    '<div class="lc-url"></div>' +
    '<div class="lc-row">' +
      '<button type="button" class="lc-btn" data-lc-copy>Copy link</button>' +
      '<a class="lc-btn" target="_blank" rel="noopener noreferrer">Open ↗</a>' +
    '</div>';
  el.querySelector('.lc-url').textContent = shown;           // textContent — no injection surface
  el.querySelector('a.lc-btn').setAttribute('href', href);
  el.querySelector('[data-lc-copy]').addEventListener('click', function () {
    var done = function () { this.textContent = 'Copied ✓'; }.bind(this);
    try {
      navigator.clipboard.writeText(href).then(done, function () { kbLinkCardCopyFallback_(href); done(); });
    } catch (_) { kbLinkCardCopyFallback_(href); done(); }
  });
  var r = a.getBoundingClientRect();
  el.classList.add('show');
  var w = el.offsetWidth, h = el.offsetHeight;
  var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
  var top = r.bottom + 6 + h > window.innerHeight ? r.top - h - 6 : r.bottom + 6;
  el.style.left = left + 'px';
  el.style.top = Math.max(8, top) + 'px';
}
function kbLinkCardHide_() {
  KB_LINKCARD.hideTimer = setTimeout(function () {
    if (KB_LINKCARD.el) KB_LINKCARD.el.classList.remove('show');
  }, 180);
}
function kbLinkCardCopyFallback_(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (_) {}
}
(function kbBindLinkCard_() {
  document.addEventListener('mouseover', function (e) {
    var a = e.target.closest && e.target.closest('.kb-article a, .kb-chunk-body a, #kbd-body a');
    if (a && !a.closest('#kb-linkcard') && !a.classList.contains('kb-img-lnk') && !a.classList.contains('lc-btn')) {
      kbLinkCardShow_(a);
    } else if (!e.target.closest || !e.target.closest('#kb-linkcard')) {
      if (KB_LINKCARD.el && KB_LINKCARD.el.classList.contains('show')) kbLinkCardHide_();
    }
  });
})();

function kbHlRegex_(q) {
  var toks = String(q || '').toLowerCase().split(/\s+/)
    .map(function (t) { return t.trim(); })
    .filter(function (t) { return t.length >= 2; });
  if (!toks.length) return null;
  var escd = toks.map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
  return new RegExp('(' + escd.join('|') + ')', 'gi');
}
function kbHighlightTerms_(rootEl, query) {
  try {
    var re = kbHlRegex_(query);
    if (!re || !rootEl) return;
    var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
    var targets = [];
    var n;
    while ((n = walker.nextNode())) {
      var p = n.parentElement;
      if (!p || p.closest('mark, button, a.kb-btn, code, pre')) continue;
      re.lastIndex = 0;
      if (re.test(n.nodeValue)) targets.push(n);
    }
    targets.forEach(function (textNode) {
      var s = textNode.nodeValue;
      var frag = document.createDocumentFragment();
      var last = 0, m;
      re.lastIndex = 0;
      while ((m = re.exec(s))) {
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        var mk = document.createElement('mark');
        mk.className = 'kb-hl';
        mk.textContent = m[0];
        frag.appendChild(mk);
        last = m.index + m[0].length;
      }
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      textNode.parentNode.replaceChild(frag, textNode);
    });
  } catch (_) {}
}

function kbChunkGroupsHtml_(results, openFn) {
  var html = '';
  kbGroupResults_(results).forEach(function (g) {
    html += '<div class="kb-chunk-doc">' +
      '<button class="kb-chunk-doc-h" onclick="' + openFn + '(this.getAttribute(\'data-kb-id\'))" data-kb-id="' + esc(g.id) + '">' +
      icon(kbItemIcon_(g), 13) + ' <span class="kb-chunk-doc-t">' + esc(g.title) + '</span>' +
      '<span class="kb-snip">' + esc(g.department) + (g.type === 'embed' ? ' \u00b7 Drive' : '') + '</span></button>';
    g.chunks.forEach(function (c) {
      html += '<div class="kb-chunk">' +
        '<div class="kb-chunk-h"><span>' + (c.heading ? esc(c.heading) : 'Intro') + '</span>' +
        '<button class="kb-chunk-go" data-kb-id="' + esc(c.id) + '" data-kb-anchor="' + esc(c.anchor || '') + '" ' +
        'onclick="' + openFn + '(this.getAttribute(\'data-kb-id\'), this.getAttribute(\'data-kb-anchor\'))">Open \u00b6</button></div>' +
        (c.chunkMd ? '<div class="kb-article kb-chunk-body">' + kbMd_(c.chunkMd) +
          (c.truncated ? '<div class="kb-snip">\u2026 continues in the article</div>' : '') + '</div>' : '') +
        '</div>';
    });
    html += '</div>';
  });
  return html;
}

/** Scroll the opened article to a section anchor (slug charset [a-z0-9-],
 *  query-safe) and flash the heading so the eye lands on it. */
function kbScrollToAnchor_(host, anchor) {
  if (!host || !anchor) return;
  try {
    var el = host.querySelector('#kb-h-' + anchor);
    if (!el) return;
    el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    el.classList.add('kb-h-flash');
    setTimeout(function () { el.classList.remove('kb-h-flash'); }, 1600);
  } catch (e) {}
}

function kbDoSearch_(q) {
  q = String(q || '').trim();
  if (q.length < 2) { kbRenderTree_(); if (!KB_STATE.currentId) { KB_STATE.landing = true; kbRenderLanding_(); } return; }
  var el = document.getElementById('kb-tree'); if (!el) return;
  var requested = currentView;
  // L13 — sequence counter (the drawer's kbDrawerSearch_ pattern): two
  // overlapping searches over 300–800ms RPCs can resolve out of order, and
  // the stale response would render last under the newer query.
  var seq = (KB_STATE.searchSeq = (KB_STATE.searchSeq || 0) + 1);
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      if (seq !== KB_STATE.searchSeq) return;   // a newer search superseded this one
      var results = (res && res.results) || [];
      var groups = kbGroupResults_(results);
      // Tree column: compact doc + section nav (clicks jump into the article)
      var html = kbAddBtnHtml_() + '<div class="kb-dept-h">Search · ' + esc(q) + ' (' + groups.length + ')</div>';
      if (!results.length) html += '<div class="kb-empty">No matches.</div>';
      groups.forEach(function (g) {
        html += '<button class="kb-item" data-kb-id="' + esc(g.id) + '" onclick="kbOpenItem_(this.getAttribute(\'data-kb-id\'))"><span>' + esc(g.title) + '</span></button>';
        g.chunks.forEach(function (c) {
          html += '<button class="kb-item kb-item-sec" data-kb-id="' + esc(c.id) + '" data-kb-anchor="' + esc(c.anchor || '') + '" ' +
            'onclick="kbOpenItem_(this.getAttribute(\'data-kb-id\'), this.getAttribute(\'data-kb-anchor\'))"><span>' +
            (c.heading ? esc(c.heading) : 'Intro') + '</span></button>';
        });
      });
      el.innerHTML = html;
      // Main panel: the compiled view — every matching section, readable in
      // one scroll without opening any doc.
      var main = document.getElementById('kb-main');
      if (main) {
        KB_STATE.currentId = null; KB_STATE.landing = false;
        main.innerHTML = '<div class="kb-item-head"><h2>Results for "' + esc(q) + '"</h2></div>' +
          (results.length ? kbChunkGroupsHtml_(results, 'kbOpenItem_') : '<div class="kb-empty">No matches.</div>');
        kbHighlightTerms_(main, q);
      }
    })
    .withFailureHandler(function () {})
    .searchReference(q);
}

function kbOpenItem_(id, anchor) {
  KB_STATE.currentId = id; KB_STATE.landing = false;
  document.querySelectorAll('.kb-item').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-kb-id') === id); });
  var main = document.getElementById('kb-main'); if (!main) return;
  main.innerHTML = loSweep();
  var requested = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      if (!res || res.error) { main.innerHTML = '<div class="kb-empty">' + esc((res && res.error) || 'Failed') + '</div>'; return; }
      kbPanelRecordOpen_(res, 'reference');
      kbRenderItem_(res);
      if (anchor) kbScrollToAnchor_(document.getElementById('kb-main'), anchor);
    })
    .withFailureHandler(function (err) { if (currentView === requested) main.innerHTML = '<div class="kb-empty">' + esc(err.message || err) + '</div>'; })
    .getReferenceItem(id);
}

function kbRenderItem_(item) {
  var main = document.getElementById('kb-main'); if (!main) return;
  var mgr = KB_STATE.isAdmin;   // Convert/Edit/Delete are admin-gated authoring
  // Phase 2 — managers can convert a Doc embed into a native markdown article
  // (review-before-save: the converter only pre-fills the editor).
  var convertBtn = (mgr && item.type === 'embed' && item.driveKind === 'doc')
    ? '<button class="kb-btn" onclick="kbConvertItem_(\'' + esc(item.id) + '\')">' + icon('refresh', 13) + ' Convert to article</button>'
    : '';
  var actions =
    (item.type === 'embed' ? '<a class="kb-btn" href="' + esc(item.openUrl) + '" target="_blank" rel="noopener">' + icon('popOut', 13) + ' Open in new tab</a>' : '') +
    convertBtn +
    (mgr ? '<button class="kb-btn" onclick="kbOpenEditor_(\'' + esc(item.id) + '\')">' + icon('adjust', 13) + ' Edit</button>' +
           '<button class="kb-btn danger" onclick="kbDeleteItem_(\'' + esc(item.id) + '\')">' + icon('trash', 13) + ' Delete</button>' : '');
  var head = '<div class="kb-item-head"><h2>' + esc(item.title) + '</h2><div class="kb-item-actions">' + actions + '</div></div>';
  if (item.type === 'embed') {
    main.innerHTML = head + '<iframe class="kb-embed" src="' + esc(item.embedUrl) + '"></iframe>';
  } else {
    main.innerHTML = head + '<div class="kb-article">' + kbMd_(item.bodyMd || '') + '</div>';
  }
}

function kbDeleteItem_(id) {
  uiConfirm({ title: 'Delete this item?', message: 'This removes it from the Reference library for everyone. (If it\'s an embedded Drive doc, the Drive file itself is not deleted.)', confirmLabel: 'Delete', tone: 'danger' })
    .then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) { showToast((res && res.error) || 'Delete failed', 'toast-error'); return; }
          showToast('Deleted', 'toast-success');
          KB_STATE.currentId = null; KB_STATE.landing = true;
          kbRenderLanding_();
          kbReloadTree_();
        })
        .withFailureHandler(function (err) { showToast((err && err.message) || 'Delete failed', 'toast-error'); })
        .kbDeleteItem(id);
    });
}

// ── Phase 2: Doc → article converter ───────────────────────────────────────
// Both entry points end in the SAME place: the existing editor, pre-filled
// with the converted markdown + live preview. Nothing is saved until the
// manager presses Save (kbSaveItem updates the row in place, flipping
// type embed → article); the Drive file itself is never modified.

/** Reader-view entry: convert an existing doc-embed KB item. */
function kbConvertItem_(id) {
  uiConfirm({
    title: 'Convert Doc to article',
    message: 'Convert this embedded Google Doc into a native markdown article?\n\nYou\'ll review the result in the editor first — nothing changes until you press Save, and the Drive file itself is never modified. Images and tables don\'t fully convert (placeholders / flattened lists).',
    confirmLabel: 'Convert',
  }).then(function (ok) {
    if (!ok) return;
    showToast('Converting…', '');
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.error || !res.success) {
          showToast((res && res.error) || 'Convert failed', 'toast-error');
          return;
        }
        KB_EDIT = {
          id: id,
          department: res.department || '',
          title: res.title || res.docTitle || '',
          type: 'article',
          body: res.markdown || '',
          driveUrl: '',
        };

        kbShowConvertWarnings_(res.warnings);
      })
      .withFailureHandler(function (err) {
        showToast((err && err.message) || 'Convert failed', 'toast-error');
      })
      .kbConvertDriveDoc({ itemId: id });
  });
}

/** Editor entry: convert the Doc URL currently typed in embed mode, switching
 *  the open editor to article mode with the converted body. */
function kbConvertFromEditor_() {
  kbSnapshotEditor_();

  showToast('Converting…', '');

    .withSuccessHandler(function (res) {

      // KB_EDIT.id: re-typing + Save would overwrite the existing row with

function kbRenderEditorBody_() {
  var host = document.getElementById('kb-ed-body'); if (!host) return;

      '<div style="font-size:.72rem;color:var(--muted);margin-top:4px;">Google Docs only — pulls the Doc\'s text in as editable markdown (you review before saving; the Doc isn\'t changed).</div>';
  } else {
    host.innerHTML = '<div class="field"><label>Body (markdown)</label>' +
      '<textarea id="kb-ed-bodymd" placeholder="# Heading&#10;&#10;**bold**, *italic*, `code`, [links](https://…)&#10;- bullet lists&#10;1. numbered&#10;> quote">' + esc(KB_EDIT.body) + '</textarea></div>' +
      '<div style="font-size:.72rem;color:var(--muted);margin:-6px 0 6px;">Paste a screenshot directly into the body to upload it. The KB is PHI-free by policy — scrub patient data first.</div>' +
      '<div style="font-size:.76rem;color:var(--muted);margin-bottom:4px;">Live preview:</div><div class="kb-ed-prev kb-article" id="kb-ed-prev"></div>';
    var ta = document.getElementById('kb-ed-bodymd'), prev = document.getElementById('kb-ed-prev');
    var upd = function () { prev.innerHTML = kbMd_(ta.value); };
    upd(); ta.addEventListener('input', upd);
    // Phase 3 — paste-a-screenshot upload. The listener is ELEMENT-scoped
    // (this textarea), so it dies with the modal — structurally immune to the
    // document-level leak class the Intake modal had (M7). Non-image pastes
    // fall through to the browser default.
    ta.addEventListener('paste', function (e) {
      var items = (e.clipboardData || {}).items || [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image/') === 0) {
          e.preventDefault();
          kbPasteUploadImage_(ta, items[i].getAsFile(), upd);
          return;
        }
      }
    });
  }
}

// Phase 3 — upload a pasted screenshot via kbUploadImage and insert the
// returned markdown. A UNIQUE placeholder token goes in at the cursor first
// and is string-replaced when the upload resolves, so typing (or a type-
// switch re-render) during the round trip can't misplace the final markdown:
// the replacement targets the token wherever it now lives — the live
// textarea, or the KB_EDIT snapshot if the body was re-rendered/snapshotted.
var KB_PASTE_SEQ = 0;
function kbPasteUploadImage_(ta, file, refreshPreview) {
  if (!file) return;
  var token = '![uploading-' + (++KB_PASTE_SEQ) + '…](kbpaste:pending)';
  var start = (typeof ta.selectionStart === 'number') ? ta.selectionStart : ta.value.length;
  var end = (typeof ta.selectionEnd === 'number') ? ta.selectionEnd : start;
  ta.value = ta.value.substring(0, start) + token + ta.value.substring(end);
  ta.selectionStart = ta.selectionEnd = start + token.length;
  try { refreshPreview(); } catch (_) {}
  var done = function (replacement) {
    var el = document.getElementById('kb-ed-bodymd');
    if (el && el.value.indexOf(token) >= 0) {
      el.value = el.value.replace(token, replacement);
      el.dispatchEvent(new Event('input'));   // refresh the live preview
    } else if (KB_EDIT && typeof KB_EDIT.body === 'string' && KB_EDIT.body.indexOf(token) >= 0) {
      KB_EDIT.body = KB_EDIT.body.replace(token, replacement);
    }
  };
  var reader = new FileReader();
  reader.onload = function (ev) {
    var dataUrl = String((ev.target || {}).result || '');
    if (dataUrl.length > 4 * 1024 * 1024) {   // mirrors KB_IMG_UPLOAD_MAX_CHARS
      done('');
      showToast('Image too large (max ~3MB) — crop or downscale, then paste again.', 'toast-warn');
      return;
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          done('');
          showToast((res && res.error) || 'Image upload failed', 'toast-error');
          return;
        }
        done('![Screenshot](' + res.url + ')');
        showToast('Image uploaded', 'toast-success');
      })
      .withFailureHandler(function (err) {
        done('');
        showToast('Image upload failed: ' + ((err && err.message) || 'server error'), 'toast-error');
      })
      .kbUploadImage(dataUrl);
  };
  reader.readAsDataURL(file);
}

function kbSaveFromEditor_(btn) {
  kbSnapshotEditor_();
  var e = KB_EDIT;
  if (!String(e.title).trim()) { showToast('Title is required.', 'toast-warn'); return; }
  if (e.type === 'embed' && !String(e.driveUrl).trim()) { showToast('Paste a Drive share URL.', 'toast-warn'); return; }
  if (e.type !== 'embed' && !String(e.body).trim()) { showToast('Add some article text.', 'toast-warn'); return; }
  // L13 — dedupe: double-clicking Save on a NEW item fired two kbSaveItem
  // calls and created duplicate rows (the server lock serializes inserts but
  // can't dedupe them). Disable for the round trip; re-enable on failure.
  if (btn && btn.disabled) return;
  if (btn) btn.disabled = true;
  var reenable = function () { if (btn) btn.disabled = false; };
  google.script.run
    .withSuccessHandler(function (res) {
      reenable();
      if (!res || !res.success) { showToast((res && res.error) || 'Save failed', 'toast-error'); return; }
      // Phase 2b — converter image tokens export to Drive during save;
      // surface the count + any per-image degradations.
      showToast(res.imagesExported ? ('Saved · ' + res.imagesExported + ' image(s) exported to Drive') : 'Saved', 'toast-success');
      (res.imageWarnings || []).forEach(function (w) { showToast(w, 'toast-warn'); });
      var savedId = res.id;
      kbCloseModal_();
      kbReloadTree_();
      if (savedId) kbOpenItem_(savedId);
    })
    .withFailureHandler(function (err) { reenable(); showToast((err && err.message) || 'Save failed', 'toast-error'); })
    .kbSaveItem({ id: e.id, department: e.department, title: e.title, type: e.type, body: e.body, driveUrl: e.driveUrl });
}

function kbCloseModal_() {
  var ov = document.getElementById('kb-ed-overlay');
  if (ov) ov.remove();
}

// ============================================================================
//  KB SLIDE-OVER DRAWER - shell capability: searchable Reference panel that
//  can open over ANY tool (built for the Call Notes hot path). Mounted on
//  document.body so Call Notes' optimistic #view-area re-renders can't wipe
//  it mid-read; closed on every showView navigation (core calls
//  kbDrawerOnNavigate_). Toggled by Ctrl/Cmd+K (bound in script_core) or the
//  right-edge tab (visible on Call Notes / Intake views only). Articles
//  render inline via kbMd_ (.kb-article styles shared); embeds get an
//  open-in-new-tab card - the drawer is for fast native articles.
//  Reads reuse the three enrolled-employee KB endpoints; opens are recorded
//  best-effort via kbRecordView (fire-and-forget, never blocks the UI).
// ============================================================================
var KB_DRAWER = { open: false, tree: null, view: 'home', lastQuery: '', searchSeq: 0, item: null, suggestSeq: 0, suggestCache: null, guidanceSeq: 0, guidanceCache: null };
var KB_PANEL_LS_KEY = 'umsKbPanel';

function kbPanelPrefs_() {
  try {
    var o = JSON.parse(localStorage.getItem(KB_PANEL_LS_KEY) || '{}');
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  } catch (e) { return {}; }
}
function kbPanelSave_(p) { try { localStorage.setItem(KB_PANEL_LS_KEY, JSON.stringify(p)); } catch (e) {} }

// PURE: prepend an item to a recents list, dedupe by id, cap length (5).
function kbRecentsPush_(list, item, cap) {
  cap = cap || 5;
  var out = [{ id: String(item.id), title: String(item.title || '') }];
  (list || []).forEach(function (r) {
    if (out.length >= cap || !r) return;
    if (String(r.id) === String(item.id)) return;
    out.push({ id: String(r.id), title: String(r.title || '') });
  });
  return out;
}

// PURE: score KB tree items against free text (the rep's in-progress Issue
// field). Tokens are 4+ char words; an item scores 1 per distinct token its
// title contains. Top `cap` scorers, best first. Deliberately title-only and
// client-side: zero extra RPCs, and the note text never leaves the browser.
function kbSuggestMatches_(tree, text, cap) {
  cap = cap || 3;
  var raw = String(text || '').toLowerCase().match(/[a-z0-9]{4,}/g) || [];
  if (!raw.length) return [];
  var seen = {};
  var tokens = [];
  raw.forEach(function (t) { if (!seen[t]) { seen[t] = true; tokens.push(t); } });
  var scored = [];
  (tree || []).forEach(function (it) {
    var title = String(it.title || '').toLowerCase();
    var score = 0;
    tokens.forEach(function (t) { if (title.indexOf(t) >= 0) score++; });
    if (score > 0) scored.push({ item: it, score: score });
  });
  scored.sort(function (a, b) { return b.score - a.score; });
  return scored.slice(0, cap).map(function (s) { return s.item; });
}

function kbDrawerMount_() {
  if (document.getElementById('kb-drawer')) return;
  var d = document.createElement('div');
  d.id = 'kb-drawer';
  d.innerHTML =
    '<div class="kbd-head">' + icon('list', 14) +

    '<div class="kbd-search"><input type="text" id="kbd-q" placeholder="Search reference\u2026 (Ctrl/\u2318+K)" autocomplete="off"><span class="kbd-spin" id="kbd-spin"></span></div>' +
    '<div class="kbd-body" id="kbd-body"></div>';
  document.body.appendChild(d);
  var tab = document.createElement('button');
  tab.id = 'kb-drawer-tab';
  tab.textContent = 'Reference';
  tab.onclick = function () { kbDrawerOpen_(); };
  document.body.appendChild(tab);
  var q = d.querySelector('#kbd-q');
  var t;
  q.addEventListener('input', function () {

/** Core Esc handler hook: returns true when it consumed the keypress. */

/** Core showView hook: close on any navigation; edge tab only on the

function kbDrawerRenderHome_() {

// ── AI guidance card (Phase A) ──────────────────────────────────────────────
// Fires kbGetFacetGuidance with ONLY enum facets gathered from the
// in-progress note (multi-select flags, established tags, the rep's last
// composer department) — never any typed text. The server re-validates every
// facet against its own vocabularies (INV-119), so this gather is a
// convenience, not the privacy boundary. Best-effort: any none / failure
// renders nothing and the existing Suggested block stands alone.
function kbAiGatherFacets_() {
  var facets = { department: '', updateType: '', flagType: '', tags: [] };
  try { facets.department = localStorage.getItem('umsCallNotesLastDept') || ''; } catch (e) {}
  try {
    if (typeof cnGetFormFlags_ === 'function' && typeof currentView !== 'undefined' &&
        (typeof VIEW_TO_TOOL !== 'undefined' && VIEW_TO_TOOL[currentView]) === 'callNotes') {
      var form = document.getElementById('cn-active-form');
      if (form) {
        var flags = cnGetFormFlags_(form) || [];
        facets.flagType = flags[0] || '';
        facets.tags = (typeof cnGetFormTags_ === 'function' && cnGetFormTags_(form)) || [];
      }
    }
  } catch (e) {}
  return facets;
}

function kbDrawerRenderGuidance_() {
  var host = document.getElementById('kbd-guidance'); if (!host) return;
  if (typeof flagOn_ !== 'function' || !flagOn_('kbAiGuidance')) { host.innerHTML = ''; return; }
  var facets = kbAiGatherFacets_();
  if (!facets.flagType && !(facets.tags && facets.tags.length)) { host.innerHTML = ''; return; }
  var key = JSON.stringify([facets.department, facets.flagType, (facets.tags || []).slice().sort()]);
  var cached = KB_DRAWER.guidanceCache;
  if (cached && cached.key === key) { kbDrawerPaintGuidance_(host, cached.res); return; }
  var seq = ++KB_DRAWER.guidanceSeq;
  google.script.run
    .withSuccessHandler(function (res) {
      if (seq !== KB_DRAWER.guidanceSeq || !KB_DRAWER.open || KB_DRAWER.view !== 'home') return;
      KB_DRAWER.guidanceCache = { key: key, res: res };
      var h = document.getElementById('kbd-guidance');
      if (h) kbDrawerPaintGuidance_(h, res);
    })
    .withFailureHandler(function () {})   // silent — suggestions still render
    .kbGetFacetGuidance(facets);
}

function kbDrawerPaintGuidance_(host, res) {
  if (!res || res.none || res.error || !res.guidance) { host.innerHTML = ''; return; }
  var prefs = kbPanelPrefs_();
  // C1 — derive "today" in the rep's roster tz (F6 discipline), not UTC. UTC
  // toISOString rolls at UTC midnight (5:30am IST), which would re-expand the
  // collapsed guidance card mid-morning for offshore reps instead of holding
  // it for their whole local day.
  var today = (typeof isoDateTz === 'function' && typeof empTz === 'function')
    ? isoDateTz(empTz()) : new Date().toISOString().substring(0, 10);
  var seen = prefs.aiSeen || {};
  var collapsed = res.facetHash && seen.hash === res.facetHash && seen.date === today;
  var html = '<div class="kbd-sec">Guidance <span class="kb-snip" style="text-transform:none;letter-spacing:0">AI · from your reference docs</span></div>';
  if (collapsed) {
    html += '<button class="kbd-item" onclick="kbDrawerExpandGuidance_()"><span>' +
      icon('chevronDown', 12) + ' Show guidance for this call type</span></button>';
    host.innerHTML = html;
    return;
  }
  html += '<div class="kbd-guid-card">' + esc(res.guidance) + '</div>';
  (res.sources || []).forEach(function (s) {
    html += '<button class="kbd-item" data-kb-id="' + esc(s.id) + '" data-kb-anchor="' + esc(s.anchor || '') + '" ' +
      'onclick="kbDrawerOpenItem_(this.getAttribute(\'data-kb-id\'), this.getAttribute(\'data-kb-anchor\'))">' +
      '<span>' + icon('list', 12) + ' ' + esc(s.title) +
      (s.heading ? ' <span class="kb-snip">¶ ' + esc(s.heading) + '</span>' : '') + '</span></button>';
  });
  host.innerHTML = html;
  // Collapse-after-seen: the same facet combo renders collapsed for the rest
  // of the day so the card doesn't repeat itself on every drawer open.
  try { prefs.aiSeen = { hash: res.facetHash, date: today }; kbPanelSave_(prefs); } catch (e) {}
}

function kbDrawerExpandGuidance_() {
  var prefs = kbPanelPrefs_();
  delete prefs.aiSeen;
  kbPanelSave_(prefs);
  kbDrawerRenderGuidance_();
}

/** "Suggested" block: matches the in-progress Call Notes Issue text against
 *  cached KB titles. Lives only inside the drawer (unobtrusive) and behind a
 *  per-rep toggle persisted to umsKbPanel.suggest (default ON). */
function kbDrawerSuggestRowHtml_(r) {
  return '<button class="kbd-item" data-kb-id="' + esc(r.id) + '" data-kb-anchor="' + esc(r.anchor || '') + '" ' +
    'onclick="kbDrawerOpenItem_(this.getAttribute(\'data-kb-id\'), this.getAttribute(\'data-kb-anchor\'))">' +
    '<span>' + icon(kbItemIcon_(r), 12) + ' ' + esc(r.title) +
    (r.heading ? ' <span class="kb-snip">\u00b6 ' + esc(r.heading) + '</span>' : '') + '</span>' +
    (r.snippet ? '<span class="kb-snip">' + esc(r.snippet) + '</span>' : '') + '</button>';
}

/** Suggestions match the in-progress Issue text against the FULL knowledge
 *  base via the server section search (same enrolled-employee, read-only
 *  endpoint the search box uses — the text goes to OUR server only, the same
 *  trust boundary the note itself is saved to; it never reaches any third
 *  party). Title matches from the cached tree render instantly while the
 *  content search runs; the server results replace them when they arrive.
 *  Cached per issue-text so re-renders don't refetch. */
function kbDrawerRenderSuggest_() {
  var host = document.getElementById('kbd-suggest'); if (!host) return;
  var prefs = kbPanelPrefs_();
  var on = prefs.suggest !== false;
  var issue = '';
  try {
    if (typeof cnGetFieldValue_ === 'function' && typeof currentView !== 'undefined' &&
        (typeof VIEW_TO_TOOL !== 'undefined' && VIEW_TO_TOOL[currentView]) === 'callNotes') {
      issue = (cnGetFieldValue_('cn-fld-issue') || '').trim();
    }
  } catch (e) {}
  var tglHtml = '<label class="kbd-tgl"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="kbDrawerSuggestToggle_(this.checked)"> suggest</label>';
  if (!issue) { host.innerHTML = on ? '' : '<div class="kbd-sec">Suggested' + tglHtml + '</div><div class="kbd-empty">Suggestions are off.</div>'; return; }
  var html = '<div class="kbd-sec">Suggested ' + tglHtml + '</div>';
  if (!on) { host.innerHTML = html + '<div class="kbd-empty">Suggestions are off.</div>'; return; }
  var cache = KB_DRAWER.suggestCache;
  if (cache && cache.text === issue) {
    if (!cache.results.length) html += '<div class="kbd-empty">No matches for this issue yet.</div>';
    else cache.results.forEach(function (r) { html += kbDrawerSuggestRowHtml_(r); });
    host.innerHTML = html;
    return;
  }
  // Instant first paint from cached titles; the content search replaces it.
  var matches = kbSuggestMatches_(KB_DRAWER.tree, issue, 3);
  matches.forEach(function (it) { html += kbDrawerItemBtnHtml_(it, ''); });
  html += '<div class="kbd-empty">Searching article content\u2026</div>';
  host.innerHTML = html;
  kbDrawerFetchSuggest_(issue);
}

function kbDrawerFetchSuggest_(issue) {
  var seq = ++KB_DRAWER.suggestSeq;
  google.script.run
    .withSuccessHandler(function (res) {
      if (seq !== KB_DRAWER.suggestSeq || !KB_DRAWER.open || KB_DRAWER.view !== 'home') return;
      var results = ((res && res.results) || []).slice(0, 3);
      KB_DRAWER.suggestCache = { text: issue, results: results };
      kbDrawerRenderSuggest_();
    })
    .withFailureHandler(function () {})   // keep the title matches on failure
    .searchReference(issue.substring(0, 250));
}
function kbDrawerSuggestToggle_(on) {
  var prefs = kbPanelPrefs_();
  prefs.suggest = !!on;
  kbPanelSave_(prefs);
  kbDrawerRenderSuggest_();
}

function kbDrawerSetSearching_(on) {
  var sp = document.getElementById('kbd-spin');
  if (sp) sp.classList.toggle('on', !!on);
}
function kbDrawerSearch_(q) {
  q = String(q || '').trim();
  KB_DRAWER.lastQuery = q;
  if (q.length < 2) { kbDrawerSetSearching_(false); kbDrawerRenderHome_(); return; }
  var body = document.getElementById('kbd-body'); if (!body) return;
  var seq = ++KB_DRAWER.searchSeq;
  kbDrawerSetSearching_(true);   // operator feedback (2026-06-12 r2): show the in-flight auto-search
  google.script.run
    .withSuccessHandler(function (res) {
      if (seq !== KB_DRAWER.searchSeq || !KB_DRAWER.open) return;
      kbDrawerSetSearching_(false);
      KB_DRAWER.view = 'results';
      var results = (res && res.results) || [];
      var groups = kbGroupResults_(results);
      var html = '<div class="kbd-sec">Results (' + groups.length + ')</div>';
      if (!results.length) html += '<div class="kbd-empty">No matches.</div>';
      else html += kbChunkGroupsHtml_(results, 'kbDrawerOpenItem_');
      body.innerHTML = html;
      kbHighlightTerms_(body, q);
    })
    .withFailureHandler(function () { if (seq === KB_DRAWER.searchSeq) kbDrawerSetSearching_(false); })
    .searchReference(q);
}

function kbDrawerOpenItem_(id, anchor) {
  var body = document.getElementById('kbd-body'); if (!body) return;
  body.innerHTML = loSweep();
  KB_DRAWER.view = 'item';
  google.script.run
    .withSuccessHandler(function (res) {
      if (!KB_DRAWER.open || KB_DRAWER.view !== 'item') return;
      if (!res || res.error) { body.innerHTML = '<div class="kbd-empty">' + esc((res && res.error) || 'Failed to load') + '</div>'; return; }
      kbPanelRecordOpen_(res);
      var back = '<button class="kbd-back" onclick="kbDrawerBack_()">' + icon('chevronLeft', 12) + ' Back</button>';
      if (res.type === 'embed') {
        // Drive embeds are cramped in a 400px drawer - hand off to a tab.
        body.innerHTML = back +
          '<div class="kbd-embed-card"><strong>' + esc(res.title) + '</strong>' +
          '<div class="kbd-empty" style="padding:6px 0 10px;">This item is an embedded Drive doc - it opens in its own tab.</div>' +
          '<a class="kb-btn" href="' + esc(res.openUrl) + '" target="_blank" rel="noopener">' + icon('popOut', 13) + ' Open in new tab</a></div>';
      } else {
        body.innerHTML = back + '<div class="kb-article">' + kbMd_(res.bodyMd || '') + '</div>';
        if (anchor) kbScrollToAnchor_(body, anchor);
      }
    })
    .withFailureHandler(function (err) {
      if (KB_DRAWER.open) body.innerHTML = '<div class="kbd-empty">' + esc((err && err.message) || 'Failed to load') + '</div>';
    })
    .getReferenceItem(id);
}
function kbDrawerBack_() {
  if (KB_DRAWER.lastQuery && KB_DRAWER.lastQuery.length >= 2) kbDrawerSearch_(KB_DRAWER.lastQuery);
  else kbDrawerRenderHome_();
}

/** Records an open: recents (localStorage) + best-effort server usage row
 *  (fire-and-forget - a failure never surfaces). Context tells the manager
 *  usage panel whether the open happened mid-call (drawer) or in the
 *  Reference tab. */
function kbPanelRecordOpen_(item, context) {
  try {
    var prefs = kbPanelPrefs_();
    prefs.recents = kbRecentsPush_(prefs.recents || [], item, 5);
    kbPanelSave_(prefs);
  } catch (e) {}
  kbRecordViewFireAndForget_(item.id,
    context || ('drawer:' + (typeof currentView !== 'undefined' ? currentView : '')));
}
/** Manager-only: top "most referenced (30d)" items → cached in KB_STATE and
 *  rendered into the landing panel's "Most used" block. Best-effort — any error
 *  leaves the block empty. The in-call count tells the manager which guides
 *  reps actually lean on mid-call (the conversion priority signal). */
function kbLoadUsageBlock_() {
  var requested = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      KB_STATE.usage = (res && !res.error) ? res : { items: [] };
      if (KB_STATE.landing) kbRenderLanding_();
    })
    .withFailureHandler(function () {})
    .kbGetUsageStats();
}

/** #4 — manager-only "Review due" → cached in KB_STATE and rendered into the
 *  landing panel's "Review due" block (items whose last review/edit is older
 *  than the threshold, most-used first). Best-effort. */
function kbLoadReviewDueBlock_() {
  var requested = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      KB_STATE.reviewDue = (res && !res.error) ? res : { items: [] };
      if (KB_STATE.landing) kbRenderLanding_();
    })
    .withFailureHandler(function () {})
    .kbGetReviewDue();
}

function kbMarkReviewedClick_(id) {
  if (!id) return;
  google.script.run
    .withSuccessHandler(function (r) {
      if (r && r.success) { if (typeof showToast === 'function') showToast('Marked reviewed', 'success'); kbLoadReviewDueBlock_(); }
      else if (typeof showToast === 'function') showToast((r && r.error) || 'Could not mark reviewed', 'error');
    })
    .withFailureHandler(function (e) { if (typeof showToast === 'function') showToast((e && e.message) || 'Could not mark reviewed', 'error'); })
    .kbMarkReviewed(id);
}

function kbRecordViewFireAndForget_(itemId, context) {
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .kbRecordView(itemId, context);
  } catch (e) {}
}

</script>
