<style>
  /* ── Reference / Knowledge Base tool ─────────────────────────────────── */
  /* V-9 (cycle-12 visual audit): `height: calc(100vh - 150px)` on the WRAP was
     a FIXED height, so on the LANDING (recents / most-used / review-due — short
     by nature) both panels stretched to the full viewport, leaving ~535px of
     empty card below the content, which reads as a half-failed load.
     The cap moves to the grid ITEMS: each column is at most viewport-tall and
     keeps its own internal overflow-y:auto (the reader model — a long article
     must scroll INSIDE the panel, not grow the page), while a short landing
     sizes to its content. `align-items: start` stops the shorter column
     stretching to match the taller — the cycle-11 V-8 precedent on `.m-layout`.
     NOTE the cap MUST sit on the items, not the container: `max-height` on a
     grid container does not constrain its row, so the panel overflows it and
     the whole page scrolls instead (measured while fixing this). */
  .kb-wrap { display: grid; grid-template-columns: 280px 1fr; gap: 16px;
    align-items: start; min-height: 420px; }
  .kb-wrap > * { min-height: 0; max-height: calc(100vh - 150px); }
  .kb-side { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 12px; overflow: hidden; }
  .kb-side input#kb-search { padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--paper); color: var(--ink); }
  #kb-tree { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .kb-add { align-self: flex-start; font: inherit; font-size: .8rem; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--accent-soft); color: var(--success-deep); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  .kb-dept { margin-bottom: 6px; }
  .kb-dept-h { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 6px 4px; }
  .kb-item { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; font: inherit; font-size: .86rem; padding: 7px 9px; border: none; border-radius: 7px; background: none; color: var(--ink); cursor: pointer; }
  .kb-item:hover { background: var(--paper-2); }
  /* Tree rows: .kb-item is a COLUMN flex (search/review-due rows stack sub-lines),
     so the tree render wraps icon+title+pill in one line span — without it the
     icon stacks above the title and the draft pill stretches full width. */
  .kb-item-line { display: flex; align-items: flex-start; gap: 6px; }
  .kb-item-line > svg { flex-shrink: 0; margin-top: 2px; }
  .kb-item-line .kb-draft-pill { flex-shrink: 0; align-self: center; margin-left: 0; }
  .kb-item.on { background: var(--accent-soft); color: var(--success-deep); }
  .kb-item .kb-snip { font-size: .74rem; color: var(--muted); }
  /* #4 — review-due row: the kb-item button + a small Mark-reviewed action. */
  .kb-reviewdue-row { display: flex; align-items: center; gap: 2px; }
  .kb-reviewdue-row .kb-item { flex: 1; min-width: 0; }
  .kb-review-btn { flex-shrink: 0; appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--paper-card); color: var(--success-deep, var(--accent)); border-radius: 7px; padding: 5px 7px; display: inline-flex; align-items: center; transition: background var(--t) var(--ease), border-color var(--t) var(--ease); }
  .kb-review-btn:hover { background: var(--paper-2); border-color: var(--border-strong); }
  .kb-review-btn svg { width: 13px; height: 13px; }
  .kb-main { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 18px 22px; overflow-y: auto; display: flex; flex-direction: column; }
  .kb-empty, .kb-loading { color: var(--muted); font-size: .9rem; margin: auto; text-align: center; }
  .kb-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 14px; }
  .kb-item-head h2 { margin: 0; font-size: 1.15rem; }
  .kb-item-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
  .kb-btn { font: inherit; font-size: .76rem; padding: 4px 9px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-card); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .kb-btn:hover { background: var(--paper-2); }
  .kb-btn.danger { color: var(--danger); border-color: var(--destructive-soft); }
  .kb-embed { flex: 1; width: 100%; min-height: 60vh; border: 1px solid var(--line); border-radius: 8px; }
  /* rendered markdown - Console document register: display-font headings,
     mono uppercase kickers for table headers, hairline row separators (the
     app has no bordered grids anywhere - tables match the ledger/punch-row
     vocabulary), accent-soft blockquote callouts. */
  .kb-article { line-height: 1.65; font-size: .95rem; max-width: 760px; color: var(--ink); }
  .kb-article h1, .kb-article h2, .kb-article h3, .kb-article h4, .kb-article h5, .kb-article h6 {
    font-family: var(--display); line-height: 1.25; letter-spacing: -.01em; margin: 1.3em 0 .45em; }
  .kb-article h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em; }
  .kb-article h2 { font-size: 1.2rem; font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .kb-article h3 { font-size: 1.05rem; font-weight: 600; }
  .kb-article h4 { font-size: .98rem; font-weight: 600; }
  .kb-article > h1:first-child, .kb-article > h2:first-child, .kb-article > h3:first-child { margin-top: .2em; }
  .kb-article p { margin: .6em 0; }
  .kb-article ul, .kb-article ol { margin: .5em 0; padding-left: 1.5em; }
  .kb-article li { margin: .25em 0; }
  .kb-article a { color: var(--accent); text-underline-offset: 2px; }
  .kb-article code { background: var(--paper-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono, monospace); font-size: .88em; }
  .kb-article pre { background: var(--paper-2); padding: 12px 14px; border-radius: var(--radius); overflow-x: auto; }
  .kb-article pre code { background: none; padding: 0; }
  .kb-article blockquote { border-left: 3px solid var(--accent); background: var(--accent-soft); margin: .8em 0; padding: 8px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
  .kb-article hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .kb-article table { border-collapse: collapse; margin: 1em 0; display: block; max-width: 100%; overflow-x: auto; }
  .kb-article th { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 16px 6px 0; border-bottom: 1px solid var(--border-strong); }
  .kb-article td { padding: 8px 16px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .kb-article tbody tr:last-child td { border-bottom: none; }
  .kb-article img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: block; margin: .9em 0; }
  .kb-article a.kb-img-lnk { display: inline-block; max-width: 100%; }
  /* §4 — collapsible department headers (chevron + count) */
  .kb-dept-toggle { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; font: inherit; background: none; border: none; cursor: pointer; padding: 8px 6px 4px; }
  .kb-dept-toggle:hover .kb-dept-name { color: var(--ink); }
  .kb-dept-name { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .kb-dept-count { margin-left: auto; font-family: var(--mono); font-size: .66rem; color: var(--muted-2); }
  .kb-chevron { display: inline-flex; color: var(--muted-3); transition: transform .2s var(--ease); }
  /* §8 — animate the department collapse via the body's max-height + chevron rotate */
  .kb-dept-body { overflow: hidden; max-height: 2000px; transition: max-height .26s var(--ease); }
  .kb-dept.collapsed .kb-dept-body { max-height: 0; }
  .kb-dept.collapsed .kb-chevron { transform: rotate(-90deg); }

  /* §4 — landing panel (right side when nothing is selected) */
  .kb-land { max-width: 760px; }
  .kb-land-sec { margin-bottom: 22px; }
  .kb-land-h { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .kb-land-h .kb-land-sub { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted-2); }
  .kb-land-pill { font-family: var(--mono); font-size: 10px; font-weight: 700; background: var(--warn-soft); color: var(--warning-deep); border-radius: 999px; padding: 1px 7px; }
  .kb-land-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; background: none; border: none; border-bottom: 1px solid var(--line); padding: 9px 2px; cursor: pointer; color: var(--ink); }
  .kb-land-row:last-child { border-bottom: none; }
  .kb-land-row:hover { background: var(--paper-2); }
  .kb-land-ic { color: var(--muted); display: inline-flex; flex-shrink: 0; }
  .kb-land-t { font-size: .9rem; font-weight: 600; }
  .kb-land-meta { margin-left: auto; font-size: .76rem; color: var(--muted); white-space: nowrap; }
  .kb-land-none { font-size: .84rem; color: var(--muted); font-style: italic; padding: 4px 2px; }
  .kb-land-rd { cursor: default; }
  .kb-land-rd:hover { background: none; }
  .kb-land-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
  .kb-land-rd-open { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: none; text-align: left; font: inherit; cursor: pointer; color: var(--ink); padding: 0; }
  .kb-land-rd-open:hover .kb-land-t { color: var(--accent); }
  /* #2 — stale-flag marker (rep "out of date") sits red vs the neutral age dot. */
  .kb-land-dot.stale { background: var(--danger); }
  .kb-land-flag { font-family: var(--mono); font-size: 10px; font-weight: 700; background: var(--destructive-soft, var(--warn-soft)); color: var(--danger); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
  /* C17 batch-4: the note is a flex CHILD of the .kb-land-rd-open row, so its
     display:block never gave it its own line — at 390px the quote overlapped
     the Reviewed button (screenshot-verified in the cycle-17 scan). Wrap the
     row and give the note the full width the block display always intended. */
  .kb-land-rd-open { flex-wrap: wrap; }
  .kb-land-note { display: block; flex-basis: 100%; font-size: .78rem; color: var(--muted); font-style: italic; margin-top: 2px; }
  /* #1 — content-request row: two actions (resolve / dismiss). */
  .kb-land-req { align-items: flex-start; cursor: default; }
  .kb-land-req:hover { background: none; }
  .kb-land-req-body { flex: 1; min-width: 0; }
  .kb-land-req-acts { display: flex; gap: 4px; flex-shrink: 0; }

  /* #2 — article/embed freshness feedback bar (below the reader content). */
  .kb-feedback { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .kb-feedback .kb-fb-q { font-size: .82rem; color: var(--muted); }
  .kb-fb-btns { display: flex; gap: 6px; align-items: center; }
  .kb-fb-done { font-size: .82rem; color: var(--success-deep); }
  /* #2 — helpful/not-helpful tally on manager landing rows. */
  .kb-fb-tally { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; color: var(--muted); flex-shrink: 0; }
  .kb-fb-tally .kb-fb-sep { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; }
  .kb-fb-tally svg { width: 11px; height: 11px; }
  /* Phase A (pilot round 3 #6) — per-article comment thread (tab reader only). */
  .kb-comments { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .kb-cmt-h { margin: 0 0 10px; font-size: .88rem; display: flex; align-items: center; gap: 6px; }
  .kb-cmt { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .kb-cmt-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .kb-cmt-name { font-size: .8rem; font-weight: 600; }
  .kb-cmt-you { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .04em; background: var(--accent-soft); color: var(--success-deep); padding: 1px 6px; border-radius: var(--radius-pill); }
  .kb-cmt-when { font-family: var(--mono); font-size: 10px; color: var(--muted-2); }
  .kb-cmt-del { margin-left: auto; appearance: none; background: none; border: 0; padding: 2px; cursor: pointer; color: var(--muted-2); border-radius: var(--radius); }
  .kb-cmt-del:hover { color: var(--danger-deep); background: var(--destructive-soft); }
  .kb-cmt-text { font-size: .86rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .kb-cmt-none { font-size: .82rem; color: var(--muted-2); padding: 6px 0; }
  .kb-cmt-cap { font-size: 10px; color: var(--muted-2); padding: 4px 0; }
  .kb-cmt-add { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .kb-cmt-lbl { font-size: .78rem; color: var(--muted); }
  .kb-cmt-add textarea { font: inherit; font-size: .86rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-card); color: var(--ink); resize: vertical; }
  .kb-cmt-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .kb-cmt-phi { font-size: .72rem; color: var(--muted-2); }
  /* #1 — zero-result "request an article" prompt in the results panel. */
  .kb-gap { margin: auto; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .kb-gap .kb-btn { color: var(--success-deep); background: var(--accent-soft); border-color: var(--accent-soft); }

  /* editor modal */
  .kb-ed { width: min(720px, 96vw); max-height: 92vh; display: flex; flex-direction: column; }
  .kb-ed .body { overflow: auto; padding: 4px 2px; }
  .kb-ed .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .kb-ed label { font-size: .76rem; font-weight: 600; color: var(--muted); }
  .kb-ed input, .kb-ed textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; box-sizing: border-box; }
  .kb-ed textarea { min-height: 200px; font-family: var(--mono, monospace); font-size: .85rem; resize: vertical; }
  .kb-typetog { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .kb-typetog button { background: var(--paper-2); border: none; padding: 6px 14px; cursor: pointer; font: inherit; color: var(--muted); }
  .kb-typetog button.on { background: var(--accent); color: #fff; }
  .kb-ed-prev { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--paper); margin-top: 6px; max-height: 240px; overflow: auto; }
  .kb-ed-foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 8px; }
  /* #4 — draft→publish + revision history */
  .kb-ed-draft { margin-right: auto; display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); cursor: pointer; }
  .kb-draft-pill { font-family: var(--mono); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; background: var(--warn-soft); color: var(--warning-deep); border-radius: 999px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
  .kb-draft-banner { font-size: .8rem; color: var(--warning-deep); background: var(--warn-soft); border: 1px solid var(--warn-soft); border-radius: 8px; padding: 7px 11px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .kb-rev-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .kb-rev-main { flex: 1; min-width: 0; }
  .kb-rev-meta { font-size: .78rem; color: var(--muted); font-family: var(--mono); }
  .kb-rev-prev { font-size: .84rem; color: var(--ink); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
  .kb-rev-row .kb-btn { flex-shrink: 0; }
  /* Interactive roster block (operator 2026-08-11). Must work at 400px — the
     Ctrl/⌘+K drawer is the mid-call surface this exists for — so every row
     wraps and the team grid is intrinsic (auto-fill), never fixed tracks. */
  .kb-roster { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 12px; margin: 14px 0; }
  .kb-ros-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .kb-ros-search {
    flex: 1 1 180px; min-width: 0; font: inherit; font-size: .86rem;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper); color: var(--ink);
  }
  /* Focus rings come from the ONE global :focus-visible rule in styles.html
     (box-shadow: var(--ring-focus)) — declaring a per-element outline here
     would both duplicate it and misuse a shadow value as a colour. */
  .kb-ros-search:focus { border-color: var(--border-strong); }
  .kb-ros-count { flex: 0 0 auto; font-family: var(--mono); font-size: .72rem; color: var(--muted-2); }
  .kb-ros-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .kb-ros-legend-item { font-size: .74rem; color: var(--muted); }
  .kb-ros-legend-item b { font-family: var(--mono); color: var(--ink); font-weight: 700; }
  .kb-ros-dept { margin: 0 0 14px; }
  .kb-ros-dept-name { font-size: .95rem; font-weight: 700; color: var(--ink); margin: 0 0 8px; }
  .kb-ros-owner { font-weight: 500; font-size: .8rem; color: var(--muted-2); }
  .kb-ros-owner::before { content: '· '; }
  /* align-items:start — a 3-person team must not stretch to match a 9-person
     one beside it (the documented .m-layout / .dash-trk lesson). */
  .kb-ros-teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; align-items: start; }
  .kb-ros-team { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 8px 10px; min-width: 0; }
  .kb-ros-team-name { font-size: .74rem; font-family: var(--mono); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 6px; }
  .kb-ros-sub { color: var(--info-deep); }
  .kb-ros-sub::before { content: '› '; color: var(--muted-3); }
  .kb-ros-people { display: flex; flex-direction: column; gap: 4px; }
  .kb-ros-person { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-width: 0; }
  .kb-ros-name {
    appearance: none; border: none; background: none; padding: 0; cursor: pointer;
    font: inherit; font-size: .86rem; color: var(--ink); text-align: left;
    border-bottom: 1px dashed transparent;
  }
  .kb-ros-name:hover { border-bottom-color: var(--muted-3); }
  .kb-ros-person.is-lead .kb-ros-name { font-weight: 700; }
  .kb-ros-tag {
    position: relative; font-family: var(--mono); font-size: .64rem; font-weight: 700;
    padding: 1px 5px; border-radius: var(--radius-pill);
    background: var(--paper-2); color: var(--muted); border: 1px solid var(--line);
  }
  .kb-ros-tag[data-tip] { cursor: help; }
  /* Same tokened tooltip as the Intake help glyph — hover AND keyboard focus,
     so it is not a mouse-only affordance. */
  .kb-ros-tag[data-tip]:hover::after, .kb-ros-tag[data-tip]:focus::after {
    content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 6px);
    z-index: 5; white-space: nowrap; font-family: var(--ui); font-weight: 500;
    font-size: .72rem; padding: 5px 8px; border-radius: 6px;
    background: var(--ink); color: var(--paper); box-shadow: var(--shadow-sm);
  }
  .kb-ros-flag { font-family: var(--mono); font-size: .6rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: var(--radius-pill); }
  .kb-ros-flag.is-lead { background: var(--info-soft); color: var(--info-deep); }
  .kb-ros-flag.is-new { background: var(--warn-soft); color: var(--warning-deep); }
  .kb-ros-flag.is-badge { background: var(--accent-soft); color: var(--success-deep); }
  .kb-ros-warn { margin-top: 10px; font-size: .74rem; color: var(--warning-deep); }
  /* Decision / task-guide block. One question at a time, a walkable trail,
     and tickable steps at the leaf. */
  .kb-decision { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 12px; margin: 14px 0; }
  .kb-dec-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .kb-dec-step { font-family: var(--mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); }
  .kb-dec-bar .kb-ros-expand { margin-left: auto; }
  .kb-dec-trail { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .kb-dec-crumb { appearance: none; text-align: left; cursor: pointer; font: inherit; background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  .kb-dec-crumb:hover { border-color: var(--border-strong); }
  .kb-dec-crumb-q { display: block; font-size: .66rem; color: var(--muted-2); }
  .kb-dec-crumb-a { display: block; font-size: .78rem; font-weight: 700; color: var(--ink); }
  .kb-dec-title { margin: 0 0 8px; font-size: 1rem; font-weight: 700; color: var(--ink); }
  .kb-dec-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .kb-dec-opt { appearance: none; cursor: pointer; font: inherit; font-size: .86rem; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--paper); color: var(--ink); }
  .kb-dec-opt:hover { background: var(--accent-soft); border-color: var(--accent); }
  .kb-dec-action { border-left: 3px solid var(--accent); padding-left: 10px; }
  .kb-dec-todos { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .kb-dec-todos label { display: flex; gap: 8px; align-items: flex-start; font-size: .86rem; cursor: pointer; }
  .kb-dec-todos li.is-done span { text-decoration: line-through; color: var(--muted-2); }
  .kb-dec-note { margin: 8px 0 0; font-size: .78rem; color: var(--muted); border-left: 2px solid var(--warn-soft); padding-left: 8px; }
  @media (max-width: 560px) {
    .kb-dec-opts { flex-direction: column; align-items: stretch; }
  }
  /* Glossary block. */
  .kb-glossary { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 12px; margin: 14px 0; }
  .kb-gloss-list { margin: 0; }
  .kb-gloss-row { display: grid; grid-template-columns: minmax(96px, 168px) 1fr; gap: 4px 14px; padding: 6px 0; border-top: 1px solid var(--line); }
  .kb-gloss-row:first-child { border-top: none; }
  .kb-gloss-term { margin: 0; font-weight: 700; font-size: .84rem; color: var(--ink); }
  .kb-gloss-aka { display: block; font-weight: 500; font-size: .7rem; color: var(--muted-2); }
  .kb-gloss-def { margin: 0; font-size: .84rem; color: var(--muted); }
  /* The in-article mention: quiet enough to read past, obvious enough to try. */
  .kb-gloss-mark { border-bottom: 1px dotted var(--muted-3); cursor: help; position: relative; }
  .kb-gloss-mark:hover::after, .kb-gloss-mark:focus::after {
    content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 6;
    width: max-content; max-width: min(320px, 70vw); white-space: normal;
    font-size: .74rem; font-weight: 500; line-height: 1.35; padding: 6px 9px; border-radius: 6px;
    background: var(--ink); color: var(--paper); box-shadow: var(--shadow-sm);
  }
  @media (max-width: 560px) {
    .kb-gloss-row { grid-template-columns: 1fr; gap: 2px; }
  }
  /* Warehouse map block (` ```map `, operator 2026-08-13). Rows are flex-wrap
     (intrinsic reflow — no fixed grid, so no A2 breakpoint owed); the embed
     wrapper carries NO display-setting class so the [hidden] attribute works
     (the [hidden]-vs-display gotcha). */
  .kb-map-note { font-size: .72rem; color: var(--muted-3); margin: -4px 0 8px; }
  .kb-map-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 0; border-top: 1px solid var(--line); }
  .kb-map-row:first-child { border-top: none; }
  .kb-map-main { flex: 1 1 220px; min-width: 0; }
  .kb-map-name { display: block; font-size: .84rem; color: var(--ink); }
  .kb-map-addr { display: block; font-size: .74rem; color: var(--muted); }
  .kb-map-dist { font-family: var(--mono); font-size: .74rem; font-weight: 600; color: var(--info-deep); }
  .kb-map-open { font-size: .74rem; color: var(--info-deep); }
  .kb-map-embed-btn { appearance: none; font: inherit; font-size: .72rem; padding: 3px 9px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--paper-card); color: var(--ink); cursor: pointer; }
  .kb-map-embed-btn:hover { border-color: var(--border-strong); }
  .kb-map-embed { flex: 1 0 100%; }
  .kb-map-embed iframe { width: 100%; height: 280px; border: 1px solid var(--line); border-radius: 8px; }
  .kb-map-results:not(:empty) { border: 1px solid var(--line); border-radius: 8px; background: var(--paper-2); padding: 8px 10px; margin-bottom: 8px; font-size: .8rem; }
  .kb-map-from { font-size: .74rem; color: var(--muted-2); margin-bottom: 4px; }
  .kb-map-ranks { margin: 0; padding-left: 20px; }
  .kb-map-ranks li { padding: 2px 0; }
  .kb-map-rk-na { color: var(--muted-3); }
  /* Mode switcher — the segmented-pill vocabulary used by the Time/PTO and
     Coaching toggles, so a stateful toggle looks the same everywhere. */
  .kb-ros-modes { display: inline-flex; flex: 0 0 auto; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--paper-2); }
  .kb-ros-mode { appearance: none; border: none; background: none; cursor: pointer; font: inherit; font-size: .74rem; padding: 4px 10px; border-radius: var(--radius-pill); color: var(--muted); }
  .kb-ros-mode.on { background: var(--paper-card); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-sm); }
  .kb-ros-n { font-family: var(--mono); color: var(--muted-3); font-weight: 500; }
  .kb-ros-expand { flex: 0 0 auto; appearance: none; font: inherit; font-size: .74rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--paper-card); color: var(--ink); cursor: pointer; }
  .kb-ros-expand:hover { border-color: var(--border-strong); }
  /* Expanded view: nearly the whole viewport, so the roster stops competing
     with the height-capped reader panel it normally sits in. */
  .kb-roster-modal { width: min(1400px, 96vw); max-width: 96vw; max-height: 92vh; overflow: auto; padding: 14px; }
  .kb-roster-modal-head { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .kb-roster-modal .kb-roster { border: none; padding: 0; margin: 0; }
  /* The untagged group is usually the biggest; a single narrow column of 30+
     names is unreadable, so it spans and its rows flow into columns. */
  .kb-ros-team.is-wide { grid-column: 1 / -1; }
  .kb-ros-team.is-wide .kb-ros-people { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 10px; }
  .kb-ros-where { font-size: .72rem; color: var(--muted-2); }
  .kb-ros-cap-note { font-size: .72rem; color: var(--muted); margin-bottom: 6px; }
  .kb-ros-note { margin-top: 10px; font-size: .74rem; color: var(--muted); }
  /* Person detail panel — answers "where else does this person work", which
     the team-shaped grid structurally cannot. */
  .kb-ros-panel { border: 1px solid var(--border-strong); border-radius: 8px; background: var(--paper-2); padding: 10px 12px; margin-bottom: 12px; }
  .kb-ros-panel[hidden] { display: none; }   /* [hidden] loses to a display rule */
  .kb-ros-panel-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .kb-ros-panel-head b { font-size: .95rem; }
  .kb-ros-panel-actions { margin-left: auto; display: flex; gap: 6px; }
  .kb-ros-panel-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .kb-ros-panel-where { margin-top: 8px; font-size: .8rem; color: var(--muted); }
  .kb-ros-panel-where ul { margin: 4px 0 0; padding-left: 18px; }
  .kb-ros-panel-where li { color: var(--ink); }
  /* Coverage view */
  .kb-ros-cov-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .kb-ros-tile { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 8px 10px; text-align: center; }
  .kb-ros-tile b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; color: var(--ink); }
  .kb-ros-tile span { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-2); }
  /* A wide table scrolls INSIDE its own container — the page must never scroll
     sideways (the Visual Audit Stage's overflow rule). */
  .kb-ros-tablewrap { overflow-x: auto; }
  .kb-ros-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  .kb-ros-table th, .kb-ros-table td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .kb-ros-table thead th { font-family: var(--mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-2); font-weight: 700; }
  /* .kb-article th (the markdown-table ledger header) also matches these cells
     and sets mono/uppercase — a ROW header is body text, so reset it here
     rather than leaving capability names shouting in the table body. */
  .kb-ros-table tbody th { font-family: var(--ui); font-size: .8rem; letter-spacing: 0; text-transform: none; font-weight: 700; color: var(--ink); }
  .kb-ros-table tbody th .kb-ros-where { display: block; font-weight: 500; }
  .kb-ros-table tr.is-single td, .kb-ros-table tr.is-single th { background: var(--warn-soft); }
  /* Chart view. The tree's width is set by its widest VISIBLE row, which under
     progressive disclosure is one department's team count — never the 46-leaf
     full expansion. It still scrolls inside ITS OWN container so the page
     never scrolls sideways (the Visual Audit Stage's overflow rule). */
  .kb-ros-chartwrap { overflow-x: auto; padding-bottom: 4px; }
  .kb-ros-tree, .kb-ros-children { list-style: none; margin: 0; padding: 0; }
  .kb-ros-tree { display: flex; justify-content: flex-start; gap: 14px; padding-top: 4px; }
  .kb-ros-node { position: relative; }
  .kb-ros-nodebox { display: inline-block; min-width: 132px; max-width: 210px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 7px 10px; text-align: left; }
  .kb-ros-nodebox.is-dept { border-color: var(--border-strong); background: var(--paper-card); }
  .kb-ros-toggle { appearance: none; border: none; background: none; padding: 0; cursor: pointer; font: inherit; font-size: .84rem; font-weight: 700; color: var(--ink); text-align: left; display: block; width: 100%; }
  .kb-ros-toggle::before { content: '▸ '; color: var(--muted-3); font-weight: 400; }
  .kb-ros-node.open > .kb-ros-nodebox > .kb-ros-toggle::before { content: '▾ '; }
  .kb-ros-nodemeta { display: block; font-size: .7rem; color: var(--muted-2); margin-top: 2px; }
  /* Children are hidden until their node is open — this IS the progressive
     disclosure, so the collapsed tree is only as wide as its top level. */
  .kb-ros-children { display: none; }
  .kb-ros-node.open > .kb-ros-children { display: flex; justify-content: flex-start; gap: 12px; padding-top: 18px; }
  /* Classic connector lines: a stub down from the parent, a horizontal rail
     across the children, and a stub up into each child. */
  .kb-ros-node.open > .kb-ros-children > li { position: relative; padding-top: 16px; }
  .kb-ros-node.open > .kb-ros-children > li::before { content: ''; position: absolute; top: 0; left: 22px; width: 1px; height: 16px; background: var(--line); }
  .kb-ros-node.open > .kb-ros-children > li::after { content: ''; position: absolute; top: -1px; left: 22px; right: -12px; height: 1px; background: var(--line); }
  .kb-ros-node.open > .kb-ros-children > li:last-child::after { display: none; }
  .kb-ros-node.open > .kb-ros-nodebox { position: relative; }
  .kb-ros-node.open > .kb-ros-nodebox::after { content: ''; position: absolute; left: 22px; bottom: -18px; width: 1px; height: 18px; background: var(--line); }
  /* People stack VERTICALLY inside their team, so opening a team costs height
     rather than width — a 9-person team would otherwise be the widest row. */
  .kb-ros-children.is-leaves { padding-top: 16px; }
  .kb-ros-node.open > .kb-ros-children.is-leaves { display: block; }
  .kb-ros-people { border: 1px solid var(--line); border-left: 2px solid var(--accent-soft); border-radius: 8px; background: var(--paper-2); padding: 7px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 132px; }
  .kb-ros-node.open > .kb-ros-children.is-leaves > li::after { display: none; }
  .kb-ros-chart.has-overflow .kb-ros-chart-hint { display: block; }
  /* Flow view — stages left to right with connectors between them. Wraps
     rather than forcing a scroll, because a process reads fine on two lines
     but not at all when half of it is off-screen. */
  .kb-ros-steps { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 22px; }
  .kb-ros-step { position: relative; }
  .kb-ros-step + .kb-ros-step > .kb-ros-nodebox::before {
    content: '→'; position: absolute; left: -18px; top: 12px;
    color: var(--muted-3); font-size: .9rem;
  }
  .kb-ros-nodebox.is-step { background: var(--paper-2); border-style: dashed; }
  .kb-ros-stepn { display: inline-block; min-width: 16px; margin-right: 4px; font-family: var(--mono); font-size: .64rem; color: var(--muted-2); }
  .kb-ros-toggle.is-plain { cursor: default; }
  .kb-ros-flow { margin-bottom: 16px; }
  /* Process graph: phases are columns, the connector layer sits behind them
     and is drawn by measuring the boxes CSS already placed. */
  .kb-ros-procwrap { position: relative; overflow-x: auto; padding-bottom: 22px; }
  .kb-ros-phases { display: flex; align-items: flex-start; gap: 40px; position: relative; z-index: 1; }
  .kb-ros-phase { min-width: 176px; }
  .kb-ros-phase-name { font-size: .74rem; font-family: var(--mono); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-2); margin: 0 0 8px; padding-bottom: 5px; border-bottom: 2px solid var(--accent-soft); }
  .kb-ros-phase.is-external .kb-ros-phase-name { border-bottom-color: var(--line); font-style: italic; }
  .kb-ros-fnodes { display: flex; flex-direction: column; gap: 14px; }
  .kb-ros-fnode { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 7px 10px; }
  .kb-ros-fnode.is-team { border-color: var(--border-strong); background: var(--paper-card); }
  .kb-ros-fnode.is-decision { border-style: dashed; border-color: var(--warning-deep); background: var(--warn-soft); }
  .kb-ros-fnode-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .kb-ros-flag.is-decision { background: var(--paper-2); color: var(--warning-deep); }
  .kb-ros-flag.is-join { background: var(--accent-soft); color: var(--success-deep); }
  .kb-ros-joinnote { display: block; margin-top: 4px; font-size: .68rem; color: var(--success-deep); }
  .kb-ros-routes { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .kb-ros-routes li { font-size: .7rem; color: var(--muted); }
  .kb-ros-routelbl { font-weight: 700; color: var(--ink); }
  .kb-ros-edges { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: visible; }
  .kb-ros-edge { fill: none; stroke: var(--muted-3); stroke-width: 1.5; }
  .kb-ros-edge.is-back { stroke: var(--danger-deep); stroke-dasharray: 4 3; }
  /* A skip passes something it does not visit — drawn distinctly so it cannot
     be read as the step-by-step path. */
  .kb-ros-edge.is-skip { stroke: var(--info-deep); stroke-dasharray: 5 3; }
  .kb-ros-edges marker path { fill: var(--muted-3); }
  @media (max-width: 700px) {
    /* Connectors between columns are meaningless once the columns stack, so
       the phases become an ordered list and the routes carry the structure. */
    .kb-ros-phases { flex-direction: column; gap: 18px; }
    .kb-ros-edges { display: none; }
  }
  .kb-ros-flowhint { font-family: var(--mono); font-size: .72rem; background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: 8px 0; }
  .kb-ros-empty { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; color: var(--muted); font-size: .84rem; }
  .kb-ros-empty b { color: var(--ink); display: block; margin-bottom: 6px; }
  .kb-ros-empty p { margin: 6px 0; }
  .kb-ros-chart-hint { display: none; font-size: .72rem; color: var(--muted-2); margin-bottom: 6px; }
  @media (max-width: 560px) {
    /* Two department boxes at their wide min-width overflow a 400px viewport
       before anything is even expanded. */
    .kb-ros-nodebox { min-width: 104px; max-width: 150px; padding: 6px 8px; }
    .kb-ros-tree { gap: 10px; }
  }
  @media (max-width: 560px) {
    .kb-ros-teams { grid-template-columns: 1fr; }
  }

  /* #6 — copyable "canned response" snippet card (rendered by kbMd_). */
  .kb-snippet { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; margin: 12px 0; background: var(--paper-2); overflow: hidden; }
  .kb-snippet-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--accent-soft); }
  .kb-snippet-label { flex: 1; min-width: 0; font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--success-deep); }
  .kb-snippet-copy { flex-shrink: 0; font: inherit; font-size: .74rem; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper-card); color: var(--ink); cursor: pointer; }
  .kb-snippet-copy:hover { background: var(--paper); border-color: var(--border-strong); }
  .kb-snippet-body { margin: 0; padding: 10px; font: inherit; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
  /* #5 — bookmark (favorite) star toggle. */
  .kb-bm { cursor: pointer; }
  .kb-bm.on { color: var(--warning-deep); border-color: var(--warn-soft); background: var(--warn-soft); }
  .kb-land-bm-x { flex-shrink: 0; appearance: none; border: none; background: none; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .kb-land-bm-x:hover { background: var(--paper-2); color: var(--danger); }
  .kbd-reader-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .kb-btn.kbd-bm { padding: 4px 7px; }
  .kb-add-alt { margin-left: 6px; background: var(--paper-2); color: var(--ink); }
  /* #8 — search result filter bar. */
  .kb-filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 14px; }
  .kb-fchip { font: inherit; font-size: .78rem; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-card); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .kb-fchip:hover { background: var(--paper-2); }
  .kb-fchip.on { background: var(--accent-soft); color: var(--success-deep); border-color: var(--accent-soft); }
  .kb-fchip-n { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .kb-fchip.on .kb-fchip-n { color: var(--success-deep); }
  .kb-fdept { font: inherit; font-size: .78rem; padding: 3px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper-card); color: var(--ink); margin-left: auto; }
  /* #7 — "See also" related-items block on the reader. */
  .kb-related { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
  .kb-related-h { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .kb-related-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .86rem; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper-card); color: var(--ink); cursor: pointer; margin-bottom: 5px; }
  .kb-related-row:hover { background: var(--paper-2); border-color: var(--border-strong); }
  .kb-related-t { flex: 1; min-width: 0; }
  .kb-related-meta { font-size: .74rem; color: var(--muted); flex-shrink: 0; }
  :root[data-compact] .kb-wrap { grid-template-columns: 1fr; height: auto; max-height: none; }
  /* F2 (cycle 16) — the A2 rule: `:root[data-compact]` is the POP-OUT, not a
     viewport breakpoint, and the two triggers are independent. This file had
     ZERO media queries, so the 280px tree track (a FIXED length — it does not
     yield) held its full width on a phone and the `1fr` reader absorbed the
     whole shortfall: MEASURED in Chromium at 390px, .kb-side 280px and
     .kb-main **70px**. Reference is the mid-call lookup tool every rep uses,
     so its reader being 70px wide is the whole feature failing on mobile.
     Stacked, the item cap above still applies per column — each keeps its own
     internal scroll (the V-9 model: the cap must stay on the ITEMS, never move
     to the container). */
  @media (max-width: 720px) {
    .kb-wrap { grid-template-columns: 1fr; min-height: 0; }
    /* Stacked, a viewport-tall tree would push the reader entirely below the
       fold; cap the tree and let the reader take the height it needs. */
    .kb-wrap > .kb-side { max-height: 45vh; }
  }
  /* - KB slide-over drawer (shell capability) - sits ABOVE the overlay layer
     (z 50) so it stays readable + usable while the email composer or other
     modals are open (the core focusin trap exempts it); survives Call Notes'
     #view-area re-renders by mounting on document.body. Toasts (z 999) still
     paint over it. */
  #kb-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 92vw); background: var(--paper-card); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); z-index: 55; display: flex; flex-direction: column; transform: translateX(102%); transition: transform .22s var(--ease); }
  #kb-drawer.open { transform: translateX(0); }
  .kbd-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .kbd-kicker { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); flex: 1; }
  .kbd-x { background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 6px; display: inline-flex; }
  .kbd-x:hover { background: var(--paper-2); color: var(--ink); }
  .kbd-search { padding: 10px 14px 0; flex-shrink: 0; }
  .kbd-search input { width: 100%; box-sizing: border-box; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--paper); color: var(--ink); }
  .kbd-body { overflow-y: auto; flex: 1; padding: 10px 14px 16px; }
  .kbd-sec { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 12px 0 4px; display: flex; align-items: center; gap: 8px; }

  #kb-drawer-tab { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 44; writing-mode: vertical-rl; font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); background: var(--paper-card); border: 1px solid var(--line); border-right: none; border-radius: 8px 0 0 8px; padding: 10px 4px; cursor: pointer; display: none; }

  #kb-drawer-tab.show { display: block; }

  mark.kb-hl { background: var(--selection-bg); color: inherit; border-radius: 3px; padding: 0 1px; }
  /* Operator feedback (2026-06-12 r2): Docs-style link hover card — shows

    padding: 8px 10px; font-size: .8rem;

  #kb-linkcard .lc-btn:hover { background: var(--paper); border-color: var(--border-strong); }

  .kbd-search { position: relative; }

    position: absolute; right: 24px; top: 50%; margin-top: 1px;

    border: 2px solid var(--line); border-top-color: var(--accent);
    display: none; transform: translateY(-50%);
  }
  .kbd-spin.on { display: block; animation: kbdSpin .7s linear infinite; }
  @keyframes kbdSpin { to { transform: translateY(-50%) rotate(360deg); } }
</style>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  REFERENCE / KNOWLEDGE BASE — client (Phase 1).
//  Per-department tree + full-text search + reader. Articles are markdown
//  (stored as source server-side, rendered here via kbMd_, which escapes HTML
//  first so authored content can't inject script). Embeds render the Drive
//  preview iframe. Managers get inline add/edit/delete.
// ════════════════════════════════════════════════════════════════════════════
var KB_STATE = { tree: [], isManager: false, isAdmin: false, currentId: null, landing: false, usage: null, reviewDue: null, contentRequests: null };
var KB_EDIT = null;

// Compact markdown → HTML. Escapes HTML up front (so raw tags/script in the
// source are inert), then applies a safe subset: headings, bold/italic, inline
// + fenced code, links (http(s)/mailto only), images (http(s) only), GFM
// tables, ul/ol, blockquote, hr, paragraphs.
// Anchor slug for heading ids - MUST stay identical to the server kbSlug_
// in Code.js (searchReference computes the anchors that kbMd_'s ids must
// match). The entity de-escape makes the two agree even though kbMd_ slugs
// ESCAPED source while the server slugs raw markdown. Node parity test.
function kbSlug_(text) {
  return String(text || '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// ── Decision / task-guide block (operator 2026-08-11) ─────────────────────
// "Guide me through a task, with actions at the leaves." A ```decision fence
// asks ONE question at a time and lands on an action with tickable steps, so a
// rep mid-call is never reading a branching policy page and holding the branch
// in their head.
//
//   ask|  q1: Does this order need a PT Eval?
//   opt|  q1: Yes -> q2
//   opt|  q1: No  -> a1
//   do|   a1: Send straight to PWC Verification
//   todo| a1: Confirm the qualification documents are attached
//   note| a1: Group 3 chairs always need an ATP regardless
//
// The first `ask|` is the root. Ids are author-chosen and never shown.

/** PURE. Input is kbMd_-escaped; nothing here unescapes it. */
function kbDecideParse_(text) {
  var nodes = {}, order = [], warnings = [], root = '';
  var line, i;
  String(text == null ? '' : text).split('\n').forEach(function (raw) {
    line = raw.trim();
    if (!line || line.charAt(0) === '#') return;
    var m = line.match(/^(ask|opt|do|todo|note)\s*\|\s*(.*)$/i);
    if (!m) { warnings.push(line); return; }
    var key = m[1].toLowerCase(), rest = m[2];
    var ci = rest.indexOf(':');
    if (ci < 0) { warnings.push(line); return; }
    var id = rest.slice(0, ci).trim();
    var val = rest.slice(ci + 1).trim();
    if (!id || !val) { warnings.push(line); return; }
    var n = nodes[id];
    if (!n) { n = nodes[id] = { id: id, kind: '', title: '', opts: [], todos: [], notes: [] }; order.push(id); }
    if (key === 'ask' || key === 'do') {
      if (n.kind) { warnings.push(line); return; }      // a second title would be ambiguous
      n.kind = (key === 'ask') ? 'ask' : 'do';
      n.title = val;
      if (key === 'ask' && !root) root = id;
      return;
    }
    if (key === 'opt') {
      // `opt| q1: Yes -> q2`
      var am = val.match(/\s*-(?:&gt;|>)\s*/);
      if (!am) { warnings.push(line); return; }
      n.opts.push({ label: val.slice(0, am.index).trim(), to: val.slice(am.index + am[0].length).trim() });
      return;
    }
    if (key === 'todo') n.todos.push(val);
    else n.notes.push(val);
  });

  // A branch that leads nowhere, or a node nothing can reach, is an authoring
  // error the reader would otherwise hit as a dead end mid-call.
  var dangling = [], unreachable = [];
  order.forEach(function (id) {
    nodes[id].opts.forEach(function (o) { if (!nodes[o.to]) dangling.push(o.to); });
    if (!nodes[id].kind) warnings.push(id);            // referenced but never defined
  });
  if (root) {
    var seen = {}, stack = [root];
    while (stack.length) {
      var cur = stack.pop();
      if (seen[cur] || !nodes[cur]) continue;
      seen[cur] = 1;
      nodes[cur].opts.forEach(function (o) { stack.push(o.to); });
    }
    order.forEach(function (id) { if (!seen[id]) unreachable.push(id); });
  }
  return { nodes: nodes, order: order, root: root, warnings: warnings,
           dangling: dangling, unreachable: unreachable };
}

/** Resolves a stored answer path to the node it lands on, ignoring any step
 *  that no longer matches (an author can edit the tree under a reader). */
function kbDecideResolve_(data, path) {
  var at = data.root, trail = [];
  (path || []).forEach(function (choice) {
    var n = data.nodes[at];
    if (!n || n.kind !== 'ask') return;
    var hit = null;
    n.opts.forEach(function (o) { if (o.label === choice) hit = o; });
    if (!hit || !data.nodes[hit.to]) return;
    trail.push({ q: n.title, a: hit.label });
    at = hit.to;
  });
  return { at: at, trail: trail };
}

function kbDecideHtml_(text, path) {
  var data = kbDecideParse_(text);
  if (!data.root) {
    return '<div class="kb-ros-empty"><b>No guide recorded yet.</b>' +
      '<p>Start with a question and give each answer a destination:</p>' +
      '<pre class="kb-ros-flowhint">ask|  q1: Does this order need a PT Eval?\n' +
      'opt|  q1: Yes -&gt; a1\n' +
      'opt|  q1: No  -&gt; a2\n' +
      'do|   a1: Schedule the PT Eval\n' +
      'todo| a1: Book the earliest slot in PT Scheduling</pre>' +
      '<p>The first <code>ask|</code> is where the guide starts. ' +
      '<code>todo|</code> adds a tickable step and <code>note|</code> a caveat.</p></div>';
  }
  var r = kbDecideResolve_(data, path);
  var node = data.nodes[r.at] || data.nodes[data.root];

  var trail = r.trail.length
    ? '<ol class="kb-dec-trail">' + r.trail.map(function (t, i) {
        return '<li><button type="button" class="kb-dec-crumb" data-step="' + i + '" ' +
          'onclick="kbDecideBack_(this)" title="Change this answer">' +
          '<span class="kb-dec-crumb-q">' + t.q + '</span>' +
          '<span class="kb-dec-crumb-a">' + t.a + '</span></button></li>';
      }).join('') + '</ol>'
    : '';

  var body;
  if (node.kind === 'do') {
    body = '<div class="kb-dec-action">' +
      '<h3 class="kb-dec-title">' + node.title + '</h3>' +
      (node.todos.length
        ? '<ul class="kb-dec-todos">' + node.todos.map(function (t, i) {
            return '<li><label><input type="checkbox" onchange="kbDecideTick_(this)"> ' +
              '<span>' + t + '</span></label></li>';
          }).join('') + '</ul>'
        : '') +
      node.notes.map(function (n) { return '<p class="kb-dec-note">' + n + '</p>'; }).join('') +
      '</div>';
  } else {
    body = '<div class="kb-dec-q">' +
      '<h3 class="kb-dec-title">' + node.title + '</h3>' +
      node.notes.map(function (n) { return '<p class="kb-dec-note">' + n + '</p>'; }).join('') +
      '<div class="kb-dec-opts">' + node.opts.map(function (o) {
        return '<button type="button" class="kb-dec-opt" data-opt="' + kbRosterAttr_(o.label) + '" ' +
          'onclick="kbDecideChoose_(this)">' + o.label + '</button>';
      }).join('') + '</div>' +
      // A question with no options is a dead end the reader cannot leave.
      (node.opts.length ? '' : '<p class="kb-ros-warn">This question has no answers recorded.</p>') +
      '</div>';
  }

  var problems = [];
  if (data.dangling.length) problems.push(data.dangling.length + ' answer(s) point at a step that does not exist: ' + data.dangling.join(', '));
  if (data.unreachable.length) problems.push(data.unreachable.length + ' step(s) cannot be reached from the start: ' + data.unreachable.join(', '));

  return '<div class="kb-decision" data-decision="1" data-src="' + kbRosterAttr_(text) + '"' +
      ' data-path="' + kbRosterAttr_(JSON.stringify(path || [])) + '">' +
    (problems.length ? '<div class="kb-ros-warn" role="alert">' + problems.join(' · ') + '</div>' : '') +
    '<div class="kb-dec-bar">' +
      '<span class="kb-dec-step">' + (node.kind === 'do' ? 'Action' : 'Step ' + (r.trail.length + 1)) + '</span>' +
      (r.trail.length ? '<button type="button" class="kb-ros-expand" onclick="kbDecideRestart_(this)">Start over</button>' : '') +
    '</div>' + trail +
    '<div class="kb-dec-body" role="group" aria-live="polite">' + body + '</div>' +
    (data.warnings.length
      ? '<div class="kb-ros-warn">' + data.warnings.length + ' line(s) were not understood and are not shown.</div>'
      : '') +
    '</div>';
}

function kbDecideRoot_(el) { return el && el.closest ? el.closest('.kb-decision') : null; }

function kbDecidePath_(root) {
  // The stored path decodes on read exactly as data-src does, and its entries
  // are matched against option labels parsed from the (escaped) source — so
  // they are re-escaped here or a label containing & < > stops resolving.
  try {
    var p = JSON.parse(root.getAttribute('data-path') || '[]');
    return Array.isArray(p) ? p.map(kbFenceEsc_) : [];
  }
  catch (e) { return []; }
}

/** Re-renders in place from the source + the new path. Ticked boxes are
 *  deliberately NOT carried across: they belong to the action being shown, and
 *  restoring them onto a different action would assert work that was not done. */
function kbDecideRender_(root, path) {
  var html = kbDecideHtml_(kbFenceSrc_(root), path);
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var next = tmp.firstChild;
  root.parentNode.replaceChild(next, root);
  var focusTarget = next.querySelector('.kb-dec-opt, .kb-dec-todos input, .kb-dec-title');
  if (focusTarget && focusTarget.focus) { try { focusTarget.focus(); } catch (e) {} }
}

function kbDecideChoose_(btn) {
  var root = kbDecideRoot_(btn);
  if (!root) return;
  kbDecideRender_(root, kbDecidePath_(root).concat([kbFenceEsc_(btn.getAttribute('data-opt') || '')]));
}

/** Clicking a crumb returns to that question — a rep who mis-answers must not
 *  have to start again. */
function kbDecideBack_(btn) {
  var root = kbDecideRoot_(btn);
  if (!root) return;
  kbDecideRender_(root, kbDecidePath_(root).slice(0, +(btn.getAttribute('data-step') || 0)));
}

function kbDecideRestart_(btn) {
  var root = kbDecideRoot_(btn);
  if (root) kbDecideRender_(root, []);
}

function kbDecideTick_(input) {
  var li = input.closest ? input.closest('li') : null;
  if (li) li.classList.toggle('is-done', !!input.checked);
}

// ── Glossary block (operator 2026-08-11) ──────────────────────────────────
// This department runs on acronyms — PPD, PAR, ATP, MDO, PWC, T3Q, GP1–3 — and
// a new rep meets them mid-call with no way to ask. A ```glossary fence renders
// a filterable definition list AND teaches the article to explain itself: the
// first mention of a defined term anywhere else in the same article gets a
// dotted underline and a hover/focus definition.
//
//   PAR (aka Prior Auth)| Prior Authorization Request — payer sign-off before
//   ATP| Assistive Technology Professional
//
// Same safety story as the other blocks: kbMd_ escapes the fence content before
// the renderer sees it, and the annotation is a DOM TEXT-NODE walk (the
// kbHighlightTerms_ pattern), never string surgery on rendered HTML.

/** PURE. Input is kbMd_-escaped text; nothing here unescapes it. */
function kbGlossaryParse_(text) {
  var terms = [], warnings = [], seen = {};
  String(text == null ? '' : text).split('\n').forEach(function (raw) {
    var line = raw.trim();
    if (!line || line.charAt(0) === '#') return;
    var i = line.indexOf('|');
    if (i < 0) { warnings.push(line); return; }
    var head = line.slice(0, i).trim();
    var def = line.slice(i + 1).trim();
    if (!head || !def) { warnings.push(line); return; }
    // "PAR (aka Prior Auth, PA)" -> term PAR with two aliases, all pointing at
    // the same definition.
    var aliases = [];
    var am = head.match(/^(.*?)\s*\(\s*aka\s+([^)]*)\)\s*$/i);
    if (am) {
      head = am[1].trim();
      aliases = am[2].split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    }
    var k = head.toLowerCase();
    if (seen[k]) { warnings.push(line); return; }      // a second definition would be ambiguous
    seen[k] = 1;
    terms.push({ term: head, aliases: aliases, def: def });
  });
  terms.sort(function (a, b) { return a.term.toLowerCase() < b.term.toLowerCase() ? -1 : 1; });
  return { terms: terms, warnings: warnings };
}

function kbGlossaryHtml_(text) {
  var data = kbGlossaryParse_(text);
  if (!data.terms.length) {
    return '<div class="kb-ros-empty"><b>No terms yet.</b>' +
      '<p>Add one per line as <code>Term| Definition</code>. ' +
      '<code>Term (aka Other, Alt)| …</code> gives a term more than one spelling.</p></div>';
  }
  var rows = data.terms.map(function (t) {
    return '<div class="kb-gloss-row" data-term="' + kbRosterAttr_(t.term) + '"' +
        ' data-aliases="' + kbRosterAttr_(t.aliases.join('|')) + '"' +
        ' data-def="' + kbRosterAttr_(t.def) + '"' +
        ' data-hay="' + kbRosterAttr_((t.term + ' ' + t.aliases.join(' ') + ' ' + t.def).toLowerCase()) + '">' +
      '<dt class="kb-gloss-term">' + t.term +
        (t.aliases.length ? '<span class="kb-gloss-aka">' + t.aliases.join(', ') + '</span>' : '') +
      '</dt><dd class="kb-gloss-def">' + t.def + '</dd></div>';
  }).join('');
  return '<div class="kb-glossary" data-glossary="1">' +
    '<div class="kb-ros-bar">' +
      '<input type="search" class="kb-ros-search kb-gloss-search" placeholder="Filter terms…" ' +
        'aria-label="Filter glossary terms" oninput="kbGlossaryFilter_(this)">' +
      '<span class="kb-ros-count" role="status" aria-live="polite">' + data.terms.length + ' terms</span>' +
    '</div>' +
    '<dl class="kb-gloss-list">' + rows + '</dl>' +
    (data.warnings.length
      ? '<div class="kb-ros-warn">' + data.warnings.length + ' line(s) were not understood (or repeat a term) ' +
        'and are not shown.</div>'
      : '') +
    '</div>';
}

function kbGlossaryFilter_(input) {
  var root = input.closest ? input.closest('.kb-glossary') : null;
  if (!root) return;
  var q = String(input.value || '').trim().toLowerCase();
  var rows = root.querySelectorAll('.kb-gloss-row'), shown = 0;
  for (var i = 0; i < rows.length; i++) {
    var hit = !q || (rows[i].getAttribute('data-hay') || '').indexOf(q) >= 0;
    rows[i].style.display = hit ? '' : 'none';
    if (hit) shown++;
  }
  var c = root.querySelector('.kb-ros-count');
  if (c) c.textContent = shown + (q ? ' matching' : ' terms');
}

/** Annotates the FIRST mention of each defined term in the surrounding article.
 *  First-occurrence-only on purpose: marking every mention turns a page into a
 *  field of dotted underlines and stops reading as emphasis at all.
 *
 *  Walks TEXT NODES (the kbHighlightTerms_ pattern) so it can never damage the
 *  markup kbMd_ produced, and skips the glossary block itself, headings, code
 *  and existing links. */
function kbGlossaryAnnotate_(rootEl) {
  try {
    if (!rootEl) return;
    var rows = rootEl.querySelectorAll('.kb-gloss-row');
    if (!rows.length) return;
    var defs = [], byKey = {};
    for (var i = 0; i < rows.length; i++) {
      var term = rows[i].getAttribute('data-term') || '';
      var def = rows[i].getAttribute('data-def') || '';
      var names = [term].concat((rows[i].getAttribute('data-aliases') || '').split('|').filter(Boolean));
      names.forEach(function (n) {
        if (!n) return;
        defs.push(n);
        byKey[n.toLowerCase()] = { term: term, def: def };
      });
    }
    // Longest first, so "PT Eval" wins over "PT".
    defs.sort(function (a, b) { return b.length - a.length; });
    var used = {};
    defs.forEach(function (name) {
      var key = name.toLowerCase();
      if (used[key]) return;
      // An ALL-CAPS term is an acronym: match case-sensitively so "par" in
      // ordinary prose is not mistaken for PAR. Mixed-case terms match
      // case-insensitively.
      var acronym = name === name.toUpperCase();
      var re = new RegExp('\\b' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', acronym ? '' : 'i');
      var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
      var n;
      while ((n = walker.nextNode())) {
        var p = n.parentElement;
        if (!p || p.closest('.kb-glossary, code, pre, h1, h2, h3, h4, a, button, .kb-gloss-mark')) continue;
        var m = re.exec(n.nodeValue);
        if (!m) continue;
        var info = byKey[key];
        var frag = document.createDocumentFragment();
        frag.appendChild(document.createTextNode(n.nodeValue.slice(0, m.index)));
        var mark = document.createElement('span');
        mark.className = 'kb-gloss-mark';
        mark.setAttribute('tabindex', '0');
        mark.setAttribute('data-tip', info.def);
        mark.setAttribute('aria-label', info.term + ': ' + info.def);
        mark.textContent = m[0];
        frag.appendChild(mark);
        frag.appendChild(document.createTextNode(n.nodeValue.slice(m.index + m[0].length)));
        p.replaceChild(frag, n);
        used[key] = 1;
        break;                      // first mention only
      }
    });
  } catch (e) { /* annotation is decoration — never break the reader */ }
}

// ── Interactive roster block (operator 2026-08-11) ─────────────────────────
// An employee/routing map is the one KB content type a static article serves
// badly: mid-call, the rep's question is "who handles X, and can they take it"
// — not "show me the org". A ```roster fence renders an interactive directory
// instead, following the ```snippet precedent exactly: the fence content is
// already HTML-escaped by kbMd_'s top-level pass, so the APP draws the
// interactive markup around inert text. Nothing here executes article content.
//
// Syntax — deliberately hand-editable, because the operator's plan is for the
// app to become the source of truth for this data:
//   legend| lead=Team lead; new=Training / New; P=Standard powerchair
//   badge|  Parachute access: Rajdeep, Erica, Paula
//   dept|   PAK — Mary
//   team|   PPD: Micheal*lead, Sandra, Selena
//   team|   Medical Review > T3Q: Paula (C & ATP)*lead, Victoria
// A person is `Name (tags)*flag`; `>` nests a sub-team under a team.

/** PURE parser. Input is kbMd_-escaped text (& < > already entities); this
 *  never unescapes — the renderer only ever adds quote-escaping for attribute
 *  contexts, since the top-level pass does NOT cover quotes. */
function kbRosterParse_(text) {
  var legend = {}, badges = [], depts = [], flows = [], phases = [], steps = [], warnings = [];
  var cur = null;
  String(text == null ? '' : text).split('\n').forEach(function (raw) {
    var line = raw.trim();
    if (!line || line.charAt(0) === '#') return;              // blank / comment
    var m = line.match(/^(legend|badge|dept|team|flow|phase|step)\s*\|\s*(.*)$/i);
    if (!m) { warnings.push(line); return; }
    var key = m[1].toLowerCase(), val = m[2].trim();
    if (key === 'legend') {

      return;
    }
    if (key === 'badge') {
      var bi = val.indexOf(':');
      if (bi < 0) { warnings.push(line); return; }
      badges.push({
        label: val.slice(0, bi).trim(),
        people: val.slice(bi + 1).split(',').map(function (x) { return x.trim(); }).filter(Boolean),

    }
    if (key === 'phase') {

      // nodes that sit OUTSIDE the phases (an external feed).
      var pi = val.indexOf(':');
      if (pi < 0) { warnings.push(line); return; }
      var pname = val.slice(0, pi).trim();
      var nodes = val.slice(pi + 1).split(',').map(function (x) { return x.trim(); }).filter(Boolean)
        .map(function (n) {

          // either order, like the person flags.

    if (key === 'step') {
      // `step| From -> To: label`. The label may itself contain a colon, so
      // split on the FIRST colon AFTER the arrow.

      var from = val.slice(0, am.index).trim();
      var afterArrow = val.slice(am.index + am[0].length);

      var to = (li >= 0 ? afterArrow.slice(0, li) : afterArrow).trim();
      var slabel = li >= 0 ? afterArrow.slice(li + 1).trim() : '';

      steps.push({ from: from, to: to, label: slabel });
      return;
    }
    if (key === 'flow') {
      // `flow| [Label:] Stage -> Stage -> Stage`. The separator is `->` and
      // NOT `>`, which already nests a sub-team under a team.
      var lbl = '', rest = val;
      var ci = val.indexOf(':');
      if (ci >= 0 && !/-(?:&gt;|>)/.test(val.slice(0, ci))) { lbl = val.slice(0, ci).trim(); rest = val.slice(ci + 1); }
      var stages = rest.split(/\s*-(?:&gt;|>)\s*/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (stages.length >= 2) flows.push({ label: lbl, stages: stages });
      else warnings.push(line);
      return;
    }
    if (key === 'dept') {
      // "PAK — Mary" / "PAK - Mary" / "PAK" (no owner)
      var dm = val.split(/\s+[—–-]\s+/);
      cur = { name: dm[0].trim(), owner: (dm[1] || '').trim(), teams: [] };
      depts.push(cur);
      return;
    }
    // team
    var ti = val.indexOf(':');
    if (ti < 0) { warnings.push(line); return; }
    var head = val.slice(0, ti).trim();
    var sub = '';
    // `>` arrives from kbMd_ as `&gt;` (same class as the `&amp;` tag
    // separator). Match BOTH forms rather than unescaping: decoding to a raw
    // `>` and later emitting it would undo the escape boundary.
    var sm = head.match(/\s*(?:&gt;|>)\s*/);
    if (sm) { sub = head.slice(sm.index + sm[0].length).trim(); head = head.slice(0, sm.index).trim(); }
    var people = val.slice(ti + 1).split(',').map(function (x) { return x.trim(); }).filter(Boolean)
      .map(function (tok) {
        var flags = [];
        // Strip trailing *flags FIRST so a name containing "*" is not mangled.
        tok = tok.replace(/\*([a-z]+)\s*$/gi, function (_, f) { flags.push(f.toLowerCase()); return ''; }).trim();
        tok = tok.replace(/\*([a-z]+)\s*$/gi, function (_, f) { flags.push(f.toLowerCase()); return ''; }).trim();
        var tags = [];
        var tm = tok.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
        if (tm) {
          tok = tm[1].trim();
          // The input is kbMd_-ESCAPED, so an ampersand separator arrives as
          // `&amp;` — splitting on a bare `&` turns "C & ATP" into "C" and
          // "amp; ATP". Accept both forms (and a comma).
          tags = tm[2].split(/\s*(?:&amp;|&|,)\s*/).map(function (t) { return t.trim(); }).filter(Boolean);
        }
        return { name: tok, tags: tags, lead: flags.indexOf('lead') >= 0, isNew: flags.indexOf('new') >= 0 };
      });
    if (!cur) { cur = { name: '', owner: '', teams: [] }; depts.push(cur); }
    cur.teams.push({ name: head, sub: sub, people: people });
  });
  // Badges are an attribute of a PERSON, not a place — they travel with them
  // across every team they appear on, which a separate list cannot do.
  var badgeByPerson = {};
  badges.forEach(function (b) {
    b.people.forEach(function (n) {
      var k = n.toLowerCase();

    });
  });
  depts.forEach(function (d) {
    d.teams.forEach(function (t) {
      t.people.forEach(function (p) { p.badges = badgeByPerson[p.name.toLowerCase()] || []; });
    });
  });

  // renderer rather than two that could drift.
  flows.forEach(function (f) {
    if (!phases.length) {
      var lin = f.stages.map(function (n) { return { name: n, decision: false }; });
      phases.push({ name: f.label || '', external: false, nodes: lin, linear: true });
    }
    for (var i = 0; i + 1 < f.stages.length; i++) steps.push({ from: f.stages[i], to: f.stages[i + 1], label: '' });
  });
  return { legend: legend, badges: badges, depts: depts, flows: flows,
           phases: phases, steps: steps, warnings: warnings };
}

/** Renders the parsed roster. `v` values arrive kbMd_-escaped (& < >), so the
 *  ONLY extra escaping needed is for quotes in attribute contexts — the same
 *  gap kbMd_'s link/image rules guard (the top-level pass doesn't cover them). */

 *  `A > B` must address the same team without either being unescaped. */
function kbRosterKey_(v) {
  return String(v == null ? '' : v).toLowerCase()
    .replace(/&gt;/g, '>').replace(/&amp;/g, '&')
    .replace(/\s+/g, ' ').trim();
}

// ── Warehouse map block (` ```map `, operator 2026-08-13 — Tier A, no billing) ──
// `wh| Name: Address` lines render a warehouse directory: open-in-Google-Maps
// links, a per-warehouse keyless embed (`?q=…&output=embed` — no API key, the
// operator's no-billing constraint), and a nearest-warehouse lookup. The
// lookup geocodes SERVER-side through Apps Script's free built-in Maps
// service and returns straight-line miles; the query is never persisted
// anywhere (a looked-up address may be a patient's — the placeholder asks for
// a ZIP for exactly that reason). Distances are LABELED straight-line — the
// per-result Directions link is the honest path to a drive figure (INV-187:
// never imply a judgement the data doesn't carry). Fence rules match
// roster/glossary: content arrives HTML-escaped, attributes get their own
// quote escaping, values read back off data-attrs are DECODED (so they need
// esc() before any innerHTML), and unknown lines are counted, never silently
// dropped.
var KB_MAP_MAX_WH_CLIENT = 20;

  // for URL building (encodeURIComponent re-encodes everything, so the result
  // is attribute-safe); text and attribute contexts keep the escaped form —
  // the roster lesson: the parser never unescapes into markup.

function kbMapParse_(text) {
  var whs = [], warnings = [], truncated = 0;
  String(text == null ? '' : text).split('\n').forEach(function (raw) {
    var line = raw.trim();

    var m = line.match(/^wh\|\s*(.*)$/i);
    if (!m) { warnings.push(line); return; }
    var rest = m[1];
    var ci = rest.indexOf(':');
    if (ci < 1 || !rest.slice(ci + 1).trim()) { warnings.push(line); return; }
    if (whs.length >= KB_MAP_MAX_WH_CLIENT) { truncated++; return; }
    whs.push({ name: rest.slice(0, ci).trim(), addr: rest.slice(ci + 1).trim() });

}
function kbMapHtml_(text) {
  var data = kbMapParse_(text);
  if (!data.warehouses.length) {
    return '<div class="kb-ros-empty"><b>No warehouses yet.</b>' +
      '<p>Add one per line as <code>wh| Name: Street, City, ST ZIP</code>.</p></div>';
  }
  var rows = data.warehouses.map(function (w) {
    var q = encodeURIComponent(kbMapDecode_(w.addr));
    return '<div class="kb-map-row" data-name="' + kbRosterAttr_(w.name) + '" data-addr="' + kbRosterAttr_(w.addr) + '">' +
      '<div class="kb-map-main"><b class="kb-map-name">' + w.name + '</b>' +
        '<span class="kb-map-addr">' + w.addr + '</span></div>' +
      '<span class="kb-map-dist" data-dist></span>' +
      '<a class="kb-map-open" href="https://www.google.com/maps?q=' + q + '" target="_blank" rel="noopener">Open ↗</a>' +
      '<button type="button" class="kb-map-embed-btn" aria-expanded="false" onclick="kbMapToggleEmbed_(this)">Map</button>' +
      '<div class="kb-map-embed" hidden></div>' +
    '</div>';
  }).join('');
  return '<div class="kb-map" data-map="1">' +
    '<div class="kb-ros-bar">' +
      '<input type="search" class="kb-ros-search kb-map-q" placeholder="ZIP code (or city, state)" ' +
        'aria-label="Find the nearest warehouse — enter a ZIP code or city" ' +
        'onkeydown="if(event.key===\'Enter\')kbMapLookup_(this)">' +
      '<button type="button" class="kb-ros-expand" onclick="kbMapLookup_(this)">Find nearest</button>' +
      '<span class="kb-ros-count">' + data.warehouses.length + ' warehouse' + (data.warehouses.length === 1 ? '' : 's') + '</span>' +
    '</div>' +
    '<div class="kb-map-note">Prefer a ZIP code for patient lookups — the lookup goes to Google’s geocoder. Distances are straight-line estimates; use Directions for drive distance.</div>' +
    '<div class="kb-map-results" role="status" aria-live="polite"></div>' +
    '<div class="kb-map-list">' + rows + '</div>' +
    (data.truncated ? '<div class="kb-ros-warn">Only the first ' + KB_MAP_MAX_WH_CLIENT + ' warehouses are shown (' + data.truncated + ' more in the source).</div>' : '') +

function kbMapToggleEmbed_(btn) {
  var row = btn.closest ? btn.closest('.kb-map-row') : null;
  if (!row) return;
  var wrap = row.querySelector('.kb-map-embed');
  if (!wrap) return;
  var open = wrap.hasAttribute('hidden');
  if (open && !wrap.firstChild) {
    // Lazy — the keyless embed iframe is created on first open only.
    var f = document.createElement('iframe');
    f.src = 'https://www.google.com/maps?q=' +
      encodeURIComponent(kbMapDecode_(row.getAttribute('data-addr') || '')) + '&output=embed';
    f.setAttribute('loading', 'lazy');
    f.setAttribute('title', 'Map of ' + (row.getAttribute('data-name') || 'warehouse'));

function kbMapLookup_(el) {

  var input = root.querySelector('.kb-map-q');
  var out = root.querySelector('.kb-map-results');
  var q = String((input && input.value) || '').trim();
  if (q.length < 3) { out.textContent = 'Enter a ZIP code or city to look up.'; return; }
  var rows = root.querySelectorAll('.kb-map-row');
  var addrs = [], names = [];
  for (var i = 0; i < rows.length; i++) {
    addrs.push(kbMapDecode_(rows[i].getAttribute('data-addr') || ''));
    names.push(rows[i].getAttribute('data-name') || '');   // decoded — esc() before innerHTML
  }
  root.dataset.busy = '1';
  out.textContent = 'Looking up…';
  var done = function () { delete root.dataset.busy; };
  var fail = function (msg) { done(); out.textContent = msg || 'Lookup failed — try again.'; };
  try {
    google.script.run.withSuccessHandler(function (res) {
      done();
      if (!res || res.error) { fail(res && res.error); return; }
      var list = (res.results || []).slice().sort(function (a, b) {
        if (a.miles == null) return 1;
        if (b.miles == null) return -1;
        return a.miles - b.miles;

        var dir = 'https://www.google.com/maps/dir/' + encodeURIComponent(q) + '/' + encodeURIComponent(addrs[r.i] || '');
        html += '<li><span class="kb-map-rk-name">' + esc(names[r.i] || ('Warehouse ' + (r.i + 1))) + '</span> — ' +
          (r.miles == null ? '<span class="kb-map-rk-na">distance unavailable</span>'
            : '<b>≈ ' + esc(String(r.miles)) + ' mi</b>') +
          ' · <a href="' + dir + '" target="_blank" rel="noopener">Directions ↗</a></li>';

      }
    }).withFailureHandler(function (err) {
      fail(err && err.message);
    }).kbMapDistances(q, addrs);

}

function kbRosterAttr_(v) {
  return String(v == null ? '' : v).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── The fence-source round-trip boundary ────────────────────────────────────
// A block that re-renders itself (a roster mode switch, Expand, a decision
// answer) needs its own fence source back. Storing it in a `data-*` attribute
// looks safe because kbRosterAttr_ escapes the quotes — but the browser
// DECODES every entity when the attribute is parsed, so `getAttribute` hands
// back `<img src=x onerror=...>` where kbMd_ had written `&lt;img …&gt;`.
// Re-rendering that raw put a LIVE element into the article: the escape-first
// boundary INV-193 relies on held for the first render only.
//
// So: every read of a stored fence source (or of a value that will be COMPARED
// against parsed source) re-applies kbMd_'s top-level escape, restoring exactly
// the contract the renderers were written against. The two helpers are inverses
// over the same three entities kbMd_ escapes — do not let them drift apart.
function kbFenceEsc_(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function kbFenceDecode_(s) {
  return String(s == null ? '' : s).replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
}

/** THE one reader of a block's stored fence source. Never call getAttribute
 *  ('data-src') directly — that is the decoded form, and feeding it back into
 *  a renderer is the injection above. */
function kbFenceSrc_(root) {
  return kbFenceEsc_((root && root.getAttribute ? root.getAttribute('data-src') : '') || '');
}

/** A URL-safe id fragment, so a person or team is addressable in the DOM. */
function kbRosterSlug_(v) {
  return String(v == null ? '' : v).toLowerCase()
    .replace(/&[a-z]+;/g, ' ')                 // the input is escaped — drop entities
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
}

/** Folds the parsed roster into a PERSON-centric index: the same person can
 *  sit on several teams, and "where else does Erica work" is a question the
 *  team-shaped grid (and the source spreadsheet) cannot answer at all. */
function kbRosterPeopleIndex_(data) {
  var byName = {}, order = [];
  data.depts.forEach(function (d) {
    d.teams.forEach(function (t) {
      t.people.forEach(function (p) {
        var k = p.name.toLowerCase();
        if (!byName[k]) { byName[k] = { name: p.name, tags: [], badges: [], lead: false, isNew: false, places: [] }; order.push(k); }
        var e = byName[k];
        e.lead = e.lead || p.lead;
        e.isNew = e.isNew || p.isNew;
        p.tags.forEach(function (x) { if (e.tags.indexOf(x) < 0) e.tags.push(x); });
        (p.badges || []).forEach(function (x) { if (e.badges.indexOf(x) < 0) e.badges.push(x); });
        e.places.push({ dept: d.name, team: t.name, sub: t.sub });
      });
    });
  });
  return { byName: byName, order: order };
}

function kbRosterTagChip_(t, legend, clickable) {
  var tip = legend[t] || '';
  var a = ' class="kb-ros-tag"' + (tip ? ' data-tip="' + kbRosterAttr_(tip) + '"' : '');

  // click DOES, not just what the tag means.
  return '<button type="button"' + a + ' data-tag="' + kbRosterAttr_(t) + '" onclick="kbRosterTagFilter_(this)"' +

}

function kbRosterFlags_(p, legend) {
  var out = '';
  if (p.lead) out += '<span class="kb-ros-flag is-lead"' + (legend.lead ? ' title="' + kbRosterAttr_(legend.lead) + '"' : '') + '>lead</span>';
  if (p.isNew) out += '<span class="kb-ros-flag is-new"' + (legend['new'] ? ' title="' + kbRosterAttr_(legend['new']) + '"' : '') + '>new</span>';
  (p.badges || []).forEach(function (b) { out += '<span class="kb-ros-flag is-badge">' + b + '</span>'; });
  return out;
}

/** One person row. `hay` carries the searchable text so filtering never has to

function kbRosterPersonHtml_(p, legend, ctx, seen) {

  // are invalid and would break the very anchors this adds. The FIRST
  // occurrence keeps the bare slug, so it stays the canonical link target.

      ' id="' + id + '"' +

/** VIEW 1 — by team. The org's own shape, and the default. */
function kbRosterTeamsHtml_(data) {
  var legend = data.legend, seen = {};

/** VIEW 2 — by capability. "Who can take a Complex Rehab call" cuts ACROSS

function kbRosterCapabilitiesHtml_(data) {
