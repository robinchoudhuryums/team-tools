    var e = idx.byName[k];
    if (!e.tags.length) { untagged.push(e); return; }
    e.tags.forEach(function (t) {
      if (!byTag[t]) { byTag[t] = []; tagOrder.push(t); }
      byTag[t].push(e);
    });
  });
  tagOrder.sort(function (a, b) { return byTag[b].length - byTag[a].length || (a < b ? -1 : 1); });
  if (!tagOrder.length) {
    return '<div class="kb-ros-note">No capability tags in this roster yet — add them as ' +
      '<code>Name (tag)</code> and a <code>legend|</code> line explaining each.</div>';
  }
  var card = function (label, people, note) {
    return '<div class="kb-ros-team" data-team="' + kbRosterAttr_(label.toLowerCase()) + '">' +
      '<div class="kb-ros-team-name">' + label + ' <span class="kb-ros-n">' + people.length + '</span></div>' +
      (note ? '<div class="kb-ros-cap-note">' + note + '</div>' : '') +
      '<div class="kb-ros-people">' + people.map(function (e) {
        // In this view the person's TEAMS are the useful secondary detail.
        var where = e.places.map(function (pl) { return pl.team + (pl.sub ? ' › ' + pl.sub : ''); });
        return kbRosterPersonHtml_({ name: e.name, tags: [], allTags: e.tags, badges: e.badges, lead: e.lead, isNew: e.isNew }, legend, where, seen);
      }).join('') + '</div></div>';
  };
  var cards = tagOrder.map(function (t) { return card(t, byTag[t], legend[t] || ''); }).join('');
  if (untagged.length) cards += card('No capability tag', untagged, '').replace('class="kb-ros-team"', 'class="kb-ros-team is-wide"');
  return '<section class="kb-ros-dept"><div class="kb-ros-teams">' + cards + '</div></section>';
}

/** VIEW 3 — coverage. FACTS ONLY (counts and single points of contact), never
 *  a judgement like "understaffed": the block has no idea what the target
 *  staffing is, and a confident-looking verdict drawn from data that cannot
 *  support it is the INV-187 failure mode. */
function kbRosterCoverageHtml_(data) {
  var legend = data.legend, idx = kbRosterPeopleIndex_(data);
  var teamCount = 0, noLead = [];
  data.depts.forEach(function (d) {
    d.teams.forEach(function (t) {
      teamCount++;
      if (!t.people.some(function (p) { return p.lead; })) noLead.push((t.name + (t.sub ? ' › ' + t.sub : '')));
    });
  });
  var byTag = {};
  idx.order.forEach(function (k) {
    idx.byName[k].tags.forEach(function (t) {
      if (!byTag[t]) byTag[t] = { people: [], teams: {} };
      byTag[t].people.push(idx.byName[k].name);
      idx.byName[k].places.forEach(function (pl) { byTag[t].teams[pl.team + (pl.sub ? ' › ' + pl.sub : '')] = 1; });
    });
  });
  var tags = Object.keys(byTag).sort(function (a, b) { return byTag[b].people.length - byTag[a].people.length || (a < b ? -1 : 1); });
  var rows = tags.map(function (t) {
    var e = byTag[t], nTeams = Object.keys(e.teams).length;
    var only = e.people.length === 1;
    return '<tr' + (only ? ' class="is-single"' : '') + '><th scope="row">' + t +
      (legend[t] ? ' <span class="kb-ros-where">' + legend[t] + '</span>' : '') + '</th>' +
      '<td>' + e.people.length + '</td><td>' + nTeams + '</td>' +
      '<td class="kb-ros-where">' + e.people.join(', ') + '</td></tr>';
  }).join('');

  return '<div class="kb-ros-cov">' +
    '<div class="kb-ros-cov-tiles">' +
      '<div class="kb-ros-tile"><b>' + idx.order.length + '</b><span>people</span></div>' +
      '<div class="kb-ros-tile"><b>' + teamCount + '</b><span>teams</span></div>' +
      '<div class="kb-ros-tile"><b>' + data.depts.length + '</b><span>departments</span></div>' +
      '<div class="kb-ros-tile"><b>' + tags.length + '</b><span>capabilities</span></div>' +
    '</div>' +
    (tags.length
      ? '<div class="kb-ros-tablewrap"><table class="kb-ros-table"><thead><tr>' +
          '<th scope="col">Capability</th><th scope="col">People</th><th scope="col">Teams</th><th scope="col">Who</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '') +
    (tags.some(function (t) { return byTag[t].people.length === 1; })
      ? '<div class="kb-ros-note">Rows marked in amber have a single point of contact — one person carries that capability.</div>'
      : '') +
    (noLead.length
      ? '<div class="kb-ros-note">No lead marked on: ' + noLead.join(', ') + '.</div>'
      : '') +
    '</div>';
}

/** VIEW 4 — chart. A node-link tree with PROGRESSIVE DISCLOSURE: departments
 *  collapsed, expand one to see its teams, expand a team to see its people.
 *
 *  The whole tree is rendered and hidden with CSS rather than built on demand,
 *  so expand state lives in the DOM (no re-render, nothing to lose) and the
 *  filter can simply reveal the branches that match.
 *
 *  Why this is legible when a static chart is not: the width of a node-link
 *  tree is set by its WIDEST VISIBLE ROW. Showing all 46 people at once needs
 *  ~90px each — about 4100px, unreadable at every viewport this app supports.
 *  Under disclosure the widest row is the team count of ONE department (9
 *  here), and people stack VERTICALLY inside their team, so opening a team
 *  costs height rather than width.
 *
 *  It shows STRUCTURE, not reporting lines: the source says who is on which
 *  team, and does not say who reports to whom. Drawing person-to-person edges
 *  would assert a relationship the data does not contain. */
function kbRosterChartHtml_(data) {
  var legend = data.legend, seen = {};
  var nodes = data.depts.map(function (d, di) {
    var nPeople = 0;
    d.teams.forEach(function (t) { nPeople += t.people.length; });
    var teams = d.teams.map(function (t, ti) {
      var tid = 'kb-ch-' + di + '-' + ti;
      var label = t.name + (t.sub ? ' <span class="kb-ros-sub">' + t.sub + '</span>' : '');
      var lead = t.people.filter(function (p) { return p.lead; })
        .map(function (p) { return p.name; }).join(', ');
      return '<li class="kb-ros-node" role="treeitem" aria-expanded="false">' +
        '<div class="kb-ros-nodebox is-team">' +
          '<button type="button" class="kb-ros-toggle" aria-expanded="false" aria-controls="' + tid + '" ' +
            'onclick="kbRosterToggleNode_(this)">' + label + '</button>' +
          '<span class="kb-ros-nodemeta">' + t.people.length + ' ' + (t.people.length === 1 ? 'person' : 'people') +
            (lead ? ' · lead ' + lead : '') + '</span>' +
        '</div>' +
        '<ul class="kb-ros-children is-leaves" id="' + tid + '" role="group">' +
          '<li class="kb-ros-people">' +
            t.people.map(function (p) { return kbRosterPersonHtml_(p, legend, null, seen); }).join('') +
          '</li>' +
        '</ul></li>';
    }).join('');
    var did = 'kb-ch-' + di;
    return '<li class="kb-ros-node" role="treeitem" aria-expanded="false">' +
      '<div class="kb-ros-nodebox is-dept">' +
        '<button type="button" class="kb-ros-toggle" aria-expanded="false" aria-controls="' + did + '" ' +
          'onclick="kbRosterToggleNode_(this)">' + d.name + '</button>' +
        '<span class="kb-ros-nodemeta">' + (d.owner ? d.owner + ' · ' : '') +
          d.teams.length + ' teams · ' + nPeople + ' people</span>' +
      '</div>' +
      '<ul class="kb-ros-children" id="' + did + '" role="group">' + teams + '</ul></li>';
  }).join('');
  // The notes sit OUTSIDE the scrolling container: inside it they scrolled
  // away with the tree, so the one explanation of what the view shows
  // disappeared exactly when a wide row made it most needed.
  return '<div class="kb-ros-chart">' +
    '<div class="kb-ros-note">Structure only — the roster records team membership, ' +
      'not who reports to whom. Select a department, then a team.</div>' +
    '<div class="kb-ros-chart-hint">Scroll sideways to see the rest of this row.</div>' +
    '<div class="kb-ros-chartwrap">' +
      '<ul class="kb-ros-tree" role="tree" aria-label="Organisation chart">' + nodes + '</ul>' +
    '</div></div>';
}

/** Expand/collapse is a CLASS toggle plus the matching aria-expanded on BOTH
 *  the treeitem and its button — a class alone is invisible to assistive tech
 *  (INV-174), and these are the disclosure controls the whole view is built
 *  around. */
function kbRosterToggleNode_(btn) {
  var li = btn.closest ? btn.closest('.kb-ros-node') : null;
  if (!li) return;
  var open = !li.classList.contains('open');
  li.classList.toggle('open', open);
  li.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  kbRosterChartOverflow_(btn);
  // Opening a node moves every box below it, so the measured edges must be
  // redrawn or they would point at where things used to be.
  kbRosterDrawEdges_(kbRosterRoot_(btn));
}

/** A department with more teams than fit scrolls sideways inside the chart —
 *  standard for an org chart, but the clipped teams simply looked ABSENT with
 *  no cue. Flag it only when it is actually true, so the hint is never noise. */
function kbRosterChartOverflow_(el) {
  var root = kbRosterRoot_(el);
  var wrap = root ? root.querySelector('.kb-ros-chartwrap') : null;
  if (!wrap) return;
  var chart = root.querySelector('.kb-ros-chart');
  if (chart) chart.classList.toggle('has-overflow', wrap.scrollWidth > wrap.clientWidth + 1);
}

/** VIEW 5 — flow. A roster is org-SHAPED; an order moves through STAGES, and
 *  the two are different questions. A `flow|` line records the sequence, which
 *  the roster itself does not contain — so this view only exists when someone
 *  has written the sequence down. It is never inferred from the sheet's
 *  layout: the order work actually travels in is operational knowledge, and a
 *  guessed process displayed to reps as fact is worse than no diagram.
 *
 *  A stage naming a real team links to it (people count, lead, expandable);
 *  any other stage renders as a plain step, so a flow can include stages that
 *  are not teams at all. */
function kbRosterFlowHtml_(data) {
  var legend = data.legend, seen = {};
  if (!data.phases.length) {
    return '<div class="kb-ros-empty">' +
      '<b>No process flow recorded yet.</b>' +
      '<p>This roster describes who is on which team. To show the order work moves in, ' +
      'add phases and steps — the sequence is yours to state, and is never guessed ' +
      'from the layout:</p>' +
      '<pre class="kb-ros-flowhint">phase| 1. Intake: PPD, MA Education\n' +
      'phase| 2. Qualifications: Qualifications*decision, PT Scheduling\n' +
      'step| PPD -&gt; MA Education\n' +
      'step| Qualifications -&gt; PT Scheduling: Route A — PT Eval needed</pre>' +
      '<p>Mark a branch point with <code>*decision</code>. Use <code>phase| *: Name</code> ' +
      'for something feeding in from outside the phases. A node matching a team name links ' +
      'to that team.</p></div>';
  }

  // Index teams so a node naming one links to its people.
  var byTeam = {};
  data.depts.forEach(function (d) {
    d.teams.forEach(function (t) {
      byTeam[kbRosterKey_(t.name)] = t;
      if (t.sub) byTeam[kbRosterKey_(t.name + ' > ' + t.sub)] = t;
    });
  });
  // Route labels are read off the STEPS, so a node can state what leads out of
  // it without the diagram having to carry the text.
  var outBy = {};
  data.steps.forEach(function (st) {
    var k = kbRosterKey_(st.from);
    (outBy[k] = outBy[k] || []).push(st);
  });

  var nodeHtml = function (n, ri, ci) {
    var t = byTeam[kbRosterKey_(n.name)];
    var id = 'kb-fn-' + kbRosterSlug_(n.name);
    var outs = outBy[kbRosterKey_(n.name)] || [];
    var routes = outs.filter(function (o) { return o.label; });
    return '<div class="kb-ros-fnode' + (n.decision ? ' is-decision' : '') + (t ? ' is-team' : '') + '"' +
        ' id="' + id + '" data-col="' + ci + '" data-row="' + ri + '"' +
        ' data-node="' + kbRosterAttr_(kbRosterKey_(n.name)) + '">' +
      '<div class="kb-ros-fnode-head">' +
        (t
          ? '<button type="button" class="kb-ros-toggle" aria-expanded="false" ' +
              'aria-controls="' + id + '-p" onclick="kbRosterToggleNode_(this)">' + n.name + '</button>'
          : '<span class="kb-ros-toggle is-plain">' + n.name + '</span>') +
        (n.decision ? '<span class="kb-ros-flag is-decision">decision</span>' : '') +
        (n.join ? '<span class="kb-ros-flag is-join">join</span>' : '') +
      '</div>' +
      // An AND-join: several inbound paths, not alternatives. Without this the
      // diagram reads as "any one path proceeds", which is the opposite of a
      // stage that waits for every applicable one.
      (n.join ? '<span class="kb-ros-joinnote">Waits for every applicable path above to complete</span>' : '') +
      (t ? '<span class="kb-ros-nodemeta">' + t.people.length + ' ' +
             (t.people.length === 1 ? 'person' : 'people') + '</span>' : '') +
      (routes.length
        ? '<ul class="kb-ros-routes">' + routes.map(function (o) {
            return '<li><span class="kb-ros-routelbl">' + o.label + '</span> → ' + o.to + '</li>';
          }).join('') + '</ul>'
        : '') +
      (t
        ? '<ul class="kb-ros-children is-leaves" id="' + id + '-p" role="group">' +
            '<li class="kb-ros-people">' +
              t.people.map(function (p) { return kbRosterPersonHtml_(p, legend, null, seen); }).join('') +
            '</li></ul>'
        : '') +
      '</div>';
  };

  var cols = data.phases.map(function (ph, ci) {
    return '<section class="kb-ros-phase' + (ph.external ? ' is-external' : '') + '">' +
      '<h3 class="kb-ros-phase-name">' + (ph.name || 'Feeds in') + '</h3>' +
      '<div class="kb-ros-fnodes">' +
        ph.nodes.map(function (n, ri) { return nodeHtml(n, ri, ci); }).join('') +
      '</div></section>';
  }).join('');

  // The connector layer is drawn AFTER layout, by measuring the boxes CSS has
  // already placed — so the diagram cannot disagree with what is on screen,
  // and no layout engine is needed.
  // A step naming a node no phase declares would just VANISH from the diagram,
  // which would look complete while missing a connection — the reassuring
  // failure this codebase names (INV-187). Say so instead.
  var declared = {};
  data.phases.forEach(function (ph) { ph.nodes.forEach(function (n) { declared[kbRosterKey_(n.name)] = 1; }); });
  var seenD = {}, uniqD = [];
  data.steps.forEach(function (st) {
    [st.from, st.to].forEach(function (x) {
      var k = kbRosterKey_(x);
      if (!declared[k] && !seenD[k]) { seenD[k] = 1; uniqD.push(x); }
    });
  });

  return '<div class="kb-ros-proc" data-proc="1">' +
    '<div class="kb-ros-note">Nodes naming a team open to show its people. ' +
      'Routes are labelled on the node they leave.</div>' +
    (uniqD.length
      ? '<div class="kb-ros-warn" role="alert">' + uniqD.length + ' step(s) name a node no phase declares, ' +
        'so those connections are not drawn: ' + uniqD.join(', ') + '.</div>'
      : '') +
    '<div class="kb-ros-procwrap">' +
      '<svg class="kb-ros-edges" aria-hidden="true"></svg>' +
      '<div class="kb-ros-phases">' + cols + '</div>' +
    '</div></div>';
}

/** PURE: decides what KIND of connector an edge needs, given the two boxes'
 *  geometry and their column/row positions. Extracted because every drawing
 *  bug so far lived in this decision rather than in the path arithmetic —
 *  same-column steps misread as loop-backs, skips drawn as steps, upward
 *  edges pointing at the source — and none of it was testable while it sat
 *  inside a function that needs a real browser layout.
 *    kind: 'step' | 'skip' | 'phaseSkip' | 'forward' | 'back'
 *    down: true when the target sits below the source (same column only) */
function kbRosterEdgeKind_(ra, rb, colA, colB, rowA, rowB, reciprocal) {
  // Classify by LEFT edges: a sibling stacked in the same column always sits
  // left of its parent's RIGHT edge, so a right-vs-left test calls every
  // vertical step a loop-back.
  var sameCol = Math.abs(rb.left - ra.left) < 8;
  if (sameCol) {
    return {
      kind: Math.abs(rowB - rowA) === 1 ? 'step' : 'skip',
      down: rowB > rowA,
      lane: reciprocal ? (rowB > rowA ? -7 : 7) : 0,
    };
  }
  if (rb.left < ra.left - 8) return { kind: 'back', down: true, lane: 0 };
  return { kind: (colB - colA) > 1 ? 'phaseSkip' : 'forward', down: true, lane: 0 };
}

/** Draws the edges by MEASURING the laid-out boxes. Runs after render, on
 *  resize, and after any expand/collapse, because opening a node moves every
 *  box below it. */
function kbRosterDrawEdges_(root) {
  if (!root) return;
  var proc = root.querySelector('.kb-ros-proc');
  var svg = proc && proc.querySelector('.kb-ros-edges');
  var wrap = proc && proc.querySelector('.kb-ros-procwrap');
  if (!svg || !wrap) return;
  var data = kbRosterData_(root);
  var box = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrap.scrollWidth);
  svg.setAttribute('height', wrap.scrollHeight);
  svg.setAttribute('viewBox', '0 0 ' + wrap.scrollWidth + ' ' + wrap.scrollHeight);
  // A CSS attribute selector matches the DECODED attribute value, while the
  // key comes from the (escaped) parse — decode it or a node whose name
  // carries & < > is never found and its edges silently vanish.
  var find = function (name) {
    return proc.querySelector('[data-node="' + kbFenceDecode_(kbRosterKey_(name)).replace(/"/g, '') + '"]');
  };
  // A RECIPROCAL pair (A→B and B→A, e.g. an appointment bouncing between two
  // stages) would draw two opposite arrows on the same line, overlapping into
  // one ambiguous stroke. Offset each side so both remain readable.
  var pairKey = {};
  data.steps.forEach(function (st) { pairKey[kbRosterKey_(st.from) + '\u0000' + kbRosterKey_(st.to)] = 1; });
  var parts = [];
  data.steps.forEach(function (st) {
    var a = find(st.from), b = find(st.to);
    if (!a || !b) return;                      // a step naming an undeclared node
    var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    var ax = ra.right - box.left + wrap.scrollLeft, ay = ra.top - box.top + ra.height / 2 + wrap.scrollTop;
    var bx = rb.left - box.left + wrap.scrollLeft, by = rb.top - box.top + rb.height / 2 + wrap.scrollTop;
    // Classify by the boxes' LEFT edges, not source-right vs target-left: two
    // nodes stacked in the SAME column always have target-left < source-right,
    // so that test called every vertical step a loop-back (8 of 14 here).
    var colA = +(a.getAttribute('data-col') || 0), colB = +(b.getAttribute('data-col') || 0);
    var rowA = +(a.getAttribute('data-row') || 0), rowB = +(b.getAttribute('data-row') || 0);
    var reciprocal = !!pairKey[kbRosterKey_(st.to) + '\u0000' + kbRosterKey_(st.from)];
    var k = kbRosterEdgeKind_(ra, rb, colA, colB, rowA, rowB, reciprocal);
    var sameCol = k.kind === 'step' || k.kind === 'skip';
    var back = k.kind === 'back';
    var skip = k.kind === 'phaseSkip';
    var d, cls = '';
    if (sameCol) {
      var cx = ra.left - box.left + ra.width / 2 + wrap.scrollLeft + k.lane;
      var aTop = ra.top - box.top + wrap.scrollTop, aBot = ra.bottom - box.top + wrap.scrollTop;
      var bTop = rb.top - box.top + wrap.scrollTop, bBot = rb.bottom - box.top + wrap.scrollTop;
      var down = k.down;
      if (k.kind === 'step') {
        // Adjacent siblings: a straight vertical. Drawn source→target so the
        // arrowhead lands on the TARGET even when the edge runs upward — it
        // previously always ended at the topmost box, pointing at the source.
        d = down ? ('M' + cx + ',' + aBot + ' L' + cx + ',' + bTop)
                 : ('M' + cx + ',' + aTop + ' L' + cx + ',' + bBot);
      } else {
        // A SKIP within the column — it passes a node it does not visit, so it
        // arcs around the side. Drawn as a straight vertical it was
        // indistinguishable from the step-by-step chain, which is what made
        // "PAR → Approval" read as "you must pass through Appeals".
        var sx = ra.right - box.left + wrap.scrollLeft + 12;
        var y1 = aTop + ra.height / 2, y2 = bTop + rb.height / 2;
        d = 'M' + (ra.right - box.left + wrap.scrollLeft) + ',' + y1 +
            ' C' + sx + ',' + y1 + ' ' + sx + ',' + y2 + ' ' + (rb.right - box.left + wrap.scrollLeft) + ',' + y2;
        cls = ' is-skip';
      }
    } else if (skip) {
      // Bypasses an entire phase (an order entering past the first stage), so
      // it arcs ABOVE the columns rather than threading between the boxes it
      // does not touch.
      var top2 = Math.min(ra.top, rb.top) - box.top + wrap.scrollTop - 16;
      var axm = ra.left - box.left + ra.width / 2 + wrap.scrollLeft;
      var bxm = rb.left - box.left + rb.width / 2 + wrap.scrollLeft;
      d = 'M' + axm + ',' + (ra.top - box.top + wrap.scrollTop) +
          ' C' + axm + ',' + top2 + ' ' + bxm + ',' + top2 + ' ' + bxm + ',' + (rb.top - box.top + wrap.scrollTop);
      cls = ' is-skip';
    } else if (back) {
      // Route a back-edge UNDER both boxes so it cannot be mistaken for a
      // forward step.
      var ay2 = ra.bottom - box.top + wrap.scrollTop, by2 = rb.bottom - box.top + wrap.scrollTop;
      var low = Math.max(ay2, by2) + 14;
      var axc = ra.left - box.left + ra.width / 2 + wrap.scrollLeft;
      var bxc = rb.left - box.left + rb.width / 2 + wrap.scrollLeft;
      d = 'M' + axc + ',' + ay2 + ' L' + axc + ',' + low + ' L' + bxc + ',' + low + ' L' + bxc + ',' + by2;
    } else {
      var mid = ax + (bx - ax) / 2;
      d = 'M' + ax + ',' + ay + ' C' + mid + ',' + ay + ' ' + mid + ',' + by + ' ' + bx + ',' + by;
    }
    parts.push('<path d="' + d + '" class="kb-ros-edge' + (back ? ' is-back' : '') + cls + '" marker-end="url(#kb-ros-arrow)"/>');
  });
  svg.innerHTML =
    '<defs><marker id="kb-ros-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">' +
      '<path d="M0,0 L8,4 L0,8 z"/></marker></defs>' + parts.join('');
}

function kbRosterBodyHtml_(data, mode) {
  if (mode === 'capabilities') return kbRosterCapabilitiesHtml_(data);
  if (mode === 'coverage') return kbRosterCoverageHtml_(data);
  if (mode === 'chart') return kbRosterChartHtml_(data);
  if (mode === 'flow') return kbRosterFlowHtml_(data);
  return kbRosterTeamsHtml_(data);
}

function kbRosterModeBtn_(mode, key, label) {
  var on = mode === key;
  return '<button type="button" class="kb-ros-mode' + (on ? ' on' : '') + '" role="tab" aria-selected="' + on + '"' +
    ' data-mode="' + key + '" onclick="kbRosterSetMode_(this)">' + label + '</button>';
}

function kbRosterHtml_(text) {
  var data = kbRosterParse_(text);
  var mode = 'teams';
  var total = kbRosterPeopleIndex_(data).order.length;
  var legendHtml = Object.keys(data.legend).length
    ? '<div class="kb-ros-legend">' + Object.keys(data.legend).map(function (k) {
        return '<span class="kb-ros-legend-item"><b>' + k + '</b> ' + data.legend[k] + '</span>';
      }).join('') + '</div>'
    : '';
  // The SOURCE rides on the root so a mode switch can re-render from the same
  // parsed data without re-running kbMd_ over the whole article.
  return '<div class="kb-roster" data-roster="1" data-mode="' + mode + '" data-src="' + kbRosterAttr_(text) + '">' +
    '<div class="kb-ros-bar">' +
      '<input type="search" class="kb-ros-search" placeholder="Filter by team, person or tag…" ' +
        'aria-label="Filter the roster by team, person or tag" oninput="kbRosterFilter_(this)">' +
      '<span class="kb-ros-count" role="status" aria-live="polite">' + total + ' people</span>' +
      '<button type="button" class="kb-ros-expand" onclick="kbRosterExpand_(this)" ' +
        'title="Open this roster full screen">Expand</button>' +
      '<span class="kb-ros-modes" role="tablist" aria-label="Roster view">' +
        kbRosterModeBtn_(mode, 'teams', 'Teams') +
        kbRosterModeBtn_(mode, 'capabilities', 'Capabilities') +
        kbRosterModeBtn_(mode, 'chart', 'Chart') +
        (data.phases.length ? kbRosterModeBtn_(mode, 'flow', 'Flow') : '') +
        kbRosterModeBtn_(mode, 'coverage', 'Coverage') +
      '</span>' +
    '</div>' + legendHtml +
    '<div class="kb-ros-panel" hidden></div>' +
    '<div class="kb-ros-body">' + kbRosterBodyHtml_(data, mode) + '</div>' +
    (data.warnings.length
      ? '<div class="kb-ros-warn">' + data.warnings.length + ' line(s) in this roster block were not understood and are not shown.</div>'
      : '') +
    '</div>';
}

/** The Reference reader is a height-capped panel inside a two-column shell, so
 *  an interactive block ends up in a small window with its own nested
 *  scrollbars. Rather than re-architect that shell (it is right for prose),
 *  the block can open itself nearly full-viewport. The overlay hosts a FRESH
 *  instance built from the same source, so it carries its own filter and view
 *  state and closing it leaves the inline copy exactly as it was. */
function kbRosterExpand_(btn) {
  var root = kbRosterRoot_(btn);
  if (!root) return;
  var src = kbFenceSrc_(root);
  // ensureOverlay (never a hand-rolled overlay — INV-83) so Escape, the focus
  // trap and the focus-restore lifecycle all behave; onClose is idempotent.
  var ov = ensureOverlay('kb-roster-overlay', {
    label: 'Roster',
    onClose: function () { var o = document.getElementById('kb-roster-overlay'); if (o) o.remove(); },
  });
  ov.innerHTML = '<div class="modal kb-roster-modal">' +
    '<div class="kb-roster-modal-head">' +
      '<button type="button" class="kb-btn" onclick="closeOverlay(document.getElementById(\'kb-roster-overlay\'))">Close</button>' +
    '</div>' + kbRosterHtml_(src) + '</div>';
  // The expanded copy has no use for its own Expand button.
  var dup = ov.querySelector('.kb-ros-expand');
  if (dup) dup.remove();
}

function kbRosterRoot_(el) { return el && el.closest ? el.closest('.kb-roster') : null; }

function kbRosterData_(root) {
  // NOT "exactly what kbMd_ handed the renderer" — the DOM decodes EVERY
  // entity on read, &lt; included. kbFenceSrc_ restores the escaped form.
  return kbRosterParse_(kbFenceSrc_(root));
}

function kbRosterSetMode_(btn) {
  var root = kbRosterRoot_(btn);
  if (!root) return;
  var mode = btn.getAttribute('data-mode') || 'teams';
  root.setAttribute('data-mode', mode);
  var btns = root.querySelectorAll('.kb-ros-mode');
  for (var i = 0; i < btns.length; i++) {
    var on = btns[i] === btn;
    btns[i].classList.toggle('on', on);
    btns[i].setAttribute('aria-selected', on ? 'true' : 'false');   // INV-174
  }
  var body = root.querySelector('.kb-ros-body');
  if (body) body.innerHTML = kbRosterBodyHtml_(kbRosterData_(root), mode);
  if (mode === 'flow') setTimeout(function () { kbRosterDrawEdges_(root); }, 0);
  kbRosterClosePanel_(root);
  var search = root.querySelector('.kb-ros-search');
  if (search) kbRosterFilter_(search);      // a mode switch keeps the active filter
  if (typeof animateListSwap_ === 'function') { try { animateListSwap_(body, '.kb-ros-team'); } catch (e) {} }
}

/** Clicking a person opens a detail panel rather than copying, because "where
 *  else does this person work" is the question the grid cannot answer. Copy
 *  moved INTO the panel so both actions stay one click from the name. */
function kbRosterOpenPerson_(btn) {
  var root = kbRosterRoot_(btn);
  if (!root) return;
  // Re-escaped to match the index, which is keyed off the parsed source.
  var name = kbFenceEsc_(btn.getAttribute('data-name') || '');
  var idx = kbRosterPeopleIndex_(kbRosterData_(root));
  var e = idx.byName[name.toLowerCase()];
  var panel = root.querySelector('.kb-ros-panel');
  if (!panel || !e) return;
  var legend = kbRosterData_(root).legend;
  var places = e.places.map(function (pl) {
    return '<li>' + pl.team + (pl.sub ? ' <span class="kb-ros-sub">' + pl.sub + '</span>' : '') +
      ' <span class="kb-ros-where">' + pl.dept + '</span></li>';
  }).join('');
  panel.innerHTML =
    '<div class="kb-ros-panel-head">' +
      '<b>' + e.name + '</b>' + kbRosterFlags_(e, legend) +
      '<span class="kb-ros-panel-actions">' +
        '<button type="button" class="kb-btn kb-ros-copy" data-name="' + kbRosterAttr_(e.name) + '" ' +
          'onclick="kbRosterCopy_(this)">Copy name</button>' +
        '<button type="button" class="kb-btn" onclick="kbRosterClosePanel_(this)" aria-label="Close details">Close</button>' +
      '</span>' +
    '</div>' +
    (e.tags.length ? '<div class="kb-ros-panel-tags">' +
      e.tags.map(function (t) { return kbRosterTagChip_(t, legend, true); }).join('') + '</div>' : '') +
    '<div class="kb-ros-panel-where">On ' + e.places.length + ' team' + (e.places.length === 1 ? '' : 's') +
      ':<ul>' + places + '</ul></div>';
  panel.hidden = false;
  panel.setAttribute('tabindex', '-1');
  try { panel.focus(); } catch (err) {}
}

function kbRosterClosePanel_(elOrRoot) {
  var root = (elOrRoot && elOrRoot.classList && elOrRoot.classList.contains('kb-roster'))
    ? elOrRoot : kbRosterRoot_(elOrRoot);
  var panel = root ? root.querySelector('.kb-ros-panel') : null;
  if (!panel) return;
  panel.hidden = true;
  panel.innerHTML = '';
}

/** Clicking a tag asks "who else can do this" — it drives the same filter box
 *  the rep would have typed into, so the two paths cannot diverge. */
function kbRosterTagFilter_(btn) {
  var root = kbRosterRoot_(btn);
  if (!root) return;
  var tag = btn.getAttribute('data-tag') || '';
  var search = root.querySelector('.kb-ros-search');
  if (!search) return;
  // A `tag:` query matches the tag EXACTLY. A bare substring would be far too
  // loose for the short tags this data uses: filtering on "C" also matches
  // "Medical Review" and "Insurance Change" — 42 of 46 people.
  var q = 'tag:' + tag;
  search.value = (String(search.value || '').trim().toLowerCase() === q.toLowerCase()) ? '' : q;
  kbRosterFilter_(search);
  try { search.focus(); } catch (e) {}
}

/** Filters in place — hiding non-matching people, then teams and departments
 *  left with nothing. No re-render, so the article around it is untouched. */
function kbRosterFilter_(input) {
  var root = kbRosterRoot_(input);
  if (!root) return;
  var q = String(input.value || '').trim().toLowerCase();
  // The coverage view is an aggregate of the WHOLE roster; filtering it to a
  // subset would report totals that quietly describe only part of the team.
  var mode = root.getAttribute('data-mode');
  // Every view that is NOT the dept/team grid must bypass the row-counting
  // walk, or it reports 0. This is the third time a new view has hit it, so
  // the condition is now "not the grid" rather than a list of view names.
  if (mode && mode !== 'teams' && mode !== 'capabilities') {
    var cnt0 = root.querySelector('.kb-ros-count');
    if (cnt0) cnt0.textContent = q ? 'filter applies to Teams and Capabilities' : (kbRosterPeopleIndex_(kbRosterData_(root)).order.length + ' people');
    return;
  }
  var shown = 0, seen = {};
  var tm = q.match(/^tag:\s*(.+)$/);
  var tagNeedle = tm ? '|' + tm[1].trim() + '|' : '';
  var depts = root.querySelectorAll('.kb-ros-dept');
  for (var d = 0; d < depts.length; d++) {
    var deptName = depts[d].getAttribute('data-dept') || '';
    var teams = depts[d].querySelectorAll('.kb-ros-team');
    var deptHit = 0;
    for (var t = 0; t < teams.length; t++) {
      var teamName = teams[t].getAttribute('data-team') || '';
      // A query matching the TEAM (or its department) keeps the whole team —
      // "who is on PT Eval" is as common a question as "where is Sergio".
      // In tag mode a TEAM never matches — only the people carrying the tag.
      var teamMatch = tagNeedle ? false : (!q || teamName.indexOf(q) >= 0 || deptName.indexOf(q) >= 0);
      var people = teams[t].querySelectorAll('.kb-ros-person');
      var teamHit = 0;
      for (var i = 0; i < people.length; i++) {
        var hit = tagNeedle
          ? (people[i].getAttribute('data-tags') || '').indexOf(tagNeedle) >= 0
          : (teamMatch || (people[i].getAttribute('data-hay') || '').indexOf(q) >= 0);
        people[i].style.display = hit ? '' : 'none';
        if (hit) { teamHit++; seen[people[i].getAttribute('data-name') || ''] = 1; }
      }
      teams[t].style.display = teamHit ? '' : 'none';
      deptHit += teamHit;
      shown += teamHit;
    }
    depts[d].style.display = deptHit ? '' : 'none';
  }
  // Report DISTINCT people in every mode. This previously mixed units —
  // distinct on first paint, visible ROWS after a filter or mode switch — so
  // the capability view (a person appears once per tag) read "49 people" for a
  // 46-person roster.
  var n = 0;
  for (var k in seen) { if (Object.prototype.hasOwnProperty.call(seen, k)) n++; }
  var count = root.querySelector('.kb-ros-count');
  if (count) count.textContent = n + (q ? ' matching' : ' people');
}

/** Click a name in the panel to copy it — the rep is usually about to type it
 *  into the phone system or the CRM. */
function kbRosterCopy_(btn) {
  var name = btn && btn.getAttribute ? btn.getAttribute('data-name') : '';
  if (!name) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(name);
    else if (typeof cnFallbackCopy_ === 'function') cnFallbackCopy_(name);
  } catch (e) {}
  if (typeof flashCopied === 'function') flashCopied(btn);
  else if (typeof showToast === 'function') showToast('Copied ' + name, 'toast-success');
}

function kbMd_(src) {
  src = String(src == null ? '' : src).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  var blocks = [];
  var hSeen = {};   // duplicate-heading id dedup - same -2/-3 walk as kbSplitSections_
  // C17 batch-4: BLOCK fences only — the opening ``` must start a line and
  // the closing ``` must sit alone on its line. The old any-occurrence regex
  // also matched a MID-LINE pair of triple-backticks, stashing its content
  // into a block whose sentinel token then sat mid-paragraph — and only
  // WHOLE-LINE tokens are re-expanded below, so the content silently vanished
  // and the paragraph rendered a stray "C0" glyph. An inline pair now stays
  // literal (escaped) text: content preserved, nothing to re-expand.
  src = src.replace(/(^|\n)[ \t]*```([^\n]*)\n([\s\S]*?)\n[ \t]*```(?=[ \t]*(?:\n|$))/g, function (_, lead, infoLine, code) {
    // A `snippet` info-string (```snippet  or  ```snippet: Label) renders a
    // copy-to-clipboard "canned response" card (#6); any other fence stays a
    // <pre><code> block (unchanged, incl. the LEGACY body shape — info line +
    // trailing newline — so existing articles render byte-identically). The
    // captured content is already HTML-escaped (the top-level escape ran
    // first), so both paths are inert.
    var info = infoLine.trim();
    var sm = info.match(/^snippet\b\s*:?\s*(.*)$/i);
    // A `roster` fence renders the interactive directory (operator 2026-08-11);
    // same safety argument as snippet — the content is already escaped, so the
    // app draws interactive markup around inert text.
    var rm = info.match(/^roster\b/i);
    var gm = info.match(/^glossary\b/i);
    var dm = info.match(/^decision\b/i);
    var mm = info.match(/^map\b/i);
    if (sm) blocks.push({ snippet: true, label: sm[1].trim(), body: code });
    else if (rm) blocks.push({ roster: true, body: code });
    else if (gm) blocks.push({ glossary: true, body: code });
    else if (dm) blocks.push({ decision: true, body: code });
    else if (mm) blocks.push({ map: true, body: code });
    else blocks.push({ snippet: false, body: infoLine + '\n' + code + '\n' });
    return lead + '\u0000C' + (blocks.length - 1) + '\u0000'; });
  function inline(t) {
    // Emphasis / inline-code, factored out so it can run on link TEXT at
    // generation time (below) while the generated <a>/<img> MARKUP is stashed
    // past the outer pass (F cycle-8). Previously these ran over the whole
    // string AFTER link/image generation, so a URL containing ** or a backtick
    // (e.g. [x](https://h/a**b**c)) got <strong>/<code> injected INSIDE the
    // href/src attribute → a broken link. Link text keeps its emphasis; the URL
    // is protected. (Inert regardless — quotes are percent-encoded — but this
    // renders correctly.)
    function emph(x) {
      x = x.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      x = x.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
      x = x.replace(/`([^`]+)`/g, '<code>$1</code>');
      return x;
    }
    var stash = [];
    function keep(html) { stash.push(html); return '\u0000L' + (stash.length - 1) + '\u0000'; }
    // Images BEFORE links (otherwise the link rule renders the [alt](url)
    // part as an anchor with a stray "!"). http(s) only - no mailto for an
    // img src. Quotes are percent-encoded in the URL and entity-escaped in
    // the alt: the top-level escape covers &/</> but NOT quotes, so either
    // attribute could otherwise be broken out of (same guard as link href).
    // alt is an attribute → NO emphasis; the whole element is stashed.
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, url) {
      if (!/^https?:/i.test(url)) return alt;
      url = url.replace(/"/g, '%22').replace(/'/g, '%27');
      alt = alt.replace(/"/g, '&quot;');
      return keep('<a href="' + url + '" target="_blank" rel="noopener" class="kb-img-lnk">' +
        '<img src="' + url + '" alt="' + alt + '" loading="lazy"></a>');
    });
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, txt, url) {
      if (!/^(https?:|mailto:)/i.test(url)) return txt;
      // The top-level escape covers &, <, > but NOT quotes — a `"` in the URL
      // would otherwise break out of the href attribute (attribute injection,
      // e.g. an onmouseover handler). Percent-encode both quote characters.
      url = url.replace(/"/g, '%22').replace(/'/g, '%27');
      return keep('<a href="' + url + '" target="_blank" rel="noopener">' + emph(txt) + '</a>');
    });
    t = emph(t);
    // Restore the stashed link/image markup (the emphasis pass above can no
    // longer reach inside its attributes).
    t = t.replace(/\u0000L(\d+)\u0000/g, function (_, n) { return stash[+n]; });
    return t;
  }
  // Split a GFM table row into cells. \| escapes a literal pipe inside a
  // cell (the Doc converter emits that); \u0001 can't appear in the escaped
  // source, so it's a safe sentinel.
  function tableCells(row) {
    row = row.replace(/\\\|/g, '\u0001').trim().replace(/^\|/, '').replace(/\|$/, '');
    return row.split('|').map(function (c) { return c.replace(/\u0001/g, '|').trim(); });
  }
  var lines = src.split(/\r?\n/), html = '', i = 0;
  while (i < lines.length) {
    var ln = lines[i];
    var cm = ln.trim().match(/^\u0000C(\d+)\u0000$/);
    if (cm) { var blk = blocks[+cm[1]]; if (blk && blk.roster) { html += kbRosterHtml_(blk.body); i++; continue; }
      if (blk && blk.glossary) { html += kbGlossaryHtml_(blk.body); i++; continue; }
      if (blk && blk.decision) { html += kbDecideHtml_(blk.body, []); i++; continue; }
      if (blk && blk.map) { html += kbMapHtml_(blk.body); i++; continue; } if (blk && blk.snippet) { html += '<div class="kb-snippet"><div class="kb-snippet-head"><span class="kb-snippet-label">' + (blk.label || 'Snippet') + '</span><button type="button" class="kb-snippet-copy" onclick="kbCopySnippet_(this)">Copy</button></div><pre class="kb-snippet-body">' + blk.body + '</pre></div>'; } else { html += '<pre><code>' + (blk ? blk.body : '') + '</code></pre>'; } i++; continue; }
    if (/^\s*$/.test(ln)) { i++; continue; }
    var h = ln.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      var lvl = h[1].length;
      var hid = kbSlug_(h[2]);
      if (hid) { hSeen[hid] = (hSeen[hid] || 0) + 1; if (hSeen[hid] > 1) hid += '-' + hSeen[hid]; }
      html += '<h' + lvl + (hid ? ' id="kb-h-' + hid + '"' : '') + '>' + inline(h[2]) + '</h' + lvl + '>';
      i++; continue;
    }
    // GFM table: a |-prefixed header line followed by a |---|:---:| separator
    // line (dashes/colons/pipes/spaces only, at least one dash). Body rows
    // clamp to the header's column count.
    if (/^\s*\|/.test(ln) && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && /-/.test(lines[i + 1])) {
      var headCells = tableCells(ln);
      var aligns = tableCells(lines[i + 1]).map(function (sep) {
        var al = /^:/.test(sep), ar = /:$/.test(sep);
        return al && ar ? 'center' : (ar ? 'right' : (al ? 'left' : ''));
      });
      var tbl = '<table><thead><tr>';
      headCells.forEach(function (c, ci) {
        tbl += '<th' + (aligns[ci] ? ' style="text-align:' + aligns[ci] + '"' : '') + '>' + inline(c) + '</th>';
      });
      tbl += '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        var cells = tableCells(lines[i]);
        tbl += '<tr>';
        for (var ci2 = 0; ci2 < headCells.length; ci2++) {
          tbl += '<td' + (aligns[ci2] ? ' style="text-align:' + aligns[ci2] + '"' : '') + '>' +
            inline(cells[ci2] == null ? '' : cells[ci2]) + '</td>';
        }
        tbl += '</tr>';
        i++;
      }
      tbl += '</tbody></table>';
      html += tbl;
      continue;
    }
    if (/^\s*[-*]\s+/.test(ln)) { html += '<ul>'; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { html += '<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'; i++; } html += '</ul>'; continue; }
    if (/^\s*\d+\.\s+/.test(ln)) { html += '<ol>'; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { html += '<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'; i++; } html += '</ol>'; continue; }
    if (/^\s*>\s?/.test(ln)) { html += '<blockquote>'; while (i < lines.length && /^\s*>\s?/.test(lines[i])) { html += inline(lines[i].replace(/^\s*>\s?/, '')) + ' '; i++; } html += '</blockquote>'; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(ln)) { html += '<hr>'; i++; continue; }
    var para = ln; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s/.test(lines[i]) && !/^\s*>/.test(lines[i]) && !/^\s*\|/.test(lines[i]) && !/^\u0000C\d+\u0000$/.test(lines[i].trim())) { para += ' ' + lines[i]; i++; }
    html += '<p>' + inline(para) + '</p>';
  }
  return html;
}

// #6 — copy a "canned response" snippet to the clipboard. Reads the sibling
// <pre>'s textContent (the browser decodes the HTML entities kbMd_ escaped back
// to raw text), so the paste is the original snippet, not the escaped markup.
function kbCopySnippet_(btn) {
  var card = btn && btn.closest ? btn.closest('.kb-snippet') : null;
  var pre = card ? card.querySelector('.kb-snippet-body') : null;
  var text = pre ? pre.textContent : '';
  var done = function () {
    if (!btn.getAttribute('data-lbl')) btn.setAttribute('data-lbl', btn.textContent);
    btn.textContent = 'Copied ✓';
    setTimeout(function () { btn.textContent = btn.getAttribute('data-lbl') || 'Copy'; }, 1500);
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { kbLinkCardCopyFallback_(text); done(); });
    } else { kbLinkCardCopyFallback_(text); done(); }
  } catch (e) { kbLinkCardCopyFallback_(text); done(); }
}

function enterReferenceView(area) {
  if (typeof stopClock === 'function') stopClock();
  area = area || document.getElementById('view-area');
  if (!area) return;
  area.innerHTML =
    '<div class="view-title-row"><h1 class="view-title">Reference</h1></div>' +
    '<div class="kb-wrap">' +
      '<div class="kb-side">' +
        '<input type="text" id="kb-search" placeholder="Search reference…" autocomplete="off" aria-label="Search reference">' +
        '<div id="kb-tree">' + loSweep() + '</div>' +
      '</div>' +
      '<div class="kb-main" id="kb-main">' + loSweep() + '</div>' +
    '</div>';
  KB_STATE.currentId = null; KB_STATE.landing = true;

  var requested = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      var el = document.getElementById('kb-tree'); if (!el) return;
      // A12/INV-175: `.kb-empty` is the designed EMPTY card (used for "No
      // prior versions yet", "This item is an embedded Drive doc"), so a failed
      // load rendered as ordinary emptiness. No outer esc() — the helper escapes.
      if (!res || res.error) { el.innerHTML = errorStateHtml_((res && res.error) || 'Failed to load'); return; }
      KB_STATE.tree = res.items || []; KB_STATE.isManager = !!res.isManager; KB_STATE.isAdmin = !!res.isAdmin;
      kbRenderTree_();
      if (KB_STATE.landing) kbRenderLanding_();
      if (KB_STATE.isManager) { kbLoadUsageBlock_(); kbLoadReviewDueBlock_(); kbLoadContentRequestsBlock_(); }
    })
    .withFailureHandler(function (err) { if (currentView === requested) { var el = document.getElementById('kb-tree'); if (el) el.innerHTML = errorStateHtml_(err.message || err); } })   // A12
    .getReferenceTree();

  var si = document.getElementById('kb-search');
  if (si) { var t; si.addEventListener('input', function () { clearTimeout(t); var v = si.value; t = setTimeout(function () { kbDoSearch_(v); }, 250); }); }
}

// #8 — admin-only search-synonym editor (one group per line, comma-separated).
function kbOpenSynonyms_() {

// On this domain Workspace policy blocks the KB Images folder's link sharing,

        var mk = document.createElement('mark');
        mk.className = 'kb-hl';
        mk.textContent = m[0];
        frag.appendChild(mk);
        last = m.index + m[0].length;
      }
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      textNode.parentNode.replaceChild(frag, textNode);
    });
  } catch (_) {}
}

function kbChunkGroupsHtml_(results, openFn) {
  var html = '';
  kbGroupResults_(results).forEach(function (g) {
    html += '<div class="kb-chunk-doc">' +
      '<button class="kb-chunk-doc-h" onclick="' + openFn + '(this.getAttribute(\'data-kb-id\'))" data-kb-id="' + esc(g.id) + '">' +
      icon(kbItemIcon_(g), 13) + ' <span class="kb-chunk-doc-t">' + esc(g.title) + '</span>' +
      // C17 batch-5: an admin's search showed a DRAFT chunk identically to a
      // published one — the doc header now carries the same Draft pill as
      // the tree/reader (reps never receive draft hits, so this renders
      // only for admins).
      (g.status === 'draft' ? '<span class="kb-draft-pill">Draft</span>' : '') +
      '<span class="kb-snip">' + esc(g.department) + (g.type === 'embed' ? ' \u00b7 Drive' : '') + '</span></button>';
    g.chunks.forEach(function (c) {
      html += '<div class="kb-chunk">' +
        '<div class="kb-chunk-h"><span>' + (c.heading ? esc(c.heading) : 'Intro') + '</span>' +
        '<button class="kb-chunk-go" data-kb-id="' + esc(c.id) + '" data-kb-anchor="' + esc(c.anchor || '') + '" ' +
        'onclick="' + openFn + '(this.getAttribute(\'data-kb-id\'), this.getAttribute(\'data-kb-anchor\'))">Open \u00b6</button></div>' +
        (c.chunkMd ? '<div class="kb-article kb-chunk-body">' + kbMd_(c.chunkMd) +
          (c.truncated ? '<div class="kb-snip">\u2026 continues in the article</div>' : '') + '</div>' : '') +
        '</div>';
    });
    html += '</div>';
  });
  return html;
}

/** Scroll the opened article to a section anchor (slug charset [a-z0-9-],
 *  query-safe) and flash the heading so the eye lands on it. */
function kbScrollToAnchor_(host, anchor) {
  if (!host || !anchor) return;
  try {
    var el = host.querySelector('#kb-h-' + anchor);
    if (!el) return;
    el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    el.classList.add('kb-h-flash');
    setTimeout(function () { el.classList.remove('kb-h-flash'); }, 1600);
  } catch (e) {}
}

function kbDoSearch_(q) {
  q = String(q || '').trim();
  if (q.length < 2) { kbRenderTree_(); if (!KB_STATE.currentId) { KB_STATE.landing = true; kbRenderLanding_(); } return; }
  var el = document.getElementById('kb-tree'); if (!el) return;
  var requested = currentView;
  // L13 — sequence counter (the drawer's kbDrawerSearch_ pattern): two
  // overlapping searches over 300–800ms RPCs can resolve out of order, and
  // the stale response would render last under the newer query.
  var seq = (KB_STATE.searchSeq = (KB_STATE.searchSeq || 0) + 1);
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      if (seq !== KB_STATE.searchSeq) return;   // a newer search superseded this one
      // #8 — cache the full result set so the type/department filters re-render
      // client-side without re-querying.
      KB_STATE.searchResults = (res && res.results) || [];
      KB_STATE.searchQuery = q;
      KB_STATE.searchFilterType = 'all';
      KB_STATE.searchFilterDept = '';
      kbRenderSearchResults_();
    })
    .withFailureHandler(function (err) {
      // F(cycle-8): was fully silent — a rep typing a query on a flaky
      // connection saw the previous tree/panel with zero feedback ("nothing
      // happened"). Same guards as success so a stale failure stays quiet.
      if (currentView !== requested || seq !== KB_STATE.searchSeq) return;
      showToast('Reference search failed — check your connection and try again', 'toast-error');
    })
    .searchReference(q);
}

// #8 — render the (filtered) search results into both the tree column + main
// panel. Reads KB_STATE.searchResults + the type/dept filters; no re-query.
function kbRenderSearchResults_() {
  var el = document.getElementById('kb-tree'); if (!el) return;
  var q = KB_STATE.searchQuery || '';
  var all = KB_STATE.searchResults || [];
  var ftype = KB_STATE.searchFilterType || 'all';
  var fdept = KB_STATE.searchFilterDept || '';
  var results = all.filter(function (r) {
    if (ftype === 'article' && r.type !== 'article') return false;
    if (ftype === 'embed' && r.type !== 'embed') return false;
    if (fdept && r.department !== fdept) return false;
    return true;
  });
  var groups = kbGroupResults_(results);
  var html = kbAddBtnHtml_() + '<div class="kb-dept-h">Search · ' + esc(q) + ' (' + groups.length + ')</div>';
  if (!results.length) html += '<div class="kb-empty">No matches' + (ftype !== 'all' || fdept ? ' with these filters' : '') + '.</div>';
  groups.forEach(function (g) {
    html += '<button class="kb-item" data-kb-id="' + esc(g.id) + '" onclick="kbOpenItem_(this.getAttribute(\'data-kb-id\'))"><span>' + esc(g.title) + '</span></button>';
    g.chunks.forEach(function (c) {
      html += '<button class="kb-item kb-item-sec" data-kb-id="' + esc(c.id) + '" data-kb-anchor="' + esc(c.anchor || '') + '" ' +
        'onclick="kbOpenItem_(this.getAttribute(\'data-kb-id\'), this.getAttribute(\'data-kb-anchor\'))"><span>' +
        (c.heading ? esc(c.heading) : 'Intro') + '</span></button>';
    });
  });
  el.innerHTML = html;
  var main = document.getElementById('kb-main');
  if (main) {
    KB_STATE.currentId = null; KB_STATE.landing = false;
    main.innerHTML = '<div class="kb-item-head"><h2>Results for "' + esc(q) + '"</h2></div>' +
      kbSearchFilterBarHtml_(all) +
      (results.length ? kbChunkGroupsHtml_(results, 'kbOpenItem_')
        : (all.length ? '<div class="kb-empty">No matches with these filters.</div>' : kbNoResultsHtml_(q)));
    kbHighlightTerms_(main, q);
  }
}

// #8 — type (All / Articles / Embeds) + department filter bar over the results.
function kbSearchFilterBarHtml_(all) {
  if (!all.length) return '';
  var ftype = KB_STATE.searchFilterType || 'all';
  var fdept = KB_STATE.searchFilterDept || '';
  var counts = { all: all.length, article: 0, embed: 0 };
  var depts = {};
  all.forEach(function (r) {
    if (r.type === 'embed') counts.embed++; else counts.article++;
    if (r.department) depts[r.department] = 1;
  });
  var chip = function (key, label, n) {
    return '<button class="kb-fchip' + (ftype === key ? ' on' : '') + '" onclick="kbSetSearchFilter_(\'type\', \'' + key + '\')">' +
      esc(label) + ' <span class="kb-fchip-n">' + n + '</span></button>';
  };
  var deptKeys = Object.keys(depts).sort();
  var deptSel = deptKeys.length > 1
    ? '<select class="kb-fdept" aria-label="Filter results by department" onchange="kbSetSearchFilter_(\'dept\', this.value)"><option value="">All departments</option>' +
        deptKeys.map(function (d) { return '<option value="' + esc(d) + '"' + (fdept === d ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('') +
      '</select>'
    : '';
  return '<div class="kb-filterbar">' + chip('all', 'All', counts.all) + chip('article', 'Articles', counts.article) + chip('embed', 'Embeds', counts.embed) + deptSel + '</div>';
}
function kbSetSearchFilter_(kind, val) {
  if (kind === 'type') KB_STATE.searchFilterType = val;
  else if (kind === 'dept') KB_STATE.searchFilterDept = val;
  kbRenderSearchResults_();
}

// #1 — content-gap surfacing: a zero-result search offers to request an article.
// A deliberate rep action (not raw query logging) → PHI-clean by construction.
function kbNoResultsHtml_(q) {
  return '<div class="kb-gap">' +
    '<div>No matches for “' + esc(q) + '”.</div>' +
    '<button class="kb-btn" data-q="' + esc(q) + '" onclick="kbRequestArticlePrompt_(this.getAttribute(\'data-q\'))">' +
      icon('plus', 13) + ' Request an article on this</button>' +
  '</div>';
}
function kbRequestArticlePrompt_(query) {
  query = query || '';
  uiPrompt({
    title: 'Request an article',
    message: 'Ask a manager to add this to the Reference library. Describe the topic — not patient specifics (no names, TRX, or PHI).',
    initialValue: query,
    placeholder: 'What did you need to look up?',
    confirmLabel: 'Send request',
    validator: function (v) { return String(v || '').trim() ? '' : 'Describe what you were looking for.'; },
  }).then(function (topic) {
    if (topic === null) return;   // cancelled
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.success) { if (typeof showToast === 'function') showToast('Request sent — thanks', 'success'); }
        else if (typeof showToast === 'function') showToast((r && r.error) || 'Could not send request', 'error');
      })
      .withFailureHandler(function (e) { if (typeof showToast === 'function') showToast((e && e.message) || 'Could not send request', 'error'); })
      .kbRequestArticle(topic, '', query);
  });
}

function kbOpenItem_(id, anchor) {
  KB_STATE.currentId = id; KB_STATE.landing = false;
  document.querySelectorAll('.kb-item').forEach(function (b) {
    // A11 rule: the open article is navigational state — expose it, don't just paint it.
    var on = b.getAttribute('data-kb-id') === id;
    b.classList.toggle('on', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  var main = document.getElementById('kb-main'); if (!main) return;
  main.innerHTML = loSweep();
  var requested = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      // F(L-18): two rapid item clicks can resolve out of order (the seq-guard
      // class this file already fixes for search/suggest) — a stale first
      // response painted item A while the tree highlighted item B, and the
      // feedback bar / bookmark star carried A's id.
      if (KB_STATE.currentId !== id) return;
      if (!res || res.error) { main.innerHTML = errorStateHtml_((res && res.error) || 'Failed to load this item'); return; }   // A12
      kbPanelRecordOpen_(res, 'reference');
      kbRenderItem_(res);
      kbLoadRelated_(id);   // #7 — "See also" from co-views
      kbLoadComments_(id);  // Phase A (pilot round 3 #6) — comment thread
      if (anchor) kbScrollToAnchor_(document.getElementById('kb-main'), anchor);
    })
    .withFailureHandler(function (err) { if (currentView === requested && KB_STATE.currentId === id) main.innerHTML = errorStateHtml_(err.message || err); })   // A12
    .getReferenceItem(id);
}

function kbRenderItem_(item) {
  var main = document.getElementById('kb-main'); if (!main) return;
  var mgr = KB_STATE.isAdmin;   // Convert/Edit/Delete are admin-gated authoring
  // Phase 2 — managers can convert a Doc embed into a native markdown article
  // (review-before-save: the converter only pre-fills the editor).
  // A SHEET embed is the weakest item in the KB — search treats every embed as
  // a title-only hit and the Ctrl/⌘+K drawer can't host an iframe — so the
  // sheet converter is offered on the same button (operator 2026-08-11).
  var convertKind = (mgr && item.type === 'embed' && (item.driveKind === 'doc' || item.driveKind === 'sheet'))
    ? item.driveKind : '';
  var convertBtn = convertKind
    ? '<button class="kb-btn" onclick="kbConvertItem_(\'' + esc(item.id) + '\', \'' + convertKind + '\')">' +
        icon('refresh', 13) + ' Convert to article</button>'
    : '';
  // #4 — draft→publish + revision history (admin authoring affordances).
  var isDraft = item.status === 'draft';
  var publishBtn = (mgr && isDraft)
    ? '<button class="kb-btn" style="background:var(--accent);color:#fff;border-color:var(--accent)" onclick="kbPublishItem_(\'' + esc(item.id) + '\')">' + icon('check', 13) + ' Publish</button>'
    : '';
  var historyBtn = mgr
    ? '<button class="kb-btn" onclick="kbOpenRevisions_(\'' + esc(item.id) + '\')">' + icon('list', 13) + ' History</button>'
    : '';
  var actions =
    kbBookmarkBtnHtml_(item) +   // #5 — bookmark star (all users)
    (item.type === 'embed' ? '<a class="kb-btn" href="' + esc(item.openUrl) + '" target="_blank" rel="noopener">' + icon('popOut', 13) + ' Open in new tab</a>' : '') +
    convertBtn +
    (mgr ? '<button class="kb-btn" onclick="kbOpenEditor_(\'' + esc(item.id) + '\')">' + icon('adjust', 13) + ' Edit</button>' +
           historyBtn + publishBtn +
           '<button class="kb-btn danger" onclick="kbDeleteItem_(\'' + esc(item.id) + '\')">' + icon('trash', 13) + ' Delete</button>' : '');
  var draftBanner = (mgr && isDraft)
    ? '<div class="kb-draft-banner">' + icon('warning', 13) + ' Draft — hidden from reps until you publish it.</div>'
    : '';
  var head = '<div class="kb-item-head"><h2>' + esc(item.title) + (isDraft ? ' <span class="kb-draft-pill">Draft</span>' : '') + '</h2><div class="kb-item-actions">' + actions + '</div></div>';
  if (item.type === 'embed') {
    main.innerHTML = head + draftBanner + '<iframe class="kb-embed" src="' + esc(item.embedUrl) + '"></iframe>' + kbFeedbackBarHtml_(item) + '<div id="kb-related"></div><div id="kb-comments"></div>';
  } else {
    main.innerHTML = head + draftBanner + '<div class="kb-article">' + kbMd_(item.bodyMd || '') + '</div>' + kbFeedbackBarHtml_(item) + '<div id="kb-related"></div><div id="kb-comments"></div>';
    kbGlossaryAnnotate_(main);
  }
}

// ── Reference comments, Phase A (pilot round 3 #6) ──────────────────────────
// A visible per-article comment thread below the reader — the discussion
// complement to the private feedback bar. Reference TAB only (the Ctrl/⌘+K
// drawer stays comment-free — it's the mid-call surface; the INV-139
// drawer-parity follow-on shape). Best-effort load; a failed fetch renders
// the warn card (A12/INV-175), never an empty thread.
function kbLoadComments_(id) {
  var requested = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      if (KB_STATE.currentId !== id) return;   // the L-18 stale-item guard
      var host = document.getElementById('kb-comments'); if (!host) return;
      if (!res || res.error) { host.innerHTML = errorStateHtml_((res && res.error) || 'Comments failed to load'); return; }
      kbRenderComments_(host, id, res);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requested || KB_STATE.currentId !== id) return;
      var host = document.getElementById('kb-comments');
      if (host) host.innerHTML = errorStateHtml_((err && err.message) || 'Comments failed to load');
    })
    .kbGetComments(id);
}

function kbCommentFmt_(atMs) {
  try {
    return new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      .format(new Date(Number(atMs)));
  } catch (e) { return ''; }
}

function kbRenderComments_(host, id, res) {
  var list = res.comments || [];
  var capNote = (res.total > list.length)
    ? '<div class="kb-cmt-cap mono">showing ' + list.length + ' of ' + res.total + '</div>' : '';
  var rows = list.map(function (c) {
    var canDelete = c.mine || res.canModerate;
    var del = canDelete
      ? '<button class="kb-cmt-del" data-kb-cmt="' + esc(c.commentId) + '" aria-label="Remove comment by ' + esc(c.name) + '"' +
        ' title="Remove this comment" onclick="kbDeleteComment_(this, \'' + esc(id) + '\')">' + icon('x', 12) + '</button>'
      : '';
    return '<div class="kb-cmt">' +
      '<div class="kb-cmt-meta"><span class="kb-cmt-name">' + esc(c.name) + (c.mine ? ' <span class="kb-cmt-you">you</span>' : '') + '</span>' +
        '<span class="kb-cmt-when">' + esc(kbCommentFmt_(c.atMs)) + '</span>' + del + '</div>' +
      '<div class="kb-cmt-text">' + esc(c.text) + '</div>' +
    '</div>';
  }).join('');
  host.innerHTML =
    '<div class="kb-comments">' +
      '<h3 class="kb-cmt-h">' + icon('list', 13) + ' Comments' + (res.total ? ' · ' + res.total : '') + '</h3>' +
      (rows || '<div class="kb-cmt-none">No comments yet.</div>') + capNote +
      '<div class="kb-cmt-add">' +
        '<label for="kb-cmt-input" class="kb-cmt-lbl">Add a comment</label>' +
        '<textarea id="kb-cmt-input" maxlength="2000" rows="2" placeholder="A correction, a tip, a question for the team…"></textarea>' +
        '<div class="kb-cmt-foot">' +
          '<span class="kb-cmt-phi">Reference is PHI-free by policy — never a patient name or detail.</span>' +
          '<button class="kb-btn" data-kb-item="' + esc(id) + '" onclick="kbAddComment_(this)">' + icon('send', 12) + ' Post</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function kbAddComment_(btn) {
  var id = btn.getAttribute('data-kb-item');
  var input = document.getElementById('kb-cmt-input');
  var text = input ? String(input.value || '').trim() : '';
  if (!text) { showToast('Write a comment first', 'toast-warn'); return; }
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (r) {
      btn.disabled = false;
      if (!r || !r.success) { showToast((r && r.error) || 'Could not post', 'toast-error'); return; }
      showToast('Comment posted', 'toast-success');
      if (KB_STATE.currentId === id) kbLoadComments_(id);
    })
    .withFailureHandler(function (e) { btn.disabled = false; showToast((e && e.message) || 'Could not post', 'toast-error'); })
    .kbAddComment(id, text);
}

function kbDeleteComment_(btn, itemId) {
  var cid = btn.getAttribute('data-kb-cmt');
  uiConfirm({ title: 'Remove this comment?', tone: 'danger', confirmLabel: 'Remove' }).then(function (ok) {
    if (!ok) return;
    google.script.run
      .withSuccessHandler(function (r) {
        if (!r || !r.success) { showToast((r && r.error) || 'Could not remove', 'toast-error'); return; }
        if (KB_STATE.currentId === itemId) kbLoadComments_(itemId);
      })
      .withFailureHandler(function (e) { showToast((e && e.message) || 'Could not remove', 'toast-error'); })
      .kbDeleteComment(cid);
  });
}

// #7 — lazy-load "See also" (co-viewed items) into the reader. Best-effort;
// renders nothing below the co-view threshold or on error.
function kbLoadRelated_(id) {
  var requested = currentView;
  google.script.run
    .withSuccessHandler(function (res) {
      if (currentView !== requested) return;
      // F(cycle-8): the L-18 stale-item guard, applied to the follow-on load —
      // rapid A→B reader clicks let A's slower kbGetRelated response write
      // A's "See also" block under B's article.
      if (KB_STATE.currentId !== id) return;
      var host = document.getElementById('kb-related'); if (!host) return;
      var items = (res && res.items) || [];
      if (!items.length) { host.innerHTML = ''; return; }
      host.innerHTML = '<div class="kb-related"><div class="kb-related-h">' + icon('list', 13) + ' See also</div>' +
        items.map(function (it) {
          return '<button class="kb-related-row" data-kb-id="' + esc(it.id) + '" onclick="kbOpenItem_(this.getAttribute(\'data-kb-id\'))">' +
            icon(kbItemIcon_(it), 13) + ' <span class="kb-related-t">' + esc(it.title) + '</span>' +
            (it.department ? '<span class="kb-related-meta">' + esc(it.department) + '</span>' : '') + '</button>';
        }).join('') + '</div>';
    })
    .withFailureHandler(function () {})
    .kbGetRelated(id);
}

// #4 — flip a draft to published (kbPublishItem), then reload the reader.
function kbPublishItem_(id) {
  uiConfirm({ title: 'Publish this item?', message: 'Reps will be able to see and search it immediately.', confirmLabel: 'Publish' })
    .then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (r) {
          if (!r || !r.success) { showToast((r && r.error) || 'Publish failed', 'toast-error'); return; }
          showToast('Published', 'toast-success');
          kbReloadTree_();
          kbOpenItem_(id);
        })
        .withFailureHandler(function (e) { showToast((e && e.message) || 'Publish failed', 'toast-error'); })
        .kbPublishItem(id);
    });
}

// #4 — revision history modal: list prior versions, restore one.
function kbOpenRevisions_(id) {
  var ov = ensureOverlay('kb-rev-overlay', { label: 'Revision history', onClose: function () { var o = document.getElementById('kb-rev-overlay'); if (o) o.remove(); } });
  ov.innerHTML = '<div class="modal kb-ed"><div class="head" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Revision history</h3><button class="kb-btn" data-kb-revclose="1">' + icon('x', 15) + '</button></div><div class="body" id="kb-rev-body">' + loSweep() + '</div></div>';
  ov.addEventListener('click', function (ev) { if (ev.target.closest && ev.target.closest('[data-kb-revclose]')) { ov.remove(); } });
  google.script.run
    .withSuccessHandler(function (res) {
      var body = document.getElementById('kb-rev-body'); if (!body) return;
      if (!res || res.error) { body.innerHTML = errorStateHtml_((res && res.error) || 'Failed to load revisions'); return; }   // A12
      var items = res.items || [];
      if (!items.length) { body.innerHTML = '<div class="kb-empty">No prior versions yet. Edits from now on are captured here.</div>'; return; }
      body.innerHTML = items.map(function (r) {
        var who = esc(r.priorUpdatedBy || 'unknown') + (r.priorUpdatedAt ? ' · ' + esc(r.priorUpdatedAt) : '');
        var tag = r.action === 'revert' ? '<span class="kb-draft-pill">revert</span>' : '';
        return '<div class="kb-rev-row">' +
          '<div class="kb-rev-main">' +
            '<div class="kb-rev-meta">' + who + ' ' + tag + '</div>' +
            '<div class="kb-rev-prev">' + esc(r.preview || '') + (r.chars ? ' <span style="color:var(--muted)">· ' + r.chars + ' chars</span>' : '') + '</div>' +
          '</div>' +
          '<button class="kb-btn" data-kb-rev="' + esc(r.revId) + '" data-kb-item="' + esc(id) + '" onclick="kbRestoreRevision_(this.getAttribute(\'data-kb-item\'), this.getAttribute(\'data-kb-rev\'))">' + icon('refresh', 13) + ' Restore</button>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function (err) { var body = document.getElementById('kb-rev-body'); if (body) body.innerHTML = errorStateHtml_((err && err.message) || 'Failed to load revisions'); })   // A12
    .kbGetRevisions(id);
}

function kbRestoreRevision_(id, revId) {
  uiConfirm({ title: 'Restore this version?', message: 'The current content is snapshotted first, so you can undo this restore.', confirmLabel: 'Restore' })
    .then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (r) {
          if (!r || !r.success) { showToast((r && r.error) || 'Restore failed', 'toast-error'); return; }
          showToast('Restored', 'toast-success');
          var ov = document.getElementById('kb-rev-overlay'); if (ov) ov.remove();
          kbReloadTree_();
          kbOpenItem_(id);
        })
        .withFailureHandler(function (e) { showToast((e && e.message) || 'Restore failed', 'toast-error'); })
        .kbRevertItem(id, revId);
    });
}

// #2 — rep freshness signal: a "Was this helpful?" bar + "Flag as out of date"
// on every article/embed reader. Helpful/not-helpful are lightweight signal;
// a stale flag jumps the item to the top of the manager review-due queue.
// Shared by the Reference-tab reader AND the Ctrl/⌘+K drawer reader. The bar is
// located from the clicked button via closest('.kb-feedback') (NOT a DOM id) so
// the tab + drawer can render the same article's bar without an id collision.
function kbFeedbackBarHtml_(item) {
  return '<div class="kb-feedback">' +
    '<span class="kb-fb-q">Was this helpful?</span>' +
    '<span class="kb-fb-btns">' +

/** Reader-view entry: convert an existing doc- or sheet-embed KB item. */
function kbConvertItem_(id, kind) {

    confirmLabel: 'Convert',
  }).then(function (ok) {
    if (!ok) return;
    showToast('Converting…', '');

      .withSuccessHandler(function (res) {

// returned markdown. A UNIQUE placeholder token goes in at the cursor first
// and is string-replaced when the upload resolves, so typing (or a type-
// switch re-render) during the round trip can't misplace the final markdown:
// the replacement targets the token wherever it now lives — the live
// textarea, or the KB_EDIT snapshot if the body was re-rendered/snapshotted.

  var start = (typeof ta.selectionStart === 'number') ? ta.selectionStart : ta.value.length;
  var end = (typeof ta.selectionEnd === 'number') ? ta.selectionEnd : start;
  ta.value = ta.value.substring(0, start) + token + ta.value.substring(end);
  ta.selectionStart = ta.selectionEnd = start + token.length;

    var el = document.getElementById('kb-ed-bodymd');
    if (el && el.value.indexOf(token) >= 0) {

      el.dispatchEvent(new Event('input'));   // refresh the live preview
    } else if (KB_EDIT && typeof KB_EDIT.body === 'string' && KB_EDIT.body.indexOf(token) >= 0) {
