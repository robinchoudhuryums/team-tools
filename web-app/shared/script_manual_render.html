<style>
  /* The handbook rendering layer's styles (HB1.1a) — every rule that styles what
     kbMd_ draws, moved verbatim and in order out of kb/script_kb.html, which is
     included after this file. The article's own reader-screen rules
     (.kb-man-*) stay with Reference until HB1.1b. */
  /* rendered markdown - Console document register: display-font headings,
     mono uppercase kickers for table headers, hairline row separators (the
     app has no bordered grids anywhere - tables match the ledger/punch-row
     vocabulary), accent-soft blockquote callouts. */
  .kb-article { line-height: 1.65; font-size: .95rem; max-width: 760px; color: var(--ink); }
  .kb-article h1, .kb-article h2, .kb-article h3, .kb-article h4, .kb-article h5, .kb-article h6 {
    font-family: var(--display); line-height: 1.25; letter-spacing: -.01em; margin: 1.3em 0 .45em; }
  .kb-article h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em; }
  .kb-article h2 { font-size: 1.2rem; font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .kb-article h3 { font-size: 1.05rem; font-weight: 600; }
  .kb-article h4 { font-size: .98rem; font-weight: 600; }
  .kb-article > h1:first-child, .kb-article > h2:first-child, .kb-article > h3:first-child { margin-top: .2em; }
  .kb-article p { margin: .6em 0; }
  .kb-article ul, .kb-article ol { margin: .5em 0; padding-left: 1.5em; }
  .kb-article li { margin: .25em 0; }
  .kb-article a { color: var(--accent); text-underline-offset: 2px; }
  .kb-article code { background: var(--paper-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: .88em; }
  .kb-article pre { background: var(--paper-2); padding: 12px 14px; border-radius: var(--radius); overflow-x: auto; }
  .kb-article pre code { background: none; padding: 0; }
  .kb-article blockquote { border-left: 3px solid var(--accent); background: var(--accent-soft); margin: .8em 0; padding: 8px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
  /* Callouts (Batch M1) — a quote whose first line opens with a bold label,
     toned by that label: Critical (patient safety / federal law), Policy,
     Watch-out, Note. A quote holds whole blocks, so its first/last child
     margins collapse into the callout's own padding. */
  .kb-article blockquote > :first-child { margin-top: 0; }
  .kb-article blockquote > :last-child { margin-bottom: 0; }
  .kb-article blockquote.kb-callout { padding: 10px 14px; }
  .kb-article blockquote.kb-callout-critical { border-left-color: var(--danger); background: var(--danger-soft); }
  .kb-article blockquote.kb-callout-policy { border-left-color: var(--info); background: var(--info-soft); }
  .kb-article blockquote.kb-callout-watch-out { border-left-color: var(--warn); background: var(--warn-soft); }
  .kb-article blockquote.kb-callout-note { border-left-color: var(--muted-3); background: var(--paper-2); }
  .kb-article blockquote.kb-callout-script { border-left-color: var(--accent); background: var(--accent-soft); }
  .kb-article blockquote table { margin: .5em 0; }
  .kb-article .kb-diagram-pending { margin: 1em 0; padding: 18px 14px; border: 1px dashed var(--muted-3);
    border-radius: var(--radius-md); background: var(--paper-2); color: var(--muted-2); font-size: var(--text-sm); text-align: center; }
  .kb-article .kb-diagram-pending b { color: var(--ink); font-weight: 600; }
  /* Batch M3 — the manual's diagrams (kb/script_manual_diagrams.html, generated
     by manual/export_reference.py). Each diagram names its colours --dg-*; this
     is the ONE place they meet the design tokens, so light, dark and the
     palettes all follow. Text drawn on a --dg-navy box is --dg-bg, so the pair
     must stay an ink/paper pair in every theme. */
  .kb-article .kb-diagram { margin: 1.1em 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper-card);
    --dg-navy: var(--ink); --dg-ink: var(--ink); --dg-bg: var(--paper-card); --dg-panel: var(--paper-2);
    --dg-accent: var(--info); --dg-tint: var(--info-soft); --dg-muted: var(--muted); --dg-rule: var(--line);
    --dg-crit-bg: var(--danger-soft); --dg-crit-ink: var(--danger-deep); --dg-pol-bg: var(--info-soft); --dg-pol-ink: var(--info-deep);
    --dg-watch-bg: var(--warn-soft); --dg-watch-ink: var(--warning-deep); --dg-scr-bg: var(--accent-soft); --dg-scr-ink: var(--success-deep);
    --dg-p0: var(--man-p0); --dg-p1: var(--man-p1); --dg-p2: var(--man-p2); --dg-p3: var(--man-p3); --dg-p4: var(--man-p4); --dg-p5: var(--man-p5);
    --dg-p6: var(--man-p6); --dg-p7: var(--man-p7); --dg-p8: var(--man-p8); --dg-p9: var(--man-p9); --dg-p10: var(--man-p10); }
  /* A wide flow chart scrolls inside itself rather than shrinking its text
     past reading size (g71) — below ~600px of width it scrolls. */
  .kb-article .kb-diagram-scroll { overflow-x: auto; padding: 10px; border-radius: var(--radius-md); }
  .kb-article .kb-diagram-scroll:focus-visible { outline: 2px solid var(--ring-focus); outline-offset: 2px; }
  .kb-article .kb-diagram a.kb-xref { cursor: pointer; }
  /* The button sits in its own bar ABOVE the drawing — an absolutely placed
     one covered the diagram's own top-right content (measured on the shots). */
  .kb-article .kb-diagram-bar { display: flex; justify-content: flex-end; padding: 6px 8px 0; }
  .kb-article .kb-diagram-full { display: inline-flex; align-items: center; gap: 4px;
    font: inherit; font-size: .72rem; padding: 3px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper-card); color: var(--muted); cursor: pointer; }
  .kb-article .kb-diagram-full:hover { color: var(--ink); border-color: var(--border-strong); }
  .kb-diagram-modal { width: min(1240px, 96vw); max-width: none; max-height: 92vh; display: flex; flex-direction: column; }
  .kb-diagram-mhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .kb-diagram-mhead h3 { margin: 0; font-size: 1rem; }
  .kb-article.kb-diagram-big { max-width: none; overflow: auto; min-height: 0; }
  .kb-article.kb-diagram-big .kb-diagram { margin: 0; }
  .kb-article .kb-diagram a.kb-xref:hover text, .kb-article .kb-diagram a.kb-xref:focus text, .kb-article .kb-diagram a.kb-xref:hover { text-decoration: underline; }
  .kb-article .kb-diagram a.kb-xref:focus-visible { outline: 2px solid var(--ring-focus); }
  .kb-co-kick { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .kb-callout-critical .kb-co-kick { color: var(--danger-deep); }
  .kb-callout-policy .kb-co-kick { color: var(--info-deep); }
  .kb-callout-watch-out .kb-co-kick { color: var(--warning-deep); }
  .kb-callout-note .kb-co-kick { color: var(--muted); }
  .kb-co-sep { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }   /* kept so the text reads the same */
  /* F67 (cycle 25): the hidden separator is absolutely positioned, so it needs a
     positioned ancestor INSIDE the reader's scroller — without one it escaped
     #kb-main and stretched the whole page (8,245px for a 900px window, measured). */
  blockquote.kb-callout { position: relative; }
  .kb-co-title { display: block; margin-top: 4px; font-weight: 600; }
  .kb-co-title::first-letter { text-transform: uppercase; }
  /* M5: a code is a chip (it LOOKS UP), a section link a solid underline (it OPENS),
     a glossary term the one dotted mark (it EXPLAINS). */
  a.kb-hcpcs { font-family: var(--mono); font-size: .86em; padding: 1px 5px; border-radius: 4px; background: var(--info-soft); color: var(--info-deep); text-decoration: none; font-variant-numeric: tabular-nums; }
  a.kb-hcpcs:hover, a.kb-hcpcs:focus-visible { background: color-mix(in oklab, var(--info) 22%, var(--paper-card)); }
  /* 25post — a `lookup:` link opens a lookup in the drawer, not a page: dotted, like a control. */
  a.kb-lookup { cursor: pointer; text-decoration-style: dotted; text-underline-offset: 2px; }
  /* 25post (operator 2026-10-23) — a button the handbook names, and the popover
     that shows where it is (kbPeekShow_). Above the drawer and any overlay, since
     a section can be read in either; never printed. */
  .kb-peek { cursor: help; text-decoration: underline dotted; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .kb-peek:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .kb-peek-pop { position: fixed; z-index: 1000; max-width: min(460px, calc(100vw - 24px)); padding: 8px; background: var(--paper-card); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); pointer-events: none; }
  .kb-peek-pop[hidden] { display: none; }
  .kb-peek-pop img { display: block; max-width: 100%; max-height: 300px; width: auto; height: auto; margin: 0; border-radius: 3px; }
  .kb-peek-pop .kb-img-pending { margin: 0; }
  @media print { .kb-peek-pop { display: none !important; } .kb-peek { text-decoration: none; } }
  .kb-article a.kb-xref { color: var(--accent); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; }
  .kb-fn-ref { font: inherit; font-size: .8em; font-weight: 700; line-height: 1; vertical-align: .45em; margin-left: 1px; padding: 2px 4px; border: none; border-radius: 4px; background: var(--accent-soft); color: var(--accent-2); cursor: pointer; }
  .kb-fn-ref:hover, .kb-fn-ref:focus-visible { box-shadow: 0 0 0 2px var(--accent); outline: none; }
  .kb-article hr { border: none; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .kb-article table { border-collapse: collapse; margin: 1em 0; display: block; max-width: 100%; overflow-x: auto; }
  .kb-article th { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 16px 6px 0; border-bottom: 1px solid var(--border-strong); }
  .kb-article td { padding: 8px 16px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .kb-article tbody tr:last-child td { border-bottom: none; }
  /* Manual Phase 1 (2026-10-06): the manual's two table conventions, as its HTML draws them.
     A STEP table (first header "Step") numbers its steps with an arrow down to the next;
     a header opening with \2713 / \2717 tints its column (the Do's & Don'ts tables). */
  .kb-article table.kb-steps td:first-child { position: relative; text-align: center; font-weight: 600; color: var(--accent); padding-left: 10px; vertical-align: middle; }
  .kb-article table.kb-steps tbody tr:not(:last-child) td:first-child::after { content: "\2193"; position: absolute; left: 50%; bottom: -0.75em; transform: translateX(-50%); z-index: 1; padding: 0 3px; background: var(--paper-card); color: var(--muted); font-weight: 400; line-height: 1.3; }
  .kb-article table.kb-dodont td, .kb-article table.kb-dodont th { padding-left: 10px; }
  .kb-article table.kb-dodont th.kb-do { color: var(--good); border-bottom-color: var(--good); }
  .kb-article table.kb-dodont th.kb-dont { color: var(--danger); border-bottom-color: var(--danger); }
  .kb-article table.kb-dodont td.kb-do { background: var(--good-soft); }
  .kb-article table.kb-dodont td.kb-dont { background: var(--danger-soft); }
  .kb-article img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); display: block; margin: .9em 0; }
  .kb-article a.kb-img-lnk { display: inline-block; max-width: 100%; }
  .kb-article .kb-img-pending { display: inline-block; padding: 6px 10px; margin: 4px 0;
    border: 1px dashed var(--muted-3); border-radius: 6px; color: var(--muted-2);
    font-size: var(--text-sm); background: var(--paper-2); }
  /* Batch M3 — a manual image while it loads, when it is not imported yet, and
     once it arrives. Icons sit in table cells beside their name, so they are
     inline and unframed; equipment photos are small and framed; figures are
     the article's full width, like any article image. */
  /* D4 (operator 2026-10-27) — an image chip says WHICH of three things it is
     waiting on: still loading (a sized shimmer the image's own shape, so a slow
     one is not read as "no image uploaded"), not imported or stored, or a load
     that failed (with Retry). Icons stay a small inline square. */
  .kb-img-pending[data-mi], .kb-img-pending[data-ki] { display: inline-flex; flex-direction: column; gap: 2px; vertical-align: middle; }
  .kb-img-pending .kb-img-st { font-weight: 600; color: var(--ink); }
  .kb-img-pending .kb-img-alt { font-size: .76rem; color: var(--muted); }
  .kb-img-pending .kb-img-note { font-size: .76rem; color: var(--muted); }
  .kb-img-pending .kb-img-retry { align-self: flex-start; margin-top: 4px; font: inherit; font-size: .76rem; padding: 2px 10px;
    border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--paper-card); color: var(--ink); cursor: pointer; }
  .kb-img-pending .kb-img-retry:hover { border-color: var(--accent); }
  .kb-img-pending[data-mi="loading"], .kb-img-pending[data-ki="loading"] {
    display: flex; justify-content: center; align-items: center; text-align: center; box-sizing: border-box;
    width: min(100%, 480px); min-height: 160px; border-style: solid; border-color: var(--line);
    background: linear-gradient(90deg, var(--paper-3) 25%, var(--paper-2) 37%, var(--paper-3) 63%);
    background-size: 200% 100%; animation: lo-shimmer 1.3s linear infinite; }
  .kb-manimg[data-manimg^="thumb-"][data-mi="loading"] { width: 140px; min-height: 96px; }
  .kb-manimg[data-manimg^="icon-"][data-mi] { display: inline-block; width: 22px; min-height: 22px; height: 22px; padding: 0; margin: 0 6px 0 0;
    overflow: hidden; color: transparent; vertical-align: middle; }
  .kb-manimg[data-manimg^="icon-"][data-mi] > * { display: none; }
  .kb-manimg[data-manimg^="icon-"][data-mi="missing"], .kb-manimg[data-manimg^="icon-"][data-mi="failed"] { border-style: dashed; border-color: var(--warn); }
  .kb-img-pending[data-mi="failed"], .kb-img-pending[data-ki="failed"] { border-color: var(--warn); }
  .kb-img-pending[data-mi="missing"], .kb-img-pending[data-ki="missing"] { border-color: var(--muted-3); }
  .kb-article img.kb-manimg-img { margin: .6em 0; }
  .kb-article img.kb-manimg-icon { display: inline-block; height: 22px; width: auto; margin: 0 6px 0 0; border: 0; border-radius: 0; box-shadow: none; vertical-align: middle; }
  .kb-article img.kb-manimg-thumb { display: inline-block; max-height: 96px; width: auto; margin: 2px 0; vertical-align: middle; }
  .kb-article img.kb-manimg-figure { max-width: min(100%, 720px); }
  /* 25post (operator 2026-10-22) — a figure or article image drawn smaller than
     its own pixels opens at full size (kbImgZoomable_ / kbImageOpen_), like a diagram. */
  .kb-article img.kb-zoomable { cursor: zoom-in; }
  .kb-img-modal .kb-img-big { overflow: auto; min-height: 0; }
  .kb-img-modal .kb-img-big img { display: block; max-width: none; height: auto; margin: 0; }
  /* operator 2026-10-23 — the viewer keeps the caption; a slideshow keeps its count and steps */
  .kb-img-modal .kb-img-count { flex: none; margin-left: auto; margin-right: 8px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--muted); }
  .kb-img-modal .kb-img-cap { margin: 8px 0 0; font-size: .86rem; color: var(--muted); text-align: center; }
  .kb-img-modal .kb-img-cap:empty { display: none; }
  .kb-img-modal .kb-img-nav { margin-top: 8px; }
  /* A tutorial slideshow (```gallery, operator 2026-10-19): one slide at a time,
     Previous / Next and a dot per slide; every slide prints (styles.html rule 7). */
  .kb-article .kb-gallery { margin: 1em 0 1.25em; padding: 10px 12px 12px; max-width: 760px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper-card); }
  .kb-article .kb-gallery:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .kb-gal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: .78rem; color: var(--muted); }
  .kb-gal-label { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; }
  .kb-gal-count { flex: none; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .kb-gal-slide { text-align: center; }
  .kb-gal-slide.kb-gal-off { display: none; }
  .kb-article .kb-gal-slide img.kb-manimg-figure { margin: 0 auto; }
  .kb-gal-cap { margin-top: 6px; font-size: .84rem; color: var(--muted); }
  /* A slide's longer text (operator 2026-10-28): folded under "Show details",
     below the image — a side panel would shrink a wide screenshot past reading
     in the 760px column. Classed off, never [hidden] (g73); it prints (rule 7). */
  .kb-gal-more { appearance: none; display: block; margin: 6px auto 0; font: inherit; font-size: .78rem; font-weight: 600; color: var(--accent); background: var(--paper-card); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 2px 12px; cursor: pointer; }
  .kb-gal-more:hover { border-color: var(--accent); }
  .kb-gal-notes { text-align: left; max-width: 680px; margin: 8px auto 0; font-size: .86rem; line-height: 1.5; color: var(--ink); }
  .kb-gal-notes p { margin: 6px 0; }
  .kb-gal-notes ul { margin: 4px 0 6px 20px; padding: 0; }
  .kb-gal-notes.kb-gal-notes-off { display: none; }
  .kb-gal-nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; }
  .kb-gal-step { appearance: none; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 50%; background: var(--paper-card); color: var(--ink); cursor: pointer; }
  .kb-gal-step:hover { border-color: var(--accent); }
  .kb-gal-dots { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
  .kb-gal-dot { appearance: none; width: 18px; height: 18px; padding: 0; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .kb-gal-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
  .kb-gal-dot.on::before { background: var(--accent); }
  /* Interactive roster block (operator 2026-08-11). Must work at 400px — the
     Ctrl/⌘+K drawer is the mid-call surface this exists for — so every row
     wraps and the team grid is intrinsic (auto-fill), never fixed tracks. */
  .kb-roster { border: 1px solid var(--line); border-radius: 10px; background: var(--paper-card); padding: 12px; margin: 14px 0; }
  .kb-ros-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .kb-ros-search {
    flex: 1 1 180px; min-width: 0; font: inherit; font-size: .86rem;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper); color: var(--ink);
  }
  /* Focus rings come from the ONE global :focus-visible rule in styles.html
     (box-shadow: var(--ring-focus)) — declaring a per-element outline here
     would both duplicate it and misuse a shadow value as a colour. */
  .kb-ros-search:focus { border-color: var(--border-strong); }
  .kb-ros-count { flex: 0 0 auto; font-family: var(--mono); font-size: .72rem; color: var(--muted-2); }
  .kb-ros-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .kb-ros-legend-item { font-size: .74rem; color: var(--muted); }
  .kb-ros-legend-item b { font-family: var(--mono); color: var(--ink); font-weight: 700; }
  .kb-ros-dept { margin: 0 0 14px; }
  .kb-ros-dept-name { font-size: .95rem; font-weight: 700; color: var(--ink); margin: 0 0 8px; }
  .kb-ros-owner { font-weight: 500; font-size: .8rem; color: var(--muted-2); }
  .kb-ros-owner::before { content: '· '; }
  /* align-items:start — a 3-person team must not stretch to match a 9-person
     one beside it (the documented .m-layout / .dash-trk lesson). */
  .kb-ros-teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; align-items: start; }
  .kb-ros-team { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 8px 10px; min-width: 0; }
  .kb-ros-team-name { font-size: .74rem; font-family: var(--mono); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 6px; }
  .kb-ros-sub { color: var(--info-deep); }
  .kb-ros-sub::before { content: '› '; color: var(--muted-3); }
  .kb-ros-people { display: flex; flex-direction: column; gap: 4px; }
  .kb-ros-person { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-width: 0; }
  .kb-ros-name {
    appearance: none; border: none; background: none; padding: 0; cursor: pointer;
    font: inherit; font-size: .86rem; color: var(--ink); text-align: left;
    border-bottom: 1px dashed transparent;
  }
  .kb-ros-name:hover { border-bottom-color: var(--muted-3); }
  .kb-ros-person.is-lead .kb-ros-name { font-weight: 700; }
  .kb-ros-tag {
    position: relative; font-family: var(--mono); font-size: .64rem; font-weight: 700;
    padding: 1px 5px; border-radius: var(--radius-pill);
    background: var(--paper-2); color: var(--muted); border: 1px solid var(--line);
  }
  .kb-ros-tag[data-tip] { cursor: help; }
  /* Same tokened tooltip as the Intake help glyph — hover AND keyboard focus,
     so it is not a mouse-only affordance. */
  .kb-ros-tag[data-tip]:hover::after, .kb-ros-tag[data-tip]:focus::after {
    content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 6px);
    z-index: 5; white-space: nowrap; font-family: var(--ui); font-weight: 500;
    font-size: .72rem; padding: 5px 8px; border-radius: 6px;
    background: var(--ink); color: var(--paper); box-shadow: var(--shadow-sm);
  }

<script>
// ─────────────────────────────────────────────────────────────────────────────
// The handbook's RENDERING LAYER (handbook app HB1.1a, 2026-10-28) — shared by
// Team Tools' Reference module and the stand-alone handbook web app.
//
// kbMd_ and every block it draws: roster, glossary, decision guide, warehouse
// map, diagram, slideshow (and a slide's details), callouts, footnotes, HCPCS
// links, the image chips and their hydrators (manual and article images), the
// full-size image viewer and the button-screenshot peek. Moved VERBATIM, in
// its original order, out of kb/script_kb.html, which is now included AFTER
// this file and keeps the reader screen, the tree, the drawer, the editor and
// everything else that is Reference's own.
//
// This file may reach Reference only through the names the CONTRACT pin in
// test/client/run.js lists (kbXrefOpen_ — a diagram's "open the section";
// KB_STATE — the admin check on a missing-image chip). Batch HB1.1b replaces
// both with host hooks, so the handbook app can supply its own.
// ─────────────────────────────────────────────────────────────────────────────
// Compact markdown → HTML. Escapes HTML up front (so raw tags/script in the
// source are inert), then applies a safe subset: headings, bold/italic, inline
// + fenced code, links (http(s)/mailto only), images (http(s) only), GFM
// tables, ul/ol, blockquote, hr, paragraphs.
// Anchor slug for heading ids - MUST stay identical to the server kbSlug_
// in Code.js (searchReference computes the anchors that kbMd_'s ids must
// match). The entity de-escape makes the two agree even though kbMd_ slugs
// ESCAPED source while the server slugs raw markdown. Node parity test.
function kbSlug_(text) {
  return String(text || '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// ── Decision / task-guide block (operator 2026-08-11) ─────────────────────
// "Guide me through a task, with actions at the leaves." A ```decision fence
// asks ONE question at a time and lands on an action with tickable steps, so a
// rep mid-call is never reading a branching policy page and holding the branch
// in their head.
//
//   ask|  q1: Does this order need a PT Eval?
//   opt|  q1: Yes -> q2
//   opt|  q1: No  -> a1
//   do|   a1: Send straight to PWC Verification
//   todo| a1: Confirm the qualification documents are attached
//   note| a1: Group 3 chairs always need an ATP regardless
//
// The first `ask|` is the root. Ids are author-chosen and never shown.

/** PURE. Input is kbMd_-escaped; nothing here unescapes it. */
function kbDecideParse_(text) {
  var nodes = {}, order = [], warnings = [], root = '';
  var line, i;
  String(text == null ? '' : text).split('\n').forEach(function (raw) {
    line = raw.trim();
    if (!line || line.charAt(0) === '#') return;
    var m = line.match(/^(ask|opt|do|todo|note)\s*\|\s*(.*)$/i);
    if (!m) { warnings.push(line); return; }
    var key = m[1].toLowerCase(), rest = m[2];
    var ci = rest.indexOf(':');
    if (ci < 0) { warnings.push(line); return; }
    var id = rest.slice(0, ci).trim();
    var val = rest.slice(ci + 1).trim();
    if (!id || !val) { warnings.push(line); return; }
    var n = nodes[id];
    if (!n) { n = nodes[id] = { id: id, kind: '', title: '', opts: [], todos: [], notes: [] }; order.push(id); }
    if (key === 'ask' || key === 'do') {
      if (n.kind) { warnings.push(line); return; }      // a second title would be ambiguous
      n.kind = (key === 'ask') ? 'ask' : 'do';
      n.title = val;
      if (key === 'ask' && !root) root = id;
      return;

    if (key === 'opt') {

  // A branch that leads nowhere, or a node nothing can reach, is an authoring
  // error the reader would otherwise hit as a dead end mid-call.
  var dangling = [], unreachable = [];
  order.forEach(function (id) {
    nodes[id].opts.forEach(function (o) { if (!nodes[o.to]) dangling.push(o.to); });
    if (!nodes[id].kind) warnings.push(id);            // referenced but never defined
  });
  if (root) {
    var seen = {}, stack = [root];
    while (stack.length) {
      var cur = stack.pop();
      if (seen[cur] || !nodes[cur]) continue;
      seen[cur] = 1;
      nodes[cur].opts.forEach(function (o) { stack.push(o.to); });
    }
    order.forEach(function (id) { if (!seen[id]) unreachable.push(id); });
  }
  return { nodes: nodes, order: order, root: root, warnings: warnings,
           dangling: dangling, unreachable: unreachable };
}

/** Resolves a stored answer path to the node it lands on, ignoring any step
 *  that no longer matches (an author can edit the tree under a reader). */
function kbDecideResolve_(data, path) {
  var at = data.root, trail = [];
  (path || []).forEach(function (choice) {
    var n = data.nodes[at];
    if (!n || n.kind !== 'ask') return;
    var hit = null;
    n.opts.forEach(function (o) { if (o.label === choice) hit = o; });
    if (!hit || !data.nodes[hit.to]) return;
    trail.push({ q: n.title, a: hit.label });
    at = hit.to;
  });
  return { at: at, trail: trail };
}

function kbDecideHtml_(text, path) {
  var data = kbDecideParse_(text);
  if (!data.root) {
    return '<div class="kb-ros-empty"><b>No guide recorded yet.</b>' +
      '<p>Start with a question and give each answer a destination:</p>' +
      '<pre class="kb-ros-flowhint">ask|  q1: Does this order need a PT Eval?\n' +
      'opt|  q1: Yes -&gt; a1\n' +
      'opt|  q1: No  -&gt; a2\n' +
      'do|   a1: Schedule the PT Eval\n' +
      'todo| a1: Book the earliest slot in PT Scheduling</pre>' +
      '<p>The first <code>ask|</code> is where the guide starts. ' +
      '<code>todo|</code> adds a tickable step and <code>note|</code> a caveat.</p></div>';
  }
  var r = kbDecideResolve_(data, path);
  var node = data.nodes[r.at] || data.nodes[data.root];

  var trail = r.trail.length
    ? '<ol class="kb-dec-trail">' + r.trail.map(function (t, i) {
        return '<li><button type="button" class="kb-dec-crumb" data-step="' + i + '" ' +
          'onclick="kbDecideBack_(this)" title="Change this answer">' +
          '<span class="kb-dec-crumb-q">' + t.q + '</span>' +
          '<span class="kb-dec-crumb-a">' + t.a + '</span></button></li>';
      }).join('') + '</ol>'
    : '';

  var body;
  if (node.kind === 'do') {
    body = '<div class="kb-dec-action">' +
      '<h3 class="kb-dec-title">' + node.title + '</h3>' +
      (node.todos.length
        ? '<ul class="kb-dec-todos">' + node.todos.map(function (t, i) {
            return '<li><label><input type="checkbox" onchange="kbDecideTick_(this)"> ' +
              '<span>' + t + '</span></label></li>';
          }).join('') + '</ul>'
        : '') +
      node.notes.map(function (n) { return '<p class="kb-dec-note">' + n + '</p>'; }).join('') +
      '</div>';
  } else {
    body = '<div class="kb-dec-q">' +
      '<h3 class="kb-dec-title">' + node.title + '</h3>' +
      node.notes.map(function (n) { return '<p class="kb-dec-note">' + n + '</p>'; }).join('') +
      '<div class="kb-dec-opts">' + node.opts.map(function (o) {
        return '<button type="button" class="kb-dec-opt" data-opt="' + kbRosterAttr_(o.label) + '" ' +
          'onclick="kbDecideChoose_(this)">' + o.label + '</button>';
      }).join('') + '</div>' +
      // A question with no options is a dead end the reader cannot leave.
      (node.opts.length ? '' : '<p class="kb-ros-warn">This question has no answers recorded.</p>') +
      '</div>';
  }

  var problems = [];
  if (data.dangling.length) problems.push(data.dangling.length + ' answer(s) point at a step that does not exist: ' + data.dangling.join(', '));
  if (data.unreachable.length) problems.push(data.unreachable.length + ' step(s) cannot be reached from the start: ' + data.unreachable.join(', '));

  return '<div class="kb-decision" data-decision="1" data-src="' + kbRosterAttr_(text) + '"' +
      ' data-path="' + kbRosterAttr_(JSON.stringify(path || [])) + '">' +
    (problems.length ? '<div class="kb-ros-warn" role="alert">' + problems.join(' · ') + '</div>' : '') +
    '<div class="kb-dec-bar">' +
      '<span class="kb-dec-step">' + (node.kind === 'do' ? 'Action' : 'Step ' + (r.trail.length + 1)) + '</span>' +
      (r.trail.length ? '<button type="button" class="kb-ros-expand" onclick="kbDecideRestart_(this)">Start over</button>' : '') +
    '</div>' + trail +
    '<div class="kb-dec-body" role="group" aria-live="polite">' + body + '</div>' +
    (data.warnings.length
      ? '<div class="kb-ros-warn">' + data.warnings.length + ' line(s) were not understood and are not shown.</div>'
      : '') +
    '</div>';
}

function kbDecideRoot_(el) { return el && el.closest ? el.closest('.kb-decision') : null; }

function kbDecidePath_(root) {
  // The stored path decodes on read exactly as data-src does, and its entries
  // are matched against option labels parsed from the (escaped) source — so
  // they are re-escaped here or a label containing & < > stops resolving.
  try {
    var p = JSON.parse(root.getAttribute('data-path') || '[]');
    return Array.isArray(p) ? p.map(kbFenceEsc_) : [];
  }
  catch (e) { return []; }
}

/** Re-renders in place from the source + the new path. Ticked boxes are
 *  deliberately NOT carried across: they belong to the action being shown, and
 *  restoring them onto a different action would assert work that was not done. */
function kbDecideRender_(root, path) {
  var html = kbDecideHtml_(kbFenceSrc_(root), path);
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var next = tmp.firstChild;
  root.parentNode.replaceChild(next, root);
  var focusTarget = next.querySelector('.kb-dec-opt, .kb-dec-todos input, .kb-dec-title');
  if (focusTarget && focusTarget.focus) { try { focusTarget.focus(); } catch (e) {} }
}

function kbDecideChoose_(btn) {
  var root = kbDecideRoot_(btn);
  if (!root) return;
  kbDecideRender_(root, kbDecidePath_(root).concat([kbFenceEsc_(btn.getAttribute('data-opt') || '')]));
}

/** Clicking a crumb returns to that question — a rep who mis-answers must not
 *  have to start again. */
function kbDecideBack_(btn) {
  var root = kbDecideRoot_(btn);
  if (!root) return;
  kbDecideRender_(root, kbDecidePath_(root).slice(0, +(btn.getAttribute('data-step') || 0)));
}

function kbDecideRestart_(btn) {
  var root = kbDecideRoot_(btn);
  if (root) kbDecideRender_(root, []);
}

function kbDecideTick_(input) {
  var li = input.closest ? input.closest('li') : null;
  if (li) li.classList.toggle('is-done', !!input.checked);
}

// ── Glossary block (operator 2026-08-11) ──────────────────────────────────
// This department runs on acronyms — PPD, PAR, ATP, MDO, PWC, T3Q, GP1–3 — and
// a new rep meets them mid-call with no way to ask. A ```glossary fence renders
// a filterable definition list AND teaches the article to explain itself: the
// first mention of a defined term anywhere else in the same article gets a
// dotted underline and a hover/focus definition.
//
//   PAR (aka Prior Auth)| Prior Authorization Request — payer sign-off before
//   ATP| Assistive Technology Professional
//
// Same safety story as the other blocks: kbMd_ escapes the fence content before
// the renderer sees it, and the annotation is a DOM TEXT-NODE walk (the
// kbHighlightTerms_ pattern), never string surgery on rendered HTML.

/** PURE. Input is kbMd_-escaped text; nothing here unescapes it. */
function kbGlossaryParse_(text) {
  var terms = [], warnings = [], seen = {};
  String(text == null ? '' : text).split('\n').forEach(function (raw) {
    var line = raw.trim();
    if (!line || line.charAt(0) === '#') return;
    var i = line.indexOf('|');
    if (i < 0) { warnings.push(line); return; }
    var head = line.slice(0, i).trim();
    var def = line.slice(i + 1).trim();
    if (!head || !def) { warnings.push(line); return; }
    // "PAR (aka Prior Auth, PA)" -> term PAR with two aliases, all pointing at
    // the same definition.
    var aliases = [];
    var am = head.match(/^(.*?)\s*\(\s*aka\s+([^)]*)\)\s*$/i);
    if (am) {
      head = am[1].trim();
      aliases = am[2].split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    }
    var k = head.toLowerCase();
    if (seen[k]) { warnings.push(line); return; }      // a second definition would be ambiguous
    seen[k] = 1;
    terms.push({ term: head, aliases: aliases, def: def });
  });
  terms.sort(function (a, b) { return a.term.toLowerCase() < b.term.toLowerCase() ? -1 : 1; });
  return { terms: terms, warnings: warnings };
}

function kbGlossaryHtml_(text) {
  var data = kbGlossaryParse_(text);
  if (!data.terms.length) {
    return '<div class="kb-ros-empty"><b>No terms yet.</b>' +
      '<p>Add one per line as <code>Term| Definition</code>. ' +
      '<code>Term (aka Other, Alt)| …</code> gives a term more than one spelling.</p></div>';
  }
  var rows = data.terms.map(function (t) {
    return '<div class="kb-gloss-row" data-term="' + kbRosterAttr_(t.term) + '"' +
        ' data-aliases="' + kbRosterAttr_(t.aliases.join('|')) + '"' +
        ' data-def="' + kbRosterAttr_(t.def) + '"' +
        ' data-hay="' + kbRosterAttr_((t.term + ' ' + t.aliases.join(' ') + ' ' + t.def).toLowerCase()) + '">' +
      '<dt class="kb-gloss-term">' + t.term +
        (t.aliases.length ? '<span class="kb-gloss-aka">' + t.aliases.join(', ') + '</span>' : '') +
      '</dt><dd class="kb-gloss-def">' + t.def + '</dd></div>';
  }).join('');
  return '<div class="kb-glossary" data-glossary="1">' +
    '<div class="kb-ros-bar">' +
      '<input type="search" class="kb-ros-search kb-gloss-search" placeholder="Filter terms…" ' +
        'aria-label="Filter glossary terms" oninput="kbGlossaryFilter_(this)">' +
      '<span class="kb-ros-count" role="status" aria-live="polite">' + data.terms.length + ' terms</span>' +
    '</div>' +
    '<dl class="kb-gloss-list">' + rows + '</dl>' +
    (data.warnings.length
      ? '<div class="kb-ros-warn">' + data.warnings.length + ' line(s) were not understood (or repeat a term) ' +
        'and are not shown.</div>'
      : '') +
    '</div>';
}

function kbGlossaryFilter_(input) {
  var root = input.closest ? input.closest('.kb-glossary') : null;
  if (!root) return;
  var q = String(input.value || '').trim().toLowerCase();
  var rows = root.querySelectorAll('.kb-gloss-row'), shown = 0;
  for (var i = 0; i < rows.length; i++) {
    var hit = !q || (rows[i].getAttribute('data-hay') || '').indexOf(q) >= 0;
    rows[i].style.display = hit ? '' : 'none';
    if (hit) shown++;
  }
  var c = root.querySelector('.kb-ros-count');
  if (c) c.textContent = shown + (q ? ' matching' : ' terms');
}

/** Annotates the FIRST mention of each defined term in the surrounding article.
 *  First-occurrence-only on purpose: marking every mention turns a page into a
 *  field of dotted underlines and stops reading as emphasis at all.
 *
 *  Walks TEXT NODES (the kbHighlightTerms_ pattern) so it can never damage the
 *  markup kbMd_ produced, and skips the glossary block itself, headings, code
 *  and existing links. */
function kbGlossaryAnnotate_(rootEl) {
  try {
    if (!rootEl) return;
    var rows = rootEl.querySelectorAll('.kb-gloss-row');
    if (!rows.length) return;
    var defs = [], byKey = {};
    for (var i = 0; i < rows.length; i++) {
      var term = rows[i].getAttribute('data-term') || '';
      var def = rows[i].getAttribute('data-def') || '';
      var names = [term].concat((rows[i].getAttribute('data-aliases') || '').split('|').filter(Boolean));
      names.forEach(function (n) {
        if (!n) return;
        defs.push(n);
        byKey[n.toLowerCase()] = { term: term, def: def };
      });
    }
    // Longest first, so "PT Eval" wins over "PT".
    defs.sort(function (a, b) { return b.length - a.length; });
    var used = {};
    defs.forEach(function (name) {
      var key = name.toLowerCase();
      if (used[key]) return;
      // An ALL-CAPS term is an acronym: match case-sensitively so "par" in
      // ordinary prose is not mistaken for PAR. Mixed-case terms match
      // case-insensitively.
      var acronym = name === name.toUpperCase();
      var re = new RegExp('\\b' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', acronym ? '' : 'i');
      var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
      var n;
      while ((n = walker.nextNode())) {
        var p = n.parentElement;
        if (!p || p.closest('.kb-glossary, code, pre, h1, h2, h3, h4, a, button, .kb-gloss-mark')) continue;
        var m = re.exec(n.nodeValue);
        if (!m) continue;
        var info = byKey[key];
        var frag = document.createDocumentFragment();
        frag.appendChild(document.createTextNode(n.nodeValue.slice(0, m.index)));
        var mark = document.createElement('span');
        mark.className = 'kb-gloss-mark';
        mark.setAttribute('tabindex', '0');
        mark.setAttribute('role', 'button');   // M17: it opens the shared card (click, hover, focus)
        mark.setAttribute('data-term', info.term);
        mark.setAttribute('data-def', info.def);
        mark.setAttribute('aria-label', info.term + ': ' + info.def);
        mark.textContent = m[0];
        frag.appendChild(mark);
        frag.appendChild(document.createTextNode(n.nodeValue.slice(m.index + m[0].length)));
        p.replaceChild(frag, n);
        used[key] = 1;
        break;                      // first mention only
      }
    });
  } catch (e) { /* annotation is decoration — never break the reader */ }
}

// ── Interactive roster block (operator 2026-08-11) ─────────────────────────
// An employee/routing map is the one KB content type a static article serves
// badly: mid-call, the rep's question is "who handles X, and can they take it"
// — not "show me the org". A ```roster fence renders an interactive directory
// instead, following the ```snippet precedent exactly: the fence content is
// already HTML-escaped by kbMd_'s top-level pass, so the APP draws the
// interactive markup around inert text. Nothing here executes article content.
//
// Syntax — deliberately hand-editable, because the operator's plan is for the
// app to become the source of truth for this data:
//   legend| lead=Team lead; new=Training / New; P=Standard powerchair
//   badge|  Parachute access: Rajdeep, Erica, Paula
//   dept|   PAK — Mary
//   team|   PPD: Micheal*lead, Sandra, Selena
//   team|   Medical Review > T3Q: Paula (C & ATP)*lead, Victoria
// A person is `Name (tags)*flag`; `>` nests a sub-team under a team.

/** PURE parser. Input is kbMd_-escaped text (& < > already entities); this
 *  never unescapes — the renderer only ever adds quote-escaping for attribute
 *  contexts, since the top-level pass does NOT cover quotes. */
function kbRosterParse_(text) {
  var legend = {}, badges = [], depts = [], flows = [], phases = [], steps = [], warnings = [];
  var cur = null;
  String(text == null ? '' : text).split('\n').forEach(function (raw) {
    var line = raw.trim();
    if (!line || line.charAt(0) === '#') return;              // blank / comment
    var m = line.match(/^(legend|badge|dept|team|flow|phase|step)\s*\|\s*(.*)$/i);
    if (!m) { warnings.push(line); return; }
    var key = m[1].toLowerCase(), val = m[2].trim();
    if (key === 'legend') {
      val.split(';').forEach(function (pair) {
        var kv = pair.split('=');
        if (kv.length >= 2 && kv[0].trim()) legend[kv[0].trim()] = kv.slice(1).join('=').trim();
      });
      return;
    }
    if (key === 'badge') {
      var bi = val.indexOf(':');
      if (bi < 0) { warnings.push(line); return; }
      badges.push({
        label: val.slice(0, bi).trim(),
        people: val.slice(bi + 1).split(',').map(function (x) { return x.trim(); }).filter(Boolean),
      });
      return;
    }
    if (key === 'phase') {
      // `phase| Name: Node, Node*decision, Node`. `phase| *: Sales` declares
      // nodes that sit OUTSIDE the phases (an external feed).
      var pi = val.indexOf(':');
      if (pi < 0) { warnings.push(line); return; }
      var pname = val.slice(0, pi).trim();
      var nodes = val.slice(pi + 1).split(',').map(function (x) { return x.trim(); }).filter(Boolean)
        .map(function (n) {
          var dec = false, join = false;
          // Markers are stripped in a loop so `Name*decision*join` works in
          // either order, like the person flags.
          for (var pass = 0; pass < 2; pass++) {
            n = n.replace(/\*decision\s*$/i, function () { dec = true; return ''; })
                 .replace(/\*join\s*$/i, function () { join = true; return ''; }).trim();
          }
          return { name: n, decision: dec, join: join };
        });
      phases.push({ name: pname === '*' ? '' : pname, external: pname === '*', nodes: nodes });
      return;
    }
    if (key === 'step') {
      // `step| From -> To: label`. The label may itself contain a colon, so
      // split on the FIRST colon AFTER the arrow.
      var am = val.match(/\s*-(?:&gt;|>)\s*/);
      if (!am) { warnings.push(line); return; }
      var from = val.slice(0, am.index).trim();
      var afterArrow = val.slice(am.index + am[0].length);
      var li = afterArrow.indexOf(':');
      var to = (li >= 0 ? afterArrow.slice(0, li) : afterArrow).trim();
      var slabel = li >= 0 ? afterArrow.slice(li + 1).trim() : '';
      if (!from || !to) { warnings.push(line); return; }
      steps.push({ from: from, to: to, label: slabel });
      return;
    }
    if (key === 'flow') {
      // `flow| [Label:] Stage -> Stage -> Stage`. The separator is `->` and
      // NOT `>`, which already nests a sub-team under a team.
      var lbl = '', rest = val;
      var ci = val.indexOf(':');
      if (ci >= 0 && !/-(?:&gt;|>)/.test(val.slice(0, ci))) { lbl = val.slice(0, ci).trim(); rest = val.slice(ci + 1); }
      var stages = rest.split(/\s*-(?:&gt;|>)\s*/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (stages.length >= 2) flows.push({ label: lbl, stages: stages });
      else warnings.push(line);
      return;
    }
    if (key === 'dept') {
      // "PAK — Mary" / "PAK - Mary" / "PAK" (no owner)
      var dm = val.split(/\s+[—–-]\s+/);
      cur = { name: dm[0].trim(), owner: (dm[1] || '').trim(), teams: [] };
      depts.push(cur);
      return;
    }
    // team
    var ti = val.indexOf(':');
    if (ti < 0) { warnings.push(line); return; }
    var head = val.slice(0, ti).trim();
    var sub = '';
    // `>` arrives from kbMd_ as `&gt;` (same class as the `&amp;` tag
    // separator). Match BOTH forms rather than unescaping: decoding to a raw
    // `>` and later emitting it would undo the escape boundary.
    var sm = head.match(/\s*(?:&gt;|>)\s*/);
    if (sm) { sub = head.slice(sm.index + sm[0].length).trim(); head = head.slice(0, sm.index).trim(); }
    var people = val.slice(ti + 1).split(',').map(function (x) { return x.trim(); }).filter(Boolean)
      .map(function (tok) {
        var flags = [];
        // Strip trailing *flags FIRST so a name containing "*" is not mangled.
        tok = tok.replace(/\*([a-z]+)\s*$/gi, function (_, f) { flags.push(f.toLowerCase()); return ''; }).trim();
        tok = tok.replace(/\*([a-z]+)\s*$/gi, function (_, f) { flags.push(f.toLowerCase()); return ''; }).trim();
        var tags = [];
        var tm = tok.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
        if (tm) {
          tok = tm[1].trim();
          // The input is kbMd_-ESCAPED, so an ampersand separator arrives as
          // `&amp;` — splitting on a bare `&` turns "C & ATP" into "C" and
          // "amp; ATP". Accept both forms (and a comma).
          tags = tm[2].split(/\s*(?:&amp;|&|,)\s*/).map(function (t) { return t.trim(); }).filter(Boolean);
        }
        return { name: tok, tags: tags, lead: flags.indexOf('lead') >= 0, isNew: flags.indexOf('new') >= 0 };
      });
    if (!cur) { cur = { name: '', owner: '', teams: [] }; depts.push(cur); }
    cur.teams.push({ name: head, sub: sub, people: people });
  });
  // Badges are an attribute of a PERSON, not a place — they travel with them
  // across every team they appear on, which a separate list cannot do.
  var badgeByPerson = {};
  badges.forEach(function (b) {
    b.people.forEach(function (n) {
      var k = n.toLowerCase();
      (badgeByPerson[k] = badgeByPerson[k] || []).push(b.label);
    });
  });
  depts.forEach(function (d) {
    d.teams.forEach(function (t) {
      t.people.forEach(function (p) { p.badges = badgeByPerson[p.name.toLowerCase()] || []; });
    });
  });
  // A linear `flow|` is sugar for a chain of steps, so both notations feed ONE
  // renderer rather than two that could drift.
  flows.forEach(function (f) {
    if (!phases.length) {
      var lin = f.stages.map(function (n) { return { name: n, decision: false }; });
      phases.push({ name: f.label || '', external: false, nodes: lin, linear: true });
    }
    for (var i = 0; i + 1 < f.stages.length; i++) steps.push({ from: f.stages[i], to: f.stages[i + 1], label: '' });
  });
  return { legend: legend, badges: badges, depts: depts, flows: flows,
           phases: phases, steps: steps, warnings: warnings };
}

/** Renders the parsed roster. `v` values arrive kbMd_-escaped (& < >), so the
 *  ONLY extra escaping needed is for quotes in attribute contexts — the same
 *  gap kbMd_'s link/image rules guard (the top-level pass doesn't cover them). */
/** Normalised lookup key. Values carry kbMd_'s entities, so `A &gt; B` and
 *  `A > B` must address the same team without either being unescaped. */
function kbRosterKey_(v) {
  return String(v == null ? '' : v).toLowerCase()
    .replace(/&gt;/g, '>').replace(/&amp;/g, '&')
    .replace(/\s+/g, ' ').trim();
}

// ── Warehouse map block (` ```map `, operator 2026-08-13 — Tier A, no billing) ──
// `wh| Name: Address` lines render a warehouse directory: open-in-Google-Maps
// links, a per-warehouse keyless embed (`?q=…&output=embed` — no API key, the
// operator's no-billing constraint), and a nearest-warehouse lookup. The
// lookup geocodes SERVER-side through Apps Script's free built-in Maps
// service and returns straight-line miles; the query is never persisted
// anywhere (a looked-up address may be a patient's — the placeholder asks for
// a ZIP for exactly that reason). Distances are LABELED straight-line — the
// per-result Directions link is the honest path to a drive figure (INV-187:
// never imply a judgement the data doesn't carry). Fence rules match
// roster/glossary: content arrives HTML-escaped, attributes get their own
// quote escaping, values read back off data-attrs are DECODED (so they need
// esc() before any innerHTML), and unknown lines are counted, never silently
// dropped.
var KB_MAP_MAX_WH_CLIENT = 20;
function kbMapDecode_(s) {
  // kbMd_'s top-level escape covers exactly these three entities. Decode ONLY
  // for URL building (encodeURIComponent re-encodes everything, so the result

// Re-rendering that raw put a LIVE element into the article: the escape-first
// boundary INV-193 relies on held for the first render only.

function kbRosterChartOverflow_(el) {
  var root = kbRosterRoot_(el);
  var wrap = root ? root.querySelector('.kb-ros-chartwrap') : null;
  if (!wrap) return;
  var chart = root.querySelector('.kb-ros-chart');
  if (chart) chart.classList.toggle('has-overflow', wrap.scrollWidth > wrap.clientWidth + 1);
}

/** VIEW 5 — flow. A roster is org-SHAPED; an order moves through STAGES, and
 *  the two are different questions. A `flow|` line records the sequence, which
 *  the roster itself does not contain — so this view only exists when someone
 *  has written the sequence down. It is never inferred from the sheet's
 *  layout: the order work actually travels in is operational knowledge, and a
 *  guessed process displayed to reps as fact is worse than no diagram.
 *
 *  A stage naming a real team links to it (people count, lead, expandable);
 *  any other stage renders as a plain step, so a flow can include stages that
 *  are not teams at all. */
function kbRosterFlowHtml_(data) {
  var legend = data.legend, seen = {};
  if (!data.phases.length) {
    return '<div class="kb-ros-empty">' +
      '<b>No process flow recorded yet.</b>' +
      '<p>This roster describes who is on which team. To show the order work moves in, ' +
      'add phases and steps — the sequence is yours to state, and is never guessed ' +
      'from the layout:</p>' +
      '<pre class="kb-ros-flowhint">phase| 1. Intake: PPD, MA Education\n' +
      'phase| 2. Qualifications: Qualifications*decision, PT Scheduling\n' +
      'step| PPD -&gt; MA Education\n' +
      'step| Qualifications -&gt; PT Scheduling: Route A — PT Eval needed</pre>' +
      '<p>Mark a branch point with <code>*decision</code>. Use <code>phase| *: Name</code> ' +
      'for something feeding in from outside the phases. A node matching a team name links ' +
      'to that team.</p></div>';
  }

  // Index teams so a node naming one links to its people.
  var byTeam = {};
  data.depts.forEach(function (d) {
    d.teams.forEach(function (t) {
      byTeam[kbRosterKey_(t.name)] = t;
      if (t.sub) byTeam[kbRosterKey_(t.name + ' > ' + t.sub)] = t;
    });
  });
  // Route labels are read off the STEPS, so a node can state what leads out of
  // it without the diagram having to carry the text.
  var outBy = {};
  data.steps.forEach(function (st) {
    var k = kbRosterKey_(st.from);
    (outBy[k] = outBy[k] || []).push(st);
  });

  var nodeHtml = function (n, ri, ci) {
    var t = byTeam[kbRosterKey_(n.name)];
    var id = 'kb-fn-' + kbRosterSlug_(n.name);
    var outs = outBy[kbRosterKey_(n.name)] || [];
    var routes = outs.filter(function (o) { return o.label; });
    return '<div class="kb-ros-fnode' + (n.decision ? ' is-decision' : '') + (t ? ' is-team' : '') + '"' +
        ' id="' + id + '" data-col="' + ci + '" data-row="' + ri + '"' +
        ' data-node="' + kbRosterAttr_(kbRosterKey_(n.name)) + '">' +
      '<div class="kb-ros-fnode-head">' +
        (t
          ? '<button type="button" class="kb-ros-toggle" aria-expanded="false" ' +
              'aria-controls="' + id + '-p" onclick="kbRosterToggleNode_(this)">' + n.name + '</button>'
          : '<span class="kb-ros-toggle is-plain">' + n.name + '</span>') +
        (n.decision ? '<span class="kb-ros-flag is-decision">decision</span>' : '') +
        (n.join ? '<span class="kb-ros-flag is-join">join</span>' : '') +
      '</div>' +
      // An AND-join: several inbound paths, not alternatives. Without this the
      // diagram reads as "any one path proceeds", which is the opposite of a
      // stage that waits for every applicable one.
      (n.join ? '<span class="kb-ros-joinnote">Waits for every applicable path above to complete</span>' : '') +
      (t ? '<span class="kb-ros-nodemeta">' + t.people.length + ' ' +
             (t.people.length === 1 ? 'person' : 'people') + '</span>' : '') +
      (routes.length
        ? '<ul class="kb-ros-routes">' + routes.map(function (o) {
            return '<li><span class="kb-ros-routelbl">' + o.label + '</span> → ' + o.to + '</li>';
          }).join('') + '</ul>'
        : '') +
      (t
        ? '<ul class="kb-ros-children is-leaves" id="' + id + '-p" role="group">' +
            '<li class="kb-ros-people">' +
              t.people.map(function (p) { return kbRosterPersonHtml_(p, legend, null, seen); }).join('') +
            '</li></ul>'
        : '') +
      '</div>';
  };

  var cols = data.phases.map(function (ph, ci) {
    return '<section class="kb-ros-phase' + (ph.external ? ' is-external' : '') + '">' +
      '<h3 class="kb-ros-phase-name">' + (ph.name || 'Feeds in') + '</h3>' +
      '<div class="kb-ros-fnodes">' +
        ph.nodes.map(function (n, ri) { return nodeHtml(n, ri, ci); }).join('') +
      '</div></section>';
  }).join('');

  // The connector layer is drawn AFTER layout, by measuring the boxes CSS has
  // already placed — so the diagram cannot disagree with what is on screen,
  // and no layout engine is needed.
  // A step naming a node no phase declares would just VANISH from the diagram,
  // which would look complete while missing a connection — the reassuring
  // failure this codebase names (INV-187). Say so instead.
  var declared = {};
  data.phases.forEach(function (ph) { ph.nodes.forEach(function (n) { declared[kbRosterKey_(n.name)] = 1; }); });
  var seenD = {}, uniqD = [];
  data.steps.forEach(function (st) {
    [st.from, st.to].forEach(function (x) {
      var k = kbRosterKey_(x);
      if (!declared[k] && !seenD[k]) { seenD[k] = 1; uniqD.push(x); }
    });
  });

  return '<div class="kb-ros-proc" data-proc="1">' +
    '<div class="kb-ros-note">Nodes naming a team open to show its people. ' +
      'Routes are labelled on the node they leave.</div>' +
    (uniqD.length
      ? '<div class="kb-ros-warn" role="alert">' + uniqD.length + ' step(s) name a node no phase declares, ' +
        'so those connections are not drawn: ' + uniqD.join(', ') + '.</div>'
      : '') +
    '<div class="kb-ros-procwrap">' +
      '<svg class="kb-ros-edges" aria-hidden="true"></svg>' +
      '<div class="kb-ros-phases">' + cols + '</div>' +
    '</div></div>';
}

/** PURE: decides what KIND of connector an edge needs, given the two boxes'
 *  geometry and their column/row positions. Extracted because every drawing
 *  bug so far lived in this decision rather than in the path arithmetic —
 *  same-column steps misread as loop-backs, skips drawn as steps, upward
 *  edges pointing at the source — and none of it was testable while it sat
 *  inside a function that needs a real browser layout.
 *    kind: 'step' | 'skip' | 'phaseSkip' | 'forward' | 'back'
 *    down: true when the target sits below the source (same column only) */
function kbRosterEdgeKind_(ra, rb, colA, colB, rowA, rowB, reciprocal) {
  // Classify by LEFT edges: a sibling stacked in the same column always sits
  // left of its parent's RIGHT edge, so a right-vs-left test calls every
  // vertical step a loop-back.
  var sameCol = Math.abs(rb.left - ra.left) < 8;
  if (sameCol) {
    return {
      kind: Math.abs(rowB - rowA) === 1 ? 'step' : 'skip',
      down: rowB > rowA,
      lane: reciprocal ? (rowB > rowA ? -7 : 7) : 0,
    };
  }
  if (rb.left < ra.left - 8) return { kind: 'back', down: true, lane: 0 };
  return { kind: (colB - colA) > 1 ? 'phaseSkip' : 'forward', down: true, lane: 0 };
}

/** Draws the edges by MEASURING the laid-out boxes. Runs after render, on
 *  resize, and after any expand/collapse, because opening a node moves every
 *  box below it. */
function kbRosterDrawEdges_(root) {
  if (!root) return;
  var proc = root.querySelector('.kb-ros-proc');
  var svg = proc && proc.querySelector('.kb-ros-edges');
  var wrap = proc && proc.querySelector('.kb-ros-procwrap');
  if (!svg || !wrap) return;
  var data = kbRosterData_(root);
  var box = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrap.scrollWidth);
  svg.setAttribute('height', wrap.scrollHeight);
  svg.setAttribute('viewBox', '0 0 ' + wrap.scrollWidth + ' ' + wrap.scrollHeight);
  // A CSS attribute selector matches the DECODED attribute value, while the
  // key comes from the (escaped) parse — decode it or a node whose name
  // carries & < > is never found and its edges silently vanish.
  var find = function (name) {
    return proc.querySelector('[data-node="' + kbFenceDecode_(kbRosterKey_(name)).replace(/"/g, '') + '"]');
  };
  // A RECIPROCAL pair (A→B and B→A, e.g. an appointment bouncing between two
  // stages) would draw two opposite arrows on the same line, overlapping into
  // one ambiguous stroke. Offset each side so both remain readable.
  var pairKey = {};
  data.steps.forEach(function (st) { pairKey[kbRosterKey_(st.from) + '\u0000' + kbRosterKey_(st.to)] = 1; });
  var parts = [];
  data.steps.forEach(function (st) {
    var a = find(st.from), b = find(st.to);
    if (!a || !b) return;                      // a step naming an undeclared node
    var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    var ax = ra.right - box.left + wrap.scrollLeft, ay = ra.top - box.top + ra.height / 2 + wrap.scrollTop;
    var bx = rb.left - box.left + wrap.scrollLeft, by = rb.top - box.top + rb.height / 2 + wrap.scrollTop;
    // Classify by the boxes' LEFT edges, not source-right vs target-left: two
    // nodes stacked in the SAME column always have target-left < source-right,
    // so that test called every vertical step a loop-back (8 of 14 here).
    var colA = +(a.getAttribute('data-col') || 0), colB = +(b.getAttribute('data-col') || 0);
    var rowA = +(a.getAttribute('data-row') || 0), rowB = +(b.getAttribute('data-row') || 0);
    var reciprocal = !!pairKey[kbRosterKey_(st.to) + '\u0000' + kbRosterKey_(st.from)];
    var k = kbRosterEdgeKind_(ra, rb, colA, colB, rowA, rowB, reciprocal);
    var sameCol = k.kind === 'step' || k.kind === 'skip';
    var back = k.kind === 'back';
    var skip = k.kind === 'phaseSkip';
    var d, cls = '';
    if (sameCol) {
      var cx = ra.left - box.left + ra.width / 2 + wrap.scrollLeft + k.lane;
      var aTop = ra.top - box.top + wrap.scrollTop, aBot = ra.bottom - box.top + wrap.scrollTop;
      var bTop = rb.top - box.top + wrap.scrollTop, bBot = rb.bottom - box.top + wrap.scrollTop;
      var down = k.down;
      if (k.kind === 'step') {
        // Adjacent siblings: a straight vertical. Drawn source→target so the
        // arrowhead lands on the TARGET even when the edge runs upward — it
        // previously always ended at the topmost box, pointing at the source.
        d = down ? ('M' + cx + ',' + aBot + ' L' + cx + ',' + bTop)
                 : ('M' + cx + ',' + aTop + ' L' + cx + ',' + bBot);
      } else {
        // A SKIP within the column — it passes a node it does not visit, so it
        // arcs around the side. Drawn as a straight vertical it was
        // indistinguishable from the step-by-step chain, which is what made
        // "PAR → Approval" read as "you must pass through Appeals".
        var sx = ra.right - box.left + wrap.scrollLeft + 12;
        var y1 = aTop + ra.height / 2, y2 = bTop + rb.height / 2;
        d = 'M' + (ra.right - box.left + wrap.scrollLeft) + ',' + y1 +
            ' C' + sx + ',' + y1 + ' ' + sx + ',' + y2 + ' ' + (rb.right - box.left + wrap.scrollLeft) + ',' + y2;
        cls = ' is-skip';
      }
    } else if (skip) {
      // Bypasses an entire phase (an order entering past the first stage), so
      // it arcs ABOVE the columns rather than threading between the boxes it
      // does not touch.
      var top2 = Math.min(ra.top, rb.top) - box.top + wrap.scrollTop - 16;
      var axm = ra.left - box.left + ra.width / 2 + wrap.scrollLeft;
      var bxm = rb.left - box.left + rb.width / 2 + wrap.scrollLeft;
      d = 'M' + axm + ',' + (ra.top - box.top + wrap.scrollTop) +
          ' C' + axm + ',' + top2 + ' ' + bxm + ',' + top2 + ' ' + bxm + ',' + (rb.top - box.top + wrap.scrollTop);
      cls = ' is-skip';
    } else if (back) {
      // Route a back-edge UNDER both boxes so it cannot be mistaken for a
      // forward step.
      var ay2 = ra.bottom - box.top + wrap.scrollTop, by2 = rb.bottom - box.top + wrap.scrollTop;
      var low = Math.max(ay2, by2) + 14;
      var axc = ra.left - box.left + ra.width / 2 + wrap.scrollLeft;
      var bxc = rb.left - box.left + rb.width / 2 + wrap.scrollLeft;
      d = 'M' + axc + ',' + ay2 + ' L' + axc + ',' + low + ' L' + bxc + ',' + low + ' L' + bxc + ',' + by2;
    } else {
      var mid = ax + (bx - ax) / 2;
      d = 'M' + ax + ',' + ay + ' C' + mid + ',' + ay + ' ' + mid + ',' + by + ' ' + bx + ',' + by;
    }
    parts.push('<path d="' + d + '" class="kb-ros-edge' + (back ? ' is-back' : '') + cls + '" marker-end="url(#kb-ros-arrow)"/>');
  });
  svg.innerHTML =
    '<defs><marker id="kb-ros-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">' +
      '<path d="M0,0 L8,4 L0,8 z"/></marker></defs>' + parts.join('');
}

function kbRosterBodyHtml_(data, mode) {
  if (mode === 'capabilities') return kbRosterCapabilitiesHtml_(data);
  if (mode === 'coverage') return kbRosterCoverageHtml_(data);
  if (mode === 'chart') return kbRosterChartHtml_(data);
  if (mode === 'flow') return kbRosterFlowHtml_(data);
  return kbRosterTeamsHtml_(data);
}

function kbRosterModeBtn_(mode, key, label) {
  var on = mode === key;
  return '<button type="button" class="kb-ros-mode' + (on ? ' on' : '') + '" role="tab" aria-selected="' + on + '"' +
    ' data-mode="' + key + '" onclick="kbRosterSetMode_(this)">' + label + '</button>';
}

function kbRosterHtml_(text) {
  var data = kbRosterParse_(text);
  var mode = 'teams';
  var total = kbRosterPeopleIndex_(data).order.length;
  var legendHtml = Object.keys(data.legend).length
    ? '<div class="kb-ros-legend">' + Object.keys(data.legend).map(function (k) {
        return '<span class="kb-ros-legend-item"><b>' + k + '</b> ' + data.legend[k] + '</span>';
      }).join('') + '</div>'
    : '';
  // The SOURCE rides on the root so a mode switch can re-render from the same
  // parsed data without re-running kbMd_ over the whole article.
  return '<div class="kb-roster" data-roster="1" data-mode="' + mode + '" data-src="' + kbRosterAttr_(text) + '">' +
    '<div class="kb-ros-bar">' +
      '<input type="search" class="kb-ros-search" placeholder="Filter by team, person or tag…" ' +
        'aria-label="Filter the roster by team, person or tag" oninput="kbRosterFilter_(this)">' +
      '<span class="kb-ros-count" role="status" aria-live="polite">' + total + ' people</span>' +
      '<button type="button" class="kb-ros-expand" onclick="kbRosterExpand_(this)" ' +
        'title="Open this roster full screen">Expand</button>' +
      '<span class="kb-ros-modes" role="tablist" aria-label="Roster view">' +
        kbRosterModeBtn_(mode, 'teams', 'Teams') +
        kbRosterModeBtn_(mode, 'capabilities', 'Capabilities') +
        kbRosterModeBtn_(mode, 'chart', 'Chart') +
        (data.phases.length ? kbRosterModeBtn_(mode, 'flow', 'Flow') : '') +
        kbRosterModeBtn_(mode, 'coverage', 'Coverage') +
      '</span>' +
    '</div>' + legendHtml +
    '<div class="kb-ros-panel" hidden></div>' +
    '<div class="kb-ros-body">' + kbRosterBodyHtml_(data, mode) + '</div>' +
    (data.warnings.length
      ? '<div class="kb-ros-warn">' + data.warnings.length + ' line(s) in this roster block were not understood and are not shown.</div>'
      : '') +
    '</div>';
}

/** The Reference reader is a height-capped panel inside a two-column shell, so
 *  an interactive block ends up in a small window with its own nested
 *  scrollbars. Rather than re-architect that shell (it is right for prose),
 *  the block can open itself nearly full-viewport. The overlay hosts a FRESH
 *  instance built from the same source, so it carries its own filter and view
 *  state and closing it leaves the inline copy exactly as it was. */
function kbRosterExpand_(btn) {
  var root = kbRosterRoot_(btn);
  if (!root) return;
  var src = kbFenceSrc_(root);
  // ensureOverlay (never a hand-rolled overlay — INV-83) so Escape, the focus
  // trap and the focus-restore lifecycle all behave; onClose is idempotent.
  var ov = ensureOverlay('kb-roster-overlay', {
    label: 'Roster',
    onClose: function () { var o = document.getElementById('kb-roster-overlay'); if (o) o.remove(); },
  });
  ov.innerHTML = '<div class="modal kb-roster-modal">' +
    '<div class="kb-roster-modal-head">' +
      '<button type="button" class="kb-btn" onclick="closeOverlay(document.getElementById(\'kb-roster-overlay\'))">Close</button>' +
    '</div>' + kbRosterHtml_(src) + '</div>';
  // The expanded copy has no use for its own Expand button.
  var dup = ov.querySelector('.kb-ros-expand');
  if (dup) dup.remove();
}

function kbRosterRoot_(el) { return el && el.closest ? el.closest('.kb-roster') : null; }

function kbRosterData_(root) {
  // NOT "exactly what kbMd_ handed the renderer" — the DOM decodes EVERY
  // entity on read, &lt; included. kbFenceSrc_ restores the escaped form.
  return kbRosterParse_(kbFenceSrc_(root));
}

function kbRosterSetMode_(btn) {
  var root = kbRosterRoot_(btn);
  if (!root) return;
  var mode = btn.getAttribute('data-mode') || 'teams';
  root.setAttribute('data-mode', mode);
  var btns = root.querySelectorAll('.kb-ros-mode');
  for (var i = 0; i < btns.length; i++) {
    var on = btns[i] === btn;
    btns[i].classList.toggle('on', on);
    btns[i].setAttribute('aria-selected', on ? 'true' : 'false');   // INV-174
  }
  var body = root.querySelector('.kb-ros-body');
  if (body) body.innerHTML = kbRosterBodyHtml_(kbRosterData_(root), mode);
  if (mode === 'flow') setTimeout(function () { kbRosterDrawEdges_(root); }, 0);
  kbRosterClosePanel_(root);
  var search = root.querySelector('.kb-ros-search');
  if (search) kbRosterFilter_(search);      // a mode switch keeps the active filter
  if (typeof animateListSwap_ === 'function') { try { animateListSwap_(body, '.kb-ros-team'); } catch (e) {} }
}

/** Clicking a person opens a detail panel rather than copying, because "where
 *  else does this person work" is the question the grid cannot answer. Copy
 *  moved INTO the panel so both actions stay one click from the name. */
function kbRosterOpenPerson_(btn) {
  var root = kbRosterRoot_(btn);
  if (!root) return;
  // Re-escaped to match the index, which is keyed off the parsed source.
  var name = kbFenceEsc_(btn.getAttribute('data-name') || '');
  var idx = kbRosterPeopleIndex_(kbRosterData_(root));
  var e = idx.byName[name.toLowerCase()];
  var panel = root.querySelector('.kb-ros-panel');
  if (!panel || !e) return;
  var legend = kbRosterData_(root).legend;
  var places = e.places.map(function (pl) {
    return '<li>' + pl.team + (pl.sub ? ' <span class="kb-ros-sub">' + pl.sub + '</span>' : '') +
      ' <span class="kb-ros-where">' + pl.dept + '</span></li>';
  }).join('');
  panel.innerHTML =
    '<div class="kb-ros-panel-head">' +
      '<b>' + e.name + '</b>' + kbRosterFlags_(e, legend) +
      '<span class="kb-ros-panel-actions">' +
        '<button type="button" class="kb-btn kb-ros-copy" data-name="' + kbRosterAttr_(e.name) + '" ' +
          'onclick="kbRosterCopy_(this)">Copy name</button>' +
        '<button type="button" class="kb-btn" onclick="kbRosterClosePanel_(this)" aria-label="Close details">Close</button>' +
      '</span>' +
    '</div>' +
    (e.tags.length ? '<div class="kb-ros-panel-tags">' +
      e.tags.map(function (t) { return kbRosterTagChip_(t, legend, true); }).join('') + '</div>' : '') +
    '<div class="kb-ros-panel-where">On ' + e.places.length + ' team' + (e.places.length === 1 ? '' : 's') +
      ':<ul>' + places + '</ul></div>';
  panel.hidden = false;
  panel.setAttribute('tabindex', '-1');
  try { panel.focus(); } catch (err) {}
}

function kbRosterClosePanel_(elOrRoot) {
  var root = (elOrRoot && elOrRoot.classList && elOrRoot.classList.contains('kb-roster'))
    ? elOrRoot : kbRosterRoot_(elOrRoot);
  var panel = root ? root.querySelector('.kb-ros-panel') : null;
  if (!panel) return;
  panel.hidden = true;
  panel.innerHTML = '';
}

/** Clicking a tag asks "who else can do this" — it drives the same filter box
 *  the rep would have typed into, so the two paths cannot diverge. */
function kbRosterTagFilter_(btn) {
  var root = kbRosterRoot_(btn);
  if (!root) return;
  var tag = btn.getAttribute('data-tag') || '';
  var search = root.querySelector('.kb-ros-search');
  if (!search) return;
  // A `tag:` query matches the tag EXACTLY. A bare substring would be far too
  // loose for the short tags this data uses: filtering on "C" also matches
  // "Medical Review" and "Insurance Change" — 42 of 46 people.
  var q = 'tag:' + tag;
  search.value = (String(search.value || '').trim().toLowerCase() === q.toLowerCase()) ? '' : q;
  kbRosterFilter_(search);
  try { search.focus(); } catch (e) {}
}

/** Filters in place — hiding non-matching people, then teams and departments
 *  left with nothing. No re-render, so the article around it is untouched. */
function kbRosterFilter_(input) {
  var root = kbRosterRoot_(input);
  if (!root) return;
  var q = String(input.value || '').trim().toLowerCase();
  // The coverage view is an aggregate of the WHOLE roster; filtering it to a
  // subset would report totals that quietly describe only part of the team.
  var mode = root.getAttribute('data-mode');
  // Every view that is NOT the dept/team grid must bypass the row-counting
  // walk, or it reports 0. This is the third time a new view has hit it, so
  // the condition is now "not the grid" rather than a list of view names.
  if (mode && mode !== 'teams' && mode !== 'capabilities') {
    var cnt0 = root.querySelector('.kb-ros-count');
    if (cnt0) cnt0.textContent = q ? 'filter applies to Teams and Capabilities' : (kbRosterPeopleIndex_(kbRosterData_(root)).order.length + ' people');
    return;
  }
  var shown = 0, seen = {};
  var tm = q.match(/^tag:\s*(.+)$/);
  var tagNeedle = tm ? '|' + tm[1].trim() + '|' : '';
  var depts = root.querySelectorAll('.kb-ros-dept');
  for (var d = 0; d < depts.length; d++) {
    var deptName = depts[d].getAttribute('data-dept') || '';
    var teams = depts[d].querySelectorAll('.kb-ros-team');
    var deptHit = 0;
    for (var t = 0; t < teams.length; t++) {
      var teamName = teams[t].getAttribute('data-team') || '';
      // A query matching the TEAM (or its department) keeps the whole team —
      // "who is on PT Eval" is as common a question as "where is Sergio".
      // In tag mode a TEAM never matches — only the people carrying the tag.
      var teamMatch = tagNeedle ? false : (!q || teamName.indexOf(q) >= 0 || deptName.indexOf(q) >= 0);
      var people = teams[t].querySelectorAll('.kb-ros-person');
      var teamHit = 0;
      for (var i = 0; i < people.length; i++) {
        var hit = tagNeedle
          ? (people[i].getAttribute('data-tags') || '').indexOf(tagNeedle) >= 0
          : (teamMatch || (people[i].getAttribute('data-hay') || '').indexOf(q) >= 0);
        people[i].style.display = hit ? '' : 'none';
        if (hit) { teamHit++; seen[people[i].getAttribute('data-name') || ''] = 1; }
      }
      teams[t].style.display = teamHit ? '' : 'none';
      deptHit += teamHit;
      shown += teamHit;
    }
    depts[d].style.display = deptHit ? '' : 'none';
  }
  // Report DISTINCT people in every mode. This previously mixed units —
