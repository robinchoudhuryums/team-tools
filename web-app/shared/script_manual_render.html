      keys.forEach(function (k) { KB_KBIMG.inflight[k] = 1; });
      var settle = function (res) {
        keys.forEach(function (k) {
          delete KB_KBIMG.inflight[k];
          var url = res && res.images && res.images[k];
          if (url) KB_KBIMG.cache[k] = url;
          kbKbimgApply_(k, url || (res && res.missing && res.missing.indexOf(k) >= 0 ? 'missing' : 'failed'));
        });
      };
      try {
        google.script.run
          .withSuccessHandler(function (res) { settle(res && !res.error ? res : null); })
          .withFailureHandler(function () { settle(null); })
          .getKbImages(keys);
      } catch (e) { settle(null); }
    })(want.slice(b, b + KB_KBIMG_BATCH));
  }
}
function kbKbimgSchedule_() { if (!KB_KBIMG.timer) KB_KBIMG.timer = setTimeout(kbHydrateKbImages_, 30); }
(function kbBindKbImages_() {
  if (typeof MutationObserver !== 'function' || typeof document === 'undefined' || !document.body) return;
  new MutationObserver(function (records) {
    for (var i = 0; i < records.length; i++) {
      var added = records[i].addedNodes;
      for (var j = 0; j < added.length; j++) {
        var n = added[j];
        if (n.nodeType === 1 && ((n.classList && n.classList.contains('kb-kbimg')) || (n.querySelector && n.querySelector('.kb-kbimg')))) { kbKbimgSchedule_(); return; }
      }
    }
  }).observe(document.body, { childList: true, subtree: true });
})();

function kbDiagramPendingHtml_(name, body) {
  return '<figure class="kb-diagram-pending"><figcaption><b>Diagram</b> — ' +
    (String(body || '').trim() || name || 'untitled') + '</figcaption></figure>';
}

/** Pure (Node-pinned) — demote every rendered heading one level, so a
 *  section's own `## 5.9.2` reads as a sub-heading under the section title. */
function kbShiftHeadings_(html) {
  return String(html || '').replace(/<(\/?)h([1-5])(?=[\s>])/g, function (m, sl, n) { return '<' + sl + 'h' + (+n + 1); });
}
var KB_CO_ICON = { critical: 'warning', 'watch-out': 'warning', policy: 'fileText', note: 'info' };
/** M2 (design handoff) — a callout's opener becomes kicker + title, for the
 *  chapter and (M18) the manual's search results. */
function kbDecorateCallouts_(root, sel) {
  // M2 (design handoff): a callout's bold opener becomes kicker + title. The text is
  // WRAPPED, never changed — the separator stays in the DOM, visually hidden — so the
  // landing, the previews and search read the same words. Plain-text labels only.
  root.querySelectorAll(sel).forEach(function (q) {
    var p = q.firstElementChild, s = p && p.tagName === 'P' ? p.firstElementChild : null;
    if (!s || s.tagName !== 'STRONG' || s !== p.firstChild || s.children.length) return;
    var m = /^\s*(Critical|Policy|Watch-out|Note)\b(\s*\u2014\s*)?([\s\S]*)$/.exec(s.textContent);
    if (!m || (!m[2] && /\w/.test(m[3]))) return;   // a label run straight into words is left as written
    // "Critical." — punctuation with no title rides the hidden separator
    var tail = m[2] ? '<span class="kb-co-sep">' + esc(m[2]) + '</span>' + (m[3] ? '<span class="kb-co-title">' + esc(m[3]) + '</span>' : '')
      : (m[3] ? '<span class="kb-co-sep">' + esc(m[3]) + '</span>' : '');
    s.innerHTML = '<span class="kb-co-kick">' + icon(KB_CO_ICON[m[1].toLowerCase()], 13) + esc(m[1]) + '</span>' + tail;
    // "**Note** — If the note reads…" (42 callouts in the source put the dash
    // OUTSIDE the label): the dash rides the hidden separator too, or the body
    // opens with a stray "—" under the kicker.
    var nx = !m[2] && !m[3] ? s.nextSibling : null, dm = nx && nx.nodeType === 3 && /^\s*[\u2014\u2013]\s*/.exec(nx.nodeValue);
    if (dm) {
      var sep = document.createElement('span');
      sep.className = 'kb-co-sep';
      sep.textContent = dm[0];
      nx.nodeValue = nx.nodeValue.slice(dm[0].length);
      p.insertBefore(sep, nx);
    }
  });
}

// ── M17 (design handoff, Phase 4) — footnotes ────────────────────────────────
var KB_FN_DIGITS = { '\u00b9': '1', '\u00b2': '2', '\u00b3': '3', '\u2074': '4', '\u2075': '5', '\u2076': '6', '\u2077': '7', '\u2078': '8', '\u2079': '9', '\u2070': '0' };
/** Pure (Node-pinned) — "¹²" → "12". */
function kbFnNum_(sup) { return String(sup || '').split('').map(function (c) { return KB_FN_DIGITS[c] || ''; }).join(''); }
/** The build puts a sub-section's notes under a "Notes" paragraph at its END
 *  (manual/footnotes.py), each opening with its superscript, and the numbers
 *  restart per sub-section. So a reference pairs with the first note of its
 *  number AFTER it — never the first on the page. Each reference becomes a
 *  button (its text unchanged) that opens the note in the shared card;
 *  references inside the notes, code, links, buttons and diagrams are left. */
function kbManualFootnotes_(root, sel) {
  // `sel`: the chapter's section bodies by default; the drawer passes its one article.
  root.querySelectorAll(sel || '.kb-man-sec .kb-article').forEach(function (art, ai) {
    var notes = [];
    [].slice.call(art.querySelectorAll('p')).forEach(function (p) {
      if (!(p.children.length === 1 && p.firstElementChild.tagName === 'STRONG' && p.textContent.trim() === 'Notes')) return;
      p.setAttribute('data-fn-h', '');
      for (var n = p.nextElementSibling; n && n.tagName === 'P'; n = n.nextElementSibling) {
        var m = /^\s*([\u00b9\u00b2\u00b3\u2074-\u2079\u2070]+)\s/.exec(n.textContent);
        if (!m) break;
        n.setAttribute('data-fn-note', m[1]);
        if (!n.id) n.id = 'kb-fn-' + ((art.closest('.kb-man-sec') || {}).id || 'kbd') + '-' + notes.length;
        notes.push(n);
      }
    });
    if (!notes.length) return;
    var walker = document.createTreeWalker(art, NodeFilter.SHOW_TEXT, null), targets = [], t;
    while ((t = walker.nextNode())) {
      var pe = t.parentElement;
      if (!pe || pe.closest('[data-fn-note], [data-fn-h], a, button, code, pre, svg, figure.kb-diagram, h1, h2, h3, h4, h5, h6')) continue;
      if (/[\u00b9\u00b2\u00b3\u2074-\u2079\u2070]/.test(t.nodeValue)) targets.push(t);
    }
    targets.forEach(function (tn) {
      var frag = document.createDocumentFragment(), str = tn.nodeValue, last = 0, mm, re = /[\u00b9\u00b2\u00b3\u2074-\u2079\u2070]+/g;
      while ((mm = re.exec(str))) {
        var note = null;
        for (var k = 0; k < notes.length && !note; k++) {
          if (notes[k].getAttribute('data-fn-note') === mm[0] && (tn.compareDocumentPosition(notes[k]) & Node.DOCUMENT_POSITION_FOLLOWING)) note = notes[k];
        }
        if (!note) continue;   // no note of that number after it: left as written
        if (mm.index > last) frag.appendChild(document.createTextNode(str.slice(last, mm.index)));
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'kb-fn-ref';
        b.setAttribute('data-fn-note', note.id);
        b.setAttribute('aria-label', 'Note ' + kbFnNum_(mm[0]));
        b.textContent = mm[0];
        frag.appendChild(b);
        last = mm.index + mm[0].length;
      }
      if (!last) return;
      if (last < str.length) frag.appendChild(document.createTextNode(str.slice(last)));
      tn.parentNode.replaceChild(frag, tn);
    });
  });
}

// ── Batch M4 — HCPCS codes in the manual become lookups ──────────────────────
/** The HCPCS Level II shape: one of the letters CMS assigns, then four digits,
 *  as a whole word ("E0601", "K0006"; not "BE0601", not "E06011"). */
var KB_HCPCS_RE = /\b[ABCDEGHJKLMPQRSTUV][0-9]{4}\b/g;
/** Pure (Node-pinned) — split text into plain runs and codes:
 *  [{code: false, v: 'Rent '}, {code: true, v: 'E0601'}, …]. */
function kbHcpcsSplit_(text) {
  var s = String(text == null ? '' : text), out = [], last = 0, m;
  var re = new RegExp(KB_HCPCS_RE.source, 'g');
  while ((m = re.exec(s))) {
    if (m.index > last) out.push({ code: false, v: s.slice(last, m.index) });
    out.push({ code: true, v: m[0] });
    last = m.index + m[0].length;
  }
  if (last < s.length) out.push({ code: false, v: s.slice(last) });
  return out;
}
/** Wrap every code in a rendered manual body in a link — TEXT NODES only
 *  (kbHighlightTerms_' discipline: the escape boundary kbMd_ drew is never
 *  reopened). A code already inside a link, a button, code, a heading or a
 *  diagram is left alone. Idempotent: a wrapped code is inside a link. */
function kbLinkHcpcs_(rootEl) {
  try {
    if (!rootEl) return;
    var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
    var targets = [], n;
    while ((n = walker.nextNode())) {
      var p = n.parentElement;
      if (!p || p.closest('a, button, code, pre, h1, h2, h3, h4, h5, h6, svg, figure.kb-diagram, .kb-gloss-mark, textarea')) continue;
      if (new RegExp(KB_HCPCS_RE.source).test(n.nodeValue)) targets.push(n);
    }
    targets.forEach(function (textNode) {
      var frag = document.createDocumentFragment();
      kbHcpcsSplit_(textNode.nodeValue).forEach(function (part) {
        if (!part.code) { frag.appendChild(document.createTextNode(part.v)); return; }
        var a = document.createElement('a');
        a.href = '#';
        a.className = 'kb-hcpcs';
        a.setAttribute('data-hcpcs', part.v);
        a.title = 'Look up ' + part.v + ' — its price, and a payor’s rules for it';
        a.textContent = part.v;
        frag.appendChild(a);
      });
      textNode.parentNode.replaceChild(frag, textNode);
    });
  } catch (_) {}
}

// #6 — copy a "canned response" snippet to the clipboard. Reads the sibling
// <pre>'s textContent (the browser decodes the HTML entities kbMd_ escaped back
// to raw text), so the paste is the original snippet, not the escaped markup.
function kbCopySnippet_(btn) {
  var card = btn && btn.closest ? btn.closest('.kb-snippet') : null;
  var pre = card ? card.querySelector('.kb-snippet-body') : null;
  var text = pre ? pre.textContent : '';
  copyText_(text, function (ok) {
    if (!ok) { manualCopyModal_(text, 'Snippet'); return; }
    if (!btn.getAttribute('data-lbl')) btn.setAttribute('data-lbl', btn.textContent);
    btn.textContent = 'Copied ✓';
    setTimeout(function () { btn.textContent = btn.getAttribute('data-lbl') || 'Copy'; }, 1500);
  });
}

// ── Article-image fallback (operator 2026-08-13) ────────────────────────────
// On this domain Workspace policy blocks the KB Images folder's link sharing,
// so the Drive thumbnail <img>s kbMd_ renders 403 for reps — the reader shows
// alt text and the anchor lands on a Workspace "blocked" page. The server CAN
// read the bytes (it runs as the folder-owning deployer), so a failed
// thumbnail is swapped for a data URL from kbGetImageData. One document-level
// CAPTURE-phase listener (error events don't bubble) covers every kbMd_
// render site — Reference reader, drawer, search chunks, training/empdocs
// readers, What's new — with zero per-site wiring. Scoped STRICTLY to
// drive.google.com/thumbnail sources: an external image failing must not send
// its arbitrary URL to our server. Session-cached per fileId (with a pending
// fan-out so two <img>s of one file fetch once); a failed fetch caches
// 'failed' so a broken file can't hammer the server on every re-render.
var KB_IMG_FB = { cache: {}, pending: {} };
function kbImgFileId_(src) {
  src = String(src || '');
  if (src.indexOf('https://drive.google.com/thumbnail?') !== 0) return null;
  var m = /[?&]id=([a-zA-Z0-9_-]+)/.exec(src);
  return m ? m[1] : null;
}
function kbImgApplyFallback_(img, dataUrl) {
  img.src = dataUrl;
  // Keep the wrapping anchor on the Drive URL — accounts WITH folder access
  // still get the full-size open path; a data: href would be blocked anyway.
}
function kbImgFallback_(img) {
  if (!img || img.dataset.kbFbTried) return;
  img.dataset.kbFbTried = '1';
  var fileId = kbImgFileId_(img.getAttribute('src'));
  if (!fileId) return;
  var hit = KB_IMG_FB.cache[fileId];
  if (hit === 'failed') return;
  if (hit) { kbImgApplyFallback_(img, hit); return; }
  if (KB_IMG_FB.pending[fileId]) { KB_IMG_FB.pending[fileId].push(img); return; }
  KB_IMG_FB.pending[fileId] = [img];
  var settle = function (dataUrl) {
    var imgs = KB_IMG_FB.pending[fileId] || [];
    delete KB_IMG_FB.pending[fileId];
    KB_IMG_FB.cache[fileId] = dataUrl || 'failed';
    if (!dataUrl) return;   // leave the alt text — today's degradation
    for (var i = 0; i < imgs.length; i++) {
      try { kbImgApplyFallback_(imgs[i], dataUrl); } catch (e) {}
    }
  };
  try {
    google.script.run
      .withSuccessHandler(function (res) { settle(res && res.success ? res.dataUrl : null); })
      .withFailureHandler(function () { settle(null); })
      .kbGetImageData(fileId);
  } catch (e) { settle(null); }
}
</script>
