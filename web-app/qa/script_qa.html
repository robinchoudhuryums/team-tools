// ── Phase 2: scorecards ────────────────────────────────────────────────────

function qaLoadScorecards_(fileId) {
  google.script.run
    .withSuccessHandler(function (r) {
      if (!QA_STATE.det || QA_STATE.det.fileId !== fileId) return;
      const host = document.getElementById('qa-score-form');
      if (!host) return;
      if (!r || r.error) { host.innerHTML = errorStateHtml_((r && r.error) || 'Could not load scorecards.'); return; }
      QA_STATE.criteria = r.criteria || [];
      QA_STATE.scorecards = r.scorecards || [];
      QA_STATE.selfEmpId = r.selfEmpId || '';
      // Seed the form from MY latest card, so a re-score ADJUSTS rather than
      // restarts (latest-per-reviewer wins server-side).
      QA_STATE.ratings = {};
      QA_STATE.scoreNotes = '';
      for (let i = 0; i < QA_STATE.scorecards.length; i++) {
        const c = QA_STATE.scorecards[i];
        if (String(c.empId) !== String(QA_STATE.selfEmpId)) continue;
        Object.keys(c.ratings || {}).forEach(function (k) {
          const crit = qaCritByKey_(QA_STATE.criteria, k);
          const t = qaCritTypeOf_(crit);
          if (t === 'scale') { const v = Number(c.ratings[k]); if (v >= 1 && v <= 5) QA_STATE.ratings[k] = v; }
          else if (crit) QA_STATE.ratings[k] = String(c.ratings[k]);   // 'yes'/'no' or the option text
        });
        QA_STATE.scoreNotes = c.notes || '';
        break;   // newest-first — the first of mine is my latest
      }
      qaRenderScoreForm_();
      qaRenderScorecardList_();
    })
    .withFailureHandler(function (err) {
      if (!QA_STATE.det || QA_STATE.det.fileId !== fileId) return;
      const host = document.getElementById('qa-score-form');
      if (host) host.innerHTML = errorStateHtml_('Could not load scorecards: ' + (err && err.message));
    })
    .qaListScorecards(fileId);
}

/** Q3 — the form carries its anchors (what 1 / 3 / 5 mean) and a running
 *  average + completeness line, toned by the shared qaScoreTone_. */
function qaRenderScoreForm_() {
  const host = document.getElementById('qa-score-form');
  if (!host) return;
  const crit = QA_STATE.criteria || [];
  if (!crit.length) { host.innerHTML = ''; return; }
  const avg = qaCardAvg_(QA_STATE.ratings);
  const rated = Object.keys(QA_STATE.ratings).length;
  const tone = qaScoreTone_(avg);
  host.innerHTML =
  '<div class="qa-score-anchors" aria-hidden="true"><span>1 · missed</span><span>3 · met</span><span>5 · exemplary</span></div>' +
  crit.map(function (c) {
    const cur = QA_STATE.ratings[c.key];
    const t = qaCritTypeOf_(c);
    let control;
    if (t === 'check') {
      // Yes / No pair — click the selected one again to unselect (the intake
      // accidental-click recovery pattern), so "not answered" stays possible.
      control = '<div class="qa-rate-btns" role="group" aria-label="' + esc(c.label) + '">' +
        ['yes', 'no'].map(function (v) {
          return '<button type="button" class="qa-yn-btn" data-v="' + v + '" aria-pressed="' + (cur === v ? 'true' : 'false') +
            '" onclick="qaSetRating_(\'' + esc(c.key) + '\', \'' + v + '\')">' + (v === 'yes' ? 'Yes' : 'No') + '</button>';
        }).join('') + '</div>';
    } else if (t === 'choice') {
      control = '<select class="qa-choice-sel" aria-label="' + esc(c.label) + '" onchange="qaSetRating_(\'' + esc(c.key) + '\', this.value)">' +
        '<option value=""' + (cur == null ? ' selected' : '') + '>— choose —</option>' +
        (c.options || []).map(function (o) {
          return '<option value="' + esc(o) + '"' + (String(cur) === String(o) ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
    } else {
      control = '<div class="qa-rate-btns" role="group" aria-label="' + esc(c.label) + ' rating">' +
        [1, 2, 3, 4, 5].map(function (v) {
          return '<button type="button" class="qa-rate-btn" aria-pressed="' + (cur === v ? 'true' : 'false') +
            '" aria-label="' + esc(c.label) + ': ' + v + ' of 5" onclick="qaSetRating_(\'' + esc(c.key) + '\', ' + v + ')">' + v + '</button>';
        }).join('') + '</div>';
    }
    return '<div class="qa-score-row"><span>' + esc(c.label) + '</span>' + control + '</div>';
  }).join('') +
  '<div class="qa-score-running" aria-live="polite">' +
    (avg == null
      ? '<span>No criteria rated yet</span>'
      : '<span class="qa-sc-chip"' + (tone ? ' data-tone="' + tone + '"' : '') + '>running avg ' + esc(String(avg)) + ' /5</span>') +
    '<span>' + rated + ' of ' + crit.length + ' rated</span>' +
  '</div>' +
  '<textarea class="qa-score-notes" id="qa-score-notes" aria-label="Scorecard notes" placeholder="Notes (optional)">' + esc(QA_STATE.scoreNotes || '') + '</textarea>' +
  '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">' +
    '<button type="button" class="qa-btn prime" id="qa-score-save" onclick="qaSubmitScorecard_()">Save scorecard</button>' +
    '<span class="qa-note" style="margin:0">Re-saving replaces your previous score for this recording.</span>' +
  '</div>';
}

function qaSetRating_(key, v) {
  // Clicking the SELECTED rating unselects it (the intake accidental-click
  // recovery pattern); a dropdown's blank option clears the same way.
  if (v === '' || v == null || QA_STATE.ratings[key] === v) delete QA_STATE.ratings[key];
  else QA_STATE.ratings[key] = v;
  const ta = document.getElementById('qa-score-notes');
  if (ta) QA_STATE.scoreNotes = ta.value;   // typed notes survive the re-render
  qaRenderScoreForm_();
}

function qaSubmitScorecard_() {
  const r = QA_STATE.det;
  if (!r) return;
  if (!Object.keys(QA_STATE.ratings).length) { showToast('Rate at least one criterion.', 'toast-warn'); return; }
  const ta = document.getElementById('qa-score-notes');
  const notes = ta ? String(ta.value || '').trim() : '';
  const btn = document.getElementById('qa-score-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) { btn.disabled = false; btn.textContent = 'Save scorecard'; }
      if (!res || !res.success) { showToast((res && res.error) || 'Save failed.', 'toast-error'); return; }
      showToast('Scorecard saved', 'toast-success');
      if (QA_STATE.det && QA_STATE.det.fileId === r.fileId) qaLoadScorecards_(r.fileId);
    })
    .withFailureHandler(function (err) {
      if (btn) { btn.disabled = false; btn.textContent = 'Save scorecard'; }
      showToast('Save failed: ' + (err && err.message), 'toast-error');
    })
    .qaSaveScorecard(r.fileId, QA_STATE.ratings, notes);
}

function qaCardAvg_(ratings) {
  let sum = 0, n = 0;
  Object.keys(ratings || {}).forEach(function (k) {
    const v = Number(ratings[k]);
    if (v >= 1 && v <= 5) { sum += v; n++; }
  });
  return n ? Math.round((sum / n) * 10) / 10 : null;
}
/** The mean of several cards' own averages (a recording's overall) — null
 *  when no card carries a rating. */
function qaCardsAvg_(cards) {
  let sum = 0, n = 0;
  (cards || []).forEach(function (c) { const a = qaCardAvg_(c && c.ratings); if (a != null) { sum += a; n++; } });
  return n ? Math.round((sum / n) * 10) / 10 : null;
}

/** Shared scorecard-list markup — the detail's list AND the agent-facing My
 *  Reviews render through this ONE builder, so the two surfaces cannot drift
 *  (every string esc()'d; every 1..5 figure toned by qaScoreTone_). */
function qaCritByKey_(criteria, key) {
  return ((criteria || []).filter(function (c) { return c && c.key === key; })[0]) || null;
}
/** A criterion's type as the client reads it — absent = scale (the server's
 *  canonical shape carries `type` only when it is not scale). */
function qaCritTypeOf_(c) {
  const t = c && c.type;
  return (t === 'check' || t === 'choice') ? t : 'scale';
}
/** ONE chip builder for a card's ratings, by criterion type: a scale value is
 *  toned by qaScoreTone_; a check reads Yes/No (accent/destructive); a choice
 *  reads its option text untoned (a category is not a verdict). A key the
 *  live criteria no longer carry renders by key, untoned unless numeric. */
function qaRatingChipsHtml_(ratings, criteria) {
  return Object.keys(ratings || {}).map(function (k) {
    const crit = qaCritByKey_(criteria, k);
    const label = crit ? crit.label : k;
    const v = ratings[k];
    const t = crit ? qaCritTypeOf_(crit) : ((Number(v) >= 1 && Number(v) <= 5) ? 'scale' : 'choice');
    let tone = '', text = String(v);
    if (t === 'scale') tone = qaScoreTone_(v) || '';
    else if (t === 'check') { tone = String(v) === 'yes' ? 'yes' : String(v) === 'no' ? 'no' : ''; text = String(v) === 'yes' ? 'Yes' : String(v) === 'no' ? 'No' : String(v); }
    return '<span class="qa-sc-chip"' + (tone ? ' data-tone="' + tone + '"' : '') + '>' + esc(label) + ' ' + esc(text) + '</span>';
  }).join('');
}
function qaScorecardListHtml_(cards, criteria) {
  return (cards || []).map(function (c) {
    const avg = qaCardAvg_(c.ratings);
    const avgTone = qaScoreTone_(avg);
    return '<div class="qa-sc-item">' +
      '<div class="qa-sc-meta"><strong>' + esc(c.name || '') + '</strong>' +
        (avg != null ? '<span class="qa-sc-chip"' + (avgTone ? ' data-tone="' + avgTone + '"' : '') + '>avg ' + esc(String(avg)) + '/5</span>' : '') +
        '<span>' + esc(qaFmtDate_(c.createdMs)) + '</span></div>' +
      '<div class="qa-sc-meta" style="margin-top:4px">' + qaRatingChipsHtml_(c.ratings, criteria) + '</div>' +
      (c.notes ? '<div style="margin-top:4px">' + esc(c.notes) + '</div>' : '') +
      '</div>';
  }).join('');
}
function qaRenderScorecardList_() {
  const host = document.getElementById('qa-scorecards');
  if (!host) return;
  host.innerHTML = (QA_STATE.scorecards || []).length
    ? qaScorecardListHtml_(QA_STATE.scorecards, QA_STATE.criteria) : '';
}

// ── Phase 2: per-agent stats tab ───────────────────────────────────────────

function enterQaStatsView() {

function qaRenderStats_(d) {
  const area = document.getElementById('view-area');
  let html = qaAppBarHtml_('Stats', 'Stats', 'Per-agent review counts and scorecard averages, plus reviewer calibration.', '');
  if (d.notConfigured) {
    area.innerHTML = html + '<div class="qa-empty">QA is not set up yet — see the Recordings tab.</div>';
    return;
  }
  const agents = d.agents || [];
  html += '<div class="qa-stats-strip">' +
    '<span><strong>' + (Number(d.totalRecordings) || 0) + '</strong> recording(s)</span>' +
    '<span><strong>' + (Number(d.totalScorecards) || 0) + '</strong> scorecard(s)</span>' +
    '<span><strong>' + agents.filter(function (a) { return a.agent !== '(unassigned)'; }).length + '</strong> agent(s)</span>' +
    '</div>';
  // Columns: the fixed set + one per LIVE criterion. A missing average is an
  // em dash, never a confident 0 (INV-187).
  const cols = [
    { key: 'agent',      label: 'Agent',      name: true,    cell: function (r) { return esc(r.agent); } },
    { key: 'recordings', label: 'Recordings', numeric: true, cell: function (r) { return String(Number(r.recordings) || 0); } },
    { key: 'reviewed',   label: 'Reviewed',   numeric: true, cell: function (r) { return String(Number(r.reviewed) || 0); } },
    { key: 'scorecards', label: 'Scorecards', numeric: true, cell: function (r) { return String(Number(r.scorecards) || 0); } },
    { key: 'avgScore',   label: 'Avg /5',     numeric: true, cell: function (r) { return r.avgScore == null ? '—' : esc(String(r.avgScore)); } },
  ].concat((d.criteria || []).filter(function (c) { return qaCritTypeOf_(c) === 'scale'; }).map(function (c) {
    // Only SCALE criteria carry an average — a Yes/No or dropdown column would
    // read as a permanent em dash.
    return { key: 'pc-' + c.key, label: c.label, numeric: true, cell: function (r) {
      const v = (r.perCriterion || {})[c.key];
      return v == null ? '—' : esc(String(v));
    } };
  }));
  html += agents.length
    ? '<div class="m-table-wrap">' + mtRenderTable_({ columns: cols, rows: agents }) + '</div>'
    : '<div class="qa-empty">No recordings indexed yet — stats appear once recordings are synced and attributed to agents.</div>';
  // Phase 3 — calibration: recordings scored by 2+ reviewers, widest spread
  // first. FACTS ONLY (the Coverage rule): the table reports the disagreement,
  // never a verdict on which reviewer is right.
  const cal = d.calibration || [];
  if (cal.length) {
    const critLabel = {};
    (d.criteria || []).forEach(function (c) { critLabel[c.key] = c.label; });
    html += '<h2 class="card-label" style="margin-top:18px">Calibration · scored by 2+ reviewers</h2>' +
      '<div class="m-table-wrap">' + mtRenderTable_({
        columns: [
          { key: 'name',    label: 'Recording', name: true, cell: function (r) { return esc(r.name || r.fileId); } },
          { key: 'revs',    label: 'Reviewer averages', cell: function (r) {
              return (r.reviewers || []).map(function (rv) {
                return esc(rv.name) + ' <strong>' + esc(String(rv.avg)) + '</strong>';
              }).join(' · ');
            } },
          { key: 'spread',  label: 'Spread', numeric: true, cell: function (r) { return esc(String(r.spread)); } },
          { key: 'maxCrit', label: 'Widest gap', cell: function (r) {
              return r.maxCritKey
                ? esc(critLabel[r.maxCritKey] || r.maxCritKey) + ' (' + esc(String(r.maxCritSpread)) + ')'
                : '—';
            } },
        ],
        rows: cal,
      }) + '</div>' +
      '<div class="qa-note">Spread = the gap between the highest and lowest reviewer average on the same recording. A wide spread means reviewers read the call differently — worth a calibration conversation, not a verdict on who is right.</div>';
  }
  if (d.truncated) html += '<div class="qa-note">Scan capped — the oldest rows beyond the bounded tail are not counted.</div>';
  html += '<div class="qa-note">Attribute a recording to its agent in the recording detail (the Agent field). Scores use the latest scorecard per reviewer per recording.</div>';
  area.innerHTML = html;
}

// ===== My Reviews (Phase 3 — the agent-facing, read-only tab) =====
// Employee-gated server-side (getMyQaReviews); scoped to recordings
// attributed to the caller's name AND explicitly shared. Playback stays
// behind the scoped getMyQaReviewAudioChunk (never the reviewer endpoint).

function enterQaMyReviewsView() {

}

/** Q3 — the read-only note leads (an info callout, not a footer), each card

 *  transport as the reviewer detail (qaRenderTransportFor_). Still no
 *  reviewer controls — the ONLY onclick is Play. */
function qaRenderMyReviews_(d) {
  const area = document.getElementById('view-area');

  html += '<div class="qa-callout" role="note">Read-only. These are reviews a reviewer shared with you — scores, notes and timestamped comments. Timestamps are positions in the call recording. Talk to your manager about anything here.</div>';

          : '') +
      '</div>' +
      // Follow-on (2026-08-28): playback of the SHARED recording through the
      // SCOPED endpoint (getMyQaReviewAudioChunk — never the reviewer-gated
      // qaGetAudioChunk). fileId is Drive-shaped ([A-Za-z0-9_-]); esc is
      // defensive.
      '<div class="qa-myrev-audio" id="qa-mra-' + esc(r.fileId) + '" style="margin:4px 0 8px">' +
        (r.manual ? '<span class="qa-manual-pill">no recording</span>' :
          '<button type="button" class="qa-btn" onclick="qaMyRevPlay_(\'' + esc(r.fileId) + '\')">' + icon('headset', 14) + ' Play recording</button>') +
      '</div>' +
      ((r.scorecards || []).length

    if (comments.length) {

      comments.forEach(function (c) {

          esc(c.text) + (c.name ? ' <span class="qa-note" style="margin:0">— ' + esc(c.name) + '</span>' : '') +
          '</div>';

}

// Follow-on (2026-08-28) — per-card playback of a SHARED review. One active
// load at a time: a second Play (or a nav re-enter) bumps myRevAudioSeq and
// orphans the first (INV-156); the replaced Blob URL is revoked. Failures
// render the error card WITHOUT a Drive link — the agent has no Drive access
// to the deployer's recordings folder, so offering one would be a dead link.
function qaMyRevPlay_(fileId) {
  const mySeq = ++QA_STATE.myRevAudioSeq;
  const slot = document.getElementById('qa-mra-' + fileId);
  if (!slot) return;
  slot.innerHTML = '<div class="qa-note" style="margin:0">Loading audio…</div>';
  const parts = [];
  function fail(msg) {
    if (QA_STATE.myRevAudioSeq !== mySeq) return;
    const el = document.getElementById('qa-mra-' + fileId);
    if (el) el.innerHTML = errorStateHtml_(msg || 'Could not load the audio.');
  }
  function fetchChunk(i) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (QA_STATE.myRevAudioSeq !== mySeq) return;   // stale — another card played (INV-156)
        if (!r || r.error || !r.success) { fail(r && r.error); return; }
        parts[r.chunkIndex] = r.b64;
        if (i + 1 < r.chunks) {
          const el = document.getElementById('qa-mra-' + fileId);
          if (el) el.innerHTML = '<div class="qa-note" style="margin:0">Loading audio — part ' + Math.min(i + 2, r.chunks) + ' of ' + r.chunks + '…</div>';
          fetchChunk(i + 1);
          return;
        }
        try {
          const bins = parts.map(function (b64) {
            const s = atob(b64 || '');
            const u = new Uint8Array(s.length);
            for (let k = 0; k < s.length; k++) u[k] = s.charCodeAt(k);
            return u;
          });
          const blob = new Blob(bins, { type: r.mime || 'audio/mpeg' });
          if (QA_STATE.myRevAudioSeq !== mySeq) return;
          if (QA_STATE.myRevObjectUrl) { try { URL.revokeObjectURL(QA_STATE.myRevObjectUrl); } catch (e) {} }
          QA_STATE.myRevObjectUrl = URL.createObjectURL(blob);
          const el = document.getElementById('qa-mra-' + fileId);
          if (!el) return;
          el.innerHTML = '<audio controls preload="metadata" aria-label="Shared call recording player" style="width:100%;max-width:520px"></audio>' +
            '<div class="qa-transport"></div>';
          el.querySelector('audio').src = QA_STATE.myRevObjectUrl;
          // Q3 — transport parity with the reviewer detail (the SAME renderer,
          // bound to this card's own audio element; per-card speed state).
          try { qaRenderTransportFor_(el.querySelector('.qa-transport'), el.querySelector('audio'), { speed: 1 }); } catch (e) { /* decoration only */ }
          // Follow-on (2026-08-28): the detail's Phase-2 waveform chrome on
          // the agent player — strictly DECORATION (size gate; every failure
          // leaves the plain audio element), with click-to-seek and a
          // played-portion tint driven by this card's own audio element.
          try { qaMyRevWave_(el, bins, mySeq); } catch (e) { /* decoration only */ }
        } catch (e) { fail('Could not decode the audio: ' + e.message); }
      })
      .withFailureHandler(function (err) { fail('Could not load the audio: ' + (err && err.message)); })
      .getMyQaReviewAudioChunk(fileId, i);
  }
  fetchChunk(0);
}

// Waveform + click-to-seek for a My Reviews card (follow-on 2026-08-28) —
// the low-rate decode the detail uses, painted through the SHARED
// qaDrawWaveOn_. Decoration throughout: the size gate, an undecodable
// format, or any throw leaves the plain audio element working.
function qaMyRevWave_(cardEl, bins, mySeq) {
  let total = 0;
  bins.forEach(function (u) { total += u.length; });
  if (!(total > 0 && total <= QA_WAVE_MAX_BYTES)) return;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC) return;
  const all = new Uint8Array(total);
  let off = 0;
  bins.forEach(function (u) { all.set(u, off); off += u.length; });
  const ctx = new OAC(1, 8000, 8000);
  ctx.decodeAudioData(all.buffer, function (decoded) {
    try {
      if (QA_STATE.myRevAudioSeq !== mySeq) return;   // another card played (INV-156)
      const peaks = qaPeaks_(decoded.getChannelData(0), QA_WAVE_BUCKETS);
      decoded = null;   // free the PCM once the peaks exist
      const audio = cardEl.querySelector('audio');
      if (!audio || !peaks.length) return;
      const wave = document.createElement('canvas');
      wave.className = 'qa-wave';
      wave.height = 64;
      wave.setAttribute('aria-hidden', 'true');   // decoration — the audio element is the control
      cardEl.insertBefore(wave, audio);
      qaDrawWaveOn_(wave, peaks, 0);
      wave.addEventListener('click', function (ev) {
        try {
          const rect = wave.getBoundingClientRect();
          if (!(rect.width > 0) || !isFinite(audio.duration) || !(audio.duration > 0)) return;
          audio.currentTime = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width)) * audio.duration;
        } catch (e) { /* decoration only */ }
      });
      audio.addEventListener('timeupdate', function () {
        try {
          if (isFinite(audio.duration) && audio.duration > 0) {
            qaDrawWaveOn_(wave, peaks, audio.currentTime / audio.duration);
          }
        } catch (e) { /* decoration only */ }
      });
    } catch (e) { /* decoration only */ }
  }, function () { /* undecodable for the waveform — playback is unaffected */ });
}

// Keyboard shortcuts — active only in the open detail, never while typing
// (the isContentEditable + tagName guard the shell's ? handler documents).
var _qaKeysBound = false;
function qaEnsureKeysBound_() {
  if (_qaKeysBound) return;
  _qaKeysBound = true;
  document.addEventListener('keydown', function (e) {
    if (currentView !== 'qaQueue' || !QA_STATE.det) return;
    const ae = document.activeElement;
    if (ae && (ae.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(ae.tagName) >= 0)) return;
    const audio = document.getElementById('qa-audio');
    if (!audio) return;
    if (e.key === ' ') {
      e.preventDefault();
      if (audio.paused) { try { audio.play(); } catch (err) {} } else audio.pause();
    } else if (e.key === 'ArrowLeft') { e.preventDefault(); qaSeekBy_(-5); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); qaSeekBy_(5); }
  });
}

// ── QA Log (operator 2026-09-04) ─────────────────────────────────────────────
// The reviewer's own ledger: ONE card per recording audited (a scorecard IS
// that entry — the Log is a read over the same store, never a second table),
// grouped by day, newest first. Managers pick any reviewer or "all".
// "Log an audit" opens a queue detail (where the scorecard is saved as
// today) — for one of the caller's open assignments, or, the operator's
// fallback, a recording-less manual entry minted by qaCreateManualRecording.
var QA_LOG_PRESETS = [
  { key: '7d',  label: '7d',  days: 7 },
  { key: '30d', label: '30d', days: 30 },
  { key: 'qtr', label: 'QTR', days: 92 },
];
function qaAddDaysIso_(iso, n) {
  const d = new Date(iso + 'T12:00:00Z');   // noon UTC — immune to DST steps
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function qaLogTodayIso_() {
  return (typeof isoDateTz === 'function' && typeof empTz === 'function') ? isoDateTz(empTz()) : new Date().toISOString().slice(0, 10);
}
function qaLogActivePreset_() {
  const L = QA_STATE.log;
  const today = qaLogTodayIso_();
  for (let i = 0; i < QA_LOG_PRESETS.length; i++) {
    const p = QA_LOG_PRESETS[i];
    if (L.to === today && L.from === qaAddDaysIso_(today, -(p.days - 1))) return p.key;
  }
  return '';
}
function qaLogPreset_(key) {
  const p = QA_LOG_PRESETS.filter(function (x) { return x.key === key; })[0];
  if (!p) return;
  const today = qaLogTodayIso_();
  QA_STATE.log.to = today;
  QA_STATE.log.from = qaAddDaysIso_(today, -(p.days - 1));
  QA_STATE.log.customOpen = false;
  qaLogLoad_();
}
function qaLogToggleCustom_() {
  const next = mtDateRangeToggle_('qalog', 'qalog-custom');
  if (next !== null) QA_STATE.log.customOpen = next;
}
function qaLogApplyCustom_() {
  const f = document.getElementById('qalog-from'), t = document.getElementById('qalog-to');
  if (!f || !t || !f.value || !t.value) { showToast('Pick both dates.', 'toast-warn'); return; }
  QA_STATE.log.from = f.value; QA_STATE.log.to = t.value;
  qaLogLoad_();
}
function qaLogSetReviewer_(v) {
  QA_STATE.log.reviewer = String(v || '');
  qaLogLoad_();
}
function qaLogSearch_(v) {
  QA_STATE.log.q = String(v || '');
  const host = document.getElementById('qa-log-body');
  if (host && QA_STATE.log.data) host.innerHTML = qaLogEntriesHtml_(QA_STATE.log.data);
}

function enterQaLogView() {
  if (typeof stopClock === 'function') stopClock();
  if (typeof cnStopAmbientPolling_ === 'function') cnStopAmbientPolling_();
  QA_STATE.det = null;
  qaReleaseAudio_();
  const L = QA_STATE.log;
  if (!L.from || !L.to) { const today = qaLogTodayIso_(); L.to = today; L.from = qaAddDaysIso_(today, -29); }
  renderLoading(document.getElementById('view-area'), 'Loading your QA log…', 'list');
  qaLogLoad_();
}
function qaLogLoad_() {
  const requestedView = currentView;
  const mySeq = ++QA_STATE.log.seq;
  const L = QA_STATE.log;
  google.script.run
    .withSuccessHandler(function (data) {
      if (currentView !== requestedView || QA_STATE.log.seq !== mySeq) return;
      const area = document.getElementById('view-area');
      if (!data || data.error) { area.innerHTML = errorStateHtml_((data && data.error) || 'Could not load the QA log.'); return; }
      // The server's echoed scope/range is the truth (a non-manager asking
      // for "all" is scoped back to themselves there).
      L.data = data;
      L.reviewer = data.isManager ? (data.reviewer || '') : '';
      if (data.from) L.from = data.from;
      if (data.to) L.to = data.to;
      qaLogRender_();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView || QA_STATE.log.seq !== mySeq) return;
      document.getElementById('view-area').innerHTML = errorStateHtml_('Could not load the QA log: ' + (err && err.message));
    })
    .getQaLog({ reviewer: L.reviewer || '', from: L.from, to: L.to });
}

function qaLogRender_() {
  const area = document.getElementById('view-area');
  const d = QA_STATE.log.data;
  if (!d) return;
  const L = QA_STATE.log;
  const active = qaLogActivePreset_();
  const open = L.customOpen || active === '';
  const control = mtDateRange_({ scope: 'qalog', ariaLabel: 'Log range',
    presets: QA_LOG_PRESETS.map(function (p) { return { key: p.key, label: p.label }; }),
    active: active, onPreset: 'qaLogPreset_', rowId: 'qalog-custom', customOpen: open, onToggle: 'qaLogToggleCustom_' });
  const whose = d.isManager && !d.reviewer ? 'Every reviewer\'s audits' : (d.isManager && d.reviewer !== d.self ? 'A reviewer\'s audits' : 'Your audits');
  let html = qaAppBarHtml_('Log', 'QA Log', whose + ' — one entry per recording audited, newest first.', control) +
    mtDateRangeRow_('qalog-custom', open,
      '<div class="field"><label for="qalog-from">From</label><input type="date" id="qalog-from" value="' + esc(L.from) + '"></div>' +
      '<div class="field"><label for="qalog-to">To</label><input type="date" id="qalog-to" value="' + esc(L.to) + '"></div>' +
      '<button type="button" class="refresh-btn" onclick="qaLogApplyCustom_()">Load</button>');
  if (d.notConfigured) {
    area.innerHTML = html + '<div class="qa-empty">QA is not set up yet — see the Recordings tab.</div>';
    return;
  }
  html += '<div class="qa-log-tools">' +
    (d.isManager
      ? '<select aria-label="Reviewer" onchange="qaLogSetReviewer_(this.value)">' +
          '<option value="*"' + (!d.reviewer ? ' selected' : '') + '>All reviewers</option>' +
          (d.reviewers || []).map(function (r) {
            return '<option value="' + esc(r.empId) + '"' + (d.reviewer === r.empId ? ' selected' : '') + '>' +
              esc(r.name || r.empId) + (r.empId === d.self ? ' (you)' : '') + '</option>';
          }).join('') + '</select>'
      : '') +
    '<input type="search" aria-label="Search your log" placeholder="Search agent, recording, notes…" value="' + esc(L.q) + '" oninput="qaLogSearch_(this.value)">' +
    '<button type="button" class="qa-btn prime" onclick="qaLogNew_()">' + icon('plus', 14) + ' Log an audit</button>' +
  '</div>';
  html += '<div id="qa-log-body">' + qaLogEntriesHtml_(d) + '</div>';
  area.innerHTML = html;
}

/** Client-side filter over the loaded entries (the search never refetches). */
function qaLogFiltered_(d) {
  const q = String(QA_STATE.log.q || '').trim().toLowerCase();
  const all = d.entries || [];
  if (!q) return all;
  return all.filter(function (e) {
    return [e.recordingName, e.agent, e.notes, e.reviewerName].some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; });
  });
}
function qaLogEntriesHtml_(d) {
  const entries = qaLogFiltered_(d);
  const all = d.entries || [];
  let html = '';
  if (!all.length) {
    return '<div class="qa-empty">No audits logged between ' + esc(d.from) + ' and ' + esc(d.to) + '. Press <strong>Log an audit</strong> to start one, or widen the range.</div>';
  }
  // Summary strip DERIVED from the loaded entries (never a second read).
  const days = {};
  let scored = 0, sum = 0, recs = {};
  entries.forEach(function (e) { days[e.day] = 1; recs[e.fileId] = 1; if (e.avg != null) { scored++; sum += e.avg; } });
  const avg = scored ? Math.round((sum / scored) * 10) / 10 : null;
  const avgTone = qaScoreTone_(avg);
  html += '<div class="qa-log-strip">' +
    '<div class="qa-sum"><div class="qa-sum-k">Audits</div><div class="qa-sum-v">' + entries.length + (d.total > all.length ? ' <small>of ' + esc(String(d.total)) + ' (capped)</small>' : '') + '</div></div>' +
    '<div class="qa-sum"><div class="qa-sum-k">Recordings</div><div class="qa-sum-v">' + Object.keys(recs).length + '</div></div>' +
    '<div class="qa-sum"><div class="qa-sum-k">Days active</div><div class="qa-sum-v">' + Object.keys(days).length + '</div></div>' +
    '<div class="qa-sum"' + (avgTone ? ' data-tone="' + avgTone + '"' : '') + '><div class="qa-sum-k">Avg score</div><div class="qa-sum-v">' + (avg == null ? '—' : esc(String(avg)) + ' <small>/5</small>') + '</div></div>' +
  '</div>';
  if (d.truncated) html += '<div class="qa-note" style="margin:0 0 10px;color:var(--warning-deep)">Scan capped — the oldest rows were not read.</div>';
  if (!entries.length) return html + '<div class="qa-empty">Nothing matches "' + esc(QA_STATE.log.q) + '".</div>';
  // Day groups, newest first (entries arrive sorted).
  const groups = [];
  entries.forEach(function (e) {
    const g = groups[groups.length - 1];
    if (g && g.day === e.day) g.items.push(e); else groups.push({ day: e.day, items: [e] });
  });
  html += groups.map(function (g) {
    let gs = 0, gn = 0;
    g.items.forEach(function (e) { if (e.avg != null) { gn++; gs += e.avg; } });
    const gAvg = gn ? Math.round((gs / gn) * 10) / 10 : null;
    return '<section class="qa-log-day"><h2 class="card-label">' + esc(qaLogDayLabel_(g.day)) +
      '<span class="qa-note">' + g.items.length + ' audit' + (g.items.length === 1 ? '' : 's') + (gAvg != null ? ' · avg ' + esc(String(gAvg)) + '/5' : '') + '</span></h2>' +
      g.items.map(function (e) { return qaLogCardHtml_(e, d); }).join('') + '</section>';
  }).join('');
  return html;
}
function qaLogDayLabel_(ymd) {
  try {
    const d = new Date(ymd + 'T12:00:00Z');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  } catch (e) { return ymd; }
}
function qaLogCardHtml_(e, d) {
  const tone = qaScoreTone_(e.avg);
  const showReviewer = d.isManager && !d.reviewer;
  const title = e.recordingName || (e.indexed ? '(unnamed)' : '(recording no longer indexed)');
  return '<article class="qa-log-card" data-file-id="' + esc(e.fileId) + '">' +
    '<div class="qa-log-main">' +
      '<div class="qa-log-title">' +
        (e.indexed
          ? '<button type="button" class="qa-log-name" onclick="qaLogOpen_(\'' + esc(e.fileId) + '\')">' + esc(title) + '</button>'
          : '<span class="qa-log-name" style="cursor:default">' + esc(title) + '</span>') +
        (e.manual ? '<span class="qa-manual-pill">no recording</span>' : '') +
        (e.recordingStatus ? qaStatusPillHtml_(e.recordingStatus) : '') +
      '</div>' +
      '<div class="qa-log-meta">' +
        '<span>' + (e.agent ? 'Agent: ' + esc(e.agent) : '<span class="qa-unattributed">Unattributed</span>') + '</span>' +
        (showReviewer ? '<span>Reviewer: ' + esc(e.reviewerName || e.reviewerEmpId) + '</span>' : '') +
        '<span>' + esc(qaFmtDate_(e.createdMs)) + '</span>' +
        (e.comments ? '<span>' + esc(String(e.comments)) + ' comment' + (e.comments === 1 ? '' : 's') + '</span>' : '') +
      '</div>' +
      '<div class="qa-log-chips">' + qaRatingChipsHtml_(e.ratings, d.criteria) + '</div>' +
      (e.notes ? '<div class="qa-log-notes">' + esc(e.notes) + '</div>' : '') +
    '</div>' +
    '<div class="qa-log-side">' +
      (e.avg != null ? '<span class="qa-sc-chip"' + (tone ? ' data-tone="' + tone + '"' : '') + '>avg ' + esc(String(e.avg)) + '/5</span>' : '<span class="qa-note" style="margin:0">no scale rating</span>') +
    '</div>' +
  '</article>';
}
/** Open the recording behind an entry: park the hint (the C8 pattern —
 *  read, nulled, then acted on by the queue loader) and enter the queue. */
function qaLogOpen_(fileId) {
  window.QA_OPEN_HINT = { fileId: String(fileId) };
  enterTool('qa', 'qaQueue');
}

/** "Log an audit" — a named dialog: one of the caller's open assignments, or
 *  the recording-less fallback (agent + label). Either way the audit itself
 *  is saved on the queue detail, the ONE place a scorecard is written. */
function qaLogNew_() {
  const d = QA_STATE.log.data || {};
  const pending = d.pending || [];
  const ov = ensureOverlay('qa-log-new-overlay', { labelledBy: 'qa-log-new-title', onClose: qaLogNewClose_ });
  ov.innerHTML =
    '<div class="modal qa-log-dialog" style="max-width:520px">' +
      '<h3 id="qa-log-new-title" style="margin-top:0">Log an audit</h3>' +
      '<div>' +
        '<div class="field"><label for="qa-log-new-rec">Recording assigned to you</label>' +
          '<select id="qa-log-new-rec" onchange="qaLogNewMode_()">' +
            '<option value="">— pick a recording —</option>' +
            pending.map(function (p) { return '<option value="' + esc(p.fileId) + '">' + esc(p.name || '(unnamed)') + (p.agent ? ' · ' + esc(p.agent) : '') + '</option>'; }).join('') +
            '<option value="__manual__">No recording attached (manual entry)</option>' +
          '</select>' +
          (pending.length ? '' : '<div class="qa-note">No open assignments — claim or sample recordings on the Recordings tab, or log a manual entry.</div>') +
        '</div>' +
        '<div id="qa-log-new-manual" hidden>' +
          '<div class="qa-note" style="margin:0 0 10px">Audits should have a recording attached, for posterity. Use this only when there is none.</div>' +
          '<div class="field"><label for="qa-log-new-agent">Agent</label>' +
            '<input type="text" id="qa-log-new-agent" list="qa-log-new-agents" maxlength="80" placeholder="Agent name">' +
            '<datalist id="qa-log-new-agents">' + (d.agentOptions || []).map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('') + '</datalist></div>' +
          '<div class="field"><label for="qa-log-new-label">Label</label>' +
            '<input type="text" id="qa-log-new-label" maxlength="120" placeholder="e.g. Live-monitored call, Sep 4 — 2:15 PM"></div>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">' +
        '<button type="button" class="qa-btn" onclick="qaLogNewCancel_()">Cancel</button>' +
        '<button type="button" class="qa-btn prime" id="qa-log-new-go" onclick="qaLogNewGo_()">Continue</button>' +
      '</div>' +
    '</div>';
}
function qaLogNewCancel_() { closeOverlay(document.getElementById('qa-log-new-overlay')); }
/** Idempotent close hook (INV-83) — ensureOverlay re-asserts `open` on reuse. */
function qaLogNewClose_() {
  const el = document.getElementById('qa-log-new-overlay');
  if (el) el.classList.remove('open');
}
function qaLogNewMode_() {
  const sel = document.getElementById('qa-log-new-rec');
  const man = document.getElementById('qa-log-new-manual');
  if (sel && man) man.hidden = sel.value !== '__manual__';
}
function qaLogNewGo_() {
  const sel = document.getElementById('qa-log-new-rec');
  const v = sel ? sel.value : '';
  if (!v) { showToast('Pick a recording, or choose the manual entry.', 'toast-warn'); return; }
  const ov = document.getElementById('qa-log-new-overlay');
  if (v !== '__manual__') {
    closeOverlay(ov);
    qaLogOpen_(v);
    return;
  }
  const agent = String((document.getElementById('qa-log-new-agent') || {}).value || '').trim();
  const label = String((document.getElementById('qa-log-new-label') || {}).value || '').trim();
  if (!label) { showToast('Give the audit a label.', 'toast-warn'); return; }
  const btn = document.getElementById('qa-log-new-go');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) { btn.disabled = false; btn.textContent = 'Continue'; }
      if (!res || !res.success) { showToast((res && res.error) || 'Could not create the entry.', 'toast-error'); return; }
      closeOverlay(ov);
      qaLogOpen_(res.fileId);
    })
    .withFailureHandler(function (err) {
      if (btn) { btn.disabled = false; btn.textContent = 'Continue'; }
      showToast('Could not create the entry: ' + (err && err.message), 'toast-error');
    })
    .qaCreateManualRecording(agent, label);
}
</script>
