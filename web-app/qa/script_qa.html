<style>
  /* ── QA module — coverage-first review queue + player ─────────────────────
     (design handoff PR 5, 2026-09-02, on top of Phases 1–3)
     Tokens only; breakpoints per the A2 rule (a fixed grid owes a viewport
     breakpoint). Empty states use .qa-empty (the derived A12 convention);
     failures render errorStateHtml_. */
  .qa-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 14px; }
  .qa-toolbar .spacer { flex: 1; }
  .qa-btn {
    appearance: none; background: var(--paper-card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: var(--text-sm);
    color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .qa-btn:hover { border-color: var(--border-strong); }
  .qa-btn:disabled { opacity: .55; cursor: default; }
  .qa-btn.prime { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qa-btn.danger { color: var(--danger-deep); }
  .qa-chip {
    appearance: none; background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius-pill); padding: 4px 12px; font: inherit;
    font-size: var(--text-sm); color: var(--muted-2); cursor: pointer;
  }
  .qa-chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .qa-status { border-radius: var(--radius-pill); padding: 2px 10px; font-size: 11px; border: 1px solid var(--line); color: var(--muted-2); white-space: nowrap; }
  .qa-status.st-new       { background: var(--info-soft);    border-color: var(--info);    color: var(--info-deep); }
  .qa-status.st-in_review { background: var(--warn-soft);    border-color: var(--warn);    color: var(--warning-deep); }
  .qa-status.st-done      { background: var(--accent-soft);  border-color: var(--accent);  color: var(--success-deep); }
  .qa-status.st-skipped   { background: var(--paper-2); }
  .qa-assignee { border-radius: var(--radius-pill); padding: 2px 10px; font-size: 11px; background: var(--paper-2); border: 1px solid var(--line); color: var(--muted-2); }
  .qa-assignee.mine { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .qa-empty { border: 1px dashed var(--line); border-radius: 10px; padding: 24px; text-align: center; color: var(--muted-2); }

  /* ── QA Log (operator 2026-09-04) — the reviewer's ledger, one card per
     audited recording, grouped by day. Fixed grids owe breakpoints (A2). */
  .qa-log-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
  .qa-log-tools select, .qa-log-tools input[type="search"] {
    font: inherit; font-size: var(--text-sm); padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--paper-card); color: var(--ink); min-width: 160px;
  }
  .qa-log-tools input[type="search"] { flex: 1 1 200px; }
  .qa-log-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
  .qa-log-day { margin: 0 0 18px; }
  .qa-log-day > .card-label { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .qa-log-day > .card-label .qa-note { margin: 0; font-weight: 400; }
  .qa-log-card {
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px;
  }
  .qa-log-main { min-width: 0; }
  .qa-log-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .qa-log-title .qa-log-name { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; overflow-wrap: anywhere; }
  .qa-log-title .qa-log-name:hover { text-decoration: underline; }
  .qa-log-meta { color: var(--muted-2); font-size: var(--text-sm); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .qa-log-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .qa-log-notes { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .qa-log-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .qa-manual-pill { border-radius: var(--radius-pill); padding: 2px 10px; font-size: 11px; background: var(--paper-2); border: 1px dashed var(--line); color: var(--muted-2); white-space: nowrap; }
  /* Rubric controls by type: a Yes/No pair reuses the rate-button look; a
     dropdown is a real <select>. */
  .qa-yn-btn { appearance: none; background: var(--paper-card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; font: inherit; font-size: var(--text-sm); color: var(--ink); cursor: pointer; }
  .qa-yn-btn[aria-pressed="true"][data-v="yes"] { background: var(--accent-soft); border-color: var(--accent); }
  .qa-yn-btn[aria-pressed="true"][data-v="no"]  { background: var(--destructive-soft); border-color: var(--destructive); }
  .qa-choice-sel { font: inherit; font-size: var(--text-sm); padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper-card); color: var(--ink); max-width: 100%; }
  .qa-sc-chip[data-tone="yes"] { background: var(--accent-soft); border-color: var(--accent); }
  .qa-sc-chip[data-tone="no"]  { background: var(--destructive-soft); border-color: var(--destructive); }
  .qa-log-dialog h3 { margin: 0 0 14px; }
  .qa-log-dialog .field { margin-bottom: 12px; }
  .qa-log-dialog select, .qa-log-dialog input[type="text"] { width: 100%; box-sizing: border-box; font: inherit; font-size: var(--text-sm); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
  @media (max-width: 720px) {
    .qa-log-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .qa-log-card { grid-template-columns: minmax(0, 1fr); }
    .qa-log-side { flex-direction: row; align-items: center; flex-wrap: wrap; }
  }
  :root[data-compact] .qa-log-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .qa-note { color: var(--muted-2); font-size: var(--text-sm); margin: 8px 0 0; }
  .qa-section { margin-bottom: 22px; }
  .qa-section > .card-label { margin-bottom: 8px; }
  .qa-section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .qa-section-head .qa-note { margin: 0; }

  /* Q4 — summary strip derived from the coverage table (never a second read) */
  .qa-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 0 14px; }
  .qa-sum { background: var(--paper-card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .qa-sum[data-tone="destructive"] { box-shadow: inset 3px 0 0 var(--destructive); }
  .qa-sum[data-tone="warn"]        { box-shadow: inset 3px 0 0 var(--warn); }
  .qa-sum-k { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .qa-sum-v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 2px; }
  .qa-sum-v small { font-size: 13px; font-weight: 500; color: var(--muted-2); }
  .qa-sum-sub { color: var(--muted-2); font-size: var(--text-sm); margin-top: 2px; overflow-wrap: anywhere; }
  .qa-sum-bar { height: 6px; background: var(--paper-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .qa-sum-bar > i { display: block; height: 100%; background: var(--accent); }
  .qa-cov-cell { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .qa-cov-track { width: 64px; height: 6px; background: var(--paper-2); border-radius: 3px; overflow: hidden; display: inline-block; }
  .qa-cov-track > i { display: block; height: 100%; background: var(--accent); }
  .qa-cov-track[data-tier="short"] > i    { background: var(--warn); }
  .qa-cov-track[data-tier="shortlow"] > i { background: var(--destructive); }
  .qa-cov-track[data-tier="exempt"]       { background: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px); }
  .m-table tr.qa-row-shortlow td { background: var(--destructive-soft); }
  .m-table tr.qa-row-short td    { background: var(--warn-soft); }
  .m-table tr.qa-row-exempt td   { color: var(--muted-2); }
  .qa-delta-up   { color: var(--success-deep); }
  .qa-delta-down { color: var(--danger-deep); }
  .qa-skip-why { display: block; color: var(--muted-2); font-size: 11px; max-width: 260px; overflow-wrap: anywhere; }
  .qa-unattributed { color: var(--warning-deep); }
  /* Row actions stay on ONE line — the table scrolls inside .m-table-wrap,
     so a wrapped action stack would only make every row three lines tall. */
  .qa-row-actions { display: flex; gap: 6px; flex-wrap: nowrap; white-space: nowrap; }

  /* Detail — two panes from 1000px (player + agent left, review right);
     single column below, where the player sits first in reading order. */
  .qa-det-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .qa-det-title { font-weight: 700; font-size: var(--text-lg); overflow-wrap: anywhere; min-width: 0; }
  .qa-det-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .qa-det-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (min-width: 1000px) {
    .qa-det-grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
    .qa-det-left { position: sticky; top: 12px; }
  }
  .qa-player-card, .qa-comments-card, .qa-score-card, .qa-agent-card, .qa-coach-card {
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-bottom: 14px;
  }
  .qa-player-card audio { width: 100%; }
  .qa-transport { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .qa-speed[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .qa-kbd-hint { color: var(--muted-2); font-size: 11px; margin-left: auto; }
  .qa-timeline {
    position: relative; height: 26px; background: var(--paper-2);
    border: 1px solid var(--line); border-radius: var(--radius-pill); margin-top: 12px;
  }
  .qa-tl-mark {
    appearance: none; position: absolute; top: 2px; bottom: 2px; width: 8px; padding: 0;
    transform: translateX(-50%); background: var(--info); border: 1px solid var(--info-deep);
    border-radius: 4px; cursor: pointer;
  }
  .qa-tl-cursor { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); border-radius: 1px; pointer-events: none; }
  .qa-comment-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .qa-comment-row:last-child { border-bottom: none; }
  .qa-time-chip {
    appearance: none; background: var(--info-soft); border: 1px solid var(--info);
    color: var(--info-deep); border-radius: var(--radius-pill); padding: 2px 10px;
    font: inherit; font-family: var(--mono); font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .qa-comment-text { overflow-wrap: anywhere; }
  .qa-comment-by { color: var(--muted-2); font-size: 11px; }
  .qa-del-btn { appearance: none; background: none; border: none; color: var(--muted-2); cursor: pointer; font: inherit; padding: 2px 6px; }
  .qa-del-btn:hover { color: var(--danger-deep); }
  /* Q1 — pause-and-pin composer: the textarea pins the moment on first input */
  .qa-add-row { margin-top: 10px; }
  .qa-add-row textarea {
    width: 100%; min-height: 54px; resize: vertical; font: inherit; font-size: var(--text-sm);
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .qa-pin-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: var(--text-sm); color: var(--muted-2); }
  .qa-pin-input {
    width: 72px; font: inherit; font-family: var(--mono); font-size: 12px; padding: 4px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
  }
  .qa-add-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  /* Agent attribution + roster match line (Q7 feeds the coaching hand-off) */
  .qa-agent-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .qa-agent-row input {
    font: inherit; font-size: var(--text-sm); padding: 6px 9px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--paper); color: var(--ink); min-width: 200px;
  }
  .qa-match-line { color: var(--muted-2); font-size: var(--text-sm); margin-top: 8px; }
  .qa-match-line.warn { color: var(--warning-deep); }
  /* display:block would BEAT the UA's [hidden]{display:none} (the documented
     [hidden] specificity gotcha) — the companion rule below is load-bearing. */
  .qa-wave { display: block; width: 100%; height: 64px; margin-top: 10px; cursor: pointer; border-radius: 6px; background: var(--paper-2); }
  .qa-wave[hidden] { display: none; }
  /* Q3 — scorecard anchors, running average, tone chips */
  .qa-score-anchors { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .qa-score-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .qa-rate-btns { display: flex; gap: 4px; }
  .qa-rate-btn {
    appearance: none; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper); color: var(--muted-2); font: inherit; font-size: 12px; cursor: pointer;
  }
  .qa-rate-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
  .qa-score-running { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: var(--text-sm); color: var(--muted-2); }
  .qa-score-notes {
    width: 100%; min-height: 46px; resize: vertical; font: inherit; font-size: var(--text-sm);
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px;
  }
  .qa-sc-item { border-top: 1px solid var(--line); padding: 8px 0; font-size: var(--text-sm); }
  .qa-sc-meta { color: var(--muted-2); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .qa-sc-chip { border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 1px 8px; font-size: 11px; color: var(--muted-2); background: var(--paper-2); }
  .qa-sc-chip[data-tone="accent"]      { background: var(--accent-soft);      color: var(--success-deep); border-color: transparent; }
  .qa-sc-chip[data-tone="destructive"] { background: var(--destructive-soft); color: var(--danger-deep);  border-color: transparent; }
  .qa-avg-big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .qa-avg-big small { font-size: 12px; font-weight: 500; color: var(--muted-2); }
  .qa-stats-strip { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; color: var(--muted-2); font-size: var(--text-sm); }
  .qa-stats-strip strong { color: var(--ink); font-size: 16px; }
  /* Phase 3 — share pill + agent-facing My Reviews */
  .qa-shared-pill { border-radius: var(--radius-pill); padding: 2px 10px; font-size: 11px; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--success-deep); white-space: nowrap; }
  .qa-callout { background: var(--info-soft); border: 1px solid var(--info); border-radius: 10px; padding: 12px 14px; color: var(--ink); font-size: var(--text-sm); margin-bottom: 14px; }
  .qa-myrev-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .qa-myrev-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .qa-myrev-name { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
  .qa-myrev-head .qa-avg-big { margin-left: auto; }
  @media (max-width: 700px) {
    .qa-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .qa-det-actions { margin-left: 0; }
  }
  @media (max-width: 420px) {
    .qa-summary { grid-template-columns: minmax(0, 1fr); }
  }
</style>

<script>
// ── QA module client ─────────────────────────────────────────────────────────
// Three tabs: the coverage-first Recordings queue (with an in-tab recording
// detail: player + scorecard + timestamped comments + the coaching hand-off),
// per-agent Stats, and the agent-facing read-only My Reviews. Audio arrives
// as base64 chunks (qaGetAudioChunk) assembled into a Blob URL — seq-guarded
// (INV-156) so opening another recording drops stale chunk appends.
var QA_STATE = {
  queue: null,          // last getQaQueue payload
  filter: 'all',        // all | new | in_review | done | skipped | mine
  sort: { key: 'createdMs', dir: 'desc' },   // recordings table sort
  period: '',           // the audit period key in force ('' = let the server pick)
  seq: 0,               // queue-load seq guard
  det: null,            // the open recording (queue item) or null
  audioSeq: 0,          // chunk-assembly seq guard
  objectUrl: null,      // current Blob URL (revoked on replace)
  durationSec: 0,
  comments: [],
  canModerate: false,
  speed: 1,             // session-only playback speed
  pin: null,            // Q1 — {atSec, wasPlaying} once the composer has pinned a moment
  // Phase 2
  peaks: null,          // normalized waveform buckets (null = no waveform — flat timeline only)
  criteria: [],         // live scorecard criteria (from qaListScorecards)
  scorecards: [],       // latest-per-reviewer cards for the open recording
  selfEmpId: '',
  ratings: {},          // the in-progress scorecard form
  scoreNotes: '',
  statsSeq: 0,          // qaStats-load seq guard
  myRevSeq: 0,          // Phase 3 — My Reviews load seq guard
  myRevAudioSeq: 0,     // follow-on — shared-review playback seq guard (one active load)
  myRevObjectUrl: null, // follow-on — the shared-review Blob URL (revoked on replace)
  // QA Log (operator 2026-09-04)
  log: { seq: 0, data: null, reviewer: '', from: '', to: '', customOpen: false, q: '' },
};
var QA_PERIOD_KEY = 'umsQaPeriod';   // per-browser: the last audit period picked (validated against what the server ships)

function enterQaQueueView() {
  if (typeof stopClock === 'function') stopClock();
  if (typeof cnStopAmbientPolling_ === 'function') cnStopAmbientPolling_();
  QA_STATE.det = null;
  qaReleaseAudio_();
  if (!QA_STATE.period) QA_STATE.period = qaReadPeriodPref_();
  const area = document.getElementById('view-area');
  renderLoading(area, 'Loading QA queue…', 'waveform');
  qaLoadQueue_();
}

function qaReadPeriodPref_() {
  try { return String(localStorage.getItem(QA_PERIOD_KEY) || '').trim(); } catch (e) { return ''; }
}
function qaWritePeriodPref_(key) {
  try { if (key) localStorage.setItem(QA_PERIOD_KEY, key); else localStorage.removeItem(QA_PERIOD_KEY); } catch (e) {}
}

function qaLoadQueue_() {
  const requestedView = currentView;
  const mySeq = ++QA_STATE.seq;
  google.script.run
    .withSuccessHandler(function (data) {
      if (currentView !== requestedView || QA_STATE.seq !== mySeq) return;
      if (!data || data.error) {
        document.getElementById('view-area').innerHTML = errorStateHtml_((data && data.error) || 'Could not load the QA queue.');
        return;
      }
      QA_STATE.queue = data;
      // The server VALIDATED the period (an unknown key lands on the current
      // month) — the shipped key is the truth, the stored pref only a wish.
      if (data.period) QA_STATE.period = String(data.period);
      if (QA_STATE.det) return;   // a detail opened while the refresh ran — leave it
      qaRenderQueue_();
      // K13 (design handoff PR 4) — a Coaching card's "QA review" chip parks a
      // {fileId} hint (the C8 park-and-consume pattern): read it FIRST, null
      // it, then open the detail if the recording is in this queue.
      const hint = window.QA_OPEN_HINT || null;
      window.QA_OPEN_HINT = null;
      if (hint && hint.fileId) qaOpenDetail_(String(hint.fileId));
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView || QA_STATE.seq !== mySeq) return;
      document.getElementById('view-area').innerHTML = errorStateHtml_('Could not load the QA queue: ' + (err && err.message));
    })
    .getQaQueue(QA_STATE.period || '');
}

function qaFmtSize_(bytes) {
  const n = Number(bytes) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n >= 1024) return Math.round(n / 1024) + ' KB';
  return n + ' B';
}
function qaFmtDate_(ms) {
  const n = Number(ms) || 0;
  if (!n) return '';
  try { return new Date(n).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
  catch (e) { return ''; }
}
/** m:ss (or h:mm:ss past an hour) for player timestamps. PURE — Node-pinned. */
function qaFmtClock_(sec) {
  let s = Math.max(0, Math.floor(Number(sec) || 0));
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  const mm = h ? String(m).padStart(2, '0') : String(m);
  return (h ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
}
/** The inverse — "m:ss" / "h:mm:ss" / bare seconds → seconds, or null when
 *  the text is not a clock (a typo in the pin field must never post at 0).
 *  PURE — Node-pinned. */
function qaParseClock_(str) {
  const s = String(str == null ? '' : str).trim();
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return Math.floor(Number(s));
  const m = /^(?:(\d{1,2}):)?(\d{1,3}):(\d{2})$/.exec(s);
  if (!m) return null;
  const h = Number(m[1] || 0), mi = Number(m[2]), se = Number(m[3]);
  if (se >= 60 || (m[1] != null && mi >= 60)) return null;
  return h * 3600 + mi * 60 + se;
}
/** Timeline marker position as a 0..100 percent, clamped. PURE — Node-pinned. */
function qaMarkerPct_(atSec, durSec) {
  const at = Number(atSec), dur = Number(durSec);
  if (!isFinite(at) || !isFinite(dur) || dur <= 0) return 0;
  return Math.max(0, Math.min(100, (at / dur) * 100));
}
/** Q3 — ONE score-tone rule for every 1..5 figure the module renders (rating
 *  chips, running average, per-card average): ≤2 destructive, 3 neutral, ≥4
 *  accent. null/NaN → no tone. PURE — Node-pinned. */
function qaScoreTone_(v) {
  const n = Number(v);
  if (v == null || !isFinite(n)) return '';
  if (n <= 2) return 'destructive';
  if (n >= 4) return 'accent';
  return '';
}
var QA_STATUS_LABELS = { new: 'New', in_review: 'In review', done: 'Done', skipped: 'Skipped' };
function qaStatusPillHtml_(status) {
  const st = QA_STATUS_LABELS[status] ? status : 'new';
  return '<span class="qa-status st-' + st + '">' + esc(QA_STATUS_LABELS[st]) + '</span>';
}
function qaAssigneePillHtml_(item, self) {
  if (!item.assignee) return '';
  const mine = item.assignee === self;
  return '<span class="qa-assignee' + (mine ? ' mine' : '') + '" title="' + esc(item.assignee) + '">' +
    (mine ? 'you' : esc(item.assignee.split('@')[0])) + '</span>';
}

// ── Q4: coverage — pure helpers (Node-pinned) ──────────────────────────────

/** Whole days from ymd `a` to ymd `b` (UTC arithmetic — the keys are calendar
 *  dates, not instants). null on a bad input. */
function qaDayDiff_(a, b) {
  const pa = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(a || ''));
  const pb = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(b || ''));
  if (!pa || !pb) return null;
  const ma = Date.UTC(+pa[1], +pa[2] - 1, +pa[3]), mb = Date.UTC(+pb[1], +pb[2] - 1, +pb[3]);
  return Math.round((mb - ma) / 86400000);
}
/** ONE tier rule for a coverage row — feeds BOTH the row tint and the status
 *  pill, so the two cannot disagree. exempt › covered › not started › short
 *  (low when the period average is under 3.5). */
function qaCoverageTier_(row) {
  const r = row || {};
  if (r.exempt) return { key: 'exempt', label: 'Exempt', tone: '' };
  const sampled = Number(r.sampled) || 0, target = Number(r.target) || 0;
  if (sampled >= target) return { key: 'covered', label: 'Covered', tone: 'accent' };
  if (sampled === 0) return { key: 'notstarted', label: 'Not started', tone: 'info' };
  if (r.avg != null && Number(r.avg) < 3.5) return { key: 'shortlow', label: 'Short · low', tone: 'destructive' };
  return { key: 'short', label: 'Short', tone: 'warn' };
}
/** The summary strip is DERIVED from the coverage rows the table renders —
 *  never a second read, so the strip and the table cannot disagree.
 *  Coverage counts each rep at most to target (an over-sampled rep does not
 *  cover for a short one); the team average is CALL-weighted (Σ avg·cards /
 *  Σ cards) so one rep's single card cannot swing it; an absent average is
 *  null, never 0 (INV-187). */
function qaCoverageSummary_(rows, todayYmd, periodEnd) {
  const list = Array.isArray(rows) ? rows : [];
  let sampled = 0, target = 0, short = 0, gaps = 0;
  const shortNames = [], below = [];
  let wSum = 0, wN = 0, pSum = 0, pN = 0;
  list.forEach(function (r) {
    const s = Number(r.sampled) || 0, t = Number(r.target) || 0;
    if (!r.exempt) {
      sampled += Math.min(s, t); target += t;
      if (s < t) { short++; shortNames.push(String(r.name || '')); gaps += (t - s); }
    }
    const cards = Number(r.cardCount) || 0;
    if (r.avg != null && cards > 0) { wSum += Number(r.avg) * cards; wN += cards; }
    if (r.avg != null && Number(r.avg) < 3.5) below.push(String(r.name || ''));
    // The previous period has no card count on the row — weight by its
    // sampled count instead (the closest proxy the join carries).
    const ps = Number(r.prevSampled) || 0;
    if (r.prevAvg != null && ps > 0) { pSum += Number(r.prevAvg) * ps; pN += ps; }
  });
  const avg = wN ? Math.round((wSum / wN) * 100) / 100 : null;
  const prevAvg = pN ? Math.round((pSum / pN) * 100) / 100 : null;
  const dl = qaDayDiff_(todayYmd, periodEnd);
  return {
    sampled: sampled, target: target,
    pct: target ? Math.round((sampled / target) * 100) : null,
    short: short, shortNames: shortNames, gaps: gaps,
    avg: avg, prevAvg: prevAvg,
    delta: (avg != null && prevAvg != null) ? Math.round((avg - prevAvg) * 100) / 100 : null,
    below: below,
    daysLeft: dl == null ? null : Math.max(0, dl),
  };
}

function qaPeriodLabelOf_(key) {
  const d = QA_STATE.queue || {};
  const opt = (d.periodOptions || []).filter(function (o) { return o.key === key; })[0];
  return opt ? opt.label : String(key || '');
}

// ── Queue ──────────────────────────────────────────────────────────────────

function qaVisibleItems_() {
  const d = QA_STATE.queue;
  if (!d || !d.recordings) return [];
  return d.recordings.filter(function (r) {
    if (QA_STATE.filter === 'mine') return r.assignee === d.self;
    if (QA_STATE.filter === 'all') return true;
    return r.status === QA_STATE.filter;
  });
}
function qaSortedItems_(items) {
  const s = QA_STATE.sort || { key: 'createdMs', dir: 'desc' };
  const dir = s.dir === 'asc' ? 1 : -1;
  const val = function (r) {
    if (s.key === 'name' || s.key === 'agent' || s.key === 'status' || s.key === 'assignee') return String(r[s.key] || '').toLowerCase();
    return Number(r[s.key]) || 0;
  };
  return items.slice().sort(function (a, b) {
    const va = val(a), vb = val(b);
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return (Number(b.createdMs) || 0) - (Number(a.createdMs) || 0);
  });
}
function qaSortQueue_(key) {
  const s = QA_STATE.sort || {};
  if (s.key === key) QA_STATE.sort = { key: key, dir: s.dir === 'asc' ? 'desc' : 'asc' };
  else QA_STATE.sort = { key: key, dir: (key === 'name' || key === 'agent' || key === 'status' || key === 'assignee') ? 'asc' : 'desc' };
  qaRenderQueue_();
}

function qaAppBarHtml_(crumb, title, subtitle, rightHtml) {
  if (COMPACT_MODE) return rightHtml ? '<div class="qa-toolbar">' + rightHtml + '</div>' : '';
  return '<div class="app-bar"><div class="app-bar-left">' +
      '<div class="breadcrumb"><span>QA</span><span class="crumb-sep">›</span><span class="crumb-current">' + esc(crumb) + '</span></div>' +
      '<h1 class="display-title">' + esc(title) + '</h1>' +
      (subtitle ? '<p class="view-subtitle">' + esc(subtitle) + '</p>' : '') +
    '</div>' + (rightHtml ? '<div class="app-bar-right">' + rightHtml + '</div>' : '') + '</div>';
}

/** The audit-period control — a .toolbar-tabs strip over the server-shipped
 *  options (the client never mirrors the period arithmetic). */
function qaPeriodStripHtml_(d) {
  const opts = (d && d.periodOptions) || [];
  if (!opts.length) return '';
  return '<div class="toolbar-tabs" role="group" aria-label="Audit period">' +
    opts.map(function (o) {
      const on = o.key === d.period;
      return '<button type="button" class="toolbar-tab' + (on ? ' active' : '') + '" aria-pressed="' + on + '" data-qa-period="' + esc(o.key) +
        '" onclick="qaSetPeriod_(\'' + esc(o.key) + '\')">' + esc(o.label) + '</button>';
    }).join('') + '</div>';
}
function qaSetPeriod_(key) {
  const d = QA_STATE.queue || {};
  const ok = (d.periodOptions || []).some(function (o) { return o.key === key; });
  if (!ok || key === QA_STATE.period) return;
  QA_STATE.period = key;
  qaWritePeriodPref_(key);
  renderLoading(document.getElementById('view-area'), 'Loading ' + qaPeriodLabelOf_(key) + '…', 'waveform');
  qaLoadQueue_();
}

function qaRenderQueue_() {
  const area = document.getElementById('view-area');
  const d = QA_STATE.queue;
  if (!d) return;
  let html = qaAppBarHtml_('Recordings', 'Recordings',
    'Coverage first: who still needs a sampled call this period, then the recordings themselves.',
    qaPeriodStripHtml_(d));
  if (d.notConfigured) {
    area.innerHTML = html +
      '<div class="qa-empty">QA is not set up yet. An admin sets Script Property <strong>QA_SS_ID</strong> to a fresh dedicated spreadsheet' +
      (d.folderConfigured ? '' : ' and <strong>QA_RECORDINGS_FOLDER_ID</strong> to the Drive folder recordings are dropped into') +
      ', then presses Sync here.</div>';
    return;
  }
  if (!d.folderConfigured) {
    html += '<div class="qa-note">The recordings Drive folder is not configured (Script Property <strong>QA_RECORDINGS_FOLDER_ID</strong>) — Sync and playback need it.</div>';
  }
  html += qaCoverageSectionHtml_(d);
  html += qaRecordingsSectionHtml_(d);
  area.innerHTML = html;
}

/** Q4 — the coverage block: summary strip (derived), the sample-the-gaps
 *  action, and the per-employee table. */
function qaCoverageSectionHtml_(d) {
  const rows = Array.isArray(d.coverage) ? d.coverage : [];
  const label = qaPeriodLabelOf_(d.period);
  let html = '<section class="qa-section" aria-labelledby="qa-cov-h">' +
    '<div class="qa-section-head"><h2 class="card-label" id="qa-cov-h">Coverage · ' + esc(label) + '</h2>' +
    '<span class="qa-note">target ' + (Number(d.target) || 0) + ' sampled call' + (Number(d.target) === 1 ? '' : 's') + ' per employee</span></div>';
  if (d.coverageUnavailable) {
    // A failed scorecard/exemption read must not read as "nobody sampled"
    // (INV-187) — the recordings below are unaffected, the coverage is unknown.
    html += errorStateHtml_('Coverage could not be computed for ' + label + ' (the scorecard or exemption tab could not be read). The recordings below are unaffected.');
    html += '</section>';
    return html;
  }
  const sum = qaCoverageSummary_(rows, d.todayYmd, d.periodEnd);
  html += qaSummaryStripHtml_(sum, label);
  const gapBtn = sum.gaps > 0
    ? '<button type="button" class="qa-btn prime" id="qa-sample-btn" onclick="qaSample_()">' +
        (typeof icon === 'function' ? icon('check', 14) : '') + ' Sample the gaps for me (' + Math.min(10, sum.gaps) + ')</button>'
    : '<button type="button" class="qa-btn" id="qa-sample-btn" disabled title="Everyone is at target this period">' +
        (typeof icon === 'function' ? icon('check', 14) : '') + ' Sample the gaps for me</button>';
  html += '<div class="qa-toolbar">' + gapBtn +
    '<span class="qa-note" style="margin:0">assigns un-reviewed recordings to YOU, shortest-covered agents first</span>' +
    '<div class="spacer"></div>' +
    '<button type="button" class="qa-btn" id="qa-sync-btn" onclick="qaSync_()">' +
    (typeof icon === 'function' ? icon('refresh', 14) : '') + ' Sync from Drive</button>' +
    '</div>';
  if (!rows.length) {
    html += '<div class="qa-empty">No roster employees to cover yet.</div></section>';
    return html;
  }
  const cols = [
    { key: 'name', label: 'Employee', name: true, cell: function (r) { return esc(r.name); } },
    { key: 'sampled', label: 'Sampled', cell: function (r) {
        const tier = qaCoverageTier_(r);
        const t = Number(r.target) || 0, s = Number(r.sampled) || 0;
        const pct = t ? Math.min(100, Math.round((s / t) * 100)) : (r.exempt ? 0 : 100);
        return '<span class="qa-cov-cell" role="img" aria-label="' + s + ' of ' + t + ' sampled">' +
          '<span class="qa-cov-track" data-tier="' + tier.key + '"><i style="width:' + pct + '%"></i></span>' +
          '<span>' + s + ' / ' + t + '</span></span>';
      } },
    { key: 'avg', label: 'Avg /5', numeric: true, cell: function (r) {
        if (r.avg == null) return '—';
        const tone = qaScoreTone_(r.avg);
        return '<span class="qa-sc-chip"' + (tone ? ' data-tone="' + tone + '"' : '') + '>' + esc(String(r.avg)) + '</span>';
      } },
    { key: 'delta', label: 'vs prev', numeric: true, cell: function (r) {
        if (r.avg == null || r.prevAvg == null) return '—';
        const dlt = Math.round((Number(r.avg) - Number(r.prevAvg)) * 100) / 100;
        if (dlt === 0) return '±0';
        return '<span class="' + (dlt > 0 ? 'qa-delta-up' : 'qa-delta-down') + '">' + (dlt > 0 ? '▲ +' : '▼ ') + esc(String(dlt)) + '</span>';
      } },
    { key: 'lastReviewedMs', label: 'Last review', cell: function (r) { return r.lastReviewedMs ? esc(qaFmtDate_(r.lastReviewedMs)) : '—'; } },
    { key: 'tier', label: 'Status', cell: function (r) {
        const tier = qaCoverageTier_(r);
        return '<span class="kicker-pill"' + (tier.tone ? ' data-tone="' + tier.tone + '"' : '') + '>' + esc(tier.label) + '</span>';
      } },
  ];
  if (d.isManager) {
    cols.push({ key: 'actions', label: '', cell: function (r) {
      if (r.exempt) return '<button type="button" class="qa-btn" onclick="qaSetExemption_(\'' + esc(r.name).replace(/'/g, '\\\'') + '\', false)">Revoke exemption</button>';
      if (r.eligible) return '<button type="button" class="qa-btn" onclick="qaSetExemption_(\'' + esc(r.name).replace(/'/g, '\\\'') + '\', true)">Grant exemption</button>';
      return '';
    } });
  }
  html += mtRenderTable_({
    columns: cols, rows: rows,
    rowClass: function (r) {
      const k = qaCoverageTier_(r).key;
      return (k === 'shortlow' || k === 'short' || k === 'exempt') ? 'qa-row-' + k : '';
    },
  });
  html += '<div class="qa-note">Exemption = two covered periods in a row at 4.5+ with no criterion under 4 (managers grant it for ONE period). Sampled counts reviews marked done on calls dropped in the period; the average is the mean of their scorecards.</div>';
  html += '</section>';
  return html;
}

function qaSummaryStripHtml_(sum, label) {
  const cov = sum.pct == null ? '—' : sum.pct + '<small>%</small>';
  const short = sum.short;
  const avg = sum.avg == null ? '—' : String(sum.avg) + '<small> /5</small>';
  let deltaTxt = 'no previous period to compare';
  if (sum.delta != null) {
    deltaTxt = (sum.delta > 0 ? '▲ +' : sum.delta < 0 ? '▼ ' : '±') + (sum.delta === 0 ? '0' : String(sum.delta)) + ' vs previous period';
  } else if (sum.avg != null) {
    deltaTxt = 'no scored calls in the previous period';
  }
  const days = sum.daysLeft == null ? '—' : String(sum.daysLeft);
  return '<div class="qa-summary" role="group" aria-label="Coverage summary">' +
    '<div class="qa-sum"' + (sum.pct != null && sum.short > 0 ? ' data-tone="warn"' : '') + '><div class="qa-sum-k">Coverage</div>' +
      '<div class="qa-sum-v">' + cov + '</div>' +
      '<div class="qa-sum-sub">' + (sum.target
        ? sum.sampled + ' of ' + sum.target + ' target calls · ' + (short ? short + ' employee' + (short === 1 ? '' : 's') + ' short' : 'everyone at target')
        : 'no one to cover this period') + '</div>' +
      '<div class="qa-sum-bar" aria-hidden="true"><i style="width:' + (sum.pct == null ? 0 : sum.pct) + '%"></i></div></div>' +
    '<div class="qa-sum"><div class="qa-sum-k">Team avg</div>' +
      '<div class="qa-sum-v">' + avg + '</div>' +
      '<div class="qa-sum-sub">' + esc(deltaTxt) + '</div></div>' +
    '<div class="qa-sum"' + (sum.below.length ? ' data-tone="destructive"' : '') + '><div class="qa-sum-k">Below 3.5</div>' +
      '<div class="qa-sum-v">' + sum.below.length + '</div>' +
      '<div class="qa-sum-sub">' + (sum.below.length ? esc(sum.below.join(', ')) : 'nobody this period') + '</div></div>' +
    '<div class="qa-sum"><div class="qa-sum-k">Days left</div>' +
      '<div class="qa-sum-v">' + esc(days) + '</div>' +
      '<div class="qa-sum-sub">in ' + esc(label) + '</div></div>' +
    '</div>';
}

/** The recordings table (Q5) — sortable, status chips with counts, skip
 *  reasons inline, an Unattributed agent in the warn tone. */
function qaRecordingsSectionHtml_(d) {
  const all = d.recordings || [];
  const cnt = { all: all.length, new: 0, in_review: 0, done: 0, skipped: 0, mine: 0 };
  all.forEach(function (r) { if (cnt[r.status] != null) cnt[r.status]++; if (r.assignee === d.self) cnt.mine++; });
  const chips = [['all', 'All'], ['new', 'New'], ['in_review', 'In review'], ['done', 'Done'], ['skipped', 'Skipped'], ['mine', 'Mine']];
  let html = '<section class="qa-section" aria-labelledby="qa-rec-h">' +
    '<div class="qa-section-head"><h2 class="card-label" id="qa-rec-h">Recordings</h2>' +
    '<div class="toolbar-tabs" role="group" aria-label="Filter recordings">' +
    chips.map(function (c) {
      const on = QA_STATE.filter === c[0];
      return '<button type="button" class="toolbar-tab' + (on ? ' active' : '') + '" aria-pressed="' + on + '" onclick="qaSetFilter_(\'' + c[0] + '\')">' + c[1] + ' ' + cnt[c[0]] + '</button>';
    }).join('') + '</div></div>';
  const items = qaSortedItems_(qaVisibleItems_());
  if (!items.length) {
    html += '<div class="qa-empty">' + (all.length
      ? 'No recordings match this filter.'
      : 'No recordings indexed yet — drop audio files into the QA Drive folder, then press Sync.') + '</div>';
  } else {
    html += '<div class="qa-rec-table">' + mtRenderTable_({
      columns: [
        { key: 'name', label: 'Recording', name: true, sortable: true, cell: function (r) { return '<span style="overflow-wrap:anywhere">' + esc(r.name || '(unnamed)') + '</span>'; } },
        { key: 'agent', label: 'Agent', sortable: true, cell: function (r) { return r.agent ? esc(r.agent) : '<span class="qa-unattributed">Unattributed</span>'; } },
        { key: 'durationSec', label: 'Length', numeric: true, sortable: true, cell: function (r) { return Number(r.durationSec) > 0 ? esc(qaFmtClock_(r.durationSec)) : '—'; } },
        { key: 'createdMs', label: 'Dropped', sortable: true, cell: function (r) { return esc(qaFmtDate_(r.createdMs)); } },
        { key: 'status', label: 'Status', sortable: true, cell: function (r) {
            return qaStatusPillHtml_(r.status) + (r.status === 'skipped' && r.skipReason ? '<span class="qa-skip-why">' + esc(r.skipReason) + '</span>' : '');
          } },
        { key: 'assignee', label: 'Reviewer', sortable: true, cell: function (r) {
            return (qaAssigneePillHtml_(r, d.self) || '<span class="qa-note" style="margin:0">—</span>') +
              (r.comments ? ' <span class="qa-note" style="margin:0">' + r.comments + ' comment' + (r.comments === 1 ? '' : 's') + '</span>' : '');
          } },
        { key: 'actions', label: '', cell: function (r) { return '<div class="qa-row-actions">' + qaRowActionsHtml_(r, d) + '</div>'; } },
      ],
      rows: items,
      sort: QA_STATE.sort, onSort: 'qaSortQueue_',
    }) + '</div>';
  }
  if (d.total > all.length) {
    html += '<div class="qa-note">Showing ' + all.length + ' of ' + d.total + ' (list capped).</div>';
  }
  html += '</section>';
  return html;
}

function qaRowActionsHtml_(r, d) {
  const canRelease = r.assignee && (r.assignee === d.self || d.isManager);
  let actions = '<button type="button" class="qa-btn prime" onclick="qaOpenDetail_(\'' + esc(r.fileId) + '\')">Open</button>';
  if (!r.assignee) {
    actions += '<button type="button" class="qa-btn" onclick="qaAssign_(\'' + esc(r.fileId) + '\', \'self\')">Claim</button>';
  } else if (canRelease) {
    actions += '<button type="button" class="qa-btn" onclick="qaAssign_(\'' + esc(r.fileId) + '\', \'\')">Release</button>';
  }
  if (d.isManager) {
    actions += '<button type="button" class="qa-btn" onclick="qaAssign_(\'' + esc(r.fileId) + '\', \'other\')">Assign…</button>';
  }
  return actions;
}

function qaSetFilter_(f) {
  QA_STATE.filter = f;
  qaRenderQueue_();
  const body = document.querySelector('.qa-rec-table tbody');
  if (body && typeof animateListSwap_ === 'function') { try { animateListSwap_(body, 'tr'); } catch (e) {} }
}

function qaSync_() {
  const btn = document.getElementById('qa-sync-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.success) {
        showToast((r && r.error) || 'Sync failed.', 'toast-error');
        if (btn) { btn.disabled = false; btn.textContent = 'Sync from Drive'; }
        return;
      }
      let msg = r.added + ' new recording' + (r.added === 1 ? '' : 's') + ' indexed';
      if (r.nonAudio) msg += ' · ' + r.nonAudio + ' non-audio file' + (r.nonAudio === 1 ? '' : 's') + ' skipped';
      if (r.truncated) msg += ' · scan capped at ' + r.scanned + ' files — sync again for the rest';
      showToast(msg, r.truncated ? 'toast-warn' : 'toast-success');
      if (currentView === 'qaQueue' && !QA_STATE.det) {
        renderLoading(document.getElementById('view-area'), 'Refreshing…', 'waveform');
        qaLoadQueue_();
      }
    })
    .withFailureHandler(function (err) {
      showToast('Sync failed: ' + (err && err.message), 'toast-error');
      if (btn) { btn.disabled = false; btn.textContent = 'Sync from Drive'; }
    })
    .qaSyncRecordings();
}

/** Q4 — "Sample the gaps for me": the count is Σ (target − sampled) over
 *  non-exempt reps, clamped to the endpoint's 1–10; the server is
 *  target-aware in the SAME period, so a covered agent is never pulled ahead
 *  of one still short. */
function qaSample_() {
  const d = QA_STATE.queue || {};
  const sum = qaCoverageSummary_(d.coverage || [], d.todayYmd, d.periodEnd);
  const n = Math.max(1, Math.min(10, Number(sum.gaps) || 0));
  if (!(sum.gaps > 0)) { showToast('Everyone is at target this period — nothing to sample.', 'toast-info'); return; }
  const btn = document.getElementById('qa-sample-btn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (r) {
      if (btn) btn.disabled = false;
      if (!r || !r.success) { showToast((r && r.error) || 'Sampling failed.', 'toast-warn'); return; }
      showToast(r.assigned + ' recording(s) assigned to you — shortest-covered agents first', 'toast-success');
      if (currentView === 'qaQueue' && !QA_STATE.det) {
        renderLoading(document.getElementById('view-area'), 'Refreshing…', 'waveform');
        qaLoadQueue_();
      }
    })
    .withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      showToast('Sampling failed: ' + (err && err.message), 'toast-error');
    })
    .qaSampleRecordings(n, QA_STATE.period || '');
}

/** Q4 — grant/revoke an audit-period exemption (manager-only server-side;
 *  the button renders only for managers on eligible rows). */
function qaSetExemption_(name, on) {
  const d = QA_STATE.queue || {};
  const label = qaPeriodLabelOf_(d.period);
  uiConfirm({
    title: on ? 'Grant exemption' : 'Revoke exemption',
    message: on
      ? name + ' has two covered periods in a row at 4.5+ with no criterion under 4. Exempt them from sampling for ' + label + '? Their target this period becomes 0.'
      : 'Put ' + name + ' back on the sampling target for ' + label + '?',
    confirmLabel: on ? 'Grant' : 'Revoke',
  }).then(function (ok) {
    if (!ok) return;
    google.script.run
      .withSuccessHandler(function (r) {
        if (!r || !r.success) { showToast((r && r.error) || 'Exemption change failed.', 'toast-error'); return; }
        showToast(on ? 'Exempt for ' + label : 'Exemption revoked', 'toast-success');
        if (currentView === 'qaQueue' && !QA_STATE.det) {
          renderLoading(document.getElementById('view-area'), 'Refreshing…', 'waveform');

        }
      })
      .withFailureHandler(function (err) { showToast('Exemption change failed: ' + (err && err.message), 'toast-error'); })

  });
}

function qaAssign_(fileId, who) {
  const d = QA_STATE.queue || {};
  function send(target) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (!r || !r.success) { showToast((r && r.error) || 'Assign failed.', 'toast-error'); return; }
        // Patch the cached item, then repaint whichever mode is open.
        (d.recordings || []).forEach(function (it) { if (it.fileId === fileId) it.assignee = r.assignee; });
        if (QA_STATE.det && QA_STATE.det.fileId === fileId) { QA_STATE.det.assignee = r.assignee; qaRenderDetailHead_(); }
        else if (currentView === 'qaQueue') qaRenderQueue_();
      })
      .withFailureHandler(function (err) { showToast('Assign failed: ' + (err && err.message), 'toast-error'); })
      .qaAssignRecording(fileId, target);
  }
  if (who === 'self') return send(d.self || '');
  if (who === '') return send('');
  // Manager assign-other: prompt, validated against the QA_MEMBERS list.
  const members = d.members || [];
  uiPrompt({
    title: 'Assign recording',
    message: members.length ? 'QA members: ' + members.join(', ') : 'No QA_MEMBERS configured yet — add reviewer emails to that Script Property first.',
    placeholder: 'reviewer@umsupply.com',
    validator: function (v) {
      const e = String(v || '').trim().toLowerCase();
      if (!e) return 'Enter an email (or Cancel).';
      if (members.indexOf(e) < 0 && e !== d.self) return 'Not a QA member — add them to QA_MEMBERS first.';
      return '';
    },
  }).then(function (v) { if (v != null) send(String(v).trim().toLowerCase()); });
}

// ── Detail: player + scorecard + timestamped comments ──────────────────────

function qaOpenDetail_(fileId) {
  const d = QA_STATE.queue;
  const rec = d && (d.recordings || []).filter(function (r) { return r.fileId === fileId; })[0];
  if (!rec) return;
  QA_STATE.det = rec;
  QA_STATE.comments = [];
  QA_STATE.durationSec = 0;
  QA_STATE.scorecards = [];
  QA_STATE.ratings = {};
  QA_STATE.scoreNotes = '';
  QA_STATE.pin = null;
  qaRenderDetail_();
  if (rec.manual || rec.mime === 'manual') {
    // A recording-less audit (the operator's fallback): nothing to stream —
    // say so instead of asking the Drive boundary and rendering its refusal.
    const slot = document.getElementById('qa-audio-slot');
    if (slot) slot.innerHTML = '<div class="qa-note" style="margin:0"><span class="qa-manual-pill">no recording</span> This audit was logged without a recording attached.</div>';
  } else {
    qaLoadAudio_(rec);
  }
  qaLoadComments_(rec.fileId);
  qaLoadScorecards_(rec.fileId);
  qaEnsureKeysBound_();
}

function qaBackToQueue_() {
  QA_STATE.det = null;
  QA_STATE.pin = null;
  qaReleaseAudio_();
  if (currentView !== 'qaQueue') return;
  qaRenderQueue_();
  // Background-refresh so status/assign changes made in the detail are fresh.
  qaLoadQueue_();
}

function qaReleaseAudio_() {
  QA_STATE.audioSeq++;   // orphan any in-flight chunk loads
  QA_STATE.peaks = null;
  if (QA_STATE.objectUrl) { try { URL.revokeObjectURL(QA_STATE.objectUrl); } catch (e) {} QA_STATE.objectUrl = null; }
}

/** Q6 — two panes from 1000px: the LEFT pane is the call (agent attribution
 *  + player, sticky so the transport stays reachable while the review

function qaRenderDetail_() {

      // The waveform is DECORATION over the flat timeline: it appears only if
      // the low-rate decode succeeds (qaTryWaveform_), and every failure path
      // leaves the Phase-1 UI exactly as it was. aria-hidden: the transport
      // buttons + arrow keys are the accessible seek path.
      '<canvas id="qa-wave" class="qa-wave" height="64" hidden aria-hidden="true" onclick="qaWaveSeek_(event)"></canvas>' +
      '<div class="qa-transport" id="qa-transport"></div>' +

    '</div>' +

  qaRenderDetailHead_();

  qaRenderPinRow_();
  qaRenderCoachPanel_();
  const ta = document.getElementById('qa-comment-text');
  if (ta) ta.addEventListener('input', qaOnCommentInput_);
}

/** Phase 2 — which AGENT the call belongs to (feeds the Stats tab + the Q4
 *  coverage join). Roster names ride a datalist; free text stays allowed (an
 *  ex-agent's recording is still attributable). */
function qaRenderAgentRow_() {
  const host = document.getElementById('qa-agent-row');
  const r = QA_STATE.det, d = QA_STATE.queue || {};
  if (!host || !r) return;
  const opts = (d.agentOptions || []).map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('');
  const shared = Number(r.sharedMs) > 0;

    '<datalist id="qa-agent-opts">' + opts + '</datalist>' +
    '<button type="button" class="qa-btn" id="qa-agent-save" onclick="qaSaveAgent_()">Save</button>' +
    // Phase 3 — the RELEASE action: sharing is deliberate, never a side
    // effect of a status flip (the EmpDocs draft→release posture).
    (shared ? '<span class="qa-shared-pill">shared with agent</span>' : '') +
    '<button type="button" class="qa-btn" id="qa-share-btn" onclick="qaToggleShared_()">' +
      (shared ? 'Unshare' : 'Share with agent') + '</button>' +
    '</div>' +

}
/** Q7 — the roster-match line: whether the typed name is a roster employee
 *  (coverage + coaching key off it) and how covered they are this period. */
function qaMatchLineHtml_(r, d) {
  const agent = String(r.agent || '').trim();
  if (!agent) return '<div class="qa-match-line warn">Unattributed — set the agent so this review counts toward coverage.</div>';
  const row = (d.coverage || []).filter(function (c) { return String(c.name || '').toLowerCase() === agent.toLowerCase(); })[0];
  if (!row) return '<div class="qa-match-line warn">Not on the roster — check the spelling; coverage, Stats and coaching key off the exact roster name.</div>';
  if (row.exempt) return '<div class="qa-match-line">On the roster · exempt from sampling for ' + esc(qaPeriodLabelOf_(d.period)) + '</div>';
  return '<div class="qa-match-line">On the roster · ' + (Number(row.sampled) || 0) + ' of ' + (Number(row.target) || 0) + ' sampled in ' + esc(qaPeriodLabelOf_(d.period)) + '</div>';
}
function qaToggleShared_() {
  const r = QA_STATE.det;

  const next = !(Number(r.sharedMs) > 0);
  const btn = document.getElementById('qa-share-btn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) btn.disabled = false;
      if (!res || !res.success) { showToast((res && res.error) || 'Share failed.', 'toast-warn'); return; }
      r.sharedMs = res.sharedMs;
      showToast(next ? 'Review shared — it now shows on the agent’s My Reviews tab' : 'Review unshared', 'toast-success');
      qaRenderAgentRow_();
    })
    .withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      showToast('Share failed: ' + (err && err.message), 'toast-error');
    })
    .qaSetRecordingShared(r.fileId, next);
}
function qaSaveAgent_() {
  const r = QA_STATE.det;

  const name = String(inp.value || '').trim();

      r.agent = res.agent;
      r.agentEmpId = String(res.agentEmpId || '');   // Q7 — the server re-joins the roster id
      showToast(res.agent ? 'Agent set' : 'Agent cleared', 'toast-success');
      qaRenderAgentRow_();
      qaRenderCoachPanel_();
    })
    .withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      showToast('Save failed: ' + (err && err.message), 'toast-error');
    })
    .qaSetRecordingAgent(r.fileId, name);
}
/** Q6 — status actions live in the header: Skip (with a reason), Start
 *  review / Reopen, Mark done. */
function qaRenderDetailHead_() {
  const host = document.getElementById('qa-det-head');
  const r = QA_STATE.det, d = QA_STATE.queue || {};
  if (!host || !r) return;
  // NB the handler is qaChangeStatus_ — qaStatus_ is a SERVER helper name;
  // Phase 1 shipped these onclicks pointing at it (a dead reference jsdom's
  // outside-only mode can't catch), fixed in Phase 2 + pinned by the QA-7
  // onclick-resolves scan.
  let statusBtns = '';
  if (r.status === 'new' || r.status === 'skipped') {
    statusBtns += '<button type="button" class="qa-btn" onclick="qaChangeStatus_(\'in_review\')">Start review</button>';
  }
  if (r.status === 'new' || r.status === 'in_review') {
    statusBtns += '<button type="button" class="qa-btn" onclick="qaSkip_()">Skip…</button>';
  }
  if (r.status !== 'done') {
    statusBtns += '<button type="button" class="qa-btn prime" onclick="qaChangeStatus_(\'done\')">Mark done</button>';
  } else {
    statusBtns += '<button type="button" class="qa-btn" onclick="qaChangeStatus_(\'in_review\')">Reopen</button>';
  }
  host.innerHTML =
    '<button type="button" class="qa-btn" onclick="qaBackToQueue_()">' +
      (typeof icon === 'function' ? icon('chevronLeft', 14) : '') + ' Queue</button>' +
    '<div class="qa-det-title">' + esc(r.name || '(unnamed)') + '</div>' +
    qaStatusPillHtml_(r.status) +
    (r.status === 'skipped' && r.skipReason ? '<span class="qa-note" style="margin:0">' + esc(r.skipReason) + '</span>' : '') +
    qaAssigneePillHtml_(r, d.self) +
    '<div class="qa-det-actions">' + statusBtns + '</div>';
}

function qaChangeStatus_(st) {
  const r = QA_STATE.det;
  if (!r) return;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { showToast((res && res.error) || 'Status change failed.', 'toast-error'); return; }
      r.status = res.status;
      r.skipReason = res.skipReason || '';
      qaRenderDetailHead_();
    })
    .withFailureHandler(function (err) { showToast('Status change failed: ' + (err && err.message), 'toast-error'); })
    .qaSetRecordingStatus(r.fileId, st);
}
/** Q2 — skipping asks WHY (test call, wrong queue, a duplicate) so the
 *  reason shows on the queue row and a skipped call is never mistaken for
 *  an un-reviewed one. */
function qaSkip_() {
  const r = QA_STATE.det;
  if (!r) return;
  uiPrompt({
    title: 'Skip this recording',
    message: 'Why is it not being reviewed? The reason shows on the queue row.',
    placeholder: 'e.g. test call · wrong queue · duplicate upload',
    confirmLabel: 'Skip',
    validator: function (v) {
      const s = String(v || '').trim();
      if (!s) return 'Give a short reason (or Cancel).';
      if (s.length > 500) return 'Keep it under 500 characters.';
      return '';
    },
  }).then(function (v) {
    if (v == null) return;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) { showToast((res && res.error) || 'Skip failed.', 'toast-error'); return; }
        r.status = res.status;
        r.skipReason = res.skipReason || '';
        showToast('Skipped', 'toast-success');
        qaRenderDetailHead_();
      })
      .withFailureHandler(function (err) { showToast('Skip failed: ' + (err && err.message), 'toast-error'); })
      .qaSetRecordingStatus(r.fileId, 'skipped', String(v).trim());
  });
}

function qaSetLoadNote_(msg) {
  const el = document.getElementById('qa-load-note');
  if (el) el.textContent = msg;
}

function qaLoadAudio_(rec) {
  const mySeq = ++QA_STATE.audioSeq;
  const parts = [];
  function fail(msg, oversize) {
    if (QA_STATE.audioSeq !== mySeq) return;
    const slot = document.getElementById('qa-audio-slot');
    if (!slot) return;
    let html = errorStateHtml_(msg || 'Could not load the audio.');
    if (rec.url) {
      html += '<div class="qa-note"><a href="' + esc(rec.url) + '" target="_blank" rel="noopener">Open in Drive ↗</a>' +
        (oversize ? ' — Drive streams it without the in-app cap.' : '') + '</div>';
    }
    slot.innerHTML = html;
  }
  function fetchChunk(i) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (QA_STATE.audioSeq !== mySeq) return;   // stale — another recording opened (INV-156)
        if (!r || r.error || !r.success) { fail(r && r.error, r && r.oversize); return; }
        parts[r.chunkIndex] = r.b64;
        qaSetLoadNote_('Loading audio — part ' + Math.min(i + 1, r.chunks) + ' of ' + r.chunks + '…');
        if (i + 1 < r.chunks) fetchChunk(i + 1);
        else qaAssembleAudio_(parts, r.mime, mySeq);
      })
      .withFailureHandler(function (err) { fail('Could not load the audio: ' + (err && err.message)); })
      .qaGetAudioChunk(rec.fileId, i);
  }
  fetchChunk(0);
}

function qaAssembleAudio_(parts, mime, mySeq) {
  try {
    const bins = parts.map(function (b64) {
      const s = atob(b64 || '');
      const u = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
      return u;
    });
    const blob = new Blob(bins, { type: mime || 'audio/mpeg' });
    if (QA_STATE.audioSeq !== mySeq) return;
    if (QA_STATE.objectUrl) { try { URL.revokeObjectURL(QA_STATE.objectUrl); } catch (e) {} }
    QA_STATE.objectUrl = URL.createObjectURL(blob);
    const slot = document.getElementById('qa-audio-slot');
    if (!slot) return;
    slot.innerHTML = '<audio id="qa-audio" controls preload="metadata" aria-label="Call recording player"></audio>';
    const audio = document.getElementById('qa-audio');
    audio.src = QA_STATE.objectUrl;
    audio.playbackRate = QA_STATE.speed;
    audio.addEventListener('loadedmetadata', function () {
      QA_STATE.durationSec = isFinite(audio.duration) ? audio.duration : 0;
      qaRenderTimeline_();
      // Q5 — write the duration back ONCE (the queue's Length column);
      // fire-and-forget, the server refuses to overwrite a filled cell.
      try { qaWriteBackDuration_(QA_STATE.det, QA_STATE.durationSec); } catch (e) { /* metadata only */ }
    });
    audio.addEventListener('timeupdate', function () { qaTickPlayback_(audio); });
    qaRenderTransport_();
    // Phase 2 — waveform (decoration; every failure leaves the flat timeline).
    try {
      let total = 0;
      bins.forEach(function (u) { total += u.length; });
      if (total > 0 && total <= QA_WAVE_MAX_BYTES) {
        const all = new Uint8Array(total);
        let off = 0;
        bins.forEach(function (u) { all.set(u, off); off += u.length; });
        qaTryWaveform_(all, mySeq);
      }
    } catch (e) { /* decoration only */ }
  } catch (e) {
    const slot = document.getElementById('qa-audio-slot');
    if (slot && QA_STATE.audioSeq === mySeq) slot.innerHTML = errorStateHtml_('Could not decode the audio: ' + e.message);
  }
}
function qaWriteBackDuration_(rec, sec) {
  if (!rec || Number(rec.durationSec) > 0) return;
  const n = Math.round(Number(sec) || 0);
  if (!(n >= 1)) return;
  google.script.run
    .withSuccessHandler(function (res) { if (res && res.success && rec) rec.durationSec = Number(res.durationSec) || n; })
    .withFailureHandler(function () { /* metadata only — the queue shows an em dash until it lands */ })
    .qaSetRecordingDuration(rec.fileId, n);
}

var QA_SPEEDS = [0.75, 1, 1.25, 1.5, 2];
/** Q3 — ONE transport renderer for the reviewer detail AND the agent's My
 *  Reviews cards (listener-bound to the audio element it controls, so a
 *  per-card player needs no global ids). `state.speed` is the shared
 *  session speed for the detail; a card passes its own object. */
function qaRenderTransportFor_(host, audio, state, showKbd) {
  if (!host || !audio) return;
  const st = state || { speed: 1 };
  host.innerHTML =
    '<button type="button" class="qa-btn" data-qa-seek="-5" aria-label="Back 5 seconds">↺ 5s</button>' +
    '<button type="button" class="qa-btn" data-qa-seek="5" aria-label="Forward 5 seconds">5s ↻</button>' +
    QA_SPEEDS.map(function (s) {
      return '<button type="button" class="qa-chip qa-speed" data-qa-speed="' + s + '" aria-pressed="' + (st.speed === s ? 'true' : 'false') +
        '">' + s + '×</button>';
    }).join('') +
    // The key hint belongs ONLY where the keys work — the detail's document
    // handler is scoped to the open recording, so My Reviews shows none.
    (showKbd ? '<span class="qa-kbd-hint">space · ← →</span>' : '');
  host.querySelectorAll('[data-qa-seek]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (!isFinite(audio.duration)) return;
      audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + Number(b.getAttribute('data-qa-seek'))));
    });
  });
  host.querySelectorAll('[data-qa-speed]').forEach(function (b) {
    b.addEventListener('click', function () {
      st.speed = Number(b.getAttribute('data-qa-speed')) || 1;
      audio.playbackRate = st.speed;
      qaRenderTransportFor_(host, audio, st, showKbd);   // aria-pressed stays in step (A11)
    });
  });
}
function qaRenderTransport_() {
  qaRenderTransportFor_(document.getElementById('qa-transport'), document.getElementById('qa-audio'), QA_STATE, true);
}
function qaSeekBy_(delta) {
  const audio = document.getElementById('qa-audio');
  if (!audio || !isFinite(audio.duration)) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + delta));
}
function qaSeekTo_(sec) {
  const audio = document.getElementById('qa-audio');
  if (!audio) return;
  audio.currentTime = Math.max(0, Number(sec) || 0);
  if (audio.paused) { try { audio.play(); } catch (e) {} }
}

function qaTickPlayback_(audio) {
  // Q1: the composer's time is a PIN (set when typing starts), never this
  // live figure — the old "Comment at m:ss" label changed under the reviewer.
  const cur = document.getElementById('qa-tl-cursor');
  if (cur && QA_STATE.durationSec > 0) cur.style.left = qaMarkerPct_(audio.currentTime, QA_STATE.durationSec) + '%';
  if (QA_STATE.peaks && QA_STATE.durationSec > 0) {
    qaDrawWave_(audio.currentTime / QA_STATE.durationSec);
  }
}

// ── Phase 2: waveform ──────────────────────────────────────────────────────
var QA_WAVE_MAX_BYTES = 26214400;   // 25 MB decode-cost gate (PCM is many × the file size)
var QA_WAVE_BUCKETS = 240;

/** PURE (Node-pinned): normalized 0..1 peak per bucket over an array-like of
 *  PCM samples (Float32Array in the browser; plain arrays in tests). Empty
 *  input / no buckets → []. Peaks normalize to the loudest bucket so a quiet
 *  recording still shows its shape. */
function qaPeaks_(samples, buckets) {
  const n = samples ? samples.length : 0;
  const want = Math.floor(Number(buckets) || 0);
  if (!n || want < 1) return [];
  const out = [];
  const per = n / want;
  let max = 0;
  for (let b = 0; b < want; b++) {
    const s = Math.floor(b * per);
    const e = Math.min(n, Math.max(s + 1, Math.floor((b + 1) * per)));
    let peak = 0;
    for (let i = s; i < e; i++) {
      const v = samples[i] < 0 ? -samples[i] : samples[i];
      if (v > peak) peak = v;
    }
    out.push(peak);
    if (peak > max) max = peak;
  }
  if (max > 0) for (let b = 0; b < out.length; b++) out[b] = Math.round((out[b] / max) * 1000) / 1000;
  return out;
}

/** Decode a LOW-RATE mono copy for the waveform — decoration, never the
 *  playback path: every failure (no OfflineAudioContext, decode error, the
 *  size gate) silently leaves the flat timeline exactly as Phase 1 shipped
 *  it. The decode runs at 8 kHz MONO via OfflineAudioContext — a 40-minute
 *  call costs ~tens of MB transiently, where a naive 44.1 kHz stereo
 *  AudioContext decode would be hundreds — and the decoded PCM is dropped
 *  the moment the peaks are extracted. */
function qaTryWaveform_(bytes, mySeq) {
  try {
    if (!bytes || !bytes.length || bytes.length > QA_WAVE_MAX_BYTES) return;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return;
    const ctx = new OAC(1, 8000, 8000);
    // decodeAudioData DETACHES its input buffer — hand it a copy so the
    // already-mounted Blob playback is untouched.
    const copy = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
    ctx.decodeAudioData(copy, function (decoded) {
      try {
        if (QA_STATE.audioSeq !== mySeq) return;   // another recording opened (INV-156)
        QA_STATE.peaks = qaPeaks_(decoded.getChannelData(0), QA_WAVE_BUCKETS);
        decoded = null;   // free the PCM as soon as the peaks exist
        const wave = document.getElementById('qa-wave');
        if (wave && QA_STATE.peaks.length) { wave.hidden = false; qaDrawWave_(0); }
      } catch (e) { /* decoration only */ }
    }, function () { /* undecodable for the waveform — playback is unaffected */ });
  } catch (e) { /* decoration only */ }
}

function qaDrawWave_(playedFrac) {
  qaDrawWaveOn_(document.getElementById('qa-wave'), QA_STATE.peaks, playedFrac);
}

// Shared painter (follow-on 2026-08-28) — the detail's #qa-wave and the
// My Reviews per-card canvases render through this ONE body, so the two
// waveforms cannot drift (the qaScorecardListHtml_ discipline).
function qaDrawWaveOn_(wave, peaks, playedFrac) {
  if (!wave || !peaks || !peaks.length) return;
  try {
    if (wave.clientWidth > 0 && wave.width !== wave.clientWidth) wave.width = wave.clientWidth;
    const g = wave.getContext('2d');
    if (!g) return;
    const W = wave.width, H = wave.height;
    const cs = getComputedStyle(document.documentElement);
    const accent = (cs.getPropertyValue('--accent') || '').trim() || '#0b6e40';
    const muted = (cs.getPropertyValue('--muted-3') || '').trim() || '#9aa3b2';
    g.clearRect(0, 0, W, H);
    const frac = Math.max(0, Math.min(1, Number(playedFrac) || 0));
    const barW = W / peaks.length;
    for (let i = 0; i < peaks.length; i++) {
      const h = Math.max(2, peaks[i] * H * 0.9);
      g.fillStyle = ((i + 1) / peaks.length <= frac) ? accent : muted;
      g.fillRect(i * barW, (H - h) / 2, Math.max(1, barW - 1), h);
    }
  } catch (e) { /* decoration only */ }
}

function qaWaveSeek_(ev) {
  const wave = document.getElementById('qa-wave');
  const audio = document.getElementById('qa-audio');
  if (!wave || !audio || !isFinite(audio.duration) || !audio.duration) return;
  const rect = wave.getBoundingClientRect();
  if (!rect.width) return;
  const frac = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
  qaSeekTo_(frac * audio.duration);
}

function qaRenderTimeline_() {

// ── Q1: pause-and-pin comment composer ─────────────────────────────────────
// The first keystroke PAUSES playback and PINS the moment; the pinned time is
// editable; the comment posts at the PIN (never at whatever the player has
// drifted to), and the reviewer chooses whether playback resumes.
function qaOnCommentInput_() {
  if (QA_STATE.pin) return;
  const audio = document.getElementById('qa-audio');
  const wasPlaying = !!(audio && !audio.paused && !audio.ended);
  if (audio && wasPlaying) { try { audio.pause(); } catch (e) {} }
  QA_STATE.pin = { atSec: audio ? Math.floor(Number(audio.currentTime) || 0) : 0, wasPlaying: wasPlaying };
  qaRenderPinRow_();
}
function qaRenderPinRow_() {
  const row = document.getElementById('qa-pin-row');
  const acts = document.getElementById('qa-add-actions');
  if (!row || !acts) return;
  const pin = QA_STATE.pin;
  if (!pin) {
    row.innerHTML = '<span>Start typing to pin a comment at the current moment.</span>';
    acts.innerHTML = '';
    return;
  }
  row.innerHTML =
    '<label for="qa-pin-at">Pinned at</label>' +
    '<input type="text" id="qa-pin-at" class="qa-pin-input" value="' + esc(qaFmtClock_(pin.atSec)) + '" inputmode="numeric" aria-label="Pinned time (m:ss)">' +
    '<span id="qa-pin-status">· ' + (pin.wasPlaying ? 'playback paused' : 'player is paused') + '</span>';
  acts.innerHTML =
    '<button type="button" class="qa-btn prime" id="qa-comment-btn" onclick="qaSubmitComment_(true)">Post &amp; resume</button>' +
    '<button type="button" class="qa-btn" id="qa-comment-stay-btn" onclick="qaSubmitComment_(false)">Post &amp; stay paused</button>' +
    '<button type="button" class="qa-btn" onclick="qaDiscardComment_()">Discard</button>';
}
/** The pin the composer will post at: the editable field wins (a typo is
 *  refused by name, never posted at 0); null = no pin yet. */
function qaPinnedAtSec_() {
  const inp = document.getElementById('qa-pin-at');
  if (inp) return qaParseClock_(inp.value);
  return QA_STATE.pin ? QA_STATE.pin.atSec : null;
}
function qaSubmitComment_(resume) {
  const r = QA_STATE.det;
  const ta = document.getElementById('qa-comment-text');
  if (!r || !ta) return;
  const text = String(ta.value || '').trim();
  if (!text) { showToast('Write a comment first.', 'toast-warn'); return; }
  if (!QA_STATE.pin) qaOnCommentInput_();   // a paste with no input event — pin now
  const atSec = qaPinnedAtSec_();
  if (atSec == null) { showToast('The pinned time must read m:ss (e.g. 4:05).', 'toast-warn'); return; }
  const btn = document.getElementById('qa-comment-btn');
  const stay = document.getElementById('qa-comment-stay-btn');
  if (btn) btn.disabled = true;
  if (stay) stay.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) btn.disabled = false;
      if (stay) stay.disabled = false;
      if (!res || !res.success) { showToast((res && res.error) || 'Comment failed.', 'toast-error'); return; }
      ta.value = '';
      QA_STATE.pin = null;
      qaRenderPinRow_();
      if (resume) { const audio = document.getElementById('qa-audio'); if (audio) { try { audio.play(); } catch (e) {} } }
      if (QA_STATE.det && QA_STATE.det.fileId === r.fileId) qaLoadComments_(r.fileId);
    })
    .withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      if (stay) stay.disabled = false;
      showToast('Comment failed: ' + (err && err.message), 'toast-error');
    })
    .qaAddComment(r.fileId, atSec, text);
}
function qaDiscardComment_() {
  const ta = document.getElementById('qa-comment-text');
  const pin = QA_STATE.pin;
  if (ta) ta.value = '';
  QA_STATE.pin = null;
  qaRenderPinRow_();
  if (pin && pin.wasPlaying) { const audio = document.getElementById('qa-audio'); if (audio) { try { audio.play(); } catch (e) {} } }
}

function qaDeleteComment_(commentId) {
  const r = QA_STATE.det;
  if (!r) return;
  uiConfirm({ title: 'Remove comment', message: 'Remove this comment?', tone: 'danger', confirmLabel: 'Remove' })
    .then(function (ok) {
      if (!ok) return;

        .withSuccessHandler(function (res) {

        })
        .withFailureHandler(function (err) { showToast('Remove failed: ' + (err && err.message), 'toast-error'); })
        .qaDeleteComment(commentId);
    });
}
