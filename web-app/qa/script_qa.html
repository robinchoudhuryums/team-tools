<style>
  /* ── QA module (Phase 1) — call-recording review queue + player ──────────
     Tokens only; breakpoints per the A2 rule (a fixed grid owes a viewport
     breakpoint). Empty states use .qa-empty (the derived A12 convention);
     failures render errorStateHtml_. */
  .qa-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .qa-toolbar .spacer { flex: 1; }
  .qa-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .qa-chip {
    appearance: none; background: var(--paper-card); border: 1px solid var(--line);
    border-radius: var(--radius-pill, 999px); padding: 4px 12px; font: inherit;
    font-size: var(--text-sm, 12px); color: var(--muted-2); cursor: pointer;
  }
  .qa-chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .qa-btn {
    appearance: none; background: var(--paper-card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: var(--text-sm, 12px);
    color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .qa-btn:hover { border-color: var(--border-strong); }
  .qa-btn:disabled { opacity: .55; cursor: default; }
  .qa-btn.prime { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qa-list { display: grid; gap: 10px; }
  .qa-card {
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px;
    align-items: center;
  }
  .qa-card-name { font-weight: 600; overflow-wrap: anywhere; }
  .qa-card-meta { color: var(--muted-2); font-size: var(--text-sm, 12px); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .qa-card-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .qa-status { border-radius: var(--radius-pill, 999px); padding: 2px 10px; font-size: 11px; border: 1px solid var(--line); color: var(--muted-2); white-space: nowrap; }
  .qa-status.st-new       { background: var(--info-soft);    border-color: var(--info);    color: var(--info-deep); }
  .qa-status.st-in_review { background: var(--warn-soft);    border-color: var(--warn);    color: var(--warning-deep); }
  .qa-status.st-done      { background: var(--accent-soft);  border-color: var(--accent);  color: var(--success-deep); }
  .qa-status.st-skipped   { background: var(--paper-2); }
  .qa-assignee { border-radius: var(--radius-pill, 999px); padding: 2px 10px; font-size: 11px; background: var(--paper-2); border: 1px solid var(--line); color: var(--muted-2); }
  .qa-assignee.mine { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .qa-empty { border: 1px dashed var(--line); border-radius: 10px; padding: 24px; text-align: center; color: var(--muted-2); }
  .qa-note { color: var(--muted-2); font-size: var(--text-sm, 12px); margin: 8px 0 0; }

  /* Detail */
  .qa-det-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .qa-det-title { font-weight: 700; font-size: var(--text-lg, 16px); overflow-wrap: anywhere; min-width: 0; }
  .qa-player-card, .qa-comments-card {
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; margin-bottom: 14px;
  }
  .qa-player-card audio { width: 100%; }
  .qa-transport { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .qa-speed[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .qa-kbd-hint { color: var(--muted-3); font-size: 11px; margin-left: auto; }
  .qa-timeline {
    position: relative; height: 26px; background: var(--paper-2);
    border: 1px solid var(--line); border-radius: var(--radius-pill, 999px); margin-top: 12px;
  }
  .qa-tl-mark {
    appearance: none; position: absolute; top: 2px; bottom: 2px; width: 8px; padding: 0;
    transform: translateX(-50%); background: var(--info); border: 1px solid var(--info-deep);
    border-radius: 4px; cursor: pointer;
  }
  .qa-tl-cursor { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); border-radius: 1px; pointer-events: none; }
  .qa-comment-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .qa-comment-row:last-child { border-bottom: none; }
  .qa-time-chip {
    appearance: none; background: var(--info-soft); border: 1px solid var(--info);
    color: var(--info-deep); border-radius: var(--radius-pill, 999px); padding: 2px 10px;
    font: inherit; font-family: var(--mono); font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .qa-comment-text { overflow-wrap: anywhere; }
  .qa-comment-by { color: var(--muted-2); font-size: 11px; }
  .qa-del-btn { appearance: none; background: none; border: none; color: var(--muted-2); cursor: pointer; font: inherit; padding: 2px 6px; }
  .qa-del-btn:hover { color: var(--danger-deep); }
  .qa-add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 10px; align-items: end; }
  .qa-add-row textarea {
    width: 100%; min-height: 54px; resize: vertical; font: inherit; font-size: var(--text-sm, 13px);
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }

  /* Phase 2 — agent attribution, waveform, scorecards, per-agent stats */
  .qa-agent-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .qa-agent-row input {
    font: inherit; font-size: var(--text-sm, 12px); padding: 6px 9px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--paper); color: var(--ink); min-width: 200px;
  }
  /* display:block would BEAT the UA's [hidden]{display:none} (the documented
     [hidden] specificity gotcha) — the companion rule below is load-bearing. */
  .qa-wave { display: block; width: 100%; height: 64px; margin-top: 10px; cursor: pointer; border-radius: 6px; background: var(--paper-2); }
  .qa-wave[hidden] { display: none; }
  .qa-score-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .qa-score-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .qa-rate-btns { display: flex; gap: 4px; }
  .qa-rate-btn {
    appearance: none; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper); color: var(--muted-2); font: inherit; font-size: 12px; cursor: pointer;
  }
  .qa-rate-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
  .qa-score-notes {
    width: 100%; min-height: 46px; resize: vertical; font: inherit; font-size: var(--text-sm, 13px);
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px;
  }
  .qa-sc-item { border-top: 1px solid var(--line); padding: 8px 0; font-size: var(--text-sm, 12px); }
  .qa-sc-meta { color: var(--muted-2); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .qa-sc-chip { border: 1px solid var(--line); border-radius: var(--radius-pill, 999px); padding: 1px 8px; font-size: 11px; color: var(--muted-2); background: var(--paper-2); }
  .qa-stats-strip { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; color: var(--muted-2); font-size: var(--text-sm, 12px); }
  .qa-stats-strip strong { color: var(--ink); font-size: 16px; }
  /* Phase 3 — share pill + agent-facing My Reviews */
  .qa-shared-pill { border-radius: var(--radius-pill, 999px); padding: 2px 10px; font-size: 11px; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--success-deep); white-space: nowrap; }
  .qa-myrev-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .qa-myrev-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .qa-myrev-name { font-weight: 600; overflow-wrap: anywhere; }
  @media (max-width: 700px) {
    .qa-card { grid-template-columns: minmax(0, 1fr); }
    .qa-card-actions { justify-content: flex-start; }
    .qa-add-row { grid-template-columns: minmax(0, 1fr); }
  }
</style>

<script>
// ── QA module client (Phase 1) ──────────────────────────────────────────────
// One tab (qaQueue) with two in-tab modes: the queue list and a recording
// detail (player + timestamped comments). Audio arrives as base64 chunks
// (qaGetAudioChunk) assembled into a Blob URL — seq-guarded (INV-156) so
// opening another recording drops stale chunk appends.
var QA_STATE = {
  queue: null,          // last getQaQueue payload
  filter: 'all',        // all | new | in_review | done | mine
  seq: 0,               // queue-load seq guard
  det: null,            // the open recording (queue item) or null
  audioSeq: 0,          // chunk-assembly seq guard
  objectUrl: null,      // current Blob URL (revoked on replace)
  durationSec: 0,
  comments: [],
  canModerate: false,
  speed: 1,             // session-only playback speed
  // Phase 2
  peaks: null,          // normalized waveform buckets (null = no waveform — flat timeline only)
  criteria: [],         // live scorecard criteria (from qaListScorecards)
  scorecards: [],       // latest-per-reviewer cards for the open recording
  selfEmpId: '',
  ratings: {},          // the in-progress scorecard form
  scoreNotes: '',
  statsSeq: 0,          // qaStats-load seq guard
  myRevSeq: 0,          // Phase 3 — My Reviews load seq guard
  myRevAudioSeq: 0,     // follow-on — shared-review playback seq guard (one active load)
  myRevObjectUrl: null, // follow-on — the shared-review Blob URL (revoked on replace)
};

function enterQaQueueView() {
  if (typeof stopClock === 'function') stopClock();
  if (typeof cnStopAmbientPolling_ === 'function') cnStopAmbientPolling_();
  QA_STATE.det = null;
  qaReleaseAudio_();
  const area = document.getElementById('view-area');
  renderLoading(area, 'Loading QA queue…', 'headset');
  qaLoadQueue_();
}

function qaLoadQueue_() {
  const requestedView = currentView;
  const mySeq = ++QA_STATE.seq;
  google.script.run
    .withSuccessHandler(function (data) {
      if (currentView !== requestedView || QA_STATE.seq !== mySeq) return;
      if (!data || data.error) {
        document.getElementById('view-area').innerHTML = errorStateHtml_((data && data.error) || 'Could not load the QA queue.');
        return;
      }
      QA_STATE.queue = data;
      if (QA_STATE.det) return;   // a detail opened while the refresh ran — leave it
      qaRenderQueue_();
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView || QA_STATE.seq !== mySeq) return;
      document.getElementById('view-area').innerHTML = errorStateHtml_('Could not load the QA queue: ' + (err && err.message));
    })
    .getQaQueue();
}

function qaFmtSize_(bytes) {
  const n = Number(bytes) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n >= 1024) return Math.round(n / 1024) + ' KB';
  return n + ' B';
}
function qaFmtDate_(ms) {
  const n = Number(ms) || 0;
  if (!n) return '';
  try { return new Date(n).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
  catch (e) { return ''; }
}
/** m:ss (or h:mm:ss past an hour) for player timestamps. PURE — Node-pinned. */
function qaFmtClock_(sec) {
  let s = Math.max(0, Math.floor(Number(sec) || 0));
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  const mm = h ? String(m).padStart(2, '0') : String(m);
  return (h ? h + ':' : '') + mm + ':' + String(s).padStart(2, '0');
}
/** Timeline marker position as a 0..100 percent, clamped. PURE — Node-pinned. */
function qaMarkerPct_(atSec, durSec) {
  const at = Number(atSec), dur = Number(durSec);
  if (!isFinite(at) || !isFinite(dur) || dur <= 0) return 0;
  return Math.max(0, Math.min(100, (at / dur) * 100));
}
var QA_STATUS_LABELS = { new: 'New', in_review: 'In review', done: 'Done', skipped: 'Skipped' };
function qaStatusPillHtml_(status) {
  const st = QA_STATUS_LABELS[status] ? status : 'new';
  return '<span class="qa-status st-' + st + '">' + esc(QA_STATUS_LABELS[st]) + '</span>';
}
function qaAssigneePillHtml_(item, self) {
  if (!item.assignee) return '';
  const mine = item.assignee === self;
  return '<span class="qa-assignee' + (mine ? ' mine' : '') + '" title="' + esc(item.assignee) + '">' +
    (mine ? 'you' : esc(item.assignee.split('@')[0])) + '</span>';
}

function qaVisibleItems_() {
  const d = QA_STATE.queue;
  if (!d || !d.recordings) return [];
  return d.recordings.filter(function (r) {
    if (QA_STATE.filter === 'mine') return r.assignee === d.self;
    if (QA_STATE.filter === 'all') return true;
    return r.status === QA_STATE.filter;
  });
}

function qaRenderQueue_() {
  const area = document.getElementById('view-area');
  const d = QA_STATE.queue;
  if (!d) return;
  let html = '';
  if (!COMPACT_MODE) {
    html += '<div class="view-title-row"><h1>QA · Recordings</h1></div>';
  }
  if (d.notConfigured) {
    area.innerHTML = html +
      '<div class="qa-empty">QA is not set up yet. An admin sets Script Property <strong>QA_SS_ID</strong> to a fresh dedicated spreadsheet' +
      (d.folderConfigured ? '' : ' and <strong>QA_RECORDINGS_FOLDER_ID</strong> to the Drive folder recordings are dropped into') +
      ', then presses Sync here.</div>';
    return;
  }
  const chips = [
    ['all', 'All'], ['new', 'New'], ['in_review', 'In review'], ['done', 'Done'], ['mine', 'Mine'],
  ];
  html += '<div class="qa-toolbar">' +
    '<div class="qa-chips" role="group" aria-label="Filter recordings">' +
    chips.map(function (c) {
      return '<button type="button" class="qa-chip" aria-pressed="' +
        (QA_STATE.filter === c[0] ? 'true' : 'false') + '" onclick="qaSetFilter_(\'' + c[0] + '\')">' + c[1] + '</button>';
    }).join('') +
    '</div><div class="spacer"></div>' +
    // Phase 3 — coverage-fair sampling: assigns up to 3 un-reviewed,
    // un-assigned recordings to ME (agents with the fewest done reviews
    // first). Routing work to someone ELSE stays the manager Assign… flow.
    '<button type="button" class="qa-btn" id="qa-sample-btn" onclick="qaSample_()">' +
    (typeof icon === 'function' ? icon('check', 14) : '') + ' Sample 3 for me</button>' +
    '<button type="button" class="qa-btn" id="qa-sync-btn" onclick="qaSync_()">' +
    (typeof icon === 'function' ? icon('refresh', 14) : '') + ' Sync from Drive</button>' +
    '</div>';
  if (!d.folderConfigured) {
    html += '<div class="qa-note">The recordings Drive folder is not configured (Script Property <strong>QA_RECORDINGS_FOLDER_ID</strong>) — Sync and playback need it.</div>';
  }
  const items = qaVisibleItems_();
  if (!items.length) {
    html += '<div class="qa-empty">' + (d.recordings.length
      ? 'No recordings match this filter.'
      : 'No recordings indexed yet — drop audio files into the QA Drive folder, then press Sync.') + '</div>';
  } else {
    html += '<div class="qa-list">' + items.map(function (r) { return qaCardHtml_(r, d); }).join('') + '</div>';
  }
  if (d.total > (d.recordings || []).length) {
    html += '<div class="qa-note">Showing ' + d.recordings.length + ' of ' + d.total + ' (list capped).</div>';
  }
  area.innerHTML = html;
}

function qaCardHtml_(r, d) {
  const canRelease = r.assignee && (r.assignee === d.self || d.isManager);
  let actions = '<button type="button" class="qa-btn prime" onclick="qaOpenDetail_(\'' + esc(r.fileId) + '\')">Open</button>';
  if (!r.assignee) {
    actions += '<button type="button" class="qa-btn" onclick="qaAssign_(\'' + esc(r.fileId) + '\', \'self\')">Claim</button>';
  } else if (canRelease) {
    actions += '<button type="button" class="qa-btn" onclick="qaAssign_(\'' + esc(r.fileId) + '\', \'\')">Release</button>';
  }
  if (d.isManager) {
    actions += '<button type="button" class="qa-btn" onclick="qaAssign_(\'' + esc(r.fileId) + '\', \'other\')">Assign…</button>';
  }
  return '<div class="qa-card">' +
    '<div style="min-width:0">' +
      '<div class="qa-card-name">' + esc(r.name || '(unnamed)') + '</div>' +
      '<div class="qa-card-meta">' +
        qaStatusPillHtml_(r.status) +
        qaAssigneePillHtml_(r, d.self) +
        '<span>' + esc(qaFmtDate_(r.createdMs)) + '</span>' +
        '<span>' + esc(qaFmtSize_(r.sizeBytes)) + '</span>' +
        (r.comments ? '<span>' + r.comments + ' comment' + (r.comments === 1 ? '' : 's') + '</span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="qa-card-actions">' + actions + '</div>' +
    '</div>';
}

function qaSetFilter_(f) {
  QA_STATE.filter = f;
  qaRenderQueue_();
  const list = document.querySelector('.qa-list');
  if (list && typeof animateListSwap_ === 'function') { try { animateListSwap_(list, '.qa-card'); } catch (e) {} }
}

function qaSync_() {
  const btn = document.getElementById('qa-sync-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.success) {
        showToast((r && r.error) || 'Sync failed.', 'toast-error');
        if (btn) { btn.disabled = false; btn.textContent = 'Sync from Drive'; }
        return;
      }
      let msg = r.added + ' new recording' + (r.added === 1 ? '' : 's') + ' indexed';
      if (r.nonAudio) msg += ' · ' + r.nonAudio + ' non-audio file' + (r.nonAudio === 1 ? '' : 's') + ' skipped';
      if (r.truncated) msg += ' · scan capped at ' + r.scanned + ' files — sync again for the rest';
      showToast(msg, r.truncated ? 'toast-warn' : 'toast-success');
      if (currentView === 'qaQueue' && !QA_STATE.det) {
        renderLoading(document.getElementById('view-area'), 'Refreshing…', 'headset');
        qaLoadQueue_();
      }
    })
    .withFailureHandler(function (err) {
      showToast('Sync failed: ' + (err && err.message), 'toast-error');
      if (btn) { btn.disabled = false; btn.textContent = 'Sync from Drive'; }
    })
    .qaSyncRecordings();
}

function qaSample_() {
  const btn = document.getElementById('qa-sample-btn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (r) {
      if (btn) btn.disabled = false;
      if (!r || !r.success) { showToast((r && r.error) || 'Sampling failed.', 'toast-warn'); return; }
      showToast(r.assigned + ' recording(s) assigned to you — least-reviewed agents first', 'toast-success');
      if (currentView === 'qaQueue' && !QA_STATE.det) {
        renderLoading(document.getElementById('view-area'), 'Refreshing…', 'headset');
        qaLoadQueue_();
      }
    })
    .withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      showToast('Sampling failed: ' + (err && err.message), 'toast-error');
    })
    .qaSampleRecordings(3);
}

function qaAssign_(fileId, who) {
  const d = QA_STATE.queue || {};
  function send(target) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (!r || !r.success) { showToast((r && r.error) || 'Assign failed.', 'toast-error'); return; }
        // Patch the cached item, then repaint whichever mode is open.
        (d.recordings || []).forEach(function (it) { if (it.fileId === fileId) it.assignee = r.assignee; });
        if (QA_STATE.det && QA_STATE.det.fileId === fileId) { QA_STATE.det.assignee = r.assignee; qaRenderDetailHead_(); }
        else if (currentView === 'qaQueue') qaRenderQueue_();
      })
      .withFailureHandler(function (err) { showToast('Assign failed: ' + (err && err.message), 'toast-error'); })
      .qaAssignRecording(fileId, target);
  }
  if (who === 'self') return send(d.self || '');
  if (who === '') return send('');
  // Manager assign-other: prompt, validated against the QA_MEMBERS list.
  const members = d.members || [];
  uiPrompt({
    title: 'Assign recording',
    message: members.length ? 'QA members: ' + members.join(', ') : 'No QA_MEMBERS configured yet — add reviewer emails to that Script Property first.',
    placeholder: 'reviewer@umsupply.com',
    validator: function (v) {
      const e = String(v || '').trim().toLowerCase();
      if (!e) return 'Enter an email (or Cancel).';
      if (members.indexOf(e) < 0 && e !== d.self) return 'Not a QA member — add them to QA_MEMBERS first.';
      return '';
    },
  }).then(function (v) { if (v != null) send(String(v).trim().toLowerCase()); });
}

// ── Detail: player + timestamped comments ──────────────────────────────────

function qaOpenDetail_(fileId) {
  const d = QA_STATE.queue;
  const rec = d && (d.recordings || []).filter(function (r) { return r.fileId === fileId; })[0];
  if (!rec) return;
  QA_STATE.det = rec;
  QA_STATE.comments = [];
  QA_STATE.durationSec = 0;
  QA_STATE.scorecards = [];
  QA_STATE.ratings = {};
  QA_STATE.scoreNotes = '';
  qaRenderDetail_();
  qaLoadAudio_(rec);
  qaLoadComments_(rec.fileId);
  qaLoadScorecards_(rec.fileId);
  qaEnsureKeysBound_();
}

function qaBackToQueue_() {
  QA_STATE.det = null;
  qaReleaseAudio_();
  if (currentView !== 'qaQueue') return;
  qaRenderQueue_();
  // Background-refresh so status/assign changes made in the detail are fresh.
  qaLoadQueue_();
}

function qaReleaseAudio_() {
  QA_STATE.audioSeq++;   // orphan any in-flight chunk loads
  QA_STATE.peaks = null;
  if (QA_STATE.objectUrl) { try { URL.revokeObjectURL(QA_STATE.objectUrl); } catch (e) {} QA_STATE.objectUrl = null; }
}

function qaRenderDetail_() {
  const area = document.getElementById('view-area');
  area.innerHTML =
    '<div class="qa-det-head" id="qa-det-head"></div>' +
    '<div class="qa-agent-row" id="qa-agent-row"></div>' +
    '<div class="qa-player-card">' +
      '<div id="qa-audio-slot"><div class="qa-note" id="qa-load-note">Loading audio…</div></div>' +
      // The waveform is DECORATION over the flat timeline: it appears only if
      // the low-rate decode succeeds (qaTryWaveform_), and every failure path
      // leaves the Phase-1 UI exactly as it was. aria-hidden: the transport
      // buttons + arrow keys are the accessible seek path.
      '<canvas id="qa-wave" class="qa-wave" height="64" hidden aria-hidden="true" onclick="qaWaveSeek_(event)"></canvas>' +

}

/** Phase 2 — which AGENT the call belongs to (feeds the Stats tab). Roster
 *  names ride a datalist; free text stays allowed (an ex-agent's recording is
 *  still attributable). */
function qaRenderAgentRow_() {
  const host = document.getElementById('qa-agent-row');
  const r = QA_STATE.det, d = QA_STATE.queue || {};
  if (!host || !r) return;
  const opts = (d.agentOptions || []).map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('');
  const shared = Number(r.sharedMs) > 0;
  host.innerHTML =
    '<label for="qa-agent-input" style="font-size:12px;color:var(--muted-2)">Agent on this call</label>' +
    '<input type="text" id="qa-agent-input" list="qa-agent-opts" maxlength="80" value="' + esc(r.agent || '') + '" placeholder="unassigned">' +
    '<datalist id="qa-agent-opts">' + opts + '</datalist>' +
    '<button type="button" class="qa-btn" id="qa-agent-save" onclick="qaSaveAgent_()">Save</button>' +
    '<span class="qa-note" style="margin:0">feeds the per-agent Stats tab</span>' +
    // Phase 3 — the RELEASE action: sharing is deliberate, never a side
    // effect of a status flip (the EmpDocs draft→release posture).
    (shared ? '<span class="qa-shared-pill">shared with agent</span>' : '') +
    '<button type="button" class="qa-btn" id="qa-share-btn" onclick="qaToggleShared_()">' +
      (shared ? 'Unshare' : 'Share with agent') + '</button>';
}
function qaToggleShared_() {

function qaSaveAgent_() {

function qaRenderDetailHead_() {
  const host = document.getElementById('qa-det-head');
  const r = QA_STATE.det, d = QA_STATE.queue || {};
  if (!host || !r) return;
  // NB the handler is qaChangeStatus_ — qaStatus_ is a SERVER helper name;
  // Phase 1 shipped these onclicks pointing at it (a dead reference jsdom's
  // outside-only mode can't catch), fixed in Phase 2 + pinned by the QA-7
  // onclick-resolves scan.
  let statusBtns = '';
  if (r.status === 'new' || r.status === 'skipped') {
    statusBtns += '<button type="button" class="qa-btn" onclick="qaChangeStatus_(\'in_review\')">Start review</button>';
  }
  if (r.status !== 'done') {
    statusBtns += '<button type="button" class="qa-btn prime" onclick="qaChangeStatus_(\'done\')">Mark done</button>';
  } else {
    statusBtns += '<button type="button" class="qa-btn" onclick="qaChangeStatus_(\'in_review\')">Reopen</button>';
  }
  host.innerHTML =
    '<button type="button" class="qa-btn" onclick="qaBackToQueue_()">' +
      (typeof icon === 'function' ? icon('chevronLeft', 14) : '') + ' Queue</button>' +
    '<div class="qa-det-title">' + esc(r.name || '(unnamed)') + '</div>' +
    qaStatusPillHtml_(r.status) +
    qaAssigneePillHtml_(r, d.self) +
    '<div class="spacer" style="flex:1"></div>' +
    statusBtns;
}

function qaChangeStatus_(st) {
  const r = QA_STATE.det;
  if (!r) return;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { showToast((res && res.error) || 'Status change failed.', 'toast-error'); return; }

      qaRenderDetailHead_();

    .qaSetRecordingStatus(r.fileId, st);
}

function qaSetLoadNote_(msg) {
  const el = document.getElementById('qa-load-note');
  if (el) el.textContent = msg;
}

function qaLoadAudio_(rec) {
  const mySeq = ++QA_STATE.audioSeq;
  const parts = [];
  function fail(msg, oversize) {
    if (QA_STATE.audioSeq !== mySeq) return;
    const slot = document.getElementById('qa-audio-slot');
    if (!slot) return;
    let html = errorStateHtml_(msg || 'Could not load the audio.');
    if (rec.url) {
      html += '<div class="qa-note"><a href="' + esc(rec.url) + '" target="_blank" rel="noopener">Open in Drive ↗</a>' +
        (oversize ? ' — Drive streams it without the in-app cap.' : '') + '</div>';
    }
    slot.innerHTML = html;
  }
  function fetchChunk(i) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (QA_STATE.audioSeq !== mySeq) return;   // stale — another recording opened (INV-156)
        if (!r || r.error || !r.success) { fail(r && r.error, r && r.oversize); return; }
        parts[r.chunkIndex] = r.b64;
        qaSetLoadNote_('Loading audio — part ' + Math.min(i + 1, r.chunks) + ' of ' + r.chunks + '…');
        if (i + 1 < r.chunks) fetchChunk(i + 1);
        else qaAssembleAudio_(parts, r.mime, mySeq);
      })
      .withFailureHandler(function (err) { fail('Could not load the audio: ' + (err && err.message)); })
      .qaGetAudioChunk(rec.fileId, i);
  }
  fetchChunk(0);
}

function qaAssembleAudio_(parts, mime, mySeq) {
  try {
    const bins = parts.map(function (b64) {
      const s = atob(b64 || '');
      const u = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
      return u;
    });
    const blob = new Blob(bins, { type: mime || 'audio/mpeg' });
    if (QA_STATE.audioSeq !== mySeq) return;
    if (QA_STATE.objectUrl) { try { URL.revokeObjectURL(QA_STATE.objectUrl); } catch (e) {} }
    QA_STATE.objectUrl = URL.createObjectURL(blob);
    const slot = document.getElementById('qa-audio-slot');
    if (!slot) return;
    slot.innerHTML = '<audio id="qa-audio" controls preload="metadata" aria-label="Call recording player"></audio>';
    const audio = document.getElementById('qa-audio');
    audio.src = QA_STATE.objectUrl;
    audio.playbackRate = QA_STATE.speed;
    audio.addEventListener('loadedmetadata', function () {
      QA_STATE.durationSec = isFinite(audio.duration) ? audio.duration : 0;
      qaRenderTimeline_();
    });
    audio.addEventListener('timeupdate', function () { qaTickPlayback_(audio); });
    qaRenderTransport_();
    // Phase 2 — waveform (decoration; every failure leaves the flat timeline).
    try {
      let total = 0;
      bins.forEach(function (u) { total += u.length; });
      if (total > 0 && total <= QA_WAVE_MAX_BYTES) {
        const all = new Uint8Array(total);
        let off = 0;
        bins.forEach(function (u) { all.set(u, off); off += u.length; });
        qaTryWaveform_(all, mySeq);
      }
    } catch (e) { /* decoration only */ }
  } catch (e) {
    const slot = document.getElementById('qa-audio-slot');
    if (slot && QA_STATE.audioSeq === mySeq) slot.innerHTML = errorStateHtml_('Could not decode the audio: ' + e.message);
  }
}

var QA_SPEEDS = [0.75, 1, 1.25, 1.5, 2];
function qaRenderTransport_() {
  const host = document.getElementById('qa-transport');
  if (!host) return;
  host.innerHTML =
    '<button type="button" class="qa-btn" onclick="qaSeekBy_(-5)" aria-label="Back 5 seconds">↺ 5s</button>' +
    '<button type="button" class="qa-btn" onclick="qaSeekBy_(5)" aria-label="Forward 5 seconds">5s ↻</button>' +
    QA_SPEEDS.map(function (s) {
      return '<button type="button" class="qa-chip qa-speed" aria-pressed="' + (QA_STATE.speed === s ? 'true' : 'false') +
        '" onclick="qaSetSpeed_(' + s + ')">' + s + '×</button>';
    }).join('') +
    '<span class="qa-kbd-hint">space · ← →</span>';
}
function qaSetSpeed_(s) {
  QA_STATE.speed = s;
  const audio = document.getElementById('qa-audio');
  if (audio) audio.playbackRate = s;
  qaRenderTransport_();   // aria-pressed stays in step (A11)
}
function qaSeekBy_(delta) {
  const audio = document.getElementById('qa-audio');
  if (!audio || !isFinite(audio.duration)) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + delta));
}
function qaSeekTo_(sec) {
  const audio = document.getElementById('qa-audio');
  if (!audio) return;
  audio.currentTime = Math.max(0, Number(sec) || 0);
  if (audio.paused) { try { audio.play(); } catch (e) {} }
}

function qaTickPlayback_(audio) {
  const btn = document.getElementById('qa-comment-btn');
  if (btn) btn.textContent = 'Comment at ' + qaFmtClock_(audio.currentTime);
  const cur = document.getElementById('qa-tl-cursor');
  if (cur && QA_STATE.durationSec > 0) cur.style.left = qaMarkerPct_(audio.currentTime, QA_STATE.durationSec) + '%';
  if (QA_STATE.peaks && QA_STATE.durationSec > 0) {
    qaDrawWave_(audio.currentTime / QA_STATE.durationSec);
  }
}

// ── Phase 2: waveform ──────────────────────────────────────────────────────
var QA_WAVE_MAX_BYTES = 26214400;   // 25 MB decode-cost gate (PCM is many × the file size)
var QA_WAVE_BUCKETS = 240;

/** PURE (Node-pinned): normalized 0..1 peak per bucket over an array-like of
 *  PCM samples (Float32Array in the browser; plain arrays in tests). Empty
 *  input / no buckets → []. Peaks normalize to the loudest bucket so a quiet
 *  recording still shows its shape. */
function qaPeaks_(samples, buckets) {
  const n = samples ? samples.length : 0;
  const want = Math.floor(Number(buckets) || 0);
  if (!n || want < 1) return [];
  const out = [];
  const per = n / want;
  let max = 0;
  for (let b = 0; b < want; b++) {
    const s = Math.floor(b * per);
    const e = Math.min(n, Math.max(s + 1, Math.floor((b + 1) * per)));
    let peak = 0;
    for (let i = s; i < e; i++) {
      const v = samples[i] < 0 ? -samples[i] : samples[i];
      if (v > peak) peak = v;
    }
    out.push(peak);
    if (peak > max) max = peak;
  }
  if (max > 0) for (let b = 0; b < out.length; b++) out[b] = Math.round((out[b] / max) * 1000) / 1000;
  return out;
}

/** Decode a LOW-RATE mono copy for the waveform — decoration, never the
 *  playback path: every failure (no OfflineAudioContext, decode error, the
 *  size gate) silently leaves the flat timeline exactly as Phase 1 shipped
 *  it. The decode runs at 8 kHz MONO via OfflineAudioContext — a 40-minute
 *  call costs ~tens of MB transiently, where a naive 44.1 kHz stereo
 *  AudioContext decode would be hundreds — and the decoded PCM is dropped
 *  the moment the peaks are extracted. */
function qaTryWaveform_(bytes, mySeq) {
  try {
    if (!bytes || !bytes.length || bytes.length > QA_WAVE_MAX_BYTES) return;
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return;
    const ctx = new OAC(1, 8000, 8000);
    // decodeAudioData DETACHES its input buffer — hand it a copy so the
    // already-mounted Blob playback is untouched.
    const copy = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
    ctx.decodeAudioData(copy, function (decoded) {
      try {
        if (QA_STATE.audioSeq !== mySeq) return;   // another recording opened (INV-156)
        QA_STATE.peaks = qaPeaks_(decoded.getChannelData(0), QA_WAVE_BUCKETS);
        decoded = null;   // free the PCM as soon as the peaks exist
        const wave = document.getElementById('qa-wave');
        if (wave && QA_STATE.peaks.length) { wave.hidden = false; qaDrawWave_(0); }
      } catch (e) { /* decoration only */ }
    }, function () { /* undecodable for the waveform — playback is unaffected */ });
  } catch (e) { /* decoration only */ }
}

function qaDrawWave_(playedFrac) {
  qaDrawWaveOn_(document.getElementById('qa-wave'), QA_STATE.peaks, playedFrac);
}

// Shared painter (follow-on 2026-08-28) — the detail's #qa-wave and the
// My Reviews per-card canvases render through this ONE body, so the two
// waveforms cannot drift (the qaScorecardListHtml_ discipline).
function qaDrawWaveOn_(wave, peaks, playedFrac) {
  if (!wave || !peaks || !peaks.length) return;
  try {
    if (wave.clientWidth > 0 && wave.width !== wave.clientWidth) wave.width = wave.clientWidth;
    const g = wave.getContext('2d');
    if (!g) return;
    const W = wave.width, H = wave.height;
    const cs = getComputedStyle(document.documentElement);
    const accent = (cs.getPropertyValue('--accent') || '').trim() || '#0b6e40';
    const muted = (cs.getPropertyValue('--muted-3') || '').trim() || '#9aa3b2';
    g.clearRect(0, 0, W, H);
    const frac = Math.max(0, Math.min(1, Number(playedFrac) || 0));
    const barW = W / peaks.length;
    for (let i = 0; i < peaks.length; i++) {
      const h = Math.max(2, peaks[i] * H * 0.9);
      g.fillStyle = ((i + 1) / peaks.length <= frac) ? accent : muted;
      g.fillRect(i * barW, (H - h) / 2, Math.max(1, barW - 1), h);
    }
  } catch (e) { /* decoration only */ }
}

function qaWaveSeek_(ev) {
  const wave = document.getElementById('qa-wave');
  const audio = document.getElementById('qa-audio');
  if (!wave || !audio || !isFinite(audio.duration) || !audio.duration) return;
  const rect = wave.getBoundingClientRect();
  if (!rect.width) return;
  const frac = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
  qaSeekTo_(frac * audio.duration);
}

function qaRenderTimeline_() {
  const host = document.getElementById('qa-timeline');
  if (!host) return;
  const dur = QA_STATE.durationSec;
  let html = '<div class="qa-tl-cursor" id="qa-tl-cursor" style="left:0%"></div>';
  if (dur > 0) {
    html += QA_STATE.comments.map(function (c) {
      return '<button type="button" class="qa-tl-mark" style="left:' + qaMarkerPct_(c.atSec, dur) + '%"' +
        ' aria-label="Comment at ' + esc(qaFmtClock_(c.atSec)) + '" title="' + esc(qaFmtClock_(c.atSec) + ' · ' + c.name) + '"' +
        ' onclick="qaSeekTo_(' + Number(c.atSec) + ')"></button>';
    }).join('');
  }
  host.innerHTML = html;
}

function qaLoadComments_(fileId) {
  google.script.run
    .withSuccessHandler(function (r) {
      if (!QA_STATE.det || QA_STATE.det.fileId !== fileId) return;
      const host = document.getElementById('qa-comments');
      if (!host) return;
      if (!r || r.error) { host.innerHTML = errorStateHtml_((r && r.error) || 'Could not load comments.'); return; }
      QA_STATE.comments = r.comments || [];
      QA_STATE.canModerate = !!r.canModerate;
      qaRenderComments_();
      qaRenderTimeline_();
    })
    .withFailureHandler(function (err) {
      if (!QA_STATE.det || QA_STATE.det.fileId !== fileId) return;
      const host = document.getElementById('qa-comments');
      if (host) host.innerHTML = errorStateHtml_('Could not load comments: ' + (err && err.message));
    })
    .qaListComments(fileId);
}

function qaRenderComments_() {
  const host = document.getElementById('qa-comments');
  if (!host) return;
  if (!QA_STATE.comments.length) {
    host.innerHTML = '<div class="qa-empty">No comments yet — play the recording and comment at the moments worth flagging.</div>';
    return;
  }
  host.innerHTML = QA_STATE.comments.map(function (c) {
    const canDelete = c.mine || QA_STATE.canModerate;
    return '<div class="qa-comment-row">' +
      '<button type="button" class="qa-time-chip" onclick="qaSeekTo_(' + Number(c.atSec) + ')">' + esc(qaFmtClock_(c.atSec)) + '</button>' +
      '<div><div class="qa-comment-text">' + esc(c.text) + '</div>' +
        '<div class="qa-comment-by">' + esc(c.name) + '</div></div>' +
      (canDelete
        ? '<button type="button" class="qa-del-btn" aria-label="Remove comment" onclick="qaDeleteComment_(\'' + esc(c.commentId) + '\')">×</button>'
        : '<span></span>') +
      '</div>';
  }).join('');
}

function qaSubmitComment_() {
  const r = QA_STATE.det;
  const ta = document.getElementById('qa-comment-text');
  if (!r || !ta) return;
  const text = String(ta.value || '').trim();
  if (!text) { showToast('Write a comment first.', 'toast-warn'); return; }
  const audio = document.getElementById('qa-audio');
  const atSec = audio ? (audio.currentTime || 0) : 0;
  const btn = document.getElementById('qa-comment-btn');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) btn.disabled = false;
      if (!res || !res.success) { showToast((res && res.error) || 'Comment failed.', 'toast-error'); return; }
      ta.value = '';
      if (QA_STATE.det && QA_STATE.det.fileId === r.fileId) qaLoadComments_(r.fileId);
    })
    .withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      showToast('Comment failed: ' + (err && err.message), 'toast-error');
    })
    .qaAddComment(r.fileId, atSec, text);
}

function qaDeleteComment_(commentId) {
  const r = QA_STATE.det;
  if (!r) return;
  uiConfirm({ title: 'Remove comment', message: 'Remove this comment?', tone: 'danger', confirmLabel: 'Remove' })
    .then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) { showToast((res && res.error) || 'Remove failed.', 'toast-error'); return; }
          if (QA_STATE.det && QA_STATE.det.fileId === r.fileId) qaLoadComments_(r.fileId);
        })
        .withFailureHandler(function (err) { showToast('Remove failed: ' + (err && err.message), 'toast-error'); })
        .qaDeleteComment(commentId);
    });
}

// ── Phase 2: scorecards ────────────────────────────────────────────────────

function qaLoadScorecards_(fileId) {
  google.script.run
    .withSuccessHandler(function (r) {
      if (!QA_STATE.det || QA_STATE.det.fileId !== fileId) return;
      const host = document.getElementById('qa-score-form');
      if (!host) return;
      if (!r || r.error) { host.innerHTML = errorStateHtml_((r && r.error) || 'Could not load scorecards.'); return; }
      QA_STATE.criteria = r.criteria || [];
      QA_STATE.scorecards = r.scorecards || [];
      QA_STATE.selfEmpId = r.selfEmpId || '';
      // Seed the form from MY latest card, so a re-score ADJUSTS rather than
      // restarts (latest-per-reviewer wins server-side).
      QA_STATE.ratings = {};
      QA_STATE.scoreNotes = '';
      for (let i = 0; i < QA_STATE.scorecards.length; i++) {
        const c = QA_STATE.scorecards[i];
        if (String(c.empId) !== String(QA_STATE.selfEmpId)) continue;
        Object.keys(c.ratings || {}).forEach(function (k) {
          const v = Number(c.ratings[k]);
          if (v >= 1 && v <= 5) QA_STATE.ratings[k] = v;
        });
        QA_STATE.scoreNotes = c.notes || '';
        break;   // newest-first — the first of mine is my latest
      }
      qaRenderScoreForm_();
      qaRenderScorecardList_();
    })
    .withFailureHandler(function (err) {
      if (!QA_STATE.det || QA_STATE.det.fileId !== fileId) return;
      const host = document.getElementById('qa-score-form');
      if (host) host.innerHTML = errorStateHtml_('Could not load scorecards: ' + (err && err.message));
    })
    .qaListScorecards(fileId);
}

function qaRenderScoreForm_() {
  const host = document.getElementById('qa-score-form');
  if (!host) return;
  const crit = QA_STATE.criteria || [];
  if (!crit.length) { host.innerHTML = ''; return; }
  host.innerHTML = crit.map(function (c) {
    const cur = QA_STATE.ratings[c.key];
    return '<div class="qa-score-row"><span>' + esc(c.label) + '</span>' +
      '<div class="qa-rate-btns" role="group" aria-label="' + esc(c.label) + ' rating">' +
      [1, 2, 3, 4, 5].map(function (v) {
        return '<button type="button" class="qa-rate-btn" aria-pressed="' + (cur === v ? 'true' : 'false') +
          '" aria-label="' + esc(c.label) + ': ' + v + ' of 5" onclick="qaSetRating_(\'' + esc(c.key) + '\', ' + v + ')">' + v + '</button>';
      }).join('') + '</div></div>';
  }).join('') +
  '<textarea class="qa-score-notes" id="qa-score-notes" aria-label="Scorecard notes" placeholder="Notes (optional)">' + esc(QA_STATE.scoreNotes || '') + '</textarea>' +
  '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">' +
    '<button type="button" class="qa-btn prime" id="qa-score-save" onclick="qaSubmitScorecard_()">Save scorecard</button>' +
    '<span class="qa-note" style="margin:0">Re-saving replaces your previous score for this recording.</span>' +
  '</div>';
}

function qaSetRating_(key, v) {
  // Clicking the SELECTED rating unselects it (the intake accidental-click
  // recovery pattern).
  if (QA_STATE.ratings[key] === v) delete QA_STATE.ratings[key];
  else QA_STATE.ratings[key] = v;
  const ta = document.getElementById('qa-score-notes');
  if (ta) QA_STATE.scoreNotes = ta.value;   // typed notes survive the re-render
  qaRenderScoreForm_();
}

function qaSubmitScorecard_() {
  const r = QA_STATE.det;
  if (!r) return;
  if (!Object.keys(QA_STATE.ratings).length) { showToast('Rate at least one criterion.', 'toast-warn'); return; }
  const ta = document.getElementById('qa-score-notes');
  const notes = ta ? String(ta.value || '').trim() : '';
  const btn = document.getElementById('qa-score-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) { btn.disabled = false; btn.textContent = 'Save scorecard'; }
      if (!res || !res.success) { showToast((res && res.error) || 'Save failed.', 'toast-error'); return; }
      showToast('Scorecard saved', 'toast-success');
      if (QA_STATE.det && QA_STATE.det.fileId === r.fileId) qaLoadScorecards_(r.fileId);
    })
    .withFailureHandler(function (err) {
      if (btn) { btn.disabled = false; btn.textContent = 'Save scorecard'; }
      showToast('Save failed: ' + (err && err.message), 'toast-error');
    })
    .qaSaveScorecard(r.fileId, QA_STATE.ratings, notes);
}

function qaCardAvg_(ratings) {
  let sum = 0, n = 0;
  Object.keys(ratings || {}).forEach(function (k) {
    const v = Number(ratings[k]);
    if (v >= 1 && v <= 5) { sum += v; n++; }
  });
  return n ? Math.round((sum / n) * 10) / 10 : null;
}

/** Shared scorecard-list markup — the detail's list AND the agent-facing My
 *  Reviews render through this ONE builder, so the two surfaces cannot drift
 *  (every string esc()'d). */
function qaScorecardListHtml_(cards, criteria) {
  const critLabel = {};
  (criteria || []).forEach(function (c) { critLabel[c.key] = c.label; });
  return (cards || []).map(function (c) {
    const avg = qaCardAvg_(c.ratings);
    return '<div class="qa-sc-item">' +
      '<div class="qa-sc-meta"><strong>' + esc(c.name || '') + '</strong>' +
        (avg != null ? '<span>avg ' + esc(String(avg)) + '/5</span>' : '') +
        '<span>' + esc(qaFmtDate_(c.createdMs)) + '</span></div>' +
      '<div class="qa-sc-meta" style="margin-top:4px">' +
        Object.keys(c.ratings || {}).map(function (k) {
          return '<span class="qa-sc-chip">' + esc(critLabel[k] || k) + ' ' + esc(String(c.ratings[k])) + '</span>';
        }).join('') + '</div>' +
      (c.notes ? '<div style="margin-top:4px">' + esc(c.notes) + '</div>' : '') +
      '</div>';
  }).join('');
}
function qaRenderScorecardList_() {
  const host = document.getElementById('qa-scorecards');
  if (!host) return;
  host.innerHTML = (QA_STATE.scorecards || []).length
    ? qaScorecardListHtml_(QA_STATE.scorecards, QA_STATE.criteria) : '';
}

// ── Phase 2: per-agent stats tab ───────────────────────────────────────────

function enterQaStatsView() {
  if (typeof stopClock === 'function') stopClock();
  if (typeof cnStopAmbientPolling_ === 'function') cnStopAmbientPolling_();
  QA_STATE.det = null;
  qaReleaseAudio_();
  const area = document.getElementById('view-area');
  renderLoading(area, 'Loading QA stats…', 'chart');
  const requestedView = currentView;
  const mySeq = ++QA_STATE.statsSeq;
  google.script.run
    .withSuccessHandler(function (data) {
      if (currentView !== requestedView || QA_STATE.statsSeq !== mySeq) return;
      if (!data || data.error) {
        area.innerHTML = errorStateHtml_((data && data.error) || 'Could not load QA stats.');
        return;
      }
      qaRenderStats_(data);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView || QA_STATE.statsSeq !== mySeq) return;
      area.innerHTML = errorStateHtml_('Could not load QA stats: ' + (err && err.message));
    })
    .getQaStats();
}

function qaRenderStats_(d) {
  const area = document.getElementById('view-area');
  let html = '';
  if (!COMPACT_MODE) html += '<div class="view-title-row"><h1>QA · Stats</h1></div>';
  if (d.notConfigured) {
    area.innerHTML = html + '<div class="qa-empty">QA is not set up yet — see the Recordings tab.</div>';
    return;
  }
  const agents = d.agents || [];
  html += '<div class="qa-stats-strip">' +
    '<span><strong>' + (Number(d.totalRecordings) || 0) + '</strong> recording(s)</span>' +
    '<span><strong>' + (Number(d.totalScorecards) || 0) + '</strong> scorecard(s)</span>' +
    '<span><strong>' + agents.filter(function (a) { return a.agent !== '(unassigned)'; }).length + '</strong> agent(s)</span>' +
    '</div>';
  // Columns: the fixed set + one per LIVE criterion. A missing average is an
  // em dash, never a confident 0 (INV-187).
  const cols = [
    { key: 'agent',      label: 'Agent',      name: true,    cell: function (r) { return esc(r.agent); } },
    { key: 'recordings', label: 'Recordings', numeric: true, cell: function (r) { return String(Number(r.recordings) || 0); } },
    { key: 'reviewed',   label: 'Reviewed',   numeric: true, cell: function (r) { return String(Number(r.reviewed) || 0); } },
    { key: 'scorecards', label: 'Scorecards', numeric: true, cell: function (r) { return String(Number(r.scorecards) || 0); } },
    { key: 'avgScore',   label: 'Avg /5',     numeric: true, cell: function (r) { return r.avgScore == null ? '—' : esc(String(r.avgScore)); } },
  ].concat((d.criteria || []).map(function (c) {
    return { key: 'pc-' + c.key, label: c.label, numeric: true, cell: function (r) {
      const v = (r.perCriterion || {})[c.key];
      return v == null ? '—' : esc(String(v));
    } };
  }));
  html += agents.length
    ? '<div class="m-table-wrap">' + mtRenderTable_({ columns: cols, rows: agents }) + '</div>'
    : '<div class="qa-empty">No recordings indexed yet — stats appear once recordings are synced and attributed to agents.</div>';
  // Phase 3 — calibration: recordings scored by 2+ reviewers, widest spread
  // first. FACTS ONLY (the Coverage rule): the table reports the disagreement,
  // never a verdict on which reviewer is right.
  const cal = d.calibration || [];
  if (cal.length) {
    const critLabel = {};
    (d.criteria || []).forEach(function (c) { critLabel[c.key] = c.label; });
    html += '<h2 class="card-label" style="margin-top:18px">Calibration · scored by 2+ reviewers</h2>' +
      '<div class="m-table-wrap">' + mtRenderTable_({
        columns: [
          { key: 'name',    label: 'Recording', name: true, cell: function (r) { return esc(r.name || r.fileId); } },
          { key: 'revs',    label: 'Reviewer averages', cell: function (r) {
              return (r.reviewers || []).map(function (rv) {
                return esc(rv.name) + ' <strong>' + esc(String(rv.avg)) + '</strong>';
              }).join(' · ');
            } },
          { key: 'spread',  label: 'Spread', numeric: true, cell: function (r) { return esc(String(r.spread)); } },
          { key: 'maxCrit', label: 'Widest gap', cell: function (r) {
              return r.maxCritKey
                ? esc(critLabel[r.maxCritKey] || r.maxCritKey) + ' (' + esc(String(r.maxCritSpread)) + ')'
                : '—';
            } },
        ],
        rows: cal,
      }) + '</div>' +
      '<div class="qa-note">Spread = the gap between the highest and lowest reviewer average on the same recording. A wide spread means reviewers read the call differently — worth a calibration conversation, not a verdict on who is right.</div>';
  }
  if (d.truncated) html += '<div class="qa-note">Scan capped — the oldest rows beyond the bounded tail are not counted.</div>';
  html += '<div class="qa-note">Attribute a recording to its agent in the recording detail (the Agent field). Scores use the latest scorecard per reviewer per recording.</div>';
  area.innerHTML = html;
}

// ===== My Reviews (Phase 3 — the agent-facing, read-only tab) =====
// Employee-gated server-side (getMyQaReviews); scoped to recordings
// attributed to the caller's name AND explicitly shared. No audio here —
// playback stays behind the canSeeQa_ Drive boundary (a follow-on).

function enterQaMyReviewsView() {
  if (typeof stopClock === 'function') stopClock();
  if (typeof cnStopAmbientPolling_ === 'function') cnStopAmbientPolling_();
  QA_STATE.det = null;
  qaReleaseAudio_();
  QA_STATE.myRevAudioSeq++;   // orphan any in-flight shared-review load
  if (QA_STATE.myRevObjectUrl) { try { URL.revokeObjectURL(QA_STATE.myRevObjectUrl); } catch (e) {} QA_STATE.myRevObjectUrl = null; }
  const area = document.getElementById('view-area');
  renderLoading(area, 'Loading your reviews…', 'thumbsUp');
  const requestedView = currentView;
  const mySeq = ++QA_STATE.myRevSeq;
  google.script.run
    .withSuccessHandler(function (data) {
      if (currentView !== requestedView || QA_STATE.myRevSeq !== mySeq) return;
      if (!data || data.error) {
        area.innerHTML = errorStateHtml_((data && data.error) || 'Could not load your reviews.');
        return;
      }
      qaRenderMyReviews_(data);
    })
    .withFailureHandler(function (err) {
      if (currentView !== requestedView || QA_STATE.myRevSeq !== mySeq) return;
      area.innerHTML = errorStateHtml_('Could not load your reviews: ' + (err && err.message));
    })
    .getMyQaReviews();
}

function qaRenderMyReviews_(d) {
  const area = document.getElementById('view-area');
  let html = '';
  if (!COMPACT_MODE) html += '<div class="view-title-row"><h1>My Reviews</h1></div>';
  const recs = d.recordings || [];
  if (!recs.length) {
    area.innerHTML = html + '<div class="qa-empty">No reviews have been shared with you yet. When a reviewer shares a call review, it appears here.</div>';
    return;
  }
  recs.forEach(function (r) {
    const when = r.createdMs ? new Date(r.createdMs).toLocaleDateString() : '';
    const shared = r.sharedMs ? new Date(r.sharedMs).toLocaleDateString() : '';
    html += '<div class="qa-myrev-card">' +
      '<div class="qa-myrev-head">' +
        '<span class="qa-myrev-name">' + esc(r.name || r.fileId) + '</span>' +
        '<span class="qa-note" style="margin:0">' + (when ? 'call ' + esc(when) + ' · ' : '') + 'shared ' + esc(shared) + '</span>' +
      '</div>' +
      // Follow-on (2026-08-28): playback of the SHARED recording through the
      // SCOPED endpoint (getMyQaReviewAudioChunk — never the reviewer-gated
      // qaGetAudioChunk). fileId is Drive-shaped ([A-Za-z0-9_-]); esc is
      // defensive.
      '<div class="qa-myrev-audio" id="qa-mra-' + esc(r.fileId) + '" style="margin:4px 0 8px">' +
        '<button type="button" class="qa-btn" onclick="qaMyRevPlay_(\'' + esc(r.fileId) + '\')">' + icon('headset', 14) + ' Play recording</button>' +
      '</div>' +
      ((r.scorecards || []).length
        ? qaScorecardListHtml_(r.scorecards, d.criteria)
        : '<div class="qa-note">No scorecard yet.</div>');
    const comments = r.comments || [];
    if (comments.length) {
      html += '<h2 class="card-label" style="margin:10px 0 4px">Reviewer comments</h2>';
      comments.forEach(function (c) {
        html += '<div class="qa-sc-item">' +
          '<span class="qa-sc-chip">' + esc(qaFmtClock_(c.atSec)) + '</span> ' +
          esc(c.text) + (c.name ? ' <span class="qa-note" style="margin:0">— ' + esc(c.name) + '</span>' : '') +
          '</div>';
      });
    }
    html += '</div>';
  });
  html += '<div class="qa-note">Read-only — talk to your manager about anything here. Timestamps refer to positions in the call recording.</div>';
  area.innerHTML = html;
}

// Follow-on (2026-08-28) — per-card playback of a SHARED review. One active
// load at a time: a second Play (or a nav re-enter) bumps myRevAudioSeq and
// orphans the first (INV-156); the replaced Blob URL is revoked. Failures
// render the error card WITHOUT a Drive link — the agent has no Drive access
// to the deployer's recordings folder, so offering one would be a dead link.
function qaMyRevPlay_(fileId) {
  const mySeq = ++QA_STATE.myRevAudioSeq;
  const slot = document.getElementById('qa-mra-' + fileId);
  if (!slot) return;
  slot.innerHTML = '<div class="qa-note" style="margin:0">Loading audio…</div>';
  const parts = [];
  function fail(msg) {
    if (QA_STATE.myRevAudioSeq !== mySeq) return;
    const el = document.getElementById('qa-mra-' + fileId);
    if (el) el.innerHTML = errorStateHtml_(msg || 'Could not load the audio.');
  }
  function fetchChunk(i) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (QA_STATE.myRevAudioSeq !== mySeq) return;   // stale — another card played (INV-156)
        if (!r || r.error || !r.success) { fail(r && r.error); return; }
        parts[r.chunkIndex] = r.b64;
        if (i + 1 < r.chunks) {
          const el = document.getElementById('qa-mra-' + fileId);
          if (el) el.innerHTML = '<div class="qa-note" style="margin:0">Loading audio — part ' + Math.min(i + 2, r.chunks) + ' of ' + r.chunks + '…</div>';
          fetchChunk(i + 1);
          return;
        }
        try {
          const bins = parts.map(function (b64) {
            const s = atob(b64 || '');
            const u = new Uint8Array(s.length);
            for (let k = 0; k < s.length; k++) u[k] = s.charCodeAt(k);
            return u;
          });
          const blob = new Blob(bins, { type: r.mime || 'audio/mpeg' });
          if (QA_STATE.myRevAudioSeq !== mySeq) return;
          if (QA_STATE.myRevObjectUrl) { try { URL.revokeObjectURL(QA_STATE.myRevObjectUrl); } catch (e) {} }
          QA_STATE.myRevObjectUrl = URL.createObjectURL(blob);
          const el = document.getElementById('qa-mra-' + fileId);
          if (!el) return;
          el.innerHTML = '<audio controls preload="metadata" aria-label="Shared call recording player" style="width:100%;max-width:520px"></audio>';
          el.querySelector('audio').src = QA_STATE.myRevObjectUrl;
          // Follow-on (2026-08-28): the detail's Phase-2 waveform chrome on
          // the agent player — strictly DECORATION (size gate; every failure
          // leaves the plain audio element), with click-to-seek and a
          // played-portion tint driven by this card's own audio element.
          try { qaMyRevWave_(el, bins, mySeq); } catch (e) { /* decoration only */ }
        } catch (e) { fail('Could not decode the audio: ' + e.message); }
      })
      .withFailureHandler(function (err) { fail('Could not load the audio: ' + (err && err.message)); })
      .getMyQaReviewAudioChunk(fileId, i);
  }
  fetchChunk(0);
}

// Waveform + click-to-seek for a My Reviews card (follow-on 2026-08-28) —
// the low-rate decode the detail uses, painted through the SHARED
// qaDrawWaveOn_. Decoration throughout: the size gate, an undecodable
// format, or any throw leaves the plain audio element working.
function qaMyRevWave_(cardEl, bins, mySeq) {
  let total = 0;
  bins.forEach(function (u) { total += u.length; });
  if (!(total > 0 && total <= QA_WAVE_MAX_BYTES)) return;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC) return;
  const all = new Uint8Array(total);
  let off = 0;
  bins.forEach(function (u) { all.set(u, off); off += u.length; });
  const ctx = new OAC(1, 8000, 8000);
  ctx.decodeAudioData(all.buffer, function (decoded) {
    try {
      if (QA_STATE.myRevAudioSeq !== mySeq) return;   // another card played (INV-156)
      const peaks = qaPeaks_(decoded.getChannelData(0), QA_WAVE_BUCKETS);
      decoded = null;   // free the PCM once the peaks exist
      const audio = cardEl.querySelector('audio');
      if (!audio || !peaks.length) return;
      const wave = document.createElement('canvas');
      wave.className = 'qa-wave';
      wave.height = 64;
      wave.setAttribute('aria-hidden', 'true');   // decoration — the audio element is the control
      cardEl.insertBefore(wave, audio);
      qaDrawWaveOn_(wave, peaks, 0);
      wave.addEventListener('click', function (ev) {
        try {
          const rect = wave.getBoundingClientRect();
          if (!(rect.width > 0) || !isFinite(audio.duration) || !(audio.duration > 0)) return;
          audio.currentTime = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width)) * audio.duration;
        } catch (e) { /* decoration only */ }
      });
      audio.addEventListener('timeupdate', function () {
        try {
          if (isFinite(audio.duration) && audio.duration > 0) {
            qaDrawWaveOn_(wave, peaks, audio.currentTime / audio.duration);
          }
        } catch (e) { /* decoration only */ }
      });
    } catch (e) { /* decoration only */ }
  }, function () { /* undecodable for the waveform — playback is unaffected */ });
}

// Keyboard shortcuts — active only in the open detail, never while typing
// (the isContentEditable + tagName guard the shell's ? handler documents).
var _qaKeysBound = false;
function qaEnsureKeysBound_() {
  if (_qaKeysBound) return;
  _qaKeysBound = true;
  document.addEventListener('keydown', function (e) {
    if (currentView !== 'qaQueue' || !QA_STATE.det) return;
    const ae = document.activeElement;
    if (ae && (ae.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(ae.tagName) >= 0)) return;
    const audio = document.getElementById('qa-audio');
    if (!audio) return;
    if (e.key === ' ') {
      e.preventDefault();
      if (audio.paused) { try { audio.play(); } catch (err) {} } else audio.pause();
    } else if (e.key === 'ArrowLeft') { e.preventDefault(); qaSeekBy_(-5); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); qaSeekBy_(5); }
  });
}
