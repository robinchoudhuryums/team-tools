  <?!= include('styles') ?>
  <?!= include('styles_handbook') ?>
  <script>
    // The link's section (?s=6.9.3) — the page cannot read its own address
    // inside HtmlService (g107), so doGet hands it over. `<` is escaped so a
    // value can never close this block (the same discipline as Team Tools).
    window.HB_PARAMS = <?!= JSON.stringify(hbParams || {}).replace(/</g, '\\u003c') ?>;
    // Dark mode follows the device, before first paint (the tokens partial
    // keys its dark palette on data-mode).
    try { if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-mode', 'dark'); } catch (e) {}
  </script>
</head>
<body>
  <a class="hb-skip" href="#kb-main" onclick="document.getElementById('kb-main').focus(); return false;">Skip to the handbook</a>
  <header class="hb-head">
    <button type="button" class="hb-menu" id="hb-menu" aria-controls="hb-side" aria-expanded="false" onclick="hbToggleSide_()">Contents</button>
    <a class="hb-brand" href="#" onclick="hbGoHome_(); return false;">UMS Handbook</a>
    <span class="hb-ver" id="hb-ver"></span>
    <input type="search" class="hb-q" id="hb-q" placeholder="Search the handbook" aria-label="Search the handbook" autocomplete="off"
      oninput="hbSearchInput_(this.value)" onkeydown="hbSearchKey_(event)">
    <label class="hb-dept">My department
      <select id="hb-dept-sel" onchange="hbSetDept_(this.value)"><option value="">Not chosen</option></select>
    </label>
  </header>
  <div class="hb-wrap">
    <nav class="hb-side" id="hb-side" aria-label="Contents"><div id="hb-toc" class="hb-toc"></div></nav>
    <main class="kb-main" id="kb-main" tabindex="-1" aria-live="polite"></main>
  </div>
  <!-- showToast writes here; without it every toast is silently dropped. -->
  <div class="toast-stack" id="toast-stack" role="region" aria-live="polite" aria-label="Notifications"></div>
