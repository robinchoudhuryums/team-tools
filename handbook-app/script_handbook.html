<script>
// ════════════════════════════════════════════════════════════════════════════
//  THE HANDBOOK APP'S PAGE (HB1.3, operator 2026-10-28)
//  The frame around the shared reader: the header, the contents, the home page
//  with the reader's department first and what changed since their last visit,
//  the chapters kept in the browser, and section links with a working Back.
//  The reader itself is Team Tools' shared partial (copied by the sync); this
//  file is its HOST — it installs the 18 MANUAL_HOST hooks — and declares the
//  page-shell names the sync's copy must NOT bring (errBeaconSend_: Team Tools'
//  beacon writes to its ClientErrors tab, and this app writes nothing).
// ════════════════════════════════════════════════════════════════════════════

/** The host's state — the four fields the reader reads through state(). */
var HB = { tree: [], isAdmin: false, currentId: null, landing: true };
var HB_SEARCH = { seq: 0, q: '', timer: null, showing: false };   // HB1.4: the search view's own state
var HB_SEARCH_MIN = 2, HB_SEARCH_DEBOUNCE_MS = 300;
// HB2.1: who is reading (hbGetMe's answer — undefined while it loads), the
// people view's state, and the newest answer applied (an older one never
// overwrites a newer — every action answers with the caller's whole view).
var HB_ME = undefined;
var HB_PP = { showing: false, dirty: false, sent: 0, applied: 0 };
var HB_LS_DEPT = 'umsHbDept';      // the reader's chosen department (a chapter)
var HB_LS_VISIT = 'umsHbVisit';    // { last, prev } — local dates, for "since your last visit"
var HB_LS_PREFS = 'umsHbReader';   // the reader's own prefs (resume, card state)
var HB_NEWS_FIRST_DAYS = 30;       // a first visit shows the last month's changes
var HB_NEWS_MAX = 12;
var HB_KEPT = { db: 'umsHandbook', store: 'kept', key: 'parts' };

/** No beacon here: Team Tools' writes to its own ClientErrors tab, and the
 *  handbook app writes nothing. A failure still reaches the browser console. */
function errBeaconSend_(message) { try { console.warn('[handbook] ' + message); } catch (e) {} }

function hbLs_(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function hbLsSet_(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function hbLsJson_(k) { try { return JSON.parse(hbLs_(k) || 'null'); } catch (e) { return null; } }

/** PURE — a Date as its local calendar day, YYYY-MM-DD. */
function hbIsoDay_(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
/** PURE — the visit record after a visit on `today`: the day only moves on a NEW
 *  day, so reloading the same day keeps "since your last visit" where it was.
 *  Returns { rec, since } — since is the previous visit's day, or '' for a first. */
function hbVisitStep_(rec, today) {
  rec = rec && typeof rec === 'object' ? rec : {};
  var last = /^\d{4}-\d{2}-\d{2}$/.test(rec.last || '') ? rec.last : '';
  var prev = /^\d{4}-\d{2}-\d{2}$/.test(rec.prev || '') ? rec.prev : '';
  if (last !== today) { prev = last; last = today; }
  return { rec: { last: last, prev: prev }, since: prev };
}
/** PURE — the changelog entries to show: published sections only (`visible`),
 *  dated AFTER `since` (or within `firstDays` of `today` for a first visit),
 *  newest first, a day's entries in the changelog's order, at most `max`.
 *  `total` is the uncapped count. A date that is not YYYY-MM-DD is dropped. */
function hbNews_(changelog, visible, since, today, firstDays, max) {
  var floor = since;
  if (!floor) {
    var t = new Date(today + 'T12:00:00');
    t.setDate(t.getDate() - firstDays);
    floor = hbIsoDay_(t);
  }
  var out = [];
  (Array.isArray(changelog) ? changelog : []).forEach(function (c, i) {
    if (!c || typeof c !== 'object') return;
    var id = String(c.id || ''), date = String(c.date || '');
    if (!visible[id] || !/^\d{4}-\d{2}-\d{2}$/.test(date) || date <= floor) return;
    out.push({ i: i, id: id, date: date, num: String(c.num || ''), anchor: String(c.anchor || ''),
      summary: String(c.summary || ''), retraining: c.retraining === true });
  });
  out.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : a.i - b.i); });
  return { items: out.slice(0, max), total: out.length, floor: floor };
}
/** PURE — the host's tree from a getManualParts answer: one row per section,
 *  chapters in the reader's order (kbDeptCompare_), sections as served. */
function hbTreeOf_(res) {
  var parts = (res && Array.isArray(res.parts) ? res.parts : []).filter(function (p) { return p && p.department && Array.isArray(p.sections); });
  parts.sort(function (a, b) { return kbDeptCompare_(a.department, b.department); });
  var tree = [];
  parts.forEach(function (p) {
    p.sections.forEach(function (s) {
      tree.push({ id: s.id, title: String(s.title || ''), department: p.department, sortOrder: s.sortOrder || 0, status: s.status, type: 'article' });
    });
  });
  return tree;
}
/** PURE — the `s` a section link carries: the anchor when it is a number
 *  (6.9.3), else the section's own number (6.9), a card's "card N", or its id. */
function hbLinkOf_(id, anchor, tree) {
  if (/^(?:\d+|[A-C])\.[0-9A-Za-z.]+$/.test(anchor || '')) return anchor;
  var m = /^man-c-(\d+)$/.exec(id || '');
  if (m) return 'card ' + m[1];
  var it = (tree || []).filter(function (x) { return x.id === id; })[0];
  var num = it ? kbManualSplitTitle_(it.title).num : '';
  return num || id;
}
/** PURE — a link's `s` back to {id, anchor}: a section id as it is, else the
 *  reader's own number resolver (kbManualNumberTarget_); null when unknown. */
function hbTargetOf_(s, tree) {
  s = String(s || '').trim();
  if (!s) return null;
  if (kbIsManualId_(s)) return (tree || []).some(function (x) { return x.id === s; }) ? { id: s, anchor: '' } : null;
  var t = kbManualNumberTarget_(s, tree);
  return t ? { id: t.id, anchor: t.anchor || '' } : null;
}

// ── The host contract ─────────────────────────────────────────────────────
MANUAL_HOST.install({
  state: function () { return HB; },
  openItem: function (id, anchor, nav) { hbOpen_(id, anchor, nav, true); },
  prefs: function () { return hbLsJson_(HB_LS_PREFS) || {}; },
  savePrefs: function (p) { hbLsSet_(HB_LS_PREFS, JSON.stringify(p || {})); },
  markCurrent: function (id) { hbMarkCurrent_(id); },
  revealInTree: function (id) { hbRevealInToc_(id); },
  treeUpdated: function () { hbPaintTocNews_(); },
  printSection: function (id) { kbPrintSectionById_(id); },
  printAllCards: function () { kbPrintAllCards_(); },
  publishItem: function () {},                 // nobody is an admin here, and drafts are never served
  suggestEdit: function (btn) { kbSuggestEdit_(btn); },   // HB1.4: Reference's dialog, into the same feedback tab
  bookmarkBtnHtml: function (item, cls) { return hbBookmarkBtnHtml_(item, cls); },   // HB2.2: the reader's account
  bookmarkBtnPatch: function (btn, item) { hbBookmarkBtnPatch_(btn, item); },
  recordOpen: function () {},                  // the handbook app records nothing
  loadComments: function () {},                // comments are Team Tools'
  // There is no drawer: this page IS the reader, so a link opens here.
  drawerOpenItem: function (id, anchor, nav) { hbOpen_(id, anchor, nav, true); },
  drawerOpen: function () {},
  drawerTitle: function () { return ''; },
});

// ── Navigation ────────────────────────────────────────────────────────────
function hbMain_() { return document.getElementById('kb-main'); }

/** Open a section; `push` records it in the browser's history (a link and
 *  Back), a Back itself does not push again. */
function hbOpen_(id, anchor, nav, push) {
  hbCloseSide_();
  hbLeaveSearch_(); HB_PP.showing = false; hbLeaveQuiz_();
  if (!kbOpenManualSection_(id, anchor || '', nav)) { hbMsg_('That section is not in the handbook.', true); return; }
  hbMarkHomeBtn_(false);
  if (push) hbHistory_('push', { id: id, anchor: anchor || '' }, { s: hbLinkOf_(id, anchor, HB.tree) });
}
function hbGoHome_() { hbHome_(true); }
function hbHome_(push) {
  hbCloseSide_();
  hbLeaveSearch_(); HB_PP.showing = false; hbLeaveQuiz_();
  HB.currentId = null; HB.landing = true;
  MANUAL_STATE.manualSeq = (MANUAL_STATE.manualSeq || 0) + 1;   // a chapter still loading must not paint over home
  var main = hbMain_(); if (!main) return;
  main.innerHTML = hbHomeHtml_();
  main.scrollTop = 0;
  hbMarkCurrent_(null);
  hbMarkHomeBtn_(true);
  if (push) hbHistory_('push', { home: true }, {});
}
/** google.script.history — the TOP window's address and its Back button. A
 *  page served outside HtmlService has neither, and still works without them. */
function hbHistory_(op, state, params) {
  try { if (window.google && google.script && google.script.history) google.script.history[op](state, params); } catch (e) {}
}
function hbOnHistory_(e) {
  var st = e && e.state;
  if (st && st.search) { var box = document.getElementById('hb-q'); if (box) box.value = st.search; hbSearch_(st.search, false); }
  else if (st && st.people) hbPeople_(false);
  else if (st && st.quizzes) hbQuizList_(false);
  else if (st && st.quiz) hbTakeQuiz_(st.quiz, false);
  else if (st && st.training) hbTraining_(false);
  else if (st && st.saved) hbSaved_(false);
  else if (st && st.id) hbOpen_(st.id, st.anchor || '', null, false);
  else hbHome_(false);
}

// ── Search (HB1.4) ────────────────────────────────────────────────────────
// Team Tools' search, served by this app's copy of searchReference over the
// same index: a section number jumps (the reader's own resolver), anything
// else lists the matching sections. Each answer is for ITS request — a slower
// earlier one never paints over a later one, nor over a section opened since
// (g81) — and a failure says so, never "no matches" (g53).
function hbSearchInput_(v) {
  clearTimeout(HB_SEARCH.timer);
  var q = String(v || '').trim();
  if (q.length < HB_SEARCH_MIN) { if (HB_SEARCH.showing && !q) hbHome_(true); return; }
  HB_SEARCH.timer = setTimeout(function () { hbSearch_(q, true); }, HB_SEARCH_DEBOUNCE_MS);
}
function hbSearchKey_(e) {
  if (e.key === 'Enter') { e.preventDefault(); clearTimeout(HB_SEARCH.timer); var q = String(e.target.value || '').trim(); if (q.length >= HB_SEARCH_MIN) hbSearch_(q, true); }
  else if (e.key === 'Escape' && e.target.value) { e.preventDefault(); e.stopPropagation(); e.target.value = ''; if (HB_SEARCH.showing) hbHome_(true); }
}
function hbLeaveSearch_() { HB_SEARCH.showing = false; HB_SEARCH.seq++; clearTimeout(HB_SEARCH.timer); }
/** Run a search and show its results; `record` puts it in the history (the
 *  first result view pushes, a refinement replaces, so Back leaves search). */
function hbSearch_(q, record) {
  hbCloseSide_();
  var main = hbMain_(); if (!main) return;
  var was = HB_SEARCH.showing;
  HB.currentId = null; HB.landing = false;
  MANUAL_STATE.manualSeq = (MANUAL_STATE.manualSeq || 0) + 1;   // a chapter still loading must not paint over the results
  hbMarkCurrent_(null); hbMarkHomeBtn_(false);
  HB_SEARCH.showing = true; HB_SEARCH.q = q; HB_PP.showing = false; hbLeaveQuiz_();
  var seq = ++HB_SEARCH.seq;
  if (record) hbHistory_(was ? 'replace' : 'push', { search: q }, {});
  var jump = kbManualNumberTarget_(q, HB.tree);
  main.innerHTML = '<div class="hb-results"><h1 class="hb-results-h">Results for “' + esc(q) + '”</h1>' +
    (jump ? '<button type="button" class="hb-hit hb-hit-jump" data-kb-id="' + esc(jump.id) + '" data-kb-anchor="' + esc(jump.anchor || '') + '" onclick="MANUAL_HOST.openItem(this.getAttribute(\'data-kb-id\'), this.getAttribute(\'data-kb-anchor\'))">' +
      icon('chevronRight', 14) + ' Go to <b>' + esc(jump.num) + '</b> ' + esc(kbManualSplitTitle_(jump.title).rest) + '</button>' : '') +
    '<div class="hb-results-list" role="status">' + loSweep() + '</div></div>';
  main.scrollTop = 0;
  var done = function (res) {
    if (seq !== HB_SEARCH.seq || !HB_SEARCH.showing) return;
    var list = main.querySelector('.hb-results-list'); if (!list) return;
    if (!res || res.error) { list.innerHTML = '<p class="hb-msg bad" role="alert">The search failed: ' + esc(String((res && res.error) || 'the server did not answer').replace(/\.$/, '')) + '. Try again.</p>'; return; }
    // Handbook sections only — the server already drops the rest; this page
    // could not open one anyway (getReferenceItem refuses it).
    list.innerHTML = hbResultsHtml_((res.results || []).filter(function (r) { return r && kbIsManualId_(r.id); }), q);
    try { kbHighlightTerms_(list, q, res.terms); } catch (e) {}
  };
  google.script.run.withSuccessHandler(done).withFailureHandler(function (err) { done({ error: (err && err.message) || '' }); })
    .searchReference(q, { signal: true });
}
/** The result rows: the section (its number as a chip), the part of it that
 *  matched, and a line of it. Router answers ("the caller said …") lead. */
function hbResultsHtml_(results, q) {
  if (!results.length) return '<p class="hb-quiet">Nothing in the handbook matches “' + esc(q) + '”.</p>';
  return '<p class="hb-quiet">' + results.length + (results.length === 1 ? ' result' : ' results') + '</p>' +
    results.map(function (r) {
      var t = kbManualSplitTitle_(r.title || '');
      return '<button type="button" class="hb-hit" data-kb-id="' + esc(r.id) + '" data-kb-anchor="' + esc(r.anchor || '') + '" onclick="MANUAL_HOST.openItem(this.getAttribute(\'data-kb-id\'), this.getAttribute(\'data-kb-anchor\'))">' +
        '<span class="hb-hit-t">' + (t.num ? '<span class="hb-hit-n">' + esc(t.num) + '</span> ' : '') + esc(t.rest) + '</span>' +
        (r.heading ? '<span class="hb-hit-h">' + esc(r.heading) + '</span>' : '') +
        (r.router && r.chunkMd ? '<span class="hb-hit-s">' + esc(kbMdPlain_(r.chunkMd)) + '</span>' : (r.snippet ? '<span class="hb-hit-s">' + esc(r.snippet) + '</span>' : '')) +
        '</button>';
    }).join('');
}

// ── People (HB2.1) ────────────────────────────────────────────────────────
// Who is reading, from the Handbook spreadsheet (People.js): a first visit is
// asked for a department and a manager, the manager confirms, and the admin
// keeps the list of managers. The handbook never waits on any of it — a
// failure here costs the profile, never the reading. Each section of the
// people view is painted on its own, so an answer to one action never wipes
// what is being typed or chosen in another (g141).

/** PURE — what the home page says about the reader's profile: '' when there
 *  is nothing to ask (or no profile store), else a prompt or a status line. */
function hbMePromptHtml_(me) {
  if (!me || me.error || me.setUp === false) return '';
  var waiting = 0;
  (me.team || []).forEach(function (p) { if (p.standing === 'pending') waiting++; });
  var mine = me.me, line = '', act = '';
  if (!mine || (!mine.department && !mine.manager)) { line = 'Tell us your department and your manager, so your manager can see you on their team.'; act = 'Set up my profile'; }
  else if (mine.standing === 'declined') { line = mine.managerName + ' said you are not on their team. Choose your manager again.'; act = 'Update my profile'; }
  else if (mine.standing === 'gone') { line = mine.managerName + ' is no longer a manager here. Choose your manager again.'; act = 'Update my profile'; }
  var out = '';
  if (line) out += '<div class="hb-prompt" role="status"><span class="hb-prompt-t">' + esc(line) + '</span><button type="button" class="kb-btn hb-prompt-go" onclick="hbGoPeople_()">' + esc(act) + '</button></div>';
  else if (mine.standing === 'pending') out += '<div class="hb-quiet hb-prompt-wait">Waiting for ' + esc(mine.managerName) + ' to confirm you are on their team.</div>';
  if (waiting) out += '<div class="hb-prompt" role="status"><span class="hb-prompt-t">' + waiting + (waiting === 1 ? ' person is' : ' people are') + ' waiting for you to confirm them.</span><button type="button" class="kb-btn hb-prompt-go" onclick="hbGoPeople_()">Review</button></div>';
  return out;
}
/** PURE — the header button's badge: requests waiting on this reader, or '!'
 *  when their own profile needs them. */
function hbMeBadge_(me) {
  if (!me || me.error || me.setUp === false) return '';
  var n = 0;
  (me.team || []).forEach(function (p) { if (p.standing === 'pending') n++; });
  if (n) return String(n);
  var mine = me.me;
  if (!mine || (!mine.department && !mine.manager) || mine.standing === 'declined' || mine.standing === 'gone') return '!';
  return '';
}
function hbStandingLabel_(p) {
  if (!p) return '';
  if (p.standing === 'confirmed') return 'Confirmed by ' + p.managerName;
  if (p.standing === 'pending') return 'Waiting for ' + p.managerName + ' to confirm';
  if (p.standing === 'declined') return p.managerName + ' said "not my team"';
  if (p.standing === 'gone') return p.managerName + ' is no longer a manager';
  return 'No manager chosen';
}

function hbLoadMe_() {
  var seq = ++HB_PP.sent;
  google.script.run
    .withSuccessHandler(function (res) { hbApplyMe_(seq, res && typeof res === 'object' ? res : { error: 'The server did not answer.' }); })
    .withFailureHandler(function (err) { hbApplyMe_(seq, { error: (err && err.message) || 'The server did not answer.' }); })
    .hbGetMe();
}
/** Take a fresh view (the load's, or an action's) unless a newer one already
 *  arrived. `parts` names the people-view sections to repaint. */
function hbApplyMe_(seq, me, parts) {
  if (seq < HB_PP.applied) return false;
  HB_PP.applied = seq;
  HB_ME = me;
  // The profile's department seeds the reading choice, never overrides one.
  if (me && me.me && me.me.department && !hbLs_(HB_LS_DEPT)) { hbLsSet_(HB_LS_DEPT, me.me.department); hbPaintDeptPicker_(); }
  hbPaintMeBtn_();
  var prompt = document.getElementById('hb-me-prompt');
  if (prompt) prompt.innerHTML = hbMePromptHtml_(me);
  if (HB_PP.showing) {
    (parts || ['me', 'team', 'admin']).forEach(function (k) {
      if (k === 'me') hbPaintPeopleMe_(); else if (k === 'team') hbPaintPeopleTeam_(); else hbPaintPeopleAdmin_();
    });
  }
  return true;
}
function hbPaintMeBtn_() {
  var b = document.getElementById('hb-me-badge'), btn = document.getElementById('hb-me');
  var badge = hbMeBadge_(HB_ME);
  if (b) b.textContent = badge;
  if (btn) btn.setAttribute('aria-label', 'Profile' + (badge === '!' ? ' — needs your answer' : badge ? ' — ' + badge + ' waiting for you' : ''));
}

function hbGoPeople_() { hbPeople_(true); }
function hbPeople_(push) {
  hbCloseSide_();
  hbLeaveSearch_(); hbLeaveQuiz_();
  HB.currentId = null; HB.landing = false;
  MANUAL_STATE.manualSeq = (MANUAL_STATE.manualSeq || 0) + 1;   // a chapter still loading must not paint over the view
  hbMarkCurrent_(null); hbMarkHomeBtn_(false);
  HB_PP.showing = true; HB_PP.dirty = false;
  var main = hbMain_(); if (!main) return;
  main.innerHTML = '<div class="hb-people"><section class="hb-pp" id="hb-pp-me"></section>' +
    '<section class="hb-pp" id="hb-pp-team"></section><section class="hb-pp" id="hb-pp-locks"></section><section class="hb-pp" id="hb-pp-admin"></section></div>';
  main.scrollTop = 0;
  hbPaintPeopleMe_(); hbPaintPeopleTeam_(); hbPaintPeopleAdmin_(); hbLoadLocks_();
  if (push) hbHistory_('push', { people: true }, {});
}
/** "Your profile" — the reader's department and manager. Not repainted while
 *  the reader has changed it and not saved (g141). */
function hbPaintPeopleMe_() {
  var host = document.getElementById('hb-pp-me'); if (!host) return;
  if (HB_PP.dirty) return;
  var me = HB_ME;
  var head = '<h1 class="hb-pp-h">Your profile</h1>';
  if (me === undefined) { host.innerHTML = head + loSweep(); return; }
  if (me.error) { host.innerHTML = head + '<p class="hb-msg bad" role="alert">Could not load your profile: ' + esc(String(me.error).replace(/\.$/, '')) + '. Reload the page to try again.</p>'; return; }
  var who = '<div class="hb-pp-who">' + esc(me.name) + ' <span class="hb-quiet">' + esc(me.email) + '</span>' +
    (me.isAdmin ? ' <span class="hb-pp-tag">Admin</span>' : '') + (me.isManager ? ' <span class="hb-pp-tag">Manager</span>' : '') + '</div>';
  if (me.setUp === false) {
    host.innerHTML = head + who + '<p class="hb-quiet">Profiles are not set up yet' +
      (me.isAdmin ? ': set the HANDBOOK_SS_ID Script Property to the Handbook spreadsheet (see docs/handbook-app.md).' : '. The handbook\'s admin will turn them on.') + '</p>';
    return;
  }
  var mine = me.me || {};
  var depts = kbManualDepts_().list.filter(function (x) { return !kbManualChapterParts_(x).appendix; });
  var deptSel = '<select id="hb-pp-dept" class="hb-pp-sel" onchange="HB_PP.dirty = true">' +
    '<option value="">Not chosen</option>' + depts.map(function (d) {
      return '<option value="' + esc(d) + '"' + (d === mine.department ? ' selected' : '') + '>' + esc(hbChapterLabel_(d)) + '</option>';
    }).join('') + '</select>';
  var mgrs = (me.managers || []).slice();
  if (mine.manager && !mgrs.some(function (m) { return m.email === mine.manager; })) mgrs = [];   // gone: not offered again
  var mgrSel = '<select id="hb-pp-mgr" class="hb-pp-sel" onchange="HB_PP.dirty = true">' +
    '<option value="">' + (mgrs.length ? 'No manager' : 'No managers have been set up yet') + '</option>' + mgrs.map(function (m) {
      return '<option value="' + esc(m.email) + '"' + (m.email === mine.manager ? ' selected' : '') + '>' + esc(m.name) + ' (' + esc(m.email) + ')</option>';
    }).join('') + '</select>';
  host.innerHTML = head + who +
    (me.me ? '<p class="hb-pp-standing hb-st-' + esc(mine.standing) + '">' + esc(hbStandingLabel_(mine)) + '</p>' : '<p class="hb-quiet">Choose your department and your manager. Your manager confirms you are on their team.</p>') +
    '<div class="hb-pp-form"><label class="hb-pp-l">Department ' + deptSel + '</label>' +
    '<label class="hb-pp-l">Manager ' + mgrSel + '</label>' +
    '<button type="button" class="kb-btn hb-pp-save" onclick="hbPpSave_(this)">Save</button></div>' +
    '<p class="hb-quiet hb-pp-note">Changing either asks your manager to confirm again.</p>';
}
function hbPersonRowHtml_(p, actions) {
  return '<div class="hb-pp-row"><div class="hb-pp-row-b"><span class="hb-pp-row-n">' + esc(p.name) + '</span>' +
    '<span class="hb-quiet">' + esc(p.email) + (p.department ? ' · ' + esc(hbChapterLabel_(p.department)) : '') + '</span>' +
    '<span class="hb-pp-row-s hb-st-' + esc(p.standing) + '">' + esc(hbStandingLabel_(p)) + '</span></div>' +
    '<div class="hb-pp-row-a">' + actions + '</div></div>';
}
function hbPpBtn_(label, fn, email, extra) {
  return '<button type="button" class="kb-btn' + (extra ? ' ' + extra : '') + '" data-email="' + esc(email) + '" onclick="' + fn + '">' + esc(label) + '</button>';
}
/** "Your team" — for a manager: requests to answer, then the confirmed. */
function hbPaintPeopleTeam_() {
  var host = document.getElementById('hb-pp-team'); if (!host) return;
  var me = HB_ME;
  if (!me || me.error || !me.isManager) { host.innerHTML = ''; return; }
  var team = me.team || [];
  var pending = team.filter(function (p) { return p.standing === 'pending'; });
  var conf = team.filter(function (p) { return p.standing === 'confirmed'; });

/** One action: the button waits, the answer (the caller's whole view) is

function hbPpCall_(btn, fn, args, parts, okMsg) {
  if (btn) btn.disabled = true;
  var seq = ++HB_PP.sent;
  var done = function (res) {
    if (btn && btn.isConnected) btn.disabled = false;
    if (!res || !res.success) { showToast('Not saved: ' + String((res && res.error) || 'the server did not answer').replace(/\.$/, '') + '.', 'toast-error'); return; }
    if (okMsg) showToast(typeof okMsg === 'function' ? okMsg(res) : okMsg, 'toast-success');
    if (res.view) hbApplyMe_(seq, res.view, parts);
  };
  var run = google.script.run.withSuccessHandler(done).withFailureHandler(function (err) { done({ error: err && err.message }); });
  run[fn].apply(run, args);
}

// ── Quizzes (HB3.2) ───────────────────────────────────────────────────────
// The handbook's official quizzes (Quiz.js): a list grouped by chapter, a bar
// on any section that has one, taking a quiz, and its result. Questions and
// options are SHUFFLED here and the answers sent back in the quiz's ORIGINAL
// order, so the server never needs to remember a shuffle. A wrong answer is
// shown its explanation and a link to its section, never the right option.
// Every answer is for ITS request: a view left, or a newer load, drops it (g81).

/** PURE — a random order of 0..n-1 (Fisher–Yates over `rand`, 0 ≤ rand() < 1). */
function hbShuffle_(n, rand) {
  var a = [];
  for (var i = 0; i < n; i++) a.push(i);
  for (var j = n - 1; j > 0; j--) {
    var k = Math.floor(rand() * (j + 1));
    var t = a[j]; a[j] = a[k]; a[k] = t;
  }
  return a;
}
/** PURE — the order a quiz is shown in: the questions shuffled, and each
 *  question's options shuffled (a true/false keeps True, False). Each entry
 *  is { q: original question index, opts: [original option indices] }. */
function hbQuizOrder_(questions, rand) {
  return hbShuffle_(questions.length, rand).map(function (qi) {
    var q = questions[qi], n = (q.options || []).length;
    return { q: qi, opts: q.type === 'truefalse' ? [0, 1] : hbShuffle_(n, rand) };
  });
}
/** PURE — the answers in the quiz's ORIGINAL order, from what was chosen on
 *  the shuffled page: picked[k] is the list of SHOWN option positions chosen
 *  for shown question k. A single answer is an index, a multi-select a list;
 *  an unanswered question is null. */
function hbQuizAnswers_(questions, order, picked) {
  var out = questions.map(function () { return null; });
  order.forEach(function (o, k) {
    var shown = picked[k] || [];
    var orig = shown.map(function (s) { return o.opts[s]; });
    out[o.q] = questions[o.q].type === 'multi' ? (orig.length ? orig.sort(function (a, b) { return a - b; }) : null) : (orig.length ? orig[0] : null);
  });
  return out;
}
/** PURE — a stamp as the reader reads it ("Thu, Oct 30, 2:15 PM"). */
function hbWhen_(ms) {
  try { return new Date(ms).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
  catch (e) { return new Date(ms).toString(); }
}

var HB_QZ = { list: undefined, seq: 0, lseq: 0, showing: false, taking: null };   // seq: the open view's; lseq: the list load's
function hbLeaveQuiz_() { HB_QZ.showing = false; HB_QZ.taking = null; HB_QZ.seq++; hbLeaveTraining_(); hbStopReading_(); }   // and read aloud (HB2.3)   // every other view leaves Training too (HB3.3)

function hbLoadQuizzes_(then) {
  var lseq = ++HB_QZ.lseq;
  var take = function (res) {
    if (lseq !== HB_QZ.lseq) return;   // a newer load is on its way
    // A failure never replaces a list that loaded (g129): the bar keeps it.
    if (!(res && res.error && HB_QZ.list && !HB_QZ.list.error)) HB_QZ.list = res;
    hbPaintQuizBar_(HB.currentId);
    if (then) then(res);
  };
  google.script.run
    .withSuccessHandler(function (res) { take(res && typeof res === 'object' ? res : { error: 'The server did not answer.' }); })
    .withFailureHandler(function (err) { take({ error: (err && err.message) || 'The server did not answer.' }); })
    .hbListQuizzes();
}
/** The bar above the reader: the sign-off for the section in view (HB3.4),

function hbPaintQuizBar_(id) {

  var sign = HB_SO.setUp ? hbSignBarHtml_(id, HB_SO.signoffs['section:' + id], HB_SO.setUp) : '';
  bar.innerHTML = (sign ? '<span class="hb-so">' + sign + '</span>' : '') + hbNoteBarHtml_(id) + hbListenBarHtml_(id) + mine.map(function (q) {
    return '<span class="hb-qb-t">' + icon('check', 13) + ' Quiz: ' + esc(q.title) + '</span>' +
      '<button type="button" class="kb-btn hb-qb-go" data-quiz="' + esc(q.id) + '" onclick="hbTakeQuiz_(this.getAttribute(\'data-quiz\'), true)">Take the quiz</button>';
  }).join('');
}
/** Where a reader stands with a quiz, as a chip. */
function hbQuizChip_(me) {
  if (!me) return '';
  if (me.locked) return '<span class="hb-qz-chip lock">Locked until ' + esc(hbWhen_(me.retryAtMs)) + '</span>';
  if (me.passed) return '<span class="hb-qz-chip pass">Passed' + (me.best != null ? ' · best ' + me.best + '%' : '') + '</span>';
  if (me.attempts) return '<span class="hb-qz-chip">' + me.attemptsLeft + ' of ' + me.maxAttempts + ' attempts left</span>';

/** A link to a quiz's (or a question's) section — only when the reader can

 *  raw id. */
function hbQuizSecLink_(id, anchor, before, label) {
  if (!id || !HB.tree.some(function (it) { return it.id === id; })) return '';
  return esc(before) + '<a href="#" class="hb-qz-sec" data-kb-id="' + esc(id) + '" data-kb-anchor="' + esc(anchor || '') +
    '" onclick="MANUAL_HOST.openItem(this.getAttribute(\'data-kb-id\'), this.getAttribute(\'data-kb-anchor\')); return false;">' +
    esc(label + hbLinkOf_(id, anchor, HB.tree)) + '</a>';
}
function hbGoQuizzes_() { hbQuizList_(true); }
function hbQuizList_(push) {
  hbCloseSide_(); hbLeaveSearch_(); HB_PP.showing = false; hbLeaveQuiz_();
  HB.currentId = null; HB.landing = false;

function hbPaintQuizList_(res) {

  if (!qs.length) { host.innerHTML = html + '<p class="hb-quiet">No quizzes have been published yet.</p>'; return; }
  // Grouped by the chapter of the section each belongs to, in the contents' order.
  var deptOf = {};
  HB.tree.forEach(function (it) { deptOf[it.id] = it.department; });
  var groups = {};
  qs.forEach(function (q) { var d = deptOf[q.section] || ''; (groups[d] = groups[d] || []).push(q); });
  var order = kbManualDepts_().list.filter(function (d) { return groups[d]; });
  if (groups['']) order.push('');
  host.innerHTML = html + order.map(function (d) {
    return '<section class="hb-qz-grp"><h2 class="hb-pp-h2">' + esc(d ? hbChapterLabel_(d) : 'Other') + '</h2>' + groups[d].map(function (q) {
      var locked = q.me && q.me.locked;
      return '<div class="hb-pp-row"><div class="hb-pp-row-b"><span class="hb-pp-row-n">' + esc(q.title) + '</span>' +
        '<span class="hb-quiet">' + q.count + ' question' + (q.count === 1 ? '' : 's') + ' · pass mark ' + q.passPct + '%' + hbQuizSecLink_(q.section, q.anchor, ' · ', 'section ') + '</span>' +
        hbQuizChip_(q.me) + '</div>' +
        '<div class="hb-pp-row-a">' + (res.setUp === false ? '' : '<button type="button" class="kb-btn hb-pp-yes" data-quiz="' + esc(q.id) + '"' + (locked ? ' disabled' : '') +
          ' onclick="hbTakeQuiz_(this.getAttribute(\'data-quiz\'), true)">' + (locked ? 'Locked' : (q.me && q.me.attempts ? 'Take again' : 'Take the quiz')) + '</button>') + '</div></div>';
    }).join('') + '</section>';

/** Open a quiz to take: its questions shuffled for this sitting. */
function hbTakeQuiz_(id, push) {
  hbCloseSide_(); hbLeaveSearch_(); HB_PP.showing = false; hbLeaveQuiz_();
  HB.currentId = null; HB.landing = false;
  MANUAL_STATE.manualSeq = (MANUAL_STATE.manualSeq || 0) + 1;
  hbMarkCurrent_(null); hbMarkHomeBtn_(false);
  HB_QZ.showing = 'take';
  var seq = HB_QZ.seq;
  var main = hbMain_(); if (!main) return;
  main.innerHTML = '<div class="hb-qz" id="hb-qz-take">' + loSweep() + '</div>';
  main.scrollTop = 0;
  if (push) hbHistory_('push', { quiz: id }, {});
  google.script.run
    .withSuccessHandler(function (res) { if (seq === HB_QZ.seq && HB_QZ.showing === 'take') hbPaintTake_(res || { error: 'The server did not answer.' }); })
    .withFailureHandler(function (err) { if (seq === HB_QZ.seq && HB_QZ.showing === 'take') hbPaintTake_({ error: (err && err.message) || 'The server did not answer.' }); })
    .hbGetQuiz(id);
}
function hbPaintTake_(res) {
  var host = document.getElementById('hb-qz-take'); if (!host) return;
  if (res.error) { host.innerHTML = '<p class="hb-msg bad" role="alert">The quiz could not be opened: ' + esc(String(res.error).replace(/\.$/, '')) + '.</p>'; return; }
  var quiz = res.quiz, me = res.me || {};
  var head = '<h1 class="hb-pp-h">' + esc(quiz.title) + '</h1><p class="hb-quiet">' + quiz.questions.length + ' question' + (quiz.questions.length === 1 ? '' : 's') +
    ' · pass mark ' + quiz.passPct + '% · ' + (me.locked ? '' : me.attemptsLeft + ' of ' + me.maxAttempts + ' attempts left') + '</p>';
  if (me.locked) {
    host.innerHTML = head + '<p class="hb-msg bad" role="alert">You have used your ' + me.maxAttempts + ' attempts. You can try again after ' + esc(hbWhen_(me.retryAtMs)) +
      ', or ask your manager to reset them.</p><button type="button" class="kb-btn" onclick="hbGoQuizzes_()">Back to quizzes</button>';
    return;
  }
  var order = hbQuizOrder_(quiz.questions, Math.random);
  HB_QZ.taking = { quiz: quiz, order: order };
  host.innerHTML = head + '<form class="hb-qz-form" onsubmit="hbSubmitQuiz_(event)">' + order.map(function (o, k) {
    var q = quiz.questions[o.q], multi = q.type === 'multi';
    return '<fieldset class="hb-qz-q" data-k="' + k + '"><legend class="hb-qz-qt"><span class="hb-qz-n">' + (k + 1) + '.</span> ' + esc(q.q) +
      (multi ? ' <span class="hb-quiet">(choose all that apply)</span>' : '') + '</legend>' +
      o.opts.map(function (oi, s) {
        return '<label class="hb-qz-opt"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="hb-qz-' + k + '" value="' + s + '"> <span>' + esc(q.options[oi]) + '</span></label>';
      }).join('') + '</fieldset>';
  }).join('') + '<p class="hb-qz-need" id="hb-qz-need" role="alert"></p>' +
    '<div class="hb-qz-actions"><button type="submit" class="kb-btn hb-pp-yes" id="hb-qz-submit">Submit answers</button>' +
    '<button type="button" class="kb-btn" onclick="hbGoQuizzes_()">Cancel</button></div></form>';
}
function hbSubmitQuiz_(e) {
  if (e) e.preventDefault();
  var t = HB_QZ.taking; if (!t) return;
  var picked = t.order.map(function (o, k) {
    return Array.prototype.slice.call(document.querySelectorAll('input[name="hb-qz-' + k + '"]:checked')).map(function (i) { return Number(i.value); });
  });
  var missing = picked.map(function (p, k) { return p.length ? 0 : k + 1; }).filter(Boolean);
  var need = document.getElementById('hb-qz-need');
  if (missing.length) { if (need) need.textContent = 'Answer every question first — ' + (missing.length === 1 ? 'question ' + missing[0] + ' is' : 'questions ' + missing.join(', ') + ' are') + ' unanswered.'; return; }
  if (need) need.textContent = '';
  var btn = document.getElementById('hb-qz-submit'); if (btn) btn.disabled = true;
  var answers = hbQuizAnswers_(t.quiz.questions, t.order, picked);
  var seq = HB_QZ.seq;
  var done = function (res) {
    if (seq !== HB_QZ.seq || HB_QZ.showing !== 'take') return;
    if (!res || !res.success) {
      if (btn && btn.isConnected) btn.disabled = false;
      if (res && res.locked) { hbPaintTake_({ quiz: t.quiz, me: res.me }); return; }
      showToast('Not submitted: ' + String((res && res.error) || 'the server did not answer').replace(/\.$/, '') + '.', 'toast-error');
      return;
    }
    hbPaintResult_(t.quiz, res);
    hbLoadQuizzes_();   // the list and the quiz bar learn the new standing
  };
  google.script.run.withSuccessHandler(done).withFailureHandler(function (err) { done({ error: err && err.message }); })
    .hbSubmitQuiz(t.quiz.id, answers);
}
/** The result: the score, and for each wrong answer its explanation and the
 *  section to read — never which option was right. */
function hbPaintResult_(quiz, res) {
  var host = document.getElementById('hb-qz-take'); if (!host) return;
  HB_QZ.taking = null;
  var me = res.me || {};
  var html = '<h1 class="hb-pp-h">' + esc(quiz.title) + '</h1>' +
    '<div class="hb-qz-score ' + (res.passed ? 'pass' : 'fail') + '" role="status"><b>' + res.scorePct + '%</b> — ' + res.right + ' of ' + res.total + ' right. ' +
    (res.passed ? 'Passed (the pass mark is ' + res.passPct + '%).' : 'Not passed yet (the pass mark is ' + res.passPct + '%).') + '</div>';
  if ((res.review || []).length) {
    html += '<h2 class="hb-pp-h2">To go over</h2>' + res.review.map(function (r) {
      var q = quiz.questions[r.i] || {};
      return '<div class="hb-qz-rev"><div class="hb-qz-qt">' + esc(q.q || '') + '</div>' +
        (r.explain ? '<div class="hb-qz-why">' + esc(r.explain) + '</div>' : '') + hbQuizSecLink_(r.section, r.anchor, '', 'Read ') + '</div>';
    }).join('');
  }
  html += '<p class="hb-quiet">' + (me.locked ? 'You have used your ' + me.maxAttempts + ' attempts — you can try again after ' + esc(hbWhen_(me.retryAtMs)) + ', or ask your manager to reset them.'
    : (res.passed ? '' : me.attemptsLeft + ' of ' + me.maxAttempts + ' attempts left.')) + '</p>' +
    '<div class="hb-qz-actions">' + (me.locked || res.passed ? '' : '<button type="button" class="kb-btn hb-pp-yes" data-quiz="' + esc(quiz.id) + '" onclick="hbTakeQuiz_(this.getAttribute(\'data-quiz\'), false)">Try again</button>') +
    '<button type="button" class="kb-btn" onclick="hbGoQuizzes_()">Back to quizzes</button></div>';
  host.innerHTML = html;
  hbMain_().scrollTop = 0;
}

/** PURE — a quiz editor's options box: one option per line, a leading "*"
 *  marks a right one. Returns { options, correct } — `correct` an index for a
 *  single-answer question, the list for a multi-select, -1 / [] when none is
 *  marked. A true/false question has its own two options. */
function hbParseOptions_(text, type) {
  if (type === 'truefalse') return { options: ['True', 'False'], correct: -1 };
  var options = [], marked = [];
  String(text || '').split(/\r?\n/).forEach(function (line) {
    var t = line.trim();
    if (!t) return;
    var star = /^\*\s*/.test(t);
    if (star) { t = t.replace(/^\*\s*/, ''); marked.push(options.length); }
    if (t) options.push(t);
  });
  return { options: options, correct: type === 'multi' ? marked : (marked.length ? marked[0] : -1) };
}
/** PURE — the options box for a stored question (the inverse of the above). */
function hbOptionsText_(q) {
  var right = q.type === 'multi' ? (q.correct || []) : [q.correct];
  return (q.options || []).map(function (o, i) { return (right.indexOf(i) >= 0 ? '* ' : '') + o; }).join('\n');
}
/** PURE — a due date as the reader reads it ("Fri, Nov 30"); '' for none. */
function hbDueLabel_(due) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(due || '')) return '';
  try { return new Date(due + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }); } catch (e) { return due; }
}

  var r = row.getBoundingClientRect(), s = side.getBoundingClientRect();
  if (r.top < s.top) side.scrollTop -= (s.top - r.top) + 8;
  else if (r.bottom > s.bottom) side.scrollTop += (r.bottom - s.bottom) + 8;
}
/** A dot on every section changed since the last visit (the home page's list). */
function hbPaintTocNews_() {
  var meta = MANUAL_STATE.manualMeta;
  var on = {};
  if (meta && HB.tree.length) hbNewsNow_().items.forEach(function (n) { on[n.id] = true; });
  document.querySelectorAll('#hb-toc .hb-it').forEach(function (b) {
    var dot = b.querySelector('.hb-new');
    var want = !!on[b.getAttribute('data-kb-id')];
    if (want && !dot) b.insertAdjacentHTML('beforeend', '<span class="hb-new" title="Changed since your last visit"></span>');
    else if (!want && dot) dot.remove();
  });
}
function hbToggleSide_() {
  var wrap = document.querySelector('.hb-wrap'), btn = document.getElementById('hb-menu');
  var open = !wrap.classList.contains('side-open');
  wrap.classList.toggle('side-open', open);
  if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function hbCloseSide_() {
  var wrap = document.querySelector('.hb-wrap'), btn = document.getElementById('hb-menu');
  if (wrap) wrap.classList.remove('side-open');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

// ── Home ──────────────────────────────────────────────────────────────────
var HB_SINCE = null;   // this visit's "last visit" day ('' for a first), fixed at load
function hbNewsNow_() {
  var visible = {};
  HB.tree.forEach(function (it) { visible[it.id] = true; });
  var meta = MANUAL_STATE.manualMeta || {};
  return hbNews_(meta.changelog, visible, HB_SINCE || '', hbIsoDay_(new Date()), HB_NEWS_FIRST_DAYS, HB_NEWS_MAX);
}
function hbHomeHtml_() {
  var meta = MANUAL_STATE.manualMeta;
  var mine = hbLs_(HB_LS_DEPT) || '';
  var d = kbManualDepts_();
  if (d.list.indexOf(mine) < 0) mine = '';
  var html = '<div class="hb-home"><div><h1>Policies and Procedures Handbook</h1>' +
    '<div class="hb-home-sub">' + (meta && meta.version ? esc(meta.version) + (meta.built ? ' · built ' + esc(meta.built) : '') : '') + '</div></div>' +
    '<div id="hb-me-prompt">' + hbMePromptHtml_(HB_ME) + '</div>';
  // What's new — since the last visit, or the last month on a first one.
  if (meta === undefined) html += '<section><h2>What\'s new</h2><div class="hb-quiet">' + loSweep() + '</div></section>';
  else if (meta) {
    var n = hbNewsNow_();
    html += '<section><h2>' + (HB_SINCE ? 'New since your last visit (' + esc(kbManualDateLabel_(HB_SINCE)) + ')' : 'Changed in the last ' + HB_NEWS_FIRST_DAYS + ' days') + '</h2>';
    if (!n.items.length) html += '<div class="hb-quiet">Nothing has changed' + (HB_SINCE ? ' since then.' : '.') + '</div>';
    else {
      html += '<div class="hb-news">' + n.items.map(function (it) {
        return '<button type="button" class="hb-news-row" data-kb-id="' + esc(it.id) + '" data-kb-anchor="' + esc(it.anchor) + '" onclick="MANUAL_HOST.openItem(this.getAttribute(\'data-kb-id\'), this.getAttribute(\'data-kb-anchor\'))">' +
          '<span class="hb-news-num">' + esc(it.num) + '</span><span class="hb-news-sum">' + esc(it.summary) +
          (it.retraining ? ' <span class="hb-retrain">Retraining</span>' : '') + '</span>' +
          '<span class="hb-news-date">' + esc(kbManualDateLabel_(it.date)) + '</span></button>';
      }).join('') + '</div>';
      if (n.total > n.items.length) html += '<div class="hb-quiet">and ' + (n.total - n.items.length) + ' more.</div>';
    }
    html += '</section>';
  }
  var card = function (dept) {
    var first = d.first(dept), count = HB.tree.filter(function (it) { return it.department === dept; }).length;
    var p = kbManualChapterParts_(dept);
    return '<button type="button" class="hb-card' + (dept === mine ? ' mine' : '') + '" data-kb-id="' + esc(first) + '" onclick="MANUAL_HOST.openItem(this.getAttribute(\'data-kb-id\'), \'\', { chapter: true })">' +
      kbManualChapterIcon_(dept, 22, 'hb-card-ic') +
      '<span class="hb-card-b"><span class="hb-card-k">' + esc(p.appendix ? 'Appendix ' + p.num : (p.num ? 'Chapter ' + Number(p.num) : '')) + '</span>' +
      '<span class="hb-card-t">' + esc(p.name) + '</span>' +
      '<span class="hb-card-c">' + count + (count === 1 ? ' section' : ' sections') + '</span></span></button>';
  };
  if (mine) html += '<section><h2>Your department</h2><div class="hb-cards">' + card(mine) + '</div></section>';
  html += '<section><h2>' + (mine ? 'All chapters' : 'Chapters') + '</h2><div class="hb-cards">' +
    d.list.filter(function (x) { return x !== mine; }).map(card).join('') + '</div></section>';
  if (!mine) html += '<div class="hb-quiet">Choose your department at the top to see its chapter first.</div>';
  return html + '</div>';
}
function hbPaintDeptPicker_() {
  var sel = document.getElementById('hb-dept-sel'); if (!sel) return;
  var mine = hbLs_(HB_LS_DEPT) || '';
  var list = kbManualDepts_().list.filter(function (x) { return !kbManualChapterParts_(x).appendix; });
  sel.innerHTML = '<option value="">Not chosen</option>' + list.map(function (dept) {
    return '<option value="' + esc(dept) + '"' + (dept === mine ? ' selected' : '') + '>' + esc(hbChapterLabel_(dept)) + '</option>';
  }).join('');
}
function hbSetDept_(dept) {
  hbLsSet_(HB_LS_DEPT, dept || '');
  if (HB.landing) hbHome_(false);
}
function hbMsg_(msg, bad) {
  var main = hbMain_(); if (!main) return;
  main.innerHTML = '<p class="hb-msg' + (bad ? ' bad' : '') + '" role="' + (bad ? 'alert' : 'status') + '">' + esc(msg) + '</p>';
}
function hbPaintVer_() {
  var el = document.getElementById('hb-ver'), meta = MANUAL_STATE.manualMeta;
  if (el) el.textContent = meta && meta.version ? String(meta.version) : '';   // the version carries its own "v" (v3.0)
}

// ── The chapters, kept in the browser ─────────────────────────────────────
// IndexedDB, one record: { stamp, res } — the last getManualParts answer and
// the server's stamp of it. A visit asks only for the stamp (getManualStamp);
// while it matches, the chapters come from the browser and the full read is
// skipped. Any failure here (private mode, a blocked store) is a miss.
function hbKeptStore_(mode, fn, fail) {
  try {
    var rq = window.indexedDB.open(HB_KEPT.db, 1);
    rq.onupgradeneeded = function () { rq.result.createObjectStore(HB_KEPT.store); };
    rq.onsuccess = function () {
      try { fn(rq.result.transaction(HB_KEPT.store, mode).objectStore(HB_KEPT.store)); } catch (e) { fail(); }
    };
    rq.onerror = function () { fail(); };
  } catch (e) { fail(); }
}
function hbKeptGet_(cb) {
  var done = false, once = function (v) { if (!done) { done = true; cb(v); } };
  hbKeptStore_('readonly', function (st) {
    var g = st.get(HB_KEPT.key);
    g.onsuccess = function () { var v = g.result; once(v && v.stamp && v.res && Array.isArray(v.res.parts) ? v : null); };
    g.onerror = function () { once(null); };
  }, function () { once(null); });
}
function hbKeptPut_(val) { hbKeptStore_('readwrite', function (st) { try { st.put(val, HB_KEPT.key); } catch (e) {} }, function () {}); }

// ── Start ─────────────────────────────────────────────────────────────────
function hbBoot_() {
  currentView = 'handbook';   // the reader drops answers for a view no longer shown
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (overlayEscapeClose_(e)) return;
    var wrap = document.querySelector('.hb-wrap');
    if (wrap && wrap.classList.contains('side-open')) { hbCloseSide_(); e.preventDefault(); }
  });
  document.addEventListener('focusin', overlayFocusTrap_);
  // Narrow screens: a tap outside the open contents closes them.
  document.addEventListener('click', function (e) {
    var wrap = document.querySelector('.hb-wrap');
    if (!wrap || !wrap.classList.contains('side-open') || !e.target.closest) return;
    if (!e.target.closest('#hb-side') && !e.target.closest('#hb-menu')) hbCloseSide_();
  });
  try { if (window.google && google.script && google.script.history) google.script.history.setChangeHandler(hbOnHistory_); } catch (e) {}
  hbLoadMe_();
  hbLoadQuizzes_();   // HB3.2: the quiz bar needs to know which sections have one
  hbLoadSignOffs_();  // HB3.4: and the bar's sign-off, the reader's own
  hbLoadBookmarks_(); // HB2.2: the reader's bookmarks, and their notes when kept in the account
  hbBootNotes_();
  hbApplyDisplay_(hbDisplay_(), false);   // HB2.3: the head applied the stored attributes; this loads the font if it is on
  var sp = hbSpeech_();
  if (sp) { try { sp.addEventListener('voiceschanged', hbVoicesChanged_); } catch (e) {} }
  var vis = hbVisitStep_(hbLsJson_(HB_LS_VISIT), hbIsoDay_(new Date()));
  HB_SINCE = vis.since;
  hbLsSet_(HB_LS_VISIT, JSON.stringify(vis.rec));
  var main = hbMain_(); if (main) main.innerHTML = '<div class="hb-msg">' + loSweep() + '</div>';
  kbEnsureManualMeta_(function () {
    hbPaintVer_();
    if (HB.tree.length && HB.landing && HB.currentId === null) hbHome_(false);
    hbPaintTocNews_();
  });
  var kept, stamp, started = false;
  var next = function () {
    if (kept === undefined || stamp === undefined || started) return;
    started = true;
    if (kept && stamp && kept.stamp === stamp && kbManualPartsAccept_(kept.res)) { hbReady_(kept.res); return; }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.error || !kbManualPartsAccept_(res)) { hbLoadFailed_(kept, res && res.error); return; }
        hbReady_(res);
        if (res.stamp) hbKeptPut_({ stamp: res.stamp, res: res });
      })
      .withFailureHandler(function (err) { hbLoadFailed_(kept, err && err.message); })
      .getManualParts();
  };
  hbKeptGet_(function (v) { kept = v; next(); });
  google.script.run
    .withSuccessHandler(function (r) { stamp = r && !r.error && r.stamp ? r.stamp : null; next(); })
    .withFailureHandler(function () { stamp = null; next(); })
    .getManualStamp();
}
/** The server could not send the chapters. With a copy kept in the browser,
 *  read that — and say it may be out of date; without one, say what failed. */
function hbLoadFailed_(kept, msg) {
  if (kept && kbManualPartsAccept_(kept.res)) {
    hbReady_(kept.res);
    showToast('Could not reach the handbook — showing the copy kept on this device, which may be out of date.', 'toast-warn');
    return;
  }
  hbMsg_('The handbook could not be loaded: ' + String(msg || 'the server did not answer').replace(/\.$/, '') + '. Reload the page to try again.', true);
}
function hbReady_(res) {
  HB.tree = hbTreeOf_(res);
  hbPaintToc_();
  hbPaintDeptPicker_();
  if (HB_PP.showing) hbPaintPeopleMe_();   // the department list needed the chapters
  if (!HB.tree.length) { hbMsg_('No handbook has been published yet.'); return; }
  var asked = (window.HB_PARAMS || {}).s || '';
  var t = hbTargetOf_(asked, HB.tree);
  if (asked && !t) showToast('Section ' + asked + ' is not in the handbook — here is the home page.', 'toast-warn');
  if (t) {
    hbOpen_(t.id, t.anchor, null, false);
    hbHistory_('replace', { id: t.id, anchor: t.anchor }, { s: hbLinkOf_(t.id, t.anchor, HB.tree) });
  } else {
    hbHome_(false);
    hbHistory_('replace', { home: true }, {});
  }
}
hbBoot_();
</script>
