<style>
  /* The handbook app's own page (HB1.3) — the frame around the shared reader.
     Everything inside #kb-main is styled by the copied partials exactly as in
     Team Tools; these rules are the page around it, plus the two host rules
     the reader expects of its page (the reader's scroll box, and .kb-btn,
     whose rule in Team Tools is Reference's — HB1.1c kept host styling with
     the host). Tokens only, so dark mode and the palettes follow. */
  body { display: flex; flex-direction: column; overflow: hidden; }
  .hb-skip { position: absolute; left: 8px; top: -60px; z-index: 30; background: var(--paper-card); color: var(--ink); padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .hb-skip:focus { top: 8px; }
  /* HBR1 — the frame is Team Tools' (operator 2026-11-02): a light rail at the
     left (its .sb-* rules, restated for this page), a slim top bar, and no outer
     cards — the page is the paper; home lays its cards on it. */
  .hb-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 252px minmax(0, 1fr); }
  .hb-side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 20px 12px 14px; background: var(--paper-card); border-right: 1px solid var(--line); }
  .hb-col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .hb-brand { display: flex; align-items: flex-start; gap: 10px; padding: 2px 10px 16px; margin-bottom: 10px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .hb-brand-t { display: flex; flex-direction: column; font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: -.01em; line-height: 1.2; }
  .hb-mark { flex: none; width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: var(--accent); }
  .hb-ver { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .hb-ver:empty { display: none; }
  .hb-head { flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 22px; border-bottom: 1px solid var(--line); background: var(--paper-card); }
  .hb-brand-m { display: none; }
  .hb-head-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .hb-ib { position: relative; flex: none; display: inline-grid; place-items: center; width: 38px; height: 38px; padding: 0; font: inherit; border: 1px solid var(--line); border-radius: 50%; background: var(--paper-card); color: var(--muted); cursor: pointer; }
  .hb-ib:hover { background: var(--paper-2); color: var(--ink); }
  .hb-menu, .hb-q-open { display: none; }
  .hb-user { margin-top: auto; display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; font: inherit; text-align: left; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper-card); color: var(--ink); cursor: pointer; }
  .hb-user:hover { background: var(--paper-2); }
  .hb-user:empty { display: none; }
  .hb-user-b { display: flex; flex-direction: column; min-width: 0; }
  .hb-user-n { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb-user-d { font-family: var(--mono); font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb-ava { flex: none; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; font-weight: 700; }
  /* The reader's scroll box — Reference's .kb-main rules, for this page. */
  .kb-main { flex: 1; min-height: 0; background: var(--paper-card); padding: 18px 22px; overflow-y: auto; display: flex; flex-direction: column; --kb-man-band: 18px; }
  .kb-main.hb-on-home { background: var(--paper); }
  .hb-body { flex: 1; min-height: 0; display: flex; }
  .hb-aside { display: none; }
  @media (min-width: 1280px) {
    .hb-body.hb-has-aside .hb-aside { display: flex; flex-direction: column; gap: 10px; flex: none; width: 264px; overflow-y: auto; padding: 18px 18px 24px; border-left: 1px solid var(--line); background: var(--paper); }
    .hb-col:has(.hb-has-aside) .hb-qb-item { display: none; }   /* the column carries the quizzes and forms */
  }
  .hb-as-k { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .hb-as-t { font-weight: 700; font-size: .95rem; line-height: 1.3; overflow-wrap: anywhere; }
  .hb-as-n { font-family: var(--mono); font-size: .8rem; color: var(--man-c, var(--muted)); }
  .hb-as-card { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-card); }
  .hb-as-h { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 700; color: var(--muted); }
  .hb-as-ct { font-weight: 600; font-size: .88rem; overflow-wrap: anywhere; }
  .hb-as-toc, .hb-as-refs { display: flex; flex-direction: column; }
  .hb-as-toc button, .hb-as-refs button { display: flex; align-items: baseline; gap: 6px; padding: 5px 0 5px 10px; font: inherit; font-size: .82rem; text-align: left; border: none; border-left: 2px solid var(--line); background: none; color: var(--muted); cursor: pointer; overflow-wrap: anywhere; }
  .hb-as-refs button { align-items: center; border-left: none; padding-left: 0; color: var(--accent-ink); }
  .hb-as-toc button:hover, .hb-as-refs button:hover { color: var(--ink); }
  .hb-as-hn { flex: none; font-family: var(--mono); font-size: .72rem; }
  /* HBR2: the chapter's masthead as a banner — its colour washed across the card, its number faint behind (screen only; print keeps its own rules) */
  @media screen {
    .kb-main .kb-man-mast { position: relative; overflow: hidden; padding: 22px 26px 20px; margin: 4px 0 18px; border: 1px solid color-mix(in oklab, var(--man-c) 22%, var(--line)); border-radius: 16px;
      background: radial-gradient(600px 220px at 100% 0%, color-mix(in oklab, var(--man-c) 14%, transparent), transparent 70%), linear-gradient(120deg, color-mix(in oklab, var(--man-c) 7%, var(--paper-card)), var(--paper-card) 65%); }
    .kb-main .kb-man-mast > * { position: relative; z-index: 1; }
    .kb-main .kb-man-mast { container-type: inline-size; flex-shrink: 0; }   /* overflow: hidden drops a flex item's automatic minimum height — it shrank to 44px in the column */   /* its index's one-column query (@container ≤620px) needs a container on this page */
    .kb-main .kb-man-mast::after { position: absolute; right: 18px; top: -18px; z-index: 0; font-family: var(--display); font-size: 150px; font-weight: 800; letter-spacing: -.06em; line-height: 1; color: var(--man-c); opacity: .09; pointer-events: none; }
    .kb-man-mast.kb-man-p0::after { content: '0'; } .kb-man-mast.kb-man-p1::after { content: '1'; } .kb-man-mast.kb-man-p2::after { content: '2'; } .kb-man-mast.kb-man-p3::after { content: '3'; }
    .kb-man-mast.kb-man-p4::after { content: '4'; } .kb-man-mast.kb-man-p5::after { content: '5'; } .kb-man-mast.kb-man-p6::after { content: '6'; } .kb-man-mast.kb-man-p7::after { content: '7'; }
    .kb-man-mast.kb-man-p8::after { content: '8'; } .kb-man-mast.kb-man-p9::after { content: '9'; } .kb-man-mast.kb-man-p10::after { content: '10'; }
    .kb-main .kb-man-sec-head { box-shadow: inset 3px 0 0 var(--man-c); padding-left: 14px; }
  }
  .kb-main:has(> .kb-man-top) { scroll-padding-top: 60px; }
  .kb-main:has(> .kb-man-top .kb-man-back:not(:empty)) { scroll-padding-top: 96px; }
  .kb-main:focus { outline: none; }
  /* HBR1: a heading (or the reading area) that took focus from script (HB2.4) is
     not a control — no ring. The ring is styles.html's :focus-visible box-shadow,
     so both are cleared (Team Tools' own #view-area rule). Controls keep theirs. */
  .kb-main:focus-visible, .kb-main h1[tabindex="-1"]:focus, .kb-man-sec-h[tabindex="-1"]:focus, .kb-main .hb-qz-qt[tabindex="-1"]:focus, .kb-main .hb-qr-h[tabindex="-1"]:focus { outline: none; box-shadow: none; }
  .kb-btn { font: inherit; font-size: .76rem; padding: 4px 9px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--paper-card); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .kb-btn:hover { background: var(--paper-2); }
  .kb-btn:disabled { opacity: .55; cursor: default; background: var(--paper-card); }
  /* Search (HB1.4) */
  .hb-q-wrap { position: relative; flex: 1 1 260px; max-width: 520px; min-width: 0; }
  .hb-q-ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: inline-flex; color: var(--muted); pointer-events: none; }
  .hb-q { width: 100%; height: 38px; font: inherit; font-size: .88rem; color: var(--ink); background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px 0 36px; }
  .hb-q:focus { background: var(--paper-card); }
  .hb-on-home-bar .hb-q-wrap { visibility: hidden; }   /* home has its own, larger search */
  .hb-results { display: flex; flex-direction: column; gap: 6px; max-width: 1120px; }
  /* HBR2: the results as a page — the hits beside their chapters and "Didn't find it?" */
  .hb-res-grid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; align-items: start; }
  .hb-res-side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 0; }
  .hb-res-side:empty { display: none; }
  .hb-res-card { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-card); display: flex; flex-direction: column; gap: 4px; }
  .hb-res-card .hb-quiet { margin: 0 0 6px; font-size: .82rem; }
  .hb-res-card .kb-btn { align-self: flex-start; }
  .hb-res-h { font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .hb-res-f { --man-c: var(--muted); display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; font: inherit; font-size: .84rem; text-align: left; border: none; border-radius: 8px; background: none; color: var(--ink); cursor: pointer; }
  .hb-res-f:hover { background: var(--paper-2); }
  .hb-res-f[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }
  .hb-res-dot { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--man-c); }
  .hb-res-l { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .hb-res-n { flex: none; font-size: .76rem; color: var(--muted); }
  .hb-res-ask { margin-top: 4px; }
  .hb-results-list > .hb-res-ask { max-width: 420px; }
  .hb-results-h { font-size: 1.15rem; margin: 0 0 4px; overflow-wrap: anywhere; }
  .hb-results-list { display: flex; flex-direction: column; gap: 6px; }
  .hb-hit { --man-c: var(--muted); position: relative; display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-card); color: var(--ink); cursor: pointer; }
  .hb-hit.hb-off { display: none; }
  .hb-hit-best { border: 2px solid color-mix(in oklab, var(--man-c) 45%, var(--line)); padding: 16px 16px 14px; }
  .hb-hit-best .hb-hit-t { font-size: 1.05rem; }
  .hb-hit-best-l { position: absolute; top: 0; right: 0; font-size: 11px; font-weight: 700; padding: 4px 10px; border-bottom-left-radius: 10px; background: var(--man-c); color: var(--paper-card); }
  .hb-hit-crumb { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 600; color: var(--man-c); }
  .hb-hit-ic { display: inline-flex; color: var(--man-c); }
  .hb-hit:hover, .hb-hit:focus-visible { background: var(--paper-2); border-color: var(--border-strong); }
  .hb-hit-jump { flex-direction: row; align-items: center; gap: 6px; border-color: var(--accent); background: var(--accent-soft); color: var(--success-deep); }
  .hb-hit-t { font-weight: 600; font-size: .92rem; overflow-wrap: anywhere; }
  .hb-hit-n { font-family: var(--mono); font-size: .78rem; font-weight: 700; color: var(--man-c); margin-right: 4px; }
  .hb-hit-h { font-size: .8rem; color: var(--info-deep); overflow-wrap: anywhere; }
  .hb-hit-s { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }

  /* People (HB2.1) */
  .hb-me-btn { background: var(--accent-soft); border-color: color-mix(in oklab, var(--accent) 30%, var(--line)); color: var(--accent-ink); }
  .hb-me-ava { font-size: 12px; font-weight: 700; display: inline-flex; }
  .hb-me-ava::after, .hb-ava::after { content: attr(data-ini); }   /* drawn, never text in a name */
  .hb-me-badge { position: absolute; top: -4px; right: -4px; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--destructive); color: var(--paper-card); font-size: .7rem; font-weight: 700; text-align: center; line-height: 18px; border: 2px solid var(--paper-card); }
  .hb-me-badge::after { content: attr(data-n); }   /* HB2.4: drawn, so the button's text stays "Profile" */
  .hb-me-badge:not([data-n]), .hb-me-badge[data-n=""] { display: none; }
  .hb-prompt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border: 1px solid var(--info); border-radius: 10px; background: var(--info-soft); }
  .hb-prompt + .hb-prompt { margin-top: 8px; }
  .hb-prompt-t { flex: 1 1 18em; min-width: 0; font-size: .88rem; color: var(--ink); overflow-wrap: anywhere; }
  .hb-prompt-go { flex: none; }
  .hb-prompt-wait { font-size: .86rem; }
  .hb-people { display: flex; flex-direction: column; gap: 22px; max-width: 900px; }
  .hb-pp:empty { display: none; }
  .hb-pp-h { font-size: 1.25rem; margin: 0 0 6px; }
  .hb-pp-h2 { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .hb-pp-h3 { font-size: .86rem; margin: 12px 0 6px; }
  .hb-pp-who { font-weight: 600; margin-bottom: 6px; overflow-wrap: anywhere; }
  .hb-pp-tag { font-size: .68rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--success-deep); }
  .hb-pp-standing { font-size: .88rem; margin: 0 0 10px; }
  .hb-st-confirmed { color: var(--success-deep); }
  .hb-st-pending { color: var(--info-deep); }
  .hb-st-declined, .hb-st-gone { color: var(--warning-deep); }
  .hb-st-none { color: var(--muted); }
  .hb-pp-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; }
  .hb-pp-l { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--muted); flex: 1 1 14em; min-width: 0; }
  .hb-pp-sel, .hb-pp-in { font: inherit; font-size: .86rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 8px; width: 100%; max-width: 100%; }
  .hb-pp-save { flex: none; }
  .hb-pp-note { font-size: .78rem; margin: 8px 0 0; }
  .hb-pp-form + .hb-pp-h2 { margin-top: 20px; }
  .hb-pp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); margin-bottom: 6px; }
  .hb-pp-row-b { display: flex; flex-direction: column; gap: 2px; flex: 1 1 16em; min-width: 0; overflow-wrap: anywhere; }
  .hb-pp-row-n { font-weight: 600; font-size: .9rem; }
  .hb-pp-row-s { font-size: .78rem; }
  .hb-pp-row-a { display: flex; flex-wrap: wrap; gap: 6px; flex: none; }
  .hb-pp-yes { border-color: var(--accent); }
  .hb-pp-danger { color: var(--danger); }

  /* Quizzes (HB3.2) */
  /* HBR2: the tools for the section in view — a white toolbar, its sign-off the primary action */
  .hb-quizbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 22px; border-bottom: 1px solid var(--line); background: var(--paper-card); box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .hb-quizbar .kb-btn { padding: 6px 11px; font-size: .8rem; border-radius: 9px; }
  .hb-quizbar .hb-so .hb-pp-yes { background: var(--accent-ink); border-color: var(--accent-ink); color: var(--paper-card); font-weight: 600; }
  .hb-qb-item { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-2); }
  .hb-qb-item .kb-btn { border-radius: 999px; }
  .hb-quizbar:empty { display: none; }
  .hb-qb-t { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; font-weight: 600; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .hb-qb-go { flex: none; }
  .hb-toc-quizzes { font: inherit; font-size: .86rem; font-weight: 600; text-align: left; padding: 7px 9px; border: none; border-radius: 7px; background: none; color: var(--ink); cursor: pointer; }
  .hb-toc-quizzes:hover { background: var(--accent-soft); color: var(--success-deep); }
  .hb-qz { display: flex; flex-direction: column; gap: 14px; max-width: 820px; }
  .hb-qz-chip { align-self: flex-start; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--paper-2); color: var(--muted); margin-top: 2px; }
  .hb-qz-chip.pass { background: var(--accent-soft); color: var(--success-deep); }
  .hb-qz-chip.lock { background: var(--warn-soft); color: var(--warning-deep); }
  .hb-qz-sec { color: var(--info-deep); }
  /* HBR3 — the quiz list as cards: a light head in the chapter's colour (decision 4), the big faint chapter number, a status pill; a score ring, the standing, one action. */
  .hb-qz-wide { max-width: 1180px; }
  .hb-qz-ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
  .hb-qz-ph .hb-pp-h { margin-bottom: 2px; }
  .hb-qc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
  .hb-qc { --man-c: var(--muted); display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--paper-card); box-shadow: var(--shadow-sm); }
  .hb-qc-top { position: relative; overflow: hidden; min-height: 104px; padding: 18px 20px 16px; border-bottom: 1px solid color-mix(in oklab, var(--man-c) 22%, var(--line));
    background: linear-gradient(140deg, color-mix(in oklab, var(--man-c) 16%, var(--paper-card)), color-mix(in oklab, var(--man-c) 5%, var(--paper-card))); }
  .hb-qc-big { position: absolute; right: 14px; bottom: -24px; font-family: var(--display); font-size: 104px; font-weight: 800; line-height: 1; letter-spacing: -.06em; color: var(--man-c); opacity: .12; pointer-events: none; }
  .hb-qc-pill { position: absolute; top: 14px; right: 14px; display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 2px 8px; border-radius: 6px; }
  .hb-qc-pill.ok { background: var(--accent-soft); color: var(--success-deep); }
  .hb-qc-pill.warn { background: var(--warn-soft); color: var(--warning-deep); }
  .hb-qc-pill.bad { background: var(--danger-soft); color: var(--danger-deep); }
  .hb-qc-k { position: relative; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: color-mix(in oklab, var(--man-c) 70%, var(--ink)); padding-right: 84px; overflow-wrap: anywhere; }
  .hb-qc-t { position: relative; margin: 6px 0 0; font-size: 1.2rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; max-width: 85%; overflow-wrap: anywhere; }
  .hb-qc-b { display: flex; flex-direction: column; gap: 14px; flex: 1; padding: 18px 20px 18px; }
  .hb-qc-s { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .hb-qc-m { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: .82rem; color: var(--muted); }
  .hb-qc-m b { color: var(--ink); font-size: .9rem; }
  .hb-qc-f { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .8rem; font-weight: 600; color: var(--muted); }
  .hb-qc-ft { flex: 1 1 8em; min-width: 0; overflow-wrap: anywhere; }
  .hb-qc-f .kb-btn { flex: none; }
  .hb-ring { --p: 0; --ring-c: var(--accent); flex: none; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(var(--ring-c) calc(var(--p) * 1%), var(--paper-3) 0); }
  .hb-ring b { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 50%; background: var(--paper-card); color: var(--ink); font-size: .95rem; font-weight: 800; line-height: 1.05; text-align: center; }
  .hb-ring.bad { --ring-c: var(--danger); }
  .hb-ring.big { width: 128px; height: 128px; }
  .hb-ring.big b { width: 104px; height: 104px; font-size: 1.9rem; letter-spacing: -.03em; }
  .hb-ring b small { display: block; font-size: .72rem; font-weight: 600; letter-spacing: 0; color: var(--muted); }
  .hb-qz-more { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 14px 0 0; font-size: 1.1rem; font-weight: 800; letter-spacing: -.01em; }
  .hb-qz-more .hb-quiet { font-size: .82rem; font-weight: 500; letter-spacing: 0; }
  .hb-qz-empty { display: flex; align-items: center; gap: 16px; padding: 20px 22px; border: 1.5px dashed var(--line-2); border-radius: 16px; color: var(--muted); font-size: .86rem; }
  .hb-qz-empty b { display: block; color: var(--ink); font-size: .95rem; }
  .hb-qz-ei { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 13px; border: 1px solid var(--line); background: var(--paper-card); }
  /* A sitting — one question per screen: the light header, the progress strip, the question card, Back / Next. */
  .hb-qz-take { margin: 0 auto; width: 100%; }
  .hb-qz-head { --man-c: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 18px; border-radius: 16px; border: 1px solid color-mix(in oklab, var(--man-c) 24%, var(--line));
    background: linear-gradient(120deg, color-mix(in oklab, var(--man-c) 14%, var(--paper-card)), color-mix(in oklab, var(--man-c) 4%, var(--paper-card)) 70%); }
  .hb-qz-hic { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: var(--man-c); background: var(--paper-card); border: 1px solid color-mix(in oklab, var(--man-c) 22%, var(--line)); }
  .hb-qz-hicon { display: inline-flex; color: var(--man-c); }
  .hb-qz-hb { flex: 1 1 12em; min-width: 0; }
  .hb-qz-ht { margin: 0; font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .hb-qz-hs { font-size: .8rem; font-weight: 600; color: var(--muted); overflow-wrap: anywhere; }
  .hb-qz-leave { flex: none; display: inline-flex; align-items: center; gap: 6px; }
  .hb-qz-strip { display: flex; gap: 6px; }
  .hb-qz-strip i { flex: 1; height: 8px; border-radius: 4px; background: var(--paper-3); }
  .hb-qz-strip i.done { background: var(--accent); }
  .hb-qz-strip i.cur { background: color-mix(in oklab, var(--accent) 35%, var(--paper-3)); box-shadow: inset 0 0 0 2px var(--accent); }
  .hb-qz-form { display: flex; flex-direction: column; gap: 14px; }
  .hb-qz-card { padding: 26px 28px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper-card); box-shadow: var(--shadow-sm); }
  .hb-qz-q { min-width: 0; }
  .hb-qz-n { font-size: .74rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--success-deep); }
  .hb-qz-qt { margin: 6px 0 16px; font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; overflow-wrap: anywhere; }
  .hb-qz-opts { display: flex; flex-direction: column; gap: 10px; }
  /* The input is the real control (keyboard, screen reader); the label is what is drawn. Visually hidden INSIDE a positioned label (g171). */
  .hb-qz-opt { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--paper-card); font-size: .95rem; font-weight: 600; cursor: pointer; overflow-wrap: anywhere; }
  .hb-qz-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
  .hb-qz-opt:hover { border-color: var(--border-strong); }
  .hb-qz-opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hb-qz-opt.on { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 7%, var(--paper-card)); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 15%, transparent); }
  .hb-qz-l { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--paper-2); color: var(--muted); font-weight: 800; }
  .hb-qz-opt.on .hb-qz-l { background: var(--accent); color: var(--paper-card); }
  .hb-qz-ot { min-width: 0; }
  .hb-qz-need { color: var(--danger); font-size: .86rem; margin: 0; }
  .hb-qz-need:empty { display: none; }
  .hb-qz-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .hb-qz-navr { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; font-size: .8rem; }
  .hb-qz-nav .kb-btn { display: inline-flex; align-items: center; gap: 6px; }
  .hb-qz-nav .kb-btn[hidden] { display: none; }
  .hb-qz-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  /* The result: a light card in the chapter's colour (decision 4), the score ring, and every answer. */
  .hb-qr-hero { --man-c: var(--accent); display: flex; flex-wrap: wrap; align-items: center; gap: 18px 28px; padding: 26px 30px; border-radius: 20px; border: 1px solid color-mix(in oklab, var(--man-c) 24%, var(--line));
    background: radial-gradient(520px 200px at 100% 0%, color-mix(in oklab, var(--man-c) 16%, transparent), transparent 70%), var(--paper-card); }
  .hb-qr-hb { flex: 1 1 16em; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .hb-qr-h { margin: 0; font-size: 1.9rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  .hb-qr-sub { margin: 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  .hb-qr-hb .hb-quiet { margin: 0; }
  .hb-qr-hb .hb-qz-actions { margin-top: 8px; }
  .hb-qr-list { list-style: none; margin: 0; padding: 4px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper-card); }
  .hb-qz-rev { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: start; gap: 4px 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .hb-qz-rev:first-child { border-top: none; }
  .hb-qr-m { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; }
  .hb-qz-rev.ok .hb-qr-m { background: var(--accent-soft); color: var(--success-deep); }
  .hb-qz-rev.miss .hb-qr-m { background: var(--danger-soft); color: var(--danger-deep); }
  .hb-qr-b { min-width: 0; }
  .hb-qr-b .hb-qz-qt { margin: 0 0 3px; font-size: .95rem; font-weight: 700; letter-spacing: 0; }
  .hb-qr-chose { font-size: .86rem; color: var(--muted); overflow-wrap: anywhere; }
  .hb-qr-chose i { color: var(--ink); }
  .hb-qz-why { margin-top: 4px; font-size: .86rem; color: var(--ink); overflow-wrap: anywhere; }
  .hb-qr-lk { font-size: .8rem; font-weight: 700; white-space: nowrap; }
  @media (max-width: 760px) {
    .hb-qz-card { padding: 18px 16px; }
    .hb-qz-qt { font-size: 1.15rem; }
    .hb-qr-hero { padding: 20px; }
    .hb-qr-h { font-size: 1.5rem; }
    .hb-qz-rev { grid-template-columns: 32px minmax(0, 1fr); }
    .hb-qr-lk { grid-column: 2; white-space: normal; }
  }

  /* Forms (HB4.1) */
  .hb-toc-forms { margin-top: 0; }
  .hb-fm .hb-fm-row .hb-pp-row-a { display: flex; flex-wrap: wrap; gap: 6px; }
  .hb-fm-row .hb-pp-row-n { display: inline-flex; align-items: center; gap: 6px; }
  .hb-fm-sum { font-size: .86rem; color: var(--ink); overflow-wrap: anywhere; }
  .hb-fv { width: min(860px, calc(100vw - 32px)); max-width: none; }
  .hb-fv .modal-title { display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
  .hb-fv-body { max-height: calc(100vh - 200px); overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 4px 2px; background: var(--paper-2); border-radius: 8px; min-height: 120px; }
  .hb-fv-page { display: block; max-width: 100%; height: auto; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .18); }
  .hb-fv .modal-footer { flex-wrap: wrap; }
  .hb-fv-msg { flex: 1 1 220px; min-width: 0; font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
  .hb-fv-msg:empty { display: none; }

  /* Training (HB3.3) */
  .hb-tr { display: flex; flex-direction: column; gap: 22px; max-width: 860px; }
  .hb-tr-plan { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); margin-bottom: 10px; }
  .hb-tr-plan.overdue { border-color: var(--warn); }
  .hb-tr-ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .hb-tr-bar { height: 6px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
  .hb-tr-bar > span { display: block; height: 100%; background: var(--accent); }
  .hb-tr-count { font-size: .78rem; }
  .hb-tr-items { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .hb-tr-it { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 4px; border-top: 1px solid var(--line); }
  .hb-tr-it:first-child { border-top: none; }
  .hb-tr-it.done .hb-tr-it-t { color: var(--muted); }
  .hb-tr-ic { flex: none; display: inline-flex; color: var(--muted); }
  .hb-tr-it.done .hb-tr-ic { color: var(--success-deep); }
  .hb-tr-it-t { flex: 1 1 14em; min-width: 0; font-size: .88rem; overflow-wrap: anywhere; }
  .hb-tr-act { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: none; }
  .hb-tr-mark.on { border-color: var(--accent); color: var(--success-deep); }
  .hb-tr-arch .hb-pp-row-n { color: var(--muted); }

  /* Display settings and read aloud (HB2.3). Text size scales the rem-sized
     reader (the root font size); spacing, contrast, font and motion are each one
     attribute on <html>, set before first paint by index.html's head. */
  :root[data-hb-size="1"] { font-size: 112.5%; }
  :root[data-hb-size="2"] { font-size: 125%; }
  :root[data-hb-size="3"] { font-size: 150%; }
  :root[data-hb-spacing="1"] .kb-article { line-height: 1.95; }
  :root[data-hb-spacing="1"] .kb-article p, :root[data-hb-spacing="1"] .kb-article li { margin-bottom: .75em; }
  :root[data-hb-spacing="2"] .kb-article { line-height: 2.2; letter-spacing: .02em; word-spacing: .08em; }
  :root[data-hb-spacing="2"] .kb-article p, :root[data-hb-spacing="2"] .kb-article li { margin-bottom: 1em; }
  :root[data-hb-font="easy"] { --ui: 'Atkinson Hyperlegible', system-ui, sans-serif; --display: 'Atkinson Hyperlegible', system-ui, sans-serif; }
  :root[data-hb-font="easy"] body { letter-spacing: .01em; font-feature-settings: normal; }
  :root[data-hb-contrast="high"]:not([data-mode="dark"]) { --paper: #ffffff; --paper-2: #ffffff; --paper-3: #f2f2f2; --paper-card: #ffffff;
    --ink: #000000; --muted: #1f1f1f; --muted-2: #2b2b2b; --line: #4d4d4d; --line-2: #262626; }
  :root[data-hb-contrast="high"][data-mode="dark"] { --paper: #000000; --paper-2: #000000; --paper-3: #141414; --paper-card: #000000;
    --ink: #ffffff; --muted: #e6e6e6; --muted-2: #d9d9d9; --line: #b3b3b3; --line-2: #e0e0e0; }
  :root[data-hb-contrast="high"] .kb-article a { text-decoration: underline; }
  :root[data-hb-motion="reduce"] *, :root[data-hb-motion="reduce"] *::before, :root[data-hb-motion="reduce"] *::after {
    animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  .hb-disp { width: min(480px, calc(100vw - 32px)); }
  .hb-disp-f { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .hb-disp-f legend { padding: 0; margin-bottom: 4px; font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .hb-disp-seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .hb-disp-opt { position: relative; cursor: pointer; }
  .hb-disp-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .hb-disp-opt span { display: inline-block; padding: 6px 12px; border: 1px solid var(--line-2); border-radius: 999px; font-size: .84rem; color: var(--ink); background: var(--paper); }
  .hb-disp-opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--success-deep); font-weight: 600; }
  .hb-disp-opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hb-disp-check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: .9rem; }
  .hb-disp-check input { flex: none; margin-top: 3px; }
  .hb-disp-check > span { display: flex; flex-direction: column; gap: 1px; }
  .hb-disp-check .hb-quiet { font-size: .78rem; }
  .hb-disp-note { margin: 0; font-size: .78rem; }
  .hb-ra { display: inline-flex; gap: 6px; }
  .hb-ra-btn.on { border-color: var(--accent); color: var(--success-deep); }
  .hb-ra-on { background: var(--warn-soft); box-shadow: 0 0 0 3px var(--warn-soft); border-radius: 3px; }

  /* Bookmarks and notes (HB2.2) */
  .kb-bm.on { color: var(--warning-deep); }
  .kb-man-bar .kb-bm.on { background: var(--warn-soft); }
  .hb-note-btn { font-size: .8rem; }
  .hb-note-btn.on { border-color: var(--accent); color: var(--success-deep); }
  .hb-note-for { margin: 0; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .hb-note-text { min-height: 9em; resize: vertical; }
  .hb-note-warn { display: flex; align-items: flex-start; gap: 6px; margin: 0; font-size: .8rem; color: var(--warning-deep); }
  .hb-note-warn svg { flex: none; margin-top: 2px; }
  .hb-sv section { display: flex; flex-direction: column; gap: 8px; }
  .hb-sv-list { margin: 0; }
  .hb-sv-row .hb-tr-it-t { display: flex; flex-direction: column; gap: 2px; }
  .hb-sv-snip { font-size: .8rem; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }
  .hb-sv-sync { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; cursor: pointer; }
  .hb-sv-syncnote { margin: 0; font-size: .8rem; }

  /* Sign-off + team progress (HB3.4) */
  .hb-so { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
  .hb-so-t { display: inline-flex; align-items: center; gap: 5px; font-size: .84rem; min-width: 0; overflow-wrap: anywhere; }
  .hb-so-t.ok { color: var(--success-deep); }
  .hb-so-t.warn { color: var(--warning-deep); font-weight: 600; }
  .hb-so-undo { font-size: .78rem; }
  .hb-tr-tablewrap { margin-bottom: 8px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  .hb-tr-table { border-collapse: collapse; width: 100%; font-size: .84rem; }
  .hb-tr-table th, .hb-tr-table td { padding: 7px 10px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
  .hb-tr-table thead th { border-top: none; font-size: .74rem; font-weight: 700; color: var(--muted); background: var(--paper-2); }
  .hb-tr-table tbody th { font-weight: 600; min-width: 15em; }
  .hb-tr-table td { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hb-tr-table td:first-of-type { white-space: normal; min-width: 9em; }
  .hb-tr-table tr.late td:nth-of-type(3) { color: var(--warning-deep); font-weight: 700; }
  .hb-tr-sub { font-weight: 400; font-size: .76rem; overflow-wrap: anywhere; }
  .hb-tr-det { margin-top: 4px; font-weight: 400; }
  .hb-tr-det summary { cursor: pointer; font-size: .78rem; color: var(--info-deep); }
  .hb-tr-det ul { margin: 4px 0 0; padding-left: 18px; font-size: .8rem; }
  .hb-tr-rem { margin: 6px 0 0; font-size: .8rem; }
  .hb-tr-hint { display: none; margin: 0 0 4px; font-size: .78rem; }
  @media (max-width: 760px) { .hb-tr-hint { display: block; } }
  .modal.hb-ed { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
  .hb-ed-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 8px; }
  .hb-ed-narrow { flex: none; max-width: 12em; }
  .hb-ed-help { font-size: .8rem; margin: 0; }
  .hb-ed-q { margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .hb-ed-q .hb-pp-l[hidden] { display: none; }   /* g73: the hidden attribute loses to .hb-pp-l's display */
  /* .hb-pp-l grows along a ROW in the people form; in these COLUMNS that basis would be height. */
  .hb-ed-body .hb-pp-l { flex: none; }
  .hb-ed-qrow .hb-pp-sel { width: auto; flex: 1 1 12em; min-width: 0; }
  .hb-ed-qrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
  .hb-ed-text, .hb-ed-optbox, .hb-ed-why { resize: vertical; font-family: inherit; }
  .hb-ed-msg { color: var(--danger); font-size: .86rem; margin: 0; }
  .hb-ed-msg:empty { display: none; }
  .hb-ed-items { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; }
  .hb-ed-item { font-size: .88rem; }
  .hb-ed-item > span { overflow-wrap: anywhere; margin-right: 6px; }
  .hb-ed-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .hb-ed-add .hb-pp-sel { width: auto; flex: 1 1 12em; min-width: 0; }
  .hb-ed-checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .hb-ed-chk { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; overflow-wrap: anywhere; }

  /* Contents — Team Tools' rail (.sb-link / .sb-section-label, restated) */
  .hb-toc { display: flex; flex-direction: column; gap: 2px; }
  .hb-nav { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 12px; font: inherit; font-size: 13.5px; font-weight: 500; text-align: left; border: none; border-radius: var(--radius); background: none; color: var(--muted); cursor: pointer; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
  .hb-nav svg { flex: none; }
  .hb-nav:hover { background: var(--paper-2); color: var(--ink); }
  .hb-nav.on { background: var(--accent-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
  .hb-nav.on svg { color: var(--accent-ink); }
  .hb-nav-l { flex: 1; min-width: 0; }
  .hb-nav-n { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent); }
  .hb-nav-n:empty { display: none; }
  .hb-side-h { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 16px 12px 6px; }
  .hb-ch { margin-top: 1px; }
  .hb-ch-t { display: flex; align-items: center; gap: 8px; width: 100%; font: inherit; font-size: 13px; font-weight: 500; text-align: left; padding: 7px 10px 7px 6px; border: none; border-radius: var(--radius); background: none; color: var(--ink); cursor: pointer; }
  .hb-ch-t:hover { background: var(--paper-2); }
  .hb-ch-t .hb-ch-n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb-ch-t .hb-caret { flex: none; display: inline-flex; color: var(--muted); transition: transform var(--t) var(--ease); }
  .hb-ch.open .hb-caret { transform: rotate(90deg); }
  .hb-ch-ic { flex: none; display: inline-flex; color: var(--man-c); }
  .hb-ch-p { flex: none; display: inline-flex; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .hb-ch-p:empty { display: none; }
  .hb-ch-list { display: none; flex-direction: column; gap: 1px; margin: 2px 0 6px 18px; padding-left: 8px; border-left: 2px solid var(--line); }
  .hb-ch.open .hb-ch-list { display: flex; }
  .hb-it { display: flex; align-items: baseline; gap: 7px; width: 100%; font: inherit; font-size: 12.5px; text-align: left; padding: 5px 8px; border: none; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  .hb-it:hover { background: var(--paper-2); color: var(--ink); }
  .hb-it.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .hb-it-n { flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--muted); min-width: 3.2em; }
  .hb-it-t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .hb-new { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--info); align-self: center; }

  /* Home (HBR1) — hero C beside the shelf; light cards on the page's paper */
  .hb-home { display: flex; flex-direction: column; gap: 18px; max-width: 1180px; width: 100%; }
  .hb-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 34px; padding: 28px 30px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper-card); box-shadow: var(--shadow-sm); }
  .hb-hero-l { min-width: 0; }
