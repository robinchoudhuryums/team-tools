  if (e.target && e.target.closest && e.target.closest('#kb-drawer')) return;
  // 22post B-2b: the floating Scratchpad (.cn-float-panel) is NON-modal too —
  // it exists to be typed in while a note (or the composer) is open.
  if (e.target && e.target.closest && e.target.closest('.cn-float-panel')) return;
  // F(cycle-8): hover-opened day popovers (.overlay.open.hover-mode — the
  // Time/PTO calendar) are NOT modal: the rep merely rested the pointer on a
  // cell, and trapping focus yanked Tab / month-nav clicks into the popover's
  // Close button while an invisible backdrop sat under them. Exempt them (the
  // KB-drawer pattern); a CLICK-pinned popover drops hover-mode and traps
  // normally.
  var opens = Array.prototype.filter.call(
    document.querySelectorAll('.overlay.open'),
    function (o) { return !o.classList.contains('hover-mode'); });
  if (!opens.length) return;
  var open = opens[opens.length - 1];
  // SH-03 (cycle 23): the container is whatever the overlay holds, not only a
  // `.modal` / `.cn-compose-modal` — the keyboard-shortcuts dialog is a
  // `.cn-shortcuts-modal`, so the trap returned early and Tab walked out of it
  // into the page behind. The named containers still win (a `.modal` nested
  // under a wrapper), and the overlay's own first child is the fallback.
  var modal = open.querySelector('.modal') || open.querySelector('.cn-compose-modal') ||
    open.querySelector('.cn-shortcuts-modal') || open.firstElementChild;
  if (!modal) return;
  if (modal.contains(e.target)) return;
  var focusable = modal.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])');
  if (focusable.length > 0) focusable[0].focus();
}

/** M19 — every card at once, from the Appendix C page (the cards are its
 *  sections). The print rules already cope with several subjects. */
function kbPrintAllCards_() {
  var els = [].filter.call(document.querySelectorAll('.kb-man-sec'), function (el) { return kbIsManualCard_(el.getAttribute('data-kb-id')); });
  kbPrintEls_(els, true);
}

/** Print ONLY this section (or card) through the app's one @media print block:
 *  the section is marked `.print-one` and the root `data-print-one`, and the
 *  print rules hide everything that neither holds it nor sits inside it. The
 *  marks come off after the dialog (afterprint, with a timer behind it for a
 *  browser whose print() returns before the dialog closes). Since M8 the
 *  reader bar's Print names the section in view by id. */
function kbPrintSectionById_(id) {
  var sec = id ? document.getElementById('kb-man-sec-' + id) : null;
  // M14: a chapter's card is printed from its masthead, where it is not a section
  if (!sec && kbIsManualCard_(id)) sec = document.querySelector('.kb-man-card[data-kb-man-card="' + id + '"]');
  if (!sec) return;
  kbPrintEls_([sec], kbIsManualCard_(id));
}

/** The marks for one or several subjects. M19: a card adds `data-print-card`
 *  to the root, which the print block lays out as a card (a coloured band,
 *  two columns, the diagram on the reverse, one card a sheet). */
function kbPrintEls_(els, card) {
  if (!els || !els.length) return;
  kbXrefHide_(true);
  document.querySelectorAll('.print-one').forEach(function (el) { el.classList.remove('print-one'); });
  els.forEach(function (el) { el.classList.add('print-one'); });
  var root = document.documentElement;
  root.setAttribute('data-print-one', '');
  if (card) root.setAttribute('data-print-card', '');
  var done = false;
  var clear = function () {
    if (done) return; done = true;
    els.forEach(function (el) { el.classList.remove('print-one'); });
    root.removeAttribute('data-print-one');
    root.removeAttribute('data-print-card');
    window.removeEventListener('afterprint', clear);
  };
  window.addEventListener('afterprint', clear);
  try { window.print(); } catch (e) { clear(); return; }
  setTimeout(clear, 1500);
}
</script>
