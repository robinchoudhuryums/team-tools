<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; }
      .form-group { margin-bottom: 15px; }
      label { display: block; margin-bottom: 5px; font-weight: bold; }
      select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
      .buttons { position: absolute; bottom: 0; right: 0; padding: 15px; }
      button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
      #submit-btn { background-color: #4285F4; color: white; }
      #cancel-btn { background-color: #eee; }
    </style>
  </head>
  <body>
    <div style="padding: 15px;">
      <div class="form-group">
        <label for="reason-select">Reason for Close:</label>
        <select id="reason-select">
          <option>No longer needs</option>
          <option>Obtained elsewhere</option>
          <option>Changing supplier</option>
          <option>Patient deceased</option>
        </select>
      </div>
      <div class="form-group">
        <label for="dept-select">Department to Email:</label>
        <select id="dept-select">
          <option>Sales</option>
          <option>Eligibility MM&R</option>
          <option>Manual Mobility</option>
          <option>Resupply</option>
          <option>Power</option>
          <option>Field Ops</option>
          <option>Service</option>
          <option>Billing</option>
          <option>CSR</option>
          <option>Spanish</option>
        </select>
      </div>
    </div>

    <div class="buttons">
      <button id="cancel-btn" onclick="google.script.host.close()">Cancel</button>
      <button id="submit-btn" onclick="submitForm()">Generate Preview</button>
    </div>

<script>
  // 
  const callDataFromServer = <?!= JSON.stringify(callData) ?>;

  function submitForm() {
    var submitButton = document.getElementById('submit-btn');
    submitButton.innerHTML = 'Generating...';
    submitButton.disabled = true;

    // 1. Get the user's selections
    var userSelections = {
      reason: document.getElementById('reason-select').value,
      department: document.getElementById('dept-select').value
    };

    // 2. Combine selections and original data into ONE object
    const formData = {
        selections: userSelections,
        callData: callDataFromServer
    };
    
    // 3. Send the single formData object to the server
    google.script.run
      .withSuccessHandler(google.script.host.close)
      .withFailureHandler(err => alert('Error: ' + err.message))
      .callProcessAndGeneratePreview(formData);
  }
</script>
  </body>
</html>
