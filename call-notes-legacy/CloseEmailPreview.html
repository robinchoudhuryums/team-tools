<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 0; }
      .container { padding: 20px; }
      .email-header { font-size: 12px; color: #555; margin-bottom: 10px; }
      .email-header span { font-weight: bold; color: #222; }
      .email-body { border: 1px solid #ccc; border-radius: 4px; height: 250px; overflow-y: auto; padding: 10px; }
      .buttons { position: absolute; bottom: 0; right: 0; padding: 20px; }
      button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
      #send-btn { background-color: #4285F4; color: white; }
      #cancel-btn { background-color: #eee; }
    </style>
  </head>
  <body>
    <div class="container">
      <? if (emailArgs.attachmentName) { ?>
  <div class="email-header">
    <span>Attachment:</span> <?= emailArgs.attachmentName ?>
  </div>
<? } ?>

<? if (emailArgs.fileData && emailArgs.fileData.fileName) { ?>
  <div class="email-header">
    <span>Attachment:</span> <?= emailArgs.fileData.fileName ?>
  </div>
<? } ?>
      <div class="email-header">
        <span>To:</span> <?= emailArgs.recipient ?><br>
        <span>Cc:</span> <?= emailArgs.ccRecipient ?><br>
        <span>Subject:</span> <?= emailArgs.subject ?>
      </div>
      <div class="email-body">
        <?!= emailArgs.htmlBody ?>
      </div>
    </div>
    <div class="buttons">
      <button id="cancel-btn" onclick="google.script.host.close()">Cancel</button>
      <button id="send-btn" onclick="sendAndClose()">Send</button>
    </div>
    
<script>
  // This object will hold the email data passed from the server
  var emailData = <?!= JSON.stringify(emailArgs) ?>;

  function sendAndClose() {
    var sendButton = document.getElementById('send-btn');
    sendButton.innerHTML = 'Sending...';
    sendButton.disabled = true;
    
    // Call the server-side sendEmail function
google.script.run
  .withSuccessHandler(function() {
    google.script.run.showSuccessToast();
    google.script.host.close();
  })
  .withFailureHandler(function(err) {
    alert('Error sending email: ' + err.message);
    google.script.host.close();
  })
  .callSendCloseOrderEmail(emailData);
  }
</script>
  </body>
</html>
