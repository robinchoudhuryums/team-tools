<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
      .container { 
        padding: 20px; 
        box-sizing: border-box; 
        height: calc(100vh - 80px); /* leave space for buttons */
        display: flex; 
        flex-direction: column; 
      }
      .email-header { font-size: 12px; color: #555; margin-bottom: 10px; flex-shrink: 0; }
      .email-header strong { font-weight: bold; color: #222; }
      .email-body-frame { 
        border: 1px solid #ccc; 
        flex-grow: 1; 
        width: 100%; 
        background-color: #fff; 
      }
      .buttons { 
        padding: 15px 20px; 
        width: 100%; 
        box-sizing: border-box; 
        border-top: 1px solid #ddd; 
        background: #f5f5f5;
        text-align: right;
      }
      button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
      #send-btn { background-color: #4285F4; color: white; margin-left: 8px;}
      #cancel-btn { background-color: #eee; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="email-header">
        <div><strong>To:</strong> <span id="recipient"></span></div>
        <div><strong>Cc:</strong> <span id="ccRecipient"></span></div>
        <div><strong>Subject:</strong> <span id="subject"></span></div>
        <div><strong>Attachment:</strong> <span id="attachment"></span></div>
      </div>
      <iframe id="preview-frame" class="email-body-frame"></iframe>
    </div>

    <div class="buttons">
      <button id="cancel-btn" onclick="google.script.host.close()">Cancel</button>
      <button id="send-btn" onclick="sendAndClose()">Send</button>
    </div>
    
    <script>
      // Get the data object from the server
      const emailData = <?!= JSON.stringify(emailArgs) ?>;

      window.onload = function() {
        document.getElementById('recipient').textContent = emailData.recipient;
        document.getElementById('ccRecipient').textContent = emailData.ccRecipient;
        document.getElementById('subject').textContent = emailData.subject;
        document.getElementById('attachment').textContent = emailData.fileData ? emailData.fileData.fileName : 'None';

        document.getElementById('preview-frame').srcdoc = emailData.htmlBody;
      };

      function sendAndClose() {
        const sendButton = document.getElementById('send-btn');
        sendButton.textContent = 'Sending...';
        sendButton.disabled = true;

        google.script.run
          .withSuccessHandler(() => google.script.host.close())
          .withFailureHandler(err => {
            alert('Error sending email: ' + err.message);
            google.script.host.close();
          })
         .sendEmailFromPreviewWrapper(emailData);
      }
    </script>
  </body>
</html>
