<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-color: #4285F4;
        --primary-hover: #3367D6;
        --grey-background: #f8f9fa;
        --container-background: #ffffff;
        --border-color: #dee2e6;
        --shadow: 0 4px 12px rgba(0,0,0,0.1);
      }
      html { box-sizing: border-box; }
      *, *:before, *:after { box-sizing: inherit; }
      body { 
        font-family: 'Roboto', Arial, sans-serif; 
        margin: 0; 
        background-color: var(--grey-background);
      }
      .form-wrapper {
        background-color: var(--container-background);
        margin: 20px;
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
        height: calc(100vh - 40px);
        display: flex;
        flex-direction: column;
      }
      .header { 
        padding: 16px 24px; 
        font-size: 1.2em; 
        font-weight: 500; 
        color: white; 
        background: linear-gradient(to right, #4A6D9E, #223b5d);
        flex-shrink: 0;
      }
      .container { padding: 24px; overflow-y: auto; flex-grow: 1; }
      .form-group { margin-bottom: 20px; }
      label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9em; color: #333; }
      select, input[type="email"] { 
        width: 100%; 
        padding: 12px; 
        border-radius: 6px; 
        border: 1px solid var(--border-color); 
        transition: all 0.2s ease-in-out;
      }
      select:focus, input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px #d2e3fc;
      }
      .buttons { 
        padding: 16px 24px;
        background-color: var(--grey-background);
        text-align: right;
        border-top: 1px solid var(--border-color);
        flex-shrink: 0;
      }
      button { 
        padding: 10px 20px; 
        border: none; 
        border-radius: 6px; 
        cursor: pointer; 
        font-weight: bold;
        transition: all 0.2s ease;
        /* Add flex properties to align spinner and text */
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .btn-primary { background-color: var(--primary-color); color: white; margin-left: 10px; }
      .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
      .btn-secondary { background-color: #e9ecef; color: #333; }
      .btn-secondary:hover { background-color: #d8dde1; }
      
      /* --- 1. CSS for the loader --- */
      .loader {
        width: 16px;
        height: 16px;
        border: 2px solid #FFF;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: none; /* Hidden by default */
        animation: rotation 1s linear infinite;
        margin-left: 8px;
      }
      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

    </style>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="header">Email Details</div>
      <div class="container">
        <div class="form-group">
          <label for="type">Recipient Type</label>
          <select id="type">
            <option>Patient</option>
            <option>MDO/Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="reason">Reason for Email</label>
          <select id="reason">
            <option>Documentation Request</option>
            <option>Confirmation Ticket</option>
            <option>Order Information</option>
          </select>
        </div>
        <div class="form-group">
          <label for="recipient">Recipient Email</label>
          <input type="email" id="recipient" placeholder="Enter recipient's email address...">
        </div>
      </div>
      <div class="buttons">
        <button class="btn-secondary" onclick="google.script.host.close()">Cancel</button>
        <button class="btn-primary" id="next-btn" onclick="submitForm()">
          <span class="btn-text">Next</span>
          <span class="loader"></span>
        </button>
      </div>
    </div>

    <script>
      const callDataFromServer = <?!= JSON.stringify(callData) ?>;

function submitForm() {
  const selections = {
    type: document.getElementById('type').value,
    reason: document.getElementById('reason').value,
    recipient: document.getElementById('recipient').value
  };

  if (!selections.recipient || !selections.recipient.includes('@')) {
    alert('Please enter a valid recipient email address.');
    return;
  }

  // Store selections globally so FileUploadForm.html can access it
  window._formData = { selections: selections };

google.script.run
  .withSuccessHandler(function(newHtml) {
    document.open();
    document.write(newHtml);
    document.close();
  })
  .withFailureHandler(function(err) {
    alert("Error: " + err.message);
  })
  .processDocFormAndShowUploadWrapper({ selections: selections });

}


      function showLoader() {
        document.querySelectorAll('button').forEach(btn => btn.disabled = true);
        const nextButton = document.getElementById('next-btn');
        const textSpan = nextButton.querySelector('.btn-text');
        const loaderSpan = nextButton.querySelector('.loader');
        
        textSpan.textContent = 'Processing...';
        loaderSpan.style.display = 'inline-block';
      }
    </script>
  </body>
</html>
